<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数据库筑基课 · 概览演说｜把黑盒拆成一条因果链</title>
<!-- 单文件交付：所有原理图均为现场绘制的内联 SVG，无外部图片、字体、脚本依赖。 -->
<!-- 设计母题：地层 / 剖面。内容按「困境→为什么→基是什么→六个矛盾→逐层放大→闭环→好处」推演，不按原系列标题排列。 -->
<style>
:root{
  --bg:#F7F6F2; --ink:#1B2B33; --ink2:#46585F; --muted:#89938F; --line:#D9D5CB;
  --primary:#245A6B; --prim-l:#E5EFF0; --accent:#BE653B; --acc-l:#F7E9DE;
  --green:#2F7A66; --green-l:#E4F0EA; --gold:#AE8A3E;
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#E9E7E1}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
#viewport{position:absolute;inset:0 0 58px 0;overflow:hidden}
#stage{position:absolute;width:1600px;height:900px;background:var(--bg);
  transform-origin:top left;box-shadow:0 18px 60px rgba(27,43,51,.13)}
.slide{position:absolute;inset:0;display:none}
.slide.on{display:block;animation:fadein .42s cubic-bezier(.2,.7,.2,1)}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{position:absolute;left:64px;top:44px;font-size:13px;letter-spacing:3.4px;
  color:var(--primary);font-weight:600}
.eyebrow .num{font-family:var(--mono);letter-spacing:1px;color:var(--accent);margin-right:14px}
h1.title{position:absolute;left:64px;top:70px;margin:0;font-family:var(--serif);
  font-size:44px;line-height:1.25;font-weight:700;letter-spacing:1.2px;color:var(--ink)}
.lede{position:absolute;left:64px;top:139px;width:1440px;font-size:19px;color:var(--ink2);
  line-height:1.5;letter-spacing:.3px}
.rule{position:absolute;left:64px;top:181px;width:1472px;height:1px;background:var(--line)}
.figwrap{position:absolute;left:100px;top:198px;width:1400px;height:430px}
svg.figure{display:block;overflow:visible}
svg.figure text{font-family:var(--sans)}
svg.figure text.serif{font-family:var(--serif)}
svg.figure text.mono{font-family:var(--mono)}
.caption{position:absolute;left:100px;top:638px;width:1400px;font-size:13px;
  color:var(--muted);letter-spacing:.4px}
.bridge{position:absolute;left:64px;top:706px;width:1472px;font-size:20px;
  color:var(--accent);line-height:1.55;letter-spacing:.4px;padding-left:18px;
  border-left:3px solid var(--accent);font-family:var(--serif)}
.bridge .bk{font-family:var(--sans);font-size:13px;color:var(--muted);
  letter-spacing:2px;display:block;margin-bottom:2px}
.footer{position:absolute;left:64px;top:846px;width:1472px;height:1px;background:var(--line)}
.footer .fl{position:absolute;left:0;top:14px;font-size:12.5px;color:var(--muted);letter-spacing:2px}
.footer .fr{position:absolute;right:0;top:12px;font-family:var(--mono);font-size:14px;color:var(--ink2)}
.footer .fbar{position:absolute;left:0;right:0;top:-1px;height:2px;background:transparent}
.footer .fbar i{display:block;height:2px;background:var(--primary);width:0;transition:width .4s ease}

/* 动画页控件：位于图下方独立条带，绝不覆盖图 */
.ctrls{position:absolute;left:100px;top:638px;width:1400px;height:46px;display:flex;
  align-items:center;gap:12px}
.ctrls label{font-size:13.5px;color:var(--ink2);white-space:nowrap}
.ctrls select,.ctrls input[type=range]{font-family:var(--sans);font-size:13.5px;color:var(--ink);
  background:#fff;border:1px solid var(--line);border-radius:4px;padding:5px 8px;outline:none}
.ctrls input[type=range]{width:210px;padding:0;accent-color:var(--primary);border:none;background:transparent}
.ctrls .btn{min-height:30px;padding:5px 14px;border:1px solid var(--primary);border-radius:4px;
  background:#fff;color:var(--primary);font-size:13.5px;cursor:pointer;font-family:var(--sans)}
.ctrls .btn.play{background:var(--primary);color:#fff}
.ctrls .btn:hover{filter:brightness(.94)}
.ctrls .out{font-size:13.5px;color:var(--ink2);margin-left:auto;min-width:0;flex:1;
  max-width:560px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrls .out b{color:var(--accent);font-weight:600}

/* 底部外壳（不参与画面缩放） */
.chrome{position:fixed;left:0;right:0;bottom:0;height:58px;background:#FCFBF8;
  border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;
  padding:0 18px;z-index:40;font-size:13px;color:var(--ink2)}
.chrome .sep{width:1px;height:22px;background:var(--line);margin:0 6px}
.chrome button{font-family:var(--sans);font-size:13px;color:var(--ink2);background:transparent;
  border:1px solid transparent;border-radius:5px;padding:7px 11px;cursor:pointer;white-space:nowrap}
.chrome button:hover{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome button.act{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome button.k{font-family:var(--mono);font-size:12px;color:var(--muted)}
.chrome .pg{font-family:var(--mono);font-size:14px;color:var(--ink);min-width:76px;text-align:center}
.chrome .track{flex:1;height:3px;background:var(--line);border-radius:3px;margin:0 12px;position:relative}
.chrome .track i{position:absolute;left:0;top:0;height:3px;background:var(--primary);border-radius:3px;transition:width .35s}
.chrome .hint{font-size:12px;color:var(--muted);white-space:nowrap}
body.immersive #viewport{inset:0}
body.immersive .chrome{display:none}

/* 模态：默认关闭，画面零遮挡 */
.veil{position:fixed;inset:0;background:rgba(27,43,51,.44);z-index:60;display:none;
  align-items:center;justify-content:center;backdrop-filter:blur(3px)}
.veil.on{display:flex}
.panel{width:min(1040px,92vw);max-height:82vh;overflow:auto;background:var(--bg);
  border-radius:8px;box-shadow:0 24px 80px rgba(0,0,0,.28);padding:34px 40px 40px}
.panel h2{margin:0 0 8px;font-family:var(--serif);font-size:30px;color:var(--ink)}
.panel .psub{font-size:14px;color:var(--muted);margin-bottom:24px;letter-spacing:1px}
.panel .sec{border-top:1px solid var(--line);padding:18px 0 20px}
.panel .sec:first-of-type{border-top:none}
.panel .sec .sn{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:1px}
.panel .sec h3{margin:6px 0 10px;font-family:var(--serif);font-size:21px;color:var(--primary)}
.panel .sec p{margin:0;font-size:16px;line-height:1.95;color:var(--ink2);letter-spacing:.3px}
.panel .close{position:sticky;top:0;float:right;background:#fff;border:1px solid var(--line);
  border-radius:5px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--ink2)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.grid a{display:block;padding:14px 14px;border:1px solid var(--line);border-radius:6px;
  background:#fff;text-decoration:none;color:var(--ink);cursor:pointer;transition:.2s}
.grid a:hover{border-color:var(--primary);background:var(--prim-l);transform:translateY(-2px)}
.grid a .gn{font-family:var(--mono);font-size:12px;color:var(--accent)}
.grid a .gt{font-family:var(--serif);font-size:16px;line-height:1.4;display:block;margin-top:5px}
.keys{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 30px;font-size:15px;line-height:1.8}
.keys kbd{font-family:var(--mono);background:#fff;border:1px solid var(--line);
  border-bottom-width:2px;border-radius:4px;padding:2px 7px;color:var(--primary);margin-right:8px}
.toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);background:var(--ink);
  color:#fff;font-size:13px;padding:9px 16px;border-radius:5px;opacity:0;transition:.3s;z-index:80;pointer-events:none}
.toast.on{opacity:1}
@media print{.chrome,.veil,.toast{display:none!important}#viewport{position:static}
  #stage{position:static;transform:none!important;box-shadow:none}
  .slide{display:block!important;page-break-after:always;position:relative;height:900px}}
</style>
</head>
<body>
<div id="viewport"><div id="stage"><div id="slides"></div></div></div>
<div class="chrome">
  <button id="btnPrev">← 上一页</button>
  <button id="btnNext">下一页 →</button>
  <span class="pg">01 / 18</span>

  <button id="btnToc">目录 G</button>

  <button id="btnAll">全文讲稿 T</button>
  <button id="btnAuto">▶ 自动播放</button>
  <button id="btnFs">全屏 F</button>
  <button id="btnHelp" class="k">? 快捷键</button>
</div>
<div class="veil" id="veil"><div class="panel" id="panel"></div></div>
<div class="toast" id="toast"></div>
<script>
const D = [{"eyebrow":"开场 · 这一系列在做什么","title":"把黑盒，拆成一条因果链","lede":"两百多篇文章，看起来是两百多个互不相干的名词；其实它们只在回答一件事：数据从躺下，到被找到、被算出、被改对、被救回来，中间每一步为什么必须这样。","caption":"图 01　左边是我们平时看到的数据库；右边是把黑盒剖开后，必须能逐层讲清的七个位置。","bridge":"先别急着看这七层。我想先说一个你我都遇到过的场景，因为『为什么要筑基』比『基是什么』更值得先讲清楚。","notes":"大家好。今天不讲某个参数怎么调，也不讲某条 SQL 怎么写，我想讲的是一个更靠前的问题：这一系列文章到底在干什么。你看目录，从页面怎么摆、索引怎么建，一直写到向量检索、湖仓、分布式，两百多篇，很容易让人以为这是一套百科全书，或者一份Awesome列表。不是的。这些题目是我故意铺开的，它们其实是对同一个东西反复做切片：数据库这个黑盒。平时我们用它，只看见两端——SQL 从这头进去，结果从那头出来。中间那一段，绝大多数人是靠经验、靠搜索、靠别人给的最佳实践跨过去的。这一系列想做的事很朴素：把中间那一段拆开，一层一层讲清楚，让每一步之间都能用『因为…所以…』接起来。等你能把一条查询从磁盘上的字节，一路讲到屏幕上的结果，再反过来把一次断电，一路讲回数据怎么被救出来，这个黑盒就不黑了。今天这一场，就是这副骨架的概览。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40\" y=\"20\" width=\"380\" height=\"390\" rx=\"8\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1\" /><text x=\"230\" y=\"92\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"34.0\" fill=\"#FFFFFF\" font-weight=\"700\" >一个黑盒</text><text x=\"230\" y=\"140\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#CFE0DC\" font-weight=\"400\" >SQL 进去，结果出来</text><line x1=\"90\" y1=\"176\" x2=\"370\" y2=\"176\" stroke=\"#74A5AD\" stroke-width=\"1\"/><text x=\"230\" y=\"226\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"22.0\" fill=\"#FFFFFF\" font-weight=\"600\" >中间那一段</text><text x=\"230\" y=\"258\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"22.0\" fill=\"#FFFFFF\" font-weight=\"600\" >到底发生了什么？</text><text x=\"230\" y=\"320\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#A4C4C6\" font-weight=\"400\" >你说的清每一个字节</text><text x=\"230\" y=\"344\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#A4C4C6\" font-weight=\"400\" >为什么必须这样吗？</text><rect x=\"440\" y=\"20\" width=\"920\" height=\"46\" rx=\"4\" fill=\"#EBF1EE\" stroke=\"#EBF1EE\" stroke-width=\"1\" /><line x1=\"420\" y1=\"43\" x2=\"440\" y2=\"43\" stroke=\"#47808D\" stroke-width=\"1.6\"/><text x=\"462\" y=\"49\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"700\" >应用与场景</text><text x=\"660\" y=\"49\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >向量、搜索、时序、GIS，到底在向底座要什么</text><rect x=\"440\" y=\"74\" width=\"920\" height=\"46\" rx=\"4\" fill=\"#CFE0DC\" stroke=\"#CFE0DC\" stroke-width=\"1\" /><line x1=\"420\" y1=\"97\" x2=\"440\" y2=\"97\" stroke=\"#47808D\" stroke-width=\"1.6\"/><text x=\"462\" y=\"103\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"700\" >可编程性</text><text x=\"660\" y=\"103\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >类型、算子、访问方法：数据库能不能被改造</text><rect x=\"440\" y=\"128\" width=\"920\" height=\"46\" rx=\"4\" fill=\"#A4C4C6\" stroke=\"#A4C4C6\" stroke-width=\"1\" /><line x1=\"420\" y1=\"151\" x2=\"440\" y2=\"151\" stroke=\"#47808D\" stroke-width=\"1.6\"/><text x=\"462\" y=\"157\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"700\" >系统形态</text><text x=\"660\" y=\"157\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >复制、高可用、备份、分布式：把链拉到多机</text><rect x=\"440\" y=\"182\" width=\"920\" height=\"46\" rx=\"4\" fill=\"#74A5AD\" stroke=\"#74A5AD\" stroke-width=\"1\" /><line x1=\"420\" y1=\"205\" x2=\"440\" y2=\"205\" stroke=\"#47808D\" stroke-width=\"1.6\"/><text x=\"462\" y=\"211\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#FFFFFF\" font-weight=\"700\" >事务与恢复</text><text x=\"660\" y=\"211\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#E5EFF0\" font-weight=\"400\" >并发不打架、断电不丢数据、老了还能修</text><rect x=\"440\" y=\"236\" width=\"920\" height=\"46\" rx=\"4\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1\" /><line x1=\"420\" y1=\"259\" x2=\"440\" y2=\"259\" stroke=\"#47808D\" stroke-width=\"1.6\"/><text x=\"462\" y=\"265\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#FFFFFF\" font-weight=\"700\" >优化与执行</text><text x=\"660\" y=\"265\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#E5EFF0\" font-weight=\"400\" >一条 SQL 怎样被拆成算子、又怎样算出结果</text><rect x=\"440\" y=\"290\" width=\"920\" height=\"46\" rx=\"4\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1\" /><line x1=\"420\" y1=\"313\" x2=\"440\" y2=\"313\" stroke=\"#47808D\" stroke-width=\"1.6\"/><text x=\"462\" y=\"319\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#FFFFFF\" font-weight=\"700\" >定位结构</text><text x=\"660\" y=\"319\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#E5EFF0\" font-weight=\"400\" >怎样少读数据，就找到要找的那几行</text><rect x=\"440\" y=\"344\" width=\"920\" height=\"46\" rx=\"4\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1\" /><line x1=\"420\" y1=\"367\" x2=\"440\" y2=\"367\" stroke=\"#47808D\" stroke-width=\"1.6\"/><text x=\"462\" y=\"373\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#FFFFFF\" font-weight=\"700\" >物理存储</text><text x=\"660\" y=\"373\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#E5EFF0\" font-weight=\"400\" >页面、元组、编码、列存、湖格式</text></svg>","ctrl":null},{"eyebrow":"第一问 · 为什么非得筑基","title":"同一个问题，十个人给你十种答案","lede":"不是大家不专业，是每个人心里那张地图不一样：有人从索引想，有人从内存想，有人从执行计划想，谁也没错，但谁也说不准。","caption":"图 02　同一条慢 SQL，六种常见建议分别落在六个不同的层上；它们互相不冲突，也互相不能印证。","bridge":"这就不只是『知识没背全』了。往下看一层：我们缺的其实是一种能穿透现象的东西。","notes":"先讲个特别熟的场景。一条跑了半年的 SQL，今天突然慢了。你在群里问一句，会收到六种答案：加个索引；把共享缓冲区调大；这表该分区了；SQL 得重写；先加内存换 SSD；再不行就换引擎。你会发现一件很怪的事——这六条建议没有一条是错的，可它们彼此之间完全没法互相印证，因为它们落在六个不同的层上。一个说定位有问题，一个说缓存有问题，一个说物理布局有问题，一个说执行路径有问题，还有两个干脆绕过了分析。最后通常怎么收场？挑一条代价最小的先试，不行再试下一条。试对了，我们叫它经验；试错了，我们叫它踩坑。可你想过没有，这个过程的本质不是排查，是抽样。我们其实是在拿生产环境当骰子摇。为什么会这样？因为每个人脑子里那张数据库的地图都不一样，而且大多数人的地图上，只有几个孤零零的地名，没有路。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"360\" y=\"8\" width=\"680\" height=\"54\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.1\" /><text x=\"700.0\" y=\"41.65\" class=\"sv s\" text-anchor=\"middle\" font-size=\"19.0\" fill=\"#245A6B\" font-weight=\"600\" >一条跑了半年的 SQL，今天突然变慢了</text><line x1=\"700\" y1=\"62\" x2=\"700\" y2=\"84\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><line x1=\"250\" y1=\"84\" x2=\"1150\" y2=\"84\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><line x1=\"25\" y1=\"84\" x2=\"25\" y2=\"216\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><line x1=\"700\" y1=\"84\" x2=\"700\" y2=\"84\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><line x1=\"250\" y1=\"84\" x2=\"250\" y2=\"100\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><rect x=\"40\" y=\"100\" width=\"420\" height=\"110\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"250.0\" y=\"147.575\" class=\"sv s\" text-anchor=\"middle\" font-size=\"19.0\" fill=\"#1B2B33\" font-weight=\"600\" >加个索引吧</text><text x=\"250.0\" y=\"171.875\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#89938F\" font-weight=\"400\" >猜测落在 · 定位层</text><line x1=\"700\" y1=\"84\" x2=\"700\" y2=\"100\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><rect x=\"490\" y=\"100\" width=\"420\" height=\"110\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"700.0\" y=\"147.575\" class=\"sv s\" text-anchor=\"middle\" font-size=\"19.0\" fill=\"#1B2B33\" font-weight=\"600\" >把 shared_buffers 调大</text><text x=\"700.0\" y=\"171.875\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#89938F\" font-weight=\"400\" >猜测落在 · 缓存层</text><line x1=\"1150\" y1=\"84\" x2=\"1150\" y2=\"100\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><rect x=\"940\" y=\"100\" width=\"420\" height=\"110\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"1150.0\" y=\"147.575\" class=\"sv s\" text-anchor=\"middle\" font-size=\"19.0\" fill=\"#1B2B33\" font-weight=\"600\" >改成分区表</text><text x=\"1150.0\" y=\"171.875\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#89938F\" font-weight=\"400\" >猜测落在 · 物理层</text><line x1=\"250\" y1=\"216\" x2=\"250\" y2=\"230\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><rect x=\"40\" y=\"230\" width=\"420\" height=\"110\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"250.0\" y=\"277.575\" class=\"sv s\" text-anchor=\"middle\" font-size=\"19.0\" fill=\"#1B2B33\" font-weight=\"600\" >重写这条 SQL</text><text x=\"250.0\" y=\"301.875\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#89938F\" font-weight=\"400\" >猜测落在 · 执行层</text><line x1=\"700\" y1=\"216\" x2=\"700\" y2=\"230\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><rect x=\"490\" y=\"230\" width=\"420\" height=\"110\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"700.0\" y=\"277.575\" class=\"sv s\" text-anchor=\"middle\" font-size=\"19.0\" fill=\"#1B2B33\" font-weight=\"600\" >先加内存、换 SSD</text><text x=\"700.0\" y=\"301.875\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#89938F\" font-weight=\"400\" >猜测落在 · 硬件层</text><line x1=\"1150\" y1=\"216\" x2=\"1150\" y2=\"230\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><rect x=\"940\" y=\"230\" width=\"420\" height=\"110\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"1150.0\" y=\"277.575\" class=\"sv s\" text-anchor=\"middle\" font-size=\"19.0\" fill=\"#1B2B33\" font-weight=\"600\" >换个数据库引擎</text><text x=\"1150.0\" y=\"301.875\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#89938F\" font-weight=\"400\" >猜测落在 · 整个系统</text><line x1=\"25\" y1=\"216\" x2=\"1150\" y2=\"216\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><rect x=\"40\" y=\"362\" width=\"1320\" height=\"54\" rx=\"5\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1\" /><text x=\"60\" y=\"396\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#BE653B\" font-weight=\"600\" >六个人、六条建议，指向六个完全不同的层 —— 缺的不是努力，是一个定位坐标。</text></svg>","ctrl":null},{"eyebrow":"第一问 · 为什么非得筑基","title":"结论有保质期，原理没有","lede":"靠记结论的人，每换一个版本、每出一个新引擎就要重学一次；靠懂机制的人，只需要补上『这次它把天平往哪边挪了』。","caption":"图 03　左：解释力的三个台阶。右：名词在增长，但底层取舍恒定 —— 记结论的边际收益在递减。","bridge":"既然原理这么要紧，那就得说清楚：我们要筑的这个『基』，到底是哪一块？我不想给它一个抽象定义，我想用两条能背下来的链路来定义。","notes":"这里面有两层原因，我一层一层说。第一层，是我们平时站的台阶太低。遇到问题，我们先描述现象——慢、卡、报错；然后跳到手段——调参、加索引、改配置。这两层当然有用，但它们有个共同毛病：只能事后缓解，没法事前预测。你不知道改完为什么好，也就不知道什么时候会再坏。真正有解释力的是第三层：谁读了多少页、谁在等谁、哪一步把数据放大了。到了这一层，你甚至能在慢下来之前就预判它会慢。第二层原因更现实：这几年名词实在太多了。向量索引、新列存、湖表格式、serverless、HTAP、混合搜索，每冒出来一个，就跟着冒出来一批最佳实践。你要是靠背结论过日子，等于每年重学一遍；可你要是往下看一层就会发现，这些新东西没有发明新的物理定律，它们只是把那几组老矛盾重新摆了一次。所以结论会过期，原理不会。这就是我为什么坚持要筑基——不是为了显得懂，是为了让学习这件事能复利。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><text x=\"40\" y=\"30\" class=\"sv serif\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#245A6B\" font-weight=\"700\" >解释力的三个台阶</text><rect x=\"40\" y=\"320\" width=\"600\" height=\"78\" rx=\"5\" fill=\"#F1EFE9\" stroke=\"#F1EFE9\" stroke-width=\"1\" /><text x=\"60\" y=\"353\" class=\"sv s\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#46585F\" font-weight=\"700\" >现象层</text><text x=\"210\" y=\"354\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >慢、卡、报错、连接池打满 —— 能描述，不能定位</text><rect x=\"40\" y=\"222\" width=\"600\" height=\"78\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"60\" y=\"255\" class=\"sv s\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#245A6B\" font-weight=\"700\" >参数层</text><text x=\"210\" y=\"256\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >调参、加索引、改配置 —— 能缓解，说不出为何</text><rect x=\"40\" y=\"124\" width=\"600\" height=\"78\" rx=\"5\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1\" /><text x=\"60\" y=\"157\" class=\"sv s\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#FFFFFF\" font-weight=\"700\" >机制层</text><text x=\"210\" y=\"158\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#FFFFFF\" font-weight=\"400\" >谁读了多少页、谁在等谁 —— 能预测，也能迁移</text><line x1=\"22\" y1=\"384\" x2=\"22\" y2=\"138.4\" stroke=\"#BE653B\" stroke-width=\"2.2\"/><polygon points=\"22,132 17.6,140 26.4,140\" fill=\"#BE653B\"/><text x=\"30\" y=\"110\" class=\"sv s\" text-anchor=\"start\" font-size=\"22.0\" fill=\"#BE653B\" font-weight=\"700\" >↑</text><text x=\"40\" y=\"412\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#89938F\" font-weight=\"400\" >越往上，结论越不依赖具体版本、具体产品、具体硬件。</text><line x1=\"680\" y1=\"20\" x2=\"680\" y2=\"410\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"716\" y=\"30\" class=\"sv serif\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#245A6B\" font-weight=\"700\" >而名词，每年都在变多</text><rect x=\"716\" y=\"52\" width=\"310\" height=\"46\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"871.0\" y=\"80.25\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#46585F\" font-weight=\"600\" >HNSW · DiskANN</text><rect x=\"1046\" y=\"52\" width=\"310\" height=\"46\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"1201.0\" y=\"80.25\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#46585F\" font-weight=\"600\" >Lance · Vortex</text><rect x=\"716\" y=\"110\" width=\"310\" height=\"46\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"871.0\" y=\"138.25\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#46585F\" font-weight=\"600\" >Iceberg · Delta</text><rect x=\"1046\" y=\"110\" width=\"310\" height=\"46\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"1201.0\" y=\"138.25\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#46585F\" font-weight=\"600\" >Serverless PG</text><rect x=\"716\" y=\"168\" width=\"310\" height=\"46\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"871.0\" y=\"196.25\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#46585F\" font-weight=\"600\" >HTAP · 湖仓一体</text><rect x=\"1046\" y=\"168\" width=\"310\" height=\"46\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"1201.0\" y=\"196.25\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#46585F\" font-weight=\"600\" >混合搜索 · RAG</text><rect x=\"716\" y=\"240\" width=\"640\" height=\"96\" rx=\"5\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1\" /><text x=\"736\" y=\"272\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"600\" >每多一个新名词，就多一批『最佳实践』；</text><text x=\"736\" y=\"302\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"600\" >但底下要权衡的那几组矛盾，二十年没换过。</text><rect x=\"716\" y=\"352\" width=\"640\" height=\"58\" rx=\"5\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1\" /><text x=\"736\" y=\"388\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.5\" fill=\"#BE653B\" font-weight=\"700\" >结论有保质期，原理没有 —— 这就是必须筑基的理由。</text></svg>","ctrl":null},{"eyebrow":"第二问 · 筑的到底是什么基","title":"两条链，能不能一口气讲完","lede":"我给『地基』下一个可检验的定义：不是记住多少命令，而是能不能把一条查询和一次崩溃，各自从头推到尾，中间不断线。","caption":"图 04　上：查询链路。下：写入与恢复链路。两条链的交点，正是绝大多数『玄学问题』的发源地。","bridge":"有了这个可检验的标准，我们就能把两百多篇文章真正摆进一张图里了——不是按名字摆，是按它们各自撑住哪一段来摆。","notes":"那到底筑什么基？我不想说『夯实底层原理』这种正确但没用的话。我给一个能当场自检的定义：你能不能不看资料，把两条链从头讲到尾。第一条，一条查询的一生：SQL 进来先被解析和重写，优化器拿统计信息估代价、挑一个计划，执行器按算子一层层把数据拉出来，中间经过缓冲区和页面，最后把结果返回。第二条，一次写入和一次崩溃：事务改动先生成 WAL，WAL 按持久性要求落盘，脏页由后台和检查点慢慢刷，某一天突然断电，重启时读控制文件找到最近检查点，从那儿重放日志，把数据库恢复到一致状态。你注意，这两条链不是并列的，它们在事务与恢复那儿打了个结：查询能看见的，必须是一个提交过、而且断电后还能被救回来的版本。绝大多数被叫做玄学的问题，都卡在这个结上。所以筑基不是背命令，是把因果链接起来；只要哪一步你只会说『大概是这么配置的』，那儿就是你的地基缺口。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><text x=\"20\" y=\"34\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"700\" >链 A　一条查询的一生</text><rect x=\"20\" y=\"46\" width=\"240\" height=\"76\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stro -size=\"15.0\" fill=\"#245A6B\" font-weight=\"600\" >两条链在『事务与恢复』交汇：查询能看到的，必须是一个提交过、并且断电后还能恢复出来的版本。</text><text x=\"20\" y=\"216\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#BE653B\" font-weight=\"700\" >链 B　一次写入与一次崩溃</text><rect x=\"20\" y=\"228\" width=\"240\" height=\"76\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"140.0\" y=\"271.775\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.5\" fill=\"#1B2B33\" font-weight=\"600\" >写 WAL 记录</text><line x1=\"266\" y1=\"266\" x2=\"287.6\" y2=\"266\" stroke=\"#BE653B\" stroke-width=\"2.0\"/><polygon points=\"294,266 286,261.6 286,270.4\" fill=\"#BE653B\"/><rect x=\"300\" y=\"228\" width=\"240\" height=\"76\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"420.0\" y=\"271.775\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.5\" fill=\"#1B2B33\" font-weight=\"600\" >WAL 落盘</text><line x1=\"546\" y1=\"266\" x2=\"567.6\" y2=\"266\" stroke=\"#BE653B\" stroke-width=\"2.0\"/><polygon points=\"574,266 566,261.6 566,270.4\" fill=\"#BE653B\"/><rect x=\"580\" y=\"228\" width=\"240\" height=\"76\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"700.0\" y=\"271.775\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.5\" fill=\"#1B2B33\" font-weight=\"600\" >脏页与检查点</text><line x1=\"826\" y1=\"266\" x2=\"847.6\" y2=\"266\" stroke=\"#BE653B\" stroke-width=\"2.0\"/><polygon points=\"854,266 846,261.6 846,270.4\" fill=\"#BE653B\"/><rect x=\"860\" y=\"228\" width=\"240\" height=\"76\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"980.0\" y=\"271.775\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.5\" fill=\"#1B2B33\" font-weight=\"600\" >突然断电</text><line x1=\"1106\" y1=\"266\" x2=\"1127.6\" y2=\"266\" stroke=\"#BE653B\" stroke-width=\"2.0\"/><polygon points=\"1134,266 1126,261.6 1126,270.4\" fill=\"#BE653B\"/><rect x=\"1140\" y=\"228\" width=\"240\" height=\"76\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"1260.0\" y=\"271.775\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.5\" fill=\"#1B2B33\" font-weight=\"600\" >重放与恢复</text><rect x=\"20\" y=\"332\" width=\"1360\" height=\"84\" rx=\"5\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1\" /><text x=\"46\" y=\"370\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#FFFFFF\" font-weight=\"600\" >所谓筑基 ＝ 不查资料，也能把这两条链从头讲到尾，</text><text x=\"46\" y=\"398\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#FFFFFF\" font-weight=\"600\" >并且说清每一步为什么必须有、去掉它会坏在哪里。</text></svg>","ctrl":null},{"eyebrow":"第三问 · 这一系列为什么能筑基","title":"四根柱子，撑起所有上层建筑","lede":"如果把文章按名字分类，会得到一张永远背不完的清单；按『它撑住哪一段』分类，两百多篇只落进四个位置。","caption":"图 05　物理、定位、计算、保障 —— 四根柱子。后面六页会逐根剖开；柱上的页码就是放大顺序。","bridge":"四根柱子还是抽象骨架，得落到具体的板块上 —— 下一页给一张完整的板块地图，你就知道每一篇该放回哪一格。","notes":"现在可以回答『这一系列凭什么能筑基』了。凭的不是全，是分得对。你要是照着标题去分类，会得到一张无限长的清单，而且永远背不完——今天多了个 Vortex，明天多了个 bm25，后天又来个新索引。可你换成另一个问法：这一篇在撑住哪一段？答案立刻收敛成四个位置。最底下是物理层，数据怎么躺：页面、元组、编码，行存、列存、LSM、湖格式。它上面是定位层，怎么少读数据就找到目标：B-tree、GIN、GiST、BRIN，还有向量和全文索引。再上面是计算层，找到了怎么算：执行引擎、扫描、Join、排序、聚合，以及决定用哪条路的优化器。第四根是保障层，很多人最陌生但最要命：事务、MVCC、锁、WAL、检查点，还有用久之后的回收和冻结。这四根柱子撑起来的，才是我们平时爱聊的那些东西——读写分离、高可用、分布式、自定义类型、向量检索、时序分析。换句话说，上层建筑之所以看起来千变万化，是因为四根柱子的组合方式在变，柱子本身没变。后面六页，我就按柱子上标的顺序，一根一根剖给你看。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"60\" y=\"26\" width=\"1280\" height=\"62\" rx=\"5\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1\" /><text x=\"80\" y=\"66\" class=\"sv serif\" text-anchor=\"start\" font-size=\"21.0\" fill=\"#FFFFFF\" font-weight=\"700\" >上层建筑　系统形态　·　可编程性　·　应用实践</text><rect x=\"52\" y=\"100\" width=\"276\" height=\"14\" rx=\"3\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1\" /><rect x=\"60\" y=\"116\" width=\"260\" height=\"224\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"190\" y=\"150\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"18.0\" fill=\"#245A6B\" font-weight=\"700\" >① 物理层</text><line x1=\"84\" y1=\"164\" x2=\"296\" y2=\"164\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"190\" y=\"194\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >页面与元组</text><text x=\"190\" y=\"228\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >行存 / 列存 / LSM</text><text x=\"190\" y=\"262\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >编码与湖表格式</text><text x=\"190\" y=\"296\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#BE653B\" font-weight=\"600\" >→ 第 07 页放大</text><rect x=\"372\" y=\"100\" width=\"276\" height=\"14\" rx=\"3\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1\" /><rect x=\"380\" y=\"116\" width=\"260\" height=\"224\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"510\" y=\"150\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"18.0\" fill=\"#245A6B\" font-weight=\"700\" >② 定位层</text><line x1=\"404\" y1=\"164\" x2=\"616\" y2=\"164\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"510\" y=\"194\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >B-tree / Hash</text><text x=\"510\" y=\"228\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >GIN · GiST · BRIN</text><text x=\"510\" y=\"262\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >向量 / 全文索引</text><text x=\"510\" y=\"296\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#BE653B\" font-weight=\"600\" >→ 第 08 页放大</text><rect x=\"692\" y=\"100\" width=\"276\" height=\"14\" rx=\"3\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1\" /><rect x=\"700\" y=\"116\" width=\"260\" height=\"224\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"830\" y=\"150\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"18.0\" fill=\"#245A6B\" font-weight=\"700\" >③ 计算层</text><line x1=\"724\" y1=\"164\" x2=\"936\" y2=\"164\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"830\" y=\"194\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >执行引擎与扫描</text><text x=\"830\" y=\"228\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >Join / 排序 / 聚合</text><text x=\"830\" y=\"262\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >优化器与代价</text><text x=\"830\" y=\"296\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#BE653B\" font-weight=\"600\" >→ 第 09、10 页放大</text><rect x=\"1012\" y=\"100\" width=\"276\" height=\"14\" rx=\"3\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1\" /><rect x=\"1020\" y=\"116\" width=\"260\" height=\"224\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"1150\" y=\"150\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"18.0\" fill=\"#245A6B\" font-weight=\"700\" >④ 保障层</text><line x1=\"1044\" y1=\"164\" x2=\"1256\" y2=\"164\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1150\" y=\"194\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >事务 · MVCC · 锁</text><text x=\"1150\" y=\"228\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >WAL · 检查点</text><text x=\"1150\" y=\"262\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >回收 · freeze</text><text x=\"1150\" y=\"296\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#BE653B\" font-weight=\"600\" >→ 第 11、12 页放大</text><line x1=\"20\" y1=\"352\" x2=\"1380\" y2=\"352\" stroke=\"#2E6373\" stroke-width=\"2.2\"/><text x=\"20\" y=\"380\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >地平线：不可再拆的事实 —— 磁盘的寻道与带宽、内存的容量、CPU 的解码、网络的延迟</text><text x=\"20\" y=\"408\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#89938F\" font-weight=\"400\" >上面所有花哨的东西，都只是这四根柱子在不同负载下的重新组合。</text></svg>","ctrl":null},{"eyebrow":"第三问 · 这一系列由哪些板块组成","title":"九个板块，一张地图","lede":"把两百多篇按『它负责哪一段』归位，得到九个板块；它们不是并列章节，而是 L1 地基 → L2 引擎 → L3 上层的依赖链。","caption":"图 06　筑基课板块架构图。三行是三层，九格是九个板块；编号是依赖顺序，不是阅读顺序。","bridge":"地图有了，还能再收敛一次：这九个板块翻来覆去，其实只在处理六组矛盾。","notes":"刚才那四根柱子是骨架，可能还有点抽象，所以这一页我把它落到具体的板块上。你手里的两百多篇文章，按『它负责哪一段』归位，其实只落在九个格子里。第一行 L1 是地基：存储结构与编码，管字节怎么躺在磁盘上，行存、列存、LSM、湖表格式都在这儿；索引与检索结构，管怎么少读几页找到目标，从 B-tree 一直到向量和全文索引；事务、并发与恢复，管很多人一起写、机器突然断电之后，数据还认不认账。第二行 L2 是引擎：执行引擎与算子，把找到的数据算出来；优化器与计划，决定为什么偏偏走这条路；类型与可编程，决定这个数据库能不能被你改造。第三行 L3 是形态和实践：复制、高可用、分布式、备份与兼容；混合搜索、GIS、时序、分页这些应用实践；还有计算前置与工程保障，专门处理把成本挪到更便宜的时机这件事。请你特别注意，这三行不是九个并列章节：L2 的每一个决定都踩在 L1 的物理事实上，L3 的每一个场景又踩在 L2 的计划上。所以同一条查询会横穿三层。以后想找某一篇，先问它属于哪一格；想真正搞懂一件事，就顺着这一列往上追一层。地图是拿来定位的，不是拿来背的 —— 真正把它串起来的，是下一页那六组矛盾。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20\" y=\"20\" width=\"120\" height=\"118\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><rect x=\"20\" y=\"20\" width=\"4\" height=\"118\" rx=\"0\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1\" /><text x=\"80\" y=\"62\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" >L1 地基</text><text x=\"80\" y=\"88\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >物理事实</text><text x=\"80\" y=\"112\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.0\" fill=\"#46585F\" font-weight=\"400\" >↑ 支撑 L2 与 L3</text><rect x=\"152\" y=\"20\" width=\"400\" height=\"118\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"166\" y=\"45\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#245A6B\" font-weight=\"700\" >① 存 .55\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"600\" >f3</text><text x=\"1225\" y=\"220\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >表 = 一份指向文件的清单</text><text x=\"1225\" y=\"238\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >换清单 = 换版本，不必改旧文件</text><rect x=\"1060\" y=\"262\" width=\"330\" height=\"148\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"1076\" y=\"288\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#2F7A66\" font-weight=\"600\" >擅长：版本、时间旅行、schema 演进</text><text x=\"1076\" y=\"318\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >更新＝写新文件＋换一份清单</text><text x=\"1076\" y=\"346\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#BE653B\" font-weight=\"400\" >怕小文件过多、元数据膨胀</text><text x=\"1076\" y=\"382\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >决定：一次 IO 搬回多少有用字节</text></svg>","ctrl":null},{"eyebrow":"放大 ② · 定位层","title":"索引不是名词表，是拿结构换比较次数","lede":"把『谓词长什么样』放在左边，结构就只有一个合适答案；按名字背索引，永远记不住什么时候该用谁。","caption":"图 08　谓词 → 结构 → 省掉的代价。八行是同一条推理链，不是八类知识点。","bridge":"找到数据之后，剩下的事就是算。而『怎么算』这一层看起来最热闹——执行引擎、Join、排序、聚合、优化器——其实只围着一个变量转：中间结果有多大。","notes":"定位层最容易被学成一堆名词：B-tree、GIN、GiST、BRIN、HNSW、IVFFlat、DiskANN、BM25……背到最后只会更乱。换个问法就通了：先别问『这个索引是什么』，问『我的谓词长什么样』。等值点查，有序结构把比较次数压到对数级，Hash 只管等值；要范围、要排序，B-tree 的叶子本来就有序，BRIN 干脆用块摘要整片跳过无关页。一个字段里塞了多个值、要查包含、查全文，就用倒排，一个键对应一串行号。空间、区间、相似这类谓词，交给 GiST 这种通用搜索树框架，可分区的键用 SP-GiST。高维向量没法精确比，于是拿图导航或者聚类剪枝换掉全量距离计算，再用量化把内存降下来；这里有个特别好的例子：图索引常驻内存才快，可它跟 MVCC、跟回收机制天生别扭，删一个节点要重连邻居，所以才有人改走聚类加量化、把索引主体放磁盘上——你看，懂结构才能预判运维代价。最后是文本相关度和多条件组合，BM25 把词频、文档频率直接放进索引，WAND 让打不进 top-k 的整块候选根本不用打分；而位图扫描是把多个索引的行号位图在内存里做与或，再按页顺序批量回表。八行，一条推理链：谓词决定结构，结构决定少读多少页。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/s 算，PQ / SQ 再换内存</text><rect x=\"20\" y=\"270\" width=\"280\" height=\"40\" rx=\"5\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"160.0\" y=\"295.25\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >文本相关度 top-k</text><line x1=\"306\" y1=\"290\" x2=\"328.4\" y2=\"290\" stroke=\"#245A6B\" stroke-width=\"1.7\"/><polygon points=\"334,290 327,286.15 327,293.85\" fill=\"#245A6B\"/><rect x=\"340\" y=\"270\" width=\"450\" height=\"40\" rx=\"5\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"565.0\" y=\"295.25\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"600\" >BM25 倒排 / WAND 剪枝</text><line x1=\"796\" y1=\"290\" x2=\"818.4\" y2=\"290\" stroke=\"#245A6B\" stroke-width=\"1.7\"/><polygon points=\"824,290 817,286.15 817,293.85\" fill=\"#245A6B\"/><rect x=\"830\" y=\"270\" width=\"550\" height=\"40\" rx=\"5\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"846\" y=\"295\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >索引里存词频与文档频率，整块跳过打不进 top-k 的候选</text><rect x=\"20\" y=\"316\" width=\"280\" height=\"40\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"160.0\" y=\"341.25\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >存在性过滤</text><line x1=\"306\" y1=\"336\" x2=\"328.4\" y2=\"336\" stroke=\"#245A6B\" stroke-width=\"1.7\"/><polygon points=\"334,336 327,332.15 327,339.85\" fill=\"#245A6B\"/><rect x=\"340\" y=\"316\" width=\"450\" height=\"40\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"565.0\" y=\"341.25\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"600\" >Bloom / Roaring bitmap</text><line x1=\"796\" y1=\"336\" x2=\"818.4\" y2=\"336\" stroke=\"#245A6B\" stroke-width=\"1.7\"/><polygon points=\"824,336 817,332.15 817,339.85\" fill=\"#245A6B\"/><rect x=\"830\" y=\"316\" width=\"550\" height=\"40\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"846\" y=\"341\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >签名会有假阳性，必须回表 recheck；位图省的是 IO 不是判断</text><rect x=\"20\" y=\"362\" width=\"280\" height=\"40\" rx=\"5\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"160.0\" y=\"387.25\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >多个条件组合</text><line x1=\"306\" y1=\"382\" x2=\"328.4\" y2=\"382\" stroke=\"#245A6B\" stroke-width=\"1.7\"/><polygon points=\"334,382 327,378.15 327,385.85\" fill=\"#245A6B\"/><rect x=\"340\" y=\"362\" width=\"450\" height=\"40\" rx=\"5\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"565.0\" y=\"387.25\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"600\" >BitmapAnd / BitmapOr 扫描</text><line x1=\"796\" y1=\"382\" x2=\"818.4\" y2=\"382\" stroke=\"#245A6B\" stroke-width=\"1.7\"/><polygon points=\"824,382 817,378.15 817,385.85\" fill=\"#245A6B\"/><rect x=\"830\" y=\"362\" width=\"550\" height=\"40\" rx=\"5\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"846\" y=\"387\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >多个索引的 TID 位图在内存里合并，再按页顺序批量回表</text><text x=\"20\" y=\"424\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"600\" >索引不是名词表，是『用结构换掉比较次数』；选错结构，再强的执行器也补不回来。</text></svg>","ctrl":null},{"eyebrow":"放大 ③ · 计算层","title":"算子那么多，只在回答三个问题","lede":"执行引擎的三种模型、各种 Join、排序、聚合，剥掉名字之后，剩下的判断只有：装不装得下、能不能并行、能不能不重算。","caption":"图 09　上：三种执行模型的数据粒度。下：算子选择背后的三个真问题。","bridge":"可这条流水线具体走哪条路，不是执行器自己定的，是它上面那个『做预算的人』定的。下一页讲优化器，也讲讲 EXPLAIN 为什么不是天书。","notes":"找到数据，就该算了。这一层名字最多：执行引擎有三种模型，Join 有四五种，排序四五种，聚合七八种，看着像排列组合。可你把它们剥开，判断只有三个。先看执行模型：传统的 Volcano 是上层向下层一次拉一行，结构最清楚、最好扩展，代价是每行一次函数调用，放到分析型负载上这笔开销会被放大成灾难；向量化改成一次拉一批，紧凑循环把调用开销摊薄，数据留在缓存里，还能被 SIMD 吃掉；编译型则把热点表达式和元组解构编成机器码。这里得说准一句：PostgreSQL 的 JIT 编的是表达式求值和元组解构，算子组织方式仍然是拉取模型，真正把整条流水线编译成推送代码是另一条技术路线——把这点分清楚，才不会在选型时张冠李戴。再看算子：排序在内存里可以快排、top-N 用堆，一旦超过工作内存就转外部归并；Hash Join 装得下就建内存哈希表，装不下就分批落盘；聚合先各自算局部、再汇总，就是并行的两段式；窗口往前滑一格，与其重算整窗，不如把离开那一行反向下车。所以三个问题是：装不装得下、能不能并行、能不能不重算。所谓执行计划，就是这三个问题在一张流水线上的一串答案。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20\" y=\"12\" width=\"250\" height=\"62\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.1\" /><text x=\"145.0\" y=\"36.125\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" >单行 Pull · Volcano</text><text x=\"145.0\" y=\"58.625\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >每次拉一行</text><line x1=\"276\" y1=\"43\" x2=\"300.4\" y2=\"43\" stroke=\"#245A6B\" stroke-width=\"1.7\"/><polygon points=\"306,43 299,39.15 299,46.85\" fill=\"#245A6B\"/><rect x=\"318\" y=\"28\" width=\"16\" height=\"30\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#245A6B\" stroke-width=\"1.2\" /><rect x=\"352\" y=\"28\" width=\"16\" height=\"30\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#245A6B\" stroke-width=\"1.2\" /><rect x=\"386\" y=\"28\" width=\"16\" height=\"30\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#245A6B\" stroke-width=\"1.2\" /><rect x=\"420\" y=\"28\" width=\"16\" height=\"30\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#245A6B\" stroke-width=\"1.2\" /><rect x=\"454\" y=\"28\" width=\"16\" height=\"30\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#245A6B\" stroke-width=\"1.2\" /><rect x=\"488\" y=\"28\" width=\"16\" height=\"30\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#245A6B\" stroke-width=\"1.2\" /><rect x=\"522\" y=\"28\" width=\"16\" height=\"30\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#245A6B\" stroke-width=\"1.2\" /><rect x=\"556\" y=\"28\" width=\"16\" height=\"30\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#245A6B\" stroke-width=\"1.2\" /><rect x=\"600\" y=\"12\" width=\"780\" height=\"62\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"618\" y=\"49\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >结构清晰、易扩展；每行一次函数调用，OLAP 上被放大</text><rect x=\"20\" y=\"86\" width=\"250\" height=\"62\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.1\" /><text x=\"145.0\" y=\"110.125\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" >向量化 · 批量</text><text x=\"145.0\" y=\"132.625\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >每次拉一批</text><line x1=\"276\" y1=\"117\" x2=\"300.4\" y2=\"117\" stroke=\"#245A6B\" stroke-width=\"1.7\"/><polygon points=\"306,117 299,113.15 299,120.85\" fill=\"#245A6B\"/><rect x=\"318\" y=\"102\" width=\"54\" height=\"30\" rx=\"2\" fill=\"#74A5AD\" stroke=\"#74A5AD\" stroke-width=\"1\" /><rect x=\"386\" y=\"102\" width=\"54\" height=\"30\" rx=\"2\" fill=\"#74A5AD\" stroke=\"#74A5AD\" stroke-width=\"1\" /><rect x=\"454\" y=\"102\" width=\"54\" height=\"30\" rx=\"2\" fill=\"#74A5AD\" stroke=\"#74A5AD\" stroke-width=\"1\" /><rect x=\"522\" y=\"102\" width=\"54\" height=\"30\" rx=\"2\" fill=\"#74A5AD\" stroke=\"#74A5AD\" stroke-width=\"1\" /><rect x=\"600\" y=\"86\" width=\"780\" height=\"62\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"618\" y=\"123\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >紧凑循环摊薄调用开销，数据留在缓存，可被 SIMD 吃掉</text><rect x=\"20\" y=\"160\" width=\"250\" height=\"62\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.1\" /><text x=\"145.0\" y=\"184.125\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" >编译型 · Codegen</text><text x=\"145.0\" y=\"206.625\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >编译热点路径</text><line x1=\"276\" y1=\"191\" x2=\"300.4\" y2=\"191\" stroke=\"#245A6B\" stroke-width=\"1.7\"/><polygon points=\"306,191 299,187.15 299,194.85\" fill=\"#245A6B\"/><rect x=\"318\" y=\"176\" width=\"258\" height=\"30\" rx=\"3\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1\" /><text x=\"447\" y=\"197\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#FFFFFF\" font-weight=\"600\" >表达式求值 → 机器码</text><rect x=\"600\" y=\"160\" width=\"780\" height=\"62\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"618\" y=\"197\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >把表达式求值、元组解构编成机器码；算子仍按拉取模型组织</text><line x1=\"20\" y1=\"240\" x2=\"1380\" y2=\"240\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"20\" y=\"266\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" >算子看似很多，其实只回答三个问题</text><rect x=\"20\" y=\"282\" width=\"440\" height=\"126\" rx=\"5\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"38\" y=\"310\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#BE653B\" font-weight=\"700\" >内存装不下怎么办？</text><text x=\"38\" y=\"340\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"600\" >外部归并排序 · On-Disk Hash Join · 分批落盘</text><text x=\"38\" y=\"370\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >work_mem 是一道分水岭，超过它成本模型立刻换一支</text><text x=\"38\" y=\"394\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" ></text><rect x=\"480\" y=\"282\" width=\"440\" height=\"126\" rx=\"5\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"498\" y=\"310\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#BE653B\" font-weight=\"700\" >能不能并行？</text><text x=\"498\" y=\"340\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"600\" >并行扫描 · Partial / Finalize 两段聚合</text><text x=\"498\" y=\"370\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >先各自算局部结果，再汇总；并行不是免费，要付启动与汇总</text><text x=\"498\" y=\"394\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" ></text><rect x=\"940\" y=\"282\" width=\"440\" height=\"126\" rx=\"5\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"958\" y=\"310\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#BE653B\" font-weight=\"700\" >能不能不重算？</text><text x=\"958\" y=\"340\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"600\" >物化视图 · 增量排序 · 窗口反向下车</text><text x=\"958\" y=\"370\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >把计算从查询时挪到写入时，或只算新增的那一段</text><text x=\"958\" y=\"394\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" ></text><text x=\"20\" y=\"424\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#89938F\" font-weight=\"400\" >扫描 → Join → 排序 → 聚合，是一条流水线；瓶颈永远在中间结果第一次放不下的地方。</text></svg>","ctrl":null},{"eyebrow":"放大 ④ · 谁决定怎么算","title":"EXPLAIN 不是天书，是一张预算表","lede":"优化器不保证最快，只保证在它掌握的信息里最划算；所以慢查询的第一嫌疑，往往不是执行器，而是过期的统计信息。","caption":"图 10　计划的产生、代价的三个来源、估算与实际的偏差（数字为示意），以及三种修正手段。","bridge":"到这儿，一条查询的一生就讲完了。可数据库还有另一半生命：很多人同时写、机器突然断电。那半边，才是『基』真正吃劲的地方。","notes":"谁来决定这条流水线怎么走？优化器。很多人对它的印象是『有时灵有时不灵』，其实它一点都不玄：它不保证最快，只保证在它掌握的信息里最划算。信息有三份。第一份是统计信息——表里多少行、列值的直方图、最常见值、多列之间的相关性，靠 ANALYZE 收上来。第二份是选择率，过滤完大概还剩多少，以及索引给出的顺序跟数据物理顺序是不是一致；这一项特别容易被忽略，物理相关性一差，索引扫描就会在页面之间乱跳，成本模型立刻翻脸。第三份是代价常数：顺序读一页、随机读一页、处理一个元组各算多少钱，还有缓存命中的假设。三份信息凑出预算，候选计划里挑最便宜的那个。所以 EXPLAIN 从来不是天书，它就是这张预算表；加上 ANALYZE 之后，估算行数和实际行数并排一摆，偏差在哪一目了然。基数估错，Join 方式就会选错，本该走索引的表被反复全扫——这时候你去调执行器的参数，方向就反了。修正手段也都在预算这一侧：统计过期就重新 ANALYZE、补自定义统计信息；连接的表太多、穷举组合爆炸，就用 GEQO 找个够好的顺序，或者用 HINT 人工扳一下；估计长期系统性偏移，就用 AQO 拿真实执行反馈来校准。规则改写是 RBO，按代价挑计划是 CBO，两者叠在一起，才有了我们看到的那个计划。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20\" y=\"14\" width=\"240\" height=\"62\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.1\" /><text x=\"140.0\" y=\"50.6\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" >解析与重写</text><line x1=\"266\" y1=\"45\" x2=\"287.6\" y2=\"45\" stroke=\"#245A6B\" stroke-width=\"1.9\"/><polygon points=\"294,45 286,40.6 286,49.4\" fill=\"#245A6B\"/><rect x=\"300\" y=\"14\" width=\"240\" height=\"62\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.1\" /><text x=\"420.0\" y=\"50.6\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" >生成候选路径</text><line x1=\"546\" y1=\"45\" x2=\"567.6\" y2=\"45\" stroke=\"#245A6B\" stroke-width=\"1.9\"/><polygon points=\"574,45 566,40.6 566,49.4\" fill=\"#245A6B\"/><rect x=\"580\" y=\"14\" width=\"240\" height=\"62\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.1\" /><text x=\"700.0\" y=\"50.6\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" >估算代价</text><line x1=\"826\" y1=\"45\" x2=\"847.6\" y2=\"45\" stroke=\"#245A6B\" stroke-width=\"1.9\"/><polygon points=\"854,45 846,40.6 846,49.4\" fill=\"#245A6B\"/><rect x=\"860\" y=\"14\" width=\"240\" height=\"62\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.1\" /><text x=\"980.0\" y=\"50.6\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" >选出计划</text><line x1=\"1106\" y1=\"45\" x2=\"1127.6\" y2=\"45\" stroke=\"#245A6B\" stroke-width=\"1.9\"/><polygon points=\"1134,45 1126,40.6 1126,49.4\" fill=\"#245A6B\"/><rect x=\"1140\" y=\"14\" width=\"240\" height=\"62\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.1\" /><text x=\"1260.0\" y=\"50.6\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" >交给执行器</text><text x=\"20\" y=\"106\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" >代价从哪来</text><rect x=\"20\" y=\"120\" width=\"440\" height=\"74\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"36\" y=\"146\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"700\" >统计信息 / ANALYZE</text><text x=\"36\" y=\"174\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >行数、直方图、最常见值、相关系数</text><rect x=\"480\" y=\"120\" width=\"440\" height=\"74\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"496\" y=\"146\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"700\" >选择率与相关性</text><text x=\"496\" y=\"174\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >条件过滤后还剩多少、索引顺序和物理顺序是否一致</text><rect x=\"940\" y=\"120\" width=\"440\" height=\"74\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"956\" y=\"146\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"700\" >代价常数与硬件</text><text x=\"956\" y=\"174\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >顺序页、随机页、CPU 元组成本、缓存命中假设</text><rect x=\"20\" y=\"210\" width=\"1360\" height=\"84\" rx=\"5\" fill=\"#F1EFE9\" stroke=\"#F1EFE9\" stroke-width=\"1\" /><text x=\"40\" y=\"240\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"700\" >EXPLAIN ANALYZE 是一张账单：左边是估算，右边是实际</text><rect x=\"40\" y=\"250\" width=\"230\" height=\"36\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"155.0\" y=\"272.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"600\" >估算：120 行</text><line x1=\"280\" y1=\"268\" x2=\"314.4\" y2=\"268\" stroke=\"#BE653B\" stroke-width=\"1.8\"/><polygon points=\"320,268 313,264.15 313,271.85\" fill=\"#BE653B\"/><rect x=\"330\" y=\"250\" width=\"230\" height=\"36\" rx=\"5\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.1\" /><text x=\"445.0\" y=\"272.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"600\" >实际：38 万行</text><text x=\"586\" y=\"274\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#BE653B\" font-weight=\"600\" >基数估错 → Join 方式选错 → 本该走索引的表被反复全扫</text><rect x=\"20\" y=\"310\" width=\"440\" height=\"92\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"36\" y=\"338\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#245A6B\" font-weight=\"700\" >统计信息失准</text><text x=\"36\" y=\"368\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >ANALYZE / 自定义统计信息 / 多列相关性</text><text x=\"36\" y=\"390\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" >修正的是『预算』，不是『结果』</text><rect x=\"480\" y=\"310\" width=\"440\" height=\"92\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"496\" y=\"338\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#245A6B\" font-weight=\"700\" >搜索空间太大</text><text x=\"496\" y=\"368\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >GEQO 找够好的连接顺序，HINT 人工干预</text><text x=\"496\" y=\"390\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" >修正的是『预算』，不是『结果』</text><rect x=\"940\" y=\"310\" width=\"440\" height=\"92\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"956\" y=\"338\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#245A6B\" font-weight=\"700\" >估计长期偏移</text><text x=\"956\" y=\"368\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >AQO 用真实执行反馈校正基数估计</text><text x=\"956\" y=\"390\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" >修正的是『预算』，不是『结果』</text><text x=\"20\" y=\"424\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#89938F\" font-weight=\"400\" >RBO 靠规则改写，CBO 靠统计与代价；计划没有对错，只有在当时那份统计信息下是否划算。</text></svg>","ctrl":null},{"eyebrow":"放大 ⑤ · 保障层","title":"断电那一秒，谁来保证数据还在","lede":"事务、锁、WAL、检查点不是四块知识点，是同一条写入路径上的四个岗位；把它们串起来，持久性就不再是玄学。","caption":"","bridge":"提交这条路讲通了，还有一条更慢、更隐蔽的线：数据库用久了为什么会变胖、变慢。它其实是同一套机制的副作用。","notes":"现在讲地基真正吃劲的那一半。很多人同时写，机器还可能突然断电，数据库凭什么保证不错、不丢？先说并发这边：PostgreSQL 这类系统用 MVCC，改一行不是覆盖，是追加一个新版本，读的人按自己的快照看该看的版本，写的人不必等读的人。锁分成几层：保护表、事务这类对象的常规锁有等待队列和死锁检测；保护共享内存结构的轻量锁只守很短的临界区；还有给业务自己定义语义的咨询锁。跨多个库、多个节点要一起提交，就请出两阶段提交，先各自 PREPARE 把状态持久化，再统一 COMMIT PREPARED——代价是协调者一挂，会留下悬而未决的事务。再说持久性这边，一次提交的路径其实很短：改动先生成 WAL 记录进缓冲区，按 synchronous_commit 的设定决定要不要等 WAL 刷盘，等到了才向应用报成功；数据页这时候完全可以还留在内存里，由后台写进程和检查点慢慢刷。重启时先读控制文件，找到最近一次检查点的位置，从那儿重放 WAL 把已提交的改动补回页面，再结合事务状态记录判定每条改动最终是提交还是回滚。所以你看，日志先落盘、数据页后落盘，不是偷懒，是拿顺序写换随机写；而恢复的起点永远是检查点，不是崩溃那一刻。把这条链走通，你就知道为什么把检查点调得太密会拖慢平时，为什么异步提交能换延迟但要接受一个小小的丢失窗口。上页那个动画，建议真去拨一下断电时刻。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" id=\"animWal\"><text x=\"40\" y=\"24\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" >阶段一　一次提交的正常路径</text><rect x=\"40\" y=\"36\" width=\"300\" height=\"76\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" class=\"sbox\" data-step=\"1\"/><text x=\"190\" y=\"68\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"700\" >应用发起 COMMIT</text><text x=\"190\" y=\"92\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >事务进入收尾</text><line class=\"flowar\" data-step=\"2\" x1=\"346\" y1=\"74\" x2=\"370\" y2=\"74\" stroke=\"#D9D5CB\" stroke-width=\"2\"/><polygon class=\"flowar\" data-step=\"2\" points=\"374,74 366,69 366,79\" fill=\"#D9D5CB\"/><rect x=\"380\" y=\"36\" width=\"300\" height=\"76\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" class=\"sbox\" data-step=\"2\"/><text x=\"530\" y=\"68\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"700\" >生成 WAL 记录</text><text x=\"530\" y=\"92\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >先写进 wal_buffers</text><line class=\"flowar\" data-step=\"3\" x1=\"686\" y1=\"74\" x2=\"710\" y2=\"74\" stroke=\"#D9D5CB\" stroke-width=\"2\"/><polygon class=\"flowar\" data-step=\"3\" points=\"714,74 706,69 706,79\" fill=\"#D9D5CB\"/><rect x=\"720\" y=\"36\" width=\"300\" height=\"76\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" class=\"sbox\" data-step=\"3\"/><text x=\"870\" y=\"68\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"700\" >WAL flush 落盘</text><text x=\"870\" y=\"92\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#BE653B\" font-weight=\"400\" >★ 真正的持久点</text><line class=\"flowar\" data-step=\"4\" x1=\"1026\" y1=\"74\" x2=\"1050\" y2=\"74\" stroke=\"#D9D5CB\" stroke-width=\"2\"/><polygon class=\"flowar\" data-step=\"4\" points=\"1054,74 1046,69 1046,79\" fill=\"#D9D5CB\"/><rect x=\"1060\" y=\"36\" width=\"300\" height=\"76\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" class=\"sbox\" data-step=\"4\"/><text x=\"1210\" y=\"68\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"700\" >返回提交成功</text><text x=\"1210\" y=\"92\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >数据页可能还在内存</text><rect x=\"40\" y=\"126\" width=\"1320\" height=\"44\" rx=\"5\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1\" /><text x=\"60\" y=\"154\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"600\" >⚡ 断电可以发生在任何一步之后 —— 调下面的『断电时刻』，看结论怎么变</text><text x=\"1330\" y=\"155\" class=\"sv s\" text-anchor=\"middle\" font-size=\"20.0\" fill=\"#BE653B\" font-weight=\"700\" id=\"wBolt\" opacity=\"0\">⚡</text><text x=\"40\" y=\"196\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" >阶段二　重启后的恢复路径</text><rect x=\"20\" y=\"208\" width=\"256\" height=\"82\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" class=\"sbox\" data-step=\"5\"/><text x=\"148\" y=\"240\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.5\" fill=\"#1B2B33\" font-weight=\"700\" >后台刷脏页</text><text x=\"148\" y=\"264\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >bgwriter / checkpointer</text><line class=\"flowar\" data-step=\"6\" x1=\"280\" y1=\"249\" x2=\"290\" y2=\"249\" stroke=\"#D9D5CB\" stroke-width=\"2\"/><polygon class=\"flowar\" data-step=\"6\" points=\"294,249 286,244 286,254\" fill=\"#D9D5CB\"/><rect x=\"296\" y=\"208\" width=\"256\" height=\"82\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" class=\"sbox\" data-step=\"6\"/><text x=\"424\" y=\"240\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.5\" fill=\"#1B2B33\" font-weight=\"700\" >突然断电</text><text x=\"424\" y=\"264\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >内存里的脏页消失</text><line class=\"flowar\" data-step=\"7\" x1=\"556\" y1=\"249\" x2=\"566\" y2=\"249\" stroke=\"#D9D5CB\" stroke-width=\"2\"/><polygon class=\"flowar\" data-step=\"7\" points=\"570,249 562,244 562,254\" fill=\"#D9D5CB\"/><rect x=\"572\" y=\"208\" width=\"256\" height=\"82\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" class=\"sbox\" data-step=\"7\"/><text x=\"700\" y=\"240\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.5\" fill=\"#1B2B33\" font-weight=\"700\" >读 control file</text><text x=\"700\" y=\"264\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >找最近检查点状态</text><line class=\"flowar\" data-step=\"8\" x1=\"832\" y1=\"249\" x2=\"842\" y2=\"249\" stroke=\"#D9D5CB\" stroke-width=\"2\"/><polygon class=\"flowar\" data-step=\"8\" points=\"846,249 838,244 838,254\" fill=\"#D9D5CB\"/><rect x=\"848\" y=\"208\" width=\"256\" height=\"82\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" class=\"sbox\" data-step=\"8\"/><text x=\"976\" y=\"240\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.5\" fill=\"#1B2B33\" font-weight=\"700\" >从 redo 点重放</text><text x=\"976\" y=\"264\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >把已提交改动补回</text><line class=\"flowar\" data-step=\"9\" x1=\"1108\" y1=\"249\" x2=\"1118\" y2=\"249\" stroke=\"#D9D5CB\" stroke-width=\"2\"/><polygon class=\"flowar\" data-step=\"9\" points=\"1122,249 1114,244 1114,254\" fill=\"#D9D5CB\"/><rect x=\"1124\" y=\"208\" width=\"256\" height=\"82\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" class=\"sbox\" data-step=\"9\"/><text x=\"1252\" y=\"240\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.5\" fill=\"#1B2B33\" font-weight=\"700\" >按 clog 定终态</text><text x=\"1252\" y=\"264\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >提交或回滚，回到一致</text><rect x=\"40\" y=\"308\" width=\"1320\" height=\"106\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"62\" y=\"336\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"600\" >① WAL 必须先于它对应的数据页落盘 —— 顺序写日志，比随机刷脏页便宜得多。</text><text x=\"62\" y=\"364\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"600\" >② synchronous_commit 决定的是『应答』与『持久点』的先后，是可以按业务选的取舍。</text><text x=\"62\" y=\"392\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"600\" >③ 恢复起点恒为最近检查点的 redo 位置；检查点越密，恢复越短，但平时后台 IO 越重。</text></svg>","ctrl":"<label>提交模式</label><select id=\"walMode\"><option value=\"sync\">同步提交 · 等 WAL 落盘</option><option value=\"async\">异步提交 · 先应答</option></select><label>断电时刻</label><input type=\"range\" id=\"walCrash\" min=\"1\" max=\"5\" value=\"3\"><span id=\"walCrashLbl\" style=\"font-size:12.5px;color:var(--muted);white-space:nowrap\"></span><button class=\"btn play\" id=\"wPlay\">▶ 播放</button><button class=\"btn\" id=\"wTick\">单步 ›</button><button class=\"btn\" id=\"wReset\">重置</button><span class=\"out\" id=\"walOut\"></span>"},{"eyebrow":"放大 ⑥ · 保障层","title":"用久了为什么变胖、又慢慢变慢","lede":"膨胀不是 bug，是 MVCC 的账单：更新留下旧版本，旧版本占着页面，页面变多，扫描就要多读无用字节。","caption":"","bridge":"一条链在单机里讲完了。可生产环境从来不止一台机器 —— 把这条链拉长，会多出哪些新矛盾？","notes":"接下来说一条更慢、更隐蔽的线：数据库用久了，为什么表越来越胖、查询越来越慢。这事儿的根，还是刚才那个 MVCC。更新不是覆盖，是追加新版本，旧版本要等到所有事务快照都看不见它，才有资格被清掉。清理没跟上，死元组就一直占着页面；页面越堆越多，一次顺序扫描要读的字节里，有用的比例越来越小，索引也跟着一起膨胀——这就是所谓的膨胀。于是你看到的表象是『什么都没改，SQL 却一天比一天慢』，真正的原因是物理层被垃圾填了。这里要把三件事分清楚，很多人混在一起：VACUUM 是清死元组、让页内空间可以复用；freeze 是把特别旧的元组冻结起来，防的是 32 位事务 ID 回卷，它不负责释放空间；而 VACUUM 之后空间虽然能复用，文件本身可能还是那么大，要真正把磁盘还给系统，得靠 repack 这类在线重整。再往上一层，后台还有三个调度岗位：后台写进程平时慢慢刷脏页，检查点进程定期打一个恢复起点，日志写进程周期性把 WAL 缓冲区刷出去。它们互相制约：检查点太密，平时 IO 抖；太疏，崩溃后重放时间长。你看，这跟上一页是同一套机制的正反两面——为了并发不打架而保留多版本，就得接受一份空间账单，再用回收和调度把这份账按月结掉。上面那个动画，把更新比例拉满、关掉回收，膨胀长出来的过程一眼就能看懂。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" id=\"animBloat\"><rect x=\"60\" y=\"16\" width=\"22\" height=\"14\" rx=\"2\" fill=\"#74A5AD\" stroke=\"#74A5AD\" stroke-width=\"1\" /><text x=\"90\" y=\"28\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >有效元组</text><rect x=\"170\" y=\"16\" width=\"22\" height=\"14\" rx=\"2\" fill=\"#E8B79C\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"200\" y=\"28\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >死元组（可回收但还占着页）</text><rect x=\"470\" y=\"16\" width=\"22\" height=\"14\" rx=\"2\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"500\" y=\"28\
