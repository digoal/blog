48\" width=\"52\" height=\"170\" rx=\"2\" fill=\"#74A5AD\"/><rect class=\"dead\" x=\"592\" y=\"318\" width=\"52\" height=\"0\" rx=\"2\" fill=\"#E8B79C\" stroke=\"#BE653B\" stroke-width=\"1\"/><text x=\"618\" y=\"338\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.0\" fill=\"#89938F\" font-weight=\"400\" >D8</text><text class=\"dlab sv\" x=\"618\" y=\"358\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#2F7A66\" font-weight=\"600\"></text></g><g class=\"daycol\" opacity=\"0.13\"><rect x=\"668\" y=\"148\" width=\"52\" height=\"170\" rx=\"2\" fill=\"#74A5AD\"/><rect class=\"dead\" x=\"668\" y=\"318\" width=\"52\" height=\"0\" rx=\"2\" fill=\"#E8B79C\" stroke=\"#BE653B\" stroke-width=\"1\"/><text x=\"694\" y=\"338\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.0\" fill=\"#89938F\" font-weight=\"400\" >D9</text><text class=\"dlab sv\" x=\"694\" y=\"358\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#2F7A66\" font-weight=\"600\"></text></g><g class=\"daycol\" opacity=\"0.13\"><rect x=\"744\" y=\"148\" width=\"52\" height=\"170\" rx=\"2\" fill=\"#74A5AD\"/><rect class=\"dead\" x=\"744\" y=\"318\" width=\"52\" height=\"0\" rx=\"2\" fill=\"#E8B79C\" stroke=\"#BE653B\" stroke-width=\"1\"/><text x=\"770\" y=\"338\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.0\" fill=\"#89938F\" font-weight=\"400\" >D10</text><text class=\"dlab sv\" x=\"770\" y=\"358\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#2F7A66\" font-weight=\"600\"></text></g><g class=\"daycol\" opacity=\"0.13\"><rect x=\"820\" y=\"148\" width=\"52\" height=\"170\" rx=\"2\" fill=\"#74A5AD\"/><rect class=\"dead\" x=\"820\" y=\"318\" width=\"52\" height=\"0\" rx=\"2\" fill=\"#E8B79C\" stroke=\"#BE653B\" stroke-width=\"1\"/><text x=\"846\" y=\"338\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.0\" fill=\"#89938F\" font-weight=\"400\" >D11</text><text class=\"dlab sv\" x=\"846\" y=\"358\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#2F7A66\" font-weight=\"600\"></text></g><g class=\"daycol\" opacity=\"0.13\"><rect x=\"896\" y=\"148\" width=\"52\" height=\"170\" rx=\"2\" fill=\"#74A5AD\"/><rect class=\"dead\" x=\"896\" y=\"318\" width=\"52\" height=\"0\" rx=\"2\" fill=\"#E8B79C\" stroke=\"#BE653B\" stroke-width=\"1\"/><text x=\"922\" y=\"338\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.0\" fill=\"#89938F\" font-weight=\"400\" >D12</text><text class=\"dlab sv\" x=\"922\" y=\"358\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#2F7A66\" font-weight=\"600\"></text></g><rect x=\"1000\" y=\"46\" width=\"380\" height=\"340\" rx=\"5\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"1018\" y=\"76\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"700\" >MVCC 的必然结果</text><text x=\"1018\" y=\"104\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >更新 = 追加新版本，旧版本暂留</text><text x=\"1018\" y=\"132\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >要等所有快照都看不见它，才能回收</text><text x=\"1018\" y=\"160\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" ></text><text x=\"1018\" y=\"188\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#2F7A66\" font-weight=\"600\" >VACUUM：清死元组，页内空间可复用</text><text x=\"1018\" y=\"216\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >freeze：冻结很旧的元组，防事务 ID 回卷</text><text x=\"1018\" y=\"244\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#BE653B\" font-weight=\"400\" >它不释放空间，是另一件事</text><text x=\"1018\" y=\"272\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" ></text><text x=\"1018\" y=\"300\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >索引也会一起膨胀；统计信息失准更慢</text><text x=\"1018\" y=\"328\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#2F7A66\" font-weight=\"600\" >repack：在线重整表与索引</text><text x=\"1018\" y=\"356\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >把已回收却仍占着的磁盘还给系统</text><text x=\"60\" y=\"392\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >示意模型：只表达死元组累积与回收的相对趋势，不是精确的空间公式。</text><text x=\"60\" y=\"414\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#BE653B\" font-weight=\"400\" >把『每日更新比例』调到最大、关掉自动回收，再看一遍 —— 膨胀就是这么长出来的。</text></svg>","ctrl":"<label>每日更新比例</label><input type=\"range\" id=\"bRate\" min=\"5\" max=\"50\" value=\"20\" step=\"5\"><span id=\"bRateLbl\" style=\"font-size:12.5px;color:var(--muted);white-space:nowrap\"></span><label>自动回收</label><select id=\"bAuto\"><option value=\"on\">开启 autovacuum</option><option value=\"off\">关闭（无人回收）</option></select><button class=\"btn play\" id=\"bPlay\">▶ 播放</button><button class=\"btn\" id=\"bTick\">单步 ›</button><button class=\"btn\" id=\"bReset\">重置</button><span class=\"out\" id=\"bOut\"></span>"},{"eyebrow":"上层建筑 ① · 系统形态","title":"把一条链拉长，会多出什么代价","lede":"复制、高可用、备份、分布式不是新原理，是同一条因果链跨过网络之后，被放大了的旧矛盾。","caption":"图 13　上：单机闭环。下：链被网络切开。中间那一格，是所有分布式难题的入口。","bridge":"链条拉长讲完了，还差最后一问：这些层为什么能被改？因为数据库留了一整套插口——而插口的位置，恰好就是我们刚才剖开的那几层。","notes":"生产环境从来不止一台机器，那把这条链拉长会怎样？单机的时候，从写入到 WAL 到页面到读回，全在一台机器里闭合，延迟是可预期的。一旦跨机，中间就多出几件事：日志要传过去、主库挂了要选新主并且把旧主隔离掉防脑裂、多个节点要就谁说了算达成共识、双向写入还要处理冲突。这几件事一插进来，立刻多出两个新词：复制延迟和一致性窗口。所以读写分离最容易踩的坑不是性能，是写后立刻读，备库还没重放到那条 WAL；逻辑复制虽然能按表订阅、能跨版本，冲突得自己兜。高可用看着是运维话题，骨子里是『故障检测 + 选主 + 隔离』这套判定；备份能做到时间点恢复，靠的就是全量备份加 WAL 归档，增量备份再按块变化和日志序号少拷一点。到了分布式，分片之后跨片 Join、跨片排序都得搬数据，全局二级索引要维护跨片一致，两阶段提交再把延迟抬高一层；serverless 把计算和存储拆开、按需拉起，代价落在冷启动和连接管理上。你发现没有，这里没有一个全新的原理，全是那六组天平里的『单机对分布』『持久性对延迟』被网络放大了一遍。懂了单机那条链，学分布式就只剩补差异。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><text x=\"20\" y=\"24\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" >单机　一条链在一台机器里闭合</text><rect x=\"20\" y=\"34\" width=\"240\" height=\"62\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"140.0\" y=\"70.25\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >客户端写入</text><line x1=\"266\" y1=\"65\" x2=\"298.4\" y2=\"65\" stroke=\"#245A6B\" stroke-width=\"1.9\"/><polygon points=\"304,65 297,61.15 297,68.85\" fill=\"#245A6B\"/><rect x=\"290\" y=\"34\" width=\"240\" height=\"62\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"410.0\" y=\"70.25\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >执行与事务</text><line x1=\"536\" y1=\"65\" x2=\"568.4\" y2=\"65\" stroke=\"#245A6B\" stroke-width=\"1.9\"/><polygon points=\"574,65 567,61.15 567,68.85\" fill=\"#245A6B\"/><rect x=\"560\" y=\"34\" width=\"240\" height=\"62\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"680.0\" y=\"70.25\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >WAL 落盘</text><line x1=\"806\" y1=\"65\" x2=\"838.4\" y2=\"65\" stroke=\"#245A6B\" stroke-width=\"1.9\"/><polygon points=\"844,65 837,61.15 837,68.85\" fill=\"#245A6B\"/><rect x=\"830\" y=\"34\" width=\"240\" height=\"62\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"950.0\" y=\"70.25\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >脏页与页面</text><line x1=\"1076\" y1=\"65\" x2=\"1108.4\" y2=\"65\" stroke=\"#245A6B\" stroke-width=\"1.9\"/><polygon points=\"1114,65 1107,61.15 1107,68.85\" fill=\"#245A6B\"/><rect x=\"1100\" y=\"34\" width=\"240\" height=\"62\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"1220.0\" y=\"70.25\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >本地读回</text><rect x=\"20\" y=\"126\" width=\"1360\" height=\"48\" rx=\"5\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1\" /><text x=\"40\" y=\"156\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"600\" >链被网络切开，中间多了：日志传输 · 选主与防脑裂 · 共识 · 冲突处理 → 于是多了复制延迟与一致性窗口</text><text x=\"20\" y=\"200\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" >多机　同一条链被拉长</text><rect x=\"20\" y=\"210\" width=\"240\" height=\"62\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"140.0\" y=\"246.25\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >主库写入</text><line x1=\"266\" y1=\"241\" x2=\"298.4\" y2=\"241\" stroke=\"#245A6B\" stroke-width=\"1.9\"/><polygon points=\"304,241 297,237.15 297,244.85\" fill=\"#245A6B\"/><rect x=\"290\" y=\"210\" width=\"240\" height=\"62\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"410.0\" y=\"246.25\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >WAL 发送</text><line x1=\"536\" y1=\"241\" x2=\"568.4\" y2=\"241\" stroke=\"#245A6B\" stroke-width=\"1.9\"/><polygon points=\"574,241 567,237.15 567,244.85\" fill=\"#245A6B\"/><rect x=\"560\" y=\"210\" width=\"240\" height=\"62\" rx=\"5\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.1\" /><text x=\"680.0\" y=\"246.25\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"600\" >网络与排队</text><line x1=\"806\" y1=\"241\" x2=\"838.4\" y2=\"241\" stroke=\"#245A6B\" stroke-width=\"1.9\"/><polygon points=\"844,241 837,237.15 837,244.85\" fill=\"#245A6B\"/><rect x=\"830\" y=\"210\" width=\"240\" height=\"62\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"950.0\" y=\"246.25\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >备库重放</text><line x1=\"1076\" y1=\"241\" x2=\"1108.4\" y2=\"241\" stroke=\"#245A6B\" stroke-width=\"1.9\"/><polygon points=\"1114,241 1107,237.15 1107,244.85\" fill=\"#245A6B\"/><rect x=\"1100\" y=\"210\" width=\"240\" height=\"62\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"1220.0\" y=\"246.25\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >只读查询</text><rect x=\"20\" y=\"296\" width=\"440\" height=\"108\" rx=\"5\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"36\" y=\"322\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#245A6B\" font-weight=\"700\" >读写分离 / 复制</text><text x=\"36\" y=\"350\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >物理复制传 WAL，块级一致；</text><text x=\"36\" y=\"374\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >逻辑复制按行订阅，冲突要自己兜。</text><rect x=\"480\" y=\"296\" width=\"440\" height=\"108\" rx=\"5\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"496\" y=\"322\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#245A6B\" font-weight=\"700\" >高可用 / 备份</text><text x=\"496\" y=\"350\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >故障检测＋选主＋隔离旧主；</text><text x=\"496\" y=\"374\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >全量备份＋WAL 归档＝时间点恢复。</text><rect x=\"940\" y=\"296\" width=\"440\" height=\"108\" rx=\"5\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"956\" y=\"322\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#245A6B\" font-weight=\"700\" >分布式 / 全局索引</text><text x=\"956\" y=\"350\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >跨片 Join 与排序都要搬数据；</text><text x=\"956\" y=\"374\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >全局二级索引＋2PC 再抬高一档。</text><text x=\"20\" y=\"424\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#89938F\" font-weight=\"400\" >形态再怎么变，还是那四根柱子 —— 变的只是链的长度，和延迟记在谁头上。</text></svg>","ctrl":null},{"eyebrow":"上层建筑 ② · 可编程性","title":"它不是成品，是一台可编程的数据操作系统","lede":"扩展接口不是散落的彩蛋：每一个插口，都恰好开在我们前面剖开的那一层上 —— 这就是整个系列能闭环的证据。","caption":"图 14　四层可插拔点。左侧是剖面位置，右侧是数据库留给你的接口，以及它改变了哪一段因果链。","bridge":"讲到这里，四根柱子和上层建筑都归位了。最后该兑现承诺了：筑完这个基，日常到底能多得些什么？","notes":"还剩一个特别能说明问题的角度：数据库不是一件做死的成品，它是一台可编程的数据操作系统。你可能会觉得自定义类型、操作符、函数、聚合，还有表访问方法、索引访问方法、外部数据包装器、各种 Hook，是散落在手册角落里的彩蛋。其实不是。你把插口的位置标出来会发现，它们恰好开在我们前面剖开的那几层上。语义层上，你可以定义新类型，再给它配操作符和比较规则，于是索引和优化器就能认识它；自定义聚合甚至能定义局部状态怎么合并，并行聚合才接得上。计划与执行这一层，Hook 让你在生成计划、执行前后插逻辑，自定义 Scan Provider 让你干脆接管一段扫描，查询重写能改写整条语句。存储与访问这一层更直接：表访问方法、索引访问方法把物理实现换掉，外部数据包装器把另一个系统包装成本地的一张表，自定义统计信息则把优化器缺的那份情报补上。写入路径上，触发器、事件触发器、规则、物化视图、流计算，干的是同一件事——把计算从查询那一刻挪到写入那一刻，让结果提前备好。所以扩展能力不是额外功能，它是『分层』这件事的自然结果：正因为底座被切成了四层，每层才有地方插手。这也反过来证明了我们这套剖法是对的。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20\" y=\"20\" width=\"430\" height=\"84\" rx=\"5\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1\" /><text x=\"40\" y=\"54\" class=\"sv serif\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#FFFFFF\" font-weight=\"700\" >语义层 · 类型系统</text><text x=\"40\" y=\"82\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#E5EFF0\" font-weight=\"400\" >第 1 层可插拔</text><line x1=\"456\" y1=\"62\" x2=\"494.4\" y2=\"62\" stroke=\"#245A6B\" stroke-width=\"2\"/><polygon points=\"500,62 493,58.15 493,65.85\" fill=\"#245A6B\"/><rect x=\"510\" y=\"20\" width=\"870\" height=\"84\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"530\" y=\"52\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" >自定义类型 / 操作符 / 函数 / 聚合</text><text x=\"530\" y=\"82\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >让新数据类型也能被索引、被比较、被聚合</text><rect x=\"20\" y=\"120\" width=\"430\" height=\"84\" rx=\"5\" fill=\"#74A5AD\" stroke=\"#74A5AD\" stroke-width=\"1\" /><text x=\"40\" y=\"154\" class=\"sv serif\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#FFFFFF\" font-weight=\"700\" >计划与执行</text><text x=\"40\" y=\"182\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#E5EFF0\" font-weight=\"400\" >第 2 层可插拔</text><line x1=\"456\" y1=\"162\" x2=\"494.4\" y2=\"162\" stroke=\"#245A6B\" stroke-width=\"2\"/><polygon points=\"500,162 493,158.15 493,165.85\" fill=\"#245A6B\"/><rect x=\"510\" y=\"120\" width=\"870\" height=\"84\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"530\" y=\"152\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" >Hook / 自定义 Scan Provider / 查询重写</text><text x=\"530\" y=\"182\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >在执行路径上插入自己的逻辑或整段扫描方式</text><rect x=\"20\" y=\"220\" width=\"430\" height=\"84\" rx=\"5\" fill=\"#A4C4C6\" stroke=\"#A4C4C6\" stroke-width=\"1\" /><text x=\"40\" y=\"254\" class=\"sv serif\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#1B2B33\" font-weight=\"700\" >存储与访问</text><text x=\"40\" y=\"282\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >第 3 层可插拔</text><line x1=\"456\" y1=\"262\" x2=\"494.4\" y2=\"262\" stroke=\"#245A6B\" stroke-width=\"2\"/><polygon points=\"500,262 493,258.15 493,265.85\" fill=\"#245A6B\"/><rect x=\"510\" y=\"220\" width=\"870\" height=\"84\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"530\" y=\"252\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" >Table AM / Index AM / FDW / 自定义统计信息</text><text x=\"530\" y=\"282\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >把表和索引换成自己的实现，把外部数据源包装成表</text><rect x=\"20\" y=\"320\" width=\"430\" height=\"84\" rx=\"5\" fill=\"#CFE0DC\" stroke=\"#CFE0DC\" stroke-width=\"1\" /><text x=\"40\" y=\"354\" class=\"sv serif\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#1B2B33\" font-weight=\"700\" >写入与计算前置</text><text x=\"40\" y=\"382\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >第 4 层可插拔</text><line x1=\"456\" y1=\"362\" x2=\"494.4\" y2=\"362\" stroke=\"#245A6B\" stroke-width=\"2\"/><polygon points=\"500,362 493,358.15 493,365.85\" fill=\"#245A6B\"/><rect x=\"510\" y=\"320\" width=\"870\" height=\"84\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"530\" y=\"352\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" >触发器 / 事件触发器 / rule / 物化视图 / 流计算</text><text x=\"530\" y=\"382\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >把计算从查询时挪到写入时，结果随写入一起准备好</text><text x=\"20\" y=\"424\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#89938F\" font-weight=\"400\" >插口的位置，恰好就是前面剖开的层位 —— 分层不是讲解方式，是系统本来的结构。</text></svg>","ctrl":null},{"eyebrow":"上层建筑 ③ · 应用实践","title":"新场景不新，只是老机制换了个组合","lede":"向量、混合搜索、时序、GIS、HTAP 看着五花八门，拆到底都是：选对结构、少搬数据、把计算挪到更便宜的时机。","caption":"图 15　八个高频场景 → 三件套归位。左列是名词，中列是机制，右列是它们真正省下的东西。","bridge":"讲了这么多层，该兑现最实在的那个问题了：把这些基筑完，日常到底能多得什么？","notes":"到这一页，我想把前面所有上层建筑一次性收回来。你看那些最热闹的场景：混合搜索，要把向量、关键词、结构化过滤放一起，本质上是三套候选集各自先收敛，再融合重排，不是全表打分；GIS 和空间范围，是先用空间谓词把无关块整片剪掉；时序加滑动窗口，是只扫时间片，窗口往前滑一格就只算进出那一段，别把整窗重算；海量去重和近似计数，是拿一个固定大小的概略结构换掉全量明细；模糊匹配是先取候选再回表复核，把最贵的比较留到最后一小撮数据上；深分页的口诀更简单——别让数据库先取出前一百万行再原样丢掉，用游标或者边界递进；HTAP 和数据湖，是让分析不打扰写入，只读需要的列和版本；连安全也是取舍，参数化绑定能挡住注入，而字段加密会削弱索引和比较能力，得把密钥管理、查询能力的损失一起算进预算。八个场景，两个动作：选对结构让 IO 少搬，把计算挪到更便宜的时机。所以新名词出来的时候，你不用慌，也不用追，问它动了哪一格就够了。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><text x=\"20\" y=\"26\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#89938F\" font-weight=\"600\" >看起来全新的场景</text><text x=\"350\" y=\"26\" cl .0\" y=\"294.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"600\" >深分页</text><line x1=\"306\" y1=\"290\" x2=\"328.4\" y2=\"290\" stroke=\"#245A6B\" stroke-width=\"1.7\"/><polygon points=\"334,290 327,286.15 327,293.85\" fill=\"#245A6B\"/><rect x=\"340\" y=\"270\" width=\"450\" height=\"40\" rx=\"5\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"565.0\" y=\"294.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"600\" >游标、边界递进、延迟关联</text><line x1=\"796\" y1=\"290\" x2=\"818.4\" y2=\"290\" stroke=\"#245A6B\" stroke-width=\"1.7\"/><polygon points=\"824,290 817,286.15 817,293.85\" fill=\"#245A6B\"/><rect x=\"830\" y=\"270\" width=\"550\" height=\"40\" rx=\"5\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"846\" y=\"295\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >别让数据库先取出前 N 行，再原样丢掉</text><rect x=\"20\" y=\"316\" width=\"280\" height=\"40\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"160.0\" y=\"340.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"600\" >HTAP 与数据湖</text><line x1=\"306\" y1=\"336\" x2=\"328.4\" y2=\"336\" stroke=\"#245A6B\" stroke-width=\"1.7\"/><polygon points=\"334,336 327,332.15 327,339.85\" fill=\"#245A6B\"/><rect x=\"340\" y=\"316\" width=\"450\" height=\"40\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"565.0\" y=\"340.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"600\" >列存 ＋ 快照 ＋ 计算前置</text><line x1=\"796\" y1=\"336\" x2=\"818.4\" y2=\"336\" stroke=\"#245A6B\" stroke-width=\"1.7\"/><polygon points=\"824,336 817,332.15 817,339.85\" fill=\"#245A6B\"/><rect x=\"830\" y=\"316\" width=\"550\" height=\"40\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"846\" y=\"341\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >分析不打扰写入；只读需要的列与版本</text><rect x=\"20\" y=\"362\" width=\"280\" height=\"40\" rx=\"5\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"160.0\" y=\"386.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"600\" >安全 · 加密与注入</text><line x1=\"306\" y1=\"382\" x2=\"328.4\" y2=\"382\" stroke=\"#245A6B\" stroke-width=\"1.7\"/><polygon points=\"334,382 327,378.15 327,385.85\" fill=\"#245A6B\"/><rect x=\"340\" y=\"362\" width=\"450\" height=\"40\" rx=\"5\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"565.0\" y=\"386.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"600\" >参数化绑定 ＋ 密钥管理</text><line x1=\"796\" y1=\"382\" x2=\"818.4\" y2=\"382\" stroke=\"#245A6B\" stroke-width=\"1.7\"/><polygon points=\"824,382 817,378.15 817,385.85\" fill=\"#245A6B\"/><rect x=\"830\" y=\"362\" width=\"550\" height=\"40\" rx=\"5\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"846\" y=\"387\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >加密会削弱索引与比较能力 —— 安全也是一组取舍</text><text x=\"20\" y=\"424\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"600\" >动作只有两个：选对结构让 IO 少搬，把计算挪到更便宜的时机。剩下的都是这两条的排列组合。</text></svg>","ctrl":null},{"eyebrow":"第四问 · 筑完基，到底多了什么","title":"从『搜答案』，变成『推答案』","lede":"最直观的变化是排查路径：不再把六种建议挨个试一遍，而是按层把范围一次缩到一个环节。","caption":"图 16　左：一条慢 SQL 的分层排查顺序。右：筑基之后真正多出来的四种能力。","bridge":"最后收个尾。这一系列该怎么读，比它写了什么更要紧 —— 因为按目录读，你又会掉回清单里。","notes":"兑现最后一个问题：筑完基，日常到底多了什么？最实在的是排查路径变了。以前一条 SQL 慢了，我们把六种建议挨个试；现在会按层排除。先看账单，EXPLAIN ANALYZE 里估算和实际差多少，差得离谱，问题多半在统计信息、选择率或者多列相关性，根本不在执行器。账单没问题，再看路径：扫描方式选得对不对、Hash Join 是不是溢出了、排序是不是落了盘、有没有大量回表 recheck 造成的 IO 放大。路径也没问题，再看等待：锁、长事务、复制延迟、连接池——很多时候它根本不是算得慢，是一直在等。最后才轮到物理：膨胀、死元组、WAL 和检查点的压力、缓存命中、一个页面里还有多少有用字节。你看，这个顺序本身就是地基的形状，从预算到路径到等待再到物理，一次就把范围从『整个数据库』缩到『一个环节』。再往外一点，还有三件更长期的好处：选型终于有坐标了，看数据规模、更新频率、查询形态、内存预算，不看宣传词；换一套数据库只学差异，因为底层矛盾是相通的；再往上，访问方法、类型、算子、Hook 该插在哪一层，心里有数，就从『会用』走到『能改造』。这三件事的共同点是——它们都是复利的，用得越久越值钱。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"60\" y=\"10\" width=\"760\" height=\"56\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.1\" /><text x=\"440.0\" y=\"44.65\" class=\"sv s\" text-anchor=\"middle\" font-size=\"19.0\" fill=\"#245A6B\" font-weight=\"600\" >一条 SQL 慢了：别猜，按层排除</text><rect x=\"60\" y=\"90\" width=\"370\" height=\"116\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"76\" y=\"120\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#BE653B\" font-weight=\"700\" >① 先看账单</text><text x=\"76\" y=\"150\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"600\" >EXPLAIN ANALYZE 的估算 vs 实际</text><text x=\"76\" y=\"178\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >偏差大 → 统计信息、选择率、相关性</text><rect x=\"450\" y=\"90\" width=\"370\" height=\"116\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"466\" y=\"120\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#BE653B\" font-weight=\"700\" >② 再看路径</text><text x=\"466\" y=\"150\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"600\" >扫描方式、Join 溢出、排序落盘</text><text x=\"466\" y=\"178\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >是否有 recheck、IO 放大、回表过多</text><rect x=\"60\" y=\"222\" width=\"370\" height=\"116\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"76\" y=\"252\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#BE653B\" font-weight=\"700\" >③ 再看等待</text><text x=\"76\" y=\"282\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"600\" >锁、长事 roke-width=\"1\" /><text x=\"300\" y=\"122\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"600\" >上层建筑：形态 · 可编程 · 场景</text><rect x=\"80\" y=\"152\" width=\"100\" height=\"170\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#47808D\" stroke-width=\"1.4\" /><text x=\"130\" y=\"202\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"700\" >保障层</text><text x=\"130\" y=\"228\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"400\" >柱 4</text><rect x=\"192\" y=\"152\" width=\"100\" height=\"170\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#47808D\" stroke-width=\"1.4\" /><text x=\"242\" y=\"202\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"700\" >计算层</text><text x=\"242\" y=\"228\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"400\" >柱 3</text><rect x=\"304\" y=\"152\" width=\"100\" height=\"170\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#47808D\" stroke-width=\"1.4\" /><text x=\"354\" y=\"202\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"700\" >定位层</text><text x=\"354\" y=\"228\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"400\" >柱 2</text><rect x=\"416\" y=\"152\" width=\"100\" height=\"170\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#47808D\" stroke-width=\"1.4\" /><text x=\"466\" y=\"202\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"700\" >物理层</text><text x=\"466\" y=\"228\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"400\" >柱 1</text><line x1=\"60\" y1=\"336\" x2=\"540\" y2=\"336\" stroke=\"#2E6373\" stroke-width=\"2.2\"/><text x=\"60\" y=\"364\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >不可再拆的事实</text><text x=\"60\" y=\"388\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#BE653B\" font-weight=\"600\" >砖块会换，骨架不换</text><text x=\"610\" y=\"52\" class=\"sv serif\" text-anchor=\"start\" font-size=\"20.0\" fill=\"#245A6B\" font-weight=\"700\" >这一系列，建议这么读</text><rect x=\"610\" y=\"78\" width=\"770\" height=\"78\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"630\" y=\"110\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#BE653B\" font-weight=\"700\" >① 按矛盾读，不按目录读</text><text x=\"630\" y=\"138\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >每读一篇，先问它拨动了六组天平里的哪一组。</text><rect x=\"610\" y=\"174\" width=\"770\" height=\"78\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"630\" y=\"206\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#BE653B\" font-weight=\"700\" >② 先跑通两条链</text><text x=\"630\" y=\"234\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >一条查询的一生、一次写入与一次崩溃，中间不许断。</text><rect x=\"610\" y=\"270\" width=\"770\" height=\"78\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"630\" y=\"302\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#BE653B\" font-weight=\"700\" >③ 挑一组天平追到底</text><text x=\"630\" y=\"330\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >从物理结构，一路追到执行计划，再追到运维代价。</text><rect x=\"610\" y=\"372\" width=\"770\" height=\"34\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1\" /><text x=\"628\" y=\"395\" class=\"sv serif\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"700\" >名词会过时，矛盾不会。</text></svg>","ctrl":null}];
const N = D.length;
let cur = 0, autoTimer = null, autoOn = false;

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

function fit(){
  const vp = $('#viewport');
  const W = vp.clientWidth, H = vp.clientHeight;
  const s = Math.min(W/1600, H/900);
  const st = $('#stage');
  st.style.transform = 'scale(' + s + ')';
  st.style.left = ((W - 1600*s)/2) + 'px';
  st.style.top  = ((H -  900*s)/2) + 'px';
}
window.addEventListener('resize', fit);

function render(){
  const host = $('#slides');
  host.innerHTML = D.map((d,i) =>
    '<section class="slide" id="s'+i+'">'
    + '<div class="eyebrow"><span class="num">'+String(i+1).padStart(2,'0')+' / '+String(N).padStart(2,'0')+'</span>'+d.eyebrow+'</div>'
    + '<h1 class="title">'+d.title+'</h1>'
    + '<div class="lede">'+d.lede+'</div>'
    + '<div class="rule"></div>'
    + '<div class="figwrap">'+d.svg+'</div>'
    + (d.ctrl ? '<div class="ctrls">'+d.ctrl+'</div>' : '<div class="caption">'+d.caption+'</div>')
    + '<div class="bridge"><span class="bk">承接 · NEXT</span>'+d.bridge+'</div>'
    + '<div class="footer"><div class="fbar"><i id="fbar'+i+'"></i></div>'
    + '<span class="fl">数据库筑基课 · 概览演说</span>'
    + '<span class="fr">'+String(i+1).padStart(2,'0')+' / '+String(N).padStart(2,'0')+'</span></div>'
    + '</section>').join('');
}

function go(i, silent){
  i = Math.max(0, Math.min(N-1, i));
  $$('.slide').forEach((el,k)=>el.classList.toggle('on', k===i));
  cur = i;
  try{ localStorage.setItem('zhuji-slide', String(i)); }catch(e){}
  $('.pg').textContent = String(i+1).padStart(2,'0') + ' / ' + String(N).padStart(2,'0');
  $('#track i').style.width = ((i+1)/N*100)+'%';
  for(let k=0;k<N;k++){ const b=$('#fbar'+k); if(b) b.style.width = (k<=i?100:0)+'%'; }
  if(!silent) toast(D[i].eyebrow + ' · ' + D[i].title);
}
function next(){ if(cur<N-1) go(cur+1); else stopAuto(); }
function prev(){ if(cur>0) go(cur-1); }

function toast(s){
  const t=$('#toast'); t.textContent=s; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1700);
}

function stopAuto(){
  autoOn=false; clearInterval(autoTimer); autoTimer=null;
  $('#btnAuto').textContent='▶ 自动播放'; $('#btnAuto').classList.remove('act');
}
function toggleAuto(){
  if(autoOn){ stopAuto(); toast('已暂停自动播放'); return; }
  autoOn=true; $('#btnAuto').textContent='❚❚ 暂停'; $('#btnAuto').classList.add('act');
  autoTimer=setInterval(()=>{ if(cur<N-1) go(cur+1,true); else stopAuto(); }, 12000);
  toast('自动播放：每 12 秒一页');
}

/* ---------- 模态：讲稿 / 全文 / 目录 / 帮助 ---------- */
function closePanel(){ $('#veil').classList.remove('on'); }
function showPanel(inner){
  $('#panel').innerHTML = '<button class="close" onclick="closePanel()">关闭 ✕</button>' + inner;
  $('#veil').classList.add('on');
}
function notesHere(){
  const d=D[cur];
  showPanel('<h2>'+d.title+'</h2><div class="psub">'+d.eyebrow+' · 本页讲述稿</div>'
    +'<div class="sec"><p>'+d.notes+'</p></div>'
    +'<div class="sec"><p style="font-size:14px;color:var(--muted)">按 T 通读全文讲稿，按 Esc 返回画面。</p></div>');
}
function notesAll(){
  showPanel('<h2>完整演说文稿</h2><div class="psub">按顺序通读 · 页与页之间靠「承接」相连</div>'
    + D.map((d,i)=>'<div class="sec"><span class="sn">'+String(i+1).padStart(2,'0')+' · '+d.eyebrow+'</span>'
      +'<h3>'+d.title+'</h3><p>'+d.notes+'</p>'
      +'<p style="margin-top:12px;font-family:var(--serif);color:var(--accent);font-size:15px">「'+d.bridge+'」</p></div>').join(''));
}
function toc(){
  showPanel('<h2>目录</h2><div class="psub">点击任意一页跳转 · 共 '+N+' 页</div><div class="grid">'
    + D.map((d,i)=>'<a onclick="jump('+i+')"><span class="gn">'+String(i+1).padStart(2,'0')+'</span>'
      +'<span class="gt">'+d.title+'</span></a>').join('') + '</div>');
}
function jump(i){ closePanel(); go(i); }
function help(){
  showPanel('<h2>快捷键</h2><div class="psub">演说时的操作备忘</div><div class="keys">'
    + '<div><kbd>→ / 空格</kbd>下一页</div><div><kbd>←</kbd>上一页</div>'

function fs(){
  const el=document.documentElement;
  const entering=!document.body.classList.contains('immersive');
  if(entering){
    document.body.classList.add('immersive');   /* 先做可见的沉浸切换，保证按 F 一定有反应 */
    $('#btnFs').textContent='退出全屏 F';
    fit();
    toast('沉浸模式：画面已铺满窗口（F 或 Esc 退出）');
    try{
      const pr = el.requestFullscreen ? el.requestFullscreen() : null;
      if(pr && pr.catch) pr.catch(()=>{});      /* iframe / 浏览器限制时静默降级 */
    }catch(e){}
  }else{
    document.body.classList.remove('immersive');
    $('#btnFs').textContent='全屏 F';
    fit();
    toast('已退出全屏');
    try{ if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen(); }catch(e){}
  }
}
document.addEventListener('fullscreenchange', ()=>{
  if(!document.fullscreenElement && document.body.classList.contains('immersive')){
    document.body.classList.remove('immersive');
    const b=$('#btnFs'); if(b) b.textContent='全屏 F';
  }
  fit();
});

document.addEventListener('keydown', e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  const k=e.key;
  const typing=(tag==='input'||tag==='select'||tag==='textarea');
  const navKey=(k.indexOf('Arrow')===0||k===' '||k==='Home'||k==='End'||k==='PageUp'||k==='PageDown');
  if(k==='Escape'){
    closePanel();
    if(document.body.classList.contains('immersive')) fs();
    return;
  }
  if($('#veil').classList.contains('on')) return;
  if(typing && navKey) return;   /* 只把方向键让给滑块/下拉，字母快捷键不再被吞 */
  if(k==='ArrowRight'||k===' '||k==='PageDown'){ e.preventDefault(); next(); }
  else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); prev(); }
  else if(k==='f'||k==='F'||e.code==='KeyF'){ e.preventDefault(); fs(); }
  else if(k==='g'||k==='G'){ e.preventDefault(); toc(); }
  else if(k==='n'||k==='N'){ e.preventDefault(); notesHere(); }
  else if(k==='t'||k==='T'){ e.preventDefault(); notesAll(); }
  else if(k==='p'||k==='P'){ e.preventDefault(); toggleAuto(); }
  else if(k==='?'||k==='h'||k==='H'){ e.preventDefault(); help(); }
  else if(k==='Home'){ e.preventDefault(); go(0); }
  else if(k==='End'){ e.preventDefault(); go(N-1); }
  else if(/^[1-9]$/.test(k)){ go(parseInt(k,10)-1); }
});

/* ---------- 动画 A：一次提交与一次崩溃恢复 ---------- */
let walStep=0, walTimer=null, walPlaying=false;
const WAL_STEPS=9;
function walPaint(){
  const boxes=$$('#animWal .sbox');
  boxes.forEach(b=>{
    const n=+b.getAttribute('data-step');
    b.setAttribute('fill', n<=walStep ? '#F7E9DE' : '#FFFFFF');
    b.setAttribute('stroke', n<=walStep ? '#BE653B' : '#D9D5CB');
    b.setAttribute('stroke-width', n===walStep ? '2.2' : '1.1');
  });
  const bolt=$('#wBolt'); if(bolt) bolt.setAttribute('opacity', walStep>=6 ? '1' : '0');
  $$('#animWal .flowar').forEach(a=>{
    const n=+a.getAttribute('data-step');
    const c = n<=walStep ? '#BE653B' : '#D9D5CB';
    a.setAttribute('stroke', c);
    if(a.tagName.toLowerCase()==='polygon') a.setAttribute('fill', c);
  });
  walVerdict();
}
function walVerdict(){
  const mode=$('#walMode') ? $('#walMode').value : 'sync';
  const t=+$('#walCrash').value;
  const out=$('#walOut'); if(!out) return;
  const stageName=['生成前','仅在内存','刚落盘','已应答','检查点后'][t-1];
  let msg;
  if(t<=2){
    msg = mode==='async' ? '⚠ 已报成功的提交可能丢失，还没到持久点'
                         : '尚未应答，未确认事务回滚，不算丢数据';
  } else {
    msg = 'WAL 已落盘，脏页没刷也能重放复原';
  }
  out.innerHTML = '<b>『'+stageName+'』断电 →</b> '+msg;
  out.title = out.textContent;
  const lbl=$('#walCrashLbl'); if(lbl) lbl.textContent=stageName;
}
function walPlay(){
  if(walPlaying){ walPause(); return; }
  walPlaying=true; $('#wPlay').textContent='❚❚ 暂停'; $('#wPlay').classList.add('play');
  if(walStep>=WAL_STEPS) walStep=0;
  walTimer=setInterval(()=>{
    walStep++; walPaint();
    if(walStep>=WAL_STEPS) walPause();
  },900);
}
function walPause(){
  walPlaying=false; clearInterval(walTimer); walTimer=null;
  const b=$('#wPlay'); if(b){ b.textContent='▶ 播放'; b.classList.remove('play'); }
}
function walTick(){ if(walStep<WAL_STEPS){ walStep++; walPaint(); } }
function walReset(){ walPause(); walStep=0; walPaint(); }

/* ---------- 动画 B：页面膨胀与回收 ---------- */
let bDay=12, bTimer=null, bPlaying=false; /* 打开即见完整 12 天，播放时从头演示 */
const B_DAYS=12;
function bloatCalc(){
  const rate=+$('#bRate').value/100;
  const auto=$('#bAuto').value==='on';
  let dead=0; const days=[];
  for(let d=1;d<=B_DAYS;d++){
    dead += rate*100;
    let ev='';
    if(auto && d%3===0){ dead=0; ev='回收'; }
    if(d===9) ev=ev? ev+' · freeze' : 'freeze';
    days.push({d, dead:Math.min(dead,185), ev});
  }
  return days;
}
function bloatPaint(){
  const days=bloatCalc();
  $$('#animBloat .daycol').forEach((g,i)=>{
    const d=i+1, info=days[i];
    g.setAttribute('opacity', d<=bDay ? '1' : '0.13');
    const dead=g.querySelector('.dead');
    const h=info.dead;
    dead.setAttribute('height', h.toFixed(1));
    dead.setAttribute('y', (318-h).toFixed(1));
    const lab=g.querySelector('.dlab');
    if(lab) lab.textContent = info.ev || '';
  });
  bloatVerdict(days);
}
function bloatVerdict(days){
  const out=$('#bOut'); if(!out) return;
  const auto=$('#bAuto').value==='on';
  const d=Math.max(1,bDay), info=days[d-1];
  const live=170, total=live+info.dead;
  const pct=Math.round(info.dead/total*100);
  let tail = auto ? '每 3 天回收；freeze 只防事务 ID 回卷，不释放空间'
                  : '无人回收 → 死元组堆积，扫描多读无用页';
  out.innerHTML='<b>第 '+d+' 天 · 死元组占 '+pct+'%　</b>'+tail;
  out.title = out.textContent;
  const lbl=$('#bRateLbl'); if(lbl) lbl.textContent=$('#bRate').value+'%';
}
function bloatPlay(){
  if(bPlaying){ bloatPause(); return; }
  bPlaying=true; $('#bPlay').textContent='❚❚ 暂停'; $('#bPlay').classList.add('play');
  if(bDay>=B_DAYS) bDay=0;
  bTimer=setInterval(()=>{
    bDay++; bloatPaint();
    if(bDay>=B_DAYS) bloatPause();
  },620);
}
function bloatPause(){
  bPlaying=false; clearInterval(bTimer); bTimer=null;
  const b=$('#bPlay'); if(b){ b.textContent='▶ 播放'; b.classList.remove('play'); }
}
function bloatTick(){ if(bDay<B_DAYS){ bDay++; bloatPaint(); } }
function bloatReset(){ bloatPause(); bDay=0; bloatPaint(); }

function init(){
  render(); fit();
  let saved=0; try{ saved=parseInt(localStorage.getItem('zhuji-slide')||'0',10)||0; }catch(e){}
  go(saved,true);
  $('#btnPrev').onclick=prev; $('#btnNext').onclick=next;
  $('#btnToc').onclick=toc; $('#btnNotes').onclick=notesHere;
  $('#btnAll').onclick=notesAll; $('#btnAuto').onclick=toggleAuto;
  $('#btnFs').onclick=fs; $('#btnHelp').onclick=help;
  $('#veil').onclick=e=>{ if(e.target.id==='veil') closePanel(); };
  walPaint(); bloatPaint();
  ['walMode','walCrash','bRate','bAuto'].forEach(id=>{
    const el=$('#'+id); if(!el) return;
    el.addEventListener('input',()=>{ walVerdict(); bloatPaint(); });
    el.addEventListener('change',()=>{ walVerdict(); bloatPaint(); });
  });
  const bind=(id,fn)=>{ const el=$(id); if(el) el.onclick=fn; };
  bind('#wPlay',walPlay); bind('#wTick',walTick); bind('#wReset',walReset);
  bind('#bPlay',bloatPlay); bind('#bTick',bloatTick); bind('#bReset',bloatReset);
}
document.addEventListener('DOMContentLoaded', init);
</script>
