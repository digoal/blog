" y=\"43\" class=\"sv serif\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#AE8A3E\" font-weight=\"700\" >纯否定查询</text><rect x=\"480\" y=\"72\" width=\"440\" height=\"72\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"496\" y=\"100\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"600\" >查询形如 !foo</text><text x=\"496\" y=\"124\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >没有必须正向匹配的词</text><line x1=\"700\" y1=\"144\" x2=\"700\" y2=\"149.2\" stroke=\"#AE8A3E\" stroke-width=\"1.6\"/><polygon points=\"700,154 696.7,148 703.3,148\" fill=\"#AE8A3E\"/><rect x=\"480\" y=\"154\" width=\"440\" height=\"72\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"496\" y=\"182\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"600\" >GIN_SEARCH_MODE_ALL</text><text x=\"496\" y=\"206\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >gin_extract_tsquery() 设置</text><line x1=\"700\" y1=\"226\" x2=\"700\" y2=\"231.2\" stroke=\"#AE8A3E\" stroke-width=\"1.6\"/><polygon points=\"700,236 696.7,230 703.3,230\" fill=\"#AE8A3E\"/><rect x=\"480\" y=\"236\" width=\"440\" height=\"72\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"496\" y=\"264\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"600\" >扫描更大范围</text><text x=\"496\" y=\"288\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >否定条件无法由倒排 key 定位</text><rect x=\"940\" y=\"14\" width=\"440\" height=\"46\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1\" /><text x=\"960\" y=\"43\" class=\"sv serif\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#BE653B\" font-weight=\"700\" >高写入 / pending list</text><rect x=\"940\" y=\"72\" width=\"440\" height=\"72\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"956\" y=\"100\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"600\" >fastupdate 提升写入吞吐</text><text x=\"956\" y=\"124\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >新条目先进入 pending list</text><line x1=\"1160\" y1=\"144\" x2=\"1160\" y2=\"149.2\" stroke=\"#BE653B\" stroke-width=\"1.6\"/><polygon points=\"1160,154 1156.7,148 1163.3,148\" fill=\"#BE653B\"/><rect x=\"940\" y=\"154\" width=\"440\" height=\"72\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"956\" y=\"182\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"600\" >pending list 变大</text><text x=\"956\" y=\"206\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >查询要额外扫描这部分数据</text><line x1=\"1160\" y1=\"226\" x2=\"1160\" y2=\"231.2\" stroke=\"#BE653B\" stroke-width=\"1.6\"/><polygon points=\"1160,236 1156.7,230 1163.3,230\" fill=\"#BE653B\"/><rect x=\"940\" y=\"236\" width=\"440\" height=\"72\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"956\" y=\"264\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"600\" >前台 cleanup 触发时</text><text x=\"956\" y=\"288\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >同样查询可能忽然变慢</text><rect x=\"20\" y=\"326\" width=\"1360\" height=\"46\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#F1EFE9\" stroke-width=\"1\" /><text x=\"40\" y=\"355\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#46585F\" font-weight=\"600\" >DBA 视角：ANALYZE 全文检索列；关注 maintenance_work_mem、autovacuum 与 gin_pending_list_limit。</text><rect x=\"20\" y=\"382\" width=\"1360\" height=\"40\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1\" /><text x=\"40\" y=\"408\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#AE8A3E\" font-weight=\"600\" >「写入很快」不等于系统健康：pending list 的代价，会在某一次查询里一次性还回来。</text></svg>","ctrl":null},{"eyebrow":"索引 · GiST 的另一条路","title":"把整篇文档压成一个固定长度签名","lede":"每个词 hash 到一个 bit 再 OR 起来；父子节点继续 OR。签名会误判，所以 GiST 文本搜索索引一律 recheck。","caption":"图 15　签名位为示意；124 / 2024 字节的默认值与上限来自 PostgreSQL 官方文档 12.9，siglen 可调。","bridge":"索引怎么选、优化器怎么估，其实都绕回同一个东西：词频统计。这一层最容易被忽略。","notes":"PostgreSQL 在 GiST 上也提供了 tsvector_ops，思路完全不一样：它不保留每个词项，而是把每个词 hash 到一个 bit，再把一篇文档的所有 bit 用 OR 合成一个固定长度签名，官方文档直说这是 lossy 的。父节点签名由子节点 OR 上来，所以 gtsvector_union 做合并；不同词可能 hash 到同一 bit，于是查一个不存在的词也可能「bit 命中」，这正是误判的来源——gtsvector_consistent 对所有情况都设 recheck 等于 true。siglen 由 GistTsVectorOptions 控制，默认是三十一乘四，一百二十四字节；调长一点误判少一些，索引也更大。官方文档还写明默认签名长度是一百二十四字节、最大两千零二十四字节，签名越长扫描的堆页越少，索引也越大。另外，GiST 支持 INCLUDE 列，而 GIN 不支持 index-only scan，因为它的每个条目只保存原始值的一部分。但请别误会：GiST 文本搜索索引一律 recheck，损失性带来的回表省不掉，INCLUDE 只是把负载列放进索引，不会让签名变得精确。所以两条路的分工很清楚：GIN 是词项到 TID 的精确倒排，适合高选择性的词项检索；GiST 是签名近似，换的是空间和覆盖能力。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><text x=\"20\" y=\"24\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"700\" >每个词 hash 到一个 bit，再按 OR 合成文档签名</text><rect x=\"20\" y=\"40\" width=\"110\" height=\"44\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"36\" y=\"68\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"700\" >fat</text><line x1=\"130\" y1=\"62\" x2=\"163.2\" y2=\"62\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><polygon points=\"168,62 162,58.7 162,65.3\" fill=\"#245A6B\"/><rect x=\"168\" y=\"40\" width=\"262\" height=\"44\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"182\" y=\"68\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >hash → bit 2</text><rect x=\"20\" y=\"96\" width=\"110\" height=\"44\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"36 t=\"76\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1\" /><text x=\"500\" y=\"364\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#AE8A3E\" font-weight=\"600\" >GIN：lexeme → TID 的精确倒排，适合高选择性的词项检索。</text><text x=\"500\" y=\"390\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#AE8A3E\" font-weight=\"600\" >GiST：签名近似结构，换空间与覆盖能力，但所有匹配都要 recheck。</text></svg>","ctrl":null},{"eyebrow":"优化器 · 词频从哪来","title":"优化器怎么知道「这个词有多常见」","lede":"ts_typanalyze 从采样行里统计最常见 lexeme，写入 MCELEM；tsmatchsel 用它估算 @@ 的选择率。","caption":"图 16　统计链路与两个触发条件；全文检索列同样需要 ANALYZE。","bridge":"到这里，结构、匹配、索引、统计都讲完了。可以回到最开始那个问题：和另外三条路比，tsvector 到底赢在哪？","notes":"很多人给全文检索列建完索引就再也不管统计，这其实漏了一层。tsvector 在 pg_type.dat 里配了 typanalyze 等于 ts_typanalyze；ANALYZE 的时候，它从采样行里遍历每个 tsvector 的 lexeme，统计 most common elements，写进 STATISTIC_KIND_MCELEM。执行 @@ 时，选择率函数 tsmatchsel 在「右侧是常量 tsquery、左侧是 tsvector 列」这个条件下，才会去读这些统计；没有统计，或者查询不是常量，就只能退回默认估计。工程含义很直接：全文检索列也要 ANALYZE，语料的词分布一变，优化器对 Bitmap Index Scan、Seq Scan 和 join 顺序的判断就会跟着变差。所以当用户抱怨「明明有索引，怎么忽然全表扫了」，我会先看词是不是高频词、候选集是不是过大，再看统计是不是过期，最后才去怀疑索引。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><text x=\"20\" y=\"24\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"700\" >统计信息链路：从采样行到执行计划</text><rect x=\"20\" y=\"44\" width=\"256\" height=\"92\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.1\" /><text x=\"148.0\" y=\"83.125\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" >采样行</text><text x=\"148.0\" y=\"105.625\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >ANALYZE 读取一部分 tsvector</text><line x1=\"276\" y1=\"90\" x2=\"290.4\" y2=\"90\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"296,90 289,86.15 289,93.85\" fill=\"#245A6B\"/><rect x=\"296\" y=\"44\" width=\"256\" height=\"92\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.1\" /><text x=\"424.0\" y=\"83.125\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" >ts_typanalyze()</text><text x=\"424.0\" y=\"105.625\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >遍历每个 lexeme</text><line x1=\"552\" y1=\"90\" x2=\"566.4\" y2=\"90\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"572,90 565,86.15 565,93.85\" fill=\"#245A6B\"/><rect x=\"572\" y=\"44\" width=\"256\" height=\"92\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.1\" /><text x=\"700.0\" y=\"83.125\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" >MCELEM 统计</text><text x=\"700.0\" y=\"105.625\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >STATISTIC_KIND_MCELEM</text><line x1=\"828\" y1=\"90\" x2=\"842.4\" y2=\"90\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"848,90 841,86.15 841,93.85\" fill=\"#245A6B\"/><rect x=\"848\" y=\"44\" width=\"256\" height=\"92\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1.1\" /><text x=\"976.0\" y=\"83.125\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#2F7A66\" font-weight=\"600\" >tsmatchsel()</text><text x=\"976.0\" y=\"105.625\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >估算 @@ 的选择率</text><line x1=\"1104\" y1=\"90\" x2=\"1118.4\" y2=\"90\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"1124,90 1117,86.15 1117,93.85\" fill=\"#245A6B\"/><rect x=\"1124\" y=\"44\" width=\"256\" height=\"92\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1.1\" /><text x=\"1252.0\" y=\"83.125\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#2F7A66\" font-weight=\"600\" >计划选择</text><text x=\"1252.0\" y=\"105.625\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >Bitmap / Seq / join 顺序</text><rect x=\"20\" y=\"160\" width=\"660\" height=\"118\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"40\" y=\"190\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" >什么时候真的读得到统计？</text><text x=\"40\" y=\"220\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >右侧是常量 tsquery，左侧是 tsvector 列时，tsmatchsel() 会读 MCELEM；</text><text x=\"40\" y=\"244\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >没有统计、或查询不是常量时，只能退回默认估计。</text><rect x=\"700\" y=\"160\" width=\"680\" height=\"118\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1\" /><text x=\"720\" y=\"190\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#AE8A3E\" font-weight=\"700\" >工程含义</text><text x=\"720\" y=\"220\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >全文检索列也要 ANALYZE；词分布变化大时，优化器对</text><text x=\"720\" y=\"244\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >Bitmap Index Scan、Seq Scan 与 join 顺序的判断都会变差。</text><rect x=\"20\" y=\"296\" width=\"1360\" height=\"68\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#F1EFE9\" stroke-width=\"1\" /><text x=\"40\" y=\"322\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"600\" >pg_type.dat：typanalyze =&gt; &#x27;ts_typanalyze&#x27;</text><text x=\"40\" y=\"348\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >源码：src/backend/tsearch/ts_typanalyze.c · ts_selfuncs.c</text><rect x=\"20\" y=\"378\" width=\"1360\" height=\"44\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1\" /><text x=\"40\" y=\"406\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"600\" >高频词让候选集过大时，先怀疑统计与词分布，再怀疑索引本身。</text></svg>","ctrl":null},{"eyebrow":"横向对比 · 谁拥有语义","title":"比的不是快慢，是语义放在哪","lede":"tsvector 的语义在数据库内，和事务、备份、权限、SQL 组合天然一致；外部系统语义更丰富，但边界更复杂。","caption":"图 17　七个维度对照四类方案；绿色列是 tsvector，深色为表头。","bridge":"既然语义在库内，好处是实打实的，代价也一样。下一页把这笔账一次算清，而且不编任何性能数字。","notes":"把四条路摆在一张表里，你会发现争的其实不是速度。tsvector 的分词归一依赖 text search config，位置和短语、四档权重、GIN 与 GiST 都是库内能力，事务一致性和表数据同生共死，备份、权限、和结构化条件组合进同一条 SQL，全都顺理成章；它不适合的是搜索级的复杂体验和大规模排序。LIKE 只会找子串；应用层数组把语义挪到了应用里，数据库这边只剩集合；外部搜索系统语义最强，可你需要一条同步链路来守住一致性和事务边界。所以我判断方案的时候，第一句话永远是「谁拥有语义」：语义在库内，运维边界就在库内；语义在库外，你就得为两个系统之间的时间差负责。这不是「谁更快」能回答的问题。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20\" y=\"20\" width=\"200\" height=\"46\" rx=\"3\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1\" /><text x=\"34\" y=\"49\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"700\" >维度</text><rect x=\"220.0\" y=\"20\" width=\"290.0\" height=\"46\" rx=\"3\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1\" /><text x=\"232.0\" y=\"49\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"700\" >tsvector</text><rect x=\"510.0\" y=\"20\" width=\"290.0\" height=\"46\" rx=\"3\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1\" /><text x=\"522.0\" y=\"49\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"700\" >text + LIKE</text><rect x=\"800.0\" y=\"20\" width=\"290.0\" height=\"46\" rx=\"3\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1\" /><text x=\"812.0\" y=\"49\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"700\" >text[] / 标签 + GIN</text><rect x=\"1090.0\" y=\"20\" width=\"290.0\" height=\"46\" rx=\"3\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1\" /><text x=\"1102.0\" y=\"49\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"700\" >外部搜索系统</text><rect x=\"20\" y=\"68\" width=\"200\" height=\"4 /2000/svg\" ><rect x=\"20\" y=\"14\" width=\"660\" height=\"46\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1\" /><text x=\"40\" y=\"43\" class=\"sv serif\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#2F7A66\" font-weight=\"700\" >读路径上省下的 · 三条收益</text><rect x=\"20\" y=\"72\" width=\"660\" height=\"58\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1.0\" /><text x=\"38\" y=\"106.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#2F7A66\" font-weight=\"600\" >读路径变短</text><text x=\"216\" y=\"105.55\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >文档已预处理，查询时不必逐行分词</text><rect x=\"20\" y=\"138\" width=\"660\" height=\"58\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1.0\" /><text x=\"38\" y=\"172.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#2F7A66\" font-weight=\"600\" >索引可用</text><text x=\"216\" y=\"171.55\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >GIN 把 lexeme 映射到 TID，多词查询做集合组合</text><rect x=\"20\" y=\"204\" width=\"660\" height=\"58\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1.0\" /><text x=\"38\" y=\"238.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#2F7A66\" font-weight=\"600\" >排名可解释</text><text x=\"216\" y=\"237.55\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >位置、权重、词频为 ts_rank / ts_rank_cd 提供输入</text><rect x=\"700\" y=\"14\" width=\"680\" height=\"46\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1\" /><text x=\"720\" y=\"43\" class=\"sv serif\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#BE653B\" font-weight=\"700\" >写与空间上还回去的 · 四条代价</text><rect x=\"700\" y=\"72\" width=\"680\" height=\"48\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"718\" y=\"101.25\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"600\" >写放大</text><text x=\"856\" y=\"100.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >正文变化重算 tsvector 并更新 GIN / GiST；一行可能产生很多 lexeme</text><rect x=\"700\" y=\"126\" width=\"680\" height=\"48\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"718\" y=\"155.25\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"600\" >空间放大</text><text x=\"856\" y=\"154.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >物化列与索引都占空间；位置与权重越多，datum 越大</text><rect x=\"700\" y=\"180\" width=\"680\" height=\"48\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"718\" y=\"209.25\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"600\" >回表复查</text><text x=\"856\" y=\"208.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >GIN 不存权重 / 位置；GiST 签名有误判，都要 heap recheck</text><rect x=\"700\" y=\"234\" width=\"680\" height=\"48\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"718\" y=\"263.25\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"600\" >配置敏感</text><text x=\"856\" y=\"262.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >分词配置、字典、停用词直接决定结果；配置一变，旧物化值要重算</text><rect x=\"20\" y=\"288\" width=\"660\" height=\"46\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#F1EFE9\" stroke-width=\"1\" /><text x=\"40\" y=\"317\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"600\" >收益来自「把工作提前到写入时」，代价也正落在这里。</text><rect x=\"20\" y=\"348\" width=\"1360\" height=\"70\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1\" /><text x=\"40\" y=\"376\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#AE8A3E\" font-weight=\"700\" >不要给 tsvector 制造不存在的性能数字。</text><text x=\"40\" y=\"402\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >真实效果取决于语料规模、词分布、查询词频、GIN pending list、缓存命中率、排序与 LIMIT。</text></svg>","ctrl":null},{"eyebrow":"实践 · 建模路径","title":"建模顺序错了，后面每一步都在还债","lede":"先把配置和字段权重定死，再选生成列、表达式索引或触发器，最后才谈 GIN 和运维参数。","caption":"图 19　上半是决策顺序，下半是三种物化方式各自的适用面与注意事项。","bridge":"顺序讲完了，给一段最小可验证的 SQL，把前面所有机制收进一张表里。","notes":"很多团队一上来就问「要不要建 GIN」，这个问题问早了。我的顺序是五步：先把 text search config 显式固定下来；再决定哪些字段参与检索、各自给什么权重；然后才决定 tsvector 怎么落地；接着建索引；最后把 ANALYZE、pending list、配置变更后的重算纳入运维。第三步有三种走法。规则稳定、要可审计，我优先用生成列，GENERATED ALWAYS AS 里把标题 setweight 成 A、正文成 D，用 || 拼起来，结构一眼能看懂。字段少、规则简单，用表达式索引也行，省掉一列，但查询表达式必须和索引表达式写得一模一样。规则复杂、多语言、或者版本演进频繁，再上触发器，用配置列记录每行语言，同时别忘了回灌旧数据。还有一句给多语言场景：千万别把所有语言塞进同一个默认配置，分列、分区或者配置列配合触发器，都比事后补救便宜。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20\" y=\"14\" width=\"256\" height=\"76\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.1\" /><text x=\"148.0\" y=\"45.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" >① 固定 config</text><text x=\"148.0\" y=\"67.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >显式写 english 等配置</text><line x1=\"276\" y1=\"52\" x2=\"290.4\" y2=\"52\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"296,52 289,48.15 289,55.85\" fill=\"#245A6B\"/><rect x=\"296\" y=\"14\" width=\"256\" height=\"76\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.1\" /><text x=\"424.0\" y=\"45.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" >② 选字段与权重</text><text x=\"424.0\" y=\"67.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >title / body / tags</text><line x1=\"552\" y1=\"52\" x2=\"566.4\" y2=\"52\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"572,52 184\" width=\"440\" height=\"34\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"36\" y=\"206\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >GENERATED ALWAYS AS (...) STORED</text><rect x=\"20\" y=\"222\" width=\"440\" height=\"34\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"36\" y=\"244\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >规则稳定、组合清晰、可审计</text><rect x=\"20\" y=\"260\" width=\"440\" height=\"34\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"36\" y=\"282\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >setweight(to_tsvector(...), &#x27;A&#x27;)</text><rect x=\"20\" y=\"298\" width=\"440\" height=\"34\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"36\" y=\"320\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >配置变化时需安排重算</text><rect x=\"480\" y=\"128\" width=\"440\" height=\"44\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"500\" y=\"156\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"700\" >表达式索引</text><rect x=\"480\" y=\"184\" width=\"440\" height=\"34\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"496\" y=\"206\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >GIN (to_tsvector(&#x27;english&#x27;, body))</text><rect x=\"480\" y=\"222\" width=\"440\" height=\"34\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"496\" y=\"244\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >不必额外存一列 tsvector</text><rect x=\"480\" y=\"260\" width=\"440\" height=\"34\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"496\" y=\"282\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >适合字段少、规则简单的模型</text><rect x=\"480\" y=\"298\" width=\"440\" height=\"34\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"496\" y=\"320\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >查询表达式必须与索引表达式一致</text><rect x=\"940\" y=\"128\" width=\"440\" height=\"44\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1\" /><text x=\"960\" y=\"156\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#AE8A3E\" font-weight=\"700\" >触发器维护</text><rect x=\"940\" y=\"184\" width=\"440\" height=\"34\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"956\" y=\"206\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >自定义权重组合与多语言路由</text><rect x=\"940\" y=\"222\" width=\"440\" height=\"34\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"956\" y=\"244\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >规则复杂或版本演进频繁时再用</text><rect x=\"940\" y=\"260\" width=\"440\" height=\"34\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"956\" y=\"282\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >可用配置列记录每行的语言</text><rect x=\"940\" y=\"298\" width=\"440\" height=\"34\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"956\" y=\"320\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >注意维护一致性与回灌旧数据</text><rect x=\"20\" y=\"348\" width=\"1360\" height=\"34\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1\" /><text x=\"40\" y=\"371\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#BE653B\" font-weight=\"600\" >先定文本配置、字段组合与权重，再决定 tsvector 是否物化；顺序反了，后面每一步都在还债。</text><rect x=\"20\" y=\"390\" width=\"1360\" height=\"34\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#F1EFE9\" stroke-width=\"1\" /><text x=\"40\" y=\"413\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >多语言内容不要混用一个默认配置：按语言分列、分区，或用配置列配合触发器维护。</text></svg>","ctrl":null},{"eyebrow":"实操 · 最小可验证 DEMO","title":"把前面所有机制，收进一段可执行的 SQL","lede":"先看 cast 与归一、strip 的差别，再用生成列物化带权重的 tsvector、建 GIN，最后用 ts_rank 排序。","caption":"图 20　三段 SQL 取自素材第 6 节，为可执行示例；当前环境未能启动临时 PostgreSQL 实例，未粘贴实测输出。用户输入请用 websearch_to_tsquery 或 plainto_tsquery。","bridge":"脚本能跑通，不代表线上就能放心。三类角色各自要守的那条线，才是最后一公里。","notes":"这一段脚本我建议每个人都亲手跑一遍。第一组四条 SELECT，专门用来建立直觉：直接 cast 只排序去重；to_tsvector 带 english 才会处理停用词和词形；带位置和权重的字面量长什么样；strip 之后又变成什么样。第二组是建模主菜：表里留 title 和 body 原文，另开一个生成列 search_tsv，把标题的 tsvector 设成 A 权重、正文设成 D，再用 || 拼起来，然后在这一列上建 GIN。生成列的好处是规则写在表定义里，谁都能审。第三组用 websearch_to_tsquery 接用户输入，先 @@ 过滤，再 ts_rank 排序。这里有两个诚实的说明：SQL 是可执行示例，但当前沙箱阻止创建共享内存段，临时实例没能启动，所以我不贴任何实测输出；另外，千万别把用户原样字符串拼进 to_tsquery 语法，用 websearch_to_tsquery 或 plainto_tsquery 才安全。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20\" y=\"14\" width=\"1360\" height=\"110\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"20\" y=\"14\" width=\"6\" height=\"110\" rx=\"1\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"40\" y=\"38\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"700\" >6.1 · 先观察类型行为</text><text x=\"40\" y=\"62\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#1B2B33\" font-weight=\"400\" >SELECT &#x27;a fat cat sat on a mat and ate a fat rat&#x27;::tsvector;</text><text x=\"40\" y=\"83\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#1B2B33\" font-weight=\"400\" >SELECT to_tsvector(&#x27;english&#x27;, &#x27;The Fat Rats&#x27;);</text><text x=\"40\" y=\"104\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#1B2B33\" font-weight=\"400\" >SELECT &#x27;a:1A fat:2B,4C cat:5D&#x27;::tsvector;</text><text x=\"40\" y=\"125\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#1B2B33\" font-weight=\"400\" >SELECT strip(&#x27;a:1A fat:2B,4C cat:5D&#x27;::tsvector);</text><rect x=\"20\" y=\"136\" width=\"1360\" height=\"160\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"20\" y=\"136\" width=\"6\" height=\"160\" rx=\"1\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"40\" y=\"160\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"700\" >6.2 · 生成列 + GIN 索引</text><text x=\"40\" y=\"184\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#1B2B33\" font-weight=\"400\" >CREATE TABLE docs (id bigserial PRIMARY KEY, title text, body text,</text><text x=\"40\" y=\"205\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#1B2B33\" font-weight=\"400\" >  search_tsv tsvector GENERATED ALWAYS AS (</text><text x=\"40\" y=\"226\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#1B2B33\" font-weight=\"400\" >    setweight(to_tsvector(&#x27;english&#x27;, coalesce(title,&#x27;&#x27;)), &#x27;A&#x27;) ||</text><text x=\"40\" y=\"247\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#1B2B33\" font-weight=\"400\" >    setweight(to_tsvector(&#x27;english&#x27;, coalesce(body, &#x27;&#x27;)), &#x27;D&#x27;)</text><text x=\"40\" y=\"268\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#1B2B33\" font-weight=\"400\" >  ) STORED);</text><text x=\"40\" y=\"289\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#1B2B33\" font-weight=\"400\" >CREATE INDEX docs_search_tsv_gin ON docs USING gin (search_tsv);</text><rect x=\"20\" y=\"308\" width=\"1360\" height=\"110\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"20\" y=\"308\" width=\"6\" height=\"110\" rx=\"1\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"40\" y=\"332\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"700\" >6.3 · 查询、排名与用户输入</text><text x=\"40\" y=\"356\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#1B2B33\" font-weight=\"400\" >SELECT id, title, ts_rank(search_tsv, websearch_to_tsquery(&#x27;english&#x27;,&#x27;postgresql text&#x27;)) AS rank</text><text x=\"40\" y=\"377\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#1B2B33\" font-weight=\"400\" >FROM docs WHERE search_tsv @@ websearch_to_tsquery(&#x27;english&#x27;,&#x27;postgresql text&#x27;)</text><text x=\"40\" y=\"398\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#1B2B33\" font-weight=\"400\" >ORDER BY rank DESC;</text></svg>","ctrl":null},{"eyebrow":"实践 · 三类角色","title":"同一列 tsvector，三种人各管一段","lede":"架构师定语义与边界，DBA 盯写入与统计，开发者接住用户输入与字段选择——谁都别越界。","caption":"图 21　按角色拆分的最佳实践，底部是三类人共同要守的底线。","bridge":"把边界说清楚之后，最后一页方法论：什么时候别用它，往往比什么时候用它更值钱。","notes":"落到人身上，这三条线其实互不重叠。架构师要决定的是语义和边界：tsvector 是检索投影，不能替代原文；规则稳定用生成列，复杂或者版本演进频繁再考虑触发器；多语言别混用一个默认配置；一旦业务要的是搜索引擎级相关性、拼写纠错、同义词运营、跨库聚合，就尽早评估外部搜索系统，别硬扛。DBA 盯的是写入侧和系统健康：高写入表看 GIN pending list，大批量导入通常先导数据再建索引，maintenance_work_mem、autovacuum、gin_pending_list_limit 要一起看，还有定期 ANALYZE。业务开发者守的是入口：用户输入用 websearch_to_tsquery 或 plainto_tsquery；只把真正要检索的字段放进 tsvector，长而低价值的字段全塞进去只会放大索引和写入成本；用 setweight 分区分标题正文，但别误以为权重能让 GIN 直接过滤；配置一改，安排重算。还有一条共同的底线：@@ 只给候选文档，权限、租户、状态条件必须自己显式建模、自己加索引。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20\" y=\"14\" width=\"440\" height=\"46\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"40\" y=\"43\" class=\"sv serif\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#245A6B\" font-weight=\"700\" >面向架构师</text><rect x=\"20\" y=\"72\" width=\"440\" height=\"60\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" / "34\" height=\"46\" rx=\"2\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1\" /><text x=\"707\" y=\"193\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"700\" >3</text><text x=\"738\" y=\"193\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >以为 GIN 保存权重与位置</text><rect x=\"690\" y=\"215\" width=\"690\" height=\"46\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"690\" y=\"215\" width=\"34\" height=\"46\" rx=\"2\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1\" /><text x=\"707\" y=\"244\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"700\" >4</text><text x=\"738\" y=\"244\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >忽视 pending list，只看写入吞吐</text><rect x=\"690\" y=\"266\" width=\"690\" height=\"46\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"690\" y=\"266\" width=\"34\" height=\"46\" rx=\"2\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1\" /><text x=\"707\" y=\"295\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"700\" >5</text><text x=\"738\" y=\"295\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >字典 / 停用词变更后不重算物化值</text><rect x=\"690\" y=\"317\" width=\"690\" height=\"46\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"690\" y=\"317\" width=\"34\" height=\"46\" rx=\"2\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1\" /><text x=\"707\" y=\"346\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"700\" >6</text><text x=\"738\" y=\"346\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >把 @@ 当权限过滤用</text><rect x=\"690\" y=\"368\" width=\"690\" height=\"46\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"690\" y=\"368\" width=\"34\" height=\"46\" rx=\"2\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1\" /><text x=\"707\" y=\"397\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"700\" >7</text><text x=\"738\" y=\"397\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >过度 strip，丢掉短语与排名能力</text></svg>","ctrl":null},{"eyebrow":"收束 · 判断框架","title":"把这一场，收成四个场景、四条路线","lede":"先辨认问题属于哪一类，再选路线；大多数选型事故，是把子串匹配问题当成全文检索问题。","caption":"图 23　场景 → 路线 → 理由；底部列的是素材留下的三个扩展问题。","bridge":"最后，我们把整场从困境到边界的因果链回放一遍，作为这一节的收尾。","notes":"评审的时候我一般只问四个场景。第一，站内关键词检索、又要事务一致，那就 tsvector 加 GIN，语义在库内，结构化过滤能写进同一条 SQL，备份权限都顺。第二，业务要的是搜索级相关性、拼写纠错、跨集群全局排序，那就早点评估外部搜索系统，代价是你得为同步链路和一致性边界负责。第三，用户其实在做子串、模糊、拼音或者 trigram 相似度，那是 pg_trgm 的活，别拿全文检索硬套——我见过太多选型事故是把这一类问题误判成「要建全文索引」。第四，超高写入加每行超长文本，先算维护成本，写放大、pending list 和回表复查很可能盖过查询收益。素材最后还留了几个值得继续想的问题：假如 GIN 真把位置和权重也存进索引，体积和写入代价会怎么变；ts_rank 和 ts_rank_cd 对位置的依赖差在哪；多语言到底建一列还是多列。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20\" y=\"14\" width=\"440\" height=\"42\" rx=\"3\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1\" /><text x=\"36\" y=\"40\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#FFFFFF\" font-weight=\"700\" >场景</text><rect x=\"460\" y=\"14\" width=\"310\" height=\"42\" rx=\"3\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1\" /><text x=\"476\" y=\"40\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#FFFFFF\" font-weight=\"700\" >推荐路线</text><rect x=\"770\" y=\"14\" width=\"610\" height=\"42\" rx=\"3\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1\" /><text x=\"786\" y=\"40\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#FFFFFF\" font-weight=\"700\" >为什么</text><rect x=\"20\" y=\"62\" width=\"440\" height=\"74\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><t \" width=\"310\" height=\"74\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"476\" y=\"270\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" >pg_trgm</text><rect x=\"770\" y=\"226\" width=\"610\" height=\"74\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"786\" y=\"256\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >这本来就不是全文检索要解决的问题，别拿 tsvector 硬套</text><text x=\"786\" y=\"282\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" ></text><rect x=\"20\" y=\"308\" width=\"440\" height=\"74\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"36\" y=\"352\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"600\" >超高写入 + 每行文本很长</text><rect x=\"460\" y=\"308\" width=\"310\" height=\"74\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1\" /><text x=\"476\" y=\"352\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#BE653B\" font-weight=\"700\" >先算维护成本</text><rect x=\"770\" y=\"308\" width=\"610\" height=\"74\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"786\" y=\"338\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >写放大、pending list 与回表复查可能盖过查询收益</text><text x=\"786\" y=\"364\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" ></text><text x=\"20\" y=\"404\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >留给下一轮的问题：GIN 若保存位置与权重会怎样？ts_rank 与 ts_rank_cd 对位置的依赖差在哪？多语言该建一列还是多列？</text></svg>","ctrl":null},{"eyebrow":"收尾 · 一页回放","title":"语义在库内，边界要自己算","lede":"tsvector 不是更聪明的字符串，它是数据库把自然语言翻译成可索引结构的一道投影层。","caption":"图 24　整场七层剖面回放：从困境到边界，每一层都由下一层的机制撑住。","bridge":"这一节就到这里。回去挑一张表，把配置写死、把生成列建起来，再亲手换四个查询看一遍回表。","notes":"我们把这一场收回来。最初的问题很小：用户要搜，数据库却只会比字符串。PostgreSQL 的答案是先翻译——用配置选定的 parser 和 dictionary 把文档变成一组排序去重的 lexeme，附带位置和权重，再用 tsquery 树去匹配。为了让这个翻译结果能被高效访问，类型被设计成紧凑的 varlena：四个字节的 WordEntry 存偏移和长度，位宽同时定死了词项长度、位置上限和四档权重。也正因为这份紧凑，GIN 只把 lexeme 当 key，权重、位置、可见性都要回表；GiST 换个思路把文档压成签名，用误判换空间，一样要 recheck。收益是把读路径变短、把索引变成可能、把排名变得可解释；代价是写放大、空间放大、回表复查和配置敏感。所以最后这句话我想留给大家：语义在库内，边界要自己算。它和事务、备份、权限天然一致，这是它最值钱的地方；而什么时候该把搜索交给专门系统，需要你自己算清那笔账。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20\" y=\"14\" width=\"1360\" height=\"54\" rx=\"4\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1\" /><text x=\"40\" y=\"48\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#FFFFFF\" font-weight=\"600\" >数据库筑基课 · tsvector 数据类型　｜　从一句话，到一组可索引的词项</text><text x=\"1360\" y=\"48\" class=\"sv s\" text-anchor=\"end\" font-size=\"13.0\" fill=\"#A4C4C6\" font-weight=\"400\" >数据类型与算子</text><rect x=\"20\" y=\"78\" width=\"1360\" height=\"43\" rx=\"3\" fill=\"#EBF1EE\" stroke=\"#EBF1EE\" stroke-width=\"1\" /><text x=\"40\" y=\"106\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"700\" >困境</text><text x=\"180\" y=\"106\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >LIKE 只找子串；缺的是词形归一、位置、权重与排名</text><rect x=\"20\" y=\"125\" width=\"1360\" height=\"43\" rx=\"3\" fill=\"#CFE0DC\" stroke=\"#CFE0DC\" stroke-width=\"1\" /><text x=\"40\" y=\"153\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"700\" >归一</text><text x=\"180\" y=\"153\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >语义来自 to_tsvector(config, text)，不来自类型本身</text><rect x=\"20\" y=\"172\" width=\"1360\" height=\"43\" rx=\"3\" fill=\"#A4C4C6\" stroke=\"#A4C4C6\" stroke-width=\"1\" /><text x=\"40\" y=\"200\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"700\" >结构</text><text x=\"180\" y=\"200\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >varlena + 有序 WordEntry[] + 词串区 + 可选位置；位宽定边界</text><rect x=\"20\" y=\"219\" width=\"1360\" height=\"43\" rx=\"3\" fill=\"#74A5AD\" stroke=\"#74A5AD\" stroke-width=\"1\" /><text x=\"40\" y=\"247\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#FFFFFF\" font-weight=\"700\" >匹配</text><text x=\"180\" y=\"247\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#EBF1EE\" font-weight=\"400\" >@@ 执行 tsquery 树；索引里没有的信息都要回表</text><rect x=\"20\" y=\"266\" width=\"1360\" height=\"43\" rx=\"3\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1\" /><text x=\"40\" y=\"294\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#FFFFFF\" font-weight=\"700\" >索引</text><text x=\"180\" y=\"294\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#EBF1EE\" font-weight=\"400\" >GIN 精确倒排只存 lexeme；GiST 签名近似、一律 recheck</text><rect x=\"20\" y=\"313\" width=\"1360\" height=\"43\" rx=\"3\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1\" /><text x=\"40\" y=\"341\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#FFFFFF\" font-weight=\"700\" >代价</text><text x=\"180\" y=\"341\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#EBF1EE\" font-weight=\"400\" >读路径变短的代价是写放大、空间放大与配置敏感</text><rect x=\"20\" y=\"360\" width=\"1360\" height=\"43\" rx=\"3\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1\" /><text x=\"40\" y=\"388\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#FFFFFF\" font-weight=\"700\" >边界</text><text x=\"180\" y=\"388\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#EBF1EE\" font-weight=\"400\" >语义在库内，与事务一致；复杂搜索体验交给专门系统</text><rect x=\"20\" y=\"414\" width=\"1360\" height=\"12\" rx=\"2\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /></svg>","ctrl":null}];
const N = D.length;
let cur = 0, autoTimer = null, autoOn = false;
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

function fit(){
  const vp = $('#viewport');
  const W = vp.clientWidth, H = vp.clientHeight;
  const s = Math.min(W/1600, H/900);
  const st = $('#stage');
  st.style.transform = 'scale(' + s + ')';
  st.style.left = ((W - 1600*s)/2) + 'px';
  st.style.top  = ((H -  900*s)/2) + 'px';
}
window.addEventListener('resize', fit);

function render(){
  $('#slides').innerHTML = D.map((d,i) =>
    '<section class="slide" id="s'+i+'">'
    + '<div class="eyebrow"><span class="num">'+String(i+1).padStart(2,'0')+' / '+String(N).padStart(2,'0')+'</span>'+d.eyebrow+'</div>'
    + '<h1 class="title">'+d.title+'</h1>'
    + '<div class="lede">'+d.lede+'</div>'
    + '<div class="rule"></div>'
    + '<div class="figwrap">'+d.svg+'</div>'
    + (d.ctrl ? '<div class="ctrls">'+d.ctrl+'</div>' : '<div class="caption">'+d.caption+'</div>')
    + '<div class="bridge"><span class="bk">承接 · NEXT</span>'+d.bridge+'</div>'
    + '<div class="footer"><div class="fbar"><i id="fbar'+i+'"></i></div>'
    + '<span class="fl">数据库筑基课 · tsvector 数据类型</span>'
    + '<span class="fr">'+String(i+1).padStart(2,'0')+' / '+String(N).padStart(2,'0')+'</span></div>'
    + '</section>').join('');
}

function go(i, silent){
  i = Math.max(0, Math.min(N-1, i));
  $$('.slide').forEach((el,k)=>el.classList.toggle('on', k===i));
  cur = i;
  try{ localStorage.setItem('tsv-slide', String(i)); }catch(e){}
  $('.pg').textContent = String(i+1).padStart(2,'0') + ' / ' + String(N).padStart(2,'0');
  $('#track i').style.width = ((i+1)/N*100)+'%';
  for(let k=0;k<N;k++){ const b=$('#fbar'+k); if(b) b.style.width = (k<=i?100:0)+'%'; }
  if(!silent) toast(D[i].eyebrow + ' · ' + D[i].title);
}
function next(){ if(cur<N-1) go(cur+1); else stopAuto(); }
function prev(){ if(cur>0) go(cur-1); }
function toast(s){
  const t=$('#toast'); t.textContent=s; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1700);
}
function stopAuto(){
  autoOn=false; clearInterval(autoTimer); autoTimer=null;
  $('#btnAuto').textContent='▶ 自动播放'; $('#btnAuto').classList.remove('act');
}
function toggleAuto(){
  if(autoOn){ stopAuto(); toast('已暂停自动播放'); return; }
  autoOn=true; $('#btnAuto').textContent='❚❚ 暂停'; $('#btnAuto').classList.add('act');
  autoTimer=setInterval(()=>{ if(cur<N-1) go(cur+1,true); else stopAuto(); }, 13000);
  toast('自动播放：每 13 秒一页');
}

function fs(){
  const el=document.documentElement;
  const entering=!document.body.classList.contains('immersive');
  if(entering){
    document.body.classList.add('immersive');
    $('#btnFs').textContent='退出全屏 F';
    fit(); toast('沉浸模式：画面已铺满窗口（F 或 Esc 退出）');
    try{ const pr = el.requestFullscreen ? el.requestFullscreen() : null;
      if(pr && pr.catch) pr.catch(()=>{}); }catch(e){}
  }else{
    document.body.classList.remove('immersive');
    $('#btnFs').textContent='全屏 F'; fit(); toast('已退出全屏');
    try{ if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen(); }catch(e){}
  }

document.addEventListener('fullscreenchange', ()=>{
  if(!document.fullscreenElement && document.body.classList.contains('immersive')){
    document.body.classList.remove('immersive');
    const b=$('#btnFs'); if(b) b.textContent='全屏 F';
  } fit();
});
document.addEventListener('keydown', e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  const k=e.key;
  const typing=(tag==='input'||tag==='select'||tag==='textarea');
  const navKey=(k.indexOf('Arrow')===0||k===' '||k==='Home'||k==='End'||k==='PageUp'||k==='PageDown');
  if(k==='Escape'){
    if(document.body.classList.contains('dock-on')) dockClose();
    else if(document.body.classList.contains('immersive')) fs();
    return;
  }
  if(typing && (navKey || k.length===1)) return;
  if(k==='ArrowRight'||k===' '||k==='PageDown'){ e.preventDefault(); next(); }
  else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); prev(); }
  else if(k==='f'||k==='F'){ e.preventDefault(); fs(); }
  else if(k==='g'||k==='G'){ e.preventDefault(); toc(); }
  else if(k==='n'||k==='N'){ e.preventDefault(); notesHere(); }
  else if(k==='t'||k==='T'){ e.preventDefault(); notesAll(); }
  else if(k==='p'||k==='P'){ e.preventDefault(); toggleAuto(); }
  else if(k==='?'||k==='h'||k==='H'){ e.preventDefault(); help(); }
  else if(k==='Home'){ e.preventDefault(); go(0); }
  else if(k==='End'){ e.preventDefault(); go(N-1); }
  else if(/^[1-9]$/.test(k)){ go(parseInt(k,10)-1); }
});

/* ---------- 动画 A：to_tsvector 构建流水线（教学示意） ---------- */
const A_STOP = new Set(['the','a','an','on','and','of','to','in','is','at','for','with','or','by','it','this']);
let aStep=0, aTimer=null, aPlaying=false;
const A_STEPS=6;
function aNorm(w){
  let s=w.toLowerCase();
  if(s.endsWith("'s")) s=s.slice(0,-2);
  else if(s.length>3 && s.endsWith('ies')) s=s.slice(0,-3)+'y';
  else if(s.length>3 && s.endsWith('ses')) s=s.slice(0,-2);
  else if(s.length>2 && s.endsWith('s') && !s.endsWith('ss')) s=s.slice(0,-1);
  return s;
}
function aCompute(){
  const raw=(($('#aText')&&$('#aText').value)||'The Fat Rats').trim() || 'The Fat Rats';
  const mode=($('#aCfg')&&$('#aCfg').value)||'english';
  const toks=raw.split(/[^A-Za-z0-9']+/).filter(Boolean);
  const shown=toks.slice(0,9);
  const more=toks.length>9?' …（仅显示前 9 个 token）':'';
  const r1=raw.length>62?raw.slice(0,62)+'…':raw;
  const r2=shown.map((t,i)=>(i+1)+':'+t).join('   ')+more;
  let r3,r4,r5,r6;
  if(mode==='cast'){
    const uniq=[...new Set(toks)].sort();
    r3='跳过：::tsvector 不调用 parser / dictionary';
    r4='跳过：不做停用词过滤与词形归一，保留原大小写';
    r5='按 tsCompareString 排序、去重 → '+uniq.slice(0,8).join('  ')+(uniq.length>8?' …':'');
    r6=uniq.slice(0,9).map(w=>"'"+w+"'").join(' ')+'   （无位置、无权重）';
  }else{
    const kept=shown.map((t,i)=>({w:t,p:i+1})).filter(o=>!A_STOP.has(o.w.toLowerCase()));
    const norm=kept.map(o=>({w:aNorm(o.w),p:o.p}));
    r3='过滤停用词：'+shown.filter(t=>A_STOP.has(t.toLowerCase())).map(t=>t).join('、');
    r3=r3==='过滤停用词：'?'过滤停用词：本句无停用词':r3;
    r4='词形归一：'+kept.map(o=>o.w+'→'+aNorm(o.w)).slice(0,6).join('   ')+
       (kept.some(o=>o.w!==aNorm(o.w))?'':'   （本句无需变化）');
    const merged={};
    norm.forEach(o=>{ (merged[o.w]=merged[o.w]||[]).push(o.p); });
    const keys=Object.keys(merged).sort();
    r5='排序去重、合并位置：'+keys.slice(0,8).map(k=>k+'→['+merged[k].join(',')+']').join('   ');
    r6=keys.map(k=>"'"+k+"':"+merged[k].join(',')).join(' ')||'（全部为停用词，空 tsvector）';
  }
  return [r1,r2,r3,r4,r5,r6];
}
function aFitText(el,s,max,avail){
  const room=avail||930;
  const w=Math.max(9,Math.min(max,room/Math.max(1,[...s].reduce((a,c)=>a+(c.charCodeAt(0)>127?1:0.56),0))));
  el.setAttribute('font-size',w.toFixed(1));
  el.textContent=s;
}
function aPaint(){
  const res=aCompute();
  const mode=($('#aCfg')&&$('#aCfg').value)||'english';
  for(let i=1;i<=A_STEPS;i++){
    const g=$('#aRow'+i); if(!g) continue;
    const active=(i===aStep), done=(i<aStep);
    const box=g.querySelector('.rbox'), lab=g.querySelector('.rlab'), tx=g.querySelector('.rtx');
    box.setAttribute('fill', active?'#F7E9DE':(done?'#E4F0EA':'#FFFFFF'));
    box.setAttribute('stroke', active?'#BE653B':(done?'#2F7A66':'#D9D5CB'));
    box.setAttribute('stroke-width', active?'2':'1');
    lab.setAttribute('fill', active?'#BE653B':(done?'#2F7A66':'#89938F'));
    tx.setAttribute('fill', active?'#1B2B33':(done?'#46585F':'#89938F'));
    tx.setAttribute('opacity', (i<=aStep)?'1':'0.45');
    aFitText(tx,res[i-1],14);
  }
  $$('#animA .stage').forEach((el,i)=>{
    const n=i+1;
    const lit=(aStep===1&&n===1)||(aStep===2&&n===2)||((aStep===3||aStep===4)&&n===3)||
              (aStep===5&&n===4)||(aStep===6&&n===5);
    el.setAttribute('fill',lit?'#245A6B':'#FFFFFF');
    el.setAttribute('stroke',lit?'#245A6B':'#D9D5CB');
  });
  $$('#animA .stx').forEach((el,i)=>{
    const n=i+1;
    const lit=(aStep===1&&n===1)||(aStep===2&&n===2)||((aStep===3||aStep===4)&&n===3)||
              (aStep===5&&n===4)||(aStep===6&&n===5);
    el.setAttribute('fill',lit?'#FFFFFF':'#46585F');
  });
  const out=$('#aOut'); if(!out) return;
  const names=['原始文本','parser 切 token 并记录位置','dictionary 过滤停用词',
               'dictionary 归一词形','make_tsvector 排序去重','最终 tsvector 值'];
  const rawv=(($('#aText')&&$('#aText').value)||'').trim();
  const cjk=/[^\x00-\x7F]/.test(rawv);
  const extra=mode==='cast'?'　｜　当前：直接 cast，不调用配置':'　｜　当前：to_tsvector(english) 教学示意';
  const hint=cjk?'　｜　中文输入不在本示意的分词范围内，请使用对应分词配置':'';
  out.innerHTML='<b>第 '+aStep+' / 6 步 · '+names[aStep-1]+'</b>'+extra+hint;
  out.title=out.textContent;
}
function aPause(){
  aPlaying=false; clearInterval(aTimer); aTimer=null;
  const b=$('#aPlay'); if(b){ b.textContent='▶ 播放'; b.classList.remove('play'); }
}
function aPlay(){
  if(aPlaying){ aPause(); return; }
  aPlaying=true; $('#aPlay').textContent='❚❚ 暂停'; $('#aPlay').classList.add('play');
  if(aStep>=A_STEPS) aStep=0;
  const sp=+(($('#aSpeed')&&$('#aSpeed').value)||900);
  aTimer=setInterval(()=>{ aStep++; aPaint(); if(aStep>=A_STEPS) aPause(); },sp);
}
function aTick(){ aPause(); if(aStep<A_STEPS){ aStep++; aPaint(); } }
function aReset(){ aPause(); aStep=0; aPaint();
  const o=$('#aOut'); if(o){ o.innerHTML='<b>已重置</b>　点播放或单步，观察文本如何变成 lexeme 集合'; o.title=''; } }

/* ---------- 动画 B：GIN 只索引 lexeme，候选必须回表复查 ---------- */
let bStep=0, bTimer=null, bPlaying=false;
const B_STEPS=4;
const B_DOCS=[
  {t:1,v:"'fat':2D 'rat':3D"},
  {t:2,v:"'fat':4D 'rat':6D"},
  {t:3,v:"'fat':2A 'mat':3D"},
  {t:4,v:"'rat':1D 'sun':2D"}
];
const B_KEYS=[{k:'fat',t:[1,2,3]},{k:'rat',t:[1,2,4]},{k:'mat',t:[3]},{k:'sun',t:[4]}];
const B_Q={
  and:{label:'fat & rat', lex:'fat、rat', cand:[1,2], final:[1,2],
       s1:'抽取正向 lexeme：fat、rat',s2:'倒排取交集：TID 1、2',
       s3:'取候选行，准备复查',s4:'@@ 布尔树命中 → 最终 TID 1、2'},
  phrase:{label:'fat <-> rat', lex:'fat、rat', cand:[1,2], final:[1],
       s1:'抽取 lexeme：fat、rat；<-> 需要位置',s2:'倒排取交集：TID 1、2',
       s3:'GIN 无位置 → GIN_MAYBE，回表读 tsvector',s4:'位置 2→3 相邻，4→6 不相邻 → 仅 TID 1'},
  weight:{label:"'fat':A", lex:'fat', cand:[1,2,3], final:[3],
       s1:'抽取 lexeme：fat；:A 需要权重',s2:'倒排取集合：TID 1、2、3',
       s3:'GIN 无权重 → GIN_MAYBE，回表读 tsvector',s4:'仅 TID 3 的 fat 带 A 权重 → TID 3'},
  neg:{label:'!foo', lex:'（无正向词）', cand:[1,2,3,4], final:[1,2,3,4],
       s1:'没有必须正向匹配的词 → GIN_SEARCH_MODE_ALL',s2:'索引无法定位候选，扫描更大范围',
       s3:'逐行访问 heap',s4:'回表判断「不含 foo」→ 示意 4 行全部通过'}
};
function bPaint(){
  const q=B_Q[(($('#bQuery')&&$('#bQuery').value)||'and')];
  $$('#animB .doc').forEach((g,i)=>{
    const t=B_DOCS[i].t;
    const lit=(bStep>=2 && q.cand.indexOf(t)>=0);
    const fin=(bStep>=4 && q.final.indexOf(t)>=0);
    const box=g.querySelector('.dbox');
    box.setAttribute('fill', fin?'#E4F0EA':(lit?'#F7E9DE':'#FFFFFF'));
    box.setAttribute('stroke', fin?'#2F7A66':(lit?'#BE653B':'#D9D5CB'));
    box.setAttribute('stroke-width', (lit||fin)?'2':'1');
  });
  $$('#animB .key').forEach((g,i)=>{
    const k=B_KEYS[i].k, lit=(bStep>=2 && q.lex.indexOf(k)>=0);
    const box=g.querySelector('.kbox');
    box.setAttribute('fill',lit?'#E5EFF0':'#FFFFFF');
    box.setAttribute('stroke',lit?'#245A6B':'#D9D5CB');
    box.setAttribute('stroke-width',lit?'2':'1');
  });
  for(let i=1;i<=B_STEPS;i++){
    const g=$('#bRow'+i); if(!g) continue;
    const active=(i===bStep), done=(i<bStep);
    const box=g.querySelector('.bbox'), tx=g.querySelector('.btx');
    box.setAttribute('fill',active?'#F7E9DE':(done?'#E4F0EA':'#FFFFFF'));
    box.setAttribute('stroke',active?'#BE653B':(done?'#2F7A66':'#D9D5CB'));
    box.setAttribute('stroke-width',active?'2':'1');
    tx.setAttribute('fill',active?'#1B2B33':(done?'#46585F':'#89938F'));
    tx.setAttribute('opacity',(i<=bStep)?'1':'0.4');
    aFitText(tx,q['s'+i],13.2,540);
  }
  const fb=$('#bFinal'), ft=$('#bFinalTx');
  if(fb){ fb.setAttribute('fill',bStep>=4?'#E4F0EA':'#FFFFFF');
    fb.setAttribute('stroke',bStep>=4?'#2F7A66':'#D9D5CB'); }
  if(ft) ft.textContent = bStep>=4 ? ('最终命中 TID：'+q.final.join('、')) : '等待复查结论 …';
  const o=$('#bOut'); if(!o) return;
  const names=['抽取查询 lexeme','倒排表定位候选','Bitmap Heap 访问','heap recheck 完整 @@'];
  o.innerHTML='<b>第 '+bStep+' / 4 步 · '+names[bStep-1]+'</b>　｜　查询 '+q.label;
  o.title=o.textContent;
}
function bPause(){
  bPlaying=false; clearInterval(bTimer); bTimer=null;
  const b=$('#bPlay'); if(b){ b.textContent='▶ 播放'; b.classList.remove('play'); }
}
function bPlay(){
  if(bPlaying){ bPause(); return; }
  bPlaying=true; $('#bPlay').textContent='❚❚ 暂停'; $('#bPlay').classList.add('play');
  if(bStep>=B_STEPS) bStep=0;
  const sp=+(($('#bSpeed')&&$('#bSpeed').value)||1000);
  bTimer=setInterval(()=>{ bStep++; bPaint(); if(bStep>=B_STEPS) bPause(); },sp);
}
function bTick(){ bPause(); if(bStep<B_STEPS){ bStep++; bPaint(); } }
function bReset(){ bPause(); bStep=0; bPaint();
  const o=$('#bOut'); if(o){ o.innerHTML='<b>已重置</b>　换一个查询，看 GIN 什么时候必须回表'; o.title=''; } }

function init(){
  render(); fit();
  let saved=0; try{ saved=parseInt(localStorage.getItem('tsv-slide')||'0',10)||0; }catch(e){}
  go(saved,true);
  $('#btnPrev').onclick=prev; $('#btnNext').onclick=next;
  $('#btnToc').onclick=toc; $('#btnNotes').onclick=notesHere;
  $('#btnAll').onclick=notesAll; $('#btnAuto').onclick=toggleAuto;
  $('#btnFs').onclick=fs; $('#btnHelp').onclick=help;
  $('#dockClose').onclick=dockClose;
  aReset(); bReset();
  ['aText','aCfg','bQuery'].forEach(id=>{
    const el=$('#'+id); if(!el) return;
    el.addEventListener('input',()=>{ aPause(); aStep=0; aPaint(); bPause(); bStep=0; bPaint(); });
    el.addEventListener('change',()=>{ aPause(); aStep=0; aPaint(); bPause(); bStep=0; bPaint(); });
  });
  [['#aPlay',aPlay],['#aTick',aTick],['#aReset',aReset],
   ['#bPlay',bPlay],['#bTick',bTick],['#bReset',bReset]].forEach(p=>{
    const el=$(p[0]); if(el) el.onclick=p[1];
  });
}
document.addEventListener('DOMContentLoaded', init);
</script>
