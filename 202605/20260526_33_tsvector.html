<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数据库筑基课 · tsvector 数据类型｜把自然语言压成可索引的值</title>
<!-- 单文件交付：所有原理图均为现场绘制的内联 SVG，无外部图片、字体、脚本依赖。 -->
<!-- 设计母题：地层剖面 / 工程蓝图。内容按「困境→归一→字节布局→匹配→索引→代价→实践」推演。 -->
<style>
:root{
  --bg:#F7F6F2; --ink:#1B2B33; --ink2:#46585F; --muted:#89938F; --line:#D9D5CB;
  --primary:#245A6B; --prim-l:#E5EFF0; --accent:#BE653B; --acc-l:#F7E9DE;
  --green:#2F7A66; --green-l:#E4F0EA; --gold:#AE8A3E;
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#E9E7E1}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
#viewport{position:absolute;inset:0 0 58px 0;overflow:hidden}
#stage{position:absolute;width:1600px;height:900px;background:var(--bg);
  transform-origin:top left;box-shadow:0 18px 60px rgba(27,43,51,.13);overflow:hidden}
.slide{position:absolute;inset:0;display:none}
.slide.on{display:block;animation:fadein .42s cubic-bezier(.2,.7,.2,1)}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{position:absolute;left:64px;top:44px;font-size:13px;letter-spacing:3.4px;
  color:var(--primary);font-weight:600}
.eyebrow .num{font-family:var(--mono);letter-spacing:1px;color:var(--accent);margin-right:14px}
h1.title{position:absolute;left:64px;top:70px;margin:0;font-family:var(--serif);
  font-size:44px;line-height:1.25;font-weight:700;letter-spacing:1.2px;color:var(--ink)}
.lede{position:absolute;left:64px;top:139px;width:1440px;font-size:19px;color:var(--ink2);
  line-height:1.5;letter-spacing:.3px}
.rule{position:absolute;left:64px;top:181px;width:1472px;height:1px;background:var(--line)}
.figwrap{position:absolute;left:100px;top:198px;width:1400px;height:430px}
svg.figure{display:block;overflow:visible}
svg.figure text{font-family:var(--sans)}
svg.figure text.serif{font-family:var(--serif)}
svg.figure text.mono{font-family:var(--mono)}
.caption{position:absolute;left:100px;top:638px;width:1400px;font-size:13px;
  color:var(--muted);letter-spacing:.4px;line-height:1.5}
.bridge{position:absolute;left:64px;top:706px;width:1472px;font-size:20px;
  color:var(--accent);line-height:1.55;letter-spacing:.4px;padding-left:18px;
  border-left:3px solid var(--accent);font-family:var(--serif)}
.bridge .bk{font-family:var(--sans);font-size:13px;color:var(--muted);
  letter-spacing:2px;display:block;margin-bottom:2px}
.footer{position:absolute;left:64px;top:846px;width:1472px;height:1px;background:var(--line)}
.footer .fl{position:absolute;left:0;top:14px;font-size:12.5px;color:var(--muted);letter-spacing:2px}
.footer .fr{position:absolute;right:0;top:12px;font-family:var(--mono);font-size:14px;color:var(--ink2)}
.footer .fbar{position:absolute;left:0;right:0;top:-1px;height:2px;background:transparent}
.footer .fbar i{display:block;height:2px;background:var(--primary);width:0;transition:width .4s ease}

/* 动画页控件：位于图下方独立条带，绝不覆盖图 */
.ctrls{position:absolute;left:100px;top:638px;width:1400px;height:46px;display:flex;
  align-items:center;gap:10px}
.ctrls label{font-size:13px;color:var(--ink2);white-space:nowrap}
.ctrls select,.ctrls input[type=text]{font-family:var(--sans);font-size:13px;color:var(--ink);
  background:#fff;border:1px solid var(--line);border-radius:4px;padding:5px 8px;outline:none}
.ctrls input[type=text]{width:230px;font-family:var(--mono)}
.ctrls select{max-width:210px}
.ctrls input[type=range]{width:96px;padding:0;accent-color:var(--primary);border:none;background:transparent}
.ctrls .btn{min-height:30px;padding:5px 13px;border:1px solid var(--primary);border-radius:4px;
  background:#fff;color:var(--primary);font-size:13px;cursor:pointer;font-family:var(--sans);white-space:nowrap}
.ctrls .btn.play{background:var(--primary);color:#fff}
.ctrls .btn:hover{filter:brightness(.94)}
.ctrls .out{font-size:13px;color:var(--ink2);margin-left:auto;min-width:0;flex:1;
  max-width:460px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrls .out b{color:var(--accent);font-weight:600}

/* 页内开窗：讲稿 / 全文 / 目录 / 帮助，全部在舞台内，不弹浏览器窗口 */
.dock{position:absolute;left:992px;top:198px;width:544px;height:622px;background:#FFFFFF;
  border:1px solid var(--line);box-shadow:-10px 0 30px rgba(27,43,51,.08);
  display:none;flex-direction:column;z-index:20}
body.dock-on .dock{display:flex}
.dock .dhead{height:54px;flex:none;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding:0 18px;background:#FCFBF8}
.dock .dhead .dt{font-family:var(--serif);font-size:19px;color:var(--ink);flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock .dhead .dk{font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:1px}
.dock .dhead button{background:#fff;border:1px solid var(--line);border-radius:4px;
  padding:5px 10px;font-size:12.5px;cursor:pointer;color:var(--ink2);font-family:var(--sans)}
.dock .dhead button:hover{border-color:var(--primary);color:var(--primary)}
.dock .dbody{overflow:auto;padding:16px 26px 30px;flex:1}
.dock h2{margin:2px 0 6px;font-family:var(--serif);font-size:25px;color:var(--ink)}
.dock .psub{font-size:12.5px;color:var(--muted);margin-bottom:16px;letter-spacing:1px}
.dock .sec{border-top:1px solid var(--line);padding:14px 0 16px}
.dock .sec:first-of-type{border-top:none}
.dock .sec .sn{font-family:var(--mono);font-size:11.5px;color:var(--accent);letter-spacing:1px}
.dock .sec h3{margin:5px 0 8px;font-family:var(--serif);font-size:18px;color:var(--primary)}
.dock .sec p{margin:0;font-size:14.5px;line-height:1.9;color:var(--ink2);letter-spacing:.2px}
.dock .sec .nx{font-family:var(--serif);color:var(--accent);font-size:14px;margin-top:9px}
.dock .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.dock .grid a{display:block;padding:10px 11px;border:1px solid var(--line);border-radius:5px;
  background:#FCFBF8;text-decoration:none;color:var(--ink);cursor:pointer;transition:.2s}
.dock .grid a:hover{border-color:var(--primary);background:var(--prim-l)}
.dock .grid a .gn{font-family:var(--mono);font-size:11px;color:var(--accent)}
.dock .grid a .gt{font-family:var(--serif);font-size:14.5px;line-height:1.4;display:block;margin-top:3px}
.dock .keys{display:grid;grid-template-columns:1fr;gap:9px;font-size:14px;line-height:1.7}
.dock .keys kbd{font-family:var(--mono);background:#FCFBF8;border:1px solid var(--line);
  border-bottom-width:2px;border-radius:4px;padding:2px 7px;color:var(--primary);margin-right:8px}
body.dock-on .figwrap{width:872px;display:flex;align-items:center}
body.dock-on svg.figure{width:872px;height:auto}
body.dock-on .caption{width:872px}
body.dock-on .ctrls{width:872px;gap:7px}
body.dock-on .ctrls label{font-size:12px}
body.dock-on .ctrls .btn{padding:4px 9px;font-size:12px}
body.dock-on .ctrls input[type=text]{width:140px}
body.dock-on .ctrls input[type=range]{width:70px}
body.dock-on .ctrls select{max-width:170px}
body.dock-on .ctrls .out{display:none}
body.dock-on .bridge{width:872px;top:726px;font-size:18px}
body.dock-on .footer{width:872px}

/* 底部外壳（不参与画面缩放） */
.chrome{position:fixed;left:0;right:0;bottom:0;height:58px;background:#FCFBF8;
  border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;
  padding:0 18px;z-index:40;font-size:13px;color:var(--ink2)}
.chrome .sep{width:1px;height:22px;background:var(--line);margin:0 6px}
.chrome button{font-family:var(--sans);font-size:13px;color:var(--ink2);background:transparent;
  border:1px solid transparent;border-radius:5px;padding:7px 11px;cursor:pointer;white-space:nowrap}
.chrome button:hover{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome button.act{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome button.k{font-family:var(--mono);font-size:12px;color:var(--muted)}
.chrome .pg{font-family:var(--mono);font-size:14px;color:var(--ink);min-width:76px;text-align:center}
.chrome .track{flex:1;height:3px;background:var(--line);border-radius:3px;margin:0 12px;position:relative}
.chrome .track i{position:absolute;left:0;top:0;height:3px;background:var(--primary);border-radius:3px;transition:width .35s}
.chrome .hint{font-size:12px;color:var(--muted);white-space:nowrap}
body.immersive #viewport{inset:0}
body.immersive .chrome{display:none}
.toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);background:var(--ink);
  color:#fff;font-size:13px;padding:9px 16px;border-radius:5px;opacity:0;transition:.3s;z-index:80;pointer-events:none}
.toast.on{opacity:1}
@media print{.chrome,.toast{display:none!important}#viewport{position:static}
  #stage{position:static;transform:none!important;box-shadow:none}
  .slide{display:block!important;page-break-after:always;position:relative;height:900px}
  .dock{display:none!important}}
</style>
</head>
<body>
<div id="viewport"><div id="stage">
  <div id="slides"></div>
  <aside class="dock" id="dock">
    <div class="dhead"><span class="dk" id="dockKey">N · 本页讲稿</span>
      <span class="dt" id="dockTitle">讲稿</span>
      <button id="dockClose">关闭 ✕</button></div>
    <div class="dbody" id="dockBody"></div>
  </aside>
</div></div>
<div class="chrome">
  <button id="btnPrev">← 上一页</button>
  <button id="btnNext">下一页 →</button>
  <span class="pg">01 / 24</span>
  <div class="track" id="track"><i></i></div>
  <div class="sep"></div>
  <button id="btnToc">目录 G</button>
  <button id="btnNotes">本页讲稿 N</button>
  <button id="btnAll">全文讲稿 T</button>
  <button id="btnAuto">▶ 自动播放</button>
  <button id="btnFs">全屏 F</button>
  <button id="btnHelp" class="k">? 快捷键</button>
</div>
<div class="toast" id="toast"></div>
<script>
const D = [{"eyebrow":"开场 · 数据类型与算子","title":"tsvector：把自然语言压成可索引的值","lede":"业务系统里的搜索，卡在同一个地方：库里存的是自然语言，数据库会做的却是字符串比较。这一场把这个落差剖开。","caption":"图 01　左边是日常看到的数据库输入，右边是本场的推演剖面：越往下越贴近实现，越往上越贴近业务。","bridge":"先不急着定义类型。我想从你我都写过的那条 LIKE 讲起，因为「为什么不够」比「它是什么」更能说明它为什么长成这样。","notes":"大家好，这一节讲 PostgreSQL 全文检索里最基础、也最容易被跳过的一个类型：tsvector。我不想一上来就念定义，我们先看一个真实场景：用户要搜文章、商品、工单、日志、简历、知识库，而数据库里存的是自然语言文本。你会写 LIKE '%数据库%'，它能跑，但它只是在字符串里找子串。它不懂词形归一，不懂停用词，不懂词距，更不懂标题比正文重要。于是今天这一场，我不按文档目录讲，我按一条因果链讲：从 LIKE 的困境开始，看 PostgreSQL 怎么把文本预处理成一个结构化值，再看这个值的字节怎么摆、查询怎么匹配、索引为什么只帮一半忙，最后算清收益和代价。这七层剖面，从上到下，越往下越贴近实现。等走完一遍，你会发现 tsvector 不是一个新的字符串类型，它是数据库和自然语言之间的一道翻译层。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20\" y=\"20\" width=\"420\" height=\"390\" rx=\"6\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1\" /><text x=\"230\" y=\"90\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"34.0\" fill=\"#FFFFFF\" font-weight=\"700\" >自然语言文档</text><text x=\"230\" y=\"134\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"20.0\" fill=\"#CFE0DC\" font-weight=\"400\" >&#x27;The Fat Rats&#x27;</text><line x1=\"70\" y1=\"164\" x2=\"390\" y2=\"164\" stroke=\"#74A5AD\" stroke-width=\"1.2\"/><text x=\"230\" y=\"212\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"21.0\" fill=\"#FFFFFF\" font-weight=\"600\" >用户想搜的是「意思」</text><text x=\"230\" y=\"246\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"21.0\" fill=\"#FFFFFF\" font-weight=\"600\" >数据库只拿到一串字符</text><line x1=\"70\" y1=\"276\" x2=\"390\" y2=\"276\" stroke=\"#74A5AD\" stroke-width=\"1.2\"/><text x=\"230\" y=\"316\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.5\" fill=\"#A4C4C6\" font-weight=\"400\" >LIKE 能找子串</text><text x=\"230\" y=\"340\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.5\" fill=\"#A4C4C6\" font-weight=\"400\" >却找不出 rats 就是 rat</text><text x=\"230\" y=\"382\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#7BA6AF\" font-weight=\"400\" >数据类型与算子 · 全文检索基础</text><text x=\"470\" y=\"28\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"600\" >这一场，从上到下剖七层</text><line x1=\"454\" y1=\"62\" x2=\"454\" y2=\"382\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><rect x=\"470\" y=\"40\" width=\"910\" height=\"46\" rx=\"3\" fill=\"#EBF1EE\" stroke=\"#EBF1EE\" stroke-width=\"1\" /><line x1=\"454\" y1=\"63\" x2=\"470\" y2=\"63\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><text x=\"490\" y=\"69\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"700\" >① 困境</text><text x=\"650\" y=\"69\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#46585F\" font-weight=\"400\" >LIKE 找的是子串，不是语义</text><rect x=\"470\" y=\"93\" width=\"910\" height=\"46\" rx=\"3\" fill=\"#CFE0DC\" stroke=\"#CFE0DC\" stroke-width=\"1\" /><line x1=\"454\" y1=\"116\" x2=\"470\" y2=\"116\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><text x=\"490\" y=\"122\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"700\" >② 归一</text><text x=\"650\" y=\"122\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#46585F\" font-weight=\"400\" >parser 与 dictionary 把 token 变成 lexeme</text><rect x=\"470\" y=\"146\" width=\"910\" height=\"46\" rx=\"3\" fill=\"#A4C4C6\" stroke=\"#A4C4C6\" stroke-width=\"1\" /><line x1=\"454\" y1=\"169\" x2=\"470\" y2=\"169\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><text x=\"490\" y=\"175\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"700\" >③ 结构</text><text x=\"650\" y=\"175\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#46585F\" font-weight=\"400\" >排序去重的 WordEntry[]，外加位置与权重</text><rect x=\"470\" y=\"199\" width=\"910\" height=\"46\" rx=\"3\" fill=\"#74A5AD\" stroke=\"#74A5AD\" stroke-width=\"1\" /><line x1=\"454\" y1=\"222\" x2=\"470\" y2=\"222\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><text x=\"490\" y=\"228\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#FFFFFF\" font-weight=\"700\" >④ 匹配</text><text x=\"650\" y=\"228\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#EBF1EE\" font-weight=\"400\" >@@ 执行的是一棵 tsquery 树</text><rect x=\"470\" y=\"252\" width=\"910\" height=\"46\" rx=\"3\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1\" /><line x1=\"454\" y1=\"275\" x2=\"470\" y2=\"275\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><text x=\"490\" y=\"281\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#FFFFFF\" font-weight=\"700\" >⑤ 索引</text><text x=\"650\" y=\"281\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#EBF1EE\" font-weight=\"400\" >GIN 只索引 lexeme；GiST 把文档压成签名</text><rect x=\"470\" y=\"305\" width=\"910\" height=\"46\" rx=\"3\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1\" /><line x1=\"454\" y1=\"328\" x2=\"470\" y2=\"328\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><text x=\"490\" y=\"334\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#FFFFFF\" font-weight=\"700\" >⑥ 代价</text><text x=\"650\" y=\"334\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#EBF1EE\" font-weight=\"400\" >写放大、空间放大、回表复查</text><rect x=\"470\" y=\"358\" width=\"910\" height=\"46\" rx=\"3\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1\" /><line x1=\"454\" y1=\"381\" x2=\"470\" y2=\"381\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><text x=\"490\" y=\"387\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#FFFFFF\" font-weight=\"700\" >⑦ 边界</text><text x=\"650\" y=\"387\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#EBF1EE\" font-weight=\"400\" >什么时候该把搜索交给专门的搜索系统</text></svg>","ctrl":null},{"eyebrow":"困境 · 为什么字符串不够用","title":"用户要「搜」，数据库只给它一串字符","lede":"三种常见绕法都能跑，但都没解决同一件事：把自然语言变成数据库能匹配、能索引、能估算选择率的值。","caption":"图 02　三条常见路径各自省了什么、又欠了什么；最下面一行是它们共同欠下的语义。","bridge":"既然缺口是「语义没进数据库」，那 PostgreSQL 的办法就很自然：把搜索这件事拆成两次预处理，而不是硬凑一条更长的 LIKE。","notes":"我们先把现有的三条路摆平。第一条，LIKE 加正则。它的好处是不用引入任何新东西，写起来最快；代价是普通 B-tree 基本帮不上忙，它只认子串，不认词形，更谈不上「两个词同时出现、还要离得近」。第二条，我在应用层自己分词，把结果存成 text 数组，再配一个数组 GIN。这条路模型很直观，也能用上索引，可是一旦业务问「标题里命中是不是该排前面」「这两个词是不是相邻」，你就得自己发明一套位置、权重和排名语义，而且它和数据库的优化器、统计信息毫无关系。第三条，把搜索交给专门的搜索系统，功能当然最完整，但你要负责跨系统同步、一致性、事务边界，还有一整套运维。你看，这三条路的共同缺口是同一组东西：词形归一、停用词、位置词距、权重、排名，以及把「包含多个词的文档集合」变成高效的索引访问。缺口既然一致，解法也就一致——先别谈索引，先把文档结构化。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20\" y=\"12\" width=\"1360\" height=\"56\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1\" /><text x=\"40\" y=\"47\" class=\"sv s\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#BE653B\" font-weight=\"600\" >用户说：搜「数据库 性能」—— 要的是语义、词距、权重和排序</text><text x=\"1360\" y=\"47\" class=\"sv s\" text-anchor=\"end\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"400\" >而库里只有 text 列</text><line x1=\"240\" y1=\"68\" x2=\"240\" y2=\"86\" stroke=\"#245A6B\" stroke-width=\"1.5\"/><rect x=\"20\" y=\"86\" width=\"440\" height=\"196\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"36\" y=\"112\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"700\" >LIKE / 正则</text><line x1=\"36\" y1=\"124\" x2=\"444\" y2=\"124\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"36\" y=\"152\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"500\" >简单，不需要额外类型</text><text x=\"36\" y=\"184\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >通常难以利用普通 B-tree</text><text x=\"36\" y=\"216\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >不做词形归一、停用词</text><text x=\"36\" y=\"248\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >多词组合与排序能力弱</text><line x1=\"700\" y1=\"68\" x2=\"700\" y2=\"86\" stroke=\"#245A6B\" stroke-width=\"1.5\"/><rect x=\"480\" y=\"86\" width=\"440\" height=\"196\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"496\" y=\"112\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"700\" >应用层分词后存数组</text><line x1=\"496\" y1=\"124\" x2=\"904\" y2=\"124\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"496\" y=\"152\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"500\" >模型直观，可用数组 GIN</text><text x=\"496\" y=\"184\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >分词规则自己维护</text><text x=\"496\" y=\"216\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >缺位置、短语距离与权重</text><text x=\"496\" y=\"248\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >排名函数没有统一语义</text><line x1=\"1160\" y1=\"68\" x2=\"1160\" y2=\"86\" stroke=\"#245A6B\" stroke-width=\"1.5\"/><rect x=\"940\" y=\"86\" width=\"440\" height=\"196\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"956\" y=\"112\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"700\" >外部搜索系统</text><line x1=\"956\" y1=\"124\" x2=\"1364\" y2=\"124\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"956\" y=\"152\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"500\" >功能完整，相关性调优强</text><text x=\"956\" y=\"184\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >需要跨系统同步链路</text><text x=\"956\" y=\"216\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >一致性与事务边界变复杂</text><text x=\"956\" y=\"248\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >多一套运维成本</text><rect x=\"20\" y=\"300\" width=\"1360\" height=\"58\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"40\" y=\"336\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"700\" >共同缺口</text><text x=\"190\" y=\"336\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#46585F\" font-weight=\"400\" >词形归一 · 停用词 · 位置与词距 · 标题权重 · 排名 · 把「多词文档集合」变成高效索引访问</text><rect x=\"20\" y=\"372\" width=\"1360\" height=\"46\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1\" /><text x=\"40\" y=\"401\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#AE8A3E\" font-weight=\"600\" >所以 PostgreSQL 的第一步不是建索引，而是先把文档「结构化」——这就是 tsvector 的起点。</text></svg>","ctrl":null},{"eyebrow":"拆两步 · 文档与查询各自预处理","title":"全文检索的第一步，是把问题拆成两半","lede":"文档预处理成 tsvector，查询预处理成 tsquery；中间的 @@ 只是把两者对上，不再碰原文。","caption":"图 03　两条预处理管线汇合到 @@；官方文档把这两个类型称为 PostgreSQL 原生全文检索的基础数据模型。","bridge":"拆开之后，最该先看的就是文档那一半：一句话进去，究竟发生了什么，才让三个词只剩两个？","notes":"PostgreSQL 的处理方式很克制，它没有造一个「更聪明的字符串」，而是把搜索拆成两次预处理。文档这一侧，to_tsvector 带着一个 text search configuration，把原文过一遍 parser 和 dictionary，产出一个 tsvector：一组排序、去重的 lexeme，可以带位置，也可以带权重。这个值是预先算好的、存在表里的，跟原文列并存。查询这一侧，用户的输入也要过一遍，变成一棵 tsquery 树：词项之间是与、或、非、短语距离、前缀、权重限制这些操作符。生产里我会用 plainto_tsquery、phraseto_tsquery 或者 websearch_to_tsquery 来接用户输入，绝不让普通用户直接面对 to_tsquery 的语法。最后，@@ 把两边接起来：它不比较字符串，它是在一组有序词项上执行一棵查询树。这个拆分特别重要，因为它把「分词该什么时候做」这个最容易扯皮的问题提前定死了——只在写入文档和构造查询的时候做，查询执行阶段不再碰原文。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><text x=\"20\" y=\"24\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"700\" >文档侧：一次预处理，长期复用</text><rect x=\"20\" y=\"40\" width=\"300\" height=\"88\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"170.0\" y=\"76.85\" class=\"sv s\" text-anchor=\"middle\" font-size=\"19.0\" fill=\"#1B2B33\" font-weight=\"600\" >原始文档</text><text x=\"170.0\" y=\"100.25\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >title / body / jsonb</text><line x1=\"320\" y1=\"84\" x2=\"361.6\" y2=\"84\" stroke=\"#245A6B\" stroke-width=\"2.0\"/><polygon points=\"368,84 360,79.6 360,88.4\" fill=\"#245A6B\"/><rect x=\"368\" y=\"40\" width=\"360\" height=\"88\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.1\" /><text x=\"548.0\" y=\"77.125\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"600\" >to_tsvector(config, text)</text><text x=\"548.0\" y=\"99.625\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >parser + dictionary + make_tsvector()</text><line x1=\"728\" y1=\"84\" x2=\"769.6\" y2=\"84\" stroke=\"#245A6B\" stroke-width=\"2.0\"/><polygon points=\"776,84 768,79.6 768,88.4\" fill=\"#245A6B\"/><rect x=\"776\" y=\"40\" width=\"300\" height=\"88\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1.1\" /><text x=\"926.0\" y=\"77.125\" class=\"sv s\" text-anchor=\"middle\" font-size=\"19.0\" fill=\"#2F7A66\" font-weight=\"600\" >tsvector</text><text x=\"926.0\" y=\"99.625\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >排序去重 lexeme + 可选位置 / 权重</text><text x=\"20\" y=\"164\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"700\" >查询侧：把用户输入变成一棵查询树</text><rect x=\"20\" y=\"180\" width=\"300\" height=\"88\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"170.0\" y=\"217.125\" class=\"sv s\" text-anchor=\"middle\" font-size=\"19.0\" fill=\"#1B2B33\" font-weight=\"600\" >用户输入</text><text x=\"170.0\" y=\"239.625\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >不要直接拼 to_tsquery 语法</text><line x1=\"320\" y1=\"224\" x2=\"361.6\" y2=\"224\" stroke=\"#245A6B\" stroke-width=\"2.0\"/><polygon points=\"368,224 360,219.6 360,228.4\" fill=\"#245A6B\"/><rect x=\"368\" y=\"180\" width=\"360\" height=\"88\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.1\" /><text x=\"548.0\" y=\"217.125\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.5\" fill=\"#245A6B\" font-weight=\"600\" >plain / phrase / websearch_to_tsquery</text><text x=\"548.0\" y=\"239.625\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >抽 lexeme，构造逻辑与短语操作符</text><line x1=\"728\" y1=\"224\" x2=\"769.6\" y2=\"224\" stroke=\"#245A6B\" stroke-width=\"2.0\"/><polygon points=\"776,224 768,219.6 768,228.4\" fill=\"#245A6B\"/><rect x=\"776\" y=\"180\" width=\"300\" height=\"88\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1.1\" /><text x=\"926.0\" y=\"217.125\" class=\"sv s\" text-anchor=\"middle\" font-size=\"19.0\" fill=\"#2F7A66\" font-weight=\"600\" >tsquery</text><text x=\"926.0\" y=\"239.625\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >lexeme +  &amp;  |  !  &lt;-&gt;  :*  :AB</text><path d=\"M1076,84 L1250,84 L1250,110\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><line x1=\"1250\" y1=\"96\" x2=\"1250\" y2=\"103.6\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"1250,110 1245.6,102 1254.4,102\" fill=\"#245A6B\"/><path d=\"M1076,224 L1250,224 L1250,220\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><line x1=\"1250\" y1=\"234\" x2=\"1250\" y2=\"226.4\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"1250,220 1245.6,228 1254.4,228\" fill=\"#245A6B\"/><rect x=\"1120\" y=\"110\" width=\"260\" height=\"110\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.1\" /><text x=\"1250.0\" y=\"158.125\" class=\"sv s\" text-anchor=\"middle\" font-size=\"21.0\" fill=\"#BE653B\" font-weight=\"600\" >@@ 操作符</text><text x=\"1250.0\" y=\"180.625\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >在有序 lexeme 上执行 TS_execute()</text><path d=\"M1120,165 L745,165 L745,312\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><line x1=\"745\" y1=\"298\" x2=\"745\" y2=\"305.6\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"745,312 740.6,304 749.4,304\" fill=\"#245A6B\"/><rect x=\"20\" y=\"312\" width=\"1360\" height=\"62\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#F1EFE9\" stroke-width=\"1.0\" /><text x=\"38\" y=\"349.3\" class=\"sv s\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#245A6B\" font-weight=\"600\" >结果</text><text x=\"186\" y=\"348.25\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#46585F\" font-weight=\"400\" >WHERE search_tsv @@ query  →  ts_rank(...)  →  ORDER BY rank DESC</text><text x=\"20\" y=\"408\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#89938F\" font-weight=\"400\" >关键：两个类型各自预处理，@@ 不比较字符串，它只负责在结构化值上执行查询树。</text></svg>","ctrl":null},{"eyebrow":"第一眼 · 一句话怎么变成值","title":"一句话进去，三个词只剩两个","lede":"典型输出是 'fat':2 'rat':3：停用词消失、复数归一，位置却照着原文的词序保留。","caption":"图 04　以原文示例 'The Fat Rats' 逐个 token 拆解；输出为文档中的典型示例，非本地实测结果。","bridge":"这个例子看着简单，其实已经把 tsvector 的定义说完了：它是一组排好队、去过重的词项，还能挂两类附加信息。","notes":"我们拿素材里那句最经典的话看一遍：The Fat Rats。第一个词 The，被 english 配置判成停用词，直接不产生 lexeme，但它仍然占住原文的位置 1。第二个词 Fat，大小写归一成 fat，词形没变化，位置是 2。第三个词 Rats，复数被归一成 rat，位置是 3。所以最后得到的不是 'fat':1 'rat':2，而是 'fat':2 'rat':3——冒号后面记的是源词在原文里的位置，不是结果里的序号，这一点后面讲短语查询时特别关键。更重要的是，此时用户查 fat & rat，匹配的已经不是字符串，而是归一化之后的词项集合：rats、rat、RAT 都在同一个 lexeme 下。到这里我们要问一句：这些归一动作，到底是类型干的，还是别的什么东西干的？先记住这个问题，因为它就是第一个大坑。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20\" y=\"14\" width=\"1360\" height=\"62\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#F1EFE9\" stroke-width=\"1\" /><text x=\"40\" y=\"54\" class=\"sv mono\" text-anchor=\"start\" font-size=\"23.0\" fill=\"#1B2B33\" font-weight=\"600\" >原文  &#x27;The Fat Rats&#x27;</text><text x=\"1360\" y=\"54\" class=\"sv s\" text-anchor=\"end\" font-size=\"15.0\" fill=\"#89938F\" font-weight=\"400\" >词序位置：1 / 2 / 3</text><path d=\"M240,76 L240,96 L1160,96\" fill=\"none\" stroke=\"#7BA6AF\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><line x1=\"240\" y1=\"96\" x2=\"240\" y2=\"112\" stroke=\"#7BA6AF\" stroke-width=\"1.5\"/><rect x=\"20\" y=\"112\" width=\"440\" height=\"152\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1\" /><text x=\"40\" y=\"148\" class=\"sv mono\" text-anchor=\"start\" font-size=\"25.0\" fill=\"#BE653B\" font-weight=\"700\" >The</text><text x=\"440\" y=\"148\" class=\"sv s\" text-anchor=\"end\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"400\" >位置 1</text><line x1=\"40\" y1=\"160\" x2=\"440\" y2=\"160\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"40\" y=\"186\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >english 配置判为停用词</text><text x=\"40\" y=\"210\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >不产生 lexeme</text><text x=\"40\" y=\"234\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >但仍占住原文位置</text><line x1=\"700\" y1=\"96\" x2=\"700\" y2=\"112\" stroke=\"#7BA6AF\" stroke-width=\"1.5\"/><rect x=\"480\" y=\"112\" width=\"440\" height=\"152\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1\" /><text x=\"500\" y=\"148\" class=\"sv mono\" text-anchor=\"start\" font-size=\"25.0\" fill=\"#2F7A66\" font-weight=\"700\" >Fat</text><text x=\"900\" y=\"148\" class=\"sv s\" text-anchor=\"end\" font-size=\"14.0\" fill=\"#2F7A66\" font-weight=\"400\" >位置 2</text><line x1=\"500\" y1=\"160\" x2=\"900\" y2=\"160\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"500\" y=\"186\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >大小写归一为 fat</text><text x=\"500\" y=\"210\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >词形本身不变</text><text x=\"500\" y=\"234\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >位置沿用原文的 2</text><line x1=\"1160\" y1=\"96\" x2=\"1160\" y2=\"112\" stroke=\"#7BA6AF\" stroke-width=\"1.5\"/><rect x=\"940\" y=\"112\" width=\"440\" height=\"152\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1\" /><text x=\"960\" y=\"148\" class=\"sv mono\" text-anchor=\"start\" font-size=\"25.0\" fill=\"#2F7A66\" font-weight=\"700\" >Rats</text><text x=\"1360\" y=\"148\" class=\"sv s\" text-anchor=\"end\" font-size=\"14.0\" fill=\"#2F7A66\" font-weight=\"400\" >位置 3</text><line x1=\"960\" y1=\"160\" x2=\"1360\" y2=\"160\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"960\" y=\"186\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >复数归一为 rat</text><text x=\"960\" y=\"210\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >rats 与 rat 合并成同一个词项</text><text x=\"960\" y=\"234\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >位置沿用原文的 3</text><rect x=\"20\" y=\"282\" width=\"1360\" height=\"66\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"40\" y=\"324\" class=\"sv mono\" text-anchor=\"start\" font-size=\"21.0\" fill=\"#245A6B\" font-weight=\"600\" >to_tsvector(&#x27;english&#x27;, &#x27;The Fat Rats&#x27;)  →  &#x27;fat&#x27;:2 &#x27;rat&#x27;:3</text><text x=\"20\" y=\"382\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#46585F\" font-weight=\"400\" >The 被删掉、Rats 变成 rat，位置却仍是 2 和 3 —— 位置记的是原文词序，不是结果里的序号。</text><text x=\"20\" y=\"410\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#89938F\" font-weight=\"400\" >于是 to_tsquery(&#x27;english&#x27;, &#x27;fat &amp; rat&#x27;) 匹配的是归一化词项集合，不是任何子串。</text></svg>","ctrl":null},{"eyebrow":"定义 · 它到底是什么","title":"tsvector 不是字符串，是一组排好队的 lexeme","lede":"官方文档的定义很直接：为全文检索优化过的文档，值是排序后的不同 lexeme 列表，可附位置与 A/B/C/D 权重。","caption":"图 05　一个带位置与权重的 tsvector 值被拆成三段：词项、位置、权重；D 是默认权重。","bridge":"定义里最容易被忽略的是那句「类型本身不分词」。下一页我们让流水线动起来，亲眼看看归一究竟发生在哪一步。","notes":"把这句话拆开：tsvector 的值，是一个排序后的、不重复的 lexeme 列表。lexeme 是归一化过的词，目的是把同一个词的不同形式合并起来，这样检索的时候才不会因为单复数、时态、大小写漏掉文档。每个 lexeme 可以挂两类信息。一类是位置，源词在文档里的位置，范围是 1 到 16383，短语、邻近度和 ranking 都靠它；另一类是权重，A、B、C、D 四档，常用来表达标题、摘要、正文、标签的相对重要性，D 是默认值。看这个例子：'a:1A fat:2B,4C cat:5D'，fat 在位置 2 是 B 权重、在位置 4 是 C 权重，同一个词项能带多个位置和不同权重。但请一定记住定义里没有的那一半：tsvector 这个类型自己不负责分词和归一。你直接写 'The Fat Rats'::tsvector，它只会老老实实接受这些词项；真正去调用 parser 和 dictionary 的，是 to_tsvector(config, text)、jsonb_to_tsvector 这些函数。换句话说，语义是配置给的，不是类型给的。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20\" y=\"14\" width=\"1360\" height=\"60\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"40\" y=\"53\" class=\"sv mono\" text-anchor=\"start\" font-size=\"23.0\" fill=\"#1B2B33\" font-weight=\"600\" >&#x27;a:1A fat:2B,4C cat:5D&#x27;::tsvector</text><text x=\"1360\" y=\"53\" class=\"sv s\" text-anchor=\"end\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >取自素材 6.1 的类型行为示例</text><path d=\"M240,74 L240,94 L1160,94\" fill=\"none\" stroke=\"#7BA6AF\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><line x1=\"240\" y1=\"94\" x2=\"240\" y2=\"110\" stroke=\"#7BA6AF\" stroke-width=\"1.5\"/><rect x=\"20\" y=\"110\" width=\"440\" height=\"132\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"40\" y=\"142\" class=\"sv serif\" text-anchor=\"start\" font-size=\"21.0\" fill=\"#245A6B\" font-weight=\"700\" >lexeme</text><text x=\"440\" y=\"142\" class=\"sv s\" text-anchor=\"end\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"400\" >已归一的词项</text><line x1=\"40\" y1=\"154\" x2=\"440\" y2=\"154\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"40\" y=\"180\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >a、fat、cat</text><text x=\"40\" y=\"202\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" \" y=\"224\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >不写位置时无法带权重</text><text x=\"20\" y=\"274\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"600\" >权重的四档，常用来表达字段的相对重要性</text><rect x=\"20\" y=\"286\" width=\"880\" height=\"28\" rx=\"3\" fill=\"#74A5AD\" stroke=\"#74A5AD\" stroke-width=\"1\" /><text x=\"36\" y=\"305\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#FFFFFF\" font-weight=\"700\" >A</text><text x=\"76\" y=\"305\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"400\" >标题</text><rect x=\"20\" y=\"318\" width=\"880\" height=\"28\" rx=\"3\" fill=\"#A4C4C6\" stroke=\"#A4C4C6\" stroke-width=\"1\" /><text x=\"36\" y=\"337\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#FFFFFF\" font-weight=\"700\" >B</text><text x=\"76\" y=\"337\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"400\" >摘要</text><rect x=\"20\" y=\"350\" width=\"880\" height=\"28\" rx=\"3\" fill=\"#CFE0DC\" stroke=\"#CFE0DC\" stroke-width=\"1\" /><text x=\"36\" y=\"369\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"700\" >C</text><text x=\"76\" y=\"369\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\" >正文</text><rect x=\"20\" y=\"382\" width=\"880\" height=\"28\" rx=\"3\" fill=\"#EBF1EE\" stroke=\"#EBF1EE\" stroke-width=\"1\" /><text x=\"36\" y=\"401\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"700\" >D</text><text x=\"76\" y=\"401\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\" >默认值 · 未显式标注时按 D</text><rect x=\"920\" y=\"286\" width=\"460\" height=\"124\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1\" /><text x=\"940\" y=\"316\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#BE653B\" font-weight=\"700\" >类型本身不负责分词</text><text x=\"940\" y=\"346\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >直接写 ::tsvector 只接受这些词项；</text><text x=\"940\" y=\"368\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >真正调用 parser 与 dictionary 的是</text><text x=\"940\" y=\"390\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >to_tsvector(config, text) 等函数。</text></svg>","ctrl":null},{"eyebrow":"动画演示 · 构建流水线（可交互）","title":"谁在做归一？不是类型，是 to_tsvector 的配置","lede":"改一句输入、切换 cast 与 english，按播放或单步，看文本怎么被 parser、dictionary、make_tsvector() 逐段改写。","caption":"","bridge":"既然分工看清楚了，我们就可以把最容易踩的那个坑单独拎出来：把 cast 当成分词器，究竟会错在哪。","notes":"这一页请动手。上面五个框是源码里的构建路径：原始文本先进 parser 切出 token 并记录位置，再由 text search configuration 指定的 dictionary 做归一、过滤停用词，最后 make_tsvector 排序、去重、合并位置，写出紧凑的 tsvector。下面六行是同一句话在每一步的样子。你可以改输入框里的英文，也可以把「方式」切到直接 cast，再按播放或单步，对比两条路的差别：走配置那条路，The 会被丢掉、Rats 会变成 rat；走直接 cast 那条路，parser 和 dictionary 两步都被跳过，只剩下排序去重，词还是原来的样子。这里要坦白一句：页面里的归一逻辑是教学示意，只处理英文词、停用词表和简易复数规则，不代表 PostgreSQL english 字典的完整行为，真实输出由你选的 text search config 决定。但它足够说明分工——归一发生在函数调用里，不发生在类型里。所以 tsvector 不是原文，它只是为检索服务的一个派生表示；原文列必须留着，字段一改，派生值和相关索引都得跟着维护。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" id=\"animA\"><rect x=\"20\" y=\"10\" width=\"256\" height=\"66\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" class=\"stage\"/><text x=\"148\" y=\"50\" class=\"sv stx\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#46585F\" font-weight=\"600\" >文本 text</text><line x1=\"276\" y1=\"43\" x2=\"290.4\" y2=\"43\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"296,43 289,39.15 289,46.85\" fill=\"#245A6B\"/><rect x=\"296\" y=\"10\" width=\"256\" height=\"66\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" class=\"stage\"/><text x=\"424\" y=\"50\" class=\"sv stx\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#46585F\" font-weight=\"600\" >parser</text><line x1=\"552\" y1=\"43\" x2=\"566.4\" y2=\"43\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"572,43 565,39.15 565,46.85\" fill=\"#245A6B\"/><rect x=\"572\" y=\"10\" width=\"256\" height=\"66\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" class=\"stage\"/><text x=\"700\" y=\"50\" class=\"sv stx\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#46585F\" font-weight=\"600\" >dictionary</text><line x1=\"828\" y1=\"43\" x2=\"842.4\" y2=\"43\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"848,43 841,39.15 841,46.85\" fill=\"#245A6B\"/><rect x=\"848\" y=\"10\" width=\"256\" height=\"66\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" class=\"stage\"/><text x=\"976\" y=\"50\" class=\"sv stx\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#46585F\" font-weight=\"600\" >make_tsvector</text><line x1=\"1104\" y1=\"43\" x2=\"1118.4\" y2=\"43\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"1124,43 1117,39.15 1117,46.85\" fill=\"#245A6B\"/><rect x=\"1124\" y=\"10\" width=\"256\" height=\"66\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" class=\"stage\"/><text x=\"1252\" y=\"50\" class=\"sv stx\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#46585F\" font-weight=\"600\" >tsvector 值</text><g id=\"aRow1\"><text x=\"20\" y=\"125\" class=\"sv rlab\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#89938F\" font-weight=\"600\" >① 原始文本</text><rect x=\"190\" y=\"96\" width=\"1190\" height=\"46\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" class=\"rbox\"/><text x=\"206\" y=\"125\" class=\"sv rtx mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" ></text></g><g id=\"aRow2\"><text x=\"20\" y=\"179\" class=\"sv rlab\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#89938F\" font-weight=\"600\" >② parser 切 token</text><rect x=\"190\" y=\"150\" width=\"1190\" height=\"46\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" class=\"rbox\"/><text x=\"206\" y=\"179\" class=\"sv rtx mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" ></text></g><g id=\"aRow3\"><text x=\"20\" y=\"233\" class=\"sv rlab\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#89938F\" font-weight=\"600\" >③ 停用词过滤</text><rect x=\"190\" y=\"204\" width=\"1190\" height=\"46\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" class=\"rbox\"/><text x=\"206\" y=\"233\" class=\"sv rtx mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" ></text></g><g id=\"aRow4\"><text x=\"20\" y=\"287\" class=\"sv rlab\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#89938F\" font-weight=\"600\" >④ 词形归一</text><rect x=\"190\" y=\"258\" width=\"1190\" height=\"46\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" class=\"rbox\"/><text x=\"206\" y=\"287\" class=\"sv rtx mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" ></text></g><g id=\"aRow5\"><text x=\"20\" y=\"341\" class=\"sv rlab\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#89938F\" font-weight=\"600\" >⑤ 排序去重</text><rect x=\"190\" y=\"312\" width=\"1190\" height=\"46\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" class=\"rbox\"/><text x=\"206\" y=\"341\" class=\"sv rtx mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" ></text></g><g id=\"aRow6\"><text x=\"20\" y=\"395\" class=\"sv rlab\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#89938F\" font-weight=\"600\" >⑥ 输出值</text><rect x=\"190\" y=\"366\" width=\"1190\" height=\"46\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" class=\"rbox\"/><text x=\"206\" y=\"395\" class=\"sv rtx mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" ></text></g></svg>","ctrl":"<label>输入</label><input id=\"aText\" type=\"text\" value=\"The Fat Rats\" aria-label=\"输入英文文本\"><label>方式</label><select id=\"aCfg\" aria-label=\"选择构建方式\"><option value=\"english\">to_tsvector(english)</option><option value=\"cast\">直接 ::tsvector</option></select><button id=\"aPlay\" class=\"btn play\">▶ 播放</button><button id=\"aTick\" class=\"btn\">单步 →</button><button id=\"aReset\" class=\"btn\">重置</button><label>速度</label><input id=\"aSpeed\" type=\"range\" min=\"450\" max=\"1600\" step=\"50\" value=\"900\"><span class=\"out\" id=\"aOut\">可修改输入文本与构建方式</span>"},{"eyebrow":"边界 · 配置才拥有语义","title":"最常踩的坑：把 cast 当成了分词器","lede":"直接 cast 只排序去重；停用词、词形、位置都来自 to_tsvector(config, text)，而原文列另有用处。","caption":"图 07　三种写法对照：类型只是容器，语义来自函数调用时选定的 text search configuration。","bridge":"分工认清之后，我们往下走一层：这个值在内存和磁盘上，究竟是怎么摆的？为什么它天生适合被索引？","notes":"刚才那句「类型不分词」，值得单独占一页。第一种写法，'The Fat Rats'::tsvector，PostgreSQL 会把输入里的词项排序去重，但 The 还在、Rats 还是 Rats，没有任何语言处理，也不会凭空产生位置。第二种写法，to_tsvector('english', …)，才是真正走 parser 和 dictionary，得到 'fat':2 'rat':3。很多人第一次用全文检索，就是在这一步发现「我建了索引怎么查不到」，原因往往是物化列是用 cast 生成的，或者配置没写、用了环境的 default_text_search_config，换台机器结果就变了。所以生产里我会把配置显式写死。第三种，别忘了原文的 text 列：tsvector 不是原文，它只是一个为检索服务的派生表示，页面要展示正文、要做高亮、要重新分词，都得回原文字段。而且字段一更新，派生值和相关索引都要跟着维护——这份代价，后面我们会正式算账。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20\" y=\"14\" width=\"560\" height=\"104\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"38\" y=\"44\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#BE653B\" font-weight=\"600\" >错把 cast 当分词器</text><text x=\"38\" y=\"82\" class=\"sv mono\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"600\" >&#x27;The Fat Rats&#x27;::tsvector</text><line x1=\"580\" y1=\"66\" x2=\"613.6\" y2=\"66\" stroke=\"#BE653B\" stroke-width=\"1.8\"/><polygon points=\"620,66 612,61.6 612,70.4\" fill=\"#BE653B\"/><rect x=\"620\" y=\"14\" width=\"760\" height=\"104\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1\" /><text x=\"640\" y=\"76\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#46585F\" font-weight=\"400\" >只排序、去重：The / Fat / Rats 原样留下，没有归一，也没有位置</text><rect x=\"20\" y=\"136\" width=\"560\" height=\"104\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"38\" y=\"166\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#2F7A66\" font-weight=\"600\" >正确：配置决定语义</text><text x=\"38\" y=\"204\" class=\"sv mono\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"600\" >to_tsvector(&#x27;english&#x27;, &#x27;The Fat Rats&#x27;)</text><line x1=\"580\" y1=\"188\" x2=\"613.6\" y2=\"188\" stroke=\"#2F7A66\" stroke-width=\"1.8\"/><polygon points=\"620,188 612,183.6 612,192.4\" fill=\"#2F7A66\"/><rect x=\"620\" y=\"136\" width=\"760\" height=\"104\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1\" /><text x=\"640\" y=\"198\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#46585F\" font-weight=\"400\" >&#x27;fat&#x27;:2 &#x27;rat&#x27;:3：停用词删掉、复数归一、位置照原文保留</text><rect x=\"20\" y=\"258\" width=\"560\" height=\"104\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"38\" y=\"288\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" >别丢掉原文</text><text x=\"38\" y=\"326\" class=\"sv mono\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"600\" >body text 原文列</text><line x1=\"580\" y1=\"310\" x2=\"613.6\" y2=\"310\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"620,310 612,305.6 612,314.4\" fill=\"#245A6B\"/><rect x=\"620\" y=\"258\" width=\"760\" height=\"104\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"640\" y=\"320\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#46585F\" font-weight=\"400\" >文档字段必须单独保留：tsvector 是为检索服务的派生表示，不能替代原文</text><rect x=\"20\" y=\"382\" width=\"1360\" height=\"40\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1\" /><text x=\"40\" y=\"408\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#AE8A3E\" font-weight=\"600\" >生产里显式写 config：省略时用的是 default_text_search_config，环境一变，结果就变。</text></svg>","ctrl":null},{"eyebrow":"原理 · 内部布局","title":"一个 datum 里，到底装了哪几段字节","lede":"标准 varlena 头、int32 size、按词项排序的 WordEntry[]，后面才是词串区与可选的位置数组。","caption":"图 08　tsvector 是紧凑的变长 datum；WordEntry 只有 4 字节，位置数组按 haspos 决定是否出现。","bridge":"看懂这张剖面，很多「奇怪的上限」就不用背了——它们全是位宽算出来的。","notes":"现在把值剖开。源码 ts_type.h 里的定义很朴素：最前面是标准 varlena 头，接着一个 int32 size 表示有多少个 lexeme，然后是一组 WordEntry，每个词项一个条目，必须按 tsCompareString 排好序；再往后才是数据区，保存 lexeme 字符串，如果这个词项有位置，后面还跟一段位置数组。这里最妙的是 WordEntry 只有四个字节，里面用位域塞了三样东西：haspos 一位，len 十一位，pos 二十位。它不存字符串指针，存的是从 WordEntry 数组末尾到词串起点的相对偏移和长度。位置数组用的 WordEntryPos 本质是 uint16，高两位存权重，低十四位存位置。为什么这么抠？因为这是一个要被大量比较、大量二分查找、还可能被 TOAST 的 datum，越紧凑，每一页能放下的词项就越多。理解了这三层——头、条目数组、数据区——后面讲 GIN 为什么只拿词项不拿位置，就一点都不奇怪了。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><text x=\"20\" y=\"24\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"600\" >一个 tsvector datum 的分段（示意，格宽不按真实字节比例）</text><rect x=\"20\" y=\"44\" width=\"140\" height=\"84\" rx=\"4\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1.1\" /><text x=\"90.0\" y=\"79.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.5\" fill=\"#FFFFFF\" font-weight=\"600\" >vl_len_</text><text x=\"90.0\" y=\"101.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#CFE0DC\" font-weight=\"400\" >varlena 头</text><rect x=\"160\" y=\"44\" width=\"120\" height=\"84\" rx=\"4\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1.1\" /><text x=\"220.0\" y=\"79.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.5\" fill=\"#FFFFFF\" font-weight=\"600\" >size</text><text x=\"220.0\" y=\"101.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#CFE0DC\ le\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >可选；haspos=true 才存在</text><text x=\"20\" y=\"158\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"600\" >两个定长结构，决定了上面所有边界</text><rect x=\"20\" y=\"174\" width=\"660\" height=\"106\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"38\" y=\"200\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"700\" >WordEntry · 4 字节 / 32 bit</text><rect x=\"38\" y=\"212\" width=\"196\" height=\"52\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"52\" y=\"234\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"700\" >haspos:1</text><text x=\"52\" y=\"254\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >是否有位置</text><rect x=\"246\" y=\"212\" width=\"196\" height=\"52\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"260\" y=\"234\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"700\" >len:11</text><text x=\"260\" y=\"254\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >词项长度</text><rect x=\"454\" y=\"212\" width=\"196\" height=\"52\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"468\" y=\"234\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"700\" >pos:20</text><text x=\"468\" y=\"254\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >词串区偏移</text><rect x=\"700\" y=\"174\" width=\"680\" height=\"106\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"718\" y=\"200\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"700\" >WordEntryPos · uint16 / 16 bit</text><rect x=\"718\" y=\"212\" width=\"306\" height=\"52\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1\" /><text x=\"732\" y=\"234\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"700\" >weight:2</text><text x=\"732\" y=\"254\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >高 2 bit 存权重</text><rect x=\"1040\" y=\"212\" width=\"306\" height=\"52\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1\" /><text x=\"1054\" y=\"234\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"700\" >pos:14</text><text x=\"1054\" y=\"254\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >低 14 bit 存位置</text><rect x=\"20\" y=\"296\" width=\"1360\" height=\"34\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#F1EFE9\" stroke-width=\"1.0\" /><text x=\"38\" y=\"317.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"600\" >不存指针</text><text x=\"206\" y=\"317.725\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >WordEntry 保存的是相对偏移与长度，不是字符串指针</text><rect x=\"20\" y=\"334\" width=\"1360\" height=\"34\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#F1EFE9\" stroke-width=\"1.0\" /><text x=\"38\" y=\"355.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"600\" >可选位置</text><text x=\"206\" y=\"355.725\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >位置数组只在 haspos=true 时存在，跟在词串之后</text><rect x=\"20\" y=\"372\" width=\"1360\" height=\"34\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#F1EFE9\" stroke-width=\"1.0\" /><text x=\"38\" y=\"393.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"600\" >为查找而生</text><text x=\"206\" y=\"393.725\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >紧凑布局适合比较、二分查找，也适合 TOAST 存储</text><text x=\"20\" y=\"420\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >源码：src/include/tsearch/ts_type.h　｜　官方文档：datatype.sgml</text></svg>","ctrl":null},{"eyebrow":"原理 · 从布局推边界","title":"2KB、16383、四档权重，都不是拍脑袋定的","lede":"WordEntry 与 WordEntryPos 的位宽，直接决定了词项长度、偏移范围、位置上限和权重的取值个数。","caption":"图 09　四条由位域宽度推出的边界；这类边界在构造 tsvector 时就会被检查。","bridge":"边界是构造时定死的，那构造过程本身做了什么？顺着源码调用链走一遍，就能明白「排序去重」为什么不是建议。","notes":"我特别喜欢这一页，因为它能把一串需要死记的数字变成常识。len 占十一位，所以单个 lexeme 小于 2KB；pos 占二十位，词串区偏移最大约 1MB；WordEntryPos 里位置占十四位，所以位置最大 16383；权重占两位，正好四个取值，于是是 A、B、C、D 四档，不是三档也不是五档。连 make_tsvector 里那句「lenstr 超过 MAXSTRPOS 就抛错」，也不是谁拍脑袋加的防御，而是这套布局装不下了。这里顺带回答一个工程问题：为什么长文档要小心？因为位置记到 16383 就到头了，超过这个长度的词距信息没法完整保留，短语和邻近排名就得另想办法。所以你看，类型定义、字节布局、能力上限，这三件事是一条链，不是三页 PPT。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20\" y=\"12\" width=\"340\" height=\"60\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.1\" /><text x=\"190.0\" y=\"47.95\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"600\" >len:11</text><line x1=\"360\" y1=\"42\" x2=\"393.6\" y2=\"42\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"400,42 392,37.6 392,46.4\" fill=\"#245A6B\"/><rect x=\"400\" y=\"12\" width=\"320\" height=\"60\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"560.0\" y=\"47.95\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"600\" >2^11 = 2048</text><line x1=\"720\" y1=\"42\" x2=\"753.6\" y2=\"42\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"760,42 752,37.6 752,46.4\" fill=\"#245A6B\"/><rect x=\"760\" y=\"12\" width=\"620\" height=\"60\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"780\" y=\"48\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"600\" >单个 lexeme 小于 2KB</text><rect x=\"20\" y=\"86\" width=\"340\" height=\"60\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.1\" /><text x=\"190.0\" y=\"121.95\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"600\" >pos:20</text><line x1=\"360\" y1=\"116\" x2=\"393.6\" y2=\"116\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"400,116 392,111.6 392,120.4\" fill=\"#245A6B\"/><rect x=\"400\" y=\"86\" width=\"320\" height=\"60\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"560.0\" y=\"121.95\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"600\" >2^20 个字节</text><line x1=\"720\" y1=\"116\" x2=\"753.6\" y2=\"116\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"760,116 752,111.6 752,120.4\" fill=\"#245A6B\"/><rect x=\"760\" y=\"86\" width=\"620\" height=\"60\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"780\" y=\"122\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"600\" >词串区偏移最大约 1MB</text><rect x=\"20\" y=\"160\" width=\"340\" height=\"60\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1.1\" /><text x=\"190.0\" y=\"195.95\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#AE8A3E\" font-weight=\"600\" >WordEntryPos 的 pos:14</text><line x1=\"360\" y1=\"190\" x2=\"393.6\" y2=\"190\" stroke=\"#AE8A3E\" stroke-width=\"1.8\"/><polygon points=\"400,190 392,185.6 392,194.4\" fill=\"#AE8A3E\"/><rect x=\"400\" y=\"160\" width=\"320\" height=\"60\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"560.0\" y=\"195.95\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"600\" >2^14 − 1 = 16383</text><line x1=\"720\" y1=\"190\" x2=\"753.6\" y2=\"190\" stroke=\"#AE8A3E\" stroke-width=\"1.8\"/><polygon points=\"760,190 752,185.6 752,194.4\" fill=\"#AE8A3E\"/><rect x=\"760\" y=\"160\" width=\"620\" height=\"60\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1\" /><text x=\"780\" y=\"196\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#AE8A3E\" font-weight=\"600\" >源词位置最大 16383</text><rect x=\"20\" y=\"234\" width=\"340\" height=\"60\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1.1\" /><text x=\"190.0\" y=\"269.95\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#AE8A3E\" font-weight=\"600\" >WordEntryPos 的 weight:2</text><line x1=\"360\" y1=\"264\" x2=\"393.6\" y2=\"264\" stroke=\"#AE8A3E\" stroke-width=\"1.8\"/><polygon points=\"400,264 392,259.6 392,268.4\" fill=\"#AE8A3E\"/><rect x=\"400\" y=\"234\" width=\"320\" height=\"60\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"560.0\" y=\"269.95\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"600\" >2^2 = 4 个取值</text><line x1=\"720\" y1=\"264\" x2=\"753.6\" y2=\"264\" stroke=\"#AE8A3E\" stroke-width=\"1.8\"/><polygon points=\"760,264 752,259.6 752,268.4\" fill=\"#AE8A3E\"/><rect x=\"760\" y=\"234\" width=\"620\" height=\"60\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1\" /><text x=\"780\" y=\"270\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#AE8A3E\" font-weight=\"600\" >权重恰好 A / B / C / D 四档</text><rect x=\"20\" y=\"316\" width=\"1360\" height=\"62\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1\" /><text x=\"40\" y=\"342\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#BE653B\" font-weight=\"700\" >make_tsvector() 检查 lenstr &gt; MAXSTRPOS 时抛错：</text><text x=\"40\" y=\"366\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >这些上限不是使用约定，而是类型构造阶段的硬约束，写不进去就是写不进去。</text><text x=\"20\" y=\"412\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >数字来自位宽推导，非实测统计；位置上限同时决定了长文档能否完整保留词距信息。</text></svg>","ctrl":null},{"eyebrow":"原理 · 构建路径","title":"排序去重，不是建议，是构造阶段的硬约束","lede":"parsetext 产出带位置的中间结果，make_tsvector 合并重复词、算好空间、检查边界，再写出紧凑结构。","caption":"图 10　从函数调用到 datum 落地的调用链；有序 lexeme 是后续所有查找能力的地基。","bridge":"值造好了，接下来该让它干活。@@ 看上去只是一个操作符，可它执行的其实是一棵树。","notes":"顺着源码走一遍：to_tsvector_byid 先按输入长度预估 ParsedWord 数组，然后 parsetext 带着配置 ID 让 parser 和 dictionary 产出 lexeme，最后 make_tsvector 生成最终的 TSVector。make_tsvector 里有四件事值得记：先用 uniqueWORD 合并重复词项，再算词串和位置数据一共要多少空间，接着检查 lenstr 是否超界，最后才依次写入 WordEntry 数组、lexeme 字节，以及每个词项的 npos 加位置数组。我想强调的是这句：排序去重不是文档层面的「建议」，而是类型构造阶段的硬约束。它不是为了让输出好看，是为了让后面的匹配能在有序词项上做查找——二分、比较、抽 key，全靠这个序。所以 tsvector 长得这么「不自然」，恰恰是因为它天生是为被索引而设计的，不是为给人读的。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><text x=\"20\" y=\"24\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"600\" >入口在 to_tsany.c：to_tsvector_byid() 把文本交给配置，再交给 make_tsvector()</text><rect x=\"20\" y=\"44\" width=\"256\" height=\"92\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.1\" /><text x=\"148.0\" y=\"83.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"600\" >to_tsvector_byid()</text><text x=\"148.0\" y=\"105.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >预估 ParsedWord 空间</text><line x1=\"276\" y1=\"90\" x2=\"290.4\" y2=\"90\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"296,90 289,86.15 289,93.85\" fill=\"#245A6B\"/><rect x=\"296\" y=\"44\" width=\"256\" height=\"92\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.1\" /><text x=\"424.0\" y=\"83.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"600\" >parsetext(cfgId, …)</text><text x=\"424.0\" y=\"105.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >parser + dictionary 产出 lexeme</text><line x1=\"552\" y1=\"90\" x2=\"566.4\" y2=\"90\" stroke=\"#245A6B\" stroke-width=\" FE9\" stroke=\"#F1EFE9\" stroke-width=\"1\" /><text x=\"40\" y=\"402\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#89938F\" font-weight=\"400\" >源码：src/backend/tsearch/to_tsany.c · ts_parse.c · src/backend/utils/adt/tsvector.c</text></svg>","ctrl":null},{"eyebrow":"原理 · 匹配语义","title":"@@ 不是字符串比较，是执行一棵查询树","lede":"与、或、非、短语距离、前缀、权重限制都是树上的节点；执行器在有序 lexeme 数组上找操作数。","caption":"图 11　左边是一棵 tsquery 树，右边是它能表达的语义；连线全部走直角，节点与文字互不遮挡。","bridge":"树上有两类节点特别麻烦：要位置的，和要权重的。它们恰好是索引里没有的信息。","notes":"很多人以为 @@ 是「高级一点的字符串比较」，不是的。右边的 tsquery 是一棵由 lexeme 和操作符组成的查询树：& 表示同时包含，| 表示包含任意一个，! 表示不包含，<-> 或 <N> 表示短语和距离关系，:* 是前缀匹配，:AB 是限定权重。执行的时候，tsvector_op.c 在 tsvector 那个排好序的词项数组里查找每个操作数，再由 TS_execute 按树的结构算出结果；操作符定义在 pg_operator.dat，选择率函数是 tsmatchsel。这里就埋下一个伏笔：如果查询需要位置，比如 fat <-> rat，执行器必须能拿到位置数组；如果 tsvector 被 strip 去掉了位置，短语就无从判断，某些语义只能退化成「可能匹配」，精确排名也做不了。换句话说，查询树能表达什么，取决于值里真的存了什么——这个约束，马上会在索引那一层变成一次回表。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><text x=\"20\" y=\"24\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" >一棵查询树：fat &amp; rat &amp; !cat</text><rect x=\"20\" y=\"36\" width=\"620\" height=\"290\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#F1EFE9\" stroke-width=\"1\" /><path d=\"M330,84 L330,110 L160,110 L160,140\" fill=\"none\" stroke=\"#7BA6AF\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><path d=\"M330,84 L330,110 L500,110 L500,140\" fill=\"none\" stroke=\"#7BA6AF\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><path d=\"M160,184 L160,212 L80,212 L80,240\" fill=\"none\" stroke=\"#7BA6AF\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><path d=\"M160,184 L160,212 L240,212 L240,240\" fill=\"none\" stroke=\"#7BA6AF\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><line x1=\"500\" y1=\"184\" x2=\"500\" y2=\"240\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><rect x=\"270\" y=\"40\" width=\"120\" height=\"44\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.1\" /><text x=\"330.0\" y=\"55.95\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#BE653B\" font-weight=\"600\" >＆</text><text x=\"330.0\" y=\"75.75\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.0\" fill=\"#46585F\" font-weight=\"400\" >AND</text><rect x=\"100\" y=\"140\" width=\"120\" height=\"44\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.1\" /><text x=\"160.0\" y=\"155.95\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" >＆</text><text x=\"160.0\" y=\"175.75\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.0\" fill=\"#46585F\" font-weight=\"400\" >AND</text><rect x=\"440\" y=\"140\" width=\"120\" height=\"44\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.1\" /><text x=\"500.0\" y=\"155.95\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" >！</text><text x=\"500.0\" y=\"175.75\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.0\" fill=\"#46585F\" font-weight=\"400\" >NOT</text><rect x=\"20\" y=\"240\" width=\"120\" height=\"44\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#FFFFFF\" stroke-width=\"1.1\" /><text x=\"80.0\" y=\"255.95\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"600\" >fat</text><text x=\"80.0\" y=\"275.75\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.0\" fill=\"#46585F\" font-weight=\"400\" >lexeme</text><rect x=\"180\" y=\"240\" width=\"120\" height=\"44\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#FFFFFF\" stroke-width=\"1.1\" /><text x=\"240.0\" y=\"255.95\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"600\" >rat</text><text x=\"240.0\" y=\"275.75\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.0\" fill=\"#46585F\" font-weight=\"400\" >lexeme</text><rect x=\"440\" y=\"240\" width=\"120\" height=\"44\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#FFFFFF\" stroke-width=\"1.1\" /><text x=\"500.0\" y=\"255.95\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"600\" >cat</text><text x=\"500.0\" y=\"275.75\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.0\" fill=\"#46585F\" font-weight=\"400\" >lexeme</text><text x=\"20\" y=\"348\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#89938F\" font-weight=\"400\" >tsquery 由 lexeme 与操作符组成；TS_execute() 在有序词项数组上逐项定位并执行这棵树。</text><text x=\"680\" y=\"24\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" >tsquery 能表达的六种语义</text><rect x=\"680\" y=\"40\" width=\"700\" height=\"44\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"700\" y=\"69\" class=\"sv mono\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#BE653B\" font-weight=\"700\" >&amp;</text><text x=\"900\" y=\"69\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#46585F\" font-weight=\"400\" >同时包含（AND）</text><rect x=\"680\" y=\"90\" width=\"700\" height=\"44\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"700\" y=\"119\" class=\"sv mono\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#BE653B\" font-weight=\"700\" >|</text><text x=\"900\" y=\"119\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#46585F\" font-weight=\"400\" >包含任意一个（OR）</text><rect x=\"680\" y=\"140\" width=\"700\" height=\"44\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"700\" y=\"169\" class=\"sv mono\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#BE653B\" font-weight=\"700\" >!</text><text x=\"900\" y=\"169\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#46585F\" font-weight=\"400\" >不包含（NOT）</text><rect x=\"680\" y=\"190\" width=\"700\" height=\"44\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"700\" y=\"219\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#BE653B\" font-weight=\"700\" >&lt;-&gt; / &lt;N&gt;</text><text x=\"900\" y=\"219\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#46585F\" font-weight=\"400\" >短语 / 距离关系（N 为词距）</text><rect x=\"680\" y=\"240\" width=\"700\" height=\"44\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"700\" y=\"269\" class=\"sv mono\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#BE653B\" font-weight=\"700\" >:*</text><text x=\"900\" y=\"269\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#46585F\" font-weight=\"400\" >前缀匹配</text><rect x=\"680\" y=\"290\" width=\"700\" height=\"44\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"700\" y=\"319\" class=\"sv mono\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#BE653B\" font-weight=\"700\" >:AB</text><text x=\"900\" y=\"319\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#46585F\" font-weight=\"400\" >匹配特定权重</text><rect x=\"680\" y=\"348\" width=\"700\" height=\"66\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"700\" y=\"374\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"700\" >执行：tsvector_op.c 查找操作数 → TS_execute()</text><text x=\"700\" y=\"398\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >选择率：pg_operator.dat 中的 tsmatchsel()</text></svg>","ctrl":null},{"eyebrow":"原理 · 索引里没有的信息","title":"短语和权重，为什么非要回表看一眼","lede":"位置决定词距，权重决定命中档次；而 GIN 的 entry 只存 lexeme，这两样都得读原始 tsvector 才能定。","caption":"图 12　左侧位置刻度为教学示意；中间是权重限制，右侧是 strip() 之后失去的能力。","bridge":"既然提到 GIN，我们就把访问路径完整走一遍：索引给候选，谁给最终答案？这一页可以自己换查询来试。","notes":"把两类麻烦摆在一起看。第一类要位置：文档 A 里 fat 在 2、rat 在 3，相邻，fat <-> rat 命中；文档 B 里 fat 在 2、rat 在 5，隔了三个位置，就不命中。这个判断必须读位置数组，光知道「这行有 fat、也有 rat」不够。第二类要权重：'fat':A 只认带 A 权重的位置，常见于标题命中优先；可 GIN 的索引项里压根没存权重，所以带权重限制的操作数会被 checkcondition_gin 降级成 GIN_MAYBE，回表读原始 tsvector 再复查。还有 strip，它能去掉位置和权重省空间，但短语、邻近排名、覆盖密度排名也一起没了，别为了省一点空间把它当默认动作。把这三件事放一起，结论就一句话：索引里没有的信息，都得在 heap 层复查，位置、权重，还有 MVCC 可见性，都一样。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20\" y=\"14\" width=\"440\" height=\"44\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"40\" y=\"42\" class=\"sv serif\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#245A6B\" font-weight=\"700\" >短语与位置</text><rect x=\"480\" y=\"14\" width=\"440\" height=\"44\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1\" /><text x=\"500\" y=\"42\" class=\"sv serif\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#AE8A3E\" font-weight=\"700\" >权重限制</text><rect x=\"940\" y=\"14\" width=\"440\" height=\"44\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1\" /><text x=\"960\" y=\"42\" class=\"sv serif\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#BE653B\" font-weight=\"700\" >strip() 的代价</text><text x=\"20\" y=\"90\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"600\" >文档 A：&#x27;fat&#x27;:2 &#x27;rat&#x27;:3</text><rect x=\"20\" y=\"102\" width=\"78\" height=\"40\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"59\" y=\"127\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"600\" >1</text><rect x=\"104\" y=\"102\" width=\"78\" height=\"40\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"143\" y=\"127\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#2F7A66\" font-weight=\"600\" >2 fat</text><rect x=\"188\" y=\"102\" width=\"78\" height=\"40\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"227\" y=\"127\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#2F7A66\" font-weight=\"600\" >3 rat</text><rect x=\"272\" y=\"102\" width=\"78\" height=\"40\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"311\" y=\"127\" class=\"sv mo "#BE653B\" font-weight=\"700\" >strip() 去掉位置与权重</text><text x=\"960\" y=\"140\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >省下的是 datum 空间；丢掉的是：</text><rect x=\"960\" y=\"156\" width=\"400\" height=\"34\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1\" /><text x=\"974\" y=\"178\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >短语与邻近查询的判断依据</text><rect x=\"960\" y=\"196\" width=\"400\" height=\"34\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1\" /><text x=\"974\" y=\"218\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >邻近排名所需的词距</text><rect x=\"960\" y=\"236\" width=\"400\" height=\"34\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1\" /><text x=\"974\" y=\"258\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >覆盖密度排名所需的分布信息</text><text x=\"960\" y=\"306\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >过度 strip，等于把高级检索能力一起删掉。</text><rect x=\"20\" y=\"348\" width=\"1360\" height=\"66\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"40\" y=\"374\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"700\" >凡是索引里没有的信息——位置、权重、MVCC 可见性——都要在 heap 层复查。</text><text x=\"40\" y=\"398\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >这就是为什么「建了 GIN」不等于「查询不用回表」。</text></svg>","ctrl":null},{"eyebrow":"动画演示 · 匹配与索引路径（可交互）","title":"GIN 给你候选行，不给最终答案","lede":"换四种 tsquery，按播放或单步：抽词、取倒排候选、访问 heap、回表复查，看哪一步把结果改小了。","caption":"","bridge":"把四个查询都试过，就会看到 GIN 被逼到三种不同的角落——这正好是运维时最该盯的三件事。","notes":"这一页也请动手。左边四行是示意文档，中间是 GIN 的倒排表：fat 指向 TID 1、2、3，rat 指向 1、2、4。右边是访问路径的四步。默认查询 fat & rat，索引把两个词项的 TID 集合取交集，得到候选 1、2，回表执行完整 @@，结果还是 1、2。现在换成短语 fat <-> rat：候选还是 1、2，但索引里没有位置，只能标成 GIN_MAYBE，回表一读，TID 1 的 fat 在 2、rat 在 3，相邻，命中；TID 2 是 4 和 6，不相邻，淘汰。再换成 'fat':A，索引按 fat 找到 1、2、3，回表看权重，只有 TID 3 的 fat 带 A。最后是 !foo，一个必须正向匹配的词都没有，gin_extract_tsquery 会把 searchMode 设成 GIN_SEARCH_MODE_ALL，索引没法直接定位候选，只能扫描更大范围再逐行判断。这里的数据是教学示意，不是实测输出，但它把机制讲得很清楚：GIN 负责快速缩小候选集，完整的查询语义始终属于 tsquery 执行树和 heap 层。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" id=\"animB\"><text x=\"20\" y=\"24\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"700\" >示意数据 · 4 行文档</text><text x=\"450\" y=\"24\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"700\" >GIN entry · lexeme → TID</text><text x=\"790\" y=\"24\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"700\" >访问路径 · 四步</text><g class=\"doc\"><rect x=\"20\" y=\"40\" width=\"410\" height=\"58\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" class=\"dbox\"/></g><text x=\"36\" y=\"64\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"700\" >TID 1</text><text x=\"36\" y=\"86\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\" >&#x27;fat&#x27;:2D &#x27;rat&#x27;:3D</text><g class=\"doc\"><rect x=\"20\" y=\"106\" width=\"410\" height=\"58\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" class=\"dbox\"/></g><text x=\"36\" y=\"130\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"700\" >TID 2</text><text x=\"36\" y=\"152\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\" >&#x27;fat&#x27;:4D &#x27;rat&#x27;:6D</text><g class=\"doc\"><rect x=\"20\" y=\"172\" width=\"410\" height=\"58\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" class=\"dbox\"/></g><text x=\"36\" y=\"196\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"700\" fill=\"#46585F\" font-weight=\"400\" ></text></g><rect x=\"790\" y=\"310\" width=\"590\" height=\"58\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" id=\"bFinal\"/><text x=\"806\" y=\"346\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#89938F\" font-weight=\"700\" id=\"bFinalTx\">等待复查结论 …</text><text x=\"20\" y=\"380\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >示意数据说明：值中的 D / A 为权重；GIN 的 key 只有 lexeme，不保存权重与位置。非实测输出。</text><text x=\"20\" y=\"408\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >换一个查询再看一遍：索引给出的是候选集，最终结论由 heap 层的完整 @@ 语义给出。</text></svg>","ctrl":"<label>查询</label><select id=\"bQuery\" aria-label=\"选择 tsquery\"><option value=\"and\">fat &amp; rat</option><option value=\"phrase\">fat &lt;-&gt; rat（短语）</option><option value=\"weight\">'fat':A（权重限制）</option><option value=\"neg\">!foo（纯否定）</option></select><button id=\"bPlay\" class=\"btn play\">▶ 播放</button><button id=\"bTick\" class=\"btn\">单步 →</button><button id=\"bReset\" class=\"btn\">重置</button><label>速度</label><input id=\"bSpeed\" type=\"range\" min=\"500\" max=\"1800\" step=\"50\" value=\"1000\"><span class=\"out\" id=\"bOut\">可切换查询类型</span>"},{"eyebrow":"索引 · GIN 的三个边界","title":"三种查询，会把 GIN 逼到不同角落","lede":"权重与位置要回表、纯否定要扫更大范围、pending list 会让查询额外扫描——都不是「索引没建好」。","caption":"图 14　三列分别对应查询语义、索引抽取与写入运维；箭头全部竖直，文字与连线分离。","bridge":"GIN 是把词项精确映射到 TID 的倒排结构，那如果换个思路、把整篇文档压成一个签名，会换来什么？","notes":"把刚才四种查询抽象一下，GIN 有三种典型处境。第一，只要查询涉及权重、位置这类索引里没有的信息，checkcondition_gin 就把「确定命中」降级成 GIN_MAYBE，回表复查；这是设计使然，不是索引失效。第二，纯否定查询，比如 !foo，没有任何必须正向匹配的词，gin_extract_tsquery 会把 searchMode 设成 GIN_SEARCH_MODE_ALL——光靠「不包含某词」没法从倒排 key 里定位候选行，只能扫更大的范围。第三是运维侧：fastupdate 让写入更快，因为新条目先进 pending list；但 pending list 变大之后，查询除了走索引树，还要额外扫这部分数据，某一次前台 cleanup 触发时，用户就会抱怨「同样的查询忽快忽慢」。所以我会跟 DBA 说，别只看写入吞吐，要盯 gin_pending_list_limit、maintenance_work_mem、autovacuum，也别忘了定期 ANALYZE 全文检索列。","svg":"<svg class=\"figure\" width=\"14
