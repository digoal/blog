2B33\" font-weight=\"400\" >  &#x27;SRID=4326;POINT(120.1 30.2)&#x27;::geography,</text><text x=\"35\" y=\"310\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#1B2B33\" font-weight=\"400\" >  &#x27;SRID=4326;POINT(120.2 30.3)&#x27;::geography);</text><text x=\"35\" y=\"336\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"600\" >走球面 / 椭球语义，结果以米计</text><rect x=\"700\" y=\"20\" width=\"680\" height=\"172\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><rect x=\"700\" y=\"20\" width=\"680\" height=\"42\" rx=\"5\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1\" /><text x=\"718\" y=\"48\" class=\"sv mono\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#BE653B\" font-weight=\"700\" >ST_SetSRID(geom, 4326)</text><text x=\"718\" y=\"96\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#46585F\" font-weight=\"400\" >只改元数据标签，坐标数值一个都不动</text><text x=\"718\" y=\"132\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\" >POINT(120.1 30.2)  →  POINT(120.1 30.2)</text><text x=\"718\" y=\"166\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"700\" >贴标签 ≠ 换坐标系</text><rect x=\"700\" y=\"204\" width=\"680\" height=\"172\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><rect x=\"700\" y=\"204\" width=\"680\" height=\"42\" rx=\"5\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1\" /><text x=\"718\" y=\"232\" class=\"sv mono\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#2F7A66\" font-weight=\"700\" >ST_Transform(geom, 3857)</text><text x=\"718\" y=\"280\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#46585F\" font-weight=\"400\" >真正改变坐标数值，做坐标系转换</text><text x=\"718\" y=\"316\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\" >经纬度 (度)  →  投影坐标 (米)</text><text x=\"718\" y=\"350\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#2F7A66\" font-weight=\"700\" >转换要显式调用，且依赖 PROJ</text><rect x=\"20\" y=\"390\" width=\"1360\" height=\"34\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1\" /><text x=\"38\" y=\"413\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#AE8A3E\" font-weight=\"600\" >geometry 的测量单位由 SRID 指定的坐标单位决定；SRID 是标识，不保证正确投影。</text></svg>","ctrl":null},{"eyebrow":"第五问 · 语义边界 ②","title":"选坐标系，其实是选「你要算什么」","lede":"范围展示、本地工程、跨大范围测量，三种查询目标对应三种不同选择；决定性因素不是数据长什么样，而是计算语义。","caption":"图 15　三条判断路径。颜色语义：金＝过渡提示，青绿＝推荐动作，靛青＝结构选择。","bridge":"坐标系讲清楚了，就可以进入整套机制里最「值钱」的一层：为什么空间查询能不扫全表。答案从 bbox 操作符开始。","notes":"那到底怎么选？我建议别用一句「经纬度就 geography，平面就 geometry」草草收尾，先看查询核心在算什么。如果主要是范围展示、瓦片、Web Mercator 附近的地图计算，geometry 加 3857 完全可用，但你得接受面积和距离在高纬度会畸变；如果量纲是本地工程、城市、园区、管网，选一个合适的本地投影坐标系，geometry 非常合适，平面计算代价低，测量和索引的语义都清楚；如果核心是跨大范围的地球表面距离、面积、缓冲，那就优先评估 geography，或者先转到适合的投影再算。你会发现判断依据不是「数据长什么样」，而是「我要算什么、结果单位是什么」。这一点也顺带解释了为什么原文反复提醒：经纬度距离查询要提前决定路线，别等到 SQL 写完了才发现算出来的是度。等坐标系定下来，我们就能进入整套机制里最值钱的一层——空间查询为什么可以不扫全表。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20\" y=\"24\" width=\"1360\" height=\"100\" rx=\"5\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1\" /><rect x=\"20\" y=\"24\" width=\"8\" height=\"100\" rx=\"2\" fill=\"#AE8A3E\" stroke=\"#AE8A3E\" stroke-width=\"1\" /><text x=\"44\" y=\"62\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#AE8A3E\" font-weight=\"700\" >范围展示 / 瓦片 / Web Mercator</text><text x=\"44\" y=\"98\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >geometry + 3857 可以用，但要理解面积与距离畸变</text><rect x=\"1200\" y=\"50\" width=\"160\" height=\"48\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#AE8A3E\" stroke-width=\"1.4\" /><text x=\"1280\" y=\"82\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#AE8A3E\" font-weight=\"700\" >geometry</text><rect x=\"20\" y=\"140\" width=\"1360\" height=\"100\" rx=\"5\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1\" /><rect x=\"20\" y=\"140\" width=\"8\" height=\"100\" rx=\"2\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"44\" y=\"178\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#2F7A66\" font-weight=\"700\" >本地工程 / 城市 / 园区 / 管网</text><text x=\"44\" y=\"214\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >选本地投影坐标系，测量与索引语义都清晰，geometry 很适合</text><rect x=\"1200\" y=\"166\" width=\"160\" height=\"48\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#2F7A66\" stroke-width=\"1.4\" /><text x=\"1280\" y=\"198\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#2F7A66\" font-weight=\"700\" >geometry</text><rect x=\"20\" y=\"256\" width=\"1360\" height=\"100\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><rect x=\"20\" y=\"256\" width=\"8\" height=\"100\" rx=\"2\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"44\" y=\"294\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#245A6B\" font-weight=\"700\" >跨大范围的地球距离与面积</text><text x=\"44\" y=\"330\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >优先评估 geography，或先转换到适合的投影再计算</text><rect x=\"1200\" y=\"282\" width=\"160\" height=\"48\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#245A6B\" stroke-width=\"1.4\" /><text x=\"1280\" y=\"314\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"700\" >geography</text><text x=\"20\" y=\"386\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"600\" >别用一句「经纬度就 geography，平面就 geometry」结束判断 —— 先看查询核心在算什么。</text><text x=\"20\" y=\"414\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >另：Web Mercator 在高纬度面积畸变明显；本地投影下 geometry 的平面计算代价通常更低。</text></svg>","ctrl":null},{"eyebrow":"第六问 · 核心原理 ④ 操作符","title":"很多「空间索引能力」，其实来自 bbox 操作符","lede":"&&、&&&、@、~、<->、<#> 这些操作符把几何对象接进索引；其中 && 判断的只是二维边界框是否相交。","caption":"图 16　常见 geometry 操作符与索引用途；依据 postgis.sql.in 与 reference_operator.xml。","bridge":"操作符是「粗」的那一半。那「精」的那一半怎么接上？下一页用可调的查询窗口，把两阶段过滤完整演一遍。","notes":"为什么空间查询能不扫全表？答案不在一个神秘函数，而在一组边界框操作符。postgis.sql.in 里定义了大量 geometry 操作符，最常用的是这六个：&& 判断 2D bounding box 是否相交，是 GiST、SP-GiST、BRIN 做范围过滤的基础；&&& 判断 n-D float precision bounding box 是否相交，用于 3D、4D、ND 过滤；@ 和 ~ 是一对 bbox 包含关系；<-> 是距离排序操作符，GiST 的 KNN 查询就靠它，写法是 ORDER BY geom <-> const LIMIT n；<#> 是 bounding box 距离，常做近似或预过滤排序。reference_operator.xml 说得很明确：&& 比的是 A 和 B 的 2D 边界框，&&& 比的是 n-D 边界框，它们都不是完整拓扑谓词。这一点非常关键，因为两条看起来很像的 SQL 语义完全不同：geom && envelope 只判断边界框相交，快但可能误命中；ST_Intersects(geom, envelope) 判断真实几何是否相交，PostGIS 会利用索引先加一个 bbox 条件，再做精确判断。也就是说，操作符负责「粗」的那一半，函数负责「精」的那一半。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20\" y=\"20\" width=\"200\" height=\"42\" rx=\"3\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"120.0\" y=\"45.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"700\" >操作符</text><rect x=\"220\" y=\"20\" width=\"560\" height=\"42\" rx=\"3\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"500.0\" y=\"45.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"700\" >含义</text><rect x=\"780\" y=\"20\" width=\"620\" height=\"42\" rx=\"3\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"1090.0\" y=\"45.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"700\" >常见索引用途</text><rect x=\"20\" y=\"62\" width=\"200\" height=\"52\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"33\" y=\"89.53999999999999\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"700\" >&amp;&amp;</text><rect x=\"220\" y=\"62\" width=\"560\" height=\"52\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"233\" y=\"89.53999999999999\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >2D bounding box 相交</text><rect x=\"780\" y=\"62\" width=\"620\" height=\"52\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"793\" y=\"89.53999999999999\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >GiST / SP-GiST / BRIN 的基础范围过滤</text><rect x=\"20\" y=\"114\" width=\"200\" height=\"52\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"33\" y=\"141.54\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"700\" >&amp;&amp;&amp;</text><rect x=\"220\" y=\"114\" width=\"560\" height=\"52\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"233\" y=\"141.54\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >n-D bounding box 相交</text><rect x=\"780\" y=\"114\" width=\"620\" height=\"52\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"793\" y=\"141.54\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >3D / 4D / ND 过滤</text><rect x=\"20\" y=\"166\" width=\"200\" height=\"52\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"33\" y=\"193.54\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"700\" >@</text><rect x=\"220\" y=\"166\" width=\"560\" height=\"52\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"233\" y=\"193.54\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >左侧 bbox 被右侧包含</text><rect x=\"780\" y=\"166\" width=\"620\" height=\"52\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"793\" y=\"193.54\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >bbox containment</text><rect x=\"20\" y=\"218\" width=\"200\" height=\"52\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"33\" y=\"245.54\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"700\" >~</text><rect x=\"220\" y=\"218\" width=\"560\" height=\"52\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"233\" y=\"245.54\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >左侧 bbox 包含右侧</text><rect x=\"780\" y=\"218\" width=\"620\" height=\"52\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"793\" y=\"245.54\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >bbox containment</text><rect x=\"20\" y=\"270\" width=\"200\" height=\"52\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"33\" y=\"297.54\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"700\" >&lt;-&gt;</text><rect x=\"220\" y=\"270\" width=\"560\" height=\"52\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"233\" y=\"297.54\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >距离排序操作符</text><rect x=\"780\" y=\"270\" width=\"620\" height=\"52\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"793\" y=\"297.54\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >GiST KNN：ORDER BY geom &lt;-&gt; const LIMIT n</text><rect x=\"20\" y=\"322\" width=\"200\" height=\"52\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"33\" y=\"349.54\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"700\" >&lt;#&gt;</text><rect x=\"220\" y=\"322\" width=\"560\" height=\"52\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"233\" y=\"349.54\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >bounding box 距离</text><rect x=\"780\" y=\"322\" width=\"620\" height=\"52\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"793\" y=\"349.54\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >近似或预过滤距离排序</text><rect x=\"20\" y=\"376\" width=\"1360\" height=\"42\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1\" /><text x=\"38\" y=\"403\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"600\" >&amp;&amp; 与 &amp;&amp;&amp; 判断的是 bounding box 是否相交，不是完整拓扑谓词 —— 这是两阶段过滤的起点。</text></svg>","ctrl":null},{"eyebrow":"第六问 · 核心原理 ⑤ 两阶段过滤（可演示）","title":"先粗过滤，再精确计算：误命中就是这样来的","lede":"拖动「查询窗口」尺寸，或按播放让窗口扫过示意空间；看 bbox 候选数、精确命中数与误命中数怎样变化。","caption":"动画 B　输入：查询窗口尺寸；控制：播放 / 暂停、单步、重置。计数由图中示意图形实时计算，非真实基准。","bridge":"两阶段过滤是三种索引的共同底座。差别在于：它们各自用什么数据组织方式来存那份摘要。","notes":"这一页建议动手玩一下。左边是一组刻意画成 L 形的示意几何，虚线框是它们的 bounding box，陶橙方块是查询窗口。按播放，窗口会一格一格扫过去；你也可以拖动滑块改变窗口大小，或者用单步自己走。右边三个数字是实时算出来的：第一层，索引摘要粗过滤，看哪些 bbox 和查询窗口相交；第二层，精确函数重算，看真实几何是不是真的相交；第三层，两者的差，就是误命中。你会看到窗口扫进 L 形那个空心角的时候，bbox 明明相交，几何却一点都没碰上——这就是 && 与 ST_Intersects 的区别，也是为什么复杂多边形、跨大范围的大对象容易让索引失效：它们的 bbox 太粗了。PostGIS 的 support function 会给 ST_Intersects、ST_DWithin 这些可索引函数自动补上 bbox 条件，但补的只是粗过滤那一层，最后的精确判断一次都省不掉。记住这句：索引只保证排除「不可能命中」的对象，不保证候选一定命中。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" id=\"animB\"><rect x=\"20\" y=\"20\" width=\"860\" height=\"340\" rx=\"4\" fill=\"#FCFBF8\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><line x1=\"20\" y1=\"20\" x2=\"20\" y2=\"360\" stroke=\"#EDEAE3\" stroke-width=\"0.8\"/><line x1=\"60\" y1=\"20\" x2=\"60\" y2=\"360\" stroke=\"#EDEAE3\" stroke-width=\"0.8\"/><line x1=\"100\" y1=\"20\" x2=\"100\" y2=\"360\" stroke=\"#EDEAE3\" stroke-width=\"0.8\"/ ext><text x=\"910\" y=\"66\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >ST_Intersects(geom, :win)</text><rect x=\"900\" y=\"86\" width=\"480\" height=\"76\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"918\" y=\"116\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" >① 索引摘要粗过滤</text><text x=\"918\" y=\"144\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >GiST / SP-GiST / BRIN · BOX2DF / GIDX</text><text x=\"1352\" y=\"136\" class=\"sv mono\" text-anchor=\"end\" font-size=\"28.0\" fill=\"#245A6B\" font-weight=\"700\" id=\"bN\">0</text><rect x=\"900\" y=\"174\" width=\"480\" height=\"76\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1\" /><text x=\"918\" y=\"204\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#2F7A66\" font-weight=\"700\" >② 精确函数重算</text><text x=\"918\" y=\"232\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >GEOS / liblwgeom · 真实几何相交判断</text><text x=\"1352\" y=\"224\" class=\"sv mono\" text-anchor=\"end\" font-size=\"28.0\" fill=\"#2F7A66\" font-weight=\"700\" id=\"bM\">0</text><rect x=\"900\" y=\"262\" width=\"480\" height=\"76\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1\" /><text x=\"918\" y=\"292\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#BE653B\" font-weight=\"700\" >③ 剔除误命中</text><text x=\"918\" y=\"320\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >bbox 相交但几何不相交</text><text x=\"1352\" y=\"312\" class=\"sv mono\" text-anchor=\"end\" font-size=\"28.0\" fill=\"#BE653B\" font-weight=\"700\" id=\"bF\">0</text><rect x=\"900\" y=\"352\" width=\"480\" height=\"44\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"916\" y=\"380\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"600\" >索引保存的是摘要，不是完整几何对象</text></svg>","ctrl":"<label>查询窗口</label><input type=\"range\" id=\"bSize\" min=\"40\" max=\"140\" step=\"10\" value=\"56\">\n<span class=\"vlabel\" id=\"bSizeLbl\">56 px</span>\n<button class=\"btn play\" id=\"bPlay\">▶ 播放</button>\n<button class=\"btn\" id=\"bTick\">单步</button><button class=\"btn\" id=\"bReset\">重置</button>\n<span class=\"out\" id=\"bOut\"></span>"},{"eyebrow":"第六问 · 核心原理 ⑥ 索引家族","title":"GiST、SP-GiST、BRIN，各有各的数据分布假设","lede":"三种索引都围绕 box2df / gidx 建摘要层，但 GiST 是 R-tree 风格的 bbox 树，SP-GiST 走空间分区，BRIN 用块范围摘要。","caption":"图 18　依据 postgis.sql.in、postgis_spgist.sql.in、postgis_brin.sql.in 与对应 C 源码重绘。","bridge":"索引让候选变少，可优化器怎么知道「会变少多少」？这就轮到 ANALYZE 收集的空间直方图了。","notes":"三种索引的区别，不在「谁更快」，而在它们各自假设数据长什么样。GiST 最常用：gist_geometry_ops_2d 存 box2df，也就是默认 CREATE INDEX ... USING gist；还有 _nd 存 gidx，给确实要用 Z/M 参与 &&& 过滤的场景。源码 gserialized_gist_2d.c 里，consistent 判断 entry bbox 和查询 bbox 是否可能匹配，penalty 用新增 bbox 后的面积变化挑插入子树，union 把一页里的 box 合成一个覆盖 box，KNN 则靠 <-> 和 distance 支持函数。SP-GiST 提供 2d、3d、nd 三套 opclass，picksplit 取 bbox 坐标的中位数形成中心，再按象限分配，inner_consistent 决定访问哪些子分区，适合点数据或分区特征明显的数据。BRIN 是 inclusion_ops_2d、_3d、_4d，对 block range 维护 box 摘要，不建逐行索引；只有追加型大表、并且物理装载顺序和空间位置高度相关时，才值得评估。三者共同点仍然是上一页那句：先减少候选，再精确剔除误命中，差别只在摘要怎么组织。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20\" y=\"20\" width=\"1360\" height=\"114\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><rect x=\"20\" y=\"20\" width=\"230\" height=\"114\" rx=\"5\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1\" /><text x=\"42\" y=\"82\" class=\"sv mono\" text-anchor=\"start\" font-size=\"24.0\" fill=\"#FFFFFF\" font-weight=\"700\" >GiST</text><text x=\"272\" y=\"52\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >gist_geometry_ops_2d 存 box2df（默认 USING gist）；_nd 存 gidx</text><text x=\"272\" y=\"82\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >consistent 判 entry bbox 与查询 bbox；penalty 用面积变化选子树</text><text x=\"272\" y=\"112\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >union 把页内 box 合成覆盖 box；KNN 靠 &lt;-&gt; 与 distance 支持函数</text><rect x=\"20\" y=\"148\" width=\"1360\" height=\"114\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><rect x=\"20\" y=\"148\" width=\"230\" height=\"114\" rx=\"5\" fill=\"#74A5AD\" stroke=\"#74A5AD\" stroke-width=\"1\" /><text x=\"42\" y=\"210\" class=\"sv mono\" text-anchor=\"start\" font-size=\"24.0\" fill=\"#1B2B33\" font-weight=\"700\" >SP-GiST</text><text x=\"272\" y=\"180\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >2d / 3d / nd 三套 opclass，按维度选</text><text x=\"272\" y=\"210\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >picksplit 取 bbox 坐标中位数形成中心，再按象限分配</text><text x=\"272\" y=\"240\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >inner_consistent 决定访问哪些子分区；适合分区特征明显的数据</text><rect x=\"20\" y=\"276\" width=\"1360\" height=\"114\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><rect x=\"20\" y=\"276\" width=\"230\" height=\"114\" rx=\"5\" fill=\"#CFE0DC\" stroke=\"#CFE0DC\" stroke-width=\"1\" /><text x=\"42\" y=\"338\" class=\"sv mono\" text-anchor=\"start\" font-size=\"24.0\" fill=\"#1B2B33\" font-weight=\"700\" >BRIN</text><text x=\"272\" y=\"308\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >inclusion_ops_2d / _3d / _4d，按维度维护块范围摘要</text><text x=\"272\" y=\"338\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >对 block range 维护 box 摘要，不建逐行索引</text><text x=\"272\" y=\"368\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >追加型大表且物理装载顺序与空间位置高度相关时可评估</text><text x=\"20\" y=\"414\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#BE653B\" font-weight=\"600\" >共同点：索引保存空间摘要，先减少候选，再由精确函数剔除误命中；差别只在「摘要怎么组织」。</text></svg>","ctrl":null},{"eyebrow":"第六问 · 核心原理 ⑦ 统计信息","title":"ANALYZE 不只是普通直方图","lede":"geometry_analyze 让 PostGIS 维护空间直方图，优化器得以估计空间谓词的选择率，而不是把空间函数完全当黑盒。","caption":"图 19　左：示意空间直方图与查询 box。右：从 ANALYZE 到执行计划的四步链路。","bridge":"到这里，六部件闭环的最后一环合上了。我们把它整体收回来看一眼，再谈收益与边界。","notes":"还有一个环节常被忽略：优化器凭什么决定用不用空间索引？CREATE TYPE 里那句 analyze = geometry_analyze 就是入口。源码 gserialized_estimate.c 的 THEORY OF OPERATION 说得很清楚：ANALYZE 会调用 gserialized_analyze_nd，PostGIS 为 2D 的 && 和 ND 的 &&& 各维护一套空间直方图；常量查询调 selectivity 估算函数，空间 join 调 join selectivity 估算函数。估算函数并不是「知道真实结果」，它做的是把查询 box 和直方图 extent 求交，累加重叠 cell 的 prorated count，再除以参与统计的 feature 数量，得到一个选择率。所以图里左边那个格子只是示意，不是真实统计。这件事给 DBA 两个非常直接的建议：批量导入、批量更新空间列之后，一定要 ANALYZE；想看清估算，可以用 _postgis_stats 和 _postgis_selectivity 观察，再用 EXPLAIN (ANALYZE, BUFFERS) 对照计划。统计信息一旧，优化器就可能错估候选规模，选错连接顺序、扫描方式，甚至干脆不用索引。到这一步，六部件的闭环就真的合上了。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><text x=\"20\" y=\"36\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" >2D / ND 空间直方图（示意）</text><rect x=\"24\" y=\"56\" width=\"58\" height=\"48\" rx=\"2\" fill=\"#EBF1EE\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><rect x=\"86\" y=\"56\" width=\"58\" height=\"48\" rx=\"2\" fill=\"#EBF1EE\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><rect x=\"148\" y=\"56\" width=\"58\" height=\"48\" rx=\"2\" fill=\"#CFE0DC\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><rect x=\"210\" y=\"56\" width=\"58\" height=\"48\" rx=\"2\" fill=\"#A4C4C6\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><rect x=\"272\" y=\"56\" width=\"58\" height=\"48\" rx=\"2\" fill=\"#74A5AD\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><rect x=\"334\" y=\"56\" width=\"58\" height=\"48\" rx=\"2\" fill=\"#A4C4C6\" stroke=\"#D9D5CB\" .8\" /><rect x=\"458\" y=\"264\" width=\"58\" height=\"48\" rx=\"2\" fill=\"#EBF1EE\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><rect x=\"148\" y=\"108\" width=\"186\" height=\"156\" rx=\"2\" fill=\"none\" stroke=\"#BE653B\" stroke-width=\"2.4\" /><text x=\"24\" y=\"336\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >查询 box 与 histogram extent 相交 → 累加重叠 cell 的 prorated count</text><text x=\"24\" y=\"360\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >再除以参与统计的 feature 数量 → 得到选择率估计</text><text x=\"24\" y=\"392\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" >示意直方图，非真实统计数据</text><rect x=\"560\" y=\"20\" width=\"820\" height=\"72\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"578\" y=\"50\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#245A6B\" font-weight=\"700\" >① ANALYZE</text><text x=\"578\" y=\"76\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >gserialized_analyze_nd 维护 2D &amp;&amp; 与 ND &amp;&amp;&amp; 空间直方图</text><rect x=\"560\" y=\"108\" width=\"820\" height=\"72\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"578\" y=\"138\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#245A6B\" font-weight=\"700\" >② 估算入口</text><text x=\"578\" y=\"164\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >常量查询走 selectivity；空间 join 走 join selectivity</text><rect x=\"560\" y=\"196\" width=\"820\" height=\"72\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"578\" y=\"226\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#245A6B\" font-weight=\"700\" >③ estimate_selectivity()</text><text x=\"578\" y=\"252\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >查询 box 相交 extent，累加重叠 cell 的 prorated count</text><rect x=\"560\" y=\"284\" width=\"820\" height=\"72\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"578\" y=\"314\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#2F7A66\" font-weight=\"700\" >④ 交给优化器</text><text x=\"578\" y=\"340\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >决定连接顺序、扫描方式、是否使用空间索引</text><rect x=\"560\" y=\"376\" width=\"820\" height=\"42\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"576\" y=\"403\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >批量导入后 ANALYZE store；观察 _postgis_stats() / _postgis_selectivity() 与 EXPLAIN (ANALYZE, BUFFERS)</text></svg>","ctrl":null},{"eyebrow":"收束 · 闭环","title":"什么才叫「一等数据类型」","lede":"类型、约束、物理表示、操作符、索引、统计与优化器首尾相接；任何一环缺位，空间能力就从数据库退回应用层。","caption":"图 20　六个部件沿直角回环相接。全图连线只有水平与竖直，无斜线穿过文字。","bridge":"闭环讲完，该兑现最实在的问题：把这套东西用起来，到底能多得什么，又有哪些确定性是它给不了的。","notes":"把前面六站连起来，才配叫「一等数据类型」。类型与函数体系让空间对象能进 SQL；typmod 把语义钉在列上；GSERIALIZED 决定它在磁盘上怎么摆、哪些元信息能秒读；bbox 操作符把对象接进索引；GiST、SP-GiST、BRIN 各自用一种数据组织方式存摘要；最后空间统计与优化器估计选择率，反过来决定前面这些能力有没有被用上。你看图里这条直角回环，它不是一个装饰性的圈：优化器估错了，索引就可能不被选；索引建得不合适，操作符再全也白搭；列上没 typmod，坏数据早早混进来，后面每一层都在给错误打工。反过来，六环齐了，空间查询就从「应用层循环加全表精算」，变成数据库内部一条可以被估计、被索引、被约束的执行路径。这就是 geometry 真正的定义，不是「能存经纬度」，而是让一整套数据库机制都认识空间对象。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40\" y=\"30\" width=\"360\" height=\"96\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"220.0\" y=\"83.6\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" >① SQL 类型与函数体系</text><rect x=\"520\" y=\"30\" width=\"360\" height=\"96\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"700.0\" y=\"83.6\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" >② typmod 列级契约</text><rect x=\"1000\" y=\"30\" width=\"360\" height=\"96\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"1180.0\" y=\"83.6\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" >③ GSERIALIZED 物理表示</text><rect x=\"40\" y=\"292\" width=\"360\" height=\"96\" rx=\"5\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"220.0\" y=\"345.25\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#2F7A66\" font-weight=\"600\" >⑥ 空间统计与优化器</text><rect x=\"520\" y=\"292\" width=\"360\" height=\"96\" rx=\"5\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"700.0\" y=\"345.25\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#2F7A66\" font-weight=\"600\" >⑤ GiST / SP-GiST / BRIN</text><rect x=\"1000\" y=\"292\" width=\"360\" height=\"96\" rx=\"5\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"1180.0\" y=\"345.25\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#2F7A66\" font-weight=\"600\" >④ bbox 操作符</text><line x1=\"400\" y1=\"78\" x2=\"514.4\" y2=\"78\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"520,78 513,74.15 513,81.85\" fill=\"#245A6B\" /><line x1=\"880\" y1=\"78\" x2=\"994.4\" y2=\"78\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"1000,78 993,74.15 993,81.85\" fill=\"#245A6B\" /><line x1=\"1000\" y1=\"340\" x2=\"885.6\" y2=\"340\" stroke=\"#2F7A66\" stroke-width=\"1.8\"/><polygon points=\"880,340 887,336.15 887,343.85\" fill=\"#2F7A66\" /><line x1=\"520\" y1=\"340\" x2=\"405.6\" y2=\"340\" stroke=\"#2F7A66\" stroke-width=\"1.8\"/><polygon points=\"400,340 407,336.15 407,343.85\" fill=\"#2F7A66\" /><line x1=\"1360\" y1=\"78\" x2=\"1390\" y2=\"78\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><line x1=\"1390\" y1=\"78\" x2=\"1390\" y2=\"340\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><line x1=\"1390\" y1=\"340\" x2=\"1367.6\" y2=\"340\" stroke=\"#2F7A66\" stroke-width=\"1.8\"/><polygon points=\"1362,340 1369,336.15 1369,343.85\" fill=\"#2F7A66\" /><line x1=\"40\" y1=\"340\" x2=\"14\" y2=\"340\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><line x1=\"14\" y1=\"340\" x2=\"14\" y2=\"78\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><line x1=\"14\" y1=\"78\" x2=\"32.4\" y2=\"78\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"38,78 31,74.15 31,81.85\" fill=\"#245A6B\" /><rect x=\"400\" y=\"156\" width=\"600\" height=\"108\" rx=\"5\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"700\" y=\"202\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"28.0\" fill=\"#245A6B\" font-weight=\"700\" >一等数据类型</text><text x=\"700\" y=\"238\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >约束 · 存储 · 索引 · 优化器，各自承担自己那一层</text><text x=\"20\" y=\"414\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#BE653B\" font-weight=\"600\" >闭环合上：优化器能估计空间谓词选择率，而不是把空间函数完全当黑盒；缺任一环，能力就退回应用层。</text></svg>","ctrl":null},{"eyebrow":"第七问 · 效果到底如何","title":"三个收益，四个「不要制造确定性」","lede":"收益来自数据质量、两阶段过滤、优化器参与；但索引收益依赖数据分布与写法，不能把「建了索引」当成「一定快」。","caption":"图 21　左：三个方向的收益。右：四条边界。底部给出可验证的评价方式。","bridge":"讲了这么久 geometry，也得把它放到同类方案旁边比一比，才知道什么时候该选它、什么时候不该。","notes":"兑现一下最实在的问题：用起来到底多得什么？第一，数据质量更早收敛，geometry(Point,4326) 在写入时就能拒绝错类型、错维度、错 SRID，约束离数据更近，覆盖的写入路径也更多。第二，空间查询从全表精算变成两阶段过滤，先用 bbox 和索引把候选缩小，再做精确判断。第三，优化器能参与空间计划，空间直方图和选择率函数让空间谓词不再是个黑盒。但原文特意提醒别制造不存在的确定性，我也照搬这四条：索引收益取决于数据分布、bbox 重叠、查询窗口、SRID、统计信息和返回候选比例；很大的多边形 bbox 太粗，误命中会增多；ST_DWithin、ST_Intersects 能用索引，不代表所有表达式写法都能用，常量、函数包裹、SRID 转换的位置都会影响计划；大对象更新仍然走 PostgreSQL 的 MVCC，产生新行版本并维护索引。所以工程评价别只看「有没有用索引」，要看 EXPLAIN (ANALYZE, BUFFERS) 里的候选行数、回表行数、过滤行数、索引扫描成本和 buffer 访问。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><text x=\"20\" y=\"34\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#2F7A66\" font-weight=\"700\" >三个收益</text><rect x=\"20\" y=\"50\" width=\"660\" height=\"92\" rx=\"5\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1\" /><text x=\"38\" y=\"82\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#2F7A66\" font-weight=\"700\" >数据质量更早收敛</text><text x=\"38\" y=\"114\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >写入时拒绝错类型、错维度、错 SRID，约束离数据更近、覆盖更多写入路径</text><rect x=\"20\" y=\"154\" width=\"660\" height=\"92\" rx=\"5\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1\" /><text x=\"38\" y=\"186\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#2F7A66\" font-weight=\"700\" >空间查询两阶段过滤</text><text x=\"38\" y=\"218\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >先用 bbox 和索引缩小候选，再做精确几何判断，不再全表精算</text><rect x=\"20\" y=\"258\" width=\"660\" height=\"92\" rx=\"5\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1\" /><text x=\"38\" y=\"290\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#2F7A66\" font-weight=\"700\" >优化器能参与空间计划</text><text x=\"38\" y=\"322\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >空间直方图与选择率函数，让空间谓词不再是黑盒</text><text x=\"720\" y=\"34\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#BE653B\" font-weight=\"700\" >四个不要制造确定性</text><rect x=\"720\" y=\"50\" width=\"660\" height=\"68\" rx=\"5\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1\" /><text x=\"738\" y=\"77\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"700\" >收益取决于分布</text><text x=\"738\" y=\"102\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >bbox 重叠程度、查询窗口、SRID、统计信息、返回候选比例</text><rect x=\"720\" y=\"128\" width=\"660\" height=\"68\" rx=\"5\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1\" /><text x=\"738\" y=\"155\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"700\" >大对象 bbox 很粗</text><text x=\"738\" y=\"180\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >跨大范围的多边形误命中增多，索引可能返回过多候选</text><rect x=\"720\" y=\"206\" width=\"660\" height=\"68\" rx=\"5\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1\" /><text x=\"738\" y=\"233\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"700\" >表达式写法有影响</text><text x=\"738\" y=\"258\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >常量、函数包裹、SRID 转换位置都会影响能否用索引</text><rect x=\"720\" y=\"284\" width=\"660\" height=\"68\" rx=\"5\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1\" /><text x=\"738\" y=\"311\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"700\" >更新仍走 MVCC</text><text x=\"738\" y=\"336\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >大对象更新产生新行版本，并维护相关索引与 TOAST</text><rect x=\"20\" y=\"374\" width=\"1360\" height=\"42\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1\" /><text x=\"38\" y=\"401\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#AE8A3E\" font-weight=\"600\" >评价看 EXPLAIN (ANALYZE, BUFFERS)：候选行数、回表行数、过滤行数、索引扫描成本与 buffer 访问，而不是只看「有没有用索引」。</text></svg>","ctrl":null},{"eyebrow":"第八问 · 横向对比","title":"把它放到同类方案旁边看","lede":"geometry、geography、PostgreSQL 内置几何类型、WKT/GeoJSON 文本，目标不同；差别集中在坐标系统、索引能力与计算代价。","caption":"图 22　依据原文「四、横向对比」的七个维度重绘为表格图；单元格文字按列宽自动缩排。","bridge":"表格看的是「能力清单」，真正做决定时还得按查询目标走一遍分支——下一页把它变成一棵可执行的决策树。","notes":"把四种选择并排放，边界就清楚了。geometry 的目标是平面空间对象建模、分析和索引，任意 SRID，计算单位由 SRID 决定，支持完整 OGC 几何族，GiST、SP-GiST、BRIN、bbox、KNN 都能用，平面计算代价通常较低；代价是 SRID 错用、单位误解、bbox 误命中。geography 面向地球椭球和球面语义上的距离与面积，函数范围比 geometry 小、成本更高，适合跨大范围测量。PostgreSQL 内置的 point、box、path、polygon 只是简单几何类型，没有完整 CRS/SRID 体系，生态和功能都不够，做 GIS 级场景不合适。WKT 和 GeoJSON 文本是交换格式，数据库不理解里面的空间语义，每次计算都要解析，类型系统、索引、约束都弱。这张表想说的不是「谁更好」，而是：目标不同，代价记在不同地方。","svg" \"196\" y=\"266\" width=\"292\" height=\"52\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"209\" y=\"293.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >平面计算通常较低</text><rect x=\"488\" y=\"266\" width=\"292\" height=\"52\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"501\" y=\"293.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >地理测量通常更贵</text><rect x=\"780\" y=\"266\" width=\"292\" height=\"52\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"793\" y=\"293.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >简单</text><rect x=\"1072\" y=\"266\" width=\"288\" height=\"52\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"1085\" y=\"293.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >每次解析成本高</text><rect x=\"20\" y=\"318\" width=\"176\" height=\"52\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"33\" y=\"345.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#245A6B\" font-weight=\"700\" >适合场景</text><rect x=\"196\" y=\"318\" width=\"292\" height=\"52\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"209\" y=\"336.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >本地投影、Web 地图、</text><text x=\"209\" y=\"354.75\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >空间 join、围栏、工程数据</text><rect x=\"488\" y=\"318\" width=\"292\" height=\"52\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"501\" y=\"336.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >全球范围距离 / 面积、</text><text x=\"501\" y=\"354.75\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >经纬度测量</text><rect x=\"780\" y=\"318\" width=\"292\" height=\"52\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"793\" y=\"345.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >简单几何实验、小工具</text><rect x=\"1072\" y=\"318\" width=\"288\" height=\"52\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"1085\" y=\"345.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >数据交换、日志、归档</text><rect x=\"20\" y=\"370\" width=\"176\" height=\"52\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"33\" y=\"397.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#245A6B\" font-weight=\"700\" >主要风险</text><rect x=\"196\" y=\"370\" width=\"292\" height=\"52\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"209\" y=\"388.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >SRID 错用、单位误解、</text><text x=\"209\" y=\"406.75\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >bbox 误命中</text><rect x=\"488\" y=\"370\" width=\"292\" height=\"52\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"501\" y=\"388.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >函数覆盖不如 geometry，</text><text x=\"501\" y=\"406.75\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >成本更高</text><rect x=\"780\" y=\"370\" width=\"292\" height=\"52\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"793\" y=\"397.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >生态和功能不足</text><rect x=\"1072\" y=\"370\" width=\"288\" height=\"52\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"1085\" y=\"388.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >类型系统、索引、</text><text x=\"1085\" y=\"406.75\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >约束都弱</text></svg>","ctrl":null},{"eyebrow":"第八问 · 落到决策上","title":"四问，把选型变成一棵可以走的树","lede":"先看是否在库内计算，再看查询核心是不是空间关系，再看是否跨大范围测量，最后看要不要 PostGIS 生态。","caption":"图 23　依据原文「四、横向对比」结尾的四条判断重绘为直角决策树。","bridge":"纸上谈兵到这里就够了。下面三条 SQL 把前面所有机制落到可验证的点上——注意它们并未在当前环境执行。","notes":"选型别背表格，走四个分支就行。第一问：这些数据只是原样收发、归档，根本不在数据库里查询或计算吗？如果是，WKT 或 GeoJSON 文本就够，但最好再存一列派生的 geometry 专门服务查询，别让归档格式承担计算。第二问：查询核心是不是展示、相交、包含、地图范围过滤，而且能接受投影坐标语义？是就选 geometry，本地投影、Web 地图、空间 join、围栏都在这里。第三问：核心是不是地球表面的距离、面积、缓冲，而且跨的区域比较大？那优先评估 geography，或者先转到合适的投影再算。第四问：只是 PostgreSQL 内部做点简单几何实验、不依赖 PostGIS 生态？内置类型可以用，但别指望它撑起 GIS 级场景。还有两类要先治理再建模：坐标系混乱、SRID 和经纬度顺序都没洗干净的数据，建 geometry 只是把错误包装起来；以及极高频更新的大几何对象，MVCC、TOAST、索引维护和 vacuum 压力都得提前算进预算。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"430\" y=\"14\" width=\"540\" height=\"66\" rx=\"5\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"700.0\" y=\"54.35\" class=\"sv s\" text-anchor=\"middle\" font-size=\"21.0\" fill=\"#FFFFFF\" font-weight=\"600\" >查询主要在做什么？</text><line x1=\"700\" y1=\"80\" x2=\"700\" y2=\"140\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><line x1=\"180\" y1=\"140\" x2=\"1220\" y2=\"140\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><line x1=\"180\" y1=\"140\" x2=\"180\" y2=\"198\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><line x1=\"180\" y1=\"198\" x2=\"180\" y2=\"210.4\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"180,216 176.15,209 183.85,209\" fill=\"#245A6B\" /><rect x=\"20\" y=\"220\" width=\"325\" height=\"168\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><rect x=\"20\" y=\"220\" width=\"325\" height=\"40\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"34\" y=\"246\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"700\" >只交换，不在库内计算</text><text x=\"34\" y=\"292\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >WKT / GeoJSON 文本归档即可</text><text x=\"34\" y=\"328\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >最好另存派生 geometry 列服务查询</text><text x=\"34\" y=\"372\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#BE653B\" font-weight=\"700\" >文本 + 派生列</text><line x1=\"525\" y1=\"140\" x2=\"525\" y2=\"198\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><line x1=\"525\" y1=\"198\" x2=\"525\" y2=\"210.4\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"525,216 521.15,209 528.85,209\" fill=\"#245A6B\" /><rect x=\"365\" y=\"220\" width=\"325\" height=\"168\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><rect x=\"365\" y=\"220\" width=\"325\" height=\"40\" rx=\"5\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1\" /><text x=\"379\" y=\"246\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#2F7A66\" font-weight=\"700\" >展示 / 相交 / 包含 / 范围</text><text x=\"379\" y=\"292\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >可接受投影坐标语义 → geometry</text><text x=\"379\" y=\"328\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >本地投影、Web 地图、空间 join</text><text x=\"379\" y=\"372\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#BE653B\" font-weight=\"700\" >geometry</text><line x1=\"870\" y1=\"140\" x2=\"870\" y2=\"198\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><line x1=\"870\" y1=\"198\" x2=\"870\" y2=\"210.4\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"870,216 866.15,209 873.85,209\" fill=\"#245A6B\" /><rect x=\"710\" y=\"220\" width=\"325\" height=\"168\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><rect x=\"710\" y=\"220\" width=\"325\" height=\"40\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"724\" y=\"246\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"700\" >地球表面距离 / 面积</text><text x=\"724\" y=\"292\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >跨区域较大 → 优先评估 geography</text><text x=\"724\" y=\"328\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >或先转换到适合的投影再算</text><text x=\"724\" y=\"372\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#BE653B\" font-weight=\"700\" >geography</text><line x1=\"1215\" y1=\"140\" x2=\"1215\" y2=\"198\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><line x1=\"1215\" y1=\"198\" x2=\"1215\" y2=\"210.4\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"1215,216 1211.15,209 1218.85,209\" fill=\"#245A6B\" /><rect x=\"1055\" y=\"220\" width=\"325\" height=\"168\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><rect x=\"1055\" y=\"220\" width=\"325\" height=\"40\" rx=\"5\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1\" /><text x=\"1069\" y=\"246\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#2F7A66\" font-weight=\"700\" >简单几何实验</text><text x=\"1069\" y=\"292\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >不依赖 PostGIS 生态 → 内置类型可用</text><text x=\"1069\" y=\"328\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >但不适合 GIS 级场景</text><text x=\"1069\" y=\"372\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#BE653B\" font-weight=\"700\" >内置类型</text><text x=\"720\" y=\"126\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#AE8A3E\" font-weight=\"600\" >别用一句「经纬度就 geography，平面就 geometry」结束判断</text><text x=\"20\" y=\"414\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >另需谨慎：坐标系混乱先治理 SRID 与坐标顺序；极高频更新的大几何对象注意 MVCC、TOAST 与 vacuum 压力。</text></svg>","ctrl":null},{"eyebrow":"第九问 · 实操 DEMO","title":"三条 SQL，三个要盯住的验证点","lede":"KNN 靠 <->；ST_Intersects 靠 support function 补索引条件；SRID 错误靠 typmod 尽早失败。三条都建议配 EXPLAIN 看计划。","caption":"图 24　依据原文「六、实操 DEMO」三例重绘。底部保留原文的「未执行」声明，避免把示例当作实测结果。","bridge":"会写 SQL 之后，剩下的是长期习惯。把架构师、DBA、业务开发者各自最容易忽略的几条，收成一张清单。","notes":"三条 DEMO，各自盯一个点。第一条，点数据和 KNN：建表、插点、建默认二维 GiST、ANALYZE，然后 ORDER BY geom <-> 常量 LIMIT 2。要验证的是计划里有没有走 GiST KNN 路径；千万别把 ST_Distance 直接写进 ORDER BY 就期待同样的索引排序，KNN 能力来自 <-> 这个 ordering operator 和 GiST 的 distance 支持函数。第二条，面数据范围查询：parcel 上建 GiST，WHERE 里写 ST_Intersects(geom, ST_MakeEnvelope(...))。它是精确谓词，但 PostGIS 的 support function 会替它补上空间索引条件；如果计划没用索引，先查表规模、统计信息、查询窗口选择性、SRID 是否一致，以及表达式有没有把索引列包得认不出来。第三条，SRID 尽早失败：列是 geometry(Point,4326)，输入 SRID 0 会被补成 4326，输入 3857 应该直接报错。这里必须诚实说明一句，原文也写得很清楚：这些 SQL 没有在当前环境执行过，工作区只有 PostGIS 源码，没有运行中的实例和测试数据，语法是按本地 SQL 定义和文档写的。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20\" y=\"20\" width=\"440\" height=\"250\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"20\" y=\"20\" width=\"440\" height=\"34\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"34\" y=\"43\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"700\" >① 点建模与 KNN</text><text x=\"35\" y=\"78\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#1B2B33\" font-weight=\"400\" >CREATE INDEX store_geom_gist_idx</text><text x=\"35\" y=\"102\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#1B2B33\" font-weight=\"400\" >  ON store USING gist (geom);</text><text x=\"35\" y=\"126\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#1B2B33\" font-weight=\"400\" >ANALYZE store;</text><text x=\"35\" y=\"150\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#1B2B33\" font-weight=\"400\" >SELECT id, name FROM store</text><text x=\"35\" y=\"174\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#1B2B33\" font-weight=\"400\" >ORDER BY geom &lt;-&gt; ST_SetSRID(</text><text x=\"35\" y=\"198\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#1B2B33\" font-weight=\"400\" >  ST_MakePoint(120.11,30.20),4326)</text><text x=\"35\" y=\"222\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#1B2B33\" font-weight=\"400\" >LIMIT 2;</text><text x=\"35\" y=\"248\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"600\" >验证：看是否走 GiST KNN 路径</text><rect x=\"480\" y=\"20\" width=\"440\" height=\"250\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"480\" y=\"20\" width=\"440\" height=\"34\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"494\" y=\"43\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"700\" >② 面数据范围查询</text><text x=\"495\" y=\"78\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#1B2B33\" font-weight=\"400\" >CREATE INDEX parcel_geom_gist_idx</text><text x=\"495\" y=\"102\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#1B2B33\" font-weight=\"400\" >  ON parcel USING gist (geom);</text><text x=\"495\" y=\"126\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#1B2B33\" font-weight=\"400\" >ANALYZE parcel;</text><text x=\"495\" y=\"150\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#1B2B33\" font-weight=\"400\" >SELECT id FROM parcel WHERE</text><text x=\"495\" y=\"174\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#1B2B33\" font-weight=\"400\" >ST_Intersects(geom,</text><text x=\"495\" y=\"198\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#1B2B33\" font-weight=\"400\" >  ST_MakeEnvelope(120.0,30.0,</text><text x=\"495\" y=\"222\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#1B2B33\" font-weight=\"400\" >    120.2,30.2,4326));</text><text x=\"495\" y=\"248\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"600\" >验证：精确谓词 + 索引条件</text><rect x=\"940\" y=\"20\" width=\"440\" height=\"250\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"940\" y=\"20\" width=\"440\" height=\"34\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"954\" y=\"43\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"700\" >③ SRID 错误尽早失败</text><text x=\"955\" y=\"78\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#1B2B33\" font-weight=\"400\" >CREATE TABLE gps_event (</text><text x=\"955\" y=\"102\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#1B2B33\" font-weight=\"400\" >  geom geometry(Point,4326));</text><text x=\"955\" y=\"126\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#1B2B33\" font-weight=\"400\" >INSERT INTO gps_event(geom)</text><text x=\"955\" y=\"150\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#1B2B33\" font-weight=\"400\" >  VALUES (ST_MakePoint(120.1,30.2));</text><text x=\"955\" y=\"174\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#89938F\" font-weight=\"400\" >-- SRID 3857 应报错，不静默写入</text><text x=\"955\" y=\"198\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#1B2B33\" font-weight=\"400\" >INSERT INTO gps_event(geom) VALUES (</text><text x=\"955\" y=\"222\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#1B2B33\" font-weight=\"400\" >  ST_SetSRID(ST_MakePoint(120.1,30.2),3857));</text><text x=\"955\" y=\"248\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"600\" >验证：postgis_valid_typmod()</text><rect x=\"20\" y=\"280\" width=\"440\" height=\"62\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"34\" y=\"304\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >别把 ST_Distance 写进 ORDER BY</text><text x=\"34\" y=\"328\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >期待索引排序；KNN 来自 &lt;-&gt; 操作符</text><rect x=\"480\" y=\"280\" width=\"440\" height=\"62\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"494\" y=\"304\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >没用索引先查统计信息、窗口选择性</text><text x=\"494\" y=\"328\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >SRID 一致性、表达式是否可识别</text><rect x=\"940\" y=\"280\" width=\"440\" height=\"62\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"954\" y=\"304\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >未知 SRID 继承列 SRID</text><text x=\"954\" y=\"328\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >非零且不匹配的 SRID 必须失败</text><rect x=\"20\" y=\"354\" width=\"1360\" height=\"40\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1\" /><text x=\"34\" y=\"380\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#AE8A3E\" font-weight=\"600\" >说明：以上 SQL 未在当前环境执行（工作区只有 PostGIS 源码，无运行中的实例与测试数据）；语法按本地 SQL 定义与文档编写。</text><text x=\"20\" y=\"414\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >三段 DEMO 均建议配合 EXPLAIN (ANALYZE, BUFFERS) 观察计划，而不是只看「有没有用索引」。</text></svg>","ctrl":null},{"eyebrow":"第十问 · 长期习惯","title":"三种角色，各自最该记住的五件事","lede":"架构师管模型与坐标系，DBA 管统计、计划与索引选择，开发者管构造方式、坐标顺序与算子语义。","caption":"图 25　依据原文「七、最佳实践」按角色重排；每列五条，均为高频且可执行的要点。","bridge":"清单之外还有一类知识最容易被忽略：哪些坑是「机制决定了必然会发生」的。最后把它们按机制归一次类。","notes":"把长期习惯按角色分一下，比混在一起背有用。架构师这边：先明确几何对象的业务含义再定列类型，能写 geometry(Point,4326) 就别写裸的；把 SRID 纳入模型设计，别当备注，它决定单位、索引窗口和测量语义；大对象和高频更新对象分层建模，热点属性别和大 geometry 频繁一起更新；空间和时间总是一起过滤时，评估组合索引、分区或冷热分层，而不是只给 geom 单列建个索引。DBA 这边：批量导入后 ANALYZE；用 EXPLAIN (ANALYZE, BUFFERS) 看候选集和过滤比例，不只看索引名字；普通二维优先 GiST，点数据或分区特征明显评估 SP-GiST，追加型大表且空间相关性高评估 BRIN；关注索引膨胀、表膨胀和 VACUUM；极复杂 geometry 考虑 ST_Subdivide、简化层、瓦片层或者 bbox 物化列。开发者这边：造点用 ST_MakePoint 加 ST_SetSRID，别拼 WKT 字符串；记牢 ST_SetSRID 只贴标签；x 是经度、y 是纬度，别写反；&& 不等于 ST_Intersects；API 可以传 GeoJSON，但入库最好转成 geometry 并加 typmod 和索引。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20\" y=\"20\" width=\"440\" height=\"362\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><rect x=\"20\" y=\"20\" width=\"440\" height=\"42\" rx=\"5\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"36\" y=\"48\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#FFFFFF\" font-weight=\"700\" >面向数据库架构师</text><rect x=\"36\" y=\"76\" width=\"5\" height=\"5\" rx=\"1\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"50\" y=\"90\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >先明确几何对象的业务含义，再定列类型</text><line x1=\"36\" y1=\"112\" x2=\"444\" y2=\"112\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"36\" y=\"134\" width=\"5\" height=\"5\" rx=\"1\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"50\" y=\"148\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >能写 geometry(Point,4326) 就别写裸 geometry</text><line x1=\"36\" y1=\"170\" x2=\"444\" y2=\"170\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"36\" y=\"192\" width=\"5\" height=\"5\" rx=\"1\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"50\" y=\"206\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >把 SRID 纳入模型设计，别当备注</text><line x1=\"36\" y1=\"228\" x2=\"444\" y2=\"228\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"36\" y=\"250\" width=\"5\" height=\"5\" rx=\"1\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"50\" y=\"264\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >大对象与高频更新对象分层建模</text><line x1=\"36\" y1=\"286\" x2=\"444\" y2=\"286\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"36\" y=\"308\" width=\"5\" height=\"5\" rx=\"1\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"50\" y=\"322\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >空间 + 时间常一起过滤 → 组合索引 / 分区 / 冷热分层</text><rect x=\"480\" y=\"20\" width=\"440\" height=\"362\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><rect x=\"480\" y=\"20\" width=\"440\" height=\"42\" rx=\"5\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"496\" y=\"48\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#FFFFFF\" font-weight=\"700\" >面向 DBA</text><rect x=\"496\" y=\"76\" width=\"5\" height=\"5\" rx=\"1\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"510\" y=\"90\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >大批量导入后执行 ANALYZE，更新空间直方图</text><line x1=\"496\" y1=\"112\" x2=\"904\" y2=\"112\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"496\" y=\"134\" width=\"5\" height=\"5\" rx=\"1\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"510\" y=\"148\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >用 EXPLAIN (ANALYZE, BUFFERS) 看候选与过滤比例</text><line x1=\"496\" y1=\"170\" x2=\"904\" y2=\"170\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"496\" y=\"192\" width=\"5\" height=\"5\" rx=\"1\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"510\" y=\"206\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >普通二维优先 GiST；点 / 分区特征明显评估 SP-GiST</text><line x1=\"496\" y1=\"228\" x2=\"904\" y2=\"228\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"496\" y=\"250\" width=\"5\" height=\"5\" rx=\"1\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"510\" y=\"264\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >追加型大表且空间相关性高时评估 BRIN</text><line x1=\"496\" y1=\"286\" x2=\"904\" y2=\"286\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"496\" y=\"308\" width=\"5\" height=\"5\" rx=\"1\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"510\" y=\"322\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.8\" fill=\"#46585F\" font-weight=\"400\" >极复杂 geometry 考虑 ST_Subdivide、简化层、瓦片层或 bbox 物化列</text><rect x=\"940\" y=\"20\" width=\"440\" height=\"362\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><rect x=\"940\" y=\"20\" width=\"440\" height=\"42\" rx=\"5\" fill=\"#AE8A3E\" stroke=\"#AE8A3E\" stroke-width=\"1\" /><text x=\"956\" y=\"48\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#FFFFFF\" font-weight=\"700\" >面向业务开发者</text><rect x=\"956\" y=\"76\" width=\"5\" height=\"5\" rx=\"1\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"970\" y=\"90\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >构造点优先 ST_MakePoint + ST_SetSRID，别拼 WKT</text><line x1=\"956\" y1=\"112\" x2=\"1364\" y2=\"112\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"956\" y=\"134\" width=\"5\" height=\"5\" rx=\"1\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"970\" y=\"148\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >ST_SetSRID 不转坐标；转坐标用 ST_Transform</text><line x1=\"956\" y1=\"170\" x2=\"1364\" y2=\"170\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"956\" y=\"192\" width=\"5\" height=\"5\" rx=\"1\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"970\" y=\"206\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >x=longitude、y=latitude，顺序别写反</text><line x1=\"956\" y1=\"228\" x2=\"1364\" y2=\"228\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"956\" y=\"250\" width=\"5\" height=\"5\" rx=\"1\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"970\" y=\"264\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >&amp;&amp; 是 bbox 判断，不等同 ST_Intersects</text><line x1=\"956\" y1=\"286\" x2=\"1364\" y2=\"286\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"956\" y=\"308\" width=\"5\" height=\"5\" rx=\"1\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"970\" y=\"322\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >API 可传 GeoJSON / WKT，入库转 geometry 并加 typmod 与索引</text><text x=\"20\" y=\"412\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >要点摘录自原文「七、最佳实践」，按角色归位；完整条目见全文讲稿与原文。</text></svg>","ctrl":null},{"eyebrow":"第十一问 · 常见坑","title":"十个坑，其实只归四类机制","lede":"把 SRID 当转换、用 4326 算米、裸列吞坏数据、bbox 当精确谓词……看似十条，背后是坐标系、约束、过滤粒度、统计计划四类。","caption":"图 26　依据原文「九、常见坑」十条重绘为坑位地图；底部给出按机制的归类。","bridge":"坑都认完了，最后把这一整条因果链收回成一句话，再留三个可以自己继续追的问题。","notes":"最后把十个高频坑过一遍，但别一条条死记，它们其实归四类。第一类是坐标系：把 SRID 当转换函数，ST_SetSRID 其实不改坐标值；用 4326 的 geometry 直接算米，可它的单位是度；还有经纬度顺序写反，POINT(lat lon) 会悄悄变成另一个位置，typmod 都发现不了。第二类是约束：裸 geometry 列吞掉坏数据，错误更晚暴露；Multi 和 single 混用没有策略，MultiPolygon 列能接受单 polygon 自动提升，反过来不一定成立。第三类是过滤粒度：把 && 当精确谓词，复杂 polygon 很容易误命中；3D 数据还用 2D 谓词，需要 Z 参与过滤就得看 &&& 和 ND opclass。第四类是统计与计划：导入后不 ANALYZE，优化器严重误判；每次写 ST_Transform(geom,4326) 这种函数包裹，索引列就认不出来；以及最普遍的一条——以为建了空间索引就一定快，可查询窗口大、bbox 高重叠、统计过旧、返回比例高的时候，顺序扫描反而更合理。你按这四类去记，遇到新坑也能自己归位。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20\" y=\"16\" const N = D.length;

function fit(){
  const vp = $('#viewport');
  const W = vp.clientWidth, H = vp.clientHeight;
  const s = Math.min(W/1600, H/900);
  SCALE = s;
  const st = $('#stage');
  st.style.transform = 'scale(' + s + ')';
  st.style.left = ((W - 1600*s)/2) + 'px';
  st.style.top  = ((H -  900*s)/2) + 'px';
}
window.addEventListener('resize', fit);

function render(){
  $('#slides').innerHTML = D.map((d,i) =>
    '<section class="slide" id="s'+i+'">'
    + '<div class="eyebrow"><span class="num">'+pad(i+1)+' / '+pad(N)+'</span>'+d.eyebrow+'</div>'
    + '<h1 class="title">'+d.title+'</h1>'
    + '<div class="lede">'+d.lede+'</div>'
    + '<div class="rule"></div>'
    + '<div class="figwrap">'+d.svg+'</div>'
    + (d.ctrl ? '<div class="ctrls">'+d.ctrl+'</div>' : '<div class="caption">'+d.caption+'</div>')
    + '<div class="bridge"><span class="bk">承接 · NEXT</span>'+d.bridge+'</div>'
    + '<div class="footer"><div class="fbar"><i id="fbar'+i+'"></i></div>'
    + '<span class="fl">数据库筑基课 · geometry 数据类型</span>'
    + '<span class="fr">'+pad(i+1)+' / '+pad(N)+'</span></div>'
    + '</section>').join('');
}

function toast(s){
  const t=$('#toast'); t.textContent=s; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1700);
}
function go(i, silent){
  i = Math.max(0, Math.min(N-1, i));
  $$('.slide').forEach((el,k)=>el.classList.toggle('on', k===i));
  cur = i;
  try{ localStorage.setItem('geometry-slide', String(i)); }catch(e){}
  $('.pg').textContent = pad(i+1) + ' / ' + pad(N);
  $('#track i').style.width = ((i+1)/N*100)+'%';
  for(let k=0;k<N;k++){ const b=$('#fbar'+k); if(b) b.style.width = (k<=i?100:0)+'%'; }
  if(!silent) toast(D[i].eyebrow + ' · ' + D[i].title);
}
function next(){ if(cur<N-1) go(cur+1); else stopAuto(); }
function prev(){ if(cur>0) go(cur-1); }
function stopAuto(){
  autoOn=false; clearInterval(autoTimer); autoTimer=null;
  $('#btnAuto').textContent='▶ 自动播放 P'; $('#btnAuto').classList.remove('act');
}
function toggleAuto(){
  if(autoOn){ stopAuto(); toast('已暂停自动播放'); return; }
  autoOn=true; $('#btnAuto').textContent='❚❚ 暂停 P'; $('#btnAuto').classList.add('act');
  autoTimer=setInterval(()=>{ if(cur<N-1) go(cur+1,true); else stopAuto(); }, 12000);
  toast('自动播放：每 12 秒一页');
}

    if(!drag) return;
    let nx=drag.x+(e.clientX-drag.dx)/SCALE, ny=drag.y+(e.clientY-drag.dy)/SCALE;
    nx=Math.max(0,Math.min(1600-drag.w,nx)); ny=Math.max(0,Math.min(900-drag.h,ny));
    w.style.left=nx+'px'; w.style.top=ny+'px';
  });
  window.addEventListener('mouseup', ()=>{drag=null;});
}
function fs(){
  const el=document.documentElement;
  const entering=!document.body.classList.contains('immersive');
  if(entering){
    document.body.classList.add('immersive');
    $('#btnFs').textContent='退出全屏 F';
    fit();
    toast('全屏：底部已显示快捷键条（F 或 Esc 退出）');
    try{
      const pr = el.requestFullscreen ? el.requestFullscreen() : null;
      if(pr && pr.catch) pr.catch(()=>{});
    }catch(e){}
  }else{
    document.body.classList.remove('immersive');
    $('#btnFs').textContent='全屏 F';
    fit();
    toast('已退出全屏');
    try{ if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen(); }catch(e){}
  }
}
document.addEventListener('fullscreenchange', ()=>{
  document.body.classList.toggle('fs', !!document.fullscreenElement);
  if(!document.fullscreenElement && document.body.classList.contains('immersive')){
    document.body.classList.remove('immersive');
    const b=$('#btnFs'); if(b) b.textContent='全屏 F';
  }
  fit();
});

document.addEventListener('keydown', e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  const k=e.key;
  const typing=(tag==='input'||tag==='select'||tag==='textarea');
  const navKey=(k.indexOf('Arrow')===0||k===' '||k==='Home'||k==='End'||k==='PageUp'||k==='PageDown');
  if(k==='Escape'){
    if(winOn){ closeWin(); return; }
    if(document.body.classList.contains('immersive')) fs();
    return;
  }
  if(k==='f'||k==='F'||e.code==='KeyF'){ e.preventDefault(); fs(); return; }
  if(winOn) return;
  if(typing && navKey) return;
  if(k==='ArrowRight'||k===' '||k==='PageDown'){ e.preventDefault(); next(); }
  else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); prev(); }
  else if(k==='g'||k==='G'){ e.preventDefault(); toc(); }
  else if(k==='n'||k==='N'){ e.preventDefault(); notesHere(); }
  else if(k==='t'||k==='T'){ e.preventDefault(); notesAll(); }
  else if(k==='p'||k==='P'){ e.preventDefault(); toggleAuto(); }
  else if(k==='?'||k==='h'||k==='H'){ e.preventDefault(); help(); }
  else if(k==='Home'){ e.preventDefault(); go(0); }
  else if(k==='End'){ e.preventDefault(); go(N-1); }
  else if(/^[1-9]$/.test(k)){ go(parseInt(k,10)-1); }
});

/* ---------- 动画 A：写入路径上的 typmod 契约 ---------- */
const A_VALS = {
  p4326:{label:'SRID=4326;POINT(120.1 30.2)',type:'POINT',srid:4326,z:false},
  p0   :{label:'POINT(120.1 30.2)',type:'POINT',srid:0,z:false},
  p3857:{label:'SRID=3857;POINT(120.1 30.2)',type:'POINT',srid:3857,z:false},
  line :{label:'SRID=4326;LINESTRING(...)',type:'LINESTRING',srid:4326,z:false},
  pz   :{label:'SRID=4326;POINT Z(120.1 30.2 5)',type:'POINT',srid:4326,z:true},
  poly :{label:'SRID=4326;POLYGON((...))',type:'POLYGON',srid:4326,z:false}
};
function aVerdict(){
  const col=$('#aCol').value, v=A_VALS[$('#aVal').value];
  const colType = col==='point' ? 'POINT' : 'MULTIPOLYGON';
  let type=v.type, srid=v.srid, fix=null;
  if(srid===0){ fix='SRID 0 → 补成列 SRID 4326'; srid=4326; }
  else if(srid!==4326) return {ok:false,fix:null,why:'Geometry SRID ('+srid+') does not match column SRID (4326)'};
  if(colType==='MULTIPOLYGON' && type==='POLYGON'){ fix='单 POLYGON → 提升为 MULTIPOLYGON'; type='MULTIPOLYGON'; }
  if(type!==colType) return {ok:false,fix:null,why:'Geometry type ('+type+') does not match column type ('+colType+')'};
  if(v.z) return {ok:false,fix:null,why:'Geometry has Z dimension but column does not'};
  return {ok:true,fix:fix,why:fix?'无歧义修正后写入 GSERIALIZED':'类型、SRID、维度全部匹配，直接写入'};
}
let aStep=0, aTimer=null, aPlaying=false;
const A_STEPS=5;
function aPaint(){
  const v=aVerdict(), col=$('#aCol').value, val=A_VALS[$('#aVal').value];
  $('#aColText').textContent = col==='point' ? 'geometry(Point, 4326)' : 'geometry(MultiPolygon, 4326)';
  $('#aValText').textContent = val.label;
  $$('#animA .astage').forEach(b=>{
    const n=+b.getAttribute('data-step');
    b.setAttribute('fill', n<=aStep ? '#E5EFF0' : '#FFFFFF');
    b.setAttribute('stroke', n<=aStep ? '#245A6B' : '#D9D5CB');
    b.setAttribute('stroke-width', n===aStep ? '2.4' : '1.1');
  });
  $$('#animA .aarrow').forEach(a=>{
    const n=+a.getAttribute('data-step');
    const c=n<=aStep ? '#245A6B' : '#D9D5CB';
    if(a.tagName.toLowerCase()==='polygon') a.setAttribute('fill',c); else a.setAttribute('stroke',c);
  });
  const show=aStep>=4;
  $('#aBand').setAttribute('fill', !show ? '#F1EFE9' : (v.ok ? (v.fix?'#F5EDDC':'#E4F0EA') : '#F7E9DE'));
  $('#aVerdict').textContent = !show ? '等待 typmod 校验…'
      : (v.ok ? (v.fix?'可自动修正 → 写入 GSERIALIZED':'校验通过 → 写入 GSERIALIZED') : '拒绝写入 → 报错');
  $('#aVerdict').setAttribute('fill', !show ? '#46585F' : (v.ok?'#2F7A66':'#BE653B'));
  $('#aWhy').textContent = !show ? '按「播放」或「单步」推进写入路径' : v.why;
  $('#aFix').textContent = (show && v.fix) ? v.fix : '';
  const out=$('#aOut');
  out.innerHTML='<b>'+(col==='point'?'Point,4326':'MultiPolygon,4326')+'</b> · '
      +val.label+' → '+(v.ok?'写入':'拒绝');
  out.title=out.textContent;
}
function aPause(){
  aPlaying=false; clearInterval(aTimer); aTimer=null;
  const b=$('#aPlay'); if(b){ b.textContent='▶ 播放'; b.classList.remove('play'); }
}
function aPlay(){
  if(aPlaying){ aPause(); return; }
  aPlaying=true; $('#aPlay').textContent='❚❚ 暂停'; $('#aPlay').classList.add('play');
  if(aStep>=A_STEPS) aStep=0;
  aTimer=setInterval(()=>{ aStep++; aPaint(); if(aStep>=A_STEPS) aPause(); },780);
}
function aTick(){ aPause(); if(aStep<A_STEPS){ aStep++; aPaint(); } }
function aReset(){ aPause(); aStep=0; aPaint(); }
function aChanged(){ aPause(); aStep=A_STEPS; aPaint(); }

/* ---------- 动画 B：bbox 粗过滤与精确重算 ---------- */
const B_FRAMES=[[40,40],[240,60],[322,58],[460,70],[630,60],[710,128],[90,230],[370,228],[510,240],[700,296]];
let bFrame=0, bTimer=null, bPlaying=false;
function bWin(){
  const s=+$('#bSize').value;
  let x=B_FRAMES[bFrame][0], y=B_FRAMES[bFrame][1];
  x=Math.max(20,Math.min(880-s,x)); y=Math.max(20,Math.min(360-s,y));
  return {x:x,y:y,s:s};
}
function overlap(a,b){
  return Math.min(a.x+a.w,b.x+b.w)>Math.max(a.x,b.x)
      && Math.min(a.y+a.h,b.y+b.h)>Math.max(a.y,b.y);
}
function bCalc(){
  const q=bWin(), qr={x:q.x,y:q.y,w:q.s,h:q.s};
  const cand=[], hits=[];
  BS.forEach((sh,i)=>{
    const bb={x:sh.b[0],y:sh.b[1],w:sh.b[2],h:sh.b[3]};
    if(overlap(qr,bb)) cand.push(i);
    if(sh.c.some(c=>overlap(qr,{x:c[0],y:c[1],w:c[2],h:c[3]}))) hits.push(i);
  });
  return {q:q,cand:cand,hits:hits};
}
function bPaint(){
  const r=bCalc(), n=r.cand.length, m=r.hits.length;
  const wr=$('#bWinRect');
  wr.setAttribute('x',r.q.x); wr.setAttribute('y',r.q.y);
  wr.setAttribute('width',r.q.s); wr.setAttribute('height',r.q.s);
  BS.forEach((sh,i)=>{
    const isC=r.cand.indexOf(i)>=0, isH=r.hits.indexOf(i)>=0;
    $$('#animB .cell[data-idx="'+i+'"]').forEach(el=>{
      el.setAttribute('fill', isH?'#E4F0EA':(isC?'#F7E9DE':'#FFFFFF'));
      el.setAttribute('stroke', isH?'#2F7A66':(isC?'#BE653B':'#7BA6AF'));
    });
    $$('#animB .bb[data-idx="'+i+'"]').forEach(el=>{
      el.setAttribute('stroke', isC?'#BE653B':'#D9D5CB');
      el.setAttribute('stroke-width', isC?'2':'1');
      el.setAttribute('opacity', isC?'1':'0.55');
    });
  });
  $('#bN').textContent=n; $('#bM').textContent=m; $('#bF').textContent=(n-m);
  $('#bSizeLbl').textContent=$('#bSize').value+' px';
  const out=$('#bOut');
  out.innerHTML='<b>第 '+(bFrame+1)+'/'+B_FRAMES.length+' 帧</b> · bbox 候选 '+n
      +' · 精确命中 '+m+' · 误命中 '+(n-m)+'（示意图形计算，非真实基准）';
  out.title=out.textContent;
}
function bPause(){
  bPlaying=false; clearInterval(bTimer); bTimer=null;
  const b=$('#bPlay'); if(b){ b.textContent='▶ 播放'; b.classList.remove('play'); }
}
function bPlay(){
  if(bPlaying){ bPause(); return; }
  bPlaying=true; $('#bPlay').textContent='❚❚ 暂停'; $('#bPlay').classList.add('play');
  if(bFrame>=B_FRAMES.length-1) bFrame=0;
  bTimer=setInterval(()=>{ bFrame++; bPaint(); if(bFrame>=B_FRAMES.length-1) bPause(); },850);
}
function bTick(){ bPause(); bFrame=(bFrame+1)%B_FRAMES.length; bPaint(); }
function bReset(){ bPause(); bFrame=0; bPaint(); }

function init(){
  render(); fit();
  let saved=0; try{ saved=parseInt(localStorage.getItem('geometry-slide')||'0',10)||0; }catch(e){}
  go(saved,true);
  $('#btnPrev').onclick=prev; $('#btnNext').onclick=next;
  $('#btnToc').onclick=toc; $('#btnNotes').onclick=notesHere;
  $('#btnAll').onclick=notesAll; $('#btnAuto').onclick=toggleAuto;
  $('#btnFs').onclick=fs; $('#btnHelp').onclick=help;
  $('#winX').onclick=closeWin;
  initDrag();
  aPaint(); bPaint();
  ['aCol','aVal'].forEach(id=>{ const el=$('#'+id); if(el){ el.addEventListener('change',aChanged); } });
  $('#bSize').addEventListener('input', bPaint);
  const bind=(id,fn)=>{ const el=$(id); if(el) el.onclick=fn; };
  bind('#aPlay',aPlay); bind('#aTick',aTick); bind('#aReset',aReset);
  bind('#bPlay',bPlay); bind('#bTick',bTick); bind('#bReset',bReset);
}
document.addEventListener('DOMContentLoaded', init);
</script>
