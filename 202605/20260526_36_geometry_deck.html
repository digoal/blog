<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数据库筑基课 · geometry 数据类型｜把一串坐标变成空间对象</title>
<!-- 单文件交付：所有原理图均为现场绘制的内联 SVG，无外部图片、字体、脚本依赖。 -->
<!-- 视觉母题：地层剖面 / 工程蓝图。内容按「缺口→折中→是什么→写入→存储→语义边界→索引→优化器→闭环→效果→选型→实践」推演。 -->
<style>
:root{
  --bg:#F7F6F2; --ink:#1B2B33; --ink2:#46585F; --muted:#89938F; --line:#D9D5CB;
  --primary:#245A6B; --prim-l:#E5EFF0; --accent:#BE653B; --acc-l:#F7E9DE;
  --green:#2F7A66; --green-l:#E4F0EA; --gold:#AE8A3E;
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#E9E7E1}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
#viewport{position:absolute;inset:0 0 58px 0;overflow:hidden}
#stage{position:absolute;width:1600px;height:900px;background:var(--bg);
  transform-origin:top left;box-shadow:0 18px 60px rgba(27,43,51,.13)}
.slide{position:absolute;inset:0;display:none}
.slide.on{display:block;animation:fadein .42s cubic-bezier(.2,.7,.2,1)}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{position:absolute;left:64px;top:44px;font-size:13px;letter-spacing:3.4px;
  color:var(--primary);font-weight:600}
.eyebrow .num{font-family:var(--mono);letter-spacing:1px;color:var(--accent);margin-right:14px}
h1.title{position:absolute;left:64px;top:70px;margin:0;font-family:var(--serif);
  font-size:44px;line-height:1.25;font-weight:700;letter-spacing:1.2px;color:var(--ink)}
.lede{position:absolute;left:64px;top:139px;width:1440px;font-size:19px;color:var(--ink2);
  line-height:1.5;letter-spacing:.3px}
.rule{position:absolute;left:64px;top:181px;width:1472px;height:1px;background:var(--line)}
.figwrap{position:absolute;left:100px;top:198px;width:1400px;height:430px}
svg.figure{display:block;overflow:visible}
svg.figure text{font-family:var(--sans)}
svg.figure text.serif{font-family:var(--serif)}
svg.figure text.mono{font-family:var(--mono)}
.caption{position:absolute;left:100px;top:638px;width:1400px;font-size:13px;
  color:var(--muted);letter-spacing:.4px}
.bridge{position:absolute;left:64px;top:706px;width:1472px;font-size:20px;
  color:var(--accent);line-height:1.55;letter-spacing:.4px;padding-left:18px;
  border-left:3px solid var(--accent);font-family:var(--serif)}
.bridge .bk{font-family:var(--sans);font-size:13px;color:var(--muted);
  letter-spacing:2px;display:block;margin-bottom:2px}
.footer{position:absolute;left:64px;top:846px;width:1472px;height:1px;background:var(--line)}
.footer .fl{position:absolute;left:0;top:14px;font-size:12.5px;color:var(--muted);letter-spacing:2px}
.footer .fr{position:absolute;right:0;top:12px;font-family:var(--mono);font-size:14px;color:var(--ink2)}
.footer .fbar{position:absolute;left:0;right:0;top:-1px;height:2px;background:transparent}
.footer .fbar i{display:block;height:2px;background:var(--primary);width:0;transition:width .4s ease}

/* 动画控件：独立条带，绝不覆盖图 */
.ctrls{position:absolute;left:100px;top:638px;width:1400px;height:46px;display:flex;
  align-items:center;gap:12px}
.ctrls label{font-size:13.5px;color:var(--ink2);white-space:nowrap}
.ctrls select,.ctrls input[type=range]{font-family:var(--sans);font-size:13px;color:var(--ink);
  background:#fff;border:1px solid var(--line);border-radius:4px;padding:5px 8px;outline:none}
.ctrls select{max-width:290px}
.ctrls input[type=range]{width:150px;padding:0;accent-color:var(--primary);border:none;background:transparent}
.ctrls .btn{min-height:30px;padding:5px 13px;border:1px solid var(--primary);border-radius:4px;
  background:#fff;color:var(--primary);font-size:13.5px;cursor:pointer;font-family:var(--sans);white-space:nowrap}
.ctrls .btn.play{background:var(--primary);color:#fff}
.ctrls .btn:hover{filter:brightness(.94)}
.ctrls .vlabel{font-family:var(--mono);font-size:12.5px;color:var(--ink2);white-space:nowrap}
.ctrls .out{font-size:13px;color:var(--ink2);margin-left:auto;min-width:0;flex:1;
  max-width:480px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrls .out b{color:var(--accent);font-weight:600}

/* 底部外壳 */
.chrome{position:fixed;left:0;right:0;bottom:0;height:58px;background:#FCFBF8;
  border-top:1px solid var(--line);display:flex;align-items:center;gap:6px;
  padding:0 16px;z-index:40;font-size:13px;color:var(--ink2)}
.chrome .sep{width:1px;height:22px;background:var(--line);margin:0 5px}
.chrome button{font-family:var(--sans);font-size:13px;color:var(--ink2);background:transparent;
  border:1px solid transparent;border-radius:5px;padding:7px 10px;cursor:pointer;white-space:nowrap}
.chrome button:hover{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome button.act{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome .pg{font-family:var(--mono);font-size:14px;color:var(--ink);min-width:76px;text-align:center}
.chrome .track{flex:1;height:3px;background:var(--line);border-radius:3px;margin:0 10px;position:relative}
.chrome .track i{position:absolute;left:0;top:0;height:3px;background:var(--primary);border-radius:3px;transition:width .35s}
body.immersive #viewport,body.fs #viewport{inset:0 0 40px 0}
body.immersive .chrome,body.fs .chrome{display:none}
.keybar{position:fixed;left:0;right:0;bottom:0;height:40px;background:rgba(252,251,248,.97);
  border-top:1px solid var(--line);display:none;align-items:center;justify-content:center;
  gap:14px;z-index:45;font-size:12.5px;color:var(--ink2);white-space:nowrap}
body.immersive .keybar,body.fs .keybar{display:flex}
.keybar kbd{font-family:var(--mono);font-size:11.5px;background:#fff;border:1px solid var(--line);
  border-bottom-width:2px;border-radius:4px;padding:2px 6px;color:var(--primary);margin-right:5px}
.keybar span{color:var(--ink2)}
.keybar .kb-t{font-family:var(--serif);color:var(--accent);letter-spacing:1px}

/* 页内开窗：不是浏览器弹窗，也不是遮罩模态；画面左侧始终可见 */
.win{position:absolute;display:none;z-index:30;background:var(--bg);
  border:1px solid var(--primary);box-shadow:0 16px 46px rgba(27,43,51,.17);
  border-radius:6px;overflow:hidden}
.win.on{display:flex;flex-direction:column}
.winbar{height:46px;flex:none;background:var(--primary);color:#fff;display:flex;
  align-items:center;padding:0 14px;cursor:move;user-select:none}
.winbar .wt{font-family:var(--serif);font-size:17px;letter-spacing:1px}
.winbar .ws{font-family:var(--mono);font-size:11px;opacity:.72;margin-left:12px}
.winbar .wx{margin-left:auto;background:transparent;border:1px solid rgba(255,255,255,.55);
  color:#fff;border-radius:4px;padding:3px 10px;cursor:pointer;font-size:12px}
.winbar .wx:hover{background:rgba(255,255,255,.16)}
.winbody{padding:22px 28px 28px;overflow:auto;flex:1;font-size:16px;line-height:1.95;color:var(--ink2)}
.winbody p{margin:0 0 12px}
.winbody h3{margin:2px 0 6px;font-family:var(--serif);font-size:23px;color:var(--primary)}
.winbody .sn{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:1px;
  display:block;margin-bottom:14px}
.winbody .sec{border-top:1px solid var(--line);padding:16px 0}
.winbody .sec:first-of-type{border-top:none;padding-top:0}
.winbody .sec h4{margin:0 0 8px;font-family:var(--serif);font-size:19px;color:var(--primary)}
.winbody .bq{font-family:var(--serif);color:var(--accent);font-size:15.5px;line-height:1.7}
.wgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.wgrid a{display:block;padding:11px 12px;border:1px solid var(--line);background:#fff;
  border-radius:5px;text-decoration:none;cursor:pointer;color:var(--ink)}
.wgrid a:hover{border-color:var(--primary);background:var(--prim-l)}
.wgrid .gn{font-family:var(--mono);font-size:12px;color:var(--accent)}
.wgrid .gt{font-family:var(--serif);font-size:15px;display:block;margin-top:4px;line-height:1.4}
.wkeys{display:grid;grid-template-columns:repeat(2,1fr);gap:9px 26px;font-size:14.5px;line-height:1.8}
.wkeys kbd{font-family:var(--mono);background:#fff;border:1px solid var(--line);
  border-bottom-width:2px;border-radius:4px;padding:2px 7px;color:var(--primary);margin-right:8px}
.toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);background:var(--ink);
  color:#fff;font-size:13px;padding:9px 16px;border-radius:5px;opacity:0;transition:.3s;z-index:80;pointer-events:none}
.toast.on{opacity:1}
@media print{.chrome,.keybar,.win,.toast{display:none!important}#viewport{position:static}
  #stage{position:static;transform:none!important;box-shadow:none}
  .slide{display:block!important;page-break-after:always;position:relative;height:900px}}
</style>

</div></div>

<script>
const D = [{"eyebrow":"开场 · 这一节要回答什么","title":"把「一串坐标」，变成一个空间对象","lede":"经度、纬度、多边形、轨迹，本来只是几个数字；geometry 做的事，是让数据库知道这些数字共同表达了一个空间对象，并围绕它形成一整套闭环。","caption":"图 01　从最底层的业务对象，到最上层的空间查询：七层不是七个知识点，是同一个类型系统的七个位置。越深越底层。","bridge":"先别急着看这七层。我想先从一个你我都写过的表讲起，因为「缺口在哪里」比「答案是什么」更值得先说清楚。","notes":"大家好，这一节讲 PostGIS 的 geometry。先别把它当成一个「能存经纬度的数据类型」，那样一开场就把题目缩小了。我们真正要问的是：凭什么两个数字摆在同一行，数据库就能知道它们是一个点？再往上，凭什么一条 SQL 能问出三公里内最近的门店、一个围栏里有没有车、两块地是不是相交？这些问题的共同前提是，数据库得把空间对象当成一等数据类型来对待，而不只是把坐标数字存下来。你看右边这七层，从最底下的业务对象，一直到最上面的空间查询，中间依次是物理表示、列级约束、操作符、索引摘要、统计估算。它们不是七个孤立的知识点，是同一套类型系统在七个位置上的投影——越深的靛青，越靠近底层。今天这场就顺着这条链，一层一层把它剖开，最后再合回去。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40\" y=\"20\" width=\"420\" height=\"390\" rx=\"6\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1\" /><text x=\"250\" y=\"100\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"40.0\" fill=\"#FFFFFF\" font-weight=\"700\" >geometry</text><line x1=\"90\" y1=\"126\" x2=\"410\" y2=\"126\" stroke=\"#74A5AD\" stroke-width=\"1\"/><text x=\"250\" y=\"178\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"24.0\" fill=\"#FFFFFF\" font-weight=\"600\" >把「一串坐标」</text><text x=\"250\" y=\"216\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"24.0\" fill=\"#FFFFFF\" font-weight=\"600\" >变成一个空间对象</text><text x=\"250\" y=\"292\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#A4C4C6\" font-weight=\"400\" >类型 · SRID · 维度 · 边界框</text><text x=\"250\" y=\"320\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#A4C4C6\" font-weight=\"400\" >操作符 · 索引 · 优化器</text><text x=\"250\" y=\"372\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#CFE0DC\" font-weight=\"400\" >数据库筑基课 · 数据类型与算子</text><rect x=\"500\" y=\"20\" width=\"860\" height=\"48\" rx=\"4\" fill=\"#EBF1EE\" stroke=\"#EBF1EE\" stroke-width=\"1\" /><line x1=\"478\" y1=\"44\" x2=\"500\" y2=\"44\" stroke=\"#47808D\" stroke-width=\"1.6\"/><text x=\"520\" y=\"50\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"700\" >SQL 空间查询</text><text x=\"790\" y=\"50\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >范围 / 相交 / 包含 / 最近邻</text><rect x=\"500\" y=\"76\" width=\"860\" height=\"48\" rx=\"4\" fill=\"#CFE0DC\" stroke=\"#CFE0DC\" stroke-width=\"1\" /><line x1=\"478\" y1=\"100\" x2=\"500\" y2=\"100\" stroke=\"#47808D\" stroke-width=\"1.6\"/><text x=\"520\" y=\"106\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"700\" >优化器与统计</text><text x=\"790\" y=\"106\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >空间直方图 · 选择率估算</text><rect x=\"500\" y=\"132\" width=\"860\" height=\"48\" rx=\"4\" fill=\"#A4C4C6\" stroke=\"#A4C4C6\" stroke-width=\"1\" /><line x1=\"478\" y1=\"156\" x2=\"500\" y2=\"156\" stroke=\"#47808D\" stroke-width=\"1.6\"/><text x=\"520\" y=\"162\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"700\" >索引摘要</text><text x=\"790\" y=\"162\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >GiST / SP-GiST / BRIN · box2df / gidx</text><rect x=\"500\" y=\"188\" width=\"860\" height=\"48\" rx=\"4\" fill=\"#74A5AD\" stroke=\"#74A5AD\" stroke-width=\"1\" /><line x1=\"478\" y1=\"212\" x2=\"500\" y2=\"212\" stroke=\"#47808D\" stroke-width=\"1.6\"/><text x=\"520\" y=\"218\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"700\" >操作符</text><text x=\"790\" y=\"218\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >&amp;&amp; · &amp;&amp;&amp; · @ · ~ · &lt;-&gt; · &lt;#&gt;</text><rect x=\"500\" y=\"244\" width=\"860\" height=\"48\" rx=\"4\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1\" /><line x1=\"478\" y1=\"268\" x2=\"500\" y2=\"268\" stroke=\"#47808D\" stroke-width=\"1.6\"/><text x=\"520\" y=\"274\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#FFFFFF\" font-weight=\"700\" >typmod 契约</text><text x=\"790\" y=\"274\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#E5EFF0\" font-weight=\"400\" >几何类型 · 维度 · SRID</text><rect x=\"500\" y=\"300\" width=\"860\" height=\"48\" rx=\"4\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1\" /><line x1=\"478\" y1=\"324\" x2=\"500\" y2=\"324\" stroke=\"#47808D\" stroke-width=\"1.6\"/><text x=\"520\" y=\"330\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#FFFFFF\" font-weight=\"700\" >GSERIALIZED</text><text x=\"790\" y=\"330\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#E5EFF0\" font-weight=\"400\" >size · srid · flags · 可选 BBox · 坐标</text><rect x=\"500\" y=\"356\" width=\"860\" height=\"48\" rx=\"4\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1\" /><line x1=\"478\" y1=\"380\" x2=\"500\" y2=\"380\" stroke=\"#47808D\" stroke-width=\"1.6\"/><text x=\"520\" y=\"386\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#FFFFFF\" font-weight=\"700\" >业务对象</text><text x=\"790\" y=\"386\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#E5EFF0\" font-weight=\"400\" >门店 · 围栏 · 地块 · 轨迹 —— 最底层</text><line x1=\"478\" y1=\"44\" x2=\"478\" y2=\"380\" stroke=\"#47808D\" stroke-width=\"1.6\"/></svg>","ctrl":null},{"eyebrow":"第一问 · 缺口在哪里","title":"四种日常做法，其实是同一个缺口","lede":"门店表拆两列、围栏塞 JSON、地块存成字符串、轨迹点越攒越多——写法各不相同，失败的位置却完全一样。","caption":"图 02　上半是四种常见建模；下半是数据库真正看到的东西。问题不在「坐标不能存」，而在类型系统缺席。","bridge":"看清缺口之后，先别急着接受答案。我们得先检查一遍：那些看起来能绕过去的替代方案，到底绕掉了什么。","notes":"先说四种特别常见的表。第一种，门店表拆成 longitude、latitude 两列，业务要找三公里内最近的门店。第二种，围栏把多边形存成 JSON，车辆是不是进了区域，靠应用层循环去判。第三种更普遍，地块、管线、道路、配送区域统统用字符串保存，数据库能做的就只剩文本等值和模糊匹配。第四种是量变引起质变：轨迹点少的时候还凑合，点一多，范围查询、相交判断、最近邻搜索，全都变成全表扫描。你把这四种摆在一起看，会发现它们不是四个问题，是同一个问题的四个侧面。数据库实际看见的，只是两列数字、一段 JSON、一个字符串、一堆孤立的点；它并不知道这些数字共同表达了一个空间对象。所以「坐标能不能存」从来不是问题，坐标当然能存。真正的问题是：类型系统不参与，空间语义就只能搬到应用层去实现，或者干脆退化成一次次的全表精算。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20\" y=\"20\" width=\"325\" height=\"128\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><rect x=\"20\" y=\"20\" width=\"325\" height=\"34\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"36\" y=\"44\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" >经纬度两列</text><text x=\"36\" y=\"84\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\" >longitude / latitude</text><text x=\"36\" y=\"116\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >找 3 公里内最近门店</text><line x1=\"182\" y1=\"148\" x2=\"182\" y2=\"180.4\" stroke=\"#7BA6AF\" stroke-width=\"1.7\"/><polygon points=\"182,186 178.15,179 185.85,179\" fill=\"#7BA6AF\" /><rect x=\"365\" y=\"20\" width=\"325\" height=\"128\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><rect x=\"365\" y=\"20\" width=\"325\" height=\"34\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"381\" y=\"44\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" >围栏存 JSON</text><text x=\"381\" y=\"84\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\" >多边形塞进 JSON</text><text x=\"381\" y=\"116\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >应用层循环判断车辆是否入区</text><line x1=\"527\" y1=\"148\" x2=\"527\" y2=\"180.4\" stroke=\"#7BA6AF\" stroke-width=\"1.7\"/><polygon points=\"527,186 523.15,179 530.85,179\" fill=\"#7BA6AF\" /><rect x=\"710\" y=\"20\" width=\"325\" height=\"128\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><rect x=\"710\" y=\"20\" width=\"325\" height=\"34\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"726\" y=\"44\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" >几何存字符串</text><text x=\"726\" y=\"84\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\" >地块 / 管线 / 道路</text><text x=\"726\" y=\"116\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >只能文本等值和模糊匹配</text><line x1=\"872\" y1=\"148\" x2=\"872\" y2=\"180.4\" stroke=\"#7BA6AF\" stroke-width=\"1.7\"/><polygon points=\"872,186 868.15,179 875.85,179\" fill=\"#7BA6AF\" /><rect x=\"1055\" y=\"20\" width=\"325\" height=\"128\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><rect x=\"1055\" y=\"20\" width=\"325\" height=\"34\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"1071\" y=\"44\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" >轨迹点变多</text><text x=\"1071\" y=\"84\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\" >范围 / 相交 / 最近邻</text><text x=\"1071\" y=\"116\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >慢慢都退化成全表扫描</text><line x1=\"1217\" y1=\"148\" x2=\"1217\" y2=\"180.4\" stroke=\"#7BA6AF\" stroke-width=\"1.7\"/><polygon points=\"1217,186 1213.15,179 1220.85,179\" fill=\"#7BA6AF\" /><rect x=\"20\" y=\"190\" width=\"1360\" height=\"62\" rx=\"5\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"40\" y=\"228\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"600\" >数据库实际看见的：两列数字　/　一段 JSON　/　一个字符串　/　一堆孤立点</text><line x1=\"700\" y1=\"252\" x2=\"700\" y2=\"281.6\" stroke=\"#BE653B\" stroke-width=\"2\"/><polygon points=\"700,288 695.6,280 704.4,280\" fill=\"#BE653B\" /><rect x=\"20\" y=\"292\" width=\"1360\" height=\"74\" rx=\"5\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1\" /><text x=\"40\" y=\"324\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#A4C4C6\" font-weight=\"700\" >共同缺口</text><text x=\"40\" y=\"352\" class=\"sv serif\" text-anchor=\"start\" font-size=\"24.0\" fill=\"#FFFFFF\" font-weight=\"700\" >数据库不知道这些数字共同表达了一个空间对象</text><text x=\"40\" y=\"404\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"600\" >于是：空间关系只能搬到应用层实现，或者退化成全表精算</text></svg>","ctrl":null},{"eyebrow":"第一问 · 为什么不能绕过去","title":"三类替代方案，省下的力气都记在别处","lede":"拆数值列、存文本、用 EAV 点表，都能把数据放下；但每一种都在把空间语义推给应用层，代价只是换了个地方付。","caption":"图 03　三类替代方案的优点与主要问题。对照原文「一、它解决什么问题？」的对比表。","bridge":"既然三条路都不够，那 PostGIS 给的折中到底是什么？答案不是「多一种存储格式」，而是一整套闭环。","notes":"有人会说，我不用新类型也能做啊。确实能，我们把三条路摊开看看。第一条，拆成 x、y 或者 lon、lat 数值列，最省事，B-tree 还能处理单列范围；可它表达不了线、面、集合，距离、相交、包含全得在应用层写，索引更不可能理解空间关系。第二条，把 WKT 或 GeoJSON 存成文本，好处是对象结构还在，和外部系统交换也方便；代价是数据库只知道这是个字符串，每算一次都要解析一遍，typmod 约束和空间索引基本无从谈起。第三条，用 EAV 或者点表把边界拆开，灵活度最高，复杂对象也能拼出来；可拓扑、合法性、聚合、索引、事务一致性，每一项都变复杂，开发成本一下就上去了。你看这三条路，省下的力气都没消失，只是记在别处：它们都绕开了同一件事——让数据库自己理解空间语义。于是校验帮不上忙，索引帮不上忙，优化器也帮不上忙。这就引出 PostGIS 的折中。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20\" y=\"20\" width=\"280\" height=\"42\" rx=\"3\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"160.0\" y=\"45.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"700\" >做法</text><rect x=\"300\" y=\"20\" width=\"400\" height=\"42\" rx=\"3\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"500.0\" y=\"45.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"700\" >优点</text><rect x=\"700\" y=\"20\" width=\"700\" height=\"42\" rx=\"3\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"1050.0\" y=\"45.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"700\" >主要问题</text><rect x=\"20\" y=\"62\" width=\"280\" height=\"96\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"33\" y=\"101.03999999999999\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"700\" >拆成 x/y</text><text x=\"33\" y=\"122.03999999999999\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"700\" >或 lon/lat 数值列</text><rect x=\"300\" y=\"62\" width=\"400\" height=\"96\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"313\" y=\"111.53999999999999\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >简单；B-tree 能处理单列范围</text><rect x=\"700\" y=\"62\" width=\"700\" height=\"96\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"713\" y=\"111.53999999999999\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >无法表达线、面、集合；距离、相交、包含要应用层实现；索引不理解空间关系</text><rect x=\"20\" y=\"158\" width=\"280\" height=\"96\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"33\" y=\"197.04\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"700\" >存 WKT /</text><text x=\"33\" y=\"218.04\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"700\" >GeoJSON 文本</text><rect x=\"300\" y=\"158\" width=\"400\" height=\"96\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"313\" y=\"207.54\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >保留对象结构；和外部系统兼容</text><rect x=\"700\" y=\"158\" width=\"700\" height=\"96\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"713\" y=\"207.54\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >数据库只知道它是字符串；每次计算都要解析；难以做 typmod 约束和空间索引</text><rect x=\"20\" y=\"254\" width=\"280\" height=\"96\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"33\" y=\"293.04\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"700\" >EAV /</text><text x=\"33\" y=\"314.04\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"700\" >点表拆边界</text><rect x=\"300\" y=\"254\" width=\"400\" height=\"96\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"313\" y=\"303.54\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >灵活；可表达复杂对象</text><rect x=\"700\" y=\"254\" width=\"700\" height=\"96\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"713\" y=\"303.54\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >拓扑、合法性、聚合、索引和事务一致性都复杂，开发成本高</text><rect x=\"20\" y=\"356\" width=\"1360\" height=\"58\" rx=\"5\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1\" /><text x=\"40\" y=\"392\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#BE653B\" font-weight=\"600\" >三条路都绕开了同一件事：让数据库自己理解空间语义 —— 于是校验、索引、优化器都帮不上忙。</text></svg>","ctrl":null},{"eyebrow":"第二问 · 折中是什么","title":"不是一种存储格式，是六个部件的闭环","lede":"用 SQL 类型承载对象、用 typmod 约束列语义、用 GSERIALIZED 落盘、用操作符接索引、用统计信息让优化器参与——缺一环，闭环就断了。","caption":"图 04　六个部件首尾相接。下方回环线表示：优化器的判断又反过来决定前五个部件是否被有效使用。","bridge":"闭环听起来很美，但工程上最忌讳先讲好处。我们下一页先把代价摆在桌面上，免得后面每个机制都被误当成承诺。","notes":"PostGIS 的折中，不是「发明一种更紧凑的坐标格式」，而是让六个部件首尾相接。第一，用 SQL 类型承载 Point、LineString、Polygon、Multi 这些对象；第二，用 typmod 把类型和 SRID 约束写到列上，比如 geometry(Point,4326)；第三，用 GSERIALIZED 把 SRID、维度、可选边界框和递归几何数据存进行里；第四，用 &&、&&&、@、~、<-> 这些操作符，把对象接进 GiST、SP-GiST、BRIN；第五，索引保存的是可索引摘要；第六，geometry_analyze 收集空间统计，让优化器能估计空间谓词的选择率。外圈再加一整套函数体系，构造、输出、测量、关系、叠加、校验、投影转换都在 SQL 里。你看图里下面那条回环线，它很关键：优化器估得准不准，会反过来决定前面五个部件到底有没有被用上。所以这不是六个可以任选其四的功能点，是一个闭环——任何一环缺位，空间查询就会退回最开始那张图：应用层循环加全表精算。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20\" y=\"40\" width=\"210\" height=\"118\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"125.0\" y=\"92.125\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"600\" >① SQL 类型</text><text x=\"125.0\" y=\"114.625\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >geometry 变长类型</text><line x1=\"230\" y1=\"99\" x2=\"244.4\" y2=\"99\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"250,99 243,95.15 243,102.85\" fill=\"#245A6B\" /><rect x=\"250\" y=\"40\" width=\"210\" height=\"118\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"355.0\" y=\"92.125\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"600\" >② typmod</text><text x=\"355.0\" y=\"114.625\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >列级约束</text><line x1=\"460\" y1=\"99\" x2=\"474.4\" y2=\"99\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"480,99 473,95.15 473,102.85\" fill=\"#245A6B\" /><rect x=\"480\" y=\"40\" width=\"210\" height=\"118\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"585.0\" y=\"92.125\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"600\" >③ 存储</text><text x=\"585.0\" y=\"114.625\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >GSERIALIZED</text><line x1=\"690\" y1=\"99\" x2=\"704.4\" y2=\"99\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"710,99 703,95.15 703,102.85\" fill=\"#245A6B\" /><rect x=\"710\" y=\"40\" width=\"210\" height=\"118\" rx=\"5\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"815.0\" y=\"92.125\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#2F7A66\" font-weight=\"600\" >④ 操作符</text><text x=\"815.0\" y=\"114.625\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >&amp;&amp; / &amp;&amp;&amp; / &lt;-&gt;</text><line x1=\"920\" y1=\"99\" x2=\"934.4\" y2=\"99\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"940,99 933,95.15 933,102.85\" fill=\"#245A6B\" /><rect x=\"940\" y=\"40\" width=\"210\" height=\"118\" rx=\"5\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"1045.0\" y=\"92.125\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#2F7A66\" font-weight=\"600\" >⑤ 索引</text><text x=\"1045.0\" y=\"114.625\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >GiST / SP-GiST / BRIN</text><line x1=\"1150\" y1=\"99\" x2=\"1164.4\" y2=\"99\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"1170,99 1163,95.15 1163,102.85\" fill=\"#245A6B\" /><rect x=\"1170\" y=\"40\" width=\"210\" height=\"118\" rx=\"5\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"1275.0\" y=\"92.125\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#2F7A66\" font-weight=\"600\" >⑥ 优化器</text><text x=\"1275.0\" y=\"114.625\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >空间统计与选择率</text><line x1=\"1345\" y1=\"158\" x2=\"1345\" y2=\"258\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><line x1=\"1345\" y1=\"258\" x2=\"125\" y2=\"258\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><line x1=\"125\" y1=\"258\" x2=\"125\" y2=\"165.6\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"125,160 121.15,167 128.85,167\" fill=\"#245A6B\" /><text x=\"700\" y=\"244\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >闭环：任何一环缺位，空间查询就退回「应用层循环 + 全表精算」</text><rect x=\"20\" y=\"300\" width=\"1360\" height=\"66\" rx=\"5\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1\" /><text x=\"40\" y=\"330\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#A4C4C6\" font-weight=\"700\" >折中的本质</text><text x=\"40\" y=\"356\" class=\"sv serif\" text-anchor=\"start\" font-size=\"21.0\" fill=\"#FFFFFF\" font-weight=\"700\" >不把空间逻辑留给应用层，而是让类型系统一路管到执行计划</text><text x=\"40\" y=\"404\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >再加上函数体系：构造、输出、测量、关系、叠加、校验、投影转换</text></svg>","ctrl":null},{"eyebrow":"第二问 · 先把代价摆上桌","title":"三个「不能想当然」，先讲在前面","lede":"geometry 默认是平面几何；SRID 不会自动转换坐标系；空间索引通常索引的是边界框摘要，而不是完整几何对象。","caption":"图 05　三类代价分别对应：计算语义、坐标系、索引粒度。原文「一、它解决什么问题？」结尾已明确列出。","bridge":"代价讲完，就可以安心往里走了。先看最靠外的一层：在 SQL 里，geometry 到底是个什么东西。","notes":"工程上我习惯先把代价摆在桌面上，不然每个机制都容易被听成承诺。第一，geometry 默认是平面几何。它不会自动把经纬度当成球面距离来算，ST_Distance 在 4326 上算出来的单位是度，不是米。SRID 在这里决定的是坐标单位，不是「帮我换算成米」。第二，SRID 是元数据和坐标参考系统标识，不是转换函数。两个不同 SRID 的对象不会因为都带 SRID 就自动变成同一个坐标系，需要 ST_Transform 时必须显式转换。第三，空间索引通常索引的是边界框摘要，不是完整几何对象本身。所以很多空间谓词天然是「先粗过滤，再精确计算」，&& 命中并不代表几何真的相交。这三条不是缺陷，是设计边界；把它们记住，后面讲 GSERIALIZED、讲 typmod、讲两阶段过滤的时候，你就不会误以为数据库替你兜住了一切。geometry 给的是能力，不是自动正确性。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20\" y=\"20\" width=\"440\" height=\"300\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><rect x=\"20\" y=\"20\" width=\"440\" height=\"46\" rx=\"5\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1\" /><text x=\"38\" y=\"50\" class=\"sv serif\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#BE653B\" font-weight=\"700\" >平面几何语义</text><rect x=\"38\" y=\"85\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"56\" y=\"102\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >默认是平面笛卡尔几何</text><line x1=\"38\" y1=\"128\" x2=\"442\" y2=\"128\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"38\" y=\"153\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"56\" y=\"170\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >经纬度不会自动当球面距离</text><line x1=\"38\" y1=\"196\" x2=\"442\" y2=\"196\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"38\" y=\"221\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"56\" y=\"238\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >结果单位由 SRID 坐标单位决定</text><rect x=\"480\" y=\"20\" width=\"440\" height=\"300\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><rect x=\"480\" y=\"20\" width=\"440\" height=\"46\" rx=\"5\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1\" /><text x=\"498\" y=\"50\" class=\"sv serif\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#BE653B\" font-weight=\"700\" >SRID 只是标识</text><rect x=\"498\" y=\"85\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"516\" y=\"102\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >SRID 是元数据，不是转换函数</text><line x1=\"498\" y1=\"128\" x2=\"902\" y2=\"128\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"498\" y=\"153\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"516\" y=\"170\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >不同 SRID 不会自动对齐</text><line x1=\"498\" y1=\"196\" x2=\"902\" y2=\"196\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"498\" y=\"221\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"516\" y=\"238\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >需要 ST_Transform 显式转换</text><rect x=\"940\" y=\"20\" width=\"440\" height=\"300\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><rect x=\"940\" y=\"20\" width=\"440\" height=\"46\" rx=\"5\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1\" /><text x=\"958\" y=\"50\" class=\"sv serif\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#BE653B\" font-weight=\"700\" >索引存的是摘要</text><rect x=\"958\" y=\"85\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"976\" y=\"102\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >通常索引边界框而非完整几何</text><line x1=\"958\" y1=\"128\" x2=\"1362\" y2=\"128\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"958\" y=\"153\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"976\" y=\"170\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >谓词多为先粗过滤、再精确计算</text><line x1=\"958\" y1=\"196\" x2=\"1362\" y2=\"196\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"958\" y=\"221\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"976\" y=\"238\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >&amp;&amp; 命中不等于几何真的相交</text><rect x=\"20\" y=\"340\" width=\"1360\" height=\"62\" rx=\"5\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1\" /><text x=\"40\" y=\"378\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#AE8A3E\" font-weight=\"600\" >先讲代价，才不会把后面的机制误当成承诺：geometry 给的是能力，不是自动正确性。</text></svg>","ctrl":null},{"eyebrow":"第三问 · 它是什么（SQL 层）","title":"在 SQL 里，它是注册进类型系统的变长类型","lede":"PostGIS 在 postgis.sql.in 里用 CREATE TYPE 注册 geometry：四个存储属性、六个输入输出与统计函数，一个都不能少。","caption":"图 06　左：CREATE TYPE 的四个属性。右：类型注册时挂上的 I/O、typmod 与统计函数。","bridge":"类型注册只是入口。真正决定一个 geometry 值「是什么意思」的，是它同时承载的四层语义。","notes":"从最外面看，geometry 是 PostGIS 注册到 PostgreSQL 的一个变长类型。源码 postgis.sql.in 里的 CREATE TYPE 写得很清楚：internallength 是 variable，alignment 是 double，storage 是 main，还专门挂了 analyze = geometry_analyze。前三个属性决定了它在 PostgreSQL 的行里怎么摆——变长 datum、double 对齐、尽量留在主行，特别大的对象仍然可以走 TOAST；最后那个属性先记一下，后面讲优化器时它是关键。旁边挂了六个函数：geometry_in 和 geometry_out 管文本输入输出，geometry_recv 和 geometry_send 管二进制收发，geometry_typmod_in 和 typmod_out 负责解析、显示列的 typmod，geometry_analyze 负责收集空间统计。你看，这不是「定义了一个结构体」就完事，而是把一个外来类型完整地接进 PostgreSQL 的类型系统：怎么进、怎么出、怎么被约束、怎么被统计，全都有对应入口。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20\" y=\"20\" width=\"660\" height=\"390\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><rect x=\"20\" y=\"20\" width=\"660\" height=\"46\" rx=\"5\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"40\" y=\"50\" class=\"sv mono\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#FFFFFF\" font-weight=\"700\" >CREATE TYPE geometry</text><rect x=\"40\" y=\"92\" width=\"620\" height=\"62\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"56\" y=\"118\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"700\" >internallength = variable</text><text x=\"56\" y=\"142\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >变长 datum，兼容 PostgreSQL varlena</text><rect x=\"40\" y=\"168\" width=\"620\" height=\"62\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"56\" y=\"194\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"700\" >alignment = double</text><text x=\"56\" y=\"218\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >按 double 对齐，坐标读取少一次拷贝</text><rect x=\"40\" y=\"244\" width=\"620\" height=\"62\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"56\" y=\"270\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"700\" >storage = main</text><text x=\"56\" y=\"294\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >尽量留在主行，大对象仍可 TOAST</text><rect x=\"40\" y=\"320\" width=\"620\" height=\"62\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"56\" y=\"346\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"700\" >analyze = geometry_analyze</text><text x=\"56\" y=\"370\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >接入空间统计信息收集</text><text x=\"720\" y=\"44\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"700\" >六个 I/O 与统计函数，注册进 PostgreSQL 类型系统</text><rect x=\"720\" y=\"70\" width=\"660\" height=\"70\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"1050.0\" y=\"98.125\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" >geometry_in / geometry_out</text><text x=\"1050.0\" y=\"120.625\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >文本输入输出</text><rect x=\"720\" y=\"154\" width=\"660\" height=\"70\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"1050.0\" y=\"182.125\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" >geometry_recv / geometry_send</text><text x=\"1050.0\" y=\"204.625\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >二进制收发</text><rect x=\"720\" y=\"238\" width=\"660\" height=\"70\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"1050.0\" y=\"266.125\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" >geometry_typmod_in / _out</text><text x=\"1050.0\" y=\"288.625\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >解析与显示列 typmod</text><rect x=\"720\" y=\"322\" width=\"660\" height=\"70\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"1050.0\" y=\"350.125\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" >geometry_analyze</text><text x=\"1050.0\" y=\"372.625\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >空间统计入口</text><text x=\"720\" y=\"414\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >出处：postgis/postgis/postgis.sql.in · CREATE TYPE geometry 定义</text></svg>","ctrl":null},{"eyebrow":"第三问 · 它是什么（建模层）","title":"一个值，同时承载四层语义","lede":"几何类型、坐标维度、空间参考系统、平面运算语义——这四层叠在一起，才构成一个能被正确解释的 geometry 值。","caption":"图 07　四层地层带：越深越基础。右侧数字仅标示层次序号，不是版本号。","bridge":"四层语义是「逻辑上是什么」。接下来把它落到物理上：从业务对象到磁盘上的那一行，中间究竟经过几步。","notes":"从建模角度看，一个 geometry 值其实同时装着四层东西。最底层是几何类型：点、线、面、Multi 系列、GeometryCollection，这决定数据库该用哪套算法去处理它。往上一层是坐标维度：XY、XYZ、XYM、XYZM，有没有 Z、有没有 M，会写进后面要讲的 flags。再往上是空间参考系统，也就是 SRID，比如 4326、3857、4490；它决定坐标单位，也决定测量结果的单位。最上面一层是空间运算语义：几何上的相交、包含、距离、面积、长度，都按平面笛卡尔几何来算。这四层不是「可选配置」，是同一个值必须同时回答的四个问题。你少写一层，比如只丢两个数字进去不给 SRID，数据库就不知道 0.1 是度还是米；你把 Z 藏起来不声明，3D 过滤就无从谈起。所以后面所有机制——typmod、flags、操作符——本质上都是在替这四层语义服务。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40\" y=\"20\" width=\"1320\" height=\"84\" rx=\"4\" fill=\"#74A5AD\" stroke=\"#74A5AD\" stroke-width=\"1\" /><text x=\"64\" y=\"70\" class=\"sv serif\" text-anchor=\"start\" font-size=\"20.0\" fill=\"#1B2B33\" font-weight=\"700\" >空间运算语义</text><text x=\"360\" y=\"70\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#46585F\" font-weight=\"400\" >平面笛卡尔几何上的相交 / 包含 / 距离 / 面积 / 长度</text><text x=\"1336\" y=\"50\" class=\"sv mono\" text-anchor=\"end\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"400\" >04</text><rect x=\"40\" y=\"116\" width=\"1320\" height=\"84\" rx=\"4\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1\" /><text x=\"64\" y=\"166\" class=\"sv serif\" text-anchor=\"start\" font-size=\"20.0\" fill=\"#FFFFFF\" font-weight=\"700\" >空间参考系统</text><text x=\"360\" y=\"166\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#E5EFF0\" font-weight=\"400\" >SRID：4326（度）· 3857（Web Mercator）· 4490</text><text x=\"1336\" y=\"146\" class=\"sv mono\" text-anchor=\"end\" font-size=\"15.0\" fill=\"#FFFFFF\" font-weight=\"400\" >03</text><rect x=\"40\" y=\"212\" width=\"1320\" height=\"84\" rx=\"4\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1\" /><text x=\"64\" y=\"262\" class=\"sv serif\" text-anchor=\"start\" font-size=\"20.0\" fill=\"#FFFFFF\" font-weight=\"700\" >坐标维度</text><text x=\"360\" y=\"262\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#E5EFF0\" font-weight=\"400\" >XY · XYZ · XYM · XYZM —— 决定 flags 里的 HasZ / HasM</text><text x=\"1336\" y=\"242\" class=\"sv mono\" text-anchor=\"end\" font-size=\"15.0\" fill=\"#FFFFFF\" font-weight=\"400\" >02</text><rect x=\"40\" y=\"308\" width=\"1320\" height=\"84\" rx=\"4\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1\" /><text x=\"64\" y=\"358\" class=\"sv serif\" text-anchor=\"start\" font-size=\"20.0\" fill=\"#FFFFFF\" font-weight=\"700\" >几何类型</text><text x=\"360\" y=\"358\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#E5EFF0\" font-weight=\"400\" >Point · LineString · Polygon · Multi* · GeometryCollection</text><text x=\"1336\" y=\"338\" class=\"sv mono\" text-anchor=\"end\" font-size=\"15.0\" fill=\"#FFFFFF\" font-weight=\"400\" >01</text><text x=\"40\" y=\"416\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"600\" >一个 geometry 值同时承载这四层；缺任何一层，都无法正确解释它，也无法正确计算它。</text></svg>","ctrl":null},{"eyebrow":"第三问 · 从逻辑到物理","title":"业务对象，怎样走到磁盘上的那一行","lede":"先建模成 OGC 几何对象，再由 typmod 约束到列级语义，最终以 GSERIALIZED 写进 PostgreSQL 行；索引只拿走一份边界框摘要。","caption":"图 08　依据原文图 1 重绘：逻辑模型 → typmod → SQL 列 → GSERIALIZED / LWGEOM / 索引摘要三条去路。","bridge":"既然最终落到的是 GSERIALIZED，那生产表里的列定义就不能随便写——typmod 才是把语义钉死的那颗钉子。","notes":"把逻辑模型和物理表示接起来看，路径就清楚了。业务里先有一个对象：门店、地块、路线、围栏。建模时把它归到 OGC 几何族里，是点、是线串、是面、还是 Multi 或集合。然后 typmod 出场，把类型、维度、SRID 约束到列级。最后落到 SQL 列上，写成 geometry(Point,4326)，值本身以 GSERIALIZED 存进 PostgreSQL 的行。注意图中下面三条去路：一份是行里的 GSERIALIZED，装着 varlena size、SRID、flags、可选 BBox 和坐标数组；一份是计算时反序列化出来的 LWGEOM 内存树，按几何类型分派算法，必要时交给 GEOS 或 PROJ；还有一份是索引摘要，2D 用 BOX2DF、ND 用 GIDX，给 GiST、SP-GiST、BRIN 做粗过滤。这里最容易误会的一点是：索引并不保存完整几何的计算结果，它只保存边界框摘要。所以「有索引」和「算得准」是两件事，中间还隔着一次精确计算。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20\" y=\"24\" width=\"320\" height=\"112\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"180.0\" y=\"73.125\" class=\"sv s\" text-anchor=\"middle\" font-size=\"18.0\" fill=\"#245A6B\" font-weight=\"600\" >业务对象</text><text x=\"180.0\" y=\"95.625\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >门店 · 地块 · 路线 · 围栏</text><line x1=\"340\" y1=\"80\" x2=\"364.4\" y2=\"80\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"370,80 363,76.15 363,83.85\" fill=\"#245A6B\" /><rect x=\"370\" y=\"24\" width=\"320\" height=\"112\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"530.0\" y=\"73.125\" class=\"sv s\" text-anchor=\"middle\" font-size=\"18.0\" fill=\"#245A6B\" font-weight=\"600\" >OGC 几何模型</text><text x=\"530.0\" y=\"95.625\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >POINT / LINESTRING / POLYGON / MULTI*</text><line x1=\"690\" y1=\"80\" x2=\"714.4\" y2=\"80\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"720,80 713,76.15 713,83.85\" fill=\"#245A6B\" /><rect x=\"720\" y=\"24\" width=\"320\" height=\"112\" rx=\"5\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.1\" /><text x=\"880.0\" y=\"73.125\" class=\"sv s\" text-anchor=\"middle\" font-size=\"18.0\" fill=\"#AE8A3E\" font-weight=\"600\" >typmod 约束</text><text x=\"880.0\" y=\"95.625\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >类型 Point · 维度 Z/M · SRID 4326</text><line x1=\"1040\" y1=\"80\" x2=\"1064.4\" y2=\"80\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"1070,80 1063,76.15 1063,83.85\" fill=\"#245A6B\" /><rect x=\"1070\" y=\"24\" width=\"320\" height=\"112\" rx=\"5\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.1\" /><text x=\"1230.0\" y=\"73.125\" class=\"sv s\" text-anchor=\"middle\" font-size=\"18.0\" fill=\"#AE8A3E\" font-weight=\"600\" >SQL 列</text><text x=\"1230.0\" y=\"95.625\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >geometry(Point, 4326)</text><line x1=\"1230\" y1=\"136\" x2=\"1230\" y2=\"196\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><line x1=\"1230\" y1=\"196\" x2=\"230\" y2=\"196\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><line x1=\"230\" y1=\"196\" x2=\"230\" y2=\"231.6\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"230,238 225.6,230 234.4,230\" fill=\"#245A6B\" /><rect x=\"20\" y=\"242\" width=\"440\" height=\"154\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><rect x=\"20\" y=\"242\" width=\"440\" height=\"38\" rx=\"5\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1\" /><text x=\"36\" y=\"268\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#FFFFFF\" font-weight=\"700\" >GSERIALIZED（行内）</text><text x=\"36\" y=\"312\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >varlena size + SRID</text><text x=\"36\" y=\"338\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >flags：Z / M / BBox / 版本</text><text x=\"36\" y=\"364\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >递归几何数据 + 坐标数组</text><line x1=\"460\" y1=\"320\" x2=\"474.4\" y2=\"320\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"480,320 473,316.15 473,323.85\" fill=\"#245A6B\" /><rect x=\"480\" y=\"242\" width=\"440\" height=\"154\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><rect x=\"480\" y=\"242\" width=\"440\" height=\"38\" rx=\"5\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1\" /><text x=\"496\" y=\"268\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#FFFFFF\" font-weight=\"700\" >LWGEOM 内存树</text><text x=\"496\" y=\"312\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >解析、构造、计算</text><text x=\"496\" y=\"338\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >按几何类型分派算法</text><text x=\"496\" y=\"364\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >必要时调用 GEOS / PROJ</text><line x1=\"920\" y1=\"320\" x2=\"934.4\" y2=\"320\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"940,320 933,316.15 933,323.85\" fill=\"#245A6B\" /><rect x=\"940\" y=\"242\" width=\"440\" height=\"154\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><rect x=\"940\" y=\"242\" width=\"440\" height=\"38\" rx=\"5\" fill=\"#A4C4C6\" stroke=\"#A4C4C6\" stroke-width=\"1\" /><text x=\"956\" y=\"268\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"700\" >索引摘要</text><text x=\"956\" y=\"312\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >2D：BOX2DF · ND：GIDX</text><text x=\"956\" y=\"338\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >供 GiST / SP-GiST / BRIN 使用</text><text x=\"956\" y=\"364\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >先粗过滤，再精确计算</text><text x=\"20\" y=\"418\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#89938F\" font-weight=\"400\" >索引并不保存完整几何计算结果，只保存 bounding box 摘要；精确计算走 LWGEOM / GEOS。</text></svg>","ctrl":null},{"eyebrow":"第三问 · 落到表定义上","title":"生产表，别只写一个裸 geometry","lede":"geometry(Point,4326) 比 geometry 多出的不是几个字符，而是「错误更早失败」和「列语义可被系统看见」两件工程收益。","caption":"图 09　左：裸列。右：带 typmod 的生产写法。下方是它带来的两个收益。","bridge":"列定义钉死了语义，那一个具体的值是怎么被造出来、又被检查一遍写进去的？下一页我们顺着写入路径走一趟。","notes":"到建表这一步，我要给一个很直接的建议：生产表别只写一个裸 geometry。你看左边，geom geometry，语法完全合法，但这一列什么都能吞——今天塞个点，明天塞个面，后天来个 3857，数据库都照收。右边 geometry(Point,4326) NOT NULL 就不同了，多了两个实打实的工程收益。第一，错误数据更早失败：错类型、错维度、错 SRID 的值，在写入路径上就被拒绝，不用等三个月后某个查询算出诡异结果再回头翻数据。第二，列语义写进了 catalog：客户端、驱动、优化器相关函数，都能从系统表看到这一列明确是「4326 的点」，而不是一个笼统的 geometry。这里要强调一句，typmod 不是给人看的注释，它是 PostgreSQL 的列级约束；不管你从 psql、从应用、从 ETL 还是从 COPY 写进来，所有路径都得经过同一套类型机制。这比在应用里写十句校验可靠得多，因为校验离数据更近，也覆盖得更全。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20\" y=\"20\" width=\"660\" height=\"196\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"20\" y=\"20\" width=\"660\" height=\"34\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"34\" y=\"43\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"700\" >不建议 · 裸 geometry</text><text x=\"35\" y=\"78\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#1B2B33\" font-weight=\"400\" >CREATE TABLE store (</text><text x=\"35\" y=\"102\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#1B2B33\" font-weight=\"400\" >  id    bigserial PRIMARY KEY,</text><text x=\"35\" y=\"126\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#1B2B33\" font-weight=\"400\" >  name  text NOT NULL,</text><text x=\"35\" y=\"150\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#1B2B33\" font-weight=\"400\" >  geom  geometry</text><text x=\"35\" y=\"174\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#1B2B33\" font-weight=\"400\" >);</text><rect x=\"720\" y=\"20\" width=\"660\" height=\"196\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"720\" y=\"20\" width=\"660\" height=\"34\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"734\" y=\"43\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"700\" >建议 · 带 typmod</text><text x=\"735\" y=\"78\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#1B2B33\" font-weight=\"400\" >CREATE TABLE store (</text><text x=\"735\" y=\"102\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#1B2B33\" font-weight=\"400\" >  id    bigserial PRIMARY KEY,</text><text x=\"735\" y=\"126\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#1B2B33\" font-weight=\"400\" >  name  text NOT NULL,</text><text x=\"735\" y=\"150\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#1B2B33\" font-weight=\"400\" >  geom  geometry(Point, 4326) NOT NULL</text><text x=\"735\" y=\"174\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#1B2B33\" font-weight=\"400\" >);</text><rect x=\"20\" y=\"236\" width=\"1360\" height=\"66\" rx=\"5\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1\" /><text x=\"40\" y=\"263\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#2F7A66\" font-weight=\"700\" >错误数据更早失败</text><text x=\"300\" y=\"263\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >错类型、错维度、错 SRID 的值，在写入路径上就被拒绝，而不是等到查询时才发现</text><rect x=\"20\" y=\"314\" width=\"1360\" height=\"66\" rx=\"5\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1\" /><text x=\"40\" y=\"341\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#2F7A66\" font-weight=\"700\" >catalog 语义更明确</text><text x=\"300\" y=\"341\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >客户端和优化器相关函数，都能从系统表看到确定的列语义，而不是一个笼统的 geometry</text><text x=\"20\" y=\"414\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"600\" >typmod 不是注释：它是 PostgreSQL 的列级约束，所有写入路径都会经过同一套类型机制。</text></svg>","ctrl":null},{"eyebrow":"第四问 · 核心原理 ① 输入路径","title":"WKT / WKB / GeoJSON，先变成 LWGEOM 再序列化","lede":"LWGEOM_in() 识别 SRID 前缀、按格式分派解析，必要时补 bbox，序列化成 GSERIALIZED，最后过一遍 typmod 校验。","caption":"图 10　依据原文 3.1 与源码 lwgeom_inout.c 的 LWGEOM_in() 路径重绘；下方是两种常用构造写法。","bridge":"这条路径里最容易被低估的是最后那一格 typmod。它不是字符串解析，而是一道空间契约——我们直接演示一遍。","notes":"一个值怎么进到列里？源码 lwgeom_inout.c 的 LWGEOM_in 写得很直白：输入格式是 [SRID=#;]wkt|wkb，也支持 GeoJSON 字符串。第一步先看有没有 SRID 前缀；是 WKB 或 EWKB 就走 lwgeom_from_wkb，是 GeoJSON 就走 lwgeom_from_geojson，并尝试从 SRS 信息里解析 SRID，否则按 WKT 走 lwgeom_parse_wkt。解析出来的是内存里的 LWGEOM。接着对需要缓存边界框的对象调用 lwgeom_add_bbox，再调用 geometry_serialize 变成 GSERIALIZED。最后，如果列上带 typmod，交给 postgis_valid_typmod 校验或修正。构造方式上有个很实用的细节：ST_GeomFromText 不带第二个参数时返回 SRID 0，带了才把 SRID 写进元数据；而 ST_MakePoint 不是 OGC 标准函数，但官方明确说它通常比 ST_GeomFromText 更快，特别适合从数值列批量造点，再用 ST_SetSRID 标坐标系。这里再钉一句：ST_SetSRID 只贴标签，不改坐标数值；真要换坐标系，得用 ST_Transform。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20\" y=\"24\" width=\"230\" height=\"52\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"135.0\" y=\"55.25\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"600\" >WKT / EWKT</text><line x1=\"250\" y1=\"50\" x2=\"280\" y2=\"50\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><rect x=\"20\" y=\"86\" width=\"230\" height=\"52\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"135.0\" y=\"117.25\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"600\" >WKB / EWKB</text><line x1=\"250\" y1=\"112\" x2=\"280\" y2=\"112\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><rect x=\"20\" y=\"148\" width=\"230\" height=\"52\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"135.0\" y=\"179.25\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"600\" >GeoJSON</text><line x1=\"250\" y1=\"174\" x2=\"280\" y2=\"174\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><line x1=\"280\" y1=\"50\" x2=\"280\" y2=\"174\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><line x1=\"280\" y1=\"112\" x2=\"314.4\" y2=\"112\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"320,112 313,108.15 313,115.85\" fill=\"#245A6B\" /><rect x=\"320\" y=\"62\" width=\"220\" height=\"100\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"430.0\" y=\"105.125\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"600\" >LWGEOM_in()</text><text x=\"430.0\" y=\"127.625\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >解析为 LWGEOM</text><rect x=\"580\" y=\"62\" width=\"250\" height=\"100\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"705.0\" y=\"105.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"600\" >lwgeom_add_bbox()</text><text x=\"705.0\" y=\"127.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >需要缓存 bbox 的对象</text><line x1=\"540\" y1=\"112\" x2=\"574.4\" y2=\"112\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"580,112 573,108.15 573,115.85\" fill=\"#245A6B\" /><rect x=\"850\" y=\"62\" width=\"250\" height=\"100\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"975.0\" y=\"105.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"600\" >geometry_serialize()</text><text x=\"975.0\" y=\"127.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >转为 GSERIALIZED</text><line x1=\"830\" y1=\"112\" x2=\"844.4\" y2=\"112\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"850,112 843,108.15 843,115.85\" fill=\"#245A6B\" /><rect x=\"1120\" y=\"62\" width=\"250\" height=\"100\" rx=\"5\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.1\" /><text x=\"1245.0\" y=\"105.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#AE8A3E\" font-weight=\"600\" >postgis_valid_typmod()</text><text x=\"1245.0\" y=\"127.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >有 typmod 时校验 / 修正</text><line x1=\"1100\" y1=\"112\" x2=\"1114.4\" y2=\"112\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"1120,112 1113,108.15 1113,115.85\" fill=\"#245A6B\" /><text x=\"20\" y=\"200\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#89938F\" font-weight=\"400\" >输入格式 [SRID=#;]wkt|wkb，也支持 GeoJSON；SRS 信息会尝试解析 SRID。</text><rect x=\"20\" y=\"220\" width=\"660\" height=\"168\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"20\" y=\"220\" width=\"660\" height=\"34\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"34\" y=\"243\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"700\" >文本构造 · 少量手写 / 标准 WKT</text><text x=\"35\" y=\"278\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#1B2B33\" font-weight=\"400\" >SELECT ST_GeomFromText(</text><text x=\"35\" y=\"302\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#1B2B33\" font-weight=\"400\" >  &#x27;POINT(-71.1043 42.315)&#x27;, 4326);</text><text x=\"35\" y=\"328\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"600\" >不带 SRID 参数时返回 SRID 0</text><rect x=\"720\" y=\"220\" width=\"660\" height=\"168\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"720\" y=\"220\" width=\"660\" height=\"34\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"734\" y=\"243\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"700\" >数值构造 · 批量点</text><text x=\"735\" y=\"278\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#1B2B33\" font-weight=\"400\" >SELECT ST_SetSRID(</text><text x=\"735\" y=\"302\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#1B2B33\" font-weight=\"400\" >  ST_MakePoint(-71.1043, 42.315), 4326);</text><text x=\"735\" y=\"328\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"600\" >ST_MakePoint 通常比文本解析更快</text><text x=\"20\" y=\"414\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"600\" >ST_SetSRID 只是标记 SRID，不改变坐标数值；真正转换坐标系要用 ST_Transform。</text></svg>","ctrl":null},{"eyebrow":"第四问 · 核心原理 ② typmod（可演示）","title":"typmod 是写入路径上的一道空间契约","lede":"能无歧义修正的，PostGIS 会替你修正；会破坏列语义的，必须拒绝。换一换上面的「列类型」与「输入值」，再看结论。","caption":"动画 A　输入：列类型 + 输入值；控制：播放 / 暂停、单步、重置。规则对应源码 gserialized_typmod.c。","bridge":"契约管住了「写进去的是什么」。接下来看「存下来长什么样」——GSERIALIZED 把哪些信息放在了最前面。","notes":"这一页可以动手试。上面两个下拉框，一个选列类型，一个选输入值；按播放，路径会一格一格往前走，走到第四格 typmod 的时候给出结论。你可以挑几组对照看：输入 SRID=0 的点，PostGIS 会把它的 SRID 补成列的 4326，这是能无歧义修正的；换成 3857，SRID 非零又不匹配，直接报错；换成 LINESTRING，类型对不上，报错；换成带 Z 的点，维度对不上，还是报错。再把列换成 MultiPolygon，输入一个单 Polygon，它会被自动提升成 MULTIPOLYGON——这也是修正，不是拒绝。这套规则的顺序来自 postgis_valid_typmod：先看 SRID，再做 MULTI 提升，再比类型，最后比 Z/M 维度。所以 typmod 远不是「解析一下括号里的字符串」，它是写入路径上的一道空间契约：能无歧义补的就补，会破坏列语义的就绝不放行。对 DBA 来说，这比应用层约定可靠得多，因为所有写入路径都得走这道门。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" id=\"animA\"><rect x=\"20\" y=\"12\" width=\"1360\" height=\"44\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"36\" y=\"40\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"700\" >列定义</text><text x=\"120\" y=\"40\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"700\" id=\"aColText\">geometry(Point, 4326)</text><rect x=\"20\" y=\"64\" width=\"1360\" height=\"44\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"36\" y=\"92\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"700\" >输入值</text><text x=\"120\" y=\"92\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"400\" id=\"aValText\">SRID=4326;POINT(120.1 30.2)</text><rect x=\"20\" y=\"136\" width=\"248\" height=\"104\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" class=\"astage\" data-step=\"1\"/><text x=\"144\" y=\"174\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" >① 输入解析</text><text x=\"144\" y=\"204\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >WKT / WKB / GeoJSON</text><line x1=\"268\" y1=\"188\" x2=\"288\" y2=\"188\" stroke=\"#D9D5CB\" stroke-width=\"1.8\" stroke-dasharray=\"class=\"aarrow\" data-step=\"2\"\"/><polygon points=\"296,188 288,183.5 288,192.5\" fill=\"#D9D5CB\" class=\"aarrow\" data-step=\"2\"/><rect x=\"296\" y=\"136\" width=\"248\" height=\"104\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" class=\"astage\" data-step=\"2\"/><text x=\"420\" y=\"174\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" >② LWGEOM</text><text x=\"420\" y=\"204\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >类型 · SRID · 维度</text><line x1=\"544\" y1=\"188\" x2=\"564\" y2=\"188\" stroke=\"#D9D5CB\" stroke-width=\"1.8\" stroke-dasharray=\"class=\"aarrow\" data-step=\"3\"\"/><polygon points=\"572,188 564,183.5 564,192.5\" fill=\"#D9D5CB\" class=\"aarrow\" data-step=\"3\"/><rect x=\"572\" y=\"136\" width=\"248\" height=\"104\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" class=\"astage\" data-step=\"3\"/><text x=\"696\" y=\"174\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" >③ BBox / 序列化</text><text x=\"696\" y=\"204\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >GSERIALIZED</text><line x1=\"820\" y1=\"188\" x2=\"840\" y2=\"188\" stroke=\"#D9D5CB\" stroke-width=\"1.8\" stroke-dasharray=\"class=\"aarrow\" data-step=\"4\"\"/><polygon points=\"848,188 840,183.5 840,192.5\" fill=\"#D9D5CB\" class=\"aarrow\" data-step=\"4\"/><rect x=\"848\" y=\"136\" width=\"248\" height=\"104\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" class=\"astage\" data-step=\"4\"/><text x=\"972\" y=\"174\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" >④ typmod 校验</text><text x=\"972\" y=\"204\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >postgis_valid_typmod()</text><line x1=\"1096\" y1=\"188\" x2=\"1116\" y2=\"188\" stroke=\"#D9D5CB\" stroke-width=\"1.8\" stroke-dasharray=\"class=\"aarrow\" data-step=\"5\"\"/><polygon points=\"1124,188 1116,183.5 1116,192.5\" fill=\"#D9D5CB\" class=\"aarrow\" data-step=\"5\"/><rect x=\"1124\" y=\"136\" width=\"248\" height=\"104\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" class=\"astage\" data-step=\"5\"/><text x=\"1248\" y=\"174\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" >⑤ 写入行</text><text x=\"1248\" y=\"204\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >PostgreSQL datum</text><rect x=\"20\" y=\"268\" width=\"1360\" height=\"108\" rx=\"5\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" id=\"aBand\"/><text x=\"40\" y=\"302\" class=\"sv serif\" text-anchor=\"start\" font-size=\"21.0\" fill=\"#46585F\" font-weight=\"700\" id=\"aVerdict\">等待 typmod 校验…</text><text x=\"40\" y=\"336\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" id=\"aWhy\">按「播放」或「单步」推进写入路径</text><text x=\"1360\" y=\"336\" class=\"sv s\" text-anchor=\"end\" font-size=\"13.5\" fill=\"#AE8A3E\" font-weight=\"700\" id=\"aFix\"></text><text x=\"20\" y=\"412\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >规则顺序（postgis_valid_typmod）：SRID 0 可继承 → SRID 不匹配拒绝 → MULTI 提升 → 类型不匹配拒绝 → Z/M 不匹配拒绝。</text></svg>","ctrl":"<label>列类型</label><select id=\"aCol\">\n<option value=\"point\">geometry(Point, 4326)</option>\n<option value=\"mpoly\">geometry(MultiPolygon, 4326)</option></select>\n<label>输入值</label><select id=\"aVal\">\n<option value=\"p4326\">SRID=4326;POINT(120.1 30.2)</option>\n<option value=\"p0\">POINT(120.1 30.2) · 无 SRID</option>\n<option value=\"p3857\">SRID=3857;POINT(120.1 30.2)</option>\n<option value=\"line\">SRID=4326;LINESTRING(...)</option>\n<option value=\"pz\">SRID=4326;POINT Z(120.1 30.2 5)</option>\n<option value=\"poly\">SRID=4326;POLYGON((...))</option></select>\n<button class=\"btn play\" id=\"aPlay\">▶ 播放</button>\n<button class=\"btn\" id=\"aTick\">单步</button><button class=\"btn\" id=\"aReset\">重置</button>\n<span class=\"out\" id=\"aOut\"></span>"},{"eyebrow":"第四问 · 核心原理 ③ 磁盘表示","title":"GSERIALIZED：元数据放前面，坐标保持 double 对齐","lede":"PostGIS 的磁盘表示既不是 WKT 也不是 GeoJSON，而是 GSERIALIZED：前部服务存储与快速过滤，后部服务真实几何计算。","caption":"图 12　依据原文图 2 与 liblwgeom/gserialized.txt 重绘。分段宽度为示意，不按字节比例。","bridge":"前部字段里最值得单独拎出来的是 flags——它解释了同一个值为什么能同时被当成「完整对象」和「可索引摘要」。","notes":"存到磁盘上的，不是 WKT，也不是 GeoJSON，是一个叫 GSERIALIZED 的紧凑结构。liblwgeom 里的 gserialized.txt 把设计目标写得很坦白：顶部放 uint32 size，是为了兼容 PostgreSQL 的 varlena datum；SRID 是必备字段，因为生产数据几乎都会用 SRID；维度、SRID、bounding box 统统放在结构前部，就是为了能快速读到；BBox 是可选的，免得一个点也为冗余边界框多付空间；坐标数组保持 double 对齐，访问坐标时少一次拷贝和重新对齐；集合对象还可以递归序列化。你看图里下面三个去向：左边的存储层只关心 size 和行版本；中间的很多函数只要读 SRID、flags 或者 BBox，根本不必完整反序列化；只有真要做拓扑关系、距离、叠加的时候，右边才把它转成 LWGEOM 内存树，必要时调 GEOS。PostGIS 把「精确几何」和「可索引摘要」塞进同一个类型体系里，这个布局就是原因。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20\" y=\"36\" width=\"170\" height=\"92\" rx=\"3\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.2\" /><text x=\"105.0\" y=\"74\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#FFFFFF\" font-weight=\"700\" >size</text><text x=\"105.0\" y=\"104\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#FFFFFF\" font-weight=\"400\" >uint32 · 兼容 varlena</text><rect x=\"190\" y=\"36\" width=\"150\" height=\"92\" rx=\"3\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.2\" /><text x=\"265.0\" y=\"74\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#FFFFFF\" font-weight=\"700\" >srid</text><text x=\"265.0\" y=\"104\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#FFFFFF\" font-weight=\"400\" >3 字节 · 必备字段</text><rect x=\"340\" y=\"36\" width=\"220\" height=\"92\" rx=\"3\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1.2\" /><text x=\"450.0\" y=\"74\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#FFFFFF\" font-weight=\"700\" >flags</text><text x=\"450.0\" y=\"104\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#FFFFFF\" font-weight=\"400\" >Z / M / BBox / 版本</text><rect x=\"560\" y=\"36\" width=\"300\" height=\"92\" rx=\"3\" fill=\"#A4C4C6\" stroke=\"#245A6B\" stroke-width=\"1.2\" stroke-dasharray=\"6 4\"/><text x=\"710.0\" y=\"74\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"700\" >可选 BBox</text><text x=\"710.0\" y=\"104\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#1B2B33\" font-weight=\"400\" >xmin/xmax… 小对象可省</text><rect x=\"860\" y=\"36\" width=\"520\" height=\"92\" rx=\"3\" fill=\"#EBF1EE\" stroke=\"#EBF1EE\" stroke-width=\"1.2\" /><text x=\"1120.0\" y=\"74\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"700\" >geometry data</text><text x=\"1120.0\" y=\"104\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#1B2B33\" font-weight=\"400\" >类型 · 计数 · 递归坐标（double 对齐）</text><line x1=\"105\" y1=\"128\" x2=\"105\" y2=\"207.6\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"105,214 100.6,206 109.4,206\" fill=\"#245A6B\" /><line x1=\"430\" y1=\"128\" x2=\"430\" y2=\"207.6\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"430,214 425.6,206 434.4,206\" fill=\"#245A6B\" /><line x1=\"1140\" y1=\"128\" x2=\"1140\" y2=\"207.6\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"1140,214 1135.6,206 1144.4,206\" fill=\"#245A6B\" /><rect x=\"20\" y=\"218\" width=\"440\" height=\"132\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><rect x=\"20\" y=\"218\" width=\"440\" height=\"38\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"36\" y=\"244\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" >数据库存储层</text><text x=\"36\" y=\"288\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >TOAST / 页 / 行版本</text><text x=\"36\" y=\"316\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >依赖 size 判断 datum 长度</text><rect x=\"480\" y=\"218\" width=\"440\" height=\"132\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><rect x=\"480\" y=\"218\" width=\"440\" height=\"38\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"496\" y=\"244\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" >元数据快速读取</text><text x=\"496\" y=\"288\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >不必完整反序列化</text><text x=\"496\" y=\"316\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >先取 SRID、维度、BBox</text><rect x=\"940\" y=\"218\" width=\"440\" height=\"132\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><rect x=\"940\" y=\"218\" width=\"440\" height=\"38\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"956\" y=\"244\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" >几何计算路径</text><text x=\"956\" y=\"288\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >转为 LWGEOM 内存结构</text><text x=\"956\" y=\"316\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >再做拓扑、测量、输出</text><rect x=\"20\" y=\"366\" width=\"1360\" height=\"48\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1\" /><text x=\"38\" y=\"396\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#AE8A3E\" font-weight=\"600\" >设计取舍：元数据在前 → 过滤更快；BBox 可选 → 小对象不付冗余空间；坐标区 double 对齐 → 少一次拷贝。</text></svg>","ctrl":null},{"eyebrow":"第四问 · 核心原理 ③ 续","title":"同一个值，有两张脸","lede":"flags 里的 HasZ / HasM / HasBBox / IsGeodetic，决定了这个值是被完整反序列化，还是只读头部就够用。","caption":"图 13　左：flags 的典型信息。右：精确几何路径与可索引摘要路径，二者共用同一个 GSERIALIZED。","bridge":"理解了「SRID 只是头部的一个字段」，就能明白下一页那个最容易踩的坑：它决定单位，却不负责投影。","notes":"flags 这一小块值得单独看。典型信息有 HasZ、HasM、HasBBox、IsGeodetic，再加上版本与扩展标志。它带来一个很常见的现象：同一个 geometry 值，有时候被当成完整的空间对象，有时候只被抽出一个边界框。走完整路径时，PostGIS 把它反序列化成 LWGEOM 内存树，按类型分派算法，必要时交给 GEOS 或 PROJ，去做拓扑关系、距离、面积、叠加、输出、校验；走摘要路径时，它只需要读头部的 SRID、flags 和 BBox，生成 BOX2DF 或 GIDX，服务于 &&、&&&、<-> 这类「先排除不可能命中」的操作，连完整反序列化都省了。所以别把索引想成「把几何算了一遍存起来」，它存的是摘要。PostGIS 把精确几何和可索引摘要放进同一个类型体系，靠的就是这套头部优先的布局。这也解释了后面几乎所有性能现象：粗过滤很便宜，精确计算才是花钱的地方。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20\" y=\"20\" width=\"600\" height=\"380\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><rect x=\"20\" y=\"20\" width=\"600\" height=\"46\" rx=\"5\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"40\" y=\"50\" class=\"sv mono\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#FFFFFF\" font-weight=\"700\" >GSERIALIZED flags</text><rect x=\"40\" y=\"84\" width=\"560\" height=\"52\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"56\" y=\"116\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"700\" >HasZ</text><text x=\"240\" y=\"116\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >是否有 Z 维</text><rect x=\"40\" y=\"146\" width=\"560\" height=\"52\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"56\" y=\"178\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"700\" >HasM</text><text x=\"240\" y=\"178\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >是否有 M 维</text><rect x=\"40\" y=\"208\" width=\"560\" height=\"52\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"56\" y=\"240\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"700\" >HasBBox</text><text x=\"240\" y=\"240\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >是否内嵌 bounding box</text><rect x=\"40\" y=\"270\" width=\"560\" height=\"52\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"56\" y=\"302\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"700\" >IsGeodetic</text><text x=\"240\" y=\"302\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >是否为 geodetic 数据路径</text><rect x=\"40\" y=\"332\" width=\"560\" height=\"52\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"56\" y=\"364\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"700\" >版本与扩展标志</text><text x=\"240\" y=\"364\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >序列化版本与可选扩展字段</text><line x1=\"620\" y1=\"118\" x2=\"674.4\" y2=\"118\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"680,118 673,114.15 673,121.85\" fill=\"#245A6B\" /><line x1=\"620\" y1=\"300\" x2=\"674.4\" y2=\"300\" stroke=\"#2F7A66\" stroke-width=\"1.8\"/><polygon points=\"680,300 673,296.15 673,303.85\" fill=\"#2F7A66\" /><rect x=\"680\" y=\"20\" width=\"700\" height=\"176\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\" /><text x=\"700\" y=\"52\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#245A6B\" font-weight=\"700\" >路径 A · 精确几何</text><text x=\"700\" y=\"96\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >完整反序列化 → LWGEOM 内存树 → 必要时 GEOS / PROJ</text><text x=\"700\" y=\"132\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >用于：拓扑关系、距离、面积、叠加、输出、校验</text><rect x=\"680\" y=\"214\" width=\"700\" height=\"186\" rx=\"5\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\" /><text x=\"700\" y=\"246\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#2F7A66\" font-weight=\"700\" >路径 B · 可索引摘要</text><text x=\"700\" y=\"294\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >只读头部 SRID / flags / BBox → BOX2DF 或 GIDX</text><text x=\"700\" y=\"330\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >用于：&amp;&amp;、&amp;&amp;&amp;、&lt;-&gt; 等先排除「不可能命中」的对象</text><text x=\"20\" y=\"418\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#BE653B\" font-weight=\"600\" >同一个 geometry 值既能当完整空间对象处理，也能被快速抽取 bbox 做索引过滤 —— 两张脸，一套类型体系。</text></svg>","ctrl":null},{"eyebrow":"第五问 · 语义边界 ①","title":"SRID 决定单位，不保证正确投影","lede":"4326 的坐标单位是度，直接对 geometry 做 ST_Distance 得到的不是米；贴标签用 ST_SetSRID，换坐标必须用 ST_Transform。","caption":"图 14　左：同一对点，geometry 与 geography 的语义差别。右：ST_SetSRID 与 ST_Transform 的差别。","bridge":"知道了单位从哪来，下一个问题就具体了：面对一个真实业务，到底该选 geometry、geography，还是别的？","notes":"这一页是踩坑重灾区。reference_measure.xml 里反复强调：geometry 的测量结果，单位由 SRID 指定的坐标单位决定。4326 是经纬度，单位是度，所以你对两个 4326 的 point 直接做 ST_Distance，拿到的是一个度数，绝不是米；想要米制距离，常见做法是转成 geography，让 PostGIS 走球面椭球语义，或者先转到合适的投影坐标系。右边这组对照更要记牢：ST_SetSRID 只是给几何贴一个元数据标签，坐标数值一个都不动，官方文档专门写过它常被和 ST_Transform 搞混；ST_Transform 才真正改变坐标数值，把点从一个空间参考系统换算到另一个，而且需要 PostGIS 编译时带 PROJ 支持。所以 SRID 是标识，不是转换函数，更不保证你手上的投影是对的。把这句话记住，后面选型、建索引、写表达式索引的时候，能少走很多弯路。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20\" y=\"20\" width=\"640\" height=\"172\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"20\" y=\"20\" width=\"640\" height=\"34\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"34\" y=\"43\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"700\" >SRID 4326 的 geometry</text><text x=\"35\" y=\"78\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#1B2B33\" font-weight=\"400\" >SELECT ST_Distance(</text><text x=\"35\" y=\"102\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#1B2B33\" font-weight=\"400\" >  &#x27;SRID=4326;POINT(120.1 30.2)&#x27;::geometry,</text><text x=\"35\" y=\"126\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#1B2B33\" font-weight=\"400\" >  &#x27;SRID=4326;POINT(120.2 30.3)&#x27;::geometry);</text><text x=\"35\" y=\"152\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"600\" >结果单位是度 —— 不是米</text><rect x=\"20\" y=\"204\" width=\"640\" height=\"172\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"20\" y=\"204\" width=\"640\" height=\"34\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"34\" y=\"227\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"700\" >换成 geography</text><text x=\"35\" y=\"262\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#1B2B33\" font-weight=\"400\" >SELECT ST_Distance(</text><text x=\"35\" y=\"286\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#1B
