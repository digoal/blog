<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数据库筑基课 · geography 数据类型｜把经纬度交给地球</title>
<!-- 单文件交付：所有原理图均为现场绘制的内联 SVG，无外部图片、字体、脚本依赖。 -->
<!-- 设计母题：地层剖面 / 工程蓝图。内容按「困境→命题→类型底座→输入/测量/索引→选型→实操→坑」的因果链推演。 -->
<style>
:root{
  --bg:#F7F6F2; --ink:#1B2B33; --ink2:#46585F; --muted:#89938F; --line:#D9D5CB;
  --primary:#245A6B; --prim-l:#E5EFF0; --accent:#BE653B; --acc-l:#F7E9DE;
  --green:#2F7A66; --green-l:#E4F0EA; --gold:#AE8A3E;
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#E9E7E1}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
#viewport{position:absolute;inset:0 0 58px 0;overflow:hidden}
#stage{position:absolute;width:1600px;height:900px;background:var(--bg);
  transform-origin:top left;box-shadow:0 18px 60px rgba(27,43,51,.13);overflow:hidden}
.slide{position:absolute;inset:0;display:none}
.slide.on{display:block;animation:fadein .42s cubic-bezier(.2,.7,.2,1)}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{position:absolute;left:64px;top:44px;font-size:13px;letter-spacing:3.4px;
  color:var(--primary);font-weight:600}
.eyebrow .num{font-family:var(--mono);letter-spacing:1px;color:var(--accent);margin-right:14px}
h1.title{position:absolute;left:64px;top:70px;margin:0;font-family:var(--serif);
  font-size:44px;line-height:1.25;font-weight:700;letter-spacing:1.2px;color:var(--ink)}
.lede{position:absolute;left:64px;top:139px;width:1472px;font-size:19px;color:var(--ink2);
  line-height:1.5;letter-spacing:.3px}
.rule{position:absolute;left:64px;top:181px;width:1472px;height:1px;background:var(--line)}
.figwrap{position:absolute;left:100px;top:198px;width:1400px;height:430px}
svg.figure{display:block;overflow:visible}
svg.figure text{font-family:var(--sans)}
svg.figure text.serif{font-family:var(--serif)}
svg.figure text.mono{font-family:var(--mono)}
.caption{position:absolute;left:100px;top:638px;width:1400px;font-size:13px;
  color:var(--muted);letter-spacing:.4px;line-height:1.5}
.bridge{position:absolute;left:64px;top:706px;width:1472px;font-size:20px;
  color:var(--accent);line-height:1.55;letter-spacing:.4px;padding-left:18px;
  border-left:3px solid var(--accent);font-family:var(--serif)}
.bridge .bk{font-family:var(--sans);font-size:13px;color:var(--muted);
  letter-spacing:2px;display:block;margin-bottom:2px}
.footer{position:absolute;left:64px;top:846px;width:1472px;height:1px;background:var(--line)}
.footer .fl{position:absolute;left:0;top:14px;font-size:12.5px;color:var(--muted);letter-spacing:2px}
.footer .fr{position:absolute;right:0;top:12px;font-family:var(--mono);font-size:14px;color:var(--ink2)}
.footer .fbar{position:absolute;left:0;right:0;top:-1px;height:2px;background:transparent}
.footer .fbar i{display:block;height:2px;background:var(--primary);width:0;transition:width .4s ease}

/* 动画页控件：位于图下方独立条带，绝不覆盖图 */
.ctrls{position:absolute;left:100px;top:638px;width:1400px;height:46px;display:flex;
  align-items:center;gap:10px}
.ctrls label{font-size:13px;color:var(--ink2);white-space:nowrap}
.ctrls select,.ctrls input[type=range]{font-family:var(--sans);font-size:13px;color:var(--ink);
  background:#fff;border:1px solid var(--line);border-radius:4px;padding:5px 8px;outline:none}
.ctrls select{max-width:290px}
.ctrls input[type=range]{width:150px;padding:0;accent-color:var(--primary);border:none;background:transparent}
.ctrls .btn{min-height:30px;padding:5px 12px;border:1px solid var(--primary);border-radius:4px;
  background:#fff;color:var(--primary);font-size:13px;cursor:pointer;font-family:var(--sans);white-space:nowrap}
.ctrls .btn.play{background:var(--primary);color:#fff}
.ctrls .btn:hover{filter:brightness(.94)}
.ctrls .out{font-size:13px;color:var(--ink2);margin-left:auto;min-width:0;flex:1;
  max-width:430px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrls .out b{color:var(--accent);font-weight:600}

/* 底部外壳：全屏后依旧显示按键 */
.chrome{position:fixed;left:0;right:0;bottom:0;height:58px;background:#FCFBF8;
  border-top:1px solid var(--line);display:flex;align-items:center;gap:6px;
  padding:0 16px;z-index:40;font-size:13px;color:var(--ink2)}
.chrome .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.chrome button{font-family:var(--sans);font-size:12.5px;color:var(--ink2);background:transparent;
  border:1px solid transparent;border-radius:5px;padding:7px 9px;cursor:pointer;white-space:nowrap}
.chrome button:hover{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome button.act{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome button.k{font-family:var(--mono);font-size:12px;color:var(--muted)}
.chrome .pg{font-family:var(--mono);font-size:14px;color:var(--ink);min-width:76px;text-align:center}
.chrome .track{flex:1;height:3px;background:var(--line);border-radius:3px;margin:0 10px;position:relative}
.chrome .track i{position:absolute;left:0;top:0;height:3px;background:var(--primary);border-radius:3px;transition:width .35s}
.chrome .hint{font-size:11.5px;color:var(--muted);white-space:nowrap;letter-spacing:.5px}
body.immersive{background:#DCDAD4}
body.immersive #viewport{inset:0 0 46px 0}
body.immersive .chrome{height:46px;background:rgba(252,251,248,.94);
  backdrop-filter:blur(8px);border-top:1px solid var(--line)}
body.immersive .chrome .hint{display:none}
body.immersive .chrome .track{margin:0 6px}

/* 页内开窗：舞台内部的侧抽屉，不是浏览器弹窗 */
.dock{position:absolute;right:0;top:0;width:620px;height:900px;background:#FCFBF8;
  border-left:1px solid var(--line);box-shadow:-18px 0 50px rgba(27,43,51,.16);
  transform:translateX(102%);transition:transform .32s cubic-bezier(.2,.7,.2,1);
  z-index:30;display:flex;flex-direction:column}
.dock.on{transform:translateX(0)}
.dockbar{height:64px;flex:0 0 64px;border-bottom:1px solid var(--line);display:flex;
  align-items:center;gap:12px;padding:0 22px;background:var(--bg)}
.dockbar .dt{font-family:var(--serif);font-size:21px;color:var(--ink);font-weight:700}
.dockbar .dk{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:auto;letter-spacing:.5px}
.dockbar button{font-family:var(--sans);font-size:13px;color:var(--ink2);background:#fff;
  border:1px solid var(--line);border-radius:4px;padding:6px 11px;cursor:pointer}
.dockbody{flex:1;overflow:auto;padding:26px 34px 44px}
.dockbody .psub{font-size:13.5px;color:var(--muted);letter-spacing:1px;margin:2px 0 22px}
.dockbody .sec{border-top:1px solid var(--line);padding:16px 0 20px}
.dockbody .sec:first-child{border-top:none;padding-top:4px}
.dockbody .sec .sn{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:1px}
.dockbody .sec h3{margin:7px 0 10px;font-family:var(--serif);font-size:21px;color:var(--primary)}
.dockbody .sec p{margin:0;font-size:15.5px;line-height:1.95;color:var(--ink2);letter-spacing:.3px}
.dockbody .sec .bk{display:block;margin-top:10px;font-family:var(--serif);font-size:14.5px;
  color:var(--accent);line-height:1.7}
.dockbody h2{margin:0;font-family:var(--serif);font-size:28px;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid a{display:block;padding:12px 12px;border:1px solid var(--line);border-radius:4px;
  background:#fff;text-decoration:none;color:var(--ink);cursor:pointer;transition:.2s}
.grid a:hover{border-color:var(--primary);background:var(--prim-l)}
.grid a .gn{font-family:var(--mono);font-size:12px;color:var(--accent)}
.grid a .gt{font-family:var(--serif);font-size:15px;line-height:1.45;display:block;margin-top:5px}
.keys{display:grid;grid-template-columns:repeat(2,1fr);gap:9px 22px;font-size:14.5px;line-height:1.8}
.keys kbd{font-family:var(--mono);background:#fff;border:1px solid var(--line);
  border-bottom-width:2px;border-radius:4px;padding:2px 7px;color:var(--primary);margin-right:8px}
.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:var(--ink);
  color:#fff;font-size:13px;padding:9px 16px;border-radius:5px;opacity:0;transition:.3s;z-index:80;pointer-events:none}
.toast.on{opacity:1}
@media print{.chrome,.dock,.toast{display:none!important}#viewport{position:static}
  #stage{position:static;transform:none!important;box-shadow:none}
  .slide{display:block!important;page-break-after:always;position:relative;height:900px}}
</style>
</head>
<body>
<div id="viewport"><div id="stage">
  <div id="slides"></div>
  <div class="dock" id="dock">
    <div class="dockbar">
      <span class="dt" id="dockTitle">目录</span>
      <span class="dk">G 目录 · N 本页讲稿 · T 全文讲稿 · Esc 关闭</span>
      <button id="dockClose">关闭 ✕</button>
    </div>
    <div class="dockbody" id="dockBody"></div>
  </div>
</div></div>
<div class="chrome">
  <button id="btnPrev">← 上一页</button>
  <button id="btnNext">下一页 →</button>
  <span class="pg">01 / 21</span>
  <div class="track" id="track"><i></i></div>
  <div class="sep"></div>

</div>
<div class="toast" id="toast"></div>
<script>
const D = [{"eyebrow":"数据库筑基课 · 数据类型与算子","title":"把经纬度交给地球","lede":"从一个最常见、也最容易埋雷的建表动作说起：位置到底该存成什么。","caption":"图：七层剖面。上四层是「只存两个数字」会撞上的墙，下三层是 geography 补上的底座。","bridge":"先别急着选型，先看那两列 numeric 到底把什么弄丢了。","notes":"这一节我们只讲一个类型：PostGIS 的 geography。听起来很小，对吧？一个数据类型嘛，查一下文档、写两行 SQL 就完了。但我建议你跟着我往下走一遍，因为它背后其实是一整条链：数据怎么进来的、类型系统怎么替你把关、距离到底按什么模型算、索引为什么只敢说「不可能」而不敢说「一定是」、以及最后——什么时候压根不该用它。先说个特别熟悉的场景：很多系统一开始建表，位置就是两列，longitude numeric、latitude numeric。这没毛病，点确实存下来了。可是问题在于，数据库只看到两个不相干的数字，它并不知道这两个数字合起来表示地球表面上的一个位置。这个「不知道」，后面会一个接一个地变成麻烦。所以今天这句开场白我想先放在这儿：把经纬度交给地球，把米还给业务。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"30\" y=\"18\" width=\"620\" height=\"396\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"46\" y=\"30\" width=\"588\" height=\"47\" rx=\"2\" fill=\"#74A5AD\" stroke=\"#74A5AD\" stroke-width=\"1.0\" /><text x=\"64\" y=\"58\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#FFFFFF\" font-weight=\"600\" >两列 numeric：只存得下两个数字</text><text x=\"618\" y=\"58\" class=\"sv mono\" text-anchor=\"end\" font-size=\"12.5\" fill=\"#FFFFFF\" font-weight=\"400\" >L7</text><rect x=\"46\" y=\"85\" width=\"588\" height=\"47\" rx=\"2\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1.0\" /><text x=\"64\" y=\"113\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#FFFFFF\" font-weight=\"600\" >4326 geometry：距离单位仍是度</text><text x=\"618\" y=\"113\" class=\"sv mono\" text-anchor=\"end\" font-size=\"12.5\" fill=\"#FFFFFF\" font-weight=\"400\" >L6</text><rect x=\"46\" y=\"140\" width=\"588\" height=\"47\" rx=\"2\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.0\" /><text x=\"64\" y=\"168\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#FFFFFF\" font-weight=\"600\" >局部投影：跨省、跨国就失去统一</text><text x=\"618\" y=\"168\" class=\"sv mono\" text-anchor=\"end\" font-size=\"12.5\" fill=\"#FFFFFF\" font-weight=\"400\" >L5</text><rect x=\"46\" y=\"195\" width=\"588\" height=\"47\" rx=\"2\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.0\" /><text x=\"64\" y=\"223\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#FFFFFF\" font-weight=\"600\" >B-tree：表达不了球面范围与相交</text><text x=\"618\" y=\"223\" class=\"sv mono\" text-anchor=\"end\" font-size=\"12.5\" fill=\"#FFFFFF\" font-weight=\"400\" >L4</text><rect x=\"46\" y=\"250\" width=\"588\" height=\"47\" rx=\"2\" fill=\"#EBF1EE\" stroke=\"#EBF1EE\" stroke-width=\"1.0\" /><text x=\"64\" y=\"278\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#1B2B33\" font-weight=\"600\" >geography：地球表面上的空间类型</text><text x=\"618\" y=\"278\" class=\"sv mono\" text-anchor=\"end\" font-size=\"12.5\" fill=\"#245A6B\" font-weight=\"400\" >L3</text><rect x=\"46\" y=\"305\" width=\"588\" height=\"47\" rx=\"2\" fill=\"#CFE0DC\" stroke=\"#CFE0DC\" stroke-width=\"1.0\" /><text x=\"64\" y=\"333\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#1B2B33\" font-weight=\"600\" >测量：距离 / 长度 / 面积以米返回</text><text x=\"618\" y=\"333\" class=\"sv mono\" text-anchor=\"end\" font-size=\"12.5\" fill=\"#245A6B\" font-weight=\"400\" >L2</text><rect x=\"46\" y=\"360\" width=\"588\" height=\"47\" rx=\"2\" fill=\"#A4C4C6\" stroke=\"#A4C4C6\" stroke-width=\"1.0\" /><text x=\"64\" y=\"388\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#1B2B33\" font-weight=\"600\" >索引：gidx 摘要先排除，再复核</text><text x=\"618\" y=\"388\" class=\"sv mono\" text-anchor=\"end\" font-size=\"12.5\" fill=\"#245A6B\" font-weight=\"400\" >L1</text><text x=\"700\" y=\"96\" class=\"sv serif\" text-anchor=\"start\" font-size=\"62.0\" fill=\"#1B2B33\" font-weight=\"700\" >geography</text><text x=\"700\" y=\"158\" class=\"sv s\" text-anchor=\"start\" font-size=\"20.0\" fill=\"#245A6B\" font-weight=\"600\" >数据类型 · PostGIS</text><line x1=\"700\" y1=\"188\" x2=\"1340\" y2=\"188\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"700\" y=\"240\" class=\"sv serif\" text-anchor=\"start\" font-size=\"34.0\" fill=\"#1B2B33\" font-weight=\"700\" >把经纬度交给地球，</text><text x=\"700\" y=\"288\" class=\"sv serif\" text-anchor=\"start\" font-size=\"34.0\" fill=\"#BE653B\" font-weight=\"700\" >把米还给业务。</text><rect x=\"700\" y=\"320\" width=\"640\" height=\"74\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"720\" y=\"350\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#245A6B\" font-weight=\"400\" >一个类型，串起解析、typmod、测量、统计与索引</text><text x=\"720\" y=\"376\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >本文结论以 PostGIS 源码与文档源码核对</text></svg>","ctrl":null},{"eyebrow":"01 · 困境","title":"两列数字，存不下「地球」","lede":"点存下来了，可数据库不认识它——于是每一个空间问题都要绕回应用层。","caption":"图：左边是两列 numeric 留下的语义缺口，右边是这个缺口在四类业务问题上暴露出来的症状。","bridge":"既然缺的是「地球表面」这层语义，那补的方式就不该是加字段，而是换类型。","notes":"我们把这四个症状摊开看。第一个，找用户三公里内的门店。两列数字摆在那儿，数据库既没有距离函数也没有空间索引，最朴素的写法就是把所有行拉到应用层，一行一行算球面距离——数据量一上来，网络和 CPU 全花在搬运上。第二个更隐蔽：有人听说了 PostGIS，用了 4326 的 geometry，调用 ST_Distance，拿到一个数，比如一点几，然后当成「一点几公里」写进业务。可 4326 的坐标单位是度，那个数是度，不是米，纬度不同的地方一度差多少米还不一样，这种错一般不会报错，只会静悄悄地把结果算错。第三个，跨省、跨国、跨洲的时候，你想靠一个局部投影把经纬度转成米制平面，可投影这东西本来就是为一块区域设计的，范围一大，要么误差失控，要么得维护一堆坐标系。第四个，想建索引，B-tree 是一维排序，它没法表达「球面上谁离谁近、谁和谁相交」。你看，这四个问题看着不一样，根子是同一个：数据库里没有「地球表面上的空间对象」这个东西。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"30\" y=\"20\" width=\"430\" height=\"150\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"48\" y=\"49\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" >很多系统的第一版</text><line x1=\"48\" y1=\"59\" x2=\"442\" y2=\"59\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"50\" y=\"85.5\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >CREATE TABLE stores (</text><text x=\"50\" y=\"105.75\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >  longitude numeric,</text><text x=\"50\" y=\"126.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >  latitude  numeric</text><text x=\"50\" y=\"146.25\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >);</text><text x=\"245\" y=\"196\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#89938F\" font-weight=\"400\" >数据库只知道：两个数字</text><line x1=\"245\" y1=\"210\" x2=\"245\" y2=\"238.8\" stroke=\"#BE653B\" stroke-width=\"2.0\"/><g ><polygon points=\"245,246 240.05,237 249.95,237\" fill=\"#BE653B\" /></g><rect x=\"30\" y=\"252\" width=\"430\" height=\"82\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"48\" y=\"298.25\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"600\" >语义缺口</text><text x=\"166\" y=\"297.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >两列之间没有「地球表面」这层含义</text><line x1=\"470\" y1=\"288\" x2=\"512.8\" y2=\"288\" stroke=\"#BE653B\" stroke-width=\"2.0\"/><g ><polygon points=\"520,288 511,283.05 511,292.95\" fill=\"#BE653B\" /></g><rect x=\"540\" y=\"30\" width=\"400\" height=\"170\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"540\" y=\"30\" width=\"400\" height=\"6\" rx=\"0\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1.0\" /><text x=\"560\" y=\"76\" class=\"sv serif\" text-anchor=\"start\" font-size=\"20.0\" fill=\"#1B2B33\" font-weight=\"700\" >3 公里内门店</text><line x1=\"560\" y1=\"92\" x2=\"920\" y2=\"92\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"560\" y=\"126\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >应用层循环算距离，</text><text x=\"560\" y=\"152\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >数据库只能全表扫</text><text x=\"560\" y=\"180\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" >01</text><rect x=\"960\" y=\"30\" width=\"400\" height=\"170\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"960\" y=\"30\" width=\"400\" height=\"6\" rx=\"0\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1.0\" /><text x=\"980\" y=\"76\" class=\"sv serif\" text-anchor=\"start\" font-size=\"20.0\" fill=\"#1B2B33\" font-weight=\"700\" >航线最近城市</text><line x1=\"980\" y1=\"92\" x2=\"1340\" y2=\"92\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"980\" y=\"126\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >4326 geometry 算出来是度，</text><text x=\"980\" y=\"152\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >业务却当成米</text><text x=\"980\" y=\"180\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" >02</text><rect x=\"540\" y=\"220\" width=\"400\" height=\"170\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"540\" y=\"220\" width=\"400\" height=\"6\" rx=\"0\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1.0\" /><text x=\"560\" y=\"266\" class=\"sv serif\" text-anchor=\"start\" font-size=\"20.0\" fill=\"#1B2B33\" font-weight=\"700\" >跨省到跨洲</text><line x1=\"560\" y1=\"282\" x2=\"920\" y2=\"282\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"560\" y=\"316\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >单个局部投影不再适用</text><text x=\"560\" y=\"370\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" >03</text><rect x=\"960\" y=\"220\" width=\"400\" height=\"170\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"960\" y=\"220\" width=\"400\" height=\"6\" rx=\"0\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1.0\" /><text x=\"980\" y=\"266\" class=\"sv serif\" text-anchor=\"start\" font-size=\"20.0\" fill=\"#1B2B33\" font-weight=\"700\" >想建个索引</text><line x1=\"980\" y1=\"282\" x2=\"1340\" y2=\"282\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"980\" y=\"316\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >B-tree 表达不了球面上的</text><text x=\"980\" y=\"342\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >距离、范围和相交</text><text x=\"980\" y=\"370\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" >04</text></svg>","ctrl":null},{"eyebrow":"02 · 命题","title":"它不是换个类型名，是换一层语义","lede":"把「地球表面」写进类型系统，米制单位和空间索引才有了落脚点。","caption":"图：一句定义拆成五条工程约定——输入、坐标次序、单位、测量模型、索引结构。","bridge":"可这句话里藏着一个容易忽略的分工：geometry 并没有被淘汰。","notes":"所以 geography 到底做了什么？我把它压成一句话：把经纬度对象作为地球表面上的空间类型存储，让距离、长度、面积和范围查询默认以米为单位，并且接进 PostgreSQL 的类型、约束、统计和索引体系。这句话可以拆成五条很具体的约定。第一，输入格式没变，还是 WKT、EWKT、EWKB 那一套，你不用改数据交换协议。第二，坐标次序是死规定：第一维是经度 longitude，第二维是纬度 latitude，写反了后面会出很诡异的事，我们专门留了一页讲。第三，测量相关的函数结果或参数以米为单位，ST_Distance、ST_DWithin、ST_Length、ST_Area 都是。第四，默认用椭球算，想要速度可以切球面近似，但那是在精度和 CPU 之间做交换，不是改数据。第五，索引是两段式：先用 gidx 边界摘要把不可能命中的排除掉，再做精确复核。你把这五条连起来看，会发现它其实是在数据库里补了一整套「空间语义层」，而不只是给字符串贴了个标签。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"30\" y=\"18\" width=\"1340\" height=\"96\" rx=\"2\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.0\" /><text x=\"52\" y=\"56\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#CFE0DC\" font-weight=\"600\" >geography 的一句话定义</text><text x=\"52\" y=\"88\" class=\"sv s\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#FFFFFF\" font-weight=\"600\" >把经纬度对象作为地球表面上的空间类型存储，让距离、长度、面积与范围查询默认以米为单位，并接入 PostgreSQL 的类型、约束、统计和索引体系。</text><rect x=\"30\" y=\"140\" width=\"430\" height=\"120\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"245.0\" y=\"196.42499999999998\" class=\"sv s\" text-anchor=\"middle\" font-size=\"18.0\" fill=\"#245A6B\" font-weight=\"600\" >① 输入格式不变</text><text x=\"245.0\" y=\"219.27499999999998\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >仍是 WKT / EWKT / EWKB</text><rect x=\"480\" y=\"140\" width=\"430\" height=\"120\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"695.0\" y=\"196.42499999999998\" class=\"sv s\" text-anchor=\"middle\" font-size=\"18.0\" fill=\"#245A6B\" font-weight=\"600\" >② 坐标次序固定</text><text x=\"695.0\" y=\"219.27499999999998\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >第一维 longitude，第二维 latitude</text><rect x=\"930\" y=\"140\" width=\"440\" height=\"120\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"1150.0\" y=\"196.42499999999998\" class=\"sv s\" text-anchor=\"middle\" font-size=\"18.0\" fill=\"#245A6B\" font-weight=\"600\" >③ 单位是米</text><text x=\"1150.0\" y=\"219.27499999999998\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >ST_Distance / ST_DWithin / ST_Length / ST_Area</text><rect x=\"30\" y=\"280\" width=\"430\" height=\"120\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"245.0\" y=\"336.425\" class=\"sv s\" text-anchor=\"middle\" font-size=\"18.0\" fill=\"#245A6B\" font-weight=\"600\" >④ 默认椭球</text><text x=\"245.0\" y=\"359.27500000000003\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >必要时 use_spheroid=false 换速度</text><rect x=\"480\" y=\"280\" width=\"430\" height=\"120\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"695.0\" y=\"336.425\" class=\"sv s\" text-anchor=\"middle\" font-size=\"18.0\" fill=\"#245A6B\" font-weight=\"600\" >⑤ 索引两段式</text><text x=\"695.0\" y=\"359.27500000000003\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >gidx 边界摘要排除，再精确复核</text><text x=\"30\" y=\"420\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >五条约定合起来，才构成「地球表面」这一层语义；少一条，米制结果就可能不可信。</text></svg>","ctrl":null},{"eyebrow":"03 · 分工","title":"三条路，不是三选一的宗教题","lede":"geometry 4326、投影 geometry、geography 各有自己的主场，代价也各自清楚。","caption":"图：三种建模方式的模型、单位与主场对照；底部箭头表示「范围与单位需求」如何推动选型。","bridge":"既然分工清楚了，下一层就该问：这个类型在 PostgreSQL 里究竟是怎么落地的。","notes":"这里特别要泼一盆冷水：不要听完上一页就得出「经纬度就该用 geography」的结论。PostGIS 里其实有三条路。第一条，4326 的 geometry，它把经纬度当平面坐标存，适合展示、简单保存、跟 GeoJSON 之类的格式打交道，但它算出来的距离是度。第二条，选一个适合当地的投影坐标系，把经纬度转成米制平面坐标再用 geometry——如果业务就在一个城市里，这往往是正确做法，函数最全、性能最好、单位也直观。第三条才是 geography，它把对象放在地球表面上，默认按椭球算，结果以米返回，主场是全球门店、国际航线、跨境物流、海缆、卫星覆盖这类天然跨大范围的业务。原文里有一句很实在的话：局部投影很难同时保证单位直观、误差可控和模型简单；而 geography 的代价也写得很直白——函数更少、执行更慢，球面椭球数学比平面几何复杂得多。所以选型不是站队，是看你这个 workload 里，范围、单位、函数复杂度、性能这几件事怎么排序。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"30\" y=\"24\" width=\"425\" height=\"320\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"30\" y=\"24\" width=\"425\" height=\"58\" rx=\"2\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1.0\" /><text x=\"242\" y=\"60\" class=\"sv s\" text-anchor=\"middle\" font-size=\"18.0\" fill=\"#FFFFFF\" font-weight=\"700\" >geometry · SRID 4326</text><rect x=\"48\" y=\"100\" width=\"389\" height=\"62\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"66\" y=\"135.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"600\" >模型</text><text x=\"154\" y=\"135.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >平面上的经纬度对象</text><rect x=\"48\" y=\"172\" width=\"389\" height=\"62\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"66\" y=\"207.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"600\ v s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"600\" >主场</text><text x=\"609\" y=\"279.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >城市 / 区域内高频空间分析</text><text x=\"697\" y=\"332\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" >L2</text><rect x=\"940\" y=\"24\" width=\"425\" height=\"320\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"940\" y=\"24\" width=\"425\" height=\"58\" rx=\"2\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1.0\" /><text x=\"1152\" y=\"60\" class=\"sv s\" text-anchor=\"middle\" font-size=\"18.0\" fill=\"#FFFFFF\" font-weight=\"700\" >geography · 4326</text><rect x=\"958\" y=\"100\" width=\"389\" height=\"62\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1.0\" /><text x=\"976\" y=\"135.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#2F7A66\" font-weight=\"600\" >模型</text><text x=\"1064\" y=\"135.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >地球表面上的经纬度对象</text><rect x=\"958\" y=\"172\" width=\"389\" height=\"62\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1.0\" /><text x=\"976\" y=\"207.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#2F7A66\" font-weight=\"600\" >单位</text><text x=\"1064\" y=\"208.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"400\" >米</text><rect x=\"958\" y=\"244\" width=\"389\" height=\"62\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1.0\" /><text x=\"976\" y=\"279.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#2F7A66\" font-weight=\"600\" >主场</text><text x=\"1064\" y=\"279.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >全球 / 跨区域的米制测量</text><text x=\"1152\" y=\"332\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" >L3</text><line x1=\"30\" y1=\"368\" x2=\"1370\" y2=\"368\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><line x1=\"60\" y1=\"388\" x2=\"1330.0\" y2=\"388\" stroke=\"#AE8A3E\" stroke-width=\"2.2\"/><g ><polygon points=\"1338,388 1328,382.5 1328,393.5\" fill=\"#AE8A3E\" /></g><text x=\"60\" y=\"414\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >范围越大、越需要直接的米制语义 → 越往右靠；局部计算越复杂、越追求性能 → 越往左靠</text></svg>","ctrl":null},{"eyebrow":"04 · 类型底座","title":"它先是一个 PostgreSQL 类型","lede":"geography 不是函数集合，而是注册进类型系统的一整套 I/O、约束、统计与存储契约。","caption":"图：从 SQL 层到默认索引 opclass 的六层剖面，依据 postgis/geography.sql.in 的类型定义。","bridge":"类型被认识了，接下来才有资格谈「哪些空间对象允许进来」。","notes":"我们把视线沉到最底层。在 SQL 层，geography 是 PostGIS 注册给 PostgreSQL 的一个变长类型，源码在 geography.sql.in 里。它定义了文本输入输出 geography_in、geography_out，二进制收发 recv、send，还有专门解析列类型修饰的 typmod_in、typmod_out——也就是 geography(Point,4326) 里那个括号。它还绑定了 geography_analyze，接到 gserialized_analyze_nd 上，让优化器能拿到空间统计信息；CREATE TYPE 时写明 internallength = variable、storage = main、alignment = double。最下面一层是默认索引操作符类：GiST 的 gist_geography_ops 和 BRIN 的 brin_geography_inclusion_ops，两个的 STORAGE 都是 gidx。我为什么先讲这个？因为很多人理解 geography 是「一堆能在球面上算距离的函数」，其实不是。它首先得让 PostgreSQL 认识这个类型：怎么读写、怎么校验、怎么统计、怎么存、怎么建索引。这一层不打牢，上面的米制语义根本无从谈起——这也正是我们这个系列叫筑基课的原因。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"30\" y=\"18\" width=\"1340\" height=\"58\" rx=\"2\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.0\" /><text x=\"50\" y=\"53\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#FFFFFF\" font-weight=\"700\" >SQL 层</text><text x=\"310\" y=\"53\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#FFFFFF\" font-weight=\"600\" >CREATE TYPE geography</text><text x=\"770\" y=\"53\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#CFE0DC\" font-weight=\"500\" >变长类型 internallength = variable</text><text x=\"1350\" y=\"53\" class=\"sv mono\" text-anchor=\"end\" font-size=\"12.0\" fill=\"#FFFFFF\" font-weight=\"400\" >L6</text><rect x=\"30\" y=\"84\" width=\"1340\" height=\"58\" rx=\"2\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.0\" /><text x=\"50\" y=\"119\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#FFFFFF\" font-weight=\"700\" >输入 / 输出</text><text x=\"310\" y=\"119\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#FFFFFF\" font-weight=\"600\" >geography_in / out · recv / send</text><text x=\"770\" y=\"119\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#CFE0DC\" font-weight=\"500\" >文本与二进制两条收发路径</text><text x=\"1350\" y=\"119\" class=\"sv mono\" text-anchor=\"end\" font-size=\"12.0\" fill=\"#FFFFFF\" font-weight=\"400\" >L5</text><rect x=\"30\" y=\"150\" width=\"1340\" height=\"58\" rx=\"2\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1.0\" /><text x=\"50\" y=\"185\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#FFFFFF\" font-weight=\"700\" >类型修饰</text><text x=\"310\" y=\"185\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#FFFFFF\" font-weight=\"600\" >geography_typmod_in / out</text><text x=\"770\" y=\"185\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#CFE0DC\" font-weight=\"500\" >解析 geography(Point,4326)</text><text x=\"1350\" y=\"185\" class=\"sv mono\" text-anchor=\"end\" font-size=\"12.0\" fill=\"#FFFFFF\" font-weight=\"400\" >L4</text><rect x=\"30\" y=\"216\" width=\"1340\" height=\"58\" rx=\"2\" fill=\"#74A5AD\" stroke=\"#74A5AD\" stroke-width=\"1.0\" /><text x=\"50\" y=\"251\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"700\" >优化器统计</text><text x=\"310\" y=\"251\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >geography_analyze</text><text x=\"770\" y=\"251\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"500\" >绑定 gserialized_analyze_nd</text><text x=\"1350\" y=\"251\" class=\"sv mono\" text-anchor=\"end\" font-size=\"12.0\" fill=\"#1B2B33\" font-weight=\"400\" >L3</text><rect x=\"30\" y=\"282\" width=\"1340\" height=\"58\" rx=\"2\" fill=\"#A4C4C6\" stroke=\"#A4C4C6\" stroke-width=\"1.0\" /><text x=\"50\" y=\"317\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"700\" >存储对齐</text><text x=\"310\" y=\"317\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >storage = main · alignment = double</text><text x=\"770\" y=\"317\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"500\" >以 GSERIALIZED 落在行内</text><text x=\"1350\" y=\"317\" class=\"sv mono\" text-anchor=\"end\" font-size=\"12.0\" fill=\"#1B2B33\" font-weight=\"400\" >L2</text><rect x=\"30\" y=\"348\" width=\"1340\" height=\"58\" rx=\"2\" fill=\"#CFE0DC\" stroke=\"#CFE0DC\" stroke-width=\"1.0\" /><text x=\"50\" y=\"383\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"700\" >默认索引</text><text x=\"310\" y=\"383\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >gist_geography_ops · brin_geography_inclusion_ops</text><text x=\"770\" y=\"383\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"500\" >STORAGE 都是 gidx</text><text x=\"1350\" y=\"383\" class=\"sv mono\" text-anchor=\"end\" font-size=\"12.0\" fill=\"#1B2B33\" font-weight=\"400\" >L1</text><text x=\"30\" y=\"422\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >越深的靛青越底层：类型先被 PostgreSQL 认识，才有后面的约束、统计、索引与优化器估算。</text></svg>","ctrl":null},{"eyebrow":"05 · 类型面","title":"支持七种，拒绝三类","lede":"geography 的类型面比 geometry 窄，这不是遗漏，是球面数学的代价。","caption":"图：左侧是允许的七种简单要素，右侧是明确拒绝的三类类型及收窄原因。","bridge":"类型面定了，下一步就是把「只允许点、只允许 4326」写成数据库自己的约束。","notes":"一个类型能装什么，得先说清楚。geography 支持七种：POINT、LINESTRING、POLYGON，加上对应的 MULTI 版本，再加 GEOMETRYCOLLECTION。它们的共同点是都属于简单要素，顶点之间按测地线连接，边界可以用经纬度的矩形摘要描述。它明确不支持曲线、TIN、PolyhedralSurface 这些类型。为什么？文档和早期说明里都写得很直接：要正确处理球面曲线，复杂度会明显上升。换句话说，这是主动收窄，不是没做完。这一点对建模有直接影响：如果你要做复杂拓扑编辑、精细缓冲、多步骤 overlay，别指望 geography 在椭球上直接给你做完——那些算法在平面 geometry 路径上更成熟，我们后面专门有一页讲 PostGIS 自己是怎么「临时投影、算完再转回来」的。所以记住这个分工：geography 负责把地球表面上的测量语义做对，geometry 负责把复杂空间处理做全。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><text x=\"30\" y=\"42\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#2F7A66\" font-weight=\"700\" >支持：简单要素里的常见类型</text><rect x=\"30\" y=\"62\" width=\"186\" height=\"64\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"123.0\" y=\"98.725\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#2F7A66\" font-weight=\"600\" >POINT</text><rect x=\"228\" y=\"62\" width=\"186\" height=\"64\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"321.0\" y=\"98.725\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#2F7A66\" font-weight=\"600\" >LINESTRING</text><rect x=\"426\" y=\"62\" width=\"186\" height=\"64\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"519.0\" y=\"98.725\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#2F7A66\" font-weight=\"600\" >POLYGON</text><rect x=\"624\" y=\"62\" width=\"186\" height=\"64\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"717.0\" y=\"98.725\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#2F7A66\" font-weight=\"600\" >MULTIPOINT</text><rect x=\"30\" y=\"140\" width=\"186\" height=\"64\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"123.0\" y=\"176.725\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#2F7A66\" font-weight=\"600\" >MULTILINESTRING</text><rect x=\"228\" y=\"140\" width=\"186\" height=\"64\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"321.0\" y=\"176.725\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#2F7A66\" font-weight=\"600\" >MULTIPOLYGON</text><rect x=\"426\" y=\"140\" width=\"186\" height=\"64\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"519.0\" y=\"176.725\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#2F7A66\" font-weight=\"600\" >GEOMETRYCOLLECTION</text><rect x=\"30\" y=\"226\" width=\"780\" height=\"84\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"50\" y=\"256\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"700\" >共同点</text><text x=\"50\" y=\"284\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >都是 OGC 简单要素：顶点之间按测地线连接，边界可以由经纬度的矩形摘要描述。</text><text x=\"860\" y=\"42\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#BE653B\" font-weight=\"700\" >不支持：类型面刻意收窄</text><rect x=\"860\" y=\"62\" width=\"510\" height=\"64\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.1\" /><text x=\"1115.0\" y=\"98.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"600\" >曲线类型 CircularString / Curve</text><rect x=\"860\" y=\"140\" width=\"510\" height=\"64\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.1\" /><text x=\"1115.0\" y=\"176.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"600\" >TIN</text><rect x=\"860\" y=\"218\" width=\"510\" height=\"64\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.1\" /><text x=\"1115.0\" y=\"254.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"600\" >PolyhedralSurface</text><rect x=\"860\" y=\"300\" width=\"510\" height=\"84\" rx=\"2\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1.0\" /><text x=\"880\" y=\"330\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#AE8A3E\" font-weight=\"700\" >为什么收窄？</text><text x=\"880\" y=\"358\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >正确处理球面曲线会显著增加复杂度，函数面也比 geometry 窄。</text><line x1=\"30\" y1=\"396\" x2=\"1370\" y2=\"396\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"30\" y=\"418\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >建模含义：复杂拓扑编辑、精细缓冲、overlay 工作流，仍要落到合适投影下的 geometry 路径。</text></svg>","ctrl":null},{"eyebrow":"06 · 列级契约","title":"把约定前移到数据库","lede":"geography(Point,4326) 是列级契约：类型、维度、SRID 在写入路径上就被检查。","caption":"图：建表 SQL 与 typmod 的三个校验闸门；下方是 typmod 解析、SRID 检查与写入校验的链路。","bridge":"契约立在最外层了，那一条具体的值是怎么穿过这道门、最后落到行里的？","notes":"生产建表时我强烈建议不要写裸 geography，而要写全：geography(Point, 4326)。括号里这个 Point,4326 就是 PostgreSQL 的 typmod，列级类型修饰。它带来什么？写入非点对象、写入不是 4326 的 SRID、或者 Z/M 维度对不上，PostGIS 会在类型路径上直接拒绝，而不是等到应用层某天发现数据脏了。源码里的链路是这样的：geography_typmod_in 先解析 Point,4326，再调 srid_check_latlong 确认这确实是经纬度坐标系；写入时 geography_enforce_typmod 调 postgis_valid_typmod，跟 geometry 共用一套核心约束逻辑。typmod 缺省时不额外限制；指定了类型、维度、SRID，就必须一致；SRID 没定义的情况可以被补成列 SRID。这里对 DBA 的意义特别实在：所有导入、批处理、手写 SQL、ORM 写入，都得走同一个类型入口。你在应用层写十遍「记得传点、记得 4326」，都不如数据库里这一行定义可靠。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"30\" y=\"20\" width=\"700\" height=\"230\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"48\" y=\"49\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" >生产建表：写清楚类型与 SRID</text><line x1=\"48\" y1=\"59\" x2=\"712\" y2=\"59\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"50\" y=\"87.19753086419753\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.2\" fill=\"#1B2B33\" font-weight=\"400\" >CREATE TABLE stores (</text><text x=\"50\" y=\"110.19753086419753\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.2\" fill=\"#1B2B33\" font-weight=\"400\" >  id       bigserial PRIMARY KEY,</text><text x=\"50\" y=\"133.19753086419755\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.2\" fill=\"#1B2B33\" font-weight=\"400\" >  name     text NOT NULL,</text><text x=\"50\" y=\"156.19753086419755\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.2\" fill=\"#1B2B33\" font-weight=\"400\" >  location geography(Point, 4326) NOT NULL);</text><text x=\"50\" y=\"179.19753086419755\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.2\" fill=\"#1B2B33\" font-weight=\"400\" >CREATE INDEX stores_location_gix</text><text x=\"50\" y=\"202.19753086419755\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.2\" fill=\"#1B2B33\" font-weight=\"400\" >  ON stores USING gist (location);</text><text x=\"50\" y=\"225.19753086419757\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.2\" fill=\"#1B2B33\" font-weight=\"400\" >-- 非点 / 维度不符 / SRID 不符 → 类型入口拒绝</text><line x1=\"730\" y1=\"118\" x2=\"752.8\" y2=\"118\" stroke=\"#245A6B\" stroke-width=\"2.0\"/><g ><polygon points=\"760,118 751,113.05 751,122.95\" fill=\"#245A6B\" /></g><text x=\"770\" y=\"40\" class=\"sv serif\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#245A6B\" font-weight=\"700\" >列级契约 = typmod</text><rect x=\"770\" y=\"56\" width=\"600\" height=\"46\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"788\" y=\"83.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"600\" >类型</text><text x=\"872\" y=\"83.55\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >写入非 POINT 对象 → 拒绝</text><rect x=\"770\" y=\"110\" width=\"600\" height=\"46\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"788\" y=\"137.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"600\" >维度</text><text x=\"872\" y=\"137.55\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >Z / M 与列定义不一致 → 拒绝</text><rect x=\"770\" y=\"164\" width=\"600\" height=\"46\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"788\" y=\"191.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"600\" >SRID</text><text x=\"872\" y=\"191.55\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >非 4326 或混用 SRID → 拒绝</text><line x1=\"30\" y1=\"240\" x2=\"1370\" y2=\"240\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><rect x=\"30\" y=\"262\" width=\"425\" height=\"92\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"242.5\" y=\"303.65000000000003\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"600\" >geography_typmod_in</text><text x=\"242.5\" y=\"325.77500000000003\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >解析 Point,4326</text><line x1=\"455\" y1=\"308\" x2=\"478.6\" y2=\"308\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><g ><polygon points=\"485,308 477,303.6 477,312.4\" fill=\"#245A6B\" /></g><rect x=\"485\" y=\"262\" width=\"425\" height=\"92\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"697.5\" y=\"303.65000000000003\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"600\" >srid_check_latlong</text><text x=\"697.5\" y=\"325.77500000000003\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >确认是经纬度 SRID</text><line x1=\"910\" y1=\"308\" x2=\"933.6\" y2=\"308\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><g ><polygon points=\"940,308 932,303.6 932,312.4\" fill=\"#245A6B\" /></g><rect x=\"940\" y=\"262\" width=\"425\" height=\"92\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"1152.5\" y=\"303.65000000000003\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"600\" >postgis_valid_typmod</text><text x=\"1152.5\" y=\"325.77500000000003\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >写入时校验类型 / 维度 / SRID</text><rect x=\"30\" y=\"370\" width=\"1340\" height=\"48\" rx=\"2\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1.0\" /><text x=\"50\" y=\"400\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#2F7A66\" font-weight=\"600\" >意义：导入、批处理、SQL 写入、ORM 写入都走同一个类型入口，比应用层「约定传点、约定 4326」可靠。</text></svg>","ctrl":null},{"eyebrow":"07 · 输入路径","title":"一个值进门，要过八道关","lede":"geography_in() 先按空间对象解析，再加 geodetic 语义，最后才序列化进 PostgreSQL 的行。","caption":"","bridge":"可值一旦进了门，真正决定结果对不对的，是「按什么模型量距离」。","notes":"现在跟着一个具体的值走一遍。源码 geography_inout.c 里的 geography_in()，第一步把输入解析成 LWGEOM：以 0 开头就按 hex WKB 试，否则按 WKT。空字符串直接报错。接着调 srid_check_latlong，非经纬度坐标系在这里被拒；然后设置 geodetic 标志，也就是告诉后面的所有计算「请按地球表面理解我」；再检查类型是不是 geography 支持的简单类型。第五步很有意思：对非常接近边界的坐标，lwgeom_nudge_geodetic 做贴边修正；对越界坐标，lwgeom_force_geodetic 做经纬度归一化，还会发一个 notice——这就是为什么 POINT(30 120) 这种写反经纬度的输入，不一定报错，但结果已经不是你以为的那个位置了。第六步，SRID 小于等于 0 时补成默认 4326。第七步序列化为 GSERIALIZED，第八步如果列上有 typmod，再调 postgis_valid_typmod 校验类型、维度和 SRID。你可以用上面的输入样例亲手试：投影 SRID 会在第二步被拒，曲线类型在第四步被拒，写反的经纬度在第五步被悄悄归一化。还有个版本差异要留意：老文档说 geography 只假定 WGS84/4326，当前文档源码写的是可以用 spatial_ref_sys 里任意 geodetic long/lat SRID，源码也确实调了 srid_check_latlong——本文按当前源码和文档为准。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" id=\"animIn\"><rect x=\"30\" y=\"24\" width=\"310\" height=\"118\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" class=\"sbox\" data-step=\"1\"/><text x=\"185.0\" y=\"79.5\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"600\" >1  解析为 LWGEOM</text><text x=\"185.0\" y=\"100.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" 拒绝曲线 / TIN / PolyhedralSurface</text><rect x=\"30\" y=\"200\" width=\"310\" height=\"118\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" class=\"sbox\" data-step=\"5\"/><text x=\"185.0\" y=\"255.5\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"600\" >5  坐标边界处理</text><text x=\"185.0\" y=\"276.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >nudge 贴边 · force 归一化 + notice</text><line x1=\"340\" y1=\"259\" x2=\"365\" y2=\"259\" stroke=\"#D9D5CB\" stroke-width=\"2\" class=\"flowar\" data-step=\"5\"/><polygon points=\"372,259 364,254 364,264\" fill=\"#D9D5CB\" class=\"flowar\" data-step=\"5\"/><rect x=\"372\" y=\"200\" width=\"310\" height=\"118\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" class=\"sbox\" data-step=\"6\"/><text x=\"527.0\" y=\"255.5\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"600\" >6  默认 SRID 4326</text><text x=\"527.0\" y=\"276.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >SRID ≤ 0 时补默认值</text><line x1=\"682\" y1=\"259\" x2=\"707\" y2=\"259\" stroke=\"#D9D5CB\" stroke-width=\"2\" class=\"flowar\" data-step=\"6\"/><polygon points=\"714,259 706,254 706,264\" fill=\"#D9D5CB\" class=\"flowar\" data-step=\"6\"/><rect x=\"714\" y=\"200\" width=\"310\" height=\"118\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" class=\"sbox\" data-step=\"7\"/><text x=\"869.0\" y=\"255.5\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"600\" >7  序列化 GSERIALIZED</text><text x=\"869.0\" y=\"276.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >带标志写入空间对象</text><line x1=\"1024\" y1=\"259\" x2=\"1049\" y2=\"259\" stroke=\"#D9D5CB\" stroke-width=\"2\" class=\"flowar\" data-step=\"7\"/><polygon points=\"1056,259 1048,254 1048,264\" fill=\"#D9D5CB\" class=\"flowar\" data-step=\"7\"/><rect x=\"1056\" y=\"200\" width=\"310\" height=\"118\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" class=\"sbox\" data-step=\"8\"/><text x=\"1211.0\" y=\"255.5\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"600\" >8  typmod 校验</text><text x=\"1211.0\" y=\"276.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >postgis_valid_typmod()</text><line x1=\"1211\" y1=\"142\" x2=\"1211\" y2=\"172\" stroke=\"#D9D5CB\" stroke-width=\"2.0\"/><line x1=\"1211\" y1=\"172\" x2=\"185\" y2=\"172\" stroke=\"#D9D5CB\" stroke-width=\"2.0\"/><line x1=\"185\" y1=\"172\" x2=\"185\" y2=\"193\" stroke=\"#D9D5CB\" stroke-width=\"2\" class=\"flowar\" data-step=\"4\"/><polygon points=\"185,200 180,192 190,192\" fill=\"#D9D5CB\" class=\"flowar\" data-step=\"4\"/><line x1=\"340\" y1=\"259\" x2=\"365\" y2=\"259\" stroke=\"#D9D5CB\" stroke-width=\"2\" class=\"flowar\" data-step=\"5\"/><polygon points=\"372,259 364,254 364,264\" fill=\"#D9D5CB\" class=\"flowar\" data-step=\"5\"/><line x1=\"682\" y1=\"259\" x2=\"707\" y2=\"259\" stroke=\"#D9D5CB\" stroke-width=\"2\" class=\"flowar\" data-step=\"6\"/><polygon points=\"714,259 706,254 706,264\" fill=\"#D9D5CB\" class=\"flowar\" data-step=\"6\"/><line x1=\"1024\" y1=\"259\" x2=\"1049\" y2=\"259\" stroke=\"#D9D5CB\" stroke-width=\"2\" class=\"flowar\" data-step=\"7\"/><polygon points=\"1056,259 1048,254 1048,264\" fill=\"#D9D5CB\" class=\"flowar\" data-step=\"7\"/><text x=\"30\" y=\"414\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >播放时选择不同输入样例，观察它在第 2 / 4 / 5 / 6 步被拦下、被修正或被放行。</text></svg>","ctrl":"<label>输入样例</label><select id=\"inCase\"><option value=\"wkt\">WKT 点 · SRID=4326（正常）</option><option value=\"proj\">投影 SRID 3857（被拒）</option><option value=\"flip\">POINT(30 120) 顺序写反</option><option value=\"srid0\">SRID=0 未定义（补 4326）</option><option value=\"curve\">CIRCULARSTRING 曲线（被拒）</option></select><button class=\"btn play\" id=\"inPlay\">▶ 播放</button><button class=\"btn\" id=\"inTick\">单步 ›</button><button class=\"btn\" id=\"inReset\">重置</button><div class=\"out\" id=\"inOut\"><b>待播放</b> 选择输入样例，观察它在哪一步被放行或拦下</div>"},{"eyebrow":"08 · 测量模型","title":"度，还是米？这是全篇的分水岭","lede":"同样两个经纬度点，geometry 按平面直线理解，geography 按球面或椭球上的路径理解。","caption":"图：三种测量模型并列。平面返回度，球面与椭球返回米；弧线是几何示意，文字全部留在独立说明区。","bridge":"模型定下来，函数签名里的单位和参数才读得懂。","notes":"这一页是整篇的分水岭。geometry 的基础是平面：两点之间最短路径是直线，距离单位取决于坐标系。SRID 4326 的坐标单位是度，所以对 4326 的 geometry 做 ST_Distance，拿到的不是米——上一页那个「一点几公里」的 bug 就出在这儿。geography 的基础是地球表面。文档 reference_measure.xml 写得很明确：ST_Distance(geography, geography, use_spheroid boolean DEFAULT true) 默认返回最小测地距离，单位米；把第三个参数设成 false，就是更快但没那么准的球面计算。源码 geography_measurement.c 里能看到同一条路径：取出 GSERIALIZED、检查两个对象 SRID 是否一致、按 SRID 初始化 SPHEROID，use_spheroid=false 时把椭球半长轴和半短轴都设成球半径；空对象返回 NULL；优先走缓存路径，失败再用 tree-based distance；最后还要对纳米级浮点误差做舍入。所以请记住一句话：use_spheroid=false 是在精度和 CPU 之间做交换，它不改变你的输入数据，也不改变类型，只换了那把尺子。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"30\" y=\"18\" width=\"425\" height=\"362\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"30\" y=\"18\" width=\"425\" height=\"56\" rx=\"2\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1.0\" /><text x=\"242\" y=\"52\" class=\"sv s\" text-anchor=\"middle\" font-size=\"18.0\" fill=\"#FFFFFF\" font-weight=\"700\" >geometry · 平面</text><text x=\"242\" y=\"98\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" >单位取决于 SRID</text><rect x=\"485\" y=\"18\" width=\"425\" height=\"362\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"485\" y=\"18\" width=\"425\" height=\"56\" rx=\"2\" fill=\"#74A5AD\" stroke=\"#74A5AD\" stroke-width=\"1.0\" /><text x=\"697\" y=\"52\" class=\"sv s\" text-anchor=\"middle\" font-size=\"18.0\" fill=\"#FFFFFF\" font-weight=\"700\" >geography · 球面</text><text x=\"697\" y=\"98\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" >use_spheroid = false</text><rect x=\"940\" y=\"18\" width=\"425\" height=\"362\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"940\" y=\"18\" width=\"425\" height=\"56\" rx=\"2\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.0\" /><text x=\"1152\" y=\"52\" class=\"sv s\" text-anchor=\"middle\" font-size=\"18.0\" fill=\"#FFFFFF\" font-weight=\"700\" >geography · 椭球（默认）</text><text x=\"1152\" y=\"98\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" >use_spheroid = true</text><line x1=\"70\" y1=\"236\" x2=\"420\" y2=\"236\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><line x1=\"90\" y1=\"140\" x2=\"90\" y2=\"236\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><line x1=\"140\" y1=\"236\" x2=\"350\" y2=\"236\" stroke=\"#BE653B\" stroke-width=\"3.0\"/><circle cx=\"140\" cy=\"236\" r=\"6\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1.0\" /><circle cx=\"350\" cy=\"236\" r=\"6\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1.0\" /><text x=\"245\" y=\"180\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"600\" >两点之间是平面直线</text><circle cx=\"697\" cy=\"196\" r=\"74\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.8\" /><path d=\"M641 238 A74 74 0 0 1 755 158\" fill=\"none\" stroke=\"#2F7A66\" stroke-width=\"3\"/><circle cx=\"641\" cy=\"238\" r=\"6\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1.0\" /><circle cx=\"755\" cy=\"158\" r=\"6\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1.0\" /><text x=\"697\" y=\"288\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#2F7A66\" font-weight=\"600\" >大圆弧 · 更快，精度略低</text><ellipse cx=\"1152\" cy=\"196\" rx=\"88\" ry=\"68\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.8\" /><path d=\"M1080 234 A88 68 0 0 1 1224 158\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"3\"/><circle cx=\"1080\" cy=\"234\" r=\"6\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><circle cx=\"1224\" cy=\"158\" r=\"6\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"1152\" y=\"288\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"600\" >测地线 · 默认，更准，CPU 更贵</text><text x=\"50\" y=\"314\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >4326 的坐标是度，ST_Distance 结果不是米</text><text x=\"50\" y=\"336\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >两点最短路径：直线</text><text x=\"50\" y=\"358\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >单位跟着坐标系走，容易把度当米</text><text x=\"505\" y=\"314\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >use_spheroid=false：半长轴 = 半短轴 = 球半径</text><text x=\"505\" y=\"336\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >KNN &lt;-&gt; 也固定走球面</text><text x=\"505\" y=\"358\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >换取速度，不改输入数据</text><text x=\"960\" y=\"314\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >按 SRID 初始化 SPHEROID</text><text x=\"960\" y=\"336\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >结果单位：米 / 平方米</text><text x=\"960\" y=\"358\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >大对象、多顶点成本更高</text><rect x=\"30\" y=\"392\" width=\"1340\" height=\"32\" rx=\"2\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1.0\" /><text x=\"48\" y=\"413\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#AE8A3E\" font-weight=\"400\" >取舍点：use_spheroid=false 只换计算模型，不改输入数据；平面最快但语义可能错。</text></svg>","ctrl":null},{"eyebrow":"09 · 函数语义","title":"五个函数，四个以米为单位","lede":"把常用测量函数的语义、单位和取舍放在一起看，最后一行藏着最常见的坑。","caption":"图：五个常用函数的 geography 语义对照，依据 doc/reference_measure.xml 与 reference_operator.xml。","bridge":"先揪出最后那行：<-> 为什么偏偏不能按椭球算？","notes":"把常用函数摊成一张表，规律就很清楚了。ST_Distance 返回两个对象的最小测地距离，单位米；ST_DWithin 判断是否在指定米数内，参数就是 meters，而且它可以走索引粗过滤再精确判断；ST_Length 算线长、ST_Area 算面积，分别是米和平方米；最后 <-> 是 KNN 排序距离，返回米近似。前四个的默认都是椭球，可以用 use_spheroid 切到球面。唯独 <-> 不一样：源码 geography_distance_knn 里写死了 use_spheroid = false，注释说索引无法与椭球距离协调，所以必须用球面距离；reference_operator.xml 也确认 geography 的 KNN 基于 sphere 而不是 spheroid。这个差别平时不显眼，一旦你的接口既要「附近的人」又要「按精确距离排序」，它就会变成结果顺序对不上的问题。别的取舍也算清楚：ST_Area 对大多边形 CPU 代价高，ST_Length 反而是大范围线更适合 geography。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"30\" y=\"18\" width=\"1340\" height=\"380\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"30\" y=\"18\" width=\"1340\" height=\"50\" rx=\"2\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.0\" /><text x=\"44\" y=\"48.075\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#FFFFFF\" font-weight=\"600\" >函数</text><text x=\"474\" y=\"48.075\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#FFFFFF\" font-weight=\"600\" >geography 语义</text><text x=\"874\" y=\"48.075\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#FFFFFF\" font-weight=\"600\" >单位</text><text x=\"1004\" y=\"48.075\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#FFFFFF\" font-weight=\"600\" >关键取舍</text><line x1=\"30\" y1=\"134\" x2=\"1370\" y2=\"134\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"44\" y=\"105.725\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"600\" >ST_Distance(geog1, geog2, use_spheroid)</text><text x=\"474\" y=\"105.725\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >两个对象的最小测地距离</text><text x=\"874\" y=\"105.725\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >米</text><text x=\"1004\" y=\"105.725\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >默认椭球更准确；球面更快</text><rect x=\"30\" y=\"134\" width=\"1340\" height=\"66\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"none\" stroke-width=\"0\" /><line x1=\"30\" y1=\"200\" x2=\"1370\" y2=\"200\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"44\" y=\"171.725\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"600\" >ST_DWithin(geog1, geog2, meters, use_spheroid)</text><text x=\"474\" y=\"171.725\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >是否在指定米数内</text><text x=\"874\" y=\"171.725\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >米</text><text x=\"1004\" y=\"171.725\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >可走索引粗过滤，再精确判断</text><line x1=\"30\" y1=\"266\" x2=\"1370\" y2=\"266\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"44\" y=\"237.725\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"600\" >ST_Length(geog, use_spheroid)</text><text x=\"474\" y=\"237.725\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >线对象长度</text><text x=\"874\" y=\"237.725\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >米</text><text x=\"1004\" y=\"237.725\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >大范围线更适合 geography</text><rect x=\"30\" y=\"266\" width=\"1340\" height=\"66\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"none\" stroke-width=\"0\" /><line x1=\"30\" y1=\"332\" x2=\"1370\" y2=\"332\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"44\" y=\"303.725\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"600\" >ST_Area(geog, use_spheroid)</text><text x=\"474\" y=\"303.725\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >面对象面积</text><text x=\"874\" y=\"303.725\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >平方米</text><text x=\"1004\" y=\"303.725\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >大多边形 CPU 代价高</text><line x1=\"30\" y1=\"398\" x2=\"1370\" y2=\"398\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"44\" y=\"369.725\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"600\" >&lt;-&gt;</text><text x=\"474\" y=\"369.725\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >KNN 排序距离</text><text x=\"874\" y=\"369.725\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >米近似</text><text x=\"1004\" y=\"369.725\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >geography KNN 基于球面而不是椭球</text><line x1=\"460\" y1=\"68\" x2=\"460\" y2=\"398\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><line x1=\"860\" y1=\"68\" x2=\"860\" y2=\"398\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><line x1=\"990\" y1=\"68\" x2=\"990\" y2=\"398\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><rect x=\"30\" y=\"392\" width=\"1340\" height=\"32\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"48\" y=\"413\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#BE653B\" font-weight=\"400\" >最容易被忽略的是最后一行：&lt;-&gt; 与默认 ST_Distance 用的不是同一个距离定义。</text></svg>","ctrl":null},{"eyebrow":"10 · 近邻查询","title":"快的一步，和准的一步","lede":"geography 的 KNN 用球面距离找候选，严格椭球排序要靠第二阶段精排。","caption":"图：从 GiST KNN 候选到椭球精排的四步链路，右侧说明索引为何无法与椭球距离协调。","bridge":"不管是精排还是普通范围查询，都绕不开同一个问题：索引里存的到底是什么。","notes":"这就自然引出一个很实用的写法。第一阶段，用 ORDER BY location <-> 查询点 LIMIT 100，让 GiST 的 KNN 能力快速拿出一小撮候选；这一阶段的距离是球面的。第二阶段，在这一百行里用默认的 ST_Distance 重新算椭球距离，按 dist_m 排序，再 LIMIT 10。为什么要这么绕？因为索引要工作，就得有一个和树结构能协调、可比较的距离下界；源码注释说得很干脆，索引无法与椭球距离协调，所以 KNN 必须用球面。于是我们把两种诉求拆开：快的一步只负责把范围缩小，准的一步只负责给结果定序。反过来说，如果你的业务对排序要求严格按椭球距离，又完全不能接受二阶段精排，那 geography 的 KNN 就不是合适工具——这一点在选型阶段就得想清楚，别等上线后才发现「最近」和「更近」对不上。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"30\" y=\"20\" width=\"310\" height=\"108\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"185.0\" y=\"70.4625\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"600\" >① 第一阶段</text><text x=\"185.0\" y=\"92.5875\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >GiST KNN 走 &lt;-&gt; 球面距离</text><line x1=\"340\" y1=\"74\" x2=\"365.6\" y2=\"74\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><g ><polygon points=\"372,74 364,69.6 364,78.4\" fill=\"#245A6B\" /></g><rect x=\"372\" y=\"20\" width=\"310\" height=\"108\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.1\" /><text x=\"527.0\" y=\"70.4625\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#AE8A3E\" font-weight=\"600\" >② 候选集</text><text x=\"527.0\" y=\"92.5875\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >ORDER BY &lt;-&gt; LIMIT 100</text><line x1=\"682\" y1=\"74\" x2=\"707.6\" y2=\"74\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><g ><polygon points=\"714,74 706,69.6 706,78.4\" fill=\"#245A6B\" /></g><rect x=\"714\" y=\"20\" width=\"310\" height=\"108\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"869.0\" y=\"70.4625\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"600\" >③ 第二阶段</text><text x=\"869.0\" y=\"92.5875\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >ST_Distance 默认椭球精排</text><line x1=\"1024\" y1=\"74\" x2=\"1049.6\" y2=\"74\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><g ><polygon points=\"1056,74 1048,69.6 1048,78.4\" fill=\"#245A6B\" /></g><rect x=\"1056\" y=\"20\" width=\"310\" height=\"108\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"1211.0\" y=\"70.4625\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#2F7A66\" font-weight=\"600\" >④ 结果</text><text x=\"1211.0\" y=\"92.5875\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >ORDER BY dist_m LIMIT 10</text><rect x=\"30\" y=\"156\" width=\"820\" height=\"216\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"48\" y=\"185\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" >两阶段查询（SQL 片段，:pt 为查询点）</text><line x1=\"48\" y1=\"195\" x2=\"832\" y2=\"195\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"50\" y=\"221.96296296296296\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" >WITH candidates AS (</text><text x=\"50\" y=\"242.96296296296296\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" >  SELECT id, name, location FROM stores</text><text x=\"50\" y=\"263.962962962963\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" >  ORDER BY location &lt;-&gt; :pt LIMIT 100</text><text x=\"50\" y=\"284.962962962963\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" >)</text><text x=\"50\" y=\"305.962962962963\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" >SELECT id, name,</text><text x=\"50\" y=\"326.962962962963\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" >       ST_Distance(location, :pt) AS dist_m</text><text x=\"50\" y=\"347.962962962963\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" >FROM candidates ORDER BY dist_m LIMIT 10;</text><rect x=\"880\" y=\"156\" width=\"490\" height=\"216\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"900\" y=\"186\" class=\"sv serif\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#245A6B\" font-weight=\"700\" >为什么要拆两段</text><text x=\"900\" y=\"222\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >· 索引需要与「可比较的距离」协调，椭球距离做不到</text><text x=\"900\" y=\"256\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >· 所以 &lt;-&gt; 固定按球面算，先把候选集缩小</text><text x=\"900\" y=\"290\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >· 候选集内再用默认椭球 ST_Distance 精排</text><text x=\"900\" y=\"324\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >· 快的一步负责缩小范围，准的一步负责定序</text><rect x=\"30\" y=\"382\" width=\"1340\" height=\"42\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"48\" y=\"408\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#BE653B\" font-weight=\"400\" >&lt;-&gt; 与 ST_Distance 不是同一个距离定义；要求严格椭球排序时，必须接受二阶段精排。</text></svg>","ctrl":null},{"eyebrow":"11 · 索引模型","title":"索引只敢说「不可能」","lede":"GiST / BRIN 里存的是 gidx 边界摘要：先排除不可能命中的对象，真实关系必须复核。","caption":"图：从 SQL 谓词到 recheck 的五步链路；左下对照索引摘要与完整对象，右下是默认 GiST opclass 定义节选。","bridge":"理解了「只存摘要」，就能解释一个非常常见的性能现象：为什么换一种写法，查询计划天差地别。","notes":"索引这一层是很多人误会最深的地方。geography.sql.in 里默认 GiST opclass 的 STORAGE 是 gidx，BRIN inclusion opclass 的 STORAGE 也是 gidx。也就是说，索引里并不保存完整的 geography 对象，更不保存「椭球距离」这种没法跟树结构协调的结果，它保存的是经纬度的边界摘要。ST_DWithin、ST_Intersects、ST_Covers 这些函数在 SQL 定义里带 postgis_index_supportfn，文档也说明 ST_DWithin 包含 bounding box 比较、可以利用索引。核心思想是：索引负责快速排除不可能命中的对象，不能替代真实的球面或椭球计算。源码 gserialized_gist_nd.c 更直接：geography GiST distance 支持函数在叶子节点设置 recheck = true，返回的是 box-to-box 的最小可能距离，还要乘 WGS84_RADIUS 转成可比较的世界单位。所以请把它记成一句话——摘要只能证明「不可能相交」，不能证明「一定相交」；命中之后，还得回表或者复核。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"30\" y=\"18\" width=\"248\" height=\"104\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"154.0\" y=\"66.7\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.5\" fill=\"#1B2B33\" font-weight=\"600\" >SQL 谓词</text><text x=\"154.0\" y=\"87.375\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >ST_DWithin / &amp;&amp; / &lt;-&gt;</text><line x1=\"278\" y1=\"70\" x2=\"297.4\" y2=\"70\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><g ><polygon points=\"303,70 296,66.15 296,73.85\" fill=\"#245A6B\" /></g><rect x=\"303\" y=\"18\" width=\"248\" height=\"104\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"427.0\" y=\"66.7\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.5\" fill=\"#245A6B\" font-weight=\"600\" >GiST / BRIN</text><text x=\"427.0\" y=\"87.375\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >gidx 边界摘要</text><line x1=\"551\" y1=\"70\" x2=\"570.4\" y2=\"70\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><g ><polygon points=\"576,70 569,66.15 569,73.85\" fill=\"#245A6B\" /></g><rect x=\"576\" y=\"18\" width=\"248\" height=\"104\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.1\" /><text x=\"700.0\" y=\"66.7\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.5\" fill=\"#AE8A3E\" font-weight=\"600\" >候选行</text><text x=\"700.0\" y=\"87.375\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >不可能命中的已排除</text><line x1=\"824\" y1=\"70\" x2=\"843.4\" y2=\"70\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><g ><polygon points=\"849,70 842,66.15 842,73.85\" fill=\"#245A6B\" /></g><rect x=\"849\" y=\"18\" width=\"248\" height=\"104\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.1\" /><text x=\"973.0\" y=\"66.7\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.5\" fill=\"#BE653B\" font-weight=\"600\" >recheck 精确计算</text><text x=\"973.0\" y=\"87.375\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >球面 / 椭球真实关系</text><line x1=\"1097\" y1=\"70\" x2=\"1116.4\" y2=\"70\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><g ><polygon points=\"1122,70 1115,66.15 1115,73.85\" fill=\"#245A6B\" /></g><rect x=\"1122\" y=\"18\" width=\"248\" height=\"104\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"1246.0\" y=\"66.7\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.5\" fill=\"#2F7A66\" font-weight=\"600\" >结果</text><text x=\"1246.0\" y=\"87.375\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >可索引 ≠ 查询便宜</text><text x=\"30\" y=\"156\" class=\"sv serif\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#245A6B\" font-weight=\"700\" >索引里存的，不是「椭球距离」</text><rect x=\"30\" y=\"172\" width=\"660\" height=\"74\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"48\" y=\"214.25\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"600\" >索引层</text><text x=\"166\" y=\"213.55\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >gidx：经纬度的边界摘要（box）</text><rect x=\"30\" y=\"256\" width=\"660\" height=\"74\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"48\" y=\"298.25\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >数据行</text><text x=\"166\" y=\"297.55\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >完整 GSERIALIZED：全部顶点与测地语义</text><text x=\"30\" y=\"356\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"400\" >摘要只能证明「不可能相交」，不能证明「一定相交」。</text><rect x=\"720\" y=\"156\" width=\"650\" height=\"200\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"738\" y=\"185\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" >geography.sql.in（节选）</text><line x1=\"738\" y1=\"195\" x2=\"1352\" y2=\"195\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"740\" y=\"221.5\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >CREATE OPERATOR CLASS gist_geography_ops</text><text x=\"740\" y=\"241.75\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >  DEFAULT FOR TYPE geography USING GIST AS</text><text x=\"740\" y=\"262.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >  STORAGE gidx,</text><text x=\"740\" y=\"282.25\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >  OPERATOR 3 &amp;&amp;,</text><text x=\"740\" y=\"302.5\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >  OPERATOR 13 &lt;-&gt; FOR ORDER BY float_ops,</text><text x=\"740\" y=\"322.75\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >  FUNCTION 1 geography_gist_consistent(...);</text><rect x=\"30\" y=\"380\" width=\"1340\" height=\"44\" rx=\"2\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1.0\" /><text x=\"48\" y=\"407\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#AE8A3E\" font-weight=\"400\" >源码 gserialized_gist_nd.c：叶子节点 recheck = true；返回 box-to-box 最小可能距离，乘 WGS84_RADIUS 转成世界单位。</text></svg>","ctrl":null},{"eyebrow":"12 · 谓词写法","title":"同一句业务，两种代价","lede":"ST_DWithin(location, pt, 3000) 通常比 ST_Distance(...) < 3000 更容易写成可索引查询。","caption":"","bridge":"可就算谓词写对了，还有一类操作根本不在椭球上完成。","notes":"这条原理能解释两个特别常见的现象。第一个：ST_DWithin(location, 常量, 3000) 通常比 ST_Distance(location, 常量) < 3000 更容易写成可索引查询，因为前者在 SQL 定义里带索引支持，包含 bounding box 比较，优化器能够把 gidx 摘要用上；后者是你自己把函数结果拿来比大小，能不能走索引就得看具体改写，别指望一定走。上面这个演示可以切换两种谓词、拖半径、单步看每一行：索引写法先灰掉一批「gidx 排除」的行，只对剩下少数候选做复核；而精算写法是每一行都要算一次测地距离。注意这是示意布局，格子数量不是实测性能数字，我们要看的是代价结构。第二个现象：大范围、多顶点的多边形，即使建了索引也可能慢，因为它的边界摘要太大，能排除的行少，候选多，精确复核还得遍历大量顶点。所以「建了索引」和「查询便宜」是两件事，一定要看 EXPLAIN (ANALYZE, BUFFERS) 里的候选行数和回表代价。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" id=\"animQuery\"><rect x=\"30\" y=\"18\" width=\"1340\" height=\"190\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"50\" y=\"42\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >空间示意：查询范围与 12 个示意对象</text><rect x=\"900\" y=\"40\" width=\"440\" height=\"146\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"920\" y=\"66\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"700\" >图例 · 逐行检查的三种结局</text><rect x=\"920\" y=\"82\" width=\"18\" height=\"14\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"948\" y=\"94\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >gidx 排除：边界摘要证明不可能命中</text><rect x=\"920\" y=\"112\" width=\"18\" height=\"14\" rx=\"2\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.0\" /><text x=\"948\" y=\"124\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >候选 · 复核：再算真实测地距离</text><rect x=\"920\" y=\"142\" width=\"18\" height=\"14\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.0\" /><text x=\"948\" y=\"154\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >精算：ST_Distance(...) &lt; r 的逐行代价</text><circle id=\"qCircle\" cx=\"520\" cy=\"108\" r=\"32\" fil
