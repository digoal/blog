=\"#D9D5CB\" stroke-width=\"1.1\" id=\"bCell6\"/><text x=\"730\" y=\"314\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"600\" >行 07</text><text x=\"1008\" y=\"314\" class=\"sv s\" text-anchor=\"end\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"600\" id=\"bLab6\"></text><rect x=\"1056\" y=\"284\" width=\"310\" height=\"48\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" id=\"bCell7\"/><text x=\"1072\" y=\"314\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"600\" >行 08</text><text x=\"1350\" y=\"314\" class=\"sv s\" text-anchor=\"end\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"600\" id=\"bLab7\"></text><rect x=\"30\" y=\"342\" width=\"310\" height=\"48\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" id=\"bCell8\"/><text x=\"46\" y=\"372\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"600\" >行 09</text><text x=\"324\" y=\"372\" class=\"sv s\" text-anchor=\"end\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"600\" id=\"bLab8\"></text><rect x=\"372\" y=\"342\" width=\"310\" height=\"48\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" id=\"bCell9\"/><text x=\"388\" y=\"372\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"600\" >行 10</text><text x=\"666\" y=\"372\" class=\"sv s\" text-anchor=\"end\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"600\" id=\"bLab9\"></text><rect x=\"714\" y=\"342\" width=\"310\" height=\"48\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" id=\"bCell10\"/><text x=\"730\" y=\"372\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"600\" >行 11</text><text x=\"1008\" y=\"372\" class=\"sv s\" text-anchor=\"end\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"600\" id=\"bLab10\"></text><rect x=\"1056\" y=\"342\" width=\"310\" height=\"48\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" id=\"bCell11\"/><text x=\"1072\" y=\"372\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"600\" >行 12</text><text x=\"1350\" y=\"372\" class=\"sv s\" text-anchor=\"end\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"600\" id=\"bLab11\"></text><text x=\"30\" y=\"414\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >示意布局，非实测性能数据；格子数量只用来说明「排除 / 复核 / 精算」三种代价的差异。</text></svg>","ctrl":"<label>谓词写法</label><select id=\"qPred\"><option value=\"dwithin\">ST_DWithin(loc, pt, r) · 可索引</option><option value=\"distance\">ST_Distance(...) &lt; r · 逐行精算</option></select><label>半径</label><input type=\"range\" id=\"qRadius\" min=\"1000\" max=\"20000\" step=\"1000\" value=\"3000\"><label id=\"qRadiusLbl\" style=\"font-family:var(--mono);min-width:64px\">3000 m</label><button class=\"btn play\" id=\"qPlay\">▶ 播放</button><button class=\"btn\" id=\"qTick\">单步 ›</button><button class=\"btn\" id=\"qReset\">重置</button><div class=\"out\" id=\"qOut\"><b>待播放</b> 调整半径与谓词，逐行观察代价</div>"},{"eyebrow":"13 · 函数边界","title":"有些函数，会偷偷回到平面","lede":"ST_Buffer(geography) 与 ST_Intersection(geography) 会临时投影、转 geometry 处理，再转回来。","caption":"图：geography → 临时投影 → geometry → 平面算法 → 转回 的五步折中路径与它的边界。","bridge":"到这里，geography 的能力边界基本清楚了，可以把它放回三种选型里横向比一比。","notes":"还有一件事得说明白，不然很容易产生错觉：不是所有 geography 操作都在球面或椭球上直接实现。geography.sql.in 里 ST_Buffer(geography, ...) 和 ST_Intersection(geography, geography) 的 SQL 定义展示了一个很典型的策略——先用 _ST_BestSRID 为输入挑一个适合的临时投影，把 geography 转成 geometry，在投影平面上执行 buffer 或 intersection，再 ST_Transform 回原 SRID，最后转回 geography。这是一种工程折中：复杂拓扑和构造算法在平面 geometry 路径上成熟得多，与其在椭球上重写一遍，不如借道。但投影选择本身是有边界的：跨日期变更线、靠近极区、超大面、超长边，这些情况下「一个适合的临时投影」未必安全。所以架构上要设计清楚投影 geometry 的处理链路，别假设 geography 的每个函数都老老实实在椭球上算完。这也是原文反复强调的那一句：函数更少、执行更慢，复杂处理常常要转回 geometry。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"30\" y=\"24\" width=\"248\" height=\"120\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"154.0\" y=\"80.5375\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"600\" >① geography 输入</text><text x=\"154.0\" y=\"101.21249999999999\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >球面 / 椭球对象</text><line x1=\"278\" y1=\"84\" x2=\"297.4\" y2=\"84\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><g ><polygon points=\"303,84 296,80.15 296,87.85\" fill=\"#245A6B\" /></g><rect x=\"303\" y=\"24\" width=\"248\" height=\"120\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.1\" /><text x=\"427.0\" y=\"80.5375\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#AE8A3E\" font-weight=\"600\" >② _ST_BestSRID</text><text x=\"427.0\" y=\"101.21249999999999\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >选一个适合的临时投影</text><line x1=\"551\" y1=\"84\" x2=\"570.4\" y2=\"84\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><g ><polygon points=\"576,84 569,80.15 569,87.85\" fill=\"#245A6B\" /></g><rect x=\"576\" y=\"24\" width=\"248\" height=\"120\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"700.0\" y=\"80.5375\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >③ 转 geometry</text><text x=\"700.0\" y=\"101.21249999999999\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >在投影平面上做算法</text><line x1=\"824\" y1=\"84\" x2=\"843.4\" y2=\"84\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><g ><polygon points=\"849,84 842,80.15 842,87.85\" fill=\"#245A6B\" /></g><rect x=\"849\" y=\"24\" width=\"248\" height=\"120\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"973.0\" y=\"80.5375\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"600\" >④ 平面处理</text><text x=\"973.0\" y=\"101.21249999999999\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >ST_Buffer / ST_Intersection</text><line x1=\"1097\" y1=\"84\" x2=\"1116.4\" y2=\"84\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><g ><polygon points=\"1122,84 1115,80.15 1115,87.85\" fill=\"#245A6B\" /></g><rect x=\"1122\" y=\"24\" width=\"248\" height=\"120\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"1246.0\" y=\"80.5375\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#2F7A66\" font-weight=\"600\" >⑤ 转回 geography</text><text x=\"1246.0\" y=\"101.21249999999999\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >ST_Transform 回原 SRID</text><line x1=\"30\" y1=\"168\" x2=\"1370\" y2=\"168\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"30\" y=\"198\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#245A6B\" font-weight=\"700\" >为什么绕这一圈？</text><rect x=\"30\" y=\"214\" width=\"660\" height=\"76\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1.0\" /><text x=\"48\" y=\"257.25\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#2F7A66\" font-weight=\"600\" >工程折中</text><text x=\"166\" y=\"256.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >复杂拓扑与构造算法在平面 geometry 路径上更成熟</text><rect x=\"720\" y=\"214\" width=\"650\" height=\"76\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"738\" y=\"257.25\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"600\" >代价</text><text x=\"836\" y=\"256.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >函数覆盖少于 geometry，CPU 更高，投影本身有边界</text><rect x=\"30\" y=\"306\" width=\"1340\" height=\"76\" rx=\"2\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1.0\" /><text x=\"50\" y=\"334\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#AE8A3E\" font-weight=\"700\" >投影选择的边界要特别小心</text><text x=\"50\" y=\"362\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >跨日期变更线 · 靠近极区 · 超大面 · 超长边：临时投影未必能安全覆盖这些情况。</text><text x=\"30\" y=\"414\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >结论：不要假设所有 geography 函数都直接在椭球上完成；复杂处理链路要设计清楚。</text></svg>","ctrl":null},{"eyebrow":"14 · 横向对比","title":"把三种选型放在同一张表上","lede":"单位、模型、函数覆盖、成本、索引、KNN 语义，九个维度一次看清。","caption":"图：geography、geometry 4326、投影 geometry 的九维对照表，依据原文横向对比一节；不要用一句「经纬度就 geography」结束建模。","bridge":"表看得清，决策还得有一条能走的判断路径。","notes":"现在把三条路摆在同一张表上，很多纠结就消失了。单位这一行最刺眼：geography 是米，4326 的 geometry 是度，投影 geometry 取决于投影、常见为米。默认测量模型：geography 是椭球可切球面，另外两条都是平面。函数覆盖和计算成本：geography 覆盖更少、成本更高，另外两条最完整、较低。索引那行要连着上一页读：geography 的 GiST/BRIN 存 gidx 摘要且必须复核，另外两条可以用 GiST、SP-GiST、BRIN 等。KNN 那行是坑：geography 的 <-> 基于球面，4326 geometry 的 <-> 是度，投影 geometry 的单位由投影决定。最后两行是适合与不适合——跨区域米制测量找 geography，展示与交换用 4326 geometry，城市内高频分析用投影 geometry；复杂拓扑编辑别找 geography，把度当米是最典型的误用，跨全球且投影难统一时投影 geometry 也不合适。所以真的别用一句「经纬度就 geography」结束建模，这是一个 workload 问题。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"30\" y=\"18\" width=\"1340\" height=\"386\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"30\" y=\"18\" width=\"1340\" height=\"44\" rx=\"2\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.0\" /><text x=\"44\" y=\"44.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"600\" >维度</text><text x=\"244\" y=\"44.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"600\" >PostGIS geography</text><text x=\"624\" y=\"44.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"600\" >geometry 4326</text><text x=\ ","title":"好处是真的，代价也是真的","lede":"geography 的收益集中在语义正确性，代价集中在计算成本与函数覆盖。","caption":"图：左侧四条收益、右侧五条代价；原文明确未构造 benchmark 数字，此处也不给任何性能数字。","bridge":"道理都讲完了，落到手上就是几段 SQL 和几个观察点。","notes":"到了该算总账的时候。收益这边：经纬度距离、长度、面积默认按地球模型算，单位对业务直观；ST_DWithin 的参数是米，直接减少「度和米混用」这类静默错误；GiST 和 BRIN 能给范围、近邻查询提供候选集过滤；typmod 把类型、维度、SRID 的契约前移到数据库。代价这边也得认：CPU 更贵，尤其是大对象、多顶点、候选行很多的时候；函数覆盖少于 geometry，复杂处理常常要投影过去做；KNN 的 <-> 是球面距离，不是默认 ST_Distance 的椭球距离；大多边形边界摘要过大，索引排除效果下降、精确复核更重；还有一条容易忽略——geography 允许非 4326 但仍是经纬度的 SRID 进来，可跨 SRID 混算依旧会被 SRID mismatch 拦住，得先统一。这里我特意不摆任何性能数字：原文没有构造 benchmark，生产差异取决于几何复杂度、候选行数、索引相关性、CPU、PostgreSQL 版本和 PostGIS 构建依赖，随便给个倍数反而是误导。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><text x=\"30\" y=\"40\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#2F7A66\" font-weight=\"700\" >收益 · 语义正确性与过滤能力</text><text x=\"720\" y=\"40\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#BE653B\" font-weight=\"700\" >代价 · CPU、函数面与边界</text><line x1=\"700\" y1=\"18\" x2=\"700\" y2=\"386\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><rect x=\"30\" y=\"56\" width=\"650\" height=\"66\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1.0\" /><text x=\"48\" y=\"94.25\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#2F7A66\" font-weight=\"600\" >单位是米</text><text x=\"186\" y=\"93.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >距离、长度、面积默认按地球模型计算</text><rect x=\"30\" y=\"134\" width=\"650\" height=\"66\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1.0\" /><text x=\"48\" y=\"172.25\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#2F7A66\" font-weight=\"600\" >谓词不混用</text><text x=\"186\" y=\"171.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >ST_DWithin 参数是米，减少「度当米」</text><rect x=\"30\" y=\"212\" width=\"650\" height=\"66\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1.0\" /><text x=\"48\" y=\"250.25\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#2F7A66\" font-weight=\"600\" >能过滤候选</text><text x=\"186\" y=\"249.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >GiST / BRIN 为范围与近邻提供粗过滤</text><rect x=\"30\" y=\"290\" width=\"650\" height=\"66\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1.0\" /><text x=\"48\" y=\"328.25\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#2F7A66\" font-weight=\"600\" >契约在库里</text><text x=\"186\" y=\"327.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >typmod 把类型、维度、SRID 前移</text><rect x=\"720\" y=\"56\" width=\"650\" height=\"56\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"738\" y=\"88.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"600\" >CPU 更贵</text><text x=\"876\" y=\"88.2\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >大对象、多顶点、候选行多时更明显</text><rect x=\"720\" y=\"122\" width=\"650\" height=\"56\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"738\" y=\"154.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"600\" >函数更少</text><text x=\"876\" y=\"154.2\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >复杂处理常需投影到 geometry</text><rect x=\"720\" y=\"188\" width=\"650\" height=\"56\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"738\" y=\"220.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"600\" >KNN 是球面</text><text x=\"876\" y=\"220.2\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >&lt;-&gt; 不等于默认 ST_Distance 的椭球</text><rect x=\"720\" y=\"254\" width=\"650\" height=\"56\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"738\" y=\"286.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"600\" >大面拖累索引</text><text x=\"876\" y=\"286.2\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >边界摘要过大，排除效果变差</text><rect x=\"720\" y=\"320\" width=\"650\" height=\"56\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"738\" y=\"352.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"600\" >SRID 要统一</text><text x=\"876\" y=\"352.2\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >geodetic SRID 可用，但跨 SRID 混算会被拦</text><text x=\"30\" y=\"414\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >本文没有构造任何 benchmark 数字：真实差异取决于几何复杂度、候选行数、索引相关性、CPU 与版本。</text></svg>","ctrl":null},{"eyebrow":"17 · 实操","title":"四段 SQL，把全篇串成一条实验线","lede":"建表写入、米制范围、椭球与球面取舍、KNN 两阶段——每一段都对应前面的一条原理。","caption":"图：四段 SQL 按文档与 SQL 定义编写，当前环境未安装实例故未执行；验证看 EXPLAIN 是否用索引、候选行数、recheck，以及 3000 的单位是米。","bridge":"会写 SQL 还不够，得上角色视角的清单，把容易漏的事固化下来。","notes":"落到手上其实就四段 SQL。第一段，建表就把 geography(Point,4326) 写清楚，插入时坐标用 SRID=4326;POINT(120.1551 30.2741)，注意顺序是经度在前，再建 GiST 索引、跑 ANALYZE——统计信息会影响优化器估算，别省。第二段，用 EXPLAIN (ANALYZE, BUFFERS) 看 ST_DWithin(location, 点, 3000)，重点不是死记某一种计划，而是看有没有用上索引、候选行过滤后是否还有 recheck 或 filter，以及牢记住这个 3000 是米不是度。第三段，把同两个点的默认 ST_Distance 和第三参数 false 的球面版本并排查出来，感受一下取舍；要不要全局切球面，得由业务误差预算决定，不要只因为「更快」就改。第四段，KNN 用 <-> 触发 GiST，但记住它是球面距离，严格椭球排序就用上一页那个两阶段写法。原文很诚实地说明这些 SQL 没在当前环境执行过，因为工作区只有 PostGIS 源码、没有装好的实例，语法是按文档和 SQL 定义写的——我们这里也不编任何执行结果。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"30\" y=\"18\" width=\"660\" height=\"190\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"48\" y=\"47\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" >① 建表 · 写入 · 索引</text><line x1=\"48\" y1=\"57\" x2=\"672\" y2=\"57\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"50\" y=\"82.5\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#1B2B33\" font-weight=\"400\" >CREATE EXTENSION IF NOT EXISTS postgis;</text><text x=\"50\" y=\"101.13\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#1B2B33\" font-weight=\"400\" >CREATE TABLE stores (</text><text x=\"50\" y=\"119.76\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#1B2B33\" font-weight=\"400\" >  id bigserial PRIMARY KEY, name text,</text><text x=\"50\" y=\"138.39000000000001\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#1B2B33\" font-weight=\"400\" >  location geography(Point,4326) NOT NULL);</text><text x=\"50\" y=\"157.02\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#1B2B33\" font-weight=\"400\" >CREATE INDEX gix ON stores USING gist(location);</text><text x=\"50\" y=\"175.65\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#1B2B33\" font-weight=\"400\" >ANALYZE stores;</text><rect x=\"710\" y=\"18\" width=\"660\" height=\"190\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"728\" y=\"47\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" >② 米制范围查询</text><line x1=\"728\" y1=\"57\" x2=\"1352\" y2=\"57\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"730\" y=\"82.5\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#1B2B33\" font-weight=\"400\" >EXPLAIN (ANALYZE, BUFFERS)</text><text x=\"730\" y=\"101.13\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#1B2B33\" font-weight=\"400\" >SELECT id, name FROM stores</text><text x=\"730\" y=\"119.76\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#1B2B33\" font-weight=\"400\" >WHERE ST_DWithin(location,</text><text x=\"730\" y=\"138.39000000000001\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#1B2B33\" font-weight=\"400\" >  &#x27;SRID=4326;POINT(120.1551 30.2741)&#x27;::geography,</text><text x=\"730\" y=\"157.02\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#1B2B33\" font-weight=\"400\" >  3000);</text><text x=\"730\" y=\"175.65\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#1B2B33\" font-weight=\"400\" >-- 看索引、recheck、候选行数</text><rect x=\"30\" y=\"218\" width=\"660\" height=\"190\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"48\" y=\"247\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" >③ 椭球 vs 球面</text><line x1=\"48\" y1=\"257\" x2=\"672\" y2=\"257\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"50\" y=\"282.5\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#1B2B33\" font-weight=\"400\" >SELECT ST_Distance(a,b)       AS dist_spheroid_m,</text><text x=\"50\" y=\"301.13\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#1B2B33\" font-weight=\"400\" >       ST_Distance(a,b,false) AS dist_sphere_m;</text><text x=\"50\" y=\"319.76\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#1B2B33\" font-weight=\"400\" >-- a / b 为两个 geography 点</text><text x=\"50\" y=\"338.39\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#1B2B33\" font-weight=\"400\" >-- 默认椭球；第三参数 false 走球面近似</text><text x=\"50\" y=\"357.02\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#1B2B33\" font-weight=\"400\" >-- 是否可接受由业务误差预算决定</text><rect x=\"710\" y=\"218\" width=\"660\" height=\"190\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"728\" y=\"247\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" >④ KNN 与两阶段精排</text><line x1=\"728\" y1=\"257\" x2=\"1352\" y2=\"257\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"730\" y=\"282.5\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#1B2B33\" font-weight=\"400\" >EXPLAIN (ANALYZE, BUFFERS)</text><text x=\"730\" y=\"301.13\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#1B2B33\" font-weight=\"400\" >SELECT id, name, location &lt;-&gt; :pt AS approx_dist_m</text><text x=\"730\" y=\"319.76\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#1B2B33\" font-weight=\"400\" >FROM stores ORDER BY location &lt;-&gt; :pt LIMIT 10;</text><text x=\"730\" y=\"338.39\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#1B2B33\" font-weight=\"400\" >-- &lt;-&gt; 触发 GiST KNN，距离基于球面</text><text x=\"730\" y=\"357.02\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#1B2B33\" font-weight=\"400\" >-- 严格椭球：先取候选再 ST_Distance 精排</text></svg>","ctrl":null},{"eyebrow":"18 · 最佳实践","title":"三种角色，一张清单","lede":"架构师管选型与对象粒度，DBA 管索引与计划，开发者管单位、顺序与谓词。","caption":"图：按角色归组的十二条实践要点，来自原文「最佳实践」一节。","bridge":"清单能防住大部分坑，但有些坑太常见，值得单独再看一眼。","notes":"把前面的原理翻译成三种角色的日常动作。架构师这边：先按 workload 选类型，别按字段名；列定义一定写 typmod，不要裸 geography；大对象不要「一坨面走天下」，如果大多边形常被小范围查询命中，评估 ST_Subdivide 或者业务分片，让索引摘要更有排除能力；需要复杂叠加、缓冲、拓扑编辑时，把投影 geometry 的处理链路设计清楚。DBA 这边：常见范围查询建 GiST；对按物理插入顺序有空间相关性的超大表，评估 BRIN inclusion，它空间小但过滤精度依赖 page range 内的聚集程度；ANALYZE 不要省；看 EXPLAIN 里的候选行数和回表代价，索引命中不等于查询便宜；KNN 要明确 <-> 是球面，需要椭球精确排序就做精排。业务开发者这边最容易踩坑的四条：WKT 点的顺序是 POINT(lon lat)；ST_DWithin 的 3000 是米，别自己换成度；别把 4326 geometry 的 ST_Distance 结果叫米；写入前保证 SRID 正确，ST_SetSRID 只是贴标签、ST_Transform 才是真转换，附近的人这类接口先用 ST_DWithin 过滤，再按 ST_Distance 或 <-> 排序。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"30\" y=\"18\" width=\"425\" height=\"56\" rx=\"2\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1.0\" /><text x=\"242\" y=\"53\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"19.0\" ight=\"72\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"501\" y=\"116\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"700\" >01  范围查询建 GiST</text><text x=\"501\" y=\"141\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >CREATE INDEX ... USING gist (geog_col)</text><rect x=\"485\" y=\"168\" width=\"425\" height=\"72\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"501\" y=\"198\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"700\" >02  超大表评估 BRIN</text><text x=\"501\" y=\"223\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >依赖 page range 内空间聚集程度</text><rect x=\"485\" y=\"250\" width=\"425\" height=\"72\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"501\" y=\"280\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"700\" >03  ANALYZE 不要省</text><text x=\"501\" y=\"305\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >绑定 gserialized_analyze_nd</text><rect x=\"485\" y=\"332\" width=\"425\" height=\"72\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"501\" y=\"362\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"700\" >04  看计划，不迷信命中</text><text x=\"501\" y=\"387\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >候选行数、回表代价、KNN 球面语义</text><rect x=\"940\" y=\"18\" width=\"425\" height=\"56\" rx=\"2\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1.0\" /><text x=\"1152\" y=\"53\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"19.0\" fill=\"#FFFFFF\" font-weight=\"700\" >业务开发者</text><rect x=\"940\" y=\"86\" width=\"425\" height=\"72\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"956\" y=\"116\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"700\" >01  WKT 是 POINT(lon lat)</text><text x=\"956\" y=\"141\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >顺序写反会触发错误或归一化</text><rect x=\"940\" y=\"168\" width=\"425\" height=\"72\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"956\" y=\"198\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"700\" >02  3000 是米</text><text x=\"956\" y=\"223\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >不要自己把米换算成度</text><rect x=\"940\" y=\"250\" width=\"425\" height=\"72\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"956\" y=\"280\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"700\" >03  别把度叫米</text><text x=\"956\" y=\"305\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >4326 geometry 的 ST_Distance 不是米</text><rect x=\"940\" y=\"332\" width=\"425\" height=\"72\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"956\" y=\"362\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"700\" >04  SRID 与谓词顺序</text><text x=\"956\" y=\"387\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >ST_Transform 才转换；先 DWithin 再排序</text><text x=\"30\" y=\"420\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >三条视角其实指向同一件事：让类型、索引、谓词、写入路径在同一个语义下工作。</text></svg>","ctrl":null},{"eyebrow":"19 · 常见坑","title":"八个坑，大半不会报错","lede":"最危险的错不是抛异常，而是结果看起来合理、实际单位或距离定义已经错了。","caption":"图：八个常见坑按语义、索引、类型三类归组，来自原文「常见坑」一节。","bridge":"最后把适合与不适合放在同一屏上，给这次演说一个收束。","notes":"最后集中看坑。我把八个坑分成三类：语义坑、索引坑、类型坑。语义坑最阴，因为它不会报错——把 4326 geometry 的 ST_Distance 结果叫米、经纬度顺序写反、忽视 KNN 的球面语义，这三件事都会给你一个看起来挺合理的数字。POINT(30 120) 尤其典型，它表示东经 30、北纬 120，纬度越界，可能触发错误，也可能被归一化成一个完全不是你以为的位置。索引坑两个：只建索引不写可索引谓词，范围查询却写成 ST_Distance(...) < r 然后期待一定走索引；以及大多边形 bbox 过大，索引拉出大量候选，真实计算还要遍历顶点。类型坑三个：误解 ST_Buffer(geography)，以为它是纯椭球 buffer；以为 SRID 0 没影响，其实输入会默认补 4326，生产数据最好显式写 SRID 减少导入歧义；还有不同 SRID 混算，geodetic SRID 虽然能进 geography，但两个对象计算前仍要求 SRID 一致。你会发现，八个里大半是「不报错的错」，所以才需要前面那些类型契约和计划观察。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"30\" y=\"18\" width=\"310\" height=\"176\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"30\" y=\"18\" width=\"310\" height=\"8\" rx=\"0\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1.0\" /><text x=\"46\" y=\"66\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"700\" >01 经纬度顺序写反</text><rect x=\"46\" y=\"82\" width=\"72\" height=\"24\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"82\" y=\"99\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"600\" >语义坑</text><line x1=\"46\" y1=\"122\" x2=\"324\" y2=\"122\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"46\" y=\"150\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >POINT(lon lat)，顺序写反</text><text x=\"46\" y=\"174\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >POINT(30 120) 纬度越界</text><rect x=\"372\" y=\"18\" width=\"310\" height=\"176\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"372\" y=\"18\" width=\"310\" height=\"8\" rx=\"0\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1.0\" /><text x=\"388\" y=\"66\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"700\" >02 把度当米</text><rect x=\"388\" y=\"82\" width=\"72\" height=\"24\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"424\" const N = D.length;
let cur = 0, autoTimer = null, autoOn = false;
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

function fit(){
  const vp = $('#viewport');
  const W = vp.clientWidth, H = vp.clientHeight;
  const s = Math.min(W/1600, H/900);
  const st = $('#stage');
  st.style.transform = 'scale(' + s + ')';
  st.style.left = ((W - 1600*s)/2) + 'px';
  st.style.top  = ((H -  900*s)/2) + 'px';
}
window.addEventListener('resize', fit);

function render(){
  $('#slides').innerHTML = D.map((d,i) =>
    '<section class="slide" id="s'+i+'">'
    + '<div class="eyebrow"><span class="num">'+String(i+1).padStart(2,'0')+' / '+String(N).padStart(2,'0')+'</span>'+d.eyebrow+'</div>'
    + '<h1 class="title">'+d.title+'</h1>'
    + '<div class="lede">'+d.lede+'</div>'
    + '<div class="rule"></div>'
    + '<div class="figwrap">'+d.svg+'</div>'
    + (d.ctrl ? '<div class="ctrls">'+d.ctrl+'</div>' : '<div class="caption">'+d.caption+'</div>')
    + '<div class="bridge"><span class="bk">承接 · NEXT</span>'+d.bridge+'</div>'
    + '<div class="footer"><div class="fbar"><i id="fbar'+i+'"></i></div>'
    + '<span class="fl">数据库筑基课 · geography 数据类型</span>'
    + '<span class="fr">'+String(i+1).padStart(2,'0')+' / '+String(N).padStart(2,'0')+'</span></div>'
    + '</section>').join('');
}

function go(i, silent){
  i = Math.max(0, Math.min(N-1, i));
  $$('.slide').forEach((el,k)=>el.classList.toggle('on', k===i));
  cur = i;
  try{ localStorage.setItem('geog-slide', String(i)); }catch(e){}
  $('.pg').textContent = String(i+1).padStart(2,'0') + ' / ' + String(N).padStart(2,'0');
  $('#track i').style.width = ((i+1)/N*100)+'%';
  for(let k=0;k<N;k++){ const b=$('#fbar'+k); if(b) b.style.width = (k<=i?100:0)+'%'; }
  if(!silent) toast(D[i].eyebrow + ' · ' + D[i].title);
}
function next(){ if(cur<N-1) go(cur+1); else stopAuto(); }
function prev(){ if(cur>0) go(cur-1); }
function toast(s){
  const t=$('#toast'); t.textContent=s; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1700);
}
function stopAuto(){
  autoOn=false; clearInterval(autoTimer); autoTimer=null;
  $('#btnAuto').textContent='▶ 自动播放 P'; $('#btnAuto').classList.remove('act');
}
function toggleAuto(){
  if(autoOn){ stopAuto(); toast('已暂停自动播放'); return; }
  autoOn=true; $('#btnAuto').textContent='❚❚ 暂停 P'; $('#btnAuto').classList.add('act');
  autoTimer=setInterval(()=>{ if(cur<N-1) go(cur+1,true); else stopAuto(); }, 12000);
  toast('自动播放：每 12 秒一页');
}

function fs(){
  const el=document.documentElement;
  const entering=!document.body.classList.contains('immersive');
  if(entering){
    document.body.classList.add('immersive');
    $('#btnFs').textContent='退出全屏 F'; $('#btnFs').classList.add('act');
    fit();
    toast('全屏：画面铺满窗口，底部按键保留（F 或 Esc 退出）');
    try{
      const pr = el.requestFullscreen ? el.requestFullscreen() : null;
      if(pr && pr.catch) pr.catch(()=>{});   /* 受限时静默降级为窗口内铺满 */
    }catch(e){}
  }else{
    document.body.classList.remove('immersive');
    $('#btnFs').textContent='全屏 F'; $('#btnFs').classList.remove('act');
    fit(); toast('已退出全屏');
    try{ if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen(); }catch(e){}
  }
}
document.addEventListener('fullscreenchange', ()=>{
  if(!document.fullscreenElement && document.body.classList.contains('immersive')){
    document.body.classList.remove('immersive');
    $('#btnFs').textContent='全屏 F'; $('#btnFs').classList.remove('act');
  }
  fit();
});

document.addEventListener('keydown', e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  const k=e.key;
  const typing=(tag==='input'||tag==='select'||tag==='textarea');
  const navKey=(k.indexOf('Arrow')===0||k===' '||k==='Home'||k==='End'||k==='PageUp'||k==='PageDown');
  if(k==='Escape'){
    if($('#dock').classList.contains('on')) closeDock();
    else if(document.body.classList.contains('immersive')) fs();
    return;
  }
  if($('#dock').classList.contains('on')) return;
  if(typing && navKey) return;
  if(k==='ArrowRight'||k===' '||k==='PageDown'){ e.preventDefault(); next(); }
  else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); prev(); }
  else if(k==='f'||k==='F'){ e.preventDefault(); fs(); }
  else if(k==='g'||k==='G'){ e.preventDefault(); toc(); }
  else if(k==='n'||k==='N'){ e.preventDefault(); notesHere(); }
  else if(k==='t'||k==='T'){ e.preventDefault(); notesAll(); }
  else if(k==='p'||k==='P'){ e.preventDefault(); toggleAuto(); }
  else if(k==='?'||k==='h'||k==='H'){ e.preventDefault(); help(); }
  else if(k==='Home'){ e.preventDefault(); go(0); }
  else if(k==='End'){ e.preventDefault(); go(N-1); }
  else if(/^[1-9]$/.test(k)){ go(parseInt(k,10)-1); }
});

    }
    if(n>aStep){ fill='#FFFFFF'; stroke='#D9D5CB'; }
    b.setAttribute('fill',fill); b.setAttribute('stroke',stroke); b.setAttribute('stroke-width',sw);
  });
  $$('#animIn .flowar').forEach(a=>{
    const n=+a.getAttribute('data-step');
    const c2 = n<=aStep ? '#245A6B' : '#D9D5CB';
    a.setAttribute('stroke',c2);
    if(a.tagName.toLowerCase()==='polygon') a.setAttribute('fill',c2);
  });
  const out=$('#inOut'); if(!out) return;
  if(aStep===0){ out.innerHTML='<b>待播放</b> 选择输入样例，观察它在哪一步被放行或拦下'; }
  else if(aStep>=c.stop){ out.innerHTML='<b>结论</b> '+c.msg; out.title=c.msg; }
  else { out.innerHTML='<b>第 '+aStep+' 步</b> '+IN_STEP_NAME[aStep-1]; }
}
function aPlay(){
  if(aPlaying){ aPause(); return; }
  const c=IN_CASES[aCase()];
  if(aStep>=c.stop) aStep=0;
  aPlaying=true; $('#inPlay').textContent='❚❚ 暂停'; $('#inPlay').classList.add('play');
  aTimer=setInterval(()=>{ aStep++; aPaint(); if(aStep>=IN_CASES[aCase()].stop) aPause(); },780);
}
function aPause(){
  aPlaying=false; clearInterval(aTimer); aTimer=null;
  const b=$('#inPlay'); if(b){ b.textContent='▶ 播放'; b.classList.remove('play'); }
}
function aTick(){ const c=IN_CASES[aCase()]; if(aStep<c.stop){ aStep++; aPaint(); } }
function aReset(){ aPause(); aStep=0; aPaint(); }
function aChanged(){ aPause(); aStep=0; aPaint(); }

/* ---------- 动画 B：可索引谓词与 gidx 粗过滤 ---------- */
const BPTS = [
  {x:380,y:62},{x:460,y:62},{x:580,y:62},{x:660,y:62},
  {x:380,y:108},{x:460,y:108},{x:580,y:108},{x:660,y:108},
  {x:380,y:154},{x:460,y:154},{x:580,y:154},{x:660,y:154}
];
let bStep=0, bTimer=null, bPlaying=false;
function bRadius(){ const el=$('#qRadius'); return el ? +el.value : 3000; }
function bRadiusPx(){ return 26 + (bRadius()-1000)/19000*60; }
function bMode(){ const el=$('#qPred'); return el ? el.value : 'dwithin'; }
function bClass(i){
  /* 示意几何：点中心到查询圆心的距离，超过 r + 边界余量则由 gidx 排除 */
  const p=BPTS[i], r=bRadiusPx();
  const d=Math.hypot(p.x-520, p.y-108);
  return d <= r + 34;
}
function bPaint(){
  const r=bRadiusPx(), mode=bMode(), cx=520, cy=108;
  const qc=$('#qCircle');
  if(qc){ qc.setAttribute('r', r.toFixed(1)); }
  const rl=$('#qRadiusLbl'); if(rl) rl.textContent=bRadius()+' m';
  let excluded=0, checked=0, cand=0;
  BPTS.forEach((p,i)=>{
    const dot=$('#bDot'+i), cell=$('#bCell'+i), lab=$('#bLab'+i);
    const inside=bClass(i);
    const seen=i<bStep;
    if(dot){ dot.setAttribute('opacity', seen?1:0.28); }
    if(!cell) return;
    let fill='#FFFFFF', stroke='#D9D5CB', txt='', col='#89938F';
    if(!seen){ fill='#FFFFFF'; stroke='#D9D5CB'; txt=''; }
    else if(mode==='distance'){
      fill='#F7E9DE'; stroke='#BE653B'; txt='精算'; col='#BE653B'; checked++;
    } else if(!inside){
      fill='#F1EFE9'; stroke='#D9D5CB'; txt='gidx 排除'; col='#89938F'; excluded++;
    } else {
      fill='#E4F0EA'; stroke='#2F7A66'; txt='候选 · 复核'; col='#2F7A66'; cand++; checked++;
    }
    cell.setAttribute('fill',fill); cell.setAttribute('stroke',stroke);
    if(lab){ lab.textContent=txt; lab.setAttribute('fill',col); }
  });
  const out=$('#qOut'); if(!out) return;
  if(bStep===0){ out.innerHTML='<b>待播放</b> 调整半径与谓词，逐行观察代价'; }
  else if(mode==='distance'){
    const s='<b>ST_Distance(...) &lt; r</b> 已检查 '+bStep+'/12 格：逐行算测地距离（示意布局）';
    out.innerHTML=s; out.title='示意布局，非实测性能数据';
  } else {
    const s='<b>ST_DWithin(r)</b> 已检查 '+bStep+'/12 格：排除 '+excluded+' · 复核 '+cand+'（示意布局）';
    out.innerHTML=s; out.title='示意布局，非实测性能数据';
  }
}
function bPlay(){
  if(bPlaying){ bPause(); return; }
  if(bStep>=12) bStep=0;
  bPlaying=true; $('#qPlay').textContent='❚❚ 暂停'; $('#qPlay').classList.add('play');
  bTimer=setInterval(()=>{ bStep++; bPaint(); if(bStep>=12) bPause(); },520);
}
function bPause(){
  bPlaying=false; clearInterval(bTimer); bTimer=null;
  const b=$('#qPlay'); if(b){ b.textContent='▶ 播放'; b.classList.remove('play'); }
}
function bTick(){ if(bStep<12){ bStep++; bPaint(); } }
function bReset(){ bPause(); bStep=0; bPaint(); }
function bChanged(){ bPause(); bPaint(); }

function init(){
  render(); fit();
  let saved=0; try{ saved=parseInt(localStorage.getItem('geog-slide')||'0',10)||0; }catch(e){}
  go(saved,true);
  $('#btnPrev').onclick=prev; $('#btnNext').onclick=next;
  $('#btnToc').onclick=toc; $('#btnNotes').onclick=notesHere;
  $('#btnAll').onclick=notesAll; $('#btnAuto').onclick=toggleAuto;
  $('#btnFs').onclick=fs; $('#btnHelp').onclick=help;
  $('#dockClose').onclick=closeDock;
  const bind=(id,fn)=>{ const el=$(id); if(el) el.onclick=fn; };
  bind('#inPlay',aPlay); bind('#inTick',aTick); bind('#inReset',aReset);
  bind('#qPlay',bPlay); bind('#qTick',bTick); bind('#qReset',bReset);
  ['inCase','qPred','qRadius'].forEach(id=>{
    const el=$('#'+id); if(!el) return;
    el.addEventListener('change', id==='inCase'?aChanged:bChanged);
    el.addEventListener('input', ()=>{ if(id==='inCase') aChanged(); else bChanged(); });
  });
  aPaint(); bPaint();
}
document.addEventListener('DOMContentLoaded', init);
</script>
