<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数据库筑基课 · RUM 索引结构｜把排名放回索引里</title>
<!-- 单文件交付：所有原理图均为现场绘制的内联 SVG，无外部图片、字体、脚本依赖。 -->
<!-- 设计母题：地层剖面 / 工程蓝图。内容按「困境→命题→代价→结构→读写→维护→选型→实操→坑」的因果链推演。 -->
<style>
:root{
  --bg:#F7F6F2; --ink:#1B2B33; --ink2:#46585F; --muted:#89938F; --line:#D9D5CB;
  --primary:#245A6B; --prim-l:#E5EFF0; --accent:#BE653B; --acc-l:#F7E9DE;
  --green:#2F7A66; --green-l:#E4F0EA; --gold:#AE8A3E;
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#E9E7E1}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
#viewport{position:absolute;inset:0 0 58px 0;overflow:hidden}
#stage{position:absolute;width:1600px;height:900px;background:var(--bg);
  transform-origin:top left;box-shadow:0 18px 60px rgba(27,43,51,.13);overflow:hidden}
.slide{position:absolute;inset:0;display:none}
.slide.on{display:block;animation:fadein .42s cubic-bezier(.2,.7,.2,1)}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{position:absolute;left:64px;top:44px;font-size:13px;letter-spacing:3.4px;
  color:var(--primary);font-weight:600}
.eyebrow .num{font-family:var(--mono);letter-spacing:1px;color:var(--accent);margin-right:14px}
h1.title{position:absolute;left:64px;top:70px;margin:0;font-family:var(--serif);
  font-size:44px;line-height:1.25;font-weight:700;letter-spacing:1.2px;color:var(--ink)}
.lede{position:absolute;left:64px;top:139px;width:1472px;font-size:19px;color:var(--ink2);
  line-height:1.5;letter-spacing:.3px}
.rule{position:absolute;left:64px;top:181px;width:1472px;height:1px;background:var(--line)}
.figwrap{position:absolute;left:100px;top:198px;width:1400px;height:430px}
svg.figure{display:block;overflow:visible}
svg.figure text{font-family:var(--sans)}
svg.figure text.serif{font-family:var(--serif)}
svg.figure text.mono{font-family:var(--mono)}
.caption{position:absolute;left:100px;top:638px;width:1400px;font-size:13px;
  color:var(--muted);letter-spacing:.4px;line-height:1.5}
.bridge{position:absolute;left:64px;top:706px;width:1472px;font-size:20px;
  color:var(--accent);line-height:1.55;letter-spacing:.4px;padding-left:18px;
  border-left:3px solid var(--accent);font-family:var(--serif)}
.bridge .bk{font-family:var(--sans);font-size:13px;color:var(--muted);
  letter-spacing:2px;display:block;margin-bottom:2px}
.footer{position:absolute;left:64px;top:846px;width:1472px;height:1px;background:var(--line)}
.footer .fl{position:absolute;left:0;top:14px;font-size:12.5px;color:var(--muted);letter-spacing:2px}
.footer .fr{position:absolute;right:0;top:12px;font-family:var(--mono);font-size:14px;color:var(--ink2)}
.footer .fbar{position:absolute;left:0;right:0;top:-1px;height:2px;background:transparent}
.footer .fbar i{display:block;height:2px;background:var(--primary);width:0;transition:width .4s ease}

/* 动画页控件：位于图下方独立条带，绝不覆盖图 */
.ctrls{position:absolute;left:100px;top:638px;width:1400px;height:46px;display:flex;
  align-items:center;gap:9px}
.ctrls label{font-size:13px;color:var(--ink2);white-space:nowrap}
.ctrls select,.ctrls input[type=range]{font-family:var(--sans);font-size:13px;color:var(--ink);
  background:#fff;border:1px solid var(--line);border-radius:4px;padding:5px 7px;outline:none}
.ctrls select{max-width:238px}
.ctrls input[type=range]{width:112px;padding:0;accent-color:var(--primary);border:none;background:transparent}
.ctrls .btn{min-height:30px;padding:5px 11px;border:1px solid var(--primary);border-radius:4px;
  background:#fff;color:var(--primary);font-size:13px;cursor:pointer;font-family:var(--sans);white-space:nowrap}
.ctrls .btn.play{background:var(--primary);color:#fff}
.ctrls .btn:hover{filter:brightness(.94)}
.ctrls .out{font-size:13px;color:var(--ink2);margin-left:auto;min-width:0;flex:1;
  max-width:470px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrls .out b{color:var(--accent);font-weight:600}

/* 底部外壳：全屏后依旧显示按键 */
.chrome{position:fixed;left:0;right:0;bottom:0;height:58px;background:#FCFBF8;
  border-top:1px solid var(--line);display:flex;align-items:center;gap:6px;
  padding:0 16px;z-index:40;font-size:13px;color:var(--ink2)}
.chrome .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.chrome button{font-family:var(--sans);font-size:12.5px;color:var(--ink2);background:transparent;
  border:1px solid transparent;border-radius:5px;padding:7px 9px;cursor:pointer;white-space:nowrap}
.chrome button:hover{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome button.act{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome button.k{font-family:var(--mono);font-size:12px;color:var(--muted)}
.chrome .pg{font-family:var(--mono);font-size:14px;color:var(--ink);min-width:76px;text-align:center}
.chrome .track{flex:1;height:3px;background:var(--line);border-radius:3px;margin:0 10px;position:relative}
.chrome .track i{position:absolute;left:0;top:0;height:3px;background:var(--primary);border-radius:3px;transition:width .35s}
.chrome .hint{font-size:11.5px;color:var(--muted);white-space:nowrap;letter-spacing:.5px}
body.immersive{background:#DCDAD4}
body.immersive #viewport{inset:0 0 46px 0}
body.immersive .chrome{height:46px;background:rgba(252,251,248,.94);
  backdrop-filter:blur(8px);border-top:1px solid var(--line)}
body.immersive .chrome .hint{display:none}
body.immersive .chrome .track{margin:0 6px}

/* 页内开窗：舞台内部的侧抽屉，不是浏览器弹窗 */
.dock{position:absolute;right:0;top:0;width:620px;height:900px;background:#FCFBF8;
  border-left:1px solid var(--line);box-shadow:-18px 0 50px rgba(27,43,51,.16);
  transform:translateX(102%);transition:transform .32s cubic-bezier(.2,.7,.2,1);
  z-index:30;display:flex;flex-direction:column}
.dock.on{transform:translateX(0)}
.dockbar{height:64px;flex:0 0 64px;border-bottom:1px solid var(--line);display:flex;
  align-items:center;gap:12px;padding:0 22px;background:var(--bg)}
.dockbar .dt{font-family:var(--serif);font-size:21px;color:var(--ink);font-weight:700}
.dockbar .dk{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:auto;letter-spacing:.5px}
.dockbar button{font-family:var(--sans);font-size:13px;color:var(--ink2);background:#fff;
  border:1px solid var(--line);border-radius:4px;padding:6px 11px;cursor:pointer}
.dockbody{flex:1;overflow:auto;padding:26px 34px 44px}
.dockbody .psub{font-size:13.5px;color:var(--muted);letter-spacing:1px;margin:2px 0 22px}
.dockbody .sec{border-top:1px solid var(--line);padding:16px 0 20px}
.dockbody .sec:first-child{border-top:none;padding-top:4px}
.dockbody .sec .sn{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:1px}
.dockbody .sec h3{margin:7px 0 10px;font-family:var(--serif);font-size:21px;color:var(--primary)}
.dockbody .sec p{margin:0;font-size:15.5px;line-height:1.95;color:var(--ink2);letter-spacing:.3px}
.dockbody .sec .bk{display:block;margin-top:10px;font-family:var(--serif);font-size:14.5px;
  color:var(--accent);line-height:1.7}
.dockbody h2{margin:0;font-family:var(--serif);font-size:28px;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid a{display:block;padding:12px 12px;border:1px solid var(--line);border-radius:4px;
  background:#fff;text-decoration:none;color:var(--ink);cursor:pointer;transition:.2s}
.grid a:hover{border-color:var(--primary);background:var(--prim-l)}
.grid a .gn{font-family:var(--mono);font-size:12px;color:var(--accent)}
.grid a .gt{font-family:var(--serif);font-size:15px;line-height:1.45;display:block;margin-top:5px}
.keys{display:grid;grid-template-columns:repeat(2,1fr);gap:9px 22px;font-size:14.5px;line-height:1.8}
.keys kbd{font-family:var(--mono);background:#fff;border:1px solid var(--line);
  border-bottom-width:2px;border-radius:4px;padding:2px 7px;color:var(--primary);margin-right:8px}
.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:var(--ink);
  color:#fff;font-size:13px;padding:9px 16px;border-radius:5px;opacity:0;transition:.3s;z-index:80;pointer-events:none}
.toast.on{opacity:1}
@media print{.chrome,.dock,.toast{display:none!important}#viewport{position:static}
  #stage{position:static;transform:none!important;box-shadow:none}
  .slide{display:block!important;page-break-after:always;position:relative;height:900px}}
</style>
</head>

<div id="viewport"><div id="stage">
  <div id="slides"></div>
  <div class="dock" id="dock">

</div></div>
<div class="chrome">

<script>
const D = [{"eyebrow":"数据库筑基课 · 索引结构","title":"把排名放回索引里","lede":"从一个「过滤之后还要排序」的查询出发，看 RUM 如何改写倒排索引的信息布局。","caption":"图：七层剖面。上四层是 GIN 的信息缺口，下三层是 RUM 补上的结构、能力与代价。","bridge":"先别急着谈结构，先看那条 SQL 到底卡在哪一步。","notes":"这一节讲 RUM 索引结构。名字听着像又一个索引类型，查查文档、建个索引就完了——但我建议你跟我走完整条链，因为它回答的是一个特别具体、也特别常见的工程问题：业务要的往往不是「找出等于某个值的行」，而是「在一堆候选文本里找出相关的，再按相关性或者时间返回前二十条」。你把这个查询写下来，会发现 WHERE 只是前半段，ORDER BY 和 LIMIT 才是真正吃资源的地方。PostgreSQL 原生的 GIN 做前半段非常强，可它只保存 tsvector 里的 lexeme，不保存词位、权重、时间戳这些局部信息，于是后半段只能把候选行捞回表里再算。RUM 做的事情，说穿了就一句话：把排名需要的局部信息塞进倒排索引的 posting 项里，让索引不只是过滤，还能更早地参与排序。当然，信息不是免费的，等会儿我们会把代价摆在台面上一起算。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"30\" y=\"18\" width=\"620\" height=\"396\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"46\" y=\"30\" width=\"588\" height=\"47\" rx=\"2\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.0\" /><text x=\"64\" y=\"58\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#FFFFFF\" font-weight=\"600\" >业务要的是相关结果，不是等于某个值</text><text x=\"618\" y=\"58\" class=\"sv mono\" text-anchor=\"end\" font-size=\"12.5\" fill=\"#FFFFFF\" font-weight=\"400\" >L7</text><rect x=\"46\" y=\"85\" width=\"588\" height=\"47\" rx=\"2\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.0\" /><text x=\"64\" y=\"113\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#FFFFFF\" font-weight=\"600\" >GIN 只存 key 到 TID 的映射</text><text x=\"618\" y=\"113\" class=\"sv mono\" text-anchor=\"end\" font-size=\"12.5\" fill=\"#FFFFFF\" font-weight=\"400\" >L6</text><rect x=\"46\" y=\"140\" width=\"588\" height=\"47\" rx=\"2\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1.0\" /><text x=\"64\" y=\"168\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#FFFFFF\" font-weight=\"600\" >排名、短语、新鲜度需要额外信息</text><text x=\"618\" y=\"168\" class=\"sv mono\" text-anchor=\"end\" font-size=\"12.5\" fill=\"#FFFFFF\" font-weight=\"400\" >L5</text><rect x=\"46\" y=\"195\" width=\"588\" height=\"47\" rx=\"2\" fill=\"#74A5AD\" stroke=\"#74A5AD\" stroke-width=\"1.0\" /><text x=\"64\" y=\"223\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#FFFFFF\" font-weight=\"600\" >缺信息就得回表、计算、再排序</text><text x=\"618\" y=\"223\" class=\"sv mono\" text-anchor=\"end\" font-size=\"12.5\" fill=\"#FFFFFF\" font-weight=\"400\" >L4</text><rect x=\"46\" y=\"250\" width=\"588\" height=\"47\" rx=\"2\" fill=\"#EBF1EE\" stroke=\"#EBF1EE\" stroke-width=\"1.0\" /><text x=\"64\" y=\"278\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >RUM 把局部信息放进 posting 项</text><text x=\"618\" y=\"278\" class=\"sv mono\" text-anchor=\"end\" font-size=\"12.5\" fill=\"#245A6B\" font-weight=\"400\" >L3</text><rect x=\"46\" y=\"305\" width=\"588\" height=\"47\" rx=\"2\" fill=\"#CFE0DC\" stroke=\"#CFE0DC\" stroke-width=\"1.0\" /><text x=\"64\" y=\"333\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >索引开始参与排序与短语判断</text><text x=\"618\" y=\"333\" class=\"sv mono\" text-anchor=\"end\" font-size=\"12.5\" fill=\"#245A6B\" font-weight=\"400\" >L2</text><rect x=\"46\" y=\"360\" width=\"588\" height=\"47\" rx=\"2\" fill=\"#A4C4C6\" stroke=\"#A4C4C6\" stroke-width=\"1.0\" /><text x=\"64\" y=\"388\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >代价写在写入、WAL 与运维里</text><text x=\"618\" y=\"388\" class=\"sv mono\" text-anchor=\"end\" font-size=\"12.5\" fill=\"#245A6B\" font-weight=\"400\" >L1</text><text x=\"700\" y=\"92\" class=\"sv serif\" text-anchor=\"start\" font-size=\"66.0\" fill=\"#1B2B33\" font-weight=\"700\" >RUM</text><text x=\"700\" y=\"150\" class=\"sv s\" text-anchor=\"start\" font-size=\"20.0\" fill=\"#245A6B\" font-weight=\"600\" >索引结构 · PostgreSQL 扩展</text><line x1=\"700\" y1=\"180\" x2=\"1340\" y2=\"180\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"700\" y=\"236\" class=\"sv serif\" text-anchor=\"start\" font-size=\"34.0\" fill=\"#1B2B33\" font-weight=\"700\" >把排名需要的信息，</text><text x=\"700\" y=\"286\" class=\"sv serif\" text-anchor=\"start\" font-size=\"34.0\" fill=\"#BE653B\" font-weight=\"700\" >放回倒排项里。</text><rect x=\"700\" y=\"320\" width=\"640\" height=\"76\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"720\" y=\"350\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#245A6B\" font-weight=\"400\" >key → (heap TID, addInfo) 这一处改动，串起整节课</text><text x=\"720\" y=\"377\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >结论以本地 rum 源码与官方文档核对，性能数字不作承诺</text></svg>","ctrl":null},{"eyebrow":"01 · 困境","title":"过滤很强，但排序要的信息它没存","lede":"WHERE 只完成了一半；ORDER BY 与 LIMIT 需要词位、相关性或时间戳，而这些不在 GIN 的 posting 里。","caption":"图：左边是业务 SQL 与它被迫走完的六步链路，右边是四类查询里暴露出来的同一个信息缺口。","bridge":"既然缺的是 posting 里的信息，那 RUM 的改动就该落在倒排项本身。","notes":"我们把这条 SQL 摊开。WHERE 用 @@ 做全文匹配，ORDER BY 用 <=> 算距离，LIMIT 20 只要前二十条。看上去很轻，可你要问一句：距离是拿什么算的？tsvector 里的词位、词的位置、乃至业务上的时间戳，这些都不在 GIN 的 posting 里。GIN 的基本模型是 key 指向一组 heap TID，它回答的是「哪些行包含这个词」，回答不了「这个词在这行的第几个位置」「这行离目标时间有多近」。于是执行器只能走一条很长的路：先用索引过滤拿到候选 TID，再回表把原始 tsvector 或时间列取出来，计算距离，排序，最后才轮到 LIMIT。注意顺序——LIMIT 写在最后，可它的收益也最后才兑现。右边这四类场景，根子是同一个：排名要位置、短语要相邻关系、新鲜度要可度量的附加列、Top-N 只想早早返回。它们共同指向一件事：索引里的信息不够。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"30\" y=\"20\" width=\"580\" height=\"190\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"48\" y=\"49\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" >业务里最常见的全文 Top-N 查询</text><line x1=\"48\" y1=\"59\" x2=\"592\" y2=\"59\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"50\" y=\"86.5\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" >SELECT id, title FROM doc</text><text x=\"50\" y=\"108.37\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" >WHERE fts @@ plainto_tsquery(&#x27;postgres rum index&#x27;)</text><text x=\"50\" y=\"130.24\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" >ORDER BY fts &lt;=&gt; plainto_tsquery(&#x27;postgres rum index&#x27;)</text><text x=\"50\" y=\"152.11\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" >LIMIT 20;</text><rect x=\"30\" y=\"226\" width=\"580\" height=\"62\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"48\" y=\"262.425\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#BE653B\" font-weight=\"600\" >信息缺口</text><text x=\"196\" y=\"261.55\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >GIN posting 主要只有 heap TID</text><line x1=\"320\" y1=\"292\" x2=\"320\" y2=\"314.8\" stroke=\"#BE653B\" stroke-width=\"2.0\" /><polygon points=\"320,322 315.05,313 324.95,313\" fill=\"#BE653B\" /><rect x=\"30\" y=\"328\" width=\"580\" height=\"78\" rx=\"2\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1.0\" /><text x=\"50\" y=\"358\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#AE8A3E\" font-weight=\"600\" >过滤 → 取候选 TID → 回表 → 算距离 → 排序 → LIMIT</text><text x=\"50\" y=\"386\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >候选集越大，第三步与第五步越贵</text><rect x=\"660\" y=\"20\" width=\"335\" height=\"180\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"660\" y=\"20\" width=\"335\" height=\"6\" rx=\"0\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1.0\" /><text x=\"680\" y=\"66\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#1B2B33\" font-weight=\"700\" >排名 / 相关性</text><line x1=\"680\" y1=\"82\" x2=\"975\" y2=\"82\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"680\" y=\"116\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >需要 lexeme 位置与权重，</text><text x=\"680\" y=\"144\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >GIN 索引里没有</text><text x=\"680\" y=\"180\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" >01</text><rect x=\"1015\" y=\"20\" width=\"335\" height=\"180\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"1015\" y=\"20\" width=\"335\" height=\"6\" rx=\"0\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1.0\" /><text x=\"1035\" y=\"66\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#1B2B33\" font-weight=\"700\" >短语判断</text><line x1=\"1035\" y1=\"82\" x2=\"1330\" y2=\"82\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"1035\" y=\"116\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >需要词位相邻关系，</text><text x=\"1035\" y=\"144\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >常要回表读 tsvector 复核</text><text x=\"1035\" y=\"180\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" >02</text><rect x=\"660\" y=\"220\" width=\"335\" height=\"180\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"660\" y=\"220\" width=\"335\" height=\"6\" rx=\"0\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1.0\" /><text x=\"680\" y=\"266\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#1B2B33\" font-weight=\"700\" >按时间新鲜度</text><line x1=\"680\" y1=\"282\" x2=\"975\" y2=\"282\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"680\" y=\"316\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >需要 timestamp 一类的</text><text x=\"680\" y=\"344\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >可度量、可排序的附加列</text><text x=\"680\" y=\"380\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" >03</text><rect x=\"1015\" y=\"220\" width=\"335\" height=\"180\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"1015\" y=\"220\" width=\"335\" height=\"6\" rx=\"0\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1.0\" /><text x=\"1035\" y=\"266\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#1B2B33\" font-weight=\"700\" >只要 Top-N</text><line x1=\"1035\" y1=\"282\" x2=\"1330\" y2=\"282\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"1035\" y=\"316\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >Limit 很小，却可能要先把</text><text x=\"1035\" y=\"344\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >全部候选处理完才能返回</text><text x=\"1035\" y=\"380\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" >04</text></svg>","ctrl":null},{"eyebrow":"02 · 命题","title":"一个字段之差，两种执行路径","lede":"RUM 把 key → TID 扩成 key → (TID, addInfo)；addInfo 可以是词位，也可以是绑定的附加列。","caption":"图：左右对照两种倒排项的映射模型，底部是因此可能被改写的执行链路。","bridge":"但多存一份信息，就要多付一份代价，先别急着叫好。","notes":"RUM 的命题特别克制，它没有重新发明索引，只在倒排项里加了一个东西：每个 heap TID 旁边，允许跟一个可选的 addInfo。GIN 的 posting 主要是 TID 集合；RUM 的 posting 是 TID 加附加信息的集合。这个 addInfo 可以是 tsvector 里 lexeme 的位置信息，也可以是通过 WITH (attach = 'd', to = 't') 绑到全文列上的时间戳、整数、浮点数这类可排序的值。你别小看这一格，它把整条执行链改写了：原来必须「索引过滤、回表、计算距离、排序、LIMIT」，现在有机会变成「索引过滤时就维护距离顺序，更早返回 Top-N」。官方文档把它概括成四条收益：更快的排名、更快的短语搜索、更快的时间戳排序、以及可以深度优先搜索、立刻返回前几条结果。这四条不是四个技巧，是同一个结构改动在不同查询上的投影。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"30\" y=\"18\" width=\"1340\" height=\"70\" rx=\"2\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.0\" /><text x=\"52\" y=\"60\" class=\"sv serif\" text-anchor=\"start\" font-size=\"22.0\" fill=\"#FFFFFF\" font-weight=\"700\" >一处结构改动：posting 项从「只有 TID」变成「TID 加一个可选的 addInfo」</text><rect x=\"30\" y=\"108\" width=\"650\" height=\"250\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"30\" y=\"108\" width=\"650\" height=\"50\" rx=\"2\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1.0\" /><text x=\"50\" y=\"141\" class=\"sv s\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#FFFFFF\" font-weight=\"700\" >GIN 的基本模型</text><rect x=\"50\" y=\"176\" width=\"610\" height=\"58\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"64\" y=\"212\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"600\" >key → posting list/tree → heap TID 集合</text><rect x=\"50\" y=\"250\" width=\"610\" height=\"40\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"64\" y=\"276\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >回答：哪些行包含这个 key</text><rect x=\"50\" y=\"298\" width=\"610\" height=\"40\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"64\" y=\"324\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >适合：@@ / @&gt; / &amp;&amp; 这类候选过滤</text><rect x=\"720\" y=\"108\" width=\"650\" height=\"250\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"720\" y=\"108\" width=\"650\" height=\"50\" rx=\"2\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"740\" y=\"141\" class=\"sv s\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#FFFFFF\" font-weight=\"700\" >RUM 的基本模型</text><rect x=\"740\" y=\"176\" width=\"610\" height=\"58\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"754\" y=\"212\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"600\" >key → posting list/tree → (heap TID, addInfo)</text><rect x=\"740\" y=\"250\" width=\"610\" height=\"40\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"754\" y=\"276\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >回答：哪些行、以及每个 TID 的局部信息</text><rect x=\"740\" y=\"298\" width=\"610\" height=\"40\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"754\" y=\"324\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >可用于：排名、短语、附加列距离排序</text><rect x=\"30\" y=\"372\" width=\"1340\" height=\"48\" rx=\"2\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1.0\" /><text x=\"50\" y=\"402\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#2F7A66\" font-weight=\"600\" >链路变化：索引过滤 → 回表 → 计算 → 排序 → LIMIT  ⇒  索引过滤时就维护距离顺序 → 更早返回 Top-N</text></svg>","ctrl":null},{"eyebrow":"03 · 代价","title":"把信息搬进索引，账要一起算","lede":"posting 变宽、写放大、generic WAL、非 core 扩展——读侧收益与写侧成本来自同一个决定。","caption":"图：四类代价按「结构 → 写入 → WAL → 运维」展开，对应源码与 README 中可核对的事实。","bridge":"代价清楚了，我们再来看它在 PostgreSQL 里到底是个什么东西。","notes":"我习惯先把代价说完，再讲实现，免得听成推销。第一，posting 项变宽，索引体积和页面占用都上去。第二，写放大更明显：一行文本不是一条索引项，它会被 opclass 拆成多个 lexeme，每个 lexeme 又可能带着附加信息，所以一次 INSERT 对应的是一批 posting 维护动作。第三，源码用 generic WAL 记录页面变化，官方 README 直接写明 build 和 insert 通常比 GIN 慢，原因是既多存了信息、又用了 generic WAL。第四，RUM 是扩展，不是 PostgreSQL 内核自带的 access method，版本兼容、编译构建、回归测试都要进你的运维流程——原文特别提醒，升级前别只做编译验证，要跑 installcheck。这四条你先记着，后面讲 VACUUM、讲最佳实践、讲适合与不适合，其实都是在这四条约束下做加减法。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"30\" y=\"18\" width=\"1340\" height=\"62\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"48\" y=\"55.3\" class=\"sv s\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#BE653B\" font-weight=\"600\" >信息不是免费的</text><text x=\"306\" y=\"53.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >收益来自索引层拥有更多信息，成本也来自这些信息</text><rect x=\"30\" y=\"100\" width=\"650\" height=\"138\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"30\" y=\"100\" width=\"650\" height=\"42\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"48\" y=\"128\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#BE653B\" font-weight=\"700\" >01  posting 项变宽</text><text x=\"48\" y=\"174\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >每个 TID 旁边多一个 addInfo，</text><text x=\"48\" y=\"202\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >索引体积与页面占用随之上升</text><rect x=\"720\" y=\"100\" width=\"650\" height=\"138\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"720\" y=\"100\" width=\"650\" height=\"42\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"738\" y=\"128\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"700\" >02  写放大更明显</text><text x=\"738\" y=\"174\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >一行文本拆出多个 lexeme，</text><text x=\"738\" y=\"202\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >每个 lexeme 都可能带附加信息</text><rect x=\"30\" y=\"254\" width=\"650\" height=\"138\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"30\" y=\"254\" width=\"650\" height=\"42\" rx=\"2\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1.0\" /><text x=\"48\" y=\"282\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#AE8A3E\" font-weight=\"700\" >03  generic WAL</text><text x=\"48\" y=\"328\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >页面修改走 PostgreSQL generic WAL，</text><text x=\"48\" y=\"356\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >官方 README 明说 build/insert 慢于 GIN</text><rect x=\"720\" y=\"254\" width=\"650\" height=\"138\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"720\" y=\"254\" width=\"650\" height=\"42\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#F1EFE9\" stroke-width=\"1.0\" /><text x=\"738\" y=\"282\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#46585F\" font-weight=\"700\" >04  扩展的运维责任</text><text x=\"738\" y=\"328\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >RUM 不是 core access method，</text><text x=\"738\" y=\"356\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >版本适配、构建、回归测试都要纳入流程</text><text x=\"30\" y=\"420\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >这四条不是「缺点清单」，而是后面所有选型判断的约束条件。</text></svg>","ctrl":null},{"eyebrow":"04 · 定义","title":"它是一个 access method 扩展","lede":"rum_init.sql 注册 handler，rumutil.c 返回 IndexAmRoutine；真正让它能排 Top-N 的是 amcanorderbyop。","caption":"图：注册 SQL → handler → 能力标志的三段链条，下半部是它绑定的八个核心回调。","bridge":"知道它是「框架」，才能理解为什么语义不写在 RUM 里，而写在 opclass 里。","notes":"那 RUM 在 PostgreSQL 眼里到底算什么？看 rum_init.sql 就很清楚：先注册一个 C 函数 rumhandler，再用 CREATE ACCESS METHOD rum TYPE INDEX HANDLER rumhandler 注册访问方法。src/rumutil.c 里的 rumhandler() 返回一个 IndexAmRoutine，把 rumbuild、ruminsert、rumbulkdelete、rumvacuumcleanup、rumbeginscan、rumrescan、rumgettuple、rumgetbitmap 这些回调全部绑上。这里面最关键的一行是 amcanorderbyop = true。PostgreSQL 的索引访问方法文档说得很明白：支持 ordering operator 的 AM 要设这个标志，才能处理 ORDER BY index_key operator constant 形式的扫描。所以千万别把它理解成「RUM 是更有序的 GIN」——它不是 B-tree，不保证按 key 天然有序；它只是允许索引扫描阶段就按距离算子把结果排出来。另外 amcanmulticol、amoptionalkey、amstorage 也为后面多列索引和 addon 附加列埋了伏笔。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"30\" y=\"20\" width=\"420\" height=\"160\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"48\" y=\"49\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" >rum_init.sql：注册一个 access method</text><line x1=\"48\" y1=\"59\" x2=\"432\" y2=\"59\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"50\" y=\"84.23456790123457\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.2\" fill=\"#1B2B33\" font-weight=\"400\" >CREATE FUNCTION rumhandler(internal)</text><text x=\"50\" y=\"102.43456790123457\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.2\" fill=\"#1B2B33\" font-weight=\"400\" >RETURNS index_am_handler AS &#x27;MODULE_PATHNAME&#x27;,</text><text x=\"50\" y=\"120.63456790123456\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.2\" fill=\"#1B2B33\" font-weight=\"400\" >&#x27;rumhandler&#x27; LANGUAGE C;</text><text x=\"50\" y=\"138.83456790123455\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.2\" fill=\"#1B2B33\" font-weight=\"400\" >CREATE ACCESS METHOD rum TYPE INDEX</text><text x=\"50\" y=\"157.03456790123457\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.2\" fill=\"#1B2B33\" font-weight=\"400\" >  HANDLER rumhandler;</text><line x1=\"462\" y1=\"100\" x2=\"492.8\" y2=\"100\" stroke=\"#245A6B\" stroke-width=\"2.0\" /><polygon points=\"500,100 491,95.05 491,104.95\" fill=\"#245A6B\" /><rect x=\"510\" y=\"30\" width=\"360\" height=\"140\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"690.0\" y=\"98.37832541567695\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"600\" >rumhandler() → IndexAmRoutine</text><text x=\"690.0\" y=\"116.67167458432303\" class=\"sv s\" text-anchor=\"middle\" font-size=\"9.9\" fill=\"#46585F\" font-weight=\"400\" >[&#x27;src/rumutil.c&#x27;, &#x27;绑定 build / insert / scan / vacuum 回调&#x27;]</text><line x1=\"882\" y1=\"100\" x2=\"912.8\" y2=\"100\" stroke=\"#245A6B\" stroke-width=\"2.0\" /><polygon points=\"920,100 911,95.05 911,104.95\" fill=\"#245A6B\" /><rect x=\"930\" y=\"20\" width=\"440\" height=\"190\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"930\" y=\"20\" width=\"440\" height=\"42\" rx=\"2\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.0\" /><text x=\"946\" y=\"47\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#FFFFFF\" font-weight=\"600\" >关键能力标志</text><rect x=\"946\" y=\"82.0\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"0\" /><text x=\"960\" y=\"89.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >amcanorderbyop = true：可服务 ORDER BY 距离</text><rect x=\"946\" y=\"112.0\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"0\" /><text x=\"960\" y=\"119.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >amcanmulticol = true：支持多列索引</text><rect x=\"946\" y=\"142.0\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"0\" /><text x=\"960\" y=\"149.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >amoptionalkey = true：可无 key 扫描</text><rect x=\"946\" y=\"172.0\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"0\" /><text x=\"960\" y=\"179.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >amstorage = true：可指定不同存储类型</text><rect x=\"30\" y=\"214\" width=\"1340\" height=\"62\" rx=\"2\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1.0\" /><text x=\"50\" y=\"252\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#AE8A3E\" font-weight=\"600\" >它不是天然按 key 有序输出的 B-tree；它支持的是 ORDER BY index_key operator constant 这类 ordering operator 扫描</text><rect x=\"30\" y=\"296\" width=\"325\" height=\"48\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"46\" y=\"326\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"600\" >rumbuild</text><rect x=\"375\" y=\"296\" width=\"325\" height=\"48\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"391\" y=\"326\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"600\" >ruminsert</text><rect x=\"720\" y=\"296\" width=\"325\" height=\"48\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"736\" y=\"326\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"600\" >rumbulkdelete</text><rect x=\"1065\" y=\"296\" width=\"325\" height=\"48\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"1081\" y=\"326\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"600\" >rumvacuumcleanup</text><rect x=\"30\" y=\"358\" width=\"325\" height=\"48\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"46\" y=\"388\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"600\" >rumbeginscan</text><rect x=\"375\" y=\"358\" width=\"325\" height=\"48\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"391\" y=\"388\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"600\" >rumrescan</text><rect x=\"720\" y=\"358\" width=\"325\" height=\"48\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"736\" y=\"388\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"600\" >rumgettuple</text><rect x=\"1065\" y=\"358\" width=\"325\" height=\"48\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"1081\" y=\"388\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"600\" >rumgetbitmap</text><text x=\"30\" y=\"424\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >回调清单来自 src/rumutil.c 的 IndexAmRoutine 绑定，也是后续各节的路径索引。</text></svg>","ctrl":null},{"eyebrow":"05 · 结构","title":"三层对象：一棵树，两种 posting 形态","lede":"entry tree 负责找 key；集合小就内联成 posting list，集合大就拆成 posting tree。","caption":"图：地层剖面。越深的靛青越底层，三层合起来才是一个 RUM 索引。","bridge":"把三层落到页面上，才看得见 RumItem 到底存了什么。","notes":"现在进到结构层。RUM 的核心对象就三层，别被源码里一堆文件名吓住。最上面是 entry tree，按 key 组织的树，key 可以是 lexeme、数组元素、标量值，甚至 tsquery 的分支；它只负责一件事：从 key 找到对应的 posting。中间是 posting list，某个 key 对应的 TID 集合如果很短，就干脆塞在 entry leaf tuple 里，读一个 tuple 就能把短集合全拿到。最下面是 posting tree，同一个 key 命中的行太多、list 塞不下，就独立拆成由 data pages 组成的树。要强调的是，posting list 和 posting tree 不是两种索引，是同一个 key 在不同数据量下的两种承载形态——这个分叉是后面写入路径、VACUUM 和页面 inspect 的共同前提。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"30\" y=\"24\" width=\"1340\" height=\"104\" rx=\"2\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.0\" /><text x=\"52\" y=\"60\" class=\"sv serif\" text-anchor=\"start\" font-size=\"20.0\" fill=\"#FFFFFF\" font-weight=\"700\" >L1 · entry tree</text><text x=\"52\" y=\"96\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#FFFFFF\" font-weight=\"400\" >按 key 组织的树：lexeme、array element、标量值、tsquery 分支</text><text x=\"1348\" y=\"96\" class=\"sv s\" text-anchor=\"end\" font-size=\"13.0\" fill=\"#FFFFFF\" font-weight=\"400\" >负责「从 key 找到 posting」</text><rect x=\"30\" y=\"142\" width=\"1340\" height=\"104\" rx=\"2\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1.0\" /><text x=\"52\" y=\"178\" class=\"sv serif\" text-anchor=\"start\" font-size=\"20.0\" fill=\"#FFFFFF\" font-weight=\"700\" >L2 · posting list</text><text x=\"52\" y=\"214\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#FFFFFF\" font-weight=\"400\" >短集合直接内联在 entry leaf tuple 里，读一个 tuple 就能拿到</text><text x=\"1348\" y=\"214\" class=\"sv s\" text-anchor=\"end\" font-size=\"13.0\" fill=\"#FFFFFF\" font-weight=\"400\" >小 key 的常见形态</text><rect x=\"30\" y=\"260\" width=\"1340\" height=\"104\" rx=\"2\" fill=\"#A4C4C6\" stroke=\"#A4C4C6\" stroke-width=\"1.0\" /><text x=\"52\" y=\"296\" class=\"sv serif\" text-anchor=\"start\" font-size=\"20.0\" fill=\"#1B2B33\" font-weight=\"700\" >L3 · posting tree</text><text x=\"52\" y=\"332\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"400\" >集合太大时独立拆成 data pages 组成的树，leaf tuple 只留 root 标记</text><text x=\"1348\" y=\"332\" class=\"sv s\" text-anchor=\"end\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" >大 key / 热词的形态</text><rect x=\"30\" y=\"378\" width=\"1340\" height=\"44\" rx=\"2\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1.0\" /><text x=\"50\" y=\"406\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#AE8A3E\" font-weight=\"600\" >三者不是三套索引：entry tree 是目录，posting list 与 posting tree 是同一个 key 的两种承载形态</text></svg>","ctrl":null},{"eyebrow":"06 · 页面","title":"每个 TID 旁边，多了一个 Datum","lede":"RumItem = iptr + addInfoIsNull + addInfo；放不下的 posting 用 0xffff 标记改为指向 tree root。","caption":"图：左为固定页号与 opaque 结构，中为 RumItem 定义，右为 flags 与分叉标记，下方两条边界提示。","bridge":"物理结构清楚了，接着要把「别套用 GIN 经验」这句话讲透。","notes":"落到页面上，src/rum.h 给了两个固定页号：RUM_METAPAGE_BLKNO 是 0，RUM_ROOT_BLKNO 是 1。metapage 里的 RumMetaPageData 记着 rumVersion、nTotalPages、nEntryPages、nDataPages、nEntries 这些统计；每个页面的 special space 里是 RumPageOpaqueData，存 leftlink、rightlink、maxoff、freespace 和一组 flags，比如 RUM_DATA、RUM_LEAF、RUM_DELETED、RUM_META、RUM_LIST、RUM_LIST_FULLROW。真正的主角是 RumItem：一个 iptr、一个 addInfoIsNull、一个 Datum addInfo。就这三个字段，把「TID 旁边带信息」这件事写死在结构里。非叶子 posting tree 页用 RumPostingItem 保存 child block 和 RumItem 边界，leaf data page 用变长编码存 leaf items。当某个 key 的 posting 太多，leaf tuple 里不再是 list，而是 RUM_TREE_POSTING 这个 0xffff 标记加上 posting tree 的 root 页号。还有一条特别值得划重点：结构里确实还留着 pending list 相关字段，但源码注释写明 unused——pending list is removed，所以别把 GIN 的 fastupdate 机制想当然搬过来。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"30\" y=\"20\" ":null},{"eyebrow":"07 · 边界","title":"别把 GIN 的经验直接搬过来","lede":"pending list 已移除、多个 addInfo 仍在 TODO、pass-by-reference 附加列不允许建 ordering 索引。","caption":"图：三栏分别是机制差异、能力边界与类型限制，每栏底部给出对应工程结论。","bridge":"承认 RUM 只是框架，才能真正解释它为什么能服务这么多数据类型。","notes":"这一页我特意留出来，因为最容易讲错。第一，pending list。很多熟悉 GIN 的人会本能地想到 fastupdate 那一套，可 RUM 当前实现里 pending list 已经被移除，metapage 里保留的字段只是结构残留，注释写得明明白白。第二，多个 additional info。项目 TODO 里还写着「Allow multiple additional info (lexemes positions + timestamp)」，也就是说，把词位信息和时间戳同时塞进同一个 posting 项，目前不是可以无限叠加的能力——你得在短语、相关性、时间新鲜度之间做取舍，或者用额外索引、业务排序组合起来处理。第三，官方 README 还有一条硬警告：对 pass-by-reference 类型的附加信息做 ordering，行为不正确，原因是 posting tree 的 right bound 和非叶 posting item 是定长的，这类索引干脆不允许创建。所以时间戳、整数、浮点这类按值类型更适合做 addon 排序列。这三条合起来就是要提醒你：RUM 长得像 GIN，但不是 GIN。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"30\" y=\"18\" width=\"1340\" height=\"58\" rx=\"3\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1.0\" /><text x=\"48\" y=\"52.95\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#AE8A3E\" font-weight=\"600\" >三个容易套错的边界</text><text x=\"356\" y=\"51.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >看着像 GIN，不等于行为就是 GIN</text><rect x=\"30\" y=\"96\" width=\"430\" height=\"290\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"30\" y=\"96\" width=\"430\" height=\"46\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"48\" y=\"126\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#BE653B\" font-weight=\"700\" >01  pending list</text><rect x=\"48\" y=\"158\" width=\"394\" height=\"50\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"60\" y=\"180\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >GIN fastupdate 会把新项暂放 pend</text><text x=\"60\" y=\"200\" class=\"sv s\" text-anchor=\"start\" fo \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >stamp</text><rect x=\"503\" y=\"274\" width=\"394\" height=\"50\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"515\" y=\"296\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >词位信息与附加列不能无限叠加</text><rect x=\"503\" y=\"336\" width=\"394\" height=\"38\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"515\" y=\"361\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#245A6B\" font-weight=\"600\" >结论：在短语、相关性、时间新鲜度之间取舍</text><rect x=\"940\" y=\"96\" width=\"430\" height=\"290\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"940\" y=\"96\" width=\"430\" height=\"46\" rx=\"2\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1.0\" /><text x=\"958\" y=\"126\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#2F7A66\" font-weight=\"700\" >03  pass-by-reference</text><rect x=\"958\" y=\"158\" width=\"394\" height=\"50\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"970\" y=\"180\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >README 警告：对 pass-by-refere</text><text x=\"970\" y=\"200\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >nce 附加信息做 ordering 行为不正确</text><rect x=\"958\" y=\"216\" width=\"394\" height=\"50\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"970\" y=\"238\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >posting tree 的 right bound</text><text x=\"970\" y=\"258\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" > 与非叶项定长</text><rect x=\"958\" y=\"274\" width=\"394\" height=\"50\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"970\" y=\"296\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >这类索引不允许创建</text><rect x=\"958\" y=\"336\" width=\"394\" height=\"38\" rx=\"2\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1.0\" /><text x=\"970\" y=\"361\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#2F7A66\" font-weight=\"600\" >结论：时间戳、整数、浮点等按值类型更适合</text><text x=\"30\" y=\"416\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >三条均来自本地源码注释与官方 README / 文档，属于「实现边界」而非「使用技巧」。</text></svg>","ctrl":null},{"eyebrow":"08 · 分工","title":"语义由 operator class 决定","lede":"抽取、比较、一致性判断、距离计算，都是 opclass 的支持函数；RUM 只负责承载与调度。","caption":"图：四步支持函数流水线，下方是这些函数在源码里的对应文件。","bridge":"框架说完，把七类 opclass 摊开，能力边界就一目了然。","notes":"这里有个很关键的分工：RUM 和 GIN 一样，都是 generalized access method。它自己并不知道 tsvector 是什么、数组元素是什么、时间戳该怎么比。它提供的是一套框架，语义全靠 operator class 的支持函数填进去。你可以把它想成四步流水线：extractValueFn 把被索引的值拆成 key，顺便决定每个 key 带什么 addInfo；extractQueryFn 把查询条件拆成 scan key，决定要找哪些 entry；consistentFn 判断候选 TID 到底满不满足 query 逻辑，短语约束也在这一步；distanceFn 用 addInfo 算出距离，交给 ordering operator 去排序。源码落点也很整齐：rum_ts_utils.c 管 tsvector 和 tsquery，rumtsquery.c 管反向全文检索，rum_arr_utils.c 管数组，btree_rum.c 管各种标量类型。所以你之后看到「RUM 支持什么」，正确的问法不是「RUM 支持吗」，而是「哪个 opclass 支持、它的支持函数提供了什么」。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"30\" y=\"18\" width=\"1340\" height=\"58\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"48\" y=\"52.95\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"600\" >RUM 只给框架</text><text x=\"306\" y=\"51.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >它不知道 tsvector / tsquery / 数组 / 时间戳各自的业务语义</text><rect x=\"30\" y=\"100\" width=\"315\" height=\"150\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"30\" y=\"100\" width=\"315\" height=\ th=\"660\" height=\"144\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"710\" y=\"272\" width=\"660\" height=\"42\" rx=\"2\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.0\" /><text x=\"726\" y=\"299\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#FFFFFF\" font-weight=\"600\" >源码落点（二）</text><rect x=\"726\" y=\"337.0\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"0\" /><text x=\"740\" y=\"344.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >src/rum_arr_utils.c：数组抽取、consistent、ordering、distance</text><rect x=\"726\" y=\"367.0\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"0\" /><text x=\"740\" y=\"374.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >src/btree_rum.c：整数、浮点、时间戳、money、oid 等标量类型</text></svg>","ctrl":null},{"eyebrow":"09 · 全景","title":"七类 opclass，七种语义","lede":"同一个 RUM 框架下，不同 opclass 决定索引里放的是词位、hash、附加列还是 query 分支。","caption":"图：opclass 能力对照表（rum_init.sql 与官方文档 F.68）。hash 系以 hash 作 key，失去前缀匹配；官方另有 rum_anyarray_addon_ops。","bridge":"表里有两行最容易混淆，值得单独拎出来讲取舍。","notes":"把 rum_init.sql 和官方文档里的 opclass 摊成一张表，边界就清楚了。rum_tsvector_ops 存 lexeme 和位置信息，支持 <=> 排名排序和前缀搜索，是全文检索最常见的选择；rum_tsvector_hash_ops 把 key 换成 hash，能省一些空间，但不支持 prefix search，而且 hash 冲突可能带来 recheck。addon 两兄弟要把附加列一起建进多列索引，用 WITH (attach = 'd', to = 't') 把 d 的值附着到 t 的 posting 项上，hash 版本同样不支持前缀搜索。rum_tsquery_ops 很有意思，它把 query tree 的分支放进 addInfo，做的是反向全文检索：给一篇文档，找出哪些已存查询能匹配它。rum_anyarray_ops 处理数组，把数组长度当作附加信息；rum_TYPE_ops 覆盖各类标量类型，但 <=> / <=| / |=> 这三种距离算子只对整数、浮点、时间戳、money、oid 这类按值类型提供，其它类型只有比较算子。你注意看，同一个 RUM 框架里，key 和 addInfo 的含义可以完全不同——这就是为什么上一页说「语义由 opclass 决定」。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"30\" y=\"20\" width=\"1340\" height=\"394\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9  key，@@，&lt;=&gt;</text><text x=\"1024\" y=\"143.48\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >不支持 prefix search</text><line x1=\"30\" y1=\"214\" x2=\"1370\" y2=\"214\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"44\" y=\"193.48\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#1B2B33\" font-weight=\"600\" >rum_tsvector_addon_ops</text><text x=\"344\" y=\"193.48\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >tsvector + 附加列</text><text x=\"554\" y=\"193.48\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >@@ 过滤，按附加列距离排序</text><text x=\"1024\" y=\"193.48\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >需 WITH (attach = ..., to = ...)</text><rect x=\"30\" y=\"214\" width=\"1340\" height=\"50\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"none\" stroke-width=\"0\" /><line x1=\"30\" y1=\"264\" x2=\"1370\" y2=\"264\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"44\" y=\"243.48\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#1B2B33\" font-weight=\"600\" >rum_tsvector_hash_addon_ops</text><text x=\"344\" y=\"243.48\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >hash tsvector + 附加列</text><text x=\"554\" y=\"243.48\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >类似 addon，但 key 为 hash</text><text x=\"1024\" y=\"243.48\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >不支持 prefix search</text><line x1=\"30\" y1=\"314\" x2=\"1370\" y2=\"314\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"44\" y=\"293.48\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#1B2B33\" font-weight=\"600\" >rum_tsquery_ops</text><text x=\"344\" y=\"293.48\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >tsquery</text><text x=\"554\" y=\"293.48\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >反向全文检索：文档匹配查询集合</text><text x=\"1024\" y=\"293.48\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >query tree 分支放入 addInfo</text><rect x=\"30\" y=\"314\" width=\"1340\" height=\"50\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"none\" stroke-width=\"0\" /><line x1=\"30\" y1=\"364\" x2=\"1370\" y2=\"364\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"44\" y=\"343.48\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#1B2B33\" font-weight=\"600\" >rum_anyarray_ops</text><text x=\"344\" y=\"343.48\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >anyarray</text><text x=\"554\" y=\"343.48\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >&amp;&amp; @&gt; &lt;@ = % &lt;=&gt;</text><text x=\"1024\" y=\"343.48\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >数组长度可作为附加信息</text><line x1=\"30\" y1=\"414\" x2=\"1370\" y2=\"414\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"44\" y=\"393.48\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#1B2B33\" font-weight=\"600\" >rum_TYPE_ops</text><text x=\"344\" y=\"393.48\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >多种标量类型</text><text x=\"554\" y=\"393.48\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >比较；按值类型支持 &lt;=&gt; / &lt;=| / |=&gt;</text><text x=\"1024\" y=\"393.48\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >可作为 addon 排序列</text><line x1=\"330\" y1=\"64\" x2=\"330\" y2=\"414\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><line x1=\"540\" y1=\"64\" x2=\"540\" y2=\"414\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><line x1=\"1010\" y1=\"64\" x2=\"1010\" y2=\"414\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /></svg>","ctrl":null},{"eyebrow":"10 · 取舍","title":"词位和时间，暂时不能都要","lede":"rum_tsvector_ops 把位置放进索引；addon 把附加列放进索引。多个 additional info 仍列在 TODO 里。","caption":"图：两类 addInfo 的能力与典型查询并排，底部标明当前实现的能力边界。","bridge":"信息怎么放进去的，得看写入路径；它也是写放大最直观的解释。","notes":"这张表里最容易被误读的一行，我单独拉出来说。很多人看到 addInfo，会下意识理解成「那我把词位、时间戳、权重都塞进去，一个索引解决所有排序」。不行。RUM 的 TODO 里现在还写着「Allow multiple additional info (lexemes positions + timestamp)」，这行字就是边界。实际选择是两条路：rum_tsvector_ops 把词位位置放进 addInfo，换来 <=> 相关性排名、短语搜索和前缀匹配；rum_tsvector_addon_ops 把绑定的 timestamp 或数值放进 addInfo，换来按附加列距离排序，但要求多列索引加 attach/to 参数。也就是说，你想同时按相关性和时间新鲜度排，当前实现下得取舍，或者用额外索引、业务层排序组合起来。这个边界不是吹毛求疵，它直接决定建表时索引怎么设计，也解释了后面 DEMO 为什么分成两个独立例子。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"30\" y=\"18\" width=\"1340\" height=\"58\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"48\" y=\"52.95\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#BE653B\" font-weight=\"600\" >一个 posting 项</text><text x=\"306\" y=\"51.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >当前实现里，addInfo 是一条局部信息，不是无限叠加的特征向量</text><rect x=\"30\" y=\"96\" width=\"650\" height=\"232\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"30\" y=\"96\" width=\"650\" height=\"50\" rx=\"2\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"48\" y=\"128\" class=\"sv mono\" text-anchor=\"start\" font-size=\"16.5\" fill=\"#FFFFFF\" font-weight=\"700\" >rum_tsvector_ops</text><text x=\"662\" y=\"128\" class=\"sv s\" text-anchor=\"end\" font-size=\"14.0\" fill=\"#CFE0DC\" font-weight=\"600\" >词位信息</text><rect x=\"48\" y=\"162\" width=\"614\" height=\"38\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"62\" y=\"187\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"600\" >addInfo：lexeme 的位置</text><rect x=\"48\" y=\"208\" width=\"614\" height=\"38\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"62\" y=\"233\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"600\" >换来：&lt;=&gt; 相关性排名</text><rect x=\"48\" y=\"254\" width=\"614\" height=\"38\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"62\" y=\"279\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"600\" >换来：短语搜索与 prefix search</text><text x=\"48\" y=\"316\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >典型：WHERE fts @@ q ORDER BY fts &lt;=&gt; q LIMIT N</text><rect x=\"720\" y=\"96\" width=\"650\" height=\"232\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"720\" y=\"96\" width=\"650\" height=\"50\" rx=\"2\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1.0\" /><text x=\"738\" y=\"128\" class=\"sv mono\" text-anchor=\"start\" font-size=\"16.5\" fill=\"#FFFFFF\" font-weight=\"700\" >rum_tsvector_addon_ops</text><text x=\"1352\" y=\"128\" class=\"sv s\" text-anchor=\"end\" font-size=\"14.0\" fill=\"#CFE0DC\" font-weight=\"600\" >附加列信息</text><rect x=\"738\" y=\"162\" width=\"614\" height=\"38\" rx=\"2\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1.0\" /><text x=\"752\" y=\"187\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#2F7A66\" font-weight=\"600\" >addInfo：绑定的 timestamp / 数值</text><rect x=\"738\" y=\"208\" width=\"614\" height=\"38\" rx=\"2\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1.0\" /><text x=\"752\" y=\"233\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#2F7A66\" font-weight=\"600\" >换来：按附加列距离排序</text><rect x=\"738\" y=\"254\" width=\"614\" height=\"38\" rx=\"2\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1.0\" /><text x=\"752\" y=\"279\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#2F7A66\" font-weight=\"600\" >需要：多列索引 + attach / to</text><text x=\"738\" y=\"316\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >典型：WHERE t @@ q ORDER BY d &lt;=&gt; 常量 LIMIT N</text><rect x=\"30\" y=\"344\" width=\"1340\" height=\"76\" rx=\"2\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1.0\" /><text x=\"50\" y=\"372\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#AE8A3E\" font-weight=\"700\" >TODO：Allow multiple additional info (lexemes positions + timestamp)</text><text x=\"50\" y=\"400\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >工程含义：同时要相关性与时间新鲜度，通常要在 opclass 之间取舍，或用额外索引 / 业务排序组合处理。</text></svg>","ctrl":null},{"eyebrow":"11 · 写入","title":"一行文本，摊成一批 posting 项","lede":"build 用红黑树批量聚合减少随机写；单行 insert 直接面对 leaf tuple 扩展与 posting tree 分叉。","caption":"图：上下两条泳道分别是 rumbuild 与 ruminsert 的调用链，箭头只表示先后顺序。","bridge":"这条分叉值得动手演示一遍：给它不同的 opclass 和项数，看它什么时候长出树。","notes":"现在看信息是怎么被写进去的。CREATE INDEX 走 rumbuild：初始化状态、建 metapage、扫描堆表，把每行交给 rumExtractEntries 抽 entry，再进 BuildAccumulator。这个累加器在 rumbulk.c 里基于红黑树，把同一个 entry 的 posting 项先聚合起来，目的很单纯——减少随机写。批量建完再 rumEntryInsert、rumUpdateStats。单行 INSERT 或 UPDATE 走 ruminsert：同样先抽 entry，但直接进 rumEntryInsert 这个分叉点。原 entry 不存在，构造新的 leaf tuple；存在而且 posting list 还放得下，就扩展 leaf tuple；放不下，就创建或维护 posting tree。createPostingTree 和相关页面修改都用 generic WAL 记录，这也是官方说写入慢于 GIN 的直接原因。你把这些连起来，就明白第 4 页那句「写放大」不是抽象说法：一行文本被 opclass 拆成多个 lexeme，每个 lexeme 一条 posting 项，每条还可能带 addInfo，一次业务写入对应的是一批结构维护。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"30\" y=\"18\" width=\"1340\" height=\"44\" rx=\"2\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.0\" /><text x=\"50\" y=\"46\" class=\"sv mono\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#FFFFFF\" font-weight=\"700\" >CREATE  ORDER BY index_key operator constant 形式的扫描。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><text x=\"30\" y=\"34\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"700\" >扫描初始化与取数（src/rumscan.c · src/rumget.c）</text><rect x=\"30\" y=\"50\" width=\"315\" height=\"118\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"30\" y=\"50\" width=\"315\" height=\"6\" rx=\"0\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.0\" /><text x=\"46\" y=\"82\" class=\"sv mono\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" >rumbeginscan()</text><text x=\"46\" y=\"112\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"600\" >RelationGetIndexScan</text><text x=\"46\" y=\"140\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >分配 RumScanOpaqueData、initRumState</text><line x1=\"345\" y1=\"109\" x2=\"369.4\" y2=\"109\" stroke=\"#245A6B\" stroke-width=\"1.8\" /><polygon points=\"375,109 368,105.15 368,112.85\" fill=\"#245A6B\" /><rect x=\"375\" y=\"50\" width=\"315\" height=\"118\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"375\" y=\"50\" width=\"315\" height=\"6\" rx=\"0\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1.0\" /><text x=\"391\" y=\"82\" class=\"sv mono\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" >rumrescan()</text><text x=\"391\" y=\"112\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"600\" >rumNewScanKey / rumFillScanKey</text><text x=\"391\" y=\"140\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >调 extractQueryFn 拆 query、填 scan entry</text><line x1=\"690\" y1=\"109\" x2=\"714.4\" y2=\"109\" stroke=\"#245A6B\" stroke-width=\"1.8\" /><polygon points=\"720,109 713,105.15 713,112.85\" fill=\"#245A6B\" /><rect x=\"720\" y=\"50\" width=\"315\" height=\"118\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"720\" y=\"50\" width=\"315\" height=\"6\" rx=\"0\" fill=\"#74A5AD\" stroke=\"#74A5AD\" stroke-width=\"1.0\" /><text x=\"736\" y=\"82\" class=\"sv mono\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" >startScan()</text><text x=\"736\" y=\"112\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"600\" >entryGetItem / scanPostingTree</text><text x=\"736\" y=\"140\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >推进每个 entry 的 posting 游标</text><line x1=\"1035\" y1=\"109\" x2=\"1059.4\" y2=\"109\" stroke=\"#245A6B\" stroke-width=\"1.8\" /><polygon points=\"1065,109 1058,105.15 1058,112.85\" fill=\"#245A6B\" /><rect x=\"1065\" y=\"50\" width=\"315\" height=\"118\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"1065\" y=\"50\" width=\"315\" height=\"6\" rx=\"0\" fill=\"#A4C4C6\" stroke=\"#A4C4C6\" stroke-width=\"1.0\" /><text x=\"1081\" y=\"82\" class=\"sv mono\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" >判断与排序</text><text x=\"1081\" y=\"112\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"600\" >callConsistentFn / keyGetOrdering</text><text x=\"1081\" y=\"140\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >一致性与基于 addInfo 的距离计算</text><line x1=\"685\" y1=\"172\" x2=\"685\" y2=\"209.6\" stroke=\"#245A6B\" stroke-width=\"2.0\" /><polygon points=\"685,216 680.6,208 689.4,208\" fill=\"#245A6B\" /><line x1=\"1035\" y1=\"172\" x2=\"1035\" y2=\"209.6\" stroke=\"#2F7A66\" stroke-width=\"2.0\" /><polygon points=\"1035,216 1030.6,208 1039.4,208\" fill=\"#2F7A66\" /><rect x=\"30\" y=\"222\" width=\"650\" height=\"140\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"50\" y=\"258\" class=\"sv mono\" text-anchor=\"start\" font-size=\"20.0\" fill=\"#245A6B\" font-weight=\"700\" >rumgetbitmap()</text><text x=\"50\" y=\"292\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >结果写进 TIDBitmap，外层走 Bitmap Heap Scan</text><text x=\"50\" y=\"328\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" >只求过滤时，这条路径与 GIN 的思路接近</text><rect x=\"700\" y=\"222\" width=\"670\" height=\"140\" rx=\"2\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"720\" y=\"258\" class=\"sv mono\" text-anchor=\"start\" font-size=\"20.0\" fill=\"#2F7A66\" font-weight=\"700\" >rumgettuple()</text><text x=\"720\" y=\"292\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >按 ordering operator 逐条返回，能更早满足 LIMIT</text><text x=\"720\" y=\"328\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" >amgettuple + amcanorderbyop = true 是基础</text><rect x=\"30\" y=\"378\" width=\"1340\" height=\"44\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"50\" y=\"406\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"600\" >PostgreSQL 索引 AM 文档：支持 ordering operator 的方法需设置 amcanorderbyop，以处理 ORDER BY index_key operator constant</text></svg>","ctrl":null},{"eyebrow":"14 · 链路演示","title":"亲手放一遍：GIN 与 RUM 差在哪几步","lede":"选查询形态、调示意候选规模，逐段播放；橙色是必须回表与全量排序的代价，青绿是索引内提前兑现的收益。","caption":"","bridge":"链路能早停，不代表维护可以省——接着看 VACUUM 在清什么。","notes":"这一页请你自己动手。上面一行是 GIN，下面一行是 RUM，都是五步。选「相关性 Top-N」，然后播放：前两步两边几乎一样，都是索引过滤、拿到候选；到第三步开始分岔，GIN 必须回表把 tsvector 取出来，RUM 的 posting 里已经带着词位信息；第四步 GIN 要对全部候选算距离再排序，RUM 用 keyGetOrdering 在索引层算；到第五步，GIN 的 LIMIT 才终于生效，RUM 却可以更早返回前 N 条。你把查询形态切到「只要包含过滤」，会发现播放到第二步就停了——因为 addInfo 根本用不上，这时候 GIN 的轻量结构反而更合适。切到「时间新鲜度 Top-N」，对应的是 addon opclass 把 timestamp 附着到 posting；切到「短语搜索」，对应词位相邻关系在索引内判断；切到「热词 / 超大候选集」，请留意结论是「收益要靠实测」，不是自动变快。滑块只是教学示意，不代表任何实测性能。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><g id=\"animQ\"><text x=\"30\" y=\"44\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#BE653B\" font-weight=\"700\" >GIN · 过滤之后还要排序</text><text x=\"30\" y=\"218\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#2F7A66\" font-weight=\"700\" >RUM · 索引层参与排序</text><rect x=\"170\" y=\"62\" width=\"216\" height=\"118\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" class=\"qbox\" data-step=\"1\" data-kind=\"info\"/><text x=\"184\" y=\"96\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"700\" >① 索引过滤</text><text x=\"184\" y=\"124\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#245A6B\" font-weight=\"600\" >key -&gt; TID</text><text x=\"184\" y=\"150\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >@@ 得到候选集合</text><text x=\"184\" y=\"170\" class=\"sv mono\" text-anchor=\"start\" font-size=\"10.0\" fill=\"#89938F\" font-weight=\"400\" >STEP 1</text><line x1=\"386\" y1=\"121\" x2=\"406.4\" y2=\"121\" stroke=\"#245A6B\" stroke-width=\"1.8\" class=\"qar\" data-step=\"2\"/><polygon points=\"412,121 405,117.15 405,124.85\" fill=\"#245A6B\" stroke=\"#245A6B\" class=\"qar\" data-step=\"2\"/><rect x=\"412\" y=\"62\" width=\"216\" height=\"118\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" class=\"qbox\" data-step=\"2\" data-kind=\"info\"/><text x=\"426\" y=\"96\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"700\" >② 收集候选 TID</text><text x=\"426\" y=\"124\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#245A6B\" font-weight=\"600\" >posting list / tree</text><text x=\"426\" y=\"150\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fil ke=\"#245A6B\" class=\"qar\" data-step=\"2\"/><rect x=\"412\" y=\"238\" width=\"216\" height=\"118\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" class=\"qbox\" data-step=\"2\" data-kind=\"gain\"/><text x=\"426\" y=\"272\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"700\" >② posting 带 addInfo</text><text x=\"426\" y=\"300\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#245A6B\" font-weight=\"600\" >词位或附加列</text><text x=\"426\" y=\"326\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >信息已经在索引里</text><text x=\"426\" y=\"346\" class=\"sv mono\" text-anchor=\"start\" font-size=\"10.0\" fill=\"#89938F\" font-weight=\"400\" >STEP 2</text><line x1=\"628\" y1=\"297\" x2=\"648.4\" y2=\"297\" stroke=\"#245A6B\" stroke-width=\"1.8\" class=\"qar\" data-step=\"3\"/><polygon points=\"654,297 647,293.15 647,300.85\" fill=\"#245A6B\" stroke=\"#245A6B\" class=\"qar\" data-step=\"3\"/><rect x=\"654\" y=\"238\" width=\"216\" height=\"118\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" class=\"qbox\" data-step=\"3\" data-kind=\"gain\"/><text x=\"668\" y=\"272\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"700\" >③ 索引内 consistent</text><text x=\"668\" y=\"300\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#245A6B\" font-weight=\"600\" >query 逻辑 / 短语</text><text x=\"668\" y=\"326\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >少一次全量回表</text><text x=\"668\" y=\"346\" class=\"sv mono\" text-anchor=\"start\" font-size=\"10.0\" fill=\"#89938F\" font-weight=\"400\" >STEP 3</text><line x1=\"870\" y1=\"297\" x2=\"890.4\" y2=\"297\" stroke=\"#245A6B\" stroke-width=\"1.8\" class=\"qar\" data-step=\"4\"/><polygon points=\"896,297 889,293.15 889,300.85\" fill=\"#245A6B\" stroke=\"#245A6B\" class=\"qar\" data-step=\"4\"/><rect x=\"896\" y=\"238\" width=\"216\" height=\"118\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" class=\"qbox\" data-step=\"4\" data-kind=\"gain\"/><text x=\"910\" y=\"272\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"700\" >④ 距离在索引层算</text><text x=\"910\" y=\"300\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#245A6B\" font-weight=\"600\" >keyGetOrdering</text><text x=\"910\" y=\"326\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >&lt;=&gt; / &lt;=| / |=&gt;</text><text x=\"910\" y=\"346\" class=\"sv mono\" text-anchor=\"start\" font-size=\"10.0\" fill=\"#89938F\" font-weight=\"400\" >STEP 4</text><line x1=\"1112\" y1=\"297\" x2=\"1132.4\" y2=\"297\" stroke=\"#245A6B\" stroke-width=\"1.8\" class=\"qar\" data-step=\"5\"/><polygon points=\"1138,297 1131,293.15 1131,300.85\" fill=\"#245A6B\" stroke=\"#245A6B\" class=\"qar\" data-step=\"5\"/><rect x=\"1138\" y=\"238\" width=\"216\" height=\"118\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" class=\"qbox\" data-step=\"5\" data-kind=\"gain\"/><text x=\"1152\" y=\"272\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"700\" >⑤ 早停 Top-N</text><text x=\"1152\" y=\"300\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#245A6B\" font-weight=\"600\" >深度优先返回前 N 条</text><text x=\"1152\" y=\"326\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >LIMIT 提前兑现</text><text x=\"1152\" y=\"346\" class=\"sv mono\" text-anchor=\"start\" font-size=\"10.0\" fill=\"#89938F\" font-weight=\"400\" >STEP 5</text><text x=\"30\" y=\"414\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >教学示意：候选条数为演示输入，非实测性能数据；GIN 侧 @@ 过滤亦可走 bitmap scan，图中为逻辑链路对比。</text></g></svg>","ctrl":"<label>查询形态</label>\n<select id=\"qCase\">\n  <option value=\"filter\">只要包含过滤</option>\n  <option value=\"rank\" selected>相关性 Top-N</option>\n  <option value=\"fresh\">时间新鲜度 Top-N</option>\n  <option value=\"phrase\">短语搜索</option>\n  <option value=\"hot\">热词 / 超大候选集</option>\n</select>\n<label>示意候选</label><input type=\"range\" id=\"qCand\" min=\"100\" max=\"10000\" step=\"100\" value=\"2000\">\n<span id=\"qCandLbl\" style=\"font-family:var(--mono);font-size:13px;color:var(--accent)\">2000 条</span>\n<button class=\"btn play\" id=\"qPlay\">▶ 播放</button>\n<button class=\"btn\" id=\"qTick\">单步</button>\n<button class=\"btn\" id=\"qReset\">重置</button>\n<span class=\"out\" id=\"qOut\"></span>"},{"eyebrow":"15 · 维护","title":"VACUUM 清的是 posting 里的死 TID","lede":"rumbulkdelete 沿 entry page、posting list、posting tree 逐层清理，最后刷新统计。","caption":"图：左侧是 rumvacuum.c 的调用链，右侧是清理动作与 DBA 的四项观察点。","bridge":"把代价、结构、读写和维护都摆齐了，就可以横向比较四种方案。","notes":"很多人以为倒排索引的 VACUUM 就是「把没用的 key 删掉」，RUM 不是。src/rumvacuum.c 里，rumbulkdelete 先走 rumVacuumEntryPage，再 rumVacuumPostingList，接着收集所有 posting tree 的 root，交给 rumVacuumPostingTree；树里面还有 rumVacuumPostingTreeLeaves、rumDeletePage 这些页面级清理逻辑。rumvacuumcleanup 则做可选的全扫和统计刷新，最后 rumUpdateStats。也就是说，维护的重点是把 posting list 和 posting tree 里的死 TID 摘掉，而不是简单地删 key。这件事对 DBA 的含义很直接：高更新表上要盯索引膨胀、autovacuum 周期、WAL 量、索引体积，还要用 pg_stat_user_indexes 和查询计划确认读侧是否真的还在受益；升级版本前别只编译，要跑 installcheck 或回归测试，因为 rum 里有不少 PostgreSQL 版本适配文件。RUM 从来不是「建完不用管」的外挂。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><text x=\"30\" y=\"34\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"700\" >src/rumvacuum.c 的清理路径</text><rect x=\"30\" y=\"50\" width=\"480\" height=\"56\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"46\" y=\"84\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"700\" >rumbulkdelete()</text><line x1=\"270\" y1=\"106\" x2=\"270\" y2=\"113.2\" stroke=\"#245A6B\" stroke-width=\"1.6\" /><polygon points=\"270,118 266.7,112 273.3,112\" fill=\"#245A6B\" /><rect x=\"30\" y=\"118\" width=\"480\" height=\"56\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"46\" y=\"152\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"700\" >rumVacuumEntryPage()</text><line x1=\"270\" y1=\"174\" x2=\"270\" y2=\"181.2\" stroke=\"#245A6B\" stroke-width=\"1.6\" /><polygon points=\"270,186 266.7,180 273.3,180\" fill=\"#245A6B\" /><rect x=\"30\" y=\"186\" width=\"480\" height=\"56\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"46\" y=\"220\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"700\" >rumVacuumPostingList()</text><line x1=\"270\" y1=\"242\" x2=\"270\" y2=\"249.2\" stroke=\"#245A6B\" stroke-width=\"1.6\" /><polygon points=\"270,254 266.7,248 273.3,248\" fill=\"#245A6B\" /><rect x=\"30\" y=\"254\" width=\"480\" height=\"56\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"46\" y=\"288\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"700\" >collect posting tree roots</text><line x1=\"270\" y1=\"310\" x2=\"270\" y2=\"317.2\" stroke=\"#245A6B\" stroke-width=\"1.6\" /><polygon points=\"270,322 266.7,316 273.3,316\" fill=\"#245A6B\" /><rect x=\"30\" y=\"322\" width=\"480\" height=\"56\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"46\" y=\"356\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"700\" >rumVacuumPostingTree()</text><rect x=\"550\" y=\"20\" width=\"820\" height=\"168\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"550\" y=\"20\" width=\"820\" height=\"42\" rx=\"2\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.0\" /><text x=\"566\" y=\"47\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#FFFFFF\" font-weight=\"600\" >清理的是 posting，不是简单删 entry key</text><rect x=\"566\" y=\"82.0\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"0\" /><text x=\"580\" y=\"89.55\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >从 posting list / tree 中移除已死 TID，再更新统计信息</text><rect x=\"566\" y=\"112.0\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"0\" /><text x=\"580\" y=\"119.55\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >rumvacuumcleanup()：可选全扫 / 统计刷新 → rumUpdateStats()</text><rect x=\"566\" y=\"142.0\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"0\" /><text x=\"580\" y=\"149.55\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >posting tree 另有 rumVacuumPostingTreeLeaves() / rumDeletePage()</text><rect x=\"550\" y=\"204\" width=\"820\" height=\"186\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"550\" y=\"204\" width=\"820\" height=\"42\" rx=\"2\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1.0\" /><text x=\"566\" y=\"231\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#FFFFFF\" font-weight=\"600\" >DBA 要盯的四件事</text><rect x=\"566\" y=\"266.0\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"0\" /><text x=\"580\" y=\"273.55\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >高更新表上的索引膨胀与 autovacuum 周期</text><rect x=\"566\" y=\"296.0\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"0\" /><text x=\"580\" y=\"303.55\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >insert / update TPS、WAL 量、索引体积的变化</text><rect x=\"566\" y=\"326.0\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"0\" /><text x=\"580\" y=\"333.55\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >pg_stat_user_indexes 与查询计划是否还走索引排序</text><rect x=\"566\" y=\"356.0\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"0\" /><text x=\"580\" y=\"363.55\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >版本升级前跑 installcheck / regression tests</text><text x=\"30\" y=\"416\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >RUM 不是「建完不用管」的全文检索外挂：读侧收益要持续拿写侧与维护成本去换。</text></svg>","ctrl":null},{"eyebrow":"16 · 对比","title":"不是谁淘汰谁，是各管一段","lede":"RUM 与 GIN 是过滤与排序的分工；B-tree 是另一类问题；外部引擎牺牲部分一致性换搜索产品能力。","caption":"图：五种维度下的四种方案对照，从目标、映射、排序、写入到适合与不适合场景。","bridge":"表看完，下一个问题自然是：怎么判断自己有没有拿到这份收益？","notes":"把四种方案摆在一起，关系就清楚了。RUM 和 GIN 不是谁淘汰谁：GIN 是倒排过滤的通用基础设施，结构轻、写入代价相对低；RUM 是当过滤之后的排序或短语判断成了瓶颈时，把更多局部信息搬进 posting。B-tree 完全在另一类问题上——如果查询是 created_at BETWEEN 什么什么 ORDER BY created_at LIMIT 20，B-tree 通常最直接，你没必要引入倒排索引。外部搜索引擎能提供复杂相关性、分词、高亮、聚合这些搜索产品能力，代价是同步链路、双写、延迟和一致性设计；而 RUM 最大的底气，是全程留在 PostgreSQL 事务内一致。所以选型的问法不该是「哪个更快」，而是「我的查询卡在过滤、排序，还是搜索体验」，以及「我愿不愿意为这份能力付写入和运维的账」。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"30\" y=\"18\" width=\"1340\" height=\"394\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"30\" y=\"18\" width=\"1340\" height=\"42\" rx=\"2\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.0\" /><text x=\"44\" y=\"43.55\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#FFFFFF\" font-weight=\"600\" >维度</text><text x=\"224\" y=\"43.55\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#FFFFFF\" font-weight=\"600\" >RUM</text><text x=\"524\" y=\"43.55\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#FFFFFF\" font-weight=\"600\" >GIN</text><text x=\"794\" y=\"43.55\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#FFFFFF\" font-weight=\"600\" >B-tree</text><text x=\"1064\" y=\"43.55\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#FFFFFF\" font-weight=\"600\" >外部搜索引擎</text><line x1=\"30\" y1=\"104\" x2=\"1370\" y2=\"104\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"44\" y=\"86.27\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.2\" fill=\"#1B2B33\" font-weight=\"600\" >主要目标</text><text x=\"224\" y=\"86.27\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.2\" fill=\"#46585F\" font-weight=\"400\" >倒排过滤 + 排名 / 短语 / 附加列排序</text><text x=\"524\" y=\"86.27\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.2\" fill=\"#46585F\" font-weight=\"400\" >倒排过滤</text><text x=\"794\" y=\"86.27\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.2\" fill=\"#46585F\" font-weight=\"400\" >标量等值、范围、天然有序</text><text x=\"1064\" y=\"86.27\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.2\" fill=\"#46585F\" font-weight=\"400\" >复杂全文检索、分词、相关性</text><rect x=\"30\" y=\"104\" width=\"1340\" height=\"44\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"none\" stroke-width=\"0\" /><line x1=\"30\" y1=\"148\" x2=\"1370\" y2=\"148\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"44\" y=\"130.27\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.2\" fill=\"#1B2B33\" font-weight=\"600\" >基本映射</text><text x=\"224\" y=\"130.27\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.2\" fill=\"#46585F\" font-weight=\"400\" >key -&gt; (TID, addInfo)</text><text x=\"524\" y=\"130.27\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.2\" fill=\"#46585F\" font-weight=\"400\" >key -&gt; TID</text><text x=\"794\" y=\"130.27\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.2\" fill=\"#46585F\" font-weight=\"400\" >value -&gt; TID</text><text x=\"1064\" y=\"130.27\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.2\" fill=\"#46585F\" font-weight=\"400\" >term -&gt; document / posting</text><line x1=\"30\" y1=\"192\" x2=\"1370\" y2=\"192\" stroke=\"#D9D5
