der By；看 LIMIT N 是不是真的更早返回；量 insert/update TPS、WAL、autovacuum 时间和索引体积；再用 RUM 的 page inspect 函数看看页面形态是否符合预期。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"30\" y=\"20\" width=\"650\" height=\"238\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"30\" y=\"20\" width=\"650\" height=\"42\" rx=\"2\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1.0\" /><text x=\"46\" y=\"47\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#FFFFFF\" font-weight=\"600\" >收益最大的三个条件（原文归纳）</text><rect x=\"46\" y=\"117.0\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"0\" /><text x=\"60\" y=\"124.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >候选集大，但最终只要 Top-N</text><rect x=\"46\" y=\"147.0\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"0\" /><text x=\"60\" y=\"154.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >排名 / 短语所需信息能作为 addInfo 放进索引</text><rect x=\"46\" y=\"177.0\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"0\" /><text x=\"60\" y=\"184.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >写入 / 更新频率没高到吞掉读侧收益</text><rect x=\"710\" y=\"20\" width=\"660\" height=\"238\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"710\" y=\"20\" width=\"660\" height=\"42\" rx=\"2\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.0\" /><text x=\"726\" y=\"47\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#FFFFFF\" font-weight=\"600\" >工程上更可靠：自己测这四项</text><rect x=\"726\" y=\"102.0\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"0\" /><text x=\"740\" y=\"109.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fi ...) ORDER BY a <=> 同一个 tsquery LIMIT 10，前面加 EXPLAIN (ANALYZE, BUFFERS, COSTS OFF)。这三个验证点请记牢：计划里到底有没有用上 RUM 索引；ORDER BY a <=> tsquery 是不是由索引路径支持，而不是外层再排一次；以及小表上优化器很可能直接选顺序扫描，验证索引能力时可以临时 SET enable_seqscan = off，但千万别把这个设置带进生产。还有一点我想特意说明：原文没有启动本机 PostgreSQL 实例执行这些 SQL，所以这里不展示任何「本机实测输出」——图上不编数字，是我对这节课的基本要求。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"30\" y=\"18\" width=\"780\" height=\"392\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"48\" y=\"47\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" >6.1 基础全文检索排名 · 参照 rum/README.md 与 sql/*.sql</text><line x1=\"48\" y1=\"57\" x2=\"792\" y2=\"57\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"50\" y=\"81.49382716049382\" class=\"sv mono\" text-anchor=\"start\" font-size=\"10.5\" fill=\"#1B2B33\" font-weight=\"400\" >CREATE EXTENSION IF NOT EXISTS rum;</text><text x=\"50\" y=\"98.49382716049382\" class=\"sv mono\" text-anchor=\"start\" font-size=\"10.5\" fill=\"#1B2B33\" font-weight=\"400\" >CREATE TABLE test_rum (</text><text x=\"50\" y=\"115.49382716049382\" class=\"sv mono\" text-anchor=\"start\" font-size=\"10.5\" fill=\"#1B2B33\" font-weight=\"400\" >  id bigserial PRIMARY KEY, t text, a tsvector</text><text x=\"50\" y=\"132.49382716049382\" class=\"sv mono\" text-anchor=\"start\" font-size=\"10.5\" fill=\"#1B2B33\" font-weight=\"400\" >);</text><text x=\"50\" y=\"149.49382716049382\" class=\"sv mono\" text-anchor=\"start\" font-size=\"10.5\" fill=\"#1B2B33\" font-weight=\"400\" >CREATE TRIGGER tsvectorupdate BEFORE INSERT OR UPDATE</text><text x=\"50\" y=\"166.49382716049382\" class=\"sv mono\" text-anchor=\"start\" font-size=\"10.5\" fill=\"#1B2B33\" font-weight=\"400\" >ON test_rum FOR EACH ROW EXECUTE PROCEDURE</text><text x=\"50\" y=\"183.49382716049385\" class=\"sv mono\" text-anchor=\"start\" font-size=\"10.5\" fill=\"#1B2B33\" font-weight .4938271604939\" class=\"sv mono\" text-anchor=\"start\" font-size=\"10.5\" fill=\"#1B2B33\" font-weight=\"400\" >ORDER BY a &lt;=&gt; to_tsquery(&#x27;english&#x27;,&#x27;beautiful | place&#x27;)</text><text x=\"50\" y=\"387.4938271604939\" class=\"sv mono\" text-anchor=\"start\" font-size=\"10.5\" fill=\"#1B2B33\" font-weight=\"400\" >LIMIT 10;</text><rect x=\"840\" y=\"18\" width=\"530\" height=\"250\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"840\" y=\"18\" width=\"530\" height=\"42\" rx=\"2\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.0\" /><text x=\"856\" y=\"45\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#FFFFFF\" font-weight=\"600\" >三个验证点</text><rect x=\"856\" y=\"121.0\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"0\" /><text x=\"870\" y=\"128.55\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >计划里是否真的用上了 RUM 索引</text><rect x=\"856\" y=\"151.0\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"0\" /><text x=\"870\" y=\"158.55\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >ORDER BY a &lt;=&gt; tsquery 是否由索引路径支持</text><rect x=\"856\" y=\"181.0\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"0\" /><text x=\"870\" y=\"188.55\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >小表可能被优化器选顺序扫描，可临时关 seqscan</text><rect x=\"840\" y=\"282\" width=\"530\" height=\"128\" rx=\"2\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1.0\" /><text x=\"858\" y=\"312\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#AE8A3E\" font-weight=\"700\" >不要伪造输出</text><text x=\"858\" y=\"342\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >原文未启动本机 PostgreSQL 实例执行，</text><text x=\"858\" y=\"368\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >因此这里不提供任何「本机实测结果」。</text><text x=\"30\" y=\"426\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >SET enable_seqscan = off 只用于验证索引能力，不要带到生产。</text></svg>","ctrl":null},{"eyebrow":"19 · 实操二","title":"第二个 DEMO：把时间附到 posting 上","lede":"attach / to 绑定附加列，用 d <=> 常量排序；再用 page inspect 函数反过来验证结构。","caption":"图：左为 addon 索引与查询，右为页面查看函数，下方是三条使用边界。","bridge":"会写 SQL 之后，真正的分水岭是三个角色各自守住什么。","notes":"第二个 DEMO 解决「全文过滤 + 按时间新鲜度排序」。表里有 tsvector 列 t 和 timestamp 列 d，建索引时写 USING rum (t rum_tsvector_addon_ops, d) WITH (attach = 'd', to = 't')。这句话的含义是：把 d 的值附着到 t 的 posting 项里，于是 ORDER BY d <=> 某个时间常量 可以在索引层按距离取最近的几条。三条边界要注意：addon opclass 必须和附加列一起建多列索引，attach 和 to 都得配；如果想用 order_by_attach，附加列不能是 pass-by-reference 类型，时间戳、整数、浮点这类按值类型更适合，这条正是官方 README 的硬限制；还有就是低层页面函数，除了 metapage 和 root block，entry leaf 和 data page 的块号完全取决于数据分布和 split 历史，正确姿势是先用 rum_page_opaque_info 看 flags，再挑对应函数，别默认 block 1 就是叶子。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"30\" y=\"18\" width=\"660\" height=\"244\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"48\" y=\"47\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" >6.2 全文过滤 + timestamp 距离排序</text><line x1=\"48\" y1=\"57\" x2=\"672\" y2=\"57\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"50\" y=\"80.82042648709316\" class=\"sv mono\" text-anchor=\"start\" font-size=\"9.8\" fill=\"#1B2B33\" font-weight=\"400\" >CREATE TABLE tsts (</text><text x=\"50\" y=\"96.72951739618406\" class=\"sv mono\" text-anchor=\"start\" font-size=\"9.8\" fill=\"#1B2B33\" font-weight=\"400\" >  id int, t tsvector, d timestamp</text><text x=\"50\" y=\"112.63860830527497\" class=\"sv mono\" text-anchor=\"start\" font-size=\"9.8\" fill=\"#1B2B33\" font-weight=\"400\" >);</text><text x=\"50\" y=\"128.54769921436588\" class=\"sv mono\" text-anchor=\"start\" font-size=\"9.8\" fill=\"#1B2B33\" font-weight=\"400\" >CREATE INDEX tsts_rum_idx</text><text x=\"50\" y=\"144.45679012345678\" class=\"sv mono\" text-anchor=\"start\" font-size=\"9.8\" fill=\"#1B2B33\" font-weight=\"400\" >  ON tsts USING rum (t rum_tsvector_addon_ops, d)</text><text x=\"50\" y=\"160.3658810325477\" class=\"sv mono\" text-anchor=\"start\" font-size=\"9.8\" fill=\"#1B2B33\" font-weight=\"400\" >  WITH (attach = &#x27;d&#x27;, to = &#x27;t&#x27;);</text><text x=\"50\" y=\"176.27497194163863\" class=\"sv mono\" text-anchor=\"start\" font-size=\"9.8\" fill=\"#1B2B33\" font-weight=\"400\" >EXPLAIN (ANALYZE, BUFFERS, COSTS OFF)</text><text x=\"50\" y=\"192.1840628507295\" class=\"sv mono\" text-anchor=\"start\" font-size=\"9.8\" fill=\"#1B2B33\" font-weight=\"400\" >SELECT id, d, d &lt;=&gt; timestamp &#x27;2016-05-16 14:21:25&#x27;</text><text x=\"50\" y=\"208.09315375982044\" class=\"sv mono\" text-anchor=\"start\" font-size=\"9.8\" fill=\"#1B2B33\" font-weight=\"400\" >FROM tsts WHERE t @@ to_tsquery(&#x27;simple&#x27;,&#x27;wr &amp; qh&#x27;)</text><text x=\"50\" y=\"224.00224466891135\" class=\"sv mono\" text-anchor=\"start\" font-size=\"9.8\" fill=\"#1B2B33\" font-weight=\"400\" >ORDER BY d &lt;=&gt; timestamp &#x27;2016-05-16 14:21:25&#x27;</text><text x=\"50\" y=\"239.91133557800225\" class=\"sv mono\" text-anchor=\"start\" font-size=\"9.8\" fill=\"#1B2B33\" font-weight=\"400\" >LIMIT 5;</text><rect x=\"710\" y=\"18\" width=\"660\" height=\"244\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"728\" y=\"47\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" >6.3 低层页面 inspect</text><line x1=\"728\" y1=\"57\" x2=\"1352\" y2=\"57\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"730\" y=\"83.00274348422496\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#1B2B33\" font-weight=\"400\" >SELECT * FROM rum_metapage_info(&#x27;idx&#x27;, 0);</text><text x=\"730\" y=\"102.44718792866941\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#1B2B33\" font-weight=\"400\" >SELECT * FROM rum_page_opaque_info(&#x27;idx&#x27;, 1);</text><text x=\"730\" y=\"121.89163237311385\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#1B2B33\" font-weight=\"400\" >SELECT * FROM rum_leaf_entry_page_items(&#x27;idx&#x27;, 1)</text><text x=\"730\" y=\"141.3360768175583\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#1B2B33\" font-weight=\"400\" >  LIMIT 20;</text><text x=\"730\" y=\"160.78052126200274\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#1B2B33\" font-weight=\"400\" ></text><text x=\"730\" y=\"180.22496570644716\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#1B2B33\" font-weight=\"400\" >-- 先看 flags，再选 entry leaf / data leaf</text><text x=\"730\" y=\"199.66941015089162\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#1B2B33\" font-weight=\"400\" >-- 对应函数：</text><text x=\"730\" y=\"219.11385459533605\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#1B2B33\" font-weight=\"400\" >--   rum_internal_entry_page_items()</text><text x=\"730\" y=\"238.5582990397805\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#1B2B33\" font-weight=\"400\" >--   rum_leaf_data_page_items()</text><rect x=\"30\" y=\"276\" width=\"1340\" height=\"136\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"30\" y=\"276\" width=\"1340\" height=\"42\" rx=\"2\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1.0\" /><text x=\"46\" y=\"303\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#FFFFFF\" font-weight=\"600\" >三条容易踩的边界</text><rect x=\"46\" y=\"335.3333333333333\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"0\" /><text x=\"60\" y=\"342.7083333333333\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >rum_tsvector_addon_ops 必须和附加列一起建多列索引；WITH (attach=&#x27;d&#x27;, to=&#x27;t&#x27;) 把 d 附到 t 的 posting 项</text><rect x=\"46\" y=\"360.0\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"0\" /><text x=\"60\" y=\"367.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >order_by_attach 下附加列不能是 pass-by-reference 类型；时间戳、整数、浮点这类按值类型更适合</text><rect x=\"46\" y=\"384.66666666666663\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"0\" /><text x=\"60\" y=\"392.04166666666663\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >除 metapage 与 root block 外，entry leaf / data page 的块号不固定，取决于数据分布与 split 历史</text></svg>","ctrl":null},{"eyebrow":"20 · 实践","title":"三个角色，各守一条线","lede":"架构师管选型边界，DBA 管写入与维护账，开发者管算子语义与查询写法。","caption":"图：三栏分别对应架构师、DBA、业务开发者的实践要点，底部是共同的判断标准。","bridge":"把实践反过来读，就是七个最常见的坑。","notes":"最佳实践我按角色分，因为它其实是三条不同的防线。架构师守的是选型：只有当「全文过滤之后的排序、排名或短语」是核心路径时才优先评估 RUM；需求只是 JSONB、数组、全文的包含过滤，先用 GIN 建基线；真需要外部搜索体验，就把边界划清楚——RUM 保留 PostgreSQL 事务一致性，外部引擎提供更完整的搜索产品能力。DBA 守的是成本：建索引前评估写入强度，持续看 pg_stat_user_indexes、索引大小、autovacuum 日志、WAL 量和计划变化，升级前跑回归测试而不是只编译。业务开发者守的是语义：<=> 是 opclass 提供的距离函数，适合做工程排序特征，不是「相关性真理」；查询表达式尽量稳定，包一层复杂表达式可能就丢了索引路径；短语和前缀搜索要分清 tsvector_ops 与 hash_ops。三条线合起来，还是那句账：读侧省下的回表与排序，值不值写侧多付的。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"30\" y=\"20\" width=\"430\" height=\"300\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"30\" y=\"20\" width=\"430\" height=\"42\" rx=\"2\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"46\" y=\"47\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#FFFFFF\" font-weight=\"600\" >面向 架构师</text><rect x=\"46\" y=\"148.0\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"0\" /><text x=\"60\" y=\"155.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >只有过滤后排序 / 短语是核心路径时才评估 RUM</text><rect x=\"46\" y=\"178.0\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"0\" /><text x=\"60\" y=\"185.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >只是 JSONB / 数组 / 全文包含过滤：先用 GIN 建基线</text><rect x=\"46\" y=\"208.0\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"0\" /><text x=\"60\" y=\"215.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >需要外部搜索体验时，明确一致性边界</text><rect x=\"485\" y=\"20\" width=\"430\" height=\"300\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"485\" y=\"20\" width=\"430\" height=\"42\" rx=\"2\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1.0\" /><text x=\"501\" y=\"47\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#FFFFFF\" font-weight=\"600\" >面向 DBA</text><rect x=\"501\" y=\"148.0\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"0\" /><text x=\"515\" y=\"155.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >建索引前评估写入强度：posting 更宽，WAL 更重</text><rect x=\"501\" y=\"178.0\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"0\" /><text x=\"515\" y=\"185.35770750988144\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >高更新表持续看 pg_stat_user_indexes、索引大小、autovacuum</text><rect x=\"501\" y=\"208.0\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"0\" /><text x=\"515\" y=\"215.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >升级前跑 installcheck / regression tests，不只编译</text><rect x=\"940\" y=\"20\" width=\"430\" height=\"300\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"940\" y=\"20\" width=\"430\" height=\"42\" rx=\"2\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1.0\" /><text x=\"956\" y=\"47\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#FFFFFF\" font-weight=\"600\" >面向 业务开发者</text><rect x=\"956\" y=\"148.0\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"0\" /><text x=\"970\" y=\"155.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >&lt;=&gt; 是 opclass 的距离函数，不是通用相关性真理</text><rect x=\"956\" y=\"178.0\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"0\" /><text x=\"970\" y=\"185.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >查询表达式保持稳定，复杂包装可能丢掉索引路径</text><rect x=\"956\" y=\"208.0\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"0\" /><text x=\"970\" y=\"215.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >区分 tsvector_ops 与 hash_ops：后者不支持 prefix</text><rect x=\"30\" y=\"336\" width=\"1340\" height=\"76\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"50\" y=\"368\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"700\" >三种视角其实在回答同一个问题：读侧省下的回表与排序，值不值写侧和维护多付的账？</text><text x=\"50\" y=\"396\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"400\" >答案不在文档里，在你自己的 workload、EXPLAIN 与压测数据里。</text></svg>","ctrl":null},{"eyebrow":"21 · 常见坑","title":"七个坑，大半不会报错","lede":"把 RUM 当更快 GIN、小表误判、忽略写入账、混淆 opclass、高估 addInfo、错认 block 号、外推性能数字。","caption":"图：七个坑按语义与选型、测试与观测、结构与工具三类归组。","bridge":"坑都认全了，最后用一条可播放的决策路径把整节课收起来。","notes":"最后集中看坑，我按三类归组。语义与选型这一组最阴：把 RUM 当「更快的 GIN」、忽略 opclass 差异、以为一个 posting 能同时存下词位和时间戳——这三件事都不会抛异常，只会让你在设计阶段就走偏。测试与观测这一组是外推错误：小表上优化器可能选顺序扫描，你就误以为索引没用；只看查询延迟不看写入、WAL 和索引体积，账就少算了一半；把公开分享里的数字当承诺，更是把别人的数据、版本、硬件当成了自己的 SLA。结构与工具这一组偏操作：debug 函数的 block 号不固定，除 metapage 和 root 之外要看 flags 再选函数；多个 additional info 还在 TODO，别把它当现成能力写进方案。你会发现，七个坑里大半是「不报错的错」，所以才需要前面那些结构、边界和 EXPLAIN。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"30\" y=\"20\" width=\"430\" height=\"300\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"30\" y=\"20\" width=\"430\" height=\"42\" rx=\"2\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"46\" y=\"47\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#FFFFFF\" font-weight=\"600\" >语义与选型</text><rect x=\"46\" y=\"148.0\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"0\" /><text x=\"60\" y=\"155.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >① 把 RUM 当「更快的 GIN」：它是更重的信息布局</text><rect x=\"46\" y=\"178.0\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"0\" /><text x=\"60\" y=\"185.306640625\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.3\" fill=\"#46585F\" font-weight=\"400\" >④ 忽略 opclass：hash 不支持 prefix，addon 要配 attach/to</text><rect x=\"46\" y=\"208.0\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"0\" /><text x=\"60\" y=\"215.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >⑤ 以为能同时存词位 + timestamp 等所有 ranking 特征</text><rect x=\"485\" y=\"20\" width=\"430\" height=\"300\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"485\" y=\"20\" width=\"430\" height=\"42\" rx=\"2\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1.0\" /><text x=\"501\" y=\"47\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#FFFFFF\" font-weight=\"600\" >测试与观测</text><rect x=\"501\" y=\"148.0\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"0\" /><text x=\"515\" y=\"155.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >② 小表测试误判：优化器可能直接选顺序扫描</text><rect x=\"501\" y=\"178.0\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"0\" /><text x=\"515\" y=\"185.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >③ 只看查询延迟，不看写入、WAL 与索引体积</text><rect x=\"501\" y=\"208.0\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"0\" /><text x=\"515\" y=\"215.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >⑦ 把公开分享里的性能数字当成生产承诺</text><rect x=\"940\" y=\"20\" width=\"430\" height=\"300\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"940\" y=\"20\" width=\"430\" height=\"42\" rx=\"2\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1.0\" /><text x=\"956\" y=\"47\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#FFFFFF\" font-weight=\"600\" >结构与工具</text><rect x=\"956\" y=\"148.0\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"0\" /><text x=\"970\" y=\"155.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >⑥ 以为 debug 函数 block 号固定：先看 page flags</text><rect x=\"956\" y=\"178.0\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"0\" /><text x=\"970\" y=\"185.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >除 metapage / root 外，页位置取决于数据分布与 split</text><rect x=\"956\" y=\"208.0\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"0\" /><text x=\"970\" y=\"215.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >多个 additional info 仍在 TODO，能力边界要写进设计</text><rect x=\"30\" y=\"336\" width=\"1340\" height=\"76\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"50\" y=\"368\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#BE653B\" font-weight=\"700\" >最危险的错，是不报错的错：语义误解和性能外推，都会给你一个看起来合理的结果。</text><text x=\"50\" y=\"396\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >所以每一条坑，都要落回源码边界、opclass 选择，或者自己的 EXPLAIN 与压测。</text></svg>","ctrl":null},{"eyebrow":"22 · 决策演示","title":"四关过完，才轮到 RUM","lede":"设定需求、写入强度与附加信息条件，逐关播放；任一关不过，演示就停在该关给出的结论上。","caption":"","bridge":"最后把适合与不适合摆在同一屏上，给这次演说一个收束。","notes":"这一页把整节课压成一条可以播放的决策路径。第一关：过滤之后到底还需不需要排名、短语或者附加列排序？只要包含过滤，就停在「先用 GIN 建基线」，别为用不上的 addInfo 付写入成本。第二关：所需信息能不能作为合规的 addInfo 放进索引？选 pass-by-reference 类型就会停在这儿，因为官方明确不允许对这类附加信息建 ordering 索引。第三关：写入强度能不能承受 posting 变宽和 generic WAL？高频更新就先去压测 TPS 和 WAL 量。第四关：团队能不能接受一个非 core 扩展的构建、升级和回归责任？四关全过，结论也不是「上 RUM 一定快」，而是「可以评估，但要用自己的 EXPLAIN 验证」。你把三个下拉换几种组合，播放会停在不同的关上——这比背一张适合场景表更管用，因为它逼你按顺序问问题。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><g id=\"animD\"><rect x=\"30\" y=\"36\" width=\"310\" height=\"110\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" class=\"dnode\" data-step=\"1\"/><text x=\"46\" y=\"62\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"400\" >CHECK 01</text><text x=\"46\" y=\"92\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"700\" >过滤之后还需要</text><text x=\"46\" y=\"120\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >排名 / 短语 / 附加列排序吗？</text><line x1=\"340\" y1=\"91\" x2=\"362.4\" y2=\"91\" stroke=\"#245A6B\" stroke-width=\"1.8\" class=\"dar\" data-step=\"2\"/><polygon points=\"368,91 361,87.15 361,94.85\" fill=\"#245A6B\" stroke=\"#245A6B\" class=\"dar\" data-step=\"2\"/><line x1=\"185\" y1=\"146\" x2=\"185\" y2=\"200\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"197\" y=\"178\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" >否</text><rect x=\"30\" y=\"200\" width=\"310\" height=\"92\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" class=\"dend\" data-step=\"1\"/><text x=\"46\" y=\"228\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" >第 1 关未过</text><text x=\"46\" y=\"258\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"600\" >否 → 先用 GIN 建基线</text><rect x=\"368\" y=\"36\" width=\"310\" height=\"110\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" class=\"dnode\" data-step=\"2\"/><text x=\"384\" y=\"62\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"400\" >CHECK 02</text><text x=\"384\" y=\"92\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"700\" >所需信息能否作为</text><text x=\"384\" y=\"120\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >合规的 addInfo 放进索引？</text><line x1=\"678\" y1=\"91\" x2=\"700.4\" y2=\"91\" stroke=\"#245A6B\" stroke-width=\"1.8\" class=\"dar\" data-step=\"3\"/><polygon points=\"706,91 699,87.15 699,94.85\" fill=\"#245A6B\" stroke=\"#245A6B\" class=\"dar\" data-step=\"3\"/><line x1=\"523\" y1=\"146\" x2=\"523\" y2=\"200\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"535\" y=\"178\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" >否</text><rect x=\"368\" y=\"200\" width=\"310\" height=\"92\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" class=\"dend\" data-step=\"2\"/><text x=\"384\" y=\"228\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" >第 2 关未过</text><text x=\"384\" y= const N = D.length;
let cur = 0, autoTimer = null, autoOn = false;
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

function fit(){
  const vp = $('#viewport');
  const W = vp.clientWidth, H = vp.clientHeight;
  const s = Math.min(W/1600, H/900);
  const st = $('#stage');
  st.style.transform = 'scale(' + s + ')';
  st.style.left = ((W - 1600*s)/2) + 'px';
  st.style.top  = ((H -  900*s)/2) + 'px';
}
window.addEventListener('resize', fit);

function render(){
  $('#slides').innerHTML = D.map((d,i) =>
    '<section class="slide" id="s'+i+'">'
    + '<div class="eyebrow"><span class="num">'+String(i+1).padStart(2,'0')+' / '+String(N).padStart(2,'0')+'</span>'+d.eyebrow+'</div>'
    + '<h1 class="title">'+d.title+'</h1>'
    + '<div class="lede">'+d.lede+'</div>'
    + '<div class="rule"></div>'
    + '<div class="figwrap">'+d.svg+'</div>'
    + (d.ctrl ? '<div class="ctrls">'+d.ctrl+'</div>' : '<div class="caption">'+d.caption+'</div>')
    + '<div class="bridge"><span class="bk">承接 · NEXT</span>'+d.bridge+'</div>'
    + '<div class="footer"><div class="fbar"><i id="fbar'+i+'"></i></div>'
    + '<span class="fl">数据库筑基课 · RUM 索引结构</span>'
    + '<span class="fr">'+String(i+1).padStart(2,'0')+' / '+String(N).padStart(2,'0')+'</span></div>'
    + '</section>').join('');
}

function go(i, silent){
  i = Math.max(0, Math.min(N-1, i));
  $$('.slide').forEach((el,k)=>el.classList.toggle('on', k===i));
  cur = i;
  try{ localStorage.setItem('rum-slide', String(i)); }catch(e){}
  $('.pg').textContent = String(i+1).padStart(2,'0') + ' / ' + String(N).padStart(2,'0');
  $('#track i').style.width = ((i+1)/N*100)+'%';
  for(let k=0;k<N;k++){ const b=$('#fbar'+k); if(b) b.style.width = (k<=i?100:0)+'%'; }
  if(!silent) toast(D[i].eyebrow + ' · ' + D[i].title);
}
function next(){ if(cur<N-1) go(cur+1); else stopAuto(); }
function prev(){ if(cur>0) go(cur-1); }
function toast(s){
  const t=$('#toast'); t.textContent=s; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1700);
}
function stopAuto(){
  autoOn=false; clearInterval(autoTimer); autoTimer=null;
  $('#btnAuto').textContent='▶ 自动播放 P'; $('#btnAuto').classList.remove('act');
}
function toggleAuto(){
  if(autoOn){ stopAuto(); toast('已暂停自动播放'); return; }
  autoOn=true; $('#btnAuto').textContent='❚❚ 暂停 P'; $('#btnAuto').classList.add('act');
  autoTimer=setInterval(()=>{ if(cur<N-1) go(cur+1,true); else stopAuto(); }, 12000);
  toast('自动播放：每 12 秒一页');
}

/* ---------- 页内开窗：目录 / 讲稿 / 帮助 ---------- */
function closeDock(){ $('#dock').classList.remove('on'); }
function showDock(title, inner){
  $('#dockTitle').textContent = title;

  $('#dockBody').scrollTop = 0;

}

function notesAll(){

      +'<span class="gt">'+d.title+'</span></a>').join('') + '</div>');
}
function jump(i){ closeDock(); go(i); }
function help(){
  showDock('快捷键',
    '<h2>快捷键</h2><div class="psub">演说时的操作备忘 · 全屏后按键仍在页面底部</div><div class="keys">'
    + '<div><kbd>→ / 空格</kbd>下一页</div><div><kbd>←</kbd>上一页</div>'
    + '<div><kbd>F</kbd>全屏 / 退出全屏</div><div><kbd>G</kbd>目录</div>'
    + '<div><kbd>N</kbd>本页讲稿</div><div><kbd>T</kbd>全文讲稿</div>'
    + '<div><kbd>P</kbd>自动播放 / 暂停</div><div><kbd>1–9</kbd>直接跳页</div>'
    + '<div><kbd>Home / End</kbd>首页 / 末页</div><div><kbd>Esc</kbd>关闭开窗 / 退出全屏</div>'
    + '<div><kbd>?</kbd>本帮助</div><div><kbd>点击底部按钮</kbd>同上</div></div>');

function fs(){
  const el=document.documentElement;
  const entering=!document.body.classList.contains('immersive');
  if(entering){
    document.body.classList.add('immersive');
    $('#btnFs').textContent='退出全屏 F'; $('#btnFs').classList.add('act');
    fit();
    toast('全屏：画面铺满窗口，底部按键保留（F 或 Esc 退出）');
    try{
      const pr = el.requestFullscreen ? el.requestFullscreen() : null;
      if(pr && pr.catch) pr.catch(()=>{});
    }catch(e){}
  }else{
    document.body.classList.remove('immersive');
    $('#btnFs').textContent='全屏 F'; $('#btnFs').classList.remove('act');
    fit(); toast('已退出全屏');
    try{ if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen(); }catch(e){}
  }
}
document.addEventListener('fullscreenchange', ()=>{
  if(!document.fullscreenElement && document.body.classList.contains('immersive')){
    document.body.classList.remove('immersive');
    $('#btnFs').textContent='全屏 F'; $('#btnFs').classList.remove('act');
  }
  fit();
});

document.addEventListener('keydown', e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  const k=e.key;
  const typing=(tag==='input'||tag==='select'||tag==='textarea');
  const navKey=(k.indexOf('Arrow')===0||k===' '||k==='Home'||k==='End'||k==='PageUp'||k==='PageDown');
  if(k==='Escape'){
    if($('#dock').classList.contains('on')) closeDock();
    else if(document.body.classList.contains('immersive')) fs();
    return;
  }
  if($('#dock').classList.contains('on')){
    /* 开窗已打开时，G / N / T / ? 直接切换到对应窗口，不必先按 Esc */
    if(k==='g'||k==='G'){ e.preventDefault(); toc(); }
    else if(k==='n'||k==='N'){ e.preventDefault(); notesHere(); }
    else if(k==='t'||k==='T'){ e.preventDefault(); notesAll(); }
    else if(k==='?'||k==='h'||k==='H'){ e.preventDefault(); help(); }
    return;
  }
  if(typing && navKey) return;
  if(k==='ArrowRight'||k===' '||k==='PageDown'){ e.preventDefault(); next(); }
  else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); prev(); }
  else if(k==='f'||k==='F'){ e.preventDefault(); fs(); }
  else if(k==='g'||k==='G'){ e.preventDefault(); toc(); }
  else if(k==='n'||k==='N'){ e.preventDefault(); notesHere(); }
  else if(k==='t'||k==='T'){ e.preventDefault(); notesAll(); }
  else if(k==='p'||k==='P'){ e.preventDefault(); toggleAuto(); }
  else if(k==='?'||k==='h'||k==='H'){ e.preventDefault(); help(); }
  else if(k==='Home'){ e.preventDefault(); go(0); }
  else if(k==='End'){ e.preventDefault(); go(N-1); }
  else if(/^[1-9]$/.test(k)){ go(parseInt(k,10)-1); }
});

/* ---------- 动画 W：一行文本如何变成 posting 项（教学示意） ---------- */
const W_OPS = {
  pos:   {label:'rum_tsvector_ops', info:'词位', use:'<=> 排名 · 短语 · prefix search', col:'#245A6B'},
  addon: {label:'rum_tsvector_addon_ops', info:'d 列', use:'按 d <=> 常量排序 · 需 attach / to', col:'#2F7A66'},
  hash:  {label:'rum_tsvector_hash_ops', info:'词位', use:'key 为 hash · 不支持 prefix search', col:'#AE8A3E'}
};
let wStep=0, wTimer=null, wPlaying=false;
function wOps(){ const e=$('#wOps'); return e ? e.value : 'pos'; }
function wCount(){ const e=$('#wCount'); return e ? +e.value : 5; }
function wSetTxt(id, s){ const e=$(id); if(e) e.textContent=s; }
function wPaint(){
  const n=wCount(), op=W_OPS[wOps()], shown=Math.min(wStep,n), inline=Math.min(shown,4), over=Math.max(0,shown-4);
  for(let i=0;i<4;i++){
    const b=$('#wIn'+i), t=$('#wInT'+i);
    const on=i<inline;
    if(b){ b.setAttribute('fill', on?'#E5EFF0':'#FFFFFF'); b.setAttribute('stroke', on?'#245A6B':'#D9D5CB'); b.setAttribute('stroke-width', on?'1.8':'1.0'); }
    if(t){ t.setAttribute('fill', on?'#1B2B33':'#89938F'); t.textContent = on ? '(TID, '+op.info+')' : '空槽位'; }
  }
  for(let i=0;i<4;i++){
    const b=$('#wOv'+i), t=$('#wOvT'+i);
    const on=i<over;
    if(b){ b.setAttribute('fill', on?'#F7E9DE':'#FFFFFF'); b.setAttribute('stroke', on?'#BE653B':'#D9D5CB'); b.setAttribute('stroke-width', on?'1.8':'1.0'); }
    if(t){ t.setAttribute('fill', on?'#BE653B':'#89938F'); t.textContent = on ? 'RumItem '+(i+5) : 'data page'; }
  }
  const done = wStep>=n+1;
  const ok = n<=4;
  const a=$('#wResA'), b=$('#wResB'), ta=$('#wResAT'), tb=$('#wResBT');
  if(a){ a.setAttribute('fill', (done&&ok)?'#E4F0EA':'#FFFFFF'); a.setAttribute('stroke',(done&&ok)?'#2F7A66':'#D9D5CB'); }
  if(b){ b.setAttribute('fill', (done&&!ok)?'#F7E9DE':'#FFFFFF'); b.setAttribute('stroke',(done&&!ok)?'#BE653B':'#D9D5CB'); }
  if(ta) ta.setAttribute('fill',(done&&ok)?'#2F7A66':'#46585F');
  if(tb) tb.setAttribute('fill',(done&&!ok)?'#BE653B':'#46585F');
  wSetTxt('#wOpName', op.label);
  wSetTxt('#wOpUse', op.use);
  wSetTxt('#wCountLbl', n+' 项');
  const out=$('#wOut'); if(!out) return;
  if(wStep===0){ out.innerHTML='<b>待播放</b> 选 opclass 与示意项数，观察一行文本如何摊成多条 posting 项'; }
  else if(!done){
    out.innerHTML='<b>第 '+wStep+' / '+(n+1)+' 步</b> 写入第 '+wStep+' 个 RumItem：(heap TID, '+op.info+')（教学示意）';
  } else {
    out.innerHTML = ok
      ? '<b>结论</b> '+n+' 项放得下：内联为 posting list，读一个 entry leaf tuple 即可取到（教学示意）'
      : '<b>结论</b> '+n+' 项放不下：leaf tuple 写 RUM_TREE_POSTING 标记 + root 页号，其余进 posting tree（教学示意）';
    out.title='教学示意：容量 4 与项数均为演示用，真实阈值取决于页面剩余空间与变长编码';
  }
}
function wMax(){ return wCount()+1; }
function wPlay(){
  if(wPlaying){ wPause(); return; }
  if(wStep>=wMax()) wStep=0;
  wPlaying=true; $('#wPlay').textContent='❚❚ 暂停'; $('#wPlay').classList.add('play');
  wTimer=setInterval(()=>{ wStep++; wPaint(); if(wStep>=wMax()) wPause(); },620);
}
function wPause(){
  wPlaying=false; clearInterval(wTimer); wTimer=null;
  const b=$('#wPlay'); if(b){ b.textContent='▶ 播放'; b.classList.remove('play'); }
}
function wTick(){ if(wStep<wMax()){ wStep++; wPaint(); } }
function wReset(){ wPause(); wStep=0; wPaint(); }
function wChanged(){ wPause(); wStep=0; wPaint(); }

/* ---------- 动画 Q：GIN 与 RUM 的 Top-N 链路（教学示意） ---------- */
const Q_CASES = {
  filter:{name:'只要过滤', stop:2, msg:'只做 @@ 过滤：GIN 的 bitmap 路径就够，RUM 的 addInfo 没有用武之地'},
  rank:  {name:'相关性 Top-N', stop:5, msg:'ORDER BY fts <=> q LIMIT N：RUM 用索引内词位算距离，避免全量候选回表排序'},
  fresh: {name:'时间新鲜度 Top-N', stop:5, msg:'addon 把 timestamp 附着到 posting：ORDER BY d <=> 常量 可在索引层取最近 N 条'},
  phrase:{name:'短语搜索', stop:4, msg:'短语要词位相邻关系：rum_tsvector_ops 在索引内判断，GIN 常需回表读 tsvector 复核'},
  hot:   {name:'热词 / 超大候选集', stop:5, msg:'候选集接近全表时，排序与回表仍可能是瓶颈，收益要靠自己的数据实测'}
};
const Q_STEPS = ['索引过滤','候选 TID','回表 / 已有信息','距离计算','Top-N 返回'];
let qStep=0, qTimer=null, qPlaying=false;
function qCase(){ const e=$('#qCase'); return e ? e.value : 'rank'; }
function qCand(){ const e=$('#qCand'); return e ? +e.value : 2000; }
function qPaint(){
  const c=Q_CASES[qCase()], cand=qCand();
  $$('#animQ .qbox').forEach(b=>{
    const n=+b.getAttribute('data-step'), kind=b.getAttribute('data-kind');
    const seen=n<=qStep, reach=n<=c.stop;
    let fill='#FFFFFF', stroke='#D9D5CB', sw='1.0';
    if(seen && reach){
      fill = kind==='cost' ? '#F7E9DE' : (kind==='gain' ? '#E4F0EA' : '#E5EFF0');
      stroke = kind==='cost' ? '#BE653B' : (kind==='gain' ? '#2F7A66' : '#245A6B');
      sw='1.8';
    }
    b.setAttribute('fill',fill); b.setAttribute('stroke',stroke); b.setAttribute('stroke-width',sw);
  });
  $$('#animQ .qar').forEach(a=>{
    const n=+a.getAttribute('data-step');
    const col=(n<=qStep && n<=c.stop)?'#245A6B':'#D9D5CB';
    a.setAttribute('stroke',col);
    if(a.tagName.toLowerCase()==='polygon') a.setAttribute('fill',col);
  });
  const lb=$('#qCandLbl'); if(lb) lb.textContent=cand+' 条';
  const out=$('#qOut'); if(!out) return;
  if(qStep===0){ out.innerHTML='<b>待播放</b> 选查询形态与示意候选规模，逐段看信息缺口在哪里'; }
  else if(qStep>=c.stop){ out.innerHTML='<b>结论</b> '+c.msg+'（流程示意，非实测性能数据）'; out.title=c.msg; }
  else {
    const extra=(qStep>=3 && (qCase()==='rank'||qCase()==='fresh'||qCase()==='hot'))
      ? ' · GIN 侧需回表约 '+cand+' 条候选（示意数）' : '';
    out.innerHTML='<b>第 '+qStep+' 步 · '+Q_STEPS[qStep-1]+'</b> GIN 与 RUM 在这一段的差别'+extra;
  }
}
function qPlay(){
  if(qPlaying){ qPause(); return; }
  if(qStep>=5) qStep=0;
  qPlaying=true; $('#qPlay').textContent='❚❚ 暂停'; $('#qPlay').classList.add('play');
  qTimer=setInterval(()=>{ qStep++; qPaint(); if(qStep>=Q_CASES[qCase()].stop||qStep>=5) qPause(); },760);
}
function qPause(){
  qPlaying=false; clearInterval(qTimer); qTimer=null;
  const b=$('#qPlay'); if(b){ b.textContent='▶ 播放'; b.classList.remove('play'); }
}
function qTick(){ if(qStep<5){ qStep++; qPaint(); } }
function qReset(){ qPause(); qStep=0; qPaint(); }
function qChanged(){ qPause(); qStep=0; qPaint(); }

/* ---------- 动画 D：四关选型决策 ---------- */
const D_NEED = {no:'只要包含过滤', yes:'过滤后要排名 / 短语 / 附加列排序'};
const D_WRITE = {low:'写入强度低或中等', high:'高频 insert / update'};
const D_ADDON = {val:'按值类型且可接受扩展运维', ref:'附加列是 pass-by-reference 类型', ops:'不接受非 core 扩展的构建与回归责任'};
function dFail(){
  if($('#dNeed').value==='no') return 1;
  if($('#dAddon').value==='ref') return 2;
  if($('#dWrite').value==='high') return 3;
  if($('#dAddon').value==='ops') return 4;
  return 0;
}
const D_MSG = [
  '', '只要 @@ / @> / && 这类包含过滤：先用 GIN 建基线，别为一个用不上的 addInfo 付写入成本',
  'RUM 官方 README 明确：对 pass-by-reference 的附加信息做 ordering 行为不正确，且不允许创建；换成按值类型或调整建模',
  'posting 更宽 + generic WAL，写入、索引体积、VACUUM 都更重；先在自己的表上压测 insert/update TPS 与 WAL 量',
  'RUM 是扩展不是 core access method：版本适配、构建、installcheck 回归都要进运维流程，否则先别上生产'
];
let dStep=0, dTimer=null, dPlaying=false;
function dPaint(){
  const fail=dFail();
  $$('#animD .dnode').forEach(b=>{
    const n=+b.getAttribute('data-step'), seen=n<=dStep;
    let fill='#FFFFFF', stroke='#D9D5CB', sw='1.0';
    if(seen){ fill=(n===fail&&dStep>=fail)?'#F7E9DE':'#E5EFF0'; stroke=(n===fail&&dStep>=fail)?'#BE653B':'#245A6B'; sw='1.8'; }
    b.setAttribute('fill',fill); b.setAttribute('stroke',stroke); b.setAttribute('stroke-width',sw);
  });
  $$('#animD .dar').forEach(a=>{
    const n=+a.getAttribute('data-step');
    const col=(n<=dStep && (fail===0 || n<fail))?'#245A6B':'#D9D5CB';
    a.setAttribute('stroke',col);
    if(a.tagName.toLowerCase()==='polygon') a.setAttribute('fill',col);
  });
  $$('#animD .dend').forEach(b=>{
    const n=+b.getAttribute('data-step');
    const on=(n===fail && dStep>=fail);
    b.setAttribute('fill',on?'#F7E9DE':'#FFFFFF');
    b.setAttribute('stroke',on?'#BE653B':'#D9D5CB');
    b.setAttribute('stroke-width',on?'2.2':'1.0');
  });
  const fin=$('#dFinal');
  if(fin){ const on=(fail===0 && dStep>=4); fin.setAttribute('fill',on?'#E4F0EA':'#F1EFE9'); fin.setAttribute('stroke',on?'#2F7A66':'#D9D5CB'); }
  const ft=$('#dFinalT'); if(ft) ft.setAttribute('fill',(fail===0&&dStep>=4)?'#2F7A66':'#46585F');
  const out=$('#dOut'); if(!out) return;
  if(dStep===0){ out.innerHTML='<b>待播放</b> 设定三个条件，逐关看应该选择 GIN、RUM 还是先停在验证阶段'; }
  else if(fail>0 && dStep>=fail){ out.innerHTML='<b>第 '+fail+' 关未过</b> '+D_MSG[fail]; }
  else if(fail===0 && dStep>=4){ out.innerHTML='<b>四关全过</b> 可以评估 RUM，但结论要用 EXPLAIN (ANALYZE, BUFFERS) 在自己的数据上验证'; }
  else { out.innerHTML='<b>第 '+dStep+' 关</b> 条件成立，继续下一关（决策路径示意）'; }
}
function dPlay(){
  if(dPlaying){ dPause(); return; }
  if(dStep>=4) dStep=0;
  dPlaying=true; $('#dPlay').textContent='❚❚ 暂停'; $('#dPlay').classList.add('play');
  dTimer=setInterval(()=>{ dStep++; dPaint(); if(dStep>=dFail() && dFail()>0){ dPause(); } else if(dStep>=4){ dPause(); } },820);
}
function dPause(){
  dPlaying=false; clearInterval(dTimer); dTimer=null;
  const b=$('#dPlay'); if(b){ b.textContent='▶ 播放'; b.classList.remove('play'); }
}
function dTick(){ if(dStep<4){ dStep++; dPaint(); } }
function dReset(){ dPause(); dStep=0; dPaint(); }
function dChanged(){ dPause(); dStep=0; dPaint(); }

function init(){
  render(); fit();
  let saved=0; try{ saved=parseInt(localStorage.getItem('rum-slide')||'0',10)||0; }catch(e){}
  go(saved,true);
  $('#btnPrev').onclick=prev; $('#btnNext').onclick=next;
  $('#btnToc').onclick=toc; $('#btnNotes').onclick=notesHere;
  $('#btnAll').onclick=notesAll; $('#btnAuto').onclick=toggleAuto;
  $('#btnFs').onclick=fs; $('#btnHelp').onclick=help;
  $('#dockClose').onclick=closeDock;
  const bind=(id,fn)=>{ const el=$(id); if(el) el.onclick=fn; };
  bind('#wPlay',wPlay); bind('#wTick',wTick); bind('#wReset',wReset);
  bind('#qPlay',qPlay); bind('#qTick',qTick); bind('#qReset',qReset);
  bind('#dPlay',dPlay); bind('#dTick',dTick); bind('#dReset',dReset);
  ['wOps','wCount','qCase','qCand','dNeed','dWrite','dAddon'].forEach(id=>{
    const el=$('#'+id); if(!el) return;
    const fn = id[0]==='w' ? wChanged : (id[0]==='q' ? qChanged : dChanged);
    el.addEventListener('change', fn);
    el.addEventListener('input', fn);
  });
  wPaint(); qPaint(); dPaint();
}
document.addEventListener('DOMContentLoaded', init);
</script>
