 >② 比对 segmentby / min-max</text><rect x=\"708\" y=\"252\" width=\"328\" height=\"54\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1\" /><text x=\"872.0\" y=\"285\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#2F7A66\" font-weight=\"700\" >③ 能排除 → 整批跳过</text><rect x=\"1040\" y=\"252\" width=\"328\" height=\"54\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1\" /><text x=\"1204.0\" y=\"285\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"700\" >④ 排除不了 → 按算法解压</text><rect x=\"44\" y=\"322\" width=\"1328\" height=\"68\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"62\" y=\"350\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >绿色＝批次元数据排除，不解压、不重构行；陶橙＝必须按算法逐列解压，再用 heap_form_tuple 输出</text><text x=\"62\" y=\"378\" class=\"sv serif\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"700\" >关键不是「有没有用二进制格式」，而是「能否在解压前排除批次」</text><text x=\"44\" y=\"414\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" >动画：选择查询谓词与批次数，按播放 / 单步观察每个批次的判断结果；输出条实时汇总跳过与解压数量</text></svg>","ctrl":"<label for=\"pQuery\">查询谓词</label><select id=\"pQuery\"><option value=\"both\">device_id + time（命中元数据）</option><option value=\"device\">device_id（仅 segmentby）</option><option value=\"status\">status='WARN'（非元数据列）</option><option value=\"all\">无过滤条件（全表扫描）</option></select><label for=\"pCount\">批次数</label><input type=\"range\" id=\"pCount\" min=\"4\" max=\"8\" step=\"1\" value=\"8\"><span id=\"pCountLbl\" style=\"font-size:12.5px;color:var(--muted);font-family:var(--mono)\">8 批</span><button class=\"btn play\" id=\"pPlay\">▶ 播放</button><button class=\"btn\" id=\"pTick\">单步 →</button><button class=\"btn\" id=\"pReset\">重置</button><span class=\"out\" id=\"pOut\"></span>","anim":true},{"eyebrow":"收益代价 · 四笔账","title":"空间、IO、CPU、维护，各有一本账","lede":"紧凑只是空间维度的一句话；查询快慢取决于能不能少读、少解压、少重构行。","caption":"图 16　四个维度横向对照：左侧是 protobuf 存 bytea，右侧是 TimescaleDB 批次压缩。","bridge":"把这三种方案摆到一张表上，边界就更清楚了。","notes":"动画的结论摊开，是四笔账。空间上，protobuf 相比 JSON 确实紧凑，因为不重复字段名、用 varint；但一条条小消息塞进表里，tuple header、line pointer、varlena header、索引项这些固定开销一个不少。TimescaleDB 的空间收益来自另一套机制：多行并成一批，按列用专用算法，重复值和相邻差异被吃掉；官方文档提过 chunk 可以减少超过九成，但真实比例取决于数据分布、排序、segmentby、orderby、空值比例和批次大小，不能照搬到所有 workload。IO 上，opaque bytes 的粒度是行或 TOAST chunk，只要一个字段也可能读整段；压缩数据的粒度是批次，命中元数据能跳整批，没命中就把代价放大到一批。CPU 上，解码再快也是工作，最好的 CPU 是不用做的 CPU。写入维护上，一个简单、一个复杂，换来的是长期历史数据的空间和分析性能。所以压缩率高只说明存得小，查询快要看少读、少解压、少重构行。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40\" y=\"20\" width=\"190\" height=\"84\" rx=\"4\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1\" /><text x=\"56\" y=\"72\" class=\"sv serif\" text-anchor=\"start\" font-size=\"20.0\" fill=\"#FFFFFF\" font-weight=\"700\" >空间</text><rect x=\"240\" y=\"20\" width=\"1120\" height=\"84\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><line x1=\"782\" y1=\"34\" x2=\"782\" y2=\"90\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"256\" y=\"42\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >protobuf → bytea</text><text x=\"256\" y=\"68\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\" >比 JSON 紧凑：不重复字段名 + varint</text><text x=\"256\" y=\"92\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >但 tuple header、line pointer、索引项仍在</text><text x=\"798\" y=\"42\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >TimescaleDB 批次压缩</text><text x=\"798\" y=\"68\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#2F7A66\" font-weight=\"400\" >多行并成一批，按列用专用算法</text><text x=\"798\" y=\"92\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >真实比例取决于数据分布与批次大小</text><rect x=\"40\" y=\"116\" width=\"190\" height=\"84\" rx=\"4\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1\" /><text x=\"56\" y=\"168\" class=\"sv serif\" text-anchor=\"start\" font-size=\"20.0\" fill=\"#FFFFFF\" font-weight=\"700\" >IO</text><rect x=\"240\" y=\"116\" width=\"1120\" height=\"84\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><line x1=\"782\" y1=\"130\" x2=\"782\" y2=\"186\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"256\" y=\"138\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >protobuf → bytea</text><text x=\"256\" y=\"164\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\" >粒度是行或 TOAST chunk</text><text x=\"256\" y=\"188\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >只查一个字段也可能读整段 payload</text><text x=\"798\" y=\"138\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >TimescaleDB 批次压缩</text><text x=\"798\" y=\"164\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#2F7A66\" font-weight=\"400\" >粒度是批次</text><text x=\"798\" y=\"188\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >命中元数据跳整批；未命中放大到一批行</text><rect x=\"40\" y=\"212\" width=\"190\" height=\"84\" rx=\"4\" fill=\"#74A5AD\" stroke=\"#74A5AD\" stroke-width=\"1\" /><text x=\"56\" y=\"264\" class=\"sv serif\" text-anchor=\"start\" font-size=\"20.0\" fill=\"#1B2B33\" font-weight=\"700\" >CPU</text><rect x=\"240\" y=\"212\" width=\"1120\" height=\"84\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><line x1=\"782\" y1=\"226\" x2=\"782\" y2=\"282\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"256\" y=\"234\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >protobuf → bytea</text><text x=\"256\" y=\"260\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\" >解码速度不差，但仍是 CPU 工作</text><text x=\"256\" y=\"284\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >过滤在 payload 内就得逐行解码</text><text x=\"798\" y=\"234\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >TimescaleDB 批次压缩</text><text x=\"798\" y=\"260\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#2F7A66\" font-weight=\"400\" >批次过滤后按需解压</text><text x=\"798\" y=\"284\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >未过滤时解压与重构行成本明显</text><rect x=\"40\" y=\"308\" width=\"190\" height=\"84\" rx=\"4\" fill=\"#A4C4C6\" stroke=\"#A4C4C6\" stroke-width=\"1\" /><text x=\"56\" y=\"360\" class=\"sv serif\" text-anchor=\"start\" font-size=\"20.0\" fill=\"#1B2B33\" font-weight=\"700\" >写入维护</text><rect x=\"240\" y=\"308\" width=\"1120\" height=\"84\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><line x1=\"782\" y1=\"322\" x2=\"782\" y2=\"378\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"256\" y=\"330\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >protobuf → bytea</text><text x=\"256\" y=\"356\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\" >写入简单，应用负责兼容</text><text x=\"256\" y=\"380\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >数据库侧维护少，可查询性也少</text><text x=\"798\" y=\"330\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >TimescaleDB 批次压缩</text><text x=\"798\" y=\"356\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#2F7A66\" font-weight=\"400\" >要排序、分组、压缩、写元数据</text><text x=\"798\" y=\"380\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >还要维护压缩 chunk 与原 chunk 映射</text><rect x=\"40\" y=\"394\" width=\"1320\" height=\"30\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1\" /><text x=\"58\" y=\"414.6\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#46585F\" font-weight=\"400\" >压缩率高只说明存得小；查询快要看少读、少解压、少重构行</text></svg>"},{"eyebrow":"横向对比 · 三种方案","title":"没有一格写着「全面更好」","lede":"protobuf 强在字段兼容与跨语言，数据库列强在统计与优化器，批次压缩强在时序读取。","caption":"图 17　三种方案在六个维度上的对照矩阵。据原文「四、横向对比」整理。","bridge":"道理都懂了，落到手上该怎么做？两个最小实验。","notes":"这张表建议存下来。三列分别是：整段塞 bytea、把字段投影到关系列、数据库自定义二进制载荷。看六行：主要目标、页内形态、过滤能力、schema 演进、CPU 成本、适合场景。你会发现，没有一个格子写着「全面更好」。bytea 赢在简单和归档，输在查询；投影列赢在优化器能懂，输在你得维护两套 schema；compressed_data 赢在批次压缩和时序读取，输在通用性和升级成本。原因很直接：protobuf 强在字段兼容和跨语言互操作，数据库列强在统计、索引和优化器，TimescaleDB 强在批次压缩和时间序列读取。不要用一个层次的优势，去覆盖另一个层次的需求。选型的时候，先问「我要在哪一层做过滤」，答案基本就出来了。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40\" y=\"20\" width=\"1320\" height=\"48\" rx=\"4\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1\" /><text x=\"165.0\" y=\"50\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#FFFFFF\" font-weight=\"700\" >维度</text><text x=\"470.0\" y=\"50\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#FFFFFF\" font-weight=\"700\" >protobuf bytes → bytea</text><text x=\"825.0\" y=\"50\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#FFFFFF\" font-weight=\"700\" >投影到关系列</text><text x=\"1180.0\" y=\"50\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#FFFFFF\" font-weight=\"700\" >TimescaleDB compressed_data</text><rect x=\"40\" y=\"72\" width=\"1320\" height=\"48\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"50\" y=\"102\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"700\" >主要目标</text><text x=\"300\" y=\"102\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" >简单保存应用消息</text><text x=\"660\" y=\"102\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" >兼顾应用 schema 与 SQL 查询</text><text x=\"1010\" y=\"102\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#BE653B\" font-weight=\"400\" >压缩时序 chunk，提升分析读取</text><line x1=\"290\" y1=\"80\" x2=\"290\" y2=\"112\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><line x1=\"650\" y1=\"80\" x2=\"650\" y2=\"112\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><line x1=\"1000\" y1=\"80\" x2=\"1000\" y2=\"112\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"40\" y=\"124\" width=\"1320\" height=\"48\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"50\" y=\"154\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"700\" >页内形态</text><text x=\"300\" y=\"154\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" >普通 varlena payload</text><text x=\"660\" y=\"154\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" >普通列 + 可选 payload</text><text x=\"1010\" y=\"154\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#BE653B\" font-weight=\"400\" >自定义 varlena + 算法载荷</text><line x1=\"290\" y1=\"132\" x2=\"290\" y2=\"164\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><line x1=\"650\" y1=\"132\" x2=\"650\" y2=\"164\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><line x1=\"1000\" y1=\"132\" x2=\"1000\" y2=\"164\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"40\" y=\"176\" width=\"1320\" height=\"48\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"50\" y=\"206\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"700\" >过滤能力</text><text x=\"300\" y=\"206\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" >弱，除非建表达式索引</text><text x=\"660\" y=\"206\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" >强，字段成为列或生成列</text><text x=\"1010\" y=\"206\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#BE653B\" font-weight=\"400\" >取决于 segmentby / orderby 与元数据</text><line x1=\"290\" y1=\"184\" x2=\"290\" y2=\"216\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><line x1=\"650\" y1=\"184\" x2=\"650\" y2=\"216\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><line x1=\"1000\" y1=\"184\" x2=\"1000\" y2=\"216\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"40\" y=\"228\" width=\"1320\" height=\"48\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"50\" y=\"258\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"700\" >schema 演进</text><text x=\"300\" y=\"258\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" >field number 兼容</text><text x=\"660\" y=\"258\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" >需迁移列、生成列、索引</text><text x=\"1010\" y=\"258\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#BE653B\" font-weight=\"400\" >升级必须保持算法编号与旧载荷可读</text><line x1=\"290\" y1=\"236\" x2=\"290\" y2=\"268\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><line x1=\"650\" y1=\"236\" x2=\"650\" y2=\"268\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><line x1=\"1000\" y1=\"236\" x2=\"1000\" y2=\"268\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"40\" y=\"280\" width=\"1320\" height=\"48\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"50\" y=\"310\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"700\" >CPU 成本</text><text x=\"300\" y=\"310\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" >查字段要解码 payload</text><text x=\"660\" y=\"310\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" >普通 SQL 列访问</text><text x=\"1010\" y=\"310\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#BE653B\" font-weight=\"400\" >过滤后按需解压，未过滤时明显</text><line x1=\"290\" y1=\"288\" x2=\"290\" y2=\"320\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><line x1=\"650\" y1=\"288\" x2=\"650\" y2=\"320\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><line x1=\"1000\" y1=\"288\" x2=\"1000\" y2=\"320\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"40\" y=\"332\" width=\"1320\" height=\"48\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"50\" y=\"362\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"700\" >适合场景</text><text x=\"300\" y=\"362\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" >审计原文、事件归档</text><text x=\"660\" y=\"362\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" >既要留消息又要查字段</text><text x=\"1010\" y=\"362\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#BE653B\" font-weight=\"400\" >大量时序历史、冷热分层</text><line x1=\"290\" y1=\"340\" x2=\"290\" y2=\"372\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><line x1=\"650\" y1=\"340\" x2=\"650\" y2=\"372\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><line x1=\"1000\" y1=\"340\" x2=\"1000\" y2=\"372\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"40\" y=\"390\" width=\"1320\" height=\"32\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1\" /><text x=\"58\" y=\"411.425\" class=\"sv serif\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#BE653B\" font-weight=\"400\" >不要用一个层次的优势，覆盖另一个层次的需求 —— 先问「我要在哪一层做过滤」</text></svg>"},{"eyebrow":"落地 · 两个最小实验","title":"让查询模型自己站出来","lede":"一边把常查字段投影成关系列，一边用 EXPLAIN 对照「命中元数据」与「不命中」的两条计划。","caption":"图 18　左：event_log 的投影列与索引。右：metrics 的压缩设置与对照查询。均为未执行的示例 SQL。","bridge":"实验之外，把最容易踩的坑和该守的规矩一次说完。","notes":"给两个最小实验，注意当前环境没有启动 PostgreSQL 和 TimescaleDB 实例，所以这些 SQL 只是思路，没有执行结果，也别去编造一个性能数字。第一个实验：建一张 event_log，tenant_id、event_time、event_type 做成普通列，payload 用 bytea 存完整 protobuf，再给常查组合建索引。原则是 protobuf 保留原文，关系列承担读取路径。如果你非要从 payload 里解字段建表达式索引，前提是自己提供稳定的解码函数，并保证 immutable 语义，否则索引会跟真实语义漂移，尤其是 schema 版本、字段号、默认值和解码失败策略都得钉死。第二个实验：给 metrics 配好 compress_segmentby 和 compress_orderby，压缩 chunk 之后，用 EXPLAIN ANALYZE BUFFERS 跑一条命中 device_id 加时间范围的查询，再拿一条只按 status 过滤的做对照。看的不是某个固定数字，而是执行计划、buffer、解压量有没有明显差别。老 compression API 从 2.18 起被 hypercore 取代但仍受支持，本文分析的源码正是这套实现。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40\" y=\"26\" width=\"650\" height=\"344\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"40\" y=\"26\" width=\"650\" height=\"40\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"56\" y=\"52\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" >实验一 · protobuf 原文 + 关系型投影列</text><rect x=\"56\" y=\"76\" width=\"618\" height=\"196\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"70\" y=\"102\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >CREATE TABLE event_log (</text><text x=\"70\" y=\"126\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >  tenant_id   bigint NOT NULL,</text><text x=\"70\" y=\"150\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >  event_time  timestamptz NOT NULL,</text><text x=\"70\" y=\"174\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >  event_type  text NOT NULL,</text><text x=\"70\" y=\"198\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >  payload     bytea NOT NULL</text><text x=\"70\" y=\"222\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >);</text><text x=\"70\" y=\"246\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >CREATE INDEX ON event_log (tenant_id, event_time DESC);</text><text x=\"56\" y=\"296\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >原则：protobuf 保留完整消息，关系列承担读取路径</text><text x=\"56\" y=\"322\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >若必须解字段，须自提供稳定解码函数并保证 immutable 语义</text><text x=\"56\" y=\"348\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >否则表达式索引会与真实语义漂移</text><rect x=\"710\" y=\"26\" width=\"650\" height=\"344\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"710\" y=\"26\" width=\"650\" height=\"40\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1\" /><text x=\"726\" y=\"52\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#2F7A66\" font-weight=\"700\" >实验二 · 压缩批次过滤效果对照</text><rect x=\"726\" y=\"76\" width=\"618\" height=\"196\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"740\" y=\"100\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.8\" fill=\"#1B2B33\" font-weight=\"400\" >ALTER TABLE metrics SET (</text><text x=\"740\" y=\"121\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.8\" fill=\"#1B2B33\" font-weight=\"400\" >  timescaledb.compress,</text><text x=\"740\" y=\"142\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.8\" fill=\"#1B2B33\" font-weight=\"400\" >  timescaledb.compress_segmentby = &#x27;device_id&#x27;,</text><text x=\"740\" y=\"163\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.8\" fill=\"#1B2B33\" font-weight=\"400\" >  timescaledb.compress_orderby = &#x27;time DESC&#x27;</text><text x=\"740\" y=\"184\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.8\" fill=\"#1B2B33\" font-weight=\"400\" >);</text><text x=\"740\" y=\"205\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.8\" fill=\"#1B2B33\" font-weight=\"400\" >EXPLAIN (ANALYZE, BUFFERS)</text><text x=\"740\" y=\"226\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.8\" fill=\"#1B2B33\" font-weight=\"400\" >SELECT avg(cpu) FROM metrics</text><text x=\"740\" y=\"247\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.8\" fill=\"#1B2B33\" font-weight=\"400\" >WHERE device_id = 42 AND time &gt;= now() - interval &#x27;7 days&#x27;;</text><text x=\"726\" y=\"296\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#46585F\" font-weight=\"400\" >再用 WHERE status = &#x27;WARN&#x27; 做对照，观察计划、buffer 与解压量</text><text x=\"726\" y=\"322\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >预期不是某个固定性能数字，而是两条计划的差别</text><text x=\"726\" y=\"348\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >老 compression API 自 v2.18 起被 hypercore 取代，但仍受支持</text><rect x=\"40\" y=\"382\" width=\"1320\" height=\"38\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1\" /><text x=\"58\" y=\"406.075\" class=\"sv serif\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >DEMO 未执行：当前环境没有启动 PostgreSQL / TimescaleDB 实例；没有本机数据与计划输出，就不编造性能结果</text></svg>"},{"eyebrow":"实践 · 规矩与坑","title":"把查询模型单独设计出来","lede":"架构师、DBA、业务开发者各守三条；六个常见坑，其实都是同一个层次混淆的变体。","caption":"图 19　左：三类角色的最佳实践。右：六个常见坑与对应动作。","bridge":"最后，把今天这条因果链收成一张剖面。","notes":"左边是三类角色该守的规矩。架构师：常查字段进关系列、生成列或者物化视图；长期保存 protobuf 禁止复用 field number、删字段要 reserved；时序历史数据优先交给数据库自己的列式压缩。DBA：盯住 bytea 和 TOAST 膨胀、表和索引膨胀；segmentby 要从查询谓词里选，不能凭「哪个字段看起来像维度」的直觉；升级扩展前检查算法编号、send/recv 和 TOAST 策略的兼容性，尤其要跑回归。业务开发者：事件原文可以用 protobuf，但页面查询、报表、告警条件必须有独立字段；每个 payload 存一份 schema version 或者 descriptor hash，方便排查旧数据；高频字段建显式列，比每次解码稳得多。右边六个坑，其实都长在同一个根上：把消息层的约定当成存储层的约定。字段号复用、把压缩率当查询性能、忽视 TOAST、把 send/recv 当页内格式、压缩列上无过滤条件的 DML，全是这一条的不同变体。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40\" y=\"26\" width=\"650\" height=\"40\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"56\" y=\"52\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" >三类角色，各守三条规矩</text><rect x=\"40\" y=\"76\" width=\"650\" height=\"88\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"40\" y=\"76\" width=\"8\" height=\"88\" rx=\"2\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1\" /><text x=\"58\" y=\"126\" class=\"sv serif\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"700\" >架构师</text><line x1=\"196\" y1=\"88\" x2=\"196\" y2=\"152\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"210\" y=\"100\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >常查字段进关系列 / 生成列 / 物化视图</text><text x=\"210\" y=\"124\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >禁止复用 field number，删字段保留 reserved</text><text x=\"210\" y=\"148\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >时序历史数据交给数据库自己的列式压缩</text><rect x=\"40\" y=\"174\" width=\"650\" height=\"88\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"40\" y=\"174\" width=\"8\" height=\"88\" rx=\"2\" fill=\"#A4C4C6\" stroke=\"#A4C4C6\" stroke-width=\"1\" /><text x=\"58\" y=\"224\" class=\"sv serif\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"700\" >DBA</text><line x1=\"196\" y1=\"186\" x2=\"196\" y2=\"250\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"210\" y=\"198\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >监控 bytea / TOAST、表与索引膨胀</text><text x=\"210\" y=\"222\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >segmentby 来自查询谓词，不来自维度直觉</text><text x=\"210\" y=\"246\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >升级前核对算法编号、send/recv、TOAST 策略</text><rect x=\"40\" y=\"272\" width=\"650\" height=\"88\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"40\" y=\"272\" width=\"8\" height=\"88\" rx=\"2\" fill=\"#EBF1EE\" stroke=\"#EBF1EE\" stroke-width=\"1\" /><text x=\"58\" y=\"322\" class=\"sv serif\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"700\" >业务开发者</text><line x1=\"196\" y1=\"284\" x2=\"196\" y2=\"348\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"210\" y=\"296\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >事件原文可用 protobuf，页面查询要有独立字段</text><text x=\"210\" y=\"320\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >给 payload 存 schema version / descriptor hash</text><text x=\"210\" y=\"344\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >高频字段建显式列，别每次从 payload 解码</text><rect x=\"710\" y=\"26\" width=\"650\" height=\"40\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1\" /><text x=\"726\" y=\"52\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#BE653B\" font-weight=\"700\" >六个常见坑，与对应动作</text><rect x=\"710\" y=\"76\" width=\"650\" height=\"44\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"722\" y=\"94\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#BE653B\" font-weight=\"400\" >坑 1</text><text x=\"770\" y=\"94\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#1B2B33\" font-weight=\"700\" >把 protobuf 当数据库 schema 替代品</text><text x=\"770\" y=\"113\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.2\" fill=\"#2F7A66\" font-weight=\"400\" >→ 投影列 / 生成列 / 表达式索引 / ETL 明细表</text><rect x=\"710\" y=\"126\" width=\"650\" height=\"44\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"722\" y=\"144\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#BE653B\" font-weight=\"400\" >坑 2</text><text x=\"770\" y=\"144\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#1B2B33\" font-weight=\"700\" >长期存储复用 field number</text><text x=\"770\" y=\"163\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.2\" fill=\"#2F7A66\" font-weight=\"400\" >→ 删除字段后用 reserved，旧 bytes 才不会被新语义解释</text><rect x=\"710\" y=\"176\" width=\"650\" height=\"44\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"722\" y=\"194\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#BE653B\" font-weight=\"400\" >坑 3</text><text x=\"770\" y=\"194\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#1B2B33\" font-weight=\"700\" >把压缩率等同于查询性能</text><text x=\"770\" y=\"213\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.2\" fill=\"#2F7A66\" font-weight=\"400\" >→ 用 segmentby / orderby 把读路径前置到物理布局</text><rect x=\"710\" y=\"226\" width=\"650\" height=\"44\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"722\" y=\"244\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#BE653B\" font-weight=\"400\" >坑 4</text><text x=\"770\" y=\"244\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#1B2B33\" font-weight=\"700\" >忽视 TOAST 的连锁影响</text><text x=\"770\" y=\"263\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.2\" fill=\"#2F7A66\" font-weight=\"400\" >→ 大 payload 影响随机读、VACUUM、备份与缓存</text><rect x=\"710\" y=\"276\" width=\"650\" height=\"44\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"722\" y=\"294\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#BE653B\" font-weight=\"400\" >坑 5</text><text x=\"770\" y=\"294\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#1B2B33\" font-weight=\"700\" >把 send/recv 当成页内格式</text><text x=\"770\" y=\"313\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.2\" fill=\"#2F7A66\" font-weight=\"400\" >→ 分清 datum layout、wire protocol、text I/O 三层</text><rect x=\"710\" y=\"326\" width=\"650\" height=\"44\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"722\" y=\"344\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#BE653B\" font-weight=\"400\" >坑 6</text><text x=\"770\" y=\"344\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#1B2B33\" font-weight=\"700\" >压缩列上无过滤条件的 DML</text><text x=\"770\" y=\"363\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.2\" fill=\"#2F7A66\" font-weight=\"400\" >→ 用 segmentby / orderby 条件定位批次，少解压重压</text><rect x=\"40\" y=\"384\" width=\"1320\" height=\"36\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1\" /><text x=\"58\" y=\"407.6\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#BE653B\" font-weight=\"400\" >坑的共同来源：把消息层的约定，当成了存储层的约定</text></svg>"},{"eyebrow":"收束 · 把因果链摞成剖面","title":"字段级 wire format ≠ 页级存储结构","lede":"今天走过的七步，从「交换」一路摞到「读路径」；越深的靛青，越靠近底层。","caption":"图 20　七步因果链的地层剖面：由深到浅，越深越底层。","bridge":"就讲到这儿。谢谢各位 —— 下次遇到一条慢 SQL，先问是哪一层的账。","notes":"收个尾。今天从「protobuf 很紧凑」这个直觉出发，走了七步：第一步承认它解决的是交换，tag-value、字段号、wire type 让消息稀疏又可演进；第二步把 bytes 放回页里，看见外面还包着五层；第三步算读路径的账，过滤条件在哪一层，决定 IO 和 CPU 花在哪；第四步换到内核视角，看 TimescaleDB 怎么把一批行压成一行、把元数据前置；第五步打开公共头，一个字节的算法号就是长期 ABI；第六步发现要恢复的是 Datum 不是 bytes，所以才有 element_type、sizes、对齐这些字段；第七步回到读路径，先批次过滤再必要解压。七层摞起来，就是今天那句题眼的完整版本：字段级 wire format 与页级存储结构，不是一层东西。留三个问题给你回去想：如果事件要按 user_id、sku_id、campaign_id 查，你投影哪几个字段；把一千条传感器点打包进一个 protobuf 再存 bytea，和压缩 chunk 的批次有什么根本差异；如果查询主要按 status 过滤，而压缩只按 device_id 和 time 配，执行器会多做哪些工作。能顺着这条链答下来，你就不会再问「哪种格式更紧凑」，而会先问「哪一层替我做了过滤」。谢谢大家。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40\" y=\"20\" width=\"1320\" height=\"46\" rx=\"3\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1\" /><text x=\"56\" y=\"50\" class=\"sv serif\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#FFFFFF\" font-weight=\"700\" >① 交换 · tag-value</text><text x=\"340\" y=\"50\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#EBF1EE\" font-weight=\"400\" >字段号 + wire type，让消息稀疏、可演进、跨语言</text><rect x=\"40\" y=\"72\" width=\"1320\" height=\"46\" rx=\"3\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1\" /><text x=\"56\" y=\"102\" class=\"sv serif\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#FFFFFF\" font-weight=\"700\" >② 落库 · 最内一层</text><text x=\"340\" y=\"102\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#EBF1EE\" font-weight=\"400\" >payload 外面还有页头 / line pointer / tuple header / varlena / TOAST</text><rect x=\"40\" y=\"124\" width=\"1320\" height=\"46\" rx=\"3\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1\" /><text x=\"56\" y=\"154\" class=\"sv serif\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#FFFFFF\" font-weight=\"700\" >③ 代价 · 过滤在哪层</text><text x=\"340\" y=\"154\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#EBF1EE\" font-weight=\"400\" >在 payload 内就得逐行解码；在外部列能先排除候选行</text><rect x=\"40\" y=\"176\" width=\"1320\" height=\"46\" rx=\"3\" fill=\"#74A5AD\" stroke=\"#74A5AD\" stroke-width=\"1\" /><text x=\"56\" y=\"206\" class=\"sv serif\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#1B2B33\" font-weight=\"700\" >④ 内核 · 一行装一批</text><text x=\"340\" y=\"206\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" >segmentby 分组、orderby 排序，min/max 元数据前置到写入时</text><rect x=\"40\" y=\"228\" width=\"1320\" height=\"46\" rx=\"3\" fill=\"#A4C4C6\" stroke=\"#A4C4C6\" stroke-width=\"1\" /><text x=\"56\" y=\"258\" class=\"sv serif\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#1B2B33\" font-weight=\"700\" >⑤ 载荷 · 一字节算法号</text><text x=\"340\" y=\"258\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" >varlena 公共头 + 七种算法 dispatch；编号是长期 ABI</text><rect x=\"40\" y=\"280\" width=\"1320\" height=\"46\" rx=\"3\" fill=\"#CFE0DC\" stroke=\"#CFE0DC\" stroke-width=\"1\" /><text x=\"56\" y=\"310\" class=\"sv serif\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#1B2B33\" font-weight=\"700\" >⑥ 恢复 · Datum 非 bytes</text><text x=\"340\" y=\"310\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" >element_type、sizes、MAXALIGN、varlena 与 TOAST 规则</text><rect x=\"40\" y=\"332\" width=\"1320\" height=\"46\" rx=\"3\" fill=\"#EBF1EE\" stroke=\"#EBF1EE\" stroke-width=\"1\" /><text x=\"56\" y=\"362\" class=\"sv serif\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#1B2B33\" font-weight=\"700\" >⑦ 读路径 · 先过滤</text><text x=\"340\" y=\"362\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" >少读、少解压、少重构行，才是查询快的真正来源</text><rect x=\"40\" y=\"388\" width=\"1320\" height=\"36\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1\" /><text x=\"58\" y=\"411.95\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#46585F\" font-weight=\"400\" >不要问「哪种格式更紧凑」，要问「哪一层替我做了过滤」</text></svg>"}];
const N = D.length;
let cur = 0, autoTimer = null, autoOn = false;
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

function fit(){
  const vp = $('#viewport');
  const W = vp.clientWidth, H = vp.clientHeight;
  const s = Math.min(W/1600, H/900);
  const st = $('#stage');
  st.style.transform = 'scale(' + s + ')';
  st.style.left = ((W - 1600*s)/2) + 'px';
  st.style.top  = ((H -  900*s)/2) + 'px';
}
window.addEventListener('resize', fit);

function render(){
  $('#slides').innerHTML = D.map((d,i) =>
    '<section class="slide" id="s'+i+'">'
    + '<div class="eyebrow"><span class="num">'+String(i+1).padStart(2,'0')+' / '+String(N).padStart(2,'0')+'</span>'+d.eyebrow+'</div>'
    + '<h1 class="title">'+d.title+'</h1>'
    + '<div class="lede">'+d.lede+'</div>'
    + '<div class="rule"></div>'
    + '<div class="figwrap">'+d.svg+'</div>'
    + (d.ctrl ? '<div class="ctrls">'+d.ctrl+'</div>' : '<div class="caption">'+d.caption+'</div>')
    + '<div class="bridge"><span class="bk">承接 · NEXT</span>'+d.bridge+'</div>'
    + '<div class="footer"><div class="fbar"><i id="fbar'+i+'"></i></div>'
    + '<span class="fl">数据库筑基课 · protobuf 存储结构</span>'
    + '<span class="fr">'+String(i+1).padStart(2,'0')+' / '+String(N).padStart(2,'0')+'</span></div>'
    + '</section>').join('');
}

function go(i, silent){
  i = Math.max(0, Math.min(N-1, i));
  $$('.slide').forEach((el,k)=>el.classList.toggle('on', k===i));
  cur = i;
  try{ localStorage.setItem('pb-deck-slide', String(i)); }catch(e){}
  $('.pg').textContent = String(i+1).padStart(2,'0') + ' / ' + String(N).padStart(2,'0');
  $('#track i').style.width = ((i+1)/N*100)+'%';
  for(let k=0;k<N;k++){ const b=$('#fbar'+k); if(b) b.style.width = (k<=i?100:0)+'%'; }
  if(!silent) toast(D[i].eyebrow + ' · ' + D[i].title);
  if(i===ANIM_IDX) pPaint();
}
function next(){ if(cur<N-1) go(cur+1); else stopAuto(); }
function prev(){ if(cur>0) go(cur-1); }

function toast(s){
  const t=$('#toast'); t.textContent=s; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1700);
}
function stopAuto(){
  autoOn=false; clearInterval(autoTimer); autoTimer=null;
  $('#btnAuto').textContent='▶ 自动播放 P'; $('#btnAuto').classList.remove('act');
}
function toggleAuto(){
  if(autoOn){ stopAuto(); toast('已暂停自动播放'); return; }
  autoOn=true; $('#btnAuto').textContent='❚❚ 暂停 P'; $('#btnAuto').classList.add('act');
  autoTimer=setInterval(()=>{ if(cur<N-1) go(cur+1,true); else stopAuto(); }, 12000);
  toast('自动播放：每 12 秒一页');
}

/* ---------- 页内开窗（右侧抽屉）：讲稿 / 全文 / 目录 / 快捷键 ---------- */
function openDrawer(inner){
  $('#drawer').innerHTML = '<button class="close" onclick="closeDrawer()">关闭 ✕</button>' + inner;
  $('#drawer').classList.add('on');
  $('#drawer').scrollTop = 0;
}
function closeDrawer(){ $('#drawer').classList.remove('on'); }
function notesHere(){
  const d=D[cur];
  openDrawer('<h2>'+d.title+'</h2><div class="psub">'+d.eyebrow+' · 本页讲述稿</div>'
    +'<div class="sec"><p>'+d.notes+'</p></div>'
    +'<div class="sec"><p style="font-family:var(--serif);color:var(--accent);font-size:15px">「'+d.bridge+'」</p></div>'
    +'<div class="sec"><p style="font-size:13px;color:var(--muted)">按 T 通读全文讲稿，按 G 查目录，按 Esc 收起本窗。</p></div>');
}
function notesAll(){
  openDrawer('<h2>完整演说文稿</h2><div class="psub">共 '+N+' 页 · 页与页之间靠「承接」相连</div>'
    + D.map((d,i)=>'<div class="sec"><span class="sn">'+String(i+1).padStart(2,'0')+' · '+d.eyebrow+'</span>'
      +'<h3>'+d.title+'</h3><p>'+d.notes+'</p>'
      +'<p style="margin-top:10px;font-family:var(--serif);color:var(--accent);font-size:14.5px">「'+d.bridge+'」</p></div>').join(''));
}
function toc(){
  openDrawer('<h2>目录</h2><div class="psub">点击任意一页跳转 · 共 '+N+' 页</div><div class="grid">'
    + D.map((d,i)=>'<a onclick="jump('+i+')"><span class="gn">'+String(i+1).padStart(2,'0')+'</span>'
      +'<span class="gt">'+d.title+'</span></a>').join('') + '</div>');
}
function jump(i){ closeDrawer(); go(i); }
function help(){
  openDrawer('<h2>快捷键</h2><div class="psub">演说时的操作备忘 · 全屏后按键仍显示在页面底部</div><div class="keys">'
    + '<div><kbd>→ / 空格</kbd>下一页</div><div><kbd>←</kbd>上一页</div>'
    + '<div><kbd>F</kbd>全屏 / 退出全屏</div><div><kbd>G</kbd>目录</div>'
    + '<div><kbd>N</kbd>本页讲述稿</div><div><kbd>T</kbd>通读全文讲稿</div>'
    + '<div><kbd>P</kbd>自动播放 / 暂停</div><div><kbd>1–9</kbd>直接跳页</div>'
    + '<div><kbd>Home / End</kbd>首页 / 末页</div><div><kbd>Esc</kbd>收起开窗 / 退出全屏</div>'
    + '<div><kbd>?</kbd>本帮助</div><div><kbd>底部按钮</kbd>同上，常驻可见</div></div>');
}
function fs(){
  const el=document.documentElement;
  const entering=!document.body.classList.contains('immersive');
  if(entering){
    document.body.classList.add('immersive');
    $('#btnFs').textContent='退出全屏 F';
    fit(); toast('全屏 / 沉浸：底部按键条仍常驻（F 或 Esc 退出）');
    try{ const pr = el.requestFullscreen ? el.requestFullscreen() : null;
         if(pr && pr.catch) pr.catch(()=>{}); }catch(e){}
  }else{
    document.body.classList.remove('immersive');
    $('#btnFs').textContent='全屏 F';
    fit(); toast('已退出全屏');
    try{ if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen(); }catch(e){}
  }
}
document.addEventListener('fullscreenchange', ()=>{
  if(!document.fullscreenElement && document.body.classList.contains('immersive')){
    document.body.classList.remove('immersive');
    const b=$('#btnFs'); if(b) b.textContent='全屏 F';
  }
  fit();
});

document.addEventListener('keydown', e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  const k=e.key;
  const typing=(tag==='input'||tag==='select'||tag==='textarea');
  const navKey=(k.indexOf('Arrow')===0||k===' '||k==='Home'||k==='End'||k==='PageUp'||k==='PageDown');
  if(k==='Escape'){ closeDrawer(); if(document.body.classList.contains('immersive')) fs(); return; }
  const drawerOn=$('#drawer').classList.contains('on');
  if(drawerOn){
    if(k==='g'||k==='G'){ e.preventDefault(); toc(); }
    else if(k==='n'||k==='N'){ e.preventDefault(); notesHere(); }
    else if(k==='t'||k==='T'){ e.preventDefault(); notesAll(); }
    else if(k==='?'||k==='h'||k==='H'){ e.preventDefault(); help(); }
    else if(k==='f'||k==='F'){ e.preventDefault(); fs(); }
    else if(k==='p'||k==='P'){ e.preventDefault(); toggleAuto(); }
    return;
  }
  if(typing && navKey) return;
  if(k==='ArrowRight'||k===' '||k==='PageDown'){ e.preventDefault(); next(); }
  else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); prev(); }
  else if(k==='f'||k==='F'||e.code==='KeyF'){ e.preventDefault(); fs(); }
  else if(k==='g'||k==='G'){ e.preventDefault(); toc(); }
  else if(k==='n'||k==='N'){ e.preventDefault(); notesHere(); }
  else if(k==='t'||k==='T'){ e.preventDefault(); notesAll(); }
  else if(k==='p'||k==='P'){ e.preventDefault(); toggleAuto(); }
  else if(k==='?'||k==='h'||k==='H'){ e.preventDefault(); help(); }
  else if(k==='Home'){ e.preventDefault(); go(0); }
  else if(k==='End'){ e.preventDefault(); go(N-1); }
  else if(/^[1-9]$/.test(k)){ go(parseInt(k,10)-1); }
});

/* ---------- 动画：压缩批次的读路径过滤 ---------- */
const ANIM_IDX = D.findIndex(d => d.anim === true);
const PB = [
  {d:'d01', t:'01–03'}, {d:'d01', t:'03–05'}, {d:'d02', t:'05–07'}, {d:'d01', t:'07–09'},
  {d:'d02', t:'09–11'}, {d:'d01', t:'11–13'}, {d:'d02', t:'13–15'}, {d:'d01', t:'15–17'}
];
let pStep=0, pTimer=null, pPlaying=false;
function pBatchCount(){ const e=$('#pCount'); return e ? +e.value : 8; }
function pKeep(i){
  const q=$('#pQuery') ? $('#pQuery').value : 'both';
  if(q==='all') return true;
  if(q==='status') return true;              /* 谓词藏在非元数据列里，元数据排除不了 */
  if(q==='device') return PB[i].d==='d01';   /* segmentby 命中一半批次 */
  /* both：device + time，进一步用 min/max 排除更早的批次 */
  return PB[i].d==='d01' && i>=3;
}
function pPaint(){
  const cnt=pBatchCount();
  $$('#animPath .pcol').forEach((g,i)=>{
    g.setAttribute('opacity', i<cnt ? '1' : '0.14');
    const state=g.querySelector('.pstate');
    const lab=g.querySelector('.plab');
    if(!state||!lab) return;
    let fill,stroke,txt,color;
    if(i>=pStep){ fill='#FFFFFF'; stroke='#D9D5CB'; txt='待判'; color='#89938F'; }
    else if(pKeep(i)){ fill='#F7E9DE'; stroke='#BE653B'; txt='解压'; color='#BE653B'; }
    else { fill='#E4F0EA'; stroke='#2F7A66'; txt='跳过'; color='#2F7A66'; }
    state.setAttribute('fill',fill); state.setAttribute('stroke',stroke);
    lab.textContent=txt; lab.setAttribute('fill',color);
  });
  pVerdict();
  const cl=$('#pCountLbl'); if(cl) cl.textContent=cnt+' 批';
}
function pVerdict(){
  const out=$('#pOut'); if(!out) return;
  const cnt=pBatchCount();
  let skip=0, keep=0;
  for(let i=0;i<Math.min(pStep,cnt);i++){ if(pKeep(i)) keep++; else skip++; }
  const q=$('#pQuery') ? $('#pQuery').value : 'both';
  let tail;
  if(q==='both') tail='元数据命中，多数批次不用解压';
  else if(q==='device') tail='仅 segmentby 命中，约半数要解压';
  else if(q==='status') tail='谓词在非元数据列，几乎全要解压';
  else tail='无过滤条件，每批都要解压';
  out.innerHTML='<b>已查 '+Math.min(pStep,cnt)+'/'+cnt+' 批 · 跳过 '+skip+' · 解压 '+keep+'　</b>'+tail;
  out.title=out.textContent;
}
function pPause(){
  pPlaying=false; clearInterval(pTimer); pTimer=null;
  const b=$('#pPlay'); if(b){ b.textContent='▶ 播放'; b.classList.remove('play'); }
}
function pPlay(){
  if(pPlaying){ pPause(); return; }
  if(pStep>=pBatchCount()) pStep=0;
  pPlaying=true; $('#pPlay').textContent='❚❚ 暂停'; $('#pPlay').classList.add('play');
  pTimer=setInterval(()=>{
    pStep++; pPaint();
    if(pStep>=pBatchCount()) pPause();
  },760);
}
function pTick(){ if(pStep<pBatchCount()){ pStep++; pPaint(); } }
function pReset(){ pPause(); pStep=0; pPaint(); }

function init(){
  render(); fit();
  let saved=0; try{ saved=parseInt(localStorage.getItem('pb-deck-slide')||'0',10)||0; }catch(e){}
  go(saved,true);
  $('#btnPrev').onclick=prev; $('#btnNext').onclick=next;
  $('#btnToc').onclick=toc; $('#btnNotes').onclick=notesHere;
  $('#btnAll').onclick=notesAll; $('#btnAuto').onclick=toggleAuto;
  $('#btnFs').onclick=fs; $('#btnHelp').onclick=help;
  ['pQuery','pCount'].forEach(id=>{
    const el=$('#'+id); if(!el) return;
    const f=()=>{ pReset(); };
    el.addEventListener('input',f); el.addEventListener('change',f);
  });
  const bind=(id,fn)=>{ const el=$(id); if(el) el.onclick=fn; };
  bind('#pPlay',pPlay); bind('#pTick',pTick); bind('#pReset',pReset);
  pPaint();
}
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
