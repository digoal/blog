<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数据库筑基课 · protobuf 存储结构｜把 bytes 放回页里</title>
<!-- 单文件交付：所有原理图均为现场绘制的内联 SVG，无外部图片、字体、脚本依赖。 -->
<!-- 设计母题：地层 / 剖面。按「层次错位→边界→交换→wire→页→内核样本→读路径→收益→落地」推演。 -->
<style>
:root{
  --bg:#F7F6F2; --ink:#1B2B33; --ink2:#46585F; --muted:#89938F; --line:#D9D5CB;
  --primary:#245A6B; --prim-l:#E5EFF0; --accent:#BE653B; --acc-l:#F7E9DE;
  --green:#2F7A66; --green-l:#E4F0EA; --gold:#AE8A3E;
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#E9E7E1}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
#viewport{position:absolute;inset:0 0 58px 0;overflow:hidden}
#stage{position:absolute;width:1600px;height:900px;background:var(--bg);
  transform-origin:top left;box-shadow:0 18px 60px rgba(27,43,51,.13)}
.slide{position:absolute;inset:0;display:none}
.slide.on{display:block;animation:fadein .42s cubic-bezier(.2,.7,.2,1)}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{position:absolute;left:64px;top:44px;font-size:13px;letter-spacing:3.4px;
  color:var(--primary);font-weight:600}
.eyebrow .num{font-family:var(--mono);letter-spacing:1px;color:var(--accent);margin-right:14px}
h1.title{position:absolute;left:64px;top:70px;margin:0;font-family:var(--serif);
  font-size:44px;line-height:1.25;font-weight:700;letter-spacing:1.2px;color:var(--ink)}
.lede{position:absolute;left:64px;top:139px;width:1440px;font-size:19px;color:var(--ink2);
  line-height:1.5;letter-spacing:.3px}
.rule{position:absolute;left:64px;top:181px;width:1472px;height:1px;background:var(--line)}
.figwrap{position:absolute;left:100px;top:198px;width:1400px;height:430px}
svg.figure{display:block;overflow:visible}
svg.figure text{font-family:var(--sans)}
svg.figure text.serif{font-family:var(--serif)}
svg.figure text.mono{font-family:var(--mono)}
.caption{position:absolute;left:100px;top:638px;width:1400px;font-size:13px;
  color:var(--muted);letter-spacing:.4px}
.bridge{position:absolute;left:64px;top:706px;width:1472px;font-size:20px;
  color:var(--accent);line-height:1.55;letter-spacing:.4px;padding-left:18px;
  border-left:3px solid var(--accent);font-family:var(--serif)}
.bridge .bk{font-family:var(--sans);font-size:13px;color:var(--muted);
  letter-spacing:2px;display:block;margin-bottom:2px}
.footer{position:absolute;left:64px;top:846px;width:1472px;height:1px;background:var(--line)}
.footer .fl{position:absolute;left:0;top:14px;font-size:12.5px;color:var(--muted);letter-spacing:2px}
.footer .fr{position:absolute;right:0;top:12px;font-family:var(--mono);font-size:14px;color:var(--ink2)}
.footer .fbar{position:absolute;left:0;right:0;top:-1px;height:2px;background:transparent}
.footer .fbar i{display:block;height:2px;background:var(--primary);width:0;transition:width .4s ease}

/* 动画页控件：位于图下方独立条带，绝不覆盖图 */
.ctrls{position:absolute;left:100px;top:638px;width:1400px;height:46px;display:flex;
  align-items:center;gap:12px}
.ctrls label{font-size:13.5px;color:var(--ink2);white-space:nowrap}
.ctrls select,.ctrls input[type=range]{font-family:var(--sans);font-size:13.5px;color:var(--ink);
  background:#fff;border:1px solid var(--line);border-radius:4px;padding:5px 8px;outline:none}
.ctrls input[type=range]{width:120px;padding:0;accent-color:var(--primary);border:none;background:transparent}
.ctrls .btn{min-height:30px;padding:5px 14px;border:1px solid var(--primary);border-radius:4px;
  background:#fff;color:var(--primary);font-size:13.5px;cursor:pointer;font-family:var(--sans)}
.ctrls .btn.play{background:var(--primary);color:#fff}
.ctrls .btn:hover{filter:brightness(.94)}
.ctrls .out{font-size:13.5px;color:var(--ink2);margin-left:auto;min-width:0;flex:1;
  max-width:660px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrls .out b{color:var(--accent);font-weight:600}

/* 底部外壳：全屏时也常驻，快捷键永远在页面底部可见 */
.chrome{position:fixed;left:0;right:0;bottom:0;height:58px;background:#FCFBF8;
  border-top:1px solid var(--line);display:flex;align-items:center;gap:6px;
  padding:0 16px;z-index:40;font-size:13px;color:var(--ink2)}
body.immersive .chrome{background:rgba(252,251,248,.96);backdrop-filter:blur(6px)}
.chrome .sep{width:1px;height:22px;background:var(--line);margin:0 5px}
.chrome button{font-family:var(--sans);font-size:13px;color:var(--ink2);background:transparent;
  border:1px solid transparent;border-radius:5px;padding:7px 10px;cursor:pointer;white-space:nowrap}
.chrome button:hover{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome button.act{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome button.k{font-family:var(--mono);font-size:12px;color:var(--muted)}
.chrome .pg{font-family:var(--mono);font-size:14px;color:var(--ink);min-width:74px;text-align:center}
.chrome .track{flex:1;height:3px;background:var(--line);border-radius:3px;margin:0 10px;position:relative}
.chrome .track i{position:absolute;left:0;top:0;height:3px;background:var(--primary);border-radius:3px;transition:width .35s}
.chrome .hint{font-size:12px;color:var(--muted);white-space:nowrap}

/* 页内开窗：右侧抽屉，不用弹窗、不用遮罩；主画面与底部按键条始终可见 */
.drawer{position:fixed;right:0;top:0;bottom:58px;width:clamp(340px,44vw,620px);
  background:var(--bg);border-left:1px solid var(--line);z-index:55;
  box-shadow:-16px 0 50px rgba(27,43,51,.17);overflow:auto;
  padding:26px 32px 44px;transform:translateX(104%);
  transition:transform .32s cubic-bezier(.2,.7,.2,1)}
.drawer.on{transform:none}
.drawer h2{margin:2px 0 8px;font-family:var(--serif);font-size:28px;color:var(--ink)}
.drawer .psub{font-size:13px;color:var(--muted);margin-bottom:20px;letter-spacing:1px}
.drawer .sec{border-top:1px solid var(--line);padding:16px 0 18px}
.drawer .sec:first-of-type{border-top:none}
.drawer .sec .sn{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:1px}
.drawer .sec h3{margin:6px 0 10px;font-family:var(--serif);font-size:20px;color:var(--primary)}
.drawer .sec p{margin:0;font-size:15.5px;line-height:1.92;color:var(--ink2);letter-spacing:.3px}
.drawer .close{position:sticky;top:-26px;float:right;background:#fff;border:1px solid var(--line);
  border-radius:5px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--ink2);z-index:2}
.drawer .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.drawer .grid a{display:block;padding:11px 12px;border:1px solid var(--line);border-radius:6px;
  background:#fff;text-decoration:none;color:var(--ink);cursor:pointer;transition:.2s}
.drawer .grid a:hover{border-color:var(--primary);background:var(--prim-l)}
.drawer .grid a .gn{font-family:var(--mono);font-size:12px;color:var(--accent)}
.drawer .grid a .gt{font-family:var(--serif);font-size:15px;line-height:1.4;display:block;margin-top:4px}
.drawer .keys{display:grid;grid-template-columns:repeat(2,1fr);gap:9px 20px;font-size:14px;line-height:1.8}
.drawer .keys kbd{font-family:var(--mono);background:#fff;border:1px solid var(--line);
  border-bottom-width:2px;border-radius:4px;padding:2px 6px;color:var(--primary);margin-right:6px}
.toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);background:var(--ink);
  color:#fff;font-size:13px;padding:9px 16px;border-radius:5px;opacity:0;transition:.3s;z-index:80;pointer-events:none}
.toast.on{opacity:1}
@media print{.chrome,.drawer,.toast{display:none!important}#viewport{position:static}
  #stage{position:static;transform:none!important;box-shadow:none}
  .slide{display:block!important;page-break-after:always;position:relative;height:900px}}
</style>
</head>

<script>
const D = [{"eyebrow":"开场 · 先拆掉一个误会","title":"把 bytes 放回页里","lede":"很多人以为「protobuf 紧凑」就等于「存进数据库查询快」。其实这两个判断，分别来自两个不同的层。","caption":"图 01　左：应用看到的一段 bytes。右：数据库必须替这段 bytes 承担的五个层次。中间是断层。","bridge":"先把一个最容易跑偏的说法钉死：TimescaleDB 到底用没用 protobuf？","notes":"先说一个我猜不少人都有的直觉：protobuf 比 JSON 紧凑，那把它存进数据库，是不是查询也更省？这个念头很自然，但它把两件不同层的事揉成了一件。今天我们只做一件事，把这段 bytes 放回它真正待的地方去看。左边是应用的视角——一个对象，序列化成一段 bytes，任务就结束了；右边是数据库的视角——这段 bytes 只是最里面的一层，外面还压着页、元组、事务、索引、恢复五层。这五层不是包装纸，是数据库能不能找到它、能不能只给该看的事务看、能不能在断电之后把它拼回来的全部依据。所以开场这句就是整场的题眼：字段级 wire format 和页级存储结构，不是一层东西。你可能会问，那为什么大家会混？因为平时我们只看见两端，SQL 进去，结果出来，中间那段被抽象掉了。今天我们就把中间那段一层层剖开。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40\" y=\"30\" width=\"560\" height=\"310\" rx=\"5\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1\" /><text x=\"72\" y=\"82\" class=\"sv serif\" text-anchor=\"start\" font-size=\"27.0\" fill=\"#FFFFFF\" font-weight=\"700\" >应用视角</text><text x=\"72\" y=\"122\" class=\"sv s\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#CFE0DC\" font-weight=\"400\" >一个对象 → 一段 bytes</text><line x1=\"72\" y1=\"146\" x2=\"568\" y2=\"146\" stroke=\"#74A5AD\" stroke-width=\"1\"/><text x=\"72\" y=\"186\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#EBF1EE\" font-weight=\"400\" >关心：字段怎么编码</text><text x=\"72\" y=\"220\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#EBF1EE\" font-weight=\"400\" >关心：跨语言稳定互转</text><text x=\"72\" y=\"254\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#EBF1EE\" font-weight=\"400\" >关心：schema 向前兼容</text><text x=\"72\" y=\"306\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#A4C4C6\" font-weight=\"400\" >protobuf · 字段级 wire format</text><rect x=\"640\" y=\"30\" width=\"720\" height=\"310\" rx=\"5\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"668\" y=\"70\" class=\"sv serif\" text-anchor=\"start\" font-size=\"24.0\" fill=\"#245A6B\" font-weight=\"700\" >数据库视角</text><text x=\"668\" y=\"98\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >同一段 bytes，要活在一整套系统里</text><rect x=\"668\" y=\"116\" width=\"664\" height=\"40\" rx=\"4\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1\" /><text x=\"684\" y=\"142\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#FFFFFF\" font-weight=\"700\" >页</text><text x=\"806\" y=\"141\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#EBF1EE\" font-weight=\"400\" >页头 / line pointer / 空闲空间管理</text><rect x=\"668\" y=\"160\" width=\"664\" height=\"40\" rx=\"4\" fill=\"#74A5AD\" stroke=\"#74A5AD\" stroke-width=\"1\" /><text x=\"684\" y=\"186\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#FFFFFF\" font-weight=\"700\" >元组</text><text x=\"806\" y=\"185\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#EBF1EE\" font-weight=\"400\" >tuple header / null bitmap / varlena</text><rect x=\"668\" y=\"204\" width=\"664\" height=\"40\" rx=\"4\" fill=\"#A4C4C6\" stroke=\"#A4C4C6\" stroke-width=\"1\" /><text x=\"684\" y=\"230\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"700\" >事务</text><text x=\"806\" y=\"229\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" >xmin-xmax 可见性 / 回收 / WAL</text><rect x=\"668\" y=\"248\" width=\"664\" height=\"40\" rx=\"4\" fill=\"#CFE0DC\" stroke=\"#CFE0DC\" stroke-width=\"1\" /><text x=\"684\" y=\"274\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"700\" >索引</text><text x=\"806\" y=\"273\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" >谓词下推 / 统计 / 表达式索引</text><rect x=\"668\" y=\"292\" width=\"664\" height=\"40\" rx=\"4\" fill=\"#EBF1EE\" stroke=\"#EBF1EE\" stroke-width=\"1\" /><text x=\"684\" y=\"318\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"700\" >恢复</text><text x=\"806\" y=\"317\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" >checksum / 崩溃重放 / 复制协议</text><line x1=\"610\" y1=\"40\" x2=\"610\" y2=\"330\" stroke=\"#BE653B\" stroke-width=\"2\"/><rect x=\"588\" y=\"162\" width=\"44\" height=\"46\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.1\" /><text x=\"610.0\" y=\"190.6\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#BE653B\" font-weight=\"600\" >≠</text><rect x=\"40\" y=\"360\" width=\"1320\" height=\"52\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1\" /><text x=\"58\" y=\"392.65\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#BE653B\" font-weight=\"400\" >字段级 wire format ≠ 页级存储结构 —— 同一段 bytes，两个世界的问题</text></svg>"},{"eyebrow":"边界 · 先把话说准","title":"TimescaleDB 并没有用 protobuf","lede":"源码里没有 .proto，压缩 chunk 的真实实现是 PostgreSQL 自定义变长类型 compressed_data。","caption":"图 02　从「检索 .proto」到「SQL 类型声明」再到「C 头文件」，三条证据指向同一个结论。","bridge":"边界钉死了，那 protobuf 本来是干什么的？","notes":"写这篇的时候，我特地去本地的 timescaledb 源码里翻了一遍，结论得先说清楚：全目录没有 .proto 文件，也没有任何证据表明压缩 chunk 是拿 Google protobuf 落的盘。真实实现是 PostgreSQL 的自定义变长类型，叫 _timescaledb_internal.compressed_data，里面是 TimescaleDB 自己定义的公共头、算法编号、类型 OID、对齐约束和算法专属载荷。SQL 层的类型声明在 sql/pre_install/types.post.sql，C 层的结构在 tsl/src/compression/compression.h，具体算法散在 algorithms 目录里。这一点不澄清，整篇就会变成一篇读起来很顺、其实全错的文章。所以我们不写「TimescaleDB 用 protobuf 存储数据」，而是换成一条更有工程价值的主线：先看 protobuf 这类格式到底能解决什么，再看它一旦进入存储引擎会多出哪些问题，最后拿 compressed_data 当内核级二进制载荷的样本来拆。这么写，开发者那句「protobuf 是高效存储格式」的误会，才有机会被真正解开。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40\" y=\"24\" width=\"1320\" height=\"40\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"58\" y=\"50\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"700\" >本地 timescaledb 源码核查 · 三条证据</text><rect x=\"40\" y=\"78\" width=\"1320\" height=\"86\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"40\" y=\"78\" width=\"8\" height=\"86\" rx=\"2\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1\" /><text x=\"62\" y=\"112\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"700\" >全目录检索 .proto</text><text x=\"62\" y=\"140\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >查了什么</text><line x1=\"312\" y1=\"92\" x2=\"312\" y2=\"150\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"330\" y=\"112\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >源码位置</text><text x=\"330\" y=\"140\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"400\" >timescaledb/  ·  未发现 .proto 文件</text><line x1=\"896\" y1=\"92\" x2=\"896\" y2=\"150\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"914\" y=\"112\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >得到的结论</text><text x=\"914\" y=\"140\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >没有发现 protobuf 作为压缩落盘格式的证据</text><rect x=\"40\" y=\"178\" width=\"1320\" height=\"86\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"40\" y=\"178\" width=\"8\" height=\"86\" rx=\"2\" fill=\"#74A5AD\" stroke=\"#74A5AD\" stroke-width=\"1\" /><text x=\"62\" y=\"212\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"700\" >SQL 类型定义</text><text x=\"62\" y=\"240\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >查了什么</text><line x1=\"312\" y1=\"192\" x2=\"312\" y2=\"250\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"330\" y=\"212\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >源码位置</text><text x=\"330\" y=\"240\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"400\" >sql/pre_install/types.post.sql</text><line x1=\"896\" y1=\"192\" x2=\"896\" y2=\"250\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"914\" y=\"212\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >得到的结论</text><text x=\"914\" y=\"240\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >_timescaledb_internal.compressed_data · 自定义变长类型</text><rect x=\"40\" y=\"278\" width=\"1320\" height=\"86\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"40\" y=\"278\" width=\"8\" height=\"86\" rx=\"2\" fill=\"#A4C4C6\" stroke=\"#A4C4C6\" stroke-width=\"1\" /><text x=\"62\" y=\"312\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"700\" >C 头文件</text><text x=\"62\" y=\"340\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >查了什么</text><line x1=\"312\" y1=\"292\" x2=\"312\" y2=\"350\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"330\" y=\"312\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >源码位置</text><text x=\"330\" y=\"340\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"400\" >tsl/src/compression/compression.h</text><line x1=\"896\" y1=\"292\" x2=\"896\" y2=\"350\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"914\" y=\"312\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >得到的结论</text><text x=\"914\" y=\"340\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >varlena 公共头 + 算法编号 + 算法专属载荷</text><rect x=\"40\" y=\"382\" width=\"1320\" height=\"38\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1\" /><text x=\"58\" y=\"406.6\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#BE653B\" font-weight=\"400\" >所以主线不是「TimescaleDB 用 protobuf」，而是拿它当数据库内核级二进制载荷的设计样本</text></svg>"},{"eyebrow":"回到出身 · 它解决什么问题","title":"protobuf 解决的是交换，不是存储","lede":"跨语言、跨进程、跨版本的数据交换；稀疏、可演进的消息，才是它的主场。","caption":"图 03　上：一次跨语言交换。下：为把交换做好而做的四个设计选择，没有一个叫「让数据库少读点」。","bridge":"那就不猜了，我们把一条 message 的字节流剖开看。","notes":"回到它出生的地方。protobuf 要解决的是跨语言、跨进程、跨版本的数据交换：一个 Go 服务把对象发出来，一个 Python 服务能原样读回去，半年后加了个字段，老程序也不会崩。为了把这件事做好，它做了四个很聪明的选择。第一，用字段号而不是字段名编码，光是「不重复写字段名」就省下大量文本；第二，用 varint，小整数一个字节就够；第三，没出现的字段一个字节都不占，遇到不认识的字段还能按 wire type 直接跳过去；第四，生成代码之后，对象和 bytes 稳定互转。这四条加起来，换来的是消息层极好的兼容性和紧凑度。但你注意，这四个目标里，没有一个叫「让数据库少读点」。它优化的是交换，不是查询。这个区别，剖到字节层面会更清楚，因为字节流里到底写了什么、没写什么，是藏不住的。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40\" y=\"46\" width=\"340\" height=\"104\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.1\" /><text x=\"210.0\" y=\"90.3\" class=\"sv s\" text-anchor=\"middle\" font-size=\"21.0\" fill=\"#245A6B\" font-weight=\"600\" >生产者</text><text x=\"210.0\" y=\"115.5\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >Java · Go · Rust · C++</text><rect x=\"520\" y=\"46\" width=\"360\" height=\"104\" rx=\"5\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.1\" /><text x=\"700.0\" y=\"90.3\" class=\"sv s\" text-anchor=\"middle\" font-size=\"21.0\" fill=\"#BE653B\" font-weight=\"600\" >一段 bytes</text><text x=\"700.0\" y=\"115.5\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >字段号 + wire type + 值</text><rect x=\"1020\" y=\"46\" width=\"340\" height=\"104\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.1\" /><text x=\"1190.0\" y=\"90.3\" class=\"sv s\" text-anchor=\"middle\" font-size=\"21.0\" fill=\"#245A6B\" font-weight=\"600\" >消费者</text><text x=\"1190.0\" y=\"115.5\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >Python · C# · JavaScript</text><line x1=\"384\" y1=\"98\" x2=\"505.6\" y2=\"98\" stroke=\"#245A6B\" stroke-width=\"2\"/><polygon points=\"512,98 504,93.6 504,102.4\" fill=\"#245A6B\"/><line x1=\"884\" y1=\"98\" x2=\"1005.6\" y2=\"98\" stroke=\"#245A6B\" stroke-width=\"2\"/><polygon points=\"1012,98 1004,93.6 1004,102.4\" fill=\"#245A6B\"/><text x=\"40\" y=\"186\" class=\"sv serif\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#245A6B\" font-weight=\"700\" >它专门解决的四个问题</text><rect x=\"40\" y=\"208\" width=\"310\" height=\"152\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"58\" y=\"234\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"400\" >01</text><text x=\"58\" y=\"266\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"600\" >字段号代替字段名</text><text x=\"58\" y=\"296\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >不重复写字段名</text><text x=\"58\" y=\"317.06\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >文本开销直接消失</text><rect x=\"370\" y=\"208\" width=\"310\" height=\"152\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"388\" y=\"234\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"400\" >02</text><text x=\"388\" y=\"266\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"600\" >varint 按值编码</text><text x=\"388\" y=\"296\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >小整数只占一两个字节</text><text x=\"388\" y=\"317.06\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >大值自动用更多字节</text><rect x=\"700\" y=\"208\" width=\"310\" height=\"152\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"718\" y=\"234\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"400\" >03</text><text x=\"718\" y=\"266\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"600\" >稀疏与可跳过</text><text x=\"718\" y=\"296\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >未出现字段不占空间</text><text x=\"718\" y=\"317.06\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >未知字段按 wire type 跳过</text><rect x=\"1030\" y=\"208\" width=\"310\" height=\"152\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"1048\" y=\"234\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"400\" >04</text><text x=\"1048\" y=\"266\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"600\" >生成代码互转</text><text x=\"1048\" y=\"296\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >对象与 bytes 稳定互转</text><text x=\"1048\" y=\"317.06\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >schema 演进不破坏旧程序</text><rect x=\"40\" y=\"380\" width=\"1320\" height=\"38\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1\" /><text x=\"58\" y=\"404.6\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#46585F\" font-weight=\"400\" >关键词：跨语言 · 跨进程 · 跨版本 —— 它优化的是「交换」，不是「查询」</text></svg>"},{"eyebrow":"字节剖面 · 它是什么","title":"一条 message，就是一串 tag-value","lede":"tag = (field_number << 3) | wire_type；低三位定类型，高位定字段号，字段名根本不进字节流。","caption":"图 04　左：字节流与 tag 位剖面。右：官方六种 wire type。编号与公式据 protobuf 官方 Encoding 文档核对。","bridge":"一格页号、一格事务号都没有，那就正好引出数据库那边真正要回答的问题。","notes":"一条 protobuf message，官方定义得很朴素：message 就是一串 tag-value。tag 是个 varint，公式是 field_number 左移三位、再或上 wire_type；低三位告诉你值怎么读，高位告诉你是哪个字段。所以 08 96 01 这三字节，08 拆开是 00001 000，字段号 1、类型 0 也就是 VARINT，后面 96 01 解码出 150。再看 12 07 加七个字节：12 是字段 2、类型 2 也就是 LEN，紧跟着的 07 是长度，后面七个是字符串 testing。官方一共列了六种 wire type，0 是 VARINT，1 是固定八字节，2 是长度限定，5 是固定四字节，3 和 4 是已废弃的 group，六和七不合法。这里有两个细节特别值得记住：字段名和声明类型根本不进字节流，得靠解码端的 .proto 还原；字段顺序也不保证，旧解析器碰到不认识的字段，就靠 wire type 把整段跳过去。这套设计对服务间消息简直完美，稀疏、可演进、自描述到刚好够跳过。可是请你盯着这串字节问一句：哪一格写了「这一行在哪个页」？哪一格写了「对哪个事务可见」？一格都没有。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><text x=\"40\" y=\"40\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"700\" >一条 message = 一串 tag-value 记录</text><rect x=\"56\" y=\"64\" width=\"70\" height=\"66\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"91.0\" y=\"92\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" >08</text><text x=\"91.0\" y=\"116\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >tag</text><rect x=\"132\" y=\"64\" width=\"100\" height=\"66\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#F1EFE9\" stroke-width=\"1\" /><text x=\"182.0\" y=\"92\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" >96 01</text><text x=\"182.0\" y=\"116\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >varint 值 150</text><rect x=\"238\" y=\"64\" width=\"70\" height=\"66\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"273.0\" y=\"92\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" >12</text><text x=\"273.0\" y=\"116\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >tag</text><rect x=\"314\" y=\"64\" width=\"62\" height=\"66\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1\" /><text x=\"345.0\" y=\"92\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" >07</text><text x=\"345.0\" y=\"116\" class=\"sv s\" t <text x=\"795.0\" y=\"194\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#FFFFFF\" font-weight=\"700\" >2</text><text x=\"824\" y=\"193\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"700\" >LEN</text><text x=\"968\" y=\"193\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >string / bytes / 嵌套消息 / packed · 长度前缀</text><rect x=\"770\" y=\"217\" width=\"590\" height=\"47\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"778\" y=\"224\" width=\"34\" height=\"33\" rx=\"3\" fill=\"#74A5AD\" stroke=\"#74A5AD\" stroke-width=\"1\" /><text x=\"795.0\" y=\"247\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#FFFFFF\" font-weight=\"700\" >3</text><text x=\"824\" y=\"246\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"700\" >SGROUP</text><text x=\"968\" y=\"246\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >group start · 已废弃</text><rect x=\"770\" y=\"270\" width=\"590\" height=\"47\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"778\" y=\"277\" width=\"34\" height=\"33\" rx=\"3\" fill=\"#74A5AD\" stroke=\"#74A5AD\" stroke-width=\"1\" /><text x=\"795.0\" y=\"300\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#FFFFFF\" font-weight=\"700\" >4</text><text x=\"824\" y=\"299\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"700\" >EGROUP</text><text x=\"968\" y=\"299\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >group end · 已废弃</text><rect x=\"770\" y=\"323\" width=\"590\" height=\"47\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"778\" y=\"330\" width=\"34\" height=\"33\" rx=\"3\" fill=\"#74A5AD\" stroke=\"#74A5AD\" stroke-width=\"1\" /><text x=\"795.0\" y=\"353\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#FFFFFF\" font-weight=\"700\" >5</text><text x=\"824\" y=\"352\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"700\" >I32</text><text x=\"968\" y=\"352\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >fixed32 / sfixed32 / float · 固定 4 字节</text><text x=\"770\" y=\"388\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >ID 6、7 不是合法 wire type；长度前缀本身也是 varint</text></svg>"},{"eyebrow":"矛盾 · 两个层次不对话","title":"数据库还得回答七个问题","lede":"页内定位、事务可见性、谓词过滤、局部读取、批次边界、schema 演进、恢复校验——protobuf 一件都没打算管。","caption":"图 05　七项存储层职责。右下角：protobuf 只负责 payload 内部，其余由数据库承担。","bridge":"既然两层都得存在，工程上就出现了三种把它们接起来的办法，代价各不相同。","notes":"把同一段 bytes 交给数据库，它得额外回答七个问题。页里到底有几条记录、每条偏移在哪，这是页内定位；这段 bytes 对哪个事务可见、什么时候能回收，这是 MVCC；WHERE 条件能不能不解码整段就先排除、只查一列能不能跳过别的列，这是过滤和局部读取；一批压多少行，太大伤点查、太小伤压缩率，这是批次边界；字段加了删了改了类型，旧页还读不读得出来，这是 schema 演进；WAL、checksum、崩溃重放、复制协议怎么对待这段 bytes，这是恢复与校验。你会发现这七件事，protobuf 一件都没打算管，因为它的合同里压根没有「页」这个概念；而数据库这七件事，一件都不能省，省了就不是数据库了。所以我说「紧凑」是消息层的评语，「可查」是存储层的评语，这是两张卷子，别拿一张的分去报另一张的录取。那怎么办？现实里没有谁把谁消灭掉，只有三种接法。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40\" y=\"20\" width=\"1320\" height=\"40\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"58\" y=\"46\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.5\" fill=\"#245A6B\" font-weight=\"700\" >同一段 bytes 交给数据库，还得额外回答七个问题 —— 这些都不在 protobuf 的合同里</text><rect x=\"40\" y=\"74\" width=\"310\" height=\"138\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"58\" y=\"100\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"400\" >01</text><text x=\"58\" y=\"132\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"600\" >页内定位</text><text x=\"58\" y=\"162\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >一页里有多少条记录</text><text x=\"58\" y=\"182.736\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >每条记录偏移在哪</text><rect x=\"370\" y=\"74\" width=\"310\" height=\"138\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"388\" y=\"100\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"400\" >02</text><text x=\"388\" y=\"132\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"600\" >事务可见性</text><text x=\"388\" y=\"162\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >这段 bytes 对谁可见</text><text x=\"388\" y=\"182.736\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >什么时候可以回收</text><rect x=\"700\" y=\"74\" width=\"310\" height=\"138\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"718\" y=\"100\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"400\" >03</text><text x=\"718\" y=\"132\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"600\" >谓词过滤</text><text x=\"718\" y=\"162\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >能否不解码整段 bytes</text><text x=\"718\" y=\"182.736\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >就先排除候选行</text><rect x=\"1030\" y=\"74\" width=\"310\" height=\"138\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"1048\" y=\"100\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"400\" >04</text><text x=\"1048\" y=\"132\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"600\" >局部读取</text><text x=\"1048\" y=\"162\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >只查一列的时候</text><text x=\"1048\" y=\"182.736\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >能否跳过其他列</text><rect x=\"40\" y=\"226\" width=\"310\" height=\"138\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"58\" y=\"252\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"400\" >05</text><text x=\"58\" y=\"284\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"600\" >压缩块边界</text><text x=\"58\" y=\"314\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >一批多少行</text><text x=\"58\" y=\"334.736\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >太大伤点查，太小伤压缩率</text><rect x=\"370\" y=\"226\" width=\"310\" height=\"138\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"388\" y=\"252\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"400\" >06</text><text x=\"388\" y=\"284\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"600\" >schema 演进</text><text x=\"388\" y=\"314\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >字段增删改类型之后</text><text x=\"388\" y=\"334.736\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >旧页还能不能读</text><rect x=\"700\" y=\"226\" width=\"310\" height=\"138\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"718\" y=\"252\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"400\" >07</text><text x=\"718\" y=\"284\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"600\" >恢复与校验</text><text x=\"718\" y=\"314\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >WAL、checksum、崩溃重放</text><text x=\"718\" y=\"334.736\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >复制协议如何处理</text><rect x=\"1030\" y=\"226\" width=\"310\" height=\"138\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.1\" /><text x=\"1048\" y=\"252\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"400\" >→</text><text x=\"1048\" y=\"284\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#BE653B\" font-weight=\"600\" >这些由谁承担？</text><text x=\"1048\" y=\"314\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >protobuf 只定义 payload 内部</text><text x=\"1048\" y=\"334.736\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >页、事务、索引、恢复由数据库承担</text><rect x=\"40\" y=\"388\" width=\"1320\" height=\"32\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1\" /><text x=\"58\" y=\"409.425\" class=\"sv serif\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#46585F\" font-weight=\"400\" >「紧凑」是消息层的评语，「可查」是存储层的评语 —— 两张卷子，别拿一张的分去报另一张</text></svg>"},{"eyebrow":"接法 · 三种选择","title":"控制权交到哪里，能力就长在哪里","lede":"opaque bytes、投影字段、数据库自定义二进制载荷——三种接法对应三笔完全不同的账。","caption":"图 06　三种用法横向对照：典型存法、优点、代价。越往下，数据库理解越深，通用性越弱。","bridge":"第一种最常踩的坑是什么？我们直接把一个 tuple 剖开，看 payload 到底被包了几层。","notes":"三种接法，其实是同一个问题的三个答案：你把 schema 的控制权交给谁。第一种最简单，应用把 protobuf 整段塞进 bytea，数据库当成不透明的 bytes，好处是应用完全说了算、数据库侧几乎不用维护；代价是优化器看不懂里面，过滤、统计、索引、局部解码一概用不上。第二种往回走一步，把常查字段投影成普通列、生成列，或者用 FDW、表函数打开，数据库终于能建表达式索引、能下推，可你就得养一套 schema registry、写解码器、做版本治理。第三种最彻底，数据库自己定义二进制载荷，TimescaleDB 的 compressed_data 就是这一类：能把页、类型、压缩和执行器全绑在一起，代价是跨系统通用性弱，格式升级得极其谨慎。你看，控制权交到哪里，能力就长在哪里；数据库理解得越深，通用性就越弱。这不是好坏问题，是账记在谁头上的问题。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40\" y=\ ght=\"400\" >也无法做局部解码</text><rect x=\"40\" y=\"146\" width=\"290\" height=\"112\" rx=\"4\" fill=\"#A4C4C6\" stroke=\"#A4C4C6\" stroke-width=\"1\" /><text x=\"58\" y=\"176\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >02</text><text x=\"58\" y=\"212\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#1B2B33\" font-weight=\"700\" >投影字段到关系列</text><text x=\"58\" y=\"238\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >控制权交到哪里</text><rect x=\"340\" y=\"146\" width=\"1016\" height=\"112\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><line x1=\"654\" y1=\"160\" x2=\"654\" y2=\"244\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><line x1=\"1000\" y1=\"160\" x2=\"1000\" y2=\"244\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"356\" y=\"172\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >典型存法</text><text x=\"356\" y=\"202\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\" >自定义类型 / FDW / 表函数</text><text x=\"356\" y=\"230\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >让数据库理解 protobuf schema</text><text x=\"670\" y=\"172\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >优点</text><text x=\"670\" y=\"202\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\" >可投影字段给优化器</text><text x=\"670\" y=\"230\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >可建表达式索引与统计</text><text x=\"1016\" y=\"172\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >代价</text><text x=\"1016\" y=\"202\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"400\" >需要 schema registry 与解码器</text><text x=\"1016\" y=\"230\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >还要长期做版本治理</text><rect x=\"40\" y=\"272\" width=\"290\" height=\"112\" rx=\"4\" fill=\"#EBF1EE\" stroke=\"#EBF1EE\" stroke-width=\"1\" /><text x=\"58\" y=\"302\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >03</text><text x=\"58\" y=\"338\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#1B2B33\" font-weight=\"700\" >自定义二进制载荷</text><text x=\"58\" y=\"364\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >控制权交到哪里</text><rect x=\"340\" y=\"272\" width=\"1016\" height=\"112\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><line x1=\"654\" y1=\"286\" x2=\"654\" y2=\"370\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><line x1=\"1000\" y1=\"286\" x2=\"1000\" y2=\"370\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"356\" y=\"298\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >典型存法</text><text x=\"356\" y=\"328\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\" >TimescaleDB compressed_data</text><text x=\"356\" y=\"356\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >内核自己定义载荷格式</text><text x=\"670\" y=\"298\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >优点</text><text x=\"670\" y=\"328\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\" >能绑定页、类型、压缩</text><text x=\"670\" y=\"356\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >与执行器、批次元数据联动</text><text x=\"1016\" y=\"298\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >代价</text><text x=\"1016\" y=\"328\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"400\" >跨系统通用性弱</text><text x=\"1016\" y=\"356\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >格式升级必须极其谨慎</text><rect x=\"40\" y=\"398\" width=\"1320\" height=\"28\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1\" /><text x=\"58\" y=\"417.6\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#BE653B\" font-weight=\"400\" >控制权交到哪里，能力就长在哪里 —— 数据库理解得越深，跨系统通用性就越弱</text></svg>"},{"eyebrow":"核心剖面 · payload 只是最里面一层","title":"把 protobuf 放进数据库，外面还包着五层","lede":"页头、line pointer、tuple header、null bitmap、varlena、TOAST 与索引，都不是 protobuf 能替你省掉的。","caption":"图 07　上：一个 heap tuple 的字节剖面。下：TOAST 与索引两条外延。陶橙段才是 protobuf 负责的范围。","bridge":"固定开销省不掉还只是空间账，更要命的是读路径上的账。","notes":"这张图是今天最该记住的一张。哪怕 payload 是 protobuf，进到 PostgreSQL 的表页里，它前面还排着五样东西：page header 管 LSN 和 checksum，line pointer 管页内定位，tuple header 管 xmin、xmax、命令号和 null bitmap，varlena 管长度，必要的时候还会变成 TOAST 指针。再往后才是你的 payload bytes。太大了走 TOAST 外置，想按内部字段查就得额外挂索引或者表达式索引。所以一句话：protobuf 定义的是 payload 内部怎么解释，数据库定义的是 payload 在页、事务、索引和恢复体系里怎么活下去。这也顺手解释了一个常见的困惑——为什么一条小 protobuf 塞进表里，表并没有像想象中那么小？因为 tuple header、line pointer、varlena header、索引项这些固定开销，一个都没少，你省下的只是最里面那一段。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40\" y=\"20\" width=\"1320\" height=\"38\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"58\" y=\"45\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.5\" fill=\"#245A6B\" font-weight=\"700\" >PostgreSQL 一个 heap tuple 的字节剖面：payload 只是最里面那一层</text><text x=\"650.0\" y=\"72\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"400\" >数据库定义：页 / 定位 / 事务 / 长度 / 恢复</text><line x1=\"40\" y1=\"80\" x2=\"1260\" y2=\"80\" stroke=\"#245A6B\" stroke-width=\"1.4\"/><line x1=\"40\" y1=\"80\" x2=\"40\" y2=\"94\" stroke=\"#245A6B\" stroke-width=\"1.4\"/><line x1=\"1260\" y1=\"80\" x2=\"1260\" y2=\"94\" stroke=\"#245A6B\" stroke-width=\"1.4\"/><rect x=\"40\" y=\"100\" width=\"170\" height=\"110\" rx=\"3\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1\" /><text x=\"125.0\" y=\"148\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.5\" fill=\"#FFFFFF\" font-weight=\"700\" >page header</text><text x=\"125.0\" y=\"180\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#EBF1EE\" font-weight=\"400\" >LSN / checksum</text><rect x=\"210\" y=\"100\" width=\"150\" height=\"110\" rx=\"3\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1\" /><text x=\"285.0\" y=\"148\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.5\" fill=\"#FFFFFF\" font-weight=\"700\" >line pointer</text><text x=\"285.0\" y=\"180\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#EBF1EE\" font-weight=\"400\" >页内偏移</text><rect x=\"360\" y=\"100\" width=\"190\" height=\"110\" rx=\"3\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1\" /><text x=\"455.0\" y=\"148\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.5\" fill=\"#FFFFFF\" font-weight=\"700\" >tuple header</text><text x=\"455.0\" y=\"180\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#EBF1EE\" font-weight=\"400\" >xmin / xmax</text><rect x=\"550\" y=\"100\" width=\"160\" height=\"110\" rx=\"3\" fill=\"#74A5AD\" stroke=\"#74A5AD\" stroke-width=\"1\" /><text x=\"630.0\" y=\"148\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.5\" fill=\"#1B2B33\" font-weight=\"700\" >null bitmap</text><text x=\"630.0\" y=\"180\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" >空值标记</text><rect x=\"710\" y=\"100\" width=\"160\" height=\"110\" rx=\"3\" fill=\"#A4C4C6\" stroke=\"#A4C4C6\" stroke-width=\"1\" /><text x=\"790.0\" y=\"148\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.5\" fill=\"#1B2B33\" font-weight=\"700\" >varlena</text><text x=\"790.0\" y=\"180\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" >长度 / TOAST 指针</text><rect x=\"870\" y=\"100\" width=\"390\" height=\"110\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#FFFFFF\" stroke-width=\"1.4\" /><text x=\"1065.0\" y=\"148\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.5\" fill=\"#BE653B\" font-weight=\"700\" >payload bytes</text><text x=\"1065.0\" y=\"180\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >protobuf 或压缩载荷</text><line x1=\"870\" y1=\"230\" x2=\"1260\" y2=\"230\" stroke=\"#BE653B\" stroke-width=\"1.4\"/><line x1=\"870\" y1=\"216\" x2=\"870\" y2=\"230\" stroke=\"#BE653B\" stroke-width=\"1.4\"/><line x1=\"1260\" y1=\"216\" x2=\"1260\" y2=\"230\" stroke=\"#BE653B\" stroke-width=\"1.4\"/><text x=\"1065.0\" y=\"258\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"600\" >protobuf 只定义这一段内部怎么解释</text><rect x=\"40\" y=\"282\" width=\"620\" height=\"100\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"58\" y=\"310\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"700\" >TOAST：大值外置与可选压缩</text><text x=\"58\" y=\"338\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >解决大值存储，但影响随机读取、VACUUM、备份与缓存行为</text><text x=\"58\" y=\"362\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >payload 太大时会变成 TOAST 指针，不再是页内连续字节</text><rect x=\"680\" y=\"282\" width=\"680\" height=\"100\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"698\" y=\"310\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#2F7A66\" font-weight=\"700\" >索引 / 表达式索引：把可过滤信息拿出来</text><text x=\"698\" y=\"338\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >常查字段投影成列或生成列，才谈得上谓词下推与统计</text><text x=\"698\" y=\"362\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >否则查询只能先找到候选行，再解码整段 payload</text><text x=\"40\" y=\"410\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >越靠左越底层；固定开销一个都没少 —— 小 protobuf 一条条塞进表，不等于有列式压缩收益</text></svg>"},{"eyebrow":"读路径 · 最常见的误会","title":"紧凑，不等于查询快","lede":"过滤条件在外部列，还是藏在 payload 内部，决定了 IO 与 CPU 的账要怎么记。","caption":"图 08　上：命中外部元数据的读路径。下：条件藏在 payload 内部的读路径。两条链的代价完全不同。","bridge":"数据库自己下场做二进制载荷，会做成什么样？看 TimescaleDB 的压缩 chunk。","notes":"来看两条读路径。上面这条，条件落在外部列：tenant_id 等于几、时间在什么范围，索引直接定位到少量候选行，只解码这几行的 payload，IO 和 CPU 都省。下面这条，条件藏在 payload 内部，比如 user_id 等于 42。数据库手里没有能用的外部摘要，只能先把候选行都找出来，再一行一行把整段 bytes 解开，取出那个字段做比较。IO 可能一点没少，CPU 解码也一点没少，而且这还是每行都要做的工作。所以「protobuf 很紧凑」跟「数据库查询一定快」之间，根本没有等号。我特别喜欢一句大白话：对数据库来说，最好的 CPU 是不用做的 CPU。能通过索引、min/max、segmentby 跳过，就别去解码。这个想法不是顺口一说，它会一路贯穿到后面 TimescaleDB 的批次过滤，成为整套设计的地基。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40\" y=\"40\" width=\"170\" height=\"130\" rx=\"4\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"54\" y=\"88\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#FFFFFF\" font-weight=\"700\" >条件在外部列</text><text x=\"54\" y=\"126\" class=\"sv serif\" text-anchor=\"start\" font-size=\"24.0\" fill=\"#FFFFFF\" font-weight=\"700\" >省</text><rect x=\"230\" y=\"55\" width=\"220\" height=\"100\" rx=\"5\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"340.0\" y=\"98.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#2F7A66\" font-weight=\"600\" >WHERE tenant_id = 1</text><text x=\"340.0\" y=\"120.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >AND time &gt; now()-1h</text><line x1=\"454\" y1=\"105\" x2=\"489.2\" y2=\"105\" stroke=\"#2F7A66\" stroke-width=\"1.8\"/><polygon points=\"494,105 488,101.7 488,108.3\" fill=\"#2F7A66\"/><rect x=\"500\" y=\"55\" width=\"220\" height=\"100\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" st =\"middle\" font-size=\"13.2\" fill=\"#BE653B\" font-weight=\"600\" >WHERE payload.user_id = 42</text><text x=\"340.0\" y=\"286.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >字段藏在 bytes 里</text><line x1=\"454\" y1=\"271\" x2=\"489.2\" y2=\"271\" stroke=\"#BE653B\" stroke-width=\"1.8\"/><polygon points=\"494,271 488,267.7 488,274.3\" fill=\"#BE653B\"/><rect x=\"500\" y=\"221\" width=\"220\" height=\"100\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"610.0\" y=\"264.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >没有可用的外部摘要</text><text x=\"610.0\" y=\"286.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >优化器看不懂内部</text><line x1=\"724\" y1=\"271\" x2=\"759.2\" y2=\"271\" stroke=\"#BE653B\" stroke-width=\"1.8\"/><polygon points=\"764,271 758,267.7 758,274.3\" fill=\"#BE653B\"/><rect x=\"770\" y=\"221\" width=\"220\" height=\"100\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"880.0\" y=\"264.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >扫描全部候选行</text><text x=\"880.0\" y=\"286.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >IO 一点没少</text><line x1=\"994\" y1=\"271\" x2=\"1029.2\" y2=\"271\" stroke=\"#BE653B\" stroke-width=\"1.8\"/><polygon points=\"1034,271 1028,267.7 1028,274.3\" fill=\"#BE653B\"/><rect x=\"1040\" y=\"221\" width=\"220\" height=\"100\" rx=\"5\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.1\" /><text x=\"1150.0\" y=\"264.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"600\" >逐行解码整段 bytes</text><text x=\"1150.0\" y=\"286.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >CPU 也一点没少</text><rect x=\"40\" y=\"366\" width=\"1320\" height=\"50\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1\" /><text x=\"58\" y=\"396.95\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#46585F\" font-weight=\"400\" >IO 可能少不了，CPU 解码也少不了 —— 对数据库来说，最好的 CPU 是不用做的 CPU</text></svg>"},{"eyebrow":"内核样本 · 换一种思路","title":"TimescaleDB：一行，装下一批行","lede":"压缩 chunk 把多条记录组合成一行；列里放的不是普通 SQL array，而是自定义类型 compressed_data。","caption":"图 09　左：未压缩行存。中：RowCompressor。右：压缩 chunk 里的一行批次及其五个组成部分。","bridge":"那这批元数据和载荷，具体是怎么一步步写出来的？","notes":"TimescaleDB 的压缩，更像是在 PostgreSQL 里做按 chunk 的列式批次。左边是没压缩的普通行存，一行一个时间点，time、device_id、cpu、status 四列。压缩的时候，先按 orderby 排序、按 segmentby 分组，攒够一批，交给 RowCompressor。右边是压缩 chunk 里的一行——注意，是一行，但它代表左边那一整批原始行。这一行里，segmentby 列保留原值不压缩，_ts_meta_count 记着这批有多少行，min/max 元数据记着时间范围，剩下的度量列 cpu、status 各自变成一个 compressed_data 载荷。官方文档描述过这个 array-like 结构，源码里它不是普通 SQL array，是自定义类型。为什么要这么绕？因为执行器想在解压之前就有东西可判断。你给它 min/max，它就能整批跳过；你什么都不给，它就只能逐批解开。所以这批元数据不是附属品，是读路径的地基。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40\" y=\"26\" width=\"460\" height=\"344\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"58\" y=\"58\" class=\"sv serif\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#245A6B\" font-weight=\"700\" >未压缩 chunk · 普通行存</text><rect x=\"56\" y=\"76\" width=\"104\" height=\"28\" rx=\"2\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1\" /><text x=\"108.0\" y=\"95\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#FFFFFF\" font-weight=\"700\" >time</text><rect x=\"164\" y=\"76\" width=\"104\" height=\"28\" rx=\"2\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1\" /><text x=\"216.0\" y=\"95\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#FFFFFF\" font-weight=\"700\" >device_id</text><rect x=\"272\" y=\"76\" width=\"104\" height=\"28\" rx=\"2\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1\" /><text x=\"324.0\" y=\"95\" class=\"sv mono\" t EA\" stroke-width=\"1\" /><line x1=\"1062\" y1=\"86\" x2=\"1062\" y2=\"114\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"852\" y=\"106\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"700\" >segmentby 原值</text><text x=\"1070\" y=\"106\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >device_id = d01 · 不压缩</text><rect x=\"838\" y=\"132\" width=\"504\" height=\"48\" rx=\"3\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1\" /><line x1=\"1062\" y1=\"142\" x2=\"1062\" y2=\"170\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"852\" y=\"162\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"700\" >_ts_meta_count</text><text x=\"1070\" y=\"162\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >这批原始行的数量</text><rect x=\"838\" y=\"188\" width=\"504\" height=\"48\" rx=\"3\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1\" /><line x1=\"1062\" y1=\"198\" x2=\"1062\" y2=\"226\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"852\" y=\"218\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"700\" >min / max 元数据</text><text x=\"1070\" y=\"218\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >orderby 时间范围 · 解压前可过滤</text><rect x=\"838\" y=\"244\" width=\"504\" height=\"48\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><line x1=\"1062\" y1=\"254\" x2=\"1062\" y2=\"282\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"852\" y=\"274\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"700\" >cpu :: compressed_data</text><text x=\"1070\" y=\"274\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >按类型选 GORILLA / ARRAY 等算法</text><rect x=\"838\" y=\"300\" width=\"504\" height=\"48\" rx=\"3\" fill=\"#E5EFF0\" stro =\"206\" x2=\"610\" y2=\"206\" stroke=\"#245A6B\" stroke-width=\"1.5\"/><line x1=\"610\" y1=\"88\" x2=\"610\" y2=\"324\" stroke=\"#245A6B\" stroke-width=\"1.5\"/><line x1=\"610\" y1=\"88\" x2=\"746.4\" y2=\"88\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"752,88 745,84.15 745,91.85\" fill=\"#245A6B\"/><rect x=\"760\" y=\"36\" width=\"600\" height=\"104\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"778\" y=\"68\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#2F7A66\" font-weight=\"700\" >类型 OID</text><text x=\"778\" y=\"96\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >element_type 决定 by-value 还是 by-reference、</text><text x=\"778\" y=\"120\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >长度与对齐；恢复的是 Datum 不是裸字节</text><line x1=\"610\" y1=\"206\" x2=\"746.4\" y2=\"206\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"752,206 745,202.15 745,209.85\" fill=\"#245A6B\"/><rect x=\"760\" y=\"154\" width=\"600\" height=\"104\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"778\" y=\"186\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#2F7A66\" font-weight=\"700\" >元素边界</text><text x=\"778\" y=\"214\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >变长元素拼在一起，不知道每个元素的</text><text x=\"778\" y=\"238\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >sizes 就切不开，也还原不出一列值</text><line x1=\"610\" y1=\"324\" x2=\"746.4\" y2=\"324\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"752,324 745,320.15 745,327.85\" fill=\"#245A6B\"/><rect x=\"760\" y=\"272\" width=\"600\" height=\"104\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"778\" y=\"304\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#2F7A66\" font-weight=\"700\" >Datum 与对齐</text><text x=\"778\" y=\"332\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >MAXALIGN、varlena、TOAST 都要遵守；</text><text x=\"778\" y=\"356\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >还有自检与批次过滤的速度要求</text><rect x=\"40\" y=\"386\" width=\"1320\" height=\"40\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1\" /><text x=\"58\" y=\"411\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >共用基础设施 Simple8bRleSerialized：num_elements / num_blocks / slots[]；selector + 64-bit data，selector 15 表示 RLE run</text></svg>"},{"eyebrow":"辨析 · 最容易混的一处","title":"datum、send/recv、text I/O 是三件事","lede":"页内 datum 受内存布局约束；binary send/recv 是协议接口；textual in/out 只是 base64 表示。","caption":"图 14　三层平行对照：形态、边界与用途。源码分析时务必分开，否则会把协议误当成落盘。","bridge":"抽象讲完了，我们让读路径动起来，亲眼看一次批次过滤。","notes":"三层，一定分清。第一层是页内或者内存里的 datum，以 varlena header 开头，后面跟 TimescaleDB 自定义结构，它受内存布局、MAXALIGN 和 TOAST 约束，是堆表页里真实保存的东西。第二层是类型的 binary send/recv，tsl_compressed_data_send 会先发算法号，再让算法自己把载荷写进 StringInfo，recv 反过来读编号再 dispatch；这层服务的是网络、COPY binary 和内部函数边界。第三层是 textual in/out，源码注释说得很直白，就是 binary representation 的 base64 编码，给 SQL 文本输入输出用的。很多文章把这三件事揉成一团，说「堆表页里的字节就是这样排的」，其实不对。protobuf 的 wire format 概念上更接近第二层，是一种协议接口；而第一层还得额外遵守 PostgreSQL 的内存布局、对齐和 TOAST 规则。分清这三层，你再去看源码里的 send/recv，就不会把协议当成落盘。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40\" y=\"30\" width=\"250\" height=\"106\" rx=\"4\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1\" /><text x=\"58\" y=\"58\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#FFFFFF\" font-weight=\"400\" >01</text><text x=\"58\" y=\"92\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.5\" fill=\"#FFFFFF\" font-weight=\"700\" >页内 / 内存 datum</text><text x=\"58\" y=\"118\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#FFFFFF\" font-weight=\"400\" >第 1 层</text><rect x=\"300\" y=\"30\" width=\"1060\" height=\"106\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><line x1=\"834\" y1=\"44\" x2=\"834\" y2=\"122\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"316\" y=\"56\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >形态</text><text x=\"316\" y=\"86\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\" >varlena header + TimescaleDB 自定义结构</text><text x=\"316\" y=\"114\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >堆表页里真实保存的字节形态</text><text x=\"850\" y=\"56\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >边界 / 用途</text><text x=\"850\" y=\"86\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\" >受内存布局、MAXALIGN、TOAST 约束</text><text x=\"850\" y=\"114\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#BE653B\" font-weight=\"400\" >不是网络协议里的字节排列</text><rect x=\"40\" y=\"150\" width=\"250\" height=\"106\" rx=\"4\" fill=\"#74A5AD\" stroke=\"#74A5AD\" stroke-width=\"1\" /><text x=\"58\" y=\"178\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >02</text><text x=\"58\" y=\"212\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.5\" fill=\"#1B2B33\" font-weight=\"700\" >binary send / recv</text><text x=\"58\" y=\"238\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#1B2B33\" font-weight=\"400\" >第 2 层</text><rect x=\"300\" y=\"150\" width=\"1060\" height=\"106\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><line x1=\"834\" y1=\"164\" x2=\"834\" y2=\"242\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"316\" y=\"176\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >形态</text><text x=\"316\" y=\"206\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\" >先写算法号，再让算法把载荷写入 StringInfo</text><text x=\"316\" y=\"234\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >tsl_compressed_data_send / recv 负责 dispatch</text><text x=\"850\" y=\"176\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >边界 / 用途</text><text x=\"850\" y=\"206\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\" >网络、COPY binary、内部函数边界</text><text x=\"850\" y=\"234\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#BE653B\" font-weight=\"400\" >不必等同于页内 datum 的字节布局</text><rect x=\"40\" y=\"270\" width=\"250\" height=\"106\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1\" /><text x=\"58\" y=\"298\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >03</text><text x=\"58\" y=\"332\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.5\" fill=\"#1B2B33\" font-weight=\"700\" >textual in / out</text><text x=\"58\" y=\"358\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#1B2B33\" font-weight=\"400\" >第 3 层</text><rect x=\"300\" y=\"270\" width=\"1060\" height=\"106\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><line x1=\"834\" y1=\"284\" x2=\"834\" y2=\"362\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"316\" y=\"296\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >形态</text><text x=\"316\" y=\"326\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\" >binary representation 的 base64 编码</text><text x=\"316\" y=\"354\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >SQL 文本输入输出用的表示</text><text x=\"850\" y=\"296\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >边界 / 用途</text><text x=\"850\" y=\"326\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\" >给人看、给日志看</text><text x=\"850\" y=\"354\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#BE653B\" font-weight=\"400\" >常被误当成前两层的落盘格式</text><rect x=\"40\" y=\"392\" width=\"1320\" height=\"32\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1\" /><text x=\"58\" y=\"413.6\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#BE653B\" font-weight=\"400\" >protobuf 的 wire format 更接近第 2 层；别把它当成第 1 层堆表页里的字节布局</text></svg>"},{"eyebrow":"动画 · 让读路径跑一遍","title":"快不快，看能不能在解压前排除批次","lede":"选择查询谓词与批次数，逐批观察：命中元数据整批跳过，命中不了才按算法解压并重构行。","caption":"图 15　八个压缩批次的过滤演示。绿色跳过、陶橙解压，输出条实时汇总。","bridge":"把这场动画的结论摊开，就是四笔账。","notes":"这一页可以自己动手。上面八个小方块是压缩 chunk 里的八个批次，每个都带着 segmentby 的 device 值和一段 min/max 时间。下面有输入：选一个查询谓词，再拖一下批次数量；然后按播放、单步或者重置。规则很简单——执行器先拿谓词去比 segmentby 和 min/max，能排除的整批跳过，标成绿色；排除不了的才进解压迭代器，标成陶橙。你试试第一个选项，device_id 加时间范围都命中元数据，大多数批次连碰都不用碰；再换成只按 status 过滤，谓词藏在非元数据列里，元数据帮不上忙，几乎每一批都得解开。这正好解释了一个日常现象：同样的表、同样的数据，只改一个 WHERE，速度能差很多。压缩数据查询快不快，关键从来不是「有没有用二进制格式」，而是「能不能在解压前排除批次」。源码里也是这么走的：读 _ts_meta_count、检查批次行数，然后对需要的列调 iterator 的 try_next() 恢复值，必要时 heap_form_tuple 重构输出行。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" id=\"animPath\"><rect x=\"44\" y=\"20\" width=\"1328\" height=\"38\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"60\" y=\"45\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.5\" fill=\"#245A6B\" font-weight=\"700\" >一条查询落到压缩 chunk：先逐批比对元数据，再决定要不要解压</text><g class=\"pcol\" data-i=\"0\"><rect x=\"44\" y=\"72\" width=\"152\" height=\"118\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"120.0\" y=\"98\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#BE653B\" font-weight=\"700\" >B1</text><text x=\"120.0\" y=\"1
