const N = D.length;
let cur = 0, autoTimer = null, autoOn = false, dockMode = null;
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

/* ================= 布局：16:9 等比缩放 + letterbox ================= */
function fit(){
  const vp = $('#viewport');
  const W = vp.clientWidth, H = vp.clientHeight;
  const docked = document.body.classList.contains('docked');
  const dw = docked ? $('#dock').getBoundingClientRect().width : 0;
  const avail = Math.max(320, W - dw);
  const s = Math.min(avail/1600, H/900);
  const st = $('#stage');
  st.style.transform = 'scale(' + s + ')';
  st.style.left = ((avail - 1600*s)/2) + 'px';
  st.style.top  = ((H -  900*s)/2) + 'px';
}
window.addEventListener('resize', fit);

function render(){
  $('#slides').innerHTML = D.map((d,i) =>
    '<section class="slide'+(d.ctrl?' anim':'')+'" id="s'+i+'">'
    + '<div class="eyebrow"><span class="num">'+String(i+1).padStart(2,'0')+' / '+String(N).padStart(2,'0')+'</span>'+d.eyebrow+'</div>'
    + '<h1 class="title">'+d.title+'</h1>'
    + '<div class="lede">'+d.lede+'</div>'
    + '<div class="rule"></div>'
    + '<div class="figwrap">'+d.svg+'</div>'
    + (d.ctrl ? '<div class="ctrls">'+d.ctrl+'</div>'
              + (d.disclaim ? '<div class="disclaim">'+d.disclaim+'</div>' : '')
              + '<div class="caption caplow">'+d.caption+'</div>'
              : '<div class="caption">'+d.caption+'</div>')
    + '<div class="bridge"><span class="bk">承接 · NEXT</span>'+d.bridge+'</div>'
    + '<div class="footer"><div class="fbar"><i id="fbar'+i+'"></i></div>'
    + '<span class="fl">数据库筑基课 · hll 存储结构</span>'
    + '<span class="fr">'+String(i+1).padStart(2,'0')+' / '+String(N).padStart(2,'0')+'</span></div>'
    + '</section>').join('');
}

function go(i, silent){
  i = Math.max(0, Math.min(N-1, i));
  pauseAllAnims();
  $$('.slide').forEach((el,k)=>el.classList.toggle('on', k===i));
  cur = i;
  try{ localStorage.setItem('hll-slide', String(i)); }catch(e){}
  $('#pg').textContent = String(i+1).padStart(2,'0') + ' / ' + String(N).padStart(2,'0');
  $('#track i').style.width = ((i+1)/N*100)+'%';
  for(let k=0;k<N;k++){ const b=$('#fbar'+k); if(b) b.style.width = (k<=i?100:0)+'%'; }
  if(dockMode==='notes') renderDock('notes');
  if(dockMode==='toc') renderDock('toc');
  if(!silent) toast(D[i].eyebrow + ' · ' + D[i].title);
}
function next(){ if(cur<N-1) go(cur+1); else stopAuto(); }
function prev(){ if(cur>0) go(cur-1); }
function jump(i){ closeDock(); go(i); }

function toast(s){
  const t=$('#toast'); t.textContent=s; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1700);
}

/* ================= 自动播放 ================= */
function stopAuto(){
  autoOn=false; clearInterval(autoTimer); autoTimer=null;
  $('#btnAuto').textContent='▶ 自动播放 P'; $('#btnAuto').classList.remove('act');
}
function toggleAuto(){
  if(autoOn){ stopAuto(); toast('已暂停自动播放'); return; }
  autoOn=true; $('#btnAuto').textContent='❚❚ 暂停 P'; $('#btnAuto').classList.add('act');
  autoTimer=setInterval(()=>{ if(cur<N-1) go(cur+1,true); else stopAuto(); }, 13000);
  toast('自动播放：每 13 秒一页');
}

/* ================= 右侧页内开窗：讲稿 / 全文 / 目录 / 帮助 ================= */
function closeDock(){
  if(!dockMode) return;
  dockMode=null;
  document.body.classList.remove('docked');
  $$('.chrome button').forEach(b=>b.classList.remove('act'));
  fit();
}
function toggleDock(mode){
  if(dockMode===mode){ closeDock(); return; }
  dockMode=mode;
  document.body.classList.add('docked');
  $$('.chrome button').forEach(b=>b.classList.remove('act'));
  const bmap={notes:'#btnNotes',all:'#btnAll',toc:'#btnToc',help:'#btnHelp'};
  const bb=$(bmap[mode]); if(bb) bb.classList.add('act');
  renderDock(mode);
  fit();
  $('#dockBody').scrollTop = 0;
}
function renderDock(mode){
  const titles={notes:'本页讲稿',all:'全文讲稿',toc:'目录',help:'快捷键'};
  $('#dockTitle').textContent=titles[mode];
  $('#dockSub').textContent=mode==='toc' ? ('共 '+N+' 页') : (String(cur+1).padStart(2,'0')+' / '+String(N).padStart(2,'0'));
  let h='';
  if(mode==='notes'){
    const d=D[cur];
    h='<div class="tag">'+String(cur+1).padStart(2,'0')+' · '+d.eyebrow+'</div>'
     +'<div class="nt">'+d.title+'</div>'
     +'<p class="np">'+d.notes+'</p>'
     +'<div class="nb">承接下一页：'+d.bridge+'</div>'
     +'<p class="lead" style="margin-top:22px">按 N 再按一次关闭；按 T 通读全文；按 Esc 关闭本窗。</p>';
  } else if(mode==='all'){
    h='<p class="lead">按顺序通读。每页末尾的「承接」就是通往下一页的逻辑接口。</p>'
      + D.map((d,i)=>'<div class="sec"><span class="tag">'+String(i+1).padStart(2,'0')+' · '+d.eyebrow+'</span>'
        +'<div class="nt">'+d.title+'</div><p class="np">'+d.notes+'</p>'
        +'<div class="nb">'+d.bridge+'</div></div>').join('');
  } else if(mode==='toc'){
    h='<p class="lead">点击任意一页跳转。共 '+N+' 页，按 G 再按一次关闭。</p><div class="tocgrid">'
      + D.map((d,i)=>'<a class="'+(i===cur?'cur':'')+'" onclick="jump('+i+')"><span>'
        +String(i+1).padStart(2,'0')+'</span>'+d.title+'</a>').join('') + '</div>';
  } else {
    h='<p class="lead">演说时的操作备忘。全屏后底部按键条依然可见。</p><div class="keys">'
     +'<div><kbd>→ / 空格</kbd>下一页</div><div><kbd>←</kbd>上一页</div>'
     +'<div><kbd>G</kbd>目录</div><div><kbd>N</kbd>本页讲稿</div>'
     +'<div><kbd>T</kbd>全文讲稿</div><div><kbd>P</kbd>自动播放 / 暂停</div>'
     +'<div><kbd>F</kbd>全屏 / 退出全屏</div><div><kbd>1–9</kbd>直接跳页 1–9</div>'
     +'<div><kbd>Home / End</kbd>首页 / 末页</div><div><kbd>Esc</kbd>关闭开窗 / 退出全屏</div>'
     +'<div><kbd>?</kbd>本帮助</div><div><kbd>点击底部按钮</kbd>同上</div></div>'
     +'<p class="lead" style="margin-top:24px">动画页：改输入值 → ▶ 播放 / 暂停 → ⏭ 单步 → ↺ 重置。</p>';
  }
  $('#dockBody').innerHTML=h;
}

/* ================= 全屏（底部按键条始终保留） ================= */
function fs(){
  const el=document.documentElement;
  const entering=!document.body.classList.contains('immersive');
  if(entering){
    document.body.classList.add('immersive');
    $('#btnFs').textContent='退出全屏 F';
    fit(); toast('全屏：底部按键条保持可见（F 或 Esc 退出）');
    try{ const pr=el.requestFullscreen?el.requestFullscreen():null; if(pr&&pr.catch) pr.catch(()=>{}); }catch(e){}
  }else{
    document.body.classList.remove('immersive');
    $('#btnFs').textContent='全屏 F';
    fit(); toast('已退出全屏');
    try{ if(document.fullscreenElement&&document.exitFullscreen) document.exitFullscreen(); }catch(e){}
  }
}
document.addEventListener('fullscreenchange', ()=>{
  if(!document.fullscreenElement && document.body.classList.contains('immersive')){
    document.body.classList.remove('immersive');
    const b=$('#btnFs'); if(b) b.textContent='全屏 F';
  }
  fit();
});

/* ================= 动画 A：一次写入，只改一个寄存器 ================= */
/* 教学示意：m=16，确定性模拟 hash，非 MurmurHash3；估计值不用于统计结论 */
function simHash(i){
  let h = Math.imul(i ^ 0x9E3779B9, 2654435761) >>> 0;
  h ^= h >>> 16; h = Math.imul(h, 2246822507) >>> 0;
  h ^= h >>> 13; h = Math.imul(h, 3266489909) >>> 0;
  h ^= h >>> 16; return h >>> 0;
}
function ctz(x){ x = x >>> 0; if(x===0) return 32; return 31 - Math.clz32(x & -x); }
function estimate(reg){
  const m=16, sum=reg.reduce((a,r)=>a+Math.pow(2,-r),0);
  const alpha=0.673;
  let E=alpha*m*m/sum;
  const zeros=reg.filter(r=>r===0).length;
  if(zeros>0 && E<2.5*m) E=m*Math.log(m/zeros);
  return E;
}
const A={step:0,playing:false,timer:null,reg:new Array(16).fill(0),last:-1};
function aTotal(){ const v=parseInt($('#aN').value,10); return isNaN(v)?24:Math.max(1,Math.min(200,v)); }
function aPaint(){
  const t=aTotal();
  A.reg=new Array(16).fill(0);
  let lastNdx=-1,lastRank=0,lastH=0;
  for(let i=1;i<=A.step;i++){
    const h=simHash(i), ndx=h&15, ss=h>>>4;
    const r=ss===0?0:Math.min(31,ctz(ss)+1);
    if(r>A.reg[ndx]) A.reg[ndx]=r;
    lastNdx=ndx; lastRank=r; lastH=h;
  }
  for(let i=0;i<16;i++){
    const cell=$('#aCell'+i), val=$('#aVal'+i);
    if(!cell) continue;
    const hot=(i===lastNdx && A.step>0);
    cell.setAttribute('fill', hot?CACC_L:A.reg[i]>0?CPRIL:'#FFFFFF');
    cell.setAttribute('stroke', hot?CACC:CPRIM);
    cell.setAttribute('stroke-width', hot?'2':'1.1');
    val.textContent=String(A.reg[i]);
    val.setAttribute('fill', hot?CACC:CPRI);
  }
  const nz=A.reg.filter(r=>r>0).length, E=estimate(A.reg);
  $('#aCount').textContent=String(A.step);
  $('#aNonZero').textContent=String(nz);
  $('#aEst').textContent=E.toFixed(1);
  $('#aCur').textContent=A.step>0?('user_id = '+A.step):'user_id = —';
  $('#aHash').textContent=A.step>0?('0x'+(lastH>>>0).toString(16).padStart(8,'0').toUpperCase()+'  (示意)'):'MurmurHash3 · 固定 seed · 64 位';
  $('#aNdx').textContent=A.step>0?('ndx = '+lastNdx+'　(低 4 位)'):'ndx = hashval & (m - 1)';
  $('#aRank').textContent=A.step>0?('rank = '+lastRank+'　(ctz + 1)'):'ctz(hashval >> log2m) + 1';
  $('#aOut').innerHTML=A.step===0
    ? '待播放 · 共 <b>'+t+'</b> 个示意元素'
    : '已加入 <b>'+A.step+'</b> / '+t+' 个 · 更新 R'+lastNdx+' → <b>'+lastRank+'</b> · 估计 ≈ <b>'+E.toFixed(1)+'</b>';
}
/* ================= 动画 B：逐寄存器 max 的 rollup ================= */
const B={step:0,playing:false,timer:null,acc:new Array(16).fill(0)};
function uTotal(){ const v=parseInt($('#uN').value,10); return isNaN(v)?4:Math.max(2,Math.min(7,v)); }
function dayReg(d){
  const r=new Array(16).fill(0);
  for(let i=1;i<=14+d*5;i++){
    const h=simHash(i*31+d*101+7), ndx=h&15, ss=h>>>4;
    const v=ss===0?0:Math.min(31,ctz(ss)+1);
    if(v>r[ndx]) r[ndx]=v;
  }
  return r;
}
function uPaint(){
  const t=uTotal();
  B.acc=new Array(16).fill(0);
  for(let d=0;d<7;d++){
    const row=$('#uRow'+d); if(!row) continue;
    row.setAttribute('opacity', d<t ? (d<B.step?'1':'0.62') : '0.14');
    const r=dayReg(d);
    for(let i=0;i<16;i++){
      const c=$('#uCell'+d+'_'+i), v=$('#uVal'+d+'_'+i);
      if(!c) continue;
      c.setAttribute('fill', d<B.step?'#FFFFFF':'#F7F6F2');
      v.textContent=String(r[i]);
    }
    if(d<B.step) for(let i=0;i<16;i++) if(r[i]>B.acc[i]) B.acc[i]=r[i];
  }
  for(let i=0;i<16;i++){
    const c=$('#uRCell'+i), v=$('#uRVal'+i); if(!c) continue;
    c.setAttribute('fill', B.acc[i]>0?CACC_L:'#F7E9DE');
    v.textContent=String(B.acc[i]);
  }
  const E=estimate(B.acc);
  $('#uOut').innerHTML=B.step===0
    ? '待播放 · 共 <b>'+t+'</b> 天的 HLL 待合并'
    : '已合并 <b>'+B.step+'</b> / '+t+' 天 · 逐寄存器 max · 累计估计 ≈ <b>'+E.toFixed(1)+'</b>（示意）';
}
/* ================= 动画 C：log2m 精度旋钮 ================= */
const PDATA={10:[1024,3.25,640],11:[2048,2.30,1280],12:[4096,1.63,2560],
             13:[8192,1.15,5120],14:[16384,0.81,10240]};
const C={step:0,playing:false,timer:null};
function pVal(){ const v=parseInt($('#pL').value,10); return isNaN(v)?10:Math.max(10,Math.min(14,v)); }
/* C 以「当前档位」为状态，step 表示从 10 起已推进几档 */
function cLevel(){ return 10+C.step; }
function cPaint(){
  const lv=cLevel(), d=PDATA[lv];
  $('#pRv').textContent=String(lv);
  if($('#pL').value!==String(lv)) $('#pL').value=String(lv);
  for(let l=10;l<=14;l++){
    const row=$('#pRow'+l); if(!row) continue;
    const on=(l===lv);
    row.setAttribute('fill', on?CPRIL:'#FFFFFF');
    row.setAttribute('stroke', on?CPRI:'#D9D5CB');
    row.setAttribute('stroke-width', on?'1.8':'1');
    const e=$('#pErr'+l), s=$('#pSpc'+l);
    if(e) e.setAttribute('fill', on?CGRN:'#7BA6AF');
    if(s) s.setAttribute('fill', on?CACC:'#BE653B');
  }
  $('#pOut').innerHTML='log2m = <b>'+lv+'</b> · m = <b>'+d[0]+'</b> · 标准误差 ≈ <b>'+d[1].toFixed(2)+'%</b> · FULL 主体 <b>'+d[2]+' B</b>';
}
/* ================= 动画统一控制 ================= */
const ANIM={
  A:{o:A,total:aTotal,paint:aPaint,play:'#aPlay',out:'#aOut'},
  B:{o:B,total:uTotal,paint:uPaint,play:'#uPlay',out:'#uOut'},
  C:{o:C,total:()=>5,paint:cPaint,play:'#pPlay',out:'#pOut'}
};
function animPause(k){
  const a=ANIM[k]; if(!a.o.playing) return;
  a.o.playing=false; clearInterval(a.timer); a.timer=null;
  const b=$(a.play); if(b){ b.textContent='▶ 播放'; b.classList.remove('play'); }
}
function pauseAllAnims(){ Object.keys(ANIM).forEach(animPause); }
function animToggle(k){
  const a=ANIM[k], o=a.o;
  if(o.playing){ animPause(k); return; }
  if(o.step>=a.total()) o.step=0;
  o.playing=true;
  const b=$(a.play); if(b){ b.textContent='❚❚ 暂停'; b.classList.add('play'); }
  a.paint();
  a.timer=setInterval(()=>{
    o.step++; a.paint();
    if(o.step>=a.total()) animPause(k);
  }, k==='C'?1000:620);
}
function animStep(k){
  const a=ANIM[k], o=a.o; animPause(k);
  if(o.step>=a.total()) o.step=0;
  o.step++; a.paint();
}
function animReset(k){
  const a=ANIM[k], o=a.o; animPause(k);
  o.step=0;
  if(k==='C'){ $('#pL').value='10'; }
  a.paint();
}
const CACC_L='#F7E9DE', CPRIL='#E5EFF0', CPRIM='#7BA6AF', CPRI='#245A6B',
      CGRN='#2F7A66', CACC='#BE653B';

/* ================= 键盘 ================= */
document.addEventListener('keydown', e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  const k=e.key;
  const typing=(tag==='input'||tag==='select'||tag==='textarea');
  const navKey=(k.indexOf('Arrow')===0||k===' '||k==='Home'||k==='End'||k==='PageUp'||k==='PageDown');
  if(k==='Escape'){
    if(dockMode){ closeDock(); return; }
    if(document.body.classList.contains('immersive')){ fs(); return; }
    return;
  }
  if(typing) return;   /* 输入控件内不抢按键，避免数字键误跳页 */
  if(k==='ArrowRight'||k===' '||k==='PageDown'){ e.preventDefault(); next(); }
  else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); prev(); }
  else if(k==='f'||k==='F'||e.code==='KeyF'){ e.preventDefault(); fs(); }
  else if(k==='g'||k==='G'){ e.preventDefault(); toggleDock('toc'); }
  else if(k==='n'||k==='N'){ e.preventDefault(); toggleDock('notes'); }
  else if(k==='t'||k==='T'){ e.preventDefault(); toggleDock('all'); }
  else if(k==='p'||k==='P'){ e.preventDefault(); toggleAuto(); }
  else if(k==='?'||k==='h'||k==='H'){ e.preventDefault(); toggleDock('help'); }
  else if(k==='Home'){ e.preventDefault(); go(0); }
  else if(k==='End'){ e.preventDefault(); go(N-1); }
  else if(/^[1-9]$/.test(k)){ go(parseInt(k,10)-1); }
});

/* ================= 启动 ================= */
$('#btnPrev').onclick=prev;
$('#btnNext').onclick=next;
$('#btnToc').onclick=()=>toggleDock('toc');
$('#btnNotes').onclick=()=>toggleDock('notes');
$('#btnAll').onclick=()=>toggleDock('all');
$('#btnAuto').onclick=toggleAuto;
$('#btnFs').onclick=fs;
$('#btnHelp').onclick=()=>toggleDock('help');
render();                       /* 必须先渲染，控件 DOM 才存在 */
$('#aN').addEventListener('change',()=>{ animReset('A'); });
$('#uN').addEventListener('change',()=>{ animReset('B'); });
$('#pL').addEventListener('input',()=>{ animPause('C'); C.step=Math.max(0,Math.min(4,pVal()-10)); cPaint(); });
aPaint(); uPaint(); cPaint();
fit();
let start=0; try{ start=parseInt(localStorage.getItem('hll-slide')||'0',10)||0; }catch(e){}
go(Math.max(0,Math.min(N-1,start)), true);
</script>
