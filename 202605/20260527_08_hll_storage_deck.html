<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数据库筑基课 · hll 存储结构｜从成员清单到可合并摘要</title>
<!-- 单文件交付：所有原理图均为现场绘制的内联 SVG，零外部图片 / 字体 / 脚本依赖。 -->
<style>
:root{
  --bg:#F7F6F2; --sub:#F1EFE9; --ink:#1B2B33; --ink2:#46585F; --muted:#89938F; --line:#D9D5CB;
  --primary:#245A6B; --prim-l:#E5EFF0; --prim-m:#7BA6AF; --accent:#BE653B; --acc-l:#F7E9DE;
  --green:#2F7A66; --green-l:#E4F0EA; --gold:#AE8A3E; --gold-l:#F5EDDC; --white:#FFFFFF;
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#E9E7E1}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
#viewport{position:absolute;inset:0 0 58px 0;overflow:hidden}
#stage{position:absolute;width:1600px;height:900px;background:var(--bg);
  transform-origin:top left;box-shadow:0 18px 60px rgba(27,43,51,.13);
  transition:transform .42s cubic-bezier(.2,.7,.2,1),left .42s cubic-bezier(.2,.7,.2,1),top .42s cubic-bezier(.2,.7,.2,1)}
.slide{position:absolute;inset:0;display:none}
.slide.on{display:block;animation:fadein .42s cubic-bezier(.2,.7,.2,1)}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{position:absolute;left:64px;top:44px;font-size:13px;letter-spacing:3.4px;
  color:var(--primary);font-weight:600}
.eyebrow .num{font-family:var(--mono);letter-spacing:1px;color:var(--accent);margin-right:14px}
h1.title{position:absolute;left:64px;top:70px;width:1472px;margin:0;font-family:var(--serif);
  font-size:44px;line-height:1.25;font-weight:700;letter-spacing:1.2px;color:var(--ink)}
.lede{position:absolute;left:64px;top:139px;width:1472px;height:40px;overflow:hidden;
  font-size:19px;color:var(--ink2);line-height:1.5;letter-spacing:.3px}
.rule{position:absolute;left:64px;top:181px;width:1472px;height:1px;background:var(--line)}
.figwrap{position:absolute;left:100px;top:198px;width:1400px;height:430px;overflow:hidden}
svg.figure{display:block;overflow:hidden}
svg.figure text{font-family:var(--sans)}
svg.figure text.serif{font-family:var(--serif)}
svg.figure text.mono{font-family:var(--mono)}
.caption{position:absolute;left:100px;top:638px;width:1400px;font-size:13px;
  color:var(--muted);letter-spacing:.4px;line-height:1.5;height:22px;overflow:hidden}
.caption.caplow{top:702px;color:var(--ink2);height:20px}
.disclaim{position:absolute;left:100px;top:680px;width:1400px;font-size:12px;
  color:var(--accent);letter-spacing:.3px;height:18px}
.bridge{position:absolute;left:64px;top:706px;width:1472px;font-size:20px;
  color:var(--accent);line-height:1.55;letter-spacing:.4px;padding-left:18px;
  border-left:3px solid var(--accent);font-family:var(--serif)}
.slide.anim .bridge{top:730px}
.bridge .bk{font-family:var(--sans);font-size:13px;color:var(--muted);
  letter-spacing:2px;display:block;margin-bottom:2px}
.footer{position:absolute;left:64px;top:846px;width:1472px;height:1px;background:var(--line)}
.footer .fl{position:absolute;left:0;top:14px;font-size:12.5px;color:var(--muted);letter-spacing:2px}
.footer .fr{position:absolute;right:0;top:12px;font-family:var(--mono);font-size:14px;color:var(--ink2)}
.footer .fbar{position:absolute;left:0;right:0;top:-1px;height:2px;background:transparent}
.footer .fbar i{display:block;height:2px;background:var(--primary);width:0;transition:width .4s ease}

/* 动画控件：独立条带，绝不覆盖图 */
.ctrls{position:absolute;left:100px;top:632px;width:1400px;height:44px;display:flex;
  align-items:center;gap:10px}
.ctrls label{font-size:13.5px;color:var(--ink2);white-space:nowrap}
.ctrls input[type=number]{font-family:var(--mono);font-size:13.5px;color:var(--ink);
  background:#fff;border:1px solid var(--line);border-radius:4px;padding:5px 8px;outline:none;width:78px}
.ctrls input[type=range]{width:150px;accent-color:var(--primary);border:none;background:transparent}
.ctrls .rv{font-family:var(--mono);font-size:14px;color:var(--primary);min-width:26px}
.ctrls .btn{min-height:30px;padding:5px 14px;border:1px solid var(--primary);border-radius:4px;
  background:#fff;color:var(--primary);font-size:13.5px;cursor:pointer;font-family:var(--sans)}
.ctrls .btn.play{background:var(--primary);color:#fff}
.ctrls .btn:hover{filter:brightness(.94)}
.ctrls .out{font-size:13.5px;color:var(--ink2);margin-left:auto;min-width:0;flex:1;
  max-width:600px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrls .out b{color:var(--accent);font-weight:600}

/* 底部控制条：全屏 / 沉浸时始终保留，按键始终可见 */
.chrome{position:fixed;left:0;right:0;bottom:0;height:58px;background:#FCFBF8;
  border-top:1px solid var(--line);display:flex;align-items:center;gap:6px;
  padding:0 16px;z-index:40;font-size:13px;color:var(--ink2)}
.chrome .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.chrome button{font-family:var(--sans);font-size:12.6px;color:var(--ink2);background:transparent;
  border:1px solid transparent;border-radius:5px;padding:7px 9px;cursor:pointer;white-space:nowrap}
.chrome button:hover{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome button.act{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome button.k{font-family:var(--mono);font-size:12px;color:var(--muted)}
.chrome .pg{font-family:var(--mono);font-size:14px;color:var(--ink);min-width:76px;text-align:center}
.chrome .track{flex:1;min-width:30px;height:3px;background:var(--line);border-radius:3px;margin:0 10px;position:relative}
.chrome .track i{position:absolute;left:0;top:0;height:3px;background:var(--primary);border-radius:3px;transition:width .35s}
.chrome .keyhint{font-size:11.6px;color:var(--muted);white-space:nowrap;letter-spacing:.2px}
.chrome .keyhint b{font-family:var(--mono);color:var(--primary);font-weight:600}
body.immersive #viewport{inset:0 0 58px 0}
body.immersive .chrome{background:#FFFFFF}

/* 右侧页内讲稿窗（非弹窗、无遮罩） */
#dock{position:fixed;right:0;top:0;bottom:58px;width:min(560px,40vw);background:#FCFBF8;
  border-left:1px solid var(--line);box-shadow:-14px 0 40px rgba(27,43,51,.08);z-index:50;
  transform:translateX(101%);transition:transform .42s cubic-bezier(.2,.7,.2,1);
  display:flex;flex-direction:column}
body.docked #dock{transform:none}
#dock .dh{flex:none;height:64px;border-bottom:1px solid var(--line);display:flex;
  align-items:center;padding:0 26px;gap:12px}
#dock .dh .dt{font-family:var(--serif);font-size:21px;font-weight:700;color:var(--ink);flex:1}
#dock .dh .ds{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:1px}
#dock .dh button{font-family:var(--sans);font-size:12.5px;color:var(--ink2);background:#fff;
  border:1px solid var(--line);border-radius:5px;padding:6px 11px;cursor:pointer}
#dock .dh button:hover{background:var(--prim-l);color:var(--primary)}
#dock .db{flex:1;overflow:auto;padding:22px 30px 44px}
#dock .db::-webkit-scrollbar{width:8px}
#dock .db::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
#dock .lead{font-size:14px;line-height:1.9;color:var(--ink2);letter-spacing:.3px;margin:0 0 18px}
#dock .nt{font-family:var(--serif);font-size:17px;color:var(--primary);margin:22px 0 8px;font-weight:700}
#dock .np{font-size:15px;line-height:2.0;color:var(--ink2);letter-spacing:.3px;margin:0 0 16px}
#dock .nb{font-family:var(--serif);font-size:14.5px;line-height:1.85;color:var(--accent);
  border-left:3px solid var(--accent);padding-left:14px;margin:14px 0 0}
#dock .tag{display:inline-block;font-family:var(--mono);font-size:11.5px;color:var(--muted);
  letter-spacing:1px;margin-bottom:6px}
#dock .sec{border-top:1px solid var(--line);padding:18px 0 6px}
#dock .sec:first-child{border-top:none}
#dock .tocgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
#dock .tocgrid a{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:5px;
  background:#fff;text-decoration:none;color:var(--ink);cursor:pointer;font-size:13px;line-height:1.4}
#dock .tocgrid a:hover{border-color:var(--primary);background:var(--prim-l)}
#dock .tocgrid a.cur{border-color:var(--accent);background:var(--acc-l)}
#dock .tocgrid a span{font-family:var(--mono);font-size:11.5px;color:var(--accent);margin-right:7px}
#dock .keys{display:grid;grid-template-columns:1fr 1fr;gap:9px 20px;font-size:13.5px;line-height:1.7}
#dock .keys kbd{font-family:var(--mono);background:#fff;border:1px solid var(--line);
  border-bottom-width:2px;border-radius:4px;padding:2px 7px;color:var(--primary);margin-right:8px}
.toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);background:var(--ink);
  color:#fff;font-size:13px;padding:9px 16px;border-radius:5px;opacity:0;transition:.3s;
  z-index:80;pointer-events:none}
.toast.on{opacity:1}
@media print{.chrome,#dock,.toast{display:none!important}#viewport{position:static}
  #stage{position:static;transform:none!important;box-shadow:none}
  .slide{display:block!important;page-break-after:always;position:relative;height:900px}}
</style>
</head>
<body>
<div id="viewport"><div id="stage"><div id="slides"></div></div></div>

<div id="dock">
  <div class="dh"><span class="dt" id="dockTitle">本页讲稿</span>
    <span class="ds" id="dockSub"></span>
    <button onclick="closeDock()">关闭 ✕</button></div>
  <div class="db" id="dockBody"></div>
</div>

<div class="chrome">
  <button id="btnPrev">← 上一页</button>
  <button id="btnNext">下一页 →</button>
  <span class="pg" id="pg">01 / 20</span>
  <div class="track" id="track"><i></i></div>
  <div class="sep"></div>
  <button id="btnToc">目录 G</button>
  <button id="btnNotes">本页讲稿 N</button>
  <button id="btnAll">全文讲稿 T</button>
  <button id="btnAuto">▶ 自动播放 P</button>
  <button id="btnFs">全屏 F</button>
  <span class="keyhint"><b>G</b> 目录 · <b>N</b> 讲稿 · <b>T</b> 全文 · <b>P</b> 自动 · <b>F</b> 全屏 · <b>← →</b> 翻页 · <b>Esc</b> 关闭</span>
  <button id="btnHelp" class="k">? 帮助</button>
</div>
<div class="toast" id="toast"></div>

<script>
/* ================= 数据 ================= */
const D = [{"eyebrow":"起点 · 一个被反复卡住的问题","title":"COUNT(DISTINCT) 很准，但代价太高","lede":"日活周活月活、广告独立触达、风控唯一实体、数仓向上 rollup —— 四条业务线，卡在同一处。","caption":"图 01　四类需求的共同瓶颈：要回答「见过没有」，就必须留住足够多的历史元素信息。","bridge":"于是问题变成一句更朴素的话——我们真的需要记住每一个元素吗？","notes":"先别急着看存储结构，我想先说一个你我都遇到过的场景。运营要日活、周活、月活、滚动七天；广告要按活动、渠道、地域估独立触达；风控要按设备、账号、IP 聚唯一实体；数仓要把明细按小时预聚合，之后还要继续往上 rollup。这四件事看起来毫不相干，其实卡在同一处：都得回答「这个元素见过没有」。而精确去重为了回答这句话，就必须把见过的东西留住。所以你会看到三条路都走不通：hash set 越攒越大，维度组合提前物化表会爆炸，按天存精确集合合并起来又贵又慢。今天我想讲的，就是怎么把这个「必须留住」的前提拆掉。","ctrl":null,"disclaim":null,"svg":"<svg class=\"figure\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" role=\"img\" aria-label=\"四类业务需求的共同瓶颈\"><rect x=\"0.0\" y=\"14.0\" width=\"336.0\" height=\"74.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"16.0\" y=\"40.0\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"serif\" data-ff=\"serif\" >运营</text><text x=\"16.0\" y=\"68.0\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >日 / 周 / 月活、滚动 7 日活跃用户数</text><rect x=\"352.0\" y=\"14.0\" width=\"336.0\" height=\"74.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"368.0\" y=\"40.0\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"serif\" data-ff=\"serif\" >广告</text><text x=\"368.0\" y=\"68.0\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >按 campaign、渠道、地域、时间窗口估独立触达</text><rect x=\"704.0\" y=\"14.0\" width=\"336.0\" height=\"74.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"720.0\" y=\"40.0\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"serif\" data-ff=\"serif\" >风控</text><text x=\"720.0\" y=\"68.0\" font-si etter-spacing=\"0\" class=\"serif\" data-ff=\"serif\" >路径一 · 越来越大</text><text x=\"20.0\" y=\"242.0\" font-size=\"13.4\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >保留 hash set / sort set；元素越多，查询中间状态越大</text><text x=\"20.0\" y=\"274.0\" font-size=\"12.6\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >状态随 distinct 数增长</text><rect x=\"470.0\" y=\"180.0\" width=\"450.0\" height=\"124.0\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"470.0\" y=\"180.0\" width=\"5.0\" height=\"124.0\" rx=\"0\" fill=\"#BE653B\" /><text x=\"490.0\" y=\"212.0\" font-size=\"17.0\" fill=\"#BE653B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"serif\" data-ff=\"serif\" >路径二 · 表会爆炸</text><text x=\"490.0\" y=\"242.0\" font-size=\"13.4\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >提前物化多维度组合；维度一多，组合数撑不住</text><text x=\"490.0\" y=\"274.0\" font-size=\"12.6\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >状态随 distinct 数增长</text><rect x=\"940.0\" y=\"180.0\" width=\"450.0\" height=\"124.0\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"940.0\" y=\"180.0\" width=\"5.0\" height=\"124.0\" rx=\"0\" fill=\"#BE653B\" /><text x=\"960.0\" y=\"212.0\" font-size=\"17.0\" fill=\"#BE653B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"serif\" data-ff=\"serif\" >路径三 · 合并很贵</text><text x=\"960.0\" y=\"242.0\" font-size=\"13.4\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >按天保存精确 user_id 集合，空间与合并成本都高</text><text x=\"960.0\" y=\"274.0\" font-size=\"12.6\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >状态随 distinct 数增长</text><rect x=\"0.0\" y=\"328.0\" width=\"1400.0\" height=\"56.0\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"22.0\" y=\"361.1\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >要知道「这个元素见过没有」，就必须留住足够多的历史元素信息 —— 精确去重的状态没有上界。</text><text x=\"22.0\" y=\"410.0\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >一图一命题 · 01</text></svg>"},{"eyebrow":"转向 · 换掉「状态」的定义","title":"把「保存所有元素」换成「保存一份可合并的摘要」","lede":"postgresql-hll 给的不是更快的去重算法，而是另一种状态定义与另一种指标契约。","caption":"图 02　换的不是算法细节，是状态的定义：从成员清单变成固定上界的去重摘要。","bridge":"可这份不存元素的摘要，凭什么能告诉我们「有多少个不同元素」？","notes":"所以 postgresql-hll 给的不是一个更快的去重算法，它换的是状态的定义。以前我们存的是成员清单，来一个存一个，状态跟着 distinct 数线性涨；现在存的是一份可合并的去重摘要，大小有固定上界。这一换，带来三个很实在的收益：空间固定、能合并、而且能直接放在 SQL 的聚合层里用。当然代价得先摆到桌面上：结果是估计值，不能删单个元素，输入必须先 hash，两个 HLL 要合并还得参数一致。这四条不是使用注意事项，它们就是这套方案的边界。所以别把它理解成「更快的 COUNT DISTINCT」，它是另外一种指标契约。可问题来了：一份不存元素的摘要，凭什么能告诉我们有多少个不同元素？","ctrl":null,"disclaim":null,"svg":"<svg class=\"figure\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" role=\"img\" aria-label=\"从成员清单换成可合并去重摘要\"><rect x=\"0.0\" y=\"14.0\" width=\"620.0\" height=\"208.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"20.0\" y=\"42.0\" font-size=\"19.0\" fill=\"#BE653B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"serif\" data-ff=\"serif\" >精确成员清单</text><text x=\"20.0\" y=\"68.0\" font-size=\"13.4\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >来一个存一个，状态随 distinct 数线性增长</text><rect x=\"20.0\" y=\"88.0\" width=\"62.0\" height=\"42.0\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"51.0\" y=\"115.0\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"400\" text-anchor=\"middle\" letter-spacing= n":"图 06　SPARSE 与 FULL 都是 bit-packed；跨语言读写必须按 storage spec，不能文本切片。","bridge":"知道了字节怎么摆，再看它是怎么被写进去的。","notes":"形态换了，磁盘上的字节也得跟着换。PostgreSQL 这边只有一层 varlena 外壳，真正的 HLL 协议从三字节头部开始：byte 0 高四位是 schema 版本、低四位是类型；类型编码是 0 未定义、1 EMPTY、2 EXPLICIT、3 SPARSE、4 FULL。byte 1 高三位存 regwidth 减一，低五位存 log2m。byte 2 最高位补位，接着一位 sparseon，剩下六位是 expthresh，自动模式在这六位里记成 63。后面 body 按类型变化：EXPLICIT 是八字节一个的 hash 值，升序去重；SPARSE 和 FULL 都是 bit-packed。所以跨语言读写一定要按 storage spec 实现，别用文本切片、也别手写偏移去抠。","ctrl":null,"disclaim":null,"svg":"<svg class=\"figure\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" role=\"img\" aria-label=\"HLL 二进制载荷布局\"><rect x=\"0.0\" y=\"16.0\" width=\"168.0\" height=\"62.0\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"14.0\" y=\"41.0\" font-size=\"15.0\" fill=\"#46585F\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >varlena</text><text x=\"14.0\" y=\"64.0\" font-size=\"11.8\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >PostgreSQL 外壳</text><rect x=\"176.0\" y=\"16.0\" width=\"230.0\" height=\"62.0\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"190.0\" y=\"41.0\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >byte 0</text><text x=\"190.0\" y=\"64.0\" font-size=\"11.8\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >version(4) | type(4)</text><rect x=\"414.0\" y=\"16.0\" width=\"250.0\" height=\"62.0\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"428.0\" y=\"41.0\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >byte 1</text><text x=\"428.0\" y=\"64.0\" font-size=\"11.8\" fill=\"#46585F\" font-weigh " letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >index | value 短字</text><rect x=\"486.0\" y=\"262.0\" width=\"428.0\" height=\"26.0\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"498.0\" y=\"280.0\" font-size=\"12.4\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >每项 log2m + regwidth bit</text><rect x=\"486.0\" y=\"292.0\" width=\"428.0\" height=\"26.0\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"498.0\" y=\"310.0\" font-size=\"12.4\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >高位在前，bit-packed</text><rect x=\"940.0\" y=\"164.0\" width=\"460.0\" height=\"170.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"940.0\" y=\"164.0\" width=\"460.0\" height=\"4.0\" rx=\"0\" fill=\"#245A6B\" /><text x=\"956.0\" y=\"192.0\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"serif\" data-ff=\"serif\" >FULL body</text><text x=\"956.0\" y=\"214.0\" font-size=\"12.4\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >全部 2^log2m 个寄存器</text><rect x=\"956.0\" y=\"232.0\" width=\"428.0\" height=\"26.0\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"968.0\" y=\"250.0\" font-size=\"12.4\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >R0 | R1 | R2 | … 连续排列</text><rect x=\"956.0\" y=\"262.0\" width=\"428.0\" height=\"26.0\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"968.0\" y=\"280.0\" font-size=\"12.4\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >每个寄存器 regwidth bit</text><rect x=\"956.0\" y=\"292.0\" width=\"428.0\" height=\"26.0\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"968.0\" y=\"310.0\" font-size=\"12.4\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >末尾不足 8 bit 补 0</text><rect x=\"0.0\" y=\"344.0\" width=\"1400.0\" height=\"62.0\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"18.0\" y=\"368.0\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >byte 0 低 4 位 type 编码：0 undefined / 1 EMPTY / 2 EXPLICIT / 3 SPARSE / 4 FULL；expthresh 自动模式在 6 bit 中记为 63。</text><text x=\"18.0\" y=\"392.0\" font-size=\"12.8\" fill=\"#BE653B\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >SPARSE 与 FULL 均为 bit-packed：跨语言读写必须按 storage spec 实现，不要用文本切片或手写偏移解析。</text><text x=\"22.0\" y=\"424.0\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >一图一命题 · 06</text></svg>"},{"eyebrow":"核心原理 · 写入路径","title":"输入必须 hash，这不是 API 洁癖，是算法前提","lede":"类型专用 hash → MurmurHash3 固定 seed → 64 位 hll_hashval → compressed_add()。","caption":"图 07　源码取低位作桶号、对高位用 ctz 数尾随 0；论文常用 leading zero，方向不同，直觉相同。","bridge":"写进去之后，形态又该怎么升？这一步有个特别容易误解的地方。","notes":"知道了字节怎么摆，再看值是怎么写进去的。postgresql-hll 在类型层面就卡了一道：hll_add 只收 hll_hashval，不收原始业务 ID。这不是 API 洁癖，是算法前提——HLL 的全部推断都建立在输入近似均匀随机上，你要是直接把自增的 user_id 塞进去，「罕见 bit 模式代表大基数」这句话立刻失真。源码里整数、文本、bytea 各有类型专用 hash，最后都走固定 seed 的 MurmurHash3；实在不知道类型才用 hll_hash_any，而它要动态分派，明显更慢。还有个细节：论文常讲 leading zero，源码这里因为拿低位当桶号，对剩余高位用的是 ctz 数尾随零。方向不一样，概率直觉完全一样。","ctrl":null,"disclaim":null,"svg":"<svg class=\"figure\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" role=\"img\" aria-label=\"写入路径与 hash 前提\"><rect x=\"0.0\" y=\"14.0\" width=\"380.0\" height=\"254.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"16.0\" y=\"43.9\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"serif\" data-ff=\"serif\" >hash 函数族</text><text x=\"16.0\" y=\"67.0\" font-size=\"12.6\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >类型专用：hll_hash_integer / bigint</text><text x=\"16.0\" y=\"95.0\" font-size=\"12.6\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >　　　　　hll_hash_text / bytea</text><text x=\"16.0\" y=\"123.0\" font-size=\"12.6\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >　　　　　hll_hash_boolean / smallint</text><text x=\"16.0\" y=\"151.0\" font-size=\"12.6\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >内部：hll_hash_1byte / 2byte</text><text x=\"16.0\" y=\"179.0\" font-size=\"12.6\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >　　　hll_hash_4byte / 8byte / varlena</text><text x=\"16.0\" y=\"207.0\" font-size=\"12.6\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >兜底：hll_hash_any（动态分派，显著更慢）</text><text x=\"16.0\" y=\"235.0\" font-size=\"12.6\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >所有 hll_hash_* 的 seed 默认为 0</text><line x1=\"384.0\" y1=\"140.0\" x2=\"406.0\" y2=\"140.0\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><polygon points=\"414.0,140.0 405.0,135.5 405.0,144.5\" fill=\"#7BA6AF\"/><rect x=\"420.0\" y=\"14.0\" width=\"330.0\" height=\"254.0\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#7BA6AF\" stroke-width=\"1.1\" /><text x=\"436.0\" y=\"43.9\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"serif\" data-ff=\"serif\" >MurmurHash3</text><text x=\"436.0\" y=\"67.0\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >固定长度值 → 专用 hash 入口</text><text x=\"436.0\" y=\"96.0\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >varlena / 未知类型 → binary output</text><text x=\"436.0\" y=\"125.0\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >统一输出 64 位 hll_hashval</text><text x=\"436.0\" y=\"154.0\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >seed 对同一 hll 必须保持恒定</text><text x=\"436.0\" y=\"183.0\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >负 seed 会产生警告，不建议使用</text><line x1=\"754.0\" y1=\"140.0\" x2=\"776.0\" y2=\"140.0\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><polygon points=\"784.0,140.0 775.0,135.5 775.0,144.5\" fill=\"#7BA6AF\"/><rect x=\"790.0\" y=\"14.0\" width=\"610.0\" height=\"254.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"806.0\" y=\"43.9\" font-size=\"17.0\" fill=\"#BE653B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"serif\" data-ff=\"serif\" >compressed_add() 关键逻辑</text><text x=\"806.0\" y=\"67.0\" font-size=\"12.4\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >ndx = elem &amp; (nregs - 1)</text><text x=\"806.0\" y=\"98.0\" font-size=\"12.4\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >ss_val = elem &gt;&gt; log2nregs</text><text x=\"806.0\" y=\"129.0\" font-size=\"12.4\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >p_w = ss_val == 0 ? 0 : ctz(ss_val) + 1</text><text x=\"806.0\" y=\"160.0\" font-size=\"12.4\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >register[ndx] = max(register[ndx], min(p_w, max_register_value))</text><text x=\"806.0\" y=\"191.0\" font-size=\"12.4\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >最终只保留「这个桶见过的最大 rank」</text><rect x=\"0.0\" y=\"282.0\" width=\"690.0\" height=\"84.0\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"18.0\" y=\"310.0\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"serif\" data-ff=\"serif\" >为什么必须先 hash（算法前提，不是 API 洁癖）</text><text x=\"18.0\" y=\"336.0\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >HLL 的全部推断都建立在输入近似均匀随机之上；直接塞自增 ID，</text><text x=\"18.0\" y=\"356.0\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >「罕见 bit 模式代表大基数」这句话立刻失真。</text><rect x=\"710.0\" y=\"282.0\" width=\"690.0\" height=\"84.0\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"728.0\" y=\"310.0\" font-size=\"15.0\" fill=\"#AE8A3E\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"serif\" data-ff=\"serif\" >方向差异不影响概率直觉</text><text x=\"728.0\" y=\"336.0\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >论文常用 leading zero；源码因取低位作桶号，对剩余高位用</text><text x=\"728.0\" y=\"356.0\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >__builtin_ctzll() 数尾随 0 —— 只是数的方向不同。</text><text x=\"22.0\" y=\"424.0\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >一图一命题 · 07</text></svg>"},{"eyebrow":"存储结构 · 晋升与打包","title":"SPARSE 是磁盘形态，不是常驻内存的计算形态","lede":"unpack 之后统一变成 COMPRESSED 寄存器数组；写回时再由 pack 决定外部形态。","caption":"图 08　计算统一在寄存器数组上做；稀疏只是序列化时省空间的外部形态。","bridge":"状态定下来了，怎么把它读成一个「约有多少」的数字？","notes":"写进去之后，形态怎么升？这一步有个特别容易误解的地方。EMPTY 遇到第一个值，如果 expthresh 设成 0 就直接跳过 EXPLICIT 进寄存器，否则先把第一个 hash 值存进精确列表。EXPLICIT 阶段用二分查找插入、保持排序去重，一旦过了阈值，就把已有的 hash 值一个个 replay 到寄存器里。关键在于：源码内存态里没有长期保留的 MST_SPARSE。磁盘上的 SPARSE 被 multiset_unpack 解开之后，就变成内存里的 COMPRESSED 寄存器数组；写回的时候，multiset_pack 再根据 sparseon、g_max_sparse 和空间大小，决定输出成 SPARSE 还是 COMPRESSED。所以 SPARSE 更像一种省空间的序列化外壳，计算从来都在同一份寄存器数组上做。","ctrl":null,"disclaim":null,"svg":"<svg class=\"figure\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" role=\"img\" aria-label=\"磁盘形态与内存态的分离\"><text x=\"0.0\" y=\"22.0\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"serif\" data-ff=\"serif\" >第一层 · 磁盘上的四种表示形态</text><rect x=\"0.0\" y=\"34.0\" width=\"336.0\" height=\"62.0\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"16.0\" y=\"60.0\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >EMPTY</text><text x=\"16.0\" y=\"82.0\" font-size=\"12.6\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >3 B 头部</text><rect x=\"352.0\" y=\"34.0\" width=\"336.0\" height=\"62.0\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"368.0\" y=\"60.0\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >EXPLICIT</text><text x=\"368.0\" y=\"82.0\" font-size=\"12.6\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >3 + 8n B</text><rect x=\"704.0\" y=\"34.0\" width=\"336.0\" height=\"62.0\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"720.0\" y=\"60.0\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >SPARSE</text><text x=\"720.0\" y=\"82.0\" font-size=\"12.6\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >index | value</text><rect x=\"1056.0\" y=\"34.0\" width=\"336.0\" height=\"62.0\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"1072.0\" y=\"60.0\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >FULL</text><text x=\"1072.0\" y=\"82.0\" font-size=\"12.6\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >完整 bit-packed</text><rect x=\"0.0\" y=\"108.0\" width=\"1400.0\" height=\"40.0\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"18.0\" y=\"133.0\" font-size=\"13.2\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >multiset_unpack()　→　解包为内存中的寄存器数组；磁盘 SPARSE 不在内存里长期保留</text><line x1=\"168.0\" y1=\"96.0\" x2=\"168.0\" y2=\"108.0\" stroke=\"#7BA6AF\" stroke-width=\"1.5\"/><line x1=\"520.0\" y1=\"96.0\" x2=\"520.0\" y2=\"108.0\" stroke=\"#7BA6AF\" stroke-width=\"1.5\"/><line x1=\"872.0\" y1=\"96.0\" x2=\"872.0\" y2=\"108.0\" stroke=\"#7BA6AF\" stroke-width=\"1.5\"/><line x1=\"1224.0\" y1=\"96.0\" x2=\"1224.0\" y2=\"108.0\" stroke=\"#7BA6AF\" stroke-width=\"1.5\"/><line x1=\"168.0\" y1=\"148.0\" x2=\"168.0\" y2=\"160.0\" stroke=\"#7BA6AF\" stroke-width=\"1.5\"/><line x1=\"520.0\" y1=\"148.0\" x2=\"520.0\" y2=\"160.0\" stroke=\"#7BA6AF\" stroke-width=\"1.5\"/><line x1=\"872.0\" y1=\"148.0\" x2=\"872.0\" y2=\"160.0\" stroke=\"#7BA6AF\" stroke-width=\"1.5\"/><text x=\"0.0\" y=\"176.0\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"serif\" data-ff=\"serif\" >第二层 · 源码内存态（注意：没有 MST_SPARSE）</text><rect x=\"0.0\" y=\"188.0\" width=\"450.0\" height=\"66.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"16.0\" y=\"216.0\" font-size=\"15.5\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >MST_EMPTY</text><text x=\"16.0\" y=\"240.0\" font-size=\"12.6\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >空集合</text><rect x=\"470.0\" y=\"188.0\" width=\"450.0\" height=\"66.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"486.0\" y=\"216.0\" font-size=\"15.5\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >MST_EXPLICIT</text><text x=\"486.0\" y=\"240.0\" font-size=\"12.6\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >排序 hash 列表，二分插入</text><rect x=\"940.0\" y=\"188.0\" width=\"450.0\" height=\"66.0\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.4\" /><text x=\"956.0\" y=\"216.0\" font-size=\"15.5\" fill=\"#BE653B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >MST_COMPRESSED</text><text x=\"956.0\" y=\"240.0\" font-size=\"12.6\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >完整寄存器数组，所有计算在此进行</text><rect x=\"0.0\" y=\"266.0\" width=\"1400.0\" height=\"40.0\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"18.0\" y=\"291.0\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >multiset_pack()　→　按 sparseon、g_max_sparse 与空间大小决定写回 SPARSE / COMPRESSED；内存态没有 MST_SPARSE，SPARSE 只是序列化外壳</text><line x1=\"225.0\" y1=\"254.0\" x2=\"225.0\" y2=\"266.0\" stroke=\"#7BA6AF\" stroke-width=\"1.5\"/><line x1=\"695.0\" y1=\"254.0\" x2=\"695.0\" y2=\"266.0\" stroke=\"#7BA6AF\" stroke-width=\"1.5\"/><line x1=\"1165.0\" y1=\"254.0\" x2=\"1165.0\" y2=\"266.0\" stroke=\"#7BA6AF\" stroke-width=\"1.5\"/><text x=\"0.0\" y=\"330.0\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"serif\" data-ff=\"serif\" >第三层 · 晋升判定</text><rect x=\"0.0\" y=\"342.0\" width=\"450.0\" height=\"64.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"16.0\" y=\"366.0\" font-size=\"13.6\" fill=\"#BE653B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >EMPTY + 第一个值</text><text x=\"16.0\" y=\"390.0\" font-size=\"12.2\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >expthresh = 0 → 直接 COMPRESSED；否则进 EXPLICIT</text><rect x=\"470.0\" y=\"342.0\" width=\"450.0\" height=\"64.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"486.0\" y=\"366.0\" font-size=\"13.6\" fill=\"#BE653B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >EXPLICIT + 新值</text><text x=\"486.0\" y=\"390.0\" font-size=\"12.2\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >二分查找、去重；过阈值后把已有 hash 逐个 replay</text><rect x=\"940.0\" y=\"342.0\" width=\"450.0\" height=\"64.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"956.0\" y=\"366.0\" font-size=\"13.6\" fill=\"#BE653B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >COMPRESSED 阶段</text><text x=\"956.0\" y=\"390.0\" font-size=\"12.2\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >直接更新寄存器；打包时再决定是否用 SPARSE</text><text x=\"22.0\" y=\"424.0\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >一图一命题 · 08</text></svg>"},{"eyebrow":"核心原理 · 估算路径","title":"调和平均压住极端值，小范围换 linear counting","lede":"multiset_card() 按类型分路：精确、调和平均估计、小范围与大范围修正、NULL。","caption":"图 09　小基数下空桶多，linear counting 更稳；接近 hash 空间上界要单独修正。","bridge":"到现在，它只是一个「能估数的状态」。真正让它在数据库里值钱的，是下一页这个性质。","notes":"状态定下来了，怎么读成「约有多少」？multiset_card 的逻辑其实很直白：EMPTY 返回 0，EXPLICIT 返回列表元素个数，那是精确值；UNDEFINED 返回 SQL NULL。到了 COMPRESSED，就遍历所有寄存器算二的负 R 次方的和，再用 alpha 乘 m 平方除以这个和——本质是调和平均，专门用来压住个别特别极端的桶。小基数时空桶还很多，这时候换 linear counting 更稳，公式是 m 乘 log m 除以空桶数；估计值接近 hash 空间上界时，再做大范围修正。alpha 对 m 等于 16、32、64 用常量，更大的 m 用 0.7213 除以一加 1.079 除以 m，和论文一致。别去背公式，记住三件事就够了：调和平均、小基数换算法、大范围要修正。","ctrl":null,"disclaim":null,"svg":"<svg class=\"figure\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" role=\"img\" aria-label=\"multiset_card 估算路径\"><text x=\"0.0\" y=\"22.0\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"serif\" data-ff=\"serif\" >输入：一个 hll 　→　按表示类型分路，再按估计值范围做修正</text><rect x=\"0.0\" y=\"34.0\" width=\"300.0\" height=\"56.0\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"16.0\" y=\"69.0\" font-size=\"15.0\" fill=\"#2F7A66\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >EMPTY</text><line x1=\"306.0\" y1=\"62.0\" x2=\"336.0\" y2=\"62.0\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><polygon points=\"344.0,62.0 335.0,57.5 335.0,66.5\" fill=\"#7BA6AF\"/><rect x=\"350.0\" y=\"34.0\" width=\"1050.0\" height=\"56.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"368.0\" y=\"59.0\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\"  x=\"368.0\" y=\"344.0\" font-size=\"12.4\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >hll_cardinality() 对未定义结果返回 NULL</text><rect x=\"0.0\" y=\"368.0\" width=\"1400.0\" height=\"48.0\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"18.0\" y=\"390.0\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >α_m：m = 16 / 32 / 64 用常量；更大 m 用 (0.7213 / (1 + 1.079 / m)) · m²，与 HLL 论文一致。</text><text x=\"18.0\" y=\"410.0\" font-size=\"12.6\" fill=\"#BE653B\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >理解重点不是背公式：调和平均压极端、小基数空桶多换 linear counting、接近 hash 上界要修正。</text><text x=\"1360.0\" y=\"424.0\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >09</text></svg>"},{"eyebrow":"工程价值 · 可合并性","title":"逐寄存器取 max，所以 union 不需要回到明细","lede":"可改天数、播放或单步：一天天并进来，看结果寄存器怎么只增不减。","caption":"图 10　并集里每个桶的最大 rank，就是两边最大 rank 再取最大；先局部后全局，结果等价。","bridge":"有了可合并性，日活、周活、月活、滚动窗口才变成同一条 SQL 路径。","notes":"到现在它还只是个能估数的状态。真正让它在数据库里值钱的，是接下来这个性质。每个桶存的是「这个桶见过的最大 rank」，那两个集合并集的最大 rank，不就是两边各自最大值再取一次最大吗？所以合并两个 HLL，只要逐寄存器取 max，结果仍然是一个 HLL。官方把这个叫无损 union：把一堆输入 replay 到一个 HLL，和先分组再 union，拿到的是同一个东西，误差保证也一样。右边的演示里，你可以改参与合并的天数，一步步把一天天的 HLL 并进来，看结果寄存器怎么只增不减。这就是为什么日活、周活、月活、滚动窗口能走同一条 SQL 路径，而且完全不用回头扫明细。","ctrl":"<label>参与合并的天数</label>\n<input type=\"number\" id=\"uN\" min=\"2\" max=\"7\" value=\"4\" aria-label=\"参与合并的天数\">\n<button class=\"btn play\" id=\"uPlay\" onclick=\"animToggle('B')\">▶ 播放</button>\n<button class=\"btn\" id=\"uStep\" onclick=\"animStep('B')\">⏭ 单步</button>\n<button class=\"btn\" id=\"uReset\" onclick=\"animReset('B')\">↺ 重置</button>\n<span class=\"out\" id=\"uOut\"></span>","disclaim":"教学示意：m = 16、确定性模拟 hash；寄存器值与估计值仅演示合并机制。","svg":"<svg class=\"figure\" xmlns=\"http://www.w3.org/2000/svg\" wi 0\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >hll_add_agg(hll_hash_bigint(user_id)) GROUP BY 1</text><line x1=\"916.0\" y1=\"60.0\" x2=\"964.0\" y2=\"60.0\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><polygon points=\"972.0,60.0 963.0,55.5 963.0,64.5\" fill=\"#7BA6AF\"/><rect x=\"980.0\" y=\"16.0\" width=\"420.0\" height=\"88.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"996.0\" y=\"44.0\" font-size=\"14.6\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"serif\" data-ff=\"serif\" >摘要表 daily_uniques</text><text x=\"996.0\" y=\"72.0\" font-size=\"11.8\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >day date PRIMARY KEY, users hll NOT NULL</text><rect x=\"0.0\" y=\"118.0\" width=\"1400.0\" height=\"54.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"0.0\" y=\"118.0\" width=\"5.0\" height=\"54.0\" rx=\"0\" fill=\"#2F7A66\" /><text x=\"18.0\" y=\"151.0\" font-size=\"14.0\" fill=\"#2F7A66\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"serif\" data-ff=\"serif\" >每日 UV</text><text x=\"210.0\" y=\"151.0\" font-size=\"12.2\" fill=\"#1B2B33\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >SELECT day, #users AS approx_dau FROM daily_uniques ORDER BY day;</text><rect x=\"0.0\" y=\"180.0\" width=\"1400.0\" height=\"54.0\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"0.0\" y=\"180.0\" width=\"5.0\" height=\"54.0\" rx=\"0\" fill=\"#2F7A66\" /><text x=\"18.0\" y=\"213.0\" font-size=\"14.0\" fill=\"#2F7A66\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"serif\" data-ff=\"serif\" >月 UV</text><text x=\"210.0\" y=\"213.0\" font-size=\"12.2\" fill=\"#1B2B33\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >SELECT date_trunc('month', day)::date, #hll_union_agg(users) AS approx_mau FROM daily_uniques GROUP BY 1;</text><rect x=\"0.0\" y=\"242.0\" width=\"1400.0\" height=\"54.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"0.0\" y=\"242.0\" width=\"5.0\" height=\"54.0\" rx=\"0\" fill=\"#2F7A66\" /><text x=\"18.0\" y=\"275.0\" font-size=\"14.0\" fill=\"#2F7A66\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"serif\" data-ff=\"serif\" >滚动 7 日 UV</text><text x=\"210.0\" y=\"275.0\" font-size=\"12.2\" fill=\"#1B2B33\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >#hll_union_agg(users) OVER (ORDER BY day ROWS BETWEEN 6 PRECEDING AND CURRENT ROW)</text><rect x=\"0.0\" y=\"308.0\" width=\"1400.0\" height=\"52.0\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"18.0\" y=\"330.0\" font-size=\"12.8\" fill=\"#BE653B\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >关键：hll_hash_bigint(user_id)。不要把业务 ID 直接 cast 成 hll_hashval，</text><text x=\"18.0\" y=\"351.0\" font-size=\"12.8\" fill=\"#BE653B\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >除非明确知道自己在跳过 hash，且输入已经是高质量的均匀 hash。</text><rect x=\"0.0\" y=\"368.0\" width=\"1400.0\" height=\"48.0\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"18.0\" y=\"390.0\" font-size=\"12.6\" fill=\"#AE8A3E\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >边界声明：原文环境未启动 PostgreSQL、未安装本扩展，以上 SQL 均未执行；</text><text x=\"18.0\" y=\"410.0\" font-size=\"12.6\" fill=\"#AE8A3E\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >本演说同样不提供任何伪造的查询结果输出。</text><text x=\"1360.0\" y=\"424.0\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >11</text></svg>"},{"eyebrow":"核心原理 · 参数","title":"四个参数，决定了精度、空间和晋升时机","lede":"log2m = 11、regwidth = 5、expthresh = -1、sparseon = 1：默认值都定义在 src/hll.c。","caption":"图 12　log2m 是主精度旋钮；expthresh = -1 时，阈值由「不比 FULL 更浪费」推导。","bridge":"旋钮拧到不同档，误差和空间怎么变？把它算出来看。","notes":"这套写法能成立，前提是四个参数被钉死。log2m 默认 11，决定有多少个桶，也决定误差；regwidth 默认 5，决定每个桶能记多大的 rank；expthresh 默认负一，是自动模式，控制 EXPLICIT 什么时候晋升；sparseon 默认 1，允许用 SPARSE 编码。三条公式一起看：m 等于 2 的 log2m 次方，标准误差约等于 1.04 除以根号 m，FULL 主体空间等于 regwidth 乘 m 再除以 8。代进默认值就是 2048 个桶、2.30% 标准误差、1280 字节。顺带说两个实用的：hll_set_defaults 可以按连接改默认参数，hll_expthresh 返回的是指定值和生效值二元组，自动模式下两个数不一样。","ctrl":null,"disclaim":null,"svg":"<svg class=\"figure\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" role=\"img\" aria-label=\"四个核心参数\"><rect x=\"0.0\" y=\"14.0\" width=\"336.0\" height=\"210.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"0.0\" y=\"14.0\" width=\"336.0\" height=\"4.0\" rx=\"0\" fill=\"#245A6B\" /><text x=\"16.0\" y=\"48.0\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >log2m</text><text x=\"250.0\" y=\"50.0\" font-size=\"18.0\" fill=\"#BE653B\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >= 11</text><text x=\"16.0\" y=\"82.0\" font-size=\"11.8\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >作用</text><text x=\"16.0\" y=\"104.0\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >m = 2^log2m 个寄存器，控制误差</text><text x=\"16.0\" y=\"140.0\" font-size=\"11.8\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >主要代价</text><text x=\"16.0\" y=\"162.0\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" clas ont-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >hll_set_defaults() 可按连接改默认值；hll_expthresh() 返回「指定值 / 生效值」二元组，自动模式下两者不同。</text><rect x=\"0.0\" y=\"364.0\" width=\"1400.0\" height=\"52.0\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"18.0\" y=\"387.0\" font-size=\"12.6\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >README 的直觉：1280 字节 ≈ 160 个 64 位整数；自动 expthresh 会挑「不比 FULL 更浪费」的晋升点。</text><text x=\"18.0\" y=\"408.0\" font-size=\"12.4\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >expthresh 自动模式在 byte 2 的 6 bit 字段中编码为 63。</text><text x=\"1360.0\" y=\"424.0\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >12</text></svg>"},{"eyebrow":"效果 · 精度旋钮","title":"每提升一档精度，FULL 空间约翻倍","lede":"可拖动 log2m、播放或单步：误差条缩短的同时，空间条正在拉长。","caption":"图 13　数值由 1.04/√m 与 regwidth·2^log2m/8 直接计算；标准误差不是绝对误差上限。","bridge":"精度讲完了，得把代价也说完整——空间、写入、还有误差的边界。","notes":"旋钮拧到不同档，会发生什么？这一页可以直接拨。log2m 从 10 到 14，桶数从 1024 涨到 16384，标准误差从 3.25% 降到 0.81%，看着很美；但 FULL 主体空间从 640 字节翻到 10240 字节，每提一档就翻一倍。点播放让它自己扫一遍，你会看到误差条在缩短、空间条在拉长，两条永远朝相反方向走。所以这不是「调到最精确就好」的问题：大量分组下，每个 HLL 都要多占一份空间，摘要表和聚合内存会一起变胖。还有一句必须反复讲：1.04 除以根号 m 是随机 hash 假设下的标准误差，不是「误差绝不会超过百分之多少」，报表口径不能拿它当上限写进合同。","ctrl":"<label>log2m</label>\n<input type=\"range\" id=\"pL\" min=\"10\" max=\"14\" step=\"1\" value=\"10\" aria-label=\"log2m\">\n<span class=\"rv\" id=\"pRv\">10</span>\n<button class=\"btn play\" id=\"pPlay\" onclick=\"animToggle('C')\">▶ 播放</button>\n<button class=\"btn\" id=\"pStep\" onclick=\"animStep('C')\">⏭ 单步</button>\n<button class=\"btn\" id=\"pReset\" onclick=\"animReset('C')\">↺ 重置</button>\n<span class=\"out\" id=\"pOut\"></span>","disclaim":"表中数值均由公式直接计算，非实测统计；示意条形长度仅表达相对关系。","svg":"<svg class=\"figure\" xmlns=\"http://www.w3.org/2000/svg\" width F7A66\" stroke=\"#2F7A66\" stroke-width=\"1\" id=\"pErr13\"/><text x=\"672.0\" y=\"259.0\" font-size=\"13.0\" fill=\"#2F7A66\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >1.15%</text><rect x=\"760.0\" y=\"242.0\" width=\"480.0\" height=\"22.0\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"760.0\" y=\"242.0\" width=\"240.0\" height=\"22.0\" rx=\"0\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" id=\"pSpc13\"/><text x=\"1256.0\" y=\"259.0\" font-size=\"13.0\" fill=\"#BE653B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >5120 B</text><rect x=\"0.0\" y=\"282.0\" width=\"1400.0\" height=\"50.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" id=\"pRow14\"/><text x=\"16.0\" y=\"313.0\" font-size=\"13.6\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >log2m = 14</text><text x=\"120.0\" y=\"313.0\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >m = 16384</text><rect x=\"280.0\" y=\"296.0\" width=\"380.0\" height=\"22.0\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"280.0\" y=\"296.0\" width=\"94.7\" height=\"22.0\" rx=\"0\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1\" id=\"pErr14\"/><text x=\"672.0\" y=\"313.0\" font-size=\"13.0\" fill=\"#2F7A66\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >0.81%</text><rect x=\"760.0\" y=\"296.0\" width=\"480.0\" height=\"22.0\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"760.0\" y=\"296.0\" width=\"480.0\" height=\"22.0\" rx=\"0\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" id=\"pSpc14\"/><text x=\"1256.0\" y=\"313.0\" font-size=\"13.0\" fill=\"#BE653B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >10240 B</text><rect x=\"0.0\" y=\"340.0\" width=\"1400.0\" height=\"46.0\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"18.0\" y=\"368.0\" font-size=\"13.0\" fill=\"#AE8A3E\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >每提升一档 log2m：误差约降到 1/√2，FULL 空间约翻一倍 —— 两条永远朝相反方向走。</text><rect x=\"0.0\" y=\"392.0\" width=\"1400.0\" height=\"30.0\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"18.0\" y=\"412.0\" font-size=\"11.8\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >数值由 1.04/√m 与 regwidth·2^log2m/8 直接计算，非实测数据；标准误差不是「误差绝不会超过 x%」。</text><text x=\"1360.0\" y=\"426.0\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >13</text></svg>"},{"eyebrow":"效果 · 空间与时间","title":"KB 级状态，来自三个量级的空间公式","lede":"3 + 8n、稀疏短字、完整 bit-packed；写入 O(1)，估算 O(m)，默认 m = 2048。","caption":"图 14　README 的历史插入速率只说明实现取向，容量规划必须用自己的环境压测。","bridge":"但「估得准」有个很硬的边界，尤其在交集上。","notes":"把收益算完整。默认 FULL 主体是 2048 个寄存器乘 5 位，等于 10240 位、1280 字节，加上三字节头部和 varlena 外壳，高基数下一个 HLL 还是 KB 级。但空间不是永远 1280：小集合是 3 加 8n，中间阶段 SPARSE 大约是 3 加非零寄存器数乘 log2m 加 regwidth 再除以 8，高基数才收敛到 3 加 m 乘 regwidth 除以 8。README 那个 160 个 64 位整数的说法就是这么来的——自动 expthresh 会挑一个「不比 FULL 更浪费」的点。时间上，单个值写入是 O(1)，算一次基数是 O(m)，默认才 2048 个桶，通常远比重扫明细便宜。至于 README 里 20 万到 30 万、以及 FULL 百万级插入速率，那是当时的历史经验，只说明实现取向，真要容量规划，拿你自己的版本、CPU、并发和 TOAST 情况去压测。","ctrl":null,"disclaim":null,"svg":"<svg class=\"figure\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" role=\"img\" aria-label=\"空间与时间代价\"><rect x=\"0.0\" y=\"14.0\" width=\"690.0\" height=\"88.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"0.0\" y=\"14.0\" width=\"5.0\" height=\"88.0\" rx=\"0\" fill=\"#2F7A66\" /><text x=\"18.0\" y=\"42.0\" font-size=\"15.0\" fill=\"#2F7A66\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >EMPTY / EXPLICIT</text><text x=\"18.0\" y=\"68.0\" font-size=\"13.4\" fill=\"#1B2B33\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >3 B　或　3 + 8n B</text><text x=\"18.0\" y=\"92.0\" font-size=\"12.4\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >小集合：精确、按元素个数线性增长</text><rect x=\"0.0\" y=\"110.0\" width=\"690.0\" height=\"88.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"0.0\" y=\"110.0\" width=\"5.0\" height=\"88.0\" rx=\"0\" fill=\"#AE8A3E\" /><text x=\"18.0\" y=\"138.0\" font-size=\"15.0\" fill=\"#AE8A3E\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >SPARSE</text><text x=\"18.0\" y=\"164.0\" font-size=\"13.4\" fill=\"#1B2B33\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >3 + ⌈nfilled · (log2m + regwidth) / 8⌉ B</text><text x=\"18.0\" y=\"188.0\" font-size=\"12.4\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >中间阶段：只写非零寄存器</text><rect x=\"0.0\" y=\"206.0\" width=\"690.0\" height=\"88.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"0.0\" y=\"206.0\" width=\"5.0\" height=\"88.0\" rx=\"0\" fill=\"#245A6B\" /><text x=\"18.0\" y=\"234.0\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >FULL</text><text x=\"18.0\" y=\"260.0\" font-size=\"13.4\" fill=\"#1B2B33\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >3 + ⌈2^log2m · regwidth / 8⌉ B</text><text x=\"18.0\" y=\"284.0\" font-size=\"12.4\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >高基数：2^11 × 5 bit = 10240 bit = 1280 B</text><rect x=\"710.0\" y=\"14.0\" width=\"690.0\" height=\"280.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"728.0\" y=\"42.0\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"serif\" data-ff=\"serif\" >时间代价</text><rect x=\"728.0\" y=\"60.0\" width=\"654.0\" height=\"48.0\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"742.0\" y=\"80.0\" font-size=\"13.2\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >单元素 add</text><text x=\"742.0\" y=\"100.0\" font-size=\"12.2\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >O(1)：hash、定位桶、更新 max</text><rect x=\"728.0\" y=\"116.0\" width=\"654.0\" height=\"48.0\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"742.0\" y=\"136.0\" font-size=\"13.2\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >hll_cardinality()</text><text x=\"742.0\" y=\"156.0\" font-size=\"12.2\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >O(m)：遍历全部寄存器，默认 m = 2048</text><rect x=\"728.0\" y=\"172.0\" width=\"654.0\" height=\"48.0\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"742.0\" y=\"192.0\" font-size=\"13.2\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >hll_union_agg()</text><text x=\"742.0\" y=\"212.0\" font-size=\"12.2\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >每行解包 + 元数据检查 + 寄存器 max + 打包</text><rect x=\"728.0\" y=\"228.0\" width=\"654.0\" height=\"48.0\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"742.0\" y=\"248.0\" font-size=\"13.2\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >EXPLICIT 阶段</text><text x=\"742.0\" y=\"268.0\" font-size=\"12.2\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >二分查找插入 + 可能的数组移动，小基数可接受</text><rect x=\"0.0\" y=\"306.0\" width=\"1400.0\" height=\"60.0\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"18.0\" y=\"330.0\" font-size=\"12.8\" fill=\"#AE8A3E\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >README 历史经验：EMPTY / EXPLICIT / SPARSE 插入约 200k–300k/s，FULL 可达百万级 / s。</text><text x=\"18.0\" y=\"353.0\" font-size=\"12.6\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >这只说明实现取向，不是容量规划指标；真实系统要按自己的 PG 版本、CPU、并发、workload 与 TOAST 情况压测。</text><rect x=\"0.0\" y=\"374.0\" width=\"1400.0\" height=\"42.0\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"18.0\" y=\"400.0\" font-size=\"12.8\" fill=\"#245A6B\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >空间收益的本质：一个高基数 HLL 仍是 KB 级；与保存几百万个 bigint 用户 ID 相比是数量级差异。</text><text x=\"1360.0\" y=\"424.0\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >14</text></svg>"},{"eyebrow":"效果 · 误差边界","title":"大数相减，会把绝对误差放大成很高的相对误差","lede":"并集容易；交集靠容斥，三个大数一减，小差值上的相对误差会被放大。","caption":"图 15　包含系数论文提出更细的估计方法，不等于 postgresql-hll 内置了这些能力。","bridge":"把 HLL 放回候选方案堆里，才知道它该站哪个位置。","notes":"「估得准」有个很硬的边界，尤其在交集上。并集好办，union 直接取 max 就行；交集通常只能靠容斥：A 加 B 减 A 并 B。问题就出在这儿——如果交集很小，而 A、B、并集都很大，三个各带百分之一二误差的大数一减，剩下的差值里，绝对误差没变小，相对误差却被放大得非常难看。README 自己就提醒过，交集结果可能被大集合的百分之一误差整个淹没。所以包含率、包含系数这类分析，得单独验证方法；那篇 inclusion coefficient 的论文提出的是更细的估计手段，不等于 postgresql-hll 内置了这些能力。别因为并集估得漂亮，就顺手把交集也信了。","ctrl":null,"disclaim":null,"svg":"<svg class=\"figure\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" role=\"img\" aria-label=\"交集误差放大边界\"><rect x=\"0.0\" y=\"14.0\" width=\"1400.0\" height=\"56.0\" rx=\"0\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"20.0\" y=\"49.0\" font-size=\"19.0\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >|A ∩ B| = |A| + |B| − |A ∪ B|　　（inclusion–exclusion，容斥）</text><text x=\"0.0\" y=\"96.0\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"serif\" data-ff=\"serif\" >大数相减：绝对误差没有变小，相对误差被放大</text><rect x=\"0.0\" y=\"108.0\" width=\"680.0\" height=\"196.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"16.0\" y=\"146.0\" font-size=\"12.6\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >|A|</text><rect x=\"130.0\" y=\"130.0\" width=\"440.0\" height=\"24.0\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"580.0\" y=\"147.0\" font-size=\"11.6\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >估计量 ± ε</text><text x=\"16.0\" y=\"188.0\" font-size=\"12.6\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >|B|</text><rect x=\"130.0\" y=\"172.0\" width=\"400.0\" height=\"24.0\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"540.0\" y=\"189.0\" font-size=\"11.6\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >估计量 ± ε</text><text x=\"16.0\" y=\"230.0\" font-size=\"12.6\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >|A ∪ B|</text><rect x=\"130.0 的位置很明确：UV、DAU、reach、去重趋势、分区 rollup、探索式分析。财务、库存、合规、权限判断，请老老实实用精确口径。","ctrl":null,"disclaim":null,"svg":"<svg class=\"figure\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" role=\"img\" aria-label=\"四种方案横向对比\"><rect x=\"0.0\" y=\"14.0\" width=\"150.0\" height=\"42.0\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"12.0\" y=\"40.0\" font-size=\"13.4\" fill=\"#46585F\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"serif\" data-ff=\"serif\" >维度</text><rect x=\"150.0\" y=\"14.0\" width=\"312.0\" height=\"42.0\" rx=\"0\" fill=\"#245A6B\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"162.0\" y=\"40.0\" font-size=\"13.4\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"serif\" data-ff=\"serif\" >postgresql-hll</text><rect x=\"462.0\" y=\"14.0\" width=\"312.0\" height=\"42.0\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"474.0\" y=\"40.0\" font-size=\"13.4\" fill=\"#46585F\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"serif\" data-ff=\"serif\" >精确 COUNT(DISTINCT)</text><rect x=\"774.0\" y=\"14.0\" width=\"312.0\" height=\"42.0\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"786.0\" y=\"40.0\" font-size=\"13.4\" fill=\"#46585F\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"serif\" data-ff=\"serif\" >物化精确集合 / 数组</text><rect x=\"1086.0\" y=\"14.0\" width=\"314.0\" height=\"42.0\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"1098.0\" y=\"40.0\" font-size=\"13.4\" fill=\"#46585F\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"serif\" data-ff=\"serif\" >Bloom filter</text><rect x=\"0.0\" y=\"56.0\" width=\"150.0\" height=\"46.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"12.0\" y=\"85.0\" font-size=\"12.6\" fill=\"#245A6B\" font-weight=\"70 \"sans\" >近似，log2m 控制误差</text><rect x=\"462.0\" y=\"286.0\" width=\"312.0\" height=\"46.0\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"474.0\" y=\"315.0\" font-size=\"12.6\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >精确</text><rect x=\"774.0\" y=\"286.0\" width=\"312.0\" height=\"46.0\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"786.0\" y=\"315.0\" font-size=\"12.6\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >精确但空间大</text><rect x=\"1086.0\" y=\"286.0\" width=\"314.0\" height=\"46.0\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"1098.0\" y=\"315.0\" font-size=\"12.6\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >有误判，不回答 distinct</text><rect x=\"0.0\" y=\"336.0\" width=\"1400.0\" height=\"42.0\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"18.0\" y=\"362.0\" font-size=\"12.6\" fill=\"#2F7A66\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >位置：HLL → UV / DAU / rollup　·　精确 → 财务、库存、强一致口径　·　集合 → 小集合成员枚举　·　Bloom → membership 过滤</text><rect x=\"0.0\" y=\"382.0\" width=\"1400.0\" height=\"36.0\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"18.0\" y=\"406.0\" font-size=\"12.8\" fill=\"#BE653B\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >Bloom 错在 false positive，HLL 错在估计偏差；把两者互相当对方用，是模型用错。</text><text x=\"1360.0\" y=\"424.0\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >16</text></svg>"},{"eyebrow":"最佳实践 · 三类角色","title":"把 HLL 当汇总列设计，而不是当索引用","lede":"架构师定指标契约、DBA 守线上摘要与执行计划、开发者守住 hash 与口径标注。","caption":"图 17　参数、seed、typmod 属于指标定义；改动它们等于改动口径。","bridge":"反过来看，哪些地方一旦踩进去就很难补救。","notes":"位置定了，谁该为哪些决定负责？架构师这边，先定义清楚哪些指标允许近似，别让 HLL 混进结算口径；然后把参数和 hash seed 固化下来，跨表、跨分区、跨服务要合并的 HLL 必须同一套；再把 hll 当汇总列设计，明细按小时或天聚合上去，别当索引用；多租户宁可建清晰的摘要表，也别让应用层临时拼不同参数的 HLL。DBA 这边，用 hll_print、hll_log2m、hll_regwidth、hll_expthresh 校验线上摘要；盯住 TOAST 和行宽；重度聚合做 explain 加压测，必要时看 hll.force_groupagg；升级时核对控制文件的 default_version 和 update 目录下的脚本。业务开发者这边最简单也最容易错：永远用类型专用 hash；seed 不要随请求、租户、日期变；不要问 HLL 要「有哪些用户」；报表上老老实实标「近似 UV／约」。这不是技术谦虚，是指标契约。","ctrl":null,"disclaim":null,"svg":"<svg class=\"figure\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" role=\"img\" aria-label=\"三类角色的最佳实践\"><rect x=\"0.0\" y=\"14.0\" width=\"450.0\" height=\"48.0\" rx=\"0\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"16.0\" y=\"45.0\" font-size=\"17.0\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"serif\" data-ff=\"serif\" >面向数据库架构师</text><rect x=\"0.0\" y=\"68.0\" width=\"450.0\" height=\"62.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"0.0\" y=\"68.0\" width=\"4.0\" height=\"62.0\" rx=\"0\" fill=\"#245A6B\" /><text x=\"16.0\" y=\"94.0\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >01</text><text x=\"54.0\" y=\"94.0\" font-size=\"12.4\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >先定义「哪些指标允许近似」，别混入精确结算口径</text><text x=\"54.0\" y=\"116.0\" font-size=\"11.4\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >建议动作</text><rect x=\"0.0\" y=\"136.0\" width=\"450.0\" height=\"62.0\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"0.0\" y=\"136.0\" width=\"4.0\" height=\"62.0\" rx=\"0\" fill=\"#245A6B\" /><text x=\"16.0\" y=\"162.0\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" te EA\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"940.0\" y=\"272.0\" width=\"4.0\" height=\"62.0\" rx=\"0\" fill=\"#2F7A66\" /><text x=\"956.0\" y=\"298.0\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >04</text><text x=\"994.0\" y=\"298.0\" font-size=\"12.4\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >报表标注「近似 UV / 约」—— 这是指标契约，不是谦虚</text><text x=\"994.0\" y=\"320.0\" font-size=\"11.4\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >建议动作</text><rect x=\"0.0\" y=\"348.0\" width=\"1400.0\" height=\"62.0\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"18.0\" y=\"372.0\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >共同前提：log2m / regwidth / expthresh / sparseon 与 hash seed 属于指标定义的一部分。</text><text x=\"18.0\" y=\"397.0\" font-size=\"12.8\" fill=\"#BE653B\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"sans\" data-ff=\"sans\" >改了其中任何一个，跨时间窗口与跨分区的 union 就不再具备统计意义。</text><text x=\"22.0\" y=\"424.0\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\" data-ff=\"mono\" >一图一命题 · 17</text></svg>"},{"eyebrow":"落地边界 · 场景与坑","title":"该用与不该用，边界比技巧更重要","lede":"五条适合、五条不适合，再加八个高频坑——前三个其实是同一类问题。","caption":"图 18　忘 hash、不同 seed union、不同参数 union：全都不是性能问题，而是指标定义不一致。","bridge":"最后留几个问题，把这条因果链再往外接一段。","notes":"反过来看边界。适合的是大规模事实表上的 UV、DAU、WAU、MAU，分区分片先局部去重再全局合并，滑动窗口和任意日期范围的 rollup，对趋势和相对变化敏感、对单个整数不敏感的指标，还有明细保存周期短但摘要要留很久的日志系统。不适合的是账单、库存、合规、权限判断，需要删单个元素后修摘要，需要列成员、抽样、精确 join，交集很小但并集很大的包含率分析，以及输入能被攻击者控制又没做好 hash 隔离的场景。底下八个常见坑里，前三个其实是同一类：忘 hash、不同 seed 做 union、不同参数做 union，全都不是性能问题，而是指标定义不一致。剩下的五个也顺手记一下：误差当上限、小交集判断、过度提高 log2m、滥用 hll_hash_any、忽略版本和序列化兼容。","ctrl":null,"disclaim":n
