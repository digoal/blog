  $('#slides').innerHTML = D.map((d,i) =>
    '<section class="slide'+(d.ctrl?' anim':'')+'" id="s'+i+'">'
    + '<div class="eyebrow"><span class="num">'+String(i+1).padStart(2,'0')+' / '+String(N).padStart(2,'0')+'</span>'+d.eyebrow+'</div>'
    + '<h1 class="title">'+d.title+'</h1>'
    + '<div class="lede">'+d.lede+'</div>'
    + '<div class="rule"></div>'
    + '<div class="figwrap">'+d.svg+'</div>'
    + (d.ctrl ? '<div class="ctrls">'+d.ctrl+'</div>'
              + (d.disclaim ? '<div class="disclaim">'+d.disclaim+'</div>' : '')
              + '<div class="caption caplow">'+d.caption+'</div>'
              : '<div class="caption">'+d.caption+'</div>')
    + '<div class="bridge"><span class="bk">承接 · NEXT</span>'+d.bridge+'</div>'
    + '<div class="footer"><div class="fbar"><i id="fbar'+i+'"></i></div>'
    + '<span class="fl">数据库筑基课 · ltree 存储结构</span>'
    + '<span class="fr">'+String(i+1).padStart(2,'0')+' / '+String(N).padStart(2,'0')+'</span></div>'
    + '</section>').join('');
}
function go(i, silent){
  i = Math.max(0, Math.min(N-1, i));
  pauseAllAnims();
  $$('.slide').forEach((el,k)=>el.classList.toggle('on', k===i));
  cur = i;
  try{ localStorage.setItem('ltree-slide', String(i)); }catch(e){}
  $('#pg').textContent = String(i+1).padStart(2,'0') + ' / ' + String(N).padStart(2,'0');
  $('#track i').style.width = ((i+1)/N*100)+'%';
  for(let k=0;k<N;k++){ const b=$('#fbar'+k); if(b) b.style.width = (k<=i?100:0)+'%'; }
  if(dockMode==='notes') renderDock('notes');
  else if(dockMode==='all') syncAllDock();
  else if(dockMode==='toc') renderDock('toc');
  if(!silent) toast(D[i].eyebrow + ' · ' + D[i].title);
}
function next(){ if(cur<N-1) go(cur+1); else stopAuto(); }
function prev(){ if(cur>0) go(cur-1); }
function jump(i){ closeDock(); go(i); }
function toast(s){
  const t=$('#toast'); t.textContent=s; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1700);
}
/* ================= 自动播放 ================= */
function stopAuto(){
  autoOn=false; clearInterval(autoTimer); autoTimer=null;
  $('#btnAuto').textContent='▶ 自动播放 P'; $('#btnAuto').classList.remove('act');
}
function toggleAuto(){
  if(autoOn){ stopAuto(); toast('已暂停自动播放'); return; }
  autoOn=true; $('#btnAuto').textContent='❚❚ 暂停 P'; $('#btnAuto').classList.add('act');
  autoTimer=setInterval(()=>{ if(cur<N-1) go(cur+1,true); else stopAuto(); }, 14000);
  toast('自动播放：每 14 秒一页');
}
/* ================= 右侧页内开窗：本页讲稿 / 全文讲稿 / 目录 / 帮助 ================= */
function closeDock(){
  if(!dockMode) return;
  dockMode=null; document.body.classList.remove('docked');
  $$('.chrome button').forEach(b=>b.classList.remove('act'));
  fit();
}
function toggleDock(mode){
  if(dockMode===mode){ closeDock(); return; }
  dockMode=mode; document.body.classList.add('docked');
  $$('.chrome button').forEach(b=>b.classList.remove('act'));
  const bmap={notes:'#btnNotes',all:'#btnAll',toc:'#btnToc',help:'#btnHelp'};
  const bb=$(bmap[mode]); if(bb) bb.classList.add('act');
  renderDock(mode); fit();
  if(mode==='all') syncAllDock(); else $('#dockBody').scrollTop = 0;
}
function syncAllDock(){
  const body=$('#dockBody'); if(!body) return;
  $$('#dockBody .sec').forEach((el,k)=>el.classList.toggle('cur',k===cur));
  const target=$('#dsec'+cur);
  if(target) body.scrollTop = Math.max(0, target.offsetTop - body.offsetTop - 70);
}
function renderDock(mode){
  const titles={notes:'本页讲稿',all:'全文讲稿',toc:'目录',help:'快捷键'};
  $('#dockTitle').textContent=titles[mode];
  $('#dockSub').textContent=mode==='toc' ? ('共 '+N+' 页') : (String(cur+1).padStart(2,'0')+' / '+String(N).padStart(2,'0'));
  let h='';
  if(mode==='notes'){
    const d=D[cur];
    h='<div class="tag">'+String(cur+1).padStart(2,'0')+' · '+d.eyebrow+'</div>'
     +'<div class="nt">'+d.title+'</div><p class="np">'+d.notes+'</p>'
     +'<div class="nb">承接下一页：'+d.bridge+'</div>'
     +'<p class="lead" style="margin-top:22px">按 N 再按一次关闭；按 T 通读全文；按 Esc 关闭本窗。</p>';
  } else if(mode==='all'){
    h='<p class="lead">按顺序通读。每页末尾的「承接」就是通往下一页的逻辑接口；翻页时这里会自动定位到当前页。</p>'
      + D.map((d,i)=>'<div class="sec" id="dsec'+i+'"><span class="tag">'+String(i+1).padStart(2,'0')+' · '+d.eyebrow+'</span>'
        +'<div class="nt">'+d.title+'</div><p class="np">'+d.notes+'</p>'
        +'<div class="nb">'+d.bridge+'</div></div>').join('');
  } else if(mode==='toc'){
    h='<p class="lead">点击任意一页跳转。共 '+N+' 页，按 G 再按一次关闭。</p><div class="tocgrid">'
      + D.map((d,i)=>'<a class="'+(i===cur?'cur':'')+'" onclick="jump('+i+')"><span>'
        +String(i+1).padStart(2,'0')+'</span>'+d.title+'</a>').join('') + '</div>';
  } else {
    h='<p class="lead">演说时的操作备忘。全屏后底部按键条依然可见。</p><div class="keys">'
     +'<div><kbd>→ / 空格</kbd>下一页</div><div><kbd>←</kbd>上一页</div>'
     +'<div><kbd>G</kbd>目录</div><div><kbd>N</kbd>本页讲稿</div>'
     +'<div><kbd>T</kbd>全文讲稿（自动定位当前页）</div><div><kbd>P</kbd>自动播放 / 暂停</div>'
     +'<div><kbd>F</kbd>全屏 / 退出全屏</div><div><kbd>1–9</kbd>直接跳页 1–9</div>'
     +'<div><kbd>Home / End</kbd>首页 / 末页</div><div><kbd>Esc</kbd>关闭开窗 / 退出全屏</div>'
     +'<div><kbd>?</kbd>本帮助</div><div><kbd>点击底部按钮</kbd>同上</div></div>'
     +'<p class="lead" style="margin-top:24px">动画页：改输入值 → ▶ 播放 / 暂停 → 单步 → ↺ 重置。</p>';
  }
  $('#dockBody').innerHTML=h;
}
/* ================= 全屏（底部按键条始终保留） ================= */
function fs(){
  const el=document.documentElement;
  const entering=!document.body.classList.contains('immersive');
  if(entering){
    document.body.classList.add('immersive'); $('#btnFs').textContent='退出全屏 F';
    fit(); toast('全屏：底部按键条保持可见（F 或 Esc 退出）');
    try{ const pr=el.requestFullscreen?el.requestFullscreen():null; if(pr&&pr.catch) pr.catch(()=>{}); }catch(e){}
  }else{
    document.body.classList.remove('immersive'); $('#btnFs').textContent='全屏 F';
    fit(); toast('已退出全屏');
    try{ if(document.fullscreenElement&&document.exitFullscreen) document.exitFullscreen(); }catch(e){}
  }
}
document.addEventListener('fullscreenchange', ()=>{
  if(!document.fullscreenElement && document.body.classList.contains('immersive')){
    document.body.classList.remove('immersive');
    const b=$('#btnFs'); if(b) b.textContent='全屏 F';
  }
  fit();
});
/* ================= 动画 A：祖先判断逐层比较 ================= */
const CMP={step:0,playing:false,timer:null};
function cmpSplit(v){ return String(v||'').split('.').map(x=>x.trim()).filter(Boolean).slice(0,6); }
function cmpCalc(){
  const a=cmpSplit($('#cmpA')?$('#cmpA').value:''), b=cmpSplit($('#cmpB')?$('#cmpB').value:'');
  const m=Math.min(a.length,b.length); let stop=m;
  for(let i=0;i<m;i++) if(a[i]!==b[i]){ stop=i+1; break; }
  return {a,b,m,stop};
}
function cmpVerdict(a,b,m,stop,k){
  if(k===0) return ['待播放 · 点击 ▶ 从第 1 层开始比对','#46585F'];
  let diff=-1; for(let i=0;i<Math.min(k,m);i++) if(a[i]!==b[i]){ diff=i; break; }
  if(diff>=0) return ['第 '+(diff+1)+' 层不同：'+a[diff]+' ≠ '+b[diff]+' → 无祖先关系，@> 为 false','#BE653B'];
  if(k<stop) return ['前 '+k+' 层相等，继续比对第 '+(k+1)+' 层','#245A6B'];
  if(a.length===b.length && k>=m) return ['层数相同且逐层相等 → 两条路径相等（= 为 true）','#2F7A66'];
  if(a.length<b.length) return ['p 的所有层都匹配且更短 → p @> c 为 true，c <@ p 为 true','#2F7A66'];
  return ['c 先结束而 p 仍有剩余 → p 不是 c 的前缀，@> 为 false','#BE653B'];
}
function cmpPaint(){
  if(!$('#cmpPA')) return;
  const {a,b,m,stop}=cmpCalc();
  const k=Math.min(CMP.step,stop);
  let sa='',sb='',sm='';
  const cols=Math.max(1,Math.max(a.length,b.length));
  for(let i=0;i<cols;i++){
    const x=150+i*198, done=i<k, hot=(CMP.step>0&&i===k-1);
    const fc=hot?'#F7E9DE':done?'#E5EFF0':'#FFFFFF';
    const sc=hot?'#BE653B':done?'#7BA6AF':'#D9D5CB';
    const tc=hot?'#BE653B':done?'#245A6B':'#89938F';
    const va=a[i]!==undefined?a[i]:'—', vb=b[i]!==undefined?b[i]:'—';
    const fa=fsfitJs(va,170,14), fb=fsfitJs(vb,170,14);
    sa+='<rect x="'+x+'" y="62" width="190" height="52" rx="0" fill="'+fc+'" stroke="'+sc+'" stroke-width="'+(hot?2:1.1)+'"/>'
       +'<text x="'+(x+95)+'" y="95" font-size="'+fa+'" fill="'+tc+'" font-weight="700" text-anchor="middle">'+escJs(va)+'</text>';
    sb+='<rect x="'+x+'" y="136" width="190" height="52" rx="0" fill="'+fc+'" stroke="'+sc+'" stroke-width="'+(hot?2:1.1)+'"/>'
       +'<text x="'+(x+95)+'" y="169" font-size="'+fb+'" fill="'+tc+'" font-weight="700" text-anchor="middle">'+escJs(vb)+'</text>';
    let mk='—', mc='#89938F';
    if(i<k){
      if(i<m && a[i]!==b[i]){ mk='不同'; mc='#BE653B'; }
      else if(i<m){ mk='相同'; mc='#2F7A66'; }
      else { mk='已结束'; mc='#BE653B'; }
    }
    sm+='<text x="'+(x+95)+'" y="238" font-size="13" fill="'+mc+'" font-weight="600" text-anchor="middle">'+mk+'</text>';
  }
  $('#cmpPA').innerHTML=sa; $('#cmpPB').innerHTML=sb; $('#cmpPM').innerHTML=sm;
  const v=cmpVerdict(a,b,m,stop,k);
  const t=$('#cmpVerdictText'); t.textContent=v[0]; t.setAttribute('fill',v[1]);
  const total=cols;
  $('#cmpOut').innerHTML='比对 <b>'+k+'</b> / '+total+' 层 · 祖先侧 '+a.length+' 层 · 后代侧 '+b.length+' 层';
}
/* ================= 动画 B：位图签名置位与误下探 ================= */
const SIG={step:0,playing:false,timer:null,hash:0,bit:-1,qbit:-1,qhit:false};
function toyCRC(s){
  let h=2166136261>>>0;
  for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619)>>>0; }
  h^=h>>>15; h=Math.imul(h,2246822507)>>>0; h^=h>>>13;
  return h>>>0;
}
function sigPaint(){
  if(!$('#sigBit0')) return;
  const lab=String($('#sigLabel').value||'').trim()||'Astronomy';
  const q=String($('#sigQuery').value||'').trim()||'Cosmology';
  const h=toyCRC(lab), bit=h%64, qh=toyCRC(q), qbit=qh%64;
  SIG.hash=h; SIG.bit=bit; SIG.qbit=qbit; SIG.qhit=(bit===qbit);
  for(let i=0;i<64;i++){
    const c=$('#sigBit'+i);
    const on=(SIG.step>=3 && i===bit), qmark=(SIG.step>=4 && i===qbit);
    c.setAttribute('fill', on?(qmark?'#BE653B':'#245A6B'):'#FFFFFF');
    c.setAttribute('stroke', qmark?'#BE653B':on?'#245A6B':'#D9D5CB');
    c.setAttribute('stroke-width', qmark?'2.4':on?'1.8':'1');
  }
  const box=['#FFFFFF','#FFFFFF','#FFFFFF','#FFFFFF'];
  const qt=$('#sigQTitle'), qx=$('#sigQText'), qd=$('#sigQDetail');
  if(SIG.step===0){
    qt.textContent='等待播放'; qt.setAttribute('fill','#46585F');
    qx.textContent='输入已存 label 与查询 label，然后按 ▶ 播放';
    qd.textContent='bit = 0 → 子树不可能命中，可安全剪枝';
  } else if(SIG.step===1){
    qt.textContent='① 计算 CRC（示意）'; qt.setAttribute('fill','#245A6B');
    qx.textContent='label = '+lab+' → 0x'+(h>>>0).toString(16).toUpperCase().padStart(8,'0');
    qd.textContent='源码里对应 ltree_crc32_sz(label)';
  } else if(SIG.step===2){
    qt.textContent='② 取模定位 bit'; qt.setAttribute('fill','#245A6B');
    qx.textContent='CRC % (8 × 8) = bit ' + bit;
    qd.textContent='HASHVAL(val, siglen) = val % SIGLENBIT(siglen)';
  } else if(SIG.step===3){
    qt.textContent='③ 置位完成'; qt.setAttribute('fill','#2F7A66');
    qx.textContent='sign 的 bit '+bit+' = 1，其余保持 0';
    qd.textContent='这一位代表「子树里出现过能哈希到这里的 label」';
  } else {
    const hit=SIG.qhit;
    qt.textContent=hit?'④ bit = 1 → 可能命中，必须下探':'④ bit = 0 → 可安全剪枝';
    qt.setAttribute('fill',hit?'#BE653B':'#2F7A66');
    qx.textContent='查询 label = '+q+' → bit '+qbit+(hit?'，与已置位相同':'，签名中该位为 0');
    qd.textContent=hit?'可能是真命中，也可能是哈希碰撞；签名不证明命中。':'子树不可能包含这个 label，不必下探。';
  }
  $('#sigOut').innerHTML='已存 <b>'+escJs(lab)+'</b> → bit <b>'+bit+'</b> · 查询 <b>'+escJs(q)+'</b> → bit <b>'+qbit+'</b>'
    +(SIG.step>=4?(SIG.qhit?' · <b>可能命中 / 下探</b>':' · <b>安全剪枝</b>'):'');
}
function escJs(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fsfitJs(s,maxw,fs){ let f=fs; while(f>8 && s.length*f>maxw) f-=0.5; return f; }
/* ================= 动画统一控制 ================= */
const ANIM={
  CMP:{o:CMP,total:()=>cmpCalc().stop||1,paint:cmpPaint,play:'#cmpPlay',out:'#cmpOut'},
  SIG:{o:SIG,total:()=>5,paint:sigPaint,play:'#sigPlay',out:'#sigOut'}
};
function animPause(k){
  const a=ANIM[k]; if(!a.o.playing) return;
  a.o.playing=false; clearInterval(a.o.timer); a.o.timer=null;
  const b=$(a.play); if(b){ b.textContent='▶ 播放'; b.classList.remove('play'); }
}
function pauseAllAnims(){ Object.keys(ANIM).forEach(animPause); }
function animToggle(k){
  const a=ANIM[k], o=a.o;
  if(o.playing){ animPause(k); return; }
  if(o.step>=a.total()) o.step=0;
  o.playing=true;
  const b=$(a.play); if(b){ b.textContent='❚❚ 暂停'; b.classList.add('play'); }
  a.paint();
  o.timer=setInterval(()=>{ o.step++; a.paint(); if(o.step>=a.total()) animPause(k); }, 900);
}
function animStep(k){
  const a=ANIM[k], o=a.o; animPause(k);
  if(o.step>=a.total()) o.step=0;
  o.step++; a.paint();
}
function animReset(k){
  const a=ANIM[k]; animPause(k); a.o.step=0; a.paint();
}
/* ================= 键盘 ================= */
document.addEventListener('keydown', e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  const k=e.key;
  if(k==='Escape'){
    if(dockMode){ closeDock(); return; }
    if(document.body.classList.contains('immersive')){ fs(); return; }
    return;
  }
  if(tag==='input'||tag==='select'||tag==='textarea') return;
  if(k==='ArrowRight'||k===' '||k==='PageDown'){ e.preventDefault(); next(); }
  else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); prev(); }
  else if(k==='f'||k==='F'||e.code==='KeyF'){ e.preventDefault(); fs(); }
  else if(k==='g'||k==='G'){ e.preventDefault(); toggleDock('toc'); }
  else if(k==='n'||k==='N'){ e.preventDefault(); toggleDock('notes'); }
  else if(k==='t'||k==='T'){ e.preventDefault(); toggleDock('all'); }
  else if(k==='p'||k==='P'){ e.preventDefault(); toggleAuto(); }
  else if(k==='?'||k==='h'||k==='H'){ e.preventDefault(); toggleDock('help'); }
  else if(k==='Home'){ e.preventDefault(); go(0); }
  else if(k==='End'){ e.preventDefault(); go(N-1); }
  else if(/^[1-9]$/.test(k)){ go(parseInt(k,10)-1); }
});
/* ================= 启动 ================= */
$('#btnPrev').onclick=prev;
$('#btnNext').onclick=next;
$('#btnToc').onclick=()=>toggleDock('toc');
$('#btnNotes').onclick=()=>toggleDock('notes');
$('#btnAll').onclick=()=>toggleDock('all');
$('#btnAuto').onclick=toggleAuto;
$('#btnFs').onclick=fs;
$('#btnHelp').onclick=()=>toggleDock('help');
render();
$('#cmpPlay').onclick=()=>animToggle('CMP'); $('#cmpStep').onclick=()=>animStep('CMP'); $('#cmpReset').onclick=()=>animReset('CMP');
$('#sigPlay').onclick=()=>animToggle('SIG'); $('#sigStep').onclick=()=>animStep('SIG'); $('#sigReset').onclick=()=>animReset('SIG');
$('#cmpA').addEventListener('input',()=>animReset('CMP'));
$('#cmpB').addEventListener('input',()=>animReset('CMP'));
$('#sigLabel').addEventListener('input',()=>animReset('SIG'));
$('#sigQuery').addEventListener('input',()=>animReset('SIG'));
$('#sigCollide').onclick=()=>{
  const lab=String($('#sigLabel').value||'Astronomy').trim();
  const bit=toyCRC(lab)%64;
  let pick='';
  for(let i=0;i<5000;i++){
    const cand='label_'+i;
    if(cand!==lab && toyCRC(cand)%64===bit){ pick=cand; break; }
  }
  $('#sigQuery').value=pick||lab;
  animReset('SIG'); toast('已选一个不同 label 但同一 bit 的碰撞示例（教学示意）');
};
cmpPaint(); sigPaint();
fit();
let start=0; try{ start=parseInt(localStorage.getItem('ltree-slide')||'0',10)||0; }catch(e){}
go(Math.max(0,Math.min(N-1,start)), true);

</script>
