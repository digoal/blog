<style>
:root{
  --bg:#F7F6F2; --sub:#F1EFE9; --ink:#1B2B33; --ink2:#46585F; --muted:#89938F; --line:#D9D5CB;

}

  font-size:44px;line-height:1.25;font-weight:700;letter-spacing:1.2px;color:var(--ink)}
.lede{position:absolute;left:64px;top:139px;width:1472px;height:40px;overflow:hidden;
  font-size:19px;color:var(--ink2);line-height:1.5;letter-spacing:.3px}
.rule{position:absolute;left:64px;top:181px;width:1472px;height:1px;background:var(--line)}
.figwrap{position:absolute;left:100px;top:198px;width:1400px;height:430px;overflow:hidden}

.slide.anim .bridge{top:730px}

.footer{position:absolute;left:64px;top:846px;width:1472px;height:1px;background:var(--line)}
.footer .fl{position:absolute;left:0;top:14px;font-size:12.5px;color:var(--muted);letter-spacing:2px}
.footer .fr{position:absolute;right:0;top:12px;font-family:var(--mono);font-size:14px;color:var(--ink2)}
.footer .fbar{position:absolute;left:0;right:0;top:-1px;height:2px;background:transparent}
.footer .fbar i{display:block;height:2px;background:var(--primary);width:0;transition:width .4s ease}
.ctrls{position:absolute;left:100px;top:632px;width:1400px;height:44px;display:flex;
  align-items:center;gap:9px}
.ctrls label{font-size:13.5px;color:var(--ink2);white-space:nowrap}
.ctrls input[type=text]{font-family:var(--mono);font-size:13px;color:var(--ink);

.ctrls input[type=text]:focus{border-color:var(--primary)}
.ctrls .btn{min-height:30px;padding:5px 12px;border:1px solid var(--primary);border-radius:4px;
  background:#fff;color:var(--primary);font-size:13.5px;cursor:pointer;font-family:var(--sans);white-space:nowrap}
.ctrls .btn.play{background:var(--primary);color:#fff}
.ctrls .btn:hover{filter:brightness(.94)}
.ctrls .out{font-size:13px;color:var(--ink2);margin-left:auto;min-width:0;flex:1;
  max-width:460px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrls .out b{color:var(--accent);font-weight:600}
.chrome{position:fixed;left:0;right:0;bottom:0;height:58px;background:#FCFBF8;
  border-top:1px solid var(--line);display:flex;align-items:center;gap:6px;
  padding:0 16px;z-index:40;font-size:13px;color:var(--ink2)}
.chrome .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.chrome button{font-family:var(--sans);font-size:12.6px;color:var(--ink2);background:transparent;
  border:1px solid transparent;border-radius:5px;padding:7px 9px;cursor:pointer;white-space:nowrap}
.chrome button:hover{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome button.act{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome button.k{font-family:var(--mono);font-size:12px;color:var(--muted)}
.chrome .pg{font-family:var(--mono);font-size:14px;color:var(--ink);min-width:76px;text-align:center}
.chrome .track{flex:1;min-width:30px;height:3px;background:var(--line);border-radius:3px;margin:0 10px;position:relative}
.chrome .track i{position:absolute;left:0;top:0;height:3px;background:var(--primary);border-radius:3px;transition:width .35s}
.chrome .keyhint{font-size:11.6px;color:var(--muted);white-space:nowrap;letter-spacing:.2px}
.chrome .keyhint b{font-family:var(--mono);color:var(--primary);font-weight:600}
body.immersive #viewport{inset:0 0 58px 0}
body.immersive .chrome{background:#FFFFFF}
#dock{position:fixed;right:0;top:0;bottom:58px;width:min(560px,40vw);background:#FCFBF8;
  border-left:1px solid var(--line);box-shadow:-14px 0 40px rgba(27,43,51,.08);z-index:50;
  transform:translateX(101%);transition:transform .42s cubic-bezier(.2,.7,.2,1);
  display:flex;flex-direction:column}
body.docked #dock{transform:none}
#dock .dh{flex:none;height:64px;border-bottom:1px solid var(--line);display:flex;
  align-items:center;padding:0 26px;gap:12px}
#dock .dh .dt{font-family:var(--serif);font-size:21px;font-weight:700;color:var(--ink);flex:1}
#dock .dh .ds{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:1px}

  border:1px solid var(--line);border-radius:5px;padding:6px 11px;cursor:pointer}
#dock .dh button:hover{background:var(--prim-l);color:var(--primary)}
#dock .db{flex:1;overflow:auto;padding:22px 30px 44px}
#dock .db::-webkit-scrollbar{width:8px}
#dock .db::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
#dock .lead{font-size:14px;line-height:1.9;color:var(--ink2);letter-spacing:.3px;margin:0 0 18px}
#dock .nt{font-family:var(--serif);font-size:17px;color:var(--primary);margin:22px 0 8px;font-weight:700}
#dock .np{font-size:15px;line-height:2.0;color:var(--ink2);letter-spacing:.3px;margin:0 0 16px}
#dock .nb{font-family:var(--serif);font-size:14.5px;line-height:1.85;color:var(--accent);
  border-left:3px solid var(--accent);padding-left:14px;margin:14px 0 0}
#dock .tag{display:inline-block;font-family:var(--mono);font-size:11.5px;color:var(--muted);
  letter-spacing:1px;margin-bottom:6px}
#dock .sec{border-top:1px solid var(--line);padding:18px 0 6px;scroll-margin-top:20px}
#dock .sec:first-of-type{border-top:none}
#dock .sec.cur{background:#F5F8F7;box-shadow:-14px 0 0 #F5F8F7,14px 0 0 #F5F8F7}
#dock .tocgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
#dock .tocgrid a{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:5px;
  background:#fff;text-decoration:none;color:var(--ink);cursor:pointer;font-size:13px;line-height:1.4}
#dock .tocgrid a:hover{border-color:var(--primary);background:var(--prim-l)}
#dock .tocgrid a.cur{border-color:var(--accent);background:var(--acc-l)}
#dock .tocgrid a span{font-family:var(--mono);font-size:11.5px;color:var(--accent);margin-right:7px}
#dock .keys{display:grid;grid-template-columns:1fr 1fr;gap:9px 20px;font-size:13.5px;line-height:1.7}
#dock .keys kbd{font-family:var(--mono);background:#fff;border:1px solid var(--line);
  border-bottom-width:2px;border-radius:4px;padding:2px 7px;color:var(--primary);margin-right:8px}
.toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);background:var(--ink);
  color:#fff;font-size:13px;padding:9px 16px;border-radius:5px;opacity:0;transition:.3s;
  z-index:80;pointer-events:none;max-width:70vw;text-align:center}
.toast.on{opacity:1}
@media print{.chrome,#dock,.toast{display:none!important}#viewport{position:static}
  #stage{position:static;transform:none!important;box-shadow:none}
  .slide{display:block!important;page-break-after:always;position:relative;height:900px}}

<script>

/* ================= 数据 ================= */
const D = [{"eyebrow": "起点 · 关系表与层级的阻抗不匹配", "title": "层级数据到处都是，关系表却是扁的", "lede": "组织架构、商品类目、权限菜单、知识库目录——这些问题的形状是一棵树，而表模型的基本形状是一行。", "caption": "图 01　四类场景都在问同一件事：某节点下面有哪些节点。关系表能存节点，却不能天然表达这条路径。", "bridge": "于是问题不是「能不能存」，而是查询时还要不要每次把关系重新拼回来。", "notes": "先从一个很日常的困境讲起。组织架构是树，商品类目是树，权限菜单是树，知识库目录也是树。可是我们手里的关系表是扁平的：一行一个节点，parent_id 指向父节点。这没问题，存入很自然。麻烦出现在读取：我要查某个节点下所有后代，邻接表就得写递归 CTE 或者反复 join。如果有人把路径直接当字符串存成 Top 点 Science 点 Astronomy，读起来倒是直观，但类型系统并不知道这是路径，合法性、比较、祖先判断、模式匹配就全部散落到应用代码里。Jan Finis 的论文把这件事叫做关系表与层级结构之间的阻抗不匹配。今天讲的 ltree，就是 PostgreSQL 给出的一个工程化的答案。", "svg": "<svg class=\"figure\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" role=\"img\" aria-label=\"层级数据与扁平关系表的阻抗不匹配\"><rect x=\"20.0\" y=\"18.0\" width=\"325.0\" height=\"96.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><rect x=\"21.0\" y=\"19.0\" width=\"323.0\" height=\"32.0\" rx=\"0\" fill=\"#1E4B5A\" stroke=\"none\" stroke-width=\"0\"/><text x=\"35.0\" y=\"41.0\" font-size=\"17\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\">组织架构</text><text x=\"35.0\" y=\"72.0\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">父子汇报链，层级会调整</text><line x1=\"182.0\" y1=\"114.0\" x2=\"182.0\" y2=\"152.0\" stroke=\"#7BA6AF\" stroke-width=\"1.4\"/><polygon points=\"175,145 189,145 182,152\" fill=\"#7BA6AF\"/><rect x=\"365.0\" y=\"18.0\" width=\"325.0\" height=\"96.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><rect x=\"366.0\" y=\"19.0\" width=\"323.0\" height=\"32.0\" rx=\"0\" fill=\"#2E6373\" stroke=\"none\" stroke-width=\"0\"/><text x=\"380.0\" y=\"41.0\" font-size=\"17\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\">商品类目</text><text x=\"380.0\" y=\"72.0\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">类目树稳定，叶子频繁增删</text><line x1=\"527.0\" y1=\"114.0\" x2=\"527.0\" y2=\"152.0\" stroke=\"#7BA6AF\" stroke-width=\"1.4\"/><polygon points=\"520,145 534,145 527,152\" fill=\"#7BA6AF\"/><rect x=\"710.0\" y=\"18.0\" width=\"325.0\" height=\"96.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><rect x=\"711.0\" y=\"19.0\" width=\"323.0\" height=\"32.0\" rx=\"0\" fill=\"#47808D\" stroke=\"none\" stroke-width=\"0\"/><text x=\"725.0\" y=\"41.0\" font-size=\"17\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\">权限菜单</text><text x=\"725.0\" y=\"72.0\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">菜单即路径，常查子树</text><line x1=\"872.0\" y1=\"114.0\" x2=\"872.0\" y2=\"152.0\" stroke=\"#7BA6AF\" stroke-width=\"1.4\"/><polygon points=\"865,145 879,145 872,152\" fill=\"#7BA6AF\"/><rect x=\"1055.0\" y=\"18.0\" width=\"325.0\" height=\"96.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><rect x=\"1056.0\" y=\"19.0\" width=\"323.0\" height=\"32.0\" rx=\"0\" fill=\"#74A5AD\" stroke=\"none\" stroke-width=\"0\"/><text x=\"1070.0\" y=\"41.0\" font-size=\"17\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\">知识库目录</text><text x=\"1070.0\" y=\"72.0\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">目录嵌套，按路径聚合</text><line x1=\"1217.0\" y1=\"114.0\" x2=\"1217.0\" y2=\"152.0\" stroke=\"#7BA6AF\" stroke-width=\"1.4\"/><polygon points=\"1210,145 1224,145 1217,152\" fill=\"#7BA6AF\"/><rect x=\"20.0\" y=\"152.0\" width=\"1360.0\" height=\"92.0\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><text x=\"40.0\" y=\"180.0\" font-size=\"18\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\">扁平关系表</text><text x=\"40.0\" y=\"207.0\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">一行一个节点；parent_id 只是外键，表里没有「祖先 / 后代」这一列。</text><line x1=\"700.0\" y1=\"244.0\" x2=\"700.0\" y2=\"282.0\" stroke=\"#BE653B\" stroke-width=\"1.4\"/><polygon points=\"693,275 707,275 700,282\" fill=\"#BE653B\"/><rect x=\"20.0\" y=\"282.0\" width=\"670.0\" height=\"122.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><rect x=\"21.0\" y=\"283.0\" width=\"668.0\" height=\"32.0\" rx=\"0\" fill=\"#BE653B\" stroke=\"none\" stroke-width=\"0\"/><text x=\"35.0\" y=\"305.0\" font-size=\"17\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\">读取侧：关系要现拼</text><text x=\"35.0\" y=\"336.0\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">递归 CTE 或多次 join 才能取整棵子树</text><text x=\"35.0\" y=\"363.0\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\"> ancestors / descendants 查询写起来冗长</text><rect x=\"710.0\" y=\"282.0\" width=\"670.0\" height=\"122.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><rect x=\"711.0\" y=\"283.0\" width=\"668.0\" height=\"32.0\" rx=\"0\" fill=\"#BE653B\" stroke=\"none\" stroke-width=\"0\"/><text x=\"725.0\" y=\"305.0\" font-size=\"17\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\">应用侧：路径当字符串</text><text x=\"725.0\" y=\"336.0\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">合法性、比较、模式匹配散落在代码里</text><text x=\"725.0\" y=\"363.0\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">改名 / 层级调整时容易漏改</text></svg>"}, {"eyebrow": "路线 · 代价放在哪里", "title": "四种建模路线，代价放在不同地方", "lede": "没有一种模型全面领先：邻接表把复杂度放在读，闭包表放在写，嵌套集放在结构重编号。", "caption": "图 02　ltree 不是「所有层级问题都快」，它把路径关系固化进类型、算子和索引，代价落在写路径。", "bridge": "所以它的目标很窄：让路径枚举模型在数据库里变成可比较、可匹配、可索引的值。", "notes": "不用 ltree，大致有四条路。邻接表每行存 parent_id，写和移动单点都很简单，但查整棵子树、查所有祖先要递归。普通文本路径看起来直观，但数据库只当它是字符串，合法性、比较、模式匹配全在应用里。闭包表把所有祖先到后代的关系都存下来，读很快，写和移动子树会放大成多行维护。嵌套集把子树查询变成范围查询，但插入、移动、重排的代价很高。你会发现，区别不是谁更先进，而是代价放在哪里。ltree 的选择是：把路径作为一列保存，把祖先关系变成前缀语义，把模式查询做成专门类型，再让 B-tree、hash、GiST 接进优化器。代价仍然在：移动子树时，所有后代的路径都要更新。", "svg": "<svg class=\"figure\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" role=\"img\" aria-label=\"四种层级建模方式的取舍\"><rect x=\"20.0\" y=\"24.0\" width=\"325.0\" height=\"272.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><rect x=\"21.0\" y=\"25.0\" width=\"323.0\" height=\"40.0\" rx=\"0\" fill=\"#74A5AD\" stroke=\"none\" stroke-width=\"0\"/><text x=\"36.0\" y=\"52.0\" font-size=\"18\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\">邻接表</text><text x=\"36.0\" y=\"92.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">写：单点插入/移动简单</text><text x=\"36.0\" y=\"122.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">读：整棵子树要递归</text><rect x=\"36.0\" y=\"160.0\" width=\"293.0\" height=\"1.0\" rx=\"0\" fill=\"#D9D5CB\" stroke=\"none\" stroke-width=\"0\"/><text x=\"36.0\" y=\"184.0\" font-size=\"14\" fill=\"#BE653B\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\">代价放在查询侧</text><rect x=\"365.0\" y=\"24.0\" width=\"325.0\" height=\"272.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><rect x=\"366.0\" y=\"25.0\" width=\"323.0\" height=\"40.0\" rx=\"0\" fill=\"#A4C4C6\" stroke=\"none\" stroke-width=\"0\"/><text x=\"381.0\" y=\"52.0\" font-size=\"18\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\">普通文本路径</text><text x=\"381.0\" y=\"92.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">写：直接拼字符串</text><text x=\"381.0\" y=\"122.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">读：语义靠应用代码</text><rect x=\"381.0\" y=\"160.0\" width=\"293.0\" height=\"1.0\" rx=\"0\" fill=\"#D9D5CB\" stroke=\"none\" stroke-width=\"0\"/><text x=\"381.0\" y=\"184.0\" font-size=\"14\" fill=\"#BE653B\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\">代价放在类型侧</text><rect x=\"710.0\" y=\"24.0\" width=\"325.0\" height=\"272.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><rect x=\"711.0\" y=\"25.0\" width=\"323.0\" height=\"40.0\" rx=\"0\" fill=\"#47808D\" stroke=\"none\" stroke-width=\"0\"/><text x=\"726.0\" y=\"52.0\" font-size=\"18\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\">闭包表</text><text x=\"726.0\" y=\"92.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">写：维护全部祖先-后代行</text><text x=\"726.0\" y=\"122.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">读：关系判定直接</text><rect x=\"726.0\" y=\"160.0\" width=\"293.0\" height=\"1.0\" rx=\"0\" fill=\"#D9D5CB\" stroke=\"none\" stroke-width=\"0\"/><text x=\"726.0\" y=\"184.0\" font-size=\"14\" fill=\"#BE653B\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\">代价放在写入侧</text><rect x=\"1055.0\" y=\"24.0\" width=\"325.0\" height=\"272.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><rect x=\"1056.0\" y=\"25.0\" width=\"323.0\" height=\"40.0\" rx=\"0\" fill=\"#2E6373\" stroke=\"none\" stroke-width=\"0\"/><text x=\"1071.0\" y=\"52.0\" font-size=\"18\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\">嵌套集 / 区间</text><text x=\"1071.0\" y=\"92.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">写：插入移动可能重编号</text><text x=\"1071.0\" y=\"122.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">读：子树变范围查询</text><rect x=\"1071.0\" y=\"160.0\" width=\"293.0\" height=\"1.0\" rx=\"0\" fill=\"#D9D5CB\" stroke=\"none\" stroke-width=\"0\"/><text x=\"1071.0\" y=\"184.0\" font-size=\"14\" fill=\"#BE653B\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\">代价放在结构更新</text><rect x=\"20. xt><line x1=\"700.0\" y1=\"98.0\" x2=\"700.0\" y2=\"116.0\" stroke=\"#7BA6AF\" stroke-width=\"1.4\"/><polygon points=\"693,109 707,109 700,116\" fill=\"#7BA6AF\"/><rect x=\"20.0\" y=\"118.0\" width=\"1360.0\" height=\"82.0\" rx=\"0\" fill=\"#A4C4C6\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><rect x=\"20.0\" y=\"118.0\" width=\"250.0\" height=\"82.0\" rx=\"0\" fill=\"#A4C4C6\" stroke=\"none\" stroke-width=\"0\"/><text x=\"40.0\" y=\"168.0\" font-size=\"19\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\">类型层</text><line x1=\"270.0\" y1=\"130.0\" x2=\"270.0\" y2=\"188.0\" stroke=\"#1B2B33\" stroke-width=\"1\"/><text x=\"292.0\" y=\"168.0\" font-size=\"16\" fill=\"#1B2B33\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\">ltree 值 · lquery 位置敏感模式 · ltxtquery 词逻辑模式</text><line x1=\"700.0\" y1=\"200.0\" x2=\"700.0\" y2=\"218.0\" stroke=\"#7BA6AF\" stroke-width=\"1.4\"/><polygon points=\"693,211 707,211 700,218\" fill=\"#7BA6AF\"/><rect x=\"20.0\" y=\"220.0\" width=\"1360.0\" height=\"82.0\" rx=\"0\" fill=\"#47808D\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><rect x=\"20.0\" y=\"220.0\" width=\"250.0\" height=\"82.0\" rx=\"0\" fill=\"#47808D\" stroke=\"none\" stroke-width=\"0\"/><text x=\"40.0\" y=\"270.0\" font-size=\"19\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\">算子层</text><line x1=\"270.0\" y1=\"232.0\" x2=\"270.0\" y2=\"290.0\" stroke=\"#FFFFFF\" stroke-width=\"1\"/><text x=\"292.0\" y=\"270.0\" font-size=\"16\" fill=\"#FFFFFF\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\">&lt;  &lt;=  =  &gt;=  &gt;   ·   @&gt;  &lt;@   ·   ~  @  ?</text><line x1=\"700.0\" y1=\"302.0\" x2=\"700.0\" y2=\"320.0\" stroke=\"#7BA6AF\" stroke-width=\"1.4\"/><polygon points=\"693,313 707,313 700,320\" fill=\"#7BA6AF\"/><rect x=\"20.0\" y=\"322.0\" width=\"1360.0\" height=\"82.0\" rx=\"0\" fill=\"#1E4B5A\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><rect x=\"20.0\" 5\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\">按 level 比较</text><text x=\"509.0\" y=\"370.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">祖先判断逐层做，不重新解析字符串</text><text x=\"509.0\" y=\"392.0\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">示意结构，非磁盘页布局</text><rect x=\"950.0\" y=\"318.0\" width=\"435.0\" height=\"86.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><text x=\"964.0\" y=\"344.0\" font-size=\"15.5\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\">反向遍历</text><text x=\"964.0\" y=\"370.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">ltree_out() 从后往前写出 label</text><text x=\"964.0\" y=\"392.0\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">示意结构，非磁盘页布局</text></svg>"}, {"eyebrow": "输入解析 · parse_ltree()", "title": "两遍扫描，一次分配", "lede": "源码里的 parse_ltree() 把「输入是否合法」和「内存如何排布」彻底拆开。", "caption": "图 07　第一遍数点号并查上限，第二遍用状态机拆 label；全部校验完才一次性分配目标结构。", "bridge": "有了按 level 排好的序列，比较和祖先判断就变成一件很直接的事。", "notes": "输入解析发生在 ltree_io.c 的 parse_ltree。它做两遍工作。第一遍扫描输入，数点号的数量，从而推导出最多需要多少个 label，并检查有没有超过 LTREE_MAX_LEVELS。第二遍才是真正的状态机，只有两个状态：LTPRS_WAITNAME 等待 label 开始，LTPRS_WAITDELIM 读取 label 内容并等待点号或结束。每个 label 先暂存在 nodeitem 数组里，由 finish_nodeitem 检查字符长度等约束。关键在最后一步：等所有 label 都合法、aligned size 都算清楚，才一次性 palloc0 出目标 varlena，写入 numlevel 和每个 level。这带来两个工程收益：一是合法性检查和内存布局构造分离，不会边写边发现语法错；二是目标结构一次分配，内部靠偏移遍历，不需要给每个 label 单独分配小对象。", "svg": "<svg class=\"figure\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" role=\"img\" aria-label=\"ltree 输入解析两遍扫描流程\"><rect x=\"20.0\" y=\"30.0\" width=\"258.0\" height=\"200.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><rect x=\"21.0\" y=\"31.0\" width=\"256.0\" height=\"42.0\" rx=\"0\" fill=\"#CFE0DC\" stroke=\"none\" stroke-width=\"0\"/><text x=\"34.0\" y=\"59.0\" font-size=\"15.5\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\">① 第一遍扫描</text><text x=\"34.0\" y=\"102.0\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">数点号，推导最多需要几个 label</text><text x=\"34.0\" y=\"142.0\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">检查是否超过 LTREE_MAX_LEVELS</text><line x1=\"278.0\" y1=\"130.0\" x2=\"298.0\" y2=\"130.0\" stroke=\"#7BA6AF\" stroke-width=\"1.4\"/><polygon points=\"291,123 291,137 298,130\" fill=\"#7BA6AF\"/><rect x=\"298.0\" y=\"30.0\" width=\"258.0\" height=\"200.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><rect x=\"299.0\" y=\"31.0\" width=\"256.0\" height=\"42.0\" rx=\"0\" fill=\"#A4C4C6\" stroke=\"none\" stroke-width=\"0\"/><text x=\"312.0\" y=\"59.0\" font-size=\"15.5\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\">② 第二遍状态机</text><text x=\"312.0\" y=\"102.0\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">LTPRS_WAITNAME 等待开始</text><text x=\"312.0\" y=\"142.0\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">LTPRS_WAITDELIM 读取内容</text><line x1=\"556.0\" y1=\"130.0\" x2=\"576.0\" y2=\"130.0\" stroke=\"#7BA6AF\" stroke-width=\"1.4\"/><polygon points=\"569,123 569,137 576,130\" fill=\"#7BA6AF\"/><rect x=\"576.0\" y=\"30.0\" width=\"258.0\" height=\"200.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><rect x=\"577.0\" y=\"31.0\" width=\"256.0\" height=\"42.0\" rx=\"0\" fill=\"#74A5AD\" stroke=\"none\" stroke-width=\"0\"/><text x=\"590.0\" y=\"59.0\" font-size=\"15.5\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\">③ nodeitem 暂存</text><text x=\"590.0\" y=\"102.0\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">每个 label 先放进临时数组</text><text x=\"590.0\" y=\"142.0\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">finish_nodeitem() 校验字符长度</text><line x1=\"834.0\" y1=\"130.0\" x2=\"854.0\" y2=\"130.0\" stroke=\"#7BA6AF\" stroke-width=\"1.4\"/><polygon points=\"847,123 847,137 854,130\" fill=\"#7BA6AF\"/><rect x=\"854.0\" y=\"30.0\" width=\"258.0\" height=\"200.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><rect x=\"855.0\" y=\"31.0\" width=\"256.0\" height=\"42.0\" rx=\"0\" fill=\"#47808D\" stroke=\"none\" stroke-width=\"0\"/><text x=\"868.0\" y=\"59.0\" font-size=\"15.5\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\">④ 计算对齐总长</text><text x=\"868.0\" y=\"102.0\" font-size=\"13\" fill=\"#FFFFFF\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">累加每个 label 的 aligned size</text><text x=\"868.0\" y=\"142.0\" font-size=\"13\" fill=\"#FFFFFF\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">得到 totallen</text><line x1=\"1112.0\" y1=\"130.0\" x2=\"1132.0\" y2=\"130.0\" stroke=\"#7BA6AF\" stroke-width=\"1.4\"/><polygon points=\"1125,123 1125,137 1132,130\" fill=\"#7BA6AF\"/><rect x=\"1132.0\" y=\"30.0\" width=\"258.0\" height=\"200.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><rect x=\"1133.0\" y=\"31.0\" width=\"256.0\" height=\"42.0\" rx=\"0\" fill=\"#2E6373\" stroke=\"none\" stroke-width=\"0\"/><text x=\"1146.0\" y=\"59.0\" font-size=\"15.5\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\">⑤ 一次性分配</text><text x=\"1146.0\" y=\"102.0\" font-size=\"13\" fill=\"#FFFFFF\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">palloc0(LTREE_HDRSIZE + totallen)</text><text x=\"1146.0\" y=\"142.0\" font-size=\"13\" fill=\"#FFFFFF\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">写入 numlevel 与各 ltree_level</text><rect x=\"20.0\" y=\"262.0\" width=\"670.0\" height=\"138.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><rect x=\"21.0\" y=\"263.0\" width=\"668.0\" height=\"32.0\" rx=\"0\" fill=\"#2F7A66\" stroke=\"none\" stroke-width=\"0\"/><text x=\"35.0\" y=\"285.0\" font-size=\"17\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\">收益一：检查与构造分离</text><text x=\"35.0\" y=\"316.0\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">不会边写目标结构边发现语法错误</text><text x=\"35.0\" y=\"343.0\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">非法输入在第一 / 第二遍就被挡住</text><rect x=\"710.0\" y=\"262.0\" width=\"670.0\" height=\"138.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><rect x=\"711.0\" y=\"263.0\" width=\"668.0\" height=\"32.0\" rx=\"0\" fill=\"#2F7A66\" stroke=\"none\" stroke-width=\"0\"/><text x=\"725.0\" y=\"285.0\" font-size=\"17\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\">收益二：一次分配，偏移遍历</text><text x=\"725.0\" y=\"316.0\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">目标 varlena 一次 palloc0 到位</text><text x=\"725.0\" y=\"343.0\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">内部靠 LEVEL_NEXT 偏移跳转，不逐 label 分配小对象</text></svg>"}, {"eyebrow": "原理 · 祖先与后代", "title": "祖先判断：逐层比较，不是字符串前缀", "lede": "@> 与 <@ 的实现落在 ltree_level 序列上——一层一层比，比到谁先结束谁就是短的那条路径。", "caption": "图 08　逐层比较的交互演示：改两条路径，播放或单步，观察前缀判定在哪一层得出结论。", "bridge": "模式查询 ~ 用的也不是原始输入文本，而是先编译好的 lquery 结构。", "ctrl": "<label>祖先侧 p</label><input id=\"cmpA\" type=\"text\" value=\"Top.Science\" size=\"20\"><label>后代侧 c</label><input id=\"cmpB\" type=\"text\" value=\"Top.Science.Astronomy\" size=\"26\"><button class=\"btn\" id=\"cmpPlay\">▶ 播放</button><button class=\"btn\" id=\"cmpStep\">单步 →</button><button class=\"btn\" id=\"cmpReset\">↺ 重置</button><span class=\"out\" id=\"cmpOut\"></span>", "disclaim": null, "notes": "接着看祖先判断。源码里 inner_isparent(c, p) 的意思是：p 是不是 c 的前缀。逻辑非常朴素：如果 p 的层数比 c 还多，直接返回 false；否则从第一层开始，逐个 level 比较长度和内容，全部相等就说明 p 是 c 的前缀。于是 Top 点 Science 包含 Top 点 Science 点 Astronomy，写成 @> 结果是 true；反过来用 <@ 也是 true。这一页可以动手试：改左边两条路径，按播放会一层一层往下比，你会看到结论要么在中途某层不同时给出，要么在短的一方先结束时给出。特别提醒一个常见的坑：Top 点 A 和 Top 点 AA 不是字符串前缀关系，而是 label 序列关系，所以查子树要用 @> 或 <@，绝不能退化成 LIKE 加百分号。", "svg": "<svg class=\"figure\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" role=\"img\" aria-label=\"ltree 祖先判断逐层比较动画\"><text x=\"28.0\" y=\"40.0\" font-size=\"19\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"serif\">祖先判断逐层比对</text><text x=\"28.0\" y=\"66.0\" font-size=\"14\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\">祖先侧 p</text><text x=\"28.0\" y=\"140.0\" font-size=\"14\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\">后代侧 c</text><text x=\"28.0\" y=\"216.0\" font-size=\"13\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">逐层判定</text><g id=\"cmpPA\"></g><g id=\"cmpPB\"></g><g id=\"cmpPM\"></g><rect x=\"20.0\" y=\"252.0\" width=\"1360.0\" height=\"74.0\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><rect x=\"20.0\" y=\"252.0\" width=\"4.0\" height=\"74.0\" rx=\"0\" fill=\"#BE653B\" stroke=\"none\" stroke-width=\"0\"/><text x=\"40.0\" y=\"281.0\" font-size=\"13\" fill=\"#BE653B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\">判定结论</text><text id=\"cmpVerdictText\" x=\"40\" y=\"312\" font-size=\"17\" fill=\"#1B2B33\" font-weight=\"700\">待播放 · 输入两条路径后按 ▶ 播放</text><text x=\"28.0\" y=\"360.0\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">inner_isparent(c, p)：p 是否为 c 的前缀。p.numlevel &gt; c.numlevel 直接 false；否则逐 level 比对长度与内容。</text><text x=\"28.0\" y=\"390.0\" font-size=\"13.5\" fill=\"#BE653B\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">注意：Top.A 与 Top.AA 的关系不是字符串前缀，而是 label 序列关系。</text></svg>"}, {"eyebrow": "查询结构 · lquery / ltxtquery", "title": "查询表达式也被编译成结构", "lede": "ltree 不只把路径值结构化，它把模式也结构化了：执行器和索引不必每次解释用户输入文本。", "caption": "图 09　lquery 按层保存模式与 OR 分支，firstgood 供 GiST 剪枝；ltxtquery 用 ITEM 数组加 operand 文本区。", "bridge": "值和模式都结构化之后，索引要回答最后一个问题：怎么给一整棵子树做摘要。", "notes": "第三条主线是查询也被编译。lquery 的源码结构里有 numlevel、firstgood 和一串 lquery_level。firstgood 记录前面有几层是简单匹配，这个数字等一下在 GiST 里会用来做边界剪枝。每一层 lquery_level 有 totallen、flag、numvar、low、high，然后是若干 lquery_variant，也就是 OR 分支；每个 variant 保存 label 的 CRC、字节长度、flag 和原始 name。flag 就是星号、艾特、百分号、感叹号和重复次数这些语法。ltxtquery 走另一条路：它像全文检索表达式，解析成 ITEM 数组加上 operand 文本区，ITEM 里存操作符、词项 CRC、flag、operand 距离。这样执行器和索引看到的是结构，不是字符串。记住这一点，下面看 GiST 摘要会更顺。", "svg": "<svg class=\"figure\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" role=\"img\" aria-label=\"lquery 与 ltxtquery 内部结构\"><rect x=\"20.0\" y=\"20.0\" width=\"680.0\" height=\"370.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><rect x=\"21.0\" y=\"21.0\" width=\"678.0\" height=\"44.0\" rx=\"0\" fill=\"#47808D\" stroke=\"none\" stroke-width=\"0\"/><text x=\"38.0\" y=\"50.0\" font-size=\"17\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\">lquery</text><text x=\"196.0\" y=\"49.0\" font-size=\"13.5\" fill=\"#FFFFFF\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">位置敏感 · 整条路径必须匹配</text><text x=\"38.0\" y=\"94.0\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\">(len)(numlevel)(firstgood)(flag) + lquery_level[]</text><rect x=\"38.0\" y=\"116.0\" width=\"644.0\" height=\"40.0\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><text x=\"50.0\" y=\"142.0\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\">numlevel</text><text x=\"210.0\" y=\"142.0\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">模式层数</text><rect x=\"38.0\" y=\"164.0\" width=\"644.0\" height=\"40.0\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><text x=\"50.0\" y=\"190.0\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\">firstgood</text><text x=\"210.0\" y=\"190.0\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">前导简单匹配层数，供 GiST 边界剪枝</text><rect x=\"38.0\" y=\"212.0\" width=\"644.0\" height=\"40.0\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><text x=\"50.0\" y=\"238.0\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\">lquery_level</text><text x=\"210.0\" y=\"238.0\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">totallen / flag / numvar / low / high</text><rect x=\"38.0\" y=\"260.0\" width=\"644.0\" height=\"40.0\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><text x=\"50.0\" y=\"286.0\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\">lquery_variant</text><text x=\"210.0\" y=\"286.0\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">val(CRC) / len / flag / name</text><text x=\"38.0\" y=\"324.0\" font-size=\"13\" fill=\"#BE653B\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">flag：* 前缀 · @ 忽略大小写 · % 分词 · ! 取反 · {n,m} 重复次数</text><rect x=\"720.0\" y=\"20.0\" width=\"660.0\" height=\"370.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><rect x=\"721.0\" y=\"21.0\" width=\"658.0\" height=\"44.0\" rx=\"0\" fill=\"#74A5AD\" stroke=\"none\" stroke-width=\"0\"/><text x=\"738.0\" y=\"50.0\" font-size=\"17\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\">ltxtquery</text><text x=\"910.0\" y=\"49.0\" font-size=\"13.5\" fill=\"#FFFFFF\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">位置无关 · 词逻辑表达式</text><text x=\"738.0\" y=\"94.0\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\">(len)(size)(ITEM[])(operand 文本区)</text><rect x=\"738.0\" y=\"112.0\" width=\"624.0\" height=\"88.0\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><text x=\"752.0\" y=\"138.0\" font-size=\"14\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\">ITEM × size</text><text x=\"752.0\" y=\"162.0\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">type / left / val(CRC) / flag / length / distance</text><text x=\"752.0\" y=\"186.0\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">operand 区保存用户可读的词项文本</text><rect x=\"738.0\" y=\"214.0\" width=\"624.0\" height=\"62.0\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#7BA6AF\" stroke-width=\"1.1\"/><text x=\"752.0\" y=\"240.0\" font-size=\"14\" fill=\"#245A6B\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\">Europe &amp; Russia*@ &amp; !Transportation</text><text x=\"752.0\" y=\"263.0\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">位置无关：词出现在哪一层都可以</text><text x=\"738.0\" y=\"306.0\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">执行器与索引按 level / variant / flag / CRC 判断，不反复解释输入文本。</text><text x=\"738.0\" y=\"332.0\" font-size=\"13\" fill=\"#2F7A66\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\">结构一旦建好，判断就是读字段。</text><rect x=\"20.0\" y=\"402.0\" width=\"1360.0\" height=\"1.0\" rx=\"0\" fill=\"#D9D5CB\" stroke=\"none\" stroke-width=\"0\"/></svg>"}, {"eyebrow": "GiST · 分工边界", "title": "框架管树，opclass 管路径语义", "lede": "GiST 论文的核心思想是把「树的机制」和「类型的语义」分开，ltree 正是这个思想的一次落地。", "caption": "图 10　PostgreSQL GiST 负责树、页、WAL、并发和扫描；ltree opclass 负责摘要、剪枝、边界与分裂。", "bridge": "这个分工的载体，就是 GiST 索引里的 ltree_gist key。", "notes": "这里插入一段背景。GiST 那篇论文的思想是：数据库系统提供一个通用搜索树框架，负责树、页、写前日志、并发和扫描；数据类型作者只提供若干语义函数，告诉框架这个类型怎么比较、怎么摘要、怎么分裂。PostgreSQL 的 ltree 正是这样落地的。左边这一列是框架替我们做的事，右边这一列是 ltree opclass 自己做的事：路径如何压成签名，左右边界怎么算，什么查询能安全剪枝，插入时怎么估计代价，分裂时怎么给 entry 分组。两边通过七个 support function 接口对接。理解这个分工很关键，否则容易把「签名过滤」误认为框架通用能力，或者把页分裂误认为类型自己的事。", "svg": "<svg class=\"figure\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" role=\"img\" aria-label=\"GiST 框架与 ltree opclass 的职责分工\"><text x=\"30.0\" y=\"34.0\" font-size=\"16\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\">GiST 框架：通用搜索树</text><text x=\"770.0\" y=\"34.0\" font-size=\"16\" fill=\"#BE653B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\">ltree opclass：路径语义</text><rect x=\"30.0\" y=\"54.0\" width=\"610.0\" height=\"50.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><rect x=\"30.0\" y=\"54.0\" width=\"4.0\" height=\"50.0\" rx=\"0\" fill=\"#2E6373\" stroke=\"none\" stroke-width=\"0\"/><text x=\"50.0\" y=\"86.0\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">树结构与页布局</text><rect x=\"770.0\" y=\"54.0\" width=\"600.0\" height=\"50.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><rect x=\"770.0\" y=\"54.0\" width=\"4.0\" height=\"50.0\" rx=\"0\" fill=\"#BE653B\" stroke=\"none\" stroke-width=\"0\"/><text x=\"790.0\" y=\"86.0\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">路径如何摘要为 sign</text><line x1=\"640.0\" y1=\"79.0\" x2=\"770.0\" y2=\"79.0\" stroke=\"#7BA6AF\" stroke-width=\"1.4\"/><polygon points=\"763,72 763,86 770,79\" fill=\"#7BA6AF\"/><rect x=\"625.8\" y=\"57.0\" width=\"158.4\" height=\"18.0\" rx=\"0\" fill=\"#F7F6F2\" stroke=\"none\" stroke-width=\"0\"/><text x=\"631.8\" y=\"70.0\" font-size=\"12\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">7 个 support functions</text><rect x=\"30.0\" y=\"116.0\" width=\"610.0\" height=\"50.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><rect x=\"30.0\" y=\"116.0\" width=\"4.0\" height=\"50.0\" rx=\"0\" fill=\"#47808D\" stroke=\"none\" stroke-width=\"0\"/><text x=\"50.0\" y=\"148.0\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">WAL 与崩溃恢复</text><rect x=\"770.0\" y=\"116.0\" width=\"600.0\" height=\"50.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><rect x=\"770.0\" y=\"116.0\" width=\"4.0\" height=\"50.0\" rx=\"0\" fill=\"#AE8A3E\" stroke=\"none\" stroke-width=\"0\"/><text x=\"790.0\" y=\"148.0\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">左右边界如何计算</text><line x1=\"640.0\" y1=\"141.0\" x2=\"770.0\" y2=\"141.0\" stroke=\"#7BA6AF\" stroke-width=\"1.4\"/><polygon points=\"763,134 763,148 770,141\" fill=\"#7BA6AF\"/><rect x=\"30.0\" y=\"178.0\" width=\"610.0\" height=\"50.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><rect x=\"30.0\" y=\"178.0\" width=\"4.0\" height=\"50.0\" rx=\"0\" fill=\"#74A5AD\" stroke=\"none\" stroke-width=\"0\"/><text x=\"50.0\" y=\"210.0\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">并发与锁</text><rect x=\"770.0\" y=\"178.0\" width=\"600.0\" height=\"50.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><rect x=\"770.0\" y=\"178.0\" width=\"4.0\" height=\"50.0\" rx=\"0\" fill=\"#BE653B\" stroke=\"none\" stroke-width=\"0\"/><text x=\"790.0\" y=\"210.0\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">哪些查询可安全剪枝</text><line x1=\"640.0\" y1=\"203.0\" x2=\"770.0\" y2=\"203.0\" stroke=\"#7BA6AF\" stroke-width=\"1.4\"/><polygon points=\"763,196 763,210 770,203\" fill=\"#7BA6AF\"/><rect x=\"30.0\" y=\"240.0\" width=\"610.0\" height=\"50.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><rect x=\"30.0\" y=\"240.0\" width=\"4.0\" height=\"50.0\" rx=\"0\" fill=\"#A4C4C6\" stroke=\"none\" stroke-width=\"0\"/><text x=\"50.0\" y=\"272.0\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">索引扫描调度</text><rect x=\"770.0\" y=\"240.0\" width=\"600.0\" height=\"50.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><rect x=\"770.0\" y=\"240.0\" width=\"4.0\" height=\"50.0\" rx=\"0\" fill=\"#AE8A3E\" stroke=\"none\" stroke-width=\"0\"/><text x=\"790.0\" y=\"272.0\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">插入时边界扩张代价</text><line x1=\"640.0\" y1=\"265.0\" x2=\"770.0\" y2=\"265.0\" stroke=\"#7BA6AF\" stroke-width=\"1.4\"/><polygon points=\"763,258 763,272 770,265\" fill=\"#7BA6AF\"/><rect x=\"30.0\" y=\"302.0\" width=\"610.0\" height=\"50.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><rect x=\"30.0\" y=\"302.0\" width=\"4.0\" height=\"50.0\" rx=\"0\" fill=\"#CFE0DC\" stroke=\"none\" stroke-width=\"0\"/><text x=\"50.0\" y=\"334.0\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">page split 的通用机制</text><rect x=\"770.0\" y=\"302.0\" width=\"600.0\" height=\"50.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><rect x=\"770.0\" y=\"302.0\" width=\"4.0\" height=\"50.0\" rx=\"0\" fill=\"#BE653B\" stroke=\"none\" stroke-width=\"0\"/><text x=\"790.0\" y=\"334.0\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">分裂时如何按边界分组</text><line x1=\"640.0\" y1=\"327.0\" x2=\"770.0\" y2=\"327.0\" stroke=\"#7BA6AF\" stroke-width=\"1.4\"/><polygon points=\"763,320 763,334 770,327\" fill=\"#7BA6AF\"/><rect x=\"30.0\" y=\"372.0\" width=\"1340.0\" height=\"42.0\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\"/><text x=\"50.0\" y=\"399.0\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">Hellerstein 等人的 GiST 思想：框架提供树，数据类型作者提供 consistent / union / compress / penalty / picksplit 等语义函数。</text></svg>"}, {"eyebrow": "GiST key · 基石布局", "title": "叶子保存完整路径，内部页保存摘要", "lede": "ltree_gist 不是普通 B-tree，也不是纯签名树，而是「有顺序边界的签名树」。", "caption": "图 11　源码注释给出的三种 key 布局：叶子是完整 ltree，内部页是 sign 加左右边界，ALLTRUE 时省略 sign。", "bridge": "其中的 sign 怎么算出来？它既决定剪枝效果，也决定误下探的概率。", "notes": "GiST opclass 的 storage type 叫 ltree_gist，结构体只有 varlena 头、uint32 flag 和柔性 data。源码注释把布局写得清清楚楚：叶子页是 len、flag、再加一个完整的 ltree；非叶子页是 len、flag、sign、left_ltree、right_ltree；如果签名全为真，就打上 ALLTRUE 标记并把 sign 省略。这里有两个关键信息。第一，叶子保存完整路径，所以叶子的判断是精确的，源码里明确写 recheck 等于 false。第二，内部页的 sign 是子树里出现过的 label 的位图摘要，left 和 right 是按 ltree_compare 排序的左右边界。签名来自对每个 label 计算 CRC32，然后对 siglen 乘八取模置位。默认签名长度是八字节，最长可以到 2024 字节。签名越长越精确，但索引也越大。", "svg": "<svg class=\"figure\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" role=\"img\" aria-label=\"ltree GiST index key 布局\"><rect x=\"30.0\" y=\"16.0\" width=\"3.0\" height=\"15.0\" rx=\"0\" fill=\"#2F7A66\" stroke=\"none\" stroke-width=\"0\"/><text x=\"40.0\" y=\"29.0\" font-size=\"12.5\" fill=\"#2F7A66\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\">叶子 key · 保存完整 ltree，判断精确</text><rect x=\"30.0\" y=\"38.0\" width=\"110.0\" height=\"74.0\" rx=\"0\" fill=\"#CFE0DC\" stroke=\"#FFFFFF\" stroke-width=\"1.4\"/><text x=\"85.0\" y=\"81.0\" font-size=\"15\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\">(len)</text><rect x=\"140.0\" y=\"38.0\" width=\"130.0\" height=\"74.0\" rx=\"0\" fill=\"#A4C4C6\" stroke=\"#FFFFFF\" stroke-width=\"1.4\"/><text x=\"205.0\" y=\"81.0\" font-size=\"15\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\">(flag)</text><rect x=\"270.0\" y=\"38.0\" width=\"1120.0\" height=\"74.0\" rx=\"0\" fill=\"#1E4B5A\" stroke=\"#FFFFFF\" stroke-width=\"1.4\"/><text x=\"830.0\" y=\"81.0\" font-size=\"15\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\">(ltree) · numlevel + 对齐的 level 序列</text><rect x=\"30.0\" y=\"132.0\" width=\"3.0\" height=\"15.0\" rx=\"0\" fill=\"#BE653B\" stroke=\"none\" stroke-width=\"0\"/><text x=\"40.0\" y=\"145.0\" font-size=\"12.5\" fill=\"#BE653B\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\">非叶子 key · 摘要 + 顺序边界</text><rect x=\"30.0\" y=\"154.0\" width=\"90.0\" height=\"88.0\" rx=\"0\" fill=\"#CFE0DC\" stroke=\"#FFFFFF\" stroke-width=\"1.4\"/><text x=\"75.0\" y=\"205.0\" font-size=\"14\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\">(len)</text><rect x=\"120.0\" y=\"154.0\" width=\"110.0\" height=\"88.0\" rx=\"0\" fill=\"#A4C4C6\" stroke=\"#FFFFFF\" stroke-width=\"1.4\"/><text x=\"175.0\" y=\"205.0\" font-size=\"14\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\">(flag)</text><rect x=\"230.0\" y=\"154.0\" width=\"340.0\" height=\"88.0\" rx=\"0\" fill=\"#47808D\" stroke=\"#FFFFFF\" stroke-width=\"1.4\"/><text x=\"400.0\" y=\"205.0\" font-size=\"14\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\">(sign) · 子树 label 位图</text><rect x=\"570.0\" y=\"154.0\" width=\"380.0\" height=\"88.0\" rx=\"0\" fill=\"#2E6373\" stroke=\"#FFFFFF\" stroke-width=\"1.4\"/><text x=\"760.0\" y=\"205.0\" font-size=\"14\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\">(left_ltree) · 排序左边界</text><rect x=\"950.0\" y=\"154.0\" width=\"440.0\" height=\"88.0\" rx=\"0\" fill=\"#1E4B5A\" stroke=\"#FFFFFF\" stroke-width=\"1.4\"/><text x=\"1170.0\" y=\"205.0\" font-size=\"14\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\">(right_ltree) · 排序右边界</text><rect x=\"30.0\" y=\"262.0\" width=\"3.0\" height=\"15.0\" rx=\"0\" fill=\"#AE8A3E\" stroke=\"none\" stroke-width=\"0\"/><text x=\"40.0\" y=\"275.0\" font-size=\"12.5\" fill=\"#AE8A3E\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\">ALLTRUE · 签名全为 1，按源码注释可省略 sign</text><rect x=\"30.0\" y=\"284.0\" width=\"90.0\" height=\"70.0\" rx=\"0\" fill=\"#CFE0DC\" stroke=\"#FFFFFF\" stroke-width=\"1.4\"/><text x=\"75.0\" y=\"323.0\" font-size=\"14\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\">(len)</text><rect x=\"120.0\" y=\"284.0\" width=\"110.0\" height=\"70.0\" rx=\"0\" fill=\"#A4C4C6\" stroke=\"#FFFFFF\" stroke-width=\"1.4\"/><text x=\"175.0\" y=\"323.0\" font-size=\"14\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\">(flag)</text><rect x=\"230.0\" y=\"284.0\" width=\"460.0\" height=\"70.0\" rx=\"0\" fill=\"#2E6373\" stroke=\"#FFFFFF\" stroke-width=\"1.4\"/><text x=\"460.0\" y=\"323.0\" font-size=\"14\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\">(left_ltree)</text><rect x=\"690.0\" y=\"284.0\" width=\"610.0\" height=\"70.0\" rx=\"0\" fill=\"#1E4B5A\" stroke=\"#FFFFFF\" stroke-width=\"1.4\"/><text x=\"995.0\" y=\"323.0\" font-size=\"14\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\">(right_ltree)</text><rect x=\"30.0\" y=\"374.0\" width=\"1340.0\" height=\"44.0\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><text x=\"48.0\" y=\"402.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">hashing() 对每个 label 做 ltree_crc32_sz()，再对 siglen × 8 取模置位；默认 siglen = 8 字节，最大到 2024 字节。</text></svg>"}, {"eyebrow": "GiST 摘要 · 位图签名", "title": "签名位图：排除不可能，不证明命中", "lede": "sign 是一张粗粒度的位图。它说「不在这里」时可信；它说「可能在这里」时只是放行。", "caption": "图 12　输入 label 后播放，看 CRC 取模置位；再检查查询 label 的 bit，观察剪枝与误下探的区别。", "bridge": "所以从根往下走时，内部页可以保守，叶子页必须精确。", "ctrl": "<label>已存 label</label><input id=\"sigLabel\" type=\"text\" value=\"Astronomy\" size=\"16\"><label>查询 label</label><input id=\"sigQuery\" type=\"text\" value=\"Cosmology\" size=\"16\"><button class=\"btn\" id=\"sigPlay\">▶ 播放</button><button class=\"btn\" id=\"sigStep\">单步 →</button><button class=\"btn\" id=\"sigReset\">↺ 重置</button><button class=\"btn\" id=\"sigCollide\">碰撞示例</button><span class=\"out\" id=\"sigOut\"></span>", "disclaim": "教学示意：本页 hash 为确定性模拟，不是 ltree_crc32_sz 的真实取值；结论只讲机制，不支撑性能数字。", "notes": "签名是整个 GiST 设计里最容易被误解的一环。我们做一次交互演示。左边是一张六十四位的位图，代表某个内部页覆盖的整棵子树。你输入一个已存 label，比如 Astronomy，播放之后会看到它先算 CRC，再对 siglen 乘八取模，得到一个 bit 位置并置位。然后输入查询 label，比如 Cosmology，看它的 bit 在不在签名里。如果不在，这棵子树不可能有命中，可以安全剪枝；如果在，只能说可能命中，必须往下走。为什么？因为两个不同的 label 可能哈希到同一个 bit，复杂模式也可能无法充分利用签名。你可以按「碰撞示例」按钮，我会自动找一个不同 label 但同一 bit 的例子。注意，多下探只是多做工作，不会让结果出错；反过来如果把该下探的剪掉了，那才是灾难。", "svg": "<svg class=\"figure\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" role=\"img\" aria-label=\"ltree GiST 位图签名与误下探动画\"><text x=\"64.0\" y=\"42.0\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">sign · siglen = 8 B = 64 bit（教学示意）</text><rect id=\"sigBit0\" x=\"64\" y=\"58\" width=\"24\" height=\"24\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect id=\"sigBit1\" x=\"92\" y=\"58\" width=\"24\" height=\"24\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect id=\"sigBit2\" x=\"120\" y=\"58\" width=\"24\" height=\"24\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect id=\"sigBit3\" x=\"148\" y=\"58\" width=\"24\" height=\"24\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect id=\"sigBit4\" x=\"176\" y=\"58\" width=\"24\" height=\"24\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect id=\"sigBit5\" x=\"204\" y=\"58\" width=\"24\" height=\"24\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect id=\"sigBit6\" \"1.4\"/><polygon points=\"523,263 537,263 530,270\" fill=\"#7BA6AF\"/><rect x=\"340.0\" y=\"270.0\" width=\"380.0\" height=\"56.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><rect x=\"340.0\" y=\"270.0\" width=\"4.0\" height=\"56.0\" rx=\"0\" fill=\"#BE653B\" stroke=\"none\" stroke-width=\"0\"/><text x=\"358.0\" y=\"293.0\" font-size=\"14\" fill=\"#BE653B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\">④ 查询检查</text><text x=\"358.0\" y=\"315.0\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\">GETBIT(sign, query_bit)</text><rect x=\"760.0\" y=\"60.0\" width=\"620.0\" height=\"258.0\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><text x=\"782.0\" y=\"92.0\" font-size=\"18\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"serif\">查询侧判定</text><text id=\"sigQTitle\" x=\"782\" y=\"134\" font-size=\"16\" fill=\"#46585F\" font-weight=\"700\">等待播放</text><text id=\"sigQText\" x=\"782\" y=\"178\" font-size=\"15\" fill=\"#46585F\">输入已存 label 与查询 label，然后按 ▶ 播放</text><line x1=\"782.0\" y1=\"202.0\" x2=\"1358.0\" y2=\"202.0\" stroke=\"#D9D5CB\" stroke-width=\"1.4\"/><text id=\"sigQDetail\" x=\"782\" y=\"238\" font-size=\"13.5\" fill=\"#46585F\">bit = 0 → 子树不可能命中，可安全剪枝</text><text x=\"782.0\" y=\"272.0\" font-size=\"13.5\" fill=\"#BE653B\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">bit = 1 → 可能命中，必须下探；可能是碰撞，也可能是真命中</text><text x=\"782.0\" y=\"300.0\" font-size=\"14\" fill=\"#2F7A66\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\">签名只排除不可能，不证明一定命中。</text><rect x=\"64.0\" y=\"334.0\" width=\"1316.0\" height=\"62.0\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.1\"/><text x=\"82.0\" y=\"360.0\" font-size=\"15\" fill=\"#BE653B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\">关键点：内部页允许误下探，但不能漏掉可能命中的子树。</text><text x=\"82.0\" y=\"383.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">因此签名 bit 命中之后仍要走到叶子做精确判断；下探多不等于结果错。</text></svg>"}, {"eyebrow": "查询路径 · 先粗后细", "title": "内部页可以误下探，叶子页必须精确", "lede": "ltree_consistent() 按 strategy number 分派；内部页做便宜的过滤，叶子页调用真实算子。", "caption": "图 13　内部页依次经过 gist_qe 的签名检查和 gist_between 的边界检查；叶子页精确判断，recheck = false。", "bridge": "支撑这条路径的，是七个各司其职的 GiST support function。", "notes": "把查询路径连起来看。索引扫描从根开始，遇到内部页，ltree_consistent 会做两道便宜的过滤。第一道叫 gist_qe，对那些能安全使用签名的简单项，检查签名 bit 在不在。第二道叫 gist_between，当 lquery 的 firstgood 大于零时，用前面几层简单匹配和左右边界比较，进一步剪枝。两道都过了才往下探。到了叶子页，情况完全不同：直接调用真实算子函数，比如 lquery 的 ltq_regex、ltxtquery 的 ltxtq_exec、祖先判断的 inner_isparent。源码明确把 recheck 设为 false，因为叶子保存的是完整 ltree，返回给执行器的结果已经精确。这里要记住一句话：签名的职责是排除不可能，不是证明命中；内部页误下探只是多做工作，绝不会让结果错。", "svg": "<svg class=\"figure\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" role=\"img\" aria-label=\"ltree GiST 查询下探路径\"><rect x=\"30.0\" y=\"16.0\" width=\"3.0\" height=\"15.0\" rx=\"0\" fill=\"#BE653B\" stroke=\"none\" stroke-width=\"0\"/><text x=\"40.0\" y=\"29.0\" font-size=\"12.5\" fill=\"#BE653B\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\">内部页：两道剪枝，允许保守</text><rect x=\"30.0\" y=\"42.0\" width=\"790.0\" height=\"54.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><rect x=\"30.0\" y=\"42.0\" width=\"4.0\" height=\"54.0\" rx=\"0\" fill=\"#47808D\" stroke=\"none\" stroke-width=\"0\"/><text x=\"50.0\" y=\"65.0\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\">入口：索引 entry</text><text x=\"50.0\" y=\"86.0\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">内部 key = sign + left_ltree + right_ltree</text><line x1=\"425.0\" y1=\"96.0\" x2=\"425.0\" y2=\"110.0\" stroke=\"#7BA6AF\" stroke-width=\"1.4\"/><polygon points=\"418,103 432,103 425,110\" fill=\"#7BA6AF\"/><rect x=\"30.0\" y=\"110.0\" width=\"790.0\" height=\"54.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><rect x=\"30.0\" y=\"110.0\" width=\"4.0\" height=\"54.0\" rx=\"0\" fill=\"#47808D\" stroke=\"none\" stroke-width=\"0\"/><text x=\"50.0\" y=\"133.0\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\">① gist_qe()</text><text x=\"50.0\" y=\"154.0\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">对能安全查签名的简单项，检查 sign 的 bit</text><line x1=\"425.0\" y1=\"164.0\" x2=\"425.0\" y2=\"178.0\" stroke=\"#7BA6AF\" stroke-width=\"1.4\"/><polygon points=\"418,171 432,171 425,178\" fill=\"#7BA6AF\"/><rect x=\"30.0\" y=\"178.0\" width=\"790.0\" height=\"54.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><rect x=\"30.0\" y=\"178.0\" width=\"4.0\" height=\"54.0\" rx=\"0\" fill=\"#47808D\" stroke=\"none\" stroke-width=\"0\"/><text x=\"50.0\" y=\"201.0\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\">② gist_between()</text><text x=\"50.0\" y=\"222.0\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">firstgood &gt; 0 时，用前导简单 level 与左右边界比较</text><line x1=\"425.0\" y1=\"232.0\" x2=\"425.0\" y2=\"246.0\" stroke=\"#7BA6AF\" stroke-width=\"1.4\"/><polygon points=\"418,239 432,239 425,246\" fill=\"#7BA6AF\"/><rect x=\"30.0\" y=\"246.0\" width=\"790.0\" height=\"54.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><rect x=\"30.0\" y=\"246.0\" width=\"4.0\" height=\"54.0\" rx=\"0\" fill=\"#BE653B\" stroke=\"none\" stroke-width=\"0\"/><text x=\"50.0\" y=\"269.0\" font-size=\"14.5\" fill=\"#BE653B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\">下探子树</text><text x=\"50.0\" y=\"290.0\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">两道过滤都通过才继续往下走</text><rect x=\"860.0\" y=\"16.0\" width=\"3.0\" height=\"15.0\" rx=\"0\" fill=\"#2F7A66\" stroke=\"none\" stroke-width=\"0\"/><text x=\"870.0\" y=\"29.0\" font-size=\"12.5\" fill=\"#2F7A66\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\">叶子页：调用真实算子，精确返回</text><rect x=\"860.0\" y=\"42.0\" width=\"510.0\" height=\"120.0\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\"/><text x=\"882.0\" y=\"70.0\" font-size=\"15\" fill=\"#2F7A66\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\">ltree_consistent() 到叶子</text><text x=\"882.0\" y=\"96.0\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">ltq_regex() · ltxtq_exec() · inner_isparent()</text><text x=\"882.0\" y=\"120.0\" font-size=\"13.5\" fill=\"#2F7A66\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\">*recheck = false：结果已经精确</text><rect x=\"860.0\" y=\"180.0\" width=\"510.0\" height=\"120.0\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><text x=\"882.0\" y=\"208.0\" font-size=\"15\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\">策略号分派</text><text x=\"882.0\" y=\"234.0\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">&lt; &lt;= = &gt;= &gt;  ·  @&gt; &lt;@  ·  ~  ·  @  ·  ?</text><text x=\"882.0\" y=\"258.0\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">? 表示多个 lquery 中任一匹配</text><rect x=\"860.0\" y=\"318.0\" width=\"510.0\" height=\"88.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><text x=\"882.0\" y=\"344.0\" font-size=\"15\" fill=\"#BE653B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\">误下探 ≠ 结果错</text><text x=\"882.0\" y=\"370.0\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">签名命中只是「放行」，精确性由叶子保证。</text><rect x=\"30.0\" y=\"324.0\" width=\"790.0\" height=\"82.0\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\"/><text x=\"50.0\" y=\"352.0\" font-size=\"15\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\">查询从根到叶：内部页做便宜的排除，叶子做昂贵的精确判断。</text><text x=\"50.0\" y=\"380.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">这正是签名索引「先粗后细」的通用套路。</text></svg>"}, {"eyebrow": "GiST support functions · 七个函数", "title": "正确性与效率，由不同函数承担", "lede": "七个 support function 注册在 gist_ltree_ops 上，职责分得很清楚。", "caption": "图 14　判断类只有 consistent；构造类负责叶子压缩、解 TOAST 与摘要合并；组织类负责代价、分裂和相等判断。", "bridge": "同一个框架换到 ltree[]，只改叶子的压缩方式，结论就跟着变。", "notes": "扩展脚本为 gist_ltree_ops 注册了七个 GiST support function。我把它按职责分成三组。判断类只有 consistent，它决定某个索引项和查询是否可能匹配，这是正确性的入口。构造类有三个：compress 把叶子的 ltree 转成 ltree_gist，decompress 负责 detoast，union 把多个 entry 合并成子树摘要。组织类有三个：penalty 估算插入时边界扩张的代价，picksplit 在页分裂时按排序边界分组，same 判断两个 key 是否相同。有个细节值得注意：ltree_union 对叶子会把每个 label 哈希进签名并更新边界，对内部摘要就按位 OR；OR 完如果全为真就标记 ALLTRUE。而 ltree_penalty 只看左右边界扩张，不算签名差异；picksplit 是按左边界排序后切成两半。所以说它更像有 B-tree 顺序边界的签名树。", "svg": "<svg class=\"figure\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" role=\"img\" aria-label=\"ltree GiST 七个 support functions 分组\"><rect x=\"20.0\" y=\"20.0\" width=\"445.0\" height=\"340.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><rect x=\"21.0\" y=\"21.0\" width=\"443.0\" height=\"44.0\" rx=\"0\" fill=\"#BE653B\" stroke=\"none\" stroke-width=\"0\"/><text x=\"36.0\" y=\"50.0\" font-size=\"16\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\">判断 · 决定能不能剪</text><rect x=\"36.0\" y=\"82.0\" width=\"413.0\" height=\"70.0\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><text x=\"50.0\" y=\"110.0\" font-size=\"15.5\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\">consistent</text><text x=\"50.0\" y=\"134.0\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">判断 index entry 与查询是否可能匹配</text><rect x=\"485.0\" y=\"20.0\" width=\"445.0\" height=\"340.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><rect x=\"486.0\" y=\"21.0\" width=\"443.0\" height=\"44.0\" rx=\"0\" fill=\"#245A6B\" stroke=\"none\" stroke-width=\"0\"/><text x=\"501.0\" y=\"50.0\" font-size=\"16\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\">构造 · 摘要怎么生成</text><rect x=\"501.0\" y=\"82.0\" width=\"413.0\" height=\"70.0\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><text x=\"515.0\" y=\"110.0\" font-size=\"15.5\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\">compress</text><text x=\"515.0\" y=\"134.0\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">叶子 ltree 转成 ltree_gist</text><rect x=\"501.0\" y=\"164.0\" width=\"413.0\" height=\"70.0\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><text x=\"515.0\" y=\"192.0\" font-size=\"15.5\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\">decompress</text><text x=\"515.0\" y=\"216.0\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">detoast GiST key</text><rect x=\"501.0\" y=\"246.0\" width=\"413.0\" height=\"70.0\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><text x=\"515.0\" y=\"274.0\" font-size=\"15.5\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\">union</text><text x=\"515.0\" y=\"298.0\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">合并多个 entry，生成子树摘要</text><rect x=\"950.0\" y=\"20.0\" width=\"445.0\" height=\"340.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><rect x=\"951.0\" y=\"21.0\" width=\"443.0\" height=\"44.0\" rx=\"0\" fill=\"#2F7A66\" stroke=\"none\" stroke-width=\"0\"/><text x=\"966.0\" y=\"50.0\" font-size=\"16\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\">组织 · 树怎么长好</text><rect x=\"966.0\" y=\"82.0\" width=\"413.0\" height=\"70.0\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><text x=\"980.0\" y=\"110.0\" font-size=\"15.5\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\">penalty</text><text x=\"980.0\" y=\"134.0\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">插入时估算边界扩张代价</text><rect x=\"966.0\" y=\"164.0\" width=\"413.0\" height=\"70.0\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><text x=\"980.0\" y=\"192.0\" font-size=\"15.5\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\">picksplit</text><text x=\"980.0\" y=\"216.0\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">页分裂时按排序边界分组</text><rect x=\"966.0\" y=\"246.0\" width=\"413.0\" height=\"70.0\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><text x=\"980.0\" y=\"274.0\" font-size=\"15.5\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\">same</text><text x=\"980.0\" y=\"298.0\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">判断两个 GiST key 是否相同</text><rect x=\"20.0\" y=\"378.0\" width=\"1360.0\" height=\"40.0\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\"/><text x=\"40.0\" y=\"404.0\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">正确性和效率由不同函数承担：consistent 决定「能不能省」，union / penalty / picksplit 决定「省多少」。</text></svg>"}, {"eyebrow": "单值 vs 数组 · recheck 的分水岭", "title": "只改叶子压缩方式，结论就变了", "lede": "gist__ltree_ops 复用同一个 storage type，却走了一条完全不同的叶子路径。", "caption": "图 15　单值 ltree 的 GiST 叶子保存完整值，recheck = false；ltree[] 叶子只有签名，recheck = true。", "bridge": "读路径的快感不是免费的，代价最终落在写入。", "notes": "同一个 GiST 框架，还有一个数组版本 gist__ltree_ops。它复用 ltree_gist 这个 storage type，但叶子的 compress 完全不同：_ltree_compress 对数组里每个 ltree 的每个 label 置签名位，叶子 key 并不保存完整数组内容。于是 _ltree_consistent 一开始就设置 recheck 等于 true。这就是和单值版本最关键的分水岭：gist_ltree_ops 叶子有完整路径，返回精确；gist__ltree_ops 叶子只有签名，会误判，必须回表复查。另外两个细节也说明了不同的设计取向：数组版本的 penalty 用汉明距离，picksplit 选距离最大的两个 seed 再按签名距离分配；单值版本只看左右边界扩张，按左边界排序切两半。默认签名长度也不同，单值八字节，数组二十八字节，因为一个数组包含多条路径，bit 更容易被填满。", "svg": "<svg class=\"figure\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" role=\"img\" aria-label=\"gist_ltree_ops 与 gist__ltree_ops 对比\"><rect x=\"30.0\" y=\"20.0\" width=\"170.0\" height=\"50.0\" rx=\"0\" fill=\"#1E4B5A\" stroke=\"#FFFFFF\" stroke-width=\"1.2\"/><rect x=\"200.0\" y=\"20.0\" width=\"570.0\" height=\"50.0\" rx=\"0\" fill=\"#2E6373\" stroke=\"#FFFFFF\" stroke-width=\"1.2\"/><rect x=\"770.0\" y=\"20.0\" width=\"600.0\" height=\"50.0\" rx=\"0\" fill=\"#74A5AD\" stroke=\"#FFFFFF\" stroke-width=\"1.2\"/><text x=\"45.0\" y=\"52.0\" font-size=\"15\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\">对比维度</text><text x=\"215.0\" y=\"52.0\" font-size=\"15\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\">gist_ltree_ops · 单值 ltree</text><text x=\"785.0\" y=\"52.0\" font-size=\"15\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\">gist__ltree_ops · ltree[]</text><rect x=\"30.0\" y=\"70.0\" width=\"170.0\" height=\"50.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><rect x=\"200.0\" y=\"70.0\" width=\"570.0\" height=\"50.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><rect x=\"770.0\" y=\"70.0\" width=\"600.0\" height=\"50.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><text x=\"45.0\" y=\"102.0\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\">叶子 key</text><text x=\"215.0\" y=\"102.0\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">保存完整 ltree，可精确判断</text><text x=\"785.0\" y=\"102.0\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">只存数组 label 的签名，不保存完整数组</text><rect x=\"30.0\" y=\"124.0\" width=\"170.0\" height=\"50.0\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><rect x=\"200.0\" y=\"124.0\" width=\"570.0\" height=\"50.0\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><rect x=\"770.0\" y=\"124.0\" width=\"600.0\" height=\"50.0\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><text x=\"45.0\" y=\"156.0\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\">union</text><text x=\"215.0\" y=\"156.0\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">叶子哈希各 label 并更新边界；内部按位 OR</text><text x=\"785.0\" y=\"156.0\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">同样签名 OR；边界语义按数组实现</text><rect x=\"30.0\" y=\"178.0\" width=\"170.0\" height=\"50.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><rect x=\"200.0\" y=\"178.0\" width=\"570.0\" height=\"50.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><rect x=\"770.0\" y=\"178.0\" width=\"600.0\" height=\"50.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><text x=\"45.0\" y=\"210.0\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\">penalty</text><text x=\"215.0\" y=\"210.0\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">只看左右边界扩张</text><text x=\"785.0\" y=\"210.0\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">用 Hamming distance</text><rect x=\"30.0\" y=\"232.0\" width=\"170. y=\"307.0\" width=\"254.0\" height=\"32.0\" rx=\"0\" fill=\"#CFE0DC\" stroke=\"none\" stroke-width=\"0\"/><text x=\"1132.0\" y=\"329.0\" font-size=\"12\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\">05</text><text x=\"1132.0\" y=\"372.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">拆分到变更窗口 / 分批</text></svg>"}, {"eyebrow": "实操 · 查询意图到算子", "title": "四条查询意图，各自对应一把钥匙", "lede": "SQL 不必花哨：先把业务问题翻译成算子，再让对应的索引接住它。", "caption": "图 18　后代查询用 <@，路径模式用 ~，词逻辑用 @；最后用 EXPLAIN 验证计划，而不是凭感觉调 siglen。", "bridge": "最后把适用边界和三类角色的动作收束成判断。", "notes": "看几条实操。第一条，查 Top 点 Science 下所有后代，包括自身，用小于包含，也就是 <@，排序可以按 path。第二条，查路径里出现 Astronomy 且后面还有至少一层，写星号点 Astronomy 点星号，这是 lquery 的位置敏感模式，走 GiST。第三条，位置无关的词逻辑：包含 Astro 前缀、排除 pictures、忽略大小写，用 ltxtquery 的艾特算子。第四条，不要只写 EXPLAIN 看一眼计划，要用 ANALYZE 加 BUFFERS，看缓冲区访问。想验证签名长度，就建 siglen 等于八和一百的两个索引，在同一份数据和同一批查询上比较。但别直接假设一百更快：它通常更精确，索引也更大，小表热缓存下额外空间未必值得。本文没有启动数据库实例，所以这些是语法示例，不提供伪造的执行结果。", "svg": "<svg class=\"figure\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" role=\"img\" aria-label=\"ltree 实操查询意图与算子对应\"><rect x=\"20.0\" y=\"20.0\" width=\"670.0\" height=\"158.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><rect x=\"21.0\" y=\"21.0\" width=\"668.0\" height=\"36.0\" rx=\"0\" fill=\"#245A6B\" stroke=\"none\" stroke-width=\"0\"/><text x=\"36.0\" y=\"46.0\" font-size=\"15.5\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\">查某节点所有后代</text><text x=\"38.0\" y=\"96.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\">WHERE path &lt;@ 'Top.Science'::ltree</text><rect x=\"36.0\" y=\"114.0\" width=\"638.0\" height=\"1.0\" rx=\"0\" fill=\"#D9D5CB\" stroke=\"none\" stroke-width=\"0\"/><text x=\"38.0\" y=\"144.0\" font-size=\"13\" fill=\"#245A6B\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\">&lt;@  /  GiST 或 B-tree</text><rect x=\"710.0\" y=\"20.0\" width=\"670.0\" height=\"158.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><rect x=\"711.0\" y=\"21.0\" width=\"668.0\" height=\"36.0\" rx=\"0\" fill=\"#245A6B\" stroke=\"none\" stroke-width=\"0\"/><text x=\"726.0\" y=\"46.0\" font-size=\"15.5\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\">查位置敏感的路径模式</text><text x=\"728.0\" y=\"96.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\">WHERE path ~ '*.Astronomy.*'::lquery</text><rect x=\"726.0\" y=\"114.0\" width=\"638.0\" height=\"1.0\" rx=\"0\" fill=\"#D9D5CB\" stroke=\"none\" stroke-width=\"0\"/><text x=\"728.0\" y=\"144.0\" font-size=\"13\" fill=\"#245A6B\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\">~  /  GiST gist_ltree_ops</text><rect x=\"20.0\" y=\"190.0\" width=\"670.0\" height=\"158.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><rect x=\"21.0\" y=\"191.0\" width=\"668.0\" height=\"36.0\" rx=\"0\" fill=\"#2F7A66\" stroke=\"none\" stroke-width=\"0\"/><text x=\"36.0\" y=\"216.0\" font-size=\"15.5\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\">查位置无关的词逻辑</text><text x=\"38.0\" y=\"266.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\">WHERE path @ 'Astro*% &amp; !pictures@'::ltxtquery</text><rect x=\"36.0\" y=\"284.0\" width=\"638.0\" height=\"1.0\" rx=\"0\" fill=\"#D9D5CB\" stroke=\"none\" stroke-width=\"0\"/><text x=\"38.0\" y=\"314.0\" font-size=\"13\" fill=\"#2F7A66\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\">@  /  GiST gist_ltree_ops</text><rect x=\"710.0\" y=\"190.0\" width=\"670.0\" height=\"158.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><rect x=\"711.0\" y=\"191.0\" width=\"668.0\" height=\"36.0\" rx=\"0\" fill=\"#AE8A3E\" stroke=\"none\" stroke-width=\"0\"/><text x=\"726.0\" y=\"216.0\" font-size=\"15.5\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\">核对计划与缓冲区</text><text x=\"728.0\" y=\"266.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" class=\"mono\">EXPLAIN (ANALYZE, BUFFERS) SELECT ...</text><rect x=\"726.0\" y=\"284.0\" width=\"638.0\" height=\"1.0\" rx=\"0\" fill=\"#D9D5CB\" stroke=\"none\" stroke-width=\"0\"/><text x=\"728.0\" y=\"314.0\" font-size=\"13\" fill=\"#AE8A3E\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\">看是否走 GiST、回表页数与索引大小</text><rect x=\"20.0\" y=\"370.0\" width=\"1360.0\" height=\"48.0\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><text x=\"40.0\" y=\"400.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">验证 siglen：建 siglen=8 与 siglen=100 两个索引，用同一份数据、同一批查询比较计划与缓冲区访问。</text></svg>"}, {"eyebrow": "边界 · 适合与不适合", "title": "先判断是不是树，再决定用不用 ltree", "lede": "适用范围不是靠性能数字划出来的，而是靠问题的形状划出来的。", "caption": "图 19　稳定路径 + 读多写少 + 子树查询，是 ltree 的舒适区；图结构、频繁大移动、长文本分词不是。", "bridge": "边界清楚了，最后看三类角色各自该做什么。", "notes": "什么时候用，什么时候不用？我的建议是先问一个问题：这是不是一棵树？如果答案是肯定的，再看三条：路径 code 稳不稳定，是不是读多写少，查询是不是经常落到子树或路径模式上。商品类目、权限菜单、功能目录、知识库目录都很合适；路径还能和普通关系列一起过滤、排序、分页，这是把层级放进关系库的实际好处。反过来，如果组织架构建模频繁大幅调整，或者一个节点有多个父节点，存在跨层引用、环、边属性，或者你要问最短路径、连通性，那就不是 ltree 的主场。label 如果是很长的自然语言还要分词搜索，应该考虑全文检索或者专门的搜索引擎。把一个工具用在对形状的问题上，比调任何参数都重要。", "svg": "<svg class=\"figure\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" role=\"img\" aria-label=\"ltree 适合与不适合场景\"><rect x=\"20.0\" y=\"20.0\" width=\"670.0\" height=\"300.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><rect x=\"21.0\" y=\"21.0\" width=\"668.0\" height=\"44.0\" rx=\"0\" fill=\"#2F7A66\" stroke=\"none\" stroke-width=\"0\"/><text x=\"36.0\" y=\"50.0\" font-size=\"18\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\">适合</text><rect x=\"38.0\" y=\"82.0\" width=\"5.0\" height=\"5.0\" rx=\"0\" fill=\"#2F7A66\" stroke=\"none\" stroke-width=\"0\"/><text x=\"52.0\" y=\"87.0\" font-size=\"15\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\">天然树结构</text><text x=\"52.0\" y=\"112.0\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">商品类目、权限菜单、功能目录、知识库目录</text><rect x=\"38.0\" y=\"139.0\" width=\"5.0\" height=\"5.0\" rx=\"0\" fill=\"#2F7A66\" stroke=\"none\" stroke-width=\"0\"/><text x=\"52.0\" y=\"144.0\" font-size=\"15\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\">读多写少</text><text x=\"52.0\" y=\"169.0\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">常查某节点下整棵子树或路径模式</text><rect x=\"38.0\" y=\"196.0\" width=\"5.0\" height=\"5.0\" rx=\"0\" fill=\"#2F7A66\" stroke=\"none\" stroke-width=\"0\"/><text x=\"52.0\" y=\"201.0\" font-size=\"15\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\">路径 code 稳定</text><text x=\"52.0\" y=\"226.0\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">改名不需要改路径</text><rect x=\"38.0\" y=\"253.0\" width=\"5.0\" height=\"5.0\" rx=\"0\" fill=\"#2F7A66\" stroke=\"none\" stroke-width=\"0\"/><text x=\"52.0\" y=\"258.0\" font-size=\"15\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\">混合过滤</text><text x=\"52.0\" y=\"283.0\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\">层级路径与普通关系列一起过滤、排序、分页</text><rect x=\"710.0\" y=\"20.0\" width=\"670.0\" height=\"300.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><rect x=\"711.0\" y=\"21.0\" width=\"668.0\" height=\"44.0\" rx=\"0\" fill=\"#BE653B\" stroke=\"none\" stroke-width=\"0\"/><text x=\"726.0\" y=\"50.0\" font-size=\"18\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"start\" lette /* ================= 16:9 等比缩放 + letterbox；讲稿开窗时左侧矢量缩放 ================= */
function fit(){
  const vp = $('#viewport');
  const W = vp.clientWidth, H = vp.clientHeight;
  const docked = document.body.classList.contains('docked');
  const dw = docked ? $('#dock').getBoundingClientRect().width : 0;
  const avail = Math.max(320, W - dw);
  const s = Math.min(avail/1600, H/900);
  const st = $('#stage');
  st.style.transform = 'scale(' + s + ')';
  st.style.left = ((avail - 1600*s)/2) + 'px';
  st.style.top  = ((H -  900*s)/2) + 'px';
}
window.addEventListener('resize', fit);
