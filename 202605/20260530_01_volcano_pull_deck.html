<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数据库筑基课 · 传统单行 Pull 模型 (Volcano)｜演说稿</title>
<!-- 单文件交付：所有示意图均为现场绘制的内联 SVG，零外部图片 / 字体 / 脚本依赖。 -->
<style>
:root{
  --bg:#F7F6F2; --sub:#F1EFE9; --ink:#1B2B33; --ink2:#46585F; --muted:#89938F; --line:#D9D5CB;
  --primary:#245A6B; --prim-l:#E5EFF0; --prim-m:#7BA6AF; --accent:#BE653B; --acc-l:#F7E9DE;
  --green:#2F7A66; --green-l:#E4F0EA; --gold:#AE8A3E; --gold-l:#F5EDDC; --white:#FFFFFF;
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#E9E7E1}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
#viewport{position:absolute;inset:0 0 58px 0;overflow:hidden}
#stage{position:absolute;width:1600px;height:900px;background:var(--bg);
  transform-origin:top left;box-shadow:0 18px 60px rgba(27,43,51,.13);
  transition:transform .42s cubic-bezier(.2,.7,.2,1),left .42s cubic-bezier(.2,.7,.2,1),top .42s cubic-bezier(.2,.7,.2,1)}
.slide{position:absolute;inset:0;display:none}
.slide.on{display:block;animation:fadein .42s cubic-bezier(.2,.7,.2,1)}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{position:absolute;left:64px;top:44px;font-size:13px;letter-spacing:3.4px;
  color:var(--primary);font-weight:600}
.eyebrow .num{font-family:var(--mono);letter-spacing:1px;color:var(--accent);margin-right:14px}
h1.title{position:absolute;left:64px;top:70px;width:1472px;margin:0;font-family:var(--serif);
  font-size:44px;line-height:1.25;font-weight:700;letter-spacing:1.2px;color:var(--ink)}
.lede{position:absolute;left:64px;top:139px;width:1472px;height:40px;overflow:hidden;
  font-size:19px;color:var(--ink2);line-height:1.5;letter-spacing:.3px}
.rule{position:absolute;left:64px;top:181px;width:1472px;height:1px;background:var(--line)}
.figwrap{position:absolute;left:100px;top:198px;width:1400px;height:430px;overflow:hidden}
svg.figure{display:block;overflow:hidden}
svg.figure text{font-family:var(--sans)}
svg.figure text.serif{font-family:var(--serif)}
svg.figure text.mono{font-family:var(--mono)}
.caption{position:absolute;left:100px;top:638px;width:1400px;font-size:13px;
  color:var(--muted);letter-spacing:.4px;line-height:1.5;height:22px;overflow:hidden}
.caption.caplow{top:702px;color:var(--ink2);height:20px}
.disclaim{position:absolute;left:100px;top:680px;width:1400px;font-size:12px;
  color:var(--accent);letter-spacing:.3px;height:18px}
.bridge{position:absolute;left:64px;top:706px;width:1472px;font-size:20px;
  color:var(--accent);line-height:1.55;letter-spacing:.4px;padding-left:18px;
  border-left:3px solid var(--accent);font-family:var(--serif)}
.slide.anim .bridge{top:730px}
.bridge .bk{font-family:var(--sans);font-size:13px;color:var(--muted);
  letter-spacing:2px;display:block;margin-bottom:2px}
.footer{position:absolute;left:64px;top:846px;width:1472px;height:1px;background:var(--line)}
.footer .fl{position:absolute;left:0;top:14px;font-size:12.5px;color:var(--muted);letter-spacing:2px}
.footer .fr{position:absolute;right:0;top:12px;font-family:var(--mono);font-size:14px;color:var(--ink2)}
.footer .fbar{position:absolute;left:0;right:0;top:-1px;height:2px;background:transparent}
.footer .fbar i{display:block;height:2px;background:var(--primary);width:0;transition:width .4s ease}
.ctrls{position:absolute;left:100px;top:632px;width:1400px;height:44px;display:flex;
  align-items:center;gap:9px}
.ctrls label{font-size:13.5px;color:var(--ink2);white-space:nowrap}
.ctrls input[type=text],.ctrls select{font-family:var(--mono);font-size:13px;color:var(--ink);
  background:#fff;border:1px solid var(--line);border-radius:4px;padding:5px 8px;outline:none}
.ctrls input[type=text]{width:74px}
.ctrls select{font-family:var(--sans);width:260px}
.ctrls input[type=text]:focus,.ctrls select:focus{border-color:var(--primary)}
.ctrls .btn{min-height:30px;padding:5px 12px;border:1px solid var(--primary);border-radius:4px;
  background:#fff;color:var(--primary);font-size:13.5px;cursor:pointer;font-family:var(--sans);white-space:nowrap}
.ctrls .btn.play{background:var(--primary);color:#fff}
.ctrls .btn:hover{filter:brightness(.94)}
.ctrls .out{font-size:13px;color:var(--ink2);margin-left:auto;min-width:0;flex:1;
  max-width:420px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrls .out b{color:var(--accent);font-weight:600}
.chrome{position:fixed;left:0;right:0;bottom:0;height:58px;background:#FCFBF8;
  border-top:1px solid var(--line);display:flex;align-items:center;gap:6px;
  padding:0 16px;z-index:40;font-size:13px;color:var(--ink2)}
.chrome .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.chrome button{font-family:var(--sans);font-size:12.6px;color:var(--ink2);background:transparent;
  border:1px solid transparent;border-radius:5px;padding:7px 9px;cursor:pointer;white-space:nowrap}
.chrome button:hover{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome button.act{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome button.k{font-family:var(--mono);font-size:12px;color:var(--muted)}
.chrome .pg{font-family:var(--mono);font-size:14px;color:var(--ink);min-width:76px;text-align:center}
.chrome .track{flex:1;min-width:30px;height:3px;background:var(--line);border-radius:3px;margin:0 10px;position:relative}
.chrome .track i{position:absolute;left:0;top:0;height:3px;background:var(--primary);border-radius:3px;transition:width .35s}
.chrome .keyhint{font-size:11.6px;color:var(--muted);white-space:nowrap;letter-spacing:.2px}
.chrome .keyhint b{font-family:var(--mono);color:var(--primary);font-weight:600}
body.immersive #viewport{inset:0 0 58px 0}
body.immersive .chrome{background:#FFFFFF}
#dock{position:fixed;right:0;top:0;bottom:58px;width:min(560px,40vw);background:#FCFBF8;
  border-left:1px solid var(--line);box-shadow:-14px 0 40px rgba(27,43,51,.08);z-index:50;
  transform:translateX(101%);transition:transform .42s cubic-bezier(.2,.7,.2,1);
  display:flex;flex-direction:column}
body.docked #dock{transform:none}
#dock .dh{flex:none;height:64px;border-bottom:1px solid var(--line);display:flex;
  align-items:center;padding:0 26px;gap:12px}
#dock .dh .dt{font-family:var(--serif);font-size:21px;font-weight:700;color:var(--ink);flex:1}
#dock .dh .ds{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:1px}
#dock .dh button{font-family:var(--sans);font-size:12.5px;color:var(--ink2);background:#fff;
  border:1px solid var(--line);border-radius:5px;padding:6px 11px;cursor:pointer}
#dock .dh button:hover{background:var(--prim-l);color:var(--primary)}
#dock .db{flex:1;overflow:auto;padding:22px 30px 44px}
#dock .db::-webkit-scrollbar{width:8px}
#dock .db::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
#dock .lead{font-size:14px;line-height:1.9;color:var(--ink2);letter-spacing:.3px;margin:0 0 18px}
#dock .nt{font-family:var(--serif);font-size:17px;color:var(--primary);margin:22px 0 8px;font-weight:700}
#dock .np{font-size:15px;line-height:2.0;color:var(--ink2);letter-spacing:.3px;margin:0 0 16px}
#dock .nb{font-family:var(--serif);font-size:14.5px;line-height:1.85;color:var(--accent);
  border-left:3px solid var(--accent);padding-left:14px;margin:14px 0 0}
#dock .tag{display:inline-block;font-family:var(--mono);font-size:11.5px;color:var(--muted);
  letter-spacing:1px;margin-bottom:6px}
#dock .sec{border-top:1px solid var(--line);padding:18px 0 6px;scroll-margin-top:20px}
#dock .sec:first-of-type{border-top:none}
#dock .sec.cur{background:#F5F8F7;box-shadow:-14px 0 0 #F5F8F7,14px 0 0 #F5F8F7}
#dock .tocgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
#dock .tocgrid a{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:5px;
  background:#fff;text-decoration:none;color:var(--ink);cursor:pointer;font-size:13px;line-height:1.4}
#dock .tocgrid a:hover{border-color:var(--primary);background:var(--prim-l)}
#dock .tocgrid a.cur{border-color:var(--accent);background:var(--acc-l)}
#dock .tocgrid a span{font-family:var(--mono);font-size:11.5px;color:var(--accent);margin-right:7px}
#dock .keys{display:grid;grid-template-columns:1fr 1fr;gap:9px 20px;font-size:13.5px;line-height:1.7}
#dock .keys kbd{font-family:var(--mono);background:#fff;border:1px solid var(--line);
  border-bottom-width:2px;border-radius:4px;padding:2px 7px;color:var(--primary);margin-right:8px}
.toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);background:var(--ink);
  color:#fff;font-size:13px;padding:9px 16px;border-radius:5px;opacity:0;transition:.3s;
  z-index:80;pointer-events:none;max-width:70vw;text-align:center}
.toast.on{opacity:1}
@media print{.chrome,#dock,.toast{display:none!important}#viewport{position:static}
  #stage{position:static;transform:none!important;box-shadow:none}
  .slide{display:block!important;page-break-after:always;position:relative;height:900px}}
</style>
</head>
<body>
<div id="viewport"><div id="stage"><div id="slides"></div></div></div>
<div id="dock">
  <div class="dh"><span class="dt" id="dockTitle">本页讲稿</span>
    <span class="ds" id="dockSub"></span>
    <button onclick="closeDock()">关闭 ✕</button></div>
  <div class="db" id="dockBody"></div>
</div>
<div class="chrome">
  <button id="btnPrev">← 上一页</button>
  <button id="btnNext">下一页 →</button>
  <span class="pg" id="pg">01 / 23</span>
  <div class="track" id="track"><i></i></div>
  <div class="sep"></div>
  <button id="btnToc">目录 G</button>
  <button id="btnNotes">本页讲稿 N</button>
  <button id="btnAll">全文讲稿 T</button>
  <button id="btnAuto">▶ 自动播放 P</button>
  <button id="btnFs">全屏 F</button>
  <span class="keyhint"><b>G</b> 目录 · <b>N</b> 讲稿 · <b>T</b> 全文 · <b>P</b> 自动 · <b>F</b> 全屏 · <b>← →</b> 翻页 · <b>Esc</b> 关闭</span>
  <button id="btnHelp" class="k">? 帮助</button>
</div>
<div class="toast" id="toast"></div>
<script>
const D = [{"eyebrow":"起点 · 从业务侧的反直觉现象说起","title":"同样的表、同样的索引，为什么第一行快慢差这么多？","lede":"慢 SQL 的困惑往往不在 SQL 本身，而在执行器把计划树变成结果的那套控制协议。","svg":"<svg class=\"figure\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" role=\"img\" aria-label=\"FIG 01 / 业务侧看到的四个反直觉现象\"><text x=\"0.0\" y=\"22.0\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"600\" text-anchor=\"start\" class=\"mono\">FIG 01 / 业务侧看到的四个反直觉现象</text><text x=\"1400.0\" y=\"22.0\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"end\">数据库筑基课 · 查询执行基础能力</text><rect x=\"0\" y=\"34\" width=\"1400\" height=\"1\" fill=\"#D9D5CB\"/><rect x=\"20.0\" y=\"52.0\" width=\"860.0\" height=\"72.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"36.0\" y=\"82.8\" font-size=\"18.0\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">① 同样的表、同样的索引，第一行快慢差很多</text><text x=\"36.0\" y=\"102.5\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">有的查询立刻吐出第一行，有的必须先等很久</text><rect x=\"20.0\" y=\"136.0\" width=\"860.0\" height=\"72.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"36.0\" y=\"166.8\" font-size=\"18.0\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">② 有的 LIMIT 10 明显加速，有的加了 LIMIT 仍要扫很多数据</text><text x=\"36.0\" y=\"186.5\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">看起来一样的写法，执行路径完全不同</text><rect x=\"20.0\" y=\"220.0\" width=\"860.0\" height=\"72.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"36.0\" y=\"250.8\" font-size=\"18.0\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">③ EXPLAIN ANALYZE 里一个节点 loops=10000</text><text x=\"36.0\" y=\"270.5\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">真正慢点却藏在内层索引扫描，而不是这个数字本身</text><rect x=\"20.0\" y=\"304.0\" width=\"860.0\" height=\"72.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"36.0\" y=\"334.8\" font-size=\"18.0\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">④ 计划树长得差不多，响应曲线却不一样</text><text x=\"36.0\" y=\"354.5\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">节点名字相同，首行延迟、调用次数、内存形态可能完全不同</text><path d=\"M880.0 88.0 H956.0\" fill=\"none\" stroke=\"#7BA6AF\" stroke-width=\"1.4\"/><rect x=\"952.0\" y=\"84.0\" width=\"8.0\" height=\"8.0\" fill=\"#7BA6AF\"/><path d=\"M880.0 172.0 H956.0\" fill=\"none\" stroke=\"#7BA6AF\" stroke-width=\"1.4\"/><rect x=\"952.0\" y=\"168.0\" width=\"8.0\" height=\"8.0\" fill=\"#7BA6AF\"/><path d=\"M880.0 256.0 H956.0\" fill=\"none\" stroke=\"#7BA6AF\" stroke-width=\"1.4\"/><rect x=\"952.0\" y=\"252.0\" width=\"8.0\" height=\"8.0\" fill=\"#7BA6AF\"/><path d=\"M880.0 340.0 H956.0\" fill=\"none\" stroke=\"#7BA6AF\" stroke-width=\"1.4\"/><rect x=\"952.0\" y=\"336.0\" width=\"8.0\" height=\"8.0\" fill=\"#7BA6AF\"/><rect x=\"956.0\" y=\"52.0\" width=\"424.0\" height=\"324.0\" fill=\"#1E4B5A\"/><rect x=\"972.0\" y=\"68.0\" width=\"392.0\" height=\"292.0\" fill=\"#1E4B5A\"/><text x=\"988.0\" y=\"164.9\" font-size=\"22.0\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">共同的根因只有一个</text><text x=\"988.0\" y=\"181.1\" font-size=\"8.0\" fill=\"#FFFFFF\" font-weight=\"400\" text-anchor=\"start\"></text><text x=\"988.0\" y=\"199.0\" font-size=\"17.0\" fill=\"#FFFFFF\" font-weight=\"400\" text-anchor=\"start\">我们一直在看「计划长什么样」，</text><text x=\"988.0\" y=\"220.8\" font-size=\"17.0\" fill=\"#FFFFFF\" font-weight=\"400\" text-anchor=\"start\">却没看「执行器怎么把一棵计划树</text><text x=\"988.0\" y=\"242.5\" font-size=\"17.0\" fill=\"#FFFFFF\" font-weight=\"400\" text-anchor=\"start\">变成一行一行的结果」。</text><text x=\"988.0\" y=\"256.6\" font-size=\"8.0\" fill=\"#FFFFFF\" font-weight=\"400\" text-anchor=\"start\"></text><text x=\"988.0\" y=\"274.5\" font-size=\"17.0\" fill=\"#F5EDDC\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">→ 先理解传统单行 Pull（Volcano）</text><text x=\"0.0\" y=\"412.0\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">结论：这四种现象不是 SQL 写法的玄学，而是同一套控制协议在不同计划形状下的外显。</text></svg>","caption":"图 01　四个反直觉现象指向同一个根因：我们只看过计划长什么样，没看过执行器怎么逐行生产结果。","bridge":"于是第一问是：一条声明式 SQL，究竟怎么变成一棵能逐行取数的算子树？","notes":"先别急着调参数。我们手里其实有四类很常见的困惑：同样的表和索引，有的查询第一行立刻出来，有的要等很久；有的 LIMIT 10 一加就快，有的加了 LIMIT 还是扫掉一大片数据；EXPLAIN ANALYZE 里冒出一个 loops=10000，但真正拖慢查询的却藏在内层索引扫描；还有两条计划树看起来差不多，响应曲线却完全不一样。这四件事经常被当成四种玄学，其实它们是同一个东西的外显：执行器把一棵计划树变成一行行结果的控制协议。今天不谈某个 Hint，也不谈某个参数，我们把这层骨架拆开看。它叫传统单行 Pull，也常被叫做 Volcano 或 Iterator 模型。看完这一层，你会发现前面四个现象都能在同一张图上找到位置。","ctrl":null,"disclaim":null},{"eyebrow":"问题定义 · 统一接口","title":"声明式 SQL 交给执行器，第一难题是「算子怎么拼」","lede":"用户写的是要什么结果，数据库必须决定按什么顺序执行哪些物理算子。","svg":"<svg class=\"figure\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" role=\"img\" aria-label=\"FIG 02 / 声明式 SQL 到物理算子\"><text x=\"0.0\" y=\"22.0\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"600\" text-anchor=\"start\" class=\"mono\">FIG 02 / 声明式 SQL 到物理算子</text><text x=\"1400.0\" y=\"22.0\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"end\">统一接口是执行器的第一性问题</text><rect x=\"0\" y=\"34\" width=\"1400\" height=\"1\" fill=\"#D9D5CB\"/><rect x=\"20.0\" y=\"52.0\" width=\"420.0\" height=\"330.0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"36.0\" y=\"78.0\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"600\" text-anchor=\"start\" class=\"serif\">用户写的：我要什么结果</text><text x=\"38.0\" y=\"116.0\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"400\" text-anchor=\"start\" class=\"mono\">SELECT * FROM orders o</text><text x=\"38.0\" y=\"148.0\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"400\" text-anchor=\"start\" class=\"mono\">JOIN customers c ON c.id = o.customer_id</text><text x=\"38.0\" y=\"180.0\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"400\" text-anchor=\"start\" class=\"mono\">WHERE o.created_at &gt;= current_date - 7</text><text x=\"38.0\" y=\"212.0\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"400\" text-anchor=\"start\" class=\"mono\">ORDER BY o.amount DESC</text><text x=\"38.0\" y=\"244.0\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"400\" text-anchor=\"start\" class=\"mono\">LIMIT 10;</text><text x=\"38.0\" y=\"350.0\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"start\">声明式：没有执行顺序，也没有算子</text><path d=\"M440.0 210.0 H486.0\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.4\"/><rect x=\"482.0\" y=\"206.0\" width=\"8.0\" height=\"8.0\" fill=\"#245A6B\"/><text x=\"463.0\" y=\"196.0\" font-size=\"18.0\" fill=\"#245A6B\" font-weight=\"600\" text-anchor=\"middle\">→</text><rect x=\"486.0\" y=\"52.0\" width=\"424.0\" height=\"330.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"502.0\" y=\"78.0\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"600\" text-anchor=\"start\" class=\"serif\">优化器输出：Plan 树（物理算子）</text><rect x=\"520.0\" y=\"96.0\" width=\"356.0\" height=\"44.0\" fill=\"#EBF1EE\"/><text x=\"536.0\" y=\"121.6\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"start\" class=\"mono\">Limit</text><path d=\"M698.0 140.0 V150.0\" fill=\"none\" stroke=\"#7BA6AF\" stroke-width=\"1.4\"/><rect x=\"520.0\" y=\"150.0\" width=\"356.0\" height=\"44.0\" fill=\"#CFE0DC\"/><text x=\"536.0\" y=\"175.6\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"start\" class=\"mono\">Sort</text><path d=\"M698.0 194.0 V204.0\" fill=\"none\" stroke=\"#7BA6AF\" stroke-width=\"1.4\"/><rect x=\"520.0\" y=\"204.0\" width=\"356.0\" height=\"44.0\" fill=\"#A4C4C6\"/><text x=\"536.0\" y=\"229.6\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"start\" class=\"mono\">Join</text><path d=\"M698.0 248.0 V258.0\" fill=\"none\" stroke=\"#7BA6AF\" stroke-width=\"1.4\"/><rect x=\"520.0\" y=\"258.0\" width=\"356.0\" height=\"44.0\" fill=\"#74A5AD\"/><text x=\"536.0\" y=\"283.6\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"start\" class=\"mono\">Filter</text><path d=\"M698.0 302.0 V312.0\" fill=\"none\" stroke=\"#7BA6AF\" stroke-width=\"1.4\"/><rect x=\"520.0\" y=\"312.0\" width=\"356.0\" height=\"44.0\" fill=\"#2E6373\"/><text x=\"536.0\" y=\"337.6\" font-size=\"17.0\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"start\" class=\"mono\">Scan</text><path d=\"M910.0 210.0 H956.0\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.4\"/><rect x=\"952.0\" y=\"206.0\" width=\"8.0\" height=\"8.0\" fill=\"#245A6B\"/><text x=\"933.0\" y=\"196.0\" font-size=\"18.0\" fill=\"#245A6B\" font-weight=\"600\" text-anchor=\"middle\">→</text><rect x=\"956.0\" y=\"52.0\" width=\"424.0\" height=\"330.0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"972.0\" y=\"78.0\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"600\" text-anchor=\"start\" class=\"serif\">执行器必须回答</text><rect x=\"972.0\" y=\"96.0\" width=\"392.0\" height=\"76.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"988.0\" y=\"126.7\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"400\" text-anchor=\"start\">每个算子输入输出都不同，</text><text x=\"988.0\" y=\"148.4\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"400\" text-anchor=\"start\">上层怎么向下层要数据？</text><rect x=\"972.0\" y=\"184.0\" width=\"392.0\" height=\"76.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"988.0\" y=\"214.7\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"400\" text-anchor=\"start\">下层如何在没有全局调度器的</text><text x=\"988.0\" y=\"236.4\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"400\" text-anchor=\"start\">情况下继续工作？</text><rect x=\"972.0\" y=\"272.0\" width=\"392.0\" height=\"90.0\" fill=\"#BE653B\"/><rect x=\"988.0\" y=\"282.0\" width=\"360.0\" height=\"70.0\" fill=\"#BE653B\"/><text x=\"1004.0\" y=\"321.2\" font-size=\"20.0\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">统一接口：给我下一行</text><text x=\"0.0\" y=\"412.0\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">扫描、过滤、连接、排序、Limit 的输入输出各不相同，能拼在一起的前提是接口一致。</text></svg>","caption":"图 02　扫描、过滤、连接、排序、Limit 的输入输出各不相同，能拼成一棵树的前提是接口一致。","bridge":"接口一旦统一，剩下的就只是「给我下一行」这一句话。","notes":"SQL 是声明式的。这条语句里写了 orders 和 customers 的连接、最近七天的过滤、按金额排序、只要前十行，可它没告诉数据库先做哪一步。优化器会把这些意图翻译成一棵物理算子树：扫描、过滤、连接、排序、Limit。麻烦在于，这些算子的输入输出形状完全不一样：扫描吐的是表里的一行，连接要同时拿两行，排序理论上得先看到全部输入，Limit 又不关心后面还有多少。如果没有统一约定，每两个算子之间都要写一套专门的对接代码，扩展一个新算子就得改遍全场。所以执行器要解决的不是「怎么算得快」，而是先解决「不同算子如何统一组合」。答案是一个极简的接口：上层向下层要下一行。","ctrl":null,"disclaim":null},{"eyebrow":"模型定义 · 一句话抽象","title":"Volcano 把问题简化成：每个算子都实现「给我下一行」","lede":"父节点调用子节点取一行，子节点返回一行，或者返回空表示结束。","svg":"<svg class=\"figure\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" role=\"img\" aria-label=\"FIG 03 / Volcano 的一句话抽象\"><text x=\"0.0\" y=\"22.0\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"600\" text-anchor=\"start\" class=\"mono\">FIG 03 / Volcano 的一句话抽象</text><text x=\"1400.0\" y=\"22.0\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"end\">Iterator 模型 · open / next / close</text><rect x=\"0\" y=\"34\" width=\"1400\" height=\"1\" fill=\"#D9D5CB\"/><rect x=\"20.0\" y=\"52.0\" width=\"1360.0\" height=\"96.0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><rect x=\"36.0\" y=\"62.0\" width=\"1328.0\" height=\"76.0\" fill=\"#F7E9DE\"/><text x=\"700.0\" y=\"91.0\" font-size=\"21.0\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"middle\" class=\"serif\">每个物理算子都实现「给我下一行」的接口；父节点调用子节点拿一行，</text><text x=\"700.0\" y=\"117.8\" font-size=\"21.0\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"middle\" class=\"serif\">子节点返回一行，或者返回空表示结束。</text><rect x=\"20.0\" y=\"172.0\" width=\"440.0\" height=\"196.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><rect x=\"20.0\" y=\"172.0\" width=\"440.0\" height=\"6.0\" fill=\"#E4F0EA\"/><rect x=\"36.0\" y=\"192.0\" width=\"408.0\" height=\"56.0\" fill=\"#FFFFFF\"/><text x=\"52.0\" y=\"224.6\" font-size=\"22.0\" fill=\"#2F7A66\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">组合性</text><rect x=\"36.0\" y=\"256.0\" width=\"408.0\" height=\"96.0\" fill=\"#FFFFFF\"/><text x=\"52.0\" y=\"297.1\" font-size=\"16.0\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">扫描、过滤、连接、投影、Limit</text><text x=\"52.0\" y=\"317.6\" font-size=\"16.0\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">像积木一样接在一起</text><rect x=\"480.0\" y=\"172.0\" width=\"440.0\" height=\"196.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><rect x=\"480.0\" y=\"172.0\" width=\"440.0\" height=\"6.0\" fill=\"#E4F0EA\"/><rect x=\"496.0\" y=\"192.0\" width=\"408.0\" height=\"56.0\" fill=\"#FFFFFF\"/><text x=\"512.0\" y=\"224.6\" font-size=\"22.0\" fill=\"#2F7A66\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">懒执行</text><rect x=\"496.0\" y=\"256.0\" width=\"408.0\" height=\"96.0\" fill=\"#FFFFFF\"/><text x=\"512.0\" y=\"297.1\" font-size=\"16.0\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">上层不需要更多行时</text><text x=\"512.0\" y=\"317.6\" font-size=\"16.0\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">下层就不再继续生产</text><rect x=\"940.0\" y=\"172.0\" width=\"440.0\" height=\"196.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><rect x=\"940.0\" y=\"172.0\" width=\"440.0\" height=\"6.0\" fill=\"#E4F0EA\"/><rect x=\"956.0\" y=\"192.0\" width=\"408.0\" height=\"56.0\" fill=\"#FFFFFF\"/><text x=\"972.0\" y=\"224.6\" font-size=\"22.0\" fill=\"#2F7A66\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">状态封装</text><rect x=\"956.0\" y=\"256.0\" width=\"408.0\" height=\"96.0\" fill=\"#FFFFFF\"/><text x=\"972.0\" y=\"297.1\" font-size=\"16.0\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">游标、表达式、临时结构、内存上下文</text><text x=\"972.0\" y=\"317.6\" font-size=\"16.0\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">都保存在算子自己内部</text><text x=\"0.0\" y=\"412.0\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">抽象接口：open() · next() → tuple 或 end-of-stream · close()；三个收益都来自「只要下一行」这一句话。</text></svg>","caption":"图 03　抽象接口是 open() / next() → tuple 或 end-of-stream / close()；三个工程收益都由这一句话派生。","bridge":"好处说完了，但同一句话里也同时写进了代价。","notes":"传统单行 Pull 模型，也叫 Iterator 模型，抽象接口就是三段：open 初始化，next 取下一行，close 收尾。next 要么给一个 tuple，要么给一个结束信号。就这一句话，顺手解决了三个工程问题。第一是组合性，扫描、过滤、连接、投影、Limit 像积木一样接在一起，谁也不必知道对方内部怎么实现。第二是懒执行，上层不再要行，下层就立刻停手，LIMIT、EXISTS、游标分批拉取都吃这个红利。第三是状态封装，游标、表达式、临时结构、内存上下文全关在算子自己家里，上层眼里只有「下一行」四个字。注意，这三条都是控制层面的收益，跟每行算得快不快没有直接关系。这句话的另外半句，我们下一页再读。","ctrl":null,"disclaim":null},{"eyebrow":"核心原理 · 双向流动","title":"调用方向自上而下，数据方向自底向上","lede":"上层不拉，下层不生产；下层没数据了，结束信号再逐层向上传播。","svg":"<svg class=\"figure\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" role=\"img\" aria-label=\"FIG 04 / 调用向下，数据向上\"><text x=\"0.0\" y=\"22.0\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"600\" text-anchor=\"start\" class=\"mono\">FIG 04 / 调用向下，数据向上</text><text x=\"1400.0\" y=\"22.0\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"end\">PostgreSQL executor README：demand-pull pipeline</text><rect x=\"0\" y=\"34\" width=\"1400\" height=\"1\" fill=\"#D9D5CB\"/><text x=\"150.0\" y=\"62.0\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"middle\" class=\"serif\">① 调用方向 ↓</text><text x=\"150.0\" y=\"84.0\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"middle\">我要下一行</text><text x=\"1240.0\" y=\"62.0\" font-size=\"16.0\" fill=\"#2F7A66\" font-weight=\"700\" text-anchor=\"middle\" class=\"serif\">② 数据方向 ↑</text><text x=\"1240.0\" y=\"84.0\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"middle\">给你一行 / NULL</text><rect x=\"400.0\" y=\"104.0\" width=\"600.0\" height=\"60.0\" fill=\"#EBF1EE\"/><text x=\"418.0\" y=\"138.2\" font-size=\"20.0\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"start\">ExecutePlan　顶层循环</text><rect x=\"400.0\" y=\"180.0\" width=\"600.0\" height=\"60.0\" fill=\"#CFE0DC\"/><text x=\"418.0\" y=\"214.2\" font-size=\"20.0\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"start\">Limit　　　要够就停止拉</text><rect x=\"400.0\" y=\"256.0\" width=\"600.0\" height=\"60.0\" fill=\"#74A5AD\"/><text x=\"418.0\" y=\"290.2\" font-size=\"20.0\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"start\">NestLoop　　父节点也是子的消费者</text><rect x=\"400.0\" y=\"332.0\" width=\"600.0\" height=\"60.0\" fill=\"#1E4B5A\"/><text x=\"418.0\" y=\"366.2\" font-size=\"20.0\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"start\">SeqScan / IndexScan　　从访问方法取一行</text><path d=\"M300.0 134.0 H400.0\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><rect x=\"396.0\" y=\"130.0\" width=\"8.0\" height=\"8.0\" fill=\"#245A6B\"/><path d=\"M1000.0 134.0 H1100.0\" fill=\"none\" stroke=\"#2F7A66\" stroke-width=\"1.6\"/><rect x=\"996.0\" y=\"130.0\" width=\"8.0\" height=\"8.0\" fill=\"#2F7A66\"/><path d=\"M300.0 210.0 H400.0\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><rect x=\"396.0\" y=\"206.0\" width=\"8.0\" height=\"8.0\" fill=\"#245A6B\"/><path d=\"M1000.0 210.0 H1100.0\" fill=\"none\" stroke=\"#2F7A66\" stroke-width=\"1.6\"/><rect x=\"996.0\" y=\"206.0\" width=\"8.0\" height=\"8.0\" fill=\"#2F7A66\"/><path d=\"M300.0 286.0 H400.0\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><rect x=\"396.0\" y=\"282.0\" width=\"8.0\" height=\"8.0\" fill=\"#245A6B\"/><path d=\"M1000.0 286.0 H1100.0\" fill=\"none\" stroke=\"#2F7A66\" stroke-width=\"1.6\"/><rect x=\"996.0\" y=\"282.0\" width=\"8.0\" height=\"8.0\" fill=\"#2F7A66\"/><path d=\"M300.0 362.0 H400.0\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><rect x=\"396.0\" y=\"358.0\" width=\"8.0\" height=\"8.0\" fill=\"#245A6B\"/><path d=\"M1000.0 362.0 H1100.0\" fill=\"none\" stroke=\"#2F7A66\" stroke-width=\"1.6\"/><rect x=\"996.0\" y=\"358.0\" width=\"8.0\" height=\"8.0\" fill=\"#2F7A66\"/><path d=\"M300.0 134.0 V362.0\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><path d=\"M1100.0 134.0 V362.0\" fill=\"none\" stroke=\"#2F7A66\" stroke-width=\"1.6\"/><rect x=\"40.0\" y=\"160.0\" width=\"220.0\" height=\"84.0\" fill=\"#E5EFF0\"/><text x=\"56.0\" y=\"194.7\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">上层不拉，</text><text x=\"56.0\" y=\"216.4\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">下层不生产</text><rect x=\"1140.0\" y=\"160.0\" width=\"240.0\" height=\"84.0\" fill=\"#E4F0EA\"/><text x=\"1156.0\" y=\"194.7\" font-size=\"17.0\" fill=\"#2F7A66\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">下层没数据，</text><text x=\"1156.0\" y=\"216.4\" font-size=\"17.0\" fill=\"#2F7A66\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">NULL 逐层上传</text><text x=\"0.0\" y=\"414.0\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">两个方向同时发生却互不等价：控制权自上而下，tuple 自下而上；这就是 Pull 与 Push 最根本的分界。</text></svg>","caption":"图 04　一次 ExecProcNode 调用的完整往返：控制权下去，TupleTableSlot 上来；颜色越深代表越底层的执行节点。","bridge":"把这张图记住，后面所有源码细节都只是它的展开。","notes":"这是整套模型最该记住的一张图，也是原文图一的重绘。请同时盯住两个方向。左边是调用方向：ExecutePlan 反复调用根节点，根节点再调用子节点，一路向下，直到扫描节点从访问方法里取到一行。右边是数据方向：这行被装进 TupleTableSlot，自底向上逐层交回，每一层可能做过滤、做连接、做投影，最后交给顶层。两件事必须分开看——控制权是自上而下的，tuple 是自下而上的。由此得到两条判据：上层不拉，下层绝不生产；下层一旦返回 NULL，结束信号就顺着这条链逐层往上传。PostgreSQL 官方执行器 README 把 plan tree 直接称作 demand-pull pipeline，说的就是这件事。后面讲 ExecProcNode、PlanState、slot，都不过是把这张图的每一层换成真实名字。","ctrl":null,"disclaim":null},{"eyebrow":"设计取舍 · 收益与代价同源","title":"它优化的是「怎么拼、怎么管」，不是「每行怎么最快」","lede":"通用、可组合、易控制，是这套骨架的目标；每行开销是它的必然副产品。","svg":"<svg class=\"figure\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" role=\"img\" aria-label=\"FIG 05 / 收益与代价写在同一张设计里\"><text x=\"0.0\" y=\"22.0\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"600\" text-anchor=\"start\" class=\"mono\">FIG 05 / 收益与代价写在同一张设计里</text><text x=\"1400.0\" y=\"22.0\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"end\">不是「快」的代名词，而是通用、可组合、易控制</text><rect x=\"0\" y=\"34\" width=\"1400\" height=\"1\" fill=\"#D9D5CB\"/><rect x=\"20.0\" y=\"52.0\" width=\"660.0\" height=\"300.0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"36.0\" y=\"80.0\" font-size=\"19.0\" fill=\"#2F7A66\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">解决了三个工程问题</text><rect x=\"36.0\" y=\"96.0\" width=\"628.0\" height=\"68.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"52.0\" y=\"124.5\" font-size=\"18.0\" fill=\"#2F7A66\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">组合性</text><text x=\"52.0\" y=\"144.6\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">算子像积木一样接在一起</text><rect x=\"36.0\" y=\"176.0\" width=\"628.0\" height=\"68.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"52.0\" y=\"204.5\" font-size=\"18.0\" fill=\"#2F7A66\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">懒执行</text><text x=\"52.0\" y=\"224.6\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">LIMIT / EXISTS / 游标受益</text><rect x=\"36.0\" y=\"256.0\" width=\"628.0\" height=\"68.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"52.0\" y=\"284.5\" font-size=\"18.0\" fill=\"#2F7A66\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">状态封装</text><text x=\"52.0\" y=\"304.6\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">上层只关心「下一行」</text><rect x=\"720.0\" y=\"52.0\" width=\"660.0\" height=\"300.0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"736.0\" y=\"80.0\" font-size=\"19.0\" fill=\"#BE653B\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">同时付出三个代价</text><rect x=\"736.0\" y=\"96.0\" width=\"628.0\" height=\"68.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"752.0\" y=\"124.5\" font-size=\"18.0\" fill=\"#BE653B\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">多层函数调用与分支</text><text x=\"752.0\" y=\"144.6\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">每处理一行都可能发生多层 ExecProcNode</text><rect x=\"736.0\" y=\"176.0\" width=\"628.0\" height=\"68.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"752.0\" y=\"204.5\" font-size=\"18.0\" fill=\"#BE653B\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">表达式解释与 slot 解构</text><text x=\"752.0\" y=\"224.6\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">虚函数式分发带来 CPU 开销</text><rect x=\"736.0\" y=\"256.0\" width=\"628.0\" height=\"68.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"752.0\" y=\"284.5\" font-size=\"18.0\" fill=\"#BE653B\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">单行粒度不利于现代 CPU</text><text x=\"752.0\" y=\"304.6\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">cache、SIMD、批处理优化空间受限</text><rect x=\"20.0\" y=\"366.0\" width=\"1360.0\" height=\"56.0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><rect x=\"36.0\" y=\"370.0\" width=\"1328.0\" height=\"48.0\" fill=\"#F5EDDC\"/><text x=\"700.0\" y=\"398.0\" font-size=\"19.0\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"middle\" class=\"serif\">它优化的是「算子怎么拼、状态怎么管」，不是「每行怎么最快」。</text></svg>","caption":"图 05　三个工程收益与三个代价来自同一个决定：把执行粒度定在「一行」。","bridge":"既然是取舍，就得知道它在源码里具体长什么样。","notes":"把粒度定在「一行」，好处和坏处其实是同一枚硬币。好处刚才说了：组合、懒执行、状态封装。坏处也很直接：每处理一行，都要穿过好几层函数调用和分支判断；表达式解释、slot 解构、函数指针式的分发，都会变成 CPU 上的固定开销；更要命的是，单行粒度让 CPU cache、SIMD、批处理这些现代硬件喜欢的东西很难施展。对大规模扫描、聚合、分析型 workload，这些开销会被行数放大。所以千万别给它贴一个「快」或者「旧」的标签。它的定位是通用、可组合、易控制的执行器骨架。判断一个查询会不会被它拖累，先回到 workload：是少量结果、低首行延迟，还是大扫描、高吞吐。接下来我们进源码，看这套抽象怎么落到 PostgreSQL 的结构里。","ctrl":null,"disclaim":null},{"eyebrow":"源码映射 · 抽象到实现","title":"open / next / close，在 PostgreSQL 里各有一个名字","lede":"ExecutorStart、ExecProcNode、TupleTableSlot、ExecutorEnd 构成完整对应。","svg":"<svg \"400\" text-anchor=\"start\">官方 executor README 原文：The plan tree is essentially a demand-pull pipeline of tuple processing operations.</text></svg>","caption":"图 06　Volcano 抽象与 PostgreSQL 执行器的逐项对应；映射关系来自 executor README 与 execMain.c / execProcnode.c。","bridge":"有了名字，就可以追问：计划和执行状态为什么要分成两棵树？","notes":"抽象要落地，得有具体的函数和结构体。open 对应 ExecutorStart 和它调用的 ExecInitNode，负责把执行状态树、表达式、slot、扫描描述符初始化好；next 对应 ExecProcNode，从某个 PlanState 节点拉下一行；tuple 对应 TupleTableSlot，这是节点之间传递行的容器；结束信号对应 NULL 或者空 slot；close 对应 ExecutorEnd 和 ExecEndNode，释放关系、buffer pin、临时文件和执行状态。execProcnode.c 的头部注释还专门用嵌套循环连接的例子，把 ExecutorRun 调 ExecutePlan、ExecutePlan 反复调根节点 ExecProcNode、根节点再递归调子计划这条链完整走了一遍。这里有个容易忽略的细节：映射表是主干抽象，不是每一类节点的全部行为，后面我们会专门讲例外。","ctrl":null,"disclaim":null},{"eyebrow":"运行期结构 · 两棵树","title":"Plan 是只读蓝图，PlanState 保存运行期状态","lede":"ExecInitNode() 递归扫描 Plan 树，构造结构相似的 PlanState 树。","svg":"<svg class=\"figure\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" role=\"img\" aria-label=\"FIG 07 / Plan 树与 PlanState 树分离\"><text x=\"0.0\" y=\"22.0\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"600\" text-anchor=\"start\" class=\"mono\">FIG 07 / Plan 树与 PlanState 树分离</text><text x=\"1400.0\" y=\"22.0\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"end\">ExecInitNode() 递归构造同构状态树</text><rect x=\"0\" y=\"34\" width=\"1400\" height=\"1\" fill=\"#D9D5CB\"/><rect x=\"20.0\" y=\"52.0\" width=\"620.0\" height=\"306.0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"36.0\" y=\"80.0\" font-size=\"19.0\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">Plan 树 · 只读蓝图</text><text x=\"36.0\" y=\"102.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">优化器决策，执行期不改写；可缓存、可复用</text><rect x=\"48.0\" y=\"120.0\" width=\"564.0\" height=\"58.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"64.0\" y=\"152.8\" font-size=\"18.0\" fill=\"#1B2B33\" font-weight=\"700 288.6\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"start\" class=\"mono\">SeqScanState</text><text x=\"804.0\" y=\"306.5\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">游标 · ExprState · ps_ResultTupleSlot · chgParam · instrument</text><path d=\"M640.0 149.0 H760.0\" fill=\"none\" stroke=\"#7BA6AF\" stroke-width=\"1.4\"/><rect x=\"756.0\" y=\"145.0\" width=\"8.0\" height=\"8.0\" fill=\"#7BA6AF\"/><path d=\"M640.0 221.0 H760.0\" fill=\"none\" stroke=\"#7BA6AF\" stroke-width=\"1.4\"/><rect x=\"756.0\" y=\"217.0\" width=\"8.0\" height=\"8.0\" fill=\"#7BA6AF\"/><path d=\"M640.0 293.0 H760.0\" fill=\"none\" stroke=\"#7BA6AF\" stroke-width=\"1.4\"/><rect x=\"756.0\" y=\"289.0\" width=\"8.0\" height=\"8.0\" fill=\"#7BA6AF\"/><text x=\"700.0\" y=\"336.0\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"700\" text-anchor=\"middle\" class=\"mono\">1 : 1</text><rect x=\"20.0\" y=\"370.0\" width=\"1360.0\" height=\"52.0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"36.0\" y=\"402.0\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"400\" text-anchor=\"start\" class=\"mono\">typedef TupleTableSlot *(*ExecProcNodeMtd)(PlanState *pstate);</text><text x=\"1364.0\" y=\"402.0\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"end\">EState · per-query / per-tuple 内存上下文</text></svg>","caption":"图 07　四次节点类别：Plan、PlanState、Expr、ExprState；plan 完全只读，让 plan cache 与 prepared statement 更清晰。","bridge":"状态树建好之后，谁来反复敲它的门？","notes":"优化器交出来的是一棵只读 Plan 树，装的是决策：用哪个扫描、哪个连接、什么顺序。执行开始时，ExecInitNode 递归扫这棵树，造出一棵结构相似的 PlanState 树，装的是运行期状态：游标走到哪了、ExprState 在哪、结果 slot 是哪个、chgParam 有没有变、instrumentation 怎么记。README 里说得很明白，这样安排是为了让 plan tree 对执行器完全只读，方便计划缓存和复用。还有个小知识点：表达式树并不镜像成同构状态树，每个可独立执行的表达式树只对应一个 ExprState，里面的 steps 是压平的线性数组，这样求值不用做树遍历、栈也浅。每个 PlanState 上都挂着 ExecProcNodeMtd 函数指针，指向该节点「生产下一行」的实现。注意类型签名：入参是 PlanState，返回 TupleTableSlot 指针。","ctrl":null,"disclaim":null},{"eyebrow":"顶层循环 · ExecutePlan","title":"所有拉取，都从反复敲根节点的门开始","lede":"重置表达式上下文 → 拉根 → 判空 → 交给接收器 → 判断是否提前停。","svg":"<svg class=\"figure\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" role=\"img\" aria-label=\"FIG 08 / ExecutePlan 的顶层循环\"><text x=\"0.0\" y=\"22.0\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"600\" text-anchor=\"start\" class=\"mono\">FIG 08 / ExecutePlan 的顶层循环</text><text x=\"1400.0\" y=\"22.0\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"end\">execMain.c · 反复拉根 PlanState</text><rect x=\"0\" y=\"34\" width=\"1400\" height=\"1\" fill=\"#D9D5CB\"/><rect x=\"20.0\" y=\"84.0\" width=\"240.0\" height=\"92.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"36.0\" y=\"125.2\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">① 重置表达式上下文</text><text x=\"36.0\" y=\"143.6\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">per-output-tuple ExprContext</text><path d=\"M260.0 130.0 H292.0\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.4\"/><rect x=\"288.0\" y=\"126.0\" width=\"8.0\" height=\"8.0\" fill=\"#245A6B\"/><rect x=\"292.0\" y=\"84.0\" width=\"240.0\" height=\"92.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"308.0\" y=\"125.2\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">② 拉根节点</text><text x=\"308.0\" y=\"143.6\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">ExecProcNode(planstate)</text><path d=\"M532.0 130.0 H564.0\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.4\"/><rect x=\"560.0\" y=\"126.0\" width=\"8.0\" height=\"8.0\" fill=\"#245A6B\"/><rect x=\"564.0\" y=\"84.0\" width=\"240.0\" height=\"92.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"580.0\" y=\"125.2\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">③ slot 为空？</text><text x=\"580.0\" y=\"143.6\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">空则结束循环</text><path d=\"M804.0 130.0 H836.0\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.4\"/><rect x=\"832.0\" y=\"126.0\" width=\"8.0\" height=\"8.0\" fill=\"#245A6B\"/><rect x=\"836.0\" y=\"84.0\" width=\"240.0\" height=\"92.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"852.0\" y=\"125.2\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">④ 交给接收器</text><text x=\"852.0\" y=\"143.6\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">DestReceiver</text><path d=\"M1076.0 130.0 H1108.0\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.4\"/><rect x=\"1104.0\" y=\"126.0\" width=\"8.0\" height=\"8.0\" fill=\"#245A6B\"/><rect x=\"1108.0\" y=\"84.0\" width=\"240.0\" height=\"92.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"1124.0\" y=\"125.2\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">⑤ 达到数量？</text><text x=\"1124.0\" y=\"143.6\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">达到则提前停止</text><rect x=\"200.0\" y=\"226.0\" width=\"440.0\" height=\"74.0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"216.0\" y=\"257.9\" font-size=\"17.0\" fill=\"#2F7A66\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">游标 / 扩展查询协议 / FETCH n</text><text x=\"216.0\" y=\"276.7\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">上层取多少，下层生产多少</text><rect x=\"700.0\" y=\"226.0\" width=\"440.0\" height=\"74.0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"716.0\" y=\"257.9\" font-size=\"17.0\" fill=\"#2F7A66\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">LIMIT / EXISTS</text><text x=\"716.0\" y=\"276.7\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">可以停止向下拉取，不必先算完全量</text><path d=\"M140.0 176.0 V334.0\" fill=\"none\" stroke=\"#7BA6AF\" stroke-width=\"1.4\"/><path d=\"M1220.0 176.0 V334.0\" fill=\"none\" stroke=\"#7BA6AF\" stroke-width=\"1.4\"/><path d=\"M140.0 334.0 H1220.0\" fill=\"none\" stroke=\"#7BA6AF\" stroke-width=\"1.4\"/><rect x=\"136.0\" y=\"330.0\" width=\"8.0\" height=\"8.0\" fill=\"#7BA6AF\"/><rect x=\"1216.0\" y=\"330.0\" width=\"8.0\" height=\"8.0\" fill=\"#7BA6AF\"/><text x=\"0.0\" y=\"360.0\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">回到 ①：只要上层还要，循环就继续；上层一停，整个调用链立刻停。</text><text x=\"0.0\" y=\"414.0\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">④ 的三种去向：返回客户端 · 写入目标表 · 丢弃给 EXPLAIN ANALYZE 做统计。</text></svg>","caption":"图 08　execMain.c 的 ExecutePlan 循环；右侧两类节点直接受益于「上层一停，下层就停」。","bridge":"根节点的门敲开了，最底下那一行究竟从哪来？","notes":"execMain.c 里的 ExecutePlan 是 Pull 模型最直观的入口。它先设置扫描方向，然后进入一个循环：重置 per-output-tuple 的表达式上下文；调用根 PlanState 的 ExecProcNode；如果返回空，结束；否则把这个 slot 交给目标接收器——可能是返回客户端，可能写进目标表，也可能只是丢给 EXPLAIN ANALYZE 做统计；如果调用者只要固定数量的行，达到数量就直接提前停。整个循环里没有任何「先算完全量结果」的步骤。这就是为什么游标、扩展查询协议、LIMIT、EXISTS 能天然受益：上层只要停手，整条调用链立刻静止。反过来说，如果上层不停，这个循环就会一直敲下去，直到某个节点返回 NULL。理解这一点，后面看「为什么加了 LIMIT 还是慢」就不会困惑——问题往往不在循环，而在循环下面那一层。","ctrl":null,"disclaim":null},{"eyebrow":"叶子节点 · 扫描与 slot","title":"SeqNext 从访问方法拿一行，装进 TupleTableSlot","lede":"不是把 heap tuple 裸传给上层；slot 有自己的类型和生命周期。","svg":"<svg class=\"figure\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" role=\"img\" aria-label=\"FIG 09 / 扫描节点与 TupleTableSlot\"><text x=\"0.0\" y=\"22.0\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"600\" text-anchor=\"start\" class=\"mono\">FIG 09 / 扫描节点与 TupleTableSlot</text><text x=\"1400.0\" y=\"22.0\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"end\">nodeSeqscan.c · tuptable.h</text><rect x=\"0\" y=\"34\" width=\"1400\" height=\"1\" fill=\"#D9D5CB\"/><rect x=\"20.0\" y=\"52.0\" width=\"420.0\" height=\"38.0\" fill=\"#245A6B\"/><text x=\"34.0\" y=\"78.0\" font-size=\"15.5\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">① 初始化 ExecInitSeqScan()</text><rect x=\"480.0\" y=\"52.0\" width=\"440.0\" height=\"38.0\" fill=\"#245A6B\"/><text x=\"494.0\" y=\"78.0\" font-size=\"15.5\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">② 取一行 SeqNext()</text><rect x=\"960.0\" y=\"52.0\" width=\"420.0\" height=\"38.0\" fill=\"#245A6B\"/><text x=\"974.0\" y=\"78.0\" font-size=\"15.5\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">③ 容器 TupleTableSlot</text><rect x=\"20.0\" y=\"100.0\" width=\"420.0\" height=\"58.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"36.0\" y=\"132.3\" font-size=\"15.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">打开扫描关系</text><rect x=\"480.0\" y=\"100.0\" width=\"440.0\" height=\"58.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"496.0\" y=\"132.3\" font-size=\"15.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" class=\"mono\">首次：table_beginscan()</text><rect x=\"960.0\" y=\"100.0\" width=\"420.0\" height=\"58.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"976.0\" y=\"132.2\" font-size=\"15.0\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">buffer 中的 heap tuple</text><rect x=\"20.0\" y=\"168.0\" width=\"420.0\" height=\"58.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"36.0\" y=\"200.3\" font-size=\"15.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">建 ExprContext / 结果类型</text><rect x=\"480.0\" y=\"168.0\" width=\"440.0\" height=\"58.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"496.0\" y=\"200.3\" font-size=\"15.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" class=\"mono\">table_scan_getnextslot()</text><rect x=\"960.0\" y=\"168.0\" width=\"420.0\" height=\"58.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"976.0\" y=\"200.2\" font-size=\"15.0\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">palloc 的 heap tuple</text><rect x=\"20.0\" y=\"236.0\" width=\"420.0\" height=\"58.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"36.0\" y=\"268.3\" font-size=\"15.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">按 qual / projection 选择</text><rect x=\"480.0\" y=\"236.0\" width=\"440.0\" height=\"58.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"496.0\" y=\"268.3\" font-size=\"15.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">成功 → 返回 slot</text><rect x=\"960.0\" y=\"236.0\" width=\"420.0\" height=\"58.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"976.0\" y=\"268.1\" font-size=\"15.0\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">minimal tuple / virtual tuple</text><rect x=\"20.0\" y=\"304.0\" width=\"420.0\" height=\"58.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"36.0\" y=\"336.3\" font-size=\"15.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">ExecSeqScan* 专用变体</text><rect x=\"480.0\" y=\"304.0\" width=\"440.0\" height=\"58.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"496.0\" y=\"336.3\" font-size=\"15.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">失败 → 返回 NULL</text><rect x=\"960.0\" y=\"304.0\" width=\"420.0\" height=\"58.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"976.0\" y=\"336.1\" font-size=\"15.0\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">virtual：Datum / isnull 数组</text><path d=\"M440.0 236.0 H480.0\" fill=\"none\" stroke=\"#7BA6AF\" stroke-width=\"1.4\"/><rect x=\"476.0\" y=\"232.0\" width=\"8.0\" height=\"8.0\" fill=\"#7BA6AF\"/><path d=\"M920.0 236.0 H960.0\" fill=\"none\" stroke=\"#7BA6AF\" stroke-width=\"1.4\"/><rect x=\"956.0\" y=\"232.0\" width=\"8.0\" height=\"8.0\" fill=\"#7BA6AF\"/><rect x=\"20.0\" y=\"382.0\" width=\"1360.0\" height=\"40.0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"36.0\" y=\"408.0\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"400\" text-anchor=\"start\">slot 生命周期：非虚拟 slot 的属性解构是 lazy 的；跨下一次 ExecProcNode() 保存数据必须拷贝或物化。</text></svg>","caption":"图 09　ExecInitSeqScan 按 qual / projection 组合选择 ExecSeqScan* 变体；SeqNext 首次 table_beginscan，之后 table_scan_getnextslot。","bridge":"一行的容器讲清楚了，再看两行怎么被拼成一行。","notes":"最底下的扫描节点，以 nodeSeqscan.c 为例。ExecInitSeqScan 打开扫描关系、建表达式上下文、扫描 slot、结果类型，初始化 qual 和投影；然后根据有没有 qual、有没有 projection，选一个更专门的 ExecSeqScan 变体——源码里确实有 ExecSeqScan、WithQual、WithProject、WithQualProject 这几个版本，目的就是让编译器消掉不必要的分支。真正取数据的是 SeqNext：第一次调用还没有 scan descriptor，就调 table_beginscan；之后每次 table_scan_getnextslot，成功返回 slot，失败返回 NULL。这里有个关键点：PostgreSQL 不是把 heap tuple 裸着往上抛，而是放进 TupleTableSlot。它可以是 buffer 里的 heap tuple、palloc 出来的、minimal tuple，也可以是虚拟 tuple。tuptable.h 说明虚拟 slot 用 Datum 和 isnull 数组减少物理拷贝，非虚拟 slot 的属性解构是 lazy 的。扩展开发要小心：slot 可能引用下层 buffer 或 per-tuple context，想跨下一次调用保存数据，必须拷贝或物化。","ctrl":null,"disclaim":null},{"eyebrow":"连接节点 · loops 的来源","title":"父节点也是子节点的消费者，inner 会被反复驱动","lede":"每一行 outer tuple，都可能让 inner plan 重新执行或重新探测一次。","svg":"<svg class=\"figure\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" role=\"img\" aria-label=\"FIG 10 / 连接节点与 loops 放大\"><text x=\"0.0\" y=\"22.0\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"600\" text-anchor=\"start\" class=\"mono\">FIG 10 / 连接节点与 loops 放大</text><text x=\"1400.0\" y=\"22.0\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"end\">nodeNestloop.c · 父节点也是子节点的消费者</text><rect x=\"0\" y=\"34\" width=\"1400\" height=\"1\" fill=\"#D9D5CB\"/><rect x=\"20.0\" y=\"52.0\" width=\"620.0\" height=\"330.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"36.0\" y=\"80.0\" font-size=\"19.0\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">ExecNestLoop() 主循环</text><text x=\"40.0\" y=\"116.0\" font-size=\"15.0\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">1  需要新 outer → ExecProcNode(outerPlan)</text><text x=\"40.0\" y=\"152.0\" font-size=\"15.0\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">2  outer 无更多 tuple → 连接结束</text><text x=\"40.0\" y=\"188.0\" font-size=\"15.0\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">3  outer tuple 写入表达式上下文</text><text x=\"40.0\" y=\"224.0\" font-size=\"15.0\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">4  设置 chgParam → ExecReScan(innerPlan)</text><text x=\"40.0\" y=\"260.0\" font-size=\"15.0\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">5  ExecProcNode(innerPlan) 逐行取 inner</text><text x=\"40.0\" y=\"296.0\" font-size=\"15.0\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">6  join qual / other qual 求值</text><text x=\"40.0\" y=\"332.0\" font-size=\"15.0\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">7  命中 → ExecProject() 返回 slot</text><rect x=\"680.0\" y=\"52.0\" width=\"700.0\" height=\"330.0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"696.0\" y=\"80.0\" font-size=\"19.0\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">为什么内层 loops 会很大</text><rect x=\"700.0\" y=\"106.0\" width=\"152.0\" height=\"56.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"714.0\" y=\"137.2\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"start\" class=\"mono\">outer #1</text><path d=\"M776.0 162.0 V184.0\" fill=\"none\" stroke=\"#BE653B\" stroke-width=\"1.4\"/><rect x=\"772.0\" y=\"180.0\" width=\"8.0\" height=\"8.0\" fill=\"#BE653B\"/><rect x=\"700.0\" y=\"192.0\" width=\"152.0\" height=\"56.0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"714.0\" y=\"222.8\" font-size=\"13.5\" fill=\"#BE653B\" font-weight=\"400\" text-anchor=\"start\">inner 重扫 1 次</text><rect x=\"868.0\" y=\"106.0\" width=\"152.0\" height=\"56.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"882.0\" y=\"137.2\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"start\" class=\"mono\">outer #2</text><path d=\"M944.0 162.0 V184.0\" fill=\"none\" stroke=\"#BE653B\" stroke-width=\"1.4\"/><rect x=\"940.0\" y=\"180.0\" width=\"8.0\" height=\"8.0\" fill=\"#BE653B\"/><rect x=\"868.0\" y=\"192.0\" width=\"152.0\" height=\"56.0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"882.0\" y=\"222.8\" font-size=\"13.5\" fill=\"#BE653B\" font-weight=\"400\" text-anchor=\"start\">inner 重扫 1 次</text><rect x=\"1036.0\" y=\"106.0\" width=\"152.0\" height=\"56.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"1050.0\" y=\"137.2\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"start\" class=\"mono\">outer #3</text><path d=\"M1112.0 162.0 V184.0\" fill=\"none\" stroke=\"#BE653B\" stroke-width=\"1.4\"/><rect x=\"1108.0\" y=\"180.0\" width=\"8.0\" height=\"8.0\" fill=\"#BE653B\"/><rect x=\"1036.0\" y=\"192.0\" width=\"152.0\" height=\"56.0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"1050.0\" y=\"222.8\" font-size=\"13.5\" fill=\"#BE653B\" font-weight=\"400\" text-anchor=\"start\">inner 重扫 1 次</text><rect x=\"1204.0\" y=\"106.0\" width=\"152.0\" height=\"56.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"1218.0\" y=\"137.2\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"start\" class=\"mono\">outer #n</text><path d=\"M1280.0 162.0 V184.0\" fill=\"none\" stroke=\"#BE653B\" stroke-width=\"1.4\"/><rect x=\"1276.0\" y=\"180.0\" width=\"8.0\" height=\"8.0\" fill=\"#BE653B\"/><rect x=\"1204.0\" y=\"192.0\" width=\"152.0\" height=\"56.0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"1218.0\" y=\"222.8\" font-size=\"13.5\" fill=\"#BE653B\" font-weight=\"400\" text-anchor=\"start\">inner 重扫 1 次</text><rect x=\"700.0\" y=\"266.0\" width=\"664.0\" height=\"96.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><rect x=\"716.0\" y=\"274.0\" width=\"632.0\" height=\"80.0\" fill=\"#FFFFFF\"/><text x=\"732.0\" y=\"307.8\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"400\" text-anchor=\"start\">loops = 节点被执行的次数（示意：外层行数 n）</text><text x=\"732.0\" y=\"327.4\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"400\" text-anchor=\"start\">actual time / rows 是每次执行的平均值 → 总量要乘 loops</text><text x=\"0.0\" y=\"414.0\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">EXPLAIN ANALYZE 的 loops 不是显示问题，而是执行模型真实发生的调用次数（PostgreSQL 官方文档明确说明）。</text></svg>","caption":"图 10　ExecNestLoop 的主循环；右侧是 loops 放大的示意，n 为符号，不代表具体行数。","bridge":"调用次数能解释 loops，却解释不了「第一行为什么等很久」。","notes":"连接节点最能说明 Pull 模型的味道。ExecNestLoop 的主循环里：需要新的 outer tuple 就调 ExecProcNode(outerPlan)；outer 没了就结束；把 outer tuple 写进表达式上下文；对需要相关参数的 inner plan 设置 chgParam，然后 ExecReScan(innerPlan)；接着 ExecProcNode(innerPlan) 逐行取 inner；outer 和 inner 的组合过 join qual 和 other qual；命中了就 ExecProject 返回结果 slot。请把「父节点也是子节点的消费者」这句话和这张图对上：外层的每一行，都会驱动内层重新执行或者重新探测一次。这就解释了 EXPLAIN ANALYZE 里 nested loop 内层节点 loops 很大——那不是显示上的怪癖，是执行模型真实发生的调用次数。官方文档还提醒，内层显示的 actual time 和 rows 是每次执行的平均值，总耗时得乘 loops。所以看计划，别只盯着某一行的 rows 小就放心。","ctrl":null,"disclaim":null},{"eyebrow":"阻塞节点 · 首行延迟","title":"接口仍是 Pull，但第一次被拉可能先吃完整个输入","lede":"Sort 首调先消费子计划所有 tuple，排序完成后才逐行返回。","svg":"<svg class=\"figure\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" role=\"img\" aria-label=\"FIG 11 / 流式算子与阻塞算子的首行延迟\"><text x=\"0.0\" y=\"22.0\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"600\" text-anchor=\"start\" class=\"mono\">FIG 11 / 流式算子与阻塞算子的首行延迟</text><text x=\"1400.0\" y=\"22.0\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"end\">nodeSort.c · 接口仍是 Pull，首行不一定马上来</text><rect x=\"0\" y=\"34\" width=\"1400\" height=\"1\" fill=\"#D9D5CB\"/><rect x=\"20.0\" y=\"52.0\" width=\"240.0\" height=\"1 Aggregate、Materialize 这些改变首行延迟和内存形态的节点；EXPLAIN ANALYZE 里的 startup time、Sort Method、Memory、Disk 就是线索。对了，带 LIMIT 时优化器还可能用 top-N heapsort 控制内存，但输入仍然要读完。","ctrl":null,"disclaim":null},{"eyebrow":"工程例外 · 主干之外","title":"不是所有执行节点都按单行 ExecProcNode 返回","lede":"BitmapIndexScan 被普通调用会直接报错，它走 MultiExecProcNode 协议。","svg":"<svg class=\"figure\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" role=\"img\" aria-label=\"FIG 12 / 主干之外的工程例外\"><text x=\"0.0\" y=\"22.0\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"600\" text-anchor=\"start\" class=\"mono\">FIG 12 / 主干之外的工程例外</text><text x=\"1400.0\" y=\"22.0\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"end\">MultiExecProcNode() · 并非所有节点都逐行返回</text><rect x=\"0\" y=\"34\" width=\"1400\" height=\"1\" fill=\"#D9D5CB\"/><rect x=\"20.0\" y=\"52.0\" width=\"1360.0\" height=\"62.0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><rect x=\"36.0\" y=\"60.0\" width=\"1328.0\" height=\"46.0\" fill=\"#F7E9DE\"/><text x=\"700.0\" y=\"86.8\" font-size=\"18.0\" fill=\"#BE653B\" font-weight=\"700\" text-anchor=\"middle\" class=\"serif\">ExecBitmapIndexScan() 若按普通 ExecProcNode 调用 → 直接报错：不支持该调用约定</text><rect x=\"20.0\" y=\"130.0\" width=\"620.0\" height=\"236.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"36.0\" y=\"158.0\" font-size=\"18.0\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">主干：ExecProcNode()</text><rect x=\"40.0\" y=\"176.0\" width=\"580.0\" height=\"46.0\" fill=\"#E5EFF0\"/><text x=\"56.0\" y=\"202.3\" font-size=\"15.5\" fill=\"#1B2B33\" font-weight=\"400\" text-anchor=\"start\" class=\"mono\">SeqScan / IndexScan</text><rect x=\"40.0\" y=\"232.0\" width=\"580.0\" height=\"46.0\" fill=\"#E5EFF0\"/><text x=\"56.0\" y=\"258.3\" font-size=\"15.5\" fill=\"#1B2B33\" font-weight=\"400\" text-anchor=\"start\" class=\"mono\">NestLoop / HashJoin</text><rect x=\"40.0\" y=\"288.0\" width=\"580.0\" height=\"46.0\" fill=\"#E5EFF0\"/><text x=\"56.0\" y=\"314.3\" font-size=\"15.5\" fill=\"#1B2B33\" font-weight=\"400\" text-anchor=\"start\" class=\"mono\">Limit / Sort</text><text x=\"36.0\" y=\"354.0\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"600\" text-anchor=\"start\">返回单位：1 个 TupleTableSlot</text><rect x=\"680.0\" y=\"130.0\" width=\"700.0\" height=\"236.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"696.0\" y=\"158.0\" font-size=\"18.0\" fill=\"#BE653B\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">例外：MultiExecProcNode()</text><rect x=\"696.0\" y=\"176.0\" width=\"320.0\" height=\"46.0\" fill=\"#F7E9DE\"/><text x=\"712.0\" y=\"202.0\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"400\" text-anchor=\"start\" class=\"mono\">HashState</text><rect x=\"1032.0\" y=\"176.0\" width=\"320.0\" height=\"46.0\" fill=\"#F7E9DE\"/><text x=\"1048.0\" y=\"202.0\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"400\" text-anchor=\"start\" class=\"mono\">BitmapIndexScanState</text><rect x=\"696.0\" y=\"232.0\" width=\"320.0\" height=\"46.0\" fill=\"#F7E9DE\"/><text x=\"712.0\" y=\"258.0\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"400\" text-anchor=\"start\" class=\"mono\">BitmapAndState</text><rect x=\"1032.0\" y=\"232.0\" width=\"320.0\" height=\"46.0\" fill=\"#F7E9DE\"/><text x=\"1048.0\" y=\"258.0\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"400\" text-anchor=\"start\" class=\"mono\">BitmapOrState</text><rect x=\"696.0\" y=\"290.0\" width=\"664.0\" height=\"60.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"712.0\" y=\"323.3\" font-size=\"15.5\" fill=\"#BE653B\" font-weight=\"400\" text-anchor=\"start\">→ 生成 TIDBitmap / Hash table，交给 BitmapHeapScan / HashJoin 使用</text><text x=\"0.0\" y=\"414.0\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">「PostgreSQL 是 Volcano 风格」说的是主干抽象；并行执行、FDW、CustomScan 也各有特殊协议。</text></svg>","caption":"图 12　MultiExecProcNode 支持 HashState / BitmapIndexScanState / BitmapAndState / BitmapOrState，返回的是 Node 而非 slot。","bridge":"到这里原理讲完了，不如亲手拉一次，把三种计划放一起比。","notes":"这里要给「PostgreSQL 是 Volcano 风格」加一个精确的边界。nodeBitmapIndexscan.c 里有个 ExecBitmapIndexScan，如果被按普通 ExecProcNode 调用，会直接 elog(ERROR)，说这个节点不支持该调用约定。它真正的入口是 MultiExecBitmapIndexScan，生成的是一张 TIDBitmap，交给上层的 BitmapHeapScan 去访问 heap。execProcnode.c 的 MultiExecProcNode 明确列出四类支持者：HashState、BitmapIndexScanState、BitmapAndState、BitmapOrState，注释说得很直白——执行「不返回单个 tuple」的节点，可能返回哈希表、bitmap 之类的东西。再加上并行执行里的 Gather、GatherMerge、DSM、worker instrumentation，以及 FDW、CustomScan 各自的协议，结论就很清楚：Volcano 是主干抽象，不是每个节点的逐行保证。把这条记住，读计划时看到 Bitmap Index Scan 就不会硬套「下一行」了。","ctrl":null,"disclaim":null},{"eyebrow":"交互演示 · 逐行拉取","title":"亲手拉一次：同一个 LIMIT，三种计划行为完全不同","lede":"改 LIMIT 行数与计划形状，用播放 / 单步看调用与返回的次序。","svg":"<svg class=\"figure\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" role=\"img\" aria-label=\"SIMULATION 01 / 逐行拉取模拟器\"><text x=\"0.0\" y=\"22.0\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"600\" text-anchor=\"start\" class=\"mono\">SIMULATION 01 / 逐行拉取模拟器</text><text x=\"1400.0\" y=\"22.0\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"end\">输入 LIMIT 与计划形状 → 播放 / 单步 / 重置</text><rect x=\"0\" y=\"34\" width=\"1400\" height=\"1\" fill=\"#D9D5CB\"/><rect x=\"20.0\" y=\"48.0\" width=\"400.0\" height=\"296.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"36.0\" y=\"72.0\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">计划节点（自上而下）</text><rect id=\"simRect0\" x=\"36\" y=\"88.0\" width=\"368\" height=\"48\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\"/><text id=\"simNode0\" x=\"52\" y=\"118.0\" font-size=\"15.5\" fill=\"#46585F\" font-weight=\"600\">—</text><rect x=\"219\" y=\"136.0\" width=\"2\" height=\"12\" fill=\"#7BA6AF\"/><rect id=\"simRect1\" x=\"36\" y=\"148.0\" width=\"368\" height=\"48\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\"/><text id=\"simNode1\" x=\"52\" outer tuple 都会让 inner 重新扫一次，inner loops 跟着结果行数涨。右边的计数器是示意，只表达调用与返回的次序和相对关系，不是实测耗时，也不是行数统计。原文作者没有在文中提供运行输出，我们也不编造数字。看完这三遍，前面所有反直觉现象应该都能自己解释了。","ctrl":"<label>LIMIT 行数</label><input id=\"simN\" type=\"text\" value=\"3\" size=\"3\"><label>计划形状</label><select id=\"simMode\"><option value=\"stream\">Limit → SeqScan（流式早停）</option><option value=\"sort\">Limit → Sort → SeqScan（阻塞）</option><option value=\"nl\">Limit → NestLoop（loops 放大）</option></select><button class=\"btn play\" id=\"simPlay\">▶ 播放</button><button class=\"btn\" id=\"simStepBtn\">单步 →</button><button class=\"btn\" id=\"simReset\">↺ 重置</button><span class=\"out\" id=\"simOut\">选择计划形状后点播放</span>","disclaim":"演示为教学示意：仅表示调用与返回次序，不代表实测耗时、行数或代价估算。"},{"eyebrow":"横向对比 · 四种模型","title":"把 Pull 放进坐标系：接口、返回单位、首行延迟、CPU 开销","lede":"Volcano 的贡献是可扩展的算子封装，不是每行最快。","svg":"<svg class=\"figure\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" role=\"img\" aria-label=\"FIG 14 / 四种执行模型的横向对比\"><text x=\"0.0\" y=\"22.0\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"600\" text-anchor=\"start\" class=\"mono\">FIG 14 / 四种执行模型的横向对比</text><text x=\"1400.0\" y=\"22.0\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"end\">接口 · 返回单位 · 首行延迟 · CPU 开销 · 适合场景</text><rect x=\"0\" y=\"34\" width=\"1400\" height=\"1\" fill=\"#D9D5CB\"/><rect x=\"20.0\" y=\"48.0\" width=\"220.0\" height=\"44.0\" fill=\"#1E4B5A\"/><text x=\"32.0\" y=\"77.0\" font-size=\"14.5\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">维度</text><rect x=\"240.0\" y=\"48.0\" width=\"280.0\" height=\"44.0\" fill=\"#245A6B\"/><text x=\"252.0\" y=\"77.0\" font-size=\"14.5\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">单行 Pull / Volcano</text><rect x=\"520.0\" y=\"48.0\" width=\"280.0\" height=\"44.0\" fill=\"#245A6B\"/><text x=\"532.0\" y=\"77.0\" font-size=\"14.5\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">Push 模型</text><
