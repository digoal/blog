nt-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">有编译启动成本</text><rect x=\"20.0\" y=\"278.0\" width=\"220.0\" height=\"62.0\" fill=\"#F7F6F2\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"32.0\" y=\"316.0\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"start\">CPU 开销</text><rect x=\"240.0\" y=\"278.0\" width=\"280.0\" height=\"62.0\" fill=\"#F7F6F2\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"252.0\" y=\"316.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">每行函数调用明显</text><rect x=\"520.0\" y=\"278.0\" width=\"280.0\" height=\"62.0\" fill=\"#F7F6F2\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"532.0\" y=\"316.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">可减少部分拉取开销</text><rect x=\"800.0\" y=\"278.0\" width=\"280.0\" height=\"62.0\" fill=\"#F7F6F2\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"812.0\" y=\"316.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">摊薄调用，改善 cache/SIMD</text><rect x=\"1080.0\" y=\"278.0\" width=\"280.0\" height=\"62.0\" fill=\"#F7F6F2\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"1092.0\" y=\"316.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">降低解释与分支开销</text><rect x=\"20.0\" y=\"340.0\" width=\"220.0\" height=\"62.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"32.0\" y=\"378.0\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"start\">适合场景</text><rect x=\"240.0\" y=\"340.0\" width=\"280.0\" height=\"62.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"252.0\" y=\"378.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">OLTP / 混合 / 小结果</text><rect x=\"520.0\" y=\"340.0\" width=\"280.0\" height=\"62.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"532.0\" y=\"378.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">流处理 / 事件管道</text><rect x=\"800.0\" y=\"340.0\" width=\"280.0\" height=\"62.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"812.0\" y=\"378.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">OLAP 扫描 / 聚合</text><rect x=\"1080.0\" y=\"340.0\" width=\"280.0\" height=\"62.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"1092.0\" y=\"378.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">热点表达式 / CPU 密集</text><text x=\"0.0\" y=\"414.0\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">Volcano 论文的贡献不是「每行最快」，而是高度可扩展的算子封装；X100 论文批评的正是每行解释开销。</text></svg>","caption":"图 14　四种执行模型的取舍；「首行延迟」一行特意标出单行 Pull 的流式低、阻塞高这一双重性格。","bridge":"同样是 Pull，只要把 next() 的返回单位换掉，性能画像就变了。","notes":"把视角拉远一点。Push 模型是下游注册回调、上游主动推数据，适合流处理和事件管道，但背压和随机停止会更复杂；向量化 Pull 仍然由父节点拉，只是 next 返回一批列向量，把函数调用摊薄，改善 cache 和 SIMD；编译执行把表达式或算子路径编译成机器码，降低解释和分支开销，代价是编译启动成本与缓存失效的复杂度。单行 Pull 站在左上角这一格：接口最简单、状态控制最清楚、流式算子首行低，代价是每行函数调用明显、阻塞节点首行高。Volcano 论文的贡献不是「每行最快」，而是给执行器提供了高度可扩展的算子封装；并行 Volcano 论文进一步用 exchange operator 把并行性封起来，让普通算子不必感知生产者消费者进程。MonetDB/X100 论文反过来批评 tuple-at-a-time 在现代 CPU 上的解释开销，提出 vector-at-a-time。它们不是谁取代谁，而是针对不同 workload 的不同取舍。","ctrl":null,"disclaim":null},{"eyebrow":"交互演示 · 返回单位","title":"同样是 Pull，把「一行」换成「一批」会发生什么","lede":"改行数与批大小，观察 next() 调用次数被摊薄的过程。","svg":"<svg class=\"figure\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" role=\"img\" aria-label=\"SIMULATION 02 / 返回单位：一行 vs 一批\"><text x=\"0.0\" y=\"22.0\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"600\" text-anchor=\"start\" class=\"mono\">SIMULATION 02 / 返回单位：一行 vs 一批</text><text x=\"1400.0\" y=\"22.0\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"end\">输入行数与批大小 → 播放 / 单步 / 重置</text><rect x=\"0\" y=\"34\" width=\"1400\" height=\"1\" fill=\"#D9D5CB\"/><rect x=\"20.0\" y=\"60.0\" width=\"220.0\" height=\"76.0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"34.0\" y=\"92.9\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">传统单行 Pull</text><text x=\"34.0\" y=\"111.7\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">next() → 1 个 slot</text><rect x=\"20.0\" y=\"212.0\" width=\"220.0\" height=\"76.0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"34.0\" y=\"244.9\" font-size=\"17.0\" fill=\"#2F7A66\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">向量化 Pull</text><text x=\"34.0\" y=\"263.7\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">next() → 一批列向量</text><rect x=\"260.0\" y=\"60.0\" width=\"760.0\" height=\"76.0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><rect x=\"260.0\" y=\"212.0\" width=\"760.0\" height=\"76.0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><g id=\"vecTapeA\"></g><g id=\"vecTapeB\"></g><rect x=\"1040.0\" y=\"48.0\" width=\"340.0\" height=\"296.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"1056.0\" y=\"74.0\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">next() 调用次数</text><text x=\"1056.0\" y=\"116.0\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">单行侧</text><text id=\"vecC0\" x=\"1360\" y=\"119.0\" font-size=\"21\" fill=\"#245A6B\" font-family=\"monospace\" text-anchor=\"end\" font-weight=\"700\">0</text><text x=\"1056.0\" y=\"178.0\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">向量化侧</text><text id=\"vecC1\" x=\"1360\" y=\"181.0\" font-size=\"21\" fill=\"#2F7A66\" font-family=\"monospace\" text-anchor=\"end\" font-weight=\"700\">0</text><text x=\"1056.0\" y=\"240.0\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">当前进度</text><text id=\"vecC2\" x=\"1360\" y=\"243.0\" font-size=\"21\" fill=\"#2F7A66\" font-family=\"monospace\" text-anchor=\"end\" font-weight=\"700\">0</text><text x=\"1056.0\" y=\"296.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">一次调用处理 B 行</text><text x=\"1056.0\" y=\"318.0\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"start\">函数调用被摊薄，cache / SIMD 更友好</text><rect x=\"20.0\" y=\"356.0\" width=\"1360.0\" height=\"66.0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text id=\"vecExplain\" x=\"36\" y=\"384\" font-size=\"16\" fill=\"#1B2B33\" font-weight=\"700\">二者都可以是 Pull，只是 next() 的返回单位不同。</text><text x=\"36.0\" y=\"408.0\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"start\">示意：只比较 next() 调用次数，不代表真实耗时；向量化还带来批边界、NULL、selection vector、内存峰值与首行延迟问题。</text></svg>","caption":"图 15　原文图四的重绘与动画化：传统 PostgreSQL 围绕 tuple/slot；X100、DuckDB、DataFusion 更强调批量与列向量。","bridge":"为什么很多 OLTP 查询反而偏爱这套「不快」的骨架？","notes":"这一页把「返回单位」这件事量化一下，但只量化一个维度：next() 的调用次数。左边设总行数 N 和批大小 B，点播放。上面那条带子代表传统单行 Pull，一行就要一次函数调用；下面代表向量化 Pull，一次调用带回 B 行的列向量。每走一批，上面点亮 B 个小格，下面只点亮一个大块；右边两个计数器立刻分叉：单行侧是已处理的行数，向量化侧是批数。走到最后，调用次数是 N 对 ⌈N/B⌉。这就是 X100 那批系统想摊薄的东西：一次函数调用处理更多值，循环更紧凑，cache 和 SIMD 才有发挥空间。但请先别急着下「向量化一定更好」的结论——底部那行字更重要：批边界、NULL、selection vector、表达式状态、内存峰值、首行延迟都会变复杂，小结果 OLTP 不一定受益。这里只比较调用次序，不表示真实耗时。","ctrl":"<label>总行数 N</label><input id=\"vecN\" type=\"text\" value=\"24\" size=\"3\"><label>批大小 B</label><input id=\"vecB\" type=\"text\" value=\"8\" size=\"3\"><button class=\"btn play\" id=\"vecPlay\">▶ 播放</button><button class=\"btn\" id=\"vecStepBtn\">单步 →</button><button class=\"btn\" id=\"vecReset\">↺ 重置</button><span class=\"out\" id=\"vecOut\">改 N / B 后点播放</span>","disclaim":"演示为教学示意：仅比较 next() 调用次数，不代表实际耗时或吞吐量。"},{"eyebrow":"效果 · 收益清单","title":"为什么 OLTP 与混合负载里，这套骨架依然很稳","lede":"低耦合、天然短路、易解释、资源生命周期清楚、扩展友好。","svg":"<svg class=\"figure\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" role=\"img\" aria-label=\"FIG 16 / 五项结构性收益\"><text x=\"0.0\" y=\"22.0\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"600\" text-anchor=\"start\" class=\"mono\">FIG 16 / 五项结构性收益</text><text x=\"1400.0\" y=\"22.0\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"end\">为什么 OLTP 和混合负载里它很稳</text><rect x=\"0\" y=\"34\" width=\"1400\" height=\"1\" fill=\"#D9D5CB\"/><rect x=\"20.0\" y=\"48.0\" width=\"1360.0\" height=\"62.0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><rect x=\"20.0\" y=\"48.0\" width=\"62.0\" height=\"62.0\" fill=\"#2F7A66\"/><text x=\"51.0\" y=\"86.0\" font-size=\"18.0\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"middle\" class=\"mono\">01</text><text x=\"100.0\" y=\"87.0\" font-size=\"19.0\" fill=\"#2F7A66\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">低耦合</text><text x=\"360.0\" y=\"87.0\" font-size=\"15.0\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">每类 plan node 实现初始化 / 取下一行 / 结束 / 重扫，就能挂进执行树</text><rect x=\"20.0\" y=\"120.0\" width=\"1360.0\" height=\"62.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><rect x=\"20.0\" y=\"120.0\" width=\"62.0\" height=\"62.0\" fill=\"#2F7A66\"/><text x=\"51.0\" y=\"158.0\" font-size=\"18.0\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"middle\" class=\"mono\">02</text><text x=\"100.0\" y=\"159.0\" font-size=\"19.0\" fill=\"#2F7A66\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">天然短路</text><text x=\"360.0\" y=\"159.0\" font-size=\"15.0\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">LIMIT、EXISTS、游标 FETCH n 可以停止向下拉取</text><rect x=\"20.0\" y=\"192.0\" width=\"1360.0\" height=\"62.0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><rect x=\"20.0\" y=\"192.0\" width=\"62.0\" height=\"62.0\" fill=\"#2F7A66\"/><text x=\"51.0\" y=\"230.0\" font-size=\"18.0\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"middle\" class=\"mono\">03</text><text x=\"100.0\" y=\"231.0\" font-size=\"19.0\" fill=\"#2F7A66\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">易解释</text><text x=\"360.0\" y=\"231.0\" font-size=\"15.0\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">EXPLAIN 的 plan tree 与运行期调用树基本对应</text><rect x=\"20.0\" y=\"264.0\" width=\"1360.0\" height=\"62.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><rect x=\"20.0\" y=\"264.0\" width=\"62.0\" height=\"62.0\" fill=\"#2F7A66\"/><text x=\"51.0\" y=\"302.0\" font-size=\"18.0\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"middle\" class=\"mono\">04</text><text x=\"100.0\" y=\"303.0\" font-size=\"19.0\" fill=\"#2F7A66\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">资源生命周期清楚</text><text x=\"360.0\" y=\"303.0\" font-size=\"15.0\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">per-query context 管整个执行，per-tuple context 降低表达式求值泄漏风险</text><rect x=\"20.0\" y=\"336.0\" width=\"1360.0\" height=\"62.0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><rect x=\"20.0\" y=\"336.0\" width=\"62.0\" height=\"62.0\" fill=\"#2F7A66\"/><text x=\"51.0\" y=\"374.0\" font-size=\"18.0\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"middle\" class=\"mono\">05</text><text x=\"100.0\" y=\"375.0\" font-size=\"19.0\" fill=\"#2F7A66\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">扩展友好</text><text x=\"360.0\" y=\"375.0\" font-size=\"15.0\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">ForeignScan、CustomScan、执行器 hook 都能嵌进统一接口</text></svg>","caption":"图 16　五项结构性收益，都直接来自「父按需拉、子封装状态」这条控制协议。","bridge":"收益是结构性的，代价同样也是结构性的。","notes":"把收益摊开数一遍，会发现它们全是同一条控制协议的推论。低耦合：每类 plan node 只要实现初始化、取下一行、结束、重扫这几个接口，就能挂进执行树，新增算子不用改动邻居。天然短路：LIMIT、EXISTS、游标 FETCH n 说停就停，下层立刻不再生产。易解释：EXPLAIN 打印出来的 plan tree 和运行期调用树基本对应，DBA 看到的名字和真实发生的调用是对得上的，这在排障时太值钱了。资源生命周期清楚：per-query context 管整个执行，per-tuple context 每个 tuple 重置一次，表达式求值里的内存泄漏风险被关进小盒子里。扩展友好：ForeignScan、CustomScan、执行器 hook 都能嵌进这套统一接口。你会发现，这些都不是「算得快」，而是「好控制、好扩展、好排障」——正好是 OLTP 和混合负载最在意的东西。","ctrl":null,"disclaim":null},{"eyebrow":"效果 · 代价清单","title":"代价不是缺陷，是「单行」这个粒度的必然结果","lede":"per-tuple CPU、cache 局部性、SIMD、阻塞节点、并行协议，五项都要单独看。","svg":"<svg class=\"figure\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" role=\"img\" aria-label=\"FIG 17 / 五项代价\"><text x=\"0.0\" y=\"22.0\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"600\" text-anchor=\"start\" class=\"mono\">FIG 17 / 五项代价</text><text x=\"1400.0\" y=\"22.0\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"end\">代价不是缺陷，是单行粒度的必然结果</text><rect x=\"0\" y=\"34\" width=\"1400\" height=\"1\" fill=\"#D9D5CB\"/><rect x=\"20.0\" y=\"48.0\" width=\"1360.0\" height=\"62.0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><rect x=\"20.0\" y=\"48.0\" width=\"62.0\" height=\"62.0\" fill=\"#BE653B\"/><text x=\"51.0\" y=\"86.0\" font-size=\"18.0\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"middle\" class=\"mono\">01</text><text x=\"100.0\" y=\"87.0\" font-size=\"18.0\" fill=\"#BE653B\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">CPU per-tuple overhead</text><text x=\"420.0\" y=\"87.0\" font-size=\"15.0\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">每行经过多层 ExecProcNode、qual、projection、slot 访问和表达式求值</text><rect x=\"20.0\" y=\"120.0\" width=\"1360.0\" height=\"62.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><rect x=\"20.0\" y=\"120.0\" width=\"62.0\" height=\"62.0\" fill=\"#BE653B\"/><text x=\"51.0\" y=\"158.0\" font-size=\"18.0\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"middle\" class=\"mono\">02</text><text x=\"100.0\" y=\"159.0\" font-size=\"18.0\" fill=\"#BE653B\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">cache locality 不一定好</text><text x=\"420.0\" y=\"159.0\" font-size=\"15.0\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">tuple-at-a-time 常在不同函数和数据结构之间跳转</text><rect x=\"20.0\" y=\"192.0\" width=\"1360.0\" height=\"62.0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><rect x=\"20.0\" y=\"192.0\" width=\"62.0\" height=\"62.0\" fill=\"#BE653B\"/><text x=\"51.0\" y=\"230.0\" font-size=\"18.0\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"middle\" class=\"mono\">03</text><text x=\"100.0\" y=\"231.0\" font-size=\"18.0\" fill=\"#BE653B\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">SIMD / 批处理利用不足</text><text x=\"420.0\" y=\"231.0\" font-size=\"15.0\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">单行接口天然不如列向量适合批量比较、过滤、聚合</text><rect x=\"20.0\" y=\"264.0\" width=\"1360.0\" height=\"62.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><rect x=\"20.0\" y=\"264.0\" width=\"62.0\" height=\"62.0\" fill=\"#BE653B\"/><text x=\"51.0\" y=\"302.0\" font-size=\"18.0\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"middle\" class=\"mono\">04</text><text x=\"100.0\" y=\"303.0\" font-size=\"18.0\" fill=\"#BE653B\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">阻塞节点仍然可能重</text><text x=\"420.0\" y=\"303.0\" font-size=\"15.0\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">Sort / Hash / Aggregate 的内存、临时文件、首行延迟不是 Pull 接口能消除的</text><rect x=\"20.0\" y=\"336.0\" width=\"1360.0\" height=\"62.0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><rect x=\"20.0\" y=\"336.0\" width=\"62.0\" height=\"62.0\" fill=\"#BE653B\"/><text x=\"51.0\" y=\"374.0\" font-size=\"18.0\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"middle\" class=\"mono\">05</text><text x=\"100.0\" y=\"375.0\" font-size=\"18.0\" fill=\"#BE653B\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">并行需要额外协议</text><text x=\"420.0\" y=\"375.0\" font-size=\"15.0\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">Gather / GatherMerge、parallel scan、DSM、worker instrumentation</text><text x=\"0.0\" y=\"414.0\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">结论不贴标签：OLTP 与混合负载里很实用，OLAP 里通常要靠向量化、批处理、JIT、并行与列存补强。</text></svg>","caption":"图 17　五项代价；第 4 项提醒 Pull 接口无法消除阻塞节点的内存、临时文件与首行延迟。","bridge":"既然代价落在这些地方，读计划时就要有针对性地找它们。","notes":"对应的代价也一条条摆出来。第一，CPU per-tuple overhead：每行都要穿过 ExecProcNode、qual、projection、slot 访问和表达式求值，层数乘以行数就是固定成本。第二，cache locality 不一定好：tuple-at-a-time 会在不同函数和数据结构之间来回跳。第三，SIMD 和批处理利用不足：单行接口天然不如列向量适合批量比较、过滤、聚合。第四，阻塞节点仍然可能重：Sort、Hash、Aggregate 的内存、临时文件、首行延迟，不是 Pull 接口能消除的，这点前面已经亲眼见过。第五，并行需要额外协议：Gather、GatherMerge、parallel scan、DSM、worker instrumentation，不是把每个 iterator 自动并行就完事。所以结论别贴成一句话：OLTP 和混合负载里它很实用，大规模 OLAP 里通常要由向量化、批处理、JIT、并行和列式存储来补强。真正专业的判断，永远是回到 workload。","ctrl":null,"disclaim":null},{"eyebrow":"实操 · 读 EXPLAIN","title":"读计划不是认节点名字，而是问「谁在拉谁」","lede":"缩进是父子关系；loops、startup time、Buffers 才是 Pull 模型留下的痕迹。","svg":"<svg class=\"figure\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" role=\"img\" aria-label=\"FIG 18 / 用 EXPLAIN 看出真实执行行为\"><text x=\"0.0\" y=\"22.0\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"600\" text-anchor=\"start\" class=\"mono\">FIG 18 / 用 EXPLAIN 看出真实执行行为</text><text x=\"1400.0\" y=\"22.0\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"end\">缩进是父子关系，执行不是从左到右打印</text><rect x=\"0\" y=\"34\" width=\"1400\" height=\"1\" fill=\"#D9D5CB\"/><rect x=\"20.0\" y=\"48.0\" width=\"380.0\" height=\"58.0\" fill=\"#EBF1EE\"/><text x=\"34.0\" y=\"80.5\" font-size=\"16.5\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"start\" class=\"mono\">Limit</text><path d=\"M400.0 77.0 H452.0\" fill=\"none\" stroke=\"#7BA6AF\" stroke-width=\"1.4\"/><rect x=\"448.0\" y=\"73.0\" width=\"8.0\" height=\"8.0\" fill=\"#7BA6AF\"/><rect x=\"452.0\" y=\"48.0\" width=\"258.0\" height=\"58.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"466.0\" y=\"79.9\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">拉够就停</text><rect x=\"38.0\" y=\"118.0\" width=\"362.0\" height=\"58.0\" fill=\"#F7E9DE\"/><text x=\"52.0\" y=\"150.5\" font-size=\"16.5\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"start\" class=\"mono\">Sort</text><path d=\"M400.0 147.0 H452.0\" fill=\"none\" stroke=\"#7BA6AF\" stroke-width=\"1.4\"/><rect x=\"448.0\" y=\"143.0\" width=\"8.0\" height=\"8.0\" fill=\"#7BA6AF\"/><rect x=\"452.0\" y=\"118.0\" width=\"258.0\" height=\"58.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"466.0\" y=\"149.9\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">首行要等全量输入</text><rect x=\"56.0\" y=\"188.0\" width=\"344.0\" height=\"58.0\" fill=\"#A4C4C6\"/><text x=\"70.0\" y=\"220.5\" font-size=\"16.5\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"start\" class=\"mono\">Nested Loop</text><path d=\"M400.0 217.0 H452.0\" fill=\"none\" stroke=\"#7BA6AF\" stroke-width=\"1.4\"/><rect x=\"448.0\" y=\"213.0\" width=\"8.0\" height=\"8.0\" fill=\"#7BA6AF\"/><rect x=\"452.0\" y=\"188.0\" width=\"258.0\" height=\"58.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"466.0\" y=\"219.9\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">父节点按需拉子节点</text><rect x=\"74.0\" y=\"258.0\" width=\"326.0\" height=\"58.0\" fill=\"#2E6373\"/><text x=\"88.0\" y=\"290.5\" font-size=\"16.5\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"start\" class=\"mono\">Seq Scan (outer)</text><path d=\"M400.0 287.0 H452.0\" fill=\"none\" stroke=\"#7BA6AF\" stroke-width=\"1.4\"/><rect x=\"448.0\" y=\"283.0\" width=\"8.0\" height=\"8.0\" fill=\"#7BA6AF\"/><rect x=\"452.0\" y=\"258.0\" width=\"258.0\" height=\"58.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"466.0\" y=\"289.9\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">提供 outer tuple</text><rect x=\"92.0\" y=\"328.0\" width=\"308.0\" height=\"58.0\" fill=\"#1E4B5A\"/><text x=\"106.0\" y=\"360.5\" font-size=\"16.5\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"start\" class=\"mono\">Index Scan (inner)</text><path d=\"M400.0 357.0 H452.0\" fill=\"none\" stroke=\"#7BA6AF\" stroke-width=\"1.4\"/><rect x=\"448.0\" y=\"353.0\" width=\"8.0\" height=\"8.0\" fill=\"#7BA6AF\"/><rect x=\"452.0\" y=\"328.0\" width=\"258.0\" height=\"58.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"466.0\" y=\"359.9\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">loops 接近外层实际行数</text><rect x=\"740.0\" y=\"48.0\" width=\"640.0\" height=\"74.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"756.0\" y=\"78.0\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">① 谁在拉谁</text><text x=\"756.0\" y=\"106.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">缩进 = 父子关系；实际执行是父节点按需拉子节点，不是打印顺序</text><rect x=\"740.0\" y=\"132.0\" width=\"640.0\" height=\"74.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"756.0\" y=\"162.0\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">② 拉了多少次</text><text x=\"756.0\" y=\"190.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">loops 是节点执行次数；actual time / rows 是每次平均值，总量要乘 loops</text><rect x=\"740.0\" y=\"216.0\" width=\"640.0\" height=\"74.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"756.0\" y=\"246.0\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">③ 哪里被迫全吃</text><text x=\"756.0\" y=\"274.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">startup cost / actual startup time 反映 Sort、Hash、Aggregate 等阻塞节点</text><rect x=\"740.0\" y=\"300.0\" width=\"640.0\" height=\"74.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"756.0\" y=\"330.0\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">④ IO 与内存</text><text x=\"756.0\" y=\"358.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">Buffers、temp blocks 看排序 / 哈希 / 物化的溢写；Pull 接口不等于低 IO</text><text x=\"0.0\" y=\"414.0\" font-size=\"12.5\" fill=\"#BE653B\" font-weight=\"400\" text-anchor=\"start\">有副作用的 EXPLAIN ANALYZE 会真正执行语句：DML 用 BEGIN; EXPLAIN ANALYZE ...; ROLLBACK; 包住。</text></svg>","caption":"图 18　左侧为示意计划树（不含任何编造的数值），右侧为四条阅读规则。","bridge":"规则有了，用四个可复现的 DEMO 去验证它们。","notes":"现在把这套模型翻译成看 EXPLAIN 的动作。左边是一棵示意计划树，注意我不写任何具体数值，因为原文没有给出运行输出。第一条：缩进表示父子关系，但实际执行不是从左到右打印，而是父节点按需拉子节点。第二条：loops 是节点被执行的次数，官方文档明确说 actual time 和 rows 是每次执行的平均值，总耗时得乘 loops，这样才和 cost 估计可比。第三条：startup cost 和 actual startup time 帮你找 Sort、Hash、Aggregate、Materialize 这类把首行往后推的节点，LIMIT 不会自动绕过它们。第四条：Buffers 和 temp blocks 告诉你排序、哈希、物化有没有溢写，Pull 接口绝不等于低 IO。最后加一条安全提醒：EXPLAIN ANALYZE 会真的执行语句，对有副作用的 DML，务必用 BEGIN、EXPLAIN ANALYZE、ROLLBACK 包起来。把这四条记住，计划树就不再是一串名字，而是一张调用图。","ctrl":null,"disclaim":null},{"eyebrow":"实操 · 四个 DEMO","title":"四个可复现实验，分别验证早停、阻塞、loops 与例外","lede":"用 EXPLAIN (ANALYZE, BUFFERS) 观察，原文 SQL 可执行。","svg":"<svg class=\"figure\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" role=\"img\" aria-label=\"FIG 19 / 四个可复现的观察点\"><text x=\"0.0\" y=\"22.0\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"600\" text-anchor=\"start\" class=\"mono\">FIG 19 / 四个可复现的观察点</text><text x=\"1400.0\" y=\"22.0\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"end\">原文 SQL 可执行；作者未提供运行输出，此处不编造统计数字</text><rect x=\"0\" y=\"34\" width=\"1400\" height=\"1\" fill=\"#D9D5CB\"/><rect x=\"20.0\" y=\"48.0\" width=\"680.0\" height=\"166.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><rect x=\"20.0\" y=\"48.0\" width=\"680.0\" height=\"34.0\" fill=\"#245A6B\"/><text x=\"34.0\" y=\"72.0\" font-size=\"15.0\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">DEMO 01 · LIMIT 早停</text><rect x=\"34.0\" y=\"94.0\" width=\"652.0\" height=\"46.0\" fill=\"#F1EFE9\"/><text x=\"46.0\" y=\"123.0\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" text-anchor=\"start\" class=\"mono\">SELECT * FROM demo_orders WHERE amount &gt; 900 LIMIT 10;</text><text x=\"36.0\" y=\"170.0\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"700\" text-anchor=\"start\" class=\"mono\">观察</text><text x=\"36.0\" y=\"194.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">Limit 拉到 10 行后停止；选择性低时仍可能读很多页</text><rect x=\"720.0\" y=\"48.0\" width=\"680.0\" height=\"166.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><rect x=\"720.0\" y=\"48.0\" width=\"680.0\" height=\"34.0\" fill=\"#245A6B\"/><text x=\"734.0\" y=\"72.0\" font-size=\"15.0\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">DEMO 02 · Sort 首行延迟</text><rect x=\"734.0\" y=\"94.0\" width=\"652.0\" height=\"46.0\" fill=\"#F1EFE9\"/><text x=\"746.0\" y=\"123.0\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" text-anchor=\"start\" class=\"mono\">... ORDER BY created_at DESC LIMIT 10;</text><text x=\"736.0\" y=\"170.0\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"700\" text-anchor=\"start\" class=\"mono\">观察</text><text x=\"736.0\" y=\"194.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">Sort / top-N heapsort 首次调用先消费输入；看 Sort Method、Memory、Disk</text><rect x=\"20.0\" y=\"226.0\" width=\"680.0\" height=\"166.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><rect x=\"20.0\" y=\"226.0\" width=\"680.0\" height=\"34.0\" fill=\"#245A6B\"/><text x=\"34.0\" y=\"250.0\" font-size=\"15.0\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">DEMO 03 · Nested Loop 的 loops</text><rect x=\"34.0\" y=\"272.0\" width=\"652.0\" height=\"46.0\" fill=\"#F1EFE9\"/><text x=\"46.0\" y=\"301.0\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" text-anchor=\"start\" class=\"mono\">... JOIN demo_customers c ON c.id = o.customer_id ...</text><text x=\"36.0\" y=\"348.0\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"700\" text-anchor=\"start\" class=\"mono\">观察</text><text x=\"36.0\" y=\"372.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">内层 Index Scan 的 loops 接近外层实际行数；平均值乘 loops 才是总量</text><rect x=\"720.0\" y=\"226.0\" width=\"680.0\" height=\"166.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><rect x=\"720.0\" y=\"226.0\" width=\"680.0\" height=\"34.0\" fill=\"#245A6B\"/><text x=\"734.0\" y=\"250.0\" font-size=\"15.0\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">DEMO 04 · BitmapIndexScan 例外</text><rect x=\"734.0\" y=\"272.0\" width=\"652.0\" height=\"46.0\" fill=\"#F1EFE9\"/><text x=\"746.0\" y=\"301.0\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" text-anchor=\"start\" class=\"mono\">... WHERE amount &gt; 990 AND customer_id BETWEEN 100 AND 200;</text><text x=\"736.0\" y=\"348.0\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"700\" text-anchor=\"start\" class=\"mono\">观察</text><text x=\"736.0\" y=\"372.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">可能出现 BitmapAnd / Bitmap Heap Scan；走 MultiExecProcNode 生成 TIDBitmap</text><text x=\"0.0\" y=\"414.0\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">统一用 EXPLAIN (ANALYZE, BUFFERS) 观察；四个 DEMO 分别对应早停、阻塞、loops 放大与工程例外。</text></svg>","caption":"图 19　四个 DEMO 与各自的观察点；作者未在当前环境启动实例运行，因此不提供任何伪造输出。","bridge":"能解释现象之后，就该把它变成各自岗位上的动作。","notes":"原文的实操部分给了四个可以在任意 PostgreSQL 测试库里跑的例子，这里把观察点对齐到我们刚讲的原理。第一个，建二十万行 demo_orders，用 WHERE amount > 900 LIMIT 10，看 Limit 拉到十行就停，下层扫描实际返回的行数可能远小于完整匹配数；但如果过滤选择性低，为了凑够十行仍可能读很多页。第二个，加上 ORDER BY created_at DESC，看计划里出现 Sort 或者 top-N heapsort，首行必然要等；EXPLAIN ANALYZE 里的 Sort Method、Memory、Disk 会告诉你用了内存还是临时文件。第三个，join 上 demo_customers 并 LIMIT 20，如果走 Nested Loop，内层索引扫描的 loops 通常接近外层实际行数。第四个，建两个索引后跑范围条件，计划可能出现 Bitmap Index Scan、BitmapAnd、Bitmap Heap Scan，正好对应上一页讲的 MultiExecProcNode 例外。原文作者明确说没有启动实例运行，所以这里一个统计数字都不编。","ctrl":null,"disclaim":null},{"eyebrow":"最佳实践 · 三类角色","title":"架构师选形态，DBA 看数字，开发者写能被早停的 SQL","lede":"同一套原理，落到不同岗位上是三张完全不同的检查表。","svg":"<svg class=\"figure\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" role=\"img\" aria-label=\"FIG 20 / 三类角色的最佳实践\"><text x=\"0.0\" y=\"22.0\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"600\" text-anchor=\"start\" class=\"mono\">FIG 20 / 三类角色的最佳实践</text><text x=\"1400.0\" y=\"22.0\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"end\">把「谁在拉谁」翻译成各自可执行的动作</text><rect x=\"0\" y=\"34\" width=\"1400\" height=\"1\" fill=\"#D9D5CB\"/><rect x=\"20.0\" y=\"48.0\" width=\"440.0\" height=\"360.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><rect x=\"20.0\" y=\"48.0\" width=\"440.0\" height=\"44.0\" fill=\"#245A6B\"/><text x=\"36.0\" y=\"77.0\" font-size=\"17.0\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">面向数据库架构师</text><rect x=\"36.0\" y=\"112.0\" width=\"6.0\" height=\"6.0\" fill=\"#245A6B\"/><text x=\"52.0\" y=\"128.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">按 workload 选执行引擎形态</text><text x=\"52.0\" y=\"150.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">OLTP 用成熟单行 Pull；大规模分析</text><text x=\"52.0\" y=\"172.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">评估向量化 / 列存 / 并行 / JIT</text><rect x=\"36.0\" y=\"212.0\" width=\"6.0\" height=\"6.0\" fill=\"#245A6B\"/><text x=\"52.0\" y=\"228.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">不要只比「有没有向量化」</text><text x=\"52.0\" y=\"250.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">存储布局、表达式、join 算法、</text><text x=\"52.0\" y=\"272.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">内存、调度是一条完整链路</text><rect x=\"36.0\" y=\"312.0\" width=\"6.0\" height=\"6.0\" fill=\"#245A6B\"/><text x=\"52.0\" y=\"328.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">首行延迟与总吞吐分开设计</text><text x=\"52.0\" y=\"350.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">在线页面看前 N 行，离线报表</text><text x=\"52.0\" y=\"372.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">看总吞吐</text><rect x=\"480.0\" y=\"48.0\" width=\"440.0\" height=\"360.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><rect x=\"480.0\" y=\"48.0\" width=\"440.0\" height=\"44.0\" fill=\"#2F7A66\"/><text x=\"496.0\" y=\"77.0\" font-size=\"17.0\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">面向 DBA</text><rect x=\"496.0\" y=\"112.0\" width=\"6.0\" height=\"6.0\" fill=\"#2F7A66\"/><text x=\"512.0\" y=\"128.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">看 loops，不只看单节点 rows</text><text x=\"512.0\" y=\"150.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">Nested Loop 内层要乘起来</text><text x=\"512.0\" y=\"172.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">才是实际访问量</text><rect x=\"496.0\" y=\"212.0\" width=\"6.0\" height=\"6.0\" fill=\"#2F7A66\"/><text x=\"512.0\" y=\"228.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">看 startup cost 与</text><text x=\"512.0\" y=\"250.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">actual startup time；</text><text x=\"512.0\" y=\"272.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">LIMIT 不能自动绕过所有阻塞节点</text><rect x=\"496.0\" y=\"312.0\" width=\"6.0\" height=\"6.0\" fill=\"#2F7A66\"/><text x=\"512.0\" y=\"328.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">看 Buffers 与 temp blocks</text><text x=\"512.0\" y=\"350.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">有副作用的 EXPLAIN ANALYZE</text><text x=\"512.0\" y=\"372.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">要用事务保护</text><rect x=\"940.0\" y=\"48.0\" width=\"440.0\" height=\"360.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><rect x=\"940.0\" y=\"48.0\" width=\"440.0\" height=\"44.0\" fill=\"#BE653B\"/><text x=\"956.0\" y=\"77.0\" font-size=\"17.0\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">面向业务开发者</text><rect x=\"956.0\" y=\"112.0\" width=\"6.0\" height=\"6.0\" fill=\"#BE653B\"/><text x=\"972.0\" y=\"128.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">LIMIT 只在计划能早停时才有效</text><text x=\"972.0\" y=\"150.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">前面有排序 / 聚合 / 去重</text><text x=\"972.0\" y=\"172.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">仍可能先处理大量输入</text><rect x=\"956.0\" y=\"212.0\" width=\"6.0\" height=\"6.0\" fill=\"#BE653B\"/><text x=\"972.0\" y=\"228.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">别把可索引过滤藏进表达式</text><text x=\"972.0\" y=\"250.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">让扫描节点少返回 tuple</text><text x=\"972.0\" y=\"272.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">比在上层过滤更重要</text><rect x=\"956.0\" y=\"312.0\" width=\"6.0\" height=\"6.0\" fill=\"#BE653B\"/><text x=\"972.0\" y=\"328.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">分页用稳定顺序和合适索引</text><text x=\"972.0\" y=\"350.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">读懂 EXPLAIN 树形缩进</text><text x=\"972.0\" y=\"372.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">所指的父子关系</text></svg>","caption":"图 20　面向架构师、DBA、业务开发者的实践要点，均来自原文的对应章节。","bridge":"动作清单之外，还有几个反复踩到的认知误区。","notes":"原理要变成动作，三个岗位各有一张清单。架构师这边：按 workload 选执行引擎形态，OLTP、点查、小范围、复杂事务优先用成熟的单行 Pull；大规模交互式分析、宽表扫描、聚合，要认真评估向量化、列存、并行和 JIT。别只比「有没有向量化」，真正决定系统的是存储布局、压缩、表达式、join 与聚合算法、内存管理、并发控制、溢写、统计信息和调度这一整条链。还要把首行延迟和总吞吐分开设计。DBA 这边：看 loops 不只看单节点 rows；看 startup cost 与 actual startup time；看 Buffers 和 temp blocks；有副作用的 EXPLAIN ANALYZE 用事务保护。业务开发者这边：LIMIT 只在计划能早停时才显著有效；别把可索引过滤藏进表达式里，让扫描节点少返回 tuple 比在上层过滤更重要；分页用稳定顺序加合适索引；读懂树形缩进所指的父子关系。同一套「谁在拉谁」，三张清单，互不重复。","ctrl":null,"disclaim":null},{"eyebrow":"边界 · 六个常见坑","title":"把模型的边界看清楚，才不会误读执行计划","lede":"最常见的一类错误，是把主干抽象当成系统全部行为。","svg":"<svg class=\"figure\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" role=\"img\" aria-label=\"FIG 21 / 六个常见坑\"><text x=\"0.0\" y=\"22.0\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"600\" text-anchor=\"start\" class=\"mono\">FIG 21 / 六个常见坑</text><text x=\"1400.0\" y=\"22.0\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"end\">把模型边界看清楚，才不会误读执行计划</text><rect x=\"0\" y=\"34\" width=\"1400\" height=\"1\" fill=\"#D9D5CB\"/><rect x=\"20.0\" y=\"48.0\" width=\"1360.0\" height=\"54.0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"36.0\" y=\"82.0\" font-size=\"16.0\" fill=\"#BE653B\" font-weight=\"700\" text-anchor=\"start\" class=\"mono\">01</text><text x=\"80.0\" y=\"82.0\" font-size=\"17.0\" fill=\"#BE653B\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">把 Volcano 等同于 PostgreSQL 全部执行行为</text><text x=\"560.0\" y=\"82.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">BitmapIndexScan、Hash、BitmapAnd/Or 走 MultiExecProcNode；并行另有 DSM / Gather</text><rect x=\"20.0\" y=\"109.0\" width=\"1360.0\" height=\"54.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"36.0\" y=\"143.0\" font-size=\"16.0\" fill=\"#BE653B\" font-weight=\"700\" text-anchor=\"start\" class=\"mono\">02</text><text x=\"80.0\" y=\"143.0\" font-size=\"17.0\" fill=\"#BE653B\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">以为 LIMIT 一定少读数据</text><text x=\"560.0\" y=\"143.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">LIMIT 能停止上层继续拉，但下层排序、聚合、去重仍可能先处理大量输入</text><rect x=\"20.0\" y=\"170.0\" width=\"1360.0\" height=\"54.0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"36.0\" y=\"204.0\" font-size=\"16.0\" fill=\"#BE653B\" font-weight=\"700\" text-anchor=\"start\" class=\"mono\">03</text><text x=\"80.0\" y=\"204.0\" font-size=\"17.0\" fill=\"#BE653B\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">忽略 slot 的生命周期</text><text x=\"560.0\" y=\"204.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">slot 可能引用下层 buffer 或 per-tuple context；跨下一次 ExecProcNode() 要拷贝或物化</text><rect x=\"20.0\" y=\"231.0\" width=\"1360.0\" height=\"54.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"36.0\" y=\"265.0\" font-size=\"16.0\" fill=\"#BE653B\" font-weight=\"700\" text-anchor=\"start\" class=\"mono\">04</text><text x=\"80.0\" y=\"265.0\" font-size=\"17.0\" fill=\"#BE653B\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">看 EXPLAIN ANALYZE 不乘 loops</text><text x=\"560.0\" y=\"265.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">内层节点的 actual rows / time 是每次执行的平均值，总量要乘 loops</text><rect x=\"20.0\" y=\"292.0\" width=\"1360.0\" height=\"54.0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"36.0\" y=\"326.0\" font-size=\"16.0\" fill=\"#BE653B\" font-weight=\"700\" text-anchor=\"start\" class=\"mono\">05</text><text x=\"80.0\" y=\"326.0\" font-size=\"17.0\" fill=\"#BE653B\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">用玩具表外推生产表</text><text x=\"560.0\" y=\"326.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">计划成本不是简单线性外推；小表一页数据即使有索引也可能选择顺序扫描</text><rect x=\"20.0\" y=\"353.0\" width=\"1360.0\" height=\"54.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"36.0\" y=\"387.0\" font-size=\"16.0\" fill=\"#BE653B\" font-weight=\"700\" text-anchor=\"start\" class=\"mono\">06</text><text x=\"80.0\" y=\"387.0\" font-size=\"17.0\" fill=\"#BE653B\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">把向量化理解成无条件更好</text><text x=\"560.0\" y=\"387.0\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">改善吞吐，但带来批边界、NULL、选择向量、表达式状态、内存峰值与首行延迟</text></svg>","caption":"图 21　六个常见误区，前两个正好对应开头「LIMIT 有时不灵」与「Volcano 不是全部执行行为」。","bridge":"边界清楚了，最后一个问题就是：什么场景该用它，什么场景该补强。","notes":"把最容易踩的坑集中过一遍。第一，把 Volcano 等同于 PostgreSQL 的全部执行行为——主干是 Pull，但 BitmapIndexScan、Hash、BitmapAnd/Or 走 MultiExecProcNode，并行还有 DSM 和 Gather。第二，以为 LIMIT 一定少读数据——它能停的是上层继续拉，下层若必须排序、聚合、去重，仍会先处理大量输入，开头那个困惑到这里彻底闭环。第三，忽略 slot 生命周期——想跨下一次 ExecProcNode 保存数据，得拷贝或物化。第四，看 EXPLAIN ANALYZE 不乘 loops——显示的 rows 和 time 是每次执行的平均值。第五，用玩具表外推生产表——成本不是简单线性外推，小表一页数据即使有索引也可能走顺序扫描。第六，把向量化当成无条件更好——吞吐上去了，批边界、NULL、选择向量、表达式状态、内存峰值和首行延迟都跟着变复杂，小结果 OLTP 未必受益。这六条与其说是坑，不如说是模型的边界条件。","ctrl":null,"disclaim":null},{"eyebrow":"适用边界 · 场景判断","title":"判断要回到 workload：首行延迟，还是总吞吐","lede":"适合小结果、低首行延迟、复杂组合；大扫描与高吞吐需要补强。","svg":"<svg class=\"figure\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" role=\"img\" aria-label=\"FIG 22 / 适合与不适合的场景\"><text x=\"0.0\" y=\"22.0\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"600\" text-anchor=\"start\" class=\"mono\">FIG 22 / 适合与不适合的场景</text><text x=\"1400.0\" y=\"22.0\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"end\">判断要回到 workload：首行延迟 vs 总吞吐</text><rect x=\"0\" y=\"34\" width=\"1400\" height=\"1\" fill=\"#D9D5CB\"/><text x=\"20.0\" y=\"62.0\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\">小结果 · 低首行延迟 · 复杂组合</text><text x=\"1380.0\" y=\"62.0\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"700\" text-anchor=\"end\">大扫描 · 高吞吐 · CPU 密集</text><path d=\"M40.0 92.0 H1360.0\" fill=\"none\" stroke=\"#D9D5CB\" stroke-width=\"2.0\"/><rect x=\"35.0\" y=\"87.0\" width=\"10.0\" height=\"10.0\" fill=\"#2F7A66\"/><rect x=\"1355.0\" y=\"87.0\" width=\"10.0\" height=\"10.0\" fill=\"#BE653B\"/><text x=\"700.0\" y=\"84.0\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"middle\">workload 连续谱</text><rect x=\"20.0\" ont-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">iterator、算子可扩展性与并行执行</text><rect x=\"896.0\" y=\"158.0\" width=\"468.0\" height=\"54.0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"910.0\" y=\"180.4\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">并行 Volcano 论文</text><text x=\"910.0\" y=\"197.9\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">exchange operator 封装并行性</text><rect x=\"896.0\" y=\"220.0\" width=\"468.0\" height=\"54.0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"910.0\" y=\"242.4\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">MonetDB/X100 论文</text><text x=\"910.0\" y=\"259.9\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">vector-at-a-time 与现代 CPU 开销</text><text x=\"896.0\" y=\"300.0\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"700\" text-anchor=\"start\" class=\"serif\">源码入口</text><text x=\"896.0\" y=\"326.0\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" class=\"mono\">executor/README</text><text x=\"896.0\" y=\"347.0\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" class=\"mono\">execProcnode.c</text><text x=\"896.0\" y=\"368.0\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" class=\"mono\">execMain.c</text><text x=\"896.0\" y=\"389.0\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" class=\"mono\">nodeSeqscan.c / nodeSort.c</text><text x=\"0.0\" y=\"414.0\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\">论文题名与链接见原文；原文已说明「Temporal」题名未找到可核验的一手记录，本页按公开可核验的经典题名引用。</text></svg>","caption":"图 23　四问与扩展阅读；论文题名按原文已核验的经典题名引用，源码入口列在右侧。","bridge":"（终）把这四个问题带回你的下一条慢 SQL。","notes":"收个尾。传统单行 Pull 的本质不是慢，也不是旧，而是一种稳定的控制协议：父节点按需拉取，子节点封装状态，tuple 逐行向上流动。PostgreSQL 用 ExecProcNode、PlanState、TupleTableSlot 把它落成了非常干净的工程结构。真正的判断要回到 workload：小结果、低首行延迟、复杂组合、扩展性，它很强；大扫描、高吞吐、CPU 密集分析，就要靠向量化、批处理、JIT、并行和列存来补强。所以下次打开 EXPLAIN，请默念四个问题：谁在拉谁？拉了多少次？哪里被迫先吃完整个输入？哪里可以提前停止？能答上来，你就不再是在认节点名字，而是在读一张真实的调用图。想继续深挖，右边列了三篇论文和四个源码入口；原文还留了五个扩展问题，比如把 ExecProcNode 的返回单位改成一批 slot 要动哪些层，很适合当作下一课的起点。","ctrl":null,"disclaim":null}];
const N = D.length;

/* ===== 16:9 等比缩放 + letterbox；右侧讲稿开窗时舞台矢量缩放到左侧 ===== */
function fit(){
  const vp = $('#viewport');
  const W = vp.clientWidth, H = vp.clientHeight;
  const docked = document.body.classList.contains('docked');
  const dw = docked ? $('#dock').getBoundingClientRect().width : 0;
  const avail = Math.max(320, W - dw);
  const s = Math.min(avail/1600, H/900);
  const st = $('#stage');
  st.style.transform = 'scale(' + s + ')';
  st.style.left = ((avail - 1600*s)/2) + 'px';
  st.style.top  = ((H -  900*s)/2) + 'px';
}
window.addEventListener('resize', fit);

    + '<span class="fl">数据库筑基课 · 查询执行引擎 · 单行 Pull / Volcano</span>'
    + '<span class="fr">'+String(i+1).padStart(2,'0')+' / '+String(N).padStart(2,'0')+'</span></div>'
    + '</section>').join('');
}
function go(i, silent){
  i = Math.max(0, Math.min(N-1, i));
  pauseAllAnims();
  $$('.slide').forEach((el,k)=>el.classList.toggle('on', k===i));
  cur = i;
  try{ localStorage.setItem('volcano-pull-slide', String(i)); }catch(e){}
  $('#pg').textContent = String(i+1).padStart(2,'0') + ' / ' + String(N).padStart(2,'0');
  $('#track i').style.width = ((i+1)/N*100)+'%';
  for(let k=0;k<N;k++){ const b=$('#fbar'+k); if(b) b.style.width = (k<=i?100:0)+'%'; }
  if(dockMode==='notes') renderDock('notes');
  else if(dockMode==='all') syncAllDock();
  else if(dockMode==='toc') renderDock('toc');
  if(!silent) toast(D[i].eyebrow + ' · ' + D[i].title);
}
function next(){ if(cur<N-1) go(cur+1); else stopAuto(); }
function prev(){ if(cur>0) go(cur-1); }
function jump(i){ closeDock(); go(i); }
function toast(s){
  const t=$('#toast'); t.textContent=s; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1700);
}
/* ===== 自动播放 ===== */
function stopAuto(){
  autoOn=false; clearInterval(autoTimer); autoTimer=null;
  $('#btnAuto').textContent='▶ 自动播放 P'; $('#btnAuto').classList.remove('act');
}
function toggleAuto(){
  if(autoOn){ stopAuto(); toast('已暂停自动播放'); return; }
  autoOn=true; $('#btnAuto').textContent='❚❚ 暂停 P'; $('#btnAuto').classList.add('act');
  autoTimer=setInterval(()=>{ if(cur<N-1) go(cur+1,true); else stopAuto(); }, 15000);
  toast('自动播放：每 15 秒一页');
}
/* ===== 右侧页内开窗：本页讲稿 / 全文讲稿 / 目录 / 帮助 ===== */
function closeDock(){
  if(!dockMode) return;
  dockMode=null; document.body.classList.remove('docked');
  $$('.chrome button').forEach(b=>b.classList.remove('act'));
  fit();
}
function toggleDock(mode){
  if(dockMode===mode){ closeDock(); return; }
  dockMode=mode; document.body.classList.add('docked');
  $$('.chrome button').forEach(b=>b.classList.remove('act'));
  const bmap={notes:'#btnNotes',all:'#btnAll',toc:'#btnToc',help:'#btnHelp'};
  const bb=$(bmap[mode]); if(bb) bb.classList.add('act');
  renderDock(mode); fit();
  if(mode==='all') syncAllDock(); else $('#dockBody').scrollTop = 0;
}
function syncAllDock(){
  const body=$('#dockBody'); if(!body) return;
  $$('#dockBody .sec').forEach((el,k)=>el.classList.toggle('cur',k===cur));
  const target=$('#dsec'+cur);
  if(target) body.scrollTop = Math.max(0, target.offsetTop - body.offsetTop - 70);
}
function renderDock(mode){
  const titles={notes:'本页讲稿',all:'全文讲稿',toc:'目录',help:'快捷键'};
  $('#dockTitle').textContent=titles[mode];
  $('#dockSub').textContent=mode==='toc' ? ('共 '+N+' 页') : (String(cur+1).padStart(2,'0')+' / '+String(N).padStart(2,'0'));
  let h='';
  if(mode==='notes'){
    const d=D[cur];
    h='<div class="tag">'+String(cur+1).padStart(2,'0')+' · '+d.eyebrow+'</div>'
     +'<div class="nt">'+d.title+'</div><p class="np">'+d.notes+'</p>'
     +'<div class="nb">承接下一页：'+d.bridge+'</div>'
     +'<p class="lead" style="margin-top:22px">按 N 再按一次关闭；按 T 通读全文；按 Esc 关闭本窗。翻页时本窗自动切换到当前页讲稿。</p>';
  } else if(mode==='all'){
    h='<p class="lead">按顺序通读。每页末尾的「承接」就是通往下一页的逻辑接口；翻页时这里会自动定位到当前页。</p>'
      + D.map((d,i)=>'<div class="sec" id="dsec'+i+'"><span class="tag">'+String(i+1).padStart(2,'0')+' · '+d.eyebrow+'</span>'
        +'<div class="nt">'+d.title+'</div><p class="np">'+d.notes+'</p>'
        +'<div class="nb">'+d.bridge+'</div></div>').join('');
  } else if(mode==='toc'){
    h='<p class="lead">点击任意一页跳转。共 '+N+' 页，按 G 再按一次关闭。</p><div class="tocgrid">'
      + D.map((d,i)=>'<a class="'+(i===cur?'cur':'')+'" onclick="jump('+i+')"><span>'
        +String(i+1).padStart(2,'0')+'</span>'+d.title+'</a>').join('') + '</div>';
  } else {
    h='<p class="lead">演说时的操作备忘。全屏后底部按键条依然可见。</p><div class="keys">'
     +'<div><kbd>→ / 空格</kbd>下一页</div><div><kbd>←</kbd>上一页</div>'
     +'<div><kbd>G</kbd>目录</div><div><kbd>N</kbd>本页讲稿</div>'
     +'<div><kbd>T</kbd>全文讲稿（自动定位当前页）</div><div><kbd>P</kbd>自动播放 / 暂停</div>'
     +'<div><kbd>F</kbd>全屏 / 退出全屏</div><div><kbd>1–9</kbd>直接跳页 1–9</div>'
     +'<div><kbd>Home / End</kbd>首页 / 末页</div><div><kbd>Esc</kbd>关闭开窗 / 退出全屏</div>'
     +'<div><kbd>?</kbd>本帮助</div><div><kbd>底部按钮</kbd>同上</div></div>'
     +'<p class="lead" style="margin-top:24px">动画页：改输入值 → ▶ 播放 / 暂停 → 单步 → ↺ 重置。</p>';
  }
  $('#dockBody').innerHTML=h;
}
/* ===== 全屏（底部按键条始终保留） ===== */
function fs(){
  const el=document.documentElement;
  const entering=!document.body.classList.contains('immersive');
  if(entering){
    document.body.classList.add('immersive'); $('#btnFs').textContent='退出全屏 F';
    fit(); toast('全屏：底部按键条保持可见（F 或 Esc 退出）');
    try{ const pr=el.requestFullscreen?el.requestFullscreen():null; if(pr&&pr.catch) pr.catch(()=>{}); }catch(e){}
  }else{
    document.body.classList.remove('immersive'); $('#btnFs').textContent='全屏 F';
    fit(); toast('已退出全屏');
    try{ if(document.fullscreenElement&&document.exitFullscreen) document.exitFullscreen(); }catch(e){}
  }
}
document.addEventListener('fullscreenchange', ()=>{
  if(!document.fullscreenElement && document.body.classList.contains('immersive')){
    document.body.classList.remove('immersive');
    const b=$('#btnFs'); if(b) b.textContent='全屏 F';
  }
  fit();
});

/* ===== 文本工具：按框宽缩字号 + 两行折行 ===== */
function strW(s,fs){ let w=0; for(const ch of String(s)) w += (ch.codePointAt(0)>0x2E80?1:0.56)*fs; return w; }
function fitText(id,s,maxw,base){
  const el=document.getElementById(id); if(!el) return;
  let f=base; while(f>10 && strW(s,f)>maxw) f-=0.5;
  el.textContent=s; el.setAttribute('font-size',f.toFixed(1));
}
function wrap2(s,maxChars){
  s=String(s);
  if(s.length<=maxChars) return [s,''];
  let cut=maxChars;
  for(let i=maxChars;i>Math.floor(maxChars*0.6);i--){
    if('，。；：、）」』'.indexOf(s[i])>=0){ cut=i+1; break; }
  }
  return [s.slice(0,cut), s.slice(cut,cut+maxChars)];
}
function setEl(id,s){ const e=document.getElementById(id); if(e) e.textContent=s; }

/* ===== 动画 A：逐行拉取模拟器 ===== */
const SIM={step:0,playing:false,timer:null,steps:[]};
const SIM_COLOR={call:'#245A6B',ret:'#2F7A66',block:'#BE653B',stop:'#AE8A3E'};
function simNodes(mode){
  return ['ExecutePlan（顶层循环）','Limit（根节点）',
    mode==='sort'?'Sort（阻塞节点）':mode==='nl'?'NestLoop（outer + inner）':'（无中间算子 · 直接扫描）',
    mode==='nl'?'SeqScan / Index Scan':'SeqScan（扫描节点）'];
}
function simBuild(){
  const raw=parseInt($('#simN').value,10);
  const n=Math.max(1,Math.min(6,isNaN(raw)?3:raw));
  const mode=$('#simMode').value;
  let a=[];
  const base={rootCalls:0,scanRows:0,loops:0,first:'—'};
  if(mode==='stream'){
    for(let i=1;i<=n;i++){
      a.push({node:0,kind:'call',label:'第 '+i+' 轮：ExecutePlan 拉根 Limit',
        desc:'重置 per-output-tuple 表达式上下文，然后调用根 PlanState 的 ExecProcNode()。',
        rootCalls:i,scanRows:i-1,loops:0,first:i===1?'第 3 步':'—'});
      a.push({node:3,kind:'call',label:'Limit 向下拉 SeqScan 的 next()',
        desc:'父节点需要数据 → 调用子节点 ExecProcNode(SeqScan)：上层不拉，下层不生产。',
        rootCalls:i,scanRows:i-1,loops:0,first:i===1?'第 3 步':'—'});
      a.push({node:1,kind:'ret',label:'SeqScan 返回 1 个 TupleTableSlot',
        desc:'table_scan_getnextslot() 取到一行装进 slot，数据自底向上，Limit 交给 DestReceiver。',
        rootCalls:i,scanRows:i,loops:0,first:i===1?'第 3 步':'—'});
    }
    a.push({node:1,kind:'stop',label:'已取满 '+n+' 行 → Limit 停止向下拉',
      desc:'这就是天然短路：下层不再生产，扫描行数可能远小于全表。',
      rootCalls:n,scanRows:n,loops:0,first:'第 3 步'});
  } else if(mode==='sort'){
    a.push({node:0,kind:'call',label:'ExecutePlan 第一次拉根 Limit',
      desc:'根 Limit 第一次需要一行，于是向下调用 Sort 的 ExecProcNode()。',
      rootCalls:1,scanRows:'全量',loops:0,first:'—'});
    a.push({node:2,kind:'block',label:'Sort 循环 ExecProcNode(SeqScan)',
      desc:'首次调用：把子计划所有 tuple 放进 tuplesort，直到子节点返回 NULL。',
      rootCalls:1,scanRows:'全量',loops:0,first:'—'});
    a.push({node:2,kind:'block',label:'tuplesort_performsort()',
      desc:'完成排序；是否用内存或临时文件，看 EXPLAIN ANALYZE 的 Sort Method。',
      rootCalls:1,scanRows:'全量',loops:0,first:'—'});
    a.push({node:1,kind:'ret',label:'Sort 开始逐行返回',
      desc:'首行此刻才出现。接口仍是 Pull，但首行延迟被阻塞节点抬高。',
      rootCalls:1,scanRows:'全量',loops:0,first:'第 4 步'});
    for(let i=1;i<=n;i++){
      a.push({node:1,kind:'ret',label:'返回第 '+i+' 行给 Limit',
        desc:'后续调用只从 tuplesort 里一行一行取，不再触碰子计划。',
        rootCalls:i,scanRows:'全量',loops:0,first:'第 4 步'});
    }
    a.push({node:1,kind:'stop',label:'取满 '+n+' 行 → 停止',
      desc:'LIMIT 挡不住 Sort 首次调用时的全量输入：这就是「加了 LIMIT 仍要扫很多数据」。',
      rootCalls:n,scanRows:'全量',loops:0,first:'第 4 步'});
  } else {
    for(let i=1;i<=n;i++){
      a.push({node:2,kind:'call',label:'第 '+i+' 个 outer tuple',
        desc:'ExecNestLoop() 需要新 outer 行 → ExecProcNode(outerPlan)。',
        rootCalls:i,scanRows:'outer + inner',loops:i-1,first:i===1?'第 3 步':'—'});
      a.push({node:3,kind:'call',label:'设置 chgParam → ExecReScan(inner)',
        desc:'相关参数变化，inner plan 重新扫描并逐行探测；inner 节点因此被反复执行。',
        rootCalls:i,scanRows:'outer + inner',loops:i,first:i===1?'第 3 步':'—'});
      a.push({node:1,kind:'ret',label:'命中 → ExecProject() 返回第 '+i+' 行',
        desc:'join qual / other qual 通过后返回结果 slot；loops 是真实调用次数，不是显示问题。',
        rootCalls:i,scanRows:'outer + inner',loops:i,first:i===1?'第 3 步':'—'});
    }
    a.push({node:1,kind:'stop',label:'取满 '+n+' 行 → Limit 停止向下拉',
      desc:'每个 outer tuple 都可能驱动一次 inner：EXPLAIN 里 inner 的 loops 由此放大。',
      rootCalls:n,scanRows:'outer + inner',loops:n,first:'第 3 步'});
  }
  SIM.steps=a.slice(0,24); SIM.step=0; simPaint();
}
function simPaint(){
  const g=document.getElementById('simTape'); if(!g) return;
  const st=SIM.steps, k=Math.min(SIM.step,st.length), curStep=k>0?st[k-1]:null;
  let tape='';
  const total=24, cols=8, cw=52, ch=30, gx=6;
  for(let i=0;i<total;i++){
    const col=i%cols, row=Math.floor(i/cols);
    const x=456+col*(cw+gx), y=90+row*38;
    const s=i<st.length?st[i]:null;
    const fill=(s && i<k)?SIM_COLOR[s.kind]:'#EDECE6';
    tape+='<rect x="'+x+'" y="'+y+'" width="'+cw+'" height="'+ch+'" fill="'+fill+'"/>';
    if(i===k-1 && k>0) tape+='<rect x="'+(x-2)+'" y="'+(y-2)+'" width="'+(cw+4)+'" height="'+(ch+4)
      +'" fill="none" stroke="#1B2B33" stroke-width="2"/>';
  }
  g.innerHTML=tape;
  const nodes=simNodes($('#simMode').value);
  for(let i=0;i<4;i++){
    const r=document.getElementById('simRect'+i), t=document.getElementById('simNode'+i);
    const active=curStep && curStep.node===i;
    if(r) r.setAttribute('fill', active ? (curStep.kind==='block'?'#F7E9DE':'#E5EFF0') : '#F1EFE9');
    if(t){ t.setAttribute('fill', active?'#245A6B':'#46585F'); fitText('simNode'+i,nodes[i],330,15.5); }
  }
  if(curStep){
    fitText('simStepLabel',curStep.label,416,16.5);
    const w=wrap2(curStep.desc,34);
    fitText('simStepDesc',w[0],416,12.5); fitText('simStepDesc2',w[1],416,12.5);
    ['simC0','simC1','simC2','simC3'].forEach((id,j)=>setEl(id,[curStep.rootCalls,
      curStep.scanRows,curStep.loops,curStep.first][j]));
    setEl('simStatus','步骤 '+k+' / '+st.length+'　·　'+$('#simMode').selectedOptions[0].text.split('（')[0]);
    fitText('simExplain',curStep.desc,1320,16);
    const out=$('#simOut'); if(out) out.innerHTML='<b>'+k+' / '+st.length+'</b>　'+curStep.label;
  } else {
    fitText('simStepLabel','等待播放',416,16.5);
    setEl('simStepDesc','选择计划形状，点播放或单步。'); setEl('simStepDesc2','');
    ['simC0','simC1','simC2','simC3'].forEach(id=>setEl(id,'0'));
    setEl('simStatus','步骤 0 / '+st.length);
    fitText('simExplain','同一个 LIMIT，在不同计划形状下的行为完全不同。',1320,16);
    const out=$('#simOut'); if(out) out.textContent='选择计划形状后点播放';
  }
}
/* ===== 动画 B：返回单位对比 ===== */
const VEC={step:0,playing:false,timer:null};
function vecTotal(){
  const n=Math.max(4,Math.min(60,parseInt($('#vecN').value,10)||24));
  const b=Math.max(2,Math.min(12,parseInt($('#vecB').value,10)||8));
  return Math.ceil(n/b);
}
function vecPaint(){
  const n=Math.max(4,Math.min(60,parseInt($('#vecN').value,10)||24));
  const b=Math.max(2,Math.min(12,parseInt($('#vecB').value,10)||8));
  const total=vecTotal(), k=Math.min(VEC.step,total);
  const a=document.getElementById('vecTapeA'), bb=document.getElementById('vecTapeB');
  if(!a||!bb) return;
  const X=266, WID=748, TOPA=68, TOPB=220, HH=60;
  const gap=2, cw=(WID-(n-1)*gap)/n;
  let s1='';
  for(let i=0;i<n;i++){
    s1+='<rect x="'+(X+i*(cw+gap)).toFixed(1)+'" y="'+TOPA+'" width="'+cw.toFixed(1)
      +'" height="'+HH+'" fill="'+(i<Math.min(n,k*b)?'#245A6B':'#EDECE6')+'"/>';
  }
  a.innerHTML=s1;
  const bw=(WID-(total-1)*4)/total;
  let s2='';
  for(let i=0;i<total;i++){
    s2+='<rect x="'+(X+i*(bw+4)).toFixed(1)+'" y="'+TOPB+'" width="'+bw.toFixed(1)
      +'" height="'+HH+'" fill="'+(i<k?'#2F7A66':'#EDECE6')+'"/>';
  }
  bb.innerHTML=s2;
  setEl('vecC0',String(Math.min(n,k*b)));
  setEl('vecC1',String(k));
  setEl('vecC2',k+' / '+total+' 批');
  if(k>0){
    fitText('vecExplain','第 '+k+' 批：单行侧已调用 '+Math.min(n,k*b)+' 次 next()，向量化侧只调用 '+k
      +' 次；全程 '+n+' 次 vs '+total+' 次。',1320,16);
    const o=$('#vecOut'); if(o) o.innerHTML='<b>第 '+k+' / '+total+' 批</b>　单行 '+Math.min(n,k*b)+' 次 · 向量化 '+k+' 次';
  } else {
    fitText('vecExplain','二者都可以是 Pull，只是 next() 的返回单位不同。',1320,16);
    const o=$('#vecOut'); if(o) o.textContent='改 N / B 后点播放';
  }
}
/* ===== 动画统一控制 ===== */
const ANIM={
  SIM:{o:SIM,total:()=>SIM.steps.length,paint:simPaint,play:'#simPlay',rebuild:simBuild,speed:900},
  VEC:{o:VEC,total:()=>vecTotal(),paint:vecPaint,play:'#vecPlay',rebuild:()=>{VEC.step=0;vecPaint();},speed:700}
};
function animPause(k){
  const a=ANIM[k]; if(!a.o.playing) return;
  a.o.playing=false; clearInterval(a.o.timer); a.o.timer=null;
  const b=$(a.play); if(b){ b.textContent='▶ 播放'; b.classList.remove('play'); }
}
function pauseAllAnims(){ Object.keys(ANIM).forEach(animPause); }
function animToggle(k){
  const a=ANIM[k], o=a.o;
  if(o.playing){ animPause(k); return; }
  if(o.step>=a.total()){ a.rebuild(); }
  o.playing=true;
  const b=$(a.play); if(b){ b.textContent='❚❚ 暂停'; b.classList.add('play'); }
  o.timer=setInterval(()=>{ o.step++; a.paint(); if(o.step>=a.total()) animPause(k); }, a.speed);
  a.paint();
}
function animStep(k){
  const a=ANIM[k], o=a.o; animPause(k);
  if(o.step>=a.total()){ a.rebuild(); return; }
  o.step++; a.paint();
}
function animReset(k){
  const a=ANIM[k]; animPause(k); a.rebuild();
}
/* ===== 键盘 ===== */
document.addEventListener('keydown', e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  const k=e.key;
  if(k==='Escape'){
    if(dockMode){ closeDock(); return; }
    if(document.body.classList.contains('immersive')){ fs(); return; }
    return;
  }
  if(tag==='input'||tag==='select'||tag==='textarea') return;
  if(k==='ArrowRight'||k===' '||k==='PageDown'){ e.preventDefault(); next(); }
  else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); prev(); }
  else if(k==='f'||k==='F'||e.code==='KeyF'){ e.preventDefault(); fs(); }
  else if(k==='g'||k==='G'){ e.preventDefault(); toggleDock('toc'); }
  else if(k==='n'||k==='N'){ e.preventDefault(); toggleDock('notes'); }
  else if(k==='t'||k==='T'){ e.preventDefault(); toggleDock('all'); }
  else if(k==='p'||k==='P'){ e.preventDefault(); toggleAuto(); }
  else if(k==='?'||k==='h'||k==='H'){ e.preventDefault(); toggleDock('help'); }
  else if(k==='Home'){ e.preventDefault(); go(0); }
  else if(k==='End'){ e.preventDefault(); go(N-1); }
  else if(/^[1-9]$/.test(k)){ go(parseInt(k,10)-1); }
});
/* ===== 启动 ===== */
$('#btnPrev').onclick=prev;
$('#btnNext').onclick=next;
$('#btnToc').onclick=()=>toggleDock('toc');
$('#btnNotes').onclick=()=>toggleDock('notes');
$('#btnAll').onclick=()=>toggleDock('all');
$('#btnAuto').onclick=toggleAuto;
$('#btnFs').onclick=fs;
$('#btnHelp').onclick=()=>toggleDock('help');
render();
$('#simPlay').onclick=()=>animToggle('SIM');
$('#simStepBtn').onclick=()=>animStep('SIM');
$('#simReset').onclick=()=>animReset('SIM');
$('#vecPlay').onclick=()=>animToggle('VEC');
$('#vecStepBtn').onclick=()=>animStep('VEC');
$('#vecReset').onclick=()=>animReset('VEC');
['#simN','#simMode','#vecN','#vecB'].forEach(sel=>{
  const el=$(sel); if(!el) return;
  el.addEventListener('input',()=>animReset(sel.indexOf('sim')>=0?'SIM':'VEC'));
  el.addEventListener('change',()=>animReset(sel.indexOf('sim')>=0?'SIM':'VEC'));
});
simBuild(); vecPaint();
fit();
let start=0; try{ start=parseInt(localStorage.getItem('volcano-pull-slide')||'0',10)||0; }catch(e){}
go(Math.max(0,Math.min(N-1,start)), true);
</script>
