<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数据库筑基课 · 向量化 Pull 模型｜把接口粒度改成一批</title>
<!-- 单文件交付：所有原理图均为现场绘制的内联 SVG，零外部图片 / 字体 / 脚本依赖。 -->
<!-- 设计母题：地层剖面 / 工程蓝图。内容按「计划→单行→矛盾→改写→表示→实现→过滤→对比→收益代价→落地」因果推演。 -->
<style>
:root{
  --bg:#F7F6F2; --sub:#F1EFE9; --ink:#1B2B33; --ink2:#46585F; --muted:#89938F; --line:#D9D5CB;
  --primary:#245A6B; --prim-l:#E5EFF0; --prim-m:#7BA6AF; --accent:#BE653B; --acc-l:#F7E9DE;
  --green:#2F7A66; --green-l:#E4F0EA; --gold:#AE8A3E; --gold-l:#F5EDDC;
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#E9E7E1}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
#viewport{position:absolute;inset:0 0 58px 0;overflow:hidden}
#stage{position:absolute;width:1600px;height:900px;background:var(--bg);
  transform-origin:top left;box-shadow:0 18px 60px rgba(27,43,51,.13);
  transition:transform .34s cubic-bezier(.2,.7,.2,1),left .34s cubic-bezier(.2,.7,.2,1),top .34s cubic-bezier(.2,.7,.2,1)}
.slide{position:absolute;inset:0;display:none}
.slide.on{display:block;animation:fadein .42s cubic-bezier(.2,.7,.2,1)}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{position:absolute;left:64px;top:44px;font-size:13px;letter-spacing:3.4px;
  color:var(--primary);font-weight:600}
.eyebrow .num{font-family:var(--mono);letter-spacing:1px;color:var(--accent);margin-right:14px}
h1.title{position:absolute;left:64px;top:70px;margin:0;font-family:var(--serif);
  font-size:44px;line-height:1.25;font-weight:700;letter-spacing:1.2px;color:var(--ink)}
.lede{position:absolute;left:64px;top:139px;width:1440px;font-size:19px;color:var(--ink2);
  line-height:1.5;letter-spacing:.3px}
.rule{position:absolute;left:64px;top:181px;width:1472px;height:1px;background:var(--line)}
.figwrap{position:absolute;left:100px;top:198px;width:1400px;height:430px}
svg.figure{display:block;overflow:visible}
svg.figure text{font-family:var(--sans)}
svg.figure text.serif{font-family:var(--serif)}
svg.figure text.mono{font-family:var(--mono)}
.caption{position:absolute;left:100px;top:638px;width:1400px;font-size:13px;
  color:var(--muted);letter-spacing:.4px}
.caption.under{top:686px;font-size:12.5px}
.bridge{position:absolute;left:64px;top:706px;width:1472px;font-size:20px;
  color:var(--accent);line-height:1.55;letter-spacing:.4px;padding-left:18px;
  border-left:3px solid var(--accent);font-family:var(--serif)}
.bridge .bk{font-family:var(--sans);font-size:13px;color:var(--muted);
  letter-spacing:2px;display:block;margin-bottom:2px}
.footer{position:absolute;left:64px;top:846px;width:1472px;height:1px;background:var(--line)}
.footer .fl{position:absolute;left:0;top:14px;font-size:12.5px;color:var(--muted);letter-spacing:2px}
.footer .fr{position:absolute;right:0;top:12px;font-family:var(--mono);font-size:14px;color:var(--ink2)}
.footer .fbar{position:absolute;left:0;right:0;top:-1px;height:2px;background:transparent}
.footer .fbar i{display:block;height:2px;background:var(--primary);width:0;transition:width .4s ease}

/* 动画页控件：独立条带，绝不覆盖图 */
.ctrls{position:absolute;left:100px;top:638px;width:1400px;height:46px;display:flex;
  align-items:center;gap:10px}
.ctrls label{font-size:13.5px;color:var(--ink2);white-space:nowrap}
.ctrls select,.ctrls input[type=range]{font-family:var(--sans);font-size:13.5px;color:var(--ink);
  background:#fff;border:1px solid var(--line);border-radius:4px;padding:5px 8px;outline:none}
.ctrls select{max-width:290px}
.ctrls input[type=range]{width:190px;padding:0;accent-color:var(--primary);border:none;background:transparent}
.ctrls .v{font-family:var(--mono);font-size:13px;color:var(--primary);min-width:48px}
.ctrls .btn{min-height:30px;padding:5px 13px;border:1px solid var(--primary);border-radius:4px;
  background:#fff;color:var(--primary);font-size:13.5px;cursor:pointer;font-family:var(--sans);white-space:nowrap}
.ctrls .btn.play{background:var(--primary);color:#fff}
.ctrls .btn:hover{filter:brightness(.94)}
.ctrls .out{font-size:13px;color:var(--ink2);margin-left:auto;min-width:0;flex:1;
  max-width:530px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrls .out b{color:var(--accent);font-weight:600}

/* 右侧页内开窗（非弹窗）：显示时舞台矢量缩放至左侧 */
#pane{position:fixed;right:0;top:0;bottom:58px;width:clamp(360px,34vw,520px);
  background:#FCFBF8;border-left:1px solid var(--line);z-index:35;display:flex;flex-direction:column;
  transform:translateX(105%);transition:transform .34s cubic-bezier(.2,.7,.2,1);
  box-shadow:-14px 0 44px rgba(27,43,51,.10)}
body.pane-open #pane{transform:none}
.pane-head{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:18px 22px 14px;border-bottom:1px solid var(--line);flex:none}
.pane-head .pnum{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:1px;margin-right:10px}
.pane-head .ptitle{font-family:var(--serif);font-size:18px;color:var(--ink)}
.pane-head button{background:#fff;border:1px solid var(--line);border-radius:4px;padding:6px 11px;
  font-size:12.5px;cursor:pointer;color:var(--ink2);font-family:var(--sans);white-space:nowrap}
.pane-head button:hover{border-color:var(--primary);color:var(--primary)}
.pane-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:4px 22px 26px}
.pn-sec{border-bottom:1px solid var(--line);padding:16px 12px 18px;cursor:pointer;transition:background .2s}
.pn-sec:hover{background:var(--prim-l)}
.pn-sec.now{background:var(--prim-l);box-shadow:inset 3px 0 0 var(--primary)}
.pn-sec .pn-n{font-family:var(--mono);font-size:11.5px;color:var(--accent);letter-spacing:1px}
.pn-sec h3{margin:6px 0 10px;font-family:var(--serif);font-size:19px;color:var(--primary);line-height:1.4}
.pn-sec p{margin:0;font-size:14.5px;line-height:1.95;color:var(--ink2);letter-spacing:.3px}
.pn-sec .pn-b{margin-top:11px;font-family:var(--serif);font-size:14px;color:var(--accent);line-height:1.7}
.pn-sec .pn-tip{margin-top:10px;font-size:12.5px;color:var(--muted)}
.pane-foot{flex:none;padding:10px 22px;border-top:1px solid var(--line);
  font-size:12px;color:var(--muted);letter-spacing:.4px}
.toc-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding-top:14px}
.toc-item{display:block;padding:11px 12px;border:1px solid var(--line);border-radius:4px;
  background:#fff;cursor:pointer;transition:.18s}
.toc-item:hover{border-color:var(--primary);background:var(--prim-l)}
.toc-item.now{border-color:var(--primary);background:var(--prim-l);box-shadow:inset 3px 0 0 var(--primary)}
.toc-item .tn{font-family:var(--mono);font-size:11px;color:var(--accent)}
.toc-item .tt{display:block;margin-top:4px;font-family:var(--serif);font-size:14.5px;line-height:1.4;color:var(--ink)}
.keys2{display:grid;grid-template-columns:1fr;gap:9px;padding-top:14px;font-size:14px;line-height:1.8}
.keys2 kbd{font-family:var(--mono);background:#fff;border:1px solid var(--line);
  border-bottom-width:2px;border-radius:4px;padding:2px 7px;color:var(--primary);margin-right:10px}

/* 底部外壳：全屏后依旧显示，所有按键常驻 */
.chrome{position:fixed;left:0;right:0;bottom:0;height:58px;background:#FCFBF8;
  border-top:1px solid var(--line);display:flex;align-items:center;gap:7px;
  padding:0 16px;z-index:45;font-size:13px;color:var(--ink2)}
body.immersive .chrome{background:rgba(252,251,248,.97);box-shadow:0 -6px 22px rgba(27,43,51,.10)}
.chrome .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.chrome button{font-family:var(--sans);font-size:13px;color:var(--ink2);background:transparent;
  border:1px solid transparent;border-radius:5px;padding:7px 10px;cursor:pointer;white-space:nowrap}
.chrome button:hover{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome button.act{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome button.k{font-family:var(--mono);font-size:12px;color:var(--muted)}
.chrome .pg{font-family:var(--mono);font-size:14px;color:var(--ink);min-width:78px;text-align:center}
.chrome .track{flex:1;height:3px;background:var(--line);border-radius:3px;margin:0 10px;position:relative;min-width:40px}
.chrome .track i{position:absolute;left:0;top:0;height:3px;background:var(--primary);border-radius:3px;transition:width .35s}
.chrome .hint{font-size:12px;color:var(--muted);white-space:nowrap}
.toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);background:var(--ink);
  color:#fff;font-size:13px;padding:9px 16px;border-radius:5px;opacity:0;transition:.3s;z-index:80;pointer-events:none}
.toast.on{opacity:1}
@media print{.chrome,#pane,.toast{display:none!important}#viewport{position:static}
  #stage{position:static;transform:none!important;box-shadow:none}
  .slide{display:block!important;page-break-after:always;position:relative;height:900px}}
</style>
</head>
<body>
<div id="viewport"><div id="stage"><div id="slides"></div></div></div>
<aside id="pane" aria-hidden="true">
  <div class="pane-head">
    <div><span class="pnum" id="paneNum"></span><span class="ptitle" id="paneTitle"></span></div>
    <button id="paneClose">关闭 ✕</button>
  </div>
  <div class="pane-body" id="paneBody"></div>
  <div class="pane-foot" id="paneFoot">页内开窗 · 再按一次同一按键即可关闭 · 翻页自动联动</div>
</aside>
<div class="chrome">
  <button id="btnPrev">← 上一页</button>
  <button id="btnNext">下一页 →</button>
  <span class="pg" id="pg">01 / 20</span>
  <div class="track" id="track"><i></i></div>
  <div class="sep"></div>
  <button id="btnToc">目录 G</button>
  <button id="btnNotes">本页讲稿 N</button>
  <button id="btnAll">全文讲稿 T</button>
  <button id="btnAuto">▶ 自动播放 P</button>
  <button id="btnFs">全屏 F</button>
  <button id="btnHelp" class="k">? 快捷键</button>
  <span class="hint">← → 翻页 · 1–9 跳页 · Esc 关闭</span>
</div>
<div class="toast" id="toast"></div>
<script>
const D = [{"eyebrow": "开场 · 执行器接手以后", "title": "计划画好了，谁来把它跑起来", "lede": "优化器输出物理计划之后，剩下的全交给执行器：把扫描、过滤、投影、连接、聚合串成一条链。今天只盯一个变量——链上每一次传递，带多少行。", "caption": "图 01　从计划到结果的整条链路；最底下的「接口粒度」是本讲唯一要改动的层。", "bridge": "要明白这一改为什么值钱，得先看清老办法好在哪儿、又卡在哪儿。", "notes": "先把位置摆清楚。优化器干完活，交出来的是一棵物理计划：先扫哪张表、用什么 join、在哪儿聚合。计划只说「做什么」，真正把数据搬出来、算出来，是执行器的活。执行器把扫描、过滤、投影、连接、聚合这些算子串成一条链，链上每一次传递都有个粒度。上一篇讲 Volcano，粒度是一行；今天只改这一个变量——把一行换成一批。别小看这一下，后面所有的收益和代价，都是从这里长出来的。", "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"20\" y=\"26\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"2.6\" >剖面 · 优化器交棒之后</text><text x=\"1380\" y=\"26\" class=\"sv \" text-anchor=\"end\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" letter-spacing=\"0\" >同一个变量：每一次传递带多少行</text><line x1=\"20\" y1=\"38\" x2=\"1380\" y2=\"38\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"40\" y=\"58\" width=\"300\" height=\"84\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"190\" y=\"92\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"20.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >物理计划</text><text x=\"190\" y=\"120\" class=\"sv \" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >优化器输出 · 决定做什么</text><line x1=\"342\" y1=\"100\" x2=\"369\" y2=\"100\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><polygon points=\"378,100 368,95 368,105\" fill=\"#7BA6AF\"/><rect x=\"380\" y=\"58\" width=\"300\" height=\"84\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"530\" y=\"92\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"20.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >执行器</text><text x=\"530\" y=\"120\" class=\"sv \" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >把算子串成一条链</text><line x1=\"682\" y1=\"100\" x2=\"709\" y2=\"100\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><polygon points=\"718,100 708,95 708,105\" fill=\"#7BA6AF\"/><rect x=\"720\" y=\"58\" width=\"300\" height=\"84\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"870\" y=\"92\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"20.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >算子链</text><text x=\"870\" y=\"120\" class=\"sv \" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >扫描 · 过滤 · 投影 · 连接 · 聚合</text><line x1=\"1022\" y1=\"100\" x2=\"1049\" y2=\"100\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><polygon points=\"1058,100 1048,95 1048,105\" fill=\"#7BA6AF\"/><rect x=\"1060\" y=\"58\" width=\"300\" height=\"84\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"1210\" y=\"92\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"20.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >结果</text><text x=\"1210\" y=\"120\" class=\"sv \" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >返回给调用方</text><text x=\"40\" y=\"176\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"600\" letter-spacing=\"0\" >同一条查询，被三层决定</text><rect x=\"40\" y=\"194\" width=\"1320\" height=\"52\" rx=\"0\" fill=\"#EBF1EE\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"64\" y=\"227\" class=\"sv serif\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#1B2B33\" font-weight=\"600\" letter-spacing=\"0\" >优化器</text><text x=\"280\" y=\"226\" class=\"sv \" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"400\" letter-spacing=\"0\" >决定做什么、按什么顺序</text><rect x=\"40\" y=\"256\" width=\"1320\" height=\"52\" rx=\"0\" fill=\"#A4C4C6\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"64\" y=\"289\" class=\"sv serif\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#1B2B33\" font-weight=\"600\" letter-spacing=\"0\" >执行器</text><text x=\"280\" y=\"288\" class=\"sv \" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"400\" letter-spacing=\"0\" >决定算子怎么串、批怎么流</text><rect x=\"40\" y=\"318\" width=\"1320\" height=\"52\" rx=\"0\" fill=\"#2E6373\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"64\" y=\"351\" class=\"sv serif\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#FFFFFF\" font-weight=\"600\" letter-spacing=\"0\" >接口粒度</text><text x=\"280\" y=\"350\" class=\"sv \" text-anchor=\"start\" font-size=\"15.0\" fill=\"#FFFFFF\" font-weight=\"400\" letter-spacing=\"0\" >决定每一次传递带多少行 —— 今天的变量</text><rect x=\"40\" y=\"318\" width=\"6\" height=\"52\" rx=\"0\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"1340\" y=\"350\" class=\"sv \" text-anchor=\"end\" font-size=\"12.5\" fill=\"#CFE0DC\" font-weight=\"400\" letter-spacing=\"0\" >越深＝越底层</text><text x=\"20\" y=\"404\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >向量化改动的位置在最底层：不改计划、不改 SQL，只改执行器接口每一次传递的粒度。</text></svg>"}, {"eyebrow": "起点 · 老办法的价值", "title": "父算子要一行，子算子给一行", "lede": "Volcano / 单行 Pull 给所有算子定了同一个接口：next() 返回一行或 end-of-stream。统一签名换来了极强的组合性。", "caption": "图 02　四层算子的递归调用链；统一接口让优化器生成的计划可以像搭积木一样组合。", "bridge": "组合性没问题，问题在粒度：一行爬一次，一亿行就要爬一亿次。", "notes": "老办法一点都不笨。Volcano 模型给所有算子定了一个统一的接口：父算子调 next()，子算子给一行，没了就回 end-of-stream。扫描、过滤、投影、连接都能实现这一个签名，所以优化器生成的计划可以像搭积木一样随便组合——这是它最大的工程价值，也是为什么这么多年大家还在用它。你写一句 SQL，底下就是这条链在反复互相要行。记住这个画面：一行，从最底下的扫描，一层一层往上爬，每爬一层都要走一次接口。", "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"20\" y=\"26\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"2.6\" >起点 · Volcano 的单行 Pull</text><text x=\"1380\" y=\"26\" class=\"sv \" text-anchor=\"end\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" letter-spacing=\"0\" >组合性来自一个统一签名</text><lin "290.0\" y=\"332.78\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >扫描 Seq Scan</text><text x=\"500\" y=\"333\" class=\"sv mono\" text-anchor=\"end\" font-size=\"12.5\" fill=\"#BE653B\" font-weight=\"400\" letter-spacing=\"0\" >1 行 / 次</text><rect x=\"560\" y=\"52\" width=\"800\" height=\"84\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"584\" y=\"84\" class=\"sv mono\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#245A6B\" font-weight=\"400\" letter-spacing=\"0\" >next() -&gt; tuple | end-of-stream</text><text x=\"584\" y=\"112\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >父算子要一行，子算子给一行；所有算子实现同一个接口</text><rect x=\"560\" y=\"158\" width=\"800\" height=\"48\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"580\" y=\"189\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"400\" letter-spacing=\"0\" >①</text><text x=\"618\" y=\"189\" class=\"sv \" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"400\" letter-spacing=\"0\" >扫描节点取一行</text><rect x=\"1210\" y=\"164\" width=\"132\" height=\"36\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#7BA6AF\" stroke-width=\"1\" /><text x=\"1276.0\" y=\"186.25\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#245A6B\" font-weight=\"400\" letter-spacing=\"0\" >统一接口</text><rect x=\"560\" y=\"214\" width=\"800\" height=\"48\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"580\" y=\"245\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"400\" letter-spacing=\"0\" >②</text><text x=\"618\" y=\"245\" class=\"sv \" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"400\" letter-spacing=\"0\" >过滤节点判断一次</text><rect x=\"1210\" y=\"220\" width=\"132\" height=\"36\" rx=\"2\" fill=\"#E5EFF 扫描的主矛盾并不相同。", "bridge": "既然瓶颈是「每行一次调度」，最直接的改法不是换硬件，而是把调度单位放大。", "notes": "我们把一行拆开看。它要过扫描节点、过滤节点、表达式节点、聚合节点，每一层都要做函数调用、表达式解释、把值装进 tuple 容器、再走一堆分支判断。这些是框架开销，不是业务计算。真正值钱的活——比较、算术、哈希查找、更新聚合状态——反而夹在中间很小一块。短 OLTP 查询，这点开销不算主矛盾；可一旦扫描上亿行，CPU 的指令 cache、数据 cache、分支预测、函数调用和解释器分发就被反复踩，时间全花在「把行搬上楼」，不是「把行算明白」。注意这张图只是机制示意，不是实测数字。", "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"20\" y=\"26\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"2.6\" >矛盾 · 一行一调度</text><text x=\"1380\" y=\"26\" class=\"sv \" text-anchor=\"end\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" letter-spacing=\"0\" >CPU 时间花在框架开销，而不是真正的计算</text><line x1=\"20\" y1=\"38\" x2=\"1380\" y2=\"38\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"20\" y=\"64\" class=\"sv \" text-anchor=\"start\" font-size=\"15.0\" fill=\"#46585F\" font-weight=\"600\" letter-spacing=\"0\" >一行要穿过四层，每层都要付一次「框架税」</text><rect x=\"40\" y=\"80\" width=\"310\" height=\"62\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"195.0\" y=\"116.1\" class=\"sv \" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"600\" letter-spacing=\"0\" >函数调用</text><rect x=\"380\" y=\"80\" width=\"310\" height=\"62\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"535.0\" y=\"116.1\" class=\"sv \" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"600\" letter-spacing=\"0\" >表达式解释 / 分发</text><rect x=\"720\" y=\"80\" width=\"310\" height=\"62\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"875.0\" y=\"116.1\" class=\"sv \" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"600\" letter-spacing=\"0\" >tuple 容器拆装</text><rect x=\"1060\" y=\"80\" width=\"310\" height=\"62\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"1215.0\" y=\"116.1\ ass=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#BE653B\" font-weight=\"600\" letter-spacing=\"0\" >对上亿行的分析型查询</text><text x=\"744\" y=\"348\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >指令 / 数据 cache、分支预测、函数调用、解释器分发被反复踩</text><text x=\"20\" y=\"404\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >主矛盾不是「算得慢」，而是「每行都要重新走一遍框架」；图中比例为机制示意，不是性能数字。</text></svg>"}, {"eyebrow": "改写 · 一次取一批", "title": "控制流不变，数据流变了", "lede": "仍然按需取数，但每次取一批；批内按列向量组织，表达式在紧凑数组上循环。DuckDB 默认批大小 2048 行，且要求 2 的幂。", "caption": "图 04　左右对照执行粒度；下方动画按批点亮 DataChunk，调用次数按四层算子做算术示意。", "bridge": "接口签名一换，batch 里装的到底是什么？这决定了后面每个算子该怎么写。", "notes": "向量化 Pull 的改动小得有点反直觉：控制流一点没变，上层照样按需取下一批；变的是数据流——一次给的不再是一行，而是一个 DataChunk，DuckDB 默认最多 2048 行，批内按列向量组织，表达式在紧凑数组上循环。MonetDB/X100 把它叫做 cache 友好的小批次、hyper-pipelining。你可以拖动行数、换批大小，看下面这个动画：同样一条四层算子链，单行模式每来一行就要调四次接口；批量模式一个批只调四次。差距不来自更快的 CPU，来自少喊了很多次。图里的调用次数是按四层算子做的算术示意，不是性能实测。", "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" id=\"animBatch\"><text x=\"20\" y=\"26\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"2.6\" >改写 · 粒度从一行换成一批</text><text x=\"1380\" y=\"26\" class=\"sv \" text-anchor=\"end\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" letter-spacing=\"0\" >控制流不变，数据流变了</text><line x1=\"20\" y1=\"38\" x2=\"1380\" y2=\"38\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"340\" y=\"58\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"18.0\" fill=\"#BE653B\" font-weight=\"600\" letter-spacing=\"0\" >传统单行 Pull</text><text x=\"1060\" y=\"58\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"18.0\" fill=\"#2F7A66\" font-weight=\"600\" letter-spacing=\"0\" >向量化批处理</text><line x1=\"700\" y1=\"48\" x2=\"700\" y2=\"310\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"40\" label>批大小</label><select id=\"aBatch\"><option value=\"1024\">1024</option><option value=\"2048\" selected>2048</option><option value=\"4096\">4096</option></select>\n<button class=\"btn play\" id=\"aPlay\">▶ 播放</button><button class=\"btn\" id=\"aTick\">单步</button><button class=\"btn\" id=\"aReset\">重置</button>\n<span class=\"out\" id=\"aOut\"></span>"}, {"eyebrow": "接口 · 只改中间一行", "title": "open / next_batch / close", "lede": "抽象成三行接口，变的只有中间那一行：返回 batch 或 end-of-stream。而 batch 不是「行的数组」，是一组列向量。", "caption": "图 05　接口三行与 batch 内部；默认容量来自 vector_size.hpp 的 DEFAULT_STANDARD_VECTOR_SIZE = 2048U。", "bridge": "DuckDB 里给这组列向量起的名字叫 DataChunk，我们把它剖开看。", "notes": "抽象成接口就三行：open、next_batch、close。中间那行返回 batch 或者 end-of-stream。关键在 batch 不是「行的数组」，如果它还是一行行对象，那我们什么都没省。它是一组列向量：每一列是一个物理类型的一批值，默认容量 2048，并且要求是 2 的幂——vector_size.hpp 里就写着 2048U，后面还跟了一个 power of two 的编译检查。所以这一改是把「执行器中间表示」整个换了，从 tuple 换成列向量集合。组合性还在，算子照样能串；但每个算子内部从「处理一个元组」变成「在数组上写循环」。", "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"20\" y=\"26\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"2.6\" >接口 · open / next_batch / close</text><text x=\"1380\" y=\"26\" class=\"sv \" text-anchor=\"end\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" letter-spacing=\"0\" >变的只有中间那一行的签名</text><line x1=\"20\" y1=\"38\" x2=\"1380\" y2=\"38\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"40\" y=\"56\" width=\"280\" height=\"70\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"180.0\" y=\"97.46000000000001\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"19.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >open()</text><rect x=\"380\" y=\"56\" width=\"640\" height=\"70\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"700.0\" y=\"97.12\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"18.0\" fill=\"#245A6B\ on vector</text></svg>"}, {"eyebrow": "实现 · 名称纠偏", "title": "DuckDB 不是教科书式递归 Pull", "lede": "PhysicalOperator 分成 Source / Operator / Sink 三类接口；PipelineExecutor 取一个 chunk，推过中间算子，最后交给 sink。", "caption": "图 08　pipeline 里的数据流与控制流；源码位置 physical_operator.hpp 与 pipeline_executor.cpp。", "bridge": "pipeline 凭什么能中断、能并行？因为控制流不靠函数递归，而是靠状态。", "notes": "标题里写 Pull，但 DuckDB 当前实现不能说成教科书式的递归 next()。physical_operator.hpp 把物理算子分成三类接口：Source 用 GetData 生产一个 DataChunk；Operator 用 Execute 把输入批变成输出批；Sink 用 Sink 消费一个批，比如聚合 build、排序、结果收集。PipelineExecutor 先从 source 取一个 chunk，再把这个 chunk 依次推过 pipeline 里的中间算子，最后交给 sink。也就是说，「按需取下一批」是上层概念，底下的真实框架是向量化批处理放进 pipeline 调度里。", "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"20\" y=\"26\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"2.6\" >实现 · source / operator / sink</text><text x=\"1380\" y=\"26\" class=\"sv \" text-anchor=\"end\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" letter-spacing=\"0\" >DuckDB 的真实框架不是递归 Pull</text><line x1=\"20\" y1=\"38\" x2=\"1380\" y2=\"38\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"20\" y=\"62\" class=\"sv \" text-anchor=\"start\" font-size=\"15.0\" fill=\"#46585F\" font-weight=\"600\" letter-spacing=\"0\" >PipelineExecutor 先从 source 取一个 chunk，再把它依次推过 pipeline</text><rect x=\"40\" y=\"80\" width=\"270\" height=\"132\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"175\" y=\"116\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"19.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >Source</text><line x1=\"64\" y1=\"130\" x2=\"286\" y2=\"130\" stroke=\"#7BA6AF\" stroke-width=\"1\"/><text x=\"175\" y=\"154\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"400\" letter-spacing=\"0\" >GetData(chunk)</text><text x=\"175\" y=\"182\" class=\"sv \" text-anchor=\"middle\" font-size " text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >Projection：批量算表达式</text><line x1=\"972\" y1=\"146\" x2=\"1019\" y2=\"146\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><polygon points=\"1028,146 1018,141 1018,151\" fill=\"#7BA6AF\"/><text x=\"1000\" y=\"128\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"11.0\" fill=\"#89938F\" font-weight=\"400\" letter-spacing=\"0\" >DataChunk</text><rect x=\"1030\" y=\"80\" width=\"270\" height=\"132\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"1165\" y=\"116\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"19.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >Sink</text><line x1=\"1054\" y1=\"130\" x2=\"1276\" y2=\"130\" stroke=\"#7BA6AF\" stroke-width=\"1\"/><text x=\"1165\" y=\"154\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"400\" letter-spacing=\"0\" >Sink(chunk)</text><text x=\"1165\" y=\"182\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >消费一批：聚合 build / 排序 / 结果</text><rect x=\"40\" y=\"242\" width=\"640\" height=\"100\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"64\" y=\"276\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >数据流</text><text x=\"64\" y=\"306\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >算子之间传递的是一批列向量，不是单个 tuple</text><rect x=\"720\" y=\"242\" width=\"640\" height=\"100\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"744\" y=\"276\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#BE653B\" font-weight=\"600\" letter-spacing=\"0\" >控制流</text><text x=\"744\" y=\"306\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >由 source / operator / sink 的结果状态驱动调度</text><text x=\"20\" y=\"404\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >所以「Pull」更适合作为概念入口：上层按需获得下一批，底下是向量化批处理放进 pipeline 调度。</text></svg>"}, {"eyebrow": "调度 · 状态而非递归", "title": "能中断、能并行、能缓存", "lede": "OperatorResultType 有 NEED_MORE_INPUT、HAVE_MORE_OUTPUT、BLOCKED、FINISHED；Source / Sink 各有自己的结果类型。", "caption": "图 09　pipeline 循环与四种结果状态；枚举来自 duckdb/common/enums/operator_result_type.hpp。", "bridge": "框架讲完，挑一个最能看出向量化味道的算子：过滤。", "notes": "每个接口都返回结果状态，调度器据此决定下一步。OperatorResultType 有四个值：NEED_MORE_INPUT 表示当前输入用完了、可以继续给下一批；HAVE_MORE_OUTPUT 表示同一批输入还没处理完、要再调一次；FINISHED 整条 pipeline 收工；BLOCKED 通常是异步 I/O 还没回来，调度器先去干别的。Source 和 Sink 各自也有自己的结果类型，取值略有不同。正因为有这些状态，执行器才能处理阻塞算子、异步 source、并行任务和算子缓存——递归 next() 做不到这些。所以记住：Pull 是概念入口，pipeline 才是实现。", "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"20\" y=\"26\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"2.6\" >调度 · 状态驱动而非函数递归</text><text x=\"1380\" y=\"26\" class=\"sv \" text-anchor=\"end\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" letter-spacing=\"0\" >所以能中断、能并行、能缓存</text><line x1=\"20\" y1=\"38\" x2=\"1380\" y2=\"38\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"50\" y=\"56\" width=\"280\" height=\"90\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"190.0\" y=\"106.44\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >GetData 取一批</text><line x1=\"332\" y1=\"101\" x2=\"379\" y2=\"101\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><polygon points=\"388,101 378,96 378,106\" fill=\"#7BA6AF\"/><rect x=\"390\" y=\"56\" width=\"280\" height=\"90\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"530.0\" y=\"106.44\" class=\"sv serif\" text-an dinality 设成输入批大小；然后按表达式类型分派：引用可以 Reference，带 selection 的引用可以 Slice，常量用 constant vector 表示整批，函数可以对整个 DataChunk 批量执行，读取方用 UnifiedVectorFormat 屏蔽三种表示的差异。所以准确说法是「批内执行，但保留特殊表示」。把向量化等同于 SIMD，是这一讲最常见的坑之一：SIMD 只是紧凑循环之上可能出现的进一步优化，不是向量化的定义。", "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"20\" y=\"26\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"2.6\" >表达式 · 批内执行，但保留轻量表示</text><text x=\"1380\" y=\"26\" class=\"sv \" text-anchor=\"end\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" letter-spacing=\"0\" >向量化 ≠ 所有表达式都变 SIMD</text><line x1=\"20\" y1=\"38\" x2=\"1380\" y2=\"38\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"40\" y=\"50\" width=\"520\" height=\"310\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"64\" y=\"84\" class=\"sv mono\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >ExpressionExecutor::Execute</text><text x=\"64\" y=\"118\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"400\" letter-spacing=\"0\" >(input, result)</text><line x1=\"64\" y1=\"136\" x2=\"536\" y2=\"136\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"64\" y=\"166\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >每个表达式产出一个结果向量</text><text x=\"64\" y=\"194\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >结果批 cardinality = 输入批大小</text><rect x=\"64\" y=\"222\" width=\"472\" height=\"108\" rx=\"2\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"88\" y=\"254\" class=\"sv \" text-anchor=\"start\" font-size=\"15.0\" fill=\"#2F7A66\" font-weight=\"600\" letter-spacing=\"0\" >关键不是「全拍平成数组」</text><text x=\"88\" y=\"284\" class=\"sv \" text-anchor=\"start\" font-size=\"13. ing=\"0\" >重复执行、表达式复杂、CPU 密集</text><rect x=\"40\" y=\"338\" width=\"190\" height=\"42\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"56\" y=\"365\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"600\" letter-spacing=\"0\" >不适合场景</text><rect x=\"230\" y=\"338\" width=\"370\" height=\"42\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"244\" y=\"365\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >极低延迟单行交互、强行级副作用</text><rect x=\"600\" y=\"338\" width=\"370\" height=\"42\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"614\" y=\"365\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >大规模分析扫描</text><rect x=\"970\" y=\"338\" width=\"370\" height=\"42\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"984\" y=\"365\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >临时短查询、编译环境受限</text><text x=\"20\" y=\"410\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >VLDB 2018《Compiled and Vectorized Queries》讨论的正是这条边界；表中只比机制，不含性能数字。</text></svg>"}, {"eyebrow": "收益 · 机制可确定", "title": "四类收益，指向同一件事", "lede": "调用更少、cache 更友好、表达式循环更紧凑、中间结果少复制；共同点是把 CPU 时间从框架开销挪回真正的计算。", "caption": "图 14　四类机制收益，来自接口粒度与向量表示的改变，不涉及任何实测性能数字。", "bridge": "收益讲完必须讲代价，否则就成了推销。", "notes": "能确定的收益有四类。第一，函数调用更少：每 2048 行调一次算子接口，而不是每行一次。第二，cache 局部性更好：同一列的值连在一起，比较、扫描、聚合 key 提取更容易命中。第三，表达式计算更紧凑：过滤、函数、cast、conjunction 都在批内循环，解释器分发少了。第四，也是最容易被忽略的少复制：Reference、Slice、dictionary、constant 让很多中间结果只是一层引用或一张选择表。四条指向同一件事——把 CPU 时间从框架开销，挪回真正的比较、计算、聚合。", "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"20\" y=\"26\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"2.6\" >收益 · 机制上能确定的四类</text><text x=\"1380\" y=\"26\" class=\"sv \" text-anchor=\"end\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" letter-spacing=\"0\" >把 CPU 时间从框架开销挪回真正的计算</text><line x1=\"20\" y1=\"38\" x2=\"1380\" y2=\"38\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"40\" y=\"44\" width=\"1320\" height=\"66\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"40\" y=\"44\" width=\"66\" height=\"66\" rx=\"0\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"73\" y=\"84\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#FFFFFF\" font-weight=\"600\" letter-spacing=\"0\" >01</text><text x=\"128\" y=\"84\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#2F7A66\" font-weight=\"600\" letter-spacing=\"0\" >函数调用更少</text><text x=\"450\" y=\"83\" class=\"sv \" text-anchor=\"start\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >每 2048 行调一次算子接口，而不是每行一次</text><rect x=\"40\" y=\"122\" width=\"1320\" height=\"66\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"40\" y=\"122\" width=\"66\" height=\"66\" rx=\"0\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"73\" y=\"162\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#FFFFFF\" font-weight=\"600\" letter-spacing=\"0\" >02</text><text x=\"128\" y=\"162\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#2F7A66\" font-weight=\"600\" letter-spacing=\"0\" >cache 局部性更好</text><text x=\"450\" y=\"161\" class=\"sv \" text-anchor=\"start\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >同列值连续存放，比较、扫描、聚合 key 提取更易命中</text><rect x=\"40\" y=\"200\" width=\"1320\" height=\"66\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"40\" y=\"200\" width=\"66\" height=\"66\" rx=\"0\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"73\" y=\"240\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#FFFFFF\" font-weight=\"600\" letter-spacing=\"0\" >03</text><text x=\"128\" y=\"240\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#2F7A66\" font-weight=\"600\" letter-spacing=\"0\" >表达式计算更紧凑</text><text x=\"450\" y=\"239\" class=\"sv \" text-anchor=\"start\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >过滤、函数、cast、conjunction 在批内循环，少解释器分发</text><rect x=\"40\" y=\"278\" width=\"1320\" height=\"66\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"40\" y=\"278\" width=\"66\" height=\"66\" rx=\"0\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"73\" y=\"318\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#FFFFFF\" font-weight=\"600\" letter-spacing=\"0\" >04</text><text x=\"128\" y=\"318\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#2F7A66\" font-weight=\"600\" letter-spacing=\"0\" >少复制</text><text x=\"450\" y=\"317\" class=\"sv \" text-anchor=\"start\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >Reference / Slice / dictionary / constant 让中间结果只是引用或选择表</text><rect x=\"40\" y=\"362\" width=\"1320\" height=\"52\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"700\" y=\"395\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >共同点：让比较、计算、聚合本身成为 CPU 时间的主角</text></svg>"}, {"eyebrow": "代价 · 调优边界", "title": "2048 是工程折中，不是普适常数", "lede": "批太小调度降不下来，批太大 cache、临时内存和首批延迟上升；算子实现、选择表示、阻塞边界都还有各自的代价。", "caption": "图 15　右侧条形为定性趋势示意，非实测；批大小与调用次数按固定扫描行数做算术演示。", "bridge": "机制说完，落到手上：怎么用 EXPLAIN 和 profiling 看出这些边界。", "notes": "代价同样四条。批大小成了调优边界，太小调度降不下来，太大 cache 压力、临时内存和首批延迟都上去；每个算子都要正确处理 flat、constant、dictionary、NULL、selection 和嵌套类型，实现复杂度明显高；选择表示有取舍，低选择率时 sel 很香，高选择率时全量引用可能更划算，后续要反复随机访问时字典层反而带来间接成本；还有最关键的一条——阻塞算子仍然阻塞，排序、全局聚合、join 的 build 阶段不会因为向量化就变成流式返回。右边的动画可以换批大小看这些定性趋势，都是示意，不是实测。2048 是工程折中，不是普适常数。", "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" id=\"animCost\"><text x=\"20\" y=\"26\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"2.6\" >代价 · 2048 是工程折中</text><text x=\"1380\" y=\"26\" class=\"sv \" text-anchor=\"end\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" letter-spacing=\"0\" >右侧为定性趋势示意，不是实测数据</text><line x1=\"20\" y1=\"38\" x2=\"1380\" y2=\"38\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"40\" y=\"58\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#BE653B\" font-weight=\"600\" letter-spacing=\"0\" >四条代价</text><rect x=\"40\" y=\"72\" width=\"620\" height=\"66\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"60\" y=\"99\" class=\"sv \" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"600\" letter-spacing=\"0\" >批大小成为调优边界</text><text x=\"60\" y=\"123\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >太小调度降不下来；太大 cache、内存、首批延迟上升</text><rect x=\"40\" y=\"148\" width=\"620\" height=\"66\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"60\" y=\"175\" class=\"sv \" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"600\" letter-spacing=\"0\" >算子实现更复杂</text><text x=\"60\" y=\"199\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >要正确处理 flat / constant / dictionary / NULL / selection / 嵌套</text><rect x=\"40\" y=\"224\" width=\"620\" height=\"66\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"60\" y=\"251\" class=\"sv \" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"600\" letter-spacing=\"0\" >选择表示有取舍</text><text x=\"60\" y=\"275\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >低选择率 sel 很香；高选择率全量引用可能更好</text><rect x=\"40\" y=\"300\" width=\"620\" height=\"66\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"60\" y=\"327\" class=\"sv \" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"600\" letter-spacing=\"0\" >阻塞算子仍然阻塞</text><text x=\"60\" y=\"351\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >排序、全局聚合、join build 不会因此变成流式返回</text><text x=\"700\" y=\"58\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >批大小 → 定性趋势（示意，非实测）</text><text x=\"700\" y=\"106\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >接口调用次数</text><rect x=\"900\" y=\"88\" width=\"380\" height=\"24\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"900\" y=\"88\" width=\"80\" height=\"24\" rx=\"2\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" id=\"cbar0\" class=\"cbar\"/><text x=\"1350\" y=\"106\" class=\"sv mono\" text-anchor=\"end\" font-size=\"13.0\" fill=\"#2F7A66\" font-weight=\"400\" letter-spacing=\"0\" id=\"clv0\">低</text><text x=\"700\" y=\"182\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >首批等待行数</text><rect x=\"900\" y=\"164\" width=\"380\" height=\"24\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"900\" y=\"164\" width=\"80\" height=\"24\" rx=\"2\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" id=\"cbar1\" class=\"cbar\"/><text x=\"1350\" y=\"182\" class=\"sv mono\" text-anchor=\"end\" font-size=\"13.0\" fill=\"#2F7A66\" font-weight=\"400\" letter-spacing=\"0\" id=\"clv1\">低</text><text x=\"700\" y=\"258\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >单批临时内存</text><rect x=\"900\" y=\"240\" width=\"380\" height=\"24\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"900\" y=\"240\" width=\"80\" height=\"24\" rx=\"2\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" id=\"cbar2\" class=\"cbar\"/><text x=\"1350\" y=\"258\" class=\"sv mono\" text-anchor=\"end\" font-size=\"13.0\" fill=\"#2F7A66\" font-weight=\"400\" letter-spacing=\"0\" id=\"clv2\">低</text><text x=\"700\" y=\"334\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >cache 压力</text><rect x=\"900\" y=\"316\" width=\"380\" height=\"24\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"900\" y=\"316\" width=\"80\" height=\"24\" rx=\"2\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" id=\"cbar3\" class=\"cbar\"/><text x=\"1350\" y=\"334\" class=\"sv mono\" text-anchor=\"end\" font-size=\"13.0\" fill=\"#2F7A66\" font-weight=\"400\" letter-spacing=\"0\" id=\"clv3\">低</text><text x=\"20\" y=\"398\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >默认 2048 且要求 2 的幂（vector_size.hpp）；批太小与批太大各伤一头，不是普适常数。</text></svg>", "ctrl": "<label>批大小</label><select id=\"cSize\"><option value=\"128\">128</option><option value=\"512\">512</option><option value=\"2048\" selected>2048（DuckDB 默认）</option><option value=\"8192\">8192</option></select>\n<button class=\"btn play\" id=\"cPlay\">▶ 播放</button><button class=\"btn\" id=\"cTick\">单步</button><button class=\"btn\" id=\"cReset\">重置</button>\n<span class=\"out\" id=\"cOut\"></span>"}, {"eyebrow": "实操 · 看计划", "title": "用 EXPLAIN 找出阻塞边界", "lede": "建一张十万行的表，EXPLAIN 分组聚合查询，重点看扫描节点、过滤下推位置、聚合与排序是否形成阻塞边界。", "caption": "图 16　本机当时没有可用 DuckDB CLI，Python 导入的是源码目录命名空间，示例未在本机执行。", "bridge": "看懂计划之后，三个角色各自该改什么？", "notes": "给一段最小验证。建一张十万行的表，id、k、v 三列，然后 EXPLAIN 那条 k BETWEEN 10 AND 20 再 GROUP BY k 的查询。重点看三件事：有没有 SEQ_SCAN 或类似的 table scan；过滤条件是不是被放到了 scan 或 filter 附近；聚合和排序会不会形成阻塞边界。想再看细一点，开 enable_profiling 等于 json，把输出写到文件，跑一遍查询，看算子耗时、扫描行数、过滤位置、阻塞节点。它不会把每个 DataChunk 的 2048 行打印给你，但足够把「批在哪儿被切开」「哪儿必须等齐」看明白。说明一下：本机当时没有可用的 DuckDB CLI，Python 导入的是源码目录命名空间，所以这段示例没有在本机执行过，直接复制到 CLI 或 Python 包里就能跑。", "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"20\" y=\"26\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"2.6\" >实操 · 用计划看见算子边界</text><text x=\"1380\" y=\"26\" class=\"sv \" text-anchor=\"end\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" letter-spacing=\"0\" >示例未在本文机器上执行，可直接复制到 DuckDB CLI / Python 包</text><line x1=\"20\" y1=\"38\" x2=\"1380\" y2=\"38\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"40\" y=\"50\" width=\"660\" height=\"316\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"64\" y=\"80\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >最小验证 SQL</text><rect x=\"64\" y=\"92\" width=\"612\" height=\"1\" rx=\"0\" fill=\"#D9D5CB\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"64\" y=\"122\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" letter-spacing=\"0\" >CREATE TABLE t AS SELECT i::INTEGER AS id,</text><text x=\"64\" y=\"151\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" letter-spacing=\"0\" >  (i % 100)::INTEGER AS k, i * 2 AS v</text><text x=\"64\" y=\"180\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" letter-spacing=\"0\" >FROM range(0, 100000) tbl(i);</text><text x=\"64\" y=\"209\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" letter-spacing=\"0\" >EXPLAIN SELECT k, sum(v) FROM t</text><text x=\"64\" y=\"238\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" letter-spacing=\"0\" >WHERE k BETWEEN 10 AND 20</text><text x=\"64\" y=\"267\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" letter-spacing=\"0\" >GROUP BY k ORDER BY k;</text><text x=\"64\" y=\"296\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#BE653B\" font-weight=\"400\" letter-spacing=\"0\" >PRAGMA enable_profiling = &#x27;json&#x27;;</text><text x=\"64\" y=\"325\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#BE653B\" font-weight=\"400\" letter-spacing=\"0\" >PRAGMA profiling_output = &#x27;duckdb-profile.json&#x27;;</text><rect x=\"730\" y=\"50\" width=\"630\" height=\"92\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"752\" y=\"84\" class=\"sv mono\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#BE653B\" font-weight=\"400\" letter-spacing=\"0\" >①</text><text x=\"790\" y=\"84\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >有没有 SEQ_SCAN</text><text x=\"752\" y=\"116\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >先确认扫描节点与扫描行数</text><rect x=\"730\" y=\"158\" width=\"630\" height=\"92\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"752\" y=\"192\" class=\"sv mono\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#BE653B\" font-weight=\"400\" letter-spacing=\"0\" >②</text><text x=\"790\" y=\"192\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >过滤是否下推</text><text x=\"752\" y=\"224\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >条件是否落在 scan / filter 附近</text><rect x=\"730\" y=\"266\" width=\"630\" height=\"92\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"752\" y=\"300\" class=\"sv mono\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#BE653B\" font-weight=\"400\" letter-spacing=\"0\" >③</text><text x=\"790\" y=\"300\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >阻塞边界在哪儿</text><text x=\"752\" y=\"332\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >聚合、排序是否必须先处理大量输入</text><text x=\"20\" y=\"406\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >profiling 不会打印每个 DataChunk 的 2048 行，但能看算子耗时、扫描行数、过滤位置与阻塞节点。</text></svg>"}, {"eyebrow": "落地 · 三个角色", "title": "让批里少一点无效数据", "lede": "架构师看执行器与存储是否配套；DBA 看过滤下推、投影裁剪、阻塞算子；业务开发者尽早过滤、少取列、少写逐行 UDF。", "caption": "图 17　三层角色对应的动作；越靠下的层越贴近日常写 SQL 的决策。", "bridge": "顺着这些动作，就能划出适用边界。", "notes": "给架构师：别只盯存储格式。列存配一个单行解释的执行器，收益会被浪费掉；评估引擎要同时看批大小、向量格式、过滤表示、表达式执行，以及 join 和 aggregate 的批处理路径，还要把首行延迟和总吞吐分开看。给 DBA：慢 SQL 别只问有没有索引，大扫描和聚合要看过滤能否下推、投影能否裁剪、阻塞算子在哪儿；宽表查询尽量只选必要列，因为 DataChunk 按列向量传，少一列就少一份内存带宽；复杂表达式关注谓词顺序、选择率和函数成本。给业务开发者：尽早过滤、少取列、少写逐行 UDF，别把 LIMIT 当成一定能省扫描。", "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"20\" y=\"26\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"2.6\" >最佳实践 · 三个角色，同一条原则</text><text x=\"1380\" y=\"26\" class=\"sv \" text-anchor=\"end\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" letter-spacing=\"0\" >让批里少一点无效数据，少一点无谓复制</text><line x1=\"20\" y1=\"38\" x2=\"1380\" y2=\"38\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"40\" y=\"44\" width=\"210\" height=\"92\" rx=\"0\" fill=\"#2E6373\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"145\" y=\"98\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"20.0\" fill=\"#FFFFFF\" font-weight=\"600\" letter-spacing=\"0\" >架构师</text><rect x=\"270\" y=\"44\" width=\"345\" height=\"92\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"442\" y=\"96\" class=\"sv \" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >列存 + 单行解释 = 收益浪费</text><rect x=\"635\" y=\"44\" width=\"345\" height=\"92\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"807\" y=\"96\" class=\"sv \" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >评估批大小 / 向量格式 / 过滤表示</text><rect x=\"1000\" y=\"44\" width=\"345\" height=\"92\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"1172\" y=\"96\" class=\"sv \" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >首行延迟与总吞吐分开看</text><rect x=\"40\" y=\"150\" width=\"210\" height=\"92\" rx=\"0\" fill=\"#74A5AD\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"145\" y=\"204\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"20.0\" fill=\"#1B2B33\" font-weight=\"600\" letter-spacing=\"0\" >DBA</text><rect x=\"270\" y=\"150\" width=\"345\" height=\"92\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"442\" y=\"202\" class=\"sv \" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >慢 SQL 先看过滤下推、投影裁剪</text><rect x=\"635\" y=\"150\" width=\"345\" height=\"92\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"807\" y=\"202\" class=\"sv \" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >宽表只选必要列，省内存带宽</text><rect x=\"1000\" y=\"150\" width=\"345\" height=\"92\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"1172\" y=\"202\" class=\"sv \" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >复杂谓词看顺序、选择率、函数成本</text><rect x=\"40\" y=\"256\" width=\"210\" height=\"92\" rx=\"0\" fill=\"#CFE0DC\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"145\" y=\"310\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"20.0\" fill=\"#1B2B33\" font-weight=\"600\" letter-spacing=\"0\" >业务开发者</text><rect x=\"270\" y=\"256\" width=\"345\" height=\"92\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"442\" y=\"308\" class=\"sv \" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >尽早过滤、少取列、少逐行 UDF</text><rect x=\"635\" y=\"256\" width=\"345\" height=\"92\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"807\" y=\"308\" class=\"sv \" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >LIMIT 不保证省扫描（排序 / 聚合）</text><rect x=\"1000\" y=\"256\" width=\"345\" height=\"92\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"1172\" y=\"308\" class=\"sv \" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >把数据整理成类型明确、表达式简单</text><text x=\"20\" y=\"404\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >三条动作都指向同一件事：减少无效列、无效行、无效复制，让批内循环只处理真正需要的数据。</text></svg>"}, {"eyebrow": "边界 · 适合与不适合", "title": "能不能成批处理，要不要逐行即时", "lede": "OLAP 扫描、宽表少列、明显选择率、批量转换适合；单行点查、逐行副作用、游标型即时返回与极小数据量收益有限。", "caption": "图 18　判断标准不是数据量大不大，而是执行粒度与首行延迟要求是否匹配。", "bridge": "最后把最容易踩的五个坑一次说清。", "notes": "适合的一边：扫描大量行做过滤、投影、聚合的 OLAP；列很多但每次只读几列的分析；谓词选择率明显、能靠选择向量砍掉后续计算的查询；批量导入、转换、写出。收益有限的一边：单行点查、极低延迟的 RPC 式查询；每行都触发外部副作用或高成本 UDF；要求严格逐行返回、随时能停的游标型工作；还有数据量小到编排开销比计算还大的查询。判断标准其实不是「数据量大不大」，而是两句话：能不能成批处理，要不要逐行即时。", "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"20\" y=\"26\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\ 极低延迟的 RPC 式查询</text><rect x=\"40\" y=\"176\" width=\"640\" height=\"64\" rx=\"2\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"60\" y=\"188\" width=\"40\" height=\"40\" rx=\"2\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"80.0\" y=\"212.76\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"600\" letter-spacing=\"0\" >2</text><text x=\"116\" y=\"215\" class=\"sv \" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"400\" letter-spacing=\"0\" >列很多但每次只读部分列的分析任务</text><rect x=\"720\" y=\"176\" width=\"640\" height=\"64\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"740\" y=\"188\" width=\"40\" height=\"40\" rx=\"2\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"760.0\" y=\"212.76\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"600\" letter-spacing=\"0\" >2</text><text x=\"796\" y=\"215\" class=\"sv \" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"400\" letter-spacing=\"0\" >每行都触发外部副作用或高成本 UDF</text><rect x=\"40\" y=\"252\" width=\"640\" height=\"64\" rx=\"2\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"60\" y=\"264\" width=\"40\" height=\"40\" rx=\"2\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"80.0\" y=\"288.76\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"600\" letter-spacing=\"0\" >3</text><text x=\"116\" y=\"291\" class=\"sv \" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"400\" letter-spacing=\"0\" >谓词选择率明显，可用选择向量减少后续计算</text><rect x=\"720\" y=\"252\" width=\"640\" height=\"64\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"740\" y=\"264\" width=\"40\" height=\"40\" rx=\"2\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"760.0\" y=\"288.76\" class=\"sv mono\" text-anchor= ate、hash join build 这些阶段，照样可能吃掉大部分时间和内存。你会发现这五个坑是同一个误会的不同侧面：把接口粒度当成了执行引擎的全部。", "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"20\" y=\"26\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"2.6\" >避坑 · 五个常见误会</text><text x=\"1380\" y=\"26\" class=\"sv \" text-anchor=\"end\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" letter-spacing=\"0\" >都来自把「接口粒度」当成了执行引擎的全部</text><line x1=\"20\" y1=\"38\" x2=\"1380\" y2=\"38\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"40\" y=\"42\" width=\"1320\" height=\"60\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"52\" y=\"50\" width=\"44\" height=\"44\" rx=\"2\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"74.0\" y=\"77.1\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#FFFFFF\" font-weight=\"600\" letter-spacing=\"0\" >1</text><text x=\"112\" y=\"80\" class=\"sv \" text-anchor=\"start\" font-size=\"16.0\" fill=\"#BE653B\" font-weight=\"600\" letter-spacing=\"0\" >向量化 = SIMD</text><text x=\"540\" y=\"79\" class=\"sv \" text-anchor=\"start\" font-size=\"14.5\" fill=\"#2F7A66\" font-weight=\"400\" letter-spacing=\"0\" >首先是批处理 + 列向量接口；SIMD 只是可能的进一步优化</text><rect x=\"40\" y=\"112\" width=\"1320\" height=\"60\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"52\" y=\"120\" width=\"44\" height=\"44\" rx=\"2\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"74.0\" y=\"147.1\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#FFFFFF\" font-weight=\"600\" letter-spacing=\"0\" >2</text><text x=\"112\" y=\"150\" class=\"sv \" text-anchor=\"start\" font-size=\"16.0\" fill=\"#BE653B\" font-weight=\"600\" letter-spacing=\"0\" >DuckDB = 纯 Pull</text><text x=\"540\" y=\"149\" class=\"sv \" text-anchor=\"start\" font-size=\"14.5\" fill=\"#2F7A66\" font-weight= class=\"sv \" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >MonetDB/X100 · CIDR 2005</text><text x=\"62\" y=\"126\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >Hyper-Pipelining Query Execution：cache 友好的小批次</text><rect x=\"40\" y=\"158\" width=\"620\" height=\"76\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"62\" y=\"188\" class=\"sv \" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >Compiled vs Vectorized · VLDB 2018</text><text x=\"62\" y=\"214\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >向量化解释执行与查询编译的边界</text><rect x=\"40\" y=\"246\" width=\"620\" height=\"76\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"62\" y=\"276\" class=\"sv \" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >Filter Representation</text><text x=\"62\" y=\"302\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >位图 / 选择向量 / 物化过滤结果的取舍</text><text x=\"700\" y=\"58\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >源码入口（duckdb/）</text><rect x=\"700\" y=\"70\" width=\"660\" height=\"56\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#7BA6AF\" stroke-width=\"1\" /><text x=\"720\" y=\"105\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"400\" letter-spacing=\"0\" >src/include/duckdb/common/vector_size.hpp</text><rect x=\"700\" y=\"136\" width=\"660\" height=\"56\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#7BA6AF\" stroke-width=\"1\" /><text x=\"720\" y=\"171\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"400\" letter-spacing=\"0\" >src/include/duckdb/common/types/data_chunk.hpp</text><rect x=\"700\" y=\"202\" width=\"660\" height=\"56\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#7BA6AF\" stroke-width=\"1\" /><text x=\"720\" y=\"237\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"400\" letter-spacing=\"0\" >src/execution/operator/filter/physical_filter.cpp</text><rect x=\"700\" y=\"268\" width=\"660\" height=\"56\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#7BA6AF\" stroke-width=\"1\" /><text x=\"720\" y=\"303\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"400\" letter-spacing=\"0\" >src/parallel/pipeline_executor.cpp</text><rect x=\"40\" y=\"344\" width=\"1320\" height=\"70\" rx=\"2\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1\" /><text x=\"700\" y=\"388\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"20.0\" fill=\"#FFFFFF\" font-weight=\"600\" letter-spacing=\"0\" >带走三句话：接口粒度改了 · 复制被推迟了 · Pull 只是概念入口</text></svg>"}];
const N = D.length;
let cur = 0, autoTimer = null, autoOn = false, paneMode = 'none';
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

function fit(){
  const vp = $('#viewport');
  const W = vp.clientWidth, H = vp.clientHeight;
  const open = document.body.classList.contains('pane-open');
  const paneW = open ? $('#pane').offsetWidth : 0;
  const avail = W - paneW, pad = 16;
  const s = Math.min((avail - pad*2) / 1600, (H - pad*2) / 900);
  const st = $('#stage');
  st.style.transform = 'scale(' + s + ')';
  st.style.left = ((avail - 1600*s)/2) + 'px';
  st.style.top  = ((H - 900*s)/2) + 'px';
}
window.addEventListener('resize', fit);

function render(){
  $('#slides').innerHTML = D.map((d,i) =>
    '<section class="slide" id="s'+i+'">'
    + '<div class="eyebrow"><span class="num">'+String(i+1).padStart(2,'0')+' / '+String(N).padStart(2,'0')+'</span>'+d.eyebrow+'</div>'
    + '<h1 class="title">'+d.title+'</h1>'
    + '<div class="lede">'+d.lede+'</div>'
    + '<div class="rule"></div>'
    + '<div class="figwrap">'+d.svg+'</div>'
    + (d.ctrl ? '<div class="ctrls">'+d.ctrl+'</div><div class="caption under">'+d.caption+'</div>'
              : '<div class="caption">'+d.caption+'</div>')
    + '<div class="bridge"><span class="bk">承接 · NEXT</span>'+d.bridge+'</div>'
    + '<div class="footer"><div class="fbar"><i id="fbar'+i+'"></i></div>'
    + '<span class="fl">数据库筑基课 · 向量化 Pull 模型</span>'
    + '<span class="fr">'+String(i+1).padStart(2,'0')+' / '+String(N).padStart(2,'0')+'</span></div>'
    + '</section>').join('');
}

function go(i, silent){
  i = Math.max(0, Math.min(N-1, i));
  $$('.slide').forEach((el,k)=>el.classList.toggle('on', k===i));
  cur = i;
  try{ localStorage.setItem('vecbatch-slide', String(i)); }catch(e){}
  $('#pg').textContent = String(i+1).padStart(2,'0') + ' / ' + String(N).padStart(2,'0');
  $('#track i').style.width = ((i+1)/N*100)+'%';
  for(let k=0;k<N;k++){ const b=$('#fbar'+k); if(b) b.style.width = (k<=i?100:0)+'%'; }
  if(!silent) toast(D[i].eyebrow + ' · ' + D[i].title);
  syncPane();
}
function next(){ if(cur<N-1) go(cur+1); else stopAuto(); }
function prev(){ if(cur>0) go(cur-1); }

function toast(s){
  const t=$('#toast'); t.textContent=s; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1700);
}

function stopAuto(){
  autoOn=false; clearInterval(autoTimer); autoTimer=null;
  $('#btnAuto').textContent='▶ 自动播放 P'; $('#btnAuto').classList.remove('act');
}
function toggleAuto(){
  if(autoOn){ stopAuto(); toast('已暂停自动播放'); return; }
  autoOn=true; $('#btnAuto').textContent='❚❚ 暂停 P'; $('#btnAuto').classList.add('act');
  autoTimer=setInterval(()=>{ if(cur<N-1) go(cur+1,true); else stopAuto(); }, 12000);
  toast('自动播放：每 12 秒一页，P 暂停');
}

/* ---------------- 右侧页内开窗：here / all / toc / help ---------------- */
function paneOpen(){ return document.body.classList.contains('pane-open'); }
function setChrome(){
  [['toc','#btnToc'],['here','#btnNotes'],['all','#btnAll'],['help','#btnHelp']].forEach(([m,sel])=>{
    $(sel).classList.toggle('act', paneOpen() && paneMode===m);
  });
}
function secHtml(d,i,withBridge){
  return '<section class="pn-sec" data-page="'+i+'" onclick="jump('+i+')">'
    + '<span class="pn-n">'+String(i+1).padStart(2,'0')+' / '+String(N).padStart(2,'0')+' · '+d.eyebrow+'</span>'
    + '<h3>'+d.title+'</h3><p>'+d.notes+'</p>'
    + (withBridge ? '<p class="pn-b">「承接 · NEXT」'+d.bridge+'</p>' : '')
    + '</section>';
}
function renderPane(){
  const body = $('#paneBody');
  if(paneMode==='here'){
    const d=D[cur];
    $('#paneNum').textContent = String(cur+1).padStart(2,'0')+' / '+String(N).padStart(2,'0');
    $('#paneTitle').textContent = '本页讲稿';
    body.innerHTML = secHtml(d,cur,true)
      + '<div class="pn-sec" style="cursor:default"><p class="pn-tip">按 N 关闭本窗 · 按 T 通读全文讲稿 · 翻页时这里会自动换成新一页的讲稿。</p></div>';
    body.scrollTop = 0;
  } else if(paneMode==='all'){
    $('#paneNum').textContent = '共 '+N+' 页';
    $('#paneTitle').textContent = '全文讲稿';
    body.innerHTML = D.map((d,i)=>secHtml(d,i,true)).join('');
  } else if(paneMode==='toc'){
    $('#paneNum').textContent = '共 '+N+' 页';
    $('#paneTitle').textContent = '目录 · 点击跳转';
    body.innerHTML = '<div class="toc-grid">'
      + D.map((d,i)=>'<a class="toc-item" data-page="'+i+'" onclick="jump('+i+')">'
        +'<span class="tn">'+String(i+1).padStart(2,'0')+'</span>'
        +'<span class="tt">'+d.title+'</span></a>').join('') + '</div>';
  } else if(paneMode==='help'){
    $('#paneNum').textContent = '操作备忘';
    $('#paneTitle').textContent = '快捷键';
    body.innerHTML = '<div class="keys2">'
      + '<div><kbd>→ / 空格 / PageDown</kbd>下一页</div>'
      + '<div><kbd>← / PageUp</kbd>上一页</div>'
      + '<div><kbd>G</kbd>目录（再按一次关闭）</div>'
      + '<div><kbd>N</kbd>本页讲稿（页内右侧开窗，再按关闭）</div>'
      + '<div><kbd>T</kbd>全文讲稿（自动定位当前页，翻页联动滚动）</div>'
      + '<div><kbd>P</kbd>自动播放 / 暂停</div>'
      + '<div><kbd>F</kbd>全屏 / 退出全屏（底部按键常驻）</div>'
      + '<div><kbd>1–9</kbd>直接跳页</div>'
      + '<div><kbd>Home / End</kbd>首页 / 末页</div>'
      + '<div><kbd>Esc</kbd>关闭右侧开窗 / 退出全屏</div>'
      + '<div><kbd>? / H</kbd>本帮助</div>'
      + '<div><kbd>点击底部按钮</kbd>与快捷键等价</div></div>';
    body.scrollTop = 0;
  }
  $('#paneFoot').textContent = paneMode==='all'
    ? '全文讲稿 · 已定位当前页 · 翻页时右侧自动滚动联动'
    : '页内开窗 · 再按一次同一按键即可关闭 · 翻页自动联动';
}
function scrollToPage(i, smooth){
  const body=$('#paneBody'), t=body.querySelector('[data-page="'+i+'"]');
  if(!t) return;
  $$('#paneBody .pn-sec.now').forEach(e=>e.classList.remove('now'));
  t.classList.add('now');
  const top=t.getBoundingClientRect().top - body.getBoundingClientRect().top + body.scrollTop - 12;
  body.scrollTo({top:Math.max(0,top), behavior:smooth?'smooth':'auto'});
}
function syncPane(){
  if(!paneOpen()) return;
  if(paneMode==='here'){ renderPane(); }
  else if(paneMode==='all'){ scrollToPage(cur,true); }
  else if(paneMode==='toc'){
    $$('#paneBody .toc-item').forEach(e=>e.classList.toggle('now', +e.dataset.page===cur));
  }
}
function togglePane(m){
  if(paneOpen() && paneMode===m){ closePane(); return; }
  paneMode = m;
  document.body.classList.add('pane-open');
  $('#pane').setAttribute('aria-hidden','false');
  renderPane(); setChrome(); fit();
  if(m==='all') requestAnimationFrame(()=>scrollToPage(cur,false));
  if(m==='toc') $$('#paneBody .toc-item').forEach(e=>e.classList.toggle('now', +e.dataset.page===cur));
}
function closePane(){
  document.body.classList.remove('pane-open');
  $('#pane').setAttribute('aria-hidden','true');
  paneMode='none'; setChrome(); fit();
}
function jump(i){ go(i); }

/* ---------------- 全屏：系统全屏 + CSS 沉浸降级，底部按键始终可见 ---------------- */
function fs(){
  const entering = !document.body.classList.contains('immersive');
  if(entering){
    document.body.classList.add('immersive');
    $('#btnFs').textContent = '退出全屏 F';
    let pr = null;
    try{ pr = document.documentElement.requestFullscreen ? document.documentElement.requestFullscreen() : null; }catch(e){}
    if(pr && pr.catch) pr.catch(()=>toast('已降级为页内沉浸全屏：底部按键仍可使用'));
    fit();
    toast('全屏：底部快捷键保持显示（F 或 Esc 退出）');
  }else{
    document.body.classList.remove('immersive');
    $('#btnFs').textContent = '全屏 F';
    fit(); toast('已退出全屏');
    try{ if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen(); }catch(e){}
  }
}
document.addEventListener('fullscreenchange', ()=>{
  if(!document.fullscreenElement && document.body.classList.contains('immersive')){
    document.body.classList.remove('immersive');
    $('#btnFs').textContent = '全屏 F';
  }
  fit();
});

/* ---------------- 快捷键 ---------------- */
document.addEventListener('keydown', e=>{
  const k=e.key, tag=(e.target.tagName||'').toLowerCase();
  const typing = tag==='input'||tag==='select'||tag==='textarea'||e.target.isContentEditable;
  if(k==='Escape'){
    if(paneOpen()){ closePane(); toast('讲稿窗已关闭'); }
    else if(document.body.classList.contains('immersive')) fs();
    return;
  }
  if(k==='f'||k==='F'){ e.preventDefault(); fs(); return; }
  if(typing) return;
  if(k==='ArrowRight'||k===' '||k==='PageDown'){ e.preventDefault(); next(); }
  else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); prev(); }
  else if(k==='g'||k==='G'){ e.preventDefault(); togglePane('toc'); }
  else if(k==='n'||k==='N'){ e.preventDefault(); togglePane('here'); }
  else if(k==='t'||k==='T'){ e.preventDefault(); togglePane('all'); }
  else if(k==='p'||k==='P'){ e.preventDefault(); toggleAuto(); }
  else if(k==='?'||k==='h'||k==='H'){ e.preventDefault(); togglePane('help'); }
  else if(k==='Home'){ e.preventDefault(); go(0); }
  else if(k==='End'){ e.preventDefault(); go(N-1); }
  else if(/^[1-9]$/.test(k)){ go(parseInt(k,10)-1); }
});

/* ---------------- 动画 A：一行一调度 vs 一批一调度 ---------------- */
let aStep=0, aTimer=null, aPlaying=false;
function aCfg(){
  const rows=+$('#aRows').value, bs=+$('#aBatch').value;
  return {rows, bs, n:Math.ceil(rows/bs)};
}
function aPaint(){
  const {rows,bs,n}=aCfg();
  $('#aRowsLbl').textContent = rows.toLocaleString();
  if(aStep>n) aStep=n;
  $$('#animBatch .bcol').forEach((c,i)=>{
    c.setAttribute('opacity', i<n ? '1' : '0.16');
    c.setAttribute('fill', i<aStep ? (i===aStep-1 ? '#F7E9DE' : '#E5EFF0') : '#FFFFFF');
    c.setAttribute('stroke', i<aStep ? '#BE653B' : '#D9D5CB');
  });
  const t=$('#aStepText'); if(t) t.textContent = aStep+' / '+n+' 批';
  $('#aOut').innerHTML = '已完成 <b>'+aStep+' / '+n+'</b> 批　·　单行接口累计 <b>'+(aStep*bs*4).toLocaleString()
    + '</b> 次　·　批量接口累计 <b>'+(aStep*4).toLocaleString()+'</b> 次（4 层算子算术示意）';
}
function aPause(){ aPlaying=false; clearInterval(aTimer); aTimer=null;
  const b=$('#aPlay'); if(b){ b.textContent='▶ 播放'; b.classList.remove('play'); } }
function aPlay(){
  if(aPlaying){ aPause(); return; }
  const {n}=aCfg(); if(aStep>=n) aStep=0;
  aPlaying=true; $('#aPlay').textContent='❚❚ 暂停'; $('#aPlay').classList.add('play');
  aTimer=setInterval(()=>{ aStep++; aPaint(); if(aStep>=aCfg().n) aPause(); },520);
}
function aTick(){ aPause(); const {n}=aCfg(); if(aStep<n){ aStep++; aPaint(); } }
function aReset(){ aPause(); aStep=0; aPaint(); }

/* ---------------- 动画 B：过滤的三条分支 ---------------- */
const B_K=[8,12,15,33,20];
const B_PREDS=[
  {id:'some', label:'k BETWEEN 10 AND 20', test:k=>k>=10&&k<=20},
  {id:'all',  label:'k >= 0',              test:k=>k>=0},
  {id:'none', label:'k > 100',             test:k=>k>100}
];
let bStep=0, bTimer=null, bPlaying=false;
function bCfg(){
  const id=$('#bPredSel').value;
  const p=B_PREDS.find(x=>x.id===id)||B_PREDS[0];
  const sel=B_K.map((k,i)=>p.test(k)?i:-1).filter(i=>i>=0);
  return {p,sel};
}
function bPaint(){
  const {p,sel}=bCfg();
  if(bStep>6) bStep=6;
  $('#bPred').textContent=p.label;
  $$('#animFilter .brow').forEach((g,i)=>{
    const seen=i<bStep, passed=sel.indexOf(i)>=0;
    const r=g.querySelector('.brow-bg'), t=g.querySelector('text');
    r.setAttribute('fill', !seen ? '#FFFFFF' : (passed ? '#E4F0EA' : '#F7E9DE'));
    r.setAttribute('stroke', !seen ? '#D9D5CB' : (passed ? '#2F7A66' : '#BE653B'));
    t.setAttribute('fill', !seen ? '#89938F' : (passed ? '#2F7A66' : '#BE653B'));
  });
  const shown=sel.filter(i=>i<Math.min(bStep,5));
  $('#bSel').textContent='[ '+shown.join(', ')+' ]';
  const branch = sel.length===5 ? 'all' : (sel.length===0 ? 'none' : 'some');
  $$('#animFilter .bbranch').forEach(g=>{
    const on = bStep>=6 && g.getAttribute('data-branch')===branch;
    g.querySelector('.branch-bg').setAttribute('fill', on ? '#E4F0EA' : '#FFFFFF');
    g.querySelector('.branch-bg').setAttribute('stroke', on ? '#2F7A66' : '#D9D5CB');
    g.setAttribute('opacity', (bStep>=6 && !on) ? '0.42' : '1');
  });
  const code = branch==='all' ? 'chunk.Reference(input)'
             : branch==='none' ? '输出空 chunk（count = 0）'
             : 'chunk.Slice(input, sel, result_count)';
  let msg;
  if(bStep<5) msg='逐行判定 '+p.label+'：已看 <b>'+bStep+' / 5</b> 行 · sel = [ '+shown.join(', ')+' ]（只算布尔，不搬数据）';
  else if(bStep===5) msg='选择完成：sel = [ '+sel.join(', ')+' ]　→ 下一步按 result_count 决定输出方式';
  else msg='PhysicalFilter 走「'+(branch==='all'?'全通过':branch==='none'?'零通过':'部分通过')+'」分支：<b>'+code+'</b>';
  $('#bOut').innerHTML=msg;
}
function bPause(){ bPlaying=false; clearInterval(bTimer); bTimer=null;
  const b=$('#bPlay'); if(b){ b.textContent='▶ 播放'; b.classList.remove('play'); } }
function bPlay(){
  if(bPlaying){ bPause(); return; }
  if(bStep>=6) bStep=0;
  bPlaying=true; $('#bPlay').textContent='❚❚ 暂停'; $('#bPlay').classList.add('play');
  bTimer=setInterval(()=>{ bStep++; bPaint(); if(bStep>=6) bPause(); },620);
}
function bTick(){ bPause(); if(bStep<6){ bStep++; bPaint(); } }
function bReset(){ bPause(); bStep=0; bPaint(); }

/* ---------------- 动画 C：批大小的定性权衡 ---------------- */
const C_SIZES=[128,512,2048,8192];
const C_LEVEL=[
  [0.92,0.20,0.20,0.20],   /* 128  */
  [0.62,0.32,0.38,0.46],   /* 512  */
  [0.30,0.56,0.58,0.56],   /* 2048 */
  [0.14,0.94,0.94,0.94]    /* 8192 */
];
const C_WORDS=['高','低','低','低','中','低','低','中','低','中','中','中','极低','高','高','高'];
let cIdx=2, cTimer=null, cPlaying=false;
function tweenW(el, target){
  const from=parseFloat(el.getAttribute('width'))||0, t0=performance.now(), dur=420;
  function frame(now){
    const p=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-p,3);
    el.setAttribute('width',(from+(target-from)*e).toFixed(1));
    if(p<1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
function cPaint(){
  const bs=C_SIZES[cIdx], rows=16384;
  $('#cSize').value=String(bs);
  for(let i=0;i<4;i++){
    const el=$('#cbar'+i); if(!el) continue;
    tweenW(el, C_LEVEL[cIdx][i]*380);
    el.setAttribute('fill', C_LEVEL[cIdx][i]>0.7 ? '#BE653B' : (C_LEVEL[cIdx][i]<0.35 ? '#2F7A66' : '#245A6B'));
    const w=C_WORDS[cIdx*4+i];
    const lv=$('#clv'+i); if(lv){ lv.textContent=w; lv.setAttribute('fill', w==='高'||w==='极高' ? '#BE653B' : (w==='低'||w==='极低' ? '#2F7A66' : '#46585F')); }
  }
  $('#cOut').innerHTML='批大小 <b>'+bs+'</b>　·　16 384 行 → <b>'+Math.ceil(rows/bs)+'</b> 批（算术示意）　·　首批要等 '+bs+' 行　·　趋势为定性示意';
}
function cPause(){ cPlaying=false; clearInterval(cTimer); cTimer=null;
  const b=$('#cPlay'); if(b){ b.textContent='▶ 播放'; b.classList.remove('play'); } }
function cPlay(){
  if(cPlaying){ cPause(); return; }
  cPlaying=true; $('#cPlay').textContent='❚❚ 暂停'; $('#cPlay').classList.add('play');
  cTimer=setInterval(()=>{ cIdx=(cIdx+1)%4; cPaint(); },1450);
}
function cTick(){ cPause(); cIdx=(cIdx+1)%4; cPaint(); }
function cReset(){ cPause(); cIdx=2; cPaint(); }

function init(){
  render(); fit();
  let saved=0; try{ saved=parseInt(localStorage.getItem('vecbatch-slide')||'0',10)||0; }catch(e){}
  go(Math.min(saved,N-1),true);
  $('#btnPrev').onclick=prev; $('#btnNext').onclick=next;
  $('#btnToc').onclick=()=>togglePane('toc');
  $('#btnNotes').onclick=()=>togglePane('here');
  $('#btnAll').onclick=()=>togglePane('all');
  $('#btnAuto').onclick=toggleAuto;
  $('#btnFs').onclick=fs;
  $('#btnHelp').onclick=()=>togglePane('help');
  $('#paneClose').onclick=closePane;
  aPaint(); bPaint(); cPaint();
  ['aRows','aBatch'].forEach(id=>{ const el=$('#'+id); if(el) el.addEventListener('input',aReset); });
  const bp=$('#bPredSel'); if(bp) bp.addEventListener('change',bReset);
  const cs=$('#cSize'); if(cs) cs.addEventListener('change',()=>{
    const v=+cs.value, i=C_SIZES.indexOf(v); if(i>=0){ cPause(); cIdx=i; cPaint(); }
  });
  const bind=(id,fn)=>{ const el=$(id); if(el) el.onclick=fn; };
  bind('#aPlay',aPlay); bind('#aTick',aTick); bind('#aReset',aReset);
  bind('#bPlay',bPlay); bind('#bTick',bTick); bind('#bReset',bReset);
  bind('#cPlay',cPlay); bind('#cTick',cTick); bind('#cReset',cReset);
}
document.addEventListener('DOMContentLoaded', init);
</script>
