d 两套都担。</text></svg>"}, {"eyebrow": "效果 · 一笔账", "title": "收益和代价都真实，别只讲一边", "lede": "收益来自少分派、少物化、可内联、编译器优化与多核喂饱；代价是编译时间进入端到端延迟、缓存与失效、复杂语义、debug 难度，以及短查询可能白付编译费。", "caption": "图 17　端到端延迟 = 编译时间 + 执行时间；compact_vis() 的「付拷贝换后续省」是同构的局部取舍。", "bridge": "既然是一笔账，就不该凭感觉。下一页把这个判断做成可以调的示意。", "notes": "不脱离 workload 谈效果，先说收益，六条：减少算子边界调用和解释器分派、减少临时 tuple 或 chunk 物化、把表达式和算子逻辑内联进一个紧循环、让编译器做寄存器分配和常量折叠死代码删除循环优化、对长扫描和 join probe 局部聚合更友好、和 morsel 并行结合后更容易喂饱多核。再说代价，五条：编译时间直接进入端到端延迟；代码缓存占内存还要失效策略；UDF、复杂类型、NULL 语义、collation、decimal 溢出会拉高生成复杂度；生成代码难 debug，EXPLAIN、profile、fallback 必须变成一等能力；还有最容易被忽略的，一次性短查询、低 CPU 查询、I/O 等待主导的查询，收益可能很小。所以公式很简单：端到端延迟等于编译时间加执行时间。JIT 编译耗时如果被单独统计，必须和执行时间一起解释；平均值变好，不代表 P95、P99 变好。有意思的是，RisingWave 的 DataChunk::compact_vis 注释里也写着同样的取舍：压缩 visibility 要复制列数据，成本是拷贝，收益是后续更少隐藏行、更少内存。局部决策和 Codegen 大方向一致——为了热路径效率，愿意在合适位置付前置成本，前提是收益能覆盖成本。", "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"20\" y=\"26\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"2.6\" >效果 · 收益与代价都真实</text><text x=\"1380\" y=\"26\" class=\"sv \" text-anchor=\"end\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" letter-spacing=\"0\" >不要脱离 workload 谈效果</text><line x1=\"20\" y1=\"38\" x2=\"1380\" y2=\"38\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"40\" y=\"54\" width=\"640\" height=\"274\" rx=\"2\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"56\" y=\"83\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#2F7A66\" font-weight=\"600\" letter-spacing=\"0\" >收益 · 机制层面</text><text x=\"56\" y=\"112\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >减少算子边界调用与解释器分派</text><text x=\"56\" y=\"147\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >减少临时 tuple / chunk 物化</text><text x=\"56\" y=\"182\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >表达式与算子逻辑内联进一个紧循环</text><text x=\"56\" y=\"217\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >编译器做寄存器分配、常量折叠、死代码删除</text><text x=\"56\" y=\"252\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >长扫描、join probe、局部聚合更新更友好</text><text x=\"56\" y=\"287\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >与 morsel 并行结合后更容易喂饱多核</text><rect x=\"700\" y=\"54\" width=\"660\" height=\"274\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"716\" y=\"83\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#BE653B\" font-weight=\"600\" letter-spacing=\"0\" >代价 · 工程层面</text><text x=\"716\" y=\"112\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >编译时间直接进入端到端延迟</text><text x=\"716\" y=\"147\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >代码缓存占内存，且需要失效策略</text><text x=\"716\" y=\"182\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >UDF、复杂类型、NULL 语义、collation、decimal 溢出</text><text x=\"716\" y=\"217\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >生成代码难 debug，EXPLAIN / profile / fallback 要一等能力</text><text x=\"716\" y=\"252\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >一次性短查询、低 CPU、I/O 等待主导时收益可能很小</text><rect x=\"40\" y=\"340\" width=\"1320\" height=\"58\" rx=\"2\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1\" /><text x=\"64\" y=\"366\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#FFFFFF\" font-weight=\"600\" letter-spacing=\"0\" >端到端延迟 = 编译时间 + 执行时间</text><text x=\"660\" y=\"368\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#CFE0DC\" font-weight=\"400\" letter-spacing=\"0\" >JIT 编译时间若被单独统计，必须和执行时间一起解释；平均值变好不代表 P95 / P99 变好。</text><text x=\"20\" y=\"420\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >RisingWave 的 DataChunk::compact_vis() 是同构的局部取舍：付一次拷贝成本，换后续更少隐藏行与更少内存。</text></svg>"}, {"eyebrow": "关键判断 · 是否回本", "title": "这条路径热到值得编译吗", "lede": "是否使用 LLVM Codegen，第一问不是「能不能生成代码」，而是「这条路径是否热到值得编译」。编译固定成本必须被足够长的热路径摊薄。", "caption": "图 18　条形与数字为相对成本的算术示意，非实测性能数据；可调编译固定成本，播放看三种查询规模的结论。", "bridge": "道理讲透了，落到手上：怎么在自己的环境里验证，而不是听我给一个假数字。", "notes": "把上一页那笔账做成一个可以调的示意。横条是相对成本，纯算术演示，没有任何真实耗时：解释执行按每行四份相对成本累计；编译路径先付一笔固定的编译成本，再按每行一份相对成本累计。切换编译固定成本的低中高三档，按单步或播放，从一百行的短查询走到一万行再到一百万行的长分析。你会发现短查询那一档，陶橙的固定编译成本根本没被摊薄，编译路径反而更贵；到了长分析那一档，青绿的每行成本优势累积起来，固定成本被摊平，编译才划算。这正是 PostgreSQL 里 jit_above_cost 这类门槛在做的事，也解释了为什么短查询开 JIT 可能变慢。图里的数字全部是示意单位，别当成 benchmark。最后别忘了右侧那句：EXPLAIN 要能回答四个问题——是否编译了、编译用了多久、用了哪个 fallback、命中代码缓存了吗。没有这四个答案，这笔账在生产里根本算不了。", "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" id=\"animD\"><text x=\"20\" y=\"26\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"2.6\" >关键判断 · 这条路径热到值得编译吗</text><text x=\"1380\" y=\"26\" class=\"sv \" text-anchor=\"end\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" letter-spacing=\"0\" >编译型执行是高温路径优化，不是默认正确答案</text><line x1=\"20\" y1=\"38\" x2=\"1380\" y2=\"38\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"40\" y=\"62\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"600\" letter-spacing=\"0\" >相对成本（示意单位，纯算术演示，非实测性能数据）</text><text x=\"40\" y=\"112\" class=\"sv serif\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" letter-spacing=\"0\" >解释执行</text><text x=\"40\" y=\"172\" class=\"sv serif\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" letter-spacing=\"0\" >编译路径</text><rect x=\"200\" y=\"92\" width=\"880\" height=\"36\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect id=\"dBarI\" x=\"200\" y=\"92\" width=\"0\" height=\"36\" rx=\"2\" fill=\"#74A5AD\" stroke=\"#245A6B\" stroke-width=\"1\"/><rect x=\"200\" y=\"152\" width=\"880\" height=\"36\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect id=\"dC0\" x=\"200\" y=\"152\" width=\"0\" height=\"36\" rx=\"2\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\"/><rect id=\"dC1\" x=\"200\" y=\"152\" width=\"0\" height=\"36\" rx=\"2\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1\"/><text x=\"200\" y=\"208\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" letter-spacing=\"0\" >陶橙＝固定编译成本　青绿＝每行执行成本（编译后）</text><text id=\"dValI\" x=\"1340\" y=\"116\" class=\"sv mono\" text-anchor=\"end\" font-size=\"14\" fill=\"#245A6B\" font-weight=\"600\">—</text><text id=\"dValC\" x=\"1340\" y=\"176\" class=\"sv mono\" text-anchor=\"end\" font-size=\"14\" fill=\"#BE653B\" font-weight=\"600\">—</text><rect id=\"dVerdict\" x=\"40\" y=\"222\" width=\"1320\" height=\"48\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\"/><text id=\"dVerdictTx\" x=\"60\" y=\"252\" class=\"sv serif\" font-size=\"17\" fill=\"#BE653B\" font-weight=\"600\">按播放或单步，看编译成本何时被摊薄</text><rect class=\"dsc\" id=\"dSc0\" x=\"40\" y=\"286\" width=\"420\" height=\"38\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text class=\"sv dsctx\" id=\"dScTx0\" x=\"250\" y=\"311\" text-anchor=\"middle\" font-size=\"14\" fill=\"#89938F\" font-weight=\"600\">短查询 · 100 行</text><rect class=\"dsc\" id=\"dSc1\" x=\"490\" y=\"286\" width=\"420\" height=\"38\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text class=\"sv dsctx\" id=\"dScTx1\" x=\"700\" y=\"311\" text-anchor=\"middle\" font-size=\"14\" fill=\"#89938F\" font-weight=\"600\">中查询 · 10 000 行</text><rect class=\"dsc\" id=\"dSc2\" x=\"940\" y=\"286\" width=\"420\" height=\"38\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text class=\"sv dsctx\" id=\"dScTx2\" x=\"1150\" y=\"311\" text-anchor=\"middle\" font-size=\"14\" fill=\"#89938F\" font-weight=\"600\">长分析 · 1 000 000 行</text><rect x=\"40\" y=\"338\" width=\"1320\" height=\"58\" rx=\"2\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1\" /><text x=\"64\" y=\"364\" class=\"sv serif\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#1B2B33\" font-weight=\"600\" letter-spacing=\"0\" >EXPLAIN 该回答的四问：是否编译了 · 编译用了多久 · 用了哪个 fallback · 命中代码缓存了吗。</text><text x=\"20\" y=\"420\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >条形长度与数字都是相对成本的算术示意，不代表任何真实耗时；结论只用于说明固定成本需要被热路径摊薄。</text></svg>", "ctrl": "<label>编译固定成本</label><select id=\"dCost\"><option value=\"2000\">低</option><option value=\"20000\" selected>中</option><option value=\"200000\">高</option></select>\n<button class=\"btn play\" id=\"dPlay\">▶ 播放</button><button class=\"btn\" id=\"dTick\">单步</button><button class=\"btn\" id=\"dReset\">重置</button>\n<span class=\"out\" id=\"dOut\"></span>"}, {"eyebrow": "实操 · 可验证模板", "title": "两个 DEMO，不给伪造耗时", "lede": "当前环境没有启动 RisingWave 集群，也没有在本机编译带 LLVM Codegen 的内核，所以不提供虚假执行耗时；只给两个可以直接复制到自己环境里验证的实验模板。", "caption": "图 19　左：RisingWave EXPLAIN 与 chunk 入口核对；右：PostgreSQL JIT on / off 对照。本文未执行这些 SQL。", "bridge": "实验会告诉你「是不是」，接下来三个角色要回答「那我该改什么」。", "notes": "这一节我特别想强调诚实：本机当时没启动 RisingWave 服务，也没有编译带 LLVM Codegen 的内核，所以不给任何执行耗时，只给可以自己验证的模板。第一个 DEMO 在 RisingWave 里建 orders 表，对那条分组求和的查询跑 EXPLAIN，看计划里有没有 scan、filter、project、aggregate，再对照 filter.rs 和 project.rs，确认 filter 和 project 是对 DataChunk 执行表达式；对照 expr/mod.rs，确认表达式入口是 eval 和 eval_v2，不是 LLVM IR 生成。第二个 DEMO 用 PostgreSQL 的 JIT：SHOW jit，先 SET jit 等于 off 跑一次 EXPLAIN ANALYZE BUFFERS，再 SET jit 等于 on 跑同一条，看输出里有没有 JIT 段的 Functions、Options、Timing，比较总耗时和编译耗时；然后把一千万行调成一万行，看短查询是不是反而变慢。这里有个边界必须讲清楚：PostgreSQL 的 JIT 主要是把表达式求值和 tuple deforming 编译掉，仍然跑在 Pull 的 iterator 框架里，不等于把整条 pipeline 编译成 Push 机器码，也不代表 RisingWave 支持相同功能。它验证的是 LLVM / JIT 的普遍成本机制。", "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"20\" y=\"26\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"2.6\" >实操 · 两个可验证实验模板</text><text x=\"1380\" y=\"26\" class=\"sv \" text-anchor=\"end\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" letter-spacing=\"0\" >本节不给伪造 benchmark</text><line x1=\"20\" y1=\"38\" x2=\"1380\" y2=\"38\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"40\" y=\"54\" width=\"640\" height=\"276\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"60\" y=\"84\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >DEMO 1 · RisingWave 看计划与 chunk 入口</text><rect x=\"60\" y=\"98\" width=\"600\" height=\"132\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"76\" y=\"118\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#1B2B33\" font-weight=\"400\" letter-spacing=\"0\" >CREATE TABLE orders (</text><text x=\"76\" y=\"135\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#1B2B33\" font-weight=\"400\" letter-spacing=\"0\" >  id BIGINT, region VARCHAR,</text><text x=\"76\" y=\"152\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#1B2B33\" font-weight=\"400\" letter-spacing=\"0\" >  status VARCHAR, amount DOUBLE PRECISION</text><text x=\"76\" y=\"169\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#1B2B33\" font-weight=\"400\" letter-spacing=\"0\" >);</text><text x=\"76\" y=\"186\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#1B2B33\" font-weight=\"400\" letter-spacing=\"0\" >EXPLAIN SELECT region, sum(amount) FROM orders</text><text x=\"76\" y=\"203\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#1B2B33\" font-weight=\"400\" letter-spacing=\"0\" >  WHERE status = &#x27;paid&#x27; AND amount &gt; 100</text><text x=\"76\" y=\"220\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#1B2B33\" font-weight=\"400\" letter-spacing=\"0\" >  GROUP BY region;</text><text x=\"60\" y=\"252\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >· 验证：计划里是否出现 scan / filter / project / aggregate</text><text x=\"60\" y=\"276\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >· 对照 filter.rs、project.rs：表达式作用于 DataChunk</text><text x=\"60\" y=\"300\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >· 对照 expr/mod.rs：入口是 eval / eval_v2，不是 LLVM IR</text><rect x=\"700\" y=\"54\" width=\"660\" height=\"276\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"720\" y=\"84\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >DEMO 2 · PostgreSQL JIT 看「短查询不一定划算」</text><rect x=\"720\" y=\"98\" width=\"620\" height=\"132\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"736\" y=\"118\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#1B2B33\" font-weight=\"400\" letter-spacing=\"0\" >SHOW jit;   SET jit = off;</text><text x=\"736\" y=\"137\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#1B2B33\" font-weight=\"400\" letter-spacing=\"0\" >EXPLAIN (ANALYZE, BUFFERS) SELECT sum(i)</text><text x=\"736\" y=\"156\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#1B2B33\" font-weight=\"400\" letter-spacing=\"0\" >  FROM generate_series(1, 10000000) AS t(i)</text><text x=\"736\" y=\"175\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#1B2B33\" font-weight=\"400\" letter-spacing=\"0\" >  WHERE i % 7 = 0;</text><text x=\"736\" y=\"194\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#1B2B33\" font-weight=\"400\" letter-spacing=\"0\" >SET jit = on;  再跑同一条 EXPLAIN</text><text x=\"736\" y=\"213\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#1B2B33\" font-weight=\"400\" letter-spacing=\"0\" >把 10000000 调成 10000，观察短查询</text><text x=\"720\" y=\"252\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >· 验证：JIT 段的 Functions / Options / Timing</text><text x=\"720\" y=\"276\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >· 比较总耗时与编译耗时，看编译成本是否反超</text><text x=\"720\" y=\"300\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >· 编译决策在规划期，由 jit_above_cost 等阈值控制</text><rect x=\"40\" y=\"342\" width=\"1320\" height=\"58\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"64\" y=\"368\" class=\"sv serif\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"600\" letter-spacing=\"0\" >本文没有执行这些 SQL：当时未启动 RisingWave 服务，也没有在本机编译带 LLVM Codegen 的内核。</text><text x=\"20\" y=\"420\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >PG 的 JIT 主要编译表达式求值与 tuple deforming，仍在 Pull 框架内；验证的是 LLVM / JIT 的普遍成本机制。</text></svg>"}, {"eyebrow": "落地 · 三个角色", "title": "把动作落在能形成长 pipeline 的地方", "lede": "架构师按 workload 分类并要求 fallback；DBA 看端到端延迟与分位数；业务开发者固定 SQL 形状、少写黑盒 UDF——三类动作指向同一件事。", "caption": "图 20　三层角色对应动作；越靠右越贴近日常写 SQL 的决策。", "bridge": "动作清楚了，边界也就出来了：什么样的查询值得走这条路。", "notes": "三个角色，各改各的，但方向一致。给数据库架构师：先按 workload 分类，别用「是否先进」判断执行模型；长分析查询、稳定报表、CPU 密集型表达式、热点物化查询更可能受益；要求执行引擎提供 fallback，编译失败、UDF 不支持、类型路径不支持时必须能退回解释型或向量化；把代码缓存、编译队列、编译耗时、命中率、失效率纳入容量设计。给 DBA：关注端到端延迟而不是只看执行阶段，JIT 编译时间若单独统计要和执行时间一起解释；短查询和长查询的分位数要分开看，平均值变好不代表 P95、P99 变好；对 ad hoc 系统要谨慎，计划变化频繁会拉低缓存命中率。给业务开发者：SQL 写法仍然重要，能让优化器形成长 pipeline 的写法，通常比把逻辑藏进黑盒 UDF 更容易被优化；复杂表达式、类型转换和 NULL 语义会影响生成路径；性能敏感查询固定 SQL 形状、用参数而不是拼接大量不同 SQL，有助于计划和代码缓存复用。三句话合起来就是：把不确定性留在 SQL 之外，把热路径留给编译器。", "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"20\" y=\"26\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"2.6\" >落地 · 三个角色各自该改什么</text><text x=\"1380\" y=\"26\" class=\"sv \" text-anchor=\"end\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" letter-spacing=\"0\" >动作要落在「能形成长 pipeline」的地方</text><line x1=\"20\" y1=\"38\" x2=\"1380\" y2=\"38\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"40\" y=\"54\" width=\"425\" height=\"292\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"40\" y=\"54\" width=\"425\" height=\"46\" rx=\"0\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"60\" y=\"84\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#FFFFFF\" font-weight=\"600\" letter-spacing=\"0\" >数据库架构师</text><rect x=\"58\" y=\"114\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"72\" y=\"132\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >先按 workload 分类，别用「是否先进」判断模型</text><rect x=\"58\" y=\"166\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"72\" y=\"184\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >长分析、稳定报表、CPU 密集表达式更可能受益</text><rect x=\"58\" y=\"218\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"72\" y=\"236\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >要求引擎提供 fallback：编译失败能回退</text><rect x=\"58\" y=\"270\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"72\" y=\"288\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >把代码缓存、编译队列、命中率纳入容量设计</text><rect x=\"485\" y=\"54\" width=\"425\" height=\"292\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"485\" y=\"54\" width=\"425\" height=\"46\" rx=\"0\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"505\" y=\"84\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#FFFFFF\" font-weight=\"600\" letter-spacing=\"0\" >DBA</text><rect x=\"503\" y=\"114\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"517\" y=\"132\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >看端到端延迟，别只盯执行阶段</text><rect x=\"503\" y=\"166\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"517\" y=\"184\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >JIT 编译耗时必须和执行时间一起解释</text><rect x=\"503\" y=\"218\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"517\" y=\"236\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >分位数分开看：P95 / P99 不一定跟着平均值变好</text><rect x=\"503\" y=\"270\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"517\" y=\"288\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >ad hoc 系统要谨慎，计划多变会降低缓存命中率</text><rect x=\"930\" y=\"54\" width=\"425\" height=\"292\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"930\" y=\"54\" width=\"425\" height=\"46\" rx=\"0\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"950\" y=\"84\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#FFFFFF\" font-weight=\"600\" letter-spacing=\"0\" >业务开发者</text><rect x=\"948\" y=\"114\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"962\" y=\"132\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >SQL 写法仍重要：别把逻辑藏进黑盒 UDF</text><rect x=\"948\" y=\"166\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"962\" y=\"184\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >复杂表达式、类型转换、NULL 语义影响生成路径</text><rect x=\"948\" y=\"218\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"962\" y=\"236\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >固定 SQL 形状、用参数而不是拼接大量不同 SQL</text><rect x=\"948\" y=\"270\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"962\" y=\"288\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >让优化器有机会形成长 pipeline 与可复用计划</text><rect x=\"40\" y=\"358\" width=\"1320\" height=\"44\" rx=\"2\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"64\" y=\"386\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#2F7A66\" font-weight=\"600\" letter-spacing=\"0\" >共同原则：让计划形状稳定可复用，让 fallback 与可观测性成为一等能力。</text><text x=\"20\" y=\"420\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >三条动作指向同一件事：把不确定性留在 SQL 之外，把热路径留给编译器。</text></svg>"}, {"eyebrow": "边界 · 三个问题", "title": "热、稳、长，才轮到编译", "lede": "适合：扫描量大 CPU 主导的 OLAP、重复报表、长 pipeline、数据在内存中、能接受 warm-up。不适合：短查询、高度动态 SQL、黑盒 UDF、I/O 等待主导、缺可观测性的系统。", "caption": "图 21　判断顺序：是否高温路径 → 是否 CPU 密集且 pipeline 长 → 缓存 / fallback / 可观测性是否齐备。", "bridge": "边界划完，最后把最容易踩的七个坑一次说清。", "notes": "把适用边界收成三个按顺序问的问题。第一，这条路径是不是高温路径，重复不重复；第二，是不是 CPU 计算占主导、pipeline 足够长；第三，代码缓存、fallback、EXPLAIN 与 profile 这些周边设施齐不齐。三问都答是，编译型 Push 才轮得到上场：扫描量大的 OLAP、重复执行的报表和仪表盘、Scan 到 Filter 到 Project 到 Join Probe 到 Local Agg 这类长 pipeline、数据已经在内存或高速缓存里、系统能接受 warm-up 或 hybrid。反过来，单次执行的小短查询、计划形状天天变的高动态 SQL、黑盒 UDF 太多生不出等价 IR、I/O 或网络或远端对象存储延迟占主导、以及缺少 profile 和 fallback 的生产系统，都别硬上。三问里任何一个答否，就保持解释型或向量化，或者走 Hybrid。再重复一次那句结论：是否使用 LLVM Codegen，第一问不是「能不能生成代码」，而是「这条路径是否热到值得编译」。编译型执行是高温路径优化，不是默认正确答案。", "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"20\" y=\"26\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"2.6\" >边界 · 第一问不是「能不能生成代码」</text><text x=\"1380\" y=\"26\" class=\"sv \" text-anchor=\"end\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" letter-spacing=\"0\" >而是「这条路径是否热到值得编译」</text><line x1=\"20\" y1=\"38\" x2=\"1380\" y2=\"38\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"40\" y=\"54\" width=\"425\" height=\"48\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#7BA6AF\" stroke-width=\"1\" /><text x=\"252.5\" y=\"83.1\" class=\"sv \" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >① 是否高温路径？</text><line x1=\"467\" y1=\"78\" x2=\"474\" y2=\"78\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><polygon points=\"483,78 473,73 473,83\" fill=\"#7BA6AF\"/><rect x=\"485\" y=\"54\" width=\"425\" height=\"48\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#7BA6AF\" stroke-width=\"1\" /><text x=\"697.5\" y=\"83.1\" class=\"sv \" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >② 是否 CPU 密集且 pipeline 长？</text><line x1=\"912\" y1=\"78\" x2=\"919\" y2=\"78\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><polygon points=\"928,78 918,73 918,83\" fill=\"#7BA6AF\"/><rect x=\"930\" y=\"54\" width=\"425\" height=\"48\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#7BA6AF\" stroke-width=\"1\" /><text x=\"1142.5\" y=\"83.1\" class=\"sv \" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >③ 缓存 / fallback / 可观测性齐备？</text><rect x=\"40\" y=\"118\" width=\"650\" height=\"232\" rx=\"2\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"64\" y=\"150\" class=\"sv serif\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#2F7A66\" font-weight=\"600\" letter-spacing=\"0\" >适合 · 热、稳、长</text><text x=\"64\" y=\"184\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" letter-spacing=\"0\" >· 扫描量大、CPU 计算占主导的 OLAP 查询</text><text x=\"64\" y=\"216\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" letter-spacing=\"0\" >· 重复执行的报表、仪表盘、预定义分析</text><text x=\"64\" y=\"248\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" letter-spacing=\"0\" >· Scan → Filter → Project → Join Probe → Local Agg</text><text x=\"64\" y=\"280\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" letter-spacing=\"0\" >· 数据在内存或高速缓存中，I/O 不是主瓶颈</text><text x=\"64\" y=\"312\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" letter-spacing=\"0\" >· 可以接受 warm-up 或 hybrid 执行的系统</text><rect x=\"710\" y=\"118\" width=\"650\" height=\"232\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"734\" y=\"150\" class=\"sv serif\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#BE653B\" font-weight=\"600\" letter-spacing=\"0\" >不适合 · 冷、变、短</text><text x=\"734\" y=\"184\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" letter-spacing=\"0\" >· 单次执行、数据量很小的短查询</text><text x=\"734\" y=\"216\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" letter-spacing=\"0\" >· 高度动态 SQL，计划形状经常变化</text><text x=\"734\" y=\"248\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" letter-spacing=\"0\" >· 黑盒 UDF 很多，无法内联或生成等价 IR</text><text x=\"734\" y=\"280\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" letter-spacing=\"0\" >· I/O、网络、远端对象存储延迟占主导</text><text x=\"734\" y=\"312\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" letter-spacing=\"0\" >· 缺少 profile、EXPLAIN、fallback、缓存上限</text><rect x=\"40\" y=\"362\" width=\"1320\" height=\"40\" rx=\"2\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1\" /><text x=\"64\" y=\"388\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#FFFFFF\" font-weight=\"600\" letter-spacing=\"0\" >三问中任一为否 → 保持解释型 / 向量化，或走 Hybrid；别硬上编译。</text><text x=\"20\" y=\"420\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >编译型执行是高温路径优化，不是默认正确答案；判断顺序比技术选型更重要。</text></svg>"}, {"eyebrow": "避坑 · 七个误会", "title": "把一件事当成另一件事", "lede": "向量化当 Codegen、只测长查询、忽略缓存失效、生成代码不可观测、强行融合所有算子、忽略异常语义、把批处理 Codegen 照搬进流处理。", "caption": "图 22　左列是坑，右列是正解；其中流处理一条对应 StreamChunk 与 barrier 的控制语义。", "bridge": "坑讲完，把这一讲的因果链倒回去收个尾。", "notes": "最后七个坑，其实大多是同一个毛病的不同侧面：把一件事当成另一件事。一，把向量化当成 LLVM Codegen——向量化是批量列数组，Codegen 是运行时生成专用机器码，可以组合但不等价。二，只 benchmark 长查询——长查询变快很常见，短查询可能因编译成本变慢，必须按查询类别分别评估。三，忽略代码缓存失效——schema、函数定义、类型、统计信息、执行参数都可能影响生成代码，缓存没有边界会变成内存问题。四，生成代码不可观测——生产系统必须能回答是否编译、编译多久、用了哪个 fallback、有没有命中缓存。五，把所有算子强行塞进一个 pipeline——Sort、全局聚合、hash join build 天然会切断，过度融合让代码巨大、编译慢、指令 cache 承压。六，忽略异常语义——NULL、溢出、时区、collation、decimal、错误处理、UDF 安全边界，数据库表达式不是普通算术。七，在流处理里照搬批处理 Codegen——流处理有 barrier、watermark、更新语义、状态清理和一致性约束，RisingWave 的 stream executor 处理 StreamChunk 和 barrier，这些控制消息不能被简单当成 batch pipeline 里的一批数据。这七条，条条都能挂回前面某一页。", "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"20\" y=\"26\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"2.6\" >避坑 · 七个误会</text><text x=\"1380\" y=\"26\" class=\"sv \" text-anchor=\"end\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" letter-spacing=\"0\" >多数坑都是「把一件事当成另一件事」</text><line x1=\"20\" y1=\"38\" x2=\"1380\" y2=\"38\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"40\" y=\"54\" width=\"610\" height=\"32\" rx=\"0\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1\" /><text x=\"56\" y=\"76\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#FFFFFF\" font-weight=\"600\" letter-spacing=\"0\" >常见坑</text><rect x=\"670\" y=\"54\" width=\"690\" height=\"32\" rx=\"0\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1\" /><text x=\"686\" y=\"76\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#FFFFFF\" font-weight=\"600\" letter-spacing=\"0\" >正解</text><rect x=\"40\" y=\"88\" width=\"610\" height=\"40\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"56\" y=\"114\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#BE653B\" font-weight=\"600\" letter-spacing=\"0\" >把「向量化」当成「LLVM Codegen」</text><rect x=\"670\" y=\"88\" width=\"690\" height=\"40\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"686\" y=\"114\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" letter-spacing=\"0\" >向量化是批量列数组；Codegen 是运行时生成专用机器码，可组合但不等价</text><rect x=\"40\" y=\"130\" width=\"610\" height=\"40\" rx=\"0\" fill=\"#FBF3EC\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"56\" y=\"156\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#BE653B\" font-weight=\"600\" letter-spacing=\"0\" >只 benchmark 长查询</text><rect x=\"670\" y=\"130\" width=\"690\" height=\"40\" rx=\"0\" fill=\"#F1F7F3\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"686\" y=\"156\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" letter-spacing=\"0\" >短查询可能因编译成本变慢，必须按查询类别分别评估</text><rect x=\"40\" y=\"172\" width=\"610\" height=\"40\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"56\" y=\"198\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#BE653B\" font-weight=\"600\" letter-spacing=\"0\" >忽略代码缓存失效</text><rect x=\"670\" y=\"172\" width=\"690\" height=\"40\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"686\" y=\"198\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" letter-spacing=\"0\" >schema、UDF、类型、统计信息、执行参数都会影响生成代码</text><rect x=\"40\" y=\"214\" width=\"610\" height=\"40\" rx=\"0\" fill=\"#FBF3EC\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"56\" y=\"240\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#BE653B\" font-weight=\"600\" letter-spacing=\"0\" >生成代码不可观测</text><rect x=\"670\" y=\"214\" width=\"690\" height=\"40\" rx=\"0\" fill=\"#F1F7F3\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"686\" y=\"240\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" letter-spacing=\"0\" >必须能回答：是否编译、编译多久、用了哪个 fallback、是否命中缓存</text><rect x=\"40\" y=\"256\" width=\"610\" height=\"40\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"56\" y=\"282\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#BE653B\" font-weight=\"600\" letter-spacing=\"0\" >把所有算子塞进一个 pipeline</text><rect x=\"670\" y=\"256\" width=\"690\" height=\"40\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"686\" y=\"282\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" letter-spacing ize=\"15.0\" fill=\"#FFFFFF\" font-weight=\"600\" letter-spacing=\"0\" >带走三句话：计划不是终点，代码才是热路径 · 编译型 Push 是高温路径优化 · 可观测性与 fallback 是前提。</text><text x=\"20\" y=\"420\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >本讲用 RisingWave 的 chunk 执行器作对照样本，未声称其已实现 LLVM Codegen；重要结论请回到本地源码版本验证。</text></svg>"}];
const N = D.length;
let cur = 0, autoTimer = null, autoOn = false, paneMode = 'none';
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

function fit(){
  const vp = $('#viewport');
  const W = vp.clientWidth, H = vp.clientHeight;
  const open = document.body.classList.contains('pane-open');
  const paneW = open ? $('#pane').offsetWidth : 0;
  const avail = W - paneW, pad = 16;
  const s = Math.min((avail - pad*2) / 1600, (H - pad*2) / 900);
  const st = $('#stage');
  st.style.transform = 'scale(' + s + ')';
  st.style.left = ((avail - 1600*s)/2) + 'px';
  st.style.top  = ((H - 900*s)/2) + 'px';
}
window.addEventListener('resize', fit);

function render(){
  $('#slides').innerHTML = D.map((d,i) =>
    '<section class="slide" id="s'+i+'">'
    + '<div class="eyebrow"><span class="num">'+String(i+1).padStart(2,'0')+' / '+String(N).padStart(2,'0')+'</span>'+d.eyebrow+'</div>'
    + '<h1 class="title">'+d.title+'</h1>'
    + '<div class="lede">'+d.lede+'</div>'
    + '<div class="rule"></div>'
    + '<div class="figwrap">'+d.svg+'</div>'
    + (d.ctrl ? '<div class="ctrls">'+d.ctrl+'</div><div class="caption under">'+d.caption+'</div>'
              : '<div class="caption">'+d.caption+'</div>')
    + '<div class="bridge"><span class="bk">承接 · NEXT</span>'+d.bridge+'</div>'
    + '<div class="footer"><div class="fbar"><i id="fbar'+i+'"></i></div>'
    + '<span class="fl">数据库筑基课 · 编译型 Push 模型（LLVM Codegen）</span>'
    + '<span class="fr">'+String(i+1).padStart(2,'0')+' / '+String(N).padStart(2,'0')+'</span></div>'
    + '</section>').join('');
}

function pauseAnims(){ aPause(); bPause(); cPause(); dPause(); }
function go(i, silent){
  i = Math.max(0, Math.min(N-1, i));
  if(i !== cur) pauseAnims();
  $$('.slide').forEach((el,k)=>el.classList.toggle('on', k===i));
  cur = i;
  try{ localStorage.setItem('pushcodegen-slide', String(i)); }catch(e){}
  $('#pg').textContent = String(i+1).padStart(2,'0') + ' / ' + String(N).padStart(2,'0');
  $('#track i').style.width = ((i+1)/N*100)+'%';
  for(let k=0;k<N;k++){ const b=$('#fbar'+k); if(b) b.style.width = (k<=i?100:0)+'%'; }
  if(!silent) toast(D[i].eyebrow + ' · ' + D[i].title);
  syncPane();
}
function next(){ if(cur<N-1) go(cur+1); else stopAuto(); }
function prev(){ if(cur>0) go(cur-1); }

function toast(s){
  const t=$('#toast'); t.textContent=s; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1700);
}

function stopAuto(){
  autoOn=false; clearInterval(autoTimer); autoTimer=null;
  $('#btnAuto').textContent='▶ 自动播放 P'; $('#btnAuto').classList.remove('act');
}
function toggleAuto(){
  if(autoOn){ stopAuto(); toast('已暂停自动播放'); return; }
  autoOn=true; $('#btnAuto').textContent='❚❚ 暂停 P'; $('#btnAuto').classList.add('act');
  autoTimer=setInterval(()=>{ if(cur<N-1) go(cur+1,true); else stopAuto(); }, 12000);
  toast('自动播放：每 12 秒一页，P 暂停');
}

/* ---------------- 右侧页内开窗：here / all / toc / help ---------------- */
function paneOpen(){ return document.body.classList.contains('pane-open'); }
function setChrome(){
  [['toc','#btnToc'],['here','#btnNotes'],['all','#btnAll'],['help','#btnHelp']].forEach(([m,sel])=>{
    $(sel).classList.toggle('act', paneOpen() && paneMode===m);
  });
}
function secHtml(d,i,withBridge){
  return '<section class="pn-sec" data-page="'+i+'" onclick="jump('+i+')">'
    + '<span class="pn-n">'+String(i+1).padStart(2,'0')+' / '+String(N).padStart(2,'0')+' · '+d.eyebrow+'</span>'
    + '<h3>'+d.title+'</h3><p>'+d.notes+'</p>'
    + (withBridge ? '<p class="pn-b">「承接 · NEXT」'+d.bridge+'</p>' : '')
    + '</section>';
}
function renderPane(){
  const body = $('#paneBody');
  if(paneMode==='here'){
    const d=D[cur];
    $('#paneNum').textContent = String(cur+1).padStart(2,'0')+' / '+String(N).padStart(2,'0');
    $('#paneTitle').textContent = '本页讲稿';
    body.innerHTML = secHtml(d,cur,true)
      + '<div class="pn-sec" style="cursor:default"><p class="pn-tip">按 N 关闭本窗 · 按 T 通读全文讲稿 · 翻页时这里会自动换成新一页的讲稿。</p></div>';
    body.scrollTop = 0;
  } else if(paneMode==='all'){
    $('#paneNum').textContent = '共 '+N+' 页';
    $('#paneTitle').textContent = '全文讲稿';
    body.innerHTML = D.map((d,i)=>secHtml(d,i,true)).join('');
  } else if(paneMode==='toc'){
    $('#paneNum').textContent = '共 '+N+' 页';
    $('#paneTitle').textContent = '目录 · 点击跳转';
    body.innerHTML = '<div class="toc-grid">'
      + D.map((d,i)=>'<a class="toc-item" data-page="'+i+'" onclick="jump('+i+')">'
        +'<span class="tn">'+String(i+1).padStart(2,'0')+'</span>'
        +'<span class="tt">'+d.title+'</span></a>').join('') + '</div>';
  } else if(paneMode==='help'){
    $('#paneNum').textContent = '操作备忘';
    $('#paneTitle').textContent = '快捷键';
    body.innerHTML = '<div class="keys2">'
      + '<div><kbd>→ / 空格 / PageDown</kbd>下一页</div>'
      + '<div><kbd>← / PageUp</kbd>上一页</div>'
      + '<div><kbd>G</kbd>目录（再按一次关闭）</div>'
      + '<div><kbd>N</kbd>本页讲稿（页内右侧开窗，再按关闭）</div>'
      + '<div><kbd>T</kbd>全文讲稿（自动定位当前页，翻页联动滚动）</div>'
      + '<div><kbd>P</kbd>自动播放 / 暂停</div>'
      + '<div><kbd>F</kbd>全屏 / 退出全屏（底部按键常驻）</div>'
      + '<div><kbd>1–9</kbd>直接跳页</div>'
      + '<div><kbd>Home / End</kbd>首页 / 末页</div>'
      + '<div><kbd>Esc</kbd>关闭右侧开窗 / 退出全屏</div>'
      + '<div><kbd>? / H</kbd>本帮助</div>'
      + '<div><kbd>点击底部按钮</kbd>与快捷键等价</div></div>';
    body.scrollTop = 0;
  }
  $('#paneFoot').textContent = paneMode==='all'
    ? '全文讲稿 · 已定位当前页 · 翻页时右侧自动滚动联动'
    : '页内开窗 · 再按一次同一按键即可关闭 · 翻页自动联动';
}
function scrollToPage(i, smooth){
  const body=$('#paneBody'), t=body.querySelector('[data-page="'+i+'"]');
  if(!t) return;
  $$('#paneBody .pn-sec.now').forEach(e=>e.classList.remove('now'));
  t.classList.add('now');
  const top=t.getBoundingClientRect().top - body.getBoundingClientRect().top + body.scrollTop - 12;
  body.scrollTo({top:Math.max(0,top), behavior:smooth?'smooth':'auto'});
}
function syncPane(){
  if(!paneOpen()) return;
  if(paneMode==='here'){ renderPane(); }
  else if(paneMode==='all'){ scrollToPage(cur,true); }
  else if(paneMode==='toc'){
    $$('#paneBody .toc-item').forEach(e=>e.classList.toggle('now', +e.dataset.page===cur));
    const t=$('#paneBody .toc-item.now');
    if(t){ const body=$('#paneBody');
      const top=t.getBoundingClientRect().top - body.getBoundingClientRect().top + body.scrollTop - 40;
      body.scrollTo({top:Math.max(0,top), behavior:'smooth'}); }
  }
}
function togglePane(m){
  if(paneOpen() && paneMode===m){ closePane(); return; }
  paneMode = m;
  document.body.classList.add('pane-open');
  $('#pane').setAttribute('aria-hidden','false');
  renderPane(); setChrome(); fit();
  if(m==='all') requestAnimationFrame(()=>scrollToPage(cur,false));
  if(m==='toc') { $$('#paneBody .toc-item').forEach(e=>e.classList.toggle('now', +e.dataset.page===cur)); syncPane(); }
}
function closePane(){
  document.body.classList.remove('pane-open');
  $('#pane').setAttribute('aria-hidden','true');
  paneMode='none'; setChrome(); fit();
}
function jump(i){ go(i); }

/* ---------------- 全屏：系统全屏 + CSS 沉浸降级，底部按键始终可见 ---------------- */
function fs(){
  const entering = !document.body.classList.contains('immersive');
  if(entering){
    document.body.classList.add('immersive');
    $('#btnFs').textContent = '退出全屏 F';
    let pr = null;
    try{ pr = document.documentElement.requestFullscreen ? document.documentElement.requestFullscreen() : null; }catch(e){}
    if(pr && pr.catch) pr.catch(()=>toast('已降级为页内沉浸全屏：底部按键仍可使用'));
    fit();
    toast('全屏：底部快捷键保持显示（F 或 Esc 退出）');
  }else{
    document.body.classList.remove('immersive');
    $('#btnFs').textContent = '全屏 F';
    fit(); toast('已退出全屏');
    try{ if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen(); }catch(e){}
  }
}
document.addEventListener('fullscreenchange', ()=>{
  if(!document.fullscreenElement && document.body.classList.contains('immersive')){
    document.body.classList.remove('immersive');
    $('#btnFs').textContent = '全屏 F';
  }
  fit();
});

/* ---------------- 快捷键 ---------------- */
document.addEventListener('keydown', e=>{
  const k=e.key, tag=(e.target.tagName||'').toLowerCase();
  const typing = tag==='input'||tag==='select'||tag==='textarea'||e.target.isContentEditable;
  if(k==='Escape'){
    if(paneOpen()){ closePane(); toast('讲稿窗已关闭'); }
    else if(document.body.classList.contains('immersive')) fs();
    return;
  }
  if(k==='f'||k==='F'){ e.preventDefault(); fs(); return; }
  if(typing) return;
  if(k==='ArrowRight'||k===' '||k==='PageDown'){ e.preventDefault(); next(); }
  else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); prev(); }
  else if(k==='g'||k==='G'){ e.preventDefault(); togglePane('toc'); }
  else if(k==='n'||k==='N'){ e.preventDefault(); togglePane('here'); }
  else if(k==='t'||k==='T'){ e.preventDefault(); togglePane('all'); }
  else if(k==='p'||k==='P'){ e.preventDefault(); toggleAuto(); }
  else if(k==='?'||k==='h'||k==='H'){ e.preventDefault(); togglePane('help'); }
  else if(k==='Home'){ e.preventDefault(); go(0); }
  else if(k==='End'){ e.preventDefault(); go(N-1); }
  else if(/^[1-9]$/.test(k)){ go(parseInt(k,10)-1); }
});

/* ---------------- 动画 A：解释执行的接口调用次数 ---------------- */
let aStep=0, aTimer=null, aPlaying=false;
function aCfg(){ return {rows:+$('#aRows').value, layers:+$('#aLayers').value}; }
function aPaint(){
  const {rows,layers}=aCfg();
  $$('#animA .achain').forEach((el,i)=>{
    const on=i<layers, hot=on && i<aStep;
    el.setAttribute('opacity', on?'1':'0.2');
    el.setAttribute('fill', hot?'#F7E9DE':'#FFFFFF');
    el.setAttribute('stroke', hot?'#BE653B':'#D9D5CB');
  });
  $$('#animA .acell').forEach((el,i)=>{
    el.setAttribute('fill', i<aStep?'#E5EFF0':'#FFFFFF');
    el.setAttribute('stroke', i<aStep?'#245A6B':'#D9D5CB');
  });
  const loop=$('#aLoop');
  if(loop){
    loop.setAttribute('fill', aStep>0?'#E4F0EA':'#FFFFFF');
    loop.setAttribute('stroke', aStep>0?'#2F7A66':'#D9D5CB');
  }
  $('#aCntL').textContent=(aStep*layers)+' 次';
  $('#aCntR').textContent='0 次';
  $('#aOut').innerHTML='已示意 <b>'+aStep+' / 8</b> 行 · 每行 '+layers+' 层 → 累计 <b>'
    +(aStep*layers)+'</b> 次接口调用；按 '+rows.toLocaleString()+' 行外推 <b>'
    +(rows*layers).toLocaleString()+'</b> 次（算术示意，非实测）';
}
function aPause(){ aPlaying=false; clearInterval(aTimer); aTimer=null;
  const b=$('#aPlay'); if(b){ b.textContent='▶ 播放'; b.classList.remove('play'); } }
function aPlay(){
  if(aPlaying){ aPause(); return; }
  if(aStep>=8) aStep=0;
  aPlaying=true; $('#aPlay').textContent='❚❚ 暂停'; $('#aPlay').classList.add('play');
  aTimer=setInterval(()=>{ aStep++; aPaint(); if(aStep>=8) aPause(); },560);
}
function aTick(){ aPause(); if(aStep<8){ aStep++; aPaint(); } }
function aReset(){ aPause(); aStep=0; aPaint(); }

/* ---------------- 动画 B：pipeline 切分 ---------------- */
const B_PLANS={
  p0:{ops:['Scan','Filter','Project','Join Probe','Local Agg'],brk:[]},
  p1:{ops:['Scan','Filter','Sort','Project','Join Probe'],brk:[2]},
  p2:{ops:['Build Scan','Hash Build','Probe Scan','Join Probe','Local Agg'],brk:[1]}
};
let bStep=0, bTimer=null, bPlaying=false;
function bPaint(){
  const p=B_PLANS[$('#bPlan').value]||B_PLANS.p1, brk=p.brk;
  $$('#animB .bop').forEach((el,i)=>{
    const seen=i<bStep, isBrk=brk.indexOf(i)>=0;
    el.setAttribute('fill', !seen?'#FFFFFF':(isBrk?'#F7E9DE':'#E5EFF0'));
    el.setAttribute('stroke', !seen?'#D9D5CB':(isBrk?'#BE653B':'#245A6B'));
    const t=$('#bOpTx'+i);
    if(t){ t.textContent=p.ops[i]; t.setAttribute('fill', !seen?'#89938F':(isBrk?'#BE653B':'#245A6B')); }
  });
  $$('#animB .bcut').forEach((el,i)=>{
    el.setAttribute('opacity', brk.indexOf(i)>=0 && bStep>i ?'1':'0');
  });
  let segs=[], start=0;
  for(let k=0;k<5;k++){ if(brk.indexOf(k)>=0){ segs.push([start,k]); start=k+1; } }
  segs.push([start,4]);
  $$('#animB .bseg').forEach((el,i)=>{
    const active=i<segs.length && bStep>segs[i][1];
    el.setAttribute('opacity', active?'1':'0.35');
    el.setAttribute('fill', active?'#E5EFF0':'#FFFFFF');
    el.setAttribute('stroke', active?'#245A6B':'#D9D5CB');
    const tx=$('#bSegTx'+i);
    if(tx){
      if(i<segs.length){
        const names=[]; for(let k=segs[i][0];k<=segs[i][1];k++) names.push(p.ops[k]);
        tx.textContent='P'+(i+1)+' · '+names.join(' → ');
        tx.setAttribute('fill', active?'#245A6B':'#89938F');
      } else tx.textContent='';
    }
  });
  const cutNames=brk.length?brk.map(i=>p.ops[i]).join('、'):'无';
  $('#bOut').innerHTML='已展开 <b>'+bStep+' / 5</b> 个算子 · 切出 <b>'+(1+brk.length)
    +'</b> 段 pipeline · breaker：<b>'+cutNames+'</b>';
}
function bPause(){ bPlaying=false; clearInterval(bTimer); bTimer=null;
  const b=$('#bPlay'); if(b){ b.textContent='▶ 播放'; b.classList.remove('play'); } }
function bPlay(){
  if(bPlaying){ bPause(); return; }
  if(bStep>=5) bStep=0;
  bPlaying=true; $('#bPlay').textContent='❚❚ 暂停'; $('#bPlay').classList.add('play');
  bTimer=setInterval(()=>{ bStep++; bPaint(); if(bStep>=5) bPause(); },700);
}
function bTick(){ bPause(); if(bStep<5){ bStep++; bPaint(); } }
function bReset(){ bPause(); bStep=0; bPaint(); }

/* ---------------- 动画 C：morsel 动态领取 ---------------- */
const C_SPEED=[1.0,0.62,1.35,0.85];
const C_COLOR=['#1E4B5A','#2E6373','#47808D','#74A5AD'];
let cStep=0, cTimer=null, cPlaying=false;
function cCfg(){ return {n:+$('#cGran').value, w:+$('#cWorkers').value}; }
function cSim(){
  const {n,w}=cCfg();
  const vt=new Array(w).fill(0), assign=[];
  const cost=16/n;
  for(let k=0;k<n;k++){
    let best=0;
    for(let i=1;i<w;i++) if(vt[i]<vt[best]-1e-9) best=i;
    assign.push(best);
    vt[best]+=(1+(k%3)*0.35)*cost/C_SPEED[best];
  }
  return {n,w,assign};
}
function cPaint(){
  const {n,w,assign}=cSim();
  if(cStep>n) cStep=n;
  $$('#animC .cm').forEach((el,i)=>{
    const exists=i<n, taken=i<cStep;
    el.setAttribute('opacity', exists?'1':'0.16');
    el.setAttribute('fill', taken?'#E5EFF0':(exists?'#FFFFFF':'#F1EFE9'));
    el.setAttribute('stroke', taken?'#245A6B':'#D9D5CB');
    const t=$('#cMT'+i);
    if(t) t.setAttribute('fill', taken?'#245A6B':(exists?'#89938F':'#C9C5BB'));
  });
  const cnt=new Array(w).fill(0);
  for(let k=0;k<cStep;k++) cnt[assign[k]]++;
  for(let i=0;i<4;i++){
    for(let j=0;j<8;j++){
      const el=$('#cW'+i+'_'+j); if(!el) continue;
      const used=i<w && j<cnt[i];
      el.setAttribute('opacity', i<w?'1':'0.16');
      el.setAttribute('fill', used?C_COLOR[i]:'#FFFFFF');
      el.setAttribute('stroke', used?C_COLOR[i]:'#D9D5CB');
    }
  }
  const arr=[]; for(let i=0;i<w;i++) arr.push('W'+(i+1)+'：'+cnt[i]);
  $('#cOut').innerHTML='已领取 <b>'+cStep+' / '+n+'</b> 个 morsel · '+arr.join(' · ')
    +' · 粒度越细调度次数越多（动态调度示意，非实测）';
}
function cPause(){ cPlaying=false; clearInterval(cTimer); cTimer=null;
  const b=$('#cPlay'); if(b){ b.textContent='▶ 播放'; b.classList.remove('play'); } }
function cPlay(){
  if(cPlaying){ cPause(); return; }
  const {n}=cCfg(); if(cStep>=n) cStep=0;
  cPlaying=true; $('#cPlay').textContent='❚❚ 暂停'; $('#cPlay').classList.add('play');
  cTimer=setInterval(()=>{ cStep++; cPaint(); if(cStep>=cCfg().n) cPause(); },560);
}
function cTick(){ cPause(); if(cStep<cCfg().n){ cStep++; cPaint(); } }
function cReset(){ cPause(); cStep=0; cPaint(); }

/* ---------------- 动画 D：编译固定成本是否回本 ---------------- */
const D_ROWS=[100,10000,1000000];
let dStep=0, dTimer=null, dPlaying=false;
function tweenW(el,target){
  if(!el) return;
  const from=parseFloat(el.getAttribute('width'))||0, t0=performance.now(), dur=420;
  function frame(now){
    /* rAF 的时间戳可能略早于调度时的 performance.now()，必须钳制到 [0,1]，否则首帧会算出负宽度 */
    const p=Math.max(0,Math.min(1,(now-t0)/dur)), e=1-Math.pow(1-p,3);
    el.setAttribute('width',Math.max(0,from+(target-from)*e).toFixed(1));
    if(p<1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
function dPaint(){
  const cc=+$('#dCost').value, rows=D_ROWS[dStep];
  const interp=rows*4, comp=rows*1+cc, maxv=Math.max(interp,comp);
  const w0=cc/maxv*880, w1=rows/maxv*880;
  tweenW($('#dBarI'), interp/maxv*880);
  tweenW($('#dC0'), w0);
  tweenW($('#dC1'), w1);
  const seg=$('#dC1'); if(seg) seg.setAttribute('x',(200+w0).toFixed(1));
  $('#dValI').textContent=interp.toLocaleString()+' 单位';
  $('#dValC').textContent=comp.toLocaleString()+' 单位';
  const win=comp<interp;
  const v=$('#dVerdict');
  if(v){ v.setAttribute('fill', win?'#E4F0EA':'#F7E9DE'); v.setAttribute('stroke', win?'#2F7A66':'#BE653B'); }
  const vt=$('#dVerdictTx');
  if(vt){
    vt.textContent=win?'编译划算：固定成本被热路径摊薄，端到端相对成本更低'
                      :'编译不划算：固定编译成本没被摊薄，短查询白付了编译费';
    vt.setAttribute('fill', win?'#2F7A66':'#BE653B');
  }
  $$('#animD .dsc').forEach((el,i)=>{
    const on=i===dStep;
    el.setAttribute('fill', on?'#E5EFF0':'#FFFFFF');
    el.setAttribute('stroke', on?'#245A6B':'#D9D5CB');
    const t=$('#dScTx'+i); if(t) t.setAttribute('fill', on?'#245A6B':'#89938F');
  });
  $('#dOut').innerHTML='规模 <b>'+rows.toLocaleString()+'</b> 行 · 解释 <b>'+interp.toLocaleString()
    +'</b> · 编译路径 <b>'+comp.toLocaleString()+'</b>（相对单位，算术示意，非实测）';
}
function dPause(){ dPlaying=false; clearInterval(dTimer); dTimer=null;
  const b=$('#dPlay'); if(b){ b.textContent='▶ 播放'; b.classList.remove('play'); } }
function dPlay(){
  if(dPlaying){ dPause(); return; }
  dPlaying=true; $('#dPlay').textContent='❚❚ 暂停'; $('#dPlay').classList.add('play');
  dTimer=setInterval(()=>{ dStep=(dStep+1)%3; dPaint(); if(dStep===0) dPause(); },1500);
}
function dTick(){ dPause(); dStep=(dStep+1)%3; dPaint(); }
function dReset(){ dPause(); dStep=0; dPaint(); }

function init(){
  render(); fit();
  let saved=0; try{ saved=parseInt(localStorage.getItem('pushcodegen-slide')||'0',10)||0; }catch(e){}
  go(Math.min(saved,N-1),true);
  $('#btnPrev').onclick=prev; $('#btnNext').onclick=next;
  $('#btnToc').onclick=()=>togglePane('toc');
  $('#btnNotes').onclick=()=>togglePane('here');
  $('#btnAll').onclick=()=>togglePane('all');
  $('#btnAuto').onclick=toggleAuto;
  $('#btnFs').onclick=fs;
  $('#btnHelp').onclick=()=>togglePane('help');
  $('#paneClose').onclick=closePane;
  aPaint(); bPaint(); cPaint(); dPaint();
  ['aRows','aLayers'].forEach(id=>{ const el=$('#'+id); if(el) el.addEventListener('change',aReset); });
  const bp=$('#bPlan'); if(bp) bp.addEventListener('change',bReset);
  ['cGran','cWorkers'].forEach(id=>{ const el=$('#'+id); if(el) el.addEventListener('change',cReset); });
  const dc=$('#dCost'); if(dc) dc.addEventListener('change',dReset);
  const bind=(id,fn)=>{ const el=$(id); if(el) el.onclick=fn; };
  bind('#aPlay',aPlay); bind('#aTick',aTick); bind('#aReset',aReset);
  bind('#bPlay',bPlay); bind('#bTick',bTick); bind('#bReset',bReset);
  bind('#cPlay',cPlay); bind('#cTick',cTick); bind('#cReset',cReset);
  bind('#dPlay',dPlay); bind('#dTick',dTick); bind('#dReset',dReset);
}
document.addEventListener('DOMContentLoaded', init);
</script>
