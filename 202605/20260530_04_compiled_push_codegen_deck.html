<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数据库筑基课 · 查询执行引擎「编译型 Push 模型（LLVM Codegen）」</title>
<!-- 单文件交付：所有原理图均为现场绘制的内联 SVG，零外部图片 / 字体 / 脚本依赖。 -->
<!-- 视觉母题：地层剖面 / 工程蓝图。内容按「矛盾 → 改写 → 定义 → 原理 → 对照 → 对比 → 账 → 落地」因果推演。 -->
<style>
:root{
  --bg:#F7F6F2; --sub:#F1EFE9; --ink:#1B2B33; --ink2:#46585F; --muted:#89938F; --line:#D9D5CB;
  --primary:#245A6B; --prim-l:#E5EFF0; --prim-m:#7BA6AF; --accent:#BE653B; --acc-l:#F7E9DE;
  --green:#2F7A66; --green-l:#E4F0EA; --gold:#AE8A3E; --gold-l:#F5EDDC;
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#E9E7E1}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
#viewport{position:absolute;inset:0 0 58px 0;overflow:hidden}
#stage{position:absolute;width:1600px;height:900px;background:var(--bg);
  transform-origin:top left;box-shadow:0 18px 60px rgba(27,43,51,.13);
  transition:transform .34s cubic-bezier(.2,.7,.2,1),left .34s cubic-bezier(.2,.7,.2,1),top .34s cubic-bezier(.2,.7,.2,1)}
.slide{position:absolute;inset:0;display:none}
.slide.on{display:block;animation:fadein .42s cubic-bezier(.2,.7,.2,1)}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{position:absolute;left:64px;top:44px;font-size:13px;letter-spacing:3.4px;
  color:var(--primary);font-weight:600}
.eyebrow .num{font-family:var(--mono);letter-spacing:1px;color:var(--accent);margin-right:14px}
h1.title{position:absolute;left:64px;top:70px;margin:0;font-family:var(--serif);
  font-size:44px;line-height:1.25;font-weight:700;letter-spacing:1.2px;color:var(--ink)}
.lede{position:absolute;left:64px;top:139px;width:1440px;font-size:19px;color:var(--ink2);
  line-height:1.5;letter-spacing:.3px}
.rule{position:absolute;left:64px;top:181px;width:1472px;height:1px;background:var(--line)}
.figwrap{position:absolute;left:100px;top:198px;width:1400px;height:430px}
svg.figure{display:block;overflow:visible}
svg.figure text{font-family:var(--sans)}
svg.figure text.serif{font-family:var(--serif)}
svg.figure text.mono{font-family:var(--mono)}
.caption{position:absolute;left:100px;top:638px;width:1400px;font-size:13px;
  color:var(--muted);letter-spacing:.4px}
.caption.under{top:686px;font-size:12.5px}
.bridge{position:absolute;left:64px;top:706px;width:1472px;font-size:20px;
  color:var(--accent);line-height:1.55;letter-spacing:.4px;padding-left:18px;
  border-left:3px solid var(--accent);font-family:var(--serif)}
.bridge .bk{font-family:var(--sans);font-size:13px;color:var(--muted);
  letter-spacing:2px;display:block;margin-bottom:2px}
.footer{position:absolute;left:64px;top:846px;width:1472px;height:1px;background:var(--line)}
.footer .fl{position:absolute;left:0;top:14px;font-size:12.5px;color:var(--muted);letter-spacing:2px}
.footer .fr{position:absolute;right:0;top:12px;font-family:var(--mono);font-size:14px;color:var(--ink2)}
.footer .fbar{position:absolute;left:0;right:0;top:-1px;height:2px;background:transparent}
.footer .fbar i{display:block;height:2px;background:var(--primary);width:0;transition:width .4s ease}

/* 动画页控件：独立条带，绝不覆盖图 */
.ctrls{position:absolute;left:100px;top:638px;width:1400px;height:46px;display:flex;
  align-items:center;gap:10px}
.ctrls label{font-size:13.5px;color:var(--ink2);white-space:nowrap}
.ctrls select,.ctrls input[type=range]{font-family:var(--sans);font-size:13.5px;color:var(--ink);
  background:#fff;border:1px solid var(--line);border-radius:4px;padding:5px 8px;outline:none}
.ctrls select{max-width:290px}
.ctrls .btn{min-height:30px;padding:5px 13px;border:1px solid var(--primary);border-radius:4px;
  background:#fff;color:var(--primary);font-size:13.5px;cursor:pointer;font-family:var(--sans);white-space:nowrap}
.ctrls .btn.play{background:var(--primary);color:#fff}
.ctrls .btn:hover{filter:brightness(.94)}
.ctrls .out{font-size:13px;color:var(--ink2);margin-left:auto;min-width:0;flex:1;
  max-width:620px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrls .out b{color:var(--accent);font-weight:600}

/* 右侧页内开窗（非弹窗）：显示时舞台矢量缩放至左侧 */
#pane{position:fixed;right:0;top:0;bottom:58px;width:clamp(360px,34vw,520px);
  background:#FCFBF8;border-left:1px solid var(--line);z-index:35;display:flex;flex-direction:column;
  transform:translateX(105%);transition:transform .34s cubic-bezier(.2,.7,.2,1);
  box-shadow:-14px 0 44px rgba(27,43,51,.10)}
body.pane-open #pane{transform:none}
.pane-head{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:18px 22px 14px;border-bottom:1px solid var(--line);flex:none}
.pane-head .pnum{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:1px;margin-right:10px}
.pane-head .ptitle{font-family:var(--serif);font-size:18px;color:var(--ink)}
.pane-head button{background:#fff;border:1px solid var(--line);border-radius:4px;padding:6px 11px;
  font-size:12.5px;cursor:pointer;color:var(--ink2);font-family:var(--sans);white-space:nowrap}
.pane-head button:hover{border-color:var(--primary);color:var(--primary)}
.pane-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:4px 22px 26px}
.pn-sec{border-bottom:1px solid var(--line);padding:16px 12px 18px;cursor:pointer;transition:background .2s}
.pn-sec:hover{background:var(--prim-l)}
.pn-sec.now{background:var(--prim-l);box-shadow:inset 3px 0 0 var(--primary)}
.pn-sec .pn-n{font-family:var(--mono);font-size:11.5px;color:var(--accent);letter-spacing:1px}
.pn-sec h3{margin:6px 0 10px;font-family:var(--serif);font-size:19px;color:var(--primary);line-height:1.4}
.pn-sec p{margin:0;font-size:14.5px;line-height:1.95;color:var(--ink2);letter-spacing:.3px}
.pn-sec .pn-b{margin-top:11px;font-family:var(--serif);font-size:14px;color:var(--accent);line-height:1.7}
.pn-sec .pn-tip{margin-top:10px;font-size:12.5px;color:var(--muted)}
.pane-foot{flex:none;padding:10px 22px;border-top:1px solid var(--line);
  font-size:12px;color:var(--muted);letter-spacing:.4px}
.toc-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding-top:14px}
.toc-item{display:block;padding:11px 12px;border:1px solid var(--line);border-radius:4px;
  background:#fff;cursor:pointer;transition:.18s}
.toc-item:hover{border-color:var(--primary);background:var(--prim-l)}
.toc-item.now{border-color:var(--primary);background:var(--prim-l);box-shadow:inset 3px 0 0 var(--primary)}
.toc-item .tn{font-family:var(--mono);font-size:11px;color:var(--accent)}
.toc-item .tt{display:block;margin-top:4px;font-family:var(--serif);font-size:14.5px;line-height:1.4;color:var(--ink)}
.keys2{display:grid;grid-template-columns:1fr;gap:9px;padding-top:14px;font-size:14px;line-height:1.8}
.keys2 kbd{font-family:var(--mono);background:#fff;border:1px solid var(--line);
  border-bottom-width:2px;border-radius:4px;padding:2px 7px;color:var(--primary);margin-right:10px}

/* 底部外壳：全屏后依旧显示，所有按键常驻 */
.chrome{position:fixed;left:0;right:0;bottom:0;height:58px;background:#FCFBF8;
  border-top:1px solid var(--line);display:flex;align-items:center;gap:7px;
  padding:0 16px;z-index:45;font-size:13px;color:var(--ink2)}
body.immersive .chrome{background:rgba(252,251,248,.97);box-shadow:0 -6px 22px rgba(27,43,51,.10)}
.chrome .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.chrome button{font-family:var(--sans);font-size:13px;color:var(--ink2);background:transparent;
  border:1px solid transparent;border-radius:5px;padding:7px 10px;cursor:pointer;white-space:nowrap}
.chrome button:hover{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome button.act{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome button.k{font-family:var(--mono);font-size:12px;color:var(--muted)}
.chrome .pg{font-family:var(--mono);font-size:14px;color:var(--ink);min-width:78px;text-align:center}
.chrome .track{flex:1;height:3px;background:var(--line);border-radius:3px;margin:0 10px;position:relative;min-width:40px}
.chrome .track i{position:absolute;left:0;top:0;height:3px;background:var(--primary);border-radius:3px;transition:width .35s}
.chrome .hint{font-size:12px;color:var(--muted);white-space:nowrap}
.toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);background:var(--ink);
  color:#fff;font-size:13px;padding:9px 16px;border-radius:5px;opacity:0;transition:.3s;z-index:80;pointer-events:none}
.toast.on{opacity:1}
@media print{.chrome,#pane,.toast{display:none!important}#viewport{position:static}
  #stage{position:static;transform:none!important;box-shadow:none}
  .slide{display:block!important;page-break-after:always;position:relative;height:900px}}
</style>
</head>

<script>
const D = [{"eyebrow": "开场 · 执行器接手以后", "title": "计划画好了，CPU 时间花在哪儿", "lede": "同一个 SQL 计划，逻辑上只是树上摆几个算子；真正决定延迟和吞吐的，是执行器在 cache、分支预测、函数调用、内存分配、并行调度与代码生成之间怎么做取舍。", "caption": "图 01　从物理计划到 CPU 微架构的六层剖面；越深的靛青越底层、越贴近硬件。", "bridge": "先别急着谈编译。得看清楚：一条普通分析 SQL，CPU 到底忙在什么上面。", "notes": "先把位置摆清楚。优化器干完活，交出来的是一棵物理计划：先扫哪张表、用什么 join、在哪儿聚合。计划只说「做什么」，真正把数据搬出来、算出来，是执行器的活。执行器要同时应付六件事：CPU cache 和分支预测、函数调用、表达式怎么解释、内存怎么分配、并行怎么调度、以及要不要按查询生成代码。这六层不是并列的清单，是一层压一层的剖面——越往下越贴近硬件，改动的代价越大，收益也越根本。今天这一讲只盯最上面那条线往下的一种改法：把可流水化的算子段编译成机器码，让数据沿一个紧循环被推下去。记住这个画面，后面所有的收益和代价，都是从这里长出来的。", "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"20\" y=\"26\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"2.6\" >剖面 · 一条 SQL 落到 CPU 上</text><text x=\"1380\" y=\"26\" class=\"sv \" text-anchor=\"end\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" letter-spacing=\"0\" >真正决定延迟与吞吐的是执行器</text><line x1=\"20\" y1=\"38\" x2=\"1380\" y2=\"38\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"40\" y=\"56\" width=\"300\" height=\"72\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"190\" y=\"88\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"20.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >物理计划</text><text x=\"190\" y=\"114\" class=\"sv \" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >优化器输出 · 决定做什么</text><line x1=\"342\" y1=\"92\" x2=\"369\" y2=\"92\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><polygon points=\"378,92 368,87 368,97\" fill=\"#7BA6AF\"/><rect x=\"380\" y=\"56\" width=\"300\" height=\"72\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"530\" y=\"88\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"20.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >执行器</text><text x=\"530\" y=\"114\" class=\"sv \" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >把算子串成一条链</text><line x1=\"682\" y1=\"92\" x2=\"709\" y2=\"92\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><polygon points=\"718,92 708,87 708,97\" fill=\"#7BA6AF\"/><rect x=\"720\" y=\"56\" width=\"300\" height=\"72\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"870\" y=\"88\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"20.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >算子链</text><text x=\"870\" y=\"114\" class=\"sv \" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >扫描 · 过滤 · 投影 · 连接 · 聚合</text><line x1=\"1022\" y1=\"92\" x2=\"1049\" y2=\"92\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><polygon points=\"1058,92 1048,87 1048,97\" fill=\"#7BA6AF\"/><rect x=\"1060\" y=\"56\" width=\"300\" height=\"72\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"1210\" y=\"88\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"20.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >查询结果</text><text x=\"1210\" y=\"114\" class=\"sv \" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >返回给调用方</text><text x=\"40\" y=\"152\" class=\"sv \" text-anchor=\"start\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"600\" letter-spacing=\"0\" >执行器要在六个维度之间做取舍（越深的靛青＝越底层、越贴近硬件）</text><rect x=\"40\" y=\"164\" width=\"1320\" height=\"33\" rx=\"0\" fill=\"#EBF1EE\" stroke=\"#EBF1EE\" stroke-width=\"1\" /><text x=\"58\" y=\"185.6\" class=\"sv serif\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" letter-spacing=\"0\" >并行调度</text><text x=\"302\" y=\"185.09\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" letter-spacing=\"0\" >morsel、worker、NUMA locality</text><rect x=\"40\" y=\"201\" width=\"1320\" height=\"33\" rx=\"0\" fill=\"#CFE0DC\" stroke=\"#CFE0DC\" stroke-width=\"1\" /><text x=\"58\" y=\"222.6\" class=\"sv serif\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" letter-spacing=\"0\" >代码生成</text><text x=\"302\" y=\"222.09\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" letter-spacing=\"0\" >是否按查询生成 IR 与机器码</text><rect x=\"40\" y=\"238\" width=\"1320\" height=\"33\" rx=\"0\" fill=\"#A4C4C6\" stroke=\"#A4C4C6\" stroke-width=\"1\" /><text x=\"58\" y=\"259.6\" class=\"sv serif\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" letter-spacing=\"0\" >内存分配</text><text x=\"302\" y=\"259.09\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" letter-spacing=\"0\" >缓冲、状态、临时结果放哪儿</text><rect x=\"40\" y=\"275\" width=\"1320\" height=\"33\" rx=\"0\" fill=\"#74A5AD\" stroke=\"#74A5AD\" stroke-width=\"1\" /><text x=\"58\" y=\"296.6\" class=\"sv serif\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#FFFFFF\" font-weight=\"600\" letter-spacing=\"0\" >表达式解释</text><text x=\"302\" y=\"296.09\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#FFFFFF\" font-weight=\"400\" letter-spacing=\"0\" >谓词、投影、类型转换怎么算</text><rect x=\"40\" y=\"312\" width=\"1320\" height=\"33\" rx=\"0\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1\" /><text x=\"58\" y=\"333.6\" class=\"sv serif\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#FFFFFF\" font-weight=\"600\" letter-spacing=\"0\" >函数调用</text><text x=\"302\" y=\"333.09\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#FFFFFF\" font-weight=\"400\" letter-spacing=\"0\" >算子边界、虚调用、分支判断</text><rect x=\"40\" y=\"349\" width=\"1320\" height=\"33\" rx=\"0\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1\" /><text x=\"58\" y=\"370.6\" class=\"sv serif\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#FFFFFF\" font-weight=\"600\" letter-spacing=\"0\" >CPU cache 与分支预测</text><text x=\"302\" y=\"370.09\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#FFFFFF\" font-weight=\"400\" letter-spacing=\"0\" >指令局部性、数据局部性、误预测代价</text><text x=\"20\" y=\"420\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >本讲只盯一条线：把可流水化的算子段编译成机器码，让数据沿紧循环 Push 下去。</text></svg>"}, {"eyebrow": "矛盾 · 时间被调度吃掉", "title": "不是算得慢，是通用工作做得太多", "lede": "同一条分析 SQL，逻辑计划看起来不复杂，CPU 却被解释器分派、虚函数调用、临时 tuple / chunk 构造和中间结果搬运吃掉。数据量小时不明显，扫描量上来后就变成热点。", "caption": "图 02　条形是 CPU 时间去向的定性示意，条长不代表任何实测占比；真正的比较、哈希与聚合只占其中一段。", "bridge": "这些「框架税」不是凭空来的，它们都长在一个很老、很优雅的接口上。", "notes": "我们把一条最普通的分析 SQL 摆出来：按 region 分组、求 amount 的和，过滤 paid 且大于一百的订单。逻辑上就三步，扫、过滤、聚合。可 CPU 的时间账单不是这么算的。每处理一行或一小批，解释器要分派一次、虚调用要跳一次、状态机要切一次、临时 tuple 或 chunk 要构造一次、中间结果要搬一次；真正值钱的比较、哈希查找、聚合状态更新，反而夹在中间很小一块。这五类开销是机制示意，不是实测占比，别把条长当成数字。重点是趋势：短 OLTP 查询里它们不算主矛盾，可一旦扫描上亿行，指令 cache、数据 cache、分支预测、函数调用和解释器分发就被反复踩，时间全花在「调度执行」，而不是「处理数据」。下一页我们回到这套接口的源头看看，它其实一点都不笨。", "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"20\" y=\"26\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"2.6\" >矛盾 · 逻辑计划不复杂，CPU 却很忙</text><text x=\"1380\" y=\"26\" class=\"sv \" text-anchor=\"end\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" letter-spacing=\"0\" >时间花在「调度执行」而不是「处理数据」</text><line x1=\"20\" y1=\"38\" x2=\"1380\" y2=\"38\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"40\" y=\"56\" width=\"500\" height=\"130\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"60\" y=\"82\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >一条很普通的分析 SQL</text><text x=\"60\" y=\"108\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" letter-spacing=\"0\" >SELECT region, sum(amount)</text><text x=\"60\" y=\"132\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" letter-spacing=\"0\" >FROM orders</text><text x=\"60\" y=\"156\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" letter-spacing=\"0\" >WHERE status = &#x27;paid&#x27; AND amount &gt; 100</text><text x=\"60\" y=\"180\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" letter-spacing=\"0\" >GROUP BY region;</text><text x=\"40\" y=\"212\" class=\"sv \" text-anchor=\"start\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"600\" letter-spacing=\"0\" >业务上最常见的三类「框架税」</text><rect x=\"40\" y=\"226\" width=\"500\" height=\"54\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"60\" y=\"250\" class=\"sv serif\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"600\" letter-spacing=\"0\" >解释器分派</text><text x=\"60\" y=\"270\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >每行解释同一棵表达式树</text><rect x=\"40\" y=\"288\" width=\"500\" height=\"54\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"60\" y=\"312\" class=\"sv serif\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"600\" letter-spacing=\"0\" >虚函数调用</text><text x=\"60\" y=\"332\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >算子边界上的间接跳转</text><rect x=\"40\" y=\"350\" width=\"500\" height=\"54\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"60\" y=\"374\" class=\"sv serif\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"600\" letter-spacing=\"0\" >中间结果搬运</text><text x=\"60\" y=\"394\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >临时容器反复构造与拷贝</text><text x=\"580\" y=\"76\" class=\"sv \" text-anchor=\"start\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"600\" letter-spacing=\"0\" >CPU 时间去了哪里（定性示意，条长非实测占比）</text><text x=\"580\" y=\"115\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >解释器分派 / 虚调用</text><rect x=\"800\" y=\"96\" width=\"540\" height=\"26\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"800\" y=\"96\" width=\"475.2\" height=\"26\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"580\" y=\"161\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >状态机切换与分支判断</text><rect x=\"800\" y=\"142\" width=\"540\" height=\"26\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"800\" y=\"142\" width=\"378.0\" height=\"26\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"580\" y=\"207\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >临时 tuple / chunk 构造</text><rect x=\"800\" y=\"188\" width=\"540\" height=\"26\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"800\" y=\"188\" width=\"421.2\" height=\"26\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"580\" y=\"253\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >中间结果搬运与物化</text><rect x=\"800\" y=\"234\" width=\"540\" height=\"26\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"800\" y=\"234\" width=\"345.6\" height=\"26\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"580\" y=\"299\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >真正的比较 · 哈希 · 聚合</text><rect x=\"800\" y=\"280\" width=\"540\" height=\"26\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"800\" y=\"280\" width=\"162.0\" height=\"26\" rx=\"2\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1\" /><rect x=\"580\" y=\"336\" width=\"760\" height=\"58\" rx=\"2\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"600\" y=\"360\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#2F7A66\" font-weight=\"600\" letter-spacing=\"0\" >数据量小时这些代价不明显；</text><text x=\"600\" y=\"382\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#2F7A66\" font-weight=\"600\" letter-spacing=\"0\" >扫描量上来后，它们会从「背景噪声」变成 CPU 热点。</text><text x=\"20\" y=\"420\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >传统 Volcano / Pull 模型很通用，但在现代 CPU 上容易把时间花在调度执行，而不是处理数据上。</text></svg>"}, {"eyebrow": "起点 · 老办法的价值", "title": "父算子要一行，子算子给一行", "lede": "Volcano / Pull 给所有算子定了同一个接口：next() 返回一行或 end-of-stream。统一签名换来了极强的组合性，也让计划能像搭积木一样拼起来。", "caption": "图 03　Pull 可以按行也可以按 chunk；「Pull」这个方向本身不等于低效，低效来自每行重复解释。", "bridge": "组合性没问题，问题在粒度：一行爬一次接口，一亿行就要爬一亿次。", "notes": "老办法一点都不笨，得先给它一个公道。Volcano 模型给所有算子定了一个统一接口：父算子调 next()，子算子给一行，没了就回 end-of-stream。扫描、过滤、投影、连接都能实现这一个签名，所以优化器生成的计划可以随便组合，控制流直观，debug 也容易，短查询和控制流复杂的时候特别稳。这是它最大的工程价值，也是为什么这么多年大家还在用。但好处和坏处其实是同一个设计：每一行都要穿过同一套通用接口，多层函数调用、状态机切换、虚调用、表达式重复解释、临时容器反复构造、中间结果在边界物化，一层都不少。这里有个常见的误会要提前纠正——Pull 可以按行，也可以按 chunk，不等于一定低效；真正低效的是「每行重复解释」，而不是「数据被拉上来」这个方向。所以问题可以换一种问法了。", "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"20\" y=\"26\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"2.6\" >起点 · Volcano / Pull 的统一接口</text><text x=\"1380\" y=\"26\" class=\"sv \" text-anchor=\"end\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" letter-spacing=\"0\" >接口统一是工程价值，粒度太细是代价</text><line x1=\"20\" y1=\"38\" x2=\"1380\" y2=\"38\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"40\" y=\"62\" class=\"sv serif\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >父算子向子算子要一行</text><rect x=\"40\" y=\"78\" width=\"400\" height=\"62\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"240.0\" y=\"114.44\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >Aggregate.next()</text><line x1=\"240\" y1=\"141\" x2=\"240\" y2=\"155\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><polygon points=\"240,164 235,154 245,154\" fill=\"#7BA6AF\"/><rect x=\"40\" y=\"166\" width=\"400\" height=\"62\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"240.0\" y=\"202.44\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >Filter.next()</text><line x1=\"240\" y1=\"229\" x2=\"240\" y2=\"243\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><polygon points=\"240,252 235,242 245,242\" fill=\"#7BA6AF\"/><rect x=\"40\" y=\"254\" width=\"400\" height=\"62\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"240.0\" y=\"290.44\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >Scan.next()</text><rect x=\"470\" y=\"56\" width=\"440\" height=\"258\" rx=\"2\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"486\" y=\"85\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#2F7A66\" font-weight=\"600\" letter-spacing=\"0\" >好处 · 为什么用了这么多年</text><text x=\"486\" y=\"114\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >接口统一，算子可任意组合</text><text x=\"486\" y=\"148\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >优化器生成的计划像搭积木</text><text x=\"486\" y=\"182\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >控制流直观，容易 debug</text><text x=\"486\" y=\"216\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >可以按行，也可以按 chunk</text><text x=\"486\" y=\"250\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >短查询、控制流复杂时很稳</text><rect x=\"930\" y=\"56\" width=\"430\" height=\"258\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"946\" y=\"85\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#BE653B\" font-weight=\"600\" letter-spacing=\"0\" >坏处 · 数据量上来以后</text><text x=\"946\" y=\"114\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >每行多层函数调用与状态机切换</text><text x=\"946\" y=\"148\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >虚调用、分支判断反复踩</text><text x=\"946\" y=\"182\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >表达式树被重复解释</text><text x=\"946\" y=\"216\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >临时 tuple / chunk 反复构造</text><text x=\"946\" y=\"250\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >中间结果在算子边界物化</text><rect x=\"40\" y=\"330\" width=\"1320\" height=\"62\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"64\" y=\"356\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#BE653B\" font-weight=\"400\" letter-spacing=\"0\" >next() -&gt; tuple | end-of-stream</text><text x=\"470\" y=\"356\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"600\" letter-spacing=\"0\" >好处与坏处来自同一个设计：每一行都要穿过同一套通用算子接口。</text><text x=\"64\" y=\"383\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >所以「Pull」本身不等于低效；低效来自每行重复解释，而不是数据被拉上来这个方向。</text><text x=\"20\" y=\"420\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >Pull 可以按行也可以按 chunk，不等于一定低效；真正的问题是每行重复穿过同一套接口。</text></svg>"}, {"eyebrow": "改写 · 把解释提前做一次", "title": "计划已确定，何必每行解释一遍", "lede": "既然某条 SQL 的计划在执行前已经确定，为什么还要每一行都解释同一棵表达式树、反复穿过同一套算子接口？更激进的做法是把整段 pipeline 生成为一个专用函数。", "caption": "图 04　动画按四层算子做算术示意，接口调用次数为「行数 × 层数」，不是性能实测。", "bridge": "这个「换一种问法」如果写成一个正式定义，会落到哪几个关键词上？", "notes": "关键的一句反问来了：计划在执行前就已经定了，为什么每一行还要重新解释同一棵表达式树、重新穿过同一套算子接口？解释执行里，一行要过 Scan、Filter、Project、Aggregate，每层调一次 next、解释一次表达式、装一次 tuple、判一次分支；一亿行就是一亿遍。编译型的做法是把这段重复提前做一次：把可流水化的算子链生成一个专用函数，让编译器去内联、删死代码、分配寄存器、优化循环；运行时数据从底层被推上来，在一个紧循环里直接完成谓词、投影和聚合更新。左边动画你可以换扫描行数和算子层数，一步一步看接口调用怎么累加；右边那条循环体里没有算子边界，也没有解释器分派。图里的次数是「行数乘层数」的算术示意，不是实测数字，它只回答一件事：开销到底来自哪里。开销的位置确定了，改法也就确定了。", "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" id=\"animA\"><text x=\"20\" y=\"26\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"2.6\" >改写 · 计划已确定，何必每行解释一遍</text><text x=\"1380\" y=\"26\" class=\"sv \" text-anchor=\"end\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" letter-spacing=\"0\" >把重复的解释提前做一次</text><line x1=\"20\" y1=\"38\" x2=\"1380\" y2=\"38\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"40\" y=\"54\" width=\"640\" height=\"322\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"60\" y=\"82\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#BE653B\" font-weight=\"600\" letter-spacing=\"0\" >解释执行 · 每行都要穿过同一套接口</text><rect class=\"achain\" id=\"acb0\" x=\"60\" y=\"100\" width=\"150\" height=\"34\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"135\" y=\"123\" class=\"sv \" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"600\" letter-spacing=\"0\" >Scan</text><line x1=\"135\" y1=\"135\" x2=\"135\" y2=\"133\" stroke=\"#7BA6AF\" stroke-width=\"1.4\"/><polygon points=\"135,142 130,132 140,132\" fill=\"#7BA6AF\"/><rect class=\"achain\" id=\"acb1\" x=\"60\" y=\"144\" width=\"150\" height=\"34\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"135\" y=\"167\" class=\"sv \" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"600\" letter-spacing=\"0\" >Filter</text><line x1=\"135\" y1=\"179\" x2=\"135\" y2=\"177\" stroke=\"#7BA6AF\" stroke-width=\"1.4\"/><polygon points=\"135,186 130,176 140,176\" fill=\"#7BA6AF\"/><rect class=\"achain\" id=\"acb2\" x=\"60\" y=\"188\" width=\"150\" height=\"34\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"135\" y=\"211\" class=\"sv \" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"600\" letter-spacing=\"0\" >Project</text><line x1=\"135\" y1=\"223\" x2=\"135\" y2=\"221\" stroke=\"#7BA6AF\" stroke-width=\"1.4\"/><polygon points=\"135,230 130,220 140,220\" fill=\"#7BA6AF\"/><rect class=\"achain\" id=\"acb3\" x=\"60\" y=\"232\" width=\"150\" height=\"34\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"135\" y=\"255\" class=\"sv \" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"600\" letter-spacing=\"0\" >Aggregate</text><text x=\"240\" y=\"122\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >next() 调一次</text><text x=\"240\" y=\"150\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >表达式解释一次</text><text x=\"240\" y=\"178\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >tuple 装一次</text><text x=\"240\" y=\"206\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >分支判断一次</text><text x=\"60\" y=\"292\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >示意：连续 8 行逐行通过（可播放 / 单步）</text><rect class=\"acell\" id=\"ac0\" x=\"60\" y=\"310\" width=\"62\" height=\"38\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"91\" y=\"335\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" letter-spacing=\"0\" >行 1</text><rect class=\"acell\" id=\"ac1\" x=\"132\" y=\"310\" width=\"62\" height=\"38\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"163\" y=\"335\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" letter-spacing=\"0\" >行 2</text><rect class=\"acell\" id=\"ac2\" x=\"204\" y=\"310\" width=\"62\" height=\"38\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"235\" y=\"335\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" letter-spacing=\"0\" >行 3</text><rect class=\"acell\" id=\"ac3\" x=\"276\" y=\"310\" width=\"62\" height=\"38\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"307\" y=\"335\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" letter-spacing=\"0\" >行 4</text><rect class=\"acell\" id=\"ac4\" x=\"348\" y=\"310\" width=\"62\" height=\"38\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"379\" y=\"335\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" letter-spacing=\"0\" >行 5</text><rect class=\"acell\" id=\"ac5\" x=\"420\" y=\"310\" width=\"62\" height=\"38\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"451\" y=\"335\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" letter-spacing=\"0\" >行 6</text><rect class=\"acell\" id=\"ac6\" x=\"492\" y=\"310\" width=\"62\" height=\"38\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"523\" y=\"335\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" letter-spacing=\"0\" >行 7</text><rect class=\"acell\" id=\"ac7\" x=\"564\" y=\"310\" width=\"62\" height=\"38\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"595\" y=\"335\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" letter-spacing=\"0\" >行 8</text><rect x=\"700\" y=\"54\" width=\"660\" height=\"322\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"720\" y=\"82\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >编译执行 · 一次生成专用函数</text><rect x=\"720\" y=\"100\" width=\"620\" height=\"168\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#7BA6AF\" stroke-width=\"1\" /><text x=\"744\" y=\"130\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"400\" letter-spacing=\"0\" >for t in scan_morsel:</text><text x=\"744\" y=\"157\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"400\" letter-spacing=\"0\" >  status = load(status_col)</text><text x=\"744\" y=\"184\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"400\" letter-spacing=\"0\" >  amount = load(amount_col)</text><text x=\"744\" y=\"211\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"400\" letter-spacing=\"0\" >  if status == &quot;paid&quot; and amount &gt; 100:</text><text x=\"744\" y=\"238\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"400\" letter-spacing=\"0\" >    ht[region].sum += amount</text><rect id=\"aLoop\" x=\"720\" y=\"288\" width=\"620\" height=\"34\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"740\" y=\"310\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >循环体内没有算子边界、没有解释器分派</text><text x=\"720\" y=\"352\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >接口调用（示意前 8 行）</text><text id=\"aCntL\" x=\"1340\" y=\"352\" class=\"sv mono\" text-anchor=\"end\" font-size=\"14\" fill=\"#BE653B\" font-weight=\"600\">0 次</text><text x=\"720\" y=\"372\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >编译路径额外分派</text><text id=\"aCntR\" x=\"1340\" y=\"372\" class=\"sv mono\" text-anchor=\"end\" font-size=\"14\" fill=\"#2F7A66\" font-weight=\"600\">0 次</text><text x=\"20\" y=\"420\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >动画中的调用次数是「行数 × 算子层数」的算术示意，不是性能实测；目的是看清开销来自哪里。</text></svg>", "ctrl": "<label>扫描行数</label><select id=\"aRows\"><option value=\"10000\">10 000</option><option value=\"1000000\" selected>1 000 000</option><option value=\"100000000\">100 000 000</option></select>\n<label>算子层数</label><select id=\"aLayers\"><option value=\"2\">2 层</option><option value=\"3\">3 层</option><option value=\"4\" selected>4 层</option></select>\n<button class=\"btn play\" id=\"aPlay\">▶ 播放</button><button class=\"btn\" id=\"aTick\">单步</button><button class=\"btn\" id=\"aReset\">重置</button>\n<span class=\"out\" id=\"aOut\"></span>"}, {"eyebrow": "定义 · 它在做什么", "title": "把 pipeline 变成代码，让数据推着走", "lede": "在查询开始前或运行早期，把物理计划中可流水化的一段 operator pipeline 转换成 LLVM IR，再编译成本地机器码；执行时由数据源把 tuple、vector 或 morsel 推入，沿途完成计算。", "caption": "图 05　五步流程与一句话定义；沿途完成的逻辑包括谓词、投影、join probe 与聚合状态更新。", "bridge": "定义里塞了七个相近的词，不先分清，后面每一步都会讲岔。", "notes": "把刚才那句反问写正式一点，就是这一页的定义。执行前或者运行的早期，把物理计划里可流水化的一段 operator pipeline 拿出来，先转成中间表示，比如 LLVM IR，再编译成本地机器码；执行的时候，由最底层的数据源把 tuple、vector 或者 morsel 推入这条 pipeline，数据在流动的过程中直接完成谓词判断、投影计算、join probe 和聚合状态更新。五个环节串起来：物理计划、切出 pipeline、生成 IR、编译成机器码、推入数据。注意两个方向都变了——控制流从父算子向下索取，变成数据源向上推送；执行体从「运行时解释一棵算子树」，变成「运行一段编译好的专用函数」。收益很直接：少分派、少物化、可内联。代价也很直接：编译要时间，代码要缓存要失效，路径更难 debug，短查询可能还没跑热就结束了。所以它不是银弹，是面向高温路径的优化。带着这句定义，我们把最容易混的词先分开。", "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"20\" y=\"26\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"2.6\" >定义 · 编译型 Push 模型</text><text x=\"1380\" y=\"26\" class=\"sv \" text-anchor=\"end\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" letter-spacing=\"0\" >计划不是终点，代码才是热路径</text><line x1=\"20\" y1=\"38\" x2=\"1380\" y2=\"38\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"40\" y=\"58\" width=\"252\" height=\"96\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#7BA6AF\" stroke-width=\"1\" /><text x=\"166\" y=\"94\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >物理计划</text><text x=\"166\" y=\"122\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >优化器输出</text><line x1=\"294\" y1=\"106\" x2=\"301\" y2=\"106\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><polygon points=\"310,106 300,101 300,111\" fill=\"#7BA6AF\"/><rect x=\"312\" y=\"58\" width=\"252\" height=\"96\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#7BA6AF\" stroke-width=\"1\" /><text x=\"438\" y=\"94\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >可流水化 pipeline</text><text x=\"438\" y=\"122\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >没有阻塞边界的一段</text><line x1=\"566\" y1=\"106\" x2=\"573\" y2=\"106\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><polygon points=\"582,106 572,101 572,111\" fill=\"#7BA6AF\"/><rect x=\"584\" y=\"58\" width=\"252\" height=\"96\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#7BA6AF\" stroke-width=\"1\" /><text x=\"710\" y=\"94\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >LLVM IR</text><text x=\"710\" y=\"122\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >按查询生成的中间表示</text><line x1=\"838\" y1=\"106\" x2=\"845\" y2=\"106\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><polygon points=\"854,106 844,101 844,111\" fill=\"#7BA6AF\"/><rect x=\"856\" y=\"58\" width=\"252\" height=\"96\" rx=\"2\" fill=\"#2E6373\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"982\" y=\"94\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#FFFFFF\" font-weight=\"600\" letter-spacing=\"0\" >本地机器码</text><text x=\"982\" y=\"122\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#CFE0DC\" font-weight=\"400\" letter-spacing=\"0\" >内联 / 优化 / 寄存器分配</text><line x1=\"1110\" y1=\"106\" x2=\"1117\" y2=\"106\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><polygon points=\"1126,106 1116,101 1116,111\" fill=\"#7BA6AF\"/><rect x=\"1128\" y=\"58\" width=\"252\" height=\"96\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#7BA6AF\" stroke-width=\"1\" /><text x=\"1254\" y=\"94\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >推入数据</text><text x=\"1254\" y=\"122\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >tuple / vector / morsel</text><text x=\"40\" y=\"180\" class=\"sv \" text-anchor=\"start\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"600\" letter-spacing=\"0\" >沿途直接完成的逻辑</text><rect x=\"40\" y=\"194\" width=\"320\" height=\"46\" rx=\"2\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"200.0\" y=\"222.1\" class=\"sv \" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#2F7A66\" font-weight=\"600\" letter-spacing=\"0\" >谓词判断</text><rect x=\"380\" y=\"194\" width=\"320\" height=\"46\" rx=\"2\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"540.0\" y=\"222.1\" class=\"sv \" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#2F7A66\" font-weight=\"600\" letter-spacing=\"0\" >投影计算</text><rect x=\"720\" y=\"194\" width=\"320\" height=\"46\" rx=\"2\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"880.0\" y=\"222.1\" class=\"sv \" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#2F7A66\" font-weight=\"600\" letter-spacing=\"0\" >join probe</text><rect x=\"1060\" y=\"194\" width=\"320\" height=\"46\" rx=\"2\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"1220.0\" y=\"222.1\" class=\"sv \" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#2F7A66\" font-weight=\"600\" letter-spacing=\"0\" >聚合状态更新</text><rect x=\"40\" y=\"262\" width=\"1320\" height=\"112\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"64\" y=\"292\" class=\"sv serif\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >一句话定义</text><text x=\"64\" y=\"320\" class=\"sv \" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"400\" letter-spacing=\"0\" >在查询开始前或运行早期，把物理计划中可流水化的一段 operator pipeline 转换成中间表示，再编译成本地机器码；</text><text x=\"64\" y=\"346\" class=\"sv \" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"400\" letter-spacing=\"0\" >执行时由底层数据源把 tuple、vector 或 morsel 推入 pipeline，沿途完成谓词、投影、join probe、聚合更新等逻辑。</text><text x=\"20\" y=\"420\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >它减少的是算子边界与解释器分派成本，代价是编译生命周期与运行时代码管理。</text></svg>"}, {"eyebrow": "术语 · 先划清边界", "title": "七个词，三处最容易混", "lede": "Pull / Push、Pipeline / Pipeline breaker、LLVM Codegen / JIT / 向量化 / Morsel——这些词相邻但不等价；混淆往往就发生在相邻的地方。", "caption": "图 06　每个术语给出「含义」与「易混淆点」；右下角是这一讲的分界判据。", "bridge": "词分清了，就可以进核心原理。第一个动作不是生成代码，而是切分。", "notes": "七个词，最容易混的是三处。第一处，Push 不必然要求 LLVM：Push 是数据方向，LLVM Codegen 是运行时按查询生成机器码，两者常一起出现，但不是一回事；反过来，向量化执行可以解释、可以编译，也可以和 Push 混合。第二处，Pipeline 指的是「没有阻塞边界的一段算子链」，Sort、全局聚合的 build 阶段、hash join 的 build 阶段会把它切断，这些叫 pipeline breaker。第三处，Morsel 是并行调度里分给 worker 的一小块数据范围，是调度单位，不是 SQL 语义单位。还有 Pull 可以按行也可以按 chunk，不等于一定低效；JIT 可能是查询开始前就编译，也可能 hybrid 边跑边编译；LLVM Codegen 不是「把 Rust 或 C++ 编译一下」，而是运行时按这条查询生成代码。给一个统一的判据：看运行时是不是按查询生成了专用机器码。不是看有没有 batch，也不是看谁调谁。这条判据到后面讲 RisingWave 对照时还要用。", "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"20\" y=\"26\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"2.6\" >术语 · 七个词先分清</text><text x=\"1380\" y=\"26\" class=\"sv \" text-anchor=\"end\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" letter-spacing=\"0\" >混淆往往发生在「相邻但不等价」的地方</text><line x1=\"20\" y1=\"38\" x2=\"1380\" y2=\"38\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"40\" y=\"54\" width=\"650\" height=\"76\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"56\" y=\"78\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >Pull 模型</text><text x=\"56\" y=\"101\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >父算子向子算子要数据，典型接口 next()</text><text x=\"56\" y=\"122\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#BE653B\" font-weight=\"400\" letter-spacing=\"0\" >易混淆：可按行也可按 chunk，不等于一定低效</text><rect x=\"710\" y=\"54\" width=\"650\" height=\"76\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"726\" y=\"78\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >Push 模型</text><text x=\"726\" y=\"101\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >子算子把数据推给下游 consumer</text><text x=\"726\" y=\"122\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#BE653B\" font-weight=\"400\" letter-spacing=\"0\" >易混淆：常与 pipeline 编译一起出现，但 Push 不必然 LLVM</text><rect x=\"40\" y=\"138\" width=\"650\" height=\"76\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"56\" y=\"162\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >Pipeline</text><text x=\"56\" y=\"185\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >没有阻塞边界的一段算子链</text><text x=\"56\" y=\"206\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#BE653B\" font-weight=\"400\" letter-spacing=\"0\" >易混淆：Sort、全局聚合 build、hash join build 会切断</text><rect x=\"710\" y=\"138\" width=\"650\" height=\"76\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"726\" y=\"162\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >LLVM Codegen</text><text x=\"726\" y=\"185\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >生成 LLVM IR 并编译为机器码</text><text x=\"726\" y=\"206\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#BE653B\" font-weight=\"400\" letter-spacing=\"0\" >易混淆：不是「把 Rust / C++ 编译一下」，是运行时按查询生成</text><rect x=\"40\" y=\"222\" width=\"650\" height=\"76\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"56\" y=\"246\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >JIT</text><text x=\"56\" y=\"269\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >Just-In-Time 编译</text><text x=\"56\" y=\"290\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#BE653B\" font-weight=\"400\" letter-spacing=\"0\" >易混淆：可能查询开始前编译，也可能 hybrid 边跑边编译</text><rect x=\"710\" y=\"222\" width=\"650\" height=\"76\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"726\" y=\"246\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >向量化执行</text><text x=\"726\" y=\"269\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >一次处理一批列数组</text><text x=\"726\" y=\"290\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#BE653B\" font-weight=\"400\" letter-spacing=\"0\" >易混淆：可解释、可编译，也可与 Push 混合</text><rect x=\"40\" y=\"306\" width=\"650\" height=\"76\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"56\" y=\"330\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >Morsel</text><text x=\"56\" y=\"353\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >并行执行中分给 worker 的小块数据范围</text><text x=\"56\" y=\"374\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#BE653B\" font-weight=\"400\" letter-spacing=\"0\" >易混淆：是调度单位，不是 SQL 语义单位</text><rect x=\"750\" y=\"306\" width=\"650\" height=\"76\" rx=\"2\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"766\" y=\"334\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#2F7A66\" font-weight=\"600\" letter-spacing=\"0\" >一句话划清分界</text><text x=\"766\" y=\"362\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" letter-spacing=\"0\" >看运行时是否「按查询生成专用机器码」；不是看有没有 batch，也不是看谁调谁。</text><text x=\"20\" y=\"420\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >Push 不必然要求 LLVM；向量化可解释、可编译，也可和 Push 混合；三者是不同维度。</text></svg>"}, {"eyebrow": "原理一 · 切分", "title": "编译的不是整棵树，是一段 pipeline", "lede": "不是整棵计划树都适合编译成一个函数。先找到能一路推到底的连续路径：Scan → Filter → Project 通常可融合，遇到阻塞边界就断开。", "caption": "图 07　动画可切换三种计划形态，逐步点亮算子并标出 breaker 与切出的 pipeline 分段。", "bridge": "切分这件事凭什么能自动生成代码？因为算子在编译期都实现同一对接口。", "notes": "核心原理第一步，不是写代码，是切。整棵计划树塞进一个函数会出事：代码巨大、编译慢、指令 cache 压力大。所以先找能推到底的连续路径。Scan 到 Filter 到 Project 通常可以融合；HashJoin 分 build pipeline 和 probe pipeline；Aggregate 可以把局部聚合更新放进 pipeline，但最终输出往往另起一个阶段；Sort、全局去重、需要完整输入才能输出的算子，天然形成 breaker。动画里可以换三种计划形态，按单步看：算子一个个被点亮，遇到 Sort 或 hash join build 就画一条竖直的切线，下面多出一段 pipeline。这里要留一个印象：编译的单位是「段」，不是「树」。切完之后，HyPer 用生产者 / 消费者接口生成代码——每个算子不再运行时调 next，而是在代码生成阶段把自己的处理逻辑嵌进上游或下游的 generated function。最终得到的不是一棵运行时解释的算子树，而是一组 pipeline 函数。下一页把这对接口拆开看。", "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" id=\"animB\"><text x=\"20\" y=\"26\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"2.6\" >原理一 · 先找到能推到底的连续路径</text><text x=\"1380\" y=\"26\" class=\"sv \" text-anchor=\"end\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" letter-spacing=\"0\" >编译的单位不是整棵树，是一段 pipeline</text><line x1=\"20\" y1=\"38\" x2=\"1380\" y2=\"38\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"40\" y=\"60\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"600\" letter-spacing=\"0\" >按执行顺序展开的算子序列（示意）</text><rect class=\"bop\" id=\"bOp0\" x=\"40\" y=\"72\" width=\"252\" height=\"62\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text class=\"sv boptx\" id=\"bOpTx0\" x=\"166\" y=\"110\" text-anchor=\"middle\" font-size=\"15\" fill=\"#89938F\" font-weight=\"600\">算子 1</text><line x1=\"294\" y1=\"103\" x2=\"301\" y2=\"103\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><polygon points=\"310,103 300,98 300,108\" fill=\"#7BA6AF\"/><rect class=\"bop\" id=\"bOp1\" x=\"312\" y=\"72\" width=\"252\" height=\"62\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\
