3\" x1=\"1118\" y1=\"58\" x2=\"1118\" y2=\"150\" stroke=\"#BE653B\" stroke-width=\"2\" stroke-dasharray=\"5 4\" opacity=\"0\"/><text x=\"40\" y=\"168\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"600\" letter-spacing=\"0\" >切出来的 pipeline 分段</text><rect class=\"bseg\" id=\"bSeg0\" x=\"40\" y=\"182\" width=\"1320\" height=\"46\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"0.35\"/><text class=\"sv bsegtx\" id=\"bSegTx0\" x=\"60\" y=\"211\" font-size=\"14\" fill=\"#46585F\" font-weight=\"600\">P1</text><rect class=\"bseg\" id=\"bSeg1\" x=\"40\" y=\"238\" width=\"1320\" height=\"46\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"0.35\"/><text class=\"sv bsegtx\" id=\"bSegTx1\" x=\"60\" y=\"267\" font-size=\"14\" fill=\"#46585F\" font-weight=\"600\">P2</text><rect x=\"40\" y=\"306\" width=\"1320\" height=\"82\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"64\" y=\"336\" class=\"sv \" text-anchor=\"start\" font-size=\"16.0\" fill=\"#BE653B\" font-weight=\"600\" letter-spacing=\"0\" >pipeline breaker：Sort、全局去重、全局聚合的 build 阶段、hash join 的 build 阶段。</text><text x=\"64\" y=\"364\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >它们需要完整输入后才能输出，所以必须物化，编译生成的函数在这里断开。</text><text x=\"20\" y=\"420\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >HyPer 用生产者 / 消费者接口生成代码：算子在编译期把处理逻辑嵌进 generated function。</text></svg>", "ctrl": "<label>计划形态</label><select id=\"bPlan\"><option value=\"p0\">无阻塞边界</option><option value=\"p1\" selected>含 Sort</option><option value=\"p2\">含 Hash Join build</option></select>\n<button class=\"btn play\" id=\"bPlay\">▶ 播放</button><button class=\"btn\" id=\"bTick\">单步</button><button class=\"btn\" id=\"bReset\">重置</button>\n<span class=\"out\" id=\"bOut\"></span>"}, {"eyebrow": "原理一补 · 代码生成", "title": "算子树在编译器里被抹平", "lede": "produce() 自顶向下请求产出元组，consume() 自底向上把算子逻辑嵌进同一个循环体；最终运行时只剩一个紧循环，没有算子边界。", "caption": "图 08　produce / consume 只在查询编译器内部存在；伪代码为机制示意，非某系统源码原文。", "bridge": "生成出来的代码不是一次性的，它有完整的生命周期，也有完整的一堆麻烦。", "notes": "HyPer 那篇 2011 年的论文给了一个特别干净的抽象：每个算子实现两个函数。produce 是「请你产出元组」，从计划树顶往下递归；consume 是「我收到一个元组，请把我的处理逻辑生成进去」，从叶子往上把代码嵌进同一个循环体。scan.produce 发出 for t in table，filter.consume 嵌进 if pred(t)，agg.consume 嵌进 ht[key] 加等于 t.amount，最后补上两个右花括号。运行时留下的就一个 tight loop，数据尽量待在寄存器里，只在取新元组或物化结果时才碰内存。这里有个特别容易被讲错的点，论文自己也特意强调：produce / consume 是查询编译器内部的统一接口，运行时并不存在这层调用，也没有 vtable。递归只发生一次，在编译期，输出是 IR 或代码文本。所以「Push 模型」说的不是运行时有一堆 consume 调用，而是生成出来的代码把数据从物化点推到下一个物化点。理解了这个，才能理解为什么编译本身会变成一条需要管理的生命周期。", "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"20\" y=\"26\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"2.6\" >原理一补 · 算子树在编译器里被抹平</text><text x=\"1380\" y=\"26\" class=\"sv \" text-anchor=\"end\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" letter-spacing=\"0\" >produce / consume 只在代码生成阶段存在</text><line x1=\"20\" y1=\"38\" x2=\"1380\" y2=\"38\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"40\" y=\"56\" width=\"420\" height=\"268\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"56\" y=\"85\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >① 编译期 · 自顶向下 produce</text><text x=\"56\" y=\"114\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >join.produce()</text><text x=\"56\" y=\"149\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >  → filter.produce()</text><text x=\"56\" y=\"184\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >    → scan.produce()</text><text x=\"56\" y=\"219\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >每个算子请求上游「产出元组」</text><text x=\"56\" y=\"254\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >递归只发生在编译器里</text><rect x=\"480\" y=\"56\" width=\"420\" height=\"268\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"496\" y=\"85\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >② 自底向上 consume</text><text x=\"496\" y=\"114\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >scan 发出:  for t in table {</text><text x=\"496\" y=\"149\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >filter 嵌入:  if pred(t) {</text><text x=\"496\" y=\"184\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >agg 嵌入:  ht[key] += t</text><text x=\"496\" y=\"219\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >}  }</text><text x=\"496\" y=\"254\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >逻辑被拼进同一个循环体</text><rect x=\"920\" y=\"56\" width=\"440\" height=\"268\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#7BA6AF\" stroke-width=\"1\" /><text x=\"940\" y=\"86\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >③ 运行时 · 只留下一个紧循环</text><text x=\"940\" y=\"122\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"400\" letter-spacing=\"0\" >for t in table {</text><text x=\"940\" y=\"150\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"400\" letter-spacing=\"0\" >  if pred(t) {</text><text x=\"940\" y=\"178\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"400\" letter-spacing=\"0\" >    key = hash(t.region)</text><text x=\"940\" y=\"206\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"400\" letter-spacing=\"0\" >    ht[key].sum += t.amount</text><text x=\"940\" y=\"234\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"400\" letter-spacing=\"0\" >  }</text><text x=\"940\" y=\"262\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"400\" letter-spacing=\"0\" >}</text><line x1=\"462\" y1=\"190\" x2=\"469\" y2=\"190\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><polygon points=\"478,190 468,185 468,195\" fill=\"#7BA6AF\"/><line x1=\"902\" y1=\"190\" x2=\"909\" y2=\"190\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><polygon points=\"918,190 908,185 908,195\" fill=\"#7BA6AF\"/><rect x=\"40\" y=\"336\" width=\"1320\" height=\"58\" rx=\"2\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1\" /><text x=\"64\" y=\"371\" class=\"sv serif\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#FFFFFF\" font-weight=\"600\" letter-spacing=\"0\" >最终得到的不是一棵运行时解释的算子树，而是一组 pipeline 函数。</text><text x=\"20\" y=\"420\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >Neumann 2011 特别强调：produce / consume 是查询编译器内部的统一接口，运行时并不存在这层调用。</text></svg>"}, {"eyebrow": "原理二 · 生命周期", "title": "代码才是热路径，计划不是", "lede": "LLVM Codegen 的生命周期通常是七步：物理计划 → 识别 pipeline 与 breaker → 生成 IR → LLVM 优化 → 机器码入缓存 → 执行 → 变更时失效。", "caption": "图 09　七个步骤与三个时期；缓存失效触发条件包括 schema、UDF、类型、参数敏感计划、统计信息与版本。", "bridge": "如果只看中间那两步，会严重低估工程量。真正难的在它周围。", "notes": "把编译型执行看成一条流水线，最少七步。优化器先给物理计划；执行器识别哪些是 pipeline、哪些是 breaker；为每个 pipeline 生成 IR；LLVM 做内联、常量折叠、死代码删除、循环优化和寄存器分配；生成机器码放进代码缓存；执行时直接调用；最后当 schema、UDF、类型、参数敏感计划、统计信息或者版本变化时，让缓存失效。这三段时期很关键：编译期是一次性的投入，执行期是多次回收，变更期决定正确性。很多人只盯着「生成 IR 再编译」这一步，觉得不过是拼几行代码字符串；实际上 HyPer 那套 SQL-92 代码生成器上万行代码，而且编译通常只要几毫秒——真正的工程复杂度在后面那页要讲的东西。先把七步记住，因为后面所有代价，编译时间、缓存、失效、observability，都能挂回这条链上的某一个环节。", "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"20\" y=\"26\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"2.6\" >原理二 · LLVM Codegen 生命周期</text><text x=\"1380\" y=\"26\" class=\"sv \" text-anchor=\"end\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" letter-spacing=\"0\" >工程复杂度不在「生成几行代码」</text><line x1=\"20\" y1=\"38\" x2=\"1380\" y2=\"38\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"40\" y=\"58\" width=\"178\" height=\"96\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#7BA6AF\" stroke-width=\"1\" /><text x=\"129\" y=\"94\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >① 物理计划</text><text x=\"129\" y=\"122\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >优化器生成</text><line x1=\"220\" y1=\"106\" x2=\"223\" y2=\"106\" stroke=\"#7BA6AF\" stroke-width=\"1.5\"/><polygon points=\"232,106 222,101 222,111\" fill=\"#7BA6AF\"/><rect x=\"234\" y=\"58\" width=\"178\" height=\"96\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#7BA6AF\" stroke-width=\"1\" /><text x=\"323\" y=\"94\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >② 识别 pipeline</text><text x=\"323\" y=\"122\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >找到 breaker</text><line x1=\"414\" y1=\"106\" x2=\"417\" y2=\"106\" stroke=\"#7BA6AF\" stroke-width=\"1.5\"/><polygon points=\"426,106 416,101 416,111\" fill=\"#7BA6AF\"/><rect x=\"428\" y=\"58\" width=\"178\" height=\"96\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#7BA6AF\" stroke-width=\"1\" /><text x=\"517\" y=\"94\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >③ 生成 IR</text><text x=\"517\" y=\"122\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >每 pipeline 一份</text><line x1=\"608\" y1=\"106\" x2=\"611\" y2=\"106\" stroke=\"#7BA6AF\" stroke-width=\"1.5\"/><polygon points=\"620,106 610,101 610,111\" fill=\"#7BA6AF\"/><rect x=\"622\" y=\"58\" width=\"178\" height=\"96\" rx=\"2\" fill=\"#2E6373\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"711\" y=\"94\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#FFFFFF\" font-weight=\"600\" letter-spacing=\"0\" >④ LLVM 优化</text><text x=\"711\" y=\"122\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#CFE0DC\" font-weight=\"400\" letter-spacing=\"0\" >内联 / 折叠 / 删除</text><line x1=\"802\" y1=\"106\" x2=\"805\" y2=\"106\" stroke=\"#7BA6AF\" stroke-width=\"1.5\"/><polygon points=\"814,106 804,101 804,111\" fill=\"#7BA6AF\"/><rect x=\"816\" y=\"58\" width=\"178\" height=\"96\" rx=\"2\" fill=\"#2E6373\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"905\" y=\"94\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#FFFFFF\" font-weight=\"600\" letter-spacing=\"0\" >⑤ 机器码</text><text x=\"905\" y=\"122\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#CFE0DC\" font-weight=\"400\" letter-spacing=\"0\" >放入代码缓存</text><line x1=\"996\" y1=\"106\" x2=\"999\" y2=\"106\" stroke=\"#7BA6AF\" stroke-width=\"1.5\"/><polygon points=\"1008,106 998,101 998,111\" fill=\"#7BA6AF\"/><rect x=\"1010\" y=\"58\" width=\"178\" height=\"96\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#7BA6AF\" stroke-width=\"1\" /><text x=\"1099\" y=\"94\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >⑥ 执行</text><text x=\"1099\" y=\"122\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >调用机器码</text><line x1=\"1190\" y1=\"106\" x2=\"1193\" y2=\"106\" stroke=\"#7BA6AF\" stroke-width=\"1.5\"/><polygon points=\"1202,106 1192,101 1192,111\" fill=\"#7BA6AF\"/><rect x=\"1204\" y=\"58\" width=\"178\" height=\"96\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#7BA6AF\" stroke-width=\"1\" /><text x=\"1293\" y=\"94\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >⑦ 缓存失效</text><text x=\"1293\" y=\"122\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >变更时作废</text><rect x=\"40\" y=\"190\" width=\"425\" height=\"92\" rx=\"2\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"60\" y=\"222\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"600\" letter-spacing=\"0\" >编译期 · 一次</text><text x=\"60\" y=\"250\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >IR 生成、内联、常量折叠、死代码删除、循环优化、寄存器分配</text><rect x=\"485\" y=\"190\" width=\"425\" height=\"92\" rx=\"2\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"505\" y=\"222\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"600\" letter-spacing=\"0\" >执行期 · 多次</text><text x=\"505\" y=\"250\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >morsel 推入 pipeline，热路径直接跑机器码</text><rect x=\"930\" y=\"190\" width=\"425\" height=\"92\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"950\" y=\"222\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"600\" letter-spacing=\"0\" >变更期 · 失效</text><text x=\"950\" y=\"250\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >重新生成或回退到解释 / 向量化执行</text><rect x=\"40\" y=\"300\" width=\"1320\" height=\"90\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"64\" y=\"330\" class=\"sv serif\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"600\" letter-spacing=\"0\" >缓存失效的常见触发条件</text><rect x=\"64\" y=\"344\" width=\"196\" height=\"34\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"162.0\" y=\"365.25\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#BE653B\" font-weight=\"600\" letter-spacing=\"0\" >schema 变化</text><rect x=\"276\" y=\"344\" width=\"196\" height=\"34\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"374.0\" y=\"365.25\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#BE653B\" font-weight=\"600\" letter-spacing=\"0\" >UDF / 函数定义</text><rect x=\"488\" y=\"344\" width=\"196\" height=\"34\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"586.0\" y=\"365.25\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#BE653B\" font-weight=\"600\" letter-spacing=\"0\" >类型与参数敏感计划</text><rect x=\"700\" y=\"344\" width=\"196\" height=\"34\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"798.0\" y=\"365.25\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#BE653B\" font-weight=\"600\" letter-spacing=\"0\" >统计信息变化</text><rect x=\"912\" y=\"344\" width=\"196\" height=\"34\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"1010.0\" y=\"365.25\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#BE653B\" font-weight=\"600\" letter-spacing=\"0\" >版本升级</text><rect x=\"1124\" y=\"344\" width=\"196\" height=\"34\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"1222.0\" y=\"365.25\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#BE653B\" font-weight=\"600\" letter-spacing=\"0\" >执行参数变化</text><text x=\"20\" y=\"420\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >步骤来自 HyPer 一系工程实践：编译预算、代码缓存、失效策略、profile、fallback 都要补齐。</text></svg>"}, {"eyebrow": "生命周期 · 周边设施", "title": "真正难的不是生成，是把它管起来", "lede": "编译预算、代码缓存与失效、profile、fallback、EXPLAIN 可见性、编译队列——这些周边设施缺失，编译能力就会变成不可观测、不可回退的风险。", "caption": "图 10　中心是 IR 到机器码，两侧六项才是生产系统必须补齐的能力；连线只走水平方向。", "bridge": "生命周期讲完，回到执行本身：Push 到底省掉了什么，又没省掉什么？", "notes": "中间那一块，LLVM IR 到优化再到机器码，其实是最容易讲清楚的部分。围着它的六件事才决定这套东西能不能上生产。编译预算：编译多久算超支，短查询要不要直接跳过；代码缓存与失效：缓存多大、谁负责作废、命中率怎么算，没有边界就会变成内存问题；profile 与可观测：生成了什么、跑在哪儿、耗时多少；fallback：编译失败、类型路径不支持、UDF 塞不进去时，能不能稳稳退回解释型或者向量化执行；EXPLAIN 可见性：DBA 能不能一眼看出这条 SQL 编没编译、编译了多久；编译队列：并发编译要不要限流，别把在线查询拖垮。这六项不是锦上添花，是编译能力的前提条件。少了它们，你得到的不是更快的执行引擎，而是一个不可观测、不可回退、不可控的延迟_tail 风险。有了这个认识，再看下一页的「Push 减少了什么」，就不会被一句口号带跑。", "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"20\" y=\"26\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"2.6\" >生命周期 · 复杂度在周边设施</text><text x=\"1380\" y=\"26\" class=\"sv \" text-anchor=\"end\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" letter-spacing=\"0\" >代码生成只是中间那一小块</text><line x1=\"20\" y1=\"38\" x2=\"1380\" y2=\"38\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"520\" y=\"56\" width=\"360\" height=\"312\" rx=\"2\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1\" /><text x=\"700\" y=\"132\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"24.0\" fill=\"#FFFFFF\" font-weight=\"600\" letter-spacing=\"0\" >LLVM IR</text><text x=\"700\" y=\"172\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"20.0\" fill=\"#CFE0DC\" font-weight=\"600\" letter-spacing=\"0\" >→ 优化 → 机器码</text><text x=\"700\" y=\"224\" class=\"sv \" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#A4C4C6\" font-weight=\"400\" letter-spacing=\"0\" >真正难的</text><text x=\"700\" y=\"252\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"19.0\" fill=\"#FFFFFF\" font-weight=\"600\" letter-spacing=\"0\" >不是生成，</text><text x=\"700\" y=\"282\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"19.0\" fill=\"#FFFFFF\" font-weight=\"600\" letter-spacing=\"0\" >是把它管起来。</text><rect x=\"40\" y=\"56\" width=\"440\" height=\"92\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#7BA6AF\" stroke-width=\"1\" /><text x=\"60\" y=\"88\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >编译预算</text><text x=\"60\" y=\"118\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >编译多久算超支？短查询要不要跳过</text><line x1=\"480\" y1=\"102\" x2=\"520\" y2=\"102\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><rect x=\"40\" y=\"160\" width=\"440\" height=\"92\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#7BA6AF\" stroke-width=\"1\" /><text x=\"60\" y=\"192\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >代码缓存与失效</text><text x=\"60\" y=\"222\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >缓存多大、谁负责作废、命中率怎么算</text><line x1=\"480\" y1=\"206\" x2=\"520\" y2=\"206\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><rect x=\"40\" y=\"264\" width=\"440\" height=\"92\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#7BA6AF\" stroke-width=\"1\" /><text x=\"60\" y=\"296\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >profile 与可观测</text><text x=\"60\" y=\"326\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >生成了什么、跑在哪儿、耗时多少</text><line x1=\"480\" y1=\"310\" x2=\"520\" y2=\"310\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><rect x=\"920\" y=\"56\" width=\"440\" height=\"92\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"940\" y=\"88\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#BE653B\" font-weight=\"600\" letter-spacing=\"0\" >fallback</text><text x=\"940\" y=\"118\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >编译失败 / 不支持类型 / UDF 能回退吗</text><line x1=\"880\" y1=\"102\" x2=\"920\" y2=\"102\" stroke=\"#BE653B\" stroke-width=\"1.6\"/><rect x=\"920\" y=\"160\" width=\"440\" height=\"92\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"940\" y=\"192\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#BE653B\" font-weight=\"600\" letter-spacing=\"0\" >EXPLAIN 可见性</text><text x=\"940\" y=\"222\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >DBA 能否看到是否编译、编译多久</text><line x1=\"880\" y1=\"206\" x2=\"920\" y2=\"206\" stroke=\"#BE653B\" stroke-width=\"1.6\"/><rect x=\"920\" y=\"264\" width=\"440\" height=\"92\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"940\" y=\"296\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#BE653B\" font-weight=\"600\" letter-spacing=\"0\" >编译队列</text><text x=\"940\" y=\"326\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >并发编译如何限流，别拖垮在线查询</text><line x1=\"880\" y1=\"310\" x2=\"920\" y2=\"310\" stroke=\"#BE653B\" stroke-width=\"1.6\"/><text x=\"20\" y=\"420\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >缺少这些设施，编译能力就会变成不可观测、不可回退、不可控的延迟与内存风险。</text></svg>"}, {"eyebrow": "原理三 · 少什么、不少什么", "title": "减少的是边界，不是数据结构", "lede": "编译型 Push 常被误解为「不再有 batch / chunk」。更准确地说，它减少的是 operator 边界上的通用容器和分派成本，但输入缓冲、hash table、聚合状态、selection vector 都还在。", "caption": "图 11　左右对照同一条 SQL 的 Pull 形态与 Push 热路径；伪代码来自原文，用于讲机制。", "bridge": "而且真实系统比这段伪代码脏得多——这正是 hybrid 存在的理由。", "notes": "还是那条 orders 的分组求和查询。Pull 形态是 Agg.next 调 Filter.next 再调 Scan.next，一层层往上递。编译型 Push 的等价热路径更像左边这段伪代码：对一个 morsel 里的每个 tuple，load 出 status 和 amount，判断 paid 且大于一百，再 load 出 region，直接更新哈希表里的 sum。注意这里没有「算子 A 把结果交给算子 B」这回事，谓词、投影、聚合全在同一个循环体里。可千万别把这句话读成「数据结构消失了」。输入缓冲、输出缓冲、hash table、聚合状态、selection vector、visibility bitmap，一个都少不了；省掉的是边界上那层通用容器和分派。真实系统还要处理 NULL、类型转换、溢出、collation、事务可见性、异常、UDF、向量宽度、SIMD 可用性和内存分配。所以口号要收着说：编译型 Push 是把通用开销从热路径里拿掉，不是把数据状态变没。也正因为这些脏活，纯编译路线在生产里往往会让位给 hybrid。", "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"20\" y=\"26\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"2.6\" >原理三 · 减少的是边界，不是数据结构</text><text x=\"1380\" y=\"26\" class=\"sv \" text-anchor=\"end\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" letter-spacing=\"0\" >编译型 Push 不等于「不再有 batch / chunk」</text><line x1=\"20\" y1=\"38\" x2=\"1380\" y2=\"38\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"40\" y=\"54\" width=\"640\" height=\"220\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"60\" y=\"82\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >示例查询与 Pull 形态</text><text x=\"60\" y=\"112\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" letter-spacing=\"0\" >SELECT region, sum(amount) FROM orders</text><text x=\"60\" y=\"134\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" letter-spacing=\"0\" >WHERE status = &#x27;paid&#x27; AND amount &gt; 100</text><text x=\"60\" y=\"156\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" letter-spacing=\"0\" >GROUP BY region;</text><line x1=\"60\" y1=\"186\" x2=\"660\" y2=\"186\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"60\" y=\"212\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"400\" letter-spacing=\"0\" >Agg.next()</text><text x=\"60\" y=\"236\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"400\" letter-spacing=\"0\" >  → Filter.next()</text><text x=\"60\" y=\"260\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"400\" letter-spacing=\"0\" >       → Scan.next()</text><rect x=\"700\" y=\"54\" width=\"660\" height=\"220\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#7BA6AF\" stroke-width=\"1\" /><text x=\"720\" y=\"82\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >编译型 Push 的等价热路径</text><text x=\"720\" y=\"114\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"400\" letter-spacing=\"0\" >for t in scan_morsel:</text><text x=\"720\" y=\"139\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"400\" letter-spacing=\"0\" >  status = load(status_col)</text><text x=\"720\" y=\"164\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"400\" letter-spacing=\"0\" >  amount = load(amount_col)</text><text x=\"720\" y=\"189\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"400\" letter-spacing=\"0\" >  if status == &quot;paid&quot; and amount &gt; 100:</text><text x=\"720\" y=\"214\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"400\" letter-spacing=\"0\" >    region = load(region_col)</text><text x=\"720\" y=\"239\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"400\" letter-spacing=\"0\" >    ht[region].sum += amount</text><text x=\"40\" y=\"300\" class=\"sv \" text-anchor=\"start\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"600\" letter-spacing=\"0\" >仍然需要的数据结构（一个都少不了）</text><rect x=\"40\" y=\"314\" width=\"206\" height=\"46\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#7BA6AF\" stroke-width=\"1\" /><text x=\"143.0\" y=\"341.59\" class=\"sv \" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >输入缓冲</text><rect x=\"262\" y=\"314\" width=\"206\" height=\"46\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#7BA6AF\" stroke-width=\"1\" /><text x=\"365.0\" y=\"341.59\" class=\"sv \" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >输出缓冲</text><rect x=\"484\" y=\"314\" width=\"206\" height=\"46\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#7BA6AF\" stroke-width=\"1\" /><text x=\"587.0\" y=\"341.59\" class=\"sv \" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >hash table</text><rect x=\"706\" y=\"314\" width=\"206\" height=\"46\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#7BA6AF\" stroke-width=\"1\" /><text x=\"809.0\" y=\"341.59\" class=\"sv \" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >聚合状态</text><rect x=\"928\" y=\"314\" width=\"206\" height=\"46\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#7BA6AF\" stroke-width=\"1\" /><text x=\"1031.0\" y=\"341.59\" class=\"sv \" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >selection vector</text><rect x=\"1150\" y=\"314\" width=\"206\" height=\"46\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#7BA6AF\" stroke-width=\"1\" /><text x=\"1253.0\" y=\"341.59\" class=\"sv \" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >visibility bitmap</text><rect x=\"40\" y=\"366\" width=\"1320\" height=\"30\" rx=\"2\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1\" /><text x=\"60\" y=\"386\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" letter-spacing=\"0\" >真实系统还要处理 NULL、类型转换、溢出、collation、事务可见性、异常、UDF、向量宽度与 SIMD。</text><text x=\"20\" y=\"420\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >减少的是 operator 边界上的通用容器和分派成本；状态、缓冲与表结构依旧存在。</text></svg>"}, {"eyebrow": "原理三补 · 混合执行", "title": "真实系统没那么干净，所以多半是 hybrid", "lede": "NULL、溢出、collation、事务可见性、UDF 黑盒都会拉高代码生成复杂度。很多系统因此选择：短查询先解释或向量化，长查询 / 热点再切换到编译代码。", "caption": "图 12　左侧是复杂语义清单，右侧是切换决策；按行数、运行时间、CPU sample 或 query fingerprint 决定。", "bridge": "单线程跑得再快也用不满多核。编译之后，还有一个调度问题要解决。", "notes": "数据库的表达式不是普通算术表达式。NULL 语义、类型转换、溢出检查、collation、事务可见性、异常处理、UDF 黑盒、向量宽度、SIMD 可用性、内存分配，每一项都可能让生成代码变复杂、让编译变慢，甚至根本生不出来。于是很多系统选了 hybrid：查询进来先按行数、运行时间、CPU sample 或者历史 query fingerprint 判断一下，短查询和冷路径继续走解释型或向量化执行，长查询和热点路径再切到编译代码。这个切换点本身就是一个设计决策，没有标准答案。它也解释了前面那句「不是所有数据库都该默认打开」：编译是一笔前置投入，启动成本必须被热路径的收益覆盖，否则短查询还没跑热就结束，编译费白交了。把这条记住，后面讲效果、讲适用边界、讲坑，全都会回到它。现在换个角度：就算一段 pipeline 编译得再快，只让一个线程跑，多核也闲着。", "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"20\" y=\"26\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"2.6\" >原理三补 · 真实系统没那么干净</text><text x=\"1380\" y=\"26\" class=\"sv \" text-anchor=\"end\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" letter-spacing=\"0\" >所以生产系统往往选 hybrid / tiered</text><line x1=\"20\" y1=\"38\" x2=\"1380\" y2=\"38\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"40\" y=\"54\" width=\"620\" height=\"292\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"60\" y=\"84\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#BE653B\" font-weight=\"600\" letter-spacing=\"0\" >数据库表达式不是普通算术表达式</text><rect x=\"60\" y=\"104\" width=\"270\" height=\"36\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"195.0\" y=\"126.42\" class=\"sv \" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#BE653B\" font-weight=\"600\" letter-spacing=\"0\" >NULL 语义</text><rect x=\"350\" y=\"104\" width=\"270\" height=\"36\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"485.0\" y=\"126.42\" class=\"sv \" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#BE653B\" font-weight=\"600\" letter-spacing=\"0\" >类型转换</text><rect x=\"60\" y=\"150\" width=\"270\" height=\"36\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"195.0\" y=\"172.42\" class=\"sv \" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#BE653B\" font-weight=\"600\" letter-spacing=\"0\" >溢出检查</text><rect x=\"350\" y=\"150\" width=\"270\" height=\"36\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"485.0\" y=\"172.42\" class=\"sv \" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#BE653B\" font-weight=\"600\" letter-spacing=\"0\" >collation</text><rect x=\"60\" y=\"196\" width=\"270\" height=\"36\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"195.0\" y=\"218.42\" class=\"sv \" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#BE653B\" font-weight=\"600\" letter-spacing=\"0\" >事务可见性</text><rect x=\"350\" y=\"196\" width=\"270\" height=\"36\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"485.0\" y=\"218.42\" class=\"sv \" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#BE653B\" font-weight=\"600\" letter-spacing=\"0\" >异常处理</text><rect x=\"60\" y=\"242\" width=\"270\" height=\"36\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"195.0\" y=\"264.42\" class=\"sv \" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#BE653B\" font-weight=\"600\" letter-spacing=\"0\" >UDF 黑盒</text><rect x=\"350\" y=\"242\" width=\"270\" height=\"36\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"485.0\" y=\"264.42\" class=\"sv \" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#BE653B\" font-weight=\"600\" letter-spacing=\"0\" >向量宽度</text><rect x=\"60\" y=\"288\" width=\"270\" height=\"36\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"195.0\" y=\"310.42\" class=\"sv \" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#BE653B\" font-weight=\"600\" letter-spacing=\"0\" >SIMD 可用性</text><rect x=\"350\" y=\"288\" width=\"270\" height=\"36\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"485.0\" y=\"310.42\" class=\"sv \" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#BE653B\" font-weight=\"600\" letter-spacing=\"0\" >内存分配</text><text x=\"60\" y=\"328\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >每一项都可能把生成代码变复杂、把编译变慢。</text><rect x=\"690\" y=\"54\" width=\"670\" height=\"292\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"710\" y=\"84\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >切换点本身就是一个设计决策</text><rect x=\"880\" y=\"104\" width=\"290\" height=\"56\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#7BA6AF\" stroke-width=\"1\" /><text x=\"1025.0\" y=\"137.44\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >查询进入</text><line x1=\"1025\" y1=\"160\" x2=\"1025\" y2=\"171\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><polygon points=\"1025,180 1020,170 1030,170\" fill=\"#7BA6AF\"/><rect x=\"880\" y=\"182\" width=\"290\" height=\"56\" rx=\"2\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1\" /><text x=\"1025.0\" y=\"214.25\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"600\" letter-spacing=\"0\" >看行数 / 时间 / CPU sample / fingerprint</text><line x1=\"865\" y1=\"210\" x2=\"880\" y2=\"210\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><line x1=\"865\" y1=\"210\" x2=\"865\" y2=\"235\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><polygon points=\"865,244 860,234 870,234\" fill=\"#7BA6AF\"/><line x1=\"1170\" y1=\"210\" x2=\"1190\" y2=\"210\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><line x1=\"1190\" y1=\"210\" x2=\"1190\" y2=\"235\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><polygon points=\"1190,244 1185,234 1195,234\" fill=\"#7BA6AF\"/><rect x=\"710\" y=\"244\" width=\"310\" height=\"76\" rx=\"2\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"730\" y=\"272\" class=\"sv serif\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#2F7A66\" font-weight=\"600\" letter-spacing=\"0\" >短查询 / 冷路径</text><text x=\"730\" y=\"298\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >解释型或向量化执行</text><rect x=\"1040\" y=\"244\" width=\"300\" height=\"76\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"1060\" y=\"272\" class=\"sv serif\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"600\" letter-spacing=\"0\" >长查询 / 热点</text><text x=\"1060\" y=\"298\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >切换到编译代码</text><rect x=\"40\" y=\"358\" width=\"1320\" height=\"44\" rx=\"2\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1\" /><text x=\"64\" y=\"386\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#FFFFFF\" font-weight=\"600\" letter-spacing=\"0\" >启动成本必须被热路径收益覆盖 —— 这正是「不该默认全开」的根本原因。</text><text x=\"20\" y=\"420\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >Hybrid 把两套路径的复杂度一起承担，换来短查询的低延迟与长查询的高吞吐。</text></svg>"}, {"eyebrow": "原理四 · 并行调度", "title": "morsel 让编译后的循环喂饱多核", "lede": "Morsel-Driven Parallelism 把大扫描范围切成很多小块，worker 动态领取 morsel 并跑完整条 pipeline 直到下一个 breaker；快的 worker 多拿，慢的少拿。", "caption": "图 13　动画可调 morsel 粒度与 worker 数；领取记录为动态调度的算术示意，非实测。", "bridge": "讲完编译这一侧，我们换一个对照样本，看看「向量化解释执行」长什么样。", "notes": "Morsel-Driven Parallelism 解决的是另一个问题：编译得再快，单线程也喂不饱多核。这是 Leis 他们 2014 年 SIGMOD 那篇论文，思路是把大扫描范围切成很多小块，叫 morsel，worker 在运行时动态领取，每领一块就把整条 pipeline 跑到下一个 breaker 为止。动画里可以换粒度和 worker 数，一步一步看队列里的块被谁领走。它比静态分区更抗数据倾斜：快的 worker 多拿几个，慢的少拿几个，并行度甚至能在查询执行中弹性变化，而不是写死在计划里。论文还强调 NUMA locality——让 worker 尽量处理本地内存附近的数据，减少跨 socket 访问，线程绑核避免被操作系统搬走。morsel 有两个方向相反的约束：太小，调度次数多，dispatcher 自己成瓶颈；太大，负载不均、首响应变慢。所以再强调一次，morsel 是调度单位，不是 SQL 语义单位，别把它和优化器里的分区、分组混起来。到这里编译这一侧的机制讲完了，我们换一个对照样本。", "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" id=\"animC\"><text x=\"20\" y=\"26\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"2.6\" >原理四 · 让编译后的 pipeline 喂饱多核</text><text x=\"1380\" y=\"26\" class=\"sv \" text-anchor=\"end\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" letter-spacing=\"0\" >morsel 是调度单位，不是 SQL 语义单位</text><line x1=\"20\" y1=\"38\" x2=\"1380\" y2=\"38\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"40\" y=\"60\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"600\" letter-spacing=\"0\" >扫描范围切成小块 · morsel 队列</text><rect class=\"cm\" id=\"cM0\" x=\"40\" y=\"74\" width=\"112\" height=\"34\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text class=\"sv mono cmtx\" id=\"cMT0\" x=\"96\" y=\"96\" text-anchor=\"middle\" font-size=\"12\" fill=\"#89938F\">m01</text><rect class=\"cm\" id=\"cM1\" x=\"162\" y=\"74\" width=\"112\" height=\"34\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text class=\"sv mono cmtx\" id=\"cMT1\" x=\"218\" y=\"96\" text-anchor=\"middle\" font-size=\"12\" fill=\"#89938F\">m02</text><rect class=\"cm\" id=\"cM2\" x=\"284\" y=\"74\" width=\"112\" height=\"34\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text class=\"sv mono cmtx\" id=\"cMT2\" x=\"340\" y=\"96\" text-anchor=\"middle\" font-size=\"12\" fill=\"#89938F\">m03</text><rect class=\"cm\" id=\"cM3\" x=\"406\" y=\"74\" width=\"112\" height=\"34\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text class =\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >morsel 太小 → 调度次数多、dispatcher 成为瓶颈；morsel 太大 → 负载不均、首响应变慢。</text><text x=\"64\" y=\"360\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >NUMA locality：让 worker 尽量处理本地内存附近的数据，减少跨 socket 访问；论文用运行时调度取代把并行度写死在计划里。</text><text x=\"20\" y=\"420\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >Morsel-Driven Parallelism（Leis 等，SIGMOD 2014）：worker 跑完整条 pipeline 直到下一个 breaker。</text></svg>", "ctrl": "<label>morsel 粒度</label><select id=\"cGran\"><option value=\"16\" selected>细（16 块）</option><option value=\"8\">中（8 块）</option><option value=\"4\">粗（4 块）</option></select>\n<label>worker 数</label><select id=\"cWorkers\"><option value=\"2\">2</option><option value=\"3\">3</option><option value=\"4\" selected>4</option></select>\n<button class=\"btn play\" id=\"cPlay\">▶ 播放</button><button class=\"btn\" id=\"cTick\">单步</button><button class=\"btn\" id=\"cReset\">重置</button>\n<span class=\"out\" id=\"cOut\"></span>"}, {"eyebrow": "对照 · RisingWave", "title": "chunk 执行路径长什么样", "lede": "batch Executor::execute() 返回 BoxedDataChunkStream；DataChunk 是列数组加 visibility bitmap；表达式入口是 Expression::eval(&DataChunk) 返回 ArrayRef。", "caption": "图 14　SQL → batch plan → ExecutorBuilder → DataChunk / StreamChunk；源码路径来自原文与本地源码核对。", "bridge": "把两条路摆在一起，那条分界线就清楚了：向量化不等于 LLVM Codegen。", "notes": "RisingWave 是个很好的对照样本。SQL 进 frontend，batch 查询会在自己的 batch plan 和可选的 DataFusion plan 之间选，后者主要用于特定场景比如 Iceberg 路径；然后 ExecutorBuilder 从 protobuf plan 递归构建 executor，Executor 的 execute 返回一个 BoxedDataChunkStream。DataChunk 是列数组加 visibility bitmap，还区分 cardinality 和 capacity。batch 的 FilterExecutor 对 child chunk 调 compact_vis，再执行表达式，拿到 bool array 后设置 visibility；ProjectExecutor 对每个表达式调 eval(&DataChunk)，组装新的 DataChunk。表达式接口 eval、eval_v2、eval_row 返回 ArrayRef，这是标准的向量化执行结构。stream 侧处理的是 StreamChunk，多了 Insert、Delete、UpdateDelete、UpdateInsert 这些 op，还要处理 barrier、watermark、状态清理和一致性。这些都是 chunk 和表达式求值，没有运行时按查询生成 LLVM IR 这一步。源码里的 codegen 主要出现在 Rust 宏和构建期表达式函数注册的语境里。所以下一页这条分界线，得说得很清楚。", "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"20\" y=\"26\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"2.6\" >对照 · RisingWave 当前 chunk 执行路径</text><text x=\"1380\" y=\"26\" class=\"sv \" text-anchor=\"end\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" letter-spacing=\"0\" >batch 与 stream 共用 chunk / 表达式抽象</text><line x1=\"20\" y1=\"38\" x2=\"1380\" y2=\"38\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"40\" y=\"54\" width=\"252\" height=\"84\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#7BA6AF\" stroke-width=\"1\" /><text x=\"166\" y=\"86\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >SQL</text><text x=\"166\" y=\"112\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >frontend 解析</text><line x1=\"294\" y1=\"96\" x2=\"301\" y2=\"96\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><polygon points=\"310,96 300,91 300,101\" fill=\"#7BA6AF\"/><rect x=\"312\" y=\"54\" width=\"252\" height=\"84\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#7BA6AF\" stroke-width=\"1\" /><text x=\"438\" y=\"86\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >batch plan</text><text x=\"438\" y=\"112\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >可选 DataFusion 路径</text><line x1=\"566\" y1=\"96\" x2=\"573\" y2=\"96\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><polygon points=\"582,96 572,91 572,101\" fill=\"#7BA6AF\"/><rect x=\"584\" y=\"54\" width=\"252\" height=\"84\" rx=\"2\" fill=\"#E5EFF0 与构建期表达式函数注册语境，不是运行时 LLVM / JIT 查询编译入口。</text><text x=\"20\" y=\"420\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >DataChunk 与 Expression::eval 是向量化解释执行的典型结构，不等于 LLVM Codegen。</text></svg>"}, {"eyebrow": "分界 · 别把两件事当一件", "title": "向量化解释执行 ≠ 编译型 Push", "lede": "按行解释、批内向量化、编译型 Push 是三层不同的改动。判断分界只有一句话：运行时是否按这条查询生成了专用机器码。", "caption": "图 15　三层剖面与边界声明；本文不是说 RisingWave 已实现 LLVM Codegen，而是用它的 chunk 执行器作对照。", "bridge": "两条路看清了，就能把四条执行路线放在同一张表里比——不比谁先进，比成本放在哪里。", "notes": "这一页必须说得非常明确，否则整篇都会被引歪。把执行引擎的改动分成三层：最上面是 Volcano 式按行解释，每行穿过算子接口，开销在函数调用、虚调用和解释分派；中间是批内向量化，一次处理一批列数组，减少的是「按行解释」的开销，RisingWave 的 DataChunk、DuckDB 的向量都是这一层；最下面是编译型 Push，运行时按这条查询生成专用机器码，进一步尝试减少表达式树解释、算子边界和通用分派。三者可以组合，但不是一回事：向量化改的是数据粒度，Codegen 改的是执行代码本身。从当前本地源码和 DeepWiki 查询看，RisingWave 没有运行时 LLVM / JIT 查询编译入口，所以本文绝不是说它已经实现了 LLVM Codegen，而是拿它的 chunk 执行器帮大家看清这条线。判据就一句：机器码是不是按这条查询现生成的？不是看有没有 batch，不是看谁调谁。带着这把尺子，我们横向比一比四条路线。", "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"20\" y=\"26\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"2.6\" >分界 · 向量化解释执行 vs 编译型 Push</text><text x=\"1380\" y=\"26\" class=\"sv \" text-anchor=\"end\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" letter-spacing=\"0\" >一句话：运行时是否按查询生成机器码</text><line x1=\"20\" y1=\"38\" x2=\"1380\" y2=\"38\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"40\" y=\"56\" width=\"940\" height=\"84\" rx=\"0\" fill=\"#EBF1EE\" stroke=\"#EBF1EE\" stroke-width=\"1\" /><text x=\"64\" y=\"90\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#1B2B33\" font-weight=\"600\" letter-spacing=\"0\" >① 按行解释 · Volcano</text><text x=\"64\" y=\"120\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\" letter-spacing=\"0\" >每行穿过算子接口 · 开销：函数调用 / 虚调用 / 解释分派</text><rect x=\"40\" y=\"152\" width=\"940\" height=\"84\" rx=\"0\" fill=\"#A4C4C6\" stroke=\"#A4C4C6\" stroke-width=\"1\" /><text x=\"64\" y=\"186\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#1B2B33\" font-weight=\"600\" letter-spacing=\"0\" >② 批内向量化 · chunk</text><text x=\"64\" y=\"216\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\" letter-spacing=\"0\" >一次处理一批列数组 · 减少「按行解释」的开销</text><rect x=\"40\" y=\"248\" width=\"940\" height=\"84\" rx=\"0\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1\" /><text x=\"64\" y=\"282\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#FFFFFF\" font-weight=\"600\" letter-spacing=\"0\" >③ 编译型 Push · LLVM</text><text x=\"64\" y=\"312\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"400\" letter-spacing=\"0\" >运行时生成专用机器码 · 再减表达式树解释 / 算子边界 / 通用分派</text><line x1=\"510\" y1=\"140\" x2=\"510\" y2=\"141\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><polygon points=\"510,150 505,140 515,140\" fill=\"#7BA6AF\"/><line x1=\"510\" y1=\"236\" x2=\"510\" y2=\"237\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><polygon points=\"510,246 505,236 515,236\" fill=\"#7BA6AF\"/><rect x=\"1010\" y=\"56\" width=\"350\" height=\"274\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"1030\" y=\"88\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#BE653B\" font-weight=\"600\" letter-spacing=\"0\" >本文的边界声明</text><text x=\"1030\" y=\"122\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\" letter-spacing=\"0\" >不是说 RisingWave 已实现 LLVM Codegen。</text><text x=\"1030\" y=\"152\" class=\"sv \" text-anchor=\"start\" font-size=\"9.0\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >当前本地源码与 DeepWiki 查询都没有发现运行时 LLVM / JIT 查询编译入口。</text><text x=\"1030\" y=\"214\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >它是很好的对照样本：</text><text x=\"1030\" y=\"244\" class=\"sv \" text-anchor=\"start\" font-size=\"10.9\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >帮我们看清「向量化解释执行」与「编译型 Push」之间那条线。</text><text x=\"1030\" y=\"294\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#BE653B\" font-weight=\"600\" letter-spacing=\"0\" >关键判断：机器码是不是按这条查询现生成的？</text><rect x=\"40\" y=\"348\" width=\"1320\" height=\"50\" rx=\"2\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"64\" y=\"379\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#2F7A66\" font-weight=\"600\" letter-spacing=\"0\" >两者可以组合，但不是一回事：向量化改的是数据粒度，Codegen 改的是执行代码本身。</text><text x=\"20\" y=\"420\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >把「有 batch / chunk」当成「有 Codegen」，是这一讲最需要纠正的误会。</text></svg>"}, {"eyebrow": "横向 · 四条路线", "title": "不是谁先进，是成本放在哪里", "lede": "编译型 Push + LLVM、Volcano / Pull 解释、向量化解释、Hybrid，在启动成本、热路径效率、短查询 / 长查询表现、工程复杂度与可观测性上各有取舍。", "caption": "图 16　按机制比较四条路线，表中不含性能数字；评估具体引擎仍需回到真实负载实测。", "bridge": "表比完了，落到最实在的问题：收益哪来、代价哪来，怎么算这笔账。", "notes": "四条路线摆在一张表里，别急着找「谁最先进」。编译型 Push 启动成本高，要生成 IR 并编译，但热路径少分派、可内联、少中间物化，长分析查询和 CPU 密集的 pipeline 最舒服，代价是 debug 难、工程复杂度高，短查询和 ad hoc 黑盒 UDF 多的场景不划算。Volcano Pull 赢在通用、模块化、启动快、好 debug，输在大扫描时被解释器开销拖累。向量化解释站在中间，批量处理列数组，启动成本中低，通用 OLAP 和流批 chunk 处理都很稳，但仍有表达式分派。Hybrid 想把启动延迟和长查询吞吐都要，工程复杂度最高，而且必须先有代码缓存和可观测性能力。表的关键不是排名，是「成本放在哪里」：Pull 把复杂度放在通用 executor 接口；向量化放在列数组和批处理算子；编译型放在代码生成、编译预算和运行时代码管理；Hybrid 同时承担两套。评估引擎时按自己的 workload 对号入座，别拿一句「编译更快」当结论。", "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"20\" y=\"26\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"2.6\" >横向 · 四条路线，成本放在哪里</text><text x=\"1380\" y=\"26\" class=\"sv \" text-anchor=\"end\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" letter-spacing=\"0\" >关键不是谁先进，是复杂度落在哪一层</text><line x1=\"20\" y1=\"38\" x2=\"1380\" y2=\"38\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"40\" y=\"54\" width=\"172\" height=\"34\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#7BA6AF\" stroke-width=\"1\" /><text x=\"50\" y=\"76\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >维度</text><rect x=\"216\" y=\"54\" width=\"277\" height=\"34\" rx=\"0\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1\" /><text x=\"226\" y=\"76\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#FFFFFF\" font-weight=\"600\" letter-spacing=\"0\" >编译型 Push + LLVM</text><rect x=\"497\" y=\"54\" width=\"277\" height=\"34\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#7BA6AF\" stroke-width=\"1\" /><text x=\"507\" y=\"76\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >Volcano / Pull 解释</text><rect x=\"778\" y=\"54\" width=\"277\" height=\"34\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#7BA6AF\" stroke-width=\"1\" /><text x=\"788\" y=\"76\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >向量化解释执行</text><rect x=\"1059\" y=\"54\" width=\"277\" height=\"34\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#7BA6AF\" stroke-width=\"1\" /><text x=\"1069\" y=\"76\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >Hybrid 执行</text><rect x=\"40\" y=\"90\" width=\"172\" height=\"31\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"50\" y=\"111\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >主要目标</text><rect x=\"216\" y=\"90\" width=\"277\" height=\"31\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"226\" y=\"111\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >热点 pip "#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"226\" y=\"303\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >高：需 IR / profile 可见性</text><rect x=\"497\" y=\"282\" width=\"277\" height=\"31\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"507\" y=\"303\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >低</text><rect x=\"778\" y=\"282\" width=\"277\" height=\"31\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"788\" y=\"303\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >中</text><rect x=\"1059\" y=\"282\" width=\"277\" height=\"31\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"1069\" y=\"303\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >高</text><rect x=\"40\" y=\"314\" width=\"172\" height=\"31\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"50\" y=\"335\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"0\" >适合场景</text><rect x=\"216\" y=\"314\" width=\"277\" height=\"31\" rx=\"0\" fill=\"#FBF6EA\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"226\" y=\"335\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >长热点 pipeline、稳定报表</text><rect x=\"497\" y=\"314\" width=\"277\" height=\"31\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"507\" y=\"335\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" letter-spacing=\"0\" >控制流复杂、执行次数少</text><rect x=\"778\" y=\"314\" width=\"277\" height=\"31\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"788\" y=\"335\"
