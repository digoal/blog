" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"600\" >④ DuckIndexScanState<\/text><text x=\"1225.0\" y=\"99.375\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >准备分批 fetch<\/text><rect x=\"20\" y=\"200\" width=\"310\" height=\"90\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"175.0\" y=\"238.675\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"600\" >⑤ 分批<\/text><text x=\"175.0\" y=\"259.375\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >按 STANDARD_VECTOR_SIZE<\/text><line x1=\"332\" y1=\"245\" x2=\"361.6\" y2=\"245\" stroke=\"#2F7A66\" stroke-width=\"1.8\"/><polygon points=\"368,245 360,240.6 360,249.4\" fill=\"#2F7A66\"/><rect x=\"370\" y=\"200\" width=\"310\" height=\"90\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"525.0\" y=\"238.675\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"600\" >⑥ storage.Fetch()<\/text><text x=\"525.0\" y=\"259.375\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >按 row_id 取列<\/text><line x1=\"682\" y1=\"245\" x2=\"711.6\" y2=\"245\" stroke=\"#2F7A66\" stroke-width=\"1.8\"/><polygon points=\"718,245 710,240.6 710,249.4\" fill=\"#2F7A66\"/><rect x=\"720\" y=\"200\" width=\"310\" height=\"90\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"875.0\" y=\"238.675\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"600\" >⑦ DataChunk<\/text><text x=\"875.0\" y=\"259.375\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >向量化列块<\/text><line x1=\"1032\" y1=\"245\" x2=\"1061.6\" y2=\"245\" stroke=\"#2F7A66\" stroke-width=\"1.8\"/><polygon points=\"1068,245 1060,240.6 1060,249.4\" fill=\"#2F7A66\"/><rect x=\"1070\" y=\"200\" width=\"310\" height=\"90\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"1225.0\" y=\"238.675\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"600\" >⑧ 上层算子<\/text><text x=\"1225.0\" y=\"259.375\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >继续向量化执行<\/text><line x1=\"1225\" y1=\"130\" x2=\"1225\" y2=\"168\" stroke=\"#BE653B\" stroke-width=\"1.8\"/><line x1=\"1225\" y1=\"168\" x2=\"175\" y2=\"168\" stroke=\"#BE653B\" stroke-width=\"1.8\"/><line x1=\"175\" y1=\"168\" x2=\"175\" y2=\"191.6\" stroke=\"#BE653B\" stroke-width=\"1.8\"/><polygon points=\"175,198 170.6,190 179.4,190\" fill=\"#BE653B\"/><rect x=\"20\" y=\"320\" width=\"660\" height=\"96\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"36\" y=\"350\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"700\" >PostgreSQL · 逐 TID<\/text><text x=\"36\" y=\"376\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >index AM 返回 TID → executor fetch heap tuple<\/text><text x=\"36\" y=\"402\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >逐 tuple 推进，可见性判断很核心<\/text><rect x=\"700\" y=\"320\" width=\"680\" height=\"96\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"716\" y=\"350\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#2F7A66\" font-weight=\"700\" >DuckDB · 批量<\/text><text x=\"716\" y=\"376\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >ART 返回 row_id set → 批量 Fetch 成 DataChunk<\/text><text x=\"716\" y=\"402\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >维持向量化；超过阈值回退高吞吐 table scan<\/text><\/svg>", "ctrl": null}, {"eyebrow": "13 · 为什么是 ART", "title": "为什么 DuckDB 用 ART", "lede": "Adaptive Radix Tree 把按字节寻址和自适应节点大小结合起来，点查与极小范围很省。", "caption": "节点类型与路径压缩来自 ART 论文；DuckDB 的 TryInitializeScan() 当前主要支持常量边界比较。", "bridge": "两条实现路线摆在一起，差异就一目了然了。", "notes": ["DuckDB 的索引实现是 ART，Adaptive Radix Tree，思想来自 The Adaptive Radix Tree: Fast Memory-Efficient Indexed Lookups：把 radix tree 的按字节寻址能力和自适应节点大小结合起来。", "典型节点有四档：Node4 最多 4 个孩子，适合稀疏分支；Node16 最多 16 个；Node48 用映射表压缩 256 路空间；Node256 直接 256 路寻址，适合高扇出。再加一条路径压缩：公共前缀只存一次，长 key 不会拖出一长串单分支节点。", "从源码看，ART::TryInitializeScan() 目前主要支持常量边界的比较：等于、大于、大于等于、小于、小于等于、BETWEEN；ART::Scan() 再按边界分派等值查找、范围查找或全量扫描。若扫描中发现匹配 row_id 超过阈值，就返回失败让上层回退。这不是通用索引的全部能力，而是 DuckDB 主动收窄的适用范围。"], "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20\" y=\"20\" width=\"325\" height=\"150\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"20\" y=\"20\" width=\"325\" height=\"6\" rx=\"0\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.0\" /><text x=\"38\" y=\"48\" class=\"sv serif\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#245A6B\" font-weight=\"700\" >Node4<\/text><text x=\"38\" y=\"88\" class=\"sv mono\" text-anchor=\"start\" font-size=\"32.0\" fill=\"#245A6B\" font-weight=\"700\" >4<\/text><text x=\"38\" y=\"116\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >最多 4 个孩子<\/text><text x=\"38\" y=\"140\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" >稀疏分支，用小的有序数组<\/text><rect x=\"270\" y=\"66\" width=\"56\" height=\"26\" rx=\"3\" fill=\"#74A5AD\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"298\" y=\"84\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"600\" >路<\/text><rect x=\"365\" y=\"20\" width=\"325\" height=\"150\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"365\" y=\"20\" width=\"325\" height=\"6\" rx=\"0\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.0\" /><text x=\"383\" y=\"48\" class=\"sv serif\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#245A6B\" font-weight=\"700\" >Node16<\/text><text x=\"383\" y=\"88\" class=\"sv mono\" text-anchor=\"start\" font-size=\"32.0\" fill=\"#245A6B\" font-weight=\"700\" >16<\/text><text x=\"383\" y=\"116\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >最多 16 个孩子<\/text><text x=\"383\" y=\"140\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" >按 key 字节有序存放<\/text><rect x=\"615\" y=\"66\" width=\"56\" height=\"26\" rx=\"3\" fill=\"#A4C4C6\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"643\" y=\"84\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"600\" >路<\/text><rect x=\"710\" y=\"20\" width=\"325\" height=\"150\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"710\" y=\"20\" width=\"325\" height=\"6\" rx=\"0\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1.0\" /><text x=\"728\" y=\"48\" class=\"sv serif\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#245A6B\" font-weight=\"700\" >Node48<\/text><text x=\"728\" y=\"88\" class=\"sv mono\" text-anchor=\"start\" font-size=\"32.0\" fill=\"#245A6B\" font-weight=\"700\" >48<\/text><text x=\"728\" y=\"116\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >最多 48 个孩子<\/text><text x=\"728\" y=\"140\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" >256 路映射表压缩空间<\/text><rect x=\"960\" y=\"66\" width=\"56\" height=\"26\" rx=\"3\" fill=\"#CFE0DC\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"988\" y=\"84\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"600\" >路<\/text><rect x=\"1055\" y=\"20\" width=\"325\" height=\"150\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"1055\" y=\"20\" width=\"325\" height=\"6\" rx=\"0\" fill=\"#74A5AD\" stroke=\"#74A5AD\" stroke-width=\"1.0\" /><text x=\"1073\" y=\"48\" class=\"sv serif\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#245A6B\" font-weight=\"700\" >Node256<\/text><text x=\"1073\" y=\"88\" class=\"sv mono\" text-anchor=\"start\" font-size=\"32.0\" fill=\"#245A6B\" font-weight=\"700\" >256<\/text><text x=\"1073\" y=\"116\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >直接 256 路寻址<\/text><text x=\"1073\" y=\"140\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" >高扇出，空间换查找速度<\/text><rect x=\"1305\" y=\"66\" width=\"56\" height=\"26\" rx=\"3\" fill=\"#EBF1EE\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"1333\" y=\"84\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"600\" >路<\/text><rect x=\"20\" y=\"190\" width=\"1360\" height=\"78\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"38\" y=\"234.95\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"600\" >路径压缩<\/text><text x=\"302\" y=\"233.55\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >公共前缀只存一次，避免长 key 造成大量单分支节点；与自适应节点大小一起构成 ART 的核心思想<\/text><rect x=\"20\" y=\"280\" width=\"1360\" height=\"60\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#F1EFE9\" stroke-width=\"1.0\" /><text x=\"38\" y=\"315.95\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"600\" >按字节寻址<\/text><text x=\"302\" y=\"314.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >radix tree 的分片能力 + 四种自适应节点；论文 The Adaptive Radix Tree 讨论的正是这套取舍<\/text><rect x=\"20\" y=\"350\" width=\"1360\" height=\"60\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1.0\" /><text x=\"38\" y=\"385.95\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#AE8A3E\" font-weight=\"600\" >DuckDB 当前<\/text><text x=\"302\" y=\"384.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >TryInitializeScan() 主要支持常量边界：= / &gt; / &gt;= / &lt; / &lt;= / BETWEEN；ART::Scan() 再分派等值、范围或全量扫描<\/text><\/svg>", "ctrl": null}, {"eyebrow": "14 · 两条路线对照", "title": "同名，不同工程含义", "lede": "PostgreSQL 让索引参与成本竞争；DuckDB 把索引当作低选择率加速器。", "caption": "七个维度来自原文对照表；结论不引入任何未验证的性能数字。", "bridge": "差异落到日常，就是「哪些查询该走、哪些不该走」。", "notes": ["把七个维度摊开看，会发现同名之下是两套工程逻辑。PostgreSQL 主要面对 OLTP 和混合负载，index scan 是显式计划节点，索引 AM 返回 TID、executor 取 heap tuple，选择靠通用成本模型、统计信息、相关性和 pathkeys，失败时由 planner 换一条 path。", "DuckDB 面对 OLAP 和嵌入式分析，本来顺序扫列就很快，index scan 只是 table scan 初始化里的 ART 分支，返回的是 row_id set，再向量化 fetch；选择靠硬阈值加规则，超了行数就在初始化阶段回退普通扫描。", "所以同样叫 index scan，一个是「主要访问路径之一，参与成本竞争」，一个是「列式顺序扫描之外的低选择率加速器」。这句话能解释后面几乎所有场景判断。"], "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20\" y=\"10\" width=\"1360\" height=\"32\" rx=\"3\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.0\" /><text x=\"34\" y=\"30.55\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#FFFFFF\" font-weight=\"600\" >维度<\/text><line x1=\"240\" y1=\"17\" x2=\"240\" y2=\"35\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"254\" y=\"30.55\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#FFFFFF\" font-weight=\"400\" >PostgreSQL<\/text><line x1=\"800\" y1=\"17\" x2=\"800\" y2=\"35\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"814\" y=\"30.55\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#FFFFFF\" font-weight=\"400\" >DuckDB<\/text><rect x=\"20\" y=\"46\" width=\"1360\" height=\"42\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"34\" y=\"71.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#245A6B\" font-weight=\"600\" >主要场景<\/text><line x1=\"240\" y1=\"53\" x2=\"240\" y2=\"81\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"254\" y=\"71.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >OLTP / 混合负载，索引是核心访问路径<\/text><line x1=\"800\" y1=\"53\" x2=\"800\" y2=\"81\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"814\" y=\"71.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >OLAP / 嵌入式分析，顺序列扫描很强<\/text><rect x=\"20\" y=\"92\" width=\"1360\" height=\"42\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"34\" y=\"117.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#245A6B\" font-weight=\"600\" >index scan 形态<\/text><line x1=\"240\" y1=\"99\" x2=\"240\" y2=\"127\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"254\" y=\"117.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >显式计划节点 Index Scan<\/text><line x1=\"800\" y1=\"99\" x2=\"800\" y2=\"127\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"814\" y=\"117.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >table scan 初始化中的 ART 分支<\/text><rect x=\"20\" y=\"138\" width=\"1360\" height=\"42\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"34\" y=\"163.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#245A6B\" font-weight=\"600\" >返回单位<\/text><line x1=\"240\" y1=\"145\" x2=\"240\" y2=\"173\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"254\" y=\"163.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >索引 AM 返回 TID，executor fetch heap tuple<\/text><line x1=\"800\" y1=\"145\" x2=\"800\" y2=\"173\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"814\" y=\"163.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >ART 返回 row_id set，再向量化 fetch<\/text><rect x=\"20\" y=\"184\" width=\"1360\" height=\"42\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"34\" y=\"209.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#245A6B\" font-weight=\"600\" >选择策略<\/text><line x1=\"240\" y1=\"191\" x2=\"240\" y2=\"219\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"254\" y=\"209.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >通用成本模型、统计信息、相关性、pathkeys<\/text><line x1=\"800\" y1=\"191\" x2=\"800\" y2=\"219\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"814\" y=\"209.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >硬阈值加规则判断，超过行数回退<\/text><rect x=\"20\" y=\"230\" width=\"1360\" height=\"42\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"34\" y=\"255.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#245A6B\" font-weight=\"600\" >并发可见性<\/text><line x1=\"240\" y1=\"237\" x2=\"240\" y2=\"265\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"254\" y=\"255.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >MVCC snapshot 与 heap tuple 可见性检查很核心<\/text><line x1=\"800\" y1=\"237\" x2=\"800\" y2=\"265\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"814\" y=\"255.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >也有事务本地数据处理，执行形态更偏批量<\/text><rect x=\"20\" y=\"276\" width=\"1360\" height=\"42\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"34\" y=\"301.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#245A6B\" font-weight=\"600\" >范围和排序<\/text><line x1=\"240\" y1=\"283\" x2=\"240\" y2=\"311\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"254\" y=\"301.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >B-tree 天然支持有序扫描<\/text><line x1=\"800\" y1=\"283\" x2=\"800\" y2=\"311\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"814\" y=\"301.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >ART 支持查找和范围，但不是路径排序中心<\/text><rect x=\"20\" y=\"322\" width=\"1360\" height=\"42\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"34\" y=\"347.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#245A6B\" font-weight=\"600\" >失败回退<\/text><line x1=\"240\" y1=\"329\" x2=\"240\" y2=\"357\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"254\" y=\"347.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >planner 选择其他 path<\/text><line x1=\"800\" y1=\"329\" x2=\"800\" y2=\"357\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"814\" y=\"347.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >table scan 初始化阶段回退普通扫描<\/text><rect x=\"20\" y=\"376\" width=\"1360\" height=\"46\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1.0\" /><text x=\"38\" y=\"404.25\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#AE8A3E\" font-weight=\"600\" >一句话<\/text><text x=\"212\" y=\"403.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >PostgreSQL：索引是主要访问路径之一；DuckDB：索引是列式顺序扫描之外的低选择率加速器<\/text><\/svg>", "ctrl": null}, {"eyebrow": "15 · 场景归位", "title": "什么时候该走，什么时候该停", "lede": "把场景摊开看，判断依据始终是候选集规模、回表形态，以及索引顺序能否被复用。", "caption": "SQL 片段取自原文示例；「不适合」并非禁止，而是需要 EXPLAIN 与真实数据验证。", "bridge": "知道该不该走，下一页看怎么把索引设计成「刚好对得上访问路径」。", "notes": ["先看适合的四类。点查，比如主键或高选择率列，PostgreSQL 的 B-tree 和 DuckDB 的 ART 都最容易命中；小范围扫描，复合索引 (user_id, event_time) 能把某个用户的时间区间圈出来；排序加早停，ORDER BY 配合 LIMIT 让执行器按序拿前几行；还有 Nested Loop 的内表，外表过滤后只剩少量 customer，内表用 orders(customer_id) 反复小查，价值来自「重复小查询」而不是一次大范围扫描。", "再看不适合的五类：返回比例太高，回表规模接近全表；索引顺序和物理顺序低相关，候选散落各页；谓词形态不可索引，比如 lower(email) 需要表达式索引；统计信息过旧，planner 估错选择率；以及索引维护成本超过收益——每个索引都在给写入、VACUUM、checkpoint、备份和缓存加负担。", "这九条不是规则表，是九个提问角度。真要下结论，还是回到 EXPLAIN 和真实数据分布。"], "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20\" y=\"10\" width=\"660\" height=\"40\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.0\" /><text x=\"36\" y=\"36\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#2F7A66\" font-weight=\"700\" >适合 · 候选集小，或索引顺序可用<\/text><rect x=\"700\" y=\"10\" width=\"680\" height=\"40\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.0\" /><text x=\"716\" y=\"36\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#BE653B\" font-weight=\"700\" >不适合 · 回表或门槛不划算<\/text><rect x=\"20\" y=\"58\" width=\"660\" height=\"78\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"36\" y=\"84\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#2F7A66\" font-weight=\"700\" >点查<\/text><text x=\"36\" y=\"106\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >唯一索引 / 高选择率索引，PG 与 DuckDB 都容易命中<\/text><text x=\"36\" y=\"126\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"400\" >SELECT * FROM users WHERE id = 42;<\/text><rect x=\"20\" y=\"146\" width=\"660\" height=\"78\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"36\" y=\"172\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#2F7A66\" font-weight=\"700\" >小范围扫描<\/text><text x=\"36\" y=\"194\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >复合索引 (user_id, event_time) 定位某用户的时间区间<\/text><text x=\"36\" y=\"214\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"400\" >WHERE user_id = 1001 AND event_time &gt;= ...<\/text><rect x=\"20\" y=\"234\" width=\"660\" height=\"78\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"36\" y=\"260\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#2F7A66\" font-weight=\"700\" >排序加早停<\/text><text x=\"36\" y=\"282\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >按目标顺序产出，避免过滤后再排序<\/text><text x=\"36\" y=\"302\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"400\" >ORDER BY created_at DESC LIMIT 10<\/text><rect x=\"20\" y=\"322\" width=\"660\" height=\"78\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"36\" y=\"348\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#2F7A66\" font-weight=\"700\" >Nested Loop 内表<\/text><text x=\"36\" y=\"370\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >外表过滤后反复小查，价值来自「重复小查询」<\/text><text x=\"36\" y=\"390\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"400\" >orders(customer_id)<\/text><rect x=\"700\" y=\"58\" width=\"680\" height=\"62\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"716\" y=\"84\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#BE653B\" font-weight=\"700\" >返回比例太高<\/text><text x=\"716\" y=\"106\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >status IN (&#x27;paid&#x27;,&#x27;shipped&#x27;) 覆盖大部分表，逐个回表更差<\/text><rect x=\"700\" y=\"128\" width=\"680\" height=\"62\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"716\" y=\"154\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#BE653B\" font-weight=\"700\" >低相关性导致随机 fetch<\/text><text x=\"716\" y=\"176\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >候选行散落在很多 heap page 上<\/text><rect x=\"700\" y=\"198\" width=\"680\" height=\"62\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"716\" y=\"224\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#BE653B\" font-weight=\"700\" >谓词不具备可索引形态<\/text><text x=\"716\" y=\"246\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >lower(email) 需要表达式索引，普通 email 索引帮不上<\/text><rect x=\"700\" y=\"268\" width=\"680\" height=\"62\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"716\" y=\"294\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#BE653B\" font-weight=\"700\" >统计信息过旧<\/text><text x=\"716\" y=\"316\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >数据分布变化后用 ANALYZE 修正估算<\/text><rect x=\"700\" y=\"338\" width=\"680\" height=\"62\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"716\" y=\"364\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#BE653B\" font-weight=\"700\" >索引维护成本超过收益<\/text><text x=\"716\" y=\"386\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >写入、更新、VACUUM、checkpoint、备份、缓存都受影响<\/text><\/svg>", "ctrl": null}, {"eyebrow": "16 · 设计索引", "title": "让索引对得上访问路径", "lede": "复合 B-tree 不是把常用列都塞进去；列顺序要跟着 WHERE、范围列和 ORDER BY 走。", "caption": "示例来自原文：等值列在前、范围列在后，并让索引顺序直接服务 ORDER BY created_at DESC。", "bridge": "设计讲完，来收拾五个几乎人人都踩过的误区。", "notes": ["设计索引的第一问永远是：候选集能缩到多小。高基数列、强过滤列、业务唯一键、时间窗口里的局部范围通常更适合；低基数列不是绝对不能建，但要看组合方式，比如单独的 status 很弱，(tenant_id, status, created_at) 在多租户系统里可能很强。", "第二问是复合索引的列顺序。看左边这条查询：tenant_id 和 user_id 是等值条件，created_at 是范围条件，ORDER BY 还要 created_at DESC，那么 (tenant_id, user_id, created_at DESC) 就能同时服务过滤和排序。但如果主要查询变成跨用户按时间查租户事件，列顺序就得重排。", "还要区分「覆盖列」和「过滤列」：index-only scan 要索引覆盖查询列，还要 visibility map 能证明页面 all-visible；过度 include 列会让索引膨胀、写放大。最后一条：在 DuckDB 这类列式向量化引擎里保持克制，别把 OLTP 的习惯直接搬过去。"], "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20\" y=\"20\" width=\"760\" height=\"190\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"36\" y=\"48\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"600\" >查询形态<\/text><text x=\"36\" y=\"78\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" xml:space=\"preserve\">WHERE tenant_id = ?<\/text><text x=\"36\" y=\"106\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" xml:space=\"preserve\">  AND user_id = ?<\/text><text x=\"36\" y=\"134\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" xml:space=\"preserve\">  AND created_at &gt;= ?<\/text><text x=\"36\" y=\"162\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" xml:space=\"preserve\">ORDER BY created_at DESC<\/text><rect x=\"20\" y=\"230\" width=\"230\" height=\"62\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"135.0\" y=\"254.675\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >等值列<\/text><text x=\"135.0\" y=\"275.375\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >tenant_id / user_id<\/text><line x1=\"252\" y1=\"261\" x2=\"262.4\" y2=\"261\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"268,261 261,257.15 261,264.85\" fill=\"#245A6B\"/><rect x=\"270\" y=\"230\" width=\"230\" height=\"62\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.1\" /><text x=\"385.0\" y=\"254.675\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >范围列<\/text><text x=\"385.0\" y=\"275.375\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >created_at &gt;=<\/text><line x1=\"502\" y1=\"261\" x2=\"512.4\" y2=\"261\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"518,261 511,257.15 511,264.85\" fill=\"#245A6B\"/><rect x=\"520\" y=\"230\" width=\"230\" height=\"62\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"635.0\" y=\"254.675\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >顺序需求<\/text><text x=\"635.0\" y=\"275.375\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >created_at DESC<\/text><line x1=\"385\" y1=\"294\" x2=\"385\" y2=\"315.6\" stroke=\"#BE653B\" stroke-width=\"1.8\"/><polygon points=\"385,322 380.6,314 389.4,314\" fill=\"#BE653B\"/><rect x=\"20\" y=\"328\" width=\"760\" height=\"70\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1.0\" /><text x=\"38\" y=\"368.95\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#2F7A66\" font-weight=\"600\" >复合索引建议<\/text><text x=\"292\" y=\"368.25\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#2F7A66\" font-weight=\"400\" >(tenant_id, user_id, created_at DESC)<\/text><rect x=\"810\" y=\"20\" width=\"570\" height=\"376\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"826\" y=\"50\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#245A6B\" font-weight=\"700\" >五条实践判断<\/text><rect x=\"826\" y=\"70\" width=\"538\" height=\"54\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"840\" y=\"93\" class=\"sv serif\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"700\" >候选集优先<\/text><text x=\"840\" y=\"113\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >高基数列、强过滤列、业务唯一键、时间窗口<\/text><rect x=\"826\" y=\"132\" width=\"538\" height=\"54\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"840\" y=\"155\" class=\"sv serif\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"700\" >复合列序<\/text><text x=\"840\" y=\"175\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >列顺序匹配查询形态，不是把常用列都塞进去<\/text><rect x=\"826\" y=\"194\" width=\"538\" height=\"54\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"840\" y=\"217\" class=\"sv serif\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"700\" >排序与 LIMIT<\/text><text x=\"840\" y=\"237\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >很多慢查询是过滤后排序慢，不是过滤慢<\/text><rect x=\"826\" y=\"256\" width=\"538\" height=\"54\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"840\" y=\"279\" class=\"sv serif\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"700\" >覆盖列 ≠ 过滤列<\/text><text x=\"840\" y=\"299\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >index-only 需 visibility map；过度 include 会写放大<\/text><rect x=\"826\" y=\"318\" width=\"538\" height=\"54\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"840\" y=\"341\" class=\"sv serif\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"700\" >分析型克制<\/text><text x=\"840\" y=\"361\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >DuckDB 里别照搬 OLTP 的「凡查询列必建索引」<\/text><text x=\"20\" y=\"416\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >若主要查询改成跨用户按时间查租户事件，前导列与列顺序也要跟着改。<\/text><\/svg>", "ctrl": null}, {"eyebrow": "17 · 常见误区", "title": "五个常见误区", "lede": "把「有索引」和「一定快」拆开，慢查询排查就少走一半弯路。", "caption": "每条误区对应原文的机制解释；index-only scan 的回表条件以 visibility map 为准。", "bridge": "误区清完，再看一个把 index scan 推向未来的方向：I/O 与 CPU 的交错。", "notes": ["把最常见的五个误区一次说清。第一，有索引不等于一定走索引，优化器比较的是成本，索引存在只是提供候选路径。第二，index scan 不一定比 seq scan 快，回表随机 I/O 太多时，顺序扫更划算很正常。", "第三，Index Cond 里的条件不是全部过滤，Filter 可能移除大量行；看 EXPLAIN 必须同时看 Index Cond、Filter、实际行数和 buffer。第四，index-only scan 不是永远不访问表，PostgreSQL 需要 visibility map 证明页面 all-visible，否则列都在索引里也可能访问 heap。", "第五，DuckDB 有索引也不该照 PostgreSQL 的用法来，ART index scan 有明确阈值和规则，它的默认强项依然是列式顺序扫描与向量化执行。这五条背后其实是同一句话：别用名字推性能，用机制推性能。"], "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20\" y=\"20\" width=\"560\" height=\"70\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.1\" /><text x=\"36\" y=\"62\" class=\"sv serif\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"600\" >误区 1 · 有索引就一定会走索引<\/text><line x1=\"584\" y1=\"55\" x2=\"637.6\" y2=\"55\" stroke=\"#BE653B\" stroke-width=\"1.8\"/><polygon points=\"644,55 636,50.6 636,59.4\" fill=\"#BE653B\"/><rect x=\"652\" y=\"20\" width=\"728\" height=\"70\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"668\" y=\"62\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#2F7A66\" font-weight=\"500\" >索引只是提供候选路径，planner 按估算成本在多种 path 之间竞争<\/text><rect x=\"20\" y=\"100\" width=\"560\" height=\"70\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.1\" /><text x=\"36\" y=\"142\" class=\"sv serif\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"600\" >误区 2 · index scan 一定比 seq scan 快<\/text><line x1=\"584\" y1=\"135\" x2=\"637.6\" y2=\"135\" stroke=\"#BE653B\" stroke-width=\"1.8\"/><polygon points=\"644,135 636,130.6 636,139.4\" fill=\"#BE653B\"/><rect x=\"652\" y=\"100\" width=\"728\" height=\"70\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"668\" y=\"142\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#2F7A66\" font-weight=\"500\" >回表随机 I/O 太多时，seq scan 更快很正常；数据库按成本而非名字选计划<\/text><rect x=\"20\" y=\"180\" width=\"560\" height=\"70\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.1\" /><text x=\"36\" y=\"222\" class=\"sv serif\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"600\" >误区 3 · Index Cond 就是全部过滤<\/text><line x1=\"584\" y1=\"215\" x2=\"637.6\" y2=\"215\" stroke=\"#BE653B\" stroke-width=\"1.8\"/><polygon points=\"644,215 636,210.6 636,219.4\" fill=\"#BE653B\"/><rect x=\"652\" y=\"180\" width=\"728\" height=\"70\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"668\" y=\"222\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#2F7A66\" font-weight=\"500\" >Filter 仍可能移除大量行；看 EXPLAIN 要同时看 Index Cond、Filter、实际行数与 buffer<\/text><rect x=\"20\" y=\"260\" width=\"560\" height=\"70\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.1\" /><text x=\"36\" y=\"302\" class=\"sv serif\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"600\" >误区 4 · index-only scan 永不访问表<\/text><line x1=\"584\" y1=\"295\" x2=\"637.6\" y2=\"295\" stroke=\"#BE653B\" stroke-width=\"1.8\"/><polygon points=\"644,295 636,290.6 636,299.4\" fill=\"#BE653B\"/><rect x=\"652\" y=\"260\" width=\"728\" height=\"70\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"668\" y=\"302\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#2F7A66\" font-weight=\"500\" >需要 visibility map 证明页面 all-visible，否则即使列都在索引里也可能访问 heap<\/text><rect x=\"20\" y=\"340\" width=\"560\" height=\"70\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.1\" /><text x=\"36\" y=\"382\" class=\"sv serif\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"600\" >误区 5 · DuckDB 有索引就该像 PG 一样用<\/text><line x1=\"584\" y1=\"375\" x2=\"637.6\" y2=\"375\" stroke=\"#BE653B\" stroke-width=\"1.8\"/><polygon points=\"644,375 636,370.6 636,379.4\" fill=\"#BE653B\"/><rect x=\"652\" y=\"340\" width=\"728\" height=\"70\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"668\" y=\"382\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#2F7A66\" font-weight=\"500\" >ART index scan 有明确阈值和规则；默认强项仍是列式顺序扫描与向量化执行<\/text><\/svg>", "ctrl": null}, {"eyebrow": "18 · 异步 I/O 的关系", "title": "逐 TID 的下一步是批量与交错", "lede": "传统 index scan 容易把 I/O 串成单线；现代执行器要让 I/O 请求与 CPU 执行重叠。", "caption": "论文 Interleaving Resilient Asynchronous I/O in Query Execution 作为机制背景；不引用未验证的实验数字。", "bridge": "机制讲透了，最后落到可操作的：怎么做实验、怎么排查。", "notes": ["论文 Interleaving Resilient Asynchronous I/O in Query Execution 指向一个更大的趋势：存储设备并发能力变强之后，执行器不能再用同步、阻塞、逐 tuple 的方式发起 I/O，得把 I/O 请求和 CPU 执行交错起来。", "对 index scan 尤其明显。传统形态是「取一个 TID、读一个 heap page、处理一个 tuple、再取下一个 TID」，随机访问一多，同一时刻往往只有一个请求在飞。改进方向有四条：bitmap scan 先批量收集 TID 再按页访问；向量化引擎先收集 row_id 再批量 fetch；执行器引入异步 prefetch 或 interleaving；存储层利用现代 SSD 的队列深度。", "回看本文涉及的两套源码：PostgreSQL 给了 bitmap scan、index-only scan、成本模型和访问方法接口；DuckDB 在 ART 命中后批量 fetch，超阈值就回到高吞吐 table scan。路子不同，但都在往「批量、重叠」走。"], "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20\" y=\"20\" width=\"1360\" height=\"48\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.0\" /><text x=\"36\" y=\"50\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#BE653B\" font-weight=\"700\" >传统路径 · 同步阻塞：取一个 TID → 读一个 heap page → 处理一个 tuple<\/text><rect x=\"20\" y=\"76\" width=\"210\" height=\"56\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"125.0\" y=\"108.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"600\" >取一个 TID<\/text><line x1=\"232\" y1=\"104\" x2=\"240.4\" y2=\"104\" stroke=\"#BE653B\" stroke-width=\"1.7\"/><polygon points=\"246,104 239,100.15 239,107.85\" fill=\"#BE653B\"/><rect x=\"248\" y=\"76\" width=\"210\" height=\"56\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"353.0\" y=\"108.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"600\" >读 heap page<\/text><line x1=\"460\" y1=\"104\" x2=\"468.4\" y2=\"104\" stroke=\"#BE653B\" stroke-width=\"1.7\"/><polygon points=\"474,104 467,100.15 467,107.85\" fill=\"#BE653B\"/><rect x=\"476\" y=\"76\" width=\"210\" height=\"56\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"581.0\" y=\"108.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"600\" >处理 tuple<\/text><line x1=\"688\" y1=\"104\" x2=\"696.4\" y2=\"104\" stroke=\"#BE653B\" stroke-width=\"1.7\"/><polygon points=\"702,104 695,100.15 695,107.85\" fill=\"#BE653B\"/><rect x=\"704\" y=\"76\" width=\"210\" height=\"56\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"809.0\" y=\"108.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"600\" >取下一个 TID<\/text><line x1=\"916\" y1=\"104\" x2=\"924.4\" y2=\"104\" stroke=\"#BE653B\" stroke-width=\"1.7\"/><polygon points=\"930,104 923,100.15 923,107.85\" fill=\"#BE653B\"/><rect x=\"932\" y=\"76\" width=\"210\" height=\"56\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"1037.0\" y=\"108.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"600\" >读 heap page<\/text><line x1=\"1144\" y1=\"104\" x2=\"1152.4\" y2=\"104\" stroke=\"#BE653B\" stroke-width=\"1.7\"/><polygon points=\"1158,104 1151,100.15 1151,107.85\" fill=\"#BE653B\"/><rect x=\"1160\" y=\"76\" width=\"210\" height=\"56\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"1265.0\" y=\"108.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"600\" >处理 tuple<\/text><text x=\"20\" y=\"158\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >同一时刻只有一个请求在飞；随机访问一多，CPU 就在等 I/O<\/text><rect x=\"20\" y=\"180\" width=\"1360\" height=\"48\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.0\" /><text x=\"36\" y=\"210\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#2F7A66\" font-weight=\"700\" >改进方向 · 批量与交错：让 I/O 请求与 CPU 执行重叠<\/text><rect x=\"20\" y=\"236\" width=\"330\" height=\"76\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"36\" y=\"266\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#2F7A66\" font-weight=\"700\" >Bitmap Scan<\/text><text x=\"36\" y=\"292\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >先批量收集 TID，再按 page 访问<\/text><line x1=\"352\" y1=\"274\" x2=\"362.4\" y2=\"274\" stroke=\"#2F7A66\" stroke-width=\"1.8\"/><polygon points=\"368,274 361,270.15 361,277.85\" fill=\"#2F7A66\"/><rect x=\"370\" y=\"236\" width=\"330\" height=\"76\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"386\" y=\"266\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#2F7A66\" font-weight=\"700\" >向量化 fetch<\/text><text x=\"386\" y=\"292\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >先收集 row_id，再批量取列<\/text><line x1=\"702\" y1=\"274\" x2=\"712.4\" y2=\"274\" stroke=\"#2F7A66\" stroke-width=\"1.8\"/><polygon points=\"718,274 711,270.15 711,277.85\" fill=\"#2F7A66\"/><rect x=\"720\" y=\"236\" width=\"330\" height=\"76\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"736\" y=\"266\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#2F7A66\" font-weight=\"700\" >异步 prefetch<\/text><text x=\"736\" y=\"292\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >执行器把 I/O 与 CPU 交错起来<\/text><line x1=\"1052\" y1=\"274\" x2=\"1062.4\" y2=\"274\" stroke=\"#2F7A66\" stroke-width=\"1.8\"/><polygon points=\"1068,274 1061,270.15 1061,277.85\" fill=\"#2F7A66\"/><rect x=\"1070\" y=\"236\" width=\"330\" height=\"76\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"1086\" y=\"266\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#2F7A66\" font-weight=\"700\" >SSD 队列深度<\/text><text x=\"1086\" y=\"292\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >存储层并发能力被真正用起来<\/text><rect x=\"20\" y=\"336\" width=\"1360\" height=\"78\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#F1EFE9\" stroke-width=\"1.0\" /><text x=\"38\" y=\"380.95\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"600\" >落到本文<\/text><text x=\"242\" y=\"379.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >PostgreSQL 提供 bitmap / index-only / 成本模型与 AM 接口；DuckDB 在 ART 命中后批量 row_id fetch，超阈值回到高吞吐 table scan<\/text><\/svg>", "ctrl": null}, {"eyebrow": "19 · 实验与排查", "title": "用 EXPLAIN 把机制验出来", "lede": "不伪造执行输出：在本地跑 EXPLAIN (ANALYZE, BUFFERS)，按清单逐项核对。", "caption": "实验 SQL 与排查顺序来自原文；SET enable_seqscan = off 等只适合实验，不适合生产调优。", "bridge": "最后把整条推演收成三句话。", "notes": ["原文给了两套可直接跑的实验。PostgreSQL 那边建一张百万行的表，建 (customer_id, created_at DESC) 和 status 两个索引，ANALYZE 之后分别看点查、排序加 LIMIT、以及高选择率的 status 过滤。这里不编造任何执行输出，请在你自己的实例上看 EXPLAIN (ANALYZE, BUFFERS) 的真实结果。", "重点看五件事：有没有出现 Index Scan using；Index Cond 和 Filter 分别是什么；Buffers 的 shared hit/read 有没有显示大量随机读；Rows Removed by Filter 是不是说明索引只解决了一部分条件；以及第三个查询会不会因为选择率太高而不走普通 index scan。DuckDB 那边同理，用 EXPLAIN ANALYZE 找计划里有没有 Index Scan。", "想强制看 planner 边界可以临时关掉 enable_seqscan、enable_bitmapscan，或调 index_scan_max_count，但这些只用于理解机制。生产里该做的是修正统计信息、索引设计和 SQL 形态。右边这十条 checklist，就是排查时的顺序。"], "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20\" y=\"10\" width=\"660\" height=\"38\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"36\" y=\"35\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" >实验观察 · 不伪造执行输出<\/text><rect x=\"700\" y=\"10\" width=\"680\" height=\"38\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.0\" /><text x=\"716\" y=\"35\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#AE8A3E\" font-weight=\"700\" >DBA 排查 checklist（原文 10 条）<\/text><rect x=\"20\" y=\"58\" width=\"660\" height=\"170\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"36\" y=\"86\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"600\" >EXPLAIN (ANALYZE, BUFFERS)<\/text><text x=\"36\" y=\"116\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" xml:space=\"preserve\">SELECT * FROM demo_index_scan WHERE id = 42;<\/text><text x=\"36\" y=\"142\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" xml:space=\"preserve\">SELECT * ... WHERE customer_id = 42 ORDER BY ... LIMIT 10;<\/text><text x=\"36\" y=\"168\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" xml:space=\"preserve\">SELECT * FROM demo_index_scan WHERE status = &#x27;paid&#x27;;<\/text><text x=\"36\" y=\"194\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" xml:space=\"preserve\">DuckDB: EXPLAIN ANALYZE ... WHERE id = 42;<\/text><rect x=\"20\" y=\"246\" width=\"12\" height=\"12\" rx=\"2\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"42\" y=\"257\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >Index Scan using ... 是否出现<\/text><rect x=\"20\" y=\"278\" width=\"12\" height=\"12\" rx=\"2\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"42\" y=\"289\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >Index Cond 与 Filter 分别是什么<\/text><rect x=\"20\" y=\"310\" width=\"12\" height=\"12\" rx=\"2\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"42\" y=\"321\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >Buffers: shared hit/read 是否显示大量随机读<\/text><rect x=\"20\" y=\"342\" width=\"12\" height=\"12\" rx=\"2\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"42\" y=\"353\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >Rows Removed by Filter 是否说明索引只解决部分条件<\/text><rect x=\"20\" y=\"374\" width=\"12\" height=\"12\" rx=\"2\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"42\" y=\"385\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >第三个查询是否因选择率太高而不一定走普通 index scan<\/text><rect x=\"700\" y=\"58\" width=\"330\" height=\"58\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"714\" y=\"82\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"700\" >01<\/text><text x=\"714\" y=\"103\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >估算行数 vs 实际行数<\/text><rect x=\"700\" y=\"124\" width=\"330\" height=\"58\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"714\" y=\"148\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"700\" >02<\/text><text x=\"714\" y=\"169\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >Index Cond 是否缩小候选集<\/text><rect x=\"700\" y=\"190\" width=\"330\" height=\"58\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"714\" y=\"214\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"700\" >03<\/text><text x=\"714\" y=\"235\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >Filter 是否移除大量行<\/text><rect x=\"700\" y=\"256\" width=\"330\" height=\"58\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"714\" y=\"280\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"700\" >04<\/text><text x=\"714\" y=\"301\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >是否大量 heap buffer read<\/text><rect x=\"700\" y=\"322\" width=\"330\" height=\"58\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"714\" y=\"346\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"700\" >05<\/text><text x=\"714\" y=\"367\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >ORDER BY / LIMIT 是否选了索引顺序<\/text><rect x=\"1045\" y=\"58\" width=\"330\" height=\"58\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"1059\" y=\"82\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"700\" >06<\/text><text x=\"1059\" y=\"103\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >是否应该是 bitmap scan<\/text><rect x=\"1045\" y=\"124\" width=\"330\" height=\"58\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"1059\" y=\"148\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"700\" >07<\/text><text x=\"1059\" y=\"169\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >表 / 索引膨胀、统计信息过旧<\/text><rect x=\"1045\" y=\"190\" width=\"330\" height=\"58\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"1059\" y=\"214\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"700\" >08<\/text><text x=\"1059\" y=\"235\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >index-only 是否因 VM 不足回表<\/text><rect x=\"1045\" y=\"256\" width=\"330\" height=\"58\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"1059\" y=\"280\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"700\" >09<\/text><text x=\"1059\" y=\"301\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >复合索引列序是否匹配真实查询<\/text><rect x=\"1045\" y=\"322\" width=\"330\" height=\"58\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"1059\" y=\"346\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"700\" >10<\/text><text x=\"1059\" y=\"367\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >DuckDB 候选 row_id 是否超过阈值<\/text><text x=\"700\" y=\"396\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >生产应修正统计信息、索引设计与 SQL 形态，而非长期关闭某类计划。<\/text><\/svg>", "ctrl": null}, {"eyebrow": "20 · 小结", "title": "三件事，才是基本功", "lede": "索引结构找到候选 → 执行器把候选变成可见行 → 代价模型决定有时宁愿顺序扫表。", "caption": "结语不引入新结论：整篇推演收敛到「候选集能否缩到值得回表的规模」。", "bridge": "谢谢。把 EXPLAIN 打开，从下一声慢查询开始验证。", "notes": ["收一下。第一件事，索引结构怎么找到候选项：PostgreSQL 的 B-tree 先下探到 leaf page、二分定位、再沿页推进；DuckDB 的 ART 用自适应节点和路径压缩，把常量边界的点查与极小范围圈出来。", "第二件事，执行器怎么把候选项变成可见行：PG 是 TID 到 heap tuple，中间要过 MVCC 可见性、HOT 链、recheck 和 qpqual；DuckDB 是 row_id 集合到向量化 DataChunk，按 STANDARD_VECTOR_SIZE 批量 fetch。", "第三件事，代价模型为什么有时宁愿顺序扫表：选择率、相关性、heap page 数、qpqual 的 CPU、能不能免排序，全都要进账。三件事合起来，才是 index scan 的基本功。换句话说，索引不是终点，候选集才是。"], "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20\" y=\"20\" width=\"1360\" height=\"100\" rx=\"3\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.0\" /><text x=\"48\" y=\"62\" class=\"sv serif\" text-anchor=\"start\" font-size=\"24.0\" fill=\"#FFFFFF\" font-weight=\"700\" >① 索引结构如何找到候选项<\/text><text x=\"48\" y=\"96\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"400\" >B-tree 下探与 leaf 推进 / ART 自适应节点与常量边界<\/text><rect x=\"20\" y=\"138\" width=\"1360\" height=\"100\" rx=\"3\" fill=\"#A4C4C6\" stroke=\"#A4C4C6\" stroke-width=\"1.0\" /><text x=\"48\" y=\"180\" class=\"sv serif\" text-anchor=\"start\" font-size=\"24.0\" fill=\"#1B2B33\" font-weight=\"700\" >② 执行器如何把候选项变成可见行<\/text><text x=\"48\" y=\"214\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\" >TID → heap tuple → MVCC / row_id → 向量化 DataChunk<\/text><rect x=\"20\" y=\"256\" width=\"1360\" height=\"100\" rx=\"3\" fill=\"#EBF1EE\" stroke=\"#EBF1EE\" stroke-width=\"1.0\" /><text x=\"48\" y=\"298\" class=\"sv serif\" text-anchor=\"start\" font-size=\"24.0\" fill=\"#1B2B33\" font-weight=\"700\" >③ 代价模型为什么有时宁愿顺序扫表<\/text><text x=\"48\" y=\"332\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\" >选择率、相关性、heap page、qpqual、pathkeys 的成本竞争<\/text><rect x=\"20\" y=\"380\" width=\"1360\" height=\"44\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"38\" y=\"407.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#BE653B\" font-weight=\"600\" >一句话<\/text><text x=\"212\" y=\"406.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"400\" >index scan 的本质不是「索引快」，而是「候选行能否缩到值得回表的规模」<\/text><\/svg>", "ctrl": null}];
const N = D.length;
let cur = 0, autoTimer = null, autoOn = false, mode = '';
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function fit(){
  const vp = $('#viewport');
  const W = vp.clientWidth, H = vp.clientHeight;
  const open = document.body.classList.contains('notes-open');
  const pw = open ? $('#notesPanel').getBoundingClientRect().width : 0;
  const avail = Math.max(320, W - pw);
  const s = Math.min((avail - 24)/1600, (H - 14)/900);
  const st = $('#stage');
  st.style.transform = 'scale(' + s + ')';
  st.style.left = ((avail - 1600*s)/2) + 'px';
  st.style.top  = ((H - 900*s)/2) + 'px';
}
window.addEventListener('resize', fit);

function render(){
  $('#slides').innerHTML = D.map((d,i) =>
    '<section class="slide" id="s'+i+'">'
    + '<div class="eyebrow"><span class="num">'+String(i+1).padStart(2,'0')+' / '+String(N).padStart(2,'0')+'</span>'+d.eyebrow+'</div>'
    + '<h1 class="title">'+d.title+'</h1>'
    + '<div class="lede">'+d.lede+'</div>'
    + '<div class="rule"></div>'
    + '<div class="figwrap">'+d.svg+'</div>'
    + (d.ctrl ? '<div class="outbar" id="ob'+i+'"></div>'
              : '<div class="caption">'+d.caption+'</div>')
    + (d.ctrl ? '<div class="ctrls" data-i="'+i+'">'+d.ctrl+'</div>' : '')
    + '<div class="bridge"><span class="bk">承接 · NEXT</span>'+d.bridge+'</div>'
    + '<div class="footer"><div class="fbar"><i id="fbar'+i+'"></i></div>'
    + '<span class="fl">数据库筑基课 · 数据扫描方法 index scan</span>'
    + '<span class="fr">'+String(i+1).padStart(2,'0')+' / '+String(N).padStart(2,'0')+'</span></div>'
    + '</section>').join('');
  /* 动画页：把动态输出移到图注整行，保证结论不被控件挤掉 */
  $$('.ctrls').forEach(c=>{
    const out=c.querySelector('.out');
    const bar=$('#ob'+c.getAttribute('data-i'));
    if(out && bar) bar.appendChild(out);
  });
}

function go(i, silent){
  i = Math.max(0, Math.min(N-1, i));
  $$('.slide').forEach((el,k)=>el.classList.toggle('on', k===i));
  cur = i;
  try{ localStorage.setItem('idxscan-slide', String(i)); }catch(e){}
  $('.pg').textContent = String(i+1).padStart(2,'0') + ' / ' + String(N).padStart(2,'0');
  $('#track i').style.width = ((i+1)/N*100)+'%';
  for(let k=0;k<N;k++){ const b=$('#fbar'+k); if(b) b.style.width = (k<=i?100:0)+'%'; }
  if(document.body.classList.contains('notes-open')) syncNotes(true);
  if(!silent) toast(D[i].eyebrow + ' · ' + D[i].title.replace(/<[^>]+>/g,''));
}
function next(){ if(cur<N-1) go(cur+1); else stopAuto(); }
function prev(){ if(cur>0) go(cur-1); }

function toast(s){
  const t=$('#toast'); t.textContent=s; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1700);
}
function stopAuto(){
  autoOn=false; clearInterval(autoTimer); autoTimer=null;
  $('#btnAuto').innerHTML='▶ 自动播放<kbd>P</kbd>'; $('#btnAuto').classList.remove('act');
}
function toggleAuto(){
  if(autoOn){ stopAuto(); toast('已暂停自动播放'); return; }
  autoOn=true; $('#btnAuto').innerHTML='❚❚ 暂停<kbd>P</kbd>'; $('#btnAuto').classList.add('act');
  autoTimer=setInterval(()=>{ if(cur<N-1) go(cur+1,true); else stopAuto(); }, 12000);
  toast('自动播放：每 12 秒一页');
}

/* ---------- 右侧页内开窗：按一下显示，再按一下关闭 ---------- */
function sectionsHtml(){
  return D.map((d,i)=>'<section class="nsec" data-i="'+i+'">'
    + '<div class="sn">'+String(i+1).padStart(2,'0')+' · '+esc(d.eyebrow)+'</div>'
    + '<h3>'+esc(d.title.replace(/<[^>]+>/g,''))+'</h3>'
    + d.notes.map(p=>'<p>'+esc(p)+'</p>').join('')
    + '<div class="nx">承接下一页：'+esc(d.bridge)+'</div></section>').join('');
}
function panelTitle(){
  return {toc:['目录','PAGE INDEX'],one:['本页讲稿','CURRENT PAGE'],
          all:['全文讲稿','FULL SCRIPT'],help:['快捷键','KEYBOARD']}[mode] || ['讲稿','NOTES'];
}
function renderPanel(){
  const t = panelTitle();
  let inner = '<h2>'+t[0]+'</h2>';
  if(mode==='toc'){
    inner += '<p class="np-sub">点击任意一页跳转 · 共 '+N+' 页 · 开窗时画面等比缩到左侧</p>'
      + '<div class="np-grid">' + D.map((d,i)=>'<a data-j="'+i+'" onclick="jump('+i+')">'
        + '<span class="gn">'+String(i+1).padStart(2,'0')+'</span>'
        + '<span class="gt">'+esc(d.title.replace(/<[^>]+>/g,''))+'</span></a>').join('') + '</div>'
      + '<div class="np-note">按 G 再按一次关闭；按 N 切到本页讲稿，按 T 通读全文并自动定位到当前页。</div>';
  } else if(mode==='one' || mode==='all'){
    inner += '<p class="np-sub">'+(mode==='one' ? '只显示当前页 · 翻页时自动跟随' :
      '按顺序通读 · 打开时定位到当前页 · 翻页时联动滚动')+'</p>' + sectionsHtml();
  } else if(mode==='help'){
    inner += '<p class="np-sub">演说时的操作备忘 · 全屏后这些按键也显示在底部</p><div class="np-keys">'
      + '<div><kbd>→ / 空格</kbd>下一页</div><div><kbd>←</kbd>上一页</div>'
      + '<div><kbd>G</kbd>目录（再按关闭）</div><div><kbd>N</kbd>本页讲稿（再按关闭）</div>'
      + '<div><kbd>T</kbd>全文讲稿（再按关闭）</div><div><kbd>P</kbd>自动播放 / 暂停</div>'
      + '<div><kbd>F</kbd>全屏 / 退出全屏</div><div><kbd>1–9</kbd>直接跳页</div>'
      + '<div><kbd>Home / End</kbd>首页 / 末页</div><div><kbd>Esc</kbd>关闭开窗 / 退出全屏</div>'
      + '<div><kbd>? / H</kbd>本帮助</div><div><kbd>PageUp / PageDown</kbd>翻页</div></div>'
      + '<div class="np-note">动画页提供输入、播放/暂停、单步、重置；输入用于改变推演条件，不改变源码事实。</div>';
  }
  $('#npHead').innerHTML = '<span class="nt">'+t[0]+'</span><span class="nm">'+t[1]+'</span>'
    + '<button onclick="closePanel()">关闭 ✕</button>';
  $('#npBody').innerHTML = inner;
  document.body.classList.toggle('np-one', mode==='one');
}
function syncNotes(smooth){
  $$('.nsec').forEach((el,k)=>el.classList.toggle('cur', k===cur));
  $$('.np-grid a').forEach((el,k)=>el.classList.toggle('cur', k===cur));
  const body = $('#npBody');
  if(mode==='one'){ body.scrollTo({top:0,behavior:'auto'}); return; }
  if(mode==='all'){
    const sec = $('.nsec.cur'); if(!sec) return;
    const top = sec.getBoundingClientRect().top - body.getBoundingClientRect().top + body.scrollTop - 10;
    body.scrollTo({top:Math.max(0,top), behavior: smooth?'smooth':'auto'});
  }
  if(mode==='toc'){ body.scrollTo({top:0,behavior:'auto'}); }
}
function setMode(m){
  if(document.body.classList.contains('notes-open') && mode===m){ closePanel(); return; }
  mode = m;
  renderPanel();
  document.body.classList.add('notes-open');
  fit();
  syncNotes(false);
  toast(panelTitle()[0] + ' · 画面已缩至左侧');
}
function closePanel(){
  document.body.classList.remove('notes-open'); mode='';
  fit();
}
function jump(i){ go(i); syncNotes(true); }

/* ---------- 全屏：CSS 沉浸降级 + toast，底部按键常显 ---------- */
function fs(){
  const entering = !document.body.classList.contains('immersive');
  if(entering){
    document.body.classList.add('immersive');
    $('#btnFs').innerHTML='退出全屏<kbd>F</kbd>';
    fit();
    toast('全屏：底部按键常显 · F 或 Esc 退出');
    try{ const pr = document.documentElement.requestFullscreen
      ? document.documentElement.requestFullscreen() : null;
      if(pr && pr.catch) pr.catch(()=>{}); }catch(e){}
  }else{
    document.body.classList.remove('immersive');
    $('#btnFs').innerHTML='全屏<kbd>F</kbd>';
    fit(); toast('已退出全屏');
    try{ if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen(); }catch(e){}
  }
}
document.addEventListener('fullscreenchange', ()=>{
  if(!document.fullscreenElement && document.body.classList.contains('immersive')){
    document.body.classList.remove('immersive');
    const b=$('#btnFs'); if(b) b.innerHTML='全屏<kbd>F</kbd>';
  }
  fit();
});

document.addEventListener('keydown', e=>{
  const k=e.key, tag=(e.target.tagName||'').toLowerCase();
  const typing=(tag==='input'||tag==='select'||tag==='textarea'||e.target.isContentEditable);
  if(k==='Escape'){
    if(document.body.classList.contains('notes-open')) closePanel();
    else if(document.body.classList.contains('immersive')) fs();
    return;
  }
  if(typing) return;                 /* 动画输入控件内不劫持按键 */
  if(k==='ArrowRight'||k===' '||k==='PageDown'){ e.preventDefault(); next(); }
  else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); prev(); }
  else if(k==='f'||k==='F'){ e.preventDefault(); fs(); }
  else if(k==='g'||k==='G'){ e.preventDefault(); setMode('toc'); }
  else if(k==='n'||k==='N'){ e.preventDefault(); setMode('one'); }
  else if(k==='t'||k==='T'){ e.preventDefault(); setMode('all'); }
  else if(k==='p'||k==='P'){ e.preventDefault(); toggleAuto(); }
  else if(k==='?'||k==='h'||k==='H'){ e.preventDefault(); setMode('help'); }
  else if(k==='Home'){ e.preventDefault(); go(0); }
  else if(k==='End'){ e.preventDefault(); go(N-1); }
  else if(/^[1-9]$/.test(k)){ go(parseInt(k,10)-1); }
});

/* ---------- 动画 A：B-tree 导航（输入 + 播放/暂停 + 单步 + 重置） ---------- */
let btStep=6, btTimer=null, btPlaying=false;  /* 打开即见完整链路，播放时从头演示 */
const BT_MAX=6;
const BT_TXT=[
  '待开始 · 设定扫描起点后播放，观察从 root 到 leaf 的推进',
  '① _bt_search()：从 root / internal page 下探到 leaf page',
  '② _bt_binsrch()：在 leaf page 内二分定位起点',
  '③ _bt_first()：找到第一个满足 scan key 的 index item',
  '④ _bt_next()：在 leaf page 内顺序推进，逐个返回 TID',
  '⑤ 发生页面分裂时 _bt_moveright() 沿 right link 移到正确 page',
  '⑥ btgettuple()：把 TID 交给上层 executor（xs_recheck = false）'
];
function btOut(){
  const key = $('#btKey') ? $('#btKey').value.trim() : '42';
  const split = $('#btSplit') ? $('#btSplit').value : 'no';

  if(btStep===5) s = split==='yes'
    ? '⑤ 并发分裂：_bt_moveright() 沿 right link 移动，high key 与 page pin/lock 保证不走错方向'
    : '⑤ 本次无分裂：right link 仍在，但无需移动，继续在当前 leaf 内推进';

function btPaint(){
  $$('#animBt g[data-bt]').forEach(el=>{

    el.setAttribute('opacity', n<=btStep ? '1':'0.15');
  });
  $$('#animBt .btcur').forEach(el=>{
    const n=+el.getAttribute('data-bt');
    el.setAttribute('stroke', n===btStep ? '#BE653B':'#D9D5CB');
    el.setAttribute('stroke-width', n===btStep ? '2.4':'1.1');
  });
  const r=$('#btRange'); if(r) r.value=String(btStep);

function btPause(){
  btPlaying=false; clearInterval(btTimer); btTimer=null;
  const b=$('#btPlay'); if(b){ b.textContent='▶ 播放'; b.classList.remove('play'); }
}
function btPlay(){
  if(btPlaying){ btPause(); return; }
  if(btStep>=BT_MAX) btStep=0;
  btPlaying=true; const b=$('#btPlay'); b.textContent='❚❚ 暂停'; b.classList.add('play');
  btTimer=setInterval(()=>{ btStep++; btPaint(); if(btStep>=BT_MAX) btPause(); },950);
}
function btTick(){ if(btStep<BT_MAX){ btStep++; btPaint(); } }
function btReset(){ btPause(); btStep=0; btPaint(); }

/* ---------- 动画 B：cost_index() 因子推演（定性示意，非真实成本数值） ---------- */
let costStep=6, costTimer=null, costPlaying=false;
const COST_MAX=6;
const COST_TXT=[
  '待开始 · 选择候选占比与相关性，播放观察代价因子如何叠加',
  '① 索引 AM 自己的启动成本与总成本',
  '② indexSelectivity → 候选 tuple 数',
  '③ 候选数 + 表大小 + 缓存假设 → heap page 数',
  '④ 索引顺序与物理顺序的相关性 → 随机 / 顺序 I/O 插值',
  '⑤ qpqual 的 CPU 过滤成本',
  '⑥ all-visible 减少 heap fetch；并行性与 pathkeys 是否免排序'
];
function costVerdict(){
  const sel=$('#costSel')?$('#costSel').value:'low';
  const cor=$('#costCor')?$('#costCor').value:'high';
  const ord=$('#costOrd')?$('#costOrd').value:'no';
  let v;
  if(sel==='high' && cor==='low') v='候选多又散落各页 → 随机 heap fetch 被放大 → 倾向 seq scan / bitmap scan';
  else if(sel==='high') v='候选占比高 → 回表规模接近全表 → bitmap scan 或 seq scan 更可能';
  else if(cor==='low') v='候选少但分布散 → index scan 仍可选，随机 I/O 会抬高成本';
  else v='候选少且相对集中 → 倾向 index scan';
  if(ord==='yes') v += '；ORDER BY + LIMIT 命中索引顺序 → 免排序 + 早停，额外加成';
  return v;
}
function costPaint(){
  $$('#animCost g[data-cost]').forEach(el=>{
    const n=+el.getAttribute('data-cost');
    el.setAttribute('opacity', n<=costStep ? '1':'0.18');
  });
  $$('#animCost .costcur').forEach(el=>{
    const n=+el.getAttribute('data-cost');
    el.setAttribute('stroke', n===costStep ? '#BE653B':'#D9D5CB');
    el.setAttribute('stroke-width', n===costStep ? '2.3':'1.1');
  });
  const o=$('#costOut');
  if(o) o.innerHTML='<span class="obtag">定性推演</span>'
    +'<b>倾向判定：</b>'+esc(costVerdict())+'　｜　'+esc(COST_TXT[costStep]);
}
function costPause(){
  costPlaying=false; clearInterval(costTimer); costTimer=null;
  const b=$('#costPlay'); if(b){ b.textContent='▶ 播放'; b.classList.remove('play'); }
}
function costPlay(){
  if(costPlaying){ costPause(); return; }
  if(costStep>=COST_MAX) costStep=0;
  costPlaying=true; const b=$('#costPlay'); b.textContent='❚❚ 暂停'; b.classList.add('play');
  costTimer=setInterval(()=>{ costStep++; costPaint(); if(costStep>=COST_MAX) costPause(); },880);
}
function costTick(){ if(costStep<COST_MAX){ costStep++; costPaint(); } }
function costReset(){ costPause(); costStep=0; costPaint(); }

/* ---------- 动画 C：DuckDB 门槛与阈值回退 ---------- */
let ddStep=6, ddTimer=null, ddPlaying=false;
const DD_MAX=6;
function ddCalc(){
  const m=Math.max(0, Math.round(+($('#ddMatch')?$('#ddMatch').value:3000)||0));
  const total=Math.max(1, Math.round(+($('#ddTotal')?$('#ddTotal').value:1000000)||1));
  const th=Math.max(2048, Math.round(0.001*total));
  const got=Math.round(m*ddStep/DD_MAX);
  const gate=$('#ddGate')?$('#ddGate').value:'ok';
  return {m,total,th,got,gate};
}
function ddPaint(){
  const c=ddCalc();
  const ratio=Math.min(1, c.got/(c.th*1.25));
  const bar=$('#ddBar'); if(bar){ bar.setAttribute('width',(ratio*560).toFixed(1));
    bar.setAttribute('fill', c.got>c.th ? '#BE653B':'#245A6B'); }
  const cl=$('#ddCount'); if(cl) cl.textContent='已收集 row_id：'+c.got;
  const tl=$('#ddThLbl'); if(tl) tl.textContent='阈值 '+c.th+'（max(2048, 0.001 × '+c.total.toLocaleString()+'））';
  const gateBad = c.gate!=='ok';
  const over = c.got>c.th;
  let v;
  if(gateBad) v = c.gate==='multi'
    ? '门槛未满足：filter 集合不止一个 → TableScanInitGlobal() 直接回退普通 table scan'
    : '门槛未满足：filter 未命中单列 ART 索引列 → 直接回退普通 table scan';
  else if(ddStep===0) v = '门槛全部满足 · 播放后 ART::Scan() 开始收集 row_id';
  else if(over) v = '已收集 '+c.got+' 个 row_id，超过阈值 '+c.th+' → ART::Scan() 返回失败 → 回退普通 table scan';
  else if(ddStep>=DD_MAX) v = '共 '+c.m+' 个 row_id 未超阈值 → 进入 ART index scan，随后按 STANDARD_VECTOR_SIZE 批量 Fetch';
  else v = '已收集 '+c.got+' 个 row_id，未超阈值 '+c.th+' → 继续收集';
  const o=$('#ddOut'); if(o) o.innerHTML='<span class="obtag">教学推演</span>'
    +'<b>'+esc(v)+'</b>';
  $$('#animDd g[data-dd]').forEach(el=>{
    const n=+el.getAttribute('data-dd');
    el.setAttribute('opacity', n<=ddStep ? '1':'0.18');
  });
}
function ddPause(){
  ddPlaying=false; clearInterval(ddTimer); ddTimer=null;
  const b=$('#ddPlay'); if(b){ b.textContent='▶ 播放'; b.classList.remove('play'); }
}
function ddPlay(){
  if(ddPlaying){ ddPause(); return; }
  if(ddStep>=DD_MAX) ddStep=0;
  ddPlaying=true; const b=$('#ddPlay'); b.textContent='❚❚ 暂停'; b.classList.add('play');
  ddTimer=setInterval(()=>{ ddStep++; ddPaint(); if(ddStep>=DD_MAX) ddPause(); },820);
}
function ddTick(){ if(ddStep<DD_MAX){ ddStep++; ddPaint(); } }
function ddReset(){ ddPause(); ddStep=0; ddPaint(); }

function init(){
  render(); fit();
  let saved=0; try{ saved=parseInt(localStorage.getItem('idxscan-slide')||'0',10)||0; }catch(e){}
  go(saved,true);
  $('#btnPrev').onclick=prev; $('#btnNext').onclick=next;
  $('#btnToc').onclick=()=>setMode('toc'); $('#btnNotes').onclick=()=>setMode('one');
  $('#btnAll').onclick=()=>setMode('all'); $('#btnAuto').onclick=toggleAuto;
  $('#btnFs').onclick=fs; $('#btnHelp').onclick=()=>setMode('help');
  $('#npCloseZone').onclick=closePanel;
  window.jump = jump;
  btPaint(); costPaint(); ddPaint();
  ['btKey','btSplit','btRange','costSel','costCor','costOrd',
   'ddMatch','ddTotal','ddGate'].forEach(id=>{
    const el=$('#'+id); if(!el) return;
    el.addEventListener('input',()=>{
      if(id==='btKey'||id==='btSplit') btOut();
      if(id==='btRange'){ btStep=+el.value; btPaint(); }
      if(id.indexOf('cost')===0) costPaint();
      if(id.indexOf('dd')===0) ddPaint();
    });
    el.addEventListener('change',()=>{ btOut(); costPaint(); ddPaint(); });
  });
  const bind=(id,fn)=>{ const el=$(id); if(el) el.onclick=fn; };
  bind('#btPlay',btPlay); bind('#btTick',btTick); bind('#btReset',btReset);
  bind('#costPlay',costPlay); bind('#costTick',costTick); bind('#costReset',costReset);
  bind('#ddPlay',ddPlay); bind('#ddTick',ddTick); bind('#ddReset',ddReset);
}
document.addEventListener('DOMContentLoaded', init);

</script>
