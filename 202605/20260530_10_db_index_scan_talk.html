<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数据库筑基课 · 数据扫描方法 index scan</title>
<style>
:root{
  --bg:#F7F6F2; --ink:#1B2B33; --ink2:#46585F; --muted:#89938F; --line:#D9D5CB;
  --primary:#245A6B; --prim-l:#E5EFF0; --accent:#BE653B; --acc-l:#F7E9DE;
  --green:#2F7A66; --green-l:#E4F0EA; --gold:#AE8A3E; --gold-l:#F5EDDC;
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#E9E7E1}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
#viewport{position:absolute;inset:0 0 58px 0;overflow:hidden}
#stage{position:absolute;width:1600px;height:900px;background:var(--bg);
  transform-origin:top left;box-shadow:0 18px 60px rgba(27,43,51,.13);
  transition:transform .36s cubic-bezier(.2,.7,.2,1),left .36s cubic-bezier(.2,.7,.2,1),
             top .36s cubic-bezier(.2,.7,.2,1)}
.slide{position:absolute;inset:0;display:none}
.slide.on{display:block;animation:fadein .40s cubic-bezier(.2,.7,.2,1)}
@keyframes fadein{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.eyebrow{position:absolute;left:64px;top:44px;font-size:13px;letter-spacing:3.4px;
  color:var(--primary);font-weight:600}
.eyebrow .num{font-family:var(--mono);letter-spacing:1px;color:var(--accent);margin-right:14px}
h1.title{position:absolute;left:64px;top:70px;margin:0;font-family:var(--serif);
  font-size:44px;line-height:1.25;font-weight:700;letter-spacing:1.2px;color:var(--ink)}
.lede{position:absolute;left:64px;top:139px;width:1440px;font-size:19px;color:var(--ink2);
  line-height:1.5;letter-spacing:.3px}
.rule{position:absolute;left:64px;top:181px;width:1472px;height:1px;background:var(--line)}
.figwrap{position:absolute;left:100px;top:198px;width:1400px;height:430px}
svg.figure{display:block;overflow:visible}
svg.figure text{font-family:var(--sans)}
svg.figure text.serif{font-family:var(--serif)}
svg.figure text.mono{font-family:var(--mono)}
.caption{position:absolute;left:100px;top:636px;width:1400px;font-size:13px;
  color:var(--muted);letter-spacing:.4px;line-height:1.35;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.outbar{position:absolute;left:100px;top:636px;width:1400px;font-size:13px;
  color:var(--ink2);letter-spacing:.3px;line-height:1.35;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.outbar .out{display:inline;font-size:13px;white-space:nowrap}
.outbar b{color:var(--accent);font-weight:600}
.outbar .obtag{font-family:var(--mono);font-size:11px;color:var(--muted);
  border:1px solid var(--line);border-radius:3px;padding:2px 6px;margin-right:8px;background:#fff}
.bridge{position:absolute;left:64px;top:706px;width:1472px;font-size:20px;
  color:var(--accent);line-height:1.55;letter-spacing:.4px;padding-left:18px;
  border-left:3px solid var(--accent);font-family:var(--serif)}
.bridge .bk{font-family:var(--sans);font-size:13px;color:var(--muted);
  letter-spacing:2px;display:block;margin-bottom:2px}
.footer{position:absolute;left:64px;top:846px;width:1472px;height:1px;background:var(--line)}
.footer .fl{position:absolute;left:0;top:14px;font-size:12.5px;color:var(--muted);letter-spacing:2px}
.footer .fr{position:absolute;right:0;top:12px;font-family:var(--mono);font-size:14px;color:var(--ink2)}
.footer .fbar{position:absolute;left:0;right:0;top:-1px;height:2px;background:transparent}
.footer .fbar i{display:block;height:2px;background:var(--primary);width:0;transition:width .4s ease}

/* 动画页控件：独立条带，位于图注下方，绝不覆盖图 */
.ctrls{position:absolute;left:100px;top:662px;width:1400px;height:38px;display:flex;
  align-items:center;gap:9px;white-space:nowrap}
.ctrls label{font-size:13px;color:var(--ink2)}
.ctrls select,.ctrls input[type=text],.ctrls input[type=number]{font-family:var(--sans);
  font-size:13px;color:var(--ink);background:#fff;border:1px solid var(--line);
  border-radius:4px;padding:4px 7px;outline:none;height:30px}
.ctrls input[type=number]{width:96px}
.ctrls input[type=text]{width:82px}
.ctrls input[type=range]{width:120px;accent-color:var(--primary);border:none;background:transparent}
.ctrls .btn{min-height:30px;padding:4px 12px;border:1px solid var(--primary);border-radius:4px;
  background:#fff;color:var(--primary);font-size:13px;cursor:pointer;font-family:var(--sans)}
.ctrls .btn.play{background:var(--primary);color:#fff}
.ctrls .btn:hover{filter:brightness(.94)}
.ctrls .out{font-size:13px;color:var(--ink2);margin-left:auto;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis}
.ctrls .out b{color:var(--accent);font-weight:600}

/* 右侧页内开窗（非弹窗）：目录 / 本页讲稿 / 全文讲稿 / 帮助 */
#notesPanel{position:fixed;top:0;bottom:58px;right:0;width:min(560px,38vw);
  background:#FCFBF8;border-left:1px solid var(--line);z-index:38;
  transform:translateX(101%);transition:transform .36s cubic-bezier(.2,.7,.2,1);
  display:flex;flex-direction:column;box-shadow:-16px 0 42px rgba(27,43,51,.10)}
body.notes-open #notesPanel{transform:none}
.np-head{flex:none;height:62px;display:flex;align-items:center;gap:12px;padding:0 22px;
  border-bottom:1px solid var(--line);background:var(--bg)}
.np-head .nt{font-family:var(--serif);font-size:21px;color:var(--ink);font-weight:700}
.np-head .nm{font-family:var(--mono);font-size:11.5px;letter-spacing:1px;color:var(--accent);
  border:1px solid var(--line);border-radius:3px;padding:3px 7px;background:#fff}
.np-head button{margin-left:auto;background:#fff;border:1px solid var(--line);border-radius:4px;
  padding:6px 11px;font-size:13px;cursor:pointer;color:var(--ink2);font-family:var(--sans)}
.np-head button:hover{background:var(--prim-l);color:var(--primary)}
.np-body{flex:1;overflow-y:auto;padding:20px 24px 40px}
.np-body h2{margin:2px 0 6px;font-family:var(--serif);font-size:26px;color:var(--ink)}
.np-sub{font-size:13px;color:var(--muted);letter-spacing:1px;margin:0 0 18px}
.nsec{border-top:1px solid var(--line);padding:16px 10px 18px;margin:0 -10px}
.nsec:first-of-type{border-top:none}
.nsec.cur{background:var(--prim-l);border-left:3px solid var(--primary);
  padding-left:14px;border-radius:0 4px 4px 0}
.nsec .sn{font-family:var(--mono);font-size:11.5px;color:var(--accent);letter-spacing:1px}
.nsec h3{margin:5px 0 9px;font-family:var(--serif);font-size:19px;color:var(--primary);line-height:1.4}
.nsec p{margin:0 0 9px;font-size:15px;line-height:1.95;color:var(--ink2);letter-spacing:.3px}
.nsec .nx{margin-top:10px;font-family:var(--serif);font-size:14.5px;color:var(--accent);
  line-height:1.7;background:var(--acc-l);padding:8px 12px;border-radius:4px}
body.np-one .nsec{display:none}
body.np-one .nsec.cur{display:block}
.np-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.np-grid a{display:block;padding:11px 12px;border:1px solid var(--line);border-radius:5px;
  background:#fff;text-decoration:none;color:var(--ink);cursor:pointer;transition:.18s}
.np-grid a:hover{border-color:var(--primary);background:var(--prim-l)}
.np-grid a.cur{border-color:var(--primary);background:var(--prim-l)}
.np-grid .gn{font-family:var(--mono);font-size:11.5px;color:var(--accent)}
.np-grid .gt{font-family:var(--serif);font-size:15px;line-height:1.4;display:block;margin-top:3px}
.np-keys{display:grid;grid-template-columns:1fr;gap:11px;font-size:15px;line-height:1.7;color:var(--ink2)}
.np-keys kbd{font-family:var(--mono);background:#fff;border:1px solid var(--line);
  border-bottom-width:2px;border-radius:4px;padding:2px 8px;color:var(--primary);margin-right:10px}
.np-note{font-size:13.5px;line-height:1.9;color:var(--ink2);background:var(--gold-l);
  border-left:3px solid var(--gold);padding:12px 14px;margin-top:18px}

/* 底部外壳：全屏时也常显，包含按键提示 */
.chrome{position:fixed;left:0;right:0;bottom:0;height:58px;background:#FCFBF8;
  border-top:1px solid var(--line);display:flex;align-items:center;gap:5px;
  padding:0 14px;z-index:45;font-size:13px;color:var(--ink2)}
.chrome button{font-family:var(--sans);font-size:12.5px;color:var(--ink2);background:transparent;
  border:1px solid transparent;border-radius:5px;padding:6px 9px;cursor:pointer;white-space:nowrap}
.chrome button:hover{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome button.act{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome kbd{font-family:var(--mono);font-size:11px;color:var(--accent);margin-left:3px}
.chrome .pg{font-family:var(--mono);font-size:13.5px;color:var(--ink);min-width:70px;text-align:center}
.chrome .track{flex:1;min-width:30px;height:3px;background:var(--line);border-radius:3px;margin:0 10px;position:relative}
.chrome .track i{position:absolute;left:0;top:0;height:3px;background:var(--primary);border-radius:3px;transition:width .35s}
.chrome .hint{font-size:11.5px;color:var(--muted);white-space:nowrap}
body.immersive .chrome{background:rgba(252,251,248,.97);border-top-color:var(--prim-m)}
.toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);background:var(--ink);
  color:#fff;font-size:13px;padding:9px 16px;border-radius:5px;opacity:0;transition:.3s;z-index:80;pointer-events:none}
.toast.on{opacity:1}
@media print{.chrome,#notesPanel,.toast{display:none!important}#viewport{position:static}
  #stage{position:static;transform:none!important;box-shadow:none}
  .slide{display:block!important;page-break-after:always;position:relative;height:900px}}
</style>
</head>
<body>
<div id="viewport"><div id="stage"><div id="slides"></div></div></div>
<aside id="notesPanel">
  <div class="np-head" id="npHead"><span class="nt">讲稿</span><span class="nm">NOTES</span>
    <button id="npCloseZone">关闭 ✕</button></div>
  <div class="np-body" id="npBody"></div>
</aside>
<div class="chrome">
  <button id="btnPrev">← 上一页</button>
  <button id="btnNext">下一页 →</button>
  <span class="pg" id="pg">01 / 01</span>
  <div class="track" id="track"><i></i></div>
  <button id="btnToc">目录<kbd>G</kbd></button>
  <button id="btnNotes">本页讲稿<kbd>N</kbd></button>
  <button id="btnAll">全文讲稿<kbd>T</kbd></button>
  <button id="btnAuto">▶ 自动播放<kbd>P</kbd></button>
  <button id="btnFs">全屏<kbd>F</kbd></button>
  <button id="btnHelp">帮助<kbd>?</kbd></button>
  <span class="hint">← → / 空格 翻页 · 1–9 跳页 · Esc 关闭</span>
</div>
<div class="toast" id="toast"></div>
<script>

const D = [{"eyebrow": "数据库筑基课 · 数据扫描方法", "title": "index scan：候选集决定一切", "lede": "从 PostgreSQL 的 B-tree 到 DuckDB 的 ART，顺着源码走一遍执行链路、代价模型与适用边界。", "caption": "地层剖面：一次查询从谓词出发逐层下探到可见行；越深的层越贴近存储与物理页面。", "bridge": "先算一笔账：把「读 N 行」换成「找 M 个候选」，到底省了什么。", "notes": ["先立一个坐标。上一篇讲 seq scan，是把表从头到尾读一遍的基线；这一篇讲 index scan，很多人第一反应是「有索引就快」，可这个印象几乎每年都会在生产上制造一次事故。", "今天不背结论，顺着源码往下走：索引到底给了执行器什么、执行器又拿它做了什么、优化器凭什么有时候宁可不用它。PostgreSQL 和 DuckDB 都讲，因为它们对同一件事给出了两种很不一样的工程答案。", "最后会落回一句朴素的话：索引不是终点，候选集才是。"], "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20\" y=\"12\" width=\"1360\" height=\"68\" rx=\"3\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.0\" /><text x=\"48\" y=\"41\" class=\"sv serif\" text-anchor=\"start\" font-size=\"21.0\" fill=\"#FFFFFF\" font-weight=\"700\" >SQL 谓词<\/text><text x=\"48\" y=\"66\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#FFFFFF\" font-weight=\"400\" >WHERE id = 42 · ORDER BY created_at · LIMIT 20<\/text><text x=\"1348\" y=\"46\" class=\"sv mono\" text-anchor=\"end\" font-size=\"13.0\" fill=\"#FFFFFF\" font-weight=\"400\" >L1<\/text><rect x=\"20\" y=\"92\" width=\"1360\" height=\"68\" rx=\"3\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1.0\" /><text x=\"48\" y=\"121\" class=\"sv serif\" text-anchor=\"start\" font-size=\"21.0\" fill=\"#FFFFFF\" font-weight=\"700\" >Planner<\/text><text x=\"48\" y=\"146\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#FFFFFF\" font-weight=\"400\" >构造 IndexPath、cost_index() 估算、生成 IndexScan 计划节点<\/text><text x=\"1348\" y=\"126\" class=\"sv mono\" text-anchor=\"end\" font-size=\"13.0\" fill=\"#FFFFFF\" font-weight=\"400\" >L2<\/text><rect x=\"20\" y=\"172\" width=\"1360\" height=\"68\" rx=\"3\" fill=\"#A4C4C6\" stroke=\"#A4C4C6\" stroke-width=\"1.0\" /><text x=\"48\" y=\"201\" class=\"sv serif\" text-anchor=\"start\" font-size=\"21.0\" fill=\"#1B2B33\" font-weight=\"700\" >索引结构<\/text><text x=\"48\" nchor=\"start\" font-size=\"16.0\" fill=\"#AE8A3E\" font-weight=\"600\" >成立条件<\/text><text x=\"282\" y=\"399.55\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >M 远小于 N，或索引顺序命中 ORDER BY / LIMIT；否则回表成本会吃掉收益<\/text><\/svg>", "ctrl": null}, {"eyebrow": "02 · 先破一个误解", "title": "普通 index scan 仍要回表", "lede": "索引访问方法只回答「哪些 TID 可能满足条件」；可见行由表访问一层层判定出来。", "caption": "PostgreSQL indexam.sgml：索引 AM 返回匹配扫描键的 TID，父表 tuple 获取与可见性检查由核心系统处理。", "bridge": "既然回表躲不掉，那「用索引」这一族计划就得先分清楚边界。", "notes": ["最常见的误解就是「index scan 只读索引」。不是的。普通 index scan 里，索引访问方法只回答一个问题：哪些 TID 可能满足索引条件。TID 是地址，不是行。", "执行器拿到 TID，还得回到表或存储层：取非索引列、判断这一行对当前 snapshot 可不可见、HOT 链上有没有可见版本、lossy 条件要不要复核、qpqual 过不过、投影列能不能产生。indexam.sgml 把这条分工写得很直白：tuple 获取和可见性检查由核心系统处理。", "只有 index-only scan 的前提都满足——查询列被索引覆盖、visibility map 能证明页面 all-visible——才可能省掉大部分表访问。注意是「大部分」，不是「永远不回表」。"], "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20\" y=\"30\" width=\"200\" height=\"96\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"120.0\" y=\"71.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"600\" >SQL 谓词<\/text><text x=\"120.0\" y=\"93.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >WHERE / ORDER BY<\/text><line x1=\"222\" y1=\"78\" x2=\"244.4\" y2=\"78\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"250,78 243,74.15 243,81.85\" fill=\"#245A6B\"/><rect x=\"252\" y=\"30\" width=\"200\" height=\"96\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"352.0\" y=\"71.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"600\" >索引 AM<\/text><text x=\"352.0\" y=\"93.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >定位候选 TID<\/text><line x1=\"454\" y1=\"78\" x2=\"476.4\" y2=\"78\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"482,78 475,74.15 475,81.85\" fill=\"#245A6B\"/><rect x=\"484\" y=\"30\" width=\"200\" height=\"96\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"584.0\" y=\"71.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"600\" >候选 TID<\/text><text x=\"584.0\" y=\"93.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >可能满足的地址<\/text><line x1=\"686\" y1=\"78\" x2=\"708.4\" y2=\"78\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"714,78 707,74.15 707,81.85\" fill=\"#245A6B\"/><rect x=\"716\" y=\"30\" width=\"200\" height=\"96\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.1\" /><text x=\"816.0\" y=\"71.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"600\" >表访问<\/text><text x=\"816.0\" y=\"93.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >heap fetch / 列 fetch<\/text><line x1=\"918\" y1=\"78\" x2=\"940.4\" y2=\"78\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"946,78 939,74.15 939,81.85\" fill=\"#245A6B\"/><rect x=\"948\" y=\"30\" width=\"200\" height=\"96\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.1\" /><text x=\"1048.0\" y=\"71.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"600\" >可见性<\/text><text x=\"1048.0\" y=\"93.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >MVCC snapshot / HOT<\/text><line x1=\"1150\" y1=\"78\" x2=\"1172.4\" y2=\"78\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"1178,78 1171,74.15 1171,81.85\" fill=\"#245A6B\"/><rect x=\"1180\" y=\"30\" width=\"200\" height=\"96\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"1280.0\" y=\"71.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"600\" >剩余过滤<\/text><text x=\"1280.0\" y=\"93.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >qpqual + 投影列<\/text><rect x=\"20\" y=\"158\" width=\"1360\" height=\"62\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"38\" y=\"194.95\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"600\" >索引只回答<\/text><text x=\"302\" y=\"193.725\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >哪些 TID 可能满足索引条件？——这是候选集，不是结果集<\/text><rect x=\"20\" y=\"232\" width=\"1360\" height=\"62\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"38\" y=\"268.95\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#BE653B\" font-weight=\"600\" >表访问才回答<\/text><text x=\"302\" y=\"267.725\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >这一行对当前 snapshot 可见吗？HOT 链、lossy 复核、qpqual、投影列都在这里决定<\/text><rect x=\"20\" y=\"306\" width=\"1360\" height=\"62\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1.0\" /><text x=\"38\" y=\"342.95\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#2F7A66\" font-weight=\"600\" >唯一例外<\/text><text x=\"302\" y=\"341.55\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >index-only scan：查询列被索引覆盖，且 visibility map 证明页面 all-visible，才能省掉大部分 heap fetch<\/text><text x=\"20\" y=\"396\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >条件严格：visibility map 未命中时，即便列都在索引里，也可能访问 heap 做可见性检查。<\/text><\/svg>", "ctrl": null}, {"eyebrow": "03 · 划清边界", "title": "五种扫描，不是一回事", "lede": "把「用了索引」拆成具体动作：谁产出候选、按什么顺序访问表、谁承担回表成本。", "caption": "横轴为候选行占比的定性示意，不是统计数字；DuckDB ART 属于另一套规则体系里的分支。", "bridge": "边界划清后，我们进 PostgreSQL 内部，看这条路怎么被接起来。", "notes": ["先把名字拆开。Seq Scan 顺序读表，吞吐高但跳不过无关行；Index Scan 由索引给 TID、再逐个回表，吃低选择率也能吃索引顺序；Bitmap Scan 先把 TID 批量收成位图、按页访问表，牺牲索引顺序换更少的随机 I/O；Index-only Scan 条件最严，要覆盖列加可见性图。", "DuckDB 的 ART index scan 名字像，位置却完全不同：它不是一条独立的计划路径，而是 table scan 初始化时的一个选择性分支。", "横轴只是定性示意，不是任何统计数字。真正的判据是三件事：候选集多大、回表是随机还是顺序、查询对顺序有没有要求。"], "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><line x1=\"200\" y1=\"30\" x2=\"1362.8\" y2=\"30\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><polygon points=\"1370,30 1361,25.05 1361,34.95\" fill=\"#245A6B\"/><text x=\"20\" y=\"36\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"600\" >候选行占比：低 → 高<\/text><rect x=\"200\" y=\"48\" width=\"330\" height=\"94\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"216\" y=\"78\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#245A6B\" font-weight=\"700\" >Index Scan<\/text><text x=\"216\" y=\"104\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >索引返回 TID，逐个回表取行<\/text><text x=\"216\" y=\"130\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >低选择率；还能利用索引顺序<\/text><rect x=\"540\" y=\"48\" width=\"330\" height=\"94\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.1\" /><text x=\"556\" y=\"78\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#AE8A3E\" font-weight=\"700\" >Bitmap Scan<\/text><text x=\"556\" y=\"104\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >先批量生成 TID 位图，再按页访问表<\/text><text x=\"556\" y=\"130\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >中等选择率；失去索引顺序<\/text><rect x=\"880\" y=\"48\" width=\"500\" height=\"94\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"896\" y=\"78\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#1B2B33\" font-weight=\"700\" >Seq Scan<\/text><text x=\"896\" y=\"104\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >顺序读表，吞吐高，适合大比例数据<\/text><text x=\"896\" y=\"130\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >不能跳过无关行<\/text><rect x=\"20\" y=\"158\" width=\"1360\" height=\"62\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1.0\" /><text x=\"38\" y=\"194.95\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#2F7A66\" font-weight=\"600\" >Index-only Scan<\/text><text x=\"342\" y=\"193.55\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >覆盖查询 + visibility map 命中时极快；条件严格，仍可能访问 heap<\/text><rect x=\"20\" y=\"232\" width=\"1360\" height=\"62\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"38\" y=\"268.95\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#BE653B\" font-weight=\"600\" >DuckDB ART Index Scan<\/text><text x=\"342\" y=\"267.55\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >table scan 初始化中的选择性分支：单 filter、单列 ART、row_id 数低于阈值才进入<\/text><rect x=\"20\" y=\"318\" width=\"440\" height=\"96\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"36\" y=\"348\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"700\" >判据一 · 选择率<\/text><text x=\"36\" y=\"374\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >候选集到底能缩到多小<\/text><text x=\"36\" y=\"400\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >决定要不要走索引<\/text><rect x=\"480\" y=\"318\" width=\"440\" height=\"96\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"496\" y=\"348\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"700\" >判据二 · 相关性<\/text><text d 和 Filter。", "所以一句话：Index Cond 负责把候选集缩小，Filter 负责最终语义正确。优化器不能因为「走了索引」就把所有过滤都省掉，看计划时这两行、实际行数和 buffer 得一起看。"], "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20\" y=\"20\" width=\"560\" height=\"150\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"36\" y=\"48\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"600\" >EXPLAIN 片段<\/text><text x=\"36\" y=\"78\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"400\" xml:space=\"preserve\">Index Cond: (id = 42)<\/text><text x=\"36\" y=\"108\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"400\" xml:space=\"preserve\">Filter: (status = &#x27;active&#x27;)<\/text><rect x=\"610\" y=\"20\" width=\"770\" height=\"70\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"628\" y=\"60.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" >indexqual<\/text><text x=\"832\" y=\"59.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >交给索引 AM 定位候选项：id = 42、ts &gt;= ...<\/text><rect x=\"610\" y=\"100\" width=\"770\" height=\"70\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"628\" y=\"140.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#BE653B\" font-weight=\"600\" >qpqual<\/text><text x=\"832\" y=\"139.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >取出行后仍要检查：表达式、lossy 条件、无法完全下推的过滤<\/text><rect x=\"610\" y=\"180\" width=\"770\" height=\"70\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#F1EFE9\" stroke-width=\"1.0\" /><text x=\"628\" y=\"220.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"600\" >为什么拆<\/text><text x=\"832\" y=\"219.375\" class=\"sv s\" \"12.5\" fill=\"#46585F\" font-weight=\"400\" >可见行（MVCC + qpqual）<\/text><text x=\"20\" y=\"396\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >Index Cond 负责缩小候选集，Filter 负责最终语义正确性；看 EXPLAIN 必须同时看两者与实际行数。<\/text><\/svg>", "ctrl": null}, {"eyebrow": "07 · executor 的判定链", "title": "一个 TID 要过五道关", "lede": "index_getnext_slot() 的简化循环里，索引只给候选；可见性、复核与投影决定能否返回。", "caption": "B-tree 的 btgettuple() 设置 xs_recheck = false；通用框架仍为其他访问方法保留 recheck 逻辑。", "bridge": "候选 TID 从哪来？下一页沿 B-tree 的页面结构走一遍。", "notes": ["把源码压成四行伪代码，执行顺序就清楚了：索引访问方法先吐出一个 TID；index_fetch_heap() 按地址拿 heap tuple；这一 tuple 对当前 snapshot 可不可见、HOT 链上有没有可见版本，都要在这里判；如果是 lossy 条件，还得 recheck；最后 qpqual 通过、投影列能产生，才 return slot。", "这里有个容易忽略的边界：PostgreSQL 的 btgettuple() 会把 xs_recheck 设成 false，意思是 B-tree 对它支持的 operator class 来说不是 lossy，返回的 index tuple 在索引语义上确实满足条件。但通用 index scan 框架必须照顾别的访问方法，所以 nodeIndexscan.c 里保留了 recheck 逻辑。", "换句话说，索引结构自己只能保证它定义的那部分语义。最终能不能返回给用户，是核心系统一层层判出来的。"], "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20\" y=\"20\" width=\"600\" height=\"230\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"36\" y=\"48\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"600\" >index_getnext_slot() 简化逻辑<\/text><text x=\"36\" y=\"78\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" xml:space=\"preserve\">while index_getnext_tid() returns a TID:<\/text><text x=\"36\" y=\"106\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" xml:space=\"preserve\">    if index_fetch_heap() finds a visible tuple:<\/text><text x=\"36\" y=\"134\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" xml:space=\"preserve\">        if xs_recheck: recheck index condition<\/text><text x=\"36\" y=\"162\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" xml:space=\"preserve\">        return slot<\/text><rect x=\"660\" y=\"20\" width=\"720\" height=\"52\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"1020.0\" y=\"51.6\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"600\" >index_getnext_tid() → 拿到候选 TID<\/text><line x1=\"1020\" y1=\"74\" x2=\"1020\" y2=\"84.4\" stroke=\"#BE653B\" stroke-width=\"1.8\"/><polygon points=\"1020,90 1016.15,83 1023.85,83\" fill=\"#BE653B\"/><rect x=\"660\" y=\"92\" width=\"720\" height=\"52\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"1020.0\" y=\"123.6\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"600\" >index_fetch_heap() → 按 TID 取 heap tuple<\/text><line x1=\"1020\" y1=\"146\" x2=\"1020\" y2=\"156.4\" stroke=\"#BE653B\" stroke-width=\"1.8\"/><polygon points=\"1020,162 1016.15,155 1023.85,155\" fill=\"#BE653B\"/><rect x=\"660\" y=\"164\" width=\"720\" height=\"52\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"1020.0\" y=\"195.6\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"600\" >MVCC snapshot / HOT 链 → 是否可见<\/text><line x1=\"1020\" y1=\"218\" x2=\"1020\" y2=\"228.4\" stroke=\"#BE653B\" stroke-width=\"1.8\"/><polygon points=\"1020,234 1016.15,227 1023.85,227\" fill=\"#BE653B\"/><rect x=\"660\" y=\"236\" width=\"720\" height=\"52\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.1\" /><text x=\"1020.0\" y=\"267.6\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"600\" >xs_recheck？→ lossy 条件复核<\/text><line x1=\"1020\" y1=\"290\" x2=\"1020\" y2=\"300.4\" stroke=\"#BE653B\" stroke-width=\"1.8\"/><polygon points=\"1020,306 1016.15,299 1023.85,299\" fill=\"#BE653B\"/><rect x=\"660\" y=\"308\" width=\"720\" height=\"52\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"1020.0\" y=\"339.6\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"600\" >qpqual + 投影列 → return slot<\/text><rect x=\"20\" y=\"378\" width=\"1360\" height=\"44\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#F1EFE9\" stroke-width=\"1.0\" /><text x=\"38\" y=\"405.25\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"600\" >边界<\/text><text x=\"242\" y=\"404.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >不是所有索引都能证明最终条件；访问方法只能保证自己定义的语义<\/text><\/svg>", "ctrl": null}, {"eyebrow": "08 · B-tree 导航（动画）", "title": "B-tree：找到第一个，然后推进", "lede": "_bt_first() 只是起点；_bt_next() 沿 leaf page 推进，必要时靠 right link 跨页。", "caption": "键值为示意；动画输入只改变讲解条件，不改变源码机制。可用「播放 / 单步 / 重置」逐步观察。", "bridge": "树怎么走清楚了，问题就变成：这条路值不值得走——交给代价模型回答。", "notes": ["很多人以为 B-tree 扫描是「查一次树就结束」。其实 _bt_search() 只负责从 root、internal page 下探到 leaf page；_bt_binsrch() 在页内二分定位起点；_bt_first() 找到第一个满足 scan key 的 index item；接下来靠 _bt_next() 在 leaf page 里继续推进，走到页尾就沿 right link 到下一个 leaf page；btgettuple() 把 TID 一个个交给上层。", "还有一层现实的复杂度：B-tree 是并发结构，你扫描的时候别的事务可能正在插入、分裂页面。nbtree 靠 high key、right link、page pin 和 lock 保证方向不错，_bt_moveright() 就是发现当前 page 已经不是目标区间时沿右链搬家。这和 Efficient Locking for Concurrent Operations on B-Trees 讨论的是同一件事：数据库里的 B-tree 不是教材里那棵静态的树。", "这一页可以播放或单步。改一改起点、切到「并发发生分裂」，看第 5 步的讲解怎么变——输入只改讲解条件，不改机制。"], "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" id=\"animBt\"><g data-bt=\"1\"><rect x=\"350\" y=\"14\" width=\"240\" height=\"46\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"470.0\" y=\"30.675\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >root page<\/text><text x=\"470.0\" y=\"51.375\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"40 "4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" class=\"btcur\" data-bt=\"4\"/><text x=\"155.0\" y=\"215.675\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >leaf page 1<\/text><text x=\"155.0\" y=\"236.375\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >TID 区间 A<\/text><\/g><g data-bt=\"2\"><rect x=\"330\" y=\"190\" width=\"270\" height=\"64\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" class=\"btcur\" data-bt=\"2\"/><text x=\"465.0\" y=\"215.675\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >leaf page 2<\/text><text x=\"465.0\" y=\"236.375\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >TID 区间 B<\/text><\/g><g data-bt=\"4\"><rect x=\"640\" y=\"190\" width=\"270\" height=\"64\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" class=\"btcur\" data-bt=\"4\"/><text x=\"775.0\" y=\"215.675\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >leaf page 3<\/text><text x=\"775.0\" y=\"236.375\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >TID 区间 C<\/text><\/g><g data-bt=\"3\"><rect x=\"330\" y=\"262\" width=\"270\" height=\"26\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.1\" class=\"btcur\" data-bt=\"3\"/><text x=\"342\" y=\"280\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"600\" >_bt_first() → 第一个匹配 TID<\/text><\/g><g data-bt=\"4\"><rect x=\"330\" y=\"292\" width=\"580\" height=\"26\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" class=\"btcur\" data-bt=\"4\"/><text x=\"342\" y=\"310\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#245A6B\" font-weight=\"600\" >_bt_next() → 在当前 leaf page 内顺序推进<\/text><\/g><g data-bt=\"5\"><line x1=\"292\" y1=\"222\" x2=\"322.4\" y2=\"222\" stroke=\"#BE653B\" stroke-width=\"1.8\"/><polygon points=\"328,222 321,218.15 321,225.85\" fill=\"#BE653B\"/><line x1=\"602\" y1=\"222\" x2=\"632.4\" y2=\"222\" stroke=\"#BE653B\" stroke-width=\"1.8\"/><polygon points=\"638,222 631,218.15 631,225.85\" fill=\"#BE653B\"/><rect x=\"640\" y=\"262\" width=\"270\" height=\"26\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.1\" class=\"btcur\" data-bt=\"5\"/><text x=\"652\" y=\"280\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"600\" >_bt_moveright() → 右链<\/text><\/g><g data-bt=\"1\"><rect x=\"940\" y=\"14\" width=\"440\" height=\"54\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" class=\"btcur\" data-bt=\"1\"/><text x=\"958\" y=\"47\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"600\" >01  _bt_search() 下探<\/text><\/g><g data-bt=\"2\"><rect x=\"940\" y=\"78\" width=\"440\" height=\"54\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" class=\"btcur\" data-bt=\"2\"/><text x=\"958\" y=\"111\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"600\" >02  _bt_binsrch() 页内二分<\/text><\/g><g data-bt=\"3\"><rect x=\"940\" y=\"142\" width=\"440\" height=\"54\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" class=\"btcur\" data-bt=\"3\"/><text x=\"958\" y=\"175\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"600\" >03  _bt_first() 首个匹配<\/text><\/g><g data-bt=\"4\"><rect x=\"940\" y=\"206\" width=\"440\" height=\"54\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" class=\"btcur\" data-bt=\"4\"/><text x=\"958\" y=\"239\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"600\" >04  _bt_next() 顺序推进<\/text><\/g><g data-bt=\"5\"><rect x=\"940\" y=\"270\" width=\"440\" height=\"54\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" class=\"btcur\" data-bt=\"5\"/><text x=\"958\" y=\"303\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"600\" >05  _bt_moveright() 右移<\/text><\/g><g data-bt=\"6\"><rect x=\"940\" y=\"334\" width=\"440\" height=\"54\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" class=\"btcur\" data-bt=\"6\"/><text x=\"958\" y=\"367\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"600\" >06  btgettuple() 上交 TID<\/text><\/g><g data-bt=\"6\"><rect x=\"20\" y=\"330\" width=\"880\" height=\"96\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" class=\"btcur\" data-bt=\"6\"/><text x=\"36\" y=\"360\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"700\" >并发推进<\/text><text x=\"36\" y=\"386\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >high key、right link、page pin/lock 保证页面分裂时扫描不走错方向<\/text><text x=\"36\" y=\"412\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >btgettuple() 把 TID 交给上层 executor / table AM<\/text><\/g><\/svg>", "ctrl": "<label>起点 key<\/label><input type=\"text\" id=\"btKey\" value=\"42\">\n<label>页面分裂<\/label><select id=\"btSplit\"><option value=\"no\">未发生<\/option><option value=\"yes\">并发发生分裂<\/option><\/select>\n<label>步<\/label><input type=\"range\" id=\"btRange\" min=\"0\" max=\"6\" step=\"1\" value=\"6\">\n<button class=\"btn play\" id=\"btPlay\">▶ 播放<\/button>\n<button class=\"btn\" id=\"btTick\">单步 ›<\/button><button class=\"btn\" id=\"btReset\">重置<\/button>\n<span class=\"out\" id=\"btOut\"><\/span>"}, {"eyebrow": "09 · 代价模型（动画）", "title": "走索引，有时反而更慢", "lede": "cost_index() 不是比较「有索引 / 没索引」，而是把选择率、相关性、回表与 CPU 一起估。", "caption": "动画为定性推演，不产出真实成本数值；真实计划由 cost_index() 全量估算与统计信息决定。", "bridge": "估完账，两个反直觉的结论会改变直觉：低选择率，和 ORDER BY 加 LIMIT。", "notes": ["优化器不是按名字选计划，是按估算成本选计划。cost_index() 至少要估几组东西：索引访问方法自己的启动与总成本、indexSelectivity 推出来的候选 tuple 数、由表大小和缓存假设导出的 heap page 数、再根据索引顺序与表物理顺序的相关性，在随机 I/O 和顺序 I/O 之间插值；另外还有 qpqual 的 CPU 成本、index-only 因为 all-visible 页面比例减少的 heap fetch、能不能并行、以及 pathkeys 能不能免掉一次排序。", "这一页可以改三个输入：候选占比、相关性、ORDER BY 是否命中索引顺序，然后播放看六个因子怎么逐层叠加。右侧的倾向判定是教学用的定性推演，不是 cost_index() 的真实数值。", "先记住两个反直觉的结论，下一页展开：选择率低不一定快，ORDER BY 加 LIMIT 反而可能把天平拨回索引这边。"], "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" id=\"animCost\"><rect x=\"20\" y=\"40\" width=\"380\" height=\"310\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"36\" y=\"70\" class=\"sv serif\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#1B2B33\" font-weight=\"700\" >输入 · 统计与假设<\/text><text x=\"36\" y=\"96\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >indexSelectivity 推导候选 tuple 数<\/text><text x=\"36\" y=\"122\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >表大小、缓存假设、索引与物理顺序相关性<\/text><text x=\"36\" y=\"148\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >qpqual 的 CPU 过滤代价<\/text><text x=\"36\" y=\"174\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >visibility map 的 all-visible 页面比例<\/text><text x=\"36\" y=\"200\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >并行可能性与需要的 pathkeys<\/text><line x1=\"402\" y1=\"195\" x2=\"411.6\" y2=\"195\" stroke=\"#245A6B\" stroke-width=\"1.9\"/><polygon points=\"418,195 410,190.6 410,199.4\" fill=\"#245A6B\"/><g data-cost=\"1\"><rect x=\"430\" y=\"40\" width=\"260\" height=\"96\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" class=\"costcur\" data-cost=\"1\"/><text x=\"446\" y=\"70\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" >① 索引 AM<\/text><text x=\"446\" y=\"96\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >启动成本 + 总成本<\/text><\/g><g data-cost=\"2\"><rect x=\"710\" y=\"40\" width=\"260\" height=\"96\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" class=\"costcur\" data-cost=\"2\"/><text x=\"726\" y=\"70\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" >② 候选 tuple 数<\/text><text x=\"726\" y=\"96\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >indexSelectivity<\/text><\/g><g data-cost=\"3\"><rect x=\"430\" y=\"148\" width=\"260\" height=\"96\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" class=\"costcur\" data-cost=\"3\"/><text x=\"446\" y=\"178\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" >③ heap page 数<\/text><text x=\"446\" y=\"204\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >候选数 × 表大小 × 缓存<\/text><\/g><g data-cost=\"4\"><rect x=\"710\" y=\"148\" width=\"260\" height=\"96\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" class=\"costcur\" data-cost=\"4\"/><text x=\"726\" y=\"178\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" >④ I/O 形态<\/text><text x=\"726\" y=\"204\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >相关性 → 随机 / 顺序插值<\/text><\/g><g data-cost=\"5\"><rect x=\"430\" y=\"256\" width=\"260\" height=\"96\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" class=\"costcur\" data-cost=\"5\"/><text x=\"446\" y=\"286\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" >⑤ CPU 过滤<\/text><text x=\"446\" y=\"312\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >qpqual 逐行检查<\/text><\/g><g data-cost=\"6\"><rect x=\"710\" y=\"256\" width=\"260\" height=\"96\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" class=\"costcur\" data-cost=\"6\"/><text x=\"726\" y=\"286\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" >⑥ 减免项<\/text><text x=\"726\" y=\"312\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >all-visible / 并行 / pathkeys<\/text><\/g><line x1=\"982\" y1=\"195\" x2=\"991.6\" y2=\"195\" stroke=\"#BE653B\" stroke-width=\"1.9\"/><polygon points=\"998,195 990,190.6 990,199.4\" fill=\"#BE653B\"/><rect x=\"1000\" y=\"40\" width=\"380\" height=\"310\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"1016\" y=\"70\" class=\"sv serif\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#1B2B33\" font-weight=\"700\" >输出 · 计划选择<\/text><text x=\"1016\" y=\"96\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >索引访问成本 + heap 访问成本<\/text><text x=\"1016\" y=\"122\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >随机 I/O 与顺序 I/O 的插值结果<\/text><text x=\"1016\" y=\"148\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >CPU 过滤成本与启动成本<\/text><text x=\"1016\" y=\"174\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >是否提供有用 pathkeys、避免排序<\/text><text x=\"1016\" y=\"200\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >与 seq / bitmap / index-only 竞争<\/text><rect x=\"1000\" y=\"362\" width=\"380\" height=\"56\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1.0\" /><text x=\"1018\" y=\"395.25\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#AE8A3E\" font-weight=\"600\" >提示<\/text><text x=\"1142\" y=\"394.2\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >定性推演，非 cost_index() 真实数值<\/text><\/svg>", "ctrl": "<label>候选占比<\/label><select id=\"costSel\"><option value=\"low\">极低 / 低<\/option><option value=\"high\">中 / 高<\/option><\/select>\n<label>相关性<\/label><select id=\"costCor\"><option value=\"high\">高（顺序集中）<\/option><option value=\"low\">低（散落各页）<\/option><\/select>\n<label>ORDER BY<\/label><select id=\"costOrd\"><option value=\"no\">未命中索引顺序<\/option><option value=\"yes\">命中且带 LIMIT<\/option><\/select>\n<button class=\"btn play\" id=\"costPlay\">▶ 播放<\/button>\n<button class=\"btn\" id=\"costTick\">单步 ›<\/button><button class=\"btn\" id=\"costReset\">重置<\/button>\n<span class=\"out\" id=\"costOut\"><\/span>"}, {"eyebrow": "10 · 两个反直觉", "title": "选择率低，也可能更慢", "lede": "cost_index() 还会看相关性与顺序：随机回表和免排序早停，都会翻转结论。", "caption": "示例 SQL 来自原文；页内橙块为示意，不是真实行数。SSD 缓和随机读，但没有消除 I/O 请求数、缓存 miss 与执行器调用成本。", "bridge": "把镜头换到列式引擎：DuckDB 干脆给 index scan 设了一串硬门槛。", "notes": ["第一个反直觉：选择率低不一定快。如果索引键顺序和表物理顺序几乎无关，哪怕候选行不多，也会一颗一颗散落在不同的 heap page 上，index scan 就退化成大量随机访问。SSD 让这件事比机械硬盘时代缓和了，但没消失：I/O 请求数、缓存 miss、执行器调用成本都还在。", "第二个反直觉：ORDER BY 能改变选择。比如按 customer_id 过滤、按 created_at 排序、只取 20 行，若有 (customer_id, created_at) 复合索引，index scan 不只是少读行——它按需要的顺序产出数据，避免了一次排序，拿到 20 行还能立刻早停。", "所以优势从来不是单一维度的「读得少」，而是「读得少 + 顺序可用 + 能早停」。少任何一项，结论都可能反过来。"], "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20\" y=\"20\" width=\"660\" height=\"50\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.0\" /><text x=\"36\" y=\"52\" class=\"sv serif\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#BE653B\" font-weight=\"700\" >反直觉一 · 候选少，但分布散<\/text><text x=\"20\" y=\"92\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >索引顺序：TID 依次有序（按索引键）<\/text><rect x=\"30\" y=\"110\" width=\"148\" height=\"68\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"40\" y=\"132\" class=\"sv mono\" te eap page 6<\/text><rect x=\"219\" y=\"224\" width=\"16\" height=\"16\" rx=\"2\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1.0\" /><rect x=\"346\" y=\"188\" width=\"148\" height=\"68\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"356\" y=\"210\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"600\" >heap page 7<\/text><rect x=\"422\" y=\"224\" width=\"16\" height=\"16\" rx=\"2\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1.0\" /><rect x=\"504\" y=\"188\" width=\"148\" height=\"68\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"514\" y=\"210\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"600\" >heap page 8<\/text><rect x=\"520\" y=\"224\" width=\"16\" height=\"16\" rx=\"2\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1.0\" /><text x=\"20\" y=\"278\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#BE653B\" font-weight=\"400\" >每个候选落在不同 heap page → 大量随机访问<\/text><rect x=\"20\" y=\"300\" width=\"660\" height=\"52\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#F1EFE9\" stroke-width=\"1.0\" /><text x=\"38\" y=\"331.25\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"600\" >相关性<\/text><text x=\"202\" y=\"330.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >cost_index() 用它插值随机 / 顺序 I/O 成本<\/text><rect x=\"20\" y=\"362\" width=\"660\" height=\"52\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"38\" y=\"393.25\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"600\" >代价<\/text><text x=\"202\" y=\"392.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >随机 I/O 请求数、缓存 miss、执行器调用成本被放大<\/text><rect x=\"700\" y=\"20\" width=\"680\" height=\"50\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.0\" /><text x=\"716\" y=\"52\" class=\"sv serif\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#2F7A66\" font-weight=\"700\" >反直觉二 · ORDER BY + LIMIT<\/text><rect x=\"700\" y=\"84\" width=\"680\" height=\"150\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"716\" y=\"112\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"600\" >示例 SQL<\/text><text x=\"716\" y=\"142\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" xml:space=\"preserve\">SELECT * FROM orders<\/text><text x=\"716\" y=\"168\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" xml:space=\"preserve\">WHERE customer_id = 1001<\/text><text x=\"716\" y=\"194\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" xml:space=\"preserve\">ORDER BY created_at<\/text><text x=\"716\" y=\"220\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" xml:space=\"preserve\">LIMIT 20;<\/text><rect x=\"700\" y=\"246\" width=\"680\" height=\"44\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1.0\" /><text x=\"718\" y=\"273.25\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#2F7A66\" font-weight=\"600\" >复合索引<\/text><text x=\"892\" y=\"272.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >(customer_id, created_at) 同时满足过滤与顺序<\/text><rect x=\"700\" y=\"296\" width=\"680\" height=\"44\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1.0\" /><text x=\"718\" y=\"323.25\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#2F7A66\" font-weight=\"600\" >顺序产出<\/text><text x=\"892\" y=\"322.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >executor 按目标顺序拿数据，无需额外排序<\/text><rect x=\"700\" y=\"346\" width=\"680\" height=\"44\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1.0\" /><text x=\"718\" y=\"373.25\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#2F7A66\" font-weight=\"600\" >早停<\/text><text x=\"892\" y=\"372.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >拿到 20 行就停，不再扫描后续候选<\/text><text x=\"700\" y=\"412\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >SSD 缓和随机读，但没有消除上述成本。<\/text><\/svg>", "ctrl": null}, {"eyebrow": "11 · DuckDB 的门槛（动画）", "title": "DuckDB 先过七道门槛", "lede": "TableScanInitGlobal() 只在条件很窄时切到 ART index scan，否则直接回退普通 table scan。", "caption": "阈值按源码默认 max(2048, 0.001 × total_rows) 计算；输入数值仅用于教学推演，非实验结果。", "bridge": "一旦真的进了这条分支，DuckDB 又是怎么取数据的？", "notes": ["DuckDB 的语境完全不同：它是面向分析的向量化引擎，很多查询顺序扫列存数据本来就很快，所以对 index scan 用得很克制。table_scan.cpp 里的 TableScanInitGlobal() 先过一串很窄的条件：要有过滤条件、filter 集合只有一个、表上有索引、支持单列 ART、filter 命中索引列、ART 拿到的 row_id 数不超过阈值；阈值大致是 max(index_scan_max_count, index_scan_percentage × total_rows)，源码默认 2048 和 0.001。", "任何一条不满足，就回退普通 table scan；ART 扫描过程中发现匹配 row_id 超过阈值，也会返回失败让上层回退。这不是「保守」，而是取舍：索引只服务于点查和极小范围，避免为一小撮行打断高吞吐的列扫描。", "这一页可以改匹配 row_id 数、总行数，或者故意把门槛设成「多个 filter」，播放看阈值条怎么涨、什么时候触发回退。"], "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" id=\"animDd\"><g data-dd=\"1\"><rect x=\"20\" y=\"20\" width=\"600\" height=\"44\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"36\" y=\"48\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"600\" >01  有过滤条件<\/text><\/g><g data-dd=\"1\"><rect x=\"20\" y=\"70\" width=\"600\" height=\"44\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"36\" y=\"98\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"600\" >02  filter 集合只有一个<\/text><\/g><g data-dd=\"2\"><rect x=\"20\" y=\"120\" width=\"600\" height=\"44\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"36\" y=\"148\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"600\" >03  表上存在索引<\/text><\/g><g data-dd=\"2\"><rect x=\"20\" y=\"170\" width=\"600\" height=\"44\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"36\" y=\"198\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"600\" >04  支持单列 ART 扫描<\/text><\/g><g data-dd=\"2\"><rect x=\"20\" y=\"220\" width=\"600\" height=\"44\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"36\" y=\"248\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"600\" >05  filter 能匹配索引列<\/text><\/g><g data-dd=\"3\"><rect x=\"20\" y=\"270\" width=\"600\" height=\"44\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.1\" /><text x=\"36\" y=\"298\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#BE653B\" font-weight=\"600\" >06  ART 得到的 row_id 数不超过阈值<\/text><\/g><g data-dd=\"3\"><rect x=\"20\" y=\"320\" width=\"600\" height=\"44\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.1\" /><text x=\"36\" y=\"348\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#BE653B\" font-weight=\"600\" >07  阈值 ≈ max(index_scan_max_count, index_scan_percentage × total_rows)<\/text><\/g><rect x=\"650\" y=\"20\" width=\"730\" height=\"48\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"666\" y=\"50\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"700\" >TableScanInitGlobal() 的分支判定<\/text><g data-dd=\"3\"><rect x=\"680\" y=\"120\" width=\"560\" height=\"26\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"680\" y=\"120\" width=\"0\" height=\"26\" rx=\"3\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" id=\"ddBar\"/><line x1=\"1128\" y1=\"108\" x2=\"1128\" y2=\"158\" stroke=\"#BE653B\" stroke-width=\"2.0\"/><text x=\"1128\" y=\"102\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"600\" >阈值<\/text><text x=\"680\" y=\"178\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"600\" id=\"ddCount\">已收集 row_id：0<\/text><text x=\"680\" y=\"204\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" id=\"ddThLbl\">阈值 2048（max(2048, 0.001 × 1,000,000)）<\/text><\/g><g data-dd=\"4\"><rect x=\"650\" y=\"230\" width=\"230\" height=\"64\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"765.0\" y=\"255.675\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >ART::Scan()<\/text><text x=\"765.0\" y=\"276.375\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >收集 row_t<\/text><\/g><line x1=\"884\" y1=\"262\" x2=\"892.4\" y2=\"262\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"898,262 891,258.15 891,265.85\" fill=\"#245A6B\"/><g data-dd=\"5\"><rect x=\"910\" y=\"230\" width=\"230\" height=\"64\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.1\" /><text x=\"1025.0\" y=\"255.675\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >阈值判断<\/text><text x=\"1025.0\" y=\"276.375\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >超过即返回失败<\/text><\/g><line x1=\"1144\" y1=\"262\" x2=\"1152.4\" y2=\"262\" stroke=\"#BE653B\" stroke-width=\"1.8\"/><polygon points=\"1158,262 1151,258.15 1151,265.85\" fill=\"#BE653B\"/><g data-dd=\"6\"><rect x=\"1170\" y=\"230\" width=\"210\" height=\"64\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"1275.0\" y=\"255.675\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >回退或进入<\/text><text x=\"1275.0\" y=\"276.375\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >index scan / table scan<\/text><\/g><rect x=\"650\" y=\"318\" width=\"730\" height=\"96\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"666\" y=\"348\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"700\" >回退逻辑<\/text><text x=\"666\" y=\"374\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >任一门槛不满足 → 回退普通 table scan<\/text><text x=\"666\" y=\"400\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >ART 扫描中 row_id 超过阈值 → 返回失败，由上层回退<\/text><\/svg>", "ctrl": "<label>匹配 row_id<\/label><input type=\"number\" id=\"ddMatch\" value=\"3000\" min=\"0\" step=\"100\">\n<label>总行数<\/label><input type=\"number\" id=\"ddTotal\" value=\"1000000\" min=\"1\" step=\"1000\">\n<label>门槛<\/label><select id=\"ddGate\"><option value=\"ok\">全部满足<\/option><option value=\"multi\">多个 filter<\/option><option value=\"miss\">未命中索引列<\/option><\/select>\n<button class=\"btn play\" id=\"ddPlay\">▶ 播放<\/button>\n<button class=\"btn\" id=\"ddTick\">单步 ›<\/button><button class=\"btn\" id=\"ddReset\">重置<\/button>\n<span class=\"out\" id=\"ddOut\"><\/span>"}, {"eyebrow": "12 · DuckDB 的执行形态", "title": "索引给 row_id，取列仍要向量化", "lede": "ART::Scan() 只负责收集 row_t；DuckIndexScanState 再按 STANDARD_VECTOR_SIZE 分批 Fetch。", "caption": "与 PostgreSQL 逐 TID 模型对照：DuckDB 努力维持向量化执行，索引只是先给出一小批 row_id。", "bridge": "那为什么是 ART，而不是另一棵 B-tree？", "notes": ["真的进了 ART index scan，执行也拆成两段。第一段 ART::Scan() 根据过滤条件查 ART，收集 row_t，也就是 row_id；第二段由 DuckIndexScanState 按 STANDARD_VECTOR_SIZE 分批调用 storage.Fetch()，把 row_id 对应的列取成向量化的 DataChunk。", "这跟 PostgreSQL 的逐 TID executor 模型很不一样。PG 那边是索引给一个 TID、executor 取一个 heap tuple、做一次可见性判断；DuckDB 这边索引只是先给一小批 row_id，真正取列的时候仍然批量进行，尽量不让索引把向量化流水线打断。", "所以同样是「先查索引再取数据」，一个的单位是 tuple，一个的单位是向量块。理解了这个差别，后面的架构
