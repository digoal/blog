<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数据库筑基课 · 数据扫描方法 Index Only Scan</title>
<style>
:root{
  --bg:#F7F6F2; --ink:#1B2B33; --ink2:#46585F; --muted:#89938F; --line:#D9D5CB;
  --primary:#245A6B; --prim-l:#E5EFF0; --accent:#BE653B; --acc-l:#F7E9DE;
  --green:#2F7A66; --gold:#AE8A3E;
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#E9E7E1}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
#viewport{position:absolute;inset:0 0 58px 0;overflow:hidden}
#stage{position:absolute;width:1600px;height:900px;background:var(--bg);
  transform-origin:top left;box-shadow:0 18px 60px rgba(27,43,51,.13)}
.slide{position:absolute;inset:0;display:none}
.slide.on{display:block;animation:fadein .40s cubic-bezier(.2,.7,.2,1)}
@keyframes fadein{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.eyebrow{position:absolute;left:64px;top:44px;font-size:13px;letter-spacing:3.4px;
  color:var(--primary);font-weight:600}
.eyebrow .num{font-family:var(--mono);letter-spacing:1px;color:var(--accent);margin-right:14px}
h1.title{position:absolute;left:64px;top:70px;margin:0;font-family:var(--serif);
  font-size:44px;line-height:1.25;font-weight:700;letter-spacing:1.2px;color:var(--ink)}
.lede{position:absolute;left:64px;top:139px;width:1440px;font-size:19px;color:var(--ink2);
  line-height:1.5;letter-spacing:.3px}
.rule{position:absolute;left:64px;top:181px;width:1472px;height:1px;background:var(--line)}
.figwrap{position:absolute;left:100px;top:198px;width:1400px;height:430px}
svg.figure{display:block;overflow:visible}
svg.figure text{font-family:var(--sans)}
svg.figure text.serif{font-family:var(--serif)}
svg.figure text.mono{font-family:var(--mono)}
.caption{position:absolute;left:100px;top:638px;width:1400px;font-size:13px;
  color:var(--muted);letter-spacing:.4px;line-height:1.6}
.bridge{position:absolute;left:64px;top:706px;width:1472px;font-size:20px;
  color:var(--accent);line-height:1.55;letter-spacing:.4px;padding-left:18px;
  border-left:3px solid var(--accent);font-family:var(--serif)}
.bridge .bk{font-family:var(--sans);font-size:13px;color:var(--muted);
  letter-spacing:2px;display:block;margin-bottom:2px}
.footer{position:absolute;left:64px;top:846px;width:1472px;height:1px;background:var(--line)}
.footer .fl{position:absolute;left:0;top:14px;font-size:12.5px;color:var(--muted);letter-spacing:2px}
.footer .fr{position:absolute;right:0;top:12px;font-family:var(--mono);font-size:14px;color:var(--ink2)}
.footer .fbar{position:absolute;left:0;right:0;top:-1px;height:2px;background:transparent}
.footer .fbar i{display:block;height:2px;background:var(--primary);width:0;transition:width .4s ease}

/* 动画页控件：位于图下方独立条带，绝不覆盖图 */
.ctrls{position:absolute;left:100px;top:636px;width:1400px;height:48px;display:flex;
  align-items:center;gap:10px}
.ctrls label{font-size:13.5px;color:var(--ink2);white-space:nowrap}
.ctrls select,.ctrls input[type=range]{font-family:var(--sans);font-size:13.5px;color:var(--ink);
  background:#fff;border:1px solid var(--line);border-radius:4px;padding:5px 8px;outline:none}
.ctrls input[type=range]{width:190px;padding:0;accent-color:var(--primary);border:none;background:transparent}
.ctrls .btn{min-height:32px;padding:5px 14px;border:1px solid var(--primary);border-radius:4px;
  background:#fff;color:var(--primary);font-size:13.5px;cursor:pointer;font-family:var(--sans);
  white-space:nowrap;flex:0 0 auto}
.ctrls .btn.play{background:var(--primary);color:#fff}
.ctrls .btn:hover{filter:brightness(.94)}
.ctrls .out{font-size:13.5px;color:var(--ink2);margin-left:auto;flex:1;min-width:0;
  max-width:600px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.ctrls .out b{color:var(--accent);font-weight:600}
.ctrls .val{font-family:var(--mono);font-size:13px;color:var(--primary);min-width:44px}

/* 底部控制条：全屏时也常显（按键提示始终可见） */
.chrome{position:fixed;left:0;right:0;bottom:0;height:58px;background:#FCFBF8;
  border-top:1px solid var(--line);display:flex;align-items:center;gap:6px;
  padding:0 16px;z-index:40;font-size:13px;color:var(--ink2);overflow-x:auto}
.chrome .sep{width:1px;height:22px;background:var(--line);margin:0 4px;flex:0 0 auto}
.chrome button{font-family:var(--sans);font-size:13px;color:var(--ink2);background:transparent;
  border:1px solid transparent;border-radius:5px;padding:7px 10px;cursor:pointer;
  white-space:nowrap;flex:0 0 auto}
.chrome button:hover{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome button.act{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome button kbd{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-left:5px}
.chrome .pg{font-family:var(--mono);font-size:14px;color:var(--ink);min-width:78px;text-align:center;
  flex:0 0 auto}
.chrome .track{flex:1 1 120px;min-width:80px;height:3px;background:var(--line);border-radius:3px;
  margin:0 10px;position:relative}
.chrome .track i{position:absolute;left:0;top:0;height:3px;background:var(--primary);
  border-radius:3px;transition:width .35s}
.chrome .hint{font-size:12px;color:var(--muted);white-space:nowrap;flex:0 0 auto}
body.full .chrome{background:#F3F1EB;border-top-color:#C9C4B8}

/* 右侧页内讲稿窗（不是弹窗） */
#drawer{position:absolute;right:0;top:0;bottom:0;width:460px;background:#FCFBF8;
  border-left:1px solid var(--line);display:none;flex-direction:column;z-index:30;
  box-shadow:-16px 0 44px rgba(27,43,51,.09)}
body.drawer-on #drawer{display:flex}
.dhead{padding:22px 26px 16px;border-bottom:1px solid var(--line);position:relative;flex:0 0 auto}
.dhead .dk{font-family:var(--mono);font-size:11.5px;letter-spacing:2px;color:var(--accent)}
.dhead h2{margin:8px 44px 4px 0;font-family:var(--serif);font-size:23px;line-height:1.35;color:var(--ink)}
.dhead .psub{font-size:12.5px;color:var(--muted);letter-spacing:.5px;margin-top:6px}
.dhead .dclose{position:absolute;right:20px;top:20px;background:#fff;border:1px solid var(--line);
  border-radius:4px;padding:6px 10px;font-size:12.5px;cursor:pointer;color:var(--ink2);font-family:var(--sans)}
.dhead .dclose:hover{background:var(--prim-l);color:var(--primary)}
.dbody{flex:1;overflow-y:auto;position:relative;padding:6px 26px 26px}
.dbody::-webkit-scrollbar{width:8px}
.dbody::-webkit-scrollbar-thumb{background:#D9D5CB;border-radius:8px}
.dsec{border-top:1px solid var(--line);padding:16px 0 18px;margin-top:2px}
.dsec:first-child{border-top:none}
.dsec .sn{font-family:var(--mono);font-size:11.5px;color:var(--accent);letter-spacing:1.2px}
.dsec h3{margin:7px 0 10px;font-family:var(--serif);font-size:19px;color:var(--primary);line-height:1.4}
.dsec p{margin:0 0 10px;font-size:14.5px;line-height:1.95;color:var(--ink2);letter-spacing:.2px}
.dsec p:last-child{margin-bottom:0}
.dsec .nx{font-family:var(--serif);font-size:14px;color:var(--accent);line-height:1.7;
  border-left:3px solid var(--accent);padding-left:12px;margin-top:12px}
.dsec.cur{background:#E5EFF0;border-left:3px solid var(--primary);padding-left:14px;
  padding-right:12px;margin-left:-3px}
.dgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding-top:12px}
.dgrid a{display:block;padding:11px 12px;border:1px solid var(--line);background:#fff;
  text-decoration:none;color:var(--ink);cursor:pointer}
.dgrid a:hover{border-color:var(--primary);background:var(--prim-l)}
.dgrid a.cur{border-color:var(--primary);background:var(--prim-l)}
.dgrid a .gn{font-family:var(--mono);font-size:11.5px;color:var(--accent)}
.dgrid a .gt{font-family:var(--serif);font-size:14.5px;line-height:1.4;display:block;margin-top:4px}
.dkeys{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 18px;font-size:14px;
  line-height:1.8;padding-top:12px;color:var(--ink2)}
.dkeys kbd{font-family:var(--mono);background:#fff;border:1px solid var(--line);
  border-bottom-width:2px;border-radius:4px;padding:2px 7px;color:var(--primary);margin-right:8px}
.dfoot{flex:0 0 auto;border-top:1px solid var(--line);padding:12px 26px;font-size:12px;
  color:var(--muted);letter-spacing:.4px;background:#FCFBF8}
.toast{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);background:var(--ink);
  color:#fff;font-size:13px;padding:9px 16px;border-radius:5px;opacity:0;transition:.3s;
  z-index:80;pointer-events:none}
.toast.on{opacity:1}
@media print{.chrome,#drawer,.toast{display:none!important}#viewport{position:static}
  #stage{position:static;transform:none!important;box-shadow:none}
  .slide{display:block!important;page-break-after:always;position:relative;height:900px}}
</style>
</head>
<body>
<div id="viewport">
  <div id="stage"><div id="slides"></div></div>
  <aside id="drawer">
    <div class="dhead" id="dHead"></div>
    <div class="dbody" id="dBody"></div>
    <div class="dfoot" id="dFoot">N 本页 · T 全文 · G 目录 · ? 快捷键 · Esc 关闭</div>
  </aside>
</div>
<div class="chrome">
  <button id="btnPrev">← 上一页</button>
  <button id="btnNext">下一页 →</button>

  <button data-mode="toc">目录 <kbd>G</kbd></button>

</div>
<div class="toast" id="toast"></div>
<script>
const D = [{"eyebrow":"开场 · 命题","title":"被名字骗了：它从不承诺「不读表」","lede":"Index Only Scan 最容易被当成一句保证——只要建了覆盖索引，查询就再也不碰 heap。这节课先把这句话拆掉。","caption":"图 1　三层剖面：值在索引层，可见性在 heap 层，中间靠一层保守的 VM 摘要连接。","bridge":"既然名字这么容易骗人，那我们得先问：为什么 PostgreSQL 非要多此一举去读表？","notes":"咱们从名字开始。「Index Only Scan」，字面看就是「只扫索引」。很多人第一次看到 EXPLAIN 里出现这个节点，会顺手把它理解成一句保证：以后这条查询再也不碰表了。\n\n可只要往里走一层，就会发现这个理解站不住。PostgreSQL 里所有索引都是二级索引，索引和 heap 分开存放；索引能给出列值，也能给出行在哪儿，但它给不出一个最要命的信息——这一行对当前事务到底可不可见。\n\n所以今天这节课，我想先把结论放在最前面：Index Only Scan 不是「只读索引」的承诺，而是「优先从索引取数，并且用 visibility map 尽量避免 heap 访问」的执行策略。注意「尽量」两个字，它意味着退化路径一直都在。\n\n记住这张三层剖面：最上面是索引层，中间是 VM 摘要层，最底下是 heap 层。后面所有的机制、所有的坑、所有的调优动作，其实都是在这三层之间来回走。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><text x=\"60\" y=\"34\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >图 1　三层剖面：值在哪里，可见性又在哪里</text><rect x=\"60\" y=\"58\" width=\"790\" height=\"92\" rx=\"3\" fill=\"#EBF1EE\" stroke=\"#EBF1EE\" stroke-width=\"1.0\" /><text x=\"82\" y=\"92\" class=\"sv serif\" text-anchor=\"start\" font-size=\"20.0\" fill=\"#1B2B33\" font-weight=\"600\" >索引层</text><text x=\"82\" y=\"118\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >key + INCLUDE + heap TID</text><text x=\"82\" y=\"138\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >能给出列值，给不出事务可见性</text><rect x=\"60\" y=\"160\" width=\"790\" height=\"92\" rx=\"3\" fill=\"#A4C4C6\" stroke=\"#A4C4C6\" stroke-width=\"1.0\" /><text x=\"82\" y=\"194\" class=\"sv serif\" text-anchor=\"start\" font-size=\"20.0\" fill=\"#1B2B33\" font-weight=\"600\" >VM 摘要层</text><text x=\"82\" y=\"220\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >_vm fork · 每页 2 bit</text><text x=\"82\" y=\"240\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >保守地证明整个 heap page 是否 all-visible</text><rect x=\"60\" y=\"262\" width=\"790\" height=\"92\" rx=\"3\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.0\" /><text x=\"82\" y=\"296\" class=\"sv serif\" text-anchor=\"start\" font-size=\"20.0\" fill=\"#FFFFFF\" font-weight=\"600\" >Heap 层</text><text x=\"82\" y=\"322\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"400\" >tuple + xmin / xmax + 全部列</text><text x=\"82\" y=\"342\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#FFFFFF\" font-weight=\"400\" >MVCC 可见性的最终出处</text><line x1=\"850\" y1=\"104\" x2=\"884\" y2=\"104\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><line x1=\"850\" y1=\"206\" x2=\"884\" y2=\"206\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><line x1=\"850\" y1=\"308\" x2=\"884\" y2=\"308\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><line x1=\"884\" y1=\"104\" x2=\"884\" y2=\"308\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><line x1=\"884\" y1=\"206\" x2=\"915.6\" y2=\"206\" stroke=\"#245A6B\" stroke-width=\"2.0\"/><polygon points=\"922,206 914,201.6 914,210.4\" fill=\"#245A6B\"/><rect x=\"922\" y=\"58\" width=\"418\" height=\"302\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"946\" y=\"96\" class=\"sv serif\" text-anchor=\"start\" font-size=\"24.0\" fill=\"#245A6B\" font-weight=\"700\" >Index Only Scan</text><line x1=\"946\" y1=\"112\" x2=\"1316\" y2=\"112\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"946\" y=\"146\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#BE653B\" font-weight=\"600\" >不是「永不读表」的承诺</text><text x=\"946\" y=\"178\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#46585F\" font-weight=\"400\" >而是「优先从索引取数，</text><text x=\"946\" y=\"204\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#46585F\" font-weight=\"400\" >并用 visibility map 尽量</text><text x=\"946\" y=\"230\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#46585F\" font-weight=\"400\" >避免 heap 访问」的执行策略</text><rect x=\"946\" y=\"256\" width=\"370\" height=\"38\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.0\" /><text x=\"958\" y=\"281\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#2F7A66\" font-weight=\"400\" >VM 命中 → 直接用索引 tuple 填 slot</text><rect x=\"946\" y=\"302\" width=\"370\" height=\"38\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.0\" /><text x=\"958\" y=\"327\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"400\" >VM 未命中 → 仍要回表确认可见性</text><text x=\"60\" y=\"392\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >色阶越深＝越底层。索引层与 VM 层都是摘要，只有 heap 持有一行的完整 MVCC 状态。</text></svg>","ctrl":null},{"eyebrow":"第一章 · 缺口","title":"可见性信息，压根不在索引条目里","lede":"把索引条目和 heap tuple 并排摊开看，缺口非常直白：一边有值，一边有 MVCC 状态。","caption":"图 2　索引条目保存 key、INCLUDE 与 TID；xmin / xmax 只在 heap tuple 上。","bridge":"缺口找到了，那这个缺口在真实查询里会变成多大的一笔成本？","notes":"为什么会多此一举？咱们把两样东西并排摊开。左边是索引条目：key 列、INCLUDE 列，外加一个 heap TID，告诉你「去第几页第几项找」。右边是 heap 元组：xmin、xmax 这些插入删除的事务 ID，版本链信息，还有全部列值。\n\n你会立刻发现，索引里没有 xmin、也没有 xmax。PostgreSQL 官方文档说得很干脆：可见性信息不存索引条目，只存 heap 条目。这就是整个问题的根。\n\n有人会反驳：我 WHERE 条件写在索引列上，SELECT 的列也全在索引里，凭什么还要读表？因为查询要的不只是「值」，还要「这个值对当前 snapshot 是有效的」。一个刚被别的事务删掉、但还没被清理的行，索引里可能还留着它的 TID；如果执行器不问 heap，就可能把不该看见的行返回给用户。\n\n所以这个缺口不是实现偷懒，是 MVCC 的代价：索引负责定位，heap 负责裁决。理解这一点，后面所有设计就都不神秘了。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><text x=\"40\" y=\"32\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >图 2　索引条目里没有 MVCC 可见性</text><rect x=\"60\" y=\"62\" width=\"500\" height=\"216\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"82\" y=\"94\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#245A6B\" font-weight=\"600\" >索引条目 · index tuple</text><line x1=\"82\" y1=\"108\" x2=\"538\" y2=\"108\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><rect x=\"82\" y=\"122\" width=\"456\" height=\"40\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"96\" y=\"148\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"600\" >key 列</text><text x=\"256\" y=\"148\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >customer_id / created_at</text><rect x=\"82\" y=\"170\" width=\"456\" height=\"40\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"96\" y=\"196\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"600\" >INCLUDE 列</text><text x=\"256\" y=\"196\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >amount / status</text><rect x=\"82\" y=\"218\" width=\"456\" height=\"40\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"96\" y=\"244\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"600\" >heap TID</text><text x=\"256\" y=\"244\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >指向 heap page + item</text><rect x=\"840\" y=\"62\" width=\"500\" height=\"216\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"862\" y=\"94\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#245A6B\" font-weight=\"600\" >Heap 元组 · heap tuple</text><line x1=\"862\" y1=\"108\" x2=\"1318\" y2=\"108\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><rect x=\"862\" y=\"122\" width=\"456\" height=\"40\" rx=\"3\" fill=\"#EBF1EE\" stroke=\"#EBF1EE\" stroke-width=\"1.0\" /><text x=\"876\" y=\"148\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"600\" >xmin / xmax</text><text x=\"1050\" y=\"148\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >插入与删除的事务 ID</text><rect x=\"862\" y=\"170\" width=\"456\" height=\"40\" rx=\"3\" fill=\"#EBF1EE\" stroke=\"#EBF1EE\" stroke-width=\"1.0\" /><text x=\"876\" y=\"196\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"600\" >cmin / cmax / ctid</text><text x=\"1050\" y=\"196\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >版本链与更新信息</text><rect x=\"862\" y=\"218\" width=\"456\" height=\"40\" rx=\"3\" fill=\"#EBF1EE\" stroke=\"#EBF1EE\" stroke-width=\"1.0\" /><text x=\"876\" y=\"244\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"600\" >全部列值</text><text x=\"1050\" y=\"244\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >包含未进索引的 payload</text><line x1=\"560\" y1=\"170\" x2=\"620\" y2=\"170\" stroke=\"#BE653B\" stroke-width=\"2.0\"/><line x1=\"780\" y1=\"170\" x2=\"840\" y2=\"170\" stroke=\"#BE653B\" stroke-width=\"2.0\"/><rect x=\"620\" y=\"122\" width=\"160\" height=\"96\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#BE653B\" stroke-width=\"1.6\" /><text x=\"700\" y=\"158\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"18.0\" fill=\"#BE653B\" font-weight=\"600\" >缺　口</text><text x=\"700\" y=\"186\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#BE653B\" font-weight=\"400\" >xmin / xmax</text><text x=\"700\" y=\"204\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >不在索引里</text><rect x=\"60\" y=\"300\" width=\"1280\" height=\"62\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"78\" y=\"336.95\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#BE653B\" font-weight=\"600\" >结论</text><text x=\"232\" y=\"335.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >WHERE 条件和返回列都在索引里，也只解决了「值」；执行器还必须证明这一行对当前 snapshot 可见。</text><text x=\"60\" y=\"392\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >PostgreSQL 文档：Visibility information is not stored in index entries, only in heap entries.</text></svg>","ctrl":null},{"eyebrow":"第一章 · 成本","title":"真正贵的不是搜索引，是逐条随机回表","lede":"候选行一多、TID 一分散，回表就把顺序的索引访问变成了大量随机 heap I/O。","caption":"图 3　两条成本链路对齐后，被省掉的是「逐条 TID 回表」这一段。","bridge":"那这笔成本能省掉吗？能，但得同时满足三个条件——我们一个一个过。","notes":"把一笔查询的账算细一点。普通 Index Scan 是四步：搜索引拿候选 TID，按 TID 逐条回表，检查 MVCC 可见性，再从 heap tuple 里投影出返回列。\n\n关键在于第二步。索引里匹配的行通常挨得很近，可它们指向的 heap 行可能散落在表的各个角落。于是「顺序读索引」后面跟着的是「到处乱跳读 heap」。候选行越多、TID 越分散、heap page 越不在缓存里，这一步就越贵。Bitmap Heap Scan 试图按 page 排序来缓解，但也只是缓解。\n\nIndex Only Scan 就是把这一段尽量拿掉：搜索引的时候顺便把 index tuple 取回来，然后去查一个很小的摘要，如果摘要能证明可见，直接用索引里的值填 slot。文档里有个很形象的说法——VM 比它描述的 heap 小大约四个数量级，多数时候整个地图都能待在内存里。\n\n当然，天下没有免费午餐。你得把返回列搬进索引，得指望 VM 位够高，得接受更贵的写入和更大的索引体积。所以它不是给所有查询加速，只把「读多写少、列可覆盖、可见性稳定」这一类访问做得更省 I/O。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><text x=\"40\" y=\"32\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >图 3　被省掉的那一段：逐条随机回表</text><rect x=\"40\" y=\"56\" width=\"190\" height=\"74\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#F1EFE9\" stroke-width=\"1.0\" /><text x=\"56\" y=\"88\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"600\" >普通 Index Scan</text><text x=\"56\" y=\"112\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >成本链路</text><rect x=\"250\" y=\"56\" width=\"232\" height=\"74\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"266\" y=\"88\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"600\" >① 搜索索引</text><text x=\"266\" y=\"112\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >拿到候选 TID</text><line x1=\"486\" y1=\"93\" x2=\"514.4\" y2=\"93\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><polygon points=\"520,93 513,89.15 513,96.85\" fill=\"#7BA6AF\"/><rect x=\"524\" y=\"56\" width=\"232\" height=\"74\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\" /><text x=\"540\" y=\"88\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#BE653B\" font-weight=\"600\" >② 逐条 TID 回表</text><text x=\"540\" y=\"112\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >随机 heap page I/O</text><line x1=\"760\" y1=\"93\" x2=\"788.4\" y2=\"93\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><polygon points=\"794,93 787,89.15 787,96.85\" fill=\"#7BA6AF\"/><rect x=\"798\" y=\"56\" width=\"232\" height=\"74\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"814\" y=\"88\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"600\" >③ 检查 MVCC</text><text x=\"814\" y=\"112\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >读 heap tuple 可见性</text><line x1=\"1034\" y1=\"93\" x2=\"1062.4\" y2=\"93\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><polygon points=\"1068,93 1061,89.15 1061,96.85\" fill=\"#7BA6AF\"/><rect x=\"1072\" y=\"56\" width=\"232\" height=\"74\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"1088\" y=\"88\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"600\" >④ 取返回列</text><text x=\"1088\" y=\"112\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >从 heap tuple 投影</text><rect x=\"40\" y=\"164\" width=\"190\" height=\"74\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"56\" y=\"196\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"600\" >Index Only Scan</text><text x=\"56\" y=\"220\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >成本链路</text><rect x=\"250\" y=\"164\" width=\"232\" height=\"74\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"266\" y=\"196\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"600\" >① 搜索索引</text><text x=\"266\" y=\"220\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >拿到 TID + index tuple</text><line x1=\"486\" y1=\"201\" x2=\"514.4\" y2=\"201\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><polygon points=\"520,201 513,197.15 513,204.85\" fill=\"#7BA6AF\"/><rect x=\"524\" y=\"164\" width=\"232\" height=\"74\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"540\" y=\"196\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"600\" >② 检查 VM bit</text><text x=\"540\" y=\"220\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >摘要比 heap 小约四个数量级</text><line x1=\"760\" y1=\"201\" x2=\"788.4\" y2=\"201\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><polygon points=\"794,201 787,197.15 787,204.85\" fill=\"#7BA6AF\"/><rect x=\"798\" y=\"164\" width=\"232\" height=\"74\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"814\" y=\"196\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"600\" >③ 从索引返回列</text><text x=\"814\" y=\"220\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >命中则不用读 heap</text><rect x=\"40\" y=\"272\" width=\"1280\" height=\"66\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><rect x=\"40\" y=\"272\" width=\"6\" height=\"66\" rx=\"0\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1.0\" /><text x=\"64\" y=\"300\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#2F7A66\" font-weight=\"600\" >省下的成本</text><text x=\"64\" y=\"324\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >候选行多、TID 分散、heap page 不在缓存时，回表就是大量随机 I/O。</text><rect x=\"40\" y=\"352\" width=\"1280\" height=\"52\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"58\" y=\"383.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#BE653B\" font-weight=\"600\" >代价也很明确</text><text x=\"252\" y=\"382.725\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >需要更宽的覆盖索引；VM 位不够高时仍回表；热更新表收益不稳定；写入、WAL、缓存与索引体积变差。</text></svg>","ctrl":null},{"eyebrow":"第二章 · 三个条件","title":"两道物理闸门，一道成本闸门","lede":"前两道决定「能不能生成这个计划」，第三道决定「跑起来到底划不划算」。把它们分开，很多困惑就消失了。","caption":"图 4　三道闸门：AM 能力、列覆盖、VM 命中率。","bridge":"先看前两道里最容易被低估的一道：到底什么叫「查询需要的列」？","notes":"很多同学 debug 的时候会混在一起问：我都建了覆盖索引了，怎么还是回表？其实这里有三道完全不同的闸门，混在一起就永远说不清。\n\n第一道，访问方法能不能返回原始列值。B-tree 总是可以；GiST、SP-GiST 要看 opclass；GIN 只存原值的一部分，压根重构不出来。这是「物理上能不能」。\n\n第二道，查询需要的列是不是都在索引里。这听着简单，但「需要」二字比大家想得宽——不只是 SELECT 后面那几列，还包括过滤条件、连接条件、以及运行期还得再检查一遍的条件。这是「针对这条 SQL 能不能」。\n\n前两道都过了，优化器才会生成 index-only path。注意，到这儿还只是「计划形态可行」。第三道闸门在执行期：目标 heap page 的 all-visible 位命中率够不够高。不够高，计划名照样叫 Index Only Scan，Heap Fetches 照样很高。\n\n所以我特别喜欢把这三道分开讲：前两道失败，你连计划都看不到；第三道失败，你看到计划却拿不到收益。现象不同，排查方向也完全不同。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><text x=\"40\" y=\"32\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >图 4　两道「物理可行」闸门 + 一道「实际划算」闸门</text><rect x=\"40\" y=\"52\" width=\"1000\" height=\"94\" rx=\"3\" fill=\"#CFE0DC\" stroke=\"#CFE0DC\" stroke-width=\"1.0\" /><text x=\"60\" y=\"84\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"600\" >闸门一</text><text x=\"60\" y=\"112\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#245A6B\" font-weight=\"600\" >索引访问方法能返回原值</text><text x=\"60\" y=\"134\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >B-tree 总是支持；GiST / SP-GiST 看 opclass；GIN 只存原值片段</text><line x1=\"1040\" y1=\"99\" x2=\"1080\" y2=\"99\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><circle cx=\"1080\" cy=\"99\" r=\"3.6\" fill=\"#7BA6AF\"/><rect x=\"40\" y=\"164\" width=\"1000\" height=\"94\" rx=\"3\" fill=\"#A4C4C6\" stroke=\"#A4C4C6\" stroke-width=\"1.0\" /><text x=\"60\" y=\"196\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"600\" >闸门二</text><text x=\"60\" y=\"224\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#1B2B33\" font-weight=\"600\" >查询需要的列都在索引中</text><text x=\"60\" y=\"246\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >输出列 + 过滤列 + 连接列 + 运行期仍需检查的条件</text><line x1=\"1040\" y1=\"211\" x2=\"1080\" y2=\"211\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><circle cx=\"1080\" cy=\"211\" r=\"3.6\" fill=\"#7BA6AF\"/><rect x=\"40\" y=\"276\" width=\"1000\" height=\"94\" rx=\"3\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1.0\" /><text x=\"60\" y=\"308\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#AE8A3E\" font-weight=\"600\" >闸门三</text><text x=\"60\" y=\"336\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#1B2B33\" font-weight=\"600\" >目标 heap page 的 all-visible 命中率要高</text><text x=\"60\" y=\"358\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >决定执行期是否真的少读 heap，不决定计划能否生成</text><line x1=\"1040\" y1=\"323\" x2=\"1080\" y2=\"323\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><circle cx=\"1080\" cy=\"323\" r=\"3.6\" fill=\"#7BA6AF\"/><line x1=\"1080\" y1=\"99\" x2=\"1080\" y2=\"323\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><line x1=\"1080\" y1=\"211\" x2=\"1109.6\" y2=\"211\" stroke=\"#245A6B\" stroke-width=\"2.0\"/><polygon points=\"1116,211 1108,206.6 1108,215.4\" fill=\"#245A6B\"/><rect x=\"1116\" y=\"132\" width=\"224\" height=\"158\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"1136\" y=\"166\" class=\"sv serif\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#2F7A66\" font-weight=\"600\" >都过了</text><text x=\"1136\" y=\"196\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >生成 index-only path</text><text x=\"1136\" y=\"220\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >且成本竞争胜出</text><text x=\"1136\" y=\"258\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#2F7A66\" font-weight=\"400\" >→ 真正少读 heap</text><rect x=\"40\" y=\"372\" width=\"1300\" height=\"42\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"58\" y=\"398.25\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"600\" >任一未过</text><text x=\"212\" y=\"397.55\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >前两道失败：不生成 index-only path；第三道失败：计划名仍是 Index Only Scan，但 Heap Fetches 很高。</text></svg>","ctrl":null},{"eyebrow":"第二章 · 覆盖判断","title":"check_index_only() 其实只做了一次子集判断","lede":"把「查询需要的列」和「索引能返回的列」画成两个集合，逻辑一下就清楚了。","caption":"图 5　attrs_used ⊆ index_canreturn_attrs 才生成 index-only path。","bridge":"集合里的「可返回列」由访问方法决定，那不同索引类型的能力差别有多大？","notes":"我们把源码里那件事翻译成人话。indxpath.c 里有个 check_index_only()，它干的事本质上就一句话：收集这条查询真正需要的属性，看它是不是「索引可返回列集合」的子集。是，物理可行；不是，连 path 都不生成。\n\n难就难在左边这个集合。你写 SELECT created_at, amount, status，脑子里想的是三列；但 planner 还要算上 WHERE customer_id = ... 里的列、JOIN 条件里的列，以及那些没法在索引层证明、运行期必须 recheck 的条件。少算一个，就会误判。\n\n右边这个集合也不只是 key 列。有了 INCLUDE 之后，key 列加非 key 的 payload 列，一起构成「索引能返回的列」。所以覆盖索引的思路特别朴素：把左边这个集合里、还没进索引的那几列，搬到右边来。\n\n还有几个例外值得记一下：部分索引的 predicate 如果能被证明隐含，运行期就不必再检查那个条件，PG 9.6 以后能识别；表达式索引则反过来，planner 目前主要按「列是否可用」判断，f(x) 这种场景有时得额外 INCLUDE (x) 才肯放行。另外 INCLUDE 里不能写表达式，非 key 列也不能拿来做搜索条件。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><text x=\"40\" y=\"32\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >图 5　check_index_only() 的本质是一次子集判断</text><rect x=\"60\" y=\"62\" width=\"800\" height=\"280\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.4\" /><text x=\"84\" y=\"96\" class=\"sv serif\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#245A6B\" font-weight=\"600\" >index_canreturn_attrs · 索引能返回的列</text><rect x=\"92\" y=\"118\" width=\"340\" height=\"54\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"108\" y=\"142\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"400\" >key 列（搜索 / 排序）</text><text x=\"108\" y=\"162\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >customer_id, created_at</text><rect x=\"452\" y=\"118\" width=\"376\" height=\"54\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"468\" y=\"142\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"400\" >INCLUDE 列（payload）</text><text x=\"468\" y=\"162\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >amount, status</text><rect x=\"120\" y=\"206\" width=\"680\" height=\"108\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#2F7A66\" stroke-width=\"1.8\" /><text x=\"142\" y=\"234\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#2F7A66\" font-weight=\"600\" >attrs_used · 查询真正需要的列</text><rect x=\"142\" y=\"250\" width=\"148\" height=\"48\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1.0\" /><text x=\"154\" y=\"270\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#2F7A66\" font-weight=\"600\" >输出列</text><text x=\"154\" y=\"288\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >SELECT</text><rect x=\"304\" y=\"250\" width=\"148\" height=\"48\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1.0\" /><text x=\"316\" y=\"270\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#2F7A66\" font-weight=\"600\" >过滤列</text><text x=\"316\" y=\"288\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >WHERE</text><rect x=\"466\" y=\"250\" width=\"148\" height=\"48\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1.0\" /><text x=\"478\" y=\"270\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#2F7A66\" font-weight=\"600\" >连接列</text><text x=\"478\" y=\"288\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >JOIN</text><rect x=\"628\" y=\"250\" width=\"148\" height=\"48\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1.0\" /><text x=\"640\" y=\"270\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#2F7A66\" font-weight=\"600\" >运行期检查</text><text x=\"640\" y=\"288\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >需 recheck</text><text x=\"460\" y=\"332\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >「需要的列」比想象中多：不只是 SELECT 后面那几个</text><rect x=\"900\" y=\"62\" width=\"440\" height=\"128\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"922\" y=\"94\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#89938F\" font-weight=\"600\" >判定式</text><text x=\"922\" y=\"128\" class=\"sv mono\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#245A6B\" font-weight=\"600\" >attrs_used ⊆ canreturn</text><text x=\"922\" y=\"158\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#2F7A66\" font-weight=\"400\" >成立 → 物理可行，生成 index-only path</text><rect x=\"900\" y=\"208\" width=\"440\" height=\"134\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.0\" /><text x=\"922\" y=\"238\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#BE653B\" font-weight=\"600\" >两个容易踩的例外</text><text x=\"922\" y=\"266\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.9\" fill=\"#46585F\" font-weight=\"400\" >· 部分索引 predicate 能被证明隐含时，运行期无需再检查（PG 9.6+）</text><text x=\"922\" y=\"292\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >· 表达式索引：planner 按「列是否可用」判断，有时要额外 INCLUDE (x)</text><text x=\"922\" y=\"320\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.6\" fill=\"#46585F\" font-weight=\"400\" >· INCLUDE 不能写表达式；非 key 列也不能作为 search qualification</text><text x=\"60\" y=\"392\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >源码：indxpath.c:check_index_only()；文档：11.9 Index-Only Scans and Covering Indexes。</text></svg>","ctrl":null},{"eyebrow":"第二章 · 访问方法","title":"谁能把「原始值」交回来，谁才有资格","lede":"覆盖索引不是所有索引类型的通用能力，它卡在 amcanreturn 这个接口上。","caption":"图 6　六种访问方法的 index-only scan 能力矩阵。","bridge":"知道了 B-tree 最稳，接下来看覆盖索引在 B-tree 里究竟长什么样。","notes":"为什么不是所有索引都能玩覆盖？因为文档给的是一条很硬的要求：索引必须物理存储、或者能够重构每个条目的原始数据值。\n\nB-tree 最老实，条目里就是原值，所以总是支持。GiST 和 SP-GiST 是「看 opclass」，有的 opclass 带 fetch、compress 这类能力，能把原值还原回来，有的不行；源码里 gistcanreturn() 就在判断这件事。GIN 是最典型的反例，它一个条目通常只保存原值的一部分片段，你想重构都重构不出来，文档直接点名说它不支持 index-only scan。BRIN 存的是页面区间摘要，Hash 存的是哈希值，同样交不回原值。\n\n顺带补一句容易混的：INCLUDE 子句本身目前也只有 B-tree、GiST、SP-GiST 三种访问方法支持。所以网上那些「给 GIN 加个 INCLUDE 就能不回表」的说法，方向就错了。\n\n这也解释了为什么拿 R-tree、GiST 这类空间索引做类比时要小心。空间索引的关键从来不是「树能不能定位候选对象」，而是「访问方法能不能返回原值」，以及「heap 可见性能不能被 VM 证明」。两个问题，一个都不能少。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><text x=\"40\" y=\"30\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >图 6　能不能把「原始值」交回来，决定访问方法的能力边界</text><rect x=\"40\" y=\"48\" width=\"200\" height=\"44\" rx=\"0\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"54\" y=\"74.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"600\" >索引类型</text><rect x=\"240\" y=\"48\" width=\"210\" height=\"44\" rx=\"0\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"254\" y=\"74.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"600\" >Index-Only Scan</text><rect x=\"450\" y=\"48\" width=\"990\" height=\"44\" rx=\"0\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"464\" y=\"74.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"600\" >原因 / 源码依据</text><rect x=\"40\" y=\"92\" width=\"200\" height=\"44\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"54\" y=\"118.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"600\" >B-tree</text><rect x=\"240\" y=\"92\" width=\"210\" height=\"44\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"254\" y=\"118.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#2F7A66\" font-weight=\"400\" >总是支持</text><rect x=\"450\" y=\"92\" width=\"990\" height=\"44\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"464\" y=\"118.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >索引条目物理保存原值，amcanreturn 可用</text><rect x=\"40\" y=\"136\" width=\"200\" height=\"44\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"54\" y=\"162.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"600\" >GiST</text><rect x=\"240\" y=\"136\" width=\"210\" height=\"44\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"254\" y=\"162.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#AE8A3E\" font-weight=\"400\" >部分 opclass</text><rect x=\"450\" y=\"136\" width=\"990\" height=\"44\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"464\" y=\"162.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >依赖 fetch / compress 能力，gistcanreturn() 判断</text><rect x=\"40\" y=\"180\" width=\"200\" height=\"44\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"54\" y=\"206.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"600\" >SP-GiST</text><rect x=\"240\" y=\"180\" width=\"210\" height=\"44\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"254\" y=\"206.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#AE8A3E\" font-weight=\"400\" >部分 opclass</text><rect x=\"450\" y=\"180\" width=\"990\" height=\"44\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"464\" y=\"206.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >同样取决于该 opclass 能否重构原值</text><rect x=\"40\" y=\"224\" width=\"200\" height=\"44\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"54\" y=\"250.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"600\" >GIN</text><rect x=\"240\" y=\"224\" width=\"210\" height=\"44\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"254\" y=\"250.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"400\" >不支持</text><rect x=\"450\" y=\"224\" width=\"990\" height=\"44\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"464\" y=\"250.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >每个条目通常只保存原值的一部分，无法重构</text><rect x=\"40\" y=\"268\" width=\"200\" height=\"44\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"54\" y=\"294.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"600\" >BRIN</text><rect x=\"240\" y=\"268\" width=\"210\" height=\"44\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"254\" y=\"294.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"400\" >不支持</text><rect x=\"450\" y=\"268\" width=\"990\" height=\"44\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"464\" y=\"294.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >保存的是页面区间摘要，不是原始列值</text><rect x=\"40\" y=\"312\" width=\"200\" height=\"44\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"54\" y=\"338.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"600\" >Hash</text><rect x=\"240\" y=\"312\" width=\"210\" height=\"44\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"254\" y=\"338.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"400\" >不支持</text><rect x=\"450\" y=\"312\" width=\"990\" height=\"44\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"464\" y=\"338.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >只保存哈希值，无法还原原值</text><rect x=\"40\" y=\"48\" width=\"1400\" height=\"308\" rx=\"0\" fill=\"none\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><rect x=\"40\" y=\"366\" width=\"1360\" height=\"44\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1.0\" /><text x=\"58\" y=\"393.25\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#AE8A3E\" font-weight=\"600\" >补充</text><text x=\"172\" y=\"392.55\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >INCLUDE 列目前只有 B-tree、GiST、SP-GiST 支持；R-tree 类空间索引仍要回到「访问方法能否返回原值」这个问题。</text></svg>","ctrl":null},{"eyebrow":"第三章 · 覆盖索引","title":"key 负责找，INCLUDE 只负责交","lede":"把返回列搬进索引，靠的是 PostgreSQL 11 之后的 INCLUDE；它和 key 列在树里的位置、语义都不一样。","caption":"图 7　B-tree upper-level 只留导航 key，非 key 列只出现在对应 heap tuple 的 leaf tuple 中。","bridge":"结构清楚了，把它套回一条具体的列表页 SQL，看看每一段各自在干什么。","notes":"覆盖索引怎么把列搬进去？最直接的写法是 CREATE INDEX ... INCLUDE (...)。但很多人以为 INCLUDE 列和 key 列差不多，只是「多加几列」，这个误会后面会引出好几个坑。\n\n看 B-tree 的物理结构。upper-level 的导航 tuple 只保留 key，文档里叫 suffix truncation——非 key 列总会被从上层裁掉，因为它们不参与引导搜索。只有对应某个 heap tuple 的 leaf index tuple 里，才带着 INCLUDE 列的值。\n\n语义上的差别更要紧。key 列参与搜索、排序，也参与唯一性约束；INCLUDE 列只是 payload，不能作为 index scan 的 search qualification。所以 CREATE UNIQUE INDEX ON tab(x) INCLUDE (y)，唯一性只约束 x，不约束 (x, y)，这一点踩过的人不少。\n\n代价也写在这儿：索引变宽，占用更多 buffer 和磁盘，写入更贵，更新 payload 列还可能破坏 HOT 更新机会；而且文档明说，带非 key 列的 B-tree 不使用 deduplication；索引 tuple 超出访问方法限制时，插入会直接失败。所以宽列、大 JSON、大 text 往 INCLUDE 里塞，是典型的得不偿失。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><text x=\"40\" y=\"30\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >图 7　key 与 INCLUDE 在 B-tree 里的分工</text><text x=\"40\" y=\"60\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"500\" >CREATE INDEX ON orders (customer_id, created_at) INCLUDE (amount, status);</text><rect x=\"390\" y=\"76\" width=\"620\" height=\"62\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"410\" y=\"102\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"600\" >upper-level 导航 tuple：只保留 key</text><text x=\"410\" y=\"124\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >suffix truncation 总会移除非 key 列</text><line x1=\"700\" y1=\"138\" x2=\"700\" y2=\"159.6\" stroke=\"#245A6B\" stroke-width=\"2.0\"/><polygon points=\"700,166 695.6,158 704.4,158\" fill=\"#245A6B\"/><rect x=\"60\" y=\"166\" width=\"1280\" height=\"118\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"80\" y=\"192\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"600\" >leaf index tuple（对应一个 heap tuple）</text><rect x=\"80\" y=\"206\" width=\"150\" height=\"60\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"92\" y=\"242\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"600\" >heap TID</text><rect x=\"230\" y=\"206\" width=\"230\" height=\"60\" rx=\"0\" fill=\"#EBF1EE\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"242\" y=\"242\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" >key: customer_id</text><rect x=\"460\" y=\"206\" width=\"230\" height=\"60\" rx=\"0\" fill=\"#EBF1EE\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"472\" y=\"242\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" >key: created_at</text><rect x=\"690\" y=\"206\" width=\"210\" height=\"60\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"702\" y=\"242\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#BE653B\" font-weight=\"600\" >INCLUDE: amount</text><rect x=\"900\" y=\"206\" width=\"210\" height=\"60\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"912\" y=\"242\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#BE653B\" font-weight=\"600\" >INCLUDE: status</text><rect x=\"1110\" y=\"206\" width=\"210\" height=\"60\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"1122\" y=\"242\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"600\" >…… 其他 tuple</text><rect x=\"60\" y=\"304\" width=\"410\" height=\"74\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1.0\" /><text x=\"78\" y=\"332\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#2F7A66\" font-weight=\"600\" >key 列</text><text x=\"78\" y=\"358\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >参与搜索、排序、唯一性语义</text><rect x=\"490\" y=\"304\" width=\"410\" height=\"74\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"508\" y=\"332\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" >INCLUDE 列</text><text x=\"508\" y=\"358\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >只是 payload，不能作为 search qualification</text><rect x=\"920\" y=\"304\" width=\"410\" height=\"74\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"938\" y=\"332\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#BE653B\" font-weight=\"600\" >代价</text><text x=\"938\" y=\"358\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.4\" fill=\"#46585F\" font-weight=\"400\" >更宽、写入更贵；含非 key 列时 B-tree 不使用 deduplication</text><text x=\"40\" y=\"408\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >UNIQUE INDEX ON tab(x) INCLUDE (y) 的唯一性只约束 x，不约束 (x, y)。</text></svg>","ctrl":null},{"eyebrow":"第三章 · 对位","title":"一条列表页 SQL，四段动作各归其位","lede":"过滤、排序、返回列、可见性证明——索引的每一段都对应 SQL 里的一个具体动作。","caption":"图 8　SQL 与索引结构的逐列对位；第四条是很多人漏掉的那一步。","bridge":"前三条都是「列覆盖」，第四条已经越界了：就算列全齐，执行器仍可能回表。","notes":"拿原文那条订单查询对齐一下，特别清楚。索引是 (customer_id, created_at) INCLUDE (amount, status)，SQL 是查某个客户最近 20 条订单的列表页。\n\ncustomer_id 是前导 key，负责把范围一下收窄；created_at 是第二个 key，负责顺序输出，配合 ORDER BY ... LIMIT 20 让索引边扫边早停，连排序都省了；amount 和 status 是 INCLUDE 列，从 leaf tuple 里直接读出来填进结果。\n\n到这儿，四个动作里前三个都归位了，列确实全在索引里。可图上我还画了第四条：VM all-visible。因为执行器拿到 TID 之后，还得回答「这一行现在能不能被我看见」。只有相关 heap pages 的 all-visible 位都设着，它才真的不用回表。\n\n这就是为什么我总说，覆盖索引解决的是「值从哪来」，解决不了「可见性怎么证明」。列全齐只是必要条件，不是充分条件。多查一列 payload、或者表刚被 UPDATE 过，前面三条再漂亮，第四条一样会把你拽回 heap。\n\n那执行器具体是怎么问这一句的？下一页我们把主路径拆开。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><text x=\"40\" y=\"30\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >图 8　索引的每一段，都对应 SQL 里的一个动作</text><rect x=\"40\" y=\"52\" width=\"560\" height=\"128\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"58\" y=\"78\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"600\" >CREATE INDEX orders_cover</text><text x=\"58\" y=\"104\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >  ON orders (customer_id, created_at)</text><text x=\"58\" y=\"130\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >  INCLUDE (amount, status);</text><text x=\"58\" y=\"158\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" >覆盖索引定义</text><rect x=\"40\" y=\"196\" width=\"560\" height=\"176\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"58\" y=\"222\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >SELECT created_at, amount, status</text><text x=\"58\" y=\"248\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >FROM orders</text><text x=\"58\" y=\"274\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >WHERE customer_id = 1001</text><text x=\"58\" y=\"300\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >ORDER BY created_at LIMIT 20;</text><text x=\"58\" y=\"340\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" >一条列表页查询</text><rect x=\"700\" y=\"52\" width=\"640\" height=\"72\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"720\" y=\"82\" class=\"sv mono\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"600\" >① customer_id</text><text x=\"720\" y=\"108\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >key 列：定位到目标区间</text><rect x=\"700\" y=\"140\" width=\"640\" height=\"72\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"720\" y=\"170\" class=\"sv mono\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"600\" >② created_at</text><text x=\"720\" y=\"196\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >key 列：顺序输出，LIMIT 早停</text><rect x=\"700\" y=\"228\" width=\"640\" height=\"72\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1.0\" /><text x=\"720\" y=\"258\" class=\"sv mono\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#2F7A66\" font-weight=\"600\" >③ amount / status</text><text x=\"720\" y=\"284\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >INCLUDE 列：从 leaf tuple 直接返回</text><rect x=\"700\" y=\"316\" width=\"640\" height=\"72\" rx=\"3\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1.0\" /><text x=\"720\" y=\"346\" class=\"sv mono\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#AE8A3E\" font-weight=\"600\" >④ VM all-visible</text><text x=\"720\" y=\"372\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >命中才真正免去 heap 访问</text><polyline points=\"600,104 650.0,104 650.0,88 700,88\" fill=\"none\" stroke=\"#7BA6AF\" stroke-width=\"1.5\" stroke-linejoin=\"miter\"/><circle cx=\"700\" cy=\"88\" r=\"3.6\" fill=\"#7BA6AF\"/><polyline points=\"600,248 650.0,248 650.0,176 700,176\" fill=\"none\" stroke=\"#7BA6AF\" stroke-width=\"1.5\" stroke-linejoin=\"miter\"/><circle cx=\"700\" cy=\"176\" r=\"3.6\" fill=\"#7BA6AF\"/><polyline points=\"600,222 650.0,222 650.0,264 700,264\" fill=\"none\" stroke=\"#7BA6AF\" stroke-width=\"1.5\" stroke-linejoin=\"miter\"/><circle cx=\"700\" cy=\"264\" r=\"3.6\" fill=\"#7BA6AF\"/><polyline points=\"600,300 650.0,300 650.0,352 700,352\" fill=\"none\" stroke=\"#7BA6AF\" stroke-width=\"1.5\" stroke-linejoin=\"miter\"/><circle cx=\"700\" cy=\"352\" r=\"3.6\" fill=\"#7BA6AF\"/><text x=\"40\" y=\"410\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >前三条是「列能否覆盖」；第四条是「可见性能否被证明」——两者缺一不可。</text></svg>","ctrl":null},{"eyebrow":"第四章 · 执行链路","title":"先问 VM，证明不了就老实回表","lede":"IndexOnlyNext() 的主线其实很短，但它允许自己退化——这正是所有「计划叫 IOS 却还在回表」现象的出处。","caption":"图 9　命中 all-visible 直接填 slot；未命中调用 index_fetch_heap() 确认可见性。","bridge":"这个「证明」由谁出具？答案是一张很小、但非常保守的地图。","notes":"执行阶段看 nodeIndexonlyscan.c 的 IndexOnlyNext()。它先把 xs_want_itup 设成 true，意思是「索引访问方法请顺手把 index tuple 也给我」，然后拿到候选 TID 和这份索引元组。\n\n接下来不是直接返回，而是拿 TID 算出 heap block 号，去问 VM_ALL_VISIBLE()。位要是 1，就说明这个 page 上所有 tuple 对当前及未来的事务都可见，执行器可以直接用索引 tuple 填 slot，heap 一眼都不看。位要是 0，就调用 index_fetch_heap() 回表，去 heap tuple 上判断 MVCC 可见性。\n\n这里有个特别容易被忽略、但很能说明设计意图的细节：即便发生了 heap fetch，最终返回的数据源仍然优先是索引 tuple，不是 heap tuple。也就是说，回表的主要目的已经从「取返回列」变成了「确认可见性」。\n\n源码主线也顺一下：indxpath.c 判断可行性，createplan.c 用索引的 physical target list，costsize.c 估算成本，nodeIndexonlyscan.c 执行，visibilitymap.c 提供那两个 bit。计划和执行是一整套配合，不是某个开关一按就生效的魔法。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><text x=\"40\" y=\"28\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >图 9　执行器主路径：先问 VM，证明不了就回表</text><rect x=\"40\" y=\"148\" width=\"220\" height=\"84\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"150.0\" y=\"183.125\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" >索引访问方法</text><text x=\"150.0\" y=\"205.625\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >返回 TID + index tuple</text><rect x=\"300\" y=\"148\" width=\"220\" height=\"84\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"410.0\" y=\"183.125\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" >定位 heap block</text><text x=\"410.0\" y=\"205.625\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >由 TID 得到页面号</text><rect x=\"560\" y=\"148\" width=\"220\" height=\"84\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#AE8A3E\" stroke-width=\"1.1\" /><text x=\"670.0\" y=\"183.125\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#AE8A3E\" font-weight=\"600\" >检查 VM</text><text x=\"670.0\" y=\"205.625\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >VM_ALL_VISIBLE()</text><line x1=\"260\" y1=\"190\" x2=\"293.6\" y2=\"190\" stroke=\"#245A6B\" stroke-width=\"2.0\"/><polygon points=\"300,190 292,185.6 292,194.4\" fill=\"#245A6B\"/><line x1=\"520\" y1=\"190\" x2=\"553.6\" y2=\"190\" stroke=\"#245A6B\" stroke-width=\"2.0\"/><polygon points=\"560,190 552,185.6 552,194.4\" fill=\"#245A6B\"/><line x1=\"780\" y1=\"190\" x2=\"820\" y2=\"190\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><line x1=\"820\" y1=\"86\" x2=\"820\" y2=\"294\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><line x1=\"820\" y1=\"86\" x2=\"853.6\" y2=\"86\" stroke=\"#2F7A66\" stroke-width=\"2.0\"/><polygon points=\"860,86 852,81.6 852,90.4\" fill=\"#2F7A66\"/><line x1=\"820\" y1=\"294\" x2=\"853.6\" y2=\"294\" stroke=\"#BE653B\" stroke-width=\"2.0\"/><polygon points=\"860,294 852,289.6 852,298.4\" fill=\"#BE653B\"/><rect x=\"860\" y=\"48\" width=\"280\" height=\"76\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"1000.0\" y=\"79.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#2F7A66\" font-weight=\"600\" >AV=1 · 直接填 slot</text><text x=\"1000.0\" y=\"101.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >命中 all-visible，不访问 heap</text><rect x=\"860\" y=\"256\" width=\"280\" height=\"76\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.1\" /><text x=\"1000.0\" y=\"287.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"600\" >AV=0 · index_fetch_heap()</text><text x=\"1000.0\" y=\"309.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >到 heap 判断 MVCC 可见性</text><line x1=\"1140\" y1=\"86\" x2=\"1180\" y2=\"86\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><line x1=\"1140\" y1=\"294\" x2=\"1180\" y2=\"294\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><line x1=\"1180\" y1=\"86\" x2=\"1180\" y2=\"294\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><line x1=\"1180\" y1=\"190\" x2=\"1209.6\" y2=\"190\" stroke=\"#245A6B\" stroke-width=\"2.0\"/><polygon points=\"1216,190 1208,185.6 1208,194.4\" fill=\"#245A6B\"/><rect x=\"1216\" y=\"148\" width=\"144\" height=\"84\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"1288.0\" y=\"184.00375939849624\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >返回上层</text><text x=\"1288.0\" y=\"203.62781954887217\" class=\"sv s\" text-anchor=\"middle\" font-size=\"10.9\" fill=\"#46585F\" font-weight=\"400\" >Filter / Projection</text><rect x=\"40\" y=\"348\" width=\"1320\" height=\"62\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1.0\" /><text x=\"58\" y=\"384.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#AE8A3E\" font-weight=\"600\" >关键细节</text><text x=\"232\" y=\"383.725\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >即使发生 heap fetch，返回列仍优先来自索引 tuple；回表的主要目的是「确认可见性」，不是「取返回列」。</text></svg>","ctrl":null},{"eyebrow":"第四章 · VM","title":"每页两个 bit，一张极其保守的地图","lede":"它不是「每行一个 bit」，而是 heap relation 的 _vm fork，每个 heap page 两个 bit。","caption":"图 10　heap page ↔ VM 位的映射，以及「置位严格、清位保守」的规则。","bridge":"位既然这么关键，那它是怎么被清掉、又怎么被设回来的？","notes":"这张地图叫 visibility map，是 heap relation 旁边一个独立的 _vm fork。注意两个「不」：不是每行一个 bit，是每个 heap page 两个 bit；也不是索引的一部分——文档明确写着 indexes do not have VMs，它描述的是 heap page 的状态。\n\n两个 bit，一个 all-visible，一个 all-frozen。Index Only Scan 只关心第一个；VACUUM 和冻结还会用到第二个。\n\n最重要的是它的性格：保守。位设成 1，系统必须已经确认这个 page 真的满足条件；位没设，不代表这个 page 一定有不可见的 tuple，只代表系统「不能安全地用摘要证明它全可见」。为什么这么小心？因为位错误置位会直接导致错误结果——把不该看见的行返回出去。所以清位可以随便保守，置位必须严格。\n\n于是日常现象就都能解释了：刚批量导入、刚大量更新删除的数据，哪怕查询列完全被索引覆盖，也会有大量 Heap Fetches；跑一次 VACUUM 之后，同一条 SQL 的 Heap Fetches 可能明显下降，因为 VACUUM 维护了这张地图。文档还提到，可以用 pg_visibility 扩展去检查 VM 与页面的真实状态。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><text x=\"40\" y=\"28\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >图 10　_vm fork：每个 heap page 两个 bit</text><text x=\"40\" y=\"58\" class=\"sv serif\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"600\" >Heap fork（主数据）</text><text x=\"40\" y=\"196\" class=\"sv serif\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"600\" >VM fork（_vm）</text><rect x=\"40\" y=\"70\" width=\"300\" height=\"74\" rx=\"3\" fill=\"#EBF1EE\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"56\" y=\"98\" class=\"sv mono\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" >page 0</text><text x=\"56\" y=\"124\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >稳定数据</text><line x1=\"190\" y1=\"144\" x2=\"190\" y2=\"202.4\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><polygon points=\"190,208 186.15,201 193.85,201\" fill=\"#7BA6AF\"/><rect x=\"40\" y=\"208\" width=\"300\" height=\"92\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\" /><text x=\"56\" y=\"236\" class=\"sv mono\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#2F7A66\" font-weight=\"600\" >AV = 1</text><text x=\"56\" y=\"262\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#46585F\" font-weight=\"500\" >AF = 0</text><text x=\"56\" y=\"288\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >all-visible / all-frozen</text><rect x=\"370\" y=\"70\" width=\"300\" height=\"74\" rx=\"3\" fill=\"#EBF1EE\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"386\" y=\"98\" class=\"sv mono\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" >page 1</text><text x=\"386\" y=\"124\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >刚 UPDATE</text><line x1=\"520\" y1=\"144\" x2=\"520\" y2=\"202.4\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><polygon points=\"520,208 516.15,201 523.85,201\" fill=\"#7BA6AF\"/><rect x=\"370\" y=\"208\" width=\"300\" height=\"92\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\" /><text x=\"386\" y=\"236\" class=\"sv mono\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#BE653B\" font-weight=\"600\" >AV = 0</text><text x=\"386\" y=\"262\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#46585F\" font-weight=\"500\" >AF = 0</text><text x=\"386\" y=\"288\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >all-visible / all-frozen</text><rect x=\"700\" y=\"70\" width=\"300\" height=\"74\" rx=\"3\" fill=\"#EBF1EE\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"716\" y=\"98\" class=\"sv mono\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" >page 2</text><text x=\"716\" y=\"124\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >冻结过的页</text><line x1=\"850\" y1=\"144\" x2=\"850\" y2=\"202.4\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><polygon points=\"850,208 846.15,201 853.85,201\" fill=\"#7BA6AF\"/><rect x=\"700\" y=\"208\" width=\"300\" height=\"92\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\" /><text x=\"716\" y=\"236\" class=\"sv mono\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#2F7A66\" font-weight=\"600\" >AV = 1</text><text x=\"716\" y=\"262\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#46585F\" font-weight=\"500\" >AF = 1</text><text x=\"716\" y=\"288\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >all-visible / all-frozen</text><rect x=\"1030\" y=\"70\" width=\"300\" height=\"74\" rx=\"3\" fill=\"#EBF1EE\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"1046\" y=\"98\" class=\"sv mono\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" >page 3</text><text x=\"1046\" y=\"124\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >刚批量导入</text><line x1=\"1180\" y1=\"144\" x2=\"1180\" y2=\"202.4\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><polygon points=\"1180,208 1176.15,201 1183.85,201\" fill=\"#7BA6AF\"/><rect x=\"1030\" y=\"208\" width=\"300\" height=\"92\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\" /><text x=\"1046\" y=\"236\" class=\"sv mono\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#BE653B\" font-weight=\"600\" >AV = 0</text><text x=\"1046\" y=\"262\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#46585F\" font-weight=\"500\" >AF = 0</text><text x=\"1046\" y=\"288\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >all-visible / all-frozen</text><rect x=\"40\" y=\"318\" width=\"420\" height=\"66\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1.0\" /><text x=\"56\" y=\"344\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#2F7A66\" font-weight=\"600\" >置位严格</text><text x=\"56\" y=\"368\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >bit = 1 必须已被确认成立；只能由 VACUUM 设置</text><rect x=\"480\" y=\"318\" width=\"420\" height=\"66\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"496\" y=\"344\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#BE653B\" font-weight=\"600\" >清位保守</text><text x=\"496\" y=\"368\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >bit = 0 不代表一定有不可见行，只是不能安全证明</text><rect x=\"920\" y=\"318\" width=\"420\" height=\"66\" rx=\"3\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1.0\" /><text x=\"936\" y=\"344\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#AE8A3E\" font-weight=\"600\" >归属明确</text><text x=\"936\" y=\"368\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >VM 描述 heap page；索引没有 VM（indexes do not have VMs）</text><text x=\"40\" y=\"412\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >Index Only Scan 只关心 AV；VACUUM 与冻结还会使用 AF。错误置位会导致错误结果，所以置位必须谨慎。</text></svg>","ctrl":null},{"eyebrow":"第四章 · 位生命周期","title":"DML 清位，VACUUM 置位（可播放推演）","lede":"把时间轴拉开：刚导入、VACUUM、UPDATE、再 VACUUM，八个页面的 AV 位跟着变。","caption":"动画页：选择更新范围，播放 / 单步 / 重置，观察 AV 位与回表倾向的变化。","bridge":"规律讲完了，不如亲手推一遍：换个命中率，Heap Fetches 会怎么变？","notes":"把维护规则按时间顺序摆开，其实就三句话：INSERT / UPDATE / DELETE 改动了某个 heap page，就把这个 page 的 all-visible 信息清掉；VACUUM 确认这个 page 上的 tuple 对所有事务都可见，才把 all-visible 位设回来；确认都冻结了，再设 all-frozen。\n\n你可以在这一页动手。下拉框选「更新范围」，按播放或者单步，看八个 heap page 的 AV 位怎么从全 0，到 VACUUM 后全 1，再被 UPDATE 清掉一部分，最后又被 VACUUM 设回来。\n\n这个动画想让你建立的直觉是：VM 命中率不是一个建索引时就能一劳永逸设定的参数，它是工作负载的产物。读多写少的表，位能长期保持；热表上，位刚被设好就被下一次 UPDATE 清掉，收益自然不稳定。\n\n当然这里有个简化前提得说清楚：我们假设没有长事务挡着。真实系统里，一个跑很久的事务会让 tuple 迟迟不能被认为「对所有事务可见」，VACUUM 也就没法把位设回去。所以 DBA 排查 Heap Fetches 降不下来时，长事务永远是重点怀疑对象之一。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><text x=\"40\" y=\"28\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >图 11　位的生命周期：任何 DML 清位，VACUUM 置位（可播放推演）</text><rect x=\"40\" y=\"48\" width=\"300\" height=\"52\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" id=\"ap0\"/><text x=\"190\" y=\"80\" \" fill=\"#1B2B33\" font-weight=\"600\" >page 6</text><text x=\"1105\" y=\"208\" class=\"sv s pgtxt mono\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#BE653B\" font-weight=\"600\" >AV=0</text></g><g id=\"pg7\"><rect x=\"1195\" y=\"148\" width=\"150\" height=\"84\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" class=\"pgrect\"/><text x=\"1270\" y=\"178\" class=\"sv s mono\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"600\" >page 7</text><text x=\"1270\" y=\"208\" class=\"sv s pgtxt mono\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#BE653B\" font-weight=\"600\" >AV=0</text></g><rect x=\"40\" y=\"250\" width=\"1320\" height=\"76\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><rect x=\"40\" y=\"250\" width=\"5\" height=\"76\" rx=\"0\" fill=\"#AE8A3E\" stroke=\"#AE8A3E\" stroke-width=\"1.0\" /><text x=\"62\" y=\"278\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#AE8A3E\" font-weight=\"600\" >当前阶段</text><text x=\"62\" y=\"306\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" id=\"apVerdict\">新写入的 heap 页面还没有 all-visible 位；此时即便列被索引覆盖，也大多要回表。</text><rect x=\"40\" y=\"342\" width=\"1320\" height=\"62\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#F1EFE9\" stroke-width=\"1.0\" /><text x=\"58\" y=\"378.25\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"600\" >简化前提</text><text x=\"222\" y=\"377.55\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >假设没有长事务阻挡 VACUUM；真实系统里长事务会推迟 tuple 变为「对所有事务可见」。</text></svg>","ctrl":"<label>更新范围</label><select id=\"aScope\"><option value=\"2\">影响 2 个页面</option><option value=\"4\">影响 4 个页面</option><option value=\"6\">影响 6 个页面</option><option value=\"8\">影响全部页面</option></select><button class=\"btn play\" id=\"aPlay\">▶ 播放</button><button class=\"btn\" id=\"aTick\">单步</button><button class=\"btn\" id=\"aReset\">重置</button><span class=\"out\" id=\"aOut\"></span>"},{"eyebrow":"第四章 · 交互推演","title":"命中率怎么一步步变成 Heap Fetches","lede":"同一条 SQL、同一个覆盖索引，只改 VM 命中比例，执行结果就完全不同。","caption":"动画页：拖动比例、播放 / 单步 / 重置，逐条观察 12 个候选 TID 的走向。","bridge":"执行器这么干活，可优化器凭什么一开始就把这条路径选出来？","notes":"这一页我们做个思想实验，也是最能把前面几页串起来的一页。固定一条 SQL、固定一个覆盖索引，只动一个输入：all-visible 页面的比例。\n\n拖动滑块，按播放，12 个候选 TID 会一条一条走完流程。绿色是 VM 命中，执行器直接用索引 tuple 返回；陶橙色是没命中，得回表确认可见性，计数进 Heap Fetches。比例调到 100%，十二条全绿；调低，橙色就越来越多。\n\n请特别注意，计划节点名在整个过程中没有任何变化，始终叫 Index Only Scan。变的只有执行期的实际 I/O。这就是全文最想强调的那句：节点名说明优化器选了什么形态，Heap Fetches 才说明执行期是否真的避开了 heap。\n\n顺便把那个示意公式也对上：Index Only Scan 的 heap I/O 大致等于「命中 TID 对应的 heap page 数 × (1 − allvisfrac)」，再加一点访问 VM 的成本。这不是源码里的完整公式，只是帮我们理解趋势；真实的 cost_index() 还要算索引访问成本、选择率、相关性、random_page_cost、loop count、CPU qual cost、并行 worker 和 pathkeys。这里的推演是示意，不是实测数据。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><text x=\"40\" y=\"26\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >图 12　同一条 SQL，VM 命中率如何变成 Heap Fetches（示意推演）</text><rect x=\"40\" y=\"42\" width=\"1320\" height=\"52\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"58\" y=\"74\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"600\" >Index Only Scan heap I/O  ≈  命中 heap page 数 × (1 − allvisfrac)  +  VM 访问成本</text><text x=\"40\" y=\"116\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >12 个候选 TID 逐条经过 VM 检查（绿色＝索引直接返回，陶橙＝回表）</text><g id=\"hf0\"><rect x=\"40\" y=\"128\" width=\"205\" height=\"96\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" class=\"hfrect\"/><text x=\"54\" y=\"156\" class=\"sv s mono\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"600\" >TID 01</text><text x=\"54\" y=\"180\" class=\"sv s mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >→ VM b
