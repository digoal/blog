<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数据库筑基课 · 数据扫描方法 Bitmap Scan</title>
<!-- 单文件交付：所有原理图均为现场绘制的内联 SVG，零外部图片 / 字体 / 脚本依赖。 -->
<style>
:root{
  --bg:#F7F6F2; --bg2:#F1EFE9; --ink:#1B2B33; --ink2:#46585F; --muted:#89938F; --line:#D9D5CB;
  --primary:#245A6B; --prim-l:#E5EFF0; --accent:#BE653B; --acc-l:#F7E9DE;
  --green:#2F7A66; --green-l:#E4F0EA; --gold:#AE8A3E; --gold-l:#F5EDDC;
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#E9E7E1}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
#viewport{position:absolute;inset:0 0 66px 0;overflow:hidden}
#stage{position:absolute;width:1600px;height:900px;background:var(--bg);
  transform-origin:top left;box-shadow:0 16px 54px rgba(27,43,51,.12)}
body.ready #stage{transition:transform .36s cubic-bezier(.2,.7,.2,1),left .36s cubic-bezier(.2,.7,.2,1),top .36s cubic-bezier(.2,.7,.2,1)}
.slide{position:absolute;inset:0;display:none;background:var(--bg)}
.slide.on{display:block;animation:fadein .4s cubic-bezier(.2,.7,.2,1)}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.eyebrow{position:absolute;left:64px;top:44px;font-size:13px;letter-spacing:3.4px;color:var(--primary);font-weight:600}
.eyebrow .num{font-family:var(--mono);letter-spacing:1px;color:var(--accent);margin-right:14px}
h1.title{position:absolute;left:64px;top:70px;margin:0;font-family:var(--serif);font-size:44px;
  line-height:1.25;font-weight:700;letter-spacing:1.2px;color:var(--ink)}
.lede{position:absolute;left:64px;top:139px;width:1440px;font-size:19px;color:var(--ink2);line-height:1.5;letter-spacing:.3px}
.rule{position:absolute;left:64px;top:181px;width:1472px;height:1px;background:var(--line)}
.figwrap{position:absolute;left:100px;top:198px;width:1400px;height:430px}
svg.figure{display:block;overflow:visible}
.caption{position:absolute;left:100px;top:638px;width:1400px;font-size:13px;color:var(--muted);letter-spacing:.4px}
.bridge{position:absolute;left:64px;top:716px;width:1472px;font-size:20px;color:var(--accent);
  line-height:1.55;letter-spacing:.4px;padding-left:18px;border-left:3px solid var(--accent);font-family:var(--serif)}
.bridge .bk{font-family:var(--sans);font-size:13px;color:var(--muted);letter-spacing:2px;display:block;margin-bottom:2px}
.footer{position:absolute;left:64px;top:846px;width:1472px;height:1px;background:var(--line)}
.footer .fl{position:absolute;left:0;top:14px;font-size:12.5px;color:var(--muted);letter-spacing:2px}
.footer .fr{position:absolute;right:0;top:12px;font-family:var(--mono);font-size:14px;color:var(--ink2)}
.footer .fbar{position:absolute;left:0;right:0;top:-1px;height:2px;background:transparent}
.footer .fbar i{display:block;height:2px;background:var(--primary);width:0;transition:width .4s ease}

/* 动画控件：位于图下方独立条带，不覆盖图 */
.ctrls{position:absolute;left:100px;top:664px;width:1400px;height:40px;display:flex;align-items:center;gap:10px}
.ctrls label{font-size:13px;color:var(--ink2);white-space:nowrap}
.ctrls select,.ctrls input[type=range]{font-family:var(--sans);font-size:13px;color:var(--ink);
  background:#fff;border:1px solid var(--line);border-radius:4px;padding:4px 8px;outline:none}
.ctrls input[type=range]{width:190px;padding:0;accent-color:var(--primary);border:none;background:transparent}
.ctrls .btn{min-height:30px;padding:5px 14px;border:1px solid var(--primary);border-radius:4px;
  background:#fff;color:var(--primary);font-size:13px;cursor:pointer;font-family:var(--sans);white-space:nowrap}
.ctrls .btn.play{background:var(--primary);color:#fff}
.ctrls .btn:hover{filter:brightness(.94)}
.ctrls .out{font-size:13px;color:var(--ink2);margin-left:auto;min-width:0;flex:1;max-width:640px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrls .out b{color:var(--accent);font-weight:600}

/* 底部外壳：两行，全屏后按键仍常驻 */
.chrome{position:fixed;left:0;right:0;bottom:0;height:66px;background:#FCFBF8;
  border-top:1px solid var(--line);z-index:40;display:flex;flex-direction:column;padding:6px 18px 5px;gap:4px}
.chrome .r1{display:flex;align-items:center;gap:7px;height:32px;flex:0 0 32px}
.chrome .r2{display:flex;align-items:center;font-size:11.5px;color:var(--muted);
  white-space:nowrap;overflow:hidden;line-height:1.2}
.chrome .r2 span{padding:0 10px;border-right:1px solid var(--line)}
.chrome .r2 span:first-child{padding-left:0}
.chrome .r2 span:last-child{border-right:none}
.chrome button{font-family:var(--sans);font-size:13px;color:var(--ink2);background:transparent;
  border:1px solid transparent;border-radius:5px;padding:6px 11px;cursor:pointer;white-space:nowrap}
.chrome button:hover{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome button.act{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome .pg{font-family:var(--mono);font-size:14px;color:var(--ink);min-width:76px;text-align:center}
.chrome .track{flex:1;height:3px;background:var(--line);border-radius:3px;margin:0 12px;position:relative;min-width:40px}
.chrome .track i{position:absolute;left:0;top:0;height:3px;background:var(--primary);border-radius:3px;transition:width .35s}
body.immersive .chrome{background:var(--bg2)}
body.immersive{background:#E9E7E1}

/* 页内开窗：右侧讲稿，不是弹窗 */
#notes{position:fixed;right:0;top:0;bottom:66px;width:38vw;min-width:380px;max-width:620px;
  background:#FCFBF8;border-left:1px solid var(--line);z-index:30;display:flex;flex-direction:column;
  transform:translateX(101%);transition:transform .36s cubic-bezier(.2,.7,.2,1);
  box-shadow:-14px 0 44px rgba(27,43,51,.07)}
body.panel-on #notes{transform:translateX(0)}
.nhead{padding:16px 22px 13px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex:0 0 auto}
.nhead .nt{font-family:var(--serif);font-size:21px;color:var(--ink);font-weight:700;flex:1}
.nhead .ns{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.nhead button{font-family:var(--sans);font-size:12.5px;background:#fff;border:1px solid var(--line);
  border-radius:5px;padding:6px 11px;cursor:pointer;color:var(--ink2)}
.nhead button:hover{border-color:var(--primary);color:var(--primary)}
.nbody{flex:1;overflow-y:auto;position:relative;padding:6px 22px 44px;scroll-behavior:smooth}
.nbody::-webkit-scrollbar{width:9px}
.nbody::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
.nsec{border-top:1px solid var(--line);padding:18px 0 22px}
.nsec:first-child{border-top:none}
.nsec .sn{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:1px}
.nsec h3{margin:8px 0 11px;font-family:var(--serif);font-size:21px;color:var(--primary);line-height:1.4}
.nsec p{margin:0;font-size:15.5px;line-height:2.0;color:var(--ink2);letter-spacing:.2px}
.nsec .br{margin-top:13px;font-family:var(--serif);font-size:15px;color:var(--accent);line-height:1.8;
  padding-left:12px;border-left:2px solid var(--accent)}
.nsec.cur{background:var(--prim-l);margin:0 -22px;padding-left:22px;padding-right:22px}
.tocgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:8px 0 20px}
.tocgrid a{display:block;padding:12px 13px;border:1px solid var(--line);border-radius:5px;
  background:#fff;text-decoration:none;color:var(--ink);cursor:pointer;transition:.2s}
.tocgrid a:hover{border-color:var(--primary);background:var(--prim-l)}
.tocgrid a.cur{border-color:var(--accent);background:var(--acc-l)}
.tocgrid a .gn{font-family:var(--mono);font-size:12px;color:var(--accent)}
.tocgrid a .gt{font-family:var(--serif);font-size:15px;line-height:1.4;display:block;margin-top:5px}
.keygrid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px 24px;font-size:14.5px;
  line-height:1.8;padding:12px 0 6px;color:var(--ink2)}
.keygrid kbd{font-family:var(--mono);background:#fff;border:1px solid var(--line);
  border-bottom-width:2px;border-radius:4px;padding:2px 7px;color:var(--primary);margin-right:8px}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ink);
  color:#fff;font-size:13px;padding:9px 16px;border-radius:5px;opacity:0;transition:.3s;z-index:80;pointer-events:none}
.toast.on{opacity:1}
@media print{
  html,body{overflow:visible;background:#fff;height:auto}
  #viewport{position:static;overflow:visible}
  #stage{position:static;transform:none!important;box-shadow:none;transition:none}
  .slide{display:block!important;position:relative;height:900px;page-break-after:always;animation:none}
  .chrome,#notes,.toast{display:none!important}
}
</style>
</head>

    <button id="btnFs">全屏 F</button>

</div>

family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >真正吐出 tuple 的只有这一层<\/text><path d=\"M 395 132 L 395 180\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"2\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-prim)\"/><path d=\"M 705 132 L 705 152 L 330 152 L 330 180\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"/><path d=\"M 870 220 L 890 220\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"2\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-prim)\"/><path d=\"M 1115 260 L 1115 278 L 540 278 L 540 308\" fill=\"none\" stroke=\"#BE653B\" stroke-width=\"1.8\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-acc)\"/><path d=\"M 870 348 L 890 348\" fill=\"none\" stroke=\"#2F7A66\" stroke-width=\"2\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-green)\"/><\/svg>", "ctrl": "<label>合并方式<\/label><select id=\"a2-mode\"><option value=\"and\">BitmapAnd · 交集<\/option><option value=\"or\">BitmapOr · 并集<\/option><\/select><label>候选 TID（示意）<\/label><input id=\"a2-n\" type=\"range\" min=\"6\" max=\"16\" value=\"12\"><button class=\"btn play\" id=\"a2-play\">▶ 播放<\/button><button class=\"btn\" id=\"a2-step\">单步 →<\/button><button class=\"btn\" id=\"a2-reset\">重置<\/button><span class=\"out\" id=\"a2-readout\"><\/span>"}, {"eyebrow": "正名 · 两个 bitmap", "title": "计划里的 bitmap，不是磁盘上的 bitmap index", "lede": "PostgreSQL core 通常用普通索引在执行期生成内存 TIDBitmap；论文里那种持久化位图索引，生命周期、维护成本、优化目标全不一样。", "caption": "图 03　左：执行期临时候选集合；右：长期存盘的索引类型。", "bridge": "名字分清之后，才谈得上它在扫描谱系里的位置。", "notes": "计划里写着 Bitmap Index Scan，很多人第一反应是：哦，我建了一个 bitmap index。不是的。PostgreSQL core 里通常没有这种磁盘上的位图索引；这里说的是在普通 B-tree、GIN、GiST、BRIN 上，执行期调一下 amgetbitmap，把命中的 TID 塞进一块内存里的 TIDBitmap，查询结束就释放了。论文里那种「列值到位图、长期存盘、靠位运算吃饭」的 bitmap index，是另一套东西，生命周期、写入成本、优化目标全不一样，Greenplum 那类系统才有独立的访问方法。名字一样，说的不是一件事。把这个分清了，我们才能问：它到底站在扫描方法的哪个位置？", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"40\" y=\"28\" font-size=\"19\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >两个都叫 bitmap，说的不是一件事<\/text><text x=\"40\" y=\"48\" font-size=\"12.5\" fill=\"#89938F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >左：PostgreSQL 计划节点；右：论文与部分系统里的持久化索引类型<\/text><rect x=\"40\" y=\"64\" width=\"650\" height=\"318\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"40\" y=\"64\" width=\"650\" height=\"44\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"58\" y=\"93.2\" font-size=\"20\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >PostgreSQL core · 执行期的内存 TIDBitmap<\/text><rect x=\"58\" y=\"182.6\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"75\" y=\"190.4\" font-size=\"15\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >普通索引：B-tree / GIN / GiST / BRIN / hash / SP-GiST<\/text><rect x=\"58\" y=\"209.6\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"75\" y=\"217.4\" font-size=\"15\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >执行期调用 amgetbitmap，把命中 TID 放进内存<\/text><rect x=\"58\" y=\"236.6\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"75\" y=\"244.4\" font-size=\"15\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >随查询创建、随查询释放，不落盘、不需维护<\/text><rect x=\"58\" y=\"263.6\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"75\" y=\"271.4\" font-size=\"15\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >计划节点：Bitmap Index Scan / Bitmap Heap Scan<\/text><rect x=\"58\" y=\"290.6\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"75\" y=\"298.4\" font-size=\"15\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >优化目标：把随机回表改成按 heap block 访问<\/text><rect x=\"710\" y=\"64\" width=\"650\" height=\"318\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"710\" y=\"64\" width=\"650\" height=\"44\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"728\" y=\"93.2\" font-size=\"20\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >持久化 Bitmap Index · 磁盘上的索引类型<\/text><rect x=\"728\" y=\"182.6\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"745\" y=\"190.4\" font-size=\"15\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >列值 → 行位置位图，长期存储，写时同步维护<\/text><rect x=\"728\" y=\"209.6\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"745\" y=\"217.4\" font-size=\"15\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >位运算做集合组合，是它的核心优势<\/text><rect x=\"728\" y=\"236.6\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"745\" y=\"244.4\" font-size=\"15\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >适合低 / 中基数、读多写少的分析型场景<\/text><rect x=\"728\" y=\"263.6\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"745\" y=\"271.4\" font-size=\"15\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >写放大明显，高并发 OLTP 更新不友好<\/text><rect x=\"728\" y=\"290.6\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"745\" y=\"298.4\" font-size=\"15\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >PostgreSQL core 不提供；Greenplum 等系统另有实现<\/text><rect x=\"40\" y=\"394\" width=\"1320\" height=\"30\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"56\" y=\"414\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >所以：「Bitmap Index Scan」= 产出 bitmap 的索引扫描，不是「扫描 bitmap 索引」；生命周期与维护成本完全不同<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "定位 · 三段谱系", "title": "它夹在 Index Scan 与 Seq Scan 之间", "lede": "候选行太少，普通 Index Scan 边找边返回还能借 LIMIT 提前停；候选行多到接近全表，Seq Scan 的顺序吞吐更稳；中间才是它的优势区间。", "caption": "图 04　以候选行数 / 命中 heap page 占比为轴的三种扫描路径。", "bridge": "位置定了，接下来拆开看：到底是哪几个节点在干活。", "notes": "把候选行数当成一条轴，从左到右从小到大。最左边，就几行，普通 Index Scan 边找边返回，还能配合 LIMIT 提前收工，索引顺序也白送给你。最右边，要读大半个表，Seq Scan 的顺序吞吐最稳。bitmap scan 就夹在中间：候选行已经不算少，但命中的 heap page 还能明显收敛，这时候先收集位置再按页走才划算。注意还有一条不在同一维度的路——Index Only Scan，它靠的是覆盖索引加 visibility map，目标是干脆别回表。所以判断 bitmap scan 值不值，看的是三个条件同时成立：中等选择率、page 可收敛、不依赖索引顺序。那具体是谁来干这些活？", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"40\" y=\"28\" font-size=\"19\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >候选行数 / 命中 heap page 占比，决定谁更划算<\/text><text x=\"40\" y=\"48\" font-size=\"12.5\" fill=\"#89938F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >同一条轴上的三段；Index Only Scan 是另一个维度，不在本轴<\/text><rect x=\"40\" y=\"72\" width=\"420\" height=\"238\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"40\" y=\"72\" width=\"420\" height=\"46\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"58\" y=\"102\" font-size=\"20\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >Index Scan<\/text><text x=\"58\" y=\"154\" font-size=\"17\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >极少候选行<\/text><line x1=\"58\" y1=\"170\" x2=\"442\" y2=\"170\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"58\" y=\"198\" font-size=\"14.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >边找边返回，可配合 LIMIT 提前停止<\/text><text x=\"58\" y=\"240\" font-size=\"14.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >随机回表成本尚可，保留索引顺序<\/text><rect x=\"480\" y=\"72\" width=\"440\" height=\"238\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"2\" opacity=\"1\" /><rect x=\"480\" y=\"72\" width=\"440\" height=\"46\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"498\" y=\"102\" font-size=\"20\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >Bitmap Heap Scan<\/text><text x=\"498\" y=\"154\" font-size=\"17\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >中等候选行<\/text><line x1=\"498\" y1=\"170\" x2=\"902\" y2=\"170\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"498\" y=\"198\" font-size=\"14.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >命中 heap page 可明显收敛<\/text><text x=\"498\" y=\"240\" font-size=\"14.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >多个索引条件可做 AND / OR 组合<\/text><rect x=\"796\" y=\"80\" width=\"112\" height=\"26\" rx=\"0\" fill=\"#FFFFFF\" opacity=\"1\" /><text x=\"852\" y=\"97.08\" font-size=\"12\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >优势区间<\/text><rect x=\"940\" y=\"72\" width=\"420\" height=\"238\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#46585F\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"940\" y=\"72\" width=\"420\" height=\"46\" rx=\"0\" fill=\"#46585F\" opacity=\"1\" /><text x=\"958\" y=\"102\" font-size=\"20\" fill=\"#1B2B33\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >Seq Scan<\/text><text x=\"958\" y=\"154\" font-size=\"17\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >大比例数据<\/text><line x1=\"958\" y1=\"170\" x2=\"1342\" y2=\"170\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"958\" y=\"198\" font-size=\"14.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >顺序吞吐胜过逐行回表<\/text><text x=\"958\" y=\"240\" font-size=\"14.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >全表聚合、小表扫描更稳<\/text><path d=\"M 40 332 L 1360 332\" fill=\"none\" stroke=\"#1B2B33\" stroke-width=\"1.5\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-ink)\"/><text x=\"40\" y=\"354\" font-size=\"13\" fill=\"#89938F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >低<\/text><text x=\"1330\" y=\"354\" font-size=\"13\" fill=\"#89938F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >高<\/text><text x=\"560\" y=\"354\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >候选行数 / 命中 heap page 占比 →<\/text><rect x=\"40\" y=\"374\" width=\"1320\" , sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >按命中 block 访问表并 recheck<\/text><rect x=\"840\" y=\"286\" width=\"540\" height=\"46\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"854\" y=\"313.725\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >src/backend/executor/nodeBitmapHeapscan.c<\/text><rect x=\"40\" y=\"332\" width=\"250\" height=\"46\" rx=\"0\" fill=\"None\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"54\" y=\"359.725\" font-size=\"13.5\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >TableAM 接口<\/text><rect x=\"290\" y=\"332\" width=\"550\" height=\"46\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"304\" y=\"359.725\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >由表访问方法按 TIDBitmap 取 tuple<\/text><rect x=\"840\" y=\"332\" width=\"540\" height=\"46\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"854\" y=\"359.725\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >src/include/access/tableam.h<\/text><rect x=\"40\" y=\"388\" width=\"1320\" height=\"30\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"56\" y=\"408\" font-size=\"13.5\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >关键：其余节点产出的都是「位置集合」，真正向上返回 tuple 的只有 BitmapHeapScan<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "契约 · amgetbitmap", "title": "一次交出全部 TID，也划死了能力边界", "lede": "amgetbitmap(scan, tbm) 把本次扫描所有匹配 TID 并入调用方 bitmap；它与 amgettuple 不能混用，也不支持 index-only scan。", "caption": "图 06　索引访问方法层的接口契约与四条限制（indexam.sgml）。", "bridge": "位置交出来了，它们在内存里按什么粒度摆？", "notes": "接口就一行：amgetbitmap(scan, tbm)。它一次把本次扫描所有匹配的 TID 并进调用方给的 TIDBitmap，返回一个数量。文档还给了几条硬限制：它和 amgettuple 不能在同一次 index scan 里混用；它可以标记某些 TID 需要 recheck；最关键的，它不支持 index-only scan——因为 bitmap 里只有位置，没有索引 tuple 的内容，你想直接从索引里拿列值，它给不了。还有一条隐藏前提：索引访问和 heap 访问被解耦了，所以必须用 MVCC 合规的快照，否则 TID 被复用就可能读到不该读的行。你看，「Bitmap Index Scan」这个名字，其实是「产出 bitmap 的索引扫描」，不是「扫描 bitmap 索引」。那这些位置存进去之后，是按什么粒度摆的？", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"40\" y=\"28\" font-size=\"19\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >amgetbitmap：一次交出全部 TID，也划死了能力边界<\/text><rect x=\"40\" y=\"60\" width=\"600\" height=\"318\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#245A6B\" stroke-width=\"2\" opacity=\"1\" /><rect x=\"40\" y=\"60\" width=\"600\" height=\"44\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"58\" y=\"89\" font-size=\"18\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >接口契约<\/text><rect x=\"56\" y=\"118\" width=\"568\" height=\"52\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"70\" y=\"150\" font-size=\"14.5\" fill=\"#245A6B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >int64 amgetbitmap(IndexScanDesc scan, TIDBitmap *tbm)<\/text><rect x=\"56\" y=\"184\" width=\"568\" height=\"76\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"72\" y=\"214.35\" font-size=\"15\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >入：索引扫描描述符 + 调用方的 TIDBitmap<\/text><text x=\"72\" y=\"239.85\" font-size=\"15\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >出：本次扫描全部匹配 TID（OR 进已有集合）+ 匹配数量<\/text><rect x=\"56\" y=\"272\" width=\"568\" height=\"88\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"72\" y=\"296.96\" font-size=\"14\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >注意：它可以标记某些 TID 需要 recheck；<\/text><text x=\"72\" y=\"320.76\" font-size=\"14\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >索引访问与 heap 访问解耦，因此必须依赖 MVCC 合规快照，<\/text><text x=\"72\" y=\"344.56\" font-size=\"14\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >否则 TID 被复用时可能读到不该读的行。<\/text><text x=\"680\" y=\"80\" font-size=\"18\" fill=\"#BE653B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >四条硬限制<\/text><rect x=\"680\" y=\"98\" width=\"680\" height=\"60\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"696\" y=\"135\" font-size=\"17\" fill=\"#BE653B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >01<\/text><text x=\"748\" y=\"134\" font-size=\"15\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >与 amgettuple 不能在同一次 index scan 中混用<\/text><rect x=\"680\" y=\"168\" width=\"680\" height=\"60\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.5\" opacity=\"1\" /><text x=\"696\" y=\"205\" font-size=\"17\" fill=\"#BE653B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >02<\/text><text x=\"748\" y=\"204\" font-size=\"15\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >不支持 index-only scan：bitmap 只返回位置，不返回索引 tuple 内容<\/text><rect x=\"680\" y=\"238\" width=\"680\" height=\"60\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"696\" y=\"275\" font-size=\"17\" fill=\"#BE653B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >03<\/text><text x=\"748\" y=\"274\" font-size=\"15\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >可标记特定 TID 为候选匹配，要求执行期复核原条件<\/text><rect x=\"680\" y=\"308\" width=\"680\" height=\"60\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"696\" y=\"345\" font-size=\"17\" fill=\"#BE653B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >04<\/text><text x=\"748\" y=\"344\" font-size=\"15\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >需要 MVCC 快照：索引与 heap 访问被解耦，TID 可能被复用<\/text><rect x=\"40\" y=\"392\" width=\"1320\" height=\"30\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"56\" y=\"412\" font-size=\"13.5\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >名字的正解：「产出 bitmap 的索引扫描」，而不是「扫描 bitmap 类型的索引」<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "粒度 · TID 两段结构", "title": "粒度不是行数组，是页 + 页内 offset 位图", "lede": "TID = BlockNumber + OffsetNumber。exact page 记页内命中 offset；lossy chunk 只记「这些 page 要访问」，不再记具体 tuple。", "caption": "图 07　从 TID 分解到 PagetableEntry，以及 exact / lossy 的关键常量。", "bridge": "粒度是页，那内存不够时，页内精度就保不住了。", "notes": "很多人以为 TIDBitmap 是个行数组。不是。TID 在 PostgreSQL 里本来就是两段：BlockNumber 加 OffsetNumber。bitmap 就顺着这个结构，围绕「页」来组织——内存够的时候，一个 exact page 记下这页里哪些 offset 命中；内存不够的时候，退化成 lossy chunk，只记「这几页要去看」，页内哪几行命中就不管了。源码里的 PagetableEntry 用 ischunk 一个字段同时承载这两种状态，lossy 用一 bit 表示一个磁盘页，8KB 的标准页大小下，大概 1MB 内存就能覆盖 64GB 磁盘的页级命中信息。注意，粒度是「页 + 页内位图」，不是行。那问题就来了：内存什么时候会不够？", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"40\" y=\"28\" font-size=\"19\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >TIDBitmap 的粒度不是「行数组」，是「页 + 页内 offset 位图」<\/text><rect x=\"40\" y=\"60\" width=\"400\" height=\"64\" rx=\"0\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"240\" y=\"97.78\" font-size=\"17\" fill=\"#FFFFFF\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\" t-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >按 block 聚合后的 PagetableEntry：<\/text><text x=\"56\" y=\"296.96\" font-size=\"14\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >entry[128] → offsets {2, 7}   exact<\/text><text x=\"56\" y=\"322.16\" font-size=\"14\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >entry[129] → offsets {1}      exact<\/text><text x=\"56\" y=\"347.36\" font-size=\"14\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >entry[256..511] → 整段 page  lossy<\/text><rect x=\"470\" y=\"60\" width=\"450\" height=\"316\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"470\" y=\"60\" width=\"450\" height=\"44\" rx=\"0\" fill=\"#47808D\" opacity=\"1\" /><text x=\"488\" y=\"89.2\" font-size=\"20\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >关键常量与结构<\/text><rect x=\"488\" y=\"163.59\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#47808D\" opacity=\"1\" /><text x=\"505\" y=\"170.61\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >TBM_MAX_TUPLES_PER_PAGE = MaxHeapTuplesPerPage<\/text><rect x=\"488\" y=\"190.59\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#47808D\" opacity=\"1\" /><text x=\"505\" y=\"197.61\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >PAGES_PER_CHUNK = BLCKSZ / 32<\/text><rect x=\"488\" y=\"217.59\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#47808D\" opacity=\"1\" /><text x=\"505\" y=\"224.61\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >PagetableEntry：ischunk=false 为 exact page<\/text><rect x=\"488\" y=\"244.59\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#47808D\" opacity=\"1\" /><text x=\"505\" y=\"251.61\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >ischunk=true 为 lossy chunk（一段 page）<\/text><rect x=\"488\" y=\"271.59\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#47808D\" opacity=\"1\" /><text x=\"505\" y=\"278.61\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >tbm_add_tuples / tbm_add_page / tbm_union<\/text><rect x=\"488\" y=\"298.59\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#47808D\" opacity=\"1\" /><text x=\"505\" y=\"305.61\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >tbm_intersect / tbm_lossify / tbm_iterate<\/text><rect x=\"940\" y=\"60\" width=\"420\" height=\"316\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"940\" y=\"60\" width=\"420\" height=\"44\" rx=\"0\" fill=\"#AE8A3E\" opacity=\"1\" /><text x=\"958\" y=\"89.2\" font-size=\"20\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" idth=\"1\" opacity=\"1\" /><text x=\"56\" y=\"412\" font-size=\"13.5\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >exact 记页内 offset；lossy 只记「这些 page 要访问」—— 内存不够时精度可以降<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "折中 · exact 与 lossy", "title": "内存不够，精度可以降", "lede": "work_mem 决定 TIDBitmap 的 maxentries；超限触发 tbm_lossify()，把 exact page 压成 lossy chunk，用精度换内存上界。", "caption": "图 08　拖动滑块观察精确页退化为整页标记；计数为示意。", "bridge": "精度可以降，可结果还必须对——靠谁兜底？", "notes": "答案在 work_mem。MultiExecBitmapIndexScan 建 TIDBitmap 的时候传的就是 work_mem 乘 1024。候选 TID 越多、条目数越逼近 maxentries，tbm_lossify 就开始把一部分 exact page 压成 lossy chunk。你可以拖一下这根滑块，从 4MB 一路降到 32kB，看绿色的精确页怎么一格格变成橙色的整页标记。这是 PostgreSQL 很典型的工程折中：用内存换更好的访问顺序，但不允许一个查询无限吃内存，所以允许精度下降，把内存摁在上界里。数字是示意，机制是真的。可精度丢了，结果还敢信吗？", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"40\" y=\"26\" font-size=\"19\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >work_mem 越紧，exact page 越多地被压成 lossy chunk<\/text><rect x=\"1210\" y=\"10\" width=\"150\" height=\"22\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1285\" y=\"24.91\" font-size=\"11.5\" fill=\"#AE8A3E\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >示意数据 · 非实测<\/text><text x=\"40\" y=\"48\" font-size=\"12.5\" fill=\"#89938F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >拖动下方滑块或点播放；橙色卡片表示「只记整页、页内 offset 已丢失」<\/text><rect x=\"52\" y=\"72\" width=\"100\" height=\"150\" rx=\"0\" fill oke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"1327\" y=\"134\" width=\"18\" height=\"18\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><\/g><text x=\"1301\" y=\"186\" font-size=\"13\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"0\" id=\"b-l11\">整页复核<\/text><rect x=\"40\" y=\"238\" width=\"640\" height=\"108\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#2F7A66\" stroke-width=\"1.5\" opacity=\"1\" /><text x=\"56\" y=\"266\" font-size=\"17\" fill=\"#2F7A66\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >exact page<\/text><text x=\"56\" y=\"292\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >记 block 号 + 页内 offset 位图；只检查命中的 tuple<\/text><text x=\"56\" y=\"318\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >必要时跟 HOT 链找当前快照可见版本<\/text><rect x=\"700\" y=\"238\" width=\"660\" height=\"108\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#BE653B\" stroke-width=\"1.5\" opacity=\"1\" /><text x=\"716\" y=\"266\" font-size=\"17\" fill=\"#BE653B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >lossy chunk<\/text><text x=\"716\" y=\"292\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >只记「这些 page 需要访问」；遍历整页 normal line pointer<\/text><text x=\"716\" y=\"318\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >每个可见 tuple 都要用原条件复核，CPU 成本上升<\/text><path d=\"M 680 292 L 700 292\" fill=\"none\" stroke=\"#AE8A3E\" stroke-width=\"2\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-gold)\"/><rect x=\"40\" y=\"358\" width=\"1320\" height=\"62\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"56\" y=\"382\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >tbm_lossify()：条目数超过 maxentries 时丢失部分精度；正确性由 heap 阶段 recheck 保证<\/text><text x=\"56\" y=\"405\" font-size=\"12.5\" fill=\"#89938F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >tidbitmap.c 注释：lossy 用 1 bit / disk page，8KB BLCKSZ 下约 1MB 内存可表示 64GB 磁盘的页级命中<\/text><\/svg>", "ctrl": "<label>work_mem<\/label><input id=\"b-mem\" type=\"range\" min=\"0\" max=\"5\" value=\"0\"><button class=\"btn play\" id=\"b-play\">▶ 播放<\/button><button class=\"btn\" id=\"b-step\">单步 →<\/button><button class=\"btn\" id=\"b-reset\">重置<\/button><span class=\"out\" id=\"b-out\"><\/span>"}, {"eyebrow": "兜底 · heap 阶段复核", "title": "敢降精度，是因为正确性由 recheck 兜底", "lede": "exact page 只取命中 offsets 并跟 HOT 链；lossy page 遍历整页 line pointer，逐 tuple 做 MVCC 判断并用 bitmapqualorig 复核。", "caption": "图 09　BitmapHeapScanNextBlock 的两条分支与 BitmapHeapNext 的过滤。", "bridge": "兜底机制清楚了，再回头看是谁把精度往下压的。", "notes": "敢，因为正确性不靠 bitmap 保证，靠 heap 阶段的复核兜底。exact page 好办：取出命中的 offset，顺着 HOT 链找当前快照可见的版本，只检查这几行。lossy page 就不一样了：整页的 normal line pointer 都得遍历，每个 tuple 做 MVCC 可见性判断，再用 bitmapqualorig 把原条件重新跑一遍，不通过的丢掉，计到过滤里。所以看到 EXPLAIN 里的 Recheck Cond，别急着下结论说索引失效——它只是说「计划上保留了原条件，必要时用来复核」；真要判断复核有多重，得看 Heap Blocks 的 exact 和 lossy，还有 Rows Removed by Index Recheck。既然精度由 work_mem 决定，那这个参数到底在几条链上起作用？", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"40\" y=\"26\" font-size=\"19\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >精度丢了，结果还敢信 —— 因为正确性由 heap 阶段复核兜底<\/text><text x=\"40\" y=\"48\" font-size=\"12.5\" fill=\"#89938F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >heapam_handler.c: BitmapHeapScanNextBlock() 的两条分支<\/text><text x=\"40\" y=\"66\" font-size=\"16\" fill=\"#2F7A66\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >A · exact page：少看 tuple<\/text><rect x=\"40\" y=\"80\" width=\"1320\" height=\"4\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><rect x=\"40\" y=\"98\" width=\"310\" height=\"72\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" opacity=\"1\" /><text x=\"195\" y=\"139.44\" font-size=\"16\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >取下一个 block<\/text><path d=\"M 350 134 L 380 134\" fill=\"none\" stroke=\"#2F7A66\" stroke-width=\"2\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-green)\"/><rect x=\"380\" y=\"98\" width=\"310\" height=\"72\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" opacity=\"1\" /><text x=\"535\" y=\"139.44\" font-size=\"16\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >提取命中的 offsets<\/text><path d=\"M 690 134 L 720 134\" fill=\"none\" stroke=\"#2F7A66\" stroke-width=\"2\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-green)\"/><rect x=\"720\" y=\"98\" width=\"310\" height=\"72\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" opacity=\"1\" /><text x=\"875\" y=\"139.44\" font-size=\"16\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >跟 HOT 链找可见版本<\/text><path d=\"M 1030 134 L 1060 134\" fill=\"none\" stroke=\"#2F7A66\" stroke-width=\"2\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-green)\"/><rect x=\"1060\" y=\"98\" width=\"310\" height=\"72\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1215\" y=\"139.44\" font-size=\"16\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >只把命中行交给上层<\/text><text x=\"40\" y=\"234\" font-size=\"16\" fill=\"#BE653B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >B · lossy page：整页复核<\/text><rect x=\"40\" y=\"248\" width=\"1320\" height=\"4\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><rect x=\"40\" y=\"266\" width=\"310\" height=\"72\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"195\" y=\"307.44\" font-size=\"16\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >取下一个 block<\/text><path d=\"M 350 302 L 380 302\" fill=\"none\" stroke=\"#BE653B\" stroke-width=\"2\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-acc)\"/><rect x=\"380\" y=\"266\" width=\"310\" height=\"72\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"535\" y=\"307.44\" font-size=\"16\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >遍历所有 line pointer<\/text><path d=\"M 690 302 L 720 302\" fill=\"none\" stroke=\"#BE653B\" stroke-width=\"2\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-acc)\"/><rect x=\"720\" y=\"266\" width=\"310\" height=\"72\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"875\" y=\"307.44\" font-size=\"16\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >逐 tuple 做 MVCC 判断<\/text><path d=\"M 1030 302 L 1060 302\" fill=\"none\" stroke=\"#BE653B\" stroke-width=\"2\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-acc)\"/><rect x=\"1060\" y=\"266\" width=\"310\" height=\"72\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1215\" y=\"307.44\" font-size=\"16\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >用 bitmapqualorig 复核<\/text><rect x=\"40\" y=\"368\" width=\"1320\" height=\"54\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"56\" y=\"399.76\" font-size=\"14\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >Recheck Cond 只表示「计划上保留原条件待复核」；是否大量复核，要看 Heap Blocks: exact=… lossy=… 与 Rows Removed by Index Recheck<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "闸门 · work_mem", "title": "同一道闸门，同时管住三条链", "lede": "执行期 tbm_create 决定精度；优化器 compute_bitmap_pages 估算 exact/lossy；工程上还要把并发乘数与其它 work_mem 消费者一起算。", "caption": "图 10　从配置到执行、到成本估算、到工程预算的三条链。", "bridge": "一个参数管三条链；理解了单张 bitmap，再看多张怎么合。", "notes": "它不是只影响执行。第一条链是执行期：tbm_create 拿 work_mem 算出 maxentries，超了就 lossify。第二条链是优化器：估算 bitmap heap scan 的时候，tbm_calculate_entries 和 costsize.c 里的 compute_bitmap_pages 会先估 exact 和 lossy 各多少页，一旦有 lossy，就把 heap 节点要处理的 tuple 数往上加。源码注释自己也承认这个估算偏粗，因为 lossify 一旦开始，lossy page 数涨得可能比线性快。第三条是工程账：调太小，复核和 CPU 上去；调太大，并发一乘就爆，而且 sort、hash join、hash aggregate 也都在抢同一份预算。所以别只看单条 SQL。理解了一个 bitmap 怎么来，我们再看多个条件怎么合起来。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"40\" y=\"28\" font-size=\"19\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >work_mem 是同一道闸门，同时管住三条链<\/text><rect x=\"40\" y=\"60\" width=\"420\" height=\"44\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"56\" y=\"88\" font-size=\"17\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >① 执行期 · 决定精度<\/text><rect x=\"40\" y=\"118\" width=\"420\" height=\"62\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"56\" y=\"153.93\" font-size=\"14.5\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >tbm_create(work_mem * 1024)<\/text><path d=\"M 250 180 L 250 194\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.8\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-prim)\"/><rect x=\"40\" y=\"194\" width=\"420\" height=\"62\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"56\" y=\"229.93\" font-size=\"14.5\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >算出 maxentries<\/text><path d=\"M 250 256 L 250 270\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.8\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-prim)\"/><rect x=\"40\" y=\"270\" width=\"420\" height=\"62\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"56\" y=\"305.93\" font-size=\"14.5\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >超限时 tbm_lossify()<\/text><rect x=\"490\" y=\"60\" width=\"420\" height=\"44\" rx=\"0\" fill=\"#47808D\" opacity=\"1\" /><text x=\"506\" y=\"88\" font-size=\"17\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >② 优化器 · 决定估算<\/text><rect x=\"490\" y=\"118\" width=\"420\" height=\"62\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"506\" y=\"153.93\" font-size=\"14.5\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >tbm_calculate_entries(work_mem*1024)<\/text><path d=\"M 700 180 L 700 194\" fill=\"none\" stroke=\"#47808D\" stroke-width=\"1.8\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-ink)\"/><rect x=\"490\" y=\"194\" width=\"420\" height=\"62\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"506\" y=\"229.93\" font-size=\"14.5\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >compute_bitmap_pages()<\ ect x=\"960\" y=\"296\" width=\"64\" height=\"42\" rx=\"0\" fill=\"#AE8A3E\" stroke=\"#AE8A3E\" stroke-width=\"1\" opacity=\"1\" /><text x=\"992\" y=\"323\" font-size=\"14\" fill=\"#FFFFFF\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >1<\/text><rect x=\"1028\" y=\"296\" width=\"64\" height=\"42\" rx=\"0\" fill=\"#AE8A3E\" stroke=\"#AE8A3E\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1060\" y=\"323\" font-size=\"14\" fill=\"#FFFFFF\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >1<\/text><rect x=\"1096\" y=\"296\" width=\"64\" height=\"42\" rx=\"0\" fill=\"#AE8A3E\" stroke=\"#AE8A3E\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1128\" y=\"323\" font-size=\"14\" fill=\"#FFFFFF\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >1<\/text><rect x=\"1164\" y=\"296\" width=\"64\" height=\"42\" rx=\"0\" fill=\"#AE8A3E\" stroke=\"#AE8A3E\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1196\" y=\"323\" font-size=\"14\" fill=\"#FFFFFF\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >1<\/text><rect x=\"1232\" y=\"296\" width=\"64\" height=\"42\" rx=\"0\" fill=\"#AE8A3E\" stroke=\"#AE8A3E\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1264\" y=\"323\" font-size=\"14\" fill=\"#FFFFFF\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >1<\/text><rect x=\"1300\" y=\"296\" width=\"64\" height=\"42\" rx=\"0\" fill=\"#AE8A3E\" stroke=\"#AE8A3E\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1332\" y=\"323\" font-size=\"14\" fill=\"#FFFFFF\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >1<\/text><rect x=\"40\" y=\"362\" width=\"1320\" height=\"58\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"56\" y=\"386\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >算完集合才回表：集合小、位运算便宜、heap 访问范围被收窄<\/text><text x=\"56\" y=\"408\" font-size=\"12.5\" fill=\"#89938F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >文档提醒：访问两个索引，不一定总比「只用一个索引 + 在 heap 上过滤另一个条件」更好<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "选择 · 成本模型", "title": "优化器算的是成本，不是感觉", "lede": "启动成本含生成 bitmap 的索引扫描；heap page 用 Mackert-Lohman 公式插值；AND/OR 选择率按独立、不重叠近似；估算高度依赖统计信息。", "caption": "图 12　costsize.c 中影响计划选择的六个关键点。", "bridge": "算账压在选择率上；单进程有上限，能不能多人一起干？", "notes": "优化器算的是成本，不是感觉。四个要点：第一，bitmap heap scan 的启动成本里含着生成 bitmap 的索引扫描成本，所以 LIMIT 很小的时候它天然吃亏，没法边找边停。第二，heap page 数用 Mackert-Lohman 风格的公式估，读少量页按随机读算、读接近全表按顺序读算，中间插值。第三，BitmapAnd 默认把各输入当独立条件相乘，源码注释直说这经常不准。第四，BitmapOr 把输入近似看成不重叠，选择率再 clamp 到 1。至于 enable_bitmapscan，它只是让不让优化器考虑这类计划，默认开，不是语义开关。你看，每一步都压在选择率估算上——所以 ANALYZE 和扩展统计信息不是可选项，条件相关性强的时候，独立相乘能把结果行数估错一大截。单进程算得再准也有上限，能不能多人一起干？", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"40\" y=\"26\" font-size=\"19\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >优化器算的是成本，不是「bitmap 更高级」<\/text><rect x=\"40\" y=\"56\" width=\"440\" height=\"140\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"40\" y=\"56\" width=\"440\" height=\"36\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"54\" y=\"80\" font-size=\"16\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >① 启动成本<\/text><text x=\"54\" y=\"124\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >包含生成 bitmap 的索引扫描成本<\/text><text x=\"54\" y=\"156\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >LIMIT 很小时无法边找边停，天然吃亏<\/text><rect x=\"500\" y=\"56\" width=\"440\" height=\"140\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"500\" y=\"56\" width=\"440\" height=\"36\" rx=\"0\" fill=\"#47808D\" opacity=\"1\" /><text x=\"514\" y=\"80\" font-size=\"16\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >② heap page 成本<\/text><text x=\"514\" y=\"124\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >Mackert-Lohman 风格公式估算页数<\/text><text x=\"514\" y=\"156\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >少量页按随机读、接近全表按顺序读插值<\/text><rect x=\"960\" y=\"56\" width=\"400\" height=\"140\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"960\" y=\"56\" width=\"400\" height=\"36\" rx=\"0\" fill=\"#AE8A3E\" opacity=\"1\" /><text x=\"974\" y=\"80\" font-size=\"16\" fill=\"#1B2B33\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >③ AND 选择率<\/text><text x=\"974\" y=\"124\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >默认把各输入当独立条件相乘<\/text><text x=\"974\" y=\"156\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >源码注释承认这经常不准确<\/text><rect x=\"40\" y=\"212\" width=\"440\" height=\"140\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"40\" y=\"212\" width=\"440\" height=\"36\" rx=\"0\" fill=\"#AE8A3E\" opacity=\"1\" /><text x=\"54\" y=\"236\" font-size=\"16\" fill=\"#1B2B33\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >④ OR 选择率<\/text><text x=\"54\" y=\"280\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >把 OR 输入近似看作不重叠<\/text><text x=\"54\" y=\"312\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >选择率 clamp 到 1.0<\/text><rect x=\"500\" y=\"212\" width=\"440\" height=\"140\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"500\" y=\"212\" width=\"440\" height=\"36\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"514\" y=\"236\" font-size=\"16\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >⑤ enable_bitmapscan<\/text><text x=\"514\" y=\"280\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >只影响是否使用该类计划类型<\/text><text x=\"514\" y=\"312\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >默认开启；它不是语义开关<\/text><rect x=\"960\" y=\"212\" width=\"400\" height=\"140\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"960\" y=\"212\" width=\"400\" height=\"36\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"974\" y=\"236\" font-size=\"16\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >⑥ 统计信息<\/text><text x=\"974\" y=\"280\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >ANALYZE + 扩展统计信息描述多列相关性<\/text><text x=\"974\" y=\"312\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >相关性强时独立相乘会严重估错行数<\/text><rect x=\"40\" y=\"366\" width=\"1320\" height=\"54\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"56\" y=\"390\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >整条链都压在选择率与 page 数估算上 —— 所以统计信息不是可选项<\/text><text x=\"56\" y=\"411\" font-size=\"12.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >cost_bitmap_heap_scan / cost_bitmap_and_node / cost_bitmap_or_node / compute_bitmap_pages（costsize.c）<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "并行 · 共享 bitmap", "title": "并行的是 heap，不是底层 index scan", "lede": "第一个看到 BM_INITIAL 的进程成为 leader 独自构建 bitmap；BM_FINISHED 后，worker 靠 DSA + shared iterator 共同迭代 heap blocks。", "caption": "图 13　三态协作与 worker 分工；worker 数量可调，状态为示意。", "bridge": "并行的边界看清了，把它和别的扫描方法并排摆一摆。", "notes": "能，但只对一半。文档说得很清楚：parallel bitmap heap scan 里，第一个看到 BM_INITIAL 的进程成为 leader，它去扫一个或多个索引把 bitmap 建出来；其他进程看到 BM_INPROGRESS 就等着；等状态变成 BM_FINISHED，大家再靠 DSA 和 shared iterator 一起迭代，把要访问的 table blocks 分掉。也就是说，heap scan 并行，底层 index scan 不并行。点播放看这三态怎么走，还能改 worker 数量。边界也就在这儿：如果瓶颈在 heap block 访问和 tuple recheck，并行有帮助；如果瓶颈就在那一个进程建 bitmap，或者上层节点汇聚，再加 worker 也快不了多少。把它跟别的扫描方法摆在一起看，差别会更清楚。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"40\" y=\"24\" font-size=\"19\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >并行的是 heap scan，底层 index scan 不并行<\/text><rect x=\"1210\" y=\"8\" width=\"150\" height=\"22\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1285\" y=\"22.91\" font-size=\"11.5\" fill=\"#AE8A3E\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >状态机示意<\/text><text x=\"40\" y=\"44\" font-size=\"12.5\" fill=\"#89938F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >第一个看到 BM_INITIAL 的进程成为 leader；其余 worker 等待共享 bitmap 就绪<\/text><rect x=\"40\" y=\"56\" width=\"400\" height=\"90\" rx=\"0\" fill=\" e-width=\"2\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-prim)\"/><path d=\"M 890 101 L 920 101\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"2\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-prim)\"/><path d=\"M 1140 146 L 1140 168 L 195 168\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"/><g id=\"c-w0\"><rect x=\"40\" y=\"190\" width=\"310\" height=\"90\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#2F7A66\" stroke-width=\"1.5\" opacity=\"1\" id=\"c-w0-r\"/><text x=\"56\" y=\"220\" font-size=\"16\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >Worker 1<\/text><text x=\"56\" y=\"246\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >取下一批 heap block<\/text><text x=\"56\" y=\"268\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >MVCC 判断 + recheck<\/text><\/g><path d=\"M 195 168 L 195 190\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-prim)\"/><g id=\"c-w1\"><rect x=\"380\" y=\"190\" width=\"310\" height=\"90\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#2F7A66\" stroke-width=\"1.5\" opacity=\"1\" id=\"c-w1-r\"/><text x=\"396\" y=\"220\" font-size=\"16\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >Worker 2<\/text><text x=\"396\" y=\"246\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >取下一批 heap block<\/text><text x=\"396\" y=\"268\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >MVCC 判断 + recheck<\/text><\/g><path d=\"M 535 168 L 535 190\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-prim)\"/><g id=\"c-w2\"><rect x=\"720\" y=\"190\" width=\"310\" height=\"90\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#2F7A66\" stroke-width=\"1.5\" opacity=\"1\" id=\"c-w2-r\"/><text x=\"736\" y=\"220\" font-size=\"16\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >Worker 3<\/text><text x=\"736\" y=\"246\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >取下一批 heap block<\/text><text x=\"736\" y=\"268\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >MVCC 判断 + recheck<\/text><\/g><path d=\"M 875 168 L 875 190\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-prim)\"/><g id=\"c-w3\"><rect x=\"1060\" y=\"190\" width=\"310\" height=\"90\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#2F7A66\" stroke-width=\"1.5\" opacity=\"1\" id=\"c-w3-r\"/><text x=\"1076\" y=\"220\" font-size=\"16\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >Worker 4<\/text><text x=\"1076\" y=\"246\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >取下一批 heap block<\/text><text x=\"1076\" y=\"268\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >MVCC 判断 + recheck<\/text><\/g><path d=\"M 1215 168 L 1215 190\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-prim)\"/><rect x=\"40\" y=\"296\" width=\"440\" height=\"50\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" id=\"c-s0\"/><text x=\"54\" y=\"318\" font-size=\"14.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" id=\"c-s0t\">BM_INITIAL<\/text><text x=\"54\" y=\"338\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" id=\"c-s0s\">bitmap 创建尚未开始<\/text><rect x=\"480\" y=\"296\" width=\"440\" height=\"50\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" id=\"c-s1\"/><text x=\"494\" y=\"318\" font-size=\"14.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" id=\"c-s1t\">BM_INPROGRESS<\/text><text x=\"494\" y=\"338\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" id=\"c-s1s\">某进程正在建，其余等待<\/text><rect x=\"920\" y=\"296\" width=\"440\" height=\"50\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" id=\"c-s2\"/><text x=\"934\" y=\"318\" font-size=\"14.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" id=\"c-s2t\">BM_FINISHED<\/text><text x=\"934\" y=\"338\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" id=\"c-s2s\">worker 可共同迭代<\/text><rect x=\"40\" y=\"358\" width=\"1320\" height=\"62\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"56\" y=\"381\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >边界：瓶颈在 heap block 访问与 tuple recheck 时并行有帮助；瓶颈在单进程建 bitmap 或上层汇聚时收益受限<\/text><text x=\"56\" y=\"404\" font-size=\"12.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >源码：nodeBitmapHeapscan.c 的 ParallelBitmapHeapState / SharedBitmapState；文档：parallel.sgml<\/text><\/svg>", "ctrl": "<label>worker 数<\/label><select id=\"c-workers\"><option value=\"2\">2<\/option><option value=\"3\" selected>3<\/option><option value=\"4\">4<\/option><\/select><button class=\"btn play\" id=\"c-play\">▶ 播放<\/button><button class=\"btn\" id=\"c-step\">单步 →<\/button><button class=\"btn\" id=\"c-reset\">重置<\/button><span class=\"out\" id=\"c-out\"><\/span>"}, {"eyebrow": "横向 · 五种路径", "title": "把成本结构摆平了看，而不是比高低", "lede": "目标、读取模式、启动成本、排序能力、内存敏感度、适合场景逐项对照；持久化 bitmap index 属于另一类结构。", "caption": "图 14　四种 PostgreSQL 扫描路径的关键维度对比。", "bridge": "每种收益都连着一项成本，把这笔账算完整。", "notes": "这张表把几种路径摆平了看。目标、读取模式、启动成本、排序能力、内存敏感度、适合场景，一行行对下来，bitmap heap scan 的性格就很鲜明：它用较高的启动成本，换 heap 访问的物理顺序，和多索引组合的灵活度；代价是丢了索引顺序、受 work_mem 牵制。Index Only Scan 走的是另一个方向——尽量别回表。我还留了一句提醒：持久化 bitmap index 是另一类结构，写放大明显、适合低基数读多写少的分析场景，PostgreSQL core 里没有。所以它不是谁的高级版，只是成本结构不同。既然每种收益都连着成本，我们把这笔账算完整。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"40\" y=\"26\" font-size=\"19\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >把五种路径摆平了看：成本结构不同，不是等级不同<\/text><rect x=\"40\" y=\"56\" width=\"190\" height=\"48\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"52\" y=\"84.55\" font-size=\"13\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >维度<\/text><rect x=\"230\" y=\"56\" width=\"285\" height=\"48\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"242\" y=\"84.55\" font-size=\"13\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >Bitmap Heap Scan<\/text><rect x=\"515\" y=\"56\" width=\"285\" height=\"48\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"527\" y=\"84.55\" font-size=\"13\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >Index Scan<\/text><rect x=\"800\" y=\"56\" width=\"285\" height=\"48\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"812\" y=\"84.55\" font-size=\"13\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0
