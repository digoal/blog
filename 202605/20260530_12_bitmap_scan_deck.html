oke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"56\" y=\"416\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >另一类：持久化 Bitmap Index —— 写放大明显、适合低基数读多写少；PostgreSQL core 不含此结构<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "代价 · 收益成对", "title": "每一项收益，都紧跟着一项成本", "lede": "集合运算省回表范围却要先付启动成本；按 block 访问变顺序却丢了索引顺序；exact 少查 tuple 但 lossify 后 CPU 上升；并行也可能卡在单进程建 bitmap。", "caption": "图 15　五组「收益 → 代价」的成对关系。", "bridge": "账算完了，落到 EXPLAIN 上，该盯哪几行？", "notes": "左边是收益，右边是紧跟着的成本，几乎一一对应。集合运算省了回表范围，但启动成本必须先付；按 block 访问变顺序了，可原索引顺序也丢了，ORDER BY 可能多一个 Sort；exact page 只查命中的 offset，一旦 lossify，recheck 和 CPU 就上来；lossy 换来了内存上界，内存预算和并发乘数得一起算；并行 heap scan 能分摊，可单进程建 bitmap 和上层汇聚变成新瓶颈。还有两个观测上的小陷阱我放到下一页讲。总之别把 bitmap scan 当升级版的 index scan——它解决的是「大量随机 TID 回表」这一种具体成本结构。那 EXPLAIN 里到底该盯哪几行？", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"40\" y=\"26\" font-size=\"19\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >每一项收益，都紧跟着一项成本<\/text><rect x=\"40\" y=\"48\" width=\"600\" height=\"58\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" opacity=\"1\" /><text x=\"56\" y=\"82.1\" font-size=\"15\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >多索引结果先在内存做集合运算<\/text><rect x=\"760\" y=\"48\" width=\"600\" height=\"58\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"776\" y=\"82.1\" font-size=\"15\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >启动成本高：必须先扫索引、建完 bitmap<\/text><path d=\"M 640 77 L 760 77\" fill=\"none\" stroke=\"#AE8A3E\" stroke-width=\"1.5\" stroke-linejoin=\"miter\"/><rect x=\"668\" y=\"64\" width=\"64\" height=\"26\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"700\" y=\"81.08\" font-size=\"12\" fill=\"#AE8A3E\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >换来<\/text><rect x=\"40\" y=\"116\" width=\"600\" height=\"58\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" opacity=\"1\" /><text x=\"56\" y=\"150.1\" font-size=\"15\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >heap 访问按 block 组织，随机 I/O 变少<\/text><rect x=\"760\" y=\"116\" width=\"600\" height=\"58\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"776\" y=\"150.1\" font-size=\"15\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >原索引顺序丢失，ORDER BY 可能多一个 Sort<\/text><path d=\"M 640 145 L 760 145\" fill=\"none\" stroke=\"#AE8A3E\" stroke-width=\"1.5\" stroke-linejoin=\"miter\"/><rect x=\"668\" y=\"132\" width=\"64\" height=\"26\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"700\" y=\"149.08\" font-size=\"12\" fill=\"#AE8A3E\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >换来<\/text><rect x=\"40\" y=\"184\" width=\"600\" height=\"58\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" opacity=\"1\" /><text x=\"56\" y=\"218.1\" font-size=\"15\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >exact page 只检查命中的 offsets<\/text><rect x=\"760\" y=\"184\" width=\"600\" height=\"58\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"776\" y=\"218.1\" font-size=\"15\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >lossify 后整页检查，recheck 与 CPU 上升<\/text><path d=\"M 640 213 L 760 213\" fill=\"none\" stroke=\"#AE8A3E\" stroke-width=\"1.5\" stroke-linejoin=\"miter\"/><rect x=\"668\" y=\"200\" width=\"64\" height=\"26\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"700\" y=\"217.08\" font-size=\"12\" fill=\"#AE8A3E\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >换来<\/text><rect x=\"40\" y=\"252\" width=\"600\" height=\"58\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" opacity=\"1\" /><text x=\"56\" y=\"286.1\" font-size=\"15\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >lossy 表示换来了内存上界<\/text><rect x=\"760\" y=\"252\" width=\"600\" height=\"58\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"776\" y=\"286.1\" font-size=\"15\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >work_mem 与并发乘数要一起算预算<\/text><path d=\"M 640 281 L 760 281\" fill=\"none\" stroke=\"#AE8A3E\" stroke-width=\"1.5\" stroke-linejoin=\"miter\"/><rect x=\"668\" y=\"268\" width=\"64\" height=\"26\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"700\" y=\"285.08\" font-size=\"12\" fill=\"#AE8A3E\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >换来<\/text><rect x=\"40\" y=\"320\" width=\"600\" height=\"58\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" opacity=\"1\" /><text x=\"56\" y=\"354.1\" font-size=\"15\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >parallel bitmap heap scan 分摊访问<\/text><rect x=\"760\" y=\"320\" width=\"600\" height=\"58\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"776\" y=\"354.1\" font-size=\"15\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >单进程建 bitmap、上层汇聚成为新瓶颈<\/text><path d=\"M 640 349 L 760 349\" fill=\"none\" stroke=\"#AE8A3E\" stroke-width=\"1.5\" stroke-linejoin=\"miter\"/><rect x=\"668\" y=\"336\" width=\"64\" height=\"26\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"700\" y=\"353.08\" font-size=\"12\" fill=\"#AE8A3E\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >换来<\/text><rect x=\"40\" y=\"388\" width=\"1320\" height=\"32\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"56\" y=\"409\" font-size=\"13.5\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >别把 bitmap scan 理解成「更高级的 index scan」：它只解决「大量随机 TID 回表」这一种成本结构<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "观测 · EXPLAIN", "title": "三处最容易误读的地方", "lede": "Recheck Cond 只表示保留原条件；判断精度看 Heap Blocks: exact/lossy 与 Rows Removed by Index Recheck；BitmapAnd/Or 的 actual rows 恒为 0。", "caption": "图 16　一段示意 EXPLAIN 结构（数值留空）与三条判读规则。", "bridge": "知道看什么，就得自己跑一遍验证。", "notes": "三处最容易误读。第一，Recheck Cond：它表示计划保留了原条件用于复核，不等于真的复核了很多行。第二，判断精度要看 Heap Blocks 的 exact 和 lossy，配合 Rows Removed by Index Recheck 和实际行数与估算的偏差，光看 Recheck Cond 会误判。第三，BitmapAnd 和 BitmapOr 在 EXPLAIN ANALYZE 里 actual rows 恒为 0，这是实现限制——因为 bitmap 一旦 lossy，压根没法数清到底多少行，看上层 Bitmap Heap Scan 的行数才对。顺带一个统计口径：bitmap scan 会增加所用索引的 idx_tup_read、增加表的 idx_tup_fetch，但不增加某个具体索引的 idx_tup_fetch，因为 heap fetch 很难归因到单个索引。知道了看什么，就得自己跑一遍。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"40\" y=\"26\" font-size=\"19\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >EXPLAIN 里最容易误读的三行<\/text><rect x=\"40\" y=\"56\" width=\"700\" height=\"320\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"56\" y=\"86\" font-size=\"13.5\" fill=\"#245A6B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >Bitmap Heap Scan on demo_bitmap_scan<\/text><text x=\"56\" y=\"122\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >  Recheck Cond: (...)<\/text><text x=\"56\" y=\"158\" font-size=\"13.5\" fill=\"#BE653B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >  Heap Blocks: exact=... lossy=...<\/text><text x=\"56\" y=\"194\" font-size=\"13.5\" fill=\"#BE653B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >  Rows Removed by Index Recheck: ...<\/text><text x=\"56\" y=\"230\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >  -&gt; BitmapAnd   (actual ... rows=0 ...)<\/text><text x=\"56\" y=\"266\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >       -&gt; Bitmap Index Scan on ..._city_idx<\/text><text x=\"56\" y=\"302\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >       -&gt; Bitmap Index Scan on ..._status_idx<\/text><text x=\"56\" y=\"338\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >  （示意结构 · 数值留空 · 未运行实例）<\/text><path d=\"M 740 100 L 770 100\" fill=\"none\" stroke=\"#AE8A3E\" stroke-width=\"1.6\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-gold)\"/><path d=\"M 740 206 L 770 206\" fill=\"none\" stroke=\"#AE8A3E\" stroke-width=\"1.6\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-gold)\"/><path d=\"M 740 312 L 770 312\" fill=\"none\" stroke=\"#AE8A3E\" stroke-width=\"1.6\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-gold)\"/><rect x=\"770\" y=\"56\" width=\"590\" height=\"96\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"786\" y=\"99.4\" font-size=\"10\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >① Recheck Cond 不等于大量复核<\/text><text x=\"786\" y=\"115.4\" font-size=\"10\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >它只表示计划上保留了原 bitmap 条件；是否真的复核很多行，取决于 page 是否 lossy、索引 AM 是否要求 recheck。<\/text><rect x=\"770\" y=\"162\" width=\"590\" height=\"96\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"786\" y=\"205.17\" font-size=\"10.5\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >② 判断精度看 Heap Blocks<\/text><text x=\"786\" y=\"221.97\" font-size=\"10.5\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >exact=… lossy=… 配合 Rows Removed by Index Recheck、实际行数与估算行数偏差，才是精度与代价的观测项。<\/text><rect x=\"770\" y=\"268\" width=\"590\" height=\"96\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"786\" y=\"310.71\" font-size=\"11.5\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >③ BitmapAnd / BitmapOr 的 rows 恒为 0<\/text><text x=\"786\" y=\"329.11\" font-size=\"11.5\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >文档注明这是实现限制：bitmap 一旦 lossy 就无法数清行数；要读行数请看上层 Bitmap Heap Scan。<\/text><rect x=\"40\" y=\"382\" width=\"1320\" height=\"38\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"56\" y=\"406\" font-size=\"12.8\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >统计口径：bitmap scan 增加所用索引的 idx_tup_read 与表的 idx_tup_fetch，但不增加某个具体索引的 idx_tup_fetch<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "验证 · DEMO", "title": "三步 DEMO：验证顺序比调参更重要", "lede": "造表与两个单列索引 → 组合条件看 BitmapAnd 与 Heap Blocks → 用 LIMIT 5 和 work_mem=64kB 做两组对照。", "caption": "图 17　可执行 SQL 骨架与四个观测项；原文未运行实例，不提供实测输出。", "bridge": "跑完之后，适合与不适合的边界就具体了。", "notes": "原文给了一套能直接执行的 SQL，但有个诚实的前提：作者没有启动本地实例，所以没有贴任何实测输出。我这里也不编数字，只给验证顺序。第一步，造一张百万行的表，建两个单列索引，记得 ANALYZE。第二步，EXPLAIN (ANALYZE, BUFFERS) 跑组合条件，看计划里有没有 BitmapAnd、Heap Blocks 的 exact 和 lossy 是多少。第三步做两组对照：加 LIMIT 5，看优化器是不是因为启动成本躲开了 bitmap scan；再把 work_mem 设到 64kB，看 lossy page 和 Rows Removed by Index Recheck 怎么变。调大 work_mem 能不能救，得结合并发预算和整体计划比。跑完这些，边界自然就清楚了。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"40\" y=\"26\" font-size=\"19\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >三步 DEMO：验证顺序比调参更重要<\/text><rect x=\"40\" y=\"56\" width=\"430\" height=\"270\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"40\" y=\"56\" width=\"430\" height=\"40\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"54\" y=\"82\" font-size=\"16\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >① 造表与索引<\/text><text x=\"54\" y=\"132\" font-size=\"13\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >CREATE TABLE demo_bitmap_scan (...)<\/text><text x=\"54\" y=\"168\" font-size=\"13\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >INSERT ... 1000000 行<\/text><text x=\"54\" y=\"204\" font-size=\"13\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >CREATE INDEX ..._city_idx<\/text><text x=\"54\" y=\"240\" font-size=\"13\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >CREATE INDEX ..._status_idx<\/text><text x=\"54\" y=\"276\" font-size=\"13\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >ANALYZE demo_bitmap_scan;<\/text><rect x=\"490\" y=\"56\" width=\"430\" height=\"270\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"490\" y=\"56\" width=\"430\" height=\"40\" rx=\"0\" fill=\"#47808D\" opacity=\"1\" /><text x=\"504\" y=\"82\" font-size=\"16\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >② 组合条件<\/text><text x=\"504\" y=\"132\" font-size=\"13\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >EXPLAIN (ANALYZE, BUFFERS)<\/text><text x=\"504\" y=\"168\" font-size=\"13\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >SELECT * FROM demo_bitmap_scan<\/text><text x=\"504\" y=\"204\" font-size=\"13\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >WHERE city_id BETWEEN 10 AND 30<\/text><text x=\"504\" y=\"240\" font-size=\"13\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >  AND status IN (1, 2);<\/text><text x=\"504\" y=\"276\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >→ 看 BitmapAnd / Heap Blocks<\/text><rect x=\"940\" y=\"56\" width=\"420\" height=\"270\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"940\" y=\"56\" width=\"420\" height=\"40\" rx=\"0\" fill=\"#AE8A3E\" opacity=\"1\" /><text x=\"954\" y=\"82\" font-size=\"16\" fill=\"#1B2B33\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >③ 两组对照<\/text><text x=\"954\" y=\"132\" font-size=\"13\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >EXPLAIN ... LIMIT 5;<\/text><text x=\"954\" y=\"168\" font-size=\"13\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >SET work_mem = '64kB';<\/text><text x=\"954\" y=\"204\" font-size=\"13\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >EXPLAIN (ANALYZE, BUFFERS) ...<\/text><text x=\"954\" y=\"240\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >→ 看 lossy / Rows Removed<\/text><text x=\"954\" y=\"276\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >→ 看计划里是否多出 Sort<\/text><rect x=\"40\" y=\"342\" width=\"320\" height=\"34\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" opacity=\"1\" /><text x=\"200\" y=\"363.42\" font-size=\"13\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >看 Heap Blocks: exact / lossy<\/text><rect x=\"373\" y=\"342\" width=\"320\" height=\"34\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" opacity=\"1\" /><text x=\"533\" y=\"363.42\" font-size=\"13\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >看 Rows Removed by Index Recheck<\/text><rect x=\"706\" y=\"342\" width=\"320\" height=\"34\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" opacity=\"1\" /><text x=\"866\" y=\"363.42\" font-size=\"13\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >看估算行数 vs 实际行数<\/text><rect x=\"1039\" y=\"342\" width=\"320\" height=\"34\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1199\" y=\"363.42\" font-size=\"13\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >看是否多出 Sort<\/text><rect x=\"40\" y=\"388\" width=\"1320\" height=\"32\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"56\" y=\"409\" font-size=\"12.8\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >诚实前提：原文未启动本地 PostgreSQL 实例，未给出实测输出；此处 SQL 可执行，数值留空由读者自测<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "边界 · 场景", "title": "适合与不适合的分界线", "lede": "大表多条件组合、命中 page 可收敛、不依赖索引顺序时值得；点查、Top-N、近全表、小 work_mem、相关性缺统计、高并发 OLTP 堆索引时不值得。", "caption": "图 18　适合与不适合场景，以及三个同时成立的判据。", "bridge": "边界清楚了，不同角色该做的动作并不一样。", "notes": "适合的一边：大表上两个或多个条件各有不错的选择率、组合后结果明显缩小；单个索引命中不少行但命中的 heap page 远少于全表；WHERE a 等于某个值 OR a 等于另一个值、x 等于某值 AND y 等于某值，这种能拆成多个 bitmap 子路径的；GIN、GiST、BRIN 这类本来就要 recheck 的访问方法；还有查询压根不依赖索引顺序的。不适合的一边：极低选择率的点查、小 LIMIT 和 Top-N、要返回表中很大比例、work_mem 很小还撞上大结果集、条件相关性强但统计信息不足、以及高并发 OLTP 里为了少数复杂筛选堆一堆单列索引。一句话，还是那三个判据：中等选择率、page 可收敛、不依赖顺序。落到日常，不同角色该做的动作其实不一样。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"40\" y=\"26\" font-size=\"19\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >适合与不适合：三个判据同时成立才值得<\/text><rect x=\"40\" y=\"56\" width=\"650\" height=\"320\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"40\" y=\"56\" width=\"650\" height=\"44\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"58\" y=\"85.2\" font-size=\"20\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >适合<\/text><rect x=\"58\" y=\"175.26\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"75\" y=\"182.54\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >大表上两个或多个条件各有较好选择率，组合后明显缩小<\/text><rect x=\"58\" y=\"202.26\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"75\" y=\"209.54\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >单索引命中行不少，但命中 heap page 明显少于全表<\/text><rect x=\"58\" y=\"229.26\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"75\" y=\"236.54\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >WHERE a=… OR a=…、x=… AND y=… 能拆成多个 bitmap 子路径<\/text><rect x=\"58\" y=\"256.26\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"75\" y=\"263.54\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >GIN / GiST / BRIN 返回候选集合后需要 heap recheck<\/text><rect x=\"58\" y=\"283.26\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"75\" y=\"290.54\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >查询不依赖索引顺序，或额外排序成本可接受<\/text><rect x=\"710\" y=\"56\" width=\"650\" height=\"320\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"710\" y=\"56\" width=\"650\" height=\"44\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"728\" y=\"85.2\" font-size=\"20\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >不适合<\/text><rect x=\"728\" y=\"161.76\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"745\" y=\"169.04\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >极低选择率点查，普通 Index Scan 更直接<\/text><rect x=\"728\" y=\"188.76\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"745\" y=\"196.04\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >小 LIMIT、Top-N，尤其索引顺序能直接满足 ORDER BY<\/text><rect x=\"728\" y=\"215.76\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"745\" y=\"223.04\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >需要返回表中很大比例数据，Seq Scan 更稳定<\/text><rect x=\"728\" y=\"242.76\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"745\" y=\"250.04\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >work_mem 很小且结果集大，lossy 多到 recheck 过高<\/text><rect x=\"728\" y=\"269.76\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"745\" y=\"277.04\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >条件相关性强但统计信息不足，优化器容易误判<\/text><rect x=\"728\" y=\"296.76\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"745\" y=\"304.04\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >高并发 OLTP 里为少数复杂筛选堆大量单列索引<\/text><rect x=\"40\" y=\"388\" width=\"1320\" height=\"32\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"56\" y=\"409\" font-size=\"13.5\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >判据：中等选择率 + 命中 page 可收敛 + 不依赖索引顺序<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "实践 · 三类角色", "title": "架构师 / DBA / 业务开发者，各做什么", "lede": "架构师做索引形态取舍；DBA 管统计信息与观测；开发者盯 LIMIT、ORDER BY 与谓词可索引性。", "caption": "图 19　三类角色的最佳实践对照。", "bridge": "动作都对了，最后再看一眼那些反复出现的老坑。", "notes": "架构师要把它放回扫描方法谱系里定位，多条件查询先比一比「一个多列索引」和「多个单列索引加 bitmap AND」哪个更合算，固定组合通常多列索引更狠，查询形态常变则单列更灵活；读多写少、低中基数字段多的分析型系统，可以去研究持久化 bitmap index、Roaring bitmap、列存 zone map，别误以为 core 已经给了。DBA 那边，定期 ANALYZE、必要时上扩展统计信息描述多列相关性；盯 EXPLAIN (ANALYZE, BUFFERS) 的四项指标；别粗暴关 enable_bitmapscan，只在定位问题时临时对比；work_mem 按并发乘数估。业务开发者记住三条：小 LIMIT 靠索引快速返回，别指望 bitmap scan 提前停；搜索页那种多可选筛选项，单列索引加 bitmap scan 可能比堆组合索引现实，但要拿真实参数压测；ORDER BY 要紧就留意计划里多出来的 Sort。剩下就是别踩那些老坑。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"40\" y=\"26\" font-size=\"19\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >同一机制，不同职责上的动作并不一样<\/text><rect x=\"40\" y=\"56\" width=\"440\" height=\"320\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"40\" y=\"56\" width=\"440\" height=\"44\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"58\" y=\"85.2\" font-size=\"20\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >架构师<\/text><rect x=\"58\" y=\"161.59\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"75\" y=\"168.61\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >把 bitmap scan 放回扫描方法谱系中定位<\/text><rect x=\"58\" y=\"188.59\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"75\" y=\"195.61\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >固定谓词组合优先测多列索引；查询形态多变再考虑多个单列索<\/text><text x=\"75\" y=\"222.61\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >引 + bitmap AND<\/text><rect x=\"58\" y=\"242.59\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"75\" y=\"249.61\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >分析型系统另研究持久化 bitmap index、Roaring bitmap、<\/text><text x=\"75\" y=\"276.61\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >列存 zone map<\/text><rect x=\"58\" y=\"296.59\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"75\" y=\"303.61\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >不要误以为 core 已提供持久化位图结构<\/text><rect x=\"500\" y=\"56\" width=\"440\" height=\"320\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"500\" y=\"56\" width=\"440\" height=\"44\" rx=\"0\" fill=\"#47808D\" opacity=\"1\" /><text x=\"518\" y=\"85.2\" font-size=\"20\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >DBA<\/text><rect x=\"518\" y=\"175.09\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#47808D\" opacity=\"1\" /><text x=\"535\" y=\"182.11\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >定期 ANALYZE，必要时用扩展统计信息描述多列相关性<\/text><rect x=\"518\" y=\"202.09\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#47808D\" opacity=\"1\" /><text x=\"535\" y=\"209.11\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >盯 EXPLAIN (ANALYZE, BUFFERS) 的 exact/lossy、<\/text><text x=\"535\" y=\"236.11\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >recheck、行数偏差<\/text><rect x=\"518\" y=\"256.09\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#47808D\" opacity=\"1\" /><text x=\"535\" y=\"263.11\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >不要粗暴关闭 enable_bitmapscan，只在定位时临时对比<\/text><rect x=\"518\" y=\"283.09\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#47808D\" opacity=\"1\" /><text x=\"535\" y=\"290.11\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >work_mem 按并发乘数估算，别只看单条 SQL<\/text><rect x=\"960\" y=\"56\" width=\"400\" height=\"320\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"960\" y=\"56\" width=\"400\" height=\"44\" rx=\"0\" fill=\"#AE8A3E\" opacity=\"1\" /><text x=\"978\" y=\"85.2\" font-size=\"20\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >业务开发者<\/text><rect x=\"978\" y=\"174.92\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#AE8A3E\" opacity=\"1\" /><text x=\"995\" y=\"181.68\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >小 LIMIT 查询设计能快速返回的索引，别指望提前停止<\/text><rect x=\"978\" y=\"201.92\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#AE8A3E\" opacity=\"1\" /><text x=\"995\" y=\"208.68\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >多可选筛选项搜索页可用单列索引 + bitmap scan，但要<\/text><text x=\"995\" y=\"235.68\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >用真实参数压测<\/text><rect x=\"978\" y=\"255.92\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#AE8A3E\" opacity=\"1\" /><text x=\"995\" y=\"262.68\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >ORDER BY 要紧就留意计划里多出来的 Sort<\/text><rect x=\"978\" y=\"282.92\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#AE8A3E\" opacity=\"1\" /><text x=\"995\" y=\"289.68\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >谓词保持可索引：别用函数包住列，除非有对应表达式索引<\/text><rect x=\"40\" y=\"388\" width=\"1320\" height=\"32\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"56\" y=\"409\" font-size=\"13.5\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >共同点：先用 EXPLAIN (ANALYZE, BUFFERS) 看清事实，再谈索引设计与参数调整<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "避坑 · 七个常见误读", "title": "七个坑，大多指向同一个误会", "lede": "概念、观测、配置、顺序四类误读，共同根源是把「执行期的临时候选位置集合」当成了别的东西。", "caption": "图 20　七个常见坑按成因归类。", "bridge": "坑大多指向同一个误会；把整条链压成一张剖面收尾。", "notes": "七个坑，其实能归成四类。概念类：把 Bitmap Index Scan 当成 bitmap index；误读 BitmapAnd 和 BitmapOr 的 rows 等于 0。观测类：看见 Recheck Cond 就以为索引失效；统计信息过旧还拿旧分布做判断。配置类：用很小的 work_mem 跑大范围扫描；只看单列索引不评估多列索引。还有一类是顺序：忘了 bitmap scan 按 heap block 走，不保证索引顺序。你会发现它们大多指向同一个误会——把「执行期的临时候选集合」当成了别的东西。分清这一点，大半坑自动就填了。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"40\" y=\"26\" font-size=\"19\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >七个坑，大多指向同一个误会<\/text><rect x=\"40\" y=\"48\" width=\"120\" height=\"42\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"100\" y=\"75\" font-size=\"15\" fill=\"#FFFFFF\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >概念<\/text><rect x=\"168\" y=\"48\" width=\"1192\" height=\"42\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"184\" y=\"74.1\" font-size=\"15\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >把 Bitmap Index Scan 当成磁盘上的「bitmap index」<\/text><rect x=\"40\" y=\"95\" width=\"120\" height=\"42\" rx=\"0\" fill=\"#AE8A3E\" opacity=\"1\" /><text x=\"100\" y=\"122\" font-size=\"15\" fill=\"#FFFFFF\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >观测<\/text><rect x=\"168\" y=\"95\" width=\"1192\" height=\"42\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"184\" y=\"121.1\" font-size=\"15\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >看到 Recheck Cond 就以为索引失效<\/text><rect x=\"40\" y=\"142\" width=\"120\" height=\"42\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"100\" y=\"169\" font-size=\"15\" fill=\"#FFFFFF\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >顺序<\/text><rect x=\"168\" y=\"142\" width=\"1192\" height=\"42\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"184\" y=\"168.1\" font-size=\"15\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >忽略顺序丢失，ORDER BY 可能需要额外 Sort<\/text><rect x=\"40\" y=\"189\" width=\"120\" height=\"42\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"100\" y=\"216\" font-size=\"15\" fill=\"#FFFFFF\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >配置<\/text><rect x=\"168\" y=\"189\" width=\"1192\" height=\"42\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"184\" y=\"215.1\" font-size=\"15\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >用很小的 work_mem 跑大范围 bitmap scan<\/text><rect x=\"40\" y=\"236\" width=\"120\" height=\"42\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"100\" y=\"263\" font-size=\"15\" fill=\"#FFFFFF\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >配置<\/text><rect x=\"168\" y=\"236\" width=\"1192\" height=\"42\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"184\" y=\"262.1\" font-size=\"15\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >只建单列索引，不评估多列索引<\/text><rect x=\"40\" y=\"283\" width=\"120\" height=\"42\" rx=\"0\" fill=\"#AE8A3E\" opacity=\"1\" /><text x=\"100\" y=\"310\" font-size=\"15\" fill=\"#FFFFFF\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >观测<\/text><rect x=\"168\" y=\"283\" width=\"1192\" height=\"42\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"184\" y=\"309.1\" font-size=\"15\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >误读 BitmapAnd / BitmapOr 的 actual rows=0<\/text><rect x=\"40\" y=\"330\" width=\"120\" height=\"42\" rx=\"0\" fill=\"#AE8A3E\" opacity=\"1\" /><text x=\"100\" y=\"357\" font-size=\"15\" fill=\"#FFFFFF\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >观测<\/text><rect x=\"168\" y=\"330\" width=\"1192\" height=\"42\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"184\" y=\"356.1\" font-size=\"15\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >统计信息过旧，选择率与 page 数估算失真<\/text><rect x=\"40\" y=\"382\" width=\"1320\" height=\"38\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"56\" y=\"406\" font-size=\"13.2\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >共同根源：把「执行期的临时候选位置集合」当成了别的东西 —— 分清这一点，大半坑自动填平<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "收束 · 一句话定位", "title": "它不是更高级的 Index Scan", "lede": "把整条链压成七层剖面：索引层→集合层→合并层→表访问层→约束层→估算层→决策层。越深的靛青越底层。", "caption": "图 21　全篇机制的七层剖面，从最底层的索引接口到最上层的查询决策。", "bridge": "谢谢。带着那几个问题，去自己的库里跑一遍 EXPLAIN。", "notes": "最后把整条链压成一张剖面。最底是索引层，amgetbitmap 批量交出 TID；往上是集合层，TIDBitmap 用 exact 和 lossy 表示；再往上合并层做 AND 和 OR；然后表访问层按 block 顺序读 heap 并 recheck；约束层是 work_mem 决定精度；估算层靠成本模型和统计信息；最上面才是决策层——中等选择率、page 可收敛、不依赖顺序。越深的靛青越底层，越浅的越靠近你写的那条 SQL。所以一句话收尾：它不是比 index scan 更高级，只是把大量随机回表，改成了先收集、再按页访问。留几个问题给愿意往下挖的人：amgetbitmap 为什么不能 index-only？两个单列索引 AND 和一条多列 B-tree，启动成本、排序能力、写入成本各怎么变？lossy 很高的时候，你会先调 work_mem、改索引、改 SQL，还是干脆接受 Seq Scan——验证顺序是什么？", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"40\" y=\"24\" font-size=\"19\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" " font-size=\"15\" fill=\"#FFFFFF\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >3<\/text><text x=\"112\" y=\"165\" font-size=\"17\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >合并层<\/text><text x=\"360\" y=\"165\" font-size=\"14.5\" fill=\"#FFFFFF\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >BitmapAnd / BitmapOr：tbm_intersect / tbm_union<\/text><rect x=\"40\" y=\"184\" width=\"1320\" height=\"44\" rx=\"0\" fill=\"#74A5AD\" opacity=\"1\" /><rect x=\"56\" y=\"192\" width=\"40\" height=\"28\" rx=\"0\" fill=\"#245A6B\" opacity=\"0.18\" /><text x=\"76\" y=\"212\" font-size=\"15\" fill=\"#1B2B33\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >4<\/text><text x=\"112\" y=\"213\" font-size=\"17\" fill=\"#1B2B33\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >表访问层<\/text><text x=\"360\" y=\"213\" font-size=\"14.5\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >按 block 顺序读 heap + MVCC 判断 + recheck<\/text><rect x=\"40\" y=\"232\" width=\"1320\" height=\"44\" rx=\"0\" fill=\"#A4C4C6\" opacity=\"1\" /><rect x=\"56\" y=\"240\" width=\"40\" height=\"28\" rx=\"0\" fill=\"#245A6B\" opacity=\"0.18\" /><text x=\"76\" y=\"260\" font-size=\"15\" fill=\"#1B2B33\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >5<\/text><text x=\"112\" y=\"261\" font-size=\"17\" fill=\"#1B2B33\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >约束层<\/text><text x=\"360\" y=\"261\" font-size=\"14.5\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >work_mem 决定精度，lossify 换内存上界<\/text><rect x=\"40\" y=\"280\" width=\"1320\" height=\"44\" rx=\"0\" fill=\"#CFE0DC\" opacity=\"1\" /><rect x=\"56\" y=\"288\" width=\"40\" height=\"28\" rx=\"0\" fill=\"#245A6B\" opacity=\"0.18\" /><text x=\"76\" y=\"308\" font-size=\"15\" fill=\"#1B2B33\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >6<\/text><text x=\"112\" y=\"309\" font-size=\"17\" fill=\"#1B2B33\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >估算层<\/text><text x=\"360\" y=\"309\" font-size=\"14.5\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >成本模型 + 统计信息决定计划是否胜出<\/text><rect x=\"40\" y=\"328\" width=\"1320\" height=\"44\" rx=\"0\" fill=\"#EBF1EE\" opacity=\"1\" /><rect x=\"56\" y=\"336\" width=\"40\" height=\"28\" rx=\"0\" fill=\"#245A6B\" opacity=\"0.18\" /><text x=\"76\" y=\"356\" font-size=\"15\" fill=\"#1B2B33\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >7<\/text><text x=\"112\" y=\"357\" font-size=\"17\" fill=\"#1B2B33\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >决策层<\/text><text x=\"360\" y=\"357\" font-size=\"14.5\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >中等选择率 + page 可收敛 + 不依赖索引顺序<\/text><rect x=\"40\" y=\"380\" width=\"1320\" height=\"44\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"56\" y=\"400\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >一句话：它不是比 Index Scan 更高级，只是把大量随机回表，改成先收集、再按页访问<\/text><text x=\"56\" y=\"418\" font-size=\"12\" fill=\"#89938F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >延伸：amgetbitmap 为何不能 index-only？两个单列索引 AND 与一条多列 B-tree 怎么比？lossy 高时先调什么？<\/text><\/svg>", "ctrl": ""}];

  ['? 或 H','本帮助'],['点击底部按钮','同上']
];

/* ---------- 舞台缩放：讲稿打开时缩到左侧 ---------- */
function fit(){
  const vp=$('#viewport'), W=vp.clientWidth, H=vp.clientHeight;
  const pw = panelOn ? $('#notes').offsetWidth : 0;
  const aw = Math.max(320, W-pw);
  const s = Math.min(aw/1600, H/900);
  const st=$('#stage');
  st.style.transform='scale('+s+')';
  st.style.left=((aw-1600*s)/2)+'px';
  st.style.top=((H-900*s)/2)+'px';
}
window.addEventListener('resize', fit);

function render(){
  $('#slides').innerHTML = D.map((d,i)=>
    '<section class="slide'+(d.ctrl?' anim':'')+'" id="s'+i+'">'
    + '<div class="eyebrow"><span class="num">'+pad(i+1)+' / '+pad(N)+'</span>'+d.eyebrow+'</div>'
    + '<h1 class="title">'+d.title+'</h1>'
    + '<div class="lede">'+d.lede+'</div>'
    + '<div class="rule"></div>'
    + '<div class="figwrap">'+d.svg+'</div>'
    + '<div class="caption">'+d.caption+'</div>'
    + (d.ctrl ? '<div class="ctrls">'+d.ctrl+'</div>' : '')
    + '<div class="bridge"><span class="bk">承接 · NEXT</span>'+d.bridge+'</div>'
    + '<div class="footer"><div class="fbar"><i id="fbar'+i+'"></i></div>'
    + '<span class="fl">数据库筑基课 · 数据扫描方法 Bitmap Scan</span>'
    + '<span class="fr">'+pad(i+1)+' / '+pad(N)+'</span></div>'
    + '</section>').join('');
}

function toast(s){
  const t=$('#toast'); t.textContent=s; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1600);
}

/* ---------- 页内开窗 ---------- */
function secHTML(d,i){
  return '<div class="nsec" id="nsec'+i+'"><span class="sn">'+pad(i+1)+' · '+d.eyebrow+'</span>'
    +'<h3>'+d.title+'</h3><p>'+d.notes+'</p>'
    +'<div class="br">「'+d.bridge+'」</div></div>';
}
function renderPanel(){
  const h=$('#nTitle'), sub=$('#nSub'), b=$('#nBody');
  if(panelMode==='here'){
    h.textContent='本页讲稿'; sub.textContent=pad(cur+1)+' / '+pad(N);
    b.innerHTML=secHTML(D[cur],cur); b.scrollTop=0;
  }else if(panelMode==='all'){
    h.textContent='全文讲稿'; sub.textContent='自动跟随当前页 · 共 '+N+' 页';
    b.innerHTML=D.map((d,i)=>secHTML(d,i)).join('');
  }else if(panelMode==='toc'){
    h.textContent='目录'; sub.textContent='点击跳转 · 共 '+N+' 页';
    b.innerHTML='<div class="tocgrid">'+D.map((d,i)=>
      '<a data-i="'+i+'" onclick="jump('+i+')"><span class="gn">'+pad(i+1)+'</span>'
      +'<span class="gt">'+d.title+'</span></a>').join('')+'</div>';
  }else{
    h.textContent='快捷键'; sub.textContent='全屏后底部同样常驻';
    b.innerHTML='<div class="keygrid">'+KEYS.map(k=>'<div><kbd>'+k[0]+'</kbd>'+k[1]+'</div>').join('')+'</div>'
      +'<div class="nsec"><p>讲稿采用页内开窗：按一下显示，再按一下关闭；显示时画面矢量缩放到左侧。'
      +'按 T 显示全部讲稿时自动定位到当前页，翻页时右侧讲稿会联动滚动并高亮当前页。</p></div>';
  }
  syncNotes(true);
}
function syncNotes(instant){
  if(!panelOn) return;
  if(panelMode==='all'){
    $$('.nsec').forEach(e=>e.classList.remove('cur'));
    const el=document.getElementById('nsec'+cur), nb=$('#nBody');
    if(el && nb){
      el.classList.add('cur');
      const top=el.offsetTop-6;
      if(instant) nb.scrollTop=top;
      else nb.scrollTo({top:top,behavior:'smooth'});
    }
  }else if(panelMode==='toc'){
    $$('.tocgrid a').forEach(a=>a.classList.toggle('cur', +a.dataset.i===cur));
  }
}
function openPanel(mode){
  if(panelOn && panelMode===mode){ closePanel(); return; }
  panelOn=true; panelMode=mode;
  document.body.classList.add('panel-on');
  renderPanel(); fit(); syncChrome();
  if(mode==='all') setTimeout(()=>syncNotes(true),90);
}
function closePanel(){
  if(!panelOn) return;
  panelOn=false; panelMode='';
  document.body.classList.remove('panel-on');
  fit(); syncChrome();
}
function jump(i){ closePanel(); go(i); }
function syncChrome(){
  $('#btnNotes').classList.toggle('act', panelOn && panelMode==='here');
  $('#btnAll').classList.toggle('act', panelOn && panelMode==='all');
  $('#btnToc').classList.toggle('act', panelOn && panelMode==='toc');
  $('#btnHelp').classList.toggle('act', panelOn && panelMode==='help');
  $('#btnFs').textContent = document.body.classList.contains('immersive') ? '退出全屏 F' : '全屏 F';
}

/* ---------- 翻页 ---------- */
function go(i,silent){
  i=Math.max(0,Math.min(N-1,i));
  $$('.slide').forEach((el,k)=>el.classList.toggle('on',k===i));
  cur=i;
  try{ localStorage.setItem('bm-slide',String(i)); }catch(e){}
  $('#pg').textContent=pad(i+1)+' / '+pad(N);
  $('#bar').style.width=((i+1)/N*100)+'%';
  for(let k=0;k<N;k++){ const b=document.getElementById('fbar'+k); if(b) b.style.width=(k<=i?100:0)+'%'; }
  stopAnims();
  if(panelOn){
    if(panelMode==='here') renderPanel(); else syncNotes(false);
  }
  if(!silent) toast(pad(i+1)+'　'+D[i].title);
  syncChrome();
}
function next(){ if(cur<N-1) go(cur+1); else stopAuto(); }
function prev(){ if(cur>0) go(cur-1); }

/* ---------- 自动播放 / 全屏 ---------- */
function stopAuto(){
  autoOn=false; clearInterval(autoTimer); autoTimer=null;
  $('#btnAuto').textContent='自动播放 P'; $('#btnAuto').classList.remove('act');
}
function toggleAuto(){
  if(autoOn){ stopAuto(); toast('已暂停自动播放'); return; }
  autoOn=true; $('#btnAuto').textContent='❚❚ 暂停 P'; $('#btnAuto').classList.add('act');
  autoTimer=setInterval(()=>{ if(cur<N-1) go(cur+1,true); else stopAuto(); },12000);
  toast('自动播放：每 12 秒一页（P 暂停）');
}
function fs(){
  const el=document.documentElement;
  const immersive=document.body.classList.contains('immersive');
  if(document.fullscreenElement || immersive){
    document.body.classList.remove('immersive');
    try{ if(document.fullscreenElement) document.exitFullscreen(); }catch(e){}
    toast('已退出全屏');
    fit(); syncChrome();
    return;
  }
  try{
    const p=el.requestFullscreen && el.requestFullscreen();
    if(p && p.catch) p.catch(()=>toast('浏览器拦截了原生全屏，已进入沉浸模式'));
  }catch(e){}
  document.body.classList.add('immersive');   /* 原生全屏被拦截时的 CSS 沉浸降级 */
  toast('全屏：底部快捷键常驻（F 或 Esc 退出）');
  fit(); syncChrome();
}
document.addEventListener('fullscreenchange',()=>{
  if(!document.fullscreenElement) document.body.classList.remove('immersive');
  fit(); syncChrome();
});

/* ---------- 动画：三处，均带输入 / 播放 / 暂停 / 单步 / 重置 ---------- */
const ANIMS=[];
function mkBase(max){ const a={step:0,max:max,timer:null,
  pause(){ if(this.timer){clearInterval(this.timer);this.timer=null;} const b=document.getElementById(this.playId); if(b)b.textContent='▶ 播放'; },
  play(){ if(this.step>=this.max) this.step=0; this.pause(); this.paint();
    const b=document.getElementById(this.playId); if(b)b.textContent='❚❚ 暂停';
    this.timer=setInterval(()=>{ if(this.step>=this.max){this.pause();return;} this.step++; this.paint(); },1000); },
  stepOnce(){ this.pause(); if(this.step<this.max){this.step++;this.paint();} },
  reset(){ this.pause(); this.step=0; this.paint(); }
}; ANIMS.push(a); return a; }
function stopAnims(){ ANIMS.forEach(a=>a.pause()); }

const a2=mkBase(4); a2.playId='a2-play';
a2.paint=function(){
  const levels=[[],['a2-a','a2-b'],['a2-a','a2-b','a2-tbm'],
                ['a2-a','a2-b','a2-tbm','a2-merge'],
                ['a2-a','a2-b','a2-tbm','a2-merge','a2-heap','a2-out']];
  const on=levels[this.step];
  ['a2-a','a2-b','a2-tbm','a2-merge','a2-heap','a2-out'].forEach(id=>
    setA(id,'fill',on.indexOf(id)>=0?'#CFE0DC':'#FFFFFF'));
  const n=+document.getElementById('a2-n').value;
  for(let i=0;i<16;i++) setA('a2-c'+i,'fill',(i<n&&this.step>=2)?'#47808D':'#FFFFFF');
  const mode=document.getElementById('a2-mode').value;
  setT('a2-merge-label', mode==='and'?'BitmapAnd · tbm_intersect':'BitmapOr · tbm_union');
  const desc=['等待开始 · 点播放或单步',
    '① 两个索引各自用 amgetbitmap 收集候选 TID',
    '② TIDBitmap 按 heap block 聚合候选位置',
    '③ '+(mode==='and'?'BitmapAnd 取交集':'BitmapOr 取并集')+'，集合运算在内存完成',
    '④ 按 block 顺序访问 heap，recheck 后返回可见行'][this.step];
  const out=document.getElementById('a2-readout');
  if(out) out.innerHTML='<b>阶段 '+this.step+'/4</b>　'+desc;
};

const B_MEM=['4MB','1MB','256kB','128kB','64kB','32kB'];
const B_LOSSY=[0,2,4,6,8,10];
const b8=mkBase(5); b8.playId='b-play';
b8.paint=function(){
  const lossy=B_LOSSY[this.step], ex=12-lossy;
  const inp=document.getElementById('b-mem'); if(inp && +inp.value!==this.step) inp.value=this.step;
  for(let i=0;i<12;i++){
    const isL=i>=ex;
    setA('b-card'+i,'fill',isL?'#F7E9DE':'#E4F0EA');
    setA('b-card'+i,'stroke',isL?'#BE653B':'#2F7A66');
    setA('b-d'+i,'opacity',isL?0:1);
    setA('b-l'+i,'opacity',isL?1:0);
    setA('b-t'+i,'fill',isL?'#BE653B':'#2F7A66');
  }
  const out=document.getElementById('b-out');
  if(out) out.innerHTML='<b>work_mem = '+B_MEM[this.step]+'</b>　exact='+ex+' · lossy='+lossy
    +' · 整页复核的 tuple 数随之上升（示意）';
};

const c13=mkBase(3); c13.playId='c-play';
c13.paint=function(){
  const wn=+document.getElementById('c-workers').value;
  for(let i=0;i<4;i++) setA('c-w'+i,'opacity',i<wn?1:0.12);
  const on=[[],['c-leader'],['c-leader','c-shared'],['c-leader','c-shared','c-heap']][this.step];
  ['c-leader','c-shared','c-heap'].forEach(id=>setA(id,'fill',on.indexOf(id)>=0?'#CFE0DC':'#FFFFFF'));
  for(let i=0;i<3;i++){
    const a=this.step>=i;
    setA('c-s'+i,'fill',a?'#245A6B':'#F1EFE9');
    setA('c-s'+i+'t','fill',a?'#FFFFFF':'#89938F');
    setA('c-s'+i+'s','fill',a?'#E5EFF0':'#46585F');
  }
  for(let i=0;i<4;i++) setA('c-w'+i+'-r','fill',this.step>=3?'#E4F0EA':'#FFFFFF');
  const desc=['BM_INITIAL：bitmap 创建尚未开始',
    'BM_INPROGRESS：首个进程成为 leader，独自扫索引建 bitmap，其余等待',
    'BM_FINISHED：共享 bitmap 就绪，唤醒所有 worker',
    'Workers 通过 DSA + shared iterator 并行领取 heap blocks'][this.step];
  const out=document.getElementById('c-out');
  if(out) out.innerHTML='<b>阶段 '+this.step+'/3</b>　'+desc+'（'+wn+' 个 worker）';
};

function bindAnim(pre,a){
  document.getElementById(a.playId).onclick=()=>{ if(a.timer)a.pause(); else a.play(); };
  document.getElementById(pre+'-step').onclick=()=>a.stepOnce();
  document.getElementById(pre+'-reset').onclick=()=>a.reset();
  a.paint();
}

/* ---------- 键盘 ---------- */
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  const typing=(tag==='input'||tag==='select'||tag==='textarea');
  const k=e.key;
  if(k==='Escape'){
    if(panelOn) closePanel();
    else if(document.fullscreenElement || document.body.classList.contains('immersive')) fs();
    return;
  }
  if(typing && (k.indexOf('Arrow')===0||k===' '||k==='PageUp'||k==='PageDown')) return;
  if(k==='ArrowRight'||k===' '||k==='PageDown'){ e.preventDefault(); next(); }
  else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); prev(); }
  else if(k==='f'||k==='F'){ e.preventDefault(); fs(); }
  else if(k==='g'||k==='G'){ e.preventDefault(); openPanel('toc'); }
  else if(k==='n'||k==='N'){ e.preventDefault(); openPanel('here'); }
  else if(k==='t'||k==='T'){ e.preventDefault(); openPanel('all'); }
  else if(k==='p'||k==='P'){ e.preventDefault(); toggleAuto(); }
  else if(k==='?'||k==='h'||k==='H'){ e.preventDefault(); openPanel('help'); }
  else if(k==='Home'){ e.preventDefault(); go(0); }
  else if(k==='End'){ e.preventDefault(); go(N-1); }
  else if(/^[1-9]$/.test(k)){ go(parseInt(k,10)-1); }
});

/* ---------- 启动 ---------- */
function init(){
  render();
  $('#btnPrev').onclick=prev; $('#btnNext').onclick=next;
  $('#btnToc').onclick=()=>openPanel('toc');
  $('#btnNotes').onclick=()=>openPanel('here');
  $('#btnAll').onclick=()=>openPanel('all');
  $('#btnHelp').onclick=()=>openPanel('help');
  $('#btnAuto').onclick=toggleAuto;
  $('#btnFs').onclick=fs;
  $('#nClose').onclick=closePanel;
  document.getElementById('a2-mode').onchange=()=>a2.paint();
  document.getElementById('a2-n').oninput=()=>a2.paint();
  document.getElementById('b-mem').oninput=function(){ b8.pause(); b8.step=+this.value; b8.paint(); };
  document.getElementById('c-workers').onchange=()=>c13.paint();
  bindAnim('a2',a2); bindAnim('b',b8); bindAnim('c',c13);
  fit(); go(0,true);
  setTimeout(()=>document.body.classList.add('ready'),80);
}
document.addEventListener('DOMContentLoaded',init);

</script>
