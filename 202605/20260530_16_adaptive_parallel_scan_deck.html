\"246\" height=\"104\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1166\" y=\"267.755\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >内存分析型、多核高并发执行器<\/text><rect x=\"0\" y=\"318\" width=\"170\" height=\"104\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"12\" y=\"371.755\" font-size=\"13.5\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >不适合场景<\/text><rect x=\"170\" y=\"318\" width=\"246\" height=\"104\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"182\" y=\"371.755\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >点查、小 LIMIT、并行不安全函数<\/text><rect x=\"416\" y=\"318\" width=\"246\" height=\"104\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"428\" y=\"371.755\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >超大表时间窗紧<\/text><rect x=\"662\" y=\"318\" width=\"246\" height=\"104\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"674\" y=\"371.755\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >数据倾斜、速度不均<\/text><rect x=\"908\" y=\"318\" width=\"246\" height=\"104\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"920\" y=\"371.755\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >bitmap 构建成为瓶颈<\/text><rect x=\"1154\" y=\"318\" width=\"246\" height=\"104\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1166\" y=\"371.755\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >需要重构执行器和调度器<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "收益 · 甜区在哪", "title": "并行有甜区，不是越大越好", "lede": "表太小，worker 启动、DSM 初始化与 tuple 传输可能超过收益；表很大但 I/O 已饱和，也未必继续提升吞吐；三者同时成立时收益最明显。", "caption": "图 19　收益的三个区间；分区为示意，非实测。", "bridge": "所以每一项收益背后，都挂着一项必须一起算的成本。", "notes": "收益不是单调的，它有个甜区。最左边，表太小：光是 Gather 启动 worker、初始化 DSM、把 tuple 传回 leader，就可能比扫描本身还贵，开了并行反而更慢。中间是甜区：扫描量足够大，CPU 侧的过滤、可见性判断、部分聚合能分摊，而 I/O 还有余量——这时候多个进程才真的把空转的核用起来。最右边叫受限：表确实很大，但 I/O 带宽已经被单进程顺序扫吃满了，或者上层 Sort、Aggregate、Join 开始排队，再加 worker 只是把瓶颈挪个位置。所以判断标准从来不是「计划里开了几个 worker」，而是每个 worker 实际做了多少块、多少 CPU，以及时间到底等在哪里。原文那张图也是这个意思，我这里改成三个规整区间，避免把示意曲线误读成实测数据。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >并行扫描有甜区：不是表越大、worker 越多就越好<\/text><rect x=\"1250\" y=\"8\" width=\"140\" height=\"22\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1320\" y=\"22.91\" font-size=\"11.5\" fill=\"#AE8A3E\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >示意分区 · 非实测<\/text><rect x=\"24\" y=\"44\" width=\"1352\" height=\"58\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"42\" y=\"70\" font-size=\"15\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >判断标准<\/text><text x=\"140\" y=\"70\" font-size=\"15\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >不是「开了几个 worker」，而是每个 worker 实际做了多少块、多少 CPU，以及等待在哪里<\/text><rect x=\"40\" y=\"116\" width=\"420\" height=\"214\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"40\" y=\"116\" width=\"420\" height=\"44\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"58\" y=\"145\" font-size=\"19\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >太小<\/text><text x=\"58\" y=\"192\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >worker 启动、DSM 初始化、<\/text><text x=\"58\" y=\"220\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >tuple 传输成本可能<\/text><text x=\"58\" y=\"248\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >超过扫描收益<\/text><rect x=\"472\" y=\"116\" width=\"420\" height=\"214\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"472\" y=\"116\" width=\"420\" height=\"44\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"490\" y=\"145\" font-size=\"19\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >甜区<\/text><text x=\"490\" y=\"192\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >扫描量大、CPU 过滤或<\/text><text x=\"490\" y=\"220\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >聚合能分摊、I/O<\/text><text x=\"490\" y=\"248\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >还有余量<\/text><rect x=\"904\" y=\"116\" width=\"452\" height=\"214\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"904\" y=\"116\" width=\"452\" height=\"44\" rx=\"0\" fill=\"#AE8A3E\" opacity=\"1\" /><text x=\"922\" y=\"145\" font-size=\"19\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >受限<\/text><text x=\"922\" y=\"192\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >I/O 已饱和、Gather 汇聚、<\/text><text x=\"922\" y=\"220\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >上层 Sort / Agg / Join<\/text><text x=\"922\" y=\"248\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >成为新瓶颈<\/text><line x1=\"24\" y1=\"344\" x2=\"1376\" y2=\"344\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"24\" y=\"364\" font-size=\"13\" fill=\"#89938F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >扫描数据量 / CPU 可分摊成本　低 → 高<\/text><text x=\"1376\" y=\"364\" font-size=\"13\" fill=\"#89938F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"end\" letter-spacing=\"0\" opacity=\"1\" >→ 高<\/text><rect x=\"24\" y=\"378\" width=\"1352\" height=\"40\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" opacity=\"1\" /><text x=\"42\" y=\"404\" font-size=\"14.5\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >收益最明显的位置：大表 + 可分摊的 CPU 工作 + 未饱和的 I/O，三者同时成立<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "代价 · 收益成对", "title": "每一项收益，都紧跟着一项成本", "lede": "多进程分摊 CPU 的收益，对应 Gather 启动与传输；动态均衡对应 tuple 汇聚成本；连续 chunk 对应磁盘成本不下降；ramp-down 对应 worker 是全局资源。", "caption": "图 20　五组「收益 → 代价」的成对关系。", "bridge": "账算完了，怎么在自己的库里验证？", "notes": "把账算完整，会发现收益和代价几乎是手拉手出现的。多进程分摊了 MVCC 判断、过滤和投影，代价是 Gather 得启动 worker、建并行上下文、把结果传回 leader。动态 chunk 压掉了长尾，代价是返回行一多，parallel_tuple_cost 和汇聚就变贵。连续 chunk 保住了 readahead，代价是磁盘 run cost 本来就不会按 worker 数下降，别指望 I/O 变便宜。末段 ramp-down 让剩余工作更均匀，代价是并行 worker 属于全局资源，计划要求的数量不一定拿得到。还有 synchronized scan 让并发大扫描更可能共享 I/O，代价是没有 ORDER BY 的观察顺序彻底不可依赖。再往上一层，Sort、Aggregate、Join、锁等待、buffer pin、存储带宽，任何一个都可能变成新瓶颈。所以别把并行扫描当「自动更快」的开关，它是一种成本结构的替换。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >每一项收益，都紧跟着一项成本<\/text><text x=\"24\" y=\"50\" font-size=\"12\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"2\" opacity=\"1\" >收益<\/text><text x=\"756\" y=\"50\" font-size=\"12\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"2\" opacity=\"1\" >代价<\/text><rect x=\"24\" y=\"60\" width=\"620\" height=\"54\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" opacity=\"1\" /><text x=\"40\" y=\"93\" font-size=\"14.5\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >多进程分摊 MVCC 判断、过滤、投影<\/text><rect x=\"756\" y=\"60\" width=\"620\" height=\"54\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"772\" y=\"93\" font-size=\"14.5\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >Gather 要启动 worker、建并行上下文并传回 tuple<\/text><path d=\"M 644 87 L 756 87\" fill=\"none\" stroke=\"#89938F\" stroke-width=\"1.4\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-muted)\"/><rect x=\"24\" y=\"124\" width=\"620\" height=\"54\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" opacity=\"1\" /><text x=\"40\" y=\"157\" font-size=\"14.5\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >动态 chunk 领取降低速度差异的长尾<\/text><rect x=\"756\" y=\"124\" width=\"620\" height=\"54\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"772\" y=\"157\" font-size=\"14.5\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >parallel_tuple_cost 随返回行数上升，汇聚变贵<\/text><path d=\"M 644 151 L 756 151\" fill=\"none\" stroke=\"#89938F\" stroke-width=\"1.4\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-muted)\"/><rect x=\"24\" y=\"188\" width=\"620\" height=\"54\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" opacity=\"1\" /><text x=\"40\" y=\"221\" font-size=\"14.5\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >连续 chunk 保护 OS readahead<\/text><rect x=\"756\" y=\"188\" width=\"620\" height=\"54\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"772\" y=\"221\" font-size=\"14.5\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >磁盘 run cost 不按 worker 数分摊<\/text><path d=\"M 644 215 L 756 215\" fill=\"none\" stroke=\"#89938F\" stroke-width=\"1.4\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-muted)\"/><rect x=\"24\" y=\"252\" width=\"620\" height=\"54\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" opacity=\"1\" /><text x=\"40\" y=\"285\" font-size=\"14.5\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >末段 ramp-down 让剩余工作更均匀<\/text><rect x=\"756\" y=\"252\" width=\"620\" height=\"54\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"772\" y=\"285\" font-size=\"14.5\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >worker 是全局资源，Planned 不一定等于 Launched<\/text><path d=\"M 644 279 L 756 279\" fill=\"none\" stroke=\"#89938F\" stroke-width=\"1.4\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-muted)\"/><rect x=\"24\" y=\"316\" width=\"620\" height=\"54\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" opacity=\"1\" /><text x=\"40\" y=\"349\" font-size=\"14.5\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >可配合 synchronized scan 共享 I/O<\/text><rect x=\"756\" y=\"316\" width=\"620\" height=\"54\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"772\" y=\"349\" font-size=\"14.5\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >无 ORDER BY 的观察输出顺序不可依赖<\/text><path d=\"M 644 343 L 756 343\" fill=\"none\" stroke=\"#89938F\" stroke-width=\"1.4\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-muted)\"/><rect x=\"24\" y=\"388\" width=\"1352\" height=\"34\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"42\" y=\"410\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >还有：上层 Sort / Aggregate / Join、锁等待、buffer pin、存储带宽都可能成为新瓶颈<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "验证 · 四步 DEMO", "title": "验证顺序，比调参更重要", "lede": "造表 → 鼓励优化器考虑并行 → 关掉并行做对照 → 表级指定 parallel_workers。重点看 EXPLAIN 里的五项观测，数值留空，不提供实测输出。", "caption": "图 21　可执行 SQL 骨架与五个观测项；原文未运行实例，不提供伪造输出。", "bridge": "会验证之后，落到日常，不同角色该做的动作并不一样。", "notes": "原文给了一套能直接跑的 SQL，我按验证顺序拆成四步。第一步造一张三百万行的表，记得 ANALYZE，没统计信息后面全白搭。第二步把 max_parallel_workers_per_gather 设成 4、min_parallel_table_scan_size 降到 1MB、再调低 parallel_setup_cost 和 parallel_tuple_cost，鼓励优化器考虑并行，然后跑 EXPLAIN (ANALYZE, BUFFERS, SETTINGS)。第三步把它设回 0 做对照，看同一条查询到底快了还是慢了。第四步用表级 reloption 指定 parallel_workers，观察 GROUP BY 的计划变化。要盯的是五项：有没有 Gather、Workers Planned 和 Workers Launched 是否一致、有没有 Parallel Seq Scan、各 worker 的行数与时间差多少、Buffers 里的 shared hit / read 说明 I/O 是不是还卡着。这里必须说一句诚实话：原文作者没有启动实例执行这些 SQL，所以没有任何实测输出，我也不编数字，请你以自己本地的 EXPLAIN 为准。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >四步 DEMO：验证顺序，比调参更重要<\/text><rect x=\"24\" y=\"52\" width=\"796\" height=\"72\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"52\" width=\"6\" height=\"72\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"42\" y=\"80\" font-size=\"15.5\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >① 准备大表<\/text><text x=\"42\" y=\"106\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >CREATE TABLE demo_parallel_scan (...)　/　generate_series(1, 3000000)　/　ANALYZE<\/text><rect x=\"24\" y=\"134\" width=\"796\" height=\"72\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"134\" width=\"6\" height=\"72\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"42\" y=\"162\" font-size=\"15.5\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >② 鼓励优化器考虑并行<\/text><text x=\"42\" y=\"188\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >SET max_parallel_workers_per_gather = 4;　SET min_parallel_table_scan_size = '1MB';<\/text><rect x=\"24\" y=\"216\" width=\"796\" height=\"72\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"216\" width=\"6\" height=\"72\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"42\" y=\"244\" font-size=\"15.5\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >③ 关掉并行做对照<\/text><text x=\"42\" y=\"270\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >SET max_parallel_workers_per_gather = 0;　再跑同一条 EXPLAIN (ANALYZE, BUFFERS)<\/text><rect x=\"24\" y=\"298\" width=\"796\" height=\"72\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"298\" width=\"6\" height=\"72\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"42\" y=\"326\" font-size=\"15.5\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >④ 表级指定 worker 数<\/text><text x=\"42\" y=\"352\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >ALTER TABLE ... SET (parallel_workers = 4);　观察 GROUP BY 计划<\/text><rect x=\"844\" y=\"52\" width=\"532\" height=\"238\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"844\" y=\"52\" width=\"532\" height=\"42\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"862\" y=\"80.2\" font-size=\"20\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >EXPLAIN 里盯这五项<\/text><rect x=\"862\" y=\"129.26\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"879\" y=\"136.54\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >是否出现 Gather；<\/text><rect x=\"862\" y=\"156.26\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"879\" y=\"163.54\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >Workers Planned 与 Workers Launched 是否一致；<\/text><rect x=\"862\" y=\"183.26\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"879\" y=\"190.54\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >是否出现 Parallel Seq Scan on demo_parallel_scan；<\/text><rect x=\"862\" y=\"210.26\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"879\" y=\"217.54\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >每个 worker 的实际行数、时间是否差异很大；<\/text><rect x=\"862\" y=\"237.26\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"879\" y=\"244.54\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >Buffers 中 shared hit / read 是否显示 I/O 仍是瓶颈。<\/text><rect x=\"844\" y=\"300\" width=\"532\" height=\"90\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1\" opacity=\"1\" /><text x=\"860\" y=\"326\" font-size=\"15\" fill=\"#AE8A3E\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >诚实前提<\/text><text x=\"860\" y=\"352\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >原文未启动数据库实例，不提供任何实测输出；<\/text><text x=\"860\" y=\"376\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >请以本地 EXPLAIN (ANALYZE, BUFFERS) 为准。<\/text><text x=\"24\" y=\"414\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >若并行版本没有更快：表不够大 / 数据已在缓存 / 返回行太多 / I/O 饱和 / 可用 worker 不足<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "实践 · 三类角色", "title": "架构师、DBA、开发者，各做各的", "lede": "架构师做扫描范围的取舍与资源边界；DBA 管统计信息与观测口径；业务开发者盯 SQL 形态、并行安全性与返回行数。", "caption": "图 22　三类角色的最佳实践，附适合 / 不适合速查。", "bridge": "动作都对了，最后再看一眼那些反复出现的老坑。", "notes": "同一个机制，落在不同人身上动作完全不一样。架构师要把它定位成「大范围扫描的吞吐工具」，不是点查优化工具；能用分区裁剪、索引、物化汇总把范围压下去，就先压范围；看计划时把 Parallel Seq Scan 和上层节点一起看，Partial Aggregate 加 Gather 往往比「并行扫出一大堆原始行再汇聚」划算；再按 CPU 核数、存储带宽、并发任务数给资源池划边界，别让所有大查询一起抢 worker。DBA 那边，用 EXPLAIN (ANALYZE, BUFFERS, SETTINGS) 验 Planned 和 Launched，核那六个 GUC；别只盯着计划里有没有并行两个字，Launched 少于计划、leader 汇聚时间很长，瓶颈就不在块分配；还有 synchronize_seqscans 对吞吐和返回顺序的影响要心里有数。业务开发者记住：小结果集靠索引，全表统计接受并行可能是正确计划，别写 parallel unsafe 函数和强制顺序依赖，尽量在库端先聚合、过滤、裁剪列，别把大量明细拉回客户端抵消掉收益。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >同一个机制，三种角色该做的动作并不一样<\/text><rect x=\"24\" y=\"52\" width=\"442\" height=\"268\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"52\" width=\"442\" height=\"42\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"42\" y=\"80.2\" font-size=\"20\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >面向数据库架构师<\/text><rect x=\"42\" y=\"144.09\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"59\" y=\"151.11\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >定位为「大范围扫描的吞吐工具」，不是点查优化工具；<\/text><rect x=\"42\" y=\"171.09\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"59\" y=\"178.11\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >能用分区裁剪、索引、物化汇总减少范围时，优先减少范围；<\/text><rect x=\"42\" y=\"198.09\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"59\" y=\"205.11\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >把 Parallel Seq Scan 与上层节点一起看：Partial<\/text><text x=\"59\" y=\"232.11\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >Aggregate + Gather 往往更划算；<\/text><rect x=\"42\" y=\"252.09\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"59\" y=\"259.11\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >按 CPU 核数、存储带宽、并发任务数设资源池边界。<\/text><rect x=\"478\" y=\"52\" width=\"442\" height=\"268\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"478\" y=\"52\" width=\"442\" height=\"42\" rx=\"0\" fill=\"#47808D\" opacity=\"1\" /><text x=\"496\" y=\"80.2\" font-size=\"20\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >面向 DBA<\/text><rect x=\"496\" y=\"110.59\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#47808D\" opacity=\"1\" /><text x=\"513\" y=\"117.61\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >用 EXPLAIN (ANALYZE, BUFFERS, SETTINGS) 验证计划与实<\/text><text x=\"513\" y=\"142.86\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >跑；<\/text><rect x=\"496\" y=\"161.09\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#47808D\" opacity=\"1\" /><text x=\"513\" y=\"168.11\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >核六个参数：per_gather / max_parallel_workers /<\/text><text x=\"513\" y=\"193.36\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >max_worker_processes / min_parallel_table_scan_size<\/text><text x=\"513\" y=\"218.61\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >/ setup_cost / tuple_cost；<\/text><rect x=\"496\" y=\"236.84\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#47808D\" opacity=\"1\" /><text x=\"513\" y=\"243.86\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >不要只看计划里有没有并行；Launched 少或 leader 汇聚久，<\/text><text x=\"513\" y=\"269.11\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >瓶颈不在块分配；<\/text><rect x=\"496\" y=\"287.34\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#47808D\" opacity=\"1\" /><text x=\"513\" y=\"294.36\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >理解 synchronize_seqscans 对吞吐与返回顺序的影响。<\/text><rect x=\"932\" y=\"52\" width=\"444\" height=\"268\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"932\" y=\"52\" width=\"444\" height=\"42\" rx=\"0\" fill=\"#74A5AD\" opacity=\"1\" /><text x=\"950\" y=\"80.2\" font-size=\"20\" fill=\"#1B2B33\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >面向业务开发者<\/text><rect x=\"950\" y=\"144.09\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#74A5AD\" opacity=\"1\" /><text x=\"967\" y=\"151.11\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >小结果集、Top-N、分页、点查：优先设计合适索引；<\/text><rect x=\"950\" y=\"171.09\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#74A5AD\" opacity=\"1\" /><text x=\"967\" y=\"178.11\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >全表统计、宽范围报表、低选择率过滤：接受并行可能是正确计<\/text><text x=\"967\" y=\"205.11\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >划；<\/text><rect x=\"950\" y=\"225.09\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#74A5AD\" opacity=\"1\" /><text x=\"967\" y=\"232.11\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >避免 parallel unsafe 函数、临时表访问、强制顺序依赖；<\/text><rect x=\"950\" y=\"252.09\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#74A5AD\" opacity=\"1\" /><text x=\"967\" y=\"259.11\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >尽量在库端先聚合、过滤、裁剪列，别把大量明细拉回客户端。<\/text><rect x=\"24\" y=\"332\" width=\"666\" height=\"84\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" opacity=\"1\" /><text x=\"42\" y=\"358\" font-size=\"15\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >适合<\/text><text x=\"42\" y=\"384\" font-size=\"13.5\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >大表全表聚合 / 批处理 / 报表 / 低选择率过滤 / 多个大分区<\/text><rect x=\"710\" y=\"332\" width=\"666\" height=\"84\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"728\" y=\"358\" font-size=\"15\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >不适合<\/text><text x=\"728\" y=\"384\" font-size=\"13.5\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >点查 / 小 LIMIT / 大量明细返回 / parallel unsafe / I-O 饱和 / 小表<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "避坑 · 七条归类", "title": "七个坑，四类成因", "lede": "概念、观测、配置、顺序四类误读；最该记住的一条：WHERE 通常只减少返回行，不减少已扫描页面。", "caption": "图 23　七个常见坑按成因归类，附最常见的一条原理提醒。", "bridge": "坑大多指向同一个误会；把整条链压成一张剖面收尾。", "notes": "最后把七个坑归归类，其实就四类。概念类：把并行当「自动更快」，以及把「自适应」误解成运行时重写 join order 或者机器学习调参。观测类：忽略 Workers Planned 和 Workers Launched 的差距；还有最经典的一条，以为 WHERE 能减少 Seq Scan 的读块范围——对普通堆表全表扫描来说，WHERE 通常只减少返回行，不减少已经扫过的页面，要减少页面访问得靠索引、分区裁剪、BRIN、物化汇总或者数据布局。配置类：只调 max_parallel_workers_per_gather，忘了全局 worker 池、表大小阈值、成本参数、parallel safety 和表级 reloption；以及忘了表膨胀和死元组——并行只是更快地把无用页面处理掉，不会减少它们带来的 I/O 和可见性判断，那得靠 VACUUM 和治理。最后一类是顺序：依赖无 ORDER BY 的返回顺序。你会发现，大半的坑都指向同一个误会：把「扫描块的动态分配」当成了别的东西。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >七个常见坑，按成因归成四类<\/text><rect x=\"24\" y=\"52\" width=\"332\" height=\"250\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"52\" width=\"332\" height=\"40\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"40\" y=\"78\" font-size=\"16\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >概念类<\/text><text x=\"40\" y=\"108\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >① 把并行扫描当成「自动更快」<\/text><text x=\"40\" y=\"146\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >⑤ 误解「自适应」：以为是运行时重写 join<\/text><text x=\"40\" y=\"170\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >order 或 ML 调参<\/text><rect x=\"368\" y=\"52\" width=\"332\" height=\"250\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"368\" y=\"52\" width=\"332\" height=\"40\" rx=\"0\" fill=\"#47808D\" opacity=\"1\" /><text x=\"384\" y=\"78\" font-size=\"16\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >观测类<\/text><text x=\"384\" y=\"108\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >③ 忽略 Workers Planned 与 Workers<\/text><text x=\"384\" y=\"132\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >Launched 差异<\/text><text x=\"384\" y=\"170\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >④ 以为 WHERE 能减少 Seq Scan 的读块范围<\/text><rect x=\"712\" y=\"52\" width=\"332\" height=\"250\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"712\" y=\"52\" width=\"332\" height=\"40\" rx=\"0\" fill=\"#AE8A3E\" opacity=\"1\" /><text x=\"728\" y=\"78\" font-size=\"16\" fill=\"#1B2B33\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >配置类<\/text><text x=\"728\" y=\"108\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >② 只调 max_parallel_workers_per_gather<\/text><text x=\"728\" y=\"146\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >⑦ 忘记表膨胀与死元组：并行只是更快处理无用<\/text><text x=\"728\" y=\"170\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >页面<\/text><rect x=\"1056\" y=\"52\" width=\"332\" height=\"250\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"1056\" y=\"52\" width=\"332\" height=\"40\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"1072\" y=\"78\" font-size=\"16\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >顺序类<\/text><text x=\"1072\" y=\"108\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >⑥ 依赖无 ORDER BY 的返回顺序<\/text><text x=\"1072\" y=\"146\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >同步扫描与并行扫描都会改变物理访问起点或输<\/text><text x=\"1072\" y=\"170\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >出交错<\/text><rect x=\"24\" y=\"314\" width=\"1352\" height=\"102\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"44\" y=\"342\" font-size=\"17\" fill=\"#BE653B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >最该记住的一条<\/text><text x=\"240\" y=\"342\" font-size=\"14\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >WHERE 通常只减少返回行，不减少已扫描页面；要减少页面访问，靠索引、分区裁剪、BRIN、物化汇总或数据布局。<\/text><text x=\"44\" y=\"378\" font-size=\"14\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >还有：统计信息错误、表膨胀、上层汇聚，都不是「多开几个 worker」能修的。<\/text><text x=\"24\" y=\"426\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >业务需要稳定顺序时，显式写 ORDER BY<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "收束 · 一句话定位", "title": "它不是「多开几个 worker」", "lede": "把大表扫描拆成可互斥领取的连续块范围：每个 worker 做一部分，快者继续领，慢者不拖住全局；末段缩小 chunk，减少长尾；必要时从同步扫描位置开始。", "caption": "图 24　全篇机制的七层剖面；标记出的两层就是「自适应」的全部范围。", "bridge": "谢谢。带着那几个问题，去自己的库里跑一遍 EXPLAIN。", "notes": "收尾把整条链压成一张剖面。从上往下：决策层是你写的 SQL、索引和分区裁剪，先决定要不要读这么多块；计划层生成 partial path 加 Gather；执行层把共享描述符放进 DSM；快照层保证所有人站在同一个逻辑时间点；再往下就是标记出来的自适应两层——分配层用 phs_nallocated 原子领取，块访问层用连续 chunk 和末段 ramp-down；最底下是物理关系文件和操作系统的预读。越深的靛青越底层，而「自适应」只发生在倒数第二、第三层，上面那些层都是搭台子。所以一句话：自适应并行扫描的本质不是多开几个 worker，是把大表扫描拆成可互斥领取的连续块范围。记住三句话——Parallel Seq Scan 是 partial plan，输出不能重复；自适应点在 block chunk 动态分配，不是运行时重优化；并行能分摊 CPU 和部分执行工作，但消不掉 I/O、汇聚、排序、统计信息错误和错误数据模型的代价。留几个问题给愿意往下挖的人：把 chunk 再缩小，是先改善均衡还是先破坏 readahead？瓶颈在 Gather 传 tuple 时，该加 worker 还是把更多聚合下推到 parallel 部分？云盘、远端对象存储、本地 NVMe 上，chunk 的最优值会不会不同？怎么设计实验验证？", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >把整条链压成一张剖面：自适应只发生在其中两层<\/text><rect x=\"24\" y=\"50\" width=\"850\" height=\"42\" rx=\"0\" fill=\"#EBF1EE\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"40\" y=\"77\" font-size=\"15.5\" fill=\"#1B2B33\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-s -family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >自适应点<\/text><rect x=\"24\" y=\"280\" width=\"850\" height=\"42\" rx=\"0\" fill=\"#2E6373\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"40\" y=\"307\" font-size=\"15.5\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >块访问层<\/text><text x=\"170\" y=\"307\" font-size=\"13.5\" fill=\"#FFFFFF\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"0.92\" >连续 chunk 与末段 ramp-down —— 顺序读与收敛<\/text><text x=\"862\" y=\"307\" font-size=\"11.5\" fill=\"#FFFFFF\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"end\" letter-spacing=\"0\" opacity=\"1\" >L2<\/text><rect x=\"880\" y=\"289\" width=\"86\" height=\"24\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"923\" y=\"306\" font-size=\"11.5\" fill=\"#FFFFFF\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >自适应点<\/text><rect x=\"24\" y=\"326\" width=\"850\" height=\"42\" rx=\"0\" fill=\"#1E4B5A\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"40\" y=\"353\" font-size=\"15.5\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >存储层<\/text><text x=\"170\" y=\"353\" font-size=\"13.5\" fill=\"#FFFFFF\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"0.92\" >物理关系文件与 OS readahead —— 最底层<\/text><text x=\"862\" y=\"353\" f /* ---------- 舞台缩放：讲稿打开时矢量缩到左侧 ---------- */
function fit(){
  const vp=$('#viewport'), W=vp.clientWidth, H=vp.clientHeight;
  const pw = panelOn ? $('#notes').offsetWidth : 0;
  const aw = Math.max(320, W-pw);
  const s = Math.min(aw/1600, H/900);
  const st=$('#stage');
  st.style.transform='scale('+s+')';
  st.style.left=((aw-1600*s)/2)+'px';
  st.style.top=((H-900*s)/2)+'px';
}
window.addEventListener('resize', fit);

function render(){
  $('#slides').innerHTML = D.map((d,i)=>
    '<section class="slide'+(d.ctrl?' anim':'')+'" id="s'+i+'">'
    + '<div class="eyebrow"><span class="num">'+pad(i+1)+' / '+pad(N)+'</span>'+d.eyebrow+'</div>'
    + '<h1 class="title">'+d.title+'</h1>'
    + '<div class="lede">'+d.lede+'</div>'
    + '<div class="rule"></div>'
    + '<div class="figwrap">'+d.svg+'</div>'
    + '<div class="caption">'+d.caption+'</div>'
    + (d.ctrl ? '<div class="ctrls">'+d.ctrl+'</div>' : '')
    + '<div class="bridge"><span class="bk">承接 · NEXT</span>'+d.bridge+'</div>'
    + '<div class="footer"><div class="fbar"><i id="fbar'+i+'"></i></div>'
    + '<span class="fl">数据库筑基课 · 数据扫描方法「自适应并行扫描」</span>'
    + '<span class="fr">'+pad(i+1)+' / '+pad(N)+'</span></div>'
    + '</section>').join('');
}

function toast(s){
  const t=$('#toast'); t.textContent=s; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1600);
}

/* ---------- 页内开窗 ---------- */
function secHTML(d,i){
  return '<div class="nsec" id="nsec'+i+'"><span class="sn">'+pad(i+1)+' · '+d.eyebrow+'</span>'
    +'<h3>'+d.title+'</h3><p>'+d.notes+'</p>'
    +'<div class="br">「'+d.bridge+'」</div></div>';
}
function renderPanel(){
  const h=$('#nTitle'), sub=$('#nSub'), b=$('#nBody');
  if(panelMode==='here'){
    h.textContent='本页讲稿'; sub.textContent=pad(cur+1)+' / '+pad(N);
    b.innerHTML=secHTML(D[cur],cur); b.scrollTop=0;
  }else if(panelMode==='all'){
    h.textContent='全文讲稿'; sub.textContent='自动跟随当前页 · 共 '+N+' 页';
    b.innerHTML=D.map((d,i)=>secHTML(d,i)).join('');
  }else if(panelMode==='toc'){
    h.textContent='目录'; sub.textContent='点击跳转 · 共 '+N+' 页';
    b.innerHTML='<div class="tocgrid">'+D.map((d,i)=>
      '<a data-i="'+i+'" onclick="jump('+i+')"><span class="gn">'+pad(i+1)+'</span>'
      +'<span class="gt">'+d.title+'</span></a>').join('')+'</div>';
  }else{
    h.textContent='快捷键'; sub.textContent='全屏后底部同样常驻';
    b.innerHTML='<div class="keygrid">'+KEYS.map(k=>'<div><kbd>'+k[0]+'</kbd>'+k[1]+'</div>').join('')+'</div>'
      +'<div class="nsec"><p>讲稿采用页内开窗：按一下显示，再按一下关闭；显示时画面矢量缩放到左侧。'
      +'按 T 显示全部讲稿时自动定位到当前页，翻页时右侧讲稿会联动滚动并高亮当前页。</p></div>';
  }
  syncNotes(true);
}
function syncNotes(instant){
  if(!panelOn) return;
  if(panelMode==='all'){
    $$('.nsec').forEach(e=>e.classList.remove('cur'));
    const el=document.getElementById('nsec'+cur), nb=$('#nBody');
    if(el && nb){
      el.classList.add('cur');
      const top=el.offsetTop-6;
      if(instant) nb.scrollTop=top;
      else nb.scrollTo({top:top,behavior:'smooth'});
    }
  }else if(panelMode==='toc'){
    $$('.tocgrid a').forEach(a=>a.classList.toggle('cur', +a.dataset.i===cur));
  }
}
function openPanel(mode){
  if(panelOn && panelMode===mode){ closePanel(); return; }
  panelOn=true; panelMode=mode;
  document.body.classList.add('panel-on');
  renderPanel(); fit(); syncChrome();
  if(mode==='all') setTimeout(()=>syncNotes(true),90);
}
function closePanel(){
  if(!panelOn) return;
  panelOn=false; panelMode='';
  document.body.classList.remove('panel-on');
  fit(); syncChrome();
}
function jump(i){ closePanel(); go(i); }
function syncChrome(){
  $('#btnNotes').classList.toggle('act', panelOn && panelMode==='here');
  $('#btnAll').classList.toggle('act', panelOn && panelMode==='all');
  $('#btnToc').classList.toggle('act', panelOn && panelMode==='toc');
  $('#btnHelp').classList.toggle('act', panelOn && panelMode==='help');
  $('#btnFs').textContent = document.body.classList.contains('immersive') ? '退出全屏 F' : '全屏 F';
}

/* ---------- 翻页 ---------- */
function go(i,silent){
  i=Math.max(0,Math.min(N-1,i));
  $$('.slide').forEach((el,k)=>el.classList.toggle('on',k===i));
  cur=i;
  try{ localStorage.setItem('aps-slide',String(i)); }catch(e){}
  $('#pg').textContent=pad(i+1)+' / '+pad(N);
  const jp=$('#jump'); if(jp) jp.value=String(i+1);
  $('#bar').style.width=((i+1)/N*100)+'%';
  for(let k=0;k<N;k++){ const b=document.getElementById('fbar'+k); if(b) b.style.width=(k<=i?100:0)+'%'; }
  stopAnims();
  if(panelOn){
    if(panelMode==='here') renderPanel(); else syncNotes(false);
  }
  if(!silent) toast(pad(i+1)+'　'+D[i].title);
  syncChrome();
}
function next(){ if(cur<N-1) go(cur+1); else stopAuto(); }
function prev(){ if(cur>0) go(cur-1); }

/* ---------- 自动播放 / 全屏 ---------- */
function stopAuto(){
  autoOn=false; clearInterval(autoTimer); autoTimer=null;
  $('#btnAuto').textContent='自动播放 P'; $('#btnAuto').classList.remove('act');
}
function toggleAuto(){
  if(autoOn){ stopAuto(); toast('已暂停自动播放'); return; }
  autoOn=true; $('#btnAuto').textContent='❚❚ 暂停 P'; $('#btnAuto').classList.add('act');
  autoTimer=setInterval(()=>{ if(cur<N-1) go(cur+1,true); else stopAuto(); },12000);
  toast('自动播放：每 12 秒一页（P 暂停）');
}
function fs(){
  const el=document.documentElement;
  const immersive=document.body.classList.contains('immersive');
  if(document.fullscreenElement || immersive){
    document.body.classList.remove('immersive');
    try{ if(document.fullscreenElement) document.exitFullscreen(); }catch(e){}
    toast('已退出全屏');
    fit(); syncChrome();
    return;
  }
  try{
    const p=el.requestFullscreen && el.requestFullscreen();
    if(p && p.catch) p.catch(()=>toast('浏览器拦截了原生全屏，已进入沉浸模式'));
  }catch(e){}
  document.body.classList.add('immersive');
  toast('全屏：底部快捷键常驻（F 或 Esc 退出）');
  fit(); syncChrome();
}
document.addEventListener('fullscreenchange',()=>{
  if(!document.fullscreenElement) document.body.classList.remove('immersive');
  fit(); syncChrome();
});

/* ---------- 动画：三处，均带输入 / 播放暂停 / 单步 / 重置 ---------- */
const ANIMS=[];
function mkBase(max){ const a={step:0,max:max,timer:null,
  pause(){ if(this.timer){clearInterval(this.timer);this.timer=null;} const b=document.getElementById(this.playId); if(b)b.textContent='▶ 播放'; },
  play(){ if(this.step>=this.max) this.step=0; this.pause(); this.paint();
    const b=document.getElementById(this.playId); if(b)b.textContent='❚❚ 暂停';
    this.timer=setInterval(()=>{ if(this.step>=this.max){this.pause();return;} this.step++; this.paint(); },900); },
  stepOnce(){ this.pause(); if(this.step<this.max){this.step++;this.paint();} },
  reset(){ this.pause(); this.step=0; this.paint(); }
}; ANIMS.push(a); return a; }
function stopAnims(){ ANIMS.forEach(a=>a.pause()); }

/* A1：静态均分的长尾 vs 动态领取 */
const A1_SP=[50,40,30,100,90,80,70,60];
const a1=mkBase(7); a1.playId='a1-play';
a1.play=function(){
  this.pause(); this.paint();
  const b=document.getElementById(this.playId); if(b)b.textContent='❚❚ 暂停';
  this.timer=setInterval(()=>{ this.step=(this.step+1)%8; this.paint(); },850);
};
a1.stepOnce=function(){ this.pause(); this.step=(this.step+1)%8; this.paint(); };
a1.paint=function(){
  const v=A1_SP[this.step], sp=v/100;
  const inp=document.getElementById('a1-speed'); if(inp && +inp.value!==v) inp.value=v;
  for(let i=0;i<4;i++) setA('a1-r0-'+i,'width',780);
  setA('a1-e0','x',300+780-4);
  for(let i=0;i<3;i++) setA('a1-r1-'+i,'width',390);
  const w4=Math.min(780,390/sp);
  setA('a1-r1-3','width',w4);
  setA('a1-e1','x',300+w4-4);
  for(let i=0;i<3;i++) setA('a1-r2-'+i,'width',548);
  setA('a1-r2-3','width',520);
  setA('a1-e2','x',300+548-4);
  const out=document.getElementById('a1-out');
  if(out) out.innerHTML='<b>慢 worker 速度 '+sp.toFixed(2)+'</b>　静态均分整体完成 ≈ '
    +Math.round(w4/780*100)+'% 时间轴；动态领取 ≈ 70%，几乎不受慢者影响（示意 · 非实测）';
};

/* K：原子计数器领取序列 */
function buildSeq(nw,sp,nc){
  const speeds=[1.0,0.9,sp,0.65].slice(0,nw);
  const ft=new Array(nw).fill(0), seq=[];
  for(let k=0;k<nc;k++){
    let w=0;
    for(let i=1;i<nw;i++) if(ft[i]<ft[w]-1e-9) w=i;
    seq.push(w); ft[w]+=1/speeds[w];
  }
  return seq;
}
const k=mkBase(12); k.playId='k-play';
k.paint=function(){
  const nw=+document.getElementById('k-nw').value;
  const sp=+document.getElementById('k-sp').value/100;
  const seq=buildSeq(nw,sp,12), cnt=new Array(4).fill(0);
  for(let i=0;i<this.step;i++) cnt[seq[i]]++;
  for(let i=0;i<12;i++){
    const w=i<this.step?seq[i]:-1;
    setA('k-c'+i,'fill',w>=0?WCOLS[w]:'#FFFFFF');
    setA('k-c'+i,'stroke',w>=0?WCOLS[w]:'#D9D5CB');
    setA('k-ct'+i,'fill',w>=0?'#FFFFFF':'#89938F');
    setT('k-ct'+i,w>=0?('W'+(w+1)):String(i+1).padStart(2,'0'));
  }
  setT('k-counter','phs_nallocated · 已领取 '+this.step+' / 12 段');
  const spd=[1.0,0.9,sp,0.65];
  for(let i=0;i<4;i++){
    const vis=i<nw;
    ['k-row','k-wl','k-ws','k-wb','k-wc'].forEach(p=>setA(p+i,'opacity',vis?1:0.22));
    setA('k-wb'+i,'width',Math.max(1,820*cnt[i]/12));
    setT('k-wc'+i,'已领 '+cnt[i]+' 段');
    setT('k-ws'+i,'速度 '+(vis?spd[i].toFixed(2):'—'));
  }
  const out=document.getElementById('k-out');
  const desc=this.step===0?'等待开始 · 点播放或单步':
    '第 '+this.step+' 次领取：worker '+(seq[this.step-1]+1)+' 拿到第 '+this.step+' 段；谁先扫完，谁回来领下一段';
  if(out) out.innerHTML='<b>阶段 '+this.step+'/12</b>　'+desc+'（示意 · 非实测）';
};

/* R：末段 ramp-down 逐级减半 */
const r=mkBase(10); r.playId='r-play';
r.paint=function(){
  const base=+document.getElementById('r-base').value, sizes=[];
  for(let i=0;i<10;i++) sizes.push(Math.max(1,base>>Math.floor(i/2)));
  for(let i=0;i<10;i++){
    const on=i<this.step;
    setA('r-b'+i,'fill',on?'#E4F0EA':'#FFFFFF');
    setA('r-b'+i,'stroke',on?'#2F7A66':'#D9D5CB');
    setA('r-t'+i,'fill',on?'#2F7A66':'#46585F');
    setT('r-t'+i,on?String(sizes[i]):'—');
  }
  const c=this.step===0?base:sizes[Math.min(this.step-1,9)];
  const out=document.getElementById('r-out');
  if(out) out.innerHTML='<b>第 '+this.step+'/10 次领取</b>　chunk_size = '+c
    +'；剩余不足 64 个当前大小的 chunk 时 >>= 1（示意 · 非实测）';
};

function bindAnim(pre,a){
  document.getElementById(a.playId).onclick=()=>{ if(a.timer)a.pause(); else a.play(); };
  document.getElementById(pre+'-step').onclick=()=>a.stepOnce();
  document.getElementById(pre+'-reset').onclick=()=>a.reset();
  a.paint();
}

/* ---------- 键盘 ---------- */
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  const typing=(tag==='input'||tag==='select'||tag==='textarea');
  const k=e.key;
  if(k==='Escape'){
    if(typing){ e.target.blur(); return; }
    if(panelOn) closePanel();
    else if(document.fullscreenElement || document.body.classList.contains('immersive')) fs();
    return;
  }
  if(typing) return;
  if(k==='ArrowRight'||k===' '||k==='PageDown'){ e.preventDefault(); next(); }
  else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); prev(); }
  else if(k==='f'||k==='F'){ e.preventDefault(); fs(); }
  else if(k==='g'||k==='G'){ e.preventDefault(); openPanel('toc'); }
  else if(k==='n'||k==='N'){ e.preventDefault(); openPanel('here'); }
  else if(k==='t'||k==='T'){ e.preventDefault(); openPanel('all'); }
  else if(k==='p'||k==='P'){ e.preventDefault(); toggleAuto(); }
  else if(k==='?'||k==='h'||k==='H'){ e.preventDefault(); openPanel('help'); }
  else if(k==='Home'){ e.preventDefault(); go(0); }
  else if(k==='End'){ e.preventDefault(); go(N-1); }
  else if(/^[1-9]$/.test(k)){ go(parseInt(k,10)-1); }
});

/* ---------- 启动 ---------- */
function init(){
  render();
  $('#jump').max=String(N);
  $('#btnPrev').onclick=prev; $('#btnNext').onclick=next;
  $('#btnToc').onclick=()=>openPanel('toc');
  $('#btnNotes').onclick=()=>openPanel('here');
  $('#btnAll').onclick=()=>openPanel('all');
  $('#btnHelp').onclick=()=>openPanel('help');
  $('#btnAuto').onclick=toggleAuto;
  $('#btnFs').onclick=fs;
  $('#nClose').onclick=closePanel;
  $('#jump').onkeydown=e=>{
    if(e.key==='Enter'){ e.preventDefault();
      const v=parseInt($('#jump').value||'1',10);
      go(Number.isNaN(v)?0:Math.max(0,Math.min(N-1,v-1))); $('#jump').blur(); }
  };
  document.getElementById('a1-speed').oninput=function(){
    a1.pause(); const p=A1_SP.indexOf(+this.value); a1.step=p<0?0:p; a1.paint();
  };
  document.getElementById('k-nw').onchange=()=>{ k.pause(); k.step=0; k.paint(); };
  document.getElementById('k-sp').oninput=()=>{ k.pause(); k.step=0; k.paint(); };
  document.getElementById('r-base').onchange=()=>{ r.pause(); r.step=0; r.paint(); };
  bindAnim('a1',a1); bindAnim('k',k); bindAnim('r',r);
  fit(); go(0,true);
  setTimeout(()=>document.body.classList.add('ready'),80);
}
document.addEventListener('DOMContentLoaded',init);

</script>
