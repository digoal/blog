row2\"/><rect x=\"40\" y=\"302\" width=\"6\" height=\"44\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"58\" y=\"330\" font-size=\"14.5\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" id=\"k-wl2\">worker 3<\/text><text x=\"208\" y=\"330\" font-size=\"12.5\" fill=\"#89938F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" id=\"k-ws2\">速度 1.0<\/text><rect x=\"350\" y=\"316\" width=\"820\" height=\"16\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"350\" y=\"316\" width=\"1\" height=\"16\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" id=\"k-wb2\"/><text x=\"1200\" y=\"330\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" id=\"k-wc2\">已领 0 段<\/text><rect x=\"40\" y=\"354\" width=\"1336\" height=\"44\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" id=\"k-row3\"/><rect x=\"40\" y=\"354\" width=\"6\" height=\"44\" rx=\"0\" fill=\"#AE8A3E\" opacity=\"1\" /><text x=\"58\" y=\"382\" font-size=\"14.5\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" id=\"k-wl3\">worker 4<\/text><text x=\"208\" y=\"382\" font-size=\"12.5\" fill=\"#89938F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" id=\"k-ws3\">速度 1.0<\/text><rect x=\"350\" y=\"368\" width=\"820\" height=\"16\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"350\" y=\"368\" width=\"1\" height=\"16\" rx=\"0\" fill=\"#AE8A3E\" opacity=\"1\" id=\"k-wb3\"/><text x=\"1200\" y=\"382\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" id=\"k-wc3\">已领 0 段<\/text><text x=\"24\" y=\"420\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >src/backend/access/table/tableam.c · table_block_parallelscan_nextpage()<\/text><\/svg>", "ctrl": "<label>worker 数<\/label><select id=\"k-nw\"><option value=\"2\">2<\/option><option value=\"3\" selected>3<\/option><option value=\"4\">4<\/option><\/select><label>W3 速度<\/label><input type=\"range\" id=\"k-sp\" min=\"30\" max=\"100\" step=\"10\" value=\"50\"><button class=\"btn play\" id=\"k-play\">▶ 播放<\/button><button class=\"btn\" id=\"k-step\">单步 →<\/button><button class=\"btn\" id=\"k-reset\">重置<\/button><span class=\"out\" id=\"k-out\"><\/span>"}, {"eyebrow": "快照一致 · 同一逻辑时间点", "title": "并行不改变 MVCC 语义", "lede": "table_parallelscan_estimate() 把快照序列化空间算进 DSM，initialize 时 SerializeSnapshot；table_beginscan_parallel() 在 worker 中 RestoreSnapshot。", "caption": "图 10　快照从 leader 序列化进 DSM，再由每个 worker 恢复。", "bridge": "语义没问题了，接下来才是本篇最核心的折中：一次到底领多少块。", "notes": "多个进程同时扫一张表，最容易让人心里发毛的是：它们看到的是同一份数据吗？答案是，是的，而且机制很朴素。leader 在建立并行上下文时，table_parallelscan_estimate() 会把 MVCC 快照序列化所需的空间一并算进 DSM；table_parallelscan_initialize() 用 SerializeSnapshot 把快照写进去，记下偏移 phs_snapshot_off。每个 worker 启动扫描时，table_beginscan_parallel() 从同一个偏移 RestoreSnapshot，再注册成自己的临时快照。结果就是：所有参与者都站在同一个逻辑时间点上做可见性判断，谁也不会多看到或漏看到一行。这件事听起来平淡，但它是「输出子集可以随便切」的前提——正因为快照一致，块的分配才可以只考虑性能，不用考虑语义。好了，正确性、互斥性都齐了，现在终于可以问那个最核心的工程问题：一次到底领多少块？", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >并行不改变 MVCC 语义：所有参与者看到同一个逻辑时间点<\/text><rect x=\"24\" y=\"84\" width=\"280\" height=\"116\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"42\" y=\"122.28\" font-size=\"17\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >Leader<\/text><text x=\"42\" y=\"147.78\" font-size=\"17\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >持有本次查询的<\/text><text x=\"42\" y=\"173.28\" font-size=\"17\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >MVCC Snapshot<\/text><path d=\"M 304 142 L 360 142\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"2\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-prim)\"/><rect x=\"360\" y=\"64\" width=\"400\" height=\"270\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.5\" opacity=\"1\" /><rect x=\"360\" y=\"64\" width=\"400\" height=\"40\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"378\" y=\"90\" font-size=\"16\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >DSM · 共享扫描描述符<\/text><rect x=\"380\" y=\"120\" width=\"360\" height=\"72\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"396\" y=\"146\" font-size=\"14\" fill=\"#245A6B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >SerializeSnapshot()<\/text><text x=\"396\" y=\"172\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >估算序列化空间：table_parallelscan_estimate()<\/text><rect x=\"380\" y=\"204\" width=\"360\" height=\"54\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"396\" y=\"228\" font-size=\"13.5\" fill=\"#245A6B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >phs_snapshot_off<\/text><text x=\"396\" y=\"248\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >写入 DSM 的偏移位置<\/text><rect x=\"380\" y=\"270\" width=\"360\" height=\"48\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"396\" y=\"299\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >所有 worker 只读这一份快照状态<\/text><path d=\"M 760 214 L 812 214 L 812 114 L 848 114\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.5\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-prim)\"/><rect x=\"848\" y=\"76\" width=\"528\" height=\"76\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"866\" y=\"104\" font-size=\"15\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >worker 1<\/text><text x=\"866\" y=\"130\" font-size=\"13\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >table_beginscan_parallel() → RestoreSnapshot()<\/text><path d=\"M 760 214 L 812 214 L 812 210 L 848 210\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.5\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-prim)\"/><rect x=\"848\" y=\"172\" width=\"528\" height=\"76\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"866\" y=\"200\" font-size=\"15\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >worker 2<\/text><text x=\"866\" y=\"226\" font-size=\"13\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >table_beginscan_parallel() → RestoreSnapshot()<\/text><path d=\"M 760 214 L 812 214 L 812 306 L 848 306\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.5\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-prim)\"/><rect x=\"848\" y=\"268\" width=\"528\" height=\"76\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"866\" y=\"296\" font-size=\"15\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >worker 3<\/text><text x=\"866\" y=\"322\" font-size=\"13\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >table_beginscan_parallel() → RestoreSnapshot()<\/text><rect x=\"24\" y=\"348\" width=\"1352\" height=\"66\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" opacity=\"1\" /><text x=\"44\" y=\"374\" font-size=\"18\" fill=\"#2F7A66\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >结果<\/text><text x=\"120\" y=\"374\" font-size=\"16\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >每个 worker 用同一快照做可见性判断，输出子集既不重复也不遗漏<\/text><text x=\"24\" y=\"424\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >src/backend/access/table/tableam.c · table_parallelscan_initialize() / table_beginscan_parallel()<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "折中 · chunk 与 ramp-down", "title": "领一段连续块，末段再逐级减半", "lede": "worker 每次领一段连续 chunk，形成连续访问模式；扫描末尾 chunk_size 逐次减半降到 1，把剩余工作尽量摊匀，减少长尾。", "caption": "图 11　block 空间上的连续 chunk 与末段收敛；可播放 / 单步观察减半过程（示意，非实测）。", "bridge": "那这个初始 chunk 大小，到底是怎么算出来的？", "notes": "一次领一个块行不行？前面说过，不行，会把顺序 I/O 打散。一次领一大段呢？也不行，负载均衡就差了。PostgreSQL 的答案是折中：一次领一段连续的 chunk，worker 在本地范围内一块一块顺序扫，扫完再回来领下一段。这样每个 backend 的访问轨迹都是连续的，OS 的 readahead 认得出来；同时块是按段动态发的，谁快谁多拿。更巧的是末段：源码里当「剩余块数小于 chunk_size 乘 64」时，就把 chunk_size 右移一位，也就是减半；减完还会再撞上这个条件，再减，直到降到 1。为什么？因为扫描快结束时，如果还发出一大块，很可能某一个 worker 抱着它慢慢啃，其他人全空着——这正是长尾。你可以点播放看那十次领取的尺寸怎么从 8 一路收到 1。所以一句话：chunk 足够大，保住连续读；chunk 又足够小，可以动态均衡；末段再收一遍，把尾巴压平。那这个初始大小凭什么这么定？", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >连续 chunk 保住顺序读；末段逐级减半，压掉长尾<\/text><rect x=\"1250\" y=\"8\" width=\"140\" height=\"22\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1320\" y=\"22.91\" font-size=\"11.5\" fill=\"#AE8A3E\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >示意 · 非实测<\/text><rect x=\"40\" y=\"54\" width=\"221\" height=\"52\" rx=\"0\" fill=\"#1E4B5A\" opacity=\"1\" /><text x=\"150.5\" y=\"86\" font-size=\"13\" fill=\"#FFFFFF\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >chunk A<\/text><rect x=\"265\" y=\"54\" width=\"221\" height=\"52\" rx=\"0\" fill=\"#47808D\" opacity=\"1\" /><text x=\"375.5\" y=\"86\" font-size=\"13\" fill=\"#FFFFFF\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >chunk B<\/text><rect x=\"490\" y=\"54\" width=\"221\" height=\"52\" rx=\"0\" fill=\"#A4C4C6\" opacity=\"1\" /><text x=\"600.5\" y=\"86\" font-size=\"13\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >chunk C<\/text><rect x=\"715\" y=\"54\" width=\"221\" height=\"52\" rx=\"0\" fill=\"#2E6373\" opacity=\"1\" /><text x=\"825.5\" y=\"86\" font-size=\"13\" fill=\"#FFFFFF\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >chunk D<\/text><rect x=\"940\" y=\"54\" width=\"221\" height=\"52\" rx=\"0\" fill=\"#74A5AD\" opacity=\"1\" /><text x=\"1050.5\" y=\"86\" font-size=\"13\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >chunk E<\/text><rect x=\"1165\" y=\"54\" width=\"108\" height=\"52\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"1219\" y=\"86\" font-size=\"13\" fill=\"#FFFFFF\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >1/2<\/text><rect x=\"1277\" y=\"54\" width=\"52\" height=\"52\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"1303\" y=\"86\" font-size=\"13\" fill=\"#FFFFFF\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >1/4<\/text><rect x=\"1333\" y=\"54\" width=\"24\" height=\"52\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"1345\" y=\"86\" font-size=\"13\" fill=\"#FFFFFF\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >1<\/text><text x=\"40\" y=\"124\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >block 空间：前段领取固定大小，接近末尾时 chunk_size 逐次减半，最终降到 1<\/text><rect x=\"40\" y=\"140\" width=\"660\" height=\"70\" rx=\"0\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"58\" y=\"168\" font-size=\"14\" fill=\"#FFFFFF\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >phs_nallocated　atomic fetch-and-add(chunk_size)<\/text><text x=\"58\" y=\"194\" font-size=\"13\" fill=\"#FFFFFF\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >worker 领到的是一段连续范围，本地逐块扫完再回来领下一段<\/text><rect x=\"720\" y=\"140\" width=\"656\" height=\"70\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"738\" y=\"166\" font-size=\"14\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >触发条件（源码）<\/tex  2048, 1))，再取 min(..., 8192)。目标是切出约 1024～2048 个 chunk，并给超大表设上限。", "caption": "图 12　tableam.c 的三个常量、初始 chunk 公式与两个工程禁忌。", "bridge": "公式里反复强调「连续」，可早期实现并不是这样——看看它改掉了什么。", "notes": "源码 tableam.c 里就三个常量：PARALLEL_SEQSCAN_NCHUNKS 是 2048，意思是尽量把整次扫描拆成这么多个 I/O chunk；RAMPDOWN_CHUNKS 是 64，刚才那个末段减半的阈值；MAX_CHUNK_SIZE 是 8192 个 block，给超大表兜个上限。初始化时这么算：扫描块数除以 2048，至少取 1，再向上取到 2 的幂，最后不超过 8192。取 2 的幂是让后面减半能整整齐齐地一路除下去。这里藏着两个明确的工程判断：不把大表切成过少的大块，否则负载均衡差——源码注释甚至写了「过大的 chunk 已被证明对顺序扫描性能不利」；也不把每次领取变成单块，否则原子操作和进程交错会把连续访问搅碎。大表因为 8192 这个上限，实际 chunk 数会远多于 2048，这也是有意的。那「单块会搅碎连续访问」这话，到底是怎么来的？", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >初始 chunk 大小：一个公式，同时避开两个坑<\/text><rect x=\"24\" y=\"52\" width=\"442\" height=\"86\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"40\" y=\"76\" font-size=\"12.5\" fill=\"#245A6B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >PARALLEL_SEQSCAN_NCHUNKS<\/text><text x=\"40\" y=\"110\" font-size=\"25\" fill=\"#BE653B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >2048<\/text><text x=\"154\" y=\"110\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >把扫描拆成约这么多个 I/O chunk<\/text><rect x=\"482\" y=\"52\" width=\"442\" height=\"86\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"498\" y=\"76\" font-size=\"12.5\" fill=\"#245A6B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >PARALLEL_SEQSCAN_RAMPDOWN_CHUNKS<\/text><text x=\"498\" y=\"110\" font-size=\"25\" fill=\"#BE653B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >64<\/text><text x=\"612\" y=\"110\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >剩余不足这么多 chunk 时开始减半<\/text><rect x=\"940\" y=\"52\" width=\"442\" height=\"86\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"956\" y=\"76\" font-size=\"12.5\" fill=\"#245A6B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >PARALLEL_SEQSCAN_MAX_CHUNK_SIZE<\/text><text x=\"956\" y=\"110\" font-size=\"25\" fill=\"#BE653B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >8192<\/text><text x=\"1070\" y=\"110\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >chunk 上限，单位是 block<\/text><rect x=\"24\" y=\"154\" width=\"1352\" height=\"94\" rx=\"0\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"44\" y=\"180\" font-size=\"12\" fill=\"#FFFFFF\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"1\" opacity=\"1\" >table_block_parallelscan_startblock_init()<\/text><text x=\"44\" y=\"214\" font-size=\"18\" fill=\"#FFFFFF\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >chunk_size = pg_nextpower2_32( max( scan_nblocks / 2048, 1 ) )<\/text><text x=\"44\" y=\"238\" font-size=\"18\" fill=\"#FFFFFF\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >chunk_size = min( chunk_size, 8192 )<\/text><rect x=\"24\" y=\"262\" width=\"660\" height=\"100\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"42\" y=\"305.33\" font-size=\"14.5\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >坑一 · chunk 过大<\/text><text x=\"42\" y=\"328.53\" font-size=\"14.5\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >表被切成很少的几大块 → 负载均衡差；源码注释：过大的 chunk 已被证明对顺序扫描性能不利<\/text><rect x=\"716\" y=\"262\" width=\"660\" height=\"100\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1\" opacity=\"1\" /><text x=\"734\" y=\"305.1\" font-size=\"15\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >坑二 · 每次只领单块<\/text><text x=\"734\" y=\"329.1\" font-size=\"15\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >原子操作与进程交错会打散连续访问 → OS 难以识别顺序读，readahead 效果差<\/text><rect x=\"24\" y=\"374\" width=\"1352\" height=\"44\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" opacity=\"1\" /><text x=\"44\" y=\"402\" font-size=\"15\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >折中结果：约 1024 ～ 2048 个 chunk；大表因上限 8192 会得到更多 chunk<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "readahead · 为什么不给单块", "title": "交错拿单块，OS 认不出顺序读", "lede": "早期实现「谁来就给下一个最高块号」，多个后端交错拿单个 block，每个 backend 都难形成连续 I/O，某些操作系统也难识别顺序读模式，readahead 效果差。", "caption": "图 13　同一批 block 的两种访问序列；颜色表示领到该块的 worker。", "bridge": "顺序读保住了，起点却不一定从表头开始：还有一层很少被提到的自适应。", "notes": "nextpage() 开头那段注释，其实是一段很坦诚的「我们以前踩过这个坑」。早期实现是：哪个 worker 来要，就把下一个最高的块号给它。结果是 0 给 W1、1 给 W2、2 给 W3、3 给 W4、4 又回给 W1……站在整张表的角度看，块号是顺序的；可站在每一个进程的角度看，W1 拿到的是 0、4、8、12，全是跳的。操作系统盯着的是单个进程的读请求序列，它很难从这种交错里识别出顺序读，预读自然就失效了。所以现在改成：先给 W1 一整段 0 到 3，W2 拿 4 到 7，各扫各的连续段；本地段扫完，再去做一次原子领取。你看图里上下两排的颜色，上排是花插着的，下排是一段一段整块颜色。这个改动没有增加任何复杂调度，只是把「分配的粒度」从块换成了段，就把顺序 I/O 找回来了。到这里，扫描内部的事基本讲完；但还有一个很少被提到的机制，连起点都不一定在表头。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >为什么不给「下一个最高块号」：单块交错会打散顺序 I/O<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >源码注释：table_block_parallelscan_nextpage()，早期实现已放弃逐块分配<\/text><text x=\"24\" y=\"72\" font-size=\"13\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"2\" opacity=\"1\" >旧做法 · 谁来就给下一个最高块号<\/text><rect x=\"24\" y=\"82\" width=\"80\" height=\"40\" rx=\"0\" fill=\"#1E4B5A\" opacity=\"1\" /><text x=\"64\" y=\"108\" font-size=\"14\" fill=\"#FFFFFF\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >0<\/text><rect x=\"107\" y=\"82\" width=\"80\" height=\"40\" rx=\"0\ ospace\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >3<\/text><rect x=\"356\" y=\"188\" width=\"80\" height=\"40\" rx=\"0\" fill=\"#47808D\" opacity=\"1\" /><text x=\"396\" y=\"214\" font-size=\"14\" fill=\"#FFFFFF\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >4<\/text><rect x=\"439\" y=\"188\" width=\"80\" height=\"40\" rx=\"0\" fill=\"#47808D\" opacity=\"1\" /><text x=\"479\" y=\"214\" font-size=\"14\" fill=\"#FFFFFF\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >5<\/text><rect x=\"522\" y=\"188\" width=\"80\" height=\"40\" rx=\"0\" fill=\"#47808D\" opacity=\"1\" /><text x=\"562\" y=\"214\" font-size=\"14\" fill=\"#FFFFFF\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >6<\/text><rect x=\"605\" y=\"188\" width=\"80\" height=\"40\" rx=\"0\" fill=\"#47808D\" opacity=\"1\" /><text x=\"645\" y=\"214\" font-size=\"14\" fill=\"#FFFFFF\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >7<\/text><rect x=\"688\" y=\"188\" width=\"80\" height=\"40\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"728\" y=\"214\" font-size=\"14\" fill=\"#FFFFFF\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >8<\/text><rect x=\"771\" y=\"188\" width=\"80\" height=\"40\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"811\" y=\"214\" font-size=\"14\" fill=\"#FFFFFF\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >9<\/text><rect x=\"854\" y=\"188\" width=\"80\" height=\"40\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"894\" y=\"214\" font-size=\" parallelscan_initialize() 里，只要 synchronize_seqscans 打开、表用的不是 local buffer、而且表块数大于 shared_buffers 的四分之一，就把 phs_syncscan 置上。真正起点在 startblock_init() 里定：调用方指定了就用指定值；没指定但同步扫描开着，就问 ss_get_location() 要一个位置；否则从 0 开始。实际块号再按 (nallocated + startblock) % nblocks 取模，所以扫到表尾会绕回表头。于是「自适应」其实有两层：一层是我们讲了一整篇的、查询内部多个 worker 动态领 chunk；另一层是查询之间、多个并发大扫描尽量贴着彼此的位置走，共享 I/O。代价也很明确：扫描可能从表中间开始，并行还会让输出交错，所以没有 ORDER BY 就千万别依赖返回顺序。业务要顺序，就显式写 ORDER BY。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >起点不必是 block 0：并行扫描也能配合同步顺序扫描<\/text><text x=\"24\" y=\"54\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"2\" opacity=\"1\" >① 三个条件同时满足，才打开 phs_syncscan<\/text><rect x=\"24\" y=\"64\" width=\"410\" height=\"46\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"38\" y=\"93\" font-size=\"13.5\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >synchronize_seqscans = on<\/text><rect x=\"24\" y=\"118\" width=\"410\" height=\"46\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"38\" y=\"147\" font-size=\"13.5\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >不是 local buffer（RelationUsesLocalBuffers）<\/text><rect x=\"24\" y=\"172\" width=\"410\" height=\"46\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"38\" y=\"201\" font-size=\"13.5\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >表块数 &gt; shared_buffers / 4（源码：NBuffers / 4）<\/text><path d=\"M 434 172 L 474 172\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"2\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-prim)\"/><text x=\"490\" y=\"54\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"2\" opacity=\"1\" >② 起点怎么定<\/text><rect x=\"474\" y=\"64\" width=\"420\" height=\"232\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"490\" y=\"90\" font-size=\"12.5\" fill=\"#245A6B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >table_block_parallelscan_startblock_init()<\/text><line x1=\"490\" y1=\"104\" x2=\"878\" y2=\"104\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"490\" y=\"130\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >调用方指定 startblock<\/text><text x=\"700\" y=\"130\" font-size=\"13.5\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >→ 用指定值<\/text><text x=\"490\" y=\"166\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >未指定，且 syncscan 打开<\/text><text x=\"700\" y=\"166\" font-size=\"13.5\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >→ ss_get_location()<\/text><text x=\"490\" y=\"202\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >否则<\/text><text x=\"700\" y=\"202\" font-size=\"13.5\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >→ 从 0 开始<\/text><line x1=\"490\" y1=\"222\" x2=\"878\" y2=\"222\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"490\" y=\"250\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >实际块号 = (nallocated + phs_startblock) % phs_nblocks<\/text><text x=\"490\" y=\"278\" font-size=\"13\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >取模 → 扫到表尾会 wrap around 回表头<\/text><path d=\"M 894 172 L 930 172\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"2\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-prim)\"/><text x=\"930\" y=\"54\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"2\" opacity=\"1\" >③ 两层「自适应」<\/text><rect x=\"930\" y=\"64\" width=\"446\" height=\"110\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" opacity=\"1\" /><text x=\"946\" y=\"90\" font-size=\"14\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >查询内<\/text><text x=\"946\" y=\"116\" font-size=\"13.5\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >多个 worker 动态领取 chunk<\/text><text x=\"946\" y=\"146\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >→ 负载均衡<\/text><rect x=\"930\" y=\"186\" width=\"446\" height=\"110\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"946\" y=\"212\" font-size=\"14\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >查询间<\/text><text x=\"946\" y=\"238\" font-size=\"13.5\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >并发大表扫描尽量靠近彼此位置<\/text><text x=\"946\" y=\"268\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >→ 共享缓存与 I/O<\/text><rect x=\"24\" y=\"312\" width=\"1352\" height=\"100\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"44\" y=\"340\" font-size=\"18\" fill=\"#BE653B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >代价<\/text><text x=\"120\" y=\"340\" font-size=\"15\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >扫描可能从表中间开始、再绕回表头；并行还会让输出交错<\/text><text x=\"44\" y=\"374\" font-size=\"15\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >所以：没有 ORDER BY 就不要依赖返回顺序。物理访问顺序服务吞吐，不服务观察顺序。<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "对照 · morsel-driven", "title": "相同的工程直觉，不同的作用层次", "lede": "两者都把大任务拆成小单元、用运行时领取替代静态切分；但 PostgreSQL 只在扫描 block 范围层动态分配，论文讨论的是面向多核 / NUMA 的整条查询执行流水线。", "caption": "图 15　PostgreSQL 块范围分配与 Morsel-Driven Parallelism（SIGMOD 2014）的分层对照。", "bridge": "另一个更容易被混为一谈的词是「自适应查询处理」，范围比这大得多。", "notes": "常有人把这套机制叫成 morsel-driven parallelism，其实只说对了一半的直觉。Leis 他们 2014 年那篇论文，讲的是把输入拆成较小的 morsel，worker 从调度器领 morsel、执行一段 pipeline，靠细粒度任务减少负载不均，再结合 NUMA-aware placement 保持内存局部性——它调度的是整条查询流水线，连算子和局部性一起管。PostgreSQL 做的要窄得多：只在「扫描 block 范围」这一层动态领取 chunk，没有把整个 pipeline 变成 morsel 调度，也不会在扫描过程中根据 NUMA、cache miss 或者实际选择率换计划。相同的是那股工程直觉——把大任务拆小、运行时领取、别静态切死；不同的是作用的层次。为什么 PG 选了这个窄版本？因为扫描块天然可分割、可去重、可顺序访问，是个性价比极高的切入点。这个边界分清了，下一个词就更不能混。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >相同的工程直觉，不同的作用层次<\/text><rect x=\"24\" y=\"52\" width=\"660\" height=\"44\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"44\" y=\"80\" font-size=\"17\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >PostgreSQL parallel seq scan<\/text><rect x=\"716\" y=\"52\" width=\"660\" height=\"44\" rx=\"0\" fill=\"#47808D\" opacity=\"1\" /><text x=\"736\" y=\"80\" font-size=\"16\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >Morsel-Driven Parallelism（SIGMOD 2014）<\/text><rect x=\"24\" y=\"104\" width=\"660\" height=\"82\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"716\" y=\"104\" width=\"660\" height=\"82\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"40\" y=\"128\" font-size=\"12.5\" fill=\"#89938F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"1.5\" opacity=\"1\" >作用对象<\/text><text x=\"732\" y=\"128\" font-size=\"12.5\" fill=\"#89938F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"1.5\" opacity=\"1\" >作用对象<\/text><text x=\"40\" y=\"152\" font-size=\"14.5\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >扫描层：连续 block chunk<\/text><text x=\"732\" y=\"152\" font-size=\"14.5\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >执行流水线：较小的 morsel<\/text><line x1=\"684\" y1=\"145\" x2=\"716\" y2=\"145\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"24\" y=\"194\" width=\"660\" height=\"82\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"716\" y=\"194\" width=\"660\" height=\"82\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"40\" y=\"218\" font-size=\"12.5\" fill=\"#89938F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"1.5\" opacity=\"1\" >自适应点<\/text><text x=\"732\" y=\"218\" font-size=\"12.5\" fill=\"#89938F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"1.5\" opacity=\"1\" >自适应点<\/text><text x=\"40\" y=\"242\" font-size=\"14.5\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >谁先扫完谁再取；末段缩小 chunk<\/text><text x=\"732\" y=\"242\" font-size=\"14.5\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >小粒度任务减不均；结合 NUMA-aware placement 保持局部性<\/text><line x1=\"684\" y1=\"235\" x2=\"716\" y2=\"235\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"24\" y=\"284\" width=\"660\" height=\"82\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"716\" y=\"284\" width=\"660\" height=\"82\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"40\" y=\"308\" font-size=\"12.5\" fill=\"#89938F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"1.5\" opacity=\"1\" >边界<\/text><text x=\"732\" y=\"308\" font-size=\"12.5\" fill=\"#89938F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"1.5\" opacity=\"1\" >边界<\/text><text x=\"40\" y=\"332\" font-size=\"14.5\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >不是完整运行时重优化；不按 NUMA / 选择率反馈改计划<\/text><text x=\"732\" y=\"332\" font-size=\"14.5\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >面向多核 / NUMA 的查询执行架构；不是 PostgreSQL 当前通用架构<\/text><line x1=\"684\" y1=\"325\" x2=\"716\" y2=\"325\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"24\" y=\"382\" width=\"1352\" height=\"38\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1\" opacity=\"1\" /><text x=\"44\" y=\"406\" font-size=\"14.5\" fill=\"#AE8A3E\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >相同：拆成小任务单元、运行时领取替代静态切分　｜　不同：PG 只在「扫描块分配」这一层自适应<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "边界 · AQP 与 ML", "title": "并行修不了错误计划", "lede": "Adaptive Query Processing 包含运行时改 join 顺序、按反馈调执行路径等；ML 集成方向更大。PostgreSQL parallel seq scan 没有训练模型，也不在执行中重写计划。", "caption": "图 16　三个范围层层包含；右侧是一个必须分清的反例。", "bridge": "边界划清了，现在可以把它和别的扫描路径并排比一比。", "notes": "「自适应查询处理」是个大得多的词。它通常包括：运行时发现选择率估错了，就改 join 顺序或物化策略；根据数据到达速度、阻塞算子、内存压力调整执行路径；用反馈或学习模型改进代价估算和资源分配。用户给的那篇 ML 集成的 PostgreSQL case study，属于这个更大方向里的背景材料，提醒我们数据库确实可以用历史执行和运行时指标增强自适应能力。但本文讲的 parallel seq scan 不是 ML 驱动功能，它没有训练模型，也不在执行中重写计划，只是用共享计数器和 chunk 策略把扫描任务分得更稳。这个边界必须分清，否则会引出很危险的期待。举个反例：统计信息过旧，优化器把本该走索引的查询估成了全表扫，还给它配了并行。这时候并行机制最多让这条错误路径跑得快一点，它绝不会把错误路径变成正确路径。修这个得靠 ANALYZE、索引和数据模型。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >别把「自适应」放大成「数据库会自动修复错误计划」<\/text><rect x=\"24\" y=\"54\" width=\"880\" height=\"344\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1\" opacity=\"1\" /><text x=\"42\" y=\"80\" font-size=\"15\" fill=\"#AE8A3E\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >ML 集成方向（背景材料）<\/text><text x=\"42\" y=\"102\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >历史执行、运行时指标、学习模型调参 —— 不是 PG parallel seq scan 的实现<\/text><rect x=\"60\" y=\"116\" width=\"808\" height=\"264\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"78\" y=\"142\" font-size=\"15\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >Adaptive Query Processing（更大范围）<\/text><text x=\"78\" y=\"164\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >运行时改 join 顺序 / 物化策略；按到达速度、内存压力调路径；反馈改进估算<\/text><rect x=\"96\" y=\"180\" width=\"736\" height=\"182\" rx=\"0\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"114\" y=\"206\" font-size=\"16\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >本篇主题 · 扫描块动态分配<\/text><text x=\"114\" y=\"234\" font-size=\"13.5\" fill=\"#FFFFFF\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >共享原子计数器 + 连续 chunk + 末段 ramp-down<\/text><text x=\"114\" y=\"262\" font-size=\"13.5\" fill=\"#FFFFFF\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >没有训练模型，也不在执行中重写计划<\/text><text x=\"114\" y=\"300\" font-size=\"14\" fill=\"#FFFFFF\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >它只是把扫描任务分配得更稳<\/text><rect x=\"928\" y=\"54\" width=\"448\" height=\"344\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"928\" y=\"54\" width=\"448\" height=\"42\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"946\" y=\"81\" font-size=\"16\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >一个必须分清的反例<\/text><rect x=\"946\" y=\"112\" width=\"412\" height=\"46\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"960\" y=\"141\" font-size=\"14\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >选择率估错<\/text><path d=\"M 1152 158 L 1152 170\" fill=\"none\" stroke=\"#BE653B\" stroke-width=\"1.5\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-acc)\"/><rect x=\"946\" y=\"170\" width=\"412\" height=\"46\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"960\" y=\"199\" font-size=\"14\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >本该走索引，却选了并行全表扫<\/text><path d=\"M 1152 216 L 1152 228\" fill=\"none\" stroke=\"#BE653B\" stroke-width=\"1.5\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-acc)\"/><rect x=\"946\" y=\"228\" width=\"412\" height=\"46\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"960\" y=\"257\" font-size=\"14\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >并行把这条错误路径跑快一点<\/text><path d=\"M 1152 274 L 1152 286\" fill=\"none\" stroke=\"#BE653B\" stroke-width=\"1.5\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-acc)\"/><rect x=\"946\" y=\"286\" width=\"412\" height=\"46\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"960\" y=\"315\" font-size=\"14\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >不能把它变成正确路径<\/text><text x=\"946\" y=\"352\" font-size=\"12.5\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >修复估算错误要靠统计信息、索引与数据模型<\/text><text x=\"24\" y=\"418\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >Eddies (SIGMOD 2000) 与 ML Case Study 仅作 AQP / ML 方向背景参照<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "横向 · 分工与均衡", "title": "难点不是「N 个块除以 W 个 worker」", "lede": "把五种路径的主要目标、分工方式、负载均衡、I/O 局部性逐项摆平，才能看见 PostgreSQL 那个折中到底折中在哪。", "caption": "图 17　五种扫描 / 执行路径在四个维度上的对照（依据原文横向对比表）。", "bridge": "再看支持情况与场景边界，这张表才算完整。", "notes": "把几种路径摆平了看，差别就很鲜明。普通顺序扫描没有分工，I/O 局部性最好，但单进程有上限。静态分段并行倒是简单，可一旦数据倾斜或速度不均，长尾马上出现。Parallel Bitmap Heap Scan 的思路不同：bitmap 建好之后，多个 worker 按 bitmap 分 heap block，heap 阶段能均衡，但 bitmap 构建本身可能是单点——而且底层 index scan 并不并行。morsel-driven 那类架构粒度更细、更通用，代价是要重构执行器和调度器。轮到自适应并行扫描：共享计数器、按连续 chunk 领取，快者多领、末段缩小，既保住了每个 worker 的连续范围，又把负载均衡做在运行时。你看，这一列其实是把「正确性、均衡、连续性」三个条件同时写进了一行。所以这活儿的难点从来不是除法，而是三者一起优化。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"0\" y=\"6\" width=\"170\" height=\"84\" rx=\"0\" fill=\"#245A6B\" stroke=\"#D9D5CB\" stroke-wi =\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >无分工<\/text><rect x=\"662\" y=\"174\" width=\"246\" height=\"84\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"674\" y=\"217.755\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >每个 worker 固定一段<\/text><rect x=\"908\" y=\"174\" width=\"246\" height=\"84\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"920\" y=\"217.755\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >heap block 按 bitmap 分配<\/text><rect x=\"1154\" y=\"174\" width=\"246\" height=\"84\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1166\" y=\"217.755\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >worker 领取 morsel<\/text><rect x=\"0\" y=\"258\" width=\"170\" height=\"84\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"12\" y=\"301.755\" font-size=\"13.5\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >负载均衡<\/text><rect x=\"170\" y=\"258\" width=\"246\" height=\"84\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"182\" y=\"301.755\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >快者多领，末段减小 chunk<\/text><rect x=\"416\" y=\"258\" width=\"246\" height=\"84\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"428\" y=\"301.755\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >不涉及<\/text><rect x=\"662\" y=\"258\" width=\"246\" height=\"84\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"674\" y=\"301.755\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >容易长尾<\/text><rect x=\"908\" y=\"258\" width=\"246\" height=\"84\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"920\" y=\"292.17\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >heap 阶段可均衡，bitmap 构建可<\/text><text x=\"920\" y=\"311.34\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >能单点<\/text><rect x=\"1154\" y=\"258\" width=\"246\" height=\"84\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1166\" y=\"301.755\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >更细粒度、更通用<\/text><rect x=\"0\" y=\"342\" width=\"170\" height=\"84\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"12\" y=\"385.755\" font-size=\"13.5\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >I/O 局部性<\/text><rect x=\"170\" y=\"342\" width=\"246\" height=\"84\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"182\" y=\"385.755\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >每个 worker 保持连续 block 范围<\/text><rect x=\"416\" y=\"342\" width=\"246\" height=\"84\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"428\" y=\"385.755\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >最好<\/text><rect x=\"662\" y=\"342\" width=\"246\" height=\"84\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"674\" y=\"385.755\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >取决于分段<\/text><rect x=\"908\" y=\"342\" width=\"246\" height=\"84\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"920\" y=\"385.755\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >按需要访问的 heap block<\/text><rect x=\"1154\" y=\"342\" width=\"246\" height=\"84\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1166\" y=\"385.755\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >取决于 morsel 与 NUMA 策略<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "横向 · 支持与场景", "title": "哪些是现实，哪些只是参照", "lede": "PostgreSQL 当前已支持 parallel seq scan 与 parallel bitmap heap scan；静态分段不是主要实现方式；morsel-driven 不是 PG 当前通用架构。", "caption": "图 18　支持情况、适合与不适合场景（依据原文横向对比表）。", "bridge": "机制都对了，也不代表一定赚——收益是有区间的。", "notes": "下半张表把「现实」和「参照」分开。PostgreSQL 当前确实支持 parallel seq scan，也支持 parallel bitmap heap scan；静态平均分段并不是它的主要实现方式；至于 morsel-driven，那是论文里的执行架构，不是 PG 现在通用的东西，别拿它的预期来对标。场景上，自适应并行扫描吃的是「大表、低选择率过滤、CPU 可分摊」这一档；点查、小 LIMIT、带 parallel unsafe 函数的查询、要往客户端吐大量明细行的查询，都不该指望它。反过来，普通顺序扫适合小表或 I/O 已经足够的情形，遇到超大表加紧时间窗就吃力；bitmap heap scan 吃中等选择率、索引先筛块，但 bitmap 构建可能成为瓶颈。把这两张表连起来读，那个工程折中就很清楚了：chunk 足够大，保住连续读；chunk 又足够小，可以动态均衡。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"0\" y=\"6\" width=\"170\" height=\"104\" rx=\"0\" fill=\"#245A6B\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"12\" y=\"59.69\" font-size=\"13\" fill=\"#FFFFFF\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >维度<\/text><rect x=\"170\" y=\"6\" width=\"246\" height=\"104\" rx=\"0\" fill=\"#245A6B\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"182\" y=\"59.69\" font-size=\"13\" fill=\"#FFFFFF\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >自适应并行扫描<\/text><rect x=\"416\" y=\"6\" width=\"246\" height=\"104\" rx=\"0\" fill=\"#245A6B\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"428\" y=\"59.69\" font-size=\"13\" fill=\"#FFFFFF\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >普通顺序扫描<\/text><rect x=\"662\" y=\"6\" width=\"246\" height=\"104\" rx=\"0\" fill=\"#245A6B\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"674\" y=\"59.69\" font-size=\"13\" fill=\"#FFFFFF\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >静态分段并行<\/text><rect x=\"908\" y=\"6\" width=\"246\" height=\"104\" rx=\"0\" fill=\"#245A6B\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"920\" y=\"59.69\" font-size=\"13\" fill=\"#FFFFFF\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >Parallel Bitmap Heap Scan<\/text><rect x=\"1154\" y=\"6\" width=\"246\" height=\"104\" rx=\"0\" fill=\"#245A6B\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1166\" y=\"59.69\" font-size=\"13\" fill=\"#FFFFFF\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >Morsel-driven 架构<\/text><rect x=\"0\" y=\"110\" width=\"170\" height=\"104\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"12\" y=\"163.755\" font-size=\"13.5\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >PG 当前支持<\/text><rect x=\"170\" y=\"110\" width=\"246\" height=\"104\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"182\" y=\"163.755\" font-size=\"13.5\" fill=\"#4
