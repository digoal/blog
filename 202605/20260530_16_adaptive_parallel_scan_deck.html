<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数据库筑基课 · 数据扫描方法「自适应并行扫描」</title>
<!-- 单文件交付：所有原理图均为现场绘制的内联 SVG，零外部图片 / 字体 / 脚本依赖。 -->
<style>
:root{
  --bg:#F7F6F2; --bg2:#F1EFE9; --ink:#1B2B33; --ink2:#46585F; --muted:#89938F; --line:#D9D5CB;
  --primary:#245A6B; --prim-l:#E5EFF0; --accent:#BE653B; --acc-l:#F7E9DE;
  --green:#2F7A66; --green-l:#E4F0EA; --gold:#AE8A3E; --gold-l:#F5EDDC;
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#E9E7E1}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
#viewport{position:absolute;inset:0 0 66px 0;overflow:hidden}
#stage{position:absolute;width:1600px;height:900px;background:var(--bg);
  transform-origin:top left;box-shadow:0 16px 54px rgba(27,43,51,.12)}
body.ready #stage{transition:transform .36s cubic-bezier(.2,.7,.2,1),left .36s cubic-bezier(.2,.7,.2,1),top .36s cubic-bezier(.2,.7,.2,1)}
.slide{position:absolute;inset:0;display:none;background:var(--bg)}
.slide.on{display:block;animation:fadein .4s cubic-bezier(.2,.7,.2,1)}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.eyebrow{position:absolute;left:64px;top:44px;font-size:13px;letter-spacing:3.4px;color:var(--primary);font-weight:600}
.eyebrow .num{font-family:var(--mono);letter-spacing:1px;color:var(--accent);margin-right:14px}
h1.title{position:absolute;left:64px;top:70px;margin:0;font-family:var(--serif);font-size:44px;
  line-height:1.25;font-weight:700;letter-spacing:1.2px;color:var(--ink)}
.lede{position:absolute;left:64px;top:139px;width:1440px;font-size:19px;color:var(--ink2);line-height:1.5;letter-spacing:.3px}
.rule{position:absolute;left:64px;top:181px;width:1472px;height:1px;background:var(--line)}
.figwrap{position:absolute;left:100px;top:198px;width:1400px;height:430px}
svg.figure{display:block;overflow:visible}
.caption{position:absolute;left:100px;top:638px;width:1400px;font-size:13px;color:var(--muted);letter-spacing:.4px}
.bridge{position:absolute;left:64px;top:716px;width:1472px;font-size:20px;color:var(--accent);
  line-height:1.55;letter-spacing:.4px;padding-left:18px;border-left:3px solid var(--accent);font-family:var(--serif)}
.bridge .bk{font-family:var(--sans);font-size:13px;color:var(--muted);letter-spacing:2px;display:block;margin-bottom:2px}
.footer{position:absolute;left:64px;top:846px;width:1472px;height:1px;background:var(--line)}
.footer .fl{position:absolute;left:0;top:14px;font-size:12.5px;color:var(--muted);letter-spacing:2px}
.footer .fr{position:absolute;right:0;top:12px;font-family:var(--mono);font-size:14px;color:var(--ink2)}
.footer .fbar{position:absolute;left:0;right:0;top:-1px;height:2px;background:transparent}
.footer .fbar i{display:block;height:2px;background:var(--primary);width:0;transition:width .4s ease}

/* 动画控件：位于图下方独立条带，不覆盖图 */
.ctrls{position:absolute;left:100px;top:664px;width:1400px;height:40px;display:flex;align-items:center;gap:10px}
.ctrls label{font-size:13px;color:var(--ink2);white-space:nowrap}
.ctrls select,.ctrls input[type=range]{font-family:var(--sans);font-size:13px;color:var(--ink);
  background:#fff;border:1px solid var(--line);border-radius:4px;padding:4px 8px;outline:none}
.ctrls input[type=range]{width:180px;padding:0;accent-color:var(--primary);border:none;background:transparent}
.ctrls .btn{min-height:30px;padding:5px 14px;border:1px solid var(--primary);border-radius:4px;
  background:#fff;color:var(--primary);font-size:13px;cursor:pointer;font-family:var(--sans);white-space:nowrap}
.ctrls .btn.play{background:var(--primary);color:#fff}
.ctrls .btn:hover{filter:brightness(.94)}
.ctrls .out{font-size:13px;color:var(--ink2);margin-left:auto;min-width:0;flex:1;max-width:620px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrls .out b{color:var(--accent);font-weight:600}

/* 底部外壳：两行，全屏后按键仍常驻 */
.chrome{position:fixed;left:0;right:0;bottom:0;height:66px;background:#FCFBF8;
  border-top:1px solid var(--line);z-index:40;display:flex;flex-direction:column;padding:6px 18px 5px;gap:4px}
.chrome .r1{display:flex;align-items:center;gap:7px;height:32px;flex:0 0 32px}
.chrome .r2{display:flex;align-items:center;font-size:11.5px;color:var(--muted);
  white-space:nowrap;overflow:hidden;line-height:1.2}
.chrome .r2 span{padding:0 10px;border-right:1px solid var(--line)}
.chrome .r2 span:first-child{padding-left:0}
.chrome .r2 span:last-child{border-right:none}
.chrome button{font-family:var(--sans);font-size:13px;color:var(--ink2);background:transparent;
  border:1px solid transparent;border-radius:5px;padding:6px 11px;cursor:pointer;white-space:nowrap}
.chrome button:hover{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome button.act{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome input.jump{font-family:var(--mono);font-size:12px;color:var(--ink2);background:#fff;
  border:1px solid var(--line);border-radius:5px;padding:5px 6px;width:56px;outline:none;text-align:center}
.chrome .pg{font-family:var(--mono);font-size:14px;color:var(--ink);min-width:76px;text-align:center}
.chrome .track{flex:1;height:3px;background:var(--line);border-radius:3px;margin:0 12px;position:relative;min-width:40px}
.chrome .track i{position:absolute;left:0;top:0;height:3px;background:var(--primary);border-radius:3px;transition:width .35s}
body.immersive .chrome{background:var(--bg2)}
body.immersive{background:#E9E7E1}

/* 页内开窗：右侧讲稿，不是弹窗 */
#notes{position:fixed;right:0;top:0;bottom:66px;width:38vw;min-width:380px;max-width:620px;
  background:#FCFBF8;border-left:1px solid var(--line);z-index:30;display:flex;flex-direction:column;
  transform:translateX(101%);transition:transform .36s cubic-bezier(.2,.7,.2,1);
  box-shadow:-14px 0 44px rgba(27,43,51,.07)}
body.panel-on #notes{transform:translateX(0)}
.nhead{padding:16px 22px 13px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex:0 0 auto}
.nhead .nt{font-family:var(--serif);font-size:21px;color:var(--ink);font-weight:700;flex:1}
.nhead .ns{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.nhead button{font-family:var(--sans);font-size:12.5px;background:#fff;border:1px solid var(--line);
  border-radius:5px;padding:6px 11px;cursor:pointer;color:var(--ink2)}
.nhead button:hover{border-color:var(--primary);color:var(--primary)}
.nbody{flex:1;overflow-y:auto;position:relative;padding:6px 22px 44px;scroll-behavior:smooth}
.nbody::-webkit-scrollbar{width:9px}
.nbody::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
.nsec{border-top:1px solid var(--line);padding:18px 0 22px}
.nsec:first-child{border-top:none}
.nsec .sn{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:1px}
.nsec h3{margin:8px 0 11px;font-family:var(--serif);font-size:21px;color:var(--primary);line-height:1.4}
.nsec p{margin:0;font-size:15.5px;line-height:2.0;color:var(--ink2);letter-spacing:.2px}
.nsec .br{margin-top:13px;font-family:var(--serif);font-size:15px;color:var(--accent);line-height:1.8;
  padding-left:12px;border-left:2px solid var(--accent)}
.nsec.cur{background:var(--prim-l);margin:0 -22px;padding-left:22px;padding-right:22px}
.tocgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:8px 0 20px}
.tocgrid a{display:block;padding:12px 13px;border:1px solid var(--line);border-radius:5px;
  background:#fff;text-decoration:none;color:var(--ink);cursor:pointer;transition:.2s}
.tocgrid a:hover{border-color:var(--primary);background:var(--prim-l)}
.tocgrid a.cur{border-color:var(--accent);background:var(--acc-l)}
.tocgrid a .gn{font-family:var(--mono);font-size:12px;color:var(--accent)}
.tocgrid a .gt{font-family:var(--serif);font-size:15px;line-height:1.4;display:block;margin-top:5px}
.keygrid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px 24px;font-size:14.5px;
  line-height:1.8;padding:12px 0 6px;color:var(--ink2)}
.keygrid kbd{font-family:var(--mono);background:#fff;border:1px solid var(--line);
  border-bottom-width:2px;border-radius:4px;padding:2px 7px;color:var(--primary);margin-right:8px}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ink);
  color:#fff;font-size:13px;padding:9px 16px;border-radius:5px;opacity:0;transition:.3s;z-index:80;pointer-events:none}
.toast.on{opacity:1}
@media print{
  html,body{overflow:visible;background:#fff;height:auto}
  #viewport{position:static;overflow:visible}
  #stage{position:static;transform:none!important;box-shadow:none;transition:none}
  .slide{display:block!important;position:relative;height:900px;page-break-after:always;animation:none}
  .chrome,#notes,.toast{display:none!important}
}
</style>
</head>
<body>
<svg id="svgdefs" xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true"><defs><marker id="arr-prim" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L6,3 z" fill="#245A6B"/></marker><marker id="arr-acc" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L6,3 z" fill="#BE653B"/></marker><marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L6,3 z" fill="#2F7A66"/></marker><marker id="arr-gold" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L6,3 z" fill="#AE8A3E"/></marker><marker id="arr-ink" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L6,3 z" fill="#1B2B33"/></marker><marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L6,3 z" fill="#89938F"/></marker><marker id="arr-white" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L6,3 z" fill="#FFFFFF"/></marker></defs></svg>
<div id="viewport"><div id="stage"><div id="slides"></div></div></div>
<aside id="notes">
  <div class="nhead"><span class="nt" id="nTitle">讲稿</span><span class="ns" id="nSub"></span>
    <button id="nClose">关闭 ✕</button></div>
  <div class="nbody" id="nBody"></div>
</aside>
<div class="chrome">
  <div class="r1">
    <button id="btnPrev">← 上一页</button><button id="btnNext">下一页 →</button>
    <span class="pg" id="pg">01 / 24</span>
    <input class="jump" id="jump" type="number" min="1" max="24" value="1" title="输入页码后回车跳转">
    <div class="track"><i id="bar"></i></div>
    <button id="btnToc">目录 G</button>
    <button id="btnNotes">本页讲稿 N</button>
    <button id="btnAll">全文讲稿 T</button>
    <button id="btnAuto">自动播放 P</button>
    <button id="btnFs">全屏 F</button>
    <button id="btnHelp">? 帮助</button>
  </div>
  <div class="r2">
    <span>← → 翻页</span><span>空格 下一页</span><span>F 全屏</span><span>G 目录</span>
    <span>N 本页讲稿</span><span>T 全文讲稿</span><span>P 自动播放</span>
    <span>1–9 跳页</span><span>输入页码回车</span><span>Esc 关闭</span><span>? 快捷键</span>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const D = [{"eyebrow": "困境 · 一个进程吃不满 CPU", "title": "一张大表，交给多个人扫，没那么简单", "lede": "当表大到单进程顺序扫吃不满 CPU、或无法在时间窗内完成时，方向从「少读」变成「多人协作读」。但并行不是把表按 worker 数平均切开。", "caption": "图 01　三种分法的时间轴对比；条形长度与速度为示意，非实测。可拖动「慢 worker 速度」观察长尾。", "bridge": "要明白静态切分为什么不够，得先看清楚一笔扫描的成本花在哪。", "notes": "先从一个很具体的场景说起。表足够大，一个进程顺序扫，CPU 没吃满，或者报表根本跑不完时间窗。最自然的想法是：多叫几个人一起扫。可这一叫，马上会踩两个特别低级的坑。第一个坑，每个 worker 都老老实实从头扫一遍——结果重复了，而且因为大家抢同一批 I/O，比一个人扫还慢。第二个坑稍微聪明一点，把表按 worker 数平均切成几段，一人一段，听起来很公平。但真实系统里，worker 启动有先后，页面在缓存里还是在磁盘上速度差很多，不同页面的可见 tuple 数、死 tuple 数、过滤成本也完全不一样。于是快的那几个早早收工，慢的那个拖到最后，整体的完成时间被它一个人卡住。你可以拖一下下面这根滑块，把慢 worker 的速度调低，看第二行那根条怎么越拉越长，而第三行几乎不动。这说明并行扫描真正要解决的，不是「怎么把块数除匀」，而是「怎么在运行的时候，让先干完的人继续去拿剩下的活」。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >同一张表，4 个 worker：三种分法，横轴为「各自完成时刻」<\/text><rect x=\"1250\" y=\"8\" width=\"140\" height=\"22\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1320\" y=\"22.91\" font-size=\"11.5\" fill=\"#AE8A3E\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >示意 · 非实测<\/text><rect x=\"20\" y=\"44\" width=\"1360\" height=\"116\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"34\" y=\"72\" font-size=\"15.5\" fill=\"#BE653B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >错误一 · 各扫一遍<\/text><text x=\"34\" y=\"96\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >每个 worker 都从头扫，结果重复<\/text><rect x=\"300\" y=\"60\" width=\"780\" height=\"17\" rx=\"0\" fill=\"#F7F6F2\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"286\" y=\"73\" font-size=\"12\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"end\" letter-spacing=\"0\" opacity=\"1\" >W1<\/text><rect x=\"300\" y=\"60\" width=\"10\" height=\"17\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" id=\"a1-r0-0\"/><rect x=\"300\" y=\"82\" width=\"780\" height=\"17\" rx=\"0\" fill=\"#F7F6F2\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"286\" y=\"95\" font-size=\"12\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"end\" letter-spacing=\"0\" opacity=\"1\" >W2<\/text><rect x=\"300\" y=\"82\" width=\"10\" height=\"17\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" id=\"a1-r0-1\"/><rect x=\"300\" y=\"104\" width=\"780\" height=\"17\" rx=\"0\" fill=\"#F7F6F2\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"286\" y=\"117\" font-size=\"12\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"end\" letter-spacing=\"0\" opacity=\"1\" >W3<\/text><rect x=\"300\" y=\"104\" width=\"10\" height=\"17\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" id=\"a1-r0-2\"/><rect x=\"300\" y=\"126\" width=\"780\" height=\"17\" rx=\"0\" fill=\"#F7F6F2\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"286\" y=\"139\" font-size=\"12\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"end\" letter-spacing=\"0\" opacity=\"1\" >W4<\/text><rect x=\"300\" y=\"126\" width=\"10\" height=\"17\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" id=\"a1-r0-3\"/><rect x=\"1076\" y=\"56\" width=\"2\" height=\"88\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" id=\"a1-e0\"/><text x=\"1100\" y=\"74\" font-size=\"14\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >输出重复<\/text><text x=\"1100\" y=\"96\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >且更慢<\/text><text x=\"1100\" y=\"122\" font-size=\"12\" fill=\"#BE653B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >4 × 全表<\/text><rect x=\"20\" y=\"172\" width=\"1360\" height=\"116\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"34\" y=\"200\" font-size=\"15.5\" fill=\"#AE8A3E\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >错误二 · 静态均分<\/text><text x=\"34\" y=\"224\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >任务量相等，却不会同时结束<\/text><rect x=\"300\" y=\"188\" width=\"780\" height=\"17\" rx=\"0\" fill=\"#F7F6F2\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"286\" y=\"201\" font-size=\"12\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"end\" letter-spacing=\"0\" opacity=\"1\" >W1<\/text><rect x=\"300\" y=\"188\" width=\"10\" height=\"17\" rx=\"0\" fill=\"#AE8A3E\" opacity=\"1\" id=\"a1-r1-0\"/><rect x=\"300\" y=\"210\" width=\"780\" height=\"17\" rx=\"0\" fill=\"#F7F6F2\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"286\" y=\"223\" font-size=\"12\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"end\" letter-spacing=\"0\" opacity=\"1\" >W2<\/text><rect x=\"300\" y=\"210\" width=\"10\" height=\"17\" rx=\"0\" fill=\"#AE8A3E\" opacity=\"1\" id=\"a1-r1-1\"/><rect x=\"300\" y=\"232\" width=\"780\" height=\"17\" rx=\"0\" fill=\"#F7F6F2\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"286\" y=\"245\" font-size=\"12\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"end\" letter-spacing=\"0\" opacity=\"1\" >W3<\/text><rect x=\"300\" y=\"232\" width=\"10\" height=\"17\" rx=\"0\" fill=\"#AE8A3E\" opacity=\"1\" id=\"a1-r1-2\"/><rect x=\"300\" y=\"254\" width=\"780\" height=\"17\" rx=\"0\" fill=\"#F7F6F2\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"286\" y=\"267\" font-size=\"12\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"end\" letter-spacing=\"0\" opacity=\"1\" >W4<\/text><rect x=\"300\" y=\"254\" width=\"10\" height=\"17\" rx=\"0\" fill=\"#AE8A3E\" opacity=\"1\" id=\"a1-r1-3\"/><rect x=\"1076\" y=\"184\" width=\"2\" height=\"88\" rx=\"0\" fill=\"#AE8A3E\" opacity=\"1\" id=\"a1-e1\"/><text x=\"1100\" y=\"202\" font-size=\"14\" fill=\"#AE8A3E\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >整体被<\/text><text x=\"1100\" y=\"224\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >慢者卡住<\/text><text x=\"1100\" y=\"250\" font-size=\"12\" fill=\"#AE8A3E\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >长尾<\/text><rect x=\"20\" y=\"300\" width=\"1360\" height=\"116\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"34\" y=\"328\" font-size=\"15.5\" fill=\"#2F7A66\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >正确 · 动态领取<\/text><text x=\"34\" y=\"352\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >谁先扫完，谁继续领剩余块<\/text><rect x=\"300\" y=\"316\" width=\"780\" height=\"17\" rx=\"0\" fill=\"#F7F6F2\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"286\" y=\"329\" font-size=\"12\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"end\" letter-spacing=\"0\" opacity=\"1\" >W1<\/text><rect x=\"300\" y=\"316\" width=\"10\" height=\"17\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" id=\"a1-r2-0\"/><rect x=\"300\" y=\"338\" width=\"780\" height=\"17\" rx=\"0\" fill=\"#F7F6F2\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"286\" y=\"351\" font-size=\"12\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"end\" letter-spacing=\"0\" opacity=\"1\" >W2<\/text><rect x=\"300\" y=\"338\" width=\"10\" height=\"17\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" id=\"a1-r2-1\"/><rect x=\"300\" y=\"360\" width=\"780\" height=\"17\" rx=\"0\" fill=\"#F7F6F2\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"286\" y=\"373\" font-size=\"12\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"end\" letter-spacing=\"0\" opacity=\"1\" >W3<\/text><rect x=\"300\" y=\"360\" width=\"10\" height=\"17\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" id=\"a1-r2-2\"/><rect x=\"300\" y=\"382\" width=\"780\" height=\"17\" rx=\"0\" fill=\"#F7F6F2\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"286\" y=\"395\" font-size=\"12\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"end\" letter-spacing=\"0\" opacity=\"1\" >W4<\/text><rect x=\"300\" y=\"382\" width=\"10\" height=\"17\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" id=\"a1-r2-3\"/><rect x=\"1076\" y=\"312\" width=\"2\" height=\"88\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" id=\"a1-e2\"/><text x=\"1100\" y=\"330\" font-size=\"14\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >快者多领<\/text><text x=\"1100\" y=\"352\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >慢者不阻塞<\/text><text x=\"1100\" y=\"378\" font-size=\"12\" fill=\"#2F7A66\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >无空等<\/text><text x=\"1076\" y=\"416\" font-size=\"12\" fill=\"#89938F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"end\" letter-spacing=\"0\" opacity=\"1\" >时间 →<\/text><text x=\"24\" y=\"416\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >结论：静态均分只保证「任务量相等」，不保证「同时结束」<\/text><\/svg>", "ctrl": "<label>慢 worker 相对速度<\/label><input type=\"range\" id=\"a1-speed\" min=\"30\" max=\"100\" step=\"10\" value=\"50\"><button class=\"btn play\" id=\"a1-play\">▶ 播放<\/button><button class=\"btn\" id=\"a1-step\">单步 →<\/button><button class=\"btn\" id=\"a1-reset\">重置<\/button><span class=\"out\" id=\"a1-out\"><\/span>"}, {"eyebrow": "定位 · 成本从哪来", "title": "少读做不到的时候，只能分摊「每行处理」", "lede": "普通 Seq Scan 的成本 ≈ 读表块 + 检查 MVCC 可见性 + 执行过滤 / 投影 / 上层聚合。索引若不能缩小访问范围，块数这一项就不会变少。", "caption": "图 02　成本的三段构成，与两条互斥的优化方向；源码依据 costsize.c。", "bridge": "方向定了是「多人协作读」，但一上来就有三个必须同时守住的条件。", "notes": "那我们拆一下成本。一次普通顺序扫描，钱主要花在三个地方：把表块读进来；对每个 tuple 做 MVCC 可见性判断；再往上做过滤、投影、聚合。第一条路是「少读」——用索引、分区裁剪、BRIN、物化汇总，把要访问的块数压下去。这条路最有效，但有个前提：查询得真的能用上。像全表统计、宽范围报表、低选择率过滤，索引帮不上忙，块数摆在那儿，一分不少。那就只剩第二条路：块还是那些块，但每个块里的 tuple 处理工作，能不能让多个进程分着做？注意这个转向很关键——并行的目标从「读得更少」变成了「同样多的块，每行处理得更快」。所以后面看到成本模型不按 worker 数去摊磁盘 I/O，你就不会奇怪了：它本来就不是冲着这一项来的。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >普通 Seq Scan 的成本构成，与两条优化方向<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >src/backend/optimizer/path/costsize.c · cost_seqscan()<\/text><text x=\"24\" y=\"78\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"2\" opacity=\"1\" >单进程 Seq Scan 成本<\/text><rect x=\"24\" y=\"92\" width=\"330\" height=\"86\" rx=\"0\" fill=\"#1E4B5A\" opacity=\"1\" /><text x=\"40\" y=\"126\" font-size=\"17\" fill=\"#FFFFFF\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >读表块<\/text><text x=\"40\" y=\"152\" font-size=\"13\" fill=\"#FFFFFF\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"0.85\" >磁盘顺序读<\/text><rect x=\"354\" y=\"92\" width=\"280\" height=\"86\" rx=\"0\" fill=\"#47808D\" opacity=\"1\" /><text x=\"370\" y=\"126\" font-size=\"17\" fill=\"#FFFFFF\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >检查 MVCC 可见性<\/text><text x=\"370\" y=\"152\" font-size=\"13\" fill=\"#FFFFFF\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"0.85\" >逐 tuple 判断<\/text><rect x=\"634\" y=\"92\" width=\"330\" height=\"86\" rx=\"0\" fill=\"#A4C4C6\" opacity=\"1\" /><text x=\"650\" y=\"126\" font-size=\"17\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >过滤 / 投影 / 上层聚合<\/text><text x=\"650\" y=\"152\" font-size=\"13\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"0.85\" >CPU 可分摊<\/text><text x=\"24\" y=\"204\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >块数由表大小决定；索引若不能缩小访问范围，这一项不会变少<\/text><path d=\"M 482 178 L 482 232 L 700 232\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"2\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-prim)\"/><path d=\"M 700 232 L 700 244\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"2\" stroke-linejoin=\"miter\"/><line x1=\"482\" y1=\"232\" x2=\"482\" y2=\"232\" stroke=\"#245A6B\" stroke-width=\"2\"/><text x=\"506\" y=\"226\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >优化方向分岔<\/text><rect x=\"24\" y=\"248\" width=\"650\" height=\"74\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"42\" y=\"278.44\" font-size=\"16\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >路一 · 少读<\/text><text x=\"42\" y=\"302.44\" font-size=\"16\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >索引 / 分区裁剪 / BRIN / 物化汇总 → 减少要访问的块数<\/text><rect x=\"700\" y=\"248\" width=\"676\" height=\"74\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"718\" y=\"278.44\" font-size=\"16\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >路二 · 多人协作读<\/text><text x=\"718\" y=\"302.44\" font-size=\"16\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >块数不变，多个执行进程分担每块里的 tuple 处理成本<\/text><path d=\"M 349 322 L 349 344\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"2\" stroke-linejoin=\"miter\"/><path d=\"M 1038 322 L 1038 344\" fill=\"none\" stroke=\"#BE653B\" stroke-width=\"2\" stroke-linejoin=\"miter\"/><rect x=\"24\" y=\"344\" width=\"650\" height=\"64\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"42\" y=\"370\" font-size=\"15\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >条件：查询能用索引把访问范围收窄<\/text><text x=\"42\" y=\"392\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >这一篇不展开 —— 见 Seq Scan 与索引相关章节<\/text><rect x=\"700\" y=\"344\" width=\"676\" height=\"64\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" opacity=\"1\" /><text x=\"718\" y=\"370\" font-size=\"15\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >条件：必须读大量块，且 CPU 侧工作可分摊<\/text><text x=\"718\" y=\"392\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >本篇主题：把同一张表交给多个进程共同扫描<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "立论 · 三个同时成立", "title": "正确性、负载均衡、I/O 连续性，缺一不可", "lede": "并行计划要求每个参与进程只产出输出子集、每行只产生一次；同时要避免长尾，又要保住每个 backend 的连续访问模式。「自适应」有严格边界。", "caption": "图 03　三个必须同时成立的目标，以及「自适应」一词的准确边界。", "bridge": "这三个条件分别落在 PostgreSQL 的哪一层？先把结构摆开。", "notes": "多人协作读，得同时守住三件事。第一，正确性：这是官方文档反复强调的并行计划核心要求——每个参与进程只产生输出的一个子集，每一行只产生一次。重复或者漏掉，都比慢更糟。第二，负载均衡：谁先干完谁继续拿活，别让整体等一个人。第三，I/O 连续性：每个人拿到的是一段连续的块范围，不能东一块西一块，否则操作系统的预读识别不出来，顺序读退化成随机读。这三个条件是互相拉扯的：想均衡就想切得细，想连续就想切得整块。PostgreSQL 的实现，本质就是在这两者之间找一个工程上够用的折中。还有一句话必须现在就说死：这里的「自适应」，指的是执行时根据谁先完成当前 chunk 来继续分配剩余块，不是根据观察到的选择率重新生成计划。后面我们会看到，这一字之差能引出多大的误会。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >并行扫描要同时满足三个条件，缺一个都不算做对<\/text><rect x=\"24\" y=\"54\" width=\"442\" height=\"286\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"54\" width=\"442\" height=\"6\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"48\" y=\"96\" font-size=\"23\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >正确性<\/text><text x=\"48\" y=\"128\" font-size=\"16\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >每行只产生一次<\/text><line x1=\"48\" y1=\"148\" x2=\"442\" y2=\"148\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"48\" y=\"176\" font-size=\"12\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"2\" opacity=\"1\" >机制<\/text><text x=\"48\" y=\"202\" font-size=\"15\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >partial plan：每个参与进程只产出输出子集<\/text><line x1=\"48\" y1=\"262\" x2=\"442\" y2=\"262\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"48\" y=\"288\" font-size=\"12\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"2\" opacity=\"1\" >违反后果<\/text><text x=\"164\" y=\"290\" font-size=\"15\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >重复行或漏行<\/text><rect x=\"482\" y=\"54\" width=\"442\" height=\"286\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"482\" y=\"54\" width=\"442\" height=\"6\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"506\" y=\"96\" font-size=\"23\" fill=\"#2F7A66\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >负载均衡<\/text><text x=\"506\" y=\"128\" font-size=\"16\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >别让整体等慢者<\/text><line x1=\"506\" y1=\"148\" x2=\"900\" y2=\"148\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"506\" y=\"176\" font-size=\"12\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"2\" opacity=\"1\" >机制<\/text><text x=\"506\" y=\"202\" font-size=\"15\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >谁先扫完当前 chunk，谁继续领取剩余块<\/text><line x1=\"506\" y1=\"262\" x2=\"900\" y2=\"262\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"506\" y=\"288\" font-size=\"12\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"2\" opacity=\"1\" >违反后果<\/text><text x=\"622\" y=\"290\" font-size=\"15\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >静态切段的长尾<\/text><rect x=\"940\" y=\"54\" width=\"442\" height=\"286\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"940\" y=\"54\" width=\"442\" height=\"6\" rx=\"0\" fill=\"#AE8A3E\" opacity=\"1\" /><text x=\"964\" y=\"96\" font-size=\"23\" fill=\"#AE8A3E\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >I/O 连续性<\/text><text x=\"964\" y=\"128\" font-size=\"16\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >保住顺序读<\/text><line x1=\"964\" y1=\"148\" x2=\"1358\" y2=\"148\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"964\" y=\"176\" font-size=\"12\" fill=\"#AE8A3E\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"2\" opacity=\"1\" >机制<\/text><text x=\"964\" y=\"202\" font-size=\"15\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >每次领取一段连续 block 范围，而非零散单块<\/text><line x1=\"964\" y1=\"262\" x2=\"1358\" y2=\"262\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"964\" y=\"288\" font-size=\"12\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"2\" opacity=\"1\" >违反后果<\/text><text x=\"1080\" y=\"290\" font-size=\"15\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >OS readahead 失效<\/text><rect x=\"24\" y=\"352\" width=\"1352\" height=\"64\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"44\" y=\"378\" font-size=\"18\" fill=\"#BE653B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >「自适应」的准确边界<\/text><text x=\"300\" y=\"378\" font-size=\"16\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >执行时按谁先完成继续分配剩余块；不是按观察到的选择率重新生成计划<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "结构 · 三层机制", "title": "自适应点在最底层的块分配", "lede": "计划层（partial path + Gather）、执行层（共享扫描描述符放入 DSM）、存储访问层（nextpage 动态领取 chunk）。三层的「自适应」含义完全不同。", "caption": "图 04　三层地层剖面：越深的靛青越底层；只有最下面一层是运行时动态分配。", "bridge": "结构清楚了，我们顺着执行顺序，从优化器一路走到共享内存。", "notes": "把 PostgreSQL 的机制摆成三层，就很清楚了。最上面是计划层：优化器决定要不要考虑一条 partial path，外面套一个 Gather，顺便估一下大概要几个 worker。中间是执行层：把 ParallelTableScanDesc 放进动态共享内存，leader 和所有 worker 连到同一个扫描状态上——注意，不是每个 worker 各自扫全表。最底下是存储访问层，table_block_parallelscan_nextpage() 这一层才做动态领取：一次拿一段连续 chunk，快到末尾再把 chunk 缩小。你会发现，前两层其实都是「搭台子」，只有最底下这层在真正做运行时的自适应。越深的靛青越底层，这个母题我们到最后一页还会再用一次。既然结构是这样，我们就顺着执行的顺序，从优化器开始走一遍。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >自适应点在三层里的最底层：扫描块分配<\/text><text x=\"24\" y=\"52\" font-size=\"12\" fill=\"#89938F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"1.4\" opacity=\"1\" >层次 / PG 对应机制 / 自适应在哪里 / 不是什么<\/text><rect x=\"24\" y=\"66\" width=\"1352\" height=\"94\" rx=\"0\" fill=\"#EBF1EE\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"44\" y=\"100\" font-size=\"20\" fill=\"#1B2B33\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >计划层<\/text><text x=\"44\" y=\"128\" font-size=\"12\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >第 3 层<\/text><text x=\"250\" y=\"98\" font-size=\"17\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >partial path + Gather<\/text><text x=\"250\" y=\"128\" font-size=\"12\" fill=\"#89938F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >PG 对应机制<\/text><line x1=\"690\" y1=\"82\" x2=\"690\" y2=\"144\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"712\" y=\"100\" font-size=\"15\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >优化器决定是否考虑并行路径、估算 worker 数<\/text><text x=\"712\" y=\"128\" font-size=\"12\" fill=\"#89938F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >自适应在哪里<\/text><line x1=\"1080\" y1=\"82\" x2=\"1080\" y2=\"144\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1102\" y=\"100\" font-size=\"14\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >不保证实际能启动足够 worker<\/text><text x=\"1102\" y=\"128\" font-size=\"12\" fill=\"#89938F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >边界<\/text><rect x=\"24\" y=\"170\" width=\"1352\" height=\"94\" rx=\"0\" fill=\"#A4C4C6\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"44\" y=\"204\" font-size=\"20\" fill=\"#1B2B33\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >执行层<\/text><text x=\"44\" y=\"232\" font-size=\"12\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >第 2 层<\/text><text x=\"250\" y=\"202\" font-size=\"17\  Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >越深的靛青＝越底层；只有最下面一层的「动态领取」才叫自适应<\/text><text x=\"1000\" y=\"392\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >src/include/access/relscan.h · tableam.c<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "主路径 · 从计划到执行", "title": "不会把普通计划交给多个人重复跑", "lede": "优化器先生成 parallel-aware 的 partial path，再由 Gather 启动 worker 并汇聚结果；执行器把共享描述符放进 DSM，参与者通过同一描述符领取互斥块范围。", "caption": "图 05　从 Planner 到 DSM 的主路径；连线全部为水平 / 竖直直角，不穿过文字。", "bridge": "这条主路径上，每一步都对应着源码里一个具体的函数。", "notes": "PostgreSQL 不会偷懒把一条普通 Seq Scan 计划复制几份丢给 worker——那样就是刚才第一个坑。它的走法是这样的：Planner 先有一条普通 SeqScan path；如果这张表可以考虑并行，再额外添加一条 parallel-aware 的 partial path；优化器选中它之后，上面套一个 Gather 节点，负责启动 worker 并把结果汇起来；到了执行期，ExecSeqScan 把共享的 ParallelTableScanDesc 初始化进 DSM，leader 和 worker 全都连到这一份状态上领活。所以图上那四个下排框，看起来是四个进程在扫，其实是四个人从同一个进度计数器上取号。这也是为什么底部那句话值得记：同一个扫描任务被拆成互斥的块范围，每个输出行只由一个参与进程产生。那这些步骤在源码里具体长什么样？", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >PostgreSQL 不会把普通计划交给多个 worker 重复执行<\/text><rect x=\"24\" y=\"52\" width=\"314\" height=\"76\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"40\" y=\"83.07\" font-size=\"18\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >Planner<\/text><text x=\"40\" y=\"109.17\" font-size=\"18\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >普通 Seq Scan path<\/text><path d=\"M 338 90 L 370 90\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"2\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-prim)\"/><rect x=\"370\" y=\"52\" width=\"314\" height=\"76\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"386\" y=\"83.07\" font-size=\"18\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >Partial Path<\/text><text x=\"386\" y=\"109.17\" font-size=\"18\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >parallel_aware = true<\/text><path d=\"M 684 90 L 716 90\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"2\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-prim)\"/><rect x=\"716\" y=\"52\" width=\"314\" height=\"76\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"732\" y=\"83.07\" font-size=\"18\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >Gather<\/text><text x=\"732\" y=\"109.17\" font-size=\"18\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >启动 worker 并汇聚结果<\/text><path d=\"M 1030 90 L 1062 90\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"2\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-prim)\"/><rect x=\"1062\" y=\"52\" width=\"314\" height=\"76\" rx=\"0\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1078\" y=\"83.07\" font-size=\"18\" fill=\"#FFFFFF\" amily=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >worker 1<\/text><text x=\"386\" y=\"256.105\" font-size=\"17\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >领取连续 block chunk<\/text><rect x=\"716\" y=\"200\" width=\"314\" height=\"76\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"732\" y=\"231.455\" font-size=\"17\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >worker 2<\/text><text x=\"732\" y=\"256.105\" font-size=\"17\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >领取连续 block chunk<\/text><rect x=\"1062\" y=\"200\" width=\"314\" height=\"76\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1078\" y=\"231.455\" font-size=\"17\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >worker N<\/text><text x=\"1078\" y=\"256.105\" font-size=\"17\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >慢者少拿，快者多拿<\/text><text x=\"24\" y=\"182\" font-size=\"12.5\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >同一份共享扫描状态<\/text><rect x=\"24\" y=\"308\" width=\"1352\" height=\"76\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"44\" y=\"338\" font-size=\"19\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >同一个扫描任务被拆成互斥的块范围<\/text><text x=\"44\" y=\"366\" font-size=\"15\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >每个输出行只由一个参与进程产生 —— 这是并行计划的核心要求<\/text><text x=\"24\" y=\"412\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >src/backend/optimizer/path/allpaths.c · executor/nodeSeqscan.c · doc/src/sgml/parallel.sgml<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "源码链 · 优化器只负责「考虑」", "title": "partial path 是候选，worker 数是估算", "lede": "set_plain_rel_pathlist() 总会添加普通路径；consider_parallel 成立时才添加 partial path；compute_parallel_worker() 估算 worker 数；最后受全局上限约束。", "caption": "图 06　五个源码节点与 worker 数估算规则（已对 master 源码复核）。", "bridge": "优化器算的是成本；那它到底认为并行能省下哪一部分成本？", "notes": "顺着源码走一遍，误会能少一大半。allpaths.c 里的 set_plain_rel_pathlist()，不管怎样都会先加一条普通 SeqScan path；只有 rel->consider_parallel 为真、又没有 required outer relation 的时候，才额外调用 create_plain_partial_paths() 加一条并行的 partial path。注意是「额外加一条候选」，不是替换。worker 数由 compute_parallel_worker() 估：表级 parallel_workers 这个 reloption 优先；否则表页数小于 min_parallel_table_scan_size 就直接返回 0；再否则从 1 个 worker 起，表每大三倍加一个，最后跟 max_parallel_workers_per_gather 取个最小值。这个函数我核对过当前 master 源码，规则就是这样。然后 create_seqscan_path() 在 worker 数大于 0 时把 parallel_aware 置为 true，nodeSeqscan.c 负责 DSM 的估算、初始化和 worker 挂载。所以「计划里写了 4 个 worker」从来不是承诺——它只是优化器的一次估算，实际能启动几个，要看全局 worker 池和当时的系统资源。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" ity=\"1\" >consider_parallel 且无 required outer 时，添加并行 partial path<\/text><rect x=\"24\" y=\"192\" width=\"790\" height=\"62\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"192\" width=\"34\" height=\"62\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"41\" y=\"230\" font-size=\"17\" fill=\"#FFFFFF\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >3<\/text><text x=\"70\" y=\"218\" font-size=\"15\" fill=\"#245A6B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >compute_parallel_worker()<\/text><text x=\"70\" y=\"240\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >表级 reloption 优先，否则按扫描页数估算 worker 数<\/text><rect x=\"24\" y=\"262\" width=\"790\" height=\"62\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"262\" width=\"34\" height=\"62\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"41\" y=\"300\" font-size=\"17\" fill=\"#FFFFFF\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >4<\/text><text x=\"70\" y=\"288\" font-size=\"15\" fill=\"#245A6B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >create_seqscan_path()<\/text><text x=\"70\" y=\"310\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >parallel_workers &gt; 0 时设 parallel_aware = true<\/text><rect x=\"24\" y=\"332\" width=\"790\" height=\"62\" rx=\"0\" fill=\"#F1 y=\"1\" >否则 heap_pages &lt; min_parallel_table_scan_size 直接返回 0；<\/text><rect x=\"856\" y=\"166.76\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"873\" y=\"174.04\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >起始 1 个 worker，表每大 3 倍再加 1 个；<\/text><rect x=\"856\" y=\"193.76\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"873\" y=\"201.04\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >最后取 min(估算值, max_parallel_workers_per_gather)。<\/text><rect x=\"838\" y=\"246\" width=\"538\" height=\"160\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"838\" y=\"246\" width=\"538\" height=\"42\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"856\" y=\"274.2\" font-size=\"20\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >边界：计划 ≠ 执行<\/text><rect x=\"856\" y=\"311.26\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"873\" y=\"318.54\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >优化器只是「考虑」并行路径，不保证能启动足够 worker；<\/text><rect x=\"856\" y=\"338.26\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"873\" y=\"345.54\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >Workers Planned 与 Workers Launched 可能不一致；<\/text><rect x=\"856\" y=\"365.26\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"873\" y=\"372.54\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >并行计划也可能在运行时退化成串行执行。<\/text><rect x=\"24\" y=\"406\" width=\"790\" height=\"20\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"34\" y=\"420\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >allpaths.c · pathnode.c · nodeSeqscan.c　｜　数值与规则以本地源码为准<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "成本模型 · 一个常见误解", "title": "Parallel Seq Scan ≠ I/O 成本线性下降", "lede": "cost_seqscan() 对并行路径分摊 CPU 成本，但源码注释明确说暂不分摊磁盘 run cost，因为操作系统已经会做 aggressive prefetching。", "caption": "图 07　成本分段对比；长度为示意比例，非实测。", "bridge": "既然成本模型不指望磁盘变便宜，执行器就必须把块分得又快又稳——先看共享状态里放了什么。", "notes": "这里有个特别常见的误解：开了四个 worker，扫描时间是不是就变成四分之一？不是。cost_seqscan() 对并行路径确实会把 CPU 那部分成本摊掉——MVCC 判断、表达式过滤、tuple 处理、投影，这些活分给四个人干，墙钟时间大约按 worker 数缩短。但磁盘的 run cost，源码注释写得很直白：暂不分摊，因为操作系统已经会做 aggressive prefetching。也就是说，顺序读本身大家共享同一条 I/O 通道，多几个进程不会让盘变快。而且并行还多出 Gather 的启动和 tuple 传输成本。所以图上那根磁盘段，串行和并行一样长；短下去的是 CPU 段。这也解释了一个现象：如果一条查询的瓶颈纯粹在 I/O，加 worker 基本没用，甚至因为抢带宽更慢。理解了这一点，就明白执行器的任务不是「把 I/O 变快」，而是把块分得互斥、分得均衡、还不破坏顺序读。那它靠什么分？", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >Parallel Seq Scan ≠ I/O 成本线性下降<\/text><rect x=\"1250\" y=\"8\" width=\"140\" height=\"22\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1320\" y=\"22.91\" font-size=\"11.5\" fill=\"#AE8A3E\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >示意比例 · 非实测<\/text><text x=\"24\" y=\"58\" font-size=\"12\" fill=\"#89938F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"2\" opacity=\"1\" >成本分段<\/text><text x=\"24\" y=\"96\" font-size=\"17\" fill=\"#1B2B33\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >单进程<\/text><text x=\"24\" y=\"116\" font-size=\"12\" fill=\"#89938F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"1\" opacity=\"1\" >Seq Scan<\/text><rect x=\"200\" y=\"82\" width=\"430\" height=\"52\" rx=\"0\" fill=\"#1E4B5A\" opacity=\"1\" /><text x=\"216\" y=\"114\" font-size=\"15\" fill=\"#FFFFFF\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >磁盘顺序读 run cost<\/text><rect x=\"630\" y=\"82\" width=\"430\" height=\"52\" rx=\"0\" fill=\"#74A5AD\" opacity=\"1\" /><text x=\"646\" y=\"114\" font-size=\"15\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >CPU：MVCC / 过滤 / 投影<\/text><text x=\"1080\" y=\"114\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >= 总成本<\/text><text x=\"24\" y=\"206\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >并行（W 个 worker）<\/text><text x=\"24\" y=\"226\" font-size=\"12\" fill=\"#89938F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"1\" opacity=\"1\" >Parallel Seq Scan<\/text><rect x=\"200\" y=\"192\" width=\"430\" height=\"52\" rx=\"0\" fill=\"#1E4B5A\" opacity=\"1\" /><text x=\"216\" y=\"224\" font-size=\"15\" fill=\"#FFFFFF\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >磁盘 run cost：不按 W 分摊<\/text><rect x=\"630\" y=\"192\" width=\"270\" height=\"52\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" opacity=\"1\" /><text x=\"646\" y=\"224\" font-size=\"14\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >CPU 部分：约 1 / W<\/text><rect x=\"900\" y=\"192\" width=\"160\" height=\"52\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"916\" y=\"224\" font-size=\"13\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >Gather / 传输<\/text><text x=\"1080\" y=\"224\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >还有新增项<\/text><line x1=\"415\" y1=\"150\" x2=\"415\" y2=\"270\" stroke=\"#D9D5CB\" stroke-width=\"1\" stroke-dasharray=\"3 4\"/><text x=\"425\" y=\"286\" font-size=\"12.5\" fill=\"#89938F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >长度不变<\/text><line x1=\"765\" y1=\"150\" x2=\"765\" y2=\"270\" stroke=\"#D9D5CB\" stroke-width=\"1\" stroke-dasharray=\"3 4\"/><text x=\"775\" y=\"286\" font-size=\"12.5\" fill=\"#89938F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >随 W 缩短（墙钟时间）<\/text><rect x=\"24\" y=\"306\" width=\"1352\" height=\"104\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1\" opacity=\"1\" /><text x=\"44\" y=\"336\" font-size=\"18\" fill=\"#AE8A3E\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >源码注释的理由<\/text><text x=\"44\" y=\"364\" font-size=\"15\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >cost_seqscan() 对并行路径分摊 CPU 成本，但暂不分摊磁盘 run cost ——<\/text><text x=\"44\" y=\"388\" font-size=\"15\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >「因为操作系统已经会做 aggressive prefetching」；能分摊的是 tuple 处理与过滤。<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "共享状态 · 只扫一次", "title": "DSM 里共享的是「分配进度」", "lede": "ParallelTableScanDescData 记录关系标识与快照信息；ParallelBlockTableScanDescData 加入块数与 phs_nallocated；每个 backend 另有私有 chunk 状态。", "caption": "图 08　共享描述符与每 backend 私有状态的字段；来自 src/include/access/relscan.h。", "bridge": "字段都摆出来了，最关键的是那个 64 位计数器：它怎么让多个进程互不抢活？", "notes": "答案在 relscan.h 的这几个结构体里。共享给所有人的 ParallelTableScanDescData，记着物理关系是谁、要不要参与同步扫描、快照放在 DSM 的哪个偏移。往下派生的 ParallelBlockTableScanDescData，多了 phs_nblocks、phs_startblock、phs_numblock，以及最关键的 phs_nallocated——一个 64 位原子计数器，意思是「已经分配给 worker 的 block 数量」。为什么要 64 位？源码注释说得很实在：所有块都发完了， Worker 还会继续尝试领取并让计数器往上加，用 32 位在接近 2 的 32 次方块时会绕回。另外每个 backend 还有一份完全私有的 ParallelBlockTableScanWorkerData，只记自己当前 chunk 还剩几块、chunk 多大。所以共享的不是一张任务队列表，而仅仅是一个「已经发到哪了」的进度值。这个设计很轻：没有锁、没有队列遍历，只有一次原子加法。那这次加法具体是怎么做到互斥的？", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >共享的是「分配进度」，不是任务队列<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >src/include/access/relscan.h　｜　DSM = dynamic shared memory<\/text><rect x=\"24\" y=\"58\" width=\"790\" height=\"340\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#245A6B\" stroke-width=\"1.5\" opacity=\"1\" /><rect x=\"24\" y=\"58\" width=\"790\" height=\"38\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"42\" y=\"83\" font-size=\"17\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >DSM · 所有参与进程共享<\/text><rect x=\"44\" y=\"108\" width=\"750\" height=\"86\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"60\" y=\"132\" font-size=\"15\" fill=\"#245A6B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >ParallelTableScanDescData<\/text><text x=\"60\" y=\"158\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >phs_locator · phs_syncscan · phs_snapshot_any · phs_snapshot_off<\/text><text x=\"60\" y=\"180\" font-size=\"12.5\" fill=\"#89938F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >物理关系标识 / 是否同步扫描 / 快照信息<\/text><rect x=\"44\" y=\"204\" width=\"750\" height=\"116\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"60\" y=\"228\" font-size=\"15\" fill=\"#245A6B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >ParallelBlockTableScanDescData<\/text><text x=\"60\" y=\"254\" font-size=\"13.5\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >phs_nblocks　phs_startblock　phs_numblock<\/text><rect x=\"60\" y=\"266\" width=\"714\" height=\"42\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"74\" y=\"292\" font-size=\"14.5\" fill=\"#FFFFFF\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >phs_nallocated　64 位原子计数器：已分配给 worker 的 block 数<\/text><rect x=\"44\" y=\"330\" width=\"750\" height=\"54\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"60\" y=\"354\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >SerializeSnapshot() → 写入 DSM　/　RestoreSnapshot() → worker 恢复<\/text><text x=\"60\" y=\"374\" font-size=\"12.5\" fill=\"#89938F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >table_parallelscan_estimate() 把快照序列化空间也算进 DSM<\/text><path d=\"M 814 228 L 858 228\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"2\" stroke-linejoin=\"miter\"/><line x1=\"858\" y1=\"116\" x2=\"858\" y2=\"340\" stroke=\"#245A6B\" stroke-width=\"1.5\"/><path d=\"M 858 118 L 884 118\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.4\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-prim)\"/><rect x=\"884\" y=\"76\" width=\"492\" height=\"96\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"884\" y=\"76\" width=\"492\" height=\"32\" rx=\"0\" fill=\"#CFE0DC\" opacity=\"1\" /><text x=\"898\" y=\"98\" font-size=\"13\" fill=\"#1B2B33\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >backend 1 私有 · ParallelBlockTableScanWorkerData<\/text><text x=\"898\" y=\"132\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >phsw_nallocated　phsw_chunk_remaining<\/text><text x=\"898\" y=\"156\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >phsw_chunk_size　本地还剩多少 block 未扫<\/text><path d=\"M 858 230 L 884 230\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.4\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-prim)\"/><rect x=\"884\" y=\"188\" width=\"492\" height=\"96\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"884\" y=\"188\" width=\"492\" height=\"32\" rx=\"0\" fill=\"#CFE0DC\" opacity=\"1\" /><text x=\"898\" y=\"210\" font-size=\"13\" fill=\"#1B2B33\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >backend 2 私有 · ParallelBlockTableScanWorkerData<\/text><text x=\"898\" y=\"244\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >phsw_nallocated　phsw_chunk_remaining<\/text><text x=\"898\" y=\"268\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >phsw_chunk_size　本地还剩多少 block 未扫<\/text><path d=\"M 858 342 L 884 342\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.4\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-prim)\"/><rect x=\"884\" y=\"300\" width=\"492\" height=\"96\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"884\" y=\"300\" width=\"492\" height=\"32\" rx=\"0\" fill=\"#CFE0DC\" opacity=\"1\" /><text x=\"898\" y=\"322\" font-size=\"13\" fill=\"#1B2B33\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >backend 3 私有 · ParallelBlockTableScanWorkerData<\/text><text x=\"898\" y=\"356\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >phsw_nallocated　phsw_chunk_remaining<\/text><text x=\"898\" y=\"380\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >phsw_chunk_size　本地还剩多少 block 未扫<\/text><text x=\"884\" y=\"414\" font-size=\"12.5\" fill=\"#89938F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >每 backend 一份，互不共享<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "原子领取 · 快者多领", "title": "一次 fetch-and-add，就是一次互斥领取", "lede": "worker 不是拿锁遍历任务队列，而是通过 atomic fetch-and-add 领取一段连续 block 范围；本地范围逐块扫完，再回来领下一段。", "caption": "图 09　可交互演示：调整 worker 数与慢者速度，播放 / 单步观察领取序列（示意，非实测）。", "bridge": "任务能互斥领了，可还有个更基本的问题：大家看到的必须是同一份数据。", "notes": "这一步值得停下来看清楚。当某个 worker 把自己 chunk 里的块扫完，它调用 table_block_parallelscan_nextpage()，做一次 pg_atomic_fetch_add_u64，把共享计数器加上 chunk_size。这个原子操作返回的是加之前的旧值，那个旧值就是它这次领到的范围起点；再按 (nallocated + startblock) % nblocks 取模，得到真实块号。因为 fetch-and-add 是原子的，两个进程不可能拿到同一个起点——互斥性白送，还不用抢锁。你可以点播放，或者一格格单步，看十二个 chunk 是怎么被分掉的：把 W3 速度调低，它领到的段数明显变少，而快的 W1 会一次次回来再拿。这就是「快者多领、慢者不阻塞」的全部实现——没有调度器，没有中心节点，只有「谁先回来谁再取」。注意本地 chunk 里逐块推进的时候，根本不碰原子计数器，只有领新 chunk 才加一次，共享竞争被压得非常低。不过在往下讲之前，得先补一个语义上的前提。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >一次 atomic fetch-and-add：既互斥，又几乎不抢锁<\/text><rect x=\"1250\" y=\"8\" width=\"140\" height=\"22\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1320\" y=\"22.91\" font-size=\"11.5\" fill=\"#AE8A3E\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >示意 · 非实测<\/text><text x=\"24\" y=\"48\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >关系文件被切成 12 个 chunk；谁先扫完本地范围，谁领下一段<\/text><rect x=\"40\" y=\"60\" width=\"104\" height=\"44\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" id=\"k-c0\"/><text x=\"92\" y=\"88\" font-size=\"14\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anch
