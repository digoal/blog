\"v-out\"><\/span>"}, {"eyebrow": "ANALYZE · 折中的理由", "title": "要的是无偏块集合", "lede": "源码诚实写明：每行进入最终样本的机会相等，但并非每一种可能的行样本都等概率被选中；大表上不同块数量可能偏少。", "caption": "图 18　「放弃了什么 / 换到了什么」对照，以及优化器为什么能接受这种近似。", "bridge": "既然统计本来就是近似的，样本量该怎么定，就成了一道权衡题。", "notes": "源码里有一段很坦诚的话：这种两阶段方法让每行进入最终样本的机会相等，但不是每一种可能的行样本都等概率被选中；对大表来说，样本代表的不同块数量可能偏少。听起来像个缺陷，PostgreSQL 为什么接受？因为 ANALYZE 要的首先是一个统计上无偏的块集合。有了无偏的块集合，才能更可靠地估计每块平均的 live 和 dead 行数，避免老方法过度相信表开头附近的行密度——那种偏差对优化器更致命。换句话说，它放弃的是「行样本空间的均匀」，换到的是「块层面的无偏」和可控的采样成本。而且官方文档也直说：即使表内容不变，大表统计基于随机样本，估计每次也会略有变化，极少数情况下计划选择都可能变。所以「统计抖动」不是故障信号，先检查采样和统计目标，再决定要不要干预。那这个目标该定多高？", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >源码诚实的限制：每行入样机会相等，但并非每种行样本等概率<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >analyze.c 注释 · 统计采样能接受这个折中，是因为它要的是「无偏块集合」<\/text><text x=\"24\" y=\"80\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"2\" opacity=\"1\" >放弃了什么<\/text><rect x=\"24\" y=\"94\" width=\"650\" height=\"122\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"44\" y=\"134.6\" font-size=\"15\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >朴素期望：所有可能的「行样本」等概率<\/text><text x=\"44\" y=\"160.1\" font-size=\"15\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >现实：块级筛选先框定了候选范围<\/text><text x=\"44\" y=\"185.6\" font-size=\"15\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >大表上，样本代表的不同块数量可能偏少<\/text><text x=\"700\" y=\"80\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"2\" opacity=\"1\" >换到了什么<\/text><rect x=\"700\" y=\"94\" width=\"676\" height=\"122\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" opacity=\"1\" /><text x=\"720\" y=\"134.6\" font-size=\"15\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >统计上无偏的「块集合」<\/text><text x=\"720\" y=\"160.1\" font-size=\"15\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >更可靠地估计每块平均 live / dead 行数<\/text><text x=\"720\" y=\"185.6\" font-size=\"15\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >避免老方法过度相信表开头附近的行密度<\/text><path d=\"M 674 155 L 700 155\" fill=\"none\" stroke=\"#AE8A3E\" stroke-width=\"2\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-gold)\"/><line x1=\"24\" y1=\"236\" x2=\"1376\" y2=\"236\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"24\" y=\"268\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"2\" opacity=\"1\" >为什么优化器能接受<\/text><rect x=\"24\" y=\"282\" width=\"442\" height=\"94\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"282\" width=\"442\" height=\"5\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"44\" y=\"314\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >样本用途<\/text><text x=\"44\" y=\"344\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >估计分布与选择率，不是返回明细<\/text><rect x=\"482\" y=\"282\" width=\"442\" height=\"94\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"482\" y=\"282\" width=\"442\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"502\" y=\"314\" font-size=\"17\" fill=\"#BE653B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >误差性质<\/text><text x=\"502\" y=\"344\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >轻微抖动可被提高统计目标缓解<\/text><rect x=\"940\" y=\"282\" width=\"442\" height=\"94\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"940\" y=\"282\" width=\"442\" height=\"5\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"960\" y=\"314\" font-size=\"17\" fill=\"#2F7A66\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >替代方案<\/text><text x=\"960\" y=\"344\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >分层 / 扩展统计 / n_distinct override<\/text><text x=\"24\" y=\"402\" font-size=\"13.5\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >文档也直说：即使表内容不变，每次 ANALYZE 的估计也可能略有变化，极少数情况下计划选择也会变。<\/text><text x=\"24\" y=\"422\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >所以「统计抖动」不是故障信号，先检查采样与统计目标，再决定是否干预。<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "样本量 · 统计目标", "title": "太低估错，太高处处付钱", "lede": "提高 default_statistics_target 或列级目标，会增大 MCV 与直方图容量，也会增加采样行数、时间和 pg_statistic 空间。", "caption": "图 19　统计目标偏低 / 适中 / 偏高的三段权衡，以及单列统计不够时的三条补充路径。", "bridge": "目标定高了也治不好所有误差 —— 得把误差分两类来看。", "notes": "目标太低，ANALYZE 快、目录占得小，但 MCV 和直方图桶数少，选择率更容易估错；目标太高，统计更细，采样行数按比例上来，排序、MCV 计算、pg_statistic 存储都要多付成本。文档说得很直白：目标值决定 MCV 列表和直方图桶数的上限，被分析列里最大的那个目标决定采样行数，提高目标会让 ANALYZE 的时间和空间按比例增加。默认是一百，通常是个平衡点。但有三件事光调目标解决不了：列与列相关，要靠 extended statistics 里的依赖、MCV 组合、ndistinct 组合；distinct 估计持续不准，可以按文档手工设置 n_distinct；还有倾斜列，只给 WHERE、GROUP BY 里真正用到的列加细度就够了，别全局乱加。这也正好对上那些直方图采样的论文——直方图不是排序后随便切几段，样本不足时尾部、倾斜分布、稀有值、相关列都会被低估。不过要记住，有些误差加样本能治，有些加多少都没用。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >样本量是一道权衡题：目标太低估错，太高处处要付成本<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >ANALYZE 文档 · default_statistics_target / ALTER TABLE ... SET STATISTICS<\/text><rect x=\"24\" y=\"62\" width=\"442\" height=\"146\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"62\" width=\"442\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"44\" y=\"98\" font-size=\"20\" fill=\"#BE653B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >目标偏低<\/text><text x=\"44\" y=\"132\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >ANALYZE 快、pg_statistic 小；MCV 与直方图桶数少，选择率更<\/text><text x=\"44\" y=\"156\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >容易估错<\/text><rect x=\"482\" y=\"62\" width=\"442\" height=\"146\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"482\" y=\"62\" width=\"442\" height=\"5\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"502\" y=\"98\" font-size=\"20\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >目标适中<\/text><text x=\"502\" y=\"132\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >默认目标 100；在估计质量、采样时间、目录空间之间取平衡<\/text><rect x=\"940\" y=\"62\" width=\"442\" height=\"146\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"940\" y=\"62\" width=\"442\" height=\"5\" rx=\"0\" fill=\"#AE8A3E\" opacity=\"1\" /><text x=\"960\" y=\"98\" font-size=\"20\" fill=\"#AE8A3E\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >目标偏高<\/text><text x=\"960\" y=\"132\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >统计更细、采样行更多；排序、MCV 计算、目录存储都有额外成本<\/text><line x1=\"24\" y1=\"224\" x2=\"1376\" y2=\"224\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"24\" y=\"256\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"2\" opacity=\"1\" >单列统计不够时 · 三条补充路径<\/text><rect x=\"24\" y=\"270\" width=\"1352\" height=\"40\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"38\" y=\"277\" width=\"250\" height=\"26\" rx=\"0\" fill=\"#F1EFE9\" opacity=\"1\" /><text x=\"163\" y=\"294.25\" font-size=\"12.5\" fill=\"#245A6B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >extended statistics<\/text><text x=\"306\" y=\"296\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >列间依赖、MCV 组合、ndistinct 组合<\/text><rect x=\"24\" y=\"316\" width=\"1352\" height=\"40\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"38\" y=\"323\" width=\"250\" height=\"26\" rx=\"0\" fill=\"#F1EFE9\" opacity=\"1\" /><text x=\"163\" y=\"340.25\" font-size=\"12.5\" fill=\"#BE653B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >n_distinct override<\/text><text x=\"306\" y=\"342\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >distinct 估计持续不准时，按文档手工设置<\/text><rect x=\"24\" y=\"362\" width=\"1352\" height=\"40\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"38\" y=\"369\" width=\"250\" height=\"26\" rx=\"0\" fill=\"#F1EFE9\" opacity=\"1\" /><text x=\"163\" y=\"386.25\" font-size=\"12.5\" fill=\"#2F7A66\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >统计目标按列设置<\/text><text x=\"306\" y=\"388\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >只给 WHERE / GROUP BY 里真正需要的列加细度<\/text><rect x=\"24\" y=\"404\" width=\"1352\" height=\"22\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"38\" y=\"420\" font-size=\"12.8\" fill=\"#AE8A3E\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >论文视角：直方图不是「排序后随便切几段」；样本不足时，尾部、倾斜分布、稀有值、相关列都会被低估。<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "误差 · 两类分清楚", "title": "一种加样本，一种换方法", "lede": "随机误差可以靠样本量缓解；系统性偏差来自聚簇、稀有异常、WHERE 顺序和抽样单位误解，只能靠更合适的方法处理。", "caption": "图 20　两类误差的示意对照，以及四类系统性偏差与对应处置；依据原文图 5 重绘（条形为示意，非实测）。", "bridge": "误差性质分清了，收益和成本也就可以成对地算了。", "notes": "这一页是图 5 的核心。左边随机误差，样本越小幅度越大，扩大样本、提高统计目标、重复实验都能把它压下去，条形长度只是示意，不是实测。右边系统性偏差，你把样本从小调到大，那根条几乎不动，因为它不是抽样波动，是采样机制本身带来的：物理聚簇让 SYSTEM 样本不代表行级分布，稀有异常在样本里压根没出现，WHERE 在采样之后把稀有条件提前漏掉，还有把块级概率当成行级概率。对应处置也完全不同：聚簇就换 BERNOULLI 或者分层采样；稀有异常先量化漏检概率，必要时老实全量扫；WHERE 顺序问题要改成先明确语义的子查询或物化结果；最后一条，回到抽样单位，重新估一遍误差来源。分层采样、分区统计、业务规则，这些都不是「多抽一点」能替代的。分清这两类，你就能判断一个采样结果到底该不该信。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >随机误差可以靠样本量缓解，系统性偏差只能靠换方法<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >图 5 · 采样误差与适用边界（依据原文重绘）<\/text><text x=\"24\" y=\"80\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"2\" opacity=\"1\" >随机误差 · 样本量 ↑ 则 ↓<\/text><rect x=\"24\" y=\"94\" width=\"650\" height=\"164\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"40\" y=\"130\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >样本小<\/text><rect x=\"120\" y=\"112\" width=\"300\" height=\"22\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"430\" y=\"129\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >误差幅度（示意）<\/text><text x=\"40\" y=\"174\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >样本中<\/text><rect x=\"120\" y=\"156\" width=\"196\" height=\"22\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"326\" y=\"173\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" ><\/text><text x=\"40\" y=\"218\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >样本大<\/text><rect x=\"120\" y=\"200\" width=\"104\" height=\"22\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"234\" y=\"217\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" ><\/text><text x=\"40\" y=\"246\" font-size=\"12.8\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >手段：扩大样本 / 提高统计目标 / 重复实验<\/text><text x=\"700\" y=\"80\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"2\" opacity=\"1\" >系统性偏差 · 加样本也不消失<\/text><rect x=\"700\" y=\"94\" width=\"676\" height=\"164\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"716\" y=\"130\" font-size=\"13\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >样本小<\/text><rect x=\"796\" y=\"112\" width=\"232\" height=\"22\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"716\" y=\"174\" font-size=\"13\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >样本中<\/text><rect x=\"796\" y=\"156\" width=\"232\" height=\"22\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"716\" y=\"218\" font-size=\"13\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >样本大<\/text><rect x=\"796\" y=\"200\" width=\"232\" height=\"22\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"716\" y=\"246\" font-size=\"12.8\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >手段：换采样方法 / 分层 / 分区统计 / 业务规则<\/text><line x1=\"24\" y1=\"270\" x2=\"1376\" y2=\"270\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"24\" y=\"302\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"2\" opacity=\"1\" >四类系统性偏差 → 对应处置<\/text><rect x=\"24\" y=\"316\" width=\"666\" height=\"46\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"38\" y=\"336\" font-size=\"12.8\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >物理聚簇让 SYSTEM 不代表行级分布<\/text><text x=\"38\" y=\"354\" font-size=\"12.5\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >→ 改用 BERNOULLI 或分层采样<\/text><rect x=\"714\" y=\"316\" width=\"666\" height=\"46\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"728\" y=\"336\" font-size=\"12.8\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >稀有异常在样本中根本没出现<\/text><text x=\"728\" y=\"354\" font-size=\"12.5\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >→ 先量化漏检概率，必要时全量扫<\/text><rect x=\"24\" y=\"368\" width=\"666\" height=\"46\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"38\" y=\"388\" font-size=\"12.8\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >WHERE 在采样之后，稀有条件被漏<\/text><text x=\"38\" y=\"406\" font-size=\"12.5\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >→ 改成先明确语义的子查询 / 物化结果<\/text><rect x=\"714\" y=\"368\" width=\"666\" height=\"46\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"728\" y=\"388\" font-size=\"12.8\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >把块级概率当成行级概率<\/text><text x=\"728\" y=\"406\" font-size=\"12.5\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >→ 回到抽样单位，重估误差来源<\/text><rect x=\"1246\" y=\"20\" width=\"140\" height=\"22\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1316\" y=\"34.91\" font-size=\"11.5\" fill=\"#AE8A3E\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >条形长度 · 示意<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "收益与成本 · 成对出现", "title": "每笔收益都挂着一笔账", "lede": "少读页面、行级独立、可复现、有限样本刷新统计、可扩展接口 —— 五项收益，对应五项必须一起算的成本。", "caption": "图 21　五组「收益 → 代价」成对关系；不要把少读页面直接等同于查询变快。", "bridge": "账算完了，怎么在自己的库里验证这些说法？", "notes": "把账算完整，会发现收益和代价是手拉手出现的。SYSTEM 少读页面，代价是抽中页的可见行密度决定返回行数，页面填充、HOT、死元组都会放大波动。BERNOULLI 行级独立，代价是仍要顺序访问全部页面，低比例时 I/O 省得有限。REPEATABLE 让相同表状态、相同参数下能复现实验，代价是表数据一变，即使 seed 相同，样本也可能变，所以还得记录数据版本。ANALYZE 用有限样本让大表统计刷新保持可接受成本，代价是统计近似、目标过低会让选择率估错。TsmRoutine 可扩展，代价是方法语义、可重复性、偏差边界都得自己保证。再补两条容易忘的：count、sum、avg 这类聚合要按采样概率校正才有近似意义；TABLESAMPLE 在 WHERE 之前，稀有条件可能在采样阶段就被漏掉。所以别把采样当开关，它是一种成本结构的替换。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >每一项收益，都紧跟着一项成本<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >采样扫描的收益 / 成本清单 · 不要把「少读页面」直接等同于「查询变快」<\/text><rect x=\"24\" y=\"62\" width=\"1352\" height=\"60\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"62\" width=\"6\" height=\"60\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"40\" y=\"88\" font-size=\"14.5\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >收益 · SYSTEM 少读页面<\/text><path d=\"M 540 92 L 576 92\" fill=\"none\" stroke=\"#AE8A3E\" stroke-width=\"1.6\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-gold)\"/><text x=\"592\" y=\"88\" font-size=\"13.5\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >代价 · 抽中页的行密度决定返回行数；页面填充、HOT、死元组放大波动<\/text><rect x=\"24\" y=\"130\" width=\"1352\" height=\"60\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"130\" width=\"6\" height=\"60\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"40\" y=\"156\" font-size=\"14.5\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >收益 · BERNOULLI 行级独立<\/text><path d=\"M 540 160 L 576 160\" fill=\"none\" stroke=\"#AE8A3E\" stroke-width=\"1.6\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-gold)\"/><text x=\"592\" y=\"156\" font-size=\"13.5\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >代价 · 仍要顺序访问全部页面，低比例时 I/O 节省有限<\/text><rect x=\"24\" y=\"198\" width=\"1352\" height=\"60\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"198\" width=\"6\" height=\"60\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"40\" y=\"224\" font-size=\"14.5\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >收益 · REPEATABLE 可复现实验<\/text><path d=\"M 540 228 L 576 228\" fill=\"none\" stroke=\"#AE8A3E\" stroke-width=\"1.6\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-gold)\"/><text x=\"592\" y=\"224\" font-size=\"13.5\" fill=\"#AE8A3E\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >代价 · 表数据变了，即使 seed 相同，样本也可能变<\/text><rect x=\"24\" y=\"266\" width=\"1352\" height=\"60\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"266\" width=\"6\" height=\"60\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"40\" y=\"292\" font-size=\"14.5\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >收益 · ANALYZE 有限样本刷新统计<\/text><path d=\"M 540 296 L 576 296\" fill=\"none\" stroke=\"#AE8A3E\" stroke-width=\"1.6\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-gold)\"/><text x=\"592\" y=\"292\" font-size=\"13.5\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >代价 · 统计是近似的；目标过低会让选择率估错<\/text><rect x=\"24\" y=\"334\" width=\"1352\" height=\"60\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"334\" width=\"6\" height=\"60\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"40\" y=\"360\" font-size=\"14.5\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >收益 · TsmRoutine 可扩展定制<\/text><path d=\"M 540 364 L 576 364\" fill=\"none\" stroke=\"#AE8A3E\" stroke-width=\"1.6\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-gold)\"/><text x=\"592\" y=\"360\" font-size=\"13.5\" fill=\"#AE8A3E\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >代价 · 方法语义、可重复性、偏差边界要自己保证<\/text><rect x=\"24\" y=\"406\" width=\"1352\" height=\"20\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"38\" y=\"421\" font-size=\"12.8\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >聚合需按采样概率校正才有近似意义；TABLESAMPLE 在 WHERE 之前，稀有条件可能在采样阶段就被漏掉。<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "验证 · 四组 DEMO", "title": "语义比速度更该先看", "lede": "造表对比两种采样、验证 WHERE 顺序、提高统计目标看 ANALYZE、再对照 ORDER BY random()；重点看 EXPLAIN 里的读块数与返回行数。", "caption": "图 22　四组可执行 SQL 骨架与观察点；原文未运行实例，不提供伪造输出。", "bridge": "会验证之后，落到日常，不同角色该做的动作并不一样。", "notes": "原文给了一套能直接跑的 SQL，我按验证顺序拆成四组。第一组造一张二十万行的表，记得 ANALYZE，然后分别用 SYSTEM(1) 和 BERNOULLI(1) 加 REPEATABLE(42) 跑 EXPLAIN (ANALYZE, BUFFERS)，两者都会显示 Sample Scan；SYSTEM 的 buffer 访问通常更少，BERNOULLI 的返回行数更接近行级概率预期。第二组专门验 WHERE 顺序：带 TABLESAMPLE SYSTEM(1) 再过滤 rare 的那条，rare 很稀有时样本里可能一个都没有。第三组把 status 列的 STATISTICS 提到 1000，跑 ANALYZE VERBOSE 再查 pg_stats，看高频值和估计的变化；但别指望所有稀有值都被捕获。第四组对照 ORDER BY random() LIMIT 1000 和 TABLESAMPLE SYSTEM(1) LIMIT 1000，语义完全不同，别只看速度。这里必须说句诚实话：原文作者没有启动实例执行这些 SQL，所以全文没有实测输出，我也不编数字，请你以自己本地的 EXPLAIN 为准。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >四组 SQL 验证：先看语义，再看 EXPLAIN (ANALYZE, BUFFERS)<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >原文未启动数据库实例执行，因此不提供任何伪造输出；请在本地 PostgreSQL 自行核验<\/text><rect x=\"24\" y=\"62\" width=\"318\" height=\"320\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"62\" width=\"318\" height=\"40\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"38\" y=\"88\" font-size=\"13.5\" fill=\"#FFFFFF\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >6.1 SYSTEM vs BERNOULLI<\/text><rect x=\"34\" y=\"110\" width=\"298\" height=\"166\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"42\" y=\"130\" font-size=\"10.4\" fill=\"#1B2B33\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >CREATE TABLE demo_sample_scan ...<\/text><text x=\"42\" y=\"155\" font-size=\"10.4\" fill=\"#1B2B33\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >INSERT ... generate_series(1, 200000)<\/text><text x=\"42\" y=\"180\" font-size=\"10.4\" fill=\"#1B2B33\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >ANALYZE demo_sample_scan;<\/text><text x=\"42\" y=\"205\" font-size=\"10.4\" fill=\"#1B2B33\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >EXPLAIN (ANALYZE, BUFFERS)<\/text><text x=\"42\" y=\"230\" font-size=\"7.7\" fill=\"#1B2B33\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >  SELECT count(*) FROM t TABLESAMPLE SYSTEM (1) REPEATABLE (42);<\/text><text x=\"42\" y=\"255\" font-size=\"10.4\" fill=\"#1B2B33\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >  ... BERNOULLI (1) REPEATABLE (42);<\/text><text x=\"38\" y=\"294\" font-size=\"12\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >观察点<\/text><text x=\"38\" y=\"314\" font-size=\"11.8\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >观察：两者都显示 Sample Scan；SYSTEM 的 buffer<\/text><text x=\"38\" y=\"333\" font-size=\"11.8\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >访问通常更少，BERNOULLI 行数更接近行级概率预期。<\/text><rect x=\"372\" y=\"62\" width=\"318\" height=\"320\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"372\" y=\"62\" width=\"318\" height=\"40\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"386\" y=\"88\" font-size=\"13.5\" fill=\"#FFFFFF\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >6.2 WHERE 在采样之后<\/text><rect x=\"382\" y=\"110\" width=\"298\" height=\"166\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"390\" y=\"130\" font-size=\"10.4\" fill=\"#1B2B33\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >SELECT count(*) FROM t<\/text><text x=\"390\" y=\"155\" font-size=\"10.4\" fill=\"#1B2B33\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >  TABLESAMPLE SYSTEM (1) REPEATABLE (7)<\/text><text x=\"390\" y=\"180\" font-size=\"10.4\" fill=\"#1B2B33\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >  WHERE status = 'rare';<\/text><text x=\"390\" y=\"205\" font-size=\"10.4\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" ><\/text><text x=\"390\" y=\"230\" font-size=\"10.4\" fill=\"#1B2B33\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >对照：SELECT count(*) FROM t<\/text><text x=\"390\" y=\"255\" font-size=\"10.4\" fill=\"#1B2B33\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >  WHERE status = 'rare';<\/text><text x=\"386\" y=\"294\" font-size=\"12\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >观察点<\/text><text x=\"386\" y=\"314\" font-size=\"11.8\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >观察：第一条不是「从 rare 行里抽 1%」，rare 很<\/text><text x=\"386\" y=\"333\" font-size=\"11.8\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >稀有时样本里可能一个都没有。<\/text><rect x=\"720\" y=\"62\" width=\"318\" height=\"320\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"720\" y=\"62\" width=\"318\" height=\"40\" rx=\"0\" fill=\"#AE8A3E\" opacity=\"1\" /><text x=\"734\" y=\"88\" font-size=\"13.5\" fill=\"#FFFFFF\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >6.3 提高统计目标<\/text><rect x=\"730\" y=\"110\" width=\"298\" height=\"166\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"738\" y=\"130\" font-size=\"10.4\" fill=\"#1B2B33\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >ALTER TABLE t ALTER COLUMN status<\/text><text x=\"738\" y=\"155\" font-size=\"10.4\" fill=\"#1B2B33\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >  SET STATISTICS 1000;<\/text><text x=\"738\" y=\"180\" font-size=\"10.4\" fill=\"#1B2B33\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >ANALYZE VERBOSE t;<\/text><text x=\"738\" y=\"205\" font-size=\"10.4\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" ><\/text><text x=\"738\" y=\"230\" font-size=\"10.4\" fill=\"#1B2B33\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >SELECT attname, null_frac, n_distinct,<\/text><text x=\"738\" y=\"255\" font-size=\"10.4\" fill=\"#1B2B33\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >  most_common_vals FROM pg_stats ...;<\/text><text x=\"734\" y=\"294\" font-size=\"12\" fill=\"#AE8A3E\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >观察点<\/text><text x=\"734\" y=\"314\" font-size=\"11.8\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >观察：目标越高通常采样行越多；对极低频值改善捕获<\/text><text x=\"734\" y=\"333\" font-size=\"11.8\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >概率，但不保证全部入样。<\/text><rect x=\"1068\" y=\"62\" width=\"318\" height=\"320\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"1068\" y=\"62\" width=\"318\" height=\"40\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"1082\" y=\"88\" font-size=\"13.5\" fill=\"#FFFFFF\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >6.4 避免 ORDER BY random()<\/text><rect x=\"1078\" y=\"110\" width=\"298\" height=\"166\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1086\" y=\"130\" font-size=\"10.4\" fill=\"#1B2B33\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >-- 大表上通常不推荐<\/text><text x=\"1086\" y=\"155\" font-size=\"10.4\" fill=\"#1B2B33\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >SELECT * FROM t ORDER BY random() LIMIT 1000;<\/text><text x=\"1086\" y=\"180\" font-size=\"10.4\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" ><\/text><text x=\"1086\" y=\"205\" font-size=\"10.4\" fill=\"#1B2B33\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >-- 快速探索可考虑<\/text><text x=\"1086\" y=\"230\" font-size=\"10.4\" fill=\"#1B2B33\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >SELECT * FROM t TABLESAMPLE SYSTEM (1)<\/text><text x=\"1086\" y=\"255\" font-size=\"10.4\" fill=\"#1B2B33\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >  LIMIT 1000;<\/text><text x=\"1082\" y=\"294\" font-size=\"12\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >观察点<\/text><text x=\"1082\" y=\"314\" font-size=\"11.8\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >观察：语义不同。前者更接近全表行级随机，后者是块<\/text><text x=\"1082\" y=\"333\" font-size=\"11.8\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >级样本里最多取 1000 行。<\/text><rect x=\"24\" y=\"392\" width=\"1352\" height=\"30\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"700\" y=\"411.59\" font-size=\"13.5\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >诚实边界：本文是文章而非实测报告，所有数字留空；以你自己本地的 EXPLAIN 为准。<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "实践 · 三类角色", "title": "架构师、DBA、开发者各做各的", "lede": "架构师划场景与资源边界；DBA 管统计信息与观测口径；业务开发者盯 SQL 语义、可复现性与抽样单位。", "caption": "图 23　三类角色的最佳实践，下方为适合 / 不适合场景速查。", "bridge": "动作都对了，最后再看一眼那些反复出现的老坑。", "notes": "同一个机制落在不同人身上，动作完全不一样。架构师要做的是把采样需求分成近似查询、数据探索、统计信息、审计精确结果四类，别用一个 SQL 模式覆盖全部；对按时间写入、按租户批量导入的表，慎用 SYSTEM 做行级代表性分析；分区表要建手工 ANALYZE 策略，因为 autovacuum 不处理分区父表本身；业务若要稳定近似指标，考虑物化抽样表、分层采样、Sketch、预聚合。DBA 那边，慢查询里看到 Sample Scan 先确认业务接不接受近似；统计抖动先查 ANALYZE 频率、统计目标、扩展统计、表膨胀，而不是直接关扫描；对倾斜列提高列级目标或建 extended statistics；采样 SQL 一律用 EXPLAIN (ANALYZE, BUFFERS) 看实际读块数，别用百分比推 I/O。业务开发者记住三句话：SYSTEM(1) 不保证正好百分之一行；要复现就用 REPEATABLE 并记录数据版本；TABLESAMPLE 只接受普通表和物化视图，不接受任意 FROM 项。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >同一个机制，落在不同角色身上动作完全不一样<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >最佳实践 + 适合 / 不适合场景 · 依据原文第七、八节<\/text><rect x=\"24\" y=\"62\" width=\"442\" height=\"222\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"62\" width=\"442\" height=\"40\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"42\" y=\"89.2\" font-size=\"20\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >数据库架构师<\/text><rect x=\"42\" y=\"143.284\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"59\" y=\"149.836\" font-size=\"12.6\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >把采样需求分四类：近似查询 / 探索 / 统计 / 审计精确<\/text><rect x=\"42\" y=\"170.284\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"59\" y=\"176.836\" font-size=\"12.6\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >物理聚簇明显的表，慎用 SYSTEM 做行级代表性分析<\/text><rect x=\"42\" y=\"197.284\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"59\" y=\"203.836\" font-size=\"12.6\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >分区表建立手工 ANALYZE 策略<\/text><rect x=\"42\" y=\"224.284\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"59\" y=\"230.836\" font-size=\"12.6\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >稳定近似指标考虑物化抽样表、分层、Sketch、预聚合<\/text><rect x=\"482\" y=\"62\" width=\"442\" height=\"222\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"482\" y=\"62\" width=\"442\" height=\"40\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"500\" y=\"89.2\" font-size=\"20\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >DBA<\/text><rect x=\"500\" y=\"129.784\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"517\" y=\"136.336\" font-size=\"12.6\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >看到 Sample Scan 先确认业务是否接受近似结果<\/text><rect x=\"500\" y=\"156.784\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"517\" y=\"163.336\" font-size=\"12.6\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >统计抖动先查 ANALYZE 频率、统计目标、扩展统计、表膨胀<\/text><rect x=\"500\" y=\"183.784\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"517\" y=\"190.336\" font-size=\"12.6\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >倾斜列提高列级目标或建 extended statistics<\/text><rect x=\"500\" y=\"210.784\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"517\" y=\"217.336\" font-size=\"12.6\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >用 EXPLAIN (ANALYZE, BUFFERS) 看实际读块，别用百分比推<\/text><text x=\"517\" y=\"244.336\" font-size=\"12.6\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >I/O<\/text><rect x=\"940\" y=\"62\" width=\"442\" height=\"222\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"940\" y=\"62\" width=\"442\" height=\"40\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"958\" y=\"89.2\" font-size=\"20\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >业务开发者<\/text><rect x=\"958\" y=\"143.284\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"975\" y=\"149.836\" font-size=\"12.6\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >SYSTEM(1) 不保证 1% 行，也不保证各租户 / 状态按比例<\/text><rect x=\"958\" y=\"170.284\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"975\" y=\"176.836\" font-size=\"12.6\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >可复现实验用 REPEATABLE(seed) 并记录数据版本<\/text><rect x=\"958\" y=\"197.284\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"975\" y=\"203.836\" font-size=\"12.6\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >TABLESAMPLE 只接受普通表和物化视图，不接受任意 FROM 项<\/text><rect x=\"958\" y=\"224.284\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"975\" y=\"230.836\" font-size=\"12.6\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >不要在大表上默认 ORDER BY random()<\/text><text x=\"24\" y=\"306\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"2\" opacity=\"1\" >适合 / 不适合 · 一条分界线<\/text><rect x=\"24\" y=\"320\" width=\"666\" height=\"94\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" opacity=\"1\" /><text x=\"42\" y=\"346\" font-size=\"17\" fill=\"#2F7A66\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >适合<\/text><text x=\"42\" y=\"370\" font-size=\"12.6\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >数据探索 / 近似分析 / 统计维护 / 压测准备 / 抽样质检<\/text><text x=\"42\" y=\"394\" font-size=\"12.3\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >前提：误差可解释，且能接受漏检概率<\/text><rect x=\"716\" y=\"320\" width=\"660\" height=\"94\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"734\" y=\"346\" font-size=\"17\" fill=\"#BE653B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >不适合<\/text><text x=\"734\" y=\"370\" font-size=\"12.6\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >财务结算 / 审计 / 库存扣减 / 权限判定 / 稀有异常发现<\/text><text x=\"734\" y=\"394\" font-size=\"12.3\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >前提：必须保证包含某类行，或每个分组都有代表<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "避坑 · 十坑四类", "title": "大半指向同一个误会", "lede": "概念、语义、统计、工程四类误读；最该记住的一条：抽样单位决定 I/O、误差和偏差来源。", "caption": "图 24　十个常见坑按四类成因归类；底部为最核心的一条原理提醒。", "bridge": "坑大多指向同一个误会；把整条链压成一张剖面收尾。", "notes": "最后把十个坑归归类，其实就四类。概念类：把 SYSTEM(1) 理解成随机百分之一行，以为 BERNOULLI(1) 一定快，还有忽略 MVCC——采样方法选中 offset 之后，heap AM 仍要做可见性判断，死元组和页面状态会影响实际返回行数。语义类：忽略 TABLESAMPLE 在 WHERE 之前，用采样结果直接做精确聚合，以及用 ORDER BY random() 替代采样扫描。统计类：认为 ANALYZE 每次不同就是错误，只提高 default_statistics_target 却不建 extended statistics。工程类：对分区父表完全依赖 autovacuum，对扩展采样方法误用 REPEATABLE。你会发现大半的坑都指向同一个误会：把「抽哪些页面、哪些 offset」当成了「随机取多少行」。所以最该记住的一句话是——抽样单位决定 I/O、误差和偏差来源。收尾我们就把整条链压回那张地层剖面。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >十个常见坑，归成四类成因<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >最该记住的一条：抽样单位决定 I/O、误差和偏差来源<\/text><rect x=\"24\" y=\"62\" width=\"666\" height=\"146\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"62\" width=\"666\" height=\"38\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"40\" y=\"87\" font-size=\"15\" fill=\"#FFFFFF\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >概念误读 · 1 / 2 / 10<\/text><text x=\"40\" y=\"124\" font-size=\"12.8\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >1　SYSTEM(1) 当成随机 1% 行<\/text><text x=\"40\" y=\"152\" font-size=\"12.8\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >2　以为 BERNOULLI(1) 一定快<\/text><text x=\"40\" y=\"180\" font-size=\"12.8\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >10　忽略 MVCC：选中 offset 后仍要做可见性判断<\/text><rect x=\"714\" y=\"62\" width=\"666\" height=\"146\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"714\" y=\"62\" width=\"666\" height=\"38\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"730\" y=\"87\" font-size=\"15\" fill=\"#FFFFFF\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >语义误读 · 3 / 4 / 8<\/text><text x=\"730\" y=\"124\" font-size=\"12.8\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >3　忽略 TABLESAMPLE 在 WHERE 之前<\/text><text x=\"730\" y=\"152\" font-size=\"12.8\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >4　用采样结果直接做精确聚合<\/text><text x=\"730\" y=\"180\" font-size=\"12.8\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >8　用 ORDER BY random() 替代采样扫描<\/text><rect x=\"24\" y=\"220\" width=\"666\" height=\"146\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"220\" width=\"666\" height=\"38\" rx=\"0\" fill=\"#AE8A3E\" opacity=\"1\" /><text x=\"40\" y=\"245\" font-size=\"15\" fill=\"#FFFFFF\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >统计误读 · 5 / 6<\/text><text x=\"40\" y=\"282\" font-size=\"12.8\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >5　认为 ANALYZE 每次不同就是错误<\/text><text x=\"40\" y=\"310\" font-size=\"12.8\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >6　只调高统计目标，不建 extended statistics<\/text><rect x=\"714\" y=\"220\" width=\"666\" height=\"146\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"714\" y=\"220\" width=\"666\" height=\"38\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"730\" y=\"245\" font-size=\"15\" fill=\"#FFFFFF\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >工程误读 · 7 / 9<\/text><text x=\"730\" y=\"282\" font-size=\"12.8\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >7　对分区父表完全依赖 autovacuum<\/text><text x=\"730\" y=\"310\" font-size=\"12.8\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >9　对扩展采样方法误用 REPEATABLE<\/text><rect x=\"24\" y=\"386\" width=\"1352\" height=\"38\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"42\" y=\"411\" font-size=\"15\" fill=\"#BE653B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >大半的坑指向同一个误会：把「抽哪些页面 / 哪些 offset」当成了「随机取多少行」。<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "收束 · 七层剖面", "title": "它不是更便宜的全表扫", "lede": "从物理 heap 页面一路到业务语义，标记出的第四层就是抽样单位真正确定的地方：SYSTEM 抽 block，BERNOULLI 抽 offset。", "caption": "图 25　全篇机制的七层剖面；越深的靛青越底层，L4 是分水岭。", "bridge": "谢谢。带着那几个问题，去自己的库里跑一遍 EXPLAIN。", "notes": "收尾把整条链压成一张剖面。最底下是物理 heap 页面，I/O 真正发生的地方；往上一层是 MVCC 与 line pointer，死元组、页面填充、HOT 在这里决定实际返回行数；再往上是 Table AM 的采样接口，候选不等于可见行；第四层是 TsmRoutine 方法，SYSTEM 抽 block、BERNOULLI 抽 offset，抽样单位就在这一层定下来，它是全篇的分水岭；第五层 SampleScan 执行器负责 seed、BeginSampleScan 和反复取候选；第六层是 ANALYZE 统计路径，把样本变成 MCV、直方图、相关性；最顶上是业务语义与误差边界，先决定你到底能不能接受误差。越深的靛青越底层，而所有关于「快不快、准不准」的争论，其实都得回到第四层去问一句：你抽的单位是什么。所以一句话定位：采样扫描不是「更便宜的全表扫」，而是把精确性换成可解释的概率、误差与偏差。留几个问题给愿意往下挖的人：如果每个租户要抽一百行，普通 TABLESAMPLE 为什么不够？按时间顺序插入的表，SYSTEM(1) 抽到的页面能代表所有时间段吗？统计采样为什么可以接受「不完美的行样本等概率」？去自己的库里跑一遍 EXPLAIN (ANALYZE, BUFFERS)，答案会比任何一张图都清楚。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >把整条链压成一张剖面：抽样单位在第四层<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >收束 · 越深的靛青越底层；标记出的两层就是「采样语义」真正发生的位置<\/text><rect x=\"24\" y=\"62\" width=\"1352\" height=\"44\" rx=\"0\" fill=\"#EBF1EE\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"38\" y=\"72\" width=\"52\" height=\"24\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"64\" y=\"87.91\" font-size=\"11.5\" fill=\"#BE653B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >L7<\/text><text x=\"104\" y=\"91\" font-size=\"15.5\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >业务语义与误差边界<\/text><text x=\"430\" y=\"91\" font-size=\"13.2\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"0.92\" >近似 / 探索 / 统计 / 审计：先决定能不能接受误差<\/text><rect x=\"24\" y=\"110\" width=\"1352\" height=\"44\" rx=\"0\" fill=\"#CFE0DC\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"38\" y=\"120\" width=\"52\" height=\"24\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"64\" y=\"135.91\" font-size=\"11.5\" fill=\"#BE653B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >L6<\/text><text x=\"104\" y=\"139\" font-size=\"15.5\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >ANALYZE 统计路径<\/text><text x=\"430\" y=\"139\" font-size=\"13.2\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"0.92\" >样本行 → MCV / 直方图 / 相关性 → 优化器选择率<\/text><rect x=\"24\" y=\"158\" width=\"1352\" height=\"44\" rx=\"0\" fill=\"#A4C4C6\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"38\" y=\"168\" width=\"52\" height=\"24\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\ const N = D.length;
let cur = 0, panelOn = false, panelMode = '', autoTimer = null, autoOn = false;
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const pad = n => String(n).padStart(2,'0');
const setA = (id,a,v) => { const e=document.getElementById(id); if(e) e.setAttribute(a,v); };
const setT = (id,s) => { const e=document.getElementById(id); if(e) e.textContent=s; };
const CLS=['#245A6B','#BE653B','#AE8A3E'];
const KEYS = [
  ['→ / 空格','下一页'],['←','上一页'],['F','全屏 / 退出全屏（按键条常驻）'],['G','目录（再按关闭）'],
  ['N','本页讲稿（再按关闭）'],['T','全文讲稿（再按关闭）'],['P','自动播放 / 暂停'],
  ['1–9','直接跳页'],['输入页码 + 回车','跳到指定页'],['Home / End','首页 / 末页'],
  ['Esc','关闭讲稿窗 / 退出全屏'],['? 或 H','本帮助'],['点击底部按钮','同上']

/* ---------- 舞台缩放：讲稿打开时矢量缩到左侧 ---------- */
function fit(){
  const vp=$('#viewport'), W=vp.clientWidth, H=vp.clientHeight;
  const pw = panelOn ? $('#notes').offsetWidth : 0;
  const aw = Math.max(320, W-pw);
  const s = Math.min(aw/1600, H/900);
  const st=$('#stage');
  st.style.transform='scale('+s+')';
  st.style.left=((aw-1600*s)/2)+'px';
  st.style.top=((H-900*s)/2)+'px';
}
window.addEventListener('resize', fit);

function render(){
  $('#slides').innerHTML = D.map((d,i)=>
    '<section class="slide'+(d.ctrl?' anim':'')+'" id="s'+i+'">'
    + '<div class="eyebrow"><span class="num">'+pad(i+1)+' / '+pad(N)+'</span>'+d.eyebrow+'</div>'
    + '<h1 class="title">'+d.title+'</h1>'
    + '<div class="lede">'+d.lede+'</div>'
    + '<div class="rule"></div>'
    + '<div class="figwrap">'+d.svg+'</div>'
    + '<div class="caption">'+d.caption+'</div>'
    + (d.ctrl ? '<div class="ctrls">'+d.ctrl+'</div>' : '')
    + '<div class="bridge"><span class="bk">承接 · NEXT</span>'+d.bridge+'</div>'
    + '<div class="footer"><div class="fbar"><i id="fbar'+i+'"></i></div>'
    + '<span class="fl">数据库筑基课 · 数据扫描方法「采样扫描」</span>'
    + '<span class="fr">'+pad(i+1)+' / '+pad(N)+'</span></div>'
    + '</section>').join('');
}

function toast(s){
  const t=$('#toast'); t.textContent=s; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1600);
}

/* ---------- 页内开窗：右侧讲稿 ---------- */
function secHTML(d,i){
  return '<div class="nsec" id="nsec'+i+'"><span class="sn">'+pad(i+1)+' · '+d.eyebrow+'</span>'
    +'<h3>'+d.title+'</h3><p>'+d.notes+'</p>'
    +'<div class="br">「'+d.bridge+'」</div></div>';
}
function renderPanel(){
  const h=$('#nTitle'), sub=$('#nSub'), b=$('#nBody');
  if(panelMode==='here'){
    h.textContent='本页讲稿'; sub.textContent=pad(cur+1)+' / '+pad(N);
    b.innerHTML=secHTML(D[cur],cur); b.scrollTop=0;
  }else if(panelMode==='all'){
    h.textContent='全文讲稿'; sub.textContent='自动跟随当前页 · 共 '+N+' 页';
    b.innerHTML=D.map((d,i)=>secHTML(d,i)).join('');
  }else if(panelMode==='toc'){
    h.textContent='目录'; sub.textContent='点击跳转 · 共 '+N+' 页';
    b.innerHTML='<div class="tocgrid">'+D.map((d,i)=>
      '<a data-i="'+i+'" onclick="jump('+i+')"><span class="gn">'+pad(i+1)+'</span>'
      +'<span class="gt">'+d.title+'</span></a>').join('')+'</div>';
  }else{
    h.textContent='快捷键'; sub.textContent='全屏后底部同样常驻';
    b.innerHTML='<div class="keygrid">'+KEYS.map(k=>'<div><kbd>'+k[0]+'</kbd>'+k[1]+'</div>').join('')+'</div>'
      +'<div class="nsec"><p>讲稿采用页内开窗：按一下显示，再按一下关闭；显示时画面矢量缩放到左侧。'
      +'按 T 显示全部讲稿时自动定位到当前页，翻页时右侧讲稿会联动滚动并高亮当前页。'
      +'三处动画页（05 / 11 / 17）都提供输入、播放 / 暂停、单步与重置，均为确定性示意模型，不代表实测数据。</p></div>';
  }
  syncNotes(true);
}
function syncNotes(instant){
  if(!panelOn) return;
  if(panelMode==='all'){
    $$('.nsec').forEach(e=>e.classList.remove('cur'));
    const el=document.getElementById('nsec'+cur), nb=$('#nBody');
    if(el && nb){
      el.classList.add('cur');
      const top=el.offsetTop-6;
      if(instant) nb.scrollTop=top;
      else nb.scrollTo({top:top,behavior:'smooth'});
    }
  }else if(panelMode==='toc'){
    $$('.tocgrid a').forEach(a=>a.classList.toggle('cur', +a.dataset.i===cur));
  }
}
function openPanel(mode){
  if(panelOn && panelMode===mode){ closePanel(); return; }
  panelOn=true; panelMode=mode;
  document.body.classList.add('panel-on');
  renderPanel(); fit(); syncChrome();
  if(mode==='all') setTimeout(()=>syncNotes(true),90);
}
function closePanel(){
  if(!panelOn) return;
  panelOn=false; panelMode='';
  document.body.classList.remove('panel-on');
  fit(); syncChrome();
}
function jump(i){ closePanel(); go(i); }
function syncChrome(){
  $('#btnNotes').classList.toggle('act', panelOn && panelMode==='here');
  $('#btnAll').classList.toggle('act', panelOn && panelMode==='all');
  $('#btnToc').classList.toggle('act', panelOn && panelMode==='toc');
  $('#btnHelp').classList.toggle('act', panelOn && panelMode==='help');
  $('#btnFs').textContent = document.body.classList.contains('immersive') ? '退出全屏 F' : '全屏 F';
}

/* ---------- 翻页 ---------- */
function go(i,silent){
  i=Math.max(0,Math.min(N-1,i));
  $$('.slide').forEach((el,k)=>el.classList.toggle('on',k===i));
  cur=i;
  try{ localStorage.setItem('ss-slide',String(i)); }catch(e){}
  $('#pg').textContent=pad(i+1)+' / '+pad(N);
  const jp=$('#jump'); if(jp) jp.value=String(i+1);
  $('#bar').style.width=((i+1)/N*100)+'%';
  for(let k=0;k<N;k++){ const b=document.getElementById('fbar'+k); if(b) b.style.width=(k<=i?100:0)+'%'; }
  stopAnims();
  if(panelOn){
    if(panelMode==='here') renderPanel(); else syncNotes(false);
  }
  if(!silent) toast(pad(i+1)+'　'+D[i].title);
  syncChrome();
}
function next(){ if(cur<N-1) go(cur+1); else stopAuto(); }
function prev(){ if(cur>0) go(cur-1); }

/* ---------- 自动播放 / 全屏 ---------- */
function stopAuto(){
  autoOn=false; clearInterval(autoTimer); autoTimer=null;
  $('#btnAuto').textContent='自动播放 P'; $('#btnAuto').classList.remove('act');
}
function toggleAuto(){
  if(autoOn){ stopAuto(); toast('已暂停自动播放'); return; }
  autoOn=true; $('#btnAuto').textContent='❚❚ 暂停 P'; $('#btnAuto').classList.add('act');
  autoTimer=setInterval(()=>{ if(cur<N-1) go(cur+1,true); else stopAuto(); },12000);
  toast('自动播放：每 12 秒一页（P 暂停）');
}
function fs(){
  const el=document.documentElement;
  const immersive=document.body.classList.contains('immersive');
  if(document.fullscreenElement || immersive){
    document.body.classList.remove('immersive');
    try{ if(document.fullscreenElement) document.exitFullscreen(); }catch(e){}
    toast('已退出全屏');
    fit(); syncChrome();
    return;
  }
  try{
    const p=el.requestFullscreen && el.requestFullscreen();
    if(p && p.catch) p.catch(()=>toast('浏览器拦截了原生全屏，已进入沉浸模式'));
  }catch(e){}
  document.body.classList.add('immersive');
  toast('全屏：底部快捷键常驻（F 或 Esc 退出）');
  fit(); syncChrome();
}
document.addEventListener('fullscreenchange',()=>{
  if(!document.fullscreenElement) document.body.classList.remove('immersive');
  fit(); syncChrome();
});

/* ---------- 三处动画：输入 + 播放/暂停 + 单步 + 重置 ---------- */
const ANIMS=[];
function mkBase(max){ const a={step:0,max:max,timer:null,
  pause(){ if(this.timer){clearInterval(this.timer);this.timer=null;} const b=document.getElementById(this.playId); if(b)b.textContent='▶ 播放'; },
  play(){ if(this.step>=this.max) this.step=0; this.pause(); this.paint();
    const b=document.getElementById(this.playId); if(b)b.textContent='❚❚ 暂停';
    this.timer=setInterval(()=>{ if(this.step>=this.max){this.pause();return;} this.step++; this.paint(); },700); },
  stepOnce(){ this.pause(); if(this.step<this.max){this.step++;this.paint();} },
  reset(){ this.pause(); this.step=0; this.paint(); }
}; ANIMS.push(a); return a; }
function stopAnims(){ ANIMS.forEach(a=>a.pause()); }

/* W · 第 05 页：先采样、后过滤；确定性示意 hash，非 PostgreSQL RNG */
const w=mkBase(25); w.playId='w-play';
w.play=function(){
  if(this.step>=this.max) this.step=0;
  this.pause(); this.paint();
  const b=document.getElementById(this.playId); if(b)b.textContent='❚❚ 暂停';
  this.timer=setInterval(()=>{ if(this.step>=this.max){this.pause();return;} this.step++; this.paint(); },420);
};
w.paint=function(){
  const p=+document.getElementById('w-p').value;
  const seed=+document.getElementById('w-seed').value;
  const mode=document.getElementById('w-rare').value;
  const rare = mode==='cluster' ? [5,6] : [3,9,15,21];
  const hit=i=>((i*37+seed*29+11)%100)<p;
  let ns=0, nr=0;
  for(let i=0;i<24;i++){
    const isRare=rare.indexOf(i)>=0;
    const done=i<Math.min(this.step,24);
    const chosen=done && hit(i);
    setA('w-g'+i,'fill',chosen?'#245A6B':'#FFFFFF');
    setA('w-g'+i,'stroke',isRare?'#BE653B':'#D9D5CB');
    setA('w-g'+i,'stroke-width',isRare?'2':'1');
    setA('w-t'+i,'fill',chosen?'#FFFFFF':(isRare?'#BE653B':'#89938F'));
    const keep=(this.step>=25)&&chosen&&isRare;
    setA('w-h'+i,'fill',keep?'#2F7A66':'#F1EFE9');
    setA('w-h'+i,'stroke',keep?'#2F7A66':'#D9D5CB');
    if(chosen){ns++; if(isRare) nr++;}
  }
  let stage;
  if(this.step===0) stage='等待开始 · 点播放或单步';
  else if(this.step<25) stage='① 采样阶段 · 正在判定第 '+this.step+' / 24 行';
  else stage='② WHERE 阶段 · 只在采样结果里找 rare 行';
  setT('w-stage',stage);
  const out=document.getElementById('w-out');
  if(out) out.innerHTML='<b>'+p+'% / seed '+seed+'</b>　已判定 '+Math.min(this.step,24)
    +'/24 · 样本 '+ns+' 行 · rare 命中 '+nr
    +(this.step>=25?(nr?'　WHERE 有结果':'　WHERE 返回 0 行'):'')
    +'（示意 · 非实测）';
};

/* C · 第 11 页：聚簇偏差；72 格设定模型，示意 · 非实测 */
const c=mkBase(12); c.playId='c-play';
c.paint=function(){
  const p=+document.getElementById('c-p').value;
  const seed=+document.getElementById('c-seed').value;
  const mode=document.getElementById('c-mode').value;
  const cls=(b,i)=> mode==='high' ? b%3 : (mode==='mid' ? (b+Math.floor(i/3))%3 : (b*6+i)%3);
  const sysHit=b=>((b*41+seed*17+7)%100)<p;
  const berHit=(b,i)=>(((b*6+i)*29+seed*13+5)%100)<p;
  const tc=[0,0,0], sc=[0,0,0], bc=[0,0,0];
  let ns=0, nb=0;
  for(let b=0;b<12;b++){
    const done=b<this.step, sh=done&&sysHit(b);
    setA('c-b'+b,'fill',sh?'#F7E9DE':'#FFFFFF');
    setA('c-b'+b,'stroke',sh?'#BE653B':'#D9D5CB');
    setA('c-b'+b,'stroke-width',sh?'2':'1.2');
    setA('d-b'+b,'fill','#FFFFFF');
    setA('d-b'+b,'stroke','#D9D5CB');
    for(let i=0;i<6;i++){
      const q=cls(b,i), s=done&&sh, t=done&&berHit(b,i);
      tc[q]++;
      if(s){sc[q]++;ns++;}
      if(t){bc[q]++;nb++;}
      setA('c-cell-'+b+'-'+i,'fill',CLS[q]);
      setA('c-cell-'+b+'-'+i,'fill-opacity',s?'1':'0.16');
      setA('c-cell-'+b+'-'+i,'stroke',s?CLS[q]:'#D9D5CB');
      setA('d-cell-'+b+'-'+i,'fill',CLS[q]);
      setA('d-cell-'+b+'-'+i,'fill-opacity',t?'1':'0.16');
      setA('d-cell-'+b+'-'+i,'stroke',t?CLS[q]:'#D9D5CB');
    }
  }
  const fmt=a=>'A '+a[0]+' · B '+a[1]+' · C '+a[2];
  setT('c-tot',fmt(tc)+'　/ 72 格');
  setT('c-sysn',fmt(sc)+'　/ '+ns+' 行');
  setT('c-bern',fmt(bc)+'　/ '+nb+' 行');
  const mn=mode==='high'?'完全聚簇':(mode==='mid'?'部分混合':'完全打散');
  const hint=mode==='high'?'SYSTEM 偏差大':(mode==='mid'?'偏差减弱':'两者接近');
  const out=document.getElementById('c-out');
  if(out) out.innerHTML='<b>'+mn+' '+p+'% · '+this.step+'/12 块</b>　SYSTEM '+ns
    +' 行 / BERNOULLI '+nb+' 行 · '+hint+'（示意 · 非实测）';
};

/* V · 第 17 页：两阶段采样；跳过值与槽位为设定伪随机序列，非 PostgreSQL RNG */
function vEvents(k,seed){
  const ev=[]; let i=0,n=0;
  for(let j=0;j<k && i<12;j++){ ev.push({t:'fill',row:i+1,slot:j}); i++; }
  while(i<12){
    const S=1+((seed*7+n*5)%3);
    for(let s=0;s<S && i<12;s++){ ev.push({t:'skip',row:i+1,skip:S}); i++; }
    if(i>=12) break;
    const slot=(seed*3+n*2+i)%k;
    ev.push({t:'replace',row:i+1,slot:slot}); i++; n++;
  }
  return ev.slice(0,12);
}
const v=mkBase(12); v.playId='v-play';
v.paint=function(){
  const k=+document.getElementById('v-k').value;
  const seed=+document.getElementById('v-seed').value;
  const ev=vEvents(k,seed);
  const pool=new Array(k).fill(null);
  let last=null;
  for(let s=0;s<this.step;s++){
    const e=ev[s]; last=e;
    if(e.t==='fill'||e.t==='replace') pool[e.slot]=e.row;
  }
  for(let b=0;b<12;b++){
    const on=(b*5+seed)%3!==0;
    setA('v-b'+b,'fill',on?'#E5EFF0':'#F1EFE9');
    setA('v-b'+b,'stroke',on?'#245A6B':'#D9D5CB');
    setA('v-bt'+b,'fill',on?'#245A6B':'#89938F');
  }
  for(let i=0;i<12;i++){
    const e=i<this.step?ev[i]:null;
    let fill='#F1EFE9', stroke='#D9D5CB', col='#89938F';
    if(e && e.t==='fill'){ fill='#E4F0EA'; stroke='#2F7A66'; col='#2F7A66'; }
    else if(e && e.t==='replace'){ fill='#F7E9DE'; stroke='#BE653B'; col='#BE653B'; }
    setA('v-r'+i,'fill',fill); setA('v-r'+i,'stroke',stroke); setA('v-rt'+i,'fill',col);
  }
  for(let j=0;j<5;j++){
    const active=j<k;
    setA('v-s'+j,'opacity',active?'1':'0.25');
    setA('v-s'+j,'fill',active?'#FFFFFF':'#F1EFE9');
    setA('v-s'+j,'stroke',active?'#245A6B':'#D9D5CB');
    setT('v-st'+j,active?(pool[j]?'r'+pad(pool[j]):'—'):'—');
    setA('v-st'+j,'fill',active?(pool[j]?'#245A6B':'#89938F'):'#89938F');
  }
  let stage='等待开始 · 点播放或单步', act='';
  if(last){
    if(last.t==='fill'){ stage='阶段 '+this.step+'/12 · 前 k 行直接入池：r'+pad(last.row)+' → 槽 '+(last.slot+1); act='填充槽 '+(last.slot+1); }
    else if(last.t==='skip'){ stage='阶段 '+this.step+'/12 · Vitter 跳过 S = '+last.skip+' 行，r'+pad(last.row)+' 不入池'; act='跳过 '+last.skip+' 行'; }
    else { stage='阶段 '+this.step+'/12 · 跳过结束，r'+pad(last.row)+' 替换槽 '+(last.slot+1); act='替换槽 '+(last.slot+1); }
  }
  setT('v-stage',stage);
  const out=document.getElementById('v-out');
  if(out) out.innerHTML='<b>k='+k+' · '+this.step+'/12</b>　池 ['
    +pool.map(x=>x?'r'+pad(x):'—').join(' , ')
    +']　'+(act||'未开始')+'（示意 · 非实测）';
};

function bindAnim(pre,a){
  document.getElementById(a.playId).onclick=()=>{ if(a.timer)a.pause(); else a.play(); };
  document.getElementById(pre+'-step').onclick=()=>a.stepOnce();
  document.getElementById(pre+'-reset').onclick=()=>a.reset();
  a.paint();
}

/* ---------- 键盘 ---------- */
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  const typing=(tag==='input'||tag==='select'||tag==='textarea');
  const k=e.key;
  if(k==='Escape'){
    if(typing){ e.target.blur(); return; }
    if(panelOn) closePanel();
    else if(document.fullscreenElement || document.body.classList.contains('immersive')) fs();
    return;
  }
  if(typing) return;
  if(k==='ArrowRight'||k===' '||k==='PageDown'){ e.preventDefault(); next(); }
  else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); prev(); }
  else if(k==='f'||k==='F'){ e.preventDefault(); fs(); }
  else if(k==='g'||k==='G'){ e.preventDefault(); openPanel('toc'); }
  else if(k==='n'||k==='N'){ e.preventDefault(); openPanel('here'); }
  else if(k==='t'||k==='T'){ e.preventDefault(); openPanel('all'); }
  else if(k==='p'||k==='P'){ e.preventDefault(); toggleAuto(); }
  else if(k==='?'||k==='h'||k==='H'){ e.preventDefault(); openPanel('help'); }
  else if(k==='Home'){ e.preventDefault(); go(0); }
  else if(k==='End'){ e.preventDefault(); go(N-1); }
  else if(/^[1-9]$/.test(k)){ go(parseInt(k,10)-1); }
});

/* ---------- 启动 ---------- */
function init(){
  render();
  $('#jump').max=String(N);
  $('#btnPrev').onclick=prev; $('#btnNext').onclick=next;
  $('#btnToc').onclick=()=>openPanel('toc');
  $('#btnNotes').onclick=()=>openPanel('here');
  $('#btnAll').onclick=()=>openPanel('all');
  $('#btnHelp').onclick=()=>openPanel('help');
  $('#btnAuto').onclick=toggleAuto;
  $('#btnFs').onclick=fs;
  $('#nClose').onclick=closePanel;
  $('#jump').onkeydown=e=>{
    if(e.key==='Enter'){ e.preventDefault();
      const v=parseInt($('#jump').value||'1',10);
      go(Number.isNaN(v)?0:Math.max(0,Math.min(N-1,v-1))); $('#jump').blur(); }
  };
  const inputs={
    'w-p':w,'w-rare':w,'w-seed':w,
    'c-p':c,'c-mode':c,'c-seed':c,
    'v-k':v,'v-seed':v
  };
  Object.keys(inputs).forEach(id=>{
    const e=document.getElementById(id), a=inputs[id];
    ['input','change'].forEach(t=>e.addEventListener(t,()=>{ a.pause(); a.step=0; a.paint(); }));
  });
  bindAnim('w',w); bindAnim('c',c); bindAnim('v',v);
  fit(); go(0,true);
  setTimeout(()=>document.body.classList.add('ready'),80);
}
document.addEventListener('DOMContentLoaded',init);

</script>
