<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数据库筑基课 · 数据扫描方法「采样扫描」</title>
<!-- 单文件交付：所有原理图均为现场绘制的内联 SVG，零外部图片 / 字体 / 脚本依赖。 -->
<style>
:root{
  --bg:#F7F6F2; --bg2:#F1EFE9; --ink:#1B2B33; --ink2:#46585F; --muted:#89938F; --line:#D9D5CB;
  --primary:#245A6B; --prim-l:#E5EFF0; --accent:#BE653B; --acc-l:#F7E9DE;
  --green:#2F7A66; --green-l:#E4F0EA; --gold:#AE8A3E; --gold-l:#F5EDDC;
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#E9E7E1}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
#viewport{position:absolute;inset:0 0 66px 0;overflow:hidden}
#stage{position:absolute;width:1600px;height:900px;background:var(--bg);
  transform-origin:top left;box-shadow:0 16px 54px rgba(27,43,51,.12)}
body.ready #stage{transition:transform .36s cubic-bezier(.2,.7,.2,1),left .36s cubic-bezier(.2,.7,.2,1),top .36s cubic-bezier(.2,.7,.2,1)}
.slide{position:absolute;inset:0;display:none;background:var(--bg)}
.slide.on{display:block;animation:fadein .4s cubic-bezier(.2,.7,.2,1)}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.eyebrow{position:absolute;left:64px;top:44px;font-size:13px;letter-spacing:3.4px;color:var(--primary);font-weight:600}
.eyebrow .num{font-family:var(--mono);letter-spacing:1px;color:var(--accent);margin-right:14px}
h1.title{position:absolute;left:64px;top:70px;margin:0;font-family:var(--serif);font-size:44px;
  line-height:1.25;font-weight:700;letter-spacing:1.2px;color:var(--ink)}
.lede{position:absolute;left:64px;top:139px;width:1440px;font-size:19px;color:var(--ink2);line-height:1.5;letter-spacing:.3px}
.rule{position:absolute;left:64px;top:181px;width:1472px;height:1px;background:var(--line)}
.figwrap{position:absolute;left:100px;top:198px;width:1400px;height:430px}
svg.figure{display:block;overflow:visible}
.caption{position:absolute;left:100px;top:638px;width:1400px;font-size:13px;color:var(--muted);letter-spacing:.4px}
.bridge{position:absolute;left:64px;top:716px;width:1472px;font-size:20px;color:var(--accent);
  line-height:1.55;letter-spacing:.4px;padding-left:18px;border-left:3px solid var(--accent);font-family:var(--serif)}
.bridge .bk{font-family:var(--sans);font-size:13px;color:var(--muted);letter-spacing:2px;display:block;margin-bottom:2px}
.footer{position:absolute;left:64px;top:846px;width:1472px;height:1px;background:var(--line)}
.footer .fl{position:absolute;left:0;top:14px;font-size:12.5px;color:var(--muted);letter-spacing:2px}
.footer .fr{position:absolute;right:0;top:12px;font-family:var(--mono);font-size:14px;color:var(--ink2)}
.footer .fbar{position:absolute;left:0;right:0;top:-1px;height:2px;background:transparent}
.footer .fbar i{display:block;height:2px;background:var(--primary);width:0;transition:width .4s ease}

/* 动画控件：位于图下方独立条带，不覆盖图 */
.ctrls{position:absolute;left:100px;top:664px;width:1400px;height:40px;display:flex;align-items:center;gap:9px}
.ctrls label{font-size:12.5px;color:var(--ink2);white-space:nowrap}
.ctrls select,.ctrls input[type=range]{font-family:var(--sans);font-size:12.5px;color:var(--ink);
  background:#fff;border:1px solid var(--line);border-radius:4px;padding:4px 6px;outline:none}
.ctrls input[type=range]{width:112px;padding:0;accent-color:var(--primary);border:none;background:transparent}
.ctrls .btn{min-height:30px;padding:5px 12px;border:1px solid var(--primary);border-radius:4px;
  background:#fff;color:var(--primary);font-size:12.5px;cursor:pointer;font-family:var(--sans);white-space:nowrap}
.ctrls .btn.play{background:var(--primary);color:#fff}
.ctrls .btn:hover{filter:brightness(.94)}
.ctrls .out{font-size:12px;color:var(--ink2);margin-left:auto;min-width:0;flex:1;max-width:560px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrls .out b{color:var(--accent);font-weight:600}

/* 底部外壳：两行，全屏后按键仍常驻 */
.chrome{position:fixed;left:0;right:0;bottom:0;height:66px;background:#FCFBF8;
  border-top:1px solid var(--line);z-index:40;display:flex;flex-direction:column;padding:6px 18px 5px;gap:4px}
.chrome .r1{display:flex;align-items:center;gap:7px;height:32px;flex:0 0 32px}
.chrome .r2{display:flex;align-items:center;font-size:11.5px;color:var(--muted);
  white-space:nowrap;overflow:hidden;line-height:1.2}
.chrome .r2 span{padding:0 10px;border-right:1px solid var(--line)}
.chrome .r2 span:first-child{padding-left:0}
.chrome .r2 span:last-child{border-right:none}
.chrome button{font-family:var(--sans);font-size:13px;color:var(--ink2);background:transparent;
  border:1px solid transparent;border-radius:5px;padding:6px 11px;cursor:pointer;white-space:nowrap}
.chrome button:hover{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome button.act{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome input.jump{font-family:var(--mono);font-size:12px;color:var(--ink2);background:#fff;
  border:1px solid var(--line);border-radius:5px;padding:5px 6px;width:56px;outline:none;text-align:center}
.chrome .pg{font-family:var(--mono);font-size:14px;color:var(--ink);min-width:76px;text-align:center}
.chrome .track{flex:1;height:3px;background:var(--line);border-radius:3px;margin:0 12px;position:relative;min-width:40px}
.chrome .track i{position:absolute;left:0;top:0;height:3px;background:var(--primary);border-radius:3px;transition:width .35s}
body.immersive .chrome{background:var(--bg2)}
body.immersive{background:#E9E7E1}

/* 页内开窗：右侧讲稿，不是弹窗 */
#notes{position:fixed;right:0;top:0;bottom:66px;width:38vw;min-width:380px;max-width:620px;
  background:#FCFBF8;border-left:1px solid var(--line);z-index:30;display:flex;flex-direction:column;
  transform:translateX(101%);transition:transform .36s cubic-bezier(.2,.7,.2,1);
  box-shadow:-14px 0 44px rgba(27,43,51,.07)}
body.panel-on #notes{transform:translateX(0)}
.nhead{padding:16px 22px 13px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex:0 0 auto}
.nhead .nt{font-family:var(--serif);font-size:21px;color:var(--ink);font-weight:700;flex:1}
.nhead .ns{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.nhead button{font-family:var(--sans);font-size:12.5px;background:#fff;border:1px solid var(--line);
  border-radius:5px;padding:6px 11px;cursor:pointer;color:var(--ink2)}
.nhead button:hover{border-color:var(--primary);color:var(--primary)}
.nbody{flex:1;overflow-y:auto;position:relative;padding:6px 22px 44px;scroll-behavior:smooth}
.nbody::-webkit-scrollbar{width:9px}
.nbody::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
.nsec{border-top:1px solid var(--line);padding:18px 0 22px}
.nsec:first-child{border-top:none}
.nsec .sn{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:1px}
.nsec h3{margin:8px 0 11px;font-family:var(--serif);font-size:21px;color:var(--primary);line-height:1.4}
.nsec p{margin:0;font-size:15.5px;line-height:2.0;color:var(--ink2);letter-spacing:.2px}
.nsec .br{margin-top:13px;font-family:var(--serif);font-size:15px;color:var(--accent);line-height:1.8;
  padding-left:12px;border-left:2px solid var(--accent)}
.nsec.cur{background:var(--prim-l);margin:0 -22px;padding-left:22px;padding-right:22px}
.tocgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:8px 0 20px}
.tocgrid a{display:block;padding:12px 13px;border:1px solid var(--line);border-radius:5px;
  background:#fff;text-decoration:none;color:var(--ink);cursor:pointer;transition:.2s}
.tocgrid a:hover{border-color:var(--primary);background:var(--prim-l)}
.tocgrid a.cur{border-color:var(--accent);background:var(--acc-l)}
.tocgrid a .gn{font-family:var(--mono);font-size:12px;color:var(--accent)}
.tocgrid a .gt{font-family:var(--serif);font-size:15px;line-height:1.4;display:block;margin-top:5px}
.keygrid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px 24px;font-size:14.5px;
  line-height:1.8;padding:12px 0 6px;color:var(--ink2)}
.keygrid kbd{font-family:var(--mono);background:#fff;border:1px solid var(--line);
  border-bottom-width:2px;border-radius:4px;padding:2px 7px;color:var(--primary);margin-right:8px}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ink);
  color:#fff;font-size:13px;padding:9px 16px;border-radius:5px;opacity:0;transition:.3s;z-index:80;pointer-events:none}
.toast.on{opacity:1}
@media print{
  html,body{overflow:visible;background:#fff;height:auto}
  #viewport{position:static;overflow:visible}
  #stage{position:static;transform:none!important;box-shadow:none;transition:none}
  .slide{display:block!important;position:relative;height:900px;page-break-after:always;animation:none}
  .chrome,#notes,.toast,.ctrls{display:none!important}
}
</style>
</head>

<svg id="svgdefs" xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true"><defs><marker id="arr-prim" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L6,3 z" fill="#245A6B"/></marker><marker id="arr-acc" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L6,3 z" fill="#BE653B"/></marker><marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L6,3 z" fill="#2F7A66"/></marker><marker id="arr-gold" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L6,3 z" fill="#AE8A3E"/></marker><marker id="arr-ink" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L6,3 z" fill="#1B2B33"/></marker><marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L6,3 z" fill="#89938F"/></marker><marker id="arr-white" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L6,3 z" fill="#FFFFFF"/></marker></defs></svg>
<div id="viewport"><div id="stage"><div id="slides"></div></div></div>
<aside id="notes">
  <div class="nhead"><span class="nt" id="nTitle">讲稿</span><span class="ns" id="nSub"></span>
    <button id="nClose">关闭 ✕</button></div>

</aside>
<div class="chrome">
  <div class="r1">
    <button id="btnPrev">← 上一页</button><button id="btnNext">下一页 →</button>
    <span class="pg" id="pg">01 / 25</span>

    <div class="track"><i id="bar"></i></div>
    <button id="btnToc">目录 G</button>
    <button id="btnNotes">本页讲稿 N</button>
    <button id="btnAll">全文讲稿 T</button>
    <button id="btnAuto">自动播放 P</button>
    <button id="btnFs">全屏 F</button>
    <button id="btnHelp">? 帮助</button>
  </div>

    <span>N 本页讲稿</span><span>T 全文讲稿</span><span>P 自动播放</span>
    <span>1–9 跳页</span><span>输入页码回车</span><span>Home / End</span><span>Esc 关闭</span><span>? 快捷键</span>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const D = [{"eyebrow": "困境 · 四类痛点", "title": "痛点不是慢，是语义用错了", "lede": "大表想看分布、报表只要近似、ANALYZE 结果抖动、SYSTEM(1) 被当成随机 1% 行 —— 四类痛点的根子相同。", "caption": "图 01　四类常见痛点、各自的误读与代价；右侧为对应的正确问法。", "bridge": "要解开这四个结，得先把「问题本身」重新写一遍。", "notes": "我们先不谈实现，先谈四个特别常见的现场。第一个，有人想从大表里随便看一千行，写了 ORDER BY random() LIMIT 1000，结果整张表被读了一遍，还得为每一行算随机数再排序，系统被拖慢。第二个，报表或者数据科学任务其实只需要近似结果，代码里却默认全表扫，一分钱的 I/O 都没省。第三个，DBA 发现每次 ANALYZE 之后统计信息都略有不同，第一反应是「统计不稳定，是不是坏了」，急着去关掉某类扫描。第四个最要命，开发者写 TABLESAMPLE SYSTEM(1)，心里想的是「随机取百分之一的行」，拿去做用户画像，结果样本里同一个租户的数据成片出现。你看，这四个现场表面上是四件事，其实都指向同一个误会：把「抽样的单位」和「结果到底要不要精确」混成了一件事。所以这篇不按功能清单讲，我们按一条因果链往下推：先重写问题，再立边界，然后一层层拆到页面和 offset，最后回到你的库里怎么验证。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >四类痛点，都不是「查得慢」，而是「抽样单位或语义用错了」<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >背景 · 大表探索 / 近似报表 / 统计抖动 / TABLESAMPLE 误读<\/text><rect x=\"24\" y=\"58\" width=\"666\" height=\"158\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"58\" width=\"4\" height=\"158\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"46\" y=\"89\" font-size=\"14\" fill=\"#BE653B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >01<\/text><text x=\"86\" y=\"90\" font-size=\"18\" fill=\"#1B2B33\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >ORDER BY random() LIMIT 1000<\/text><rect x=\"536\" y=\"74\" width=\"138\" height=\"24\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"605\" y=\"89.91\" font-size=\"11.5\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >大表拖慢系统<\/text><line x1=\"46\" y1=\"106\" x2=\"668\" y2=\"106\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"46\" y=\"134\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >误把「随机取 n 行」写成「为每行算 random() 再排序 / Top-N」<\/text><text x=\"46\" y=\"162\" font-size=\"13\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >代价 · 全表读 + 排序，代价随表线性增长<\/text><text x=\"46\" y=\"194\" font-size=\"13\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >正确问法：少读哪些页？<\/text><rect x=\"714\" y=\"58\" width=\"666\" height=\"158\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"714\" y=\"58\" width=\"4\" height=\"158\" rx=\"0\" fill=\"#AE8A3E\" opacity=\"1\" /><text x=\"736\" y=\"89\" font-size=\"14\" fill=\"#AE8A3E\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >02<\/text><text x=\"776\" y=\"90\" font-size=\"18\" fill=\"#1B2B33\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >只需要近似结果，却默认全表扫<\/text><rect x=\"1226\" y=\"74\" width=\"138\" height=\"24\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1295\" y=\"89.91\" font-size=\"11.5\" fill=\"#AE8A3E\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >报表 / 数据科学<\/text><line x1=\"736\" y1=\"106\" x2=\"1358\" y2=\"106\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"736\" y=\"134\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >没意识到业务可以接受误差，于是仍旧为精确性付全价<\/text><text x=\"736\" y=\"162\" font-size=\"13\" fill=\"#AE8A3E\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >代价 · I/O 与 CPU 一分不省<\/text><text x=\"736\" y=\"194\" font-size=\"13\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >正确问法：误差能讲清吗？<\/text><rect x=\"24\" y=\"228\" width=\"666\" height=\"158\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"228\" width=\"4\" height=\"158\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"46\" y=\"259\" font-size=\"14\" fill=\"#BE653B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >03<\/text><text x=\"86\" y=\"260\" font-size=\"18\" fill=\"#1B2B33\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >ANALYZE 每次结果略有不同<\/text><rect x=\"536\" y=\"244\" width=\"138\" height=\"24\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"605\" y=\"259.91\" font-size=\"11.5\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >统计抖动误判<\/text><line x1=\"46\" y1=\"276\" x2=\"668\" y2=\"276\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"46\" y=\"304\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >不知道大表统计本来就来自随机样本<\/text><text x=\"46\" y=\"332\" font-size=\"13\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >代价 · 误判为故障，甚至盲目关闭扫描<\/text><text x=\"46\" y=\"364\" font-size=\"13\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >正确问法：样本从哪来？<\/text><rect x=\"714\" y=\"228\" width=\"666\" height=\"158\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"714\" y=\"228\" width=\"4\" height=\"158\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"736\" y=\"259\" font-size=\"14\" fill=\"#BE653B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >04<\/text><text x=\"776\" y=\"260\" font-size=\"18\" fill=\"#1B2B33\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >TABLESAMPLE SYSTEM(1)<\/text><rect x=\"1226\" y=\"244\" width=\"138\" height=\"24\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1295\" y=\"259.91\" font-size=\"11.5\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >当成「随机 1% 行」<\/text><line x1=\"736\" y1=\"276\" x2=\"1358\" y2=\"276\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"736\" y=\"304\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >忽略了它其实是每个页面 1% 概率的块级采样<\/text><text x=\"736\" y=\"332\" font-size=\"13\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >代价 · 样本成片出现，代表性被物理聚簇左右<\/text><text x=\"736\" y=\"364\" font-size=\"13\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >正确问法：抽样的单位是什么？<\/text><text x=\"24\" y=\"412\" font-size=\"14\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >共同点：把「抽样的单位」和「结果是否必须精确」混成了一件事。<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "问题重述 · 概率换 I/O", "title": "把精确换成可解释的误差", "lede": "前面的 Seq Scan、Index Scan、Bitmap Scan 问的是「怎样把满足条件的行正确、便宜地找出来」；采样扫描问的是另一个问题。", "caption": "图 02　旧问题与新问题的定义对照，以及三笔交换：概率换 I/O、误差换速度、有限样本换统计成本。", "bridge": "问题一改写，边界就必须跟着立住，否则会变成万能药。", "notes": "以前的扫描算法，目标是把满足条件的行尽量正确、尽量便宜地找出来，误差为零是硬前提。采样扫描换了个问法：当业务愿意接受近似、统计、或者一份有代表性的样本时，数据库能不能少读一些、快一些，并且把误差边界讲清楚。于是「读完整表得到精确结果」变成了「按概率读部分块或者部分行，得到样本，接受随机误差或者聚簇偏差」。这里有三笔交换，得一笔一笔认下来。第一笔，用概率换 I/O：不再逐页逐行走完整张表，读哪些页面由抽样单位决定。第二笔，用可解释误差换速度：快是真的，但你必须说得出误差从哪来、大概什么量级。第三笔，用有限样本换统计成本：ANALYZE 从来不追求精确分布，它只求优化器够用。注意最后这句，它是全篇的定盘星——采样扫描不是精确扫描的低价替代品，它是另一种问题定义。谁把它当便宜版全表扫用，谁迟早在账务或者审计上出事。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >把「读全部得精确」改写成「按概率读部分，接受可解释误差」<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >扫描 / 执行算法 · 与 Seq Scan / Index Scan / Bitmap Scan 的问题定义不同<\/text><text x=\"24\" y=\"80\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"2\" opacity=\"1\" >旧问题 · 找出满足条件的行<\/text><rect x=\"24\" y=\"92\" width=\"600\" height=\"74\" rx=\"0\" fill=\"#1E4B5A\" opacity=\"1\" /><text x=\"324\" y=\"135.8\" font-size=\"20\" fill=\"#FFFFFF\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >读完整表  →  得到精确结果<\/text><text x=\"24\" y=\"192\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >目标：正确、尽量便宜；误差为零是硬前提。<\/text><path d=\"M 640 129 L 690 129\" fill=\"none\" stroke=\"#BE653B\" stroke-width=\"2\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-acc)\"/><text x=\"720\" y=\"80\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"2\" opacity=\"1\" >新问题 · 只需要代表性子集<\/text><rect x=\"720\" y=\"92\" width=\"656\" height=\"74\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1048\" y=\"135.12\" font-size=\"18\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >按概率读部分块 / 部分行  →  样本  →  近似结果<\/text><text x=\"720\" y=\"192\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >目标：少读、快；误差边界必须能讲清楚。<\/text><line x1=\"24\" y1=\"214\" x2=\"1376\" y2=\"214\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"24\" y=\"246\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"2\" opacity=\"1\" >三笔交换 · 采样扫描的全部立论<\/text><rect x=\"24\" y=\"262\" width=\"442\" height=\"116\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"262\" width=\"442\" height=\"5\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"44\" y=\"296\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >用概率换 I/O<\/text><text x=\"44\" y=\"326\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >不再逐页逐行读全表，而是按抽样单位决定读哪些页面<\/text><text x=\"44\" y=\"356\" font-size=\"12.5\" fill=\"#89938F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >→ 前提：业务接受近似<\/text><rect x=\"482\" y=\"262\" width=\"442\" height=\"116\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"482\" y=\"262\" width=\"442\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"502\" y=\"296\" font-size=\"17\" fill=\"#BE653B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >用可解释误差换速度<\/text><text x=\"502\" y=\"326\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >接受随机误差与聚簇偏差，但必须说清来源与量级<\/text><text x=\"502\" y=\"356\" font-size=\"12.5\" fill=\"#89938F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >→ 前提：业务接受近似<\/text><rect x=\"940\" y=\"262\" width=\"442\" height=\"116\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"940\" y=\"262\" width=\"442\" height=\"5\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"960\" y=\"296\" font-size=\"17\" fill=\"#2F7A66\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >用有限样本换统计成本<\/text><text x=\"960\" y=\"326\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >ANALYZE 不追求精确分布，只求优化器够用的近似<\/text><text x=\"960\" y=\"356\" font-size=\"12.5\" fill=\"#89938F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >→ 前提：业务接受近似<\/text><rect x=\"24\" y=\"390\" width=\"1352\" height=\"30\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"700\" y=\"410.1\" font-size=\"15\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >一句话：采样扫描不是精确扫描的低价替代品，而是另一种问题定义。<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "立论 · 三条边界", "title": "先说清楚它不能干什么", "lede": "不是通用加速手段、误差必须能解释、抽样单位决定 I/O 与偏差来源 —— 三条边界立住，后面的机制才有意义。", "caption": "图 03　三条边界与一条红线：不能用于「必须保证包含某类行」的需求。", "bridge": "边界清楚了，我们把镜头拉开，看看 PostgreSQL 里到底有哪几条路通向采样。", "notes": "所以先立三条边界。第一，采样扫描适合近似、探索和建统计，不适合账务结算、审计、唯一性证明、稀有异常发现——除非你能证明样本漏掉异常的概率可接受。第二，误差必须能解释，而且要分两类：随机误差扩大样本能缓解，系统性偏差加样本也治不好，聚簇、稀有值、WHERE 的顺序都属后者。第三，也是最容易被忽略的，抽样单位决定 I/O 和偏差来源：单位是页面，就少读页但行成片；单位是行位置，行独立了，可页面还是得全读。很多工程事故，就是把块级概率当成行级概率。底下我还画了一条红线：不能用在「必须保证包含某类行」的需求上。举个最能说明问题的例子，「随机抽一些可疑订单人工审核」和「找出所有可疑订单」，听起来只差几个字，前者要的是漏检概率，后者用采样就是错工具。边界划好了，我们来看全景。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >三条边界先立住，后面所有机制才有意义<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >边界一：不是通用加速　边界二：误差要能解释　边界三：抽样单位决定一切<\/text><rect x=\"24\" y=\"58\" width=\"442\" height=\"286\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"58\" width=\"442\" height=\"6\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"48\" y=\"96\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"2\" opacity=\"1\" >边界一<\/text><text x=\"48\" y=\"130\" font-size=\"21\" fill=\"#1B2B33\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >不是精确扫描的低价替代<\/text><line x1=\"48\" y1=\"150\" x2=\"442\" y2=\"150\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"48\" y=\"171\" width=\"6\" height=\"6\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"66\" y=\"182\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >适合：近似、探索、建统计<\/text><rect x=\"48\" y=\"219\" width=\"6\" height=\"6\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"66\" y=\"230\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >不适合：账务结算、审计、唯一性证明<\/text><rect x=\"48\" y=\"267\" width=\"6\" height=\"6\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"66\" y=\"278\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >例外：能证明「漏掉异常的概率可接受」<\/text><rect x=\"482\" y=\"58\" width=\"442\" height=\"286\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"482\" y=\"58\" width=\"442\" height=\"6\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"506\" y=\"96\" font-size=\"13\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"2\" opacity=\"1\" >边界二<\/text><text x=\"506\" y=\"130\" font-size=\"21\" fill=\"#1B2B33\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >误差必须可解释<\/text><line x1=\"506\" y1=\"150\" x2=\"900\" y2=\"150\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"506\" y=\"171\" width=\"6\" height=\"6\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"524\" y=\"182\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >随机误差：扩大样本可缓解<\/text><rect x=\"506\" y=\"219\" width=\"6\" height=\"6\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"524\" y=\"230\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >系统性偏差：加样本也治不好<\/text><rect x=\"506\" y=\"267\" width=\"6\" height=\"6\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"524\" y=\"278\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >聚簇、稀有值、WHERE 顺序都属后者<\/text><rect x=\"940\" y=\"58\" width=\"442\" height=\"286\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"940\" y=\"58\" width=\"442\" height=\"6\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"964\" y=\"96\" font-size=\"13\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"2\" opacity=\"1\" >边界三<\/text><text x=\"964\" y=\"130\" font-size=\"21\" fill=\"#1B2B33\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >抽样单位决定 I/O 与偏差<\/text><line x1=\"964\" y1=\"150\" x2=\"1358\" y2=\"150\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"964\" y=\"171\" width=\"6\" height=\"6\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"982\" y=\"182\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >单位是 block：少读页，行成片<\/text><rect x=\"964\" y=\"219\" width=\"6\" height=\"6\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"982\" y=\"230\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >单位是 tuple offset：行独立，仍读全页<\/text><rect x=\"964\" y=\"267\" width=\"6\" height=\"6\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"982\" y=\"278\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >很多事故来自把块级概率当成行级概率<\/text><rect x=\"24\" y=\"356\" width=\"1352\" height=\"58\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"44\" y=\"382\" font-size=\"18\" fill=\"#BE653B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >红线 · 不能用于「必须保证包含某类行」的需求<\/text><text x=\"44\" y=\"404\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >「随机抽一些可疑订单人工审核」要先明确漏检概率；「找出所有可疑订单」用采样就是错工具。<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "全景 · 两条主路径", "title": "一个底层，两个出口", "lede": "用户查询走 TABLESAMPLE / SampleScan，把样本行返回给人；统计信息走 ANALYZE，把样本行喂给优化器统计计算。", "caption": "图 04　两条主路径与四层公共调用链；横带由上至下颜色渐深。依据原文图 1 重绘。", "bridge": "两条路在上层分叉，往下却落在同一套表访问逻辑里，先拆离用户最近的那条。", "notes": "PostgreSQL 里采样有两条主路径。上面这条是你写的查询：SELECT ... FROM t TABLESAMPLE ...，计划节点是 SampleScan，样本行返回给用户。下面这条是 ANALYZE，内部走 acquire_sample_rows() 抽行，构造 pg_statistic、直方图、MCV、相关性这些统计信息，样本不返回给任何人，是喂给优化器的。目标完全不同，但它们往下走的是同一套东西：Table Access Method 的采样接口、heap 页面访问、检查 line pointer 和 MVCC 可见性，最后才把可见行交付上去。这张图我特意画成分层横带，从采样接口一路走到可见行交付，四层就是一次采样调用发生的顺序；地层剖面的母题到最后一页还会回来。理解了这个结构，你会明白一件事：采样方法其实没权力决定「哪一行真的能返回」，它只能提出候选，可见性这关始终在内核手里。既然两条路在表层分叉，我们先从离用户最近、也最容易写错的那条开始，看 TABLESAMPLE 到底在什么位置执行。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >两条主路径，一个共同底层：读页面、查可见性、交付可见行<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >图 1 · 依据原文「采样扫描的两条主路径」重绘<\/text><rect x=\"24\" y=\"60\" width=\"636\" height=\"76\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"44\" y=\"91.85\" font-size=\"15\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >路径 A · 用户查询　SELECT ... FROM t TABLESAMPLE ...<\/text><text x=\"44\" y=\"114.35\" font-size=\"15\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >计划节点 SampleScan　→　把样本行返回给用户<\/text><rect x=\"716\" y=\"60\" width=\"660\" height=\"76\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1\" opacity=\"1\" /><text x=\"736\" y=\"91.85\" font-size=\"15\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >路径 B · 统计信息　ANALYZE → acquire_sample_rows()<\/text><text x=\"736\" y=\"114.35\" font-size=\"15\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >样本行喂给统计计算　→　写入 pg_statistic<\/text><path d=\"M 342 136 L 342 176 L 700 176\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"2\" stroke-linejoin=\"miter\"/><path d=\"M 1046 136 L 1046 176 L 700 176\" fill=\"none\" stroke=\"#AE8A3E\" stroke-width=\"2\" stroke-linejoin=\"miter\"/><path d=\"M 700 176 L 700 198\" fill=\"none\" stroke=\"#46585F\" stroke-width=\"2\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-ink)\"/><text x=\"716\" y=\"170\" font-size=\"12.5\" fill=\"#89938F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >汇合于表访问层<\/text><rect x=\"24\" y=\"206\" width=\"1352\" height=\"44\" rx=\"0\" fill=\"#EBF1EE\" opacity=\"1\" /><text x=\"44\" y=\"234\" font-size=\"16\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >Table Access Method<\/text><text x=\"360\" y=\"234\" font-size=\"14\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"0.9\" >统一的 scan_sample_next_block / next_tuple 接口<\/text><text x=\"1330\" y=\"234\" font-size=\"13\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"end\" letter-spacing=\"0\" opacity=\"1\" >①<\/text><rect x=\"24\" y=\"254\" width=\"1352\" height=\"44\" rx=\"0\" fill=\"#A4C4C6\" opacity=\"1\" /><text x=\"44\" y=\"282\" font-size=\"16\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >heap 页面访问<\/text><text x=\"360\" y=\"282\" font-size=\"14\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"0.9\" >读页面 → 检查 line pointer → 判断 MVCC 可见性<\/text><text x=\"1330\" y=\"282\" font-size=\"13\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"end\" letter-spacing=\"0\" opacity=\"1\" >②<\/text><rect x=\"24\" y=\"302\" width=\"1352\" height=\"44\" rx=\"0\" fill=\"#47808D\" opacity=\"1\" /><text x=\"44\" y=\"330\" font-size=\"16\" fill=\"#FFFFFF\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >可见行交付<\/text><text x=\"360\" y=\"330\" font-size=\"14\" fill=\"#FFFFFF\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"0.9\" >采样方法给出的 offset 只是候选，不保证存在或可见<\/text><text x=\"1330\" y=\"330\" font-size=\"13\" fill=\"#FFFFFF\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"end\" letter-spacing=\"0\" opacity=\"1\" >③<\/text><rect x=\"24\" y=\"350\" width=\"1352\" height=\"44\" rx=\"0\" fill=\"#1E4B5A\" opacity=\"1\" /><text x=\"44\" y=\"378\" font-size=\"16\" fill=\"#FFFFFF\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >上层消费者<\/text><text x=\"360\" y=\"378\" font-size=\"14\" fill=\"#FFFFFF\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"0.9\" >用户查询结果 / compute_scalar_stats() 等统计计算<\/text><text x=\"1330\" y=\"378\" font-size=\"13\" fill=\"#FFFFFF\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"end\" letter-spacing=\"0\" opacity=\"1\" >④<\/text><text x=\"24\" y=\"414\" font-size=\"13.5\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >四层从上到下是调用发生的顺序；两条路径只在上层目标不同，往下走的是同一套页面与可见性逻辑。<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "语法层 · 顺序决定语义", "title": "采样发生在 WHERE 之前", "lede": "官方文档写得很直白：TABLESAMPLE 放在 table_name 之后，采样先于任何 WHERE 过滤条件。", "caption": "图 05　可交互演示：调整采样率、rare 分布与 seed，播放或单步观察「先采样、后过滤」（示意模型，非实测、非 PostgreSQL RNG）。", "bridge": "知道了顺序，再看执行计划：这可不是给普通扫描套一层随机函数。", "notes": "这一页值得停下来玩一下。SQL 里 TABLESAMPLE 写在表名后面，执行顺序是：先从表里按采样方法选出候选行，再应用 WHERE，最后才投影和聚合。所以 SELECT count(*) FROM t TABLESAMPLE SYSTEM(1) 再过滤 rare，绝对不是「从 rare 行里抽百分之一」，而是「先从整张表抽样，再在里面找 rare」。图里我用二十四行做了一个确定性示意模型，橙框是 rare 行，深靛是采样选中的候选。你可以调采样率、改 rare 分布、换 seed，然后点播放或者一格格单步：先看采样阶段选中了谁，再看 WHERE 阶段能留下谁。很多时候你会看到样本里一个 rare 都没有，count 直接是零。这不是 bug，这就是语义。要强调一句，这个演示只讲「先采样、后过滤」的顺序，不区分块级和行级抽样单位，格子数和命中规则都是设定的示意值，不是实测，也不是 PostgreSQL 的随机数发生器。那么问题来了：这么一条语义特别的查询，执行器会怎么对待它？", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >采样发生在 WHERE 之前 —— 这一条决定了一半的误用<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >官方文档 ref/select.sgml · TABLESAMPLE 放在 table_name 之后，先于任何过滤条件<\/text><rect x=\"24\" y=\"58\" width=\"1352\" height=\"46\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"40\" y=\"87\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >SELECT count(*) FROM t<\/text><text x=\"302\" y=\"87\" font-size=\"13.5\" fill=\"#BE653B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >TABLESAMPLE SYSTEM (p)<\/text><text x=\"552\" y=\"87\" font-size=\"13.5\" fill=\"#245A6B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >WHERE status = 'rare'<\/text><text x=\"790\" y=\"87\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >;<\/text><rect x=\"1010\" y=\"68\" width=\"350\" height=\"26\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1185\" y=\"85.08\" font-size=\"12\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >① 采样　→　② 过滤　→　③ 聚合<\/text><rect x=\"24\" y=\"116\" width=\"318\" height=\"44\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"36\" y=\"136\" font-size=\"13.5\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >FROM · 全表<\/text><text x=\"36\" y=\"153\" font-size=\"11.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >24 行示意<\/text><path d=\"M 342 138 L 372 138\" fill=\"none\" stroke=\"#89938F\" stroke-width=\"1.5\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-muted)\"/><rect x=\"372\" y=\"116\" width=\"318\" height=\"44\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\ 6\" font-size=\"14\" fill=\"#BE653B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >关键推论：如果 rare 很稀有，样本里可能一个都没有，WHERE 直接返回 0 行。<\/text><rect x=\"1246\" y=\"20\" width=\"140\" height=\"22\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1316\" y=\"34.91\" font-size=\"11.5\" fill=\"#AE8A3E\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >示意 · 非实测<\/text><\/svg>", "ctrl": "<label>采样率 p%<\/label><input type=\"range\" id=\"w-p\" min=\"5\" max=\"50\" step=\"5\" value=\"15\"><label>rare 分布<\/label><select id=\"w-rare\"><option value=\"cluster\" selected>集中在两行<\/option><option value=\"spread\">分散在四行<\/option><\/select><label>seed<\/label><select id=\"w-seed\"><option value=\"1\">1<\/option><option value=\"2\">2<\/option><option value=\"3\">3<\/option><option value=\"4\">4<\/option><\/select><button class=\"btn play\" id=\"w-play\">▶ 播放<\/button><button class=\"btn\" id=\"w-step\">单步 →<\/button><button class=\"btn\" id=\"w-reset\">重置<\/button><span class=\"out\" id=\"w-out\"><\/span>"}, {"eyebrow": "计划层 · 独立计划节点", "title": "SampleScan 不是语法糖", "lede": "它不是 Seq Scan 加 random()，而是从优化器就单独定型的一条路径：估算、 costing、建计划、执行，各有专属入口。", "caption": "图 06　五个源码节点与各自职责；EXPLAIN 里会显示 Sample Scan。", "bridge": "既然是一个独立节点，它凭什么可扩展？答案在一组回调接口。", "notes": "很多人以为 TABLESAMPLE 不过是优化器在普通扫描上加了个随机过滤，其实不是。顺着源码走一遍就清楚：allpaths.c 里的 set_tablesample_rel_size() 先调用采样方法估算会访问多少页、返回多少行，set_tablesample_rel_pathlist() 只考虑 SampleScan 这一条路径；pathnode.c 的 create_samplescan_path() 创建 T_SampleScan path；costsize.c 的 cost_samplescan() 专门算它的成本；createplan.c 生成计划节点；最后 nodeSamplescan.c 里的 ExecSampleScan()、tablesample_init()、tablesample_getnext() 驱动执行。五个环节，一个都不省。这也解释了一个很实用的观察：你在 EXPLAIN 里看到的是 Sample Scan，不是 Seq Scan。所以后面我们讨论 I/O 的时候，千万不要拿普通顺序扫描的直觉往上套——成本模型、页面访问方式，从计划阶段就已经不同了。那优化器凭什么能这么放心地把「怎么抽」交给别人？因为它和采样方法之间有一份很清楚的契约。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >SampleScan 是独立扫描节点，不是 Seq Scan + random() 的语法糖<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >src/backend/optimizer/* · src/backend/executor/nodeSamplescan.c<\/text><text x=\"24\" y=\"76\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"2\" opacity=\"1\" >计划阶段 → 执行阶段 · 五个源码节点<\/text><rect x=\"24\" y=\"90\" width=\"1352\" height=\"54\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"90\" width=\"5\" height=\"54\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><rect x=\"38\" y=\"101\" width=\"196\" height=\"32\" rx=\"0\" fill=\"#F1EFE9\" opacity=\"1\" /><text x=\"136\" y=\"121.25\" font-size=\"12.5\" fill=\"#245A6B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >allpaths.c<\/text><text x=\"250\" y=\"114\" font-size=\"13.5\" fill=\"#1B2B33\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >set_tablesample_rel_size() / set_tablesample_rel_pathlist()<\/text><text x=\"250\" y=\"134\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >估算页数与行数；只考虑 SampleScan 路径<\/text><text x=\"1330\" y=\"123\" font-size=\"16\" fill=\"#245A6B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"end\" letter-spacing=\"0\" opacity=\"1\" >01<\/text><rect x=\"24\" y=\"150\" width=\"1352\" height=\"54\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"150\" width=\"5\" height=\"54\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><rect x=\"38\" y=\"161\" width=\"196\" height=\"32\" rx=\"0\" fill=\"#F1EFE9\" opacity=\"1\" /><text x=\"136\" y=\"181.25\" font-size=\"12.5\" fill=\"#245A6B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >pathnode.c<\/text><text x=\"250\" y=\"174\" font-size=\"13.5\" fill=\"#1B2B33\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >create_samplescan_path()<\/text><text x=\"250\" y=\"194\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >创建 T_SampleScan path<\/text><text x=\"1330\" y=\"183\" font-size=\"16\" fill=\"#245A6B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"end\" letter-spacing=\"0\" opacity=\"1\" >02<\/text><rect x=\"24\" y=\"210\" width=\"1352\" height=\"54\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"210\" width=\"5\" height=\"54\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><rect x=\"38\" y=\"221\" width=\"196\" height=\"32\" rx=\"0\" fill=\"#F1EFE9\" opacity=\"1\" /><text x=\"136\" y=\"241.25\" font-size=\"12.5\" fill=\"#BE653B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >costsize.c<\/text><text x=\"250\" y=\"234\" font-size=\"13.5\" fill=\"#1B2B33\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >cost_samplescan()<\/text><text x=\"250\" y=\"254\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >按 NextSampleBlock 有无区分随机页 / 顺序页成本<\/text><text x=\"1330\" y=\"243\" font-size=\"16\" fill=\"#BE653B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"end\" letter-spacing=\"0\" opacity=\"1\" >03<\/text><rect x=\"24\" y=\"270\" width=\"1352\" height=\"54\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"270\" width=\"5\" height=\"54\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><rect x=\"38\" y=\"281\" width=\"196\" height=\"32\" rx=\"0\" fill=\"#F1EFE9\" opacity=\"1\" /><text x=\"136\" y=\"301.25\" font-size=\"12.5\" fill=\"#245A6B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >createplan.c<\/text><text x=\"250\" y=\"294\" font-size=\"13.5\" fill=\"#1B2B33\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >create_samplescan_plan() / make_samplescan()<\/text><text x=\"250\" y=\"314\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >生成 SampleScan 计划节点<\/text><text x=\"1330\" y=\"303\" font-size=\"16\" fill=\"#245A6B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"end\" letter-spacing=\"0\" opacity=\"1\" >04<\/text><rect x=\"24\" y=\"330\" width=\"1352\" height=\"54\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"330\" width=\"5\" height=\"54\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><rect x=\"38\" y=\"341\" width=\"196\" height=\"32\" rx=\"0\" fill=\"#F1EFE9\" opacity=\"1\" /><text x=\"136\" y=\"361.25\" font-size=\"12.5\" fill=\"#2F7A66\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >nodeSamplescan.c<\/text><text x=\"250\" y=\"354\" font-size=\"13.5\" fill=\"#1B2B33\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >ExecSampleScan() / tablesample_init() / tablesample_getnext()<\/text><text x=\"250\" y=\"374\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >驱动执行：反复取候选 block 与 tuple<\/text><text x=\"1330\" y=\"363\" font-size=\"16\" fill=\"#2F7A66\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"end\" letter-spacing=\"0\" opacity=\"1\" >05<\/text><rect x=\"24\" y=\"398\" width=\"1352\" height=\"26\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"40\" y=\"416\" font-size=\"13.5\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >结论：采样语义从优化器就开始定型；EXPLAIN 里会看到 Sample Scan，而不是 Seq Scan。<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "API 层 · 六回调契约", "title": "内核搭台，方法只管选", "lede": "TsmRoutine 定义在 tsmapi.h：内核负责计划、执行框架、表访问与 MVCC；方法只回答「哪些块、哪些 offset」。", "caption": "图 07　六个回调及分工；两个「可空」回调埋着整篇最关键的分水岭。", "bridge": "契约定好了，我们把一次真实的执行从头到尾走一遍。", "notes": "这份契约叫 TsmRoutine，在 src/include/access/tsmapi.h。一共六个回调：计划阶段 SampleScanGetSampleSize 估页数和行数；执行器启动时 InitSampleScan 初始化方法私有状态；真正开扫前 BeginSampleScan 算参数、seed、cutoff 和访问策略；然后 NextSampleBlock 选下一个采样块，NextSampleTuple 在当前块里选下一个候选 offset；最后 EndSampleScan 释放外部资源。分工特别干净：生成计划节点、驱动执行器、读页面、检查 line pointer、判断 MVCC 可见性、把可见行向上交付，全是内核的活；采样方法只管两件事，哪些块是候选、块里哪些 offset 是候选。这就是为什么采样扫描可扩展——你可以装 contrib 里的新方法，甚至自己写业务定制方法，不用碰执行器。请特别看那两个标成「可空」的回调，NextSampleBlock 和 EndSampleScan。尤其是 NextSampleBlock 能不能为 NULL，几乎决定了后面一半的内容。先把这份契约记在心里，我们来看一次执行是怎么流动的。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >TsmRoutine：内核搭台，采样方法只回答「哪些块、哪些 offset」<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >src/include/access/tsmapi.h · 六个回调；扩展可实现业务定制采样方法<\/text><rect x=\"24\" y=\"62\" width=\"300\" height=\"318\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"62\" width=\"300\" height=\"44\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"42\" y=\"91.2\" font-size=\"20\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >内核负责<\/text><rect x=\"42\" y=\"166.59\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"59\" y=\"173.61\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >生成 SampleScan 计划节点<\/text><rect x=\"42\" y=\"193.59\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"59\" y=\"200.61\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >驱动执行器框架<\/text><rect x=\"42\" y=\"220.59\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"59\" y=\"227.61\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >表访问方法读页面<\/text><rect x=\"42\" y=\"247.59\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"59\" y=\"254.61\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >line pointer 有效性检查<\/text><rect x=\"42\" y=\"274.59\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"59\" y=\"281.61\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >MVCC 可见性判断<\/text><rect x=\"42\" y=\"301.59\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"59\" y=\"308.61\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >把可见行向上交付<\/text><rect x=\"1076\" y=\"62\" width=\"300\" height=\"318\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"1076\" y=\"62\" width=\"300\" height=\"44\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"1094\" y=\"91.2\" font-size=\"20\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >方法负 ter\" marker-end=\"url(#arr-prim)\"/><rect x=\"720\" y=\"62\" width=\"318\" height=\"74\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"734\" y=\"92.56\" font-size=\"14\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >③ BeginSampleScan<\/text><text x=\"734\" y=\"114.96\" font-size=\"14\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >计算参数、cutoff、访问策略<\/text><rect x=\"720\" y=\"62\" width=\"318\" height=\"4\" rx=\"0\" fill=\"ACC\" opacity=\"1\" /><path d=\"M 1038 99 L 1068 99\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-prim)\"/><rect x=\"1068\" y=\"62\" width=\"318\" height=\"74\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1082\" y=\"92.79\" font-size=\"13.5\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >④ 访问策略<\/text><text x=\"1082\" y=\"114.39\" font-size=\"13.5\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >use_bulkread / use_pagemode / 同步扫描<\/text><rect x=\"1068\" y=\"62\" width=\"318\" height=\"4\" rx=\"0\" fill=\"GOLD\" opacity=\"1\" /><path d=\"M 1224 136 L 1224 158 L 24 158 L 24 180\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-prim)\"/><rect x=\"24\" y=\"186\" width=\"318\" height=\"74\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"38\" y=\"216.56\" font-size=\"14\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >⑤ next_block<\/text><text x=\"38\" y=\"238.96\" font-size=\"14\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >方法给 block；NULL 时 heap 顺序全块<\/text><rect x=\"24\" y=\"186\" width=\"318\" height=\"4\" rx=\"0\" fill=\"PRIM\" opacity=\"1\" /><path d=\"M 342 223 L 372 223\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-prim)\"/><rect x=\"372\" y=\"186\" width=\"318\" height=\"74\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"386\" y=\"216.56\" font-size=\"14\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >⑥ heap 读页面<\/text><text x=\"386\" y=\"238.96\" font-size=\"14\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >table_scan_sample_next_block()<\/text><rect x=\"372\" y=\"186\" width=\"318\" height=\"4\" rx=\"0\" fill=\"PRIM\" opacity=\"1\" /><path d=\"M 690 223 L 720 223\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-prim)\"/><rect x=\"720\" y=\"186\" width=\"318\" height=\"74\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"734\" y=\"216.56\" font-size=\"14\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >⑦ next_tuple<\/text><text x=\"734\" y=\"238.96\" font-size=\"14\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >方法给 offset；只是候选<\/text><rect x=\"720\" y=\"186\" width=\"318\" height=\"4\" rx=\"0\" fill=\"ACC\" opacity=\"1\" /><path d=\"M 1038 223 L 1068 223\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-prim)\"/><rect x=\"1068\" y=\"186\" width=\"318\" height=\"74\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1082\" y=\"216.56\" font-size=\"14\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >⑧ 可见性判断<\/text><text x=\"1082\" y=\"238.96\" font-size=\"14\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >line pointer + MVCC；不可见则跳过<\/text><rect x=\"1068\" y=\"186\" width=\"318\" height=\"4\" rx=\"0\" fill=\"GREEN\" opacity=\"1\" /><path d=\"M 1224 260 L 1224 284 L 700 284 L 700 306\" fill=\"none\" stroke=\"#2F7A66\" stroke-width=\"2\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-green)\"/><rect x=\"360\" y=\"306\" width=\"680\" height=\"50\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" opacity=\"1\" /><text x=\"700\" y=\"336.44\" font-size=\"16\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >输出：可见样本行　→　用户查询结果 / 统计计算<\/text><text x=\"24\" y=\"388\" font-size=\"13.5\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >关键：采样方法返回的 offset 只是候选，不保证 tuple 存在，也不保证对当前快照可见。<\/text><text x=\"24\" y=\"412\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >因此死元组、HOT、页面填充状态都会影响实际返回行数 —— MVCC 从不在采样链上缺席。<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "分水岭 · 一个回调", "title": "有没有 NextSampleBlock", "lede": "方法提供这个回调，heap 就按返回的块跳着读；不提供，heap 就老老实实顺序扫完所有块。", "caption": "图 09　同一个判定把两种 I/O 形态劈开；cost_samplescan() 也据此区分随机页与顺序页成本。", "bridge": "先走「跳着读」这条，看看 SYSTEM 具体怎么抽块。", "notes": "全篇最要紧的一个判定，其实只是一个指针是不是 NULL。如果采样方法提供了 NextSampleBlock，heap AM 就按方法返回的 block 号去读页面，抽中的块不一定连续，所以 cost_samplescan() 看到它非 NULL 时按随机页成本估算，这是个合理保守的假设。如果方法没提供，heap AM 就顺序扫描全部块，成本按顺序页算。前者是 SYSTEM 的形态，后者是 BERNOULLI 的形态。注意这不只是实现差别，它直接改写了 I/O 模型：一种真的可能少读页面，另一种几乎一定读全表页面，只是少返回行。所以「SYSTEM(1) 一定快」和「BERNOULLI(1) 一定省 I/O」这两句话，都不能只从百分比推出来，得看你走的是哪条形态。我们先沿着跳着读这条，看 SYSTEM 到底把什么当成了随机单位。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >一个回调是否为 NULL，把两种采样劈成两条 I/O 形态<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >heapam_handler.c · cost_samplescan() 也按这一点区分成本模型<\/text><rect x=\"490\" y=\"60\" width=\"420\" height=\"56\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1\" opacity=\"1\" /><text x=\"700\" y=\"93.44\" font-size=\"16\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >判定：采样方法提供 NextSampleBlock 吗？<\/text><path d=\"M 700 116 L 700 142 L 350 142 L 350 166\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"2\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-prim)\"/><path d=\"M 700 116 L 700 142 L 1050 142 L 1050 166\" fill=\"none\" stroke=\"#BE653B\" stroke-width=\"2\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-acc)\"/><text x=\"370\" y=\"158\" font-size=\"13\" fill=\"#245A6B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >NULL<\/text><text x=\"1060\" y=\"158\" font-size=\"13\" fill=\"#BE653B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >非 NULL<\/text><rect x=\"24\" y=\"172\" width=\"660\" height=\"208\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"172\" width=\"660\" height=\"5\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"46\" y=\"206\" font-size=\"20\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >BERNOULLI 形态<\/text><text x=\"46\" y=\"232\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >heap AM 顺序扫描全部块<\/text><line x1=\"46\" y1=\"246\" x2=\"662\" y2=\"246\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"46\" y=\"263\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"62\" y=\"272\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >不跳块，页面 0..N 依次访问<\/text><rect x=\"46\" y=\"289\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"62\" y=\"298\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >NextSampleTuple 在每块内挑 offset<\/text><rect x=\"46\" y=\"315\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"62\" y=\"324\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >估算页数 = 全表 pages<\/text><rect x=\"46\" y=\"341\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"62\" y=\"350\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >成本按顺序页估算<\/text><rect x=\"716\" y=\"172\" width=\"660\" height=\"208\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"716\" y=\"172\" width=\"660\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"738\" y=\"206\" font-size=\"20\" fill=\"#BE653B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >SYSTEM 形态<\/text><text x=\"738\" y=\"232\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >heap AM 按方法返回的 block 读页<\/text><line x1=\"738\" y1=\"246\" x2=\"1354\" y2=\"246\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"738\" y=\"263\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"754\" y=\"272\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >跳块，只读被抽中的页面<\/text><rect x=\"738\" y=\"289\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"754\" y=\"298\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >抽中块内返回所有 offset<\/text><rect x=\"738\" y=\"315\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"754\" y=\"324\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >估算页数 = pages × samplefract<\/text><rect x=\"738\" y=\"341\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"754\" y=\"350\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >成本按随机页估算（保守）<\/text><text x=\"24\" y=\"402\" font-size=\"13.5\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >cost_samplescan() 看到 NextSampleBlock != NULL 就按随机页成本估算：抽中的块不一定连续。<\/text><text x=\"24\" y=\"422\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >这也是为什么「SYSTEM(1) 一定快」和「BERNOULLI(1) 一定省 I/O」都不能只看百分比推断。<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "SYSTEM · 块级采样", "title": "hash 的是块号，不是行", "lede": "p 转成 cutoff；对 (block number, seed) 做 hash，小于 cutoff 就抽中整个页面，块内所有 offset 都交给 heap 检查。", "caption": "图 10　system.c 的四步逻辑与页面网格示意；抽中页面的行成片进入样本。", "bridge": "省 I/O 的好处很直观，代价是样本可能根本不代表行级分布。", "notes": "SYSTEM 的实现在 src/backend/access/tablesample/system.c，四步。参数 p 必须在 0 到 100 之间；BeginSampleScan() 把百分比换算成 cutoff；NextSampleBlock() 对块号和 seed 做 hash，hash 值小于 cutoff 就抽中这个块；NextSampleTuple() 返回该块上所有 offset，让 heap AM 逐个检查可见性并返回可见行。看清楚，被 hash 的是块号。所以 SYSTEM(1) 的意思是「每个页面有百分之一的概率被抽中」，不是「每行有百分之一的概率被抽中」，块内所有可见行会一起回来。它的好处全在 I/O：system_samplescangetsamplesize() 把估算页数设成 baserel->pages 乘 samplefract，小比例时可能只读很少的页。但代价也在这里——如果表按时间写入、按租户批量导入、或者状态集中更新，一个页面上的行高度相似，抽中一页就等于抽进一整类数据。这种情况我们叫聚簇效应。下一页这个演示，建议你自己动手拨一拨。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >SYSTEM(p)：hash 的是块号，抽中就把整页行一起交出去<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >src/backend/access/tablesample/system.c · 四步逻辑<\/text><rect x=\"24\" y=\"64\" width=\"636\" height=\"58\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"38\" y=\"77\" width=\"42\" height=\"32\" rx=\"0\" fill=\"#E5EFF0\" opacity=\"1\" /><text x=\"59\" y=\"97.76\" font-size=\"14\" fill=\"#245A6B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >1<\/text><text x=\"94\" y=\"89\" font-size=\"15\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >① 参数校验<\/text><text x=\"94\" y=\"110\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anc — 样本就会有明显聚簇效应。<\/text><rect x=\"1246\" y=\"396\" width=\"140\" height=\"22\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1316\" y=\"410.91\" font-size=\"11.5\" fill=\"#AE8A3E\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >页面示意 · 非实测<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "SYSTEM 代价 · 聚簇偏差", "title": "整页抽中，偏差成片", "lede": "物理聚簇越明显，SYSTEM 样本越可能整页都是同一类；BERNOULLI 仍读全表页面，但按行独立判定，样本更接近行级分布。", "caption": "图 11　可交互演示：切换聚簇强度、采样率与 seed，对比 SYSTEM 与 BERNOULLI 的样本构成（72 格设定模型，示意 · 非实测）。", "bridge": "既然块级采样会带偏样本，那 PostgreSQL 给的另一种内置方法是怎么避开它的？", "notes": "这一页我做了个对照演示：左右各七十二个格子，十二个页面、每页六行，格子颜色代表三类数据，类别分布和 hash 规则都是设定的示意值，不是实测，也不是 PostgreSQL 的随机数发生器。左边 SYSTEM 按块整页抽，右边 BERNOULLI 按行位置独立抽。你把聚簇强度拨到「完全聚簇」，再点播放，会看到左边一旦抽中某几个块，样本里某一类的占比就严重偏离全表；右边虽然页面全都要读，格子却零散落在各类里，占比稳定得多。把聚簇强度改成「完全打散」，两边的差距又缩小了。这说明一件事：SYSTEM 省下的是 I/O，付出的是代表性；而且这个偏差是系统性的，你把采样率从百分之十提到百分之五十，它也不会自动消失。想让样本更接近行级分布，得换抽样单位，不是加样本。那 BERNOULLI 是怎么做到「判定与扫描历史无关」的？", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >聚簇偏差：SYSTEM 省下的 I/O，是用「样本代表性」换来的<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >图 3 左半 · 12 个页面 × 6 行 = 72 格，类别分布与 hash 均为设定值（示意 · 非实测）<\/text><text x=\"24\" y=\"78\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"2\" opacity=\"1\" >SYSTEM · 按块整页抽中<\/text><text x=\"716\" y=\"78\" font-s 316\" y=\"34.91\" font-size=\"11.5\" fill=\"#AE8A3E\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >示意 · 非实测<\/text><\/svg>", "ctrl": "<label>聚簇强度<\/label><select id=\"c-mode\"><option value=\"high\" selected>完全聚簇<\/option><option value=\"mid\">部分混合<\/option><option value=\"low\">完全打散<\/option><\/select><label>采样率 p%<\/label><input type=\"range\" id=\"c-p\" min=\"10\" max=\"50\" step=\"10\" value=\"20\"><label>seed<\/label><select id=\"c-seed\"><option value=\"1\">1<\/option><option value=\"2\">2<\/option><option value=\"3\">3<\/option><option value=\"4\">4<\/option><\/select><button class=\"btn play\" id=\"c-play\">▶ 播放<\/button><button class=\"btn\" id=\"c-step\">单步 →<\/button><button class=\"btn\" id=\"c-reset\">重置<\/button><span class=\"out\" id=\"c-out\"><\/span>"}, {"eyebrow": "BERNOULLI · 逐行概率", "title": "TID 与 seed 说了算", "lede": "它不提供 NextSampleBlock，heap 顺序走所有块；hash(block number, tuple offset, seed) 小于 cutoff 才抽中该 offset。", "caption": "图 12　bernoulli.c 的四步逻辑与「全页访问、零星抽中」示意；页面全部读，绿色为抽中 offset。", "bridge": "两种方法摆在一起，差别就能压成一句话了。", "notes": "BERNOULLI 在 src/backend/access/tablesample/bernoulli.c。它估算时会说「访问所有页面，但返回 tuples 乘 p 行」，因为它压根不提供 NextSampleBlock，heap AM 只能顺序走完全部块。真正的判定在 NextSampleTuple()：对块号、tuple offset 和 seed 三者做 hash，小于 cutoff 就抽中这个 offset。源码注释特意解释了为什么这么设计——为了可重复性。某个 TID 是否被选中，只取决于 TID 和 seed，跟扫描历史无关。否则同步扫描从表中间起步、关系物理扩展、关系收缩，都会让同样的查询抽出不同的样本，实验就没法复现了。这也顺带说清了代价：即使只取百分之一，通常也要把全部页面走一遍，I/O 省得有限，省下的是返回行数和上层的处理量。所以别把 BERNOULLI 理解成「更慢的 SYSTEM」，它是另一种抽样单位，为的是另一种偏差性质。把两者并排看，结论就很干净了。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >BERNOULLI(p)：hash 的是 (
