mily=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >可重复性：某个 TID 是否被选中，只取决于 TID 与 seed。<\/text><text x=\"44\" y=\"394\" font-size=\"12.8\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >因此同步扫描、物理扩展、关系收缩都不会破坏可重复性；代价是低采样比例时也不一定省 I/O。<\/text><rect x=\"1246\" y=\"20\" width=\"140\" height=\"22\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1316\" y=\"34.91\" font-size=\"11.5\" fill=\"#AE8A3E\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >示意 · 非实测<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "抽样单位 · 两法对照", "title": "差别全长在单位上", "lede": "随机单位、访问页面、返回行数、聚簇敏感度、I/O 收益、主要风险 —— 逐项摆平之后，只剩一句话。", "caption": "图 13　SYSTEM 与 BERNOULLI 的九项对照；依据原文图 3 重绘。", "bridge": "两种内置方法之外，还有别的取样本办法，也一起摆上桌。", "notes": "把两种方法并排摆平：SYSTEM 的随机单位是页面，读抽中的部分页，返回行数由抽中页的可见行密度决定，小比例时可能显著省 I/O，但对物理聚簇高度敏感，风险是样本成片出现。BERNOULLI 的随机单位是 tuple offset，通常访问所有页面，返回行数更接近 tuples 乘 p，聚簇敏感度低，风险是你以为百分之一就只读百分之一的页。两者都支持 REPEATABLE。你会发现，这九行差别全是从第一行「随机单位」长出来的，没有一条是孤立的。所以横向比较的时候，核心问题从来不是「哪个更好」，而是「抽样的单位是什么」。单位定了，I/O、误差、偏差来源就都定了。明白这一点，再看原文那张五路径对比表，就不会被一堆形容词绕晕。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >两种方法并排看：差别全部从「抽样单位」长出来<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >图 3 · SYSTEM 与 BERNOULLI 采样差异（依 nt-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >快速预览、块级质检、近似扫描<\/text><rect x=\"840\" y=\"328\" width=\"560\" height=\"34\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"849\" y=\"346.716\" font-size=\"13.2\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >行级抽样分析、聚簇敏感分析<\/text><rect x=\"24\" y=\"362\" width=\"260\" height=\"34\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"33\" y=\"380.716\" font-size=\"13.2\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >主要风险<\/text><rect x=\"284\" y=\"362\" width=\"556\" height=\"34\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"293\" y=\"380.716\" font-size=\"13.2\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >把块级概率误读为行级概率<\/text><rect x=\"840\" y=\"362\" width=\"560\" height=\"34\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"849\" y=\"380.716\" font-size=\"13.2\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >以为 1% 就一定只读 1% 的页<\/text><text x=\"24\" y=\"418\" font-size=\"14\" fill=\"#BE653B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >核心不是「哪个更快」，而是「抽样的单位是什么」：单位决定 I/O、误差、偏差来源。<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "横向 · 五种路径", "title": "先看单位，再看代价", "lede": "把 SYSTEM、BERNOULLI、ANALYZE 内部采样、ORDER BY random() 和全表扫描放在一起，比较目标、单位、页面、聚簇与可重复性。", "caption": "图 14　五种路径的七维对照（依据原文横向对比表压缩重排）。", "bridge": "表里还有两个容易被误用的 contrib 方法，单独拎出来说清楚。", "notes": "这张表别急着背，抓住一条主线：抽样单位。SYSTEM 是 block，BERNOULLI 是 tuple offset，ANALYZE 是 block 加行蓄水池，ORDER BY random() 是 row，全表扫描没有采样。单位一变，后面全变：SYSTEM 读部分页、聚簇敏感、结果不精确；BERNOULLI 读全部页、聚簇不敏感、结果也不精确；ANALYZE 抽 block 但压根不返回用户结果，它产出统计；ORDER BY random() 语义上更接近「从全表行里随机取固定 n 行」，代价是全表读加排序或 Top-N；全表扫描慢，但语义最明确。可重复性那一栏也有意思：内置两种方法支持 REPEATABLE，ANALYZE 默认不要求，全表扫描天然确定。我特别想让你记住表底那句：很多工程事故都来自把块级概率误解成行级概率。除了这两个内置方法，PostgreSQL 还带了两个 contrib 方法，它们的边界更容易被踩。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >五种路径横向对比：先看抽样单位，再看代价<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >依据原文「横向对比」表压缩重排 · 结论：没有「哪个更好」，只有语义是否匹配<\/text><rect x=\"24\" y=\"58\" width=\"190\" height=\"40\" rx=\"0\" fill=\"#245A6B\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"34\" y=\"79.69\" font-size=\"13\" fill=\"#FFFFFF\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >维度<\/text><rect x=\"214\" y=\"58\" width=\"236\" height=\"40\" rx=\"0\" fill=\"#245A6B\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"224\" y=\"79.69\" font-size=\"13\" fill=\"#FFFFFF\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >SYSTEM<\/text><rect x=\"450\" y=\"58\" width=\"236\" heigh acity=\"1\" /><text x=\"696\" y=\"279.586\" font-size=\"12.2\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >默认不要求<\/text><rect x=\"932\" y=\"258\" width=\"246\" height=\"40\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"942\" y=\"279.586\" font-size=\"12.2\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >取决于 seed / 执行<\/text><rect x=\"1178\" y=\"258\" width=\"222\" height=\"40\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1188\" y=\"279.586\" font-size=\"12.2\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >是<\/text><rect x=\"24\" y=\"298\" width=\"190\" height=\"40\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"34\" y=\"319.586\" font-size=\"12.2\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >结果是否精确<\/text><rect x=\"214\" y=\"298\" width=\"236\" height=\"40\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"224\" y=\"319.586\" font-size=\"12.2\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >否<\/text><rect x=\"450\" y=\"298\" width=\"236\" height=\"40\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"460\" y=\"319.586\" font-size=\"12.2\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >否<\/text><rect x=\"686\" y=\"298\" width=\"246\" height=\"40\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"696\" y=\"319.586\" font-size=\"12.2\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >不直接返回用户结果<\/text><rect x=\"932\" y=\"298\" width=\"246\" height=\"40\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"942\" y=\"319.586\" font-size=\"12.2\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >只返回随机 n 行<\/text><rect x=\"1178\" y=\"298\" width=\"222\" height=\"40\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1188\" y=\"319.586\" font-size=\"12.2\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >是<\/text><rect x=\"24\" y=\"338\" width=\"190\" height=\"40\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"34\" y=\"359.586\" font-size=\"12.2\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >主要风险<\/text><rect x=\"214\" y=\"338\" width=\"236\" height=\"40\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"224\" y=\"359.586\" font-size=\"12.2\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >样本成片出现<\/text><rect x=\"450\" y=\"338\" width=\"236\" height=\"40\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"460\" y=\"359.586\" font-size=\"12.2\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >I/O 不省<\/text><rect x=\"686\" y=\"338\" width=\"246\" height=\"40\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"696\" y=\"359.586\" font-size=\"12.2\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >统计抖动 / 稀有值低估<\/text><rect x=\"932\" y=\"338\" width=\"246\" height=\"40\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"942\" y=\"359.586\" font-size=\"12.2\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >大表代价高<\/text><rect x=\"1178\" y=\"338\" width=\"222\" height=\"40\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1188\" y=\"359.586\" font-size=\"12.2\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >慢但语义明确<\/text><rect x=\"24\" y=\"388\" width=\"1352\" height=\"30\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"700\" y=\"407.76\" font-size=\"14\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >很多工程事故都来自把块级概率误解成行级概率 —— SYSTEM(1) 不保证返回正好 1% 行。<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "扩展方法 · 工程方便", "title": "方便不等于统计证明", "lede": "tsm_system_rows 按目标行数、tsm_system_time 按时间预算，底层仍是块级推进，文档都明确说不支持 REPEATABLE。", "caption": "图 15　两个 contrib 方法的参数、块级本质、可重复性标志与用途边界。", "bridge": "用户查询这条线讲完了，现在转到底下那条：ANALYZE 拿样本去干什么。", "notes": "两个 contrib 方法值得单独说，因为它们的名字特别容易让人误会。tsm_system_rows 给的是「最多返回 n 行」，听起来像行级样本，其实底层仍按随机块推进，还是块级采样，表可见行不足 n 时就把全表返回。tsm_system_time 给的是「最多花 ms 毫秒读表」，样本大小取决于这段时间读到了多少，更难预测。两者都受块级聚簇影响，文档也都明说不支持 REPEATABLE 子句；源码里的标志更细，system_rows 是 repeatable_across_queries 为 false、across_scans 为 true，system_time 两个都是 false。所以定位很清楚：工程上方便，快速预览可以用，不能直接拿去当统计证明，也别对它们误用 REPEATABLE。到这里，用户查询这条线基本讲完了，我们掉头去看底下那条线——ANALYZE 抽了样本之后，到底拿它做什么。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >两个 contrib 方法：工程方便，但不是严格均匀随机样本<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >tsm_system_rows.sgml / tsm_system_time.sgml · 均不支持 REPEATABLE 子句<\/text><rect x=\"24\" y=\"62\" width=\"666\" height=\"286\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"62\" width=\"666\" height=\"50\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"44\" y=\"94\" font-size=\"19\" fill=\"#FFFFFF\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >SYSTEM_ROWS(n)<\/text><text x=\"44\" y=\"132\" font-size=\"16\" fill=\"#1B2B33\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >按目标行数返回样本<\/text><rect x=\"44\" y=\"157\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"60\" y=\"166\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >参数：最多读取 n 行<\/text><rect x=\"44\" y=\"187\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"60\" y=\"196\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >底层仍按随机块推进，仍是块级采样<\/text><rect x=\"44\" y=\"217\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"60\" y=\"226\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >表可见行不足 n 时返回全部<\/text><rect x=\"44\" y=\"247\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"60\" y=\"256\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >repeatable_across_queries = false<\/text><rect x=\"44\" y=\"277\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"60\" y=\"286\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >repeatable_across_scans = true<\/text><rect x=\"44\" y=\"318\" width=\"626\" height=\"24\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1\" opacity=\"1\" /><text x=\"56\" y=\"335\" font-size=\"12.5\" fill=\"#AE8A3E\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >文档：不支持 REPEATABLE<\/text><rect x=\"714\" y=\"62\" width=\"666\" height=\"286\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"714\" y=\"62\" width=\"666\" height=\"50\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"734\" y=\"94\" font-size=\"19\" fill=\"#FFFFFF\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >SYSTEM_TIME(ms)<\/text><text x=\"734\" y=\"132\" font-size=\"16\" fill=\"#1B2B33\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >按时间预算返回样本<\/text><rect x=\"734\" y=\"157\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"750\" y=\"166\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >参数：最多花 ms 毫秒读表<\/text><rect x=\"734\" y=\"187\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"750\" y=\"196\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >样本大小难以预测，取决于读到的行数<\/text><rect x=\"734\" y=\"217\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"750\" y=\"226\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >同样受块级聚簇影响<\/text><rect x=\"734\" y=\"247\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"750\" y=\"256\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >repeatable_across_queries = false<\/text><rect x=\"734\" y=\"277\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"750\" y=\"286\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >repeatable_across_scans = false<\/text><rect x=\"734\" y=\"318\" width=\"626\" height=\"24\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1\" opacity=\"1\" /><text x=\"746\" y=\"335\" font-size=\"12.5\" fill=\"#AE8A3E\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >文档：不支持 REPEATABLE<\/text><rect x=\"24\" y=\"362\" width=\"1352\" height=\"46\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"700\" y=\"390.1\" font-size=\"15\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >用途边界：快速预览可以，不能直接当统计证明；对扩展方法误用 REPEATABLE 是常见坑。<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "ANALYZE · 目标不同", "title": "样本是给优化器的原料", "lede": "acquire_sample_rows() 抽出的样本不返回用户，而是按物理位置排序后，交给 compute_scalar_stats() 等函数算统计。", "caption": "图 16　从 targrows 到 pg_statistic 的完整流水线；依据原文图 4 前半重绘。", "bridge": "那这些样本行是怎么被挑出来的？源码给了一套两阶段方法。", "notes": "先摆清目标。ANALYZE 抽样本，不是为了给你看几行数据，是为了算统计。入口在 src/backend/commands/analyze.c 的 acquire_sample_rows()。样本量 targrows 不是拍脑袋来的，由列的 minrows、统计目标、索引表达式、扩展统计共同决定。抽出来的样本行最后还会按物理位置排序，用来估计相关性。之后交给 compute_scalar_stats() 这类函数，生成 MCV、直方图、空值比例、平均宽度、distinct 估计，以及物理和逻辑相关性，写进 pg_statistic，优化器再拿这些值去估选择率、在 index scan、bitmap scan、seq scan 之间做选择。所以这条线的评价标准跟 TABLESAMPLE 完全不同：它追求的是「对优化器够用」，不是「样本对用户可解释」。想通这一层，后面源码里那个看起来有点别扭的折中，你就能接受了。先看它怎么抽。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >ANALYZE 不返回样本：样本行是喂给优化器的原料<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >src/backend/commands/analyze.c · acquire_sample_rows() → compute_scalar_stats() 等<\/text><text x=\"24\" y=\"78\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"2\" opacity=\"1\" >输入 · 决定样本量<\/text><rect x=\"24\" y=\"92\" width=\"300\" height=\"112\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"40\" y=\"130.36\" font-size=\"14\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >targrows 由四项决定<\/text><text x=\"40\" y=\"152.76\" font-size=\"14\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >列 minrows / 统计目标<\/text><text x=\"40\" y=\"175.16\" font-size=\"14\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >索引表达式 / 扩展统计<\/text><path d=\"M 324 148 L 352 148\" fill=\"none\" stroke=\" () 等函数<\/text><text x=\"812\" y=\"152.76\" font-size=\"14\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >MCV / 直方图 / 空值比例 / 平均宽度<\/text><text x=\"812\" y=\"175.16\" font-size=\"14\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >distinct 估计 / 物理与逻辑相关性<\/text><line x1=\"24\" y1=\"226\" x2=\"1376\" y2=\"226\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"24\" y=\"258\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"2\" opacity=\"1\" >输出 · pg_statistic / pg_stats<\/text><rect x=\"24\" y=\"272\" width=\"258\" height=\"66\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"38\" y=\"298\" font-size=\"12.8\" fill=\"#245A6B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >most_common_vals<\/text><text x=\"38\" y=\"322\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >高频值列表<\/text><rect x=\"296\" y=\"272\" width=\"258\" height=\"66\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"310\" y=\"298\" font-size=\"12.8\" fill=\"#245A6B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >histogram_bounds<\/text><text x=\"310\" y=\"322\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >分布直方图<\/text><rect x=\"568\" y=\"272\" width=\"258\" height=\"66\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"582\" y=\"298\" font-size=\"12.8\" fill=\"#245A6B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >null_frac<\/text><text x=\"582\" y=\"322\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >空值比例<\/text><rect x=\"840\" y=\"272\" width=\"258\" height=\"66\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"854\" y=\"298\" font-size=\"12.8\" fill=\"#245A6B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >n_distinct<\/text><text x=\"854\" y=\"322\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >不同值估计<\/text><rect x=\"1112\" y=\"272\" width=\"258\" height=\"66\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1126\" y=\"298\" font-size=\"12.8\" fill=\"#245A6B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >correlation<\/text><text x=\"1126\" y=\"322\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >物理 / 逻辑相关性<\/text><rect x=\"24\" y=\"350\" width=\"1352\" height=\"54\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"44\" y=\"374\" font-size=\"15\" fill=\"#1B2B33\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >优化器用这些近似值估选择率、选 index / bitmap / seq scan。<\/text><text x=\"44\" y=\"395\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >所以统计采样追求的是「对优化器够用」，不是「样本对用户可解释」。<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "ANALYZE · 两阶段采样", "title": "Knuth S 选块，Vitter 留行", "lede": "第一阶段用 Knuth Algorithm S 从已知总块数里抽固定数量块；第二阶段用 Vitter 蓄水池算法保留 targrows 行；两阶段同时进行。", "caption": "图 17　可交互演示：调整池容量与伪随机序列，播放或单步观察「跳过 S 行 → 随机替换一个槽」（示意模型，非实测、非 PostgreSQL RNG）。", "bridge": "这套两阶段方法有个诚实的限制，源码自己写出来了。", "notes": "源码注释把两阶段说得很清楚。第一阶段，最多随机选 targrows 个 block，表块少时就全选；底层是 sampling.c 里的 BlockSampler_Init() 和 BlockSampler_Next()，用 Knuth 的 Algorithm S 从已知总块数里抽固定数量。第二阶段，扫描这些块，用 Vitter 那篇 1985 年 Random Sampling with a Reservoir 的 Algorithm X / Z，从候选行里保留 targrows 行；reservoir_init_selection_state() 和 reservoir_get_next_S() 负责算出「跳过多少行之后再替换池里的随机元素」。关键是两阶段同时进行：第一阶段每返回一个块，立刻扫描块内行，由第二阶段决定谁进池，不是先抽完所有块再回头扫。你可以点播放或者单步看这个过程：前 k 行直接入池，之后每次跳过 S 行、替换一个随机槽位。这里必须说清楚，我的跳过值和槽位是设定的伪随机序列，只用来说明「跳过加替换」的形态，不是实测，也不是 PostgreSQL 的真实数值。为什么数据库愿意用这么一套有点绕的办法？下一页讲那个折中。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >ANALYZE 两阶段：Knuth S 选块，Vitter 蓄水池留行，且同时进行<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >图 4 · sampling.c · BlockSampler_Init/Next 与 reservoir_get_next_S()（Algorithm X / Z）<\/text><text x=\"24\" y=\"78\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"2\" opacity=\"1\" >阶段一 · 从 12 个块里随机选固定数量块<\/text><rect x=\"24\" y=\"92\" width=\"100\" height=\"40\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" opacity=\"1\" id=\"v-b0\"/><text x=\"74\" y=\"117\" font-size=\"12\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" id=\"v-bt0\">B01<\/text><rect x=\"136\" y=\"92\" width=\"100\" height=\"40\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" opacity=\"1\" id=\"v-b1\"/><text x=\"186\" y=\"117\" font-size=\"12\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" id=\"v-bt1\">B02<\/text><rect x=\"248\" y=\"92\" width=\"100\" height=\"40\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" opacity=\"1\" id=\"v-b2\"/><text x=\"298\" y=\"117\" font-size=\"12\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" id=\"v-bt2\">B03<\/text><rect x=\"360\" y=\"92\" width=\"100\" height=\"40\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" opacity=\"1\" id=\"v-b3\"/><text x=\"410\" y=\"117\" font-size=\"12\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" id=\"v-bt3\">B04<\/text><rect x=\"472\" y=\"92\" width=\"100\" height=\"40\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" opacity=\"1\" id=\"v-b4\"/><text x=\"522\" y=\"117\" font-size=\"12\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-wei
