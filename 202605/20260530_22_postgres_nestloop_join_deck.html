 width=\"396\" height=\"22\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1156\" y=\"126\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >两边有序输入<\/text><path d=\"M 1156 132 L 1156 140\" fill=\"none\" stroke=\"#2F7A66\" stroke-width=\"1.2\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-green)\"/><rect x=\"958\" y=\"140\" width=\"396\" height=\"22\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1156\" y=\"156\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >排序或索引提供顺序<\/text><path d=\"M 1156 162 L 1156 170\" fill=\"none\" stroke=\"#2F7A66\" stroke-width=\"1.2\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-green)\"/><rect x=\"958\" y=\"170\" width=\"396\" height=\"22\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1156\" y=\"186\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >双指针比较推进<\/text><path d=\"M 1156 192 L 1156 200\" fill=\"none\" stroke=\"#2F7A66\" stroke-width=\"1.2\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-green)\"/><rect x=\"958\" y=\"200\" width=\"396\" height=\"22\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1156\" y=\"216\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >顺序合并输出<\/text><line x1=\"952\" y1=\"236\" x2=\"1360\" y2=\"236\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"952\" y=\"258\" font-size=\"12\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >启动成本<\/text><text x=\"1032\" y=\"258\" font-size=\"12\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >若需排序则较高<\/text><text x=\"952\" y=\"282\" font-size=\"12\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >总成本<\/text><text x=\"1032\" y=\"282\" font-size=\"12\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >sort / scan + merge<\/text><text x=\"952\" y=\"306\" font-size=\"12\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >索引价值<\/text><text x=\"1032\" y=\"306\" font-size=\"12\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >索引可提供有序输入<\/text><text x=\"952\" y=\"330\" font-size=\"12\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >内存压力<\/text><text x=\"1032\" y=\"330\" font-size=\"12\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >sort 可能受 work_mem 影响<\/text><text x=\"952\" y=\"354\" font-size=\"12\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >早停能力<\/text><text x=\"1032\" y=\"354\" font-size=\"12\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >部分场景可提前结束<\/text><text x=\"952\" y=\"378\" font-size=\"12\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >典型风险<\/text><text x=\"1032\" y=\"378\" font-size=\"12\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >排序成本高，重复键复杂<\/text><rect x=\"936\" y=\"62\" width=\"440\" height=\"326\" rx=\"0\" fill=\"none\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"24\" y=\"412\" font-size=\"13.5\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >三种形态的差别不在名字，而在「上层要一行时，谁先动」。<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "效果 · 四类收益", "title": "低延迟、可传值、可早停", "lede": "首行延迟、相关值索引查找、极低选择率 OLTP、early-out 语义 —— 四类收益同出一源。", "caption": "图 15　四类收益与各自典型场景；共同前提是 outer 小且 inner 有按值定位能力。", "bridge": "但每一条收益，都挂着一个会随 outer 行数放大的代价。", "notes": "收益可以归纳成四类，但它们的根是同一句话：低延迟、可传值、可早停。首行延迟低，因为不用等另一边全量准备；能利用相关值索引查找，因为参数化 inner index scan 是 Hash 和 Merge 直接替代不了的；适合选择率极低的 OLTP，比如小表、临时结果、主键集合去驱动大表点查；适合 early-out 语义，EXISTS、semi、anti、唯一 inner join、上层 LIMIT 短路都算。你会发现这四类场景有一个共同点：outer 很小，而且 inner 有明确的按值定位能力。换句话说，收益不是白来的，它是用「场景窄」换的。下一页我们就把账单翻过来。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >四类收益，都来自「低延迟、可传值、可早停」<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >效果 · 首行延迟 / 相关值索引 / 极低选择率 / early-out 语义<\/text><rect x=\"24\" y=\"62\" width=\"656\" height=\"140\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"62\" width=\"5\" height=\"140\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><rect x=\"44\" y=\"78\" width=\"36\" height=\"24\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"62\" y=\"93.91\" font-size=\"11.5\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >01<\/text><text x=\"92\" y=\"98\" font-size=\"19\" fill=\"#1B2B33\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >首行延迟低<\/text><text x=\"48\" y=\"132\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >outer 能快出行、inner 能快查时，不必等另一边全量准备。<\/text><rect x=\"48\" y=\"164\" width=\"608\" height=\"26\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"352\" y=\"181.25\" font-size=\"12.5\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >典型场景 · LIMIT、分页首屏、交互式查询<\/text><rect x=\"720\" y=\"62\" width=\"656\" height=\"140\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"720\" y=\"62\" width=\"5\" height=\"140\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><rect x=\"740\" y=\"78\" width=\"36\" height=\"24\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"758\" y=\"93.91\" font-size=\"11.5\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >02<\/text><text x=\"788\" y=\"98\" font-size=\"19\" fill=\"#1B2B33\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >能利用相关值索引查找<\/text><text x=\"744\" y=\"132\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >参数化 inner index scan 是 Hash / Merge 无法直接替代的能力。<\/text><rect x=\"744\" y=\"164\" width=\"608\" height=\"26\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1048\" y=\"181.25\" font-size=\"12.5\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >典型场景 · LATERAL、相关子查询<\/text><rect x=\"24\" y=\"214\" width=\"656\" height=\"140\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"214\" width=\"5\" height=\"140\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><rect x=\"44\" y=\"230\" width=\"36\" height=\"24\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"62\" y=\"245.91\" font-size=\"11.5\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >03<\/text><text x=\"92\" y=\"250\" font-size=\"19\" fill=\"#1B2B33\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >适合选择率极低的 OLTP<\/text><text x=\"48\" y=\"284\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >小表 / 临时结果 / 主键集合驱动大表索引点查。<\/text><rect x=\"48\" y=\"316\" width=\"608\" height=\"26\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"352\" y=\"333.25\" font-size=\"12.5\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >典型场景 · 主键 / 外键点查<\/text><rect x=\"720\" y=\"214\" width=\"656\" height=\"140\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"720\" y=\"214\" width=\"5\" height=\"140\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><rect x=\"740\" y=\"230\" width=\"36\" height=\"24\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"758\" y=\"245.91\" font-size=\"11.5\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >04<\/text><text x=\"788\" y=\"250\" font-size=\"19\" fill=\"#1B2B33\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >适合 early-out 语义<\/text><text x=\"744\" y=\"284\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >EXISTS、semi / anti、唯一 inner join 与 LIMIT 上层短路。<\/text><rect x=\"744\" y=\"316\" width=\"608\" height=\"26\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1048\" y=\"333.25\" font-size=\"12.5\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >典型场景 · EXISTS / NOT EXISTS<\/text><text x=\"24\" y=\"414\" font-size=\"13.5\" fill=\"#BE653B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >但每一条收益，都挂着一个会随 outer 行数放大的代价。<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "代价 · 五类与级联", "title": "估算一错，代价逐级放大", "lede": "外表行数、无索引、随机 I/O、估算级联、不天然向量化；慢 SQL 常常是一条放大链的结果。", "caption": "图 16　从统计低估到慢 SQL 的级联链，以及四条明确代价与向量化边界。", "bridge": "这些说法不靠感觉 —— 用三组 EXPLAIN 实验自己看。", "notes": "代价也很明确，而且会级联。外表行数越大越危险，内表单次成本再低，被百万 outer 行乘起来也高；内表没有有效索引时风险极高，Nested Loop → Seq Scan 加上很大的 loops，通常就是事故信号；随机 I/O 和 cache miss 会被放大，因为每次索引查找可能打到不同 heap page；估算错误会级联，统计信息低估 outer 行数、低估 inner 每次返回行数、低估 filter 代价，都会把计划推向错误方向。最后一条容易被忽略：传统的 tuple-at-a-time inner loop 不天然向量化，PostgreSQL 主执行器仍以 tuple slot 驱动，并不是 DuckDB 那类全链路向量化执行器；向量化 inner-loop join 论文关心的正是批量执行和 cache、SIMD 友好性，异步索引查找关心的则是高延迟 inner lookup 的流水化。这些说法不靠感觉，用三组 EXPLAIN 自己看。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >估算一错，代价沿着这条链被逐级放大<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >代价 · 外表行数 / 无索引 / 随机 I/O / 估算级联 / 不天然向量化<\/text><rect x=\"24\" y=\"66\" width=\"240\" height=\"88\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"40\" y=\"92\" font-size=\"16\" fill=\"#BE653B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >统计低估<\/text><text x=\"40\" y=\"116\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >outer 估算 10 行<\/text><text x=\"40\" y=\"138\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >实际可能 10 万行<\/text><path d=\"M 264 110 L 292 110\" fill=\"none\" stroke=\"#BE653B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-acc)\"/><rect x=\"292\" y=\"66\" width=\"240\" height=\"88\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"308\" y=\"92\" font-size=\"16\" fill=\"#BE653B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >loops 倍增<\/text><text x=\"308\" y=\"116\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >inner 重扫次数<\/text><text x=\"308\" y=\"138\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >随 outer 行数线性增长<\/text><path d=\"M 532 110 L 560 110\" fill=\"none\" stroke=\"#BE653B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-acc)\"/><rect x=\"560\" y=\"66\" width=\"240\" height=\"88\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"576\" y=\"92\" font-size=\"16\" fill=\"#BE653B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >随机 I/O<\/text><text x=\"576\" y=\"116\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >每次打到不同 heap page<\/text><text x=\"576\" y=\"138\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >Buffer / CPU cache 压力上升<\/text><path d=\"M 800 110 L 828 110\" fill=\"none\" stroke=\"#BE653B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-acc)\"/><rect x=\"828\" y=\"66\" width=\"240\" height=\"88\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"844\" y=\"92\" font-size=\"16\" fill=\"#BE653B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >单次成本被乘<\/text><text x=\"844\" y=\"116\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >Nested Loop → Seq Scan<\/text><text x=\"844\" y=\"138\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >loops 很大时是事故信号<\/text><path d=\"M 1068 110 L 1096 110\" fill=\"none\" stroke=\"#BE653B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-acc)\"/><rect x=\"1096\" y=\"66\" width=\"240\" height=\"88\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1112\" y=\"92\" font-size=\"16\" fill=\"#BE653B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >计划质量下滑<\/text><text x=\"1112\" y=\"116\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >估算错误级联<\/text><text x=\"1112\" y=\"138\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >慢 SQL 与并发热点叠加<\/text><text x=\"24\" y=\"182\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"2\" opacity=\"1\" >代价清单<\/text><rect x=\"24\" y=\"194\" width=\"656\" height=\"178\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"194\" width=\"656\" height=\"44\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"42\" y=\"223.2\" font-size=\"20\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >四条明确代价<\/text><rect x=\"42\" y=\"255.59\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"59\" y=\"262.61\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >外表行数越大越危险：单次成本再低，乘上百万行也高。<\/text><rect x=\"42\" y=\"282.59\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"59\" y=\"289.61\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >内表没有有效索引时风险极高。<\/text><rect x=\"42\" y=\"309.59\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"59\" y=\"316.61\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >估算错误会级联：统计信息、选择率、filter 代价都影响方向。<\/text><rect x=\"42\" y=\"336.59\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"59\" y=\"343.61\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >不天然向量化：传统 tuple-at-a-time 对现代 CPU 不够友好。<\/text><rect x=\"720\" y=\"194\" width=\"656\" height=\"178\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"720\" y=\"194\" width=\"656\" height=\"44\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"738\" y=\"223.2\" font-size=\"20\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >为什么「向量化」是另一个话题<\/text><rect x=\"738\" y=\"255.59\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"755\" y=\"262.61\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >PostgreSQL 主执行器仍以 tuple slot 逐行驱动。<\/text><rect x=\"738\" y=\"282.59\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"755\" y=\"289.61\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >与 DuckDB 那类全链路向量化执行器不是一种形态。<\/text><rect x=\"738\" y=\"309.59\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"755\" y=\"316.61\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >向量化 inner-loop join 论文关注批量执行、cache 与 SIMD 友好性。<\/text><rect x=\"738\" y=\"336.59\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"755\" y=\"343.61\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >异步索引查找关注的是高延迟 inner lookup 的流水化。<\/text><text x=\"24\" y=\"400\" font-size=\"13.5\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >这些说法不靠感觉 —— 用三组 EXPLAIN 实验自己看。<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "验证 · 三组 DEMO", "title": "健康、拆索引、EXISTS 早停", "lede": "造表建索引、DROP 掉内表索引、写 EXISTS —— 三组 SQL 骨架，重点看 Index Cond、loops 与 Buffers。", "caption": "图 17　三组可执行 SQL 骨架与观察点；原文未运行实例，不提供伪造输出。", "bridge": "跑出来之后，怎么读 EXPLAIN 才不会看漏关键数字？", "notes": "原文给了一套能直接复制的最小实验，我按验证顺序拆成三组。第一组造表、建 customer_id 索引、ANALYZE，关掉 hashjoin 和 mergejoin 逼出 Nested Loop，跑 EXPLAIN (ANALYZE, BUFFERS)：健康计划里 outer 是过滤后的小结果集，inner 是 Index Scan 或 Bitmap Heap Scan，带 Index Cond: customer_id = c.id，loops 约等于 outer 实际行数。第二组把内表索引 DROP 掉，再跑一次：如果还是 Nested Loop，inner 很可能变成 Seq Scan 且 loops 很高，用来说明 Nested Loop 不自动快，它需要便宜的 inner 重扫。第三组写 EXISTS，看它能不能被规划成 semi join、首个匹配即停，对应源码的 single_match。这里必须说句诚实话：原文作者没有启动实例执行这些 SQL，所以全文没有实测输出，我也不编数字，请你以自己本地的 EXPLAIN 为准。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >三组最小实验：健康计划、拆掉索引、EXISTS 早停<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >验证 · 原文 SQL 骨架；请在自己的 PostgreSQL 上执行并观察 EXPLAIN<\/text><rect x=\"24\" y=\"62\" width=\"440\" height=\"40\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"40\" y=\"88\" font-size=\"16\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >实验 1 · 健康的 Nested Loop<\/text><rect x=\"24\" y=\"110\" width=\"440\" height=\"124\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"40\" y=\"128\" font-size=\"11.6\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >CREATE INDEX ON demo_order(customer_id);<\/text><text x=\"40\" y=\"147.72\" font-size=\"11.6\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >ANALYZE demo_customer; ANALYZE demo_order;<\/text><text x=\"40\" y=\"167.44\" font-size=\"11.6\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >SET enable_hashjoin = off;<\/text><text x=\"40\" y=\"187.16\" font-size=\"11.6\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >SET enable_mergejoin = off;<\/text><text x=\"40\" y=\"206.88\" font-size=\"11.6\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >EXPLAIN (ANALYZE, BUFFERS) &lt;join SQL&gt;;<\/text><text x=\"24\" y=\"258\" font-size=\"12\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"1\" opacity=\"1\" >观察点<\/text><rect x=\"40\" y=\"271\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"52\" y=\"280\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >outer 是过滤后的小结果集<\/text><rect x=\"40\" y=\"297\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"52\" y=\"306\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >inner 有 Index Cond: customer_id = c.id<\/text><rect x=\"40\" y=\"323\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"52\" y=\"332\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >loops ≈ outer 实际行数；Buffers 未异常放大<\/text><rect x=\"24\" y=\"62\" width=\"440\" height=\"300\" rx=\"0\" fill=\"none\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"480\" y=\"62\" width=\"440\" height=\"40\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"496\" y=\"88\" font-size=\"16\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >实验 2 · 禁用内表索引<\/text><rect x=\"480\" y=\"110\" width=\"440\" height=\"124\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"496\" y=\"128\" font-size=\"11.6\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >DROP INDEX demo_order_customer_id_idx;<\/text><text x=\"496\" y=\"147.72\" font-size=\"11.6\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >ANALYZE demo_order;<\/text><text x=\"496\" y=\"167.44\" font-size=\"11.6\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >SET enable_hashjoin = off;<\/text><text x=\"496\" y=\"187.16\" font-size=\"11.6\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >SET enable_mergejoin = off;<\/text><text x=\"496\" y=\"206.88\" font-size=\"11.6\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >EXPLAIN (ANALYZE, BUFFERS) &lt;join SQL&gt;;<\/text><text x=\"480\" y=\"258\" font-size=\"12\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"1\" opacity=\"1\" >观察点<\/text><rect x=\"496\" y=\"271\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"508\" y=\"280\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >inner 可能变成 Seq Scan on demo_order<\/text><rect x=\"496\" y=\"297\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"508\" y=\"306\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >loops 很高时成本被成倍放大<\/text><rect x=\"496\" y=\"323\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"508\" y=\"332\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >Nested Loop 并不自动快，需要便宜的 inner 重扫<\/text><rect x=\"480\" y=\"62\" width=\"440\" height=\"300\" rx=\"0\" fill=\"none\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"936\" y=\"62\" width=\"440\" height=\"40\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"952\" y=\"88\" font-size=\"16\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >实验 3 · EXISTS 的 semi join<\/text><rect x=\"936\" y=\"110\" width=\"440\" height=\"124\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"952\" y=\"128\" font-size=\"11.6\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >EXPLAIN (ANALYZE, BUFFERS)<\/text><text x=\"952\" y=\"147.72\" font-size=\"11.6\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >SELECT c.id FROM demo_customer c<\/text><text x=\"952\" y=\"167.44\" font-size=\"11.6\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >WHERE c.region = 'CN'<\/text><text x=\"952\" y=\"187.16\" font-size=\"11.6\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >  AND EXISTS (SELECT 1 FROM demo_order o<\/text><text x=\"952\" y=\"206.88\" font-size=\"11.6\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >       WHERE o.customer_id = c.id);<\/text><text x=\"936\" y=\"258\" font-size=\"12\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"1\" opacity=\"1\" >观察点<\/text><rect x=\"952\" y=\"271\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"964\" y=\"280\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >EXISTS 可被规划成 semi join<\/text><rect x=\"952\" y=\"297\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"964\" y=\"306\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >找到第一条匹配 inner 行就停<\/text><rect x=\"952\" y=\"323\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"964\" y=\"332\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >对应源码里的 single_match 行为<\/text><rect x=\"936\" y=\"62\" width=\"440\" height=\"300\" rx=\"0\" fill=\"none\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"372\" width=\"1352\" height=\"34\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"40\" y=\"394\" font-size=\"13\" fill=\"#AE8A3E\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >诚实边界 · 原文未在本地启动实例执行，因此不提供伪造的 EXPLAIN ANALYZE 输出；一切以你自己库里的结果为准。<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "诊断 · EXPLAIN", "title": "别只看节点名字，看五个位置", "lede": "loops、Index Cond、Rows Removed by Filter、Buffers、估算与实际行数 —— 五个读数决定判断。", "caption": "图 18　计划树结构示意（数值用占位符）与五项诊断读数；不编造实际测量数字。", "bridge": "会诊断之后，落到日常，不同角色该做的动作并不一样。", "notes": "跑出来之后，怎么读才不会看漏关键数字？别只盯着 Nested Loop 四个字，看五个位置。第一，inner 节点的 loops 是不是约等于 outer 实际行数，真实总处理量大致是 actual rows 乘 loops。第二，Index Cond 里 join key 有没有真正进 inner 访问路径，还是只落在 Join Filter。第三，Rows Removed by Filter 是不是过大，说明大量行组合后才被丢掉。第四，Buffers 有没有随 loops 异常放大，那是随机 I/O 和缓存压力的信号。第五，估算 rows 和实际 rows 是不是严重偏离。这里还有个官方文档级别的提醒：子节点执行多次时，actual time 和 rows 是每次执行的平均值，要乘 loops 才能理解总量 —— 很多人误读 EXPLAIN ANALYZE 就栽在这。会诊断之后，落到日常，不同角色该做的动作并不一样。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >诊断 Nested Loop，别只看节点名字，要看这五个位置<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >诊断 · EXPLAIN (ANALYZE, BUFFERS) 的关键读数；节点数值为占位示意<\/text><rect x=\"24\" y=\"62\" width=\"560\" height=\"296\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"40\" y=\"90\" font-size=\"15\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\" "#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"50\" y=\"241\" width=\"30\" height=\"26\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"65\" y=\"257.91\" font-size=\"11.5\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >3<\/text><text x=\"92\" y=\"252\" font-size=\"14\" fill=\"#1B2B33\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >Index Scan on o<\/text><text x=\"92\" y=\"271\" font-size=\"12\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >Index Cond: customer_id = …  loops=…<\/text><text x=\"40\" y=\"334\" font-size=\"12\" fill=\"#89938F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >示意值用「…」占位，不编造实际测量数字。<\/text><rect x=\"620\" y=\"62\" width=\"756\" height=\"54\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"632\" y=\"75\" width=\"30\" height=\"28\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"647\" y=\"93.08\" font-size=\"12\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >①<\/text><text x=\"676\" y=\"87\" font-size=\"14\" fill=\"#245A6B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >inner 节点的 loops<\/text><text x=\"676\" y=\"106\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >是否约等于 outer 实际行数；真实总处理量大致是 rows × loops<\/text><rect x=\"620\" y=\"122\" width=\"756\" height=\"54\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"632\" y=\"135\" width=\"30\" height=\"28\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"647\" y=\"153.08\" font-size=\"12\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >②<\/text><text x=\"676\" y=\"147\" font-size=\"14\" fill=\"#245A6B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >Index Cond<\/text><text x=\"676\" y=\"166\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >join key 有没有真正进入 inner 访问路径，而不只是 Join Filter<\/text><rect x=\"620\" y=\"182\" width=\"756\" height=\"54\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"632\" y=\"195\" width=\"30\" height=\"28\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"647\" y=\"213.08\" font-size=\"12\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >③<\/text><text x=\"676\" y=\"207\" font-size=\"14\" fill=\"#245A6B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >Rows Removed by Filter<\/text><text x=\"676\" y=\"226\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >是否大量行在组合后才被过滤掉<\/text><rect x=\"620\" y=\"242\" width=\"756\" height=\"54\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"632\" y=\"255\" width=\"30\" height=\"28\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"647\" y=\"273.08\" font-size=\"12\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >④<\/text><text x=\"676\" y=\"267\" font-size=\"14\" fill=\"#245A6B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >Buffers<\/text><text x=\"676\" y=\"286\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >是否随 loops 出现异常放大，反映随机 I/O 与缓存压力<\/text><rect x=\"620\" y=\"302\" width=\"756\" height=\"54\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"632\" y=\"315\" width=\"30\" height=\"28\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"647\" y=\"333.08\" font-size=\"12\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >⑤<\/text><text x=\"676\" y=\"327\" font-size=\"14\" fill=\"#245A6B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >估算 rows vs 实际 rows<\/text><text x=\"676\" y=\"346\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >是否严重偏离，把计划推向错误方向<\/text><rect x=\"24\" y=\"372\" width=\"1352\" height=\"34\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"40\" y=\"394\" font-size=\"13\" fill=\"#AE8A3E\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >官方文档要点 · 子节点执行多次时，actual time 与 rows 是每次执行的平均值，要乘 loops 才能理解总量。<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "实践 · 三类角色", "title": "架构师、DBA、开发者各做各的", "lede": "架构师划场景与索引边界，DBA 管统计与观测口径，开发者盯 SQL 语义与批量访问方式。", "caption": "图 19　三类角色的最佳实践清单；依据原文第七节重排。", "bridge": "动作都对了，再给一张适合 / 不适合的速查表。", "notes": "同一个机制落在不同人身上，动作完全不一样。架构师要把它当成「低延迟点查 join」能力来设计，而不是通用大表 join 的默认方案：schema 得提供可参数化的内表索引，外键列、业务查询键、多列组合键；索引设计从查询形态出发，外表过滤条件决定 outer 行数，join key 决定 inner index cond，投影和排序决定要不要覆盖索引；星型模型里小维表驱动大事实表可能很漂亮，但维表过滤结果一大，Hash 或 Bitmap 往往更稳。DBA 那边，慢 SQL 先看 loops，计划选错先查统计信息和 extended statistics，别把 enable_nestloop = off 当长期修复，还要留意重复 key 却没出现 Memoize 的情况。业务开发者记住三件事：join key 别包在函数或隐式转换里，小集合驱动大表点查可以接受，批量查询别在应用层写 N 次单点 SQL 循环。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >同一个机制落到不同人身上，动作完全不一样<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >实践 · 数据库架构师 / DBA / 业务开发者<\/text><rect x=\"24\" y=\"62\" width=\"440\" height=\"330\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"62\" width=\"440\" height=\"44\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"42\" y=\"91.2\" font-size=\"20\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >面向数据库架构师<\/text><rect x=\"42\" y=\"145.59\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"59\" y=\"152.61\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >把 Nested Loop 看成「低延迟点查 join」能力，不是通用大<\/text><text x=\"59\" y=\"179.61\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >表 join 默认方案。<\/text><rect x=\"42\" y=\"199.59\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"59\" y=\"206.61\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >schema 要提供可参数化的内表索引：外键列、业务查询键、多<\/text><text x=\"59\" y=\"233.61\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >列组合键。<\/text><rect x=\"42\" y=\"253.59\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"59\" y=\"260.61\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >从查询形态设计索引：outer 过滤条件决定行数，join key 决<\/text><text x=\"59\" y=\"287.61\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >定 index cond，投影与排序决定是否要覆盖索引。<\/text><rect x=\"42\" y=\"307.59\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"59\" y=\"314.61\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >星型模型要谨慎：小维表驱动大事实表可能很好，维表过滤结果<\/text><text x=\"59\" y=\"341.61\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >变大时 Hash / Bitmap 更稳定。<\/text><rect x=\"480\" y=\"62\" width=\"440\" height=\"330\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"480\" y=\"62\" width=\"440\" height=\"44\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"498\" y=\"91.2\" font-size=\"20\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >面向 DBA<\/text><rect x=\"498\" y=\"122.59\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"515\" y=\"129.61\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >慢 SQL 先看 EXPLAIN (ANALYZE, BUFFERS) 的 loops，时<\/text><text x=\"515\" y=\"155.81\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >间也要乘 loops 理解。<\/text><rect x=\"498\" y=\"174.99\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"515\" y=\"182.01\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >计划选错先查统计信息：ANALYZE 是否及时、相关列是否要<\/text><text x=\"515\" y=\"208.21\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >extended statistics。<\/text><rect x=\"498\" y=\"227.39\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"515\" y=\"234.41\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >不要把 enable_nestloop = off 当长期修复，长期要回到索<\/text><text x=\"515\" y=\"260.61\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >引、统计、SQL 形态与成本参数。<\/text><rect x=\"498\" y=\"279.79\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"515\" y=\"286.81\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >关注 Memoize：重复 key 却没有它，可能是参数不可哈希、<\/text><text x=\"515\" y=\"313.01\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >volatile 函数或估算不支持。<\/text><rect x=\"498\" y=\"332.19\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"515\" y=\"339.21\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >OLTP 慢常是热点索引页、缓存容量、随机 I/O、连接池并发一<\/text><text x=\"515\" y=\"365.41\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >起放大。<\/text><rect x=\"936\" y=\"62\" width=\"440\" height=\"330\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"936\" y=\"62\" width=\"440\" height=\"44\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"954\" y=\"91.2\" font-size=\"20\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >面向业务开发者<\/text><rect x=\"954\" y=\"145.59\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"971\" y=\"152.61\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >join key 要清晰可下推，别包在函数或隐式类型转换里导致索<\/text><text x=\"971\" y=\"179.61\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >引不可用。<\/text><rect x=\"954\" y=\"199.59\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"971\" y=\"206.61\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >小集合驱动大表点查可以接受；大集合 join 大表别用应用层循<\/text><text x=\"971\" y=\"233.61\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >环替代数据库 join。<\/text><rect x=\"954\" y=\"253.59\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"971\" y=\"260.61\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >EXISTS 比 COUNT(*) &gt; 0 更能表达「找到一个即可」，更容<\/text><text x=\"971\" y=\"287.61\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >易触发 semi join 早停。<\/text><rect x=\"954\" y=\"307.59\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"971\" y=\"314.61\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >批量查询不要在应用层 N 次单点 SQL 循环：数据库内的 NL<\/text><text x=\"971\" y=\"341.61\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >至少还能复用 buffer、用 Memoize。<\/text><text x=\"24\" y=\"410\" font-size=\"13.5\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >动作都对了，再给一张适合 / 不适合的速查表。<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "场景 · 适合与不适合", "title": "优势区间很窄", "lede": "outer 小、inner 有高选择率索引、能早停 —— 三个条件同时成立，才谈得上它的强项。", "caption": "图 20　适合 / 不适合各六个信号，底部为三问速查。", "bridge": "最后把反复出现的老坑归归类，大半指向同一个误会。", "notes": "把场景压成一张速查表。适合的一边：outer 小、inner 有高选择率索引、重视首行延迟的 LIMIT 和首屏、EXISTS 与 semi/anti 可早停、LATERAL 或相关子查询天然依赖 outer 当前行、outer 有重复 key 可走 Memoize、OLTP 主键外键点查。不适合的一边：两边都大且没有强选择率索引、inner 只能 Seq Scan、统计信息长期低估 outer、join 条件复杂到不能下推为 index cond、批量吞吐优先的分析查询，还有 inner 查找高延迟又缺少异步或 pipeline 能力的场景 —— 异步索引查找论文关注的正是这个边界。底下那句速查最实用：outer 小吗？inner 有合适索引吗？能早停吗？三个都答「是」，才进入它的优势区间。最后把反复出现的老坑归归类。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >优势区间很窄：三个条件同时成立才成立<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >场景 · 适合 / 不适合；判断依据来自 outer 行数与 inner 单次成本<\/text><rect x=\"24\" y=\"62\" width=\"656\" height=\"288\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"62\" width=\"656\" height=\"44\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"42\" y=\"91.2\" font-size=\"20\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >适合 · 六个信号<\/text><rect x=\"42\" y=\"151.76\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"59\" y=\"159.04\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >outer 结果集小，inner 有高选择率索引。<\/text><rect x=\"42\" y=\"178.76\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"59\" y=\"186.04\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >LIMIT、分页首屏、交互式查询等重视首行延迟。<\/text><rect x=\"42\" y=\"205.76\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"59\" y=\"213.04\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >EXISTS / NOT EXISTS / semi / anti join，可早停。<\/text><rect x=\"42\" y=\"232.76\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"59\" y=\"240.04\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >LATERAL 或相关子查询，inner 天然依赖 outer 当前行。<\/text><rect x=\"42\" y=\"259.76\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"59\" y=\"267.04\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >outer 有重复 key，可通过 Memoize 缓存 inner 结果。<\/text><rect x=\"42\" y=\"286.76\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"59\" y=\"294.04\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >OLTP 主键 / 外键查询、少量客户 / 订单 / 权限记录关联。<\/text><rect x=\"720\" y=\"62\" width=\"656\" height=\"288\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"720\" y=\"62\" width=\"656\" height=\"44\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"738\" y=\"91.2\" font-size=\"20\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >不适合 · 六个信号<\/text><rect x=\"738\" y=\"151.76\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"755\" y=\"159.04\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >两边都是大结果集，且没有选择性强的 inner 索引。<\/text><rect x=\"738\" y=\"178.76\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"755\" y=\"186.04\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >inner 侧只能 Seq Scan，outer 行数又不小。<\/text><rect x=\"738\" y=\"205.76\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"755\" y=\"213.04\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >统计信息长期失真，outer 行数经常被低估。<\/text><rect x=\"738\" y=\"232.76\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"755\" y=\"240.04\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >join 条件复杂到不能下推为 inner index cond，只能在 Join Filter 里大量过滤。<\/text><rect x=\"738\" y=\"259.76\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"755\" y=\"267.04\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >批量吞吐优先的分析查询，Hash / Merge 更稳定。<\/text><rect x=\"738\" y=\"286.76\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"755\" y=\"294.04\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >inner 查找高延迟且缺少异步 / pipeline 能力（异步索引查找论文关注的边界）。<\/text><rect x=\"24\" y=\"362\" width=\"1352\" height=\"46\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"40\" y=\"391\" font-size=\"15\" fill=\"#AE8A3E\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >速查 · outer 小？ inner 有合适索引？ 能早停？ —— 三个都答「是」，才进入它的优势区间。<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "避坑 · 八个坑", "title": "大半指向同一个误会", "lede": "概念、语义、统计、工程四类误读；最该记住的是 inner loops 乘上 inner 单次成本。", "caption": "图 21　八个常见坑按四类成因归类；底部为核心原理提醒。", "bridge": "把整条链压回一张地层剖面收尾。", "notes": "八个坑，归类其实就四种：概念、语义、统计、工程。只看 Nested Loop 节点不看 inner loops；把 enable_nestloop = off 当优化；忽略 Join Filter，让条件没进 inner 路径；统计信息低估 outer 行数；bigint join text、表达式包列、隐式转换破坏 index cond；误读 EXPLAIN ANALYZE 的时间，忘了乘 loops；忽略 inner_unique，白白丢掉首个命中即停的机会；还有用应用层循环替代数据库 join，看起来也叫 nested loop，却丢了优化器、buffer locality、事务一致性和批量执行机会。你会发现大半的坑指向同一个误会：把问题归到 Nested Loop 这个节点上。其实问题从来不在节点，而在 inner loops 乘上 inner 单次重扫成本。收尾我们就把整条链压回那张地层剖面。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >八个反复出现的坑，大半指向同一个误会<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >避坑 · 概念 / 语义 / 统计 / 工程<\/text><rect x=\"24\" y=\"62\" width=\"326\" height=\"136\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"62\" width=\"4\" height=\"136\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><rect x=\"38\" y=\"74\" width=\"32\ Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >归因 · 统计<\/text><rect x=\"708\" y=\"212\" width=\"326\" height=\"136\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"708\" y=\"212\" width=\"4\" height=\"136\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><rect x=\"722\" y=\"224\" width=\"32\" height=\"24\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"738\" y=\"239.91\" font-size=\"11.5\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >07<\/text><text x=\"762\" y=\"243\" font-size=\"15\" fill=\"#1B2B33\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >忽略 inner_unique<\/text><text x=\"724\" y=\"274\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >能证明最多一行匹配<\/text><text x=\"724\" y=\"296\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >首个命中即可停，成本与执行都不同<\/text><rect x=\"724\" y=\"312\" width=\"294\" height=\"24\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"871\" y=\"327.91\" font-size=\"11.5\" fill=\"#AE8A3E\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >归因 · 概念<\/text><rect x=\"1050\" y=\"212\" width=\"326\" height=\"136\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"1050\" y=\"212\" width=\"4\" height=\"136\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><rect x=\"1064\" y=\"224\" width=\"32\" height=\"24\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1080\" y=\"239.91\" font-size=\"11.5\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >08<\/text><text x=\"1104\" y=\"243\" font-size=\"15\" fill=\"#1B2B33\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >应用层循环替代 join<\/text><text x=\"1066\" y=\"274\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >也叫 nested loop<\/text><text x=\"1066\" y=\"296\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >丢了优化器、buffer locality 与事务一致性<\/text><rect x=\"1066\" y=\"312\" width=\"294\" height=\"24\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1213\" y=\"327.91\" font-size=\"11.5\" fill=\"#AE8A3E\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >归因 · 工程<\/text><rect x=\"24\" y=\"362\" width=\"1352\" height=\"44\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"40\" y=\"390\" font-size=\"15\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >核心提醒 · 问题不在 Nested Loop 这个节点，而在 inner loops × inner 单次重扫成本。<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "收束 · 七层剖面", "title": "分水岭在第四层", "lede": "从物理页面一路到业务语义；L4 的 PARAM_EXEC 把「两重循环」改写成「带运行期常量的定点查找」。", "caption": "图 22　全篇机制的七层剖面；越深的靛青越底层，L4 是分水岭。", "bridge": "谢谢。带着那几个问题，去自己的库里跑一遍 EXPLAIN。", "notes": "最底下是物理层，heap 和 index page，随机 I/O 真正发生；往上是访问层，Seq Scan、Index Scan、Bitmap 决定 inner 单次成本；再往上是执行层，ExecNestLoop、Rescan、joinqual、single_match 在这里驱动循环；第四层是参数层，PARAM_EXEC 和 NestLoopParam —— 整篇的分水岭就在这儿，正是它把两重循环改写成带运行期常量的定点查找；第五层计划层，NestPath、Memoize、Materialize 决定 inner path 长什么样；第六层优化器层，两阶段成本和 path 空间竞争决定选谁；最顶上才是业务语义：outer 怎么过滤、join key 怎么写、索引怎么建、EXPLAIN 怎么读。越深的靛青越底层，而所有关于快不快的争论，最后都得回到第四层问一句：outer 的值，有没有真的传进 inner 路径。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >把整条链压回一张剖面：分水岭在第四层<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >收束 · 越深的靛青越底层；L4 是把「循环」变成「定点查找」的那一层<\/text><rect x=\"24\" y=\"58\" width=\"1352\" height=\"44\" rx=\"0\" fill=\"#EBF1EE\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"38\" y=\"67\" width=\"44\" height=\"26\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"60\" y=\"84.08\" font-size=\"12\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >L7<\/text><text x=\"100\" y=\"87\" font-size=\"17\" fill=\"#1B2B33\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" const N = D.length;
let cur = 0, panelOn = false, panelMode = '', autoTimer = null, autoOn = false;
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const pad = n => String(n).padStart(2,'0');
const setA = (id,a,v) => { const e=document.getElementById(id); if(e) e.setAttribute(a,v); };
const setT = (id,s) => { const e=document.getElementById(id); if(e) e.textContent=s; };
const fmt = n => Math.round(n).toLocaleString('en-US');
const KEYS = [
  ['→ / 空格','下一页'],['←','上一页'],['F','全屏 / 退出全屏（按键条常驻）'],['G','目录（再按关闭）'],
  ['N','本页讲稿（再按关闭）'],['T','全文讲稿（再按关闭）'],['P','自动播放 / 暂停'],
  ['1–9','直接跳页'],['输入页码 + 回车','跳到指定页'],['Home / End','首页 / 末页'],
