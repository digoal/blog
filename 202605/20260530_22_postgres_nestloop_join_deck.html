];

/* ---------- 舞台缩放：讲稿打开时矢量缩到左侧 ---------- */
function fit(){
  const vp=$('#viewport'), W=vp.clientWidth, H=vp.clientHeight;
  const pw = panelOn ? $('#notes').offsetWidth : 0;
  const aw = Math.max(320, W-pw);
  const s = Math.min(aw/1600, H/900);
  const st=$('#stage');
  st.style.transform='scale('+s+')';
  st.style.left=((aw-1600*s)/2)+'px';
  st.style.top=((H-900*s)/2)+'px';
}
window.addEventListener('resize', fit);

function render(){
  $('#slides').innerHTML = D.map((d,i)=>
    '<section class="slide'+(d.ctrl?' anim':'')+'" id="s'+i+'">'
    + '<div class="eyebrow"><span class="num">'+pad(i+1)+' / '+pad(N)+'</span>'+d.eyebrow+'</div>'
    + '<h1 class="title">'+d.title+'</h1>'
    + '<div class="lede">'+d.lede+'</div>'
    + '<div class="rule"></div>'
    + '<div class="figwrap">'+d.svg+'</div>'
    + '<div class="caption">'+d.caption+'</div>'
    + (d.ctrl ? '<div class="ctrls">'+d.ctrl+'</div>' : '')
    + '<div class="bridge"><span class="bk">承接 · NEXT</span>'+d.bridge+'</div>'
    + '<div class="footer"><div class="fbar"><i id="fbar'+i+'"></i></div>'
    + '<span class="fl">数据库筑基课 · Nested Loop Join</span>'
    + '<span class="fr">'+pad(i+1)+' / '+pad(N)+'</span></div>'
    + '</section>').join('');
}

function toast(s){
  const t=$('#toast'); t.textContent=s; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1600);
}

/* ---------- 页内开窗：右侧讲稿 ---------- */
function secHTML(d,i){
  return '<div class="nsec" id="nsec'+i+'"><span class="sn">'+pad(i+1)+' · '+d.eyebrow+'</span>'
    +'<h3>'+d.title+'</h3><p>'+d.notes+'</p>'
    +'<div class="br">「'+d.bridge+'」</div></div>';
}
function renderPanel(){
  const h=$('#nTitle'), sub=$('#nSub'), b=$('#nBody');
  if(panelMode==='here'){
    h.textContent='本页讲稿'; sub.textContent=pad(cur+1)+' / '+pad(N);
    b.innerHTML=secHTML(D[cur],cur); b.scrollTop=0;
  }else if(panelMode==='all'){
    h.textContent='全文讲稿'; sub.textContent='自动跟随当前页 · 共 '+N+' 页';
    b.innerHTML=D.map((d,i)=>secHTML(d,i)).join('');
  }else if(panelMode==='toc'){
    h.textContent='目录'; sub.textContent='点击跳转 · 共 '+N+' 页';
    b.innerHTML='<div class="tocgrid">'+D.map((d,i)=>
      '<a data-i="'+i+'" onclick="jump('+i+')"><span class="gn">'+pad(i+1)+'</span>'
      +'<span class="gt">'+d.title+'</span></a>').join('')+'</div>';
  }else{
    h.textContent='快捷键'; sub.textContent='全屏后底部同样常驻';
    b.innerHTML='<div class="keygrid">'+KEYS.map(k=>'<div><kbd>'+k[0]+'</kbd>'+k[1]+'</div>').join('')+'</div>'
      +'<div class="nsec"><p>讲稿采用页内开窗：按一下显示，再按一下关闭；显示时画面矢量缩放到左侧。'
      +'按 T 显示全部讲稿时自动定位到当前页，翻页时右侧讲稿会联动滚动并高亮当前页。'
      +'三处动画页（06 / 10 / 12）都提供输入、播放 / 暂停、单步与重置，均为确定性示意模型，不代表实测数据。</p></div>';
  }
  syncNotes(true);
}
function syncNotes(instant){
  if(!panelOn) return;
  if(panelMode==='all'){
    $$('.nsec').forEach(e=>e.classList.remove('cur'));
    const el=document.getElementById('nsec'+cur), nb=$('#nBody');
    if(el && nb){
      el.classList.add('cur');
      const top=Math.max(0, el.getBoundingClientRect().top - nb.getBoundingClientRect().top + nb.scrollTop - 8);
      if(instant){
        const old=nb.style.scrollBehavior;
        nb.style.scrollBehavior='auto';
        nb.scrollTop=top;
        nb.style.scrollBehavior=old;
      }else{
        nb.scrollTo({top:top,behavior:'smooth'});
      }
    }
  }else if(panelMode==='toc'){
    $$('.tocgrid a').forEach(a=>a.classList.toggle('cur', +a.dataset.i===cur));
  }
}
function openPanel(mode){
  if(panelOn && panelMode===mode){ closePanel(); return; }
  panelOn=true; panelMode=mode;
  document.body.classList.add('panel-on');
  renderPanel(); fit(); syncChrome();
  if(mode==='all') setTimeout(()=>syncNotes(true),90);
}
function closePanel(){
  if(!panelOn) return;
  panelOn=false; panelMode='';
  document.body.classList.remove('panel-on');
  fit(); syncChrome();
}
function jump(i){ closePanel(); go(i); }
function syncChrome(){
  $('#btnNotes').classList.toggle('act', panelOn && panelMode==='here');
  $('#btnAll').classList.toggle('act', panelOn && panelMode==='all');
  $('#btnToc').classList.toggle('act', panelOn && panelMode==='toc');
  $('#btnHelp').classList.toggle('act', panelOn && panelMode==='help');
  $('#btnFs').textContent = document.body.classList.contains('immersive') ? '退出全屏 F' : '全屏 F';
}

/* ---------- 翻页 ---------- */
function go(i,silent){
  i=Math.max(0,Math.min(N-1,i));
  $$('.slide').forEach((el,k)=>el.classList.toggle('on',k===i));
  cur=i;
  try{ localStorage.setItem('nl-slide',String(i)); }catch(e){}
  $('#pg').textContent=pad(i+1)+' / '+pad(N);
  const jp=$('#jump'); if(jp) jp.value=String(i+1);
  $('#bar').style.width=((i+1)/N*100)+'%';
  for(let k=0;k<N;k++){ const b=document.getElementById('fbar'+k); if(b) b.style.width=(k<=i?100:0)+'%'; }
  stopAnims();
  if(panelOn){
    if(panelMode==='here') renderPanel(); else syncNotes(false);
  }
  if(!silent) toast(pad(i+1)+'　'+D[i].title);
  syncChrome();
}
function next(){ if(cur<N-1) go(cur+1); else stopAuto(); }
function prev(){ if(cur>0) go(cur-1); }

/* ---------- 自动播放 / 全屏 ---------- */
function stopAuto(){
  autoOn=false; clearInterval(autoTimer); autoTimer=null;
  $('#btnAuto').textContent='自动播放 P'; $('#btnAuto').classList.remove('act');
}
function toggleAuto(){
  if(autoOn){ stopAuto(); toast('已暂停自动播放'); return; }
  autoOn=true; $('#btnAuto').textContent='❚❚ 暂停 P'; $('#btnAuto').classList.add('act');
  autoTimer=setInterval(()=>{ if(cur<N-1) go(cur+1,true); else stopAuto(); },12000);
  toast('自动播放：每 12 秒一页（P 暂停）');
}
function fs(){
  const el=document.documentElement;
  const immersive=document.body.classList.contains('immersive');
  if(document.fullscreenElement || immersive){
    document.body.classList.remove('immersive');
    try{ if(document.fullscreenElement) document.exitFullscreen(); }catch(e){}
    toast('已退出全屏');
    fit(); syncChrome();
    return;
  }
  try{
    const p=el.requestFullscreen && el.requestFullscreen();
    if(p && p.catch) p.catch(()=>toast('浏览器拦截了原生全屏，已进入沉浸模式'));
  }catch(e){}
  document.body.classList.add('immersive');
  toast('全屏：底部快捷键常驻（F 或 Esc 退出）');
  fit(); syncChrome();
}
document.addEventListener('fullscreenchange',()=>{
  if(!document.fullscreenElement) document.body.classList.remove('immersive');
  fit(); syncChrome();
});

/* ---------- 三处动画：输入 + 播放/暂停 + 单步 + 重置 ---------- */
const ANIMS=[];
function mkBase(max){ const a={step:0,max:max,timer:null,
  pause(){ if(this.timer){clearInterval(this.timer);this.timer=null;} const b=document.getElementById(this.playId); if(b)b.textContent='▶ 播放'; },
  play(){ if(this.step>=this.max) this.step=0; this.pause(); this.paint();
    const b=document.getElementById(this.playId); if(b)b.textContent='❚❚ 暂停';
    this.timer=setInterval(()=>{ if(this.step>=this.max){this.pause();return;} this.step++; this.paint(); },700); },
  stepOnce(){ this.pause(); if(this.step<this.max){this.step++;this.paint();} },
  reset(){ this.pause(); this.step=0; this.paint(); }
}; ANIMS.push(a); return a; }
function stopAnims(){ ANIMS.forEach(a=>a.pause()); }

/* A · 第 06 页：ExecNestLoop 主循环；key 与命中行数为设定示意值 */
const a=mkBase(5); a.playId='a-play';
a.paint=function(){
  const n=+document.getElementById('a-n').value;
  this.max=n;
  if(this.step>n) this.step=n;
  const semi=document.getElementById('a-mode').value==='semi';
  const keys=[42,7,42,99,7], ikeys=[7,42,99,105], cnt={7:1,42:2,99:3,105:0};
  let loops=0, innerRows=0; const res=[];
  for(let k=0;k<5;k++){
    const cur=(k===this.step-1), done=k<this.step, usable=k<n;
    setA('a-o'+k,'fill',cur?'#E5EFF0':(done?'#F1EFE9':'#F7F6F2'));
    setA('a-o'+k,'stroke',cur?'#245A6B':'#D9D5CB');
    setA('a-o'+k,'stroke-width',cur?'2':'1');
    setA('a-ot'+k,'fill',usable?'#1B2B33':'#89938F');
    if(done&&usable){
      loops++;
      const m=cnt[keys[k]]||0;
      const scanned=semi?Math.min(1,m):m;
      innerRows+=scanned;
      for(let j=0;j<Math.min(scanned,2);j++) res.push('r'+(k+1)+' + o(key '+keys[k]+')');
    }
  }
  const kidx=ikeys.indexOf(keys[this.step-1]);
  for(let k=0;k<4;k++){
    const on=(this.step>0 && k===kidx);
    setA('a-i'+k,'fill',on?'#E5EFF0':'#FFFFFF');
    setA('a-i'+k,'stroke',on?'#245A6B':'#D9D5CB');
    setA('a-i'+k,'stroke-width',on?'2':'1');
    for(let j=0;j<4;j++){
      const valid=j<cnt[ikeys[k]];
      const scanned=valid&&on;
      setA('a-ic-'+k+'-'+j,'fill',scanned?'#E4F0EA':(valid?'#F7E9DE':'#F1EFE9'));
      setA('a-ic-'+k+'-'+j,'stroke',scanned?'#2F7A66':(valid?'#BE653B':'#D9D5CB'));
      setT('a-ict-'+k+'-'+j, scanned?'hit':(valid?'o':'·'));
      setA('a-ict-'+k+'-'+j,'fill',scanned?'#2F7A66':(valid?'#BE653B':'#89938F'));
    }
  }
  for(let j=0;j<6;j++){
    setT('a-r'+j, j<res.length?res[j]:'—');
    setA('a-r'+j,'fill', j<res.length?'#2F7A66':'#89938F');
  }
  setT('a-param', this.step>0?String(keys[this.step-1]):'—');
  setT('a-loops', String(loops));
  setT('a-stage', this.step===0?'等待开始 · 点播放或单步'
    :'阶段 '+this.step+' / '+n+'：outer r'+this.step+' key='+keys[this.step-1]
      +' → 写 PARAM_EXEC → 重扫 inner（loops='+loops+'）');
  const out=document.getElementById('a-out');
  if(out) out.innerHTML='<b>'+(semi?'SEMI 早停':'INNER 全扫')+' · '+n+' 行</b>　loops '+loops
    +' · inner 已处理 '+innerRows+' 行（示意 · 非实测）';
};

/* B · 第 10 页：成本放大；条形为相对量示意，非实测、非 PostgreSQL 成本单位 */
const b=mkBase(20); b.playId='b-play';
b.paint=function(){
  const outer=+document.getElementById('b-outer').value;
  const per=+document.getElementById('b-per').value;
  const early=document.getElementById('b-early').value==='1';
  const memo=document.getElementById('b-memo').value==='1';
  const rep=document.getElementById('b-rep').value;
  const perArr=[100, per, early?Math.min(1,per):per, memo?per*(rep==='high'?0.4:0.8):per];
  const processed=outer*this.step/20;
  const vals=perArr.map(p=>processed*p);
  const peak=Math.max.apply(null,perArr.map(p=>outer*p).concat([1]));
  for(let k=0;k<4;k++){
    setA('b-bar'+k,'width',Math.max(0,530*vals[k]/peak).toFixed(1));
    setT('b-val'+k,fmt(vals[k]));
  }
  for(let j=0;j<20;j++){
    setA('b-g'+j,'fill',j<this.step?'#245A6B':'#F1EFE9');
    setA('b-g'+j,'stroke',j<this.step?'#245A6B':'#D9D5CB');
  }
  setT('b-stage', this.step===0?'等待开始 · 点播放或单步'
    :'outer 已推进 '+fmt(processed)+' / '+fmt(outer)+' 行 · 第 '+this.step+'/20 步');
  const out=document.getElementById('b-out');
  if(out) out.innerHTML='<b>第 '+this.step+'/20 步</b>　'
    +fmt(vals[0])+' / '+fmt(vals[1])+' / '+fmt(vals[2])+' / '+fmt(vals[3])+'（示意）';
};

/* M · 第 12 页：Memoize 缓存；key 序列与容量为设定示意值 */
const m=mkBase(5); m.playId='m-play';
m.paint=function(){
  const seqs=[[42,42,42,99,42],[42,99,7,42,105],[42,42,7,7,42]];
  const keys=seqs[+document.getElementById('m-seq').value];
  const memo=document.getElementById('m-memo').value==='1';
  let look=0,hit=0,last='等待开始';
  const cache=[];
  for(let k=0;k<5;k++){
    setT('m-ot'+k,'key '+keys[k]);
    const cur=(k===this.step-1);
    setA('m-o'+k,'fill',cur?'#E5EFF0':'#F1EFE9');
    setA('m-o'+k,'stroke',cur?'#245A6B':'#D9D5CB');
    setA('m-o'+k,'stroke-width',cur?'2':'1');
    if(k<this.step){
      const key=keys[k], ci=cache.indexOf(key);
      if(memo && ci>=0){
        hit++;
        setA('m-s'+k,'fill','#E4F0EA'); setA('m-s'+k,'stroke','#2F7A66');
        setT('m-st'+k,'缓存命中'); setA('m-st'+k,'fill','#2F7A66');
        last='key '+key+' 命中缓存，跳过 inner 查找';
      }else{
        look++;
        setA('m-s'+k,'fill','#F7E9DE'); setA('m-s'+k,'stroke','#BE653B');
        setT('m-st'+k,'查索引'); setA('m-st'+k,'fill','#BE653B');
        if(memo){ if(cache.length>=4) cache.shift(); cache.push(key); }
        last='key '+key+(memo?' 查索引并写入缓存':' 查索引（无缓存）');
      }
    }else{
      setA('m-s'+k,'fill','#F1EFE9'); setA('m-s'+k,'stroke','#D9D5CB');
      setT('m-st'+k,'—'); setA('m-st'+k,'fill','#89938F');
    }
  }
  for(let j=0;j<4;j++){
    const v=cache[j];
    setA('m-c'+j,'fill',v!=null?'#E5EFF0':'#FFFFFF');
    setT('m-ct'+j,v!=null?'key '+v:'—');
    setA('m-ct'+j,'fill',v!=null?'#245A6B':'#89938F');
  }
  setT('m-cnt',Math.min(this.step,5)+' / 5');
  setT('m-look',String(look)); setT('m-hit',String(hit));
  setT('m-desc',last);
  setT('m-cur',memo?('Memoize 开 · '+look+' 次索引查找 + '+hit+' 次缓存命中')
                    :('Memoize 关 · '+look+' 次索引查找（每次 outer 都查）'));
  const out=document.getElementById('m-out');
  if(out) out.innerHTML='<b>'+(memo?'Memoize 开':'Memoize 关')+' · 第 '+this.step+'/5 步</b>　索引查找 '
    +look+' 次 · 缓存命中 '+hit+' 次（示意 · 非实测）';
};

function bindAnim(pre,a){
  document.getElementById(a.playId).onclick=()=>{ if(a.timer)a.pause(); else a.play(); };
  document.getElementById(pre+'-step').onclick=()=>a.stepOnce();
  document.getElementById(pre+'-reset').onclick=()=>a.reset();
  a.paint();
}

/* ---------- 键盘 ---------- */
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  const typing=(tag==='input'||tag==='select'||tag==='textarea');
  const k=e.key;
  if(k==='Escape'){
    if(typing){ e.target.blur(); return; }
    if(panelOn) closePanel();
    else if(document.fullscreenElement || document.body.classList.contains('immersive')) fs();
    return;
  }
  if(typing) return;
  if(k==='ArrowRight'||k===' '||k==='PageDown'){ e.preventDefault(); next(); }
  else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); prev(); }
  else if(k==='f'||k==='F'){ e.preventDefault(); fs(); }
  else if(k==='g'||k==='G'){ e.preventDefault(); openPanel('toc'); }
  else if(k==='n'||k==='N'){ e.preventDefault(); openPanel('here'); }
  else if(k==='t'||k==='T'){ e.preventDefault(); openPanel('all'); }
  else if(k==='p'||k==='P'){ e.preventDefault(); toggleAuto(); }
  else if(k==='?'||k==='h'||k==='H'){ e.preventDefault(); openPanel('help'); }
  else if(k==='Home'){ e.preventDefault(); go(0); }
  else if(k==='End'){ e.preventDefault(); go(N-1); }
  else if(/^[1-9]$/.test(k)){ go(parseInt(k,10)-1); }
});

/* ---------- 启动 ---------- */
function init(){
  render();
  $('#jump').max=String(N);
  $('#btnPrev').onclick=prev; $('#btnNext').onclick=next;
  $('#btnToc').onclick=()=>openPanel('toc');
  $('#btnNotes').onclick=()=>openPanel('here');
  $('#btnAll').onclick=()=>openPanel('all');
  $('#btnHelp').onclick=()=>openPanel('help');
  $('#btnAuto').onclick=toggleAuto;
  $('#btnFs').onclick=fs;
  $('#nClose').onclick=closePanel;
  $('#jump').onkeydown=e=>{
    if(e.key==='Enter'){ e.preventDefault();
      const v=parseInt($('#jump').value||'1',10);
      go(Number.isNaN(v)?0:Math.max(0,Math.min(N-1,v-1))); $('#jump').blur(); }
  };
  const inputs={
    'a-n':a,'a-mode':a,
    'b-outer':b,'b-per':b,'b-early':b,'b-memo':b,'b-rep':b,
    'm-seq':m,'m-memo':m
  };
  Object.keys(inputs).forEach(id=>{
    const e=document.getElementById(id), an=inputs[id];
    ['input','change'].forEach(t=>e.addEventListener(t,()=>{ an.pause(); an.step=0; an.paint(); }));
  });
  bindAnim('a',a); bindAnim('b',b); bindAnim('m',m);
  fit(); go(0,true);
  setTimeout(()=>document.body.classList.add('ready'),80);
}
document.addEventListener('DOMContentLoaded',init);

</script>
