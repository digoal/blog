<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数据库筑基课 · Nested Loop Join</title>
<!-- 单文件交付：所有原理图均为现场绘制的内联 SVG，零外部图片 / 字体 / 脚本依赖。 -->
<style>
:root{
  --bg:#F7F6F2; --bg2:#F1EFE9; --ink:#1B2B33; --ink2:#46585F; --muted:#89938F; --line:#D9D5CB;
  --primary:#245A6B; --prim-l:#E5EFF0; --accent:#BE653B; --acc-l:#F7E9DE;
  --green:#2F7A66; --green-l:#E4F0EA; --gold:#AE8A3E; --gold-l:#F5EDDC;
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#E9E7E1}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
#viewport{position:absolute;inset:0 0 66px 0;overflow:hidden}
#stage{position:absolute;width:1600px;height:900px;background:var(--bg);
  transform-origin:top left;box-shadow:0 16px 54px rgba(27,43,51,.12)}
body.ready #stage{transition:transform .36s cubic-bezier(.2,.7,.2,1),left .36s cubic-bezier(.2,.7,.2,1),top .36s cubic-bezier(.2,.7,.2,1)}
.slide{position:absolute;inset:0;display:none;background:var(--bg)}
.slide.on{display:block;animation:fadein .4s cubic-bezier(.2,.7,.2,1)}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.eyebrow{position:absolute;left:64px;top:44px;font-size:13px;letter-spacing:3.4px;color:var(--primary);font-weight:600}
.eyebrow .num{font-family:var(--mono);letter-spacing:1px;color:var(--accent);margin-right:14px}
h1.title{position:absolute;left:64px;top:70px;margin:0;font-family:var(--serif);font-size:44px;
  line-height:1.25;font-weight:700;letter-spacing:1.2px;color:var(--ink)}
.lede{position:absolute;left:64px;top:139px;width:1440px;font-size:19px;color:var(--ink2);line-height:1.5;letter-spacing:.3px}
.rule{position:absolute;left:64px;top:181px;width:1472px;height:1px;background:var(--line)}
.figwrap{position:absolute;left:100px;top:198px;width:1400px;height:430px}
svg.figure{display:block;overflow:visible}
.caption{position:absolute;left:100px;top:638px;width:1400px;font-size:13px;color:var(--muted);letter-spacing:.4px}
.bridge{position:absolute;left:64px;top:716px;width:1472px;font-size:20px;color:var(--accent);
  line-height:1.55;letter-spacing:.4px;padding-left:18px;border-left:3px solid var(--accent);font-family:var(--serif)}
.bridge .bk{font-family:var(--sans);font-size:13px;color:var(--muted);letter-spacing:2px;display:block;margin-bottom:2px}
.footer{position:absolute;left:64px;top:846px;width:1472px;height:1px;background:var(--line)}
.footer .fl{position:absolute;left:0;top:14px;font-size:12.5px;color:var(--muted);letter-spacing:2px}
.footer .fr{position:absolute;right:0;top:12px;font-family:var(--mono);font-size:14px;color:var(--ink2)}
.footer .fbar{position:absolute;left:0;right:0;top:-1px;height:2px;background:transparent}
.footer .fbar i{display:block;height:2px;background:var(--primary);width:0;transition:width .4s ease}

/* 动画控件：位于图下方独立条带，不覆盖图 */
.ctrls{position:absolute;left:100px;top:664px;width:1400px;height:40px;display:flex;align-items:center;gap:8px}
.ctrls label{font-size:12px;color:var(--ink2);white-space:nowrap}
.ctrls select,.ctrls input[type=range]{font-family:var(--sans);font-size:12px;color:var(--ink);
  background:#fff;border:1px solid var(--line);border-radius:4px;padding:4px 5px;outline:none;max-width:190px}
.ctrls .btn{min-height:30px;padding:5px 11px;border:1px solid var(--primary);border-radius:4px;
  background:#fff;color:var(--primary);font-size:12px;cursor:pointer;font-family:var(--sans);white-space:nowrap}
.ctrls .btn.play{background:var(--primary);color:#fff}
.ctrls .btn:hover{filter:brightness(.94)}
.ctrls .out{font-size:11.5px;color:var(--ink2);margin-left:auto;min-width:0;flex:1;max-width:430px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrls .out b{color:var(--accent);font-weight:600}

/* 底部外壳：两行，全屏后按键仍常驻 */
.chrome{position:fixed;left:0;right:0;bottom:0;height:66px;background:#FCFBF8;
  border-top:1px solid var(--line);z-index:40;display:flex;flex-direction:column;padding:6px 18px 5px;gap:4px}
.chrome .r1{display:flex;align-items:center;gap:7px;height:32px;flex:0 0 32px}
.chrome .r2{display:flex;align-items:center;font-size:11.5px;color:var(--muted);
  white-space:nowrap;overflow:hidden;line-height:1.2}
.chrome .r2 span{padding:0 10px;border-right:1px solid var(--line)}
.chrome .r2 span:first-child{padding-left:0}
.chrome .r2 span:last-child{border-right:none}
.chrome button{font-family:var(--sans);font-size:13px;color:var(--ink2);background:transparent;
  border:1px solid transparent;border-radius:5px;padding:6px 11px;cursor:pointer;white-space:nowrap}
.chrome button:hover{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome button.act{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome input.jump{font-family:var(--mono);font-size:12px;color:var(--ink2);background:#fff;
  border:1px solid var(--line);border-radius:5px;padding:5px 6px;width:56px;outline:none;text-align:center}
.chrome .pg{font-family:var(--mono);font-size:14px;color:var(--ink);min-width:76px;text-align:center}
.chrome .track{flex:1;height:3px;background:var(--line);border-radius:3px;margin:0 12px;position:relative;min-width:40px}
.chrome .track i{position:absolute;left:0;top:0;height:3px;background:var(--primary);border-radius:3px;transition:width .35s}
body.immersive .chrome{background:var(--bg2)}
body.immersive{background:#E9E7E1}

/* 页内开窗：右侧讲稿，不是弹窗 */
#notes{position:fixed;right:0;top:0;bottom:66px;width:38vw;min-width:380px;max-width:620px;
  background:#FCFBF8;border-left:1px solid var(--line);z-index:30;display:flex;flex-direction:column;
  transform:translateX(101%);transition:transform .36s cubic-bezier(.2,.7,.2,1);
  box-shadow:-14px 0 44px rgba(27,43,51,.07)}
body.panel-on #notes{transform:translateX(0)}
.nhead{padding:16px 22px 13px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex:0 0 auto}
.nhead .nt{font-family:var(--serif);font-size:21px;color:var(--ink);font-weight:700;flex:1}
.nhead .ns{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.nhead button{font-family:var(--sans);font-size:12.5px;background:#fff;border:1px solid var(--line);
  border-radius:5px;padding:6px 11px;cursor:pointer;color:var(--ink2)}
.nhead button:hover{border-color:var(--primary);color:var(--primary)}
.nbody{flex:1;overflow-y:auto;position:relative;padding:6px 22px 44px;scroll-behavior:smooth}
.nbody::-webkit-scrollbar{width:9px}
.nbody::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
.nsec{border-top:1px solid var(--line);padding:18px 0 22px}
.nsec:first-child{border-top:none}
.nsec .sn{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:1px}
.nsec h3{margin:8px 0 11px;font-family:var(--serif);font-size:21px;color:var(--primary);line-height:1.4}
.nsec p{margin:0;font-size:15.5px;line-height:2.0;color:var(--ink2);letter-spacing:.2px}
.nsec .br{margin-top:13px;font-family:var(--serif);font-size:15px;color:var(--accent);line-height:1.8;
  padding-left:12px;border-left:2px solid var(--accent)}
.nsec.cur{background:var(--prim-l);margin:0 -22px;padding-left:22px;padding-right:22px}
.tocgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:8px 0 20px}
.tocgrid a{display:block;padding:12px 13px;border:1px solid var(--line);border-radius:5px;
  background:#fff;text-decoration:none;color:var(--ink);cursor:pointer;transition:.2s}
.tocgrid a:hover{border-color:var(--primary);background:var(--prim-l)}
.tocgrid a.cur{border-color:var(--accent);background:var(--acc-l)}
.tocgrid a .gn{font-family:var(--mono);font-size:12px;color:var(--accent)}
.tocgrid a .gt{font-family:var(--serif);font-size:15px;line-height:1.4;display:block;margin-top:5px}
.keygrid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px 24px;font-size:14.5px;
  line-height:1.8;padding:12px 0 6px;color:var(--ink2)}
.keygrid kbd{font-family:var(--mono);background:#fff;border:1px solid var(--line);
  border-bottom-width:2px;border-radius:4px;padding:2px 7px;color:var(--primary);margin-right:8px}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ink);
  color:#fff;font-size:13px;padding:9px 16px;border-radius:5px;opacity:0;transition:.3s;z-index:80;pointer-events:none}
.toast.on{opacity:1}
@media print{
  html,body{overflow:visible;background:#fff;height:auto}
  #viewport{position:static;overflow:visible}
  #stage{position:static;transform:none!important;box-shadow:none;transition:none}
  .slide{display:block!important;position:relative;height:900px;page-break-after:always;animation:none}
  .chrome,#notes,.toast,.ctrls{display:none!important}
}
</style>
</head>

<svg id="svgdefs" xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true"><defs><marker id="arr-prim" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L6,3 z" fill="#245A6B"/></marker><marker id="arr-acc" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L6,3 z" fill="#BE653B"/></marker><marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L6,3 z" fill="#2F7A66"/></marker><marker id="arr-gold" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L6,3 z" fill="#AE8A3E"/></marker><marker id="arr-ink" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L6,3 z" fill="#1B2B33"/></marker><marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L6,3 z" fill="#89938F"/></marker><marker id="arr-white" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L6,3 z" fill="#FFFFFF"/></marker></defs></svg>
<div id="viewport"><div id="stage"><div id="slides"></div></div></div>
<aside id="notes">
  <div class="nhead"><span class="nt" id="nTitle">讲稿</span><span class="ns" id="nSub"></span>
    <button id="nClose">关闭 ✕</button></div>

</aside>
<div class="chrome">
  <div class="r1">
    <button id="btnPrev">← 上一页</button><button id="btnNext">下一页 →</button>
    <span class="pg" id="pg">01 / 23</span>
    <input class="jump" id="jump" type="number" min="1" max="23" value="1" title="输入页码后回车跳转">
    <div class="track"><i id="bar"></i></div>
    <button id="btnToc">目录 G</button>
    <button id="btnNotes">本页讲稿 N</button>
    <button id="btnAll">全文讲稿 T</button>
    <button id="btnAuto">自动播放 P</button>
    <button id="btnFs">全屏 F</button>
    <button id="btnHelp">? 帮助</button>
  </div>
  <div class="r2">
    <span>← → 翻页</span><span>空格 下一页</span><span>F 全屏</span><span>G 目录</span>

    <span>1–9 跳页</span><span>输入页码回车</span><span>Home / End</span><span>Esc 关闭</span><span>? 快捷键</span>
  </div>
</div>

<script>
const D = [{"eyebrow": "开篇 · 一个误解", "title": "不是「最笨的双重循环」", "lede": "朴素双重循环确实存在；但 PostgreSQL 的 NestLoop，价值在于把 outer 当前行的值传进 inner 路径。", "caption": "图 01　朴素双重循环与参数化 NestLoop 对照：左为全量配对，右为带运行期参数的索引点查。", "bridge": "先把「它不是什么」说清楚，才谈得上它到底解决什么问题。", "notes": "很多人第一次看到 Nested Loop，脑子里浮现的就是两重 for 循环：A 的每一行，去 B 的每一行比一遍。这个理解只对了一半。朴素循环确实长那样，但 PostgreSQL 里真正值钱的不是这个循环，而是循环里多出来的一条通道 —— 把 outer 当前行的值，传给 inner 路径。你想，如果 B 上有个以 join key 打头的索引，每行 A 只需要带着自己的 X 去索引里查一次，B 的百万行根本不用全读。所以这一场不按功能清单讲，我们按一条因果链往下推：先看清它不是什么，再看它解决什么问题，然后一层层拆到 PARAM_EXEC、成本模型、Memoize，最后回到你库里的 EXPLAIN。一路上我会反复问同一句话：这一行 outer，inner 到底要付多少钱。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >循环只是外壳，真正的差别在「inner 怎么被重扫」<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >开篇 · 朴素双重循环 vs PostgreSQL 的 NestLoop<\/text><text x=\"24\" y=\"78\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"2\" opacity=\"1\" >误解 · 朴素双重循环<\/text><rect x=\"24\" y=\"90\" width=\"610\" height=\"220\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"50\" y=\"131.96\" font-size=\"19\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >for each row in A:<\/text><text x=\"50\" y=\"160.46\" font-size=\"19\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >    for each row in B:<\/text><text x=\"50\" y=\"188.96\" font-size=\"19\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >        test A.key = B.key<\/text><rect x=\"24\" y=\"272\" width=\"610\" height=\"30\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"329\" y=\"291.76\" font-size=\"14\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >每个 outer 行 × 整张 inner 表<\/text><text x=\"720\" y=\"78\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"2\" opacity=\"1\" >正解 · 带参数化 inner path 的 NestLoop<\/text><rect x=\"720\" y=\"90\" width=\"656\" height=\"220\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"746\" y=\"131.12\" font-size=\"18\" fill=\"#1B2B33\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >for each row in A:<\/text><text x=\"746\" y=\"158.12\" font-size=\"18\" fill=\"#1B2B33\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >    A.X → PARAM_EXEC → inner Index Cond<\/text><text x=\"746\" y=\"185.12\" font-size=\"18\" fill=\"#1B2B33\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >    Index Scan using B_Y_IDX on B<\/text><text x=\"746\" y=\"212.12\" font-size=\"18\" fill=\"#1B2B33\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >        B.Y = 常量<\/text><rect x=\"720\" y=\"272\" width=\"656\" height=\"30\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1048\" y=\"291.76\" font-size=\"14\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >每个 outer 行 × 一次便宜的 inner 定点查找<\/text><path d=\"M 640 200 L 714 200\" fill=\"none\" stroke=\"#BE653B\" stroke-width=\"2\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-acc)\"/><text x=\"677\" y=\"186\" font-size=\"12\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >传值<\/text><rect x=\"24\" y=\"326\" width=\"1352\" height=\"66\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"44\" y=\"356\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >朴素循环：A 与 B 全量配对，比较次数随两边规模相乘。<\/text><text x=\"44\" y=\"380\" font-size=\"14\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >PostgreSQL：outer 当前行的值传进 inner 路径，让索引 / 参数化子查询 / Memoize 快速找匹配行。<\/text><text x=\"24\" y=\"414\" font-size=\"13.5\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >一页一命题：不是循环形式变了，是 inner 的访问方式变了。<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "场景 · 一条真实查询", "title": "少量外表行，驱动大表定点查找", "lede": "orders 关联 customers，过滤后客户很少、订单表很大且 join key 上有索引 —— 这正是它的优势区间。", "caption": "图 02　一条 join 查询的两种读法与三步执行；数字为 DEMO 造数设定，不是实测性能数据。", "bridge": "这条路径好用的前提，藏在两个数字里：outer 有多少行，inner 每次重扫多贵。", "notes": "先看一个最普通的查询：订单 join 客户，只看 region 等于 CN 的客户。原文给的 DEMO 造数是客户表一万行、其中 CN 一百行，订单表一百万行，customer_id 上有索引。注意，这些是造数设定，不是实测性能数字。数据库有两种读法。第一种，把一百万行订单全扫一遍，再和过滤后的客户配对；第二种，先取出那一百个 CN 客户，每拿到一个 id，就去订单的索引里定点查它名下的订单，然后把结果和当前客户行组合返回。Nested Loop 就是第二种。它的优势区间用一句话说清：把大表全量处理，改成少量外表行驱动的大表定点查找。但你也马上能感觉到它的软肋 —— 这个好处完全依赖「一百行」这个前提。要是过滤条件一变，外表冒出来十万行，同样的计划就会把内表成本乘十万倍。这就引出了下一页：Join 其实一直在回答两个问题。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >一条查询，两种读法：全量处理，还是少量驱动定点查找<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >场景 · orders ⋈ customers WHERE region = CN　｜　数字为 DEMO 造数设定，非实测性能数据<\/text><rect x=\"1226\" y=\"14\" width=\"150\" height=\"22\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1301\" y=\"28.91\" font-size=\"11.5\" fill=\"#AE8A3E\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >DEMO 设定 · 非实测<\/text><text x=\"24\" y=\"78\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"2\" opacity=\"1\" >查询形态<\/text><rect x=\"24\" y=\"90\" width=\"600\" height=\"124\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"40\" y=\"108\" font-size=\"13\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >SELECT *<\/text><text x=\"40\" y=\"130.1\" font-size=\"13\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >FROM orders o<\/text><text x=\"40\" y=\"152.2\" font-size=\"13\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >JOIN customers c ON c.id = o.customer_id<\/text><text x=\"40\" y=\"174.3\" font-size=\"13\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >WHERE c.region = 'CN';<\/text><text x=\"24\" y=\"242\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"2\" opacity=\"1\" >两种读法<\/text><rect x=\"24\" y=\"254\" width=\"600\" height=\"54\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"44\" y=\"286.1\" font-size=\"15\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >全量：先扫 orders 的 100 万行，再和过滤后的客户配对<\/text><rect x=\"24\" y=\"318\" width=\"600\" height=\"54\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" opacity=\"1\" /><text x=\"44\" y=\"350.1\" font-size=\"15\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >定点：先取 CN 客户，再按 c.id 查订单索引<\/text><text x=\"660\" y=\"78\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"2\" opacity=\"1\" >NestLoop 的三步执行<\/text><rect x=\"660\" y=\"90\" width=\"716\" height=\"74\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"660\" y=\"90\" width=\"6\" height=\"74\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><rect x=\"676\" y=\"110\" width=\"38\" height=\"32\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"695\" y=\"130.08\" font-size=\"12\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >01<\/text><text x=\"730\" y=\"122\" font-size=\"18\" fill=\"#1B2B33\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >region = CN 的客户<\/text><text x=\"730\" y=\"147\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >DEMO 设定：100 行 CN 客户 / 10000 行客户表<\/text><path d=\"M 1018 164 L 1018 178\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-prim)\"/><rect x=\"660\" y=\"178\" width=\"716\" height=\"74\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"660\" y=\"178\" width=\"6\" height=\"74\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><rect x=\"676\" y=\"198\" width=\"38\" height=\"32\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"695\" y=\"218.08\" font-size=\"12\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >02<\/text><text x=\"730\" y=\"210\" font-size=\"18\" fill=\"#1B2B33\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >按 c.id 查 orders_customer_id_idx<\/text><text x=\"730\" y=\"235\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >每拿到一个客户 id，inner 用索引做定点查找<\/text><path d=\"M 1018 252 L 1018 266\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-prim)\"/><rect x=\"660\" y=\"266\" width=\"716\" height=\"74\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"660\" y=\"266\" width=\"6\" height=\"74\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><rect x=\"676\" y=\"286\" width=\"38\" height=\"32\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"695\" y=\"306.08\" font-size=\"12\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >03<\/text><text x=\"730\" y=\"298\" font-size=\"18\" fill=\"#1B2B33\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >把订单与当前客户行组合返回<\/text><text x=\"730\" y=\"323\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >上层要一行，执行器就推进一对匹配<\/text><rect x=\"660\" y=\"354\" width=\"716\" height=\"30\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"676\" y=\"374\" font-size=\"13.5\" fill=\"#AE8A3E\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >优势区间：把「大表全量处理」改成「少量外表行驱动的大表定点查找」。<\/text><text x=\"24\" y=\"412\" font-size=\"13.5\" fill=\"#BE653B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >代价：它牺牲了稳定性 —— 一旦 outer 行数估错，内表成本会按倍数放大。<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "定位 · 三层剖面", "title": "Join 要回答两个问题", "lede": "语义上「哪些行该组合」只是第一层；数据库还必须回答「先读谁、怎么读、每行付多少代价」。", "caption": "图 03　语义层 / 路径层 / 执行层三层剖面；颜色越深越底层。", "bridge": "NestLoop 的全部性格，来自它对执行层那句回答。", "notes": "Join 从来不只是语义问题。满足条件的行组合起来，只是第一层，回答结果对不对；第二层是路径层，得决定先读谁、谁当 outer、谁当 inner、inner 能不能被参数化、要不要加 Memoize 或 Materialize；第三层是执行层，得算每读一行 outer，inner 要重扫一次，这次重扫是走索引还是全表、缓存命中不命中、joinqual 要过几行。我把这三层画成一张剖面，颜色越深越底层。你可以拿它对照之前讲过的 Hash Join 和 Merge Join：它们的差别其实也都在第二、第三层，语义层长得一模一样。NestLoop 的全部性格，就来自它对执行层那句回答 —— 一行 outer，一次 inner 重扫。我们先把这句话在时间轴上摊开。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >Join 要回答两个问题：语义上怎么配，执行上先读谁<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >定位 · 语义层 / 路径层 / 执行层；颜色越深越底层<\/text><rect x=\"24\" y=\"62\" width=\"1352\" height=\"96\" rx=\"0\" fill=\"#EBF1EE\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"62\" width=\"6\" height=\"96\" rx=\"0\" fill=\"#1E4B5A\" opacity=\"1\" /><text x=\"48\" y=\"102\" font-size=\"22\" fill=\"#1B2B33\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >语义层<\/text><text x=\"48\" y=\"130\" font-size=\"14\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >哪些行应该组合<\/text><rect x=\"300\" y=\"78\" width=\"1\" height=\"64\" rx=\"0\" fill=\"#D9D5CB\" stroke=\"1\" stroke-width=\"1\" opacity=\"1\" /><text x=\"326\" y=\"104\" font-size=\"15\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >JOIN 条件　·　WHERE 过滤　·　投影列　·　LEFT / SEMI / ANTI 语义<\/text><text x=\"326\" y=\"132\" font-size=\"13\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >→ 只决定「结果对不对」<\/text><rect x=\"24\" y=\"168\" width=\"1352\" height=\"96\" rx=\"0\" fill=\"#A4C4C6\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"168\" width=\"6\" height=\"96\" rx=\"0\" fill=\"#1E4B5A\" opacity=\"1\" /><text x=\"48\" y=\"208\" font-size=\"22\" fill=\"#1B2B33\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >路径层<\/text><text x=\"48\" y=\"236\" font-size=\"14\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >先读谁、怎么读<\/text><rect x=\"300\" y=\"184\" width=\"1\" height=\"64\" rx=\"0\" fill=\"#D9D5CB\" stroke=\"1\" stroke-width=\"1\" opacity=\"1\" /><text x=\"326\" y=\"210\" font-size=\"15\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >outer / inner 顺序　·　参数化 inner path　·　Memoize　·　Materialize<\/text><text x=\"326\" y=\"238\" font-size=\"13\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >→ 决定「有没有便宜的 inner 路径」<\/text><rect x=\"24\" y=\"274\" width=\"1352\" height=\"96\" rx=\"0\" fill=\"#2E6373\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"274\" width=\"6\" height=\"96\" rx=\"0\" fill=\"#1E4B5A\" opacity=\"1\" /><text x=\"48\" y=\"314\" font-size=\"22\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >执行层<\/text><text x=\"48\" y=\"342\" font-size=\"14\" fill=\"#FFFFFF\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >每读一行要付多少<\/text><rect x=\"300\" y=\"290\" width=\"1\" height=\"64\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"1\" stroke-width=\"1\" opacity=\"1\" /><text x=\"326\" y=\"316\" font-size=\"15\" fill=\"#FFFFFF\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >取一行 outer → 写 PARAM_EXEC → 重扫 inner → 检查 joinqual<\/text><text x=\"326\" y=\"344\" font-size=\"13\" fill=\"#FFFFFF\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >→ 决定「每行 outer 的真实代价」<\/text><path d=\"M 12 70 L 12 350\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-prim)\"/><text x=\"24\" y=\"392\" font-size=\"13.5\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >NestLoop 的全部性格，来自它对执行层那句回答：一行 outer，一次 inner 重扫。<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "定义 · 主循环", "title": "一行 outer，一次 inner 重扫", "lede": "执行器取一行外表，反复从内表取匹配行；inner 耗尽再取下一行 outer，并重扫 inner。", "caption": "图 04　三行 outer 对应三次独立 inner 重扫；绿色格子为该次命中行，示意非实测。", "bridge": "循环谁都会写；PostgreSQL 加进来的，是循环里那条运行期传值通道。", "notes": "执行器做的事非常朴素：从 outer 取一行，放进表达式上下文；然后把 inner 从头部重新扫一遍，找到满足 joinqual 的组合就返回；inner 扫到底了，再取下一行 outer，重扫 inner；直到 outer 也耗尽。图里三行 outer，对应三次独立的 inner 重扫，绿色的小格子是这一次里命中的行。这里有两个容易混的词要分清：重扫不是重新规划，计划树早就定好了，变的是运行期的参数值；另外，LEFT 和 ANTI join 在某个 outer 行一个 inner 都没匹配上时，还得补一行 null-extended 的结果，所以循环不能简单地「没匹配就跳过」。好，循环本身没什么可神秘的，PostgreSQL 加进来的，是循环里那条运行期传值通道。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >outer 取一行，inner 就从头重扫一次<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >定义 · 执行器主循环的时序；格子为示意，非实测<\/text><text x=\"24\" y=\"76\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"2\" opacity=\"1\" >outer 行<\/text><text x=\"230\" y=\"76\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"2\" opacity=\"1\" >inner 重扫（每行 outer 都重来一次）<\/text><text x=\"1130\" y=\"76\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"2\" opacity=\"1\" >返回组合<\/text><rect x=\"24\" y=\"88\" width=\"180\" height=\"64\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"114\" y=\"125.1\" font-size=\"15\" fill=\"#245A6B\" font-family=\"PingFa y=\"414\" font-size=\"13.5\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >循环谁都会写；PostgreSQL 加进来的，是循环里那条「运行期传值通道」。<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "结构 · 源码地图", "title": "五层结构，各管一段", "lede": "路径、成本、计划、执行、参数机制各有专属结构；还有一条必须记住的 join 类型边界。", "caption": "图 05　五层关键结构与作用；底部为 match_unsorted_outer 的 join 类型限制。", "bridge": "结构认清了，先看最热闹的那一层：执行器主循环怎么走。", "notes": "先把源码地图摆好，免得后面提函数名时你不知道它在哪一层。路径层是 NestPath，优化器里的一个候选；成本层是 initial_cost_nestloop 和 final_cost_nestloop，一快一慢两次估算；计划层是 NestLoop 和 NestLoopParam，记录子计划和要传给 inner 的参数；执行层是 ExecNestLoop，真正驱动循环；底下还躺着一个 PARAM_EXEC，执行器内部的参数槽，负责 outer 到 inner 的运行期传值。还有个边界必须现在就记住：joinpath.c 的 match_unsorted_outer 明确写了，Nestloop only supports inner, left, semi, and anti joins —— right、right anti、full 不能用普通 NestLoop 实现。这个限制不是实现偷懒，是 null-extended 语义决定了它没法用「outer 驱动 inner」的形状表达。结构认清了，我们看最热闹的执行层。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >从 NestPath 到 PARAM_EXEC：五层结构各管一段<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >结构 · 路径 / 成本 / 计划 / 执行 / 参数机制；依据原文结构表重绘<\/text><rect x=\"24\" y=\"62\" width=\"180\" height=\"50\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"40\" y=\"88.82\" font-size=\"14\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >层次<\/text><rect x=\"204\" y=\"62\" width=\"520\" height=\"50\" rx=\"0 1\" /><text x=\"40\" y=\"188.755\" font-size=\"13.5\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >成本层<\/text><rect x=\"204\" y=\"162\" width=\"520\" height=\"50\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"220\" y=\"188.755\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >initial_cost_nestloop() / final_cost_nestloop()<\/text><rect x=\"724\" y=\"162\" width=\"652\" height=\"50\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"740\" y=\"188.755\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >估算启动成本、重扫成本、CPU 成本与早停收益<\/text><rect x=\"24\" y=\"212\" width=\"180\" height=\"50\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"40\" y=\"238.755\" font-size=\"13.5\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >计划层<\/text><rect x=\"204\" y=\"212\" width=\"520\" height=\"50\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"220\" y=\"238.755\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >NestLoop / NestLoopParam<\/text><rect x=\"724\" y=\"212\" width=\"652\" height=\"50\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><t 住一件事：loops 永远等于被处理过的 outer 行数，它就是后面所有成本公式里的那个乘数。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >可交互：一行 outer 如何驱动一次 inner 重扫<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >动画 A · ExecNestLoop 主循环；key 与命中行数为设定示意值<\/text><rect x=\"1226\" y=\"14\" width=\"150\" height=\"22\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1301\" y=\"28.91\" font-size=\"11.5\" fill=\"#AE8A3E\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >示意 · 非实测<\/text><text x=\"24\" y=\"72\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"2\" opacity=\"1\" >① outer 队列<\/text><text x=\"270\" y=\"72\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"2\" opacity=\"1\" >② 运行期传值<\/text><text x=\"560\" y=\"72\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"2\" opacity=\"1\" >③ inner · Index Cond: customer_id = $1<\/text><text x=\"1030\" y=\"72\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anc nt-size=\"13.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" id=\"a-r4\">—<\/text><text x=\"1048\" y=\"292\" font-size=\"13.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" id=\"a-r5\">—<\/text><rect x=\"24\" y=\"350\" width=\"320\" height=\"38\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"184\" y=\"374\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >① 取一行 outer<\/text><path d=\"M 344 369 L 364 369\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.4\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-prim)\"/><rect x=\"364\" y=\"350\" width=\"320\" height=\"38\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"524\" y=\"374\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >② 写 PARAM_EXEC + chgParam<\/text><path d=\"M 684 369 L 704 369\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.4\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-prim)\"/><rect x=\"704\" y=\"350\" width=\"320\" height=\"38\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"864\" y=\"374\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >③ 重扫 inner / 索引点查<\/text><path d=\"M 1024 369 L 1044 369\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.4\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-prim)\"/><rect x=\"1044\" y=\"350\" width=\"332\" height=\"38\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1210\" y=\"374\" font-size=\"13\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >④ joinqual → 投影返回<\/text><text x=\"24\" y=\"410\" font-size=\"13\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" id=\"a-stage\">等待开始 · 点播放或单步<\/text><\/svg>", "ctrl": "<label>outer 行数<\/label><select id=\"a-n\"><option value=\"3\">3<\/option><option value=\"4\">4<\/option><option value=\"5\" selected>5<\/option><\/select><label>join 语义<\/label><select id=\"a-mode\"><option value=\"inner\" selected>INNER（扫完 inner）<\/option><option value=\"semi\">SEMI（首个命中即停）<\/option><\/select><button class=\"btn play\" id=\"a-play\">▶ 播放<\/button><button class=\"btn\" id=\"a-step\">单步 →<\/button><button class=\"btn\" id=\"a-reset\">重置<\/button><span class=\"out\" id=\"a-out\"><\/span>"}, {"eyebrow": "执行器 · 三个细节", "title": "qual、Rescan 与 single_match", "lede": "三个细节不改循环结构，只改「什么时候算匹配」与「什么时候该停」。", "caption": "图 07　joinqual / otherqual 分工、Rescan 不主动重扫 inner、single_match 早停。", "bridge": "细节讲完，回到传值通道 —— 它才是 NestLoop 真正的杀伤力。", "notes": "主循环讲完，有三个细节最容易被跳过，却决定语义对不对。第一，joinqual 和 otherqual 分工不同。joinqual 决定当前 outer 算不算「匹配过」，这直接影响 left、anti、semi 的语义；otherqual 是最终返回前还要再过一遍的过滤条件。也正因如此，如果你在 EXPLAIN 里看到 Rows Removed by Join Filter 特别大，说明真正的 join 条件没进 inner 访问路径。第二，ExecReScanNestLoop 不会主动重扫 inner，源码注释专门解释了：inner 会在每个新 outer tuple 时重扫，提前重扫会破坏带运行期 key 的 inner index scan。第三，single_match 来自 inner_unique 或 JOIN_SEMI，命中首个 inner 行就能切到下一行 outer。你看，三件事都没改循环结构，改的是什么时候算匹配，和什么时候该停。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >三个细节不改循环结构，只改「匹配语义」与「重扫时机」<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >执行器 · joinqual / otherqual、ExecReScanNestLoop、single_match<\/text><rect x=\"24\" y=\"62\" width=\"440\" height=\"306\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"62\" width=\"440\" height=\"44\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"42\" y=\"91.2\" font-size=\"20\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >① 两类 qual 分工不同<\/text><rect x=\"42\" y=\"160.76\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"59\" y=\"168.04\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >joinqual 决定 outer 是否算「匹配过」。<\/text><rect x=\"42\" y=\"187.76\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"59\" y=\"195.04\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >这直接影响 left / anti / semi join 的<\/text><text x=\"59\" y=\"222.04\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >null-extended 与不返回语义。<\/text><rect x=\"42\" y=\"241.76\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"59\" y=\"249.04\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >otherqual 是最终返回前仍要检查的过滤条件。<\/text><rect x=\"42\" y=\"268.76\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"59\" y=\"276.04\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >大量行被 Join Filter 移除，说明条件没进 inner 访问路<\/text><text x=\"59\" y=\"303.04\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >径。<\/text><rect x=\"480\" y=\"62\" width=\"440\" height=\"306\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"480\" y=\"62\" width=\"440\" height=\"44\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"498\" y=\"91.2\" font-size=\"20\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >② Rescan 不主动重扫 inner<\/text><rect x=\"498\" y=\"174.26\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"515\" y=\"181.54\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >源码注释明确：inner 在每个新 outer tuple 时重扫。<\/text><rect x=\"498\" y=\"201.26\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"515\" y=\"208.54\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >若 ExecReScanNestLoop() 提前重扫 inner，会破坏带运<\/text><text x=\"515\" y=\"235.54\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >行期 key 的 inner index scan。<\/text><rect x=\"498\" y=\"255.26\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"515\" y=\"262.54\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >chgParam 把「参数变了」告诉 inner，重扫由下一次取行触<\/text><text x=\"515\" y=\"289.54\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >发。<\/text><rect x=\"936\" y=\"62\" width=\"440\" height=\"306\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"936\" y=\"62\" width=\"440\" height=\"44\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"954\" y=\"91.2\" font-size=\"20\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >③ single_match 可早停<\/text><rect x=\"954\" y=\"174.26\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"971\" y=\"181.54\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >single_match 来自 inner_unique 或 JOIN_SEMI。<\/text><rect x=\"954\" y=\"201.26\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"971\" y=\"208.54\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >命中首个 inner 行后，执行器切到下一行 outer。<\/text><rect x=\"954\" y=\"228.26\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"971\" y=\"235.54\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >主键、唯一约束、EXISTS 都会影响成本与执行。<\/text><rect x=\"954\" y=\"255.26\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"971\" y=\"262.54\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >这也是 final_cost_nestloop 要估 inner scan<\/text><text x=\"971\" y=\"289.54\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >fraction 的原因。<\/text><rect x=\"24\" y=\"380\" width=\"1352\" height=\"30\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"40\" y=\"400\" font-size=\"13.5\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >共同点：循环还是那个循环，变的是「什么时候算匹配」和「什么时候该停」。<\/text><text x=\"24\" y=\"424\" font-size=\"13.5\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >细节讲完，回到传值通道 —— 它才是 NestLoop 真正的杀伤力。<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "原理 · 参数化路径", "title": "关键不是 NestLoop，是 inner 被参数化", "lede": "两棵计划树都叫 NestLoop；右边快的根本原因，是 inner 的 B.Y = A.X 变成了 B.Y = 常量。", "caption": "图 08　朴素计划与参数化计划对照；依据 optimizer/README 的 A.X = B.Y 例子重绘。", "bridge": "那么这个「常量」是谁、在什么时候填进去的？顺着源码链走一遍。", "notes": "PostgreSQL 优化器 README 里有个经典的 A.X = B.Y 例子，我把它画成两棵计划树。左边是朴素计划：NestLoop 下面挂着 A 和 B 两个 Seq Scan，B 上挂一个 Filter A.X = B.Y，A 的每一行都要把 B 全扫一遍。右边才是重点：NestLoop 下面 B 变成了 Index Scan using B_Y_IDX，条件是 Index Cond: B.Y = A.X。请注意，两棵树都叫 NestLoop，右边快的根本原因不是「选了 NestLoop」，而是 inner path 被参数化了。每拿到一行 A，A.X 作为运行期参数传给 B 的 index scan，于是对这一次 inner scan 来说，B.Y = A.X 就变成了 B.Y = 常量。Hash Join 和 Merge Join 没法直接吃这种依赖 outer 当前行的路径，这才是 NestLoop 无可替代的地方。那这个常量，是谁、在什么时候填进去的？", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >关键不是「用了 NestLoop」，而是 inner path 被参数化<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >原理 · optimizer/README 的 A.X = B.Y 例子；两棵计划树对照<\/text><text x=\"24\" y=\"78\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"2\" opacity=\"1\" >朴素计划 · inner 全表扫描<\/text><text x=\"720\" y=\"78\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"2\" opacity=\"1\" >参数化计划 · inner 索引扫描<\/text><rect x=\"24\" y=\"92\" width=\"610\" height=\"44\" rx=\"0\" fill=\"#2E6373\" opacity=\"1\" /><text x=\"329\" y=\"120.12\" font-size=\"18\" fill=\"#FFFFFF\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >NestLoop<\/text><path d=\"M 329 136 L 329 158 L 180 158 L 180 176\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-prim)\"/><path d=\"M 329 136 L 329 158 L 478 158 L 478 176\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-prim)\"/><rect x=\"60\" y=\"176\" width=\"240\" height=\"62\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"180\" y=\"212.1\" font-size=\"15\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >Seq Scan on A<\/text><rect x=\"358\" y=\"176\" width=\"240\" height=\"62\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"374\" y=\"201.26\" font-size=\"14\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >Seq Scan on B<\/text><text x=\"374\" y=\"222.26\" font-size=\"14\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >Filter: A.X = B.Y<\/text><rect x=\"60\" y=\"250\" width=\"538\" height=\"36\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"329\" y=\"272.76\" font-size=\"14\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >A 每行 → B 全表重扫 → 逐行比较<\/text><rect x=\"720\" y=\"92\" width=\"656\" height=\"44\" rx=\"0\" fill=\"#2E6373\" opacity=\"1\" /><text x=\"1048\" y=\"120.12\" font-size=\"18\" fill=\"#FFFFFF\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >NestLoop<\/text><path d=\"M 1048 136 L 1048 158 L 896 158 L 896 176\" fill=\"none\" stroke=\"#2F7A66\" stroke-width=\"1.6\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-green)\"/><path d=\"M 1048 136 L 1048 158 L 1210 158 L 1210 176\" fill=\"none\" stroke=\"#2F7A66\" stroke-width=\"1.6\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-green)\"/><rect x=\"776\" y=\"176\" width=\"240\" height=\"62\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"896\" y=\"212.1\" font-size=\"15\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >Seq Scan on A<\/text><rect x=\"1080\" y=\"176\" width=\"260\" height=\"62\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1094\" y=\"201.875\" font-size=\"12.5\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >Index Scan using B_Y_IDX on B<\/text><text x=\"1094\" y=\"220.625\" font-size=\"12.5\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >Index Cond: B.Y = A.X<\/text><rect x=\"720\" y=\"250\" width=\"656\" height=\"36\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1048\" y=\"272.76\" font-size=\"14\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >A 每行 → A.X 传进 inner → 一次索引点查<\/text><path d=\"M 640 210 L 714 210\" fill=\"none\" stroke=\"#BE653B\" stroke-width=\"2\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-acc)\"/><rect x=\"24\" y=\"300\" width=\"1352\" height=\"84\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"44\" y=\"330\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >运行期发生的事：Path.param_info 记录依赖 → 计划期把 inner 里的外表变量换成 Param → 执行期 NestLoopParam 填值。<\/text><text x=\"44\" y=\"360\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >于是对一次 inner scan 来说，B.Y = A.X 变成了 B.Y = 常量。<\/text><text x=\"24\" y=\"414\" font-size=\"13.5\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >那么这个「常量」是谁、在什么时候填进去的？顺着源码链走一遍。<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "源码链 · PARAM_EXEC", "title": "埋槽、换变量、填值", "lede": "六步从优化器走到执行器：param_info、替换 Var、分配 paramno、写 ecxt_param_exec_vals。", "caption": "图 09　参数化路径的六阶段源码链；左侧箭头表示从计划期到执行期的推进方向。", "bridge": "值能传进去，inner 单次成本才可能被压低；成本模型算的正是这笔乘法。", "notes": "顺着源码链走一遍，六步，正好从优化器一直走到执行器。第一步 try_nestloop_path 生成候选，检查参数化是否合法；第二步 match_unsorted_outer 对每个 outer path，去考虑 inner 的 cheapest_parameterized_paths；第三步 createplan.c 的 replace_nestloop_params 把 inner 表达式里来自 outer 的 Var、PlaceHolderVar 换成 Param；第四步 paramassign.c 分配 PARAM_EXEC 的 id，挂到 root->curOuterParams；第五步 identify_current_nestloop_params 找出由当前 NestLoop 左侧能提供的参数；最后第六步，ExecNestLoop 从 outer tuple 取值，写进 ecxt_param_exec_vals 对应的槽。pathnodes.h 里对 PARAM_EXEC 的注释很直白：它可以从 NestLoop 节点传值到 inner relation，尤其用于 inner scan 被 outer 值参数化的场景。值能传进去，inner 单次成本才可能被压低；而成本模型算的，正是这笔乘法。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400 roke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" id=\"b-g12\"/><rect x=\"882\" y=\"398\" width=\"58\" height=\"18\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" id=\"b-g13\"/><rect x=\"948\" y=\"398\" width=\"58\" height=\"18\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" id=\"b-g14\"/><rect x=\"1014\" y=\"398\" width=\"58\" height=\"18\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" id=\"b-g15\"/><rect x=\"1080\" y=\"398\" width=\"58\" height=\"18\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" id=\"b-g16\"/><rect x=\"1146\" y=\"398\" width=\"58\" height=\"18\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" id=\"b-g17\"/><rect x=\"1212\" y=\"398\" width=\"58\" height=\"18\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" id=\"b-g18\"/><rect x=\"1278\" y=\"398\" width=\"58\" height=\"18\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" id=\"b-g19\"/><text x=\"1360\" y=\"392\" font-size=\"12.5\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"end\" letter-spacing=\"0\" opacity=\"1\" id=\"b-stage\">等待开始 · 点播放或单步<\/text><\/svg>", "ctrl": "<label>outer 行数<\/label><select id=\"b-outer\"><option value=\"100\">100<\/option><option value=\"1000\" selected>1000<\/option><option value=\"10000\">10000<\/option><\/select><label>inner 单次（示意行）<\/label><select id=\"b-per\"><option value=\"3\" selected>3 · 索引点查<\/option><option value=\"10\">10 · 索引范围<\/option><option value=\"100\">100 · 全表重扫<\/option><\/select><label>早停<\/label><select id=\"b-early\"><option value=\"0\" selected>关<\/option><option value=\"1\">开 · SEMI / unique<\/option><\/select><label>Memoize<\/label><select id=\"b-memo\"><option value=\"0\" selected>关<\/option><option value=\"1\">开<\/option><\/select><label>重复键<\/label><select id=\"b-rep\"><option value=\"low\">低<\/option><option value=\"high\" selected>高<\/option><\/select><button class=\"btn play\" id=\"b-play\">▶ 播放<\/button><button class=\"btn\" id=\"b-step\">单步 →<\/button><button class=\"btn\" id=\"b-reset\">重置<\/button><span class=\"out\" id=\"b-out\"><\/span>"}, {"eyebrow": "成本层 · 两阶段估算", "title": "先淘汰，再补全", "lede": "initial 给 add_path_precheck 提供快速下界；final 补 CPU、输出行数与早停下的 inner scan fraction。", "caption": "图 11　两阶段成本估算的分工，以及「压低单次成本」与「压低扫描比例」两条独立路径。", "bridge": "除了早停，还有一层专门吸收「重复参数」的缓存，叫 Memoize。", "notes": "PostgreSQL 的成本估算分两阶段，这个设计本身就说明它要跟 path 数量赛跑。initial_cost_nestloop 算一个快速下界，给 add_path_precheck 用，明显不行的路径连完整估算都不配做；主要算 outer、inner 的启动成本、outer 运行成本和 inner 重扫成本。final_cost_nestloop 才补全：join qual 的 CPU、输出行数，以及 semi、anti、inner_unique 早停下的 inner scan fraction。这里有个很实在的细节：普通 inner join 的最坏形态是每个 outer 行都把 inner 扫完；但如果 inner 是用全部 join quals 当索引条件的 index scan，没匹配上的 outer 行也相对便宜，因为查一次空索引通常不需要扫完整 inner。于是成本下降有两条独立的路：索引压低单次重扫，早停压低扫描比例，两者相乘。除了早停，还有一层专门吸收重复参数的缓存，我们下一页专门讲。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >先算下界淘汰差路径，再补全 CPU、行数与早停比例<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >成本层 · initial_cost_nestloop() / final_cost_nestloop()<\/text><rect x=\"24\" y=\"62\" width=\"630\" height=\"250\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"62\" width=\"630\" height=\"44\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"42\" y=\"91.2\" font-size=\"20\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >① initial · 快速下界<\/text><rect x=\"42\" y=\"173.43\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"59\" y=\"180.97\" font-size=\"14.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >供 add_path_precheck() 提前淘汰明显差的路径。<\/text><rect x=\"42\" y=\"200.43\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"59\" y=\"207.97\" font-size=\"14.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >主要算 outer / inner 启动成本、outer 运行成本、inner 重扫成本。<\/text><rect x=\"42\" y=\"227.43\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"59\" y=\"234.97\" font-size=\"14.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >普通 inner join 的最坏形态：每个 outer 行扫完整个 inner。<\/text><rect x=\"700\" y=\"62\" width=\"676\" height=\"250\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"700\" y=\"62\" width=\"676\" height=\"44\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"718\" y=\"91.2\" font-size=\"20\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >② final · 完整估算<\/text><rect x=\"718\" y=\"159.93\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"735\" y=\"167.47\" font-size=\"14.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >补上 join qual CPU 成本与输出行数。<\/text><rect x=\"718\" y=\"186.93\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"735\" y=\"194.47\" font-size=\"14.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >semi / anti / inner_unique 下估计 inner scan fraction（可早停）。<\/text><rect x=\"718\" y=\"213.93\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"735\" y=\"221.47\" font-size=\"14.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >若 inner 是用全部 join quals 做索引条件的 index scan，未匹配 outer 行查空索引相对<\/text><text x=\"735\" y=\"248.47\" font-size=\"14.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >便宜。<\/text><path d=\"M 654 187 L 694 187\" fill=\"none\" stroke=\"#BE653B\" stroke-width=\"2\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-acc)\"/><rect x=\"24\" y=\"326\" width=\"1352\" height=\"76\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"44\" y=\"354\" font-size=\"16\" fill=\"#BE653B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >普通 inner join：outer rows × 完整 inner scan<\/text><text x=\"720\" y=\"354\" font-size=\"16\" fill=\"#2F7A66\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >早停：outer rows × 部分 inner scan（fraction &lt; 1）<\/text><text x=\"44\" y=\"382\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >索引把「单次重扫」压低；早停把「扫描比例」压低；两者相乘，才是成本下降的来源。<\/text><text x=\"24\" y=\"416\" font-size=\"13.5\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >除了早停，还有一层专门吸收「重复参数」的缓存，叫 Memoize。<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "动画 C · Memoize", "title": "重复参数由缓存吸收", "lede": "outer key 为 42、42、42、99、42：首次查到的 inner 结果，后续相同参数可以直接复用。", "caption": "图 12　可交互：切换 key 序列与 Memoize 开关，单步观察索引查找次数与缓存命中次数（示意 · 非实测）。", "bridge": "缓存、早停、索引、物化，都是优化器同时摆上桌的候选。", "notes": "Memoize 的目标不是改变 join 语义，而是缓存「某组参数对应的 inner 结果」。原文给的例子特别直观：outer key 是 42、42、42、99、42。没有缓存，inner index scan 要重复查好几次 42；有了缓存，第一次查到的结果后面直接复用。这一页你可以换 key 序列、开关 Memoize，然后单步看：每一步要么「查索引并写入缓存」，要么「命中缓存，跳过 inner 查找」，右边两个计数器会把差别摆出来。但 Memoize 不是无条件可用，get_memoize_path 会检查参数表达式和操作符能不能哈希、inner 目标列表和限制条件里有没有 volatile 函数、semi/anti/unique 下缓存条目能否判定完整，还要估调用次数、不同参数值数量和命中收益。实践上看到 Nested Loop → Memoize → Index Scan，通常说明优化器认为 outer 参数会重复。缓存、早停、索引、物化，都是优化器同时摆上桌的候选。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >可交互：重复 outer key 由 Memoize 缓存吸收<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >动画 C · get_memoize_path()；key 序列与命中为设定示意值<\/text><rect x=\"1226\" y=\"14\" width=\"150\" height=\"22\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1301\" y=\"28.91\" font-size=\"11.5\" fill=\"#AE8A3E\" font-family=\"PingFang SC, Hirag ans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >对每个可用 outer path 总会生成 NL path；inner 可选 cheapest total / materialize / cheapest<\/text><text x=\"42\" y=\"369\" font-size=\"11.8\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >startup / cheapest inner indexscan。<\/text><rect x=\"720\" y=\"306\" width=\"656\" height=\"78\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"738\" y=\"330\" font-size=\"15\" fill=\"#BE653B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >enable_nestloop = off 只能「劝退」<\/text><text x=\"738\" y=\"352\" font-size=\"11.8\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >官方文档：无法完全禁止 nested loop；部分参数化或语义场景没有等价替代。适合作诊断，不作长期修复。<\/text><text x=\"24\" y=\"404\" font-size=\"13.5\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >把三种 join 摆在一起看，差别其实落在「数据流形态」上。<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "横向 · 数据流形态", "title": "需求驱动 / 批处理 / 有序流", "lede": "Nested Loop 是 demand-driven，Hash Join 是批处理，Merge Join 是有序流合并；其余差异都由此长出。", "caption": "图 14　三种 join 的驱动形态与启动成本、总成本、索引价值、内存、早停、风险六项对照。", "bridge": "形态定了，适合与不适合的边界也就定了；先把好处算清楚。", "notes": "把三种方法并排看，最有用的不是背那张九行对比表，而是看数据流形态。Nested Loop 是 demand-driven：上层要一行，它就推进 outer 取一行，带着值去 inner 定点查一行，可以很快出首行，也能被 LIMIT、SEMI、unique 提前掐断。Hash Join 是批处理：得先把 build 侧读完、hash table 建起来，再让 probe 侧流过去，启动成本高但吞吐稳。Merge Join 是有序流：两边排序或者用索引提供顺序，双指针往前推，越是有序输入越占便宜。顺着这个形态往下推，启动成本、总成本形状、索引价值、内存压力、早停能力、典型风险就都不用死记了 —— 它们全是从「谁先动」长出来的。形态定了，适合与不适合的边界也就定了；先把好处算清楚。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >demand-driven / 批处理 / 有序流：三种数据流形态<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >横向 · Nested Loop / Hash Join / Merge Join 的驱动方式与代价形状<\/text><rect x=\"24\" y=\"62\" width=\"440\" height=\"40\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"40\" y=\"88\" font-size=\"18\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >Nested Loop<\/text><rect x=\"46\" y=\"110\" width=\"396\" height=\"22\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"244\" y=\"126\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >上层要一行<\/text><path d=\"M 244 132 L 244 140\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.2\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-prim)\"/><rect x=\"46\" y=\"140\" width=\"396\" height=\"22\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"244\" y=\"156\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >推进 outer 一行<\/text><path d=\"M 244 162 L 244 170\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.2\" stroke-linejoin=\"miter\
