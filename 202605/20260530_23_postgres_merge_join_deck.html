<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数据库筑基课 · Merge Join</title>
<!-- 单文件交付：所有原理图均为现场绘制的内联 SVG，零外部图片 / 字体 / 脚本依赖。 -->
<style>
:root{
  --bg:#F7F6F2; --bg2:#F1EFE9; --ink:#1B2B33; --ink2:#46585F; --muted:#89938F; --line:#D9D5CB;
  --primary:#245A6B; --prim-l:#E5EFF0; --accent:#BE653B; --acc-l:#F7E9DE;
  --green:#2F7A66; --green-l:#E4F0EA; --gold:#AE8A3E; --gold-l:#F5EDDC;
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#E9E7E1}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
#viewport{position:absolute;inset:0 0 66px 0;overflow:hidden}
#stage{position:absolute;width:1600px;height:900px;background:var(--bg);
  transform-origin:top left;box-shadow:0 16px 54px rgba(27,43,51,.12)}
body.ready #stage{transition:transform .36s cubic-bezier(.2,.7,.2,1),left .36s cubic-bezier(.2,.7,.2,1),top .36s cubic-bezier(.2,.7,.2,1)}
.slide{position:absolute;inset:0;display:none;background:var(--bg)}
.slide.on{display:block;animation:fadein .4s cubic-bezier(.2,.7,.2,1)}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.eyebrow{position:absolute;left:64px;top:44px;font-size:13px;letter-spacing:3.4px;color:var(--primary);font-weight:600}
.eyebrow .num{font-family:var(--mono);letter-spacing:1px;color:var(--accent);margin-right:14px}
h1.title{position:absolute;left:64px;top:70px;margin:0;font-family:var(--serif);font-size:44px;
  line-height:1.25;font-weight:700;letter-spacing:1.2px;color:var(--ink)}
.lede{position:absolute;left:64px;top:139px;width:1440px;font-size:19px;color:var(--ink2);line-height:1.5;letter-spacing:.3px}
.rule{position:absolute;left:64px;top:181px;width:1472px;height:1px;background:var(--line)}
.figwrap{position:absolute;left:100px;top:198px;width:1400px;height:430px}
svg.figure{display:block;overflow:visible}
.caption{position:absolute;left:100px;top:638px;width:1400px;font-size:13px;color:var(--muted);letter-spacing:.4px}
.bridge{position:absolute;left:64px;top:716px;width:1472px;font-size:20px;color:var(--accent);
  line-height:1.55;letter-spacing:.4px;padding-left:18px;border-left:3px solid var(--accent);font-family:var(--serif)}
.bridge .bk{font-family:var(--sans);font-size:13px;color:var(--muted);letter-spacing:2px;display:block;margin-bottom:2px}
.footer{position:absolute;left:64px;top:846px;width:1472px;height:1px;background:var(--line)}
.footer .fl{position:absolute;left:0;top:14px;font-size:12.5px;color:var(--muted);letter-spacing:2px}
.footer .fr{position:absolute;right:0;top:12px;font-family:var(--mono);font-size:14px;color:var(--ink2)}
.footer .fbar{position:absolute;left:0;right:0;top:-1px;height:2px;background:transparent}
.footer .fbar i{display:block;height:2px;background:var(--primary);width:0;transition:width .4s ease}
.ctrls{position:absolute;left:100px;top:664px;width:1400px;height:40px;display:flex;align-items:center;gap:8px}
.ctrls label{font-size:12px;color:var(--ink2);white-space:nowrap}
.ctrls select,.ctrls input[type=range]{font-family:var(--sans);font-size:12px;color:var(--ink);
  background:#fff;border:1px solid var(--line);border-radius:4px;padding:4px 5px;outline:none;max-width:190px}
.ctrls .btn{min-height:30px;padding:5px 11px;border:1px solid var(--primary);border-radius:4px;
  background:#fff;color:var(--primary);font-size:12px;cursor:pointer;font-family:var(--sans);white-space:nowrap}
.ctrls .btn.play{background:var(--primary);color:#fff}
.ctrls .btn:hover{filter:brightness(.94)}
.ctrls .out{font-size:11.5px;color:var(--ink2);margin-left:auto;min-width:0;flex:1;max-width:430px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrls .out b{color:var(--accent);font-weight:600}
.chrome{position:fixed;left:0;right:0;bottom:0;height:66px;background:#FCFBF8;
  border-top:1px solid var(--line);z-index:40;display:flex;flex-direction:column;padding:6px 18px 5px;gap:4px}
.chrome .r1{display:flex;align-items:center;gap:7px;height:32px;flex:0 0 32px}
.chrome .r2{display:flex;align-items:center;font-size:11.5px;color:var(--muted);
  white-space:nowrap;overflow:hidden;line-height:1.2}
.chrome .r2 span{padding:0 10px;border-right:1px solid var(--line)}
.chrome .r2 span:first-child{padding-left:0}
.chrome .r2 span:last-child{border-right:none}
.chrome button{font-family:var(--sans);font-size:13px;color:var(--ink2);background:transparent;
  border:1px solid transparent;border-radius:5px;padding:6px 11px;cursor:pointer;white-space:nowrap}
.chrome button:hover{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome button.act{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome input.jump{font-family:var(--mono);font-size:12px;color:var(--ink2);background:#fff;
  border:1px solid var(--line);border-radius:5px;padding:5px 6px;width:56px;outline:none;text-align:center}
.chrome .pg{font-family:var(--mono);font-size:14px;color:var(--ink);min-width:76px;text-align:center}
.chrome .track{flex:1;height:3px;background:var(--line);border-radius:3px;margin:0 12px;position:relative;min-width:40px}
.chrome .track i{position:absolute;left:0;top:0;height:3px;background:var(--primary);border-radius:3px;transition:width .35s}
body.immersive .chrome{background:var(--bg2)}
body.immersive{background:#E9E7E1}
#notes{position:fixed;right:0;top:0;bottom:66px;width:38vw;min-width:380px;max-width:620px;
  background:#FCFBF8;border-left:1px solid var(--line);z-index:30;display:flex;flex-direction:column;
  transform:translateX(101%);transition:transform .36s cubic-bezier(.2,.7,.2,1);
  box-shadow:-14px 0 44px rgba(27,43,51,.07)}
body.panel-on #notes{transform:translateX(0)}
.nhead{padding:16px 22px 13px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex:0 0 auto}
.nhead .nt{font-family:var(--serif);font-size:21px;color:var(--ink);font-weight:700;flex:1}
.nhead .ns{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.nhead button{font-family:var(--sans);font-size:12.5px;background:#fff;border:1px solid var(--line);
  border-radius:5px;padding:6px 11px;cursor:pointer;color:var(--ink2)}
.nhead button:hover{border-color:var(--primary);color:var(--primary)}
.nbody{flex:1;overflow-y:auto;position:relative;padding:6px 22px 44px;scroll-behavior:smooth}
.nbody::-webkit-scrollbar{width:9px}
.nbody::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
.nsec{border-top:1px solid var(--line);padding:18px 0 22px}
.nsec:first-child{border-top:none}
.nsec .sn{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:1px}
.nsec h3{margin:8px 0 11px;font-family:var(--serif);font-size:21px;color:var(--primary);line-height:1.4}
.nsec p{margin:0;font-size:15.5px;line-height:2.0;color:var(--ink2);letter-spacing:.2px}
.nsec .br{margin-top:13px;font-family:var(--serif);font-size:15px;color:var(--accent);line-height:1.8;
  padding-left:12px;border-left:2px solid var(--accent)}
.nsec.cur{background:var(--prim-l);margin:0 -22px;padding-left:22px;padding-right:22px}
.tocgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:8px 0 20px}
.tocgrid a{display:block;padding:12px 13px;border:1px solid var(--line);border-radius:5px;
  background:#fff;text-decoration:none;color:var(--ink);cursor:pointer;transition:.2s}
.tocgrid a:hover{border-color:var(--primary);background:var(--prim-l)}
.tocgrid a.cur{border-color:var(--accent);background:var(--acc-l)}
.tocgrid a .gn{font-family:var(--mono);font-size:12px;color:var(--accent)}
.tocgrid a .gt{font-family:var(--serif);font-size:15px;line-height:1.4;display:block;margin-top:5px}
.keygrid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px 24px;font-size:14.5px;
  line-height:1.8;padding:12px 0 6px;color:var(--ink2)}
.keygrid kbd{font-family:var(--mono);background:#fff;border:1px solid var(--line);
  border-bottom-width:2px;border-radius:4px;padding:2px 7px;color:var(--primary);margin-right:8px}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ink);
  color:#fff;font-size:13px;padding:9px 16px;border-radius:5px;opacity:0;transition:.3s;z-index:80;pointer-events:none}
.toast.on{opacity:1}
@media print{
  html,body{overflow:visible;background:#fff;height:auto}
  #viewport{position:static;overflow:visible}
  #stage{position:static;transform:none!important;box-shadow:none;transition:none}
  .slide{display:block!important;position:relative;height:900px;page-break-after:always;animation:none}
  .chrome,#notes,.toast,.ctrls{display:none!important}
}
</style>
</head>

<svg id="svgdefs" xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true"><defs><marker id="arr-prim" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L6,3 z" fill="#245A6B"/></marker><marker id="arr-acc" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L6,3 z" fill="#BE653B"/></marker><marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L6,3 z" fill="#2F7A66"/></marker><marker id="arr-gold" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L6,3 z" fill="#AE8A3E"/></marker><marker id="arr-ink" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L6,3 z" fill="#1B2B33"/></marker><marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L6,3 z" fill="#89938F"/></marker><marker id="arr-white" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L6,3 z" fill="#FFFFFF"/></marker></defs></svg>
<div id="viewport"><div id="stage"><div id="slides"></div></div></div>
<aside id="notes">

</div>

<script>
const D = [{"eyebrow": "开篇 · 一个误解", "title": "「拉拉链」只说对了方向", "lede": "把两侧都变成按 join key 有序的流再同步推进 —— 方向没错，但它漏掉了真正决定性能的部分。", "caption": "图 01　一句话概括与五个必须回答的工程问题；依据原文背景与第一节重排。", "bridge": "先把「它不是什么、漏了什么」摆出来，才谈得上它到底解决什么问题。", "notes": "很多人第一次听到 Merge Join，记住的就是一句话：两边排序后像拉拉链一样合并。方向是对的，可这句话太省事了。你打开一个真实的 EXPLAIN 看，Merge Join 上头可能挂着两个 Sort，inner 那边可能多了一个 Materialize，重复 key 可能让 inner 的一小段被反复发射，work_mem 不够还会把排序推到磁盘上。所以 PostgreSQL 里的 Merge Join 至少同时回答五个问题：哪些条件能当 merge 条件、两侧怎么拿到同一套排序语义、重复 key 时扫过的 inner 段怎么重用、外连接和 NULL 怎么不破坏 SQL 语义、以及这些代价由谁估算。这一场我们不按功能清单讲，按一条因果链往下推：先问顺序从哪来，再问相等的时候怎么才不漏行，最后回到你库里那张 EXPLAIN。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >「两边排序后像拉拉链」只说对了方向<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >开篇 · 一句话概括与它漏掉的五个工程问题<\/text><text x=\"24\" y=\"76\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"2\" opacity=\"1\" >直觉 · 一句话概括<\/text><rect x=\"24\" y=\"88\" width=\"520\" height=\"132\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"50\" y=\"146.62\" font-size=\"18\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >把两侧都变成按 join key 有序的流，<\/text><text x=\"50\" y=\"173.62\" font-size=\"18\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >然后像拉拉链一样同步推进。<\/text><rect x=\"24\" y=\"230\" width=\"520\" height=\"34\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"284\" y=\"251.76\" font-size=\"14\" fill=\"#AE8A3E\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >方向没错，但不够工程化<\/text><text x=\"24\" y=\"290\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"2\" opacity=\"1\" >代价 · 一句话会漏掉的部分<\/text><rect x=\"24\" y=\"302\" width=\"520\" height=\"86\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"46\" y=\"339.26\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >上游是否多了 Sort？inner 是否多了 Materialize？<\/text><text x=\"46\" y=\"360.26\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >重复 key 是否让 inner 段反复重放？<\/text><text x=\"580\" y=\"76\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"2\" opacity=\"1\" >五个必须回答的问题<\/text><rect x=\"580\" y=\"88\" width=\"796\" height=\"52\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"580\" y=\"88\" width=\"4\" height=\"52\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><rect x=\"594\" y=\"99\" width=\"38\" height=\"30\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"613\" y=\"118.08\" font-size=\"12\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >01<\/text><text x=\"646\" y=\"121\" font-size=\"16\" fill=\"#1B2B33\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >哪些 join 条件能作为 merge 条件？<\/text><rect x=\"580\" y=\"150\" width=\"796\" height=\"52\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"580\" y=\"150\" width=\"4\" height=\"52\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><rect x=\"594\" y=\"161\" width=\"38\" height=\"30\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"613\" y=\"180.08\" font-size=\"12\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >02<\/text><text x=\"646\" y=\"183\" font-size=\"16\" fill=\"#1B2B33\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >两侧输入如何获得同一套排序语义？<\/text><rect x=\"580\" y=\"212\" width=\"796\" height=\"52\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"580\" y=\"212\" width=\"4\" height=\"52\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><rect x=\"594\" y=\"223\" width=\"38\" height=\"30\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"613\" y=\"242.08\" font-size=\"12\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >03<\/text><text x=\"646\" y=\"245\" font-size=\"16\" fill=\"#1B2B33\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >重复 key 时，inner 匹配段如何重新使用？<\/text><rect x=\"580\" y=\"274\" width=\"796\" height=\"52\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"580\" y=\"274\" width=\"4\" height=\"52\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><rect x=\"594\" y=\"285\" width=\"38\" height=\"30\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"613\" y=\"304.08\" font-size=\"12\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >04<\/text><text x=\"646\" y=\"307\" font-size=\"16\" fill=\"#1B2B33\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >outer / semi / anti join 与 NULL 怎么保持语义？<\/text><rect x=\"580\" y=\"336\" width=\"796\" height=\"52\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"580\" y=\"336\" width=\"4\" height=\"52\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><rect x=\"594\" y=\"347\" width=\"38\" height=\"30\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"613\" y=\"366.08\" font-size=\"12\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >05<\/text><text x=\"646\" y=\"369\" font-size=\"16\" fill=\"#1B2B33\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >排序、mark/restore、Materialize 的代价由谁估算？<\/text><text x=\"24\" y=\"414\" font-size=\"13.5\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >这一场按因果链往下推：先问顺序从哪来，再问相等时怎么不漏行。<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "场景 · 一条真实查询", "title": "两条索引顺序直接喂给 Merge Join", "lede": "orders 关联 payments，两侧都能通过 B-tree 索引按 join key 顺序读，上层 ORDER BY 与 merge 输出顺序一致。", "caption": "图 02　原文示例 SQL、两条有序输入与下游顺序复用路径；示意，非实测。", "bridge": "顺序既然可以白拿，那它凭什么成为一条独立的 join 路径？", "notes": "先看原文给的那条查询：orders 和 payments 按 id 与 order_id 等值关联，最后还要 ORDER BY o.id。如果两侧都有合适的 B-tree 索引，执行器拿到的就是两条已经按 join key 排好序的流。这时候 Merge Join 的好处特别干净：不用为 join 再建一张 hash table，两条流同步往前走就行；更值钱的是，join 完的输出还是有序的，上层的 ORDER BY、GROUP BY、DISTINCT，甚至更高一层的 merge join，都可能直接把这个顺序接过去用。你注意，这里的收益不是「比较更快」，而是「顺序被复用了两次」——进来一次，出去又一次。那顺序既然可以白拿，Join 为什么还需要三条不同的路？", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >orders ⋈ payments：两条索引顺序直接喂给 Merge Join<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >场景 · 原文示例 SQL 与顺序复用路径；示意，非实测<\/text><rect x=\"1226\" y=\"14\" width=\"150\" height=\"22\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1301\" y=\"28.91\" font-size=\"11.5\" fill=\"#AE8A3E\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >示意 · 非实测<\/text><text x=\"24\" y=\"74\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"2\" opacity=\"1\" >① 查询<\/text><rect x=\"24\" y nchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >Index Scan · payments (order_id ASC)<\/text><line x1=\"790\" y1=\"148\" x2=\"790\" y2=\"170\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><line x1=\"1188\" y1=\"148\" x2=\"1188\" y2=\"170\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><line x1=\"790\" y1=\"170\" x2=\"1188\" y2=\"170\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><path d=\"M 1018 170 L 1018 200\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-prim)\"/><rect x=\"760\" y=\"200\" width=\"516\" height=\"62\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1018\" y=\"236.1\" font-size=\"15\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >Merge Join　·　Merge Cond: (p.order_id = o.id)<\/text><path d=\"M 1018 262 L 1018 292\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"/><line x1=\"740\" y1=\"292\" x2=\"1258\" y2=\"292\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><path d=\"M 740 292 L 740 312\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.4\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-prim)\"/><path d=\"M 1000 292 L 1000 312\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.4\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-prim)\"/><path d=\"M 1258 292 L 1258 312\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.4\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-prim)\"/><rect x=\"620\" y=\"312\" width=\"240\" height=\"58\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" opacity=\"1\" /><text x=\"740\" y=\"335.465\" font-size=\"13.5\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >ORDER BY o.id<\/text><text x=\"740\" y=\"355.715\" font-size=\"13.5\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >可免掉额外排序<\/text><rect x=\"880\" y=\"312\" width=\"240\" height=\"58\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1000\" y=\"335.465\" font-size=\"13.5\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >GROUP BY / DISTINCT<\/text><text x=\"1000\" y=\"355.715\" font-size=\"13.5\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >可复用有序性<\/text><rect x=\"1140\" y=\"312\" width=\"236\" height=\"58\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1258\" y=\"335.465\" font-size=\"13.5\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >更高层 Merge Join<\/text><text x=\"1258\" y=\"355.715\" font-size=\"13.5\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >继续传递 pathkeys<\/text><text x=\"24\" y=\"412\" font-size=\"13.5\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >它避开了为 join 再建 hash table，也把有序输出交给了上层。<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "定位 · 三条路", "title": "差别都长在「谁先动」上", "lede": "Nested Loop 用 outer 当前行换 inner 定点访问；Hash Join 用内存结构换无序探测；Merge Join 用排序顺序换线性同步推进。", "caption": "图 03　三种执行方法的数据流形态与总成本形状；依据原文第四节重排。", "bridge": "第三条路看着最省，代价却也最前置 —— 它先要求「有序」。", "notes": "把三种 join 摆在一起，别背表，看数据流形态。Nested Loop 是需求驱动：上层要一行，它就取一行 outer，带着值去 inner 定点查，能很快出首行，成本是 outer 行数乘以 inner 单次重扫。Hash Join 是批处理：得先把 build 侧读完、hash table 建起来，再让 probe 侧流过去，启动成本高但吞吐稳，通常不保留输入顺序。Merge Join 是有序流：两边都按 key 排好，比较当前 key，谁小谁往前走。启动成本、总成本形状、索引价值、输出顺序，全是从「谁先动」长出来的。没有谁天然更高级，只看 workload、索引、内存和输出顺序匹不匹配。第三条路看着最省，可它的代价也最前置：先把「有序」这个前提交出来。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >Join 有三条路：需求驱动、内存探测、有序流同步<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >定位 · 三种执行方法的数据流形态；差别都长在「谁先动」上<\/text><rect x=\"24\" y=\"82\" width=\"1352\" height=\"92\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"82\" width=\"6\" height=\"92\" rx=\"0\" fill=\"#89938F\" opacity=\"1\" /><rect x=\"44\" y=\"106\" width=\"44\" height=\"32\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"66\" y=\"126.08\" font-size=\"12\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >01<\/text><text x=\"108\" y=\"122\" font-size=\"21\" fill=\"#46585F\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >Nested Loop<\/text><text x=\"108\" y=\"152\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >对每行 outer 去另一边找匹配；inner 被 outer 行数反复重扫<\/text><rect x=\"1000\" y=\"108\" width=\"352\" height=\"40\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1176\" y=\"132.42\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >outer rows × inner rescan<\/text><rect x=\"24\" y=\"184\" width=\"1352\" height=\"92\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"184\" width=\"6\" height=\"92\" rx=\"0\" fill=\"#89938F\" opacity=\"1\" /><rect x=\"44\" y=\"208\" width=\"44\" height=\"32\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"66\" y=\"228.08\" font-size=\"12\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >02<\/text><text x=\"108\" y=\"224\" font-size=\"21\" fill=\"#46585F\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >Hash Join<\/text><text x=\"108\" y=\"254\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >先构建 hash table，再让 probe 侧逐行流过；通常不保留输入顺序<\/text><rect x=\"1000\" y=\"210\" width=\"352\" height=\"40\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1176\" y=\"234.42\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >build + probe + batch / spill<\/text><rect x=\"24\" y=\"286\" width=\"1352\" height=\"92\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"286\" width=\"6\" height=\"92\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><rect x=\"44\" y=\"310\" width=\"44\" height=\"32\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"66\" y=\"330.08\" font-size=\"12\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >03<\/text><text x=\"108\" y=\"326\" font-size=\"21\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >Merge Join<\/text><text x=\"108\" y=\"356\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >两侧都变成有序流，比较当前 key，同步推进；输出可保留顺序<\/text><rect x=\"1000\" y=\"312\" width=\"352\" height=\"40\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1176\" y=\"336.42\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >sort / index order + compare + rescan<\/text><text x=\"24\" y=\"412\" font-size=\"13.5\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >Merge Join 把问题从「对每行去另一边找匹配」改成「让两条有序流同步前进」。<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "代价 · 四个牺牲", "title": "先交出四样东西", "lede": "输入必须有序、重复 key 会组合放大、inner 通常要能回退、条件必须 mergejoinable —— 四条代价是后面所有机制的来源。", "caption": "图 04　四条代价及其直接后果；依据原文第一节「它牺牲的东西」。", "bridge": "四条代价里最要命的是第二条：重复 key 会把「线性」推回「相乘」。", "notes": "选第三条路，先付四笔账。第一，输入必须有序，没有现成顺序就得显式 Sort，而排序会受 work_mem 限制，不够就落盘。第二，重复 key 会组合放大：某个 key 在 outer 出现 m 次、在 inner 出现 n 次，光这一个 key 就要输出 m 乘 n 行，inner 那一小段匹配区还得被反复重放。第三，inner 通常得支持 mark/restore，不支持的时候规划器可能塞一个 Materialize 进来。第四，只有 mergejoinable 的条件能当核心同步条件，其余条件只能等 join 之后继续过滤。你先别把这四条当缺点清单，后面要讲的状态机、成本模型、Materialize 决策，全都是从这四条里长出来的。尤其是第二条，它会把一个看起来线性的算法，重新推回相乘的规模。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >选了第三条路，就要先交出四样东西<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >代价 · 有序前提、组合放大、回退能力、条件限制<\/text><rect x=\"24\" y=\"84\" width=\"660\" height=\"138\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"84\" width=\"6\" height=\"138\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><rect x=\"44\" y=\"100\" width=\"44\" height=\"28\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"66\" y=\"118.08\" font-size=\"12\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >01<\/text><text x=\"104\" y=\"123\" font-size=\"20\" fill=\"#1B2B33\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >输入必须有序<\/text><text x=\"46\" y=\"162\" font-size=\"14.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >没有现成顺序时需要显式 Sort。<\/text><text x=\"46\" y=\"192\" font-size=\"14.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >排序可能受 work_mem 限制而落盘。<\/text><rect x=\"700\" y=\"84\" width=\"660\" height=\"138\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"700\" y=\"84\" width=\"6\" height=\"138\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><rect x=\"720\" y=\"100\" width=\"44\" height=\"28\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"742\" y=\"118.08\" font-size=\"12\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >02<\/text><text x=\"780\" y=\"123\" font-size=\"20\" fill=\"#1B2B33\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >重复 key 会组合放大<\/text><text x=\"722\" y=\"162\" font-size=\"14.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >输出规模约为 Σ(mᵢ × nᵢ)。<\/text><text x=\"722\" y=\"192\" font-size=\"14.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >inner 匹配段可能被反复重放。<\/text><rect x=\"24\" y=\"236\" width=\"660\" height=\"138\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"236\" width=\"6\" height=\"138\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><rect x=\"44\" y=\"252\" width=\"44\" height=\"28\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"66\" y=\"270.08\" font-size=\"12\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >03<\/text><text x=\"104\" y=\"275\" font-size=\"20\" fill=\"#1B2B33\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >inner 通常要可回退<\/text><text x=\"46\" y=\"314\" font-size=\"14.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >mark / restore 支撑重复 key 的正确性。<\/text><text x=\"46\" y=\"344\" font-size=\"14.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >不支持时规划器可能插入 Materialize。<\/text><rect x=\"700\" y=\"236\" width=\"660\" height=\"138\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"700\" y=\"236\" width=\"6\" height=\"138\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><rect x=\"720\" y=\"252\" width=\"44\" height=\"28\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"742\" y=\"270.08\" font-size=\"12\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >04<\/text><text x=\"780\" y=\"275\" font-size=\"20\" fill=\"#1B2B33\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >条件必须 mergejoinable<\/text><text x=\"722\" y=\"314\" font-size=\"14.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >只有能进 merge clause 的条件参与同步。<\/text><text x=\"722\" y=\"344\" font-size=\"14.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >其余条件只能在 join 之后继续过滤。<\/text><text x=\"24\" y=\"414\" font-size=\"13.5\" fill=\"#BE653B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >四条代价不是缺陷清单，而是后面所有机制与成本项的来源。<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "定义 · 主循环", "title": "比较当前两个 key，推进较小的一侧", "lede": "outer key 小于 inner key 就推进 outer；大于就推进 inner；相等则输出匹配组合，并 Mark inner 段起点。", "caption": "图 05　MJCompare 的三分支与相等时的 Mark；依据原文第二节与源码状态机注释。", "bridge": "循环谁都会写；PostgreSQL 加进来的，是「按什么语义比较」这一层。", "notes": "把定义压到最小：执行器手上永远只有两个当前 key，比较一次，做三件事之一。outer 小，推进 outer；inner 小，推进 inner；相等，输出匹配组合，并且在第一次相等时把 inner 的当前位置 Mark 下来。第三个动作最关键，它看起来只是顺手记一个位置，其实是后面重复 key 不漏行的全部伏笔。这里还有个特别容易搞混的地方：执行器并不是反复去算「outer_key = inner_key」这个等值表达式，它分别求出两侧的 key，再调用排序比较函数，得到的是小于、等于还是大于。为什么非得这么绕？因为状态机要的是「谁该往前走」，不是「这一对是否相等」。这就把我们带到下一页：这个比较，凭什么必须是 B-tree 那一套。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >执行器只做一件事：比较当前两个 key，然后推进较小的一侧<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >定义 · MJCompare 的三分支；相等时输出并记录 inner 段起点<\/text><text x=\"24\" y=\"72\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"2\" opacity=\"1\" >两条有序流 · 当前 key<\/text><text x=\"24\" y=\"116\" font-size=\"13\" fill=\"#245A6B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >outer<\/text><rect x=\"110\" y=\"92\" width=\"48\" height=\"44\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"134\" y=\"119.6\" font-size=\"16\" fill=\"#245A6B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >1<\/text><rect x=\"168\" y=\"92\" width=\"48\" height=\"44\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"192\" y=\"119.6\" font-size=\"16\" fill=\"#245A6B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >3<\/text><rect x=\"226\" y=\"92\" width=\"48\" height=\"44\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"250\" y=\"119.6\" font-size=\"16\" fill=\"#245A6B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >5<\/text><rect x=\"284\" y=\"92\" width=\"48\" height=\"44\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"308\" y=\"119.6\" font-size=\"16\" fill=\"#245A6B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >5<\/text><rect x=\"342\" y=\"92\" width=\"48\" height=\"44\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"366\" y=\"119.6\" font-size=\"16\" fill=\"#245A6B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >8<\/text><text x=\"24\" y=\"176\" font-size=\"13\" fill=\"#245A6B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >inner<\/text><rect x=\"110\" y=\"152\" width=\"48\" height=\"44\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"134\" y=\"179.6\" font-size=\"16\" fill=\"#245A6B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >2<\/text><rect x=\"168\" y=\"152\" width=\"48\" height=\"44\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"192\" y=\"179.6\" font-size=\"16\" fill=\"#245A6B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >3<\/text><rect x=\"226\" y=\"152\" width=\"48\" height=\"44\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"250\" y=\"179.6\" font-size=\"16\" fill=\"#245A6B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >5<\/text><rect x=\"284\" y=\"152\" width=\"48\" height=\"44\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"308\" y=\"179.6\" font-size=\"16\" fill=\"#245A6B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >5<\/text><rect x=\"342\" y=\"152\" width=\"48\" height=\"44\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"366\" y=\"179.6\" font-size=\"16\" fill=\"#245A6B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >9<\/text><rect x=\"24\" y=\"230\" width=\"420\" height=\"132\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" 起点供重放<\/text><text x=\"24\" y=\"414\" font-size=\"13.5\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >相等时先 Mark inner，是后面重复 key 不漏行的伏笔。<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "结构 · 源码地图", "title": "六层结构，各管一段", "lede": "路径、条件筛选、成本、计划、执行、比较六层各有专属结构；复杂度不在合并本身，而在 SQL 语义与成本形状。", "caption": "图 06　六层关键结构与作用；依据原文第二节结构表重绘。", "bridge": "六层里最容易被跳过的是最后一层：比较语义决定了谁能当 merge 条件。", "notes": "先把源码地图摆好，免得后面提函数名你不知道它在哪一层。路径层是 MergePath，优化器里的一个候选，它可以同时隐含 Sort 和 Materialize；条件筛选是 select_mergejoin_clauses，挑出能用于 merge 的条件，还要限制 right、full join 里那些不安全的条件；成本层是 initial_cost_mergejoin 和 final_cost_mergejoin，一快一慢两次估算；计划层是 MergeJoin 节点，把 merge clauses、opfamily、collation、排序方向、NULL 排序规则都记下来；执行层是 ExecMergeJoin，用状态机推进两条流；最底下是 MJCompare，真正做比较。你看，Merge Join 的复杂度根本不在「合并」这个动作上，它散在 SQL 语义和成本形状里。六层里最容易被跳过的，恰恰是最后那层比较语义 —— 它直接决定了哪些条件有资格参与同步。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >从 MergePath 到 MJCompare：六层结构各管一段<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >结构 · 路径 / 条件 / 成本 / 计划 / 执行 / 比较；依据原文结构表重绘<\/text><rect x=\"24\" y=\"62\" width=\"170\" height=\"46\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"38\" y=\"86.82\" font-size=\"14\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >层次<\/text><rect x=\"194\" y=\"62\" width=\"470\" height=\"46\" rx=\"0\" fill=\"#F <text x=\"38\" y=\"178.69\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >条件筛选<\/text><rect x=\"194\" y=\"154\" width=\"470\" height=\"46\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"208\" y=\"178.69\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >select_mergejoin_clauses()<\/text><rect x=\"664\" y=\"154\" width=\"712\" height=\"46\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"678\" y=\"178.69\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >选出可用于 merge 的条件，限制 right / full join 的不安全条件<\/text><rect x=\"24\" y=\"200\" width=\"170\" height=\"46\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"38\" y=\"224.69\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >成本层<\/text><rect x=\"194\" y=\"200\" width=\"470\" height=\"46\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"208\" y=\"224.69\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >initial_cost_mergejoin() / final_cost_mergejoin()<\/text><rect x=\"664\" y=\"200\" width=\"712\" height=\"46\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"678\" y=\"224.69\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >估算排序、扫描、比较、重复 key 重扫、Materialize 代价<\/text><rect x=\"24\" y=\"246\" width=\"170\" height=\"46\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"38\" y=\"270.69\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >计划层<\/text><rect x=\"194\" y=\"246\" width=\"470\" height=\"46\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"208\" y=\"270.69\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >MergeJoin<\/text><rect x=\"664\" y=\"246\" width=\"712\" height=\"46\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"678\" y=\"270.69\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >保存 merge clauses、opfamily、collation、方向、NULL 排序规则<\/text><rect x=\"24\" y=\"292\" width=\"170\" height=\"46\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"38\" y=\"316.69\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >执行层<\/text><rect x=\"194\" y=\"292\" width=\"470\" height=\"46\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"208\" y=\"316.69\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >ExecMergeJoin()<\/text><rect x=\"664\" y=\"292\" width=\"712\" height=\"46\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"678\" y=\"316.69\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >用状态机推进两条有序流，处理 mark/restore 与补空<\/text><rect x=\"24\" y=\"338\" width=\"170\" height=\"46\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"38\" y=\"362.69\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >比较层<\/text><rect x=\"194\" y=\"338\" width=\"470\" height=\"46\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"208\" y=\"362.69\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >MJCompare()<\/text><rect x=\"664\" y=\"338\" width=\"712\" height=\"46\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"678\" y=\"362.69\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >用 B-tree opfamily 的 comparator 按排序语义比较两侧 key<\/text><rect x=\"24\" y=\"388\" width=\"1352\" height=\"26\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"40\" y=\"406\" font-size=\"12.5\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >边界 · Merge Join 的复杂度不在「合并」本身，而在 SQL 语义与成本形状。<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "关键 · 比较语义", "title": "不是「任意等号都行」", "lede": "mergejoinable 的等值操作符必须属于某个 B-tree opfamily；计划节点带着 opfamily、collation、方向与 NULL 排序规则，执行器据此取比较函数。", "caption": "图 07　从 mergejoinable 条件到状态机推进的五步链；依据 nodeMergejoin.c 顶部注释与 MJExamineQuals。", "bridge": "语义定清楚了，下一个问题就来了：这套顺序，具体从哪儿拿到？", "notes": "这一页要拆掉一个很自然的误会：既然是等值 join，那随便有个等号操作符不就能合并了吗？不行。状态机需要知道「谁大谁小」，而 PostgreSQL 里唯一定义「顺序」的东西就是 B-tree opfamily。所以一个条件要成为 merge clause，它的等值操作符得属于某个 opfamily；规划器随后把 opfamily、collation、排序方向、NULLS FIRST 还是 LAST 一路写进 MergeJoin 计划节点；MJExamineQuals 据此去 opfamily 里取 SortSupport 或者 BTORDER 比较函数；MJCompare 再分别求两侧 key，返回小于、等于、大于；状态机才据此决定推进哪一侧。源码顶部那句注释说得很直白：我们能用 btree 比较函数，是因为 Postgres 只有由 btree opfamilies 定义的排序概念。所以跨类型、不同 collation、不完整的操作符族，都会让条件失去资格。语义定清楚了，下一个问题就顺理成章：这套顺序，具体从哪儿拿到？", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >不是「任意等号都行」：同步依赖 B-tree 排序语义<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >关键 · opfamily / collation / 方向 / NULL 排序规则一路传到比较器<\/text><rect x=\"24\" y=\"72\" width=\"1352\" height=\"50\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"44\" y=\"103\" font-size=\"15\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >错误直觉：执行器反复执行 outer_key = inner_key 来判断「相等」——但状态机需要的是「谁大谁小」。<\/text><rect x=\"24\" y=\"158\" width=\"256\" height=\"126\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"40\" y=\"190\" font-size=\"15\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >① mergejoinable 条件<\/text><text x=\"40\" y=\"224\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >等值操作符属于某个<\/text><text x=\"40\" y=\"248\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >B-tree opfamily<\/text><path d=\"M 280 221 L 296 221\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-prim)\"/><rect x=\"298\" y=\"158\" width=\"256\" height=\"126\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"314\" y=\"190\" font-size=\"15\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >② 计划节点 MergeJoin<\/text><text x=\"314\" y=\"224\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >携带 opfamily、collation、<\/text><text x=\"314\" y=\"248\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >排序方向、NULLS FIRST<\/text><path d=\"M 554 221 L 570 221\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-prim)\"/><rect x=\"572\" y=\"158\" width=\"256\" height=\"126\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"588\" y=\"190\" font-size=\"15\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >③ MJExamineQuals<\/text><text x=\"588\" y=\"224\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >从 opfamily 取 SortSupport<\/text><text x=\"588\" y=\"248\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >或 BTORDER 比较函数<\/text><path d=\"M 828 221 L 844 221\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-prim)\"/><rect x=\"846\" y=\"158\" width=\"256\" height=\"126\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"862\" y=\"190\" font-size=\"15\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >④ MJCompare<\/text><text x=\"862\" y=\"224\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >分别算两侧 key，<\/text><text x=\"862\" y=\"248\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >返回 小于 / 等于 / 大于<\/text><path d=\"M 1102 221 L 1118 221\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-prim)\"/><rect x=\"1120\" y=\"158\" width=\"256\" height=\"126\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1136\" y=\"190\" font-size=\"15\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >⑤ 状态机推进<\/text><text x=\"1136\" y=\"224\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >按比较结果决定<\/text><text x=\"1136\" y=\"248\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >推进哪一侧或输出<\/text><rect x=\"24\" y=\"306\" width=\"1352\" height=\"80\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"44\" y=\"334\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >源码依据 · nodeMergejoin.c 顶部注释：执行器不直接执行 join clause，而是分别求值两侧 key 再逐列比较。<\/text><text x=\"44\" y=\"362\" font-size=\"12.5\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >「We may use the appropriate btree comparison function, since Postgres' only notion of ordering is specified by btree opfamilies.」<\/text><text x=\"24\" y=\"414\" font-size=\"13.5\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >跨类型、不同 collation、不完整 opfamily，都会让条件无法成为 merge clause。<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "原理 · 有序输入", "title": "索引、上游 pathkeys，或者一次 Sort", "lede": "优化器用 pathkeys 记录每条 path 的已知排序；outersortkeys / innersortkeys 为 NIL 时说明输入已满足要求，否则插入 Sort。", "caption": "图 08　三种顺序来源与 incremental sort 的内外边界；依据 optimizer README 与 create_mergejoin_plan。", "bridge": "顺序有了，就可以把两条流放到时间轴上，看它们到底怎么走。", "notes": "顺序有三个来源。最理想的是索引扫描：B-tree 本来就按 key 顺序吐行，两侧都有匹配索引时，Merge Join 一个 Sort 都不用加。第二种是上游保留的 pathkeys：优化器 README 专门解释了为什么要记录每条 path 的已知排序 —— 下层 join 或者 sort 留下来的顺序，可能让上层 merge join 直接免掉一次显式排序，EquivalenceClass 负责把「哪些表达式等价」串起来。第三种才是显式 Sort：MergePath 里的 outersortkeys、innersortkeys 只要不是 NIL，计划生成阶段就会插入对应的 Sort 节点。这里有个很值得记的边界：outer 侧允许用 incremental sort，inner 侧目前不用，因为 inner 可能需要 mark/restore，而 nodeIncrementalSort 明确说自己不支持。顺序有了，我们就能把两条流摆到时间轴上，一步步看它们怎么走。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >顺序从哪来：索引、上游 pathkeys，或者一次显式 Sort<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >有序输入 · 优化器记录每条 path 的已知排序，能让上层 merge join 免掉 Sort<\/text><rect x=\"24\" y=\"84\" width=\"440\" height=\"190\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"84\" width=\"440\" height=\"40\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"42\" y=\"111\" font-size=\"17\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >① 索引扫描<\/text><text x=\"42\" y=\"158\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >B-tree 索引按 join key 顺序吐行。<\/text><text x=\"42\" y=\"186\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >两侧都有匹配索引时，<\/text><text x=\"42\" y=\"214\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >Merge Join 无需任何 Sort。<\/text><path d=\"M 244 274 L 244 296\" fill=\"none\" stroke=\"#2F7A66\" stroke-width=\"1.6\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-green)\"/><rect x=\"480\" y=\"84\" width=\"440\" height=\"190\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"480\" y=\"84\" width=\"440\" height=\"40\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"498\" y=\"111\" font-size=\"17\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >② 上游 pathkeys<\/text><text x=\"498\" y=\"158\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >下层 join / sort 保留了顺序，<\/text><text x=\"498\" y=\"186\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >EquivalenceClass 让优化器<\/text><text x=\"498\" y=\"214\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >知道这条 path 已经有序。<\/text><path d=\"M 700 274 L 700 296\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-prim)\"/><rect x=\"936\" y=\"84\" width=\"440\" height=\"190\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"936\" y=\"84\" width=\"440\" height=\"40\" rx=\"0\" fill=\"#AE8A3E\" opacity=\"1\" /><text x=\"954\" y=\"111\" font-size=\"17\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >③ 显式 Sort<\/text><text x=\"954\" y=\"158\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >outersortkeys / innersortkeys<\/text><text x=\"954\" y=\"186\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >不为 NIL 时，计划生成阶段<\/text><text x=\"954\" y=\"214\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >插入 Sort 节点。<\/text><path d=\"M 1156 274 L 1156 296\" fill=\"none\" stroke=\"#AE8A3E\" stroke-width=\"1.6\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-gold)\"/><rect x=\"24\" y=\"296\" width=\"1352\" height=\"54\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"44\" y=\"329\" font-size=\"15\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >三条路汇成同一件事：两条按兼容排序语义排列的流 → 交给 ExecMergeJoin 同步推进。<\/text><rect x=\"24\" y=\"360\" width=\"1352\" height=\"46\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"44\" y=\"389\" font-size=\"14\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >边界 · outer 可用 incremental sort；inner 目前不用 —— nodeIncrementalSort 不支持 mark/restore。<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "动画 A · 同步推进", "title": "两条有序流如何一步步走", "lede": "可交互演示：比较当前 key，推进较小一侧，相等时输出并 Mark；重复 key 时 Restore 回 mark 位置。", "caption": "图 09　可交互：切换 key 序列，播放或单步观察比较次数、推进次数、输出组合与 Restore（示意 · 非实测）。", "bridge": "亲手走一遍就会发现：真正让状态机变复杂的，是「相等之后」发生的事。", "notes": "这一页建议你动手点一下。左边两条有序流，中间是本步比较，右边是输出的组合。默认那组没有重复 key，你点播放或者单步：比较一次，谁小谁往前走，相等就输出一对，再一起往前。数一数比较次数，大概是两边长度相加的量级，完全不是相乘。然后把序列切成「两侧重复」，再看一遍：相等之后 inner 会继续往下走完整个 5 段，等下一个 outer 还是 5 的时候，得 Restore 回 Mark 的位置把这一段重新发射一遍。所有 key 都是设定的示意值，不是实测数据，也不代表真实分布。你只要抓住一件事：没有重复 key 的时候，这就是个安静的双指针；一有重复 key，状态机立刻得回答「扫过的 inner 段怎么办」。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >可交互：两条有序流如何一步步同步推进<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >动画 A · MJCompare 三分支与 restore；key 序列为设定示意值<\/text><rect x=\"1226\" y=\"14\" width=\"150\" height=\"22\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1301\" y=\"28.91\" font-size=\"11.5\" fill=\"#AE8A3E\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anc 1\" id=\"p09-c1\">0<\/text><rect x=\"264\" y=\"342\" width=\"116\" height=\"56\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"322\" y=\"362\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >推进 inner<\/text><text x=\"322\" y=\"388\" font-size=\"19\" fill=\"#245A6B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" id=\"p09-c2\">0<\/text><rect x=\"384\" y=\"342\" width=\"116\" height=\"56\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"442\" y=\"362\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >输出<\/text><text x=\"442\" y=\"388\" font-size=\"19\" fill=\"#245A6B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" id=\"p09-c3\">0<\/text><rect x=\"504\" y=\"342\" width=\"116\" height=\"56\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"562\" y=\"362\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >Restore<\/text><text x=\"562\" y=\"388\" font-size=\"19\" fill=\"#245A6B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" id=\"p09-c4\">0<\/text><rect x=\"660\" y=\"84\" width=\"716\" height=\"314\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"660\" y=\"84\" width=\"716\" height=\"36\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"678\" y=\"109\" font-size=\"15\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >④ 输出组合（按产生顺序）<\/text><text x=\"680\" y=\"146\" font-size=\"14\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" id=\"p09-r0\">—<\/text><text x=\"680\" y=\"177\" font-size=\"14\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" id=\"p09-r1\">—<\/text><text x=\"680\" y=\"208\" font-size=\"14\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" id=\"p09-r2\">—<\/text><text x=\"680\" y=\"239\" font-size=\"14\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" id=\"p09-r3\">—<\/text><text x=\"680\" y=\"270\" font-size=\"14\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" id=\"p09-r4\">—<\/text><text x=\"680\" y=\"301\" font-size=\"14\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" id=\"p09-r5\">—<\/text><text x=\"680\" y=\"332\" font-size=\"14\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" id=\"p09-r6\">—<\/text><text x=\"680\" y=\"363\" font-size=\"14\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" id=\"p09-r7\">—<\/text><text x=\"660\" y=\"414\" font-size=\"13\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" id=\"p09-stage\">等待开始 · 点播放或单步<\/text><\/svg>", "ctrl": "<label>key 序列<\/label><select id=\"p09-seq\"><option value=\"0\">无重复 · 线性推进<\/option><option value=\"1\">两侧重复 · 触发 mark/restore<\/option><option value=\"2\">原文示例 4,5,5,6 / 3,5,5,5,8<\/option><\/select><button class=\"btn play\" id=\"p09-play\">▶ 播放<\/button><button class=\"btn\" id=\"p09-step\">单步 →<\/button><button class=\"btn\" id=\"p09-reset\">重置<\/button><span class=\"out\" id=\"p09-out\"><\/span>"}, {"eyebrow": "执行器 · 状态机", "title": "不是一个简单 while 循环", "lede": "ExecMergeJoin 的 11 个状态分成初始化、同步、连接、补空四阶段；复杂度来自 SQL 语义而非合并动作。", "caption": "图 10　11 个状态按四阶段归组；依据 nodeMergejoin.c 的状态定义与顶部算法注释。", "bridge": "状态这么多，核心只为守住一件事：重复 key 下不能漏行。", "notes": "把源码里的状态摊开，会发现它不是教科书上那个双层循环，而是一台状态机，十一个状态。我按四段归组：初始化，读两侧首个可匹配元组、算好 key；同步，SKIP_TEST 比较大小，不等就 SKIPOUTER_ADVANCE 或 SKIPINNER_ADVANCE；连接，JOINTUPLES 检查额外的 joinqual 和 otherqual 再投影，NEXTINNER 继续扫当前 key 的 inner 段，NEXTOUTER 推进 outer，TESTOUTER 判断新 outer 是不是还等于 marked inner；最后是 ENDOUTER 和 ENDINNER，给 right、full、left join 的未匹配行补 NULL。为什么需要这么复杂？因为 SQL 语义不只「输出匹配行」：重复 key 要重放 inner 段，外连接要补空，semi 和 anti 又有早停或者不返回匹配行的规则。还有个分工得记牢：mergeclauses 负责同步两侧，额外 joinqual 决定这个元组算不算「匹配过」，otherqual 是返回前最后一道过滤。状态这么多，核心其实只为守住一件事 —— 重复 key 下不能漏行。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >ExecMergeJoin 是状态机，不是一个简单 while 循环<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >执行器 · 1 "1\" /><text x=\"1076\" y=\"164\" font-size=\"11.5\" fill=\"#BE653B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >ENDOUTER<\/text><text x=\"1076\" y=\"184\" font-size=\"11.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >right / full 补 outer NULL<\/text><rect x=\"1066\" y=\"201\" width=\"300\" height=\"52\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1076\" y=\"223\" font-size=\"11.5\" fill=\"#BE653B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >ENDINNER<\/text><text x=\"1076\" y=\"243\" font-size=\"11.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >left / full 补 inner NULL<\/text><text x=\"24\" y=\"404\" font-size=\"13.5\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >复杂度来自 SQL 语义：重复 key 重放、外连接补 NULL、semi / anti 早停或不返回匹配行。<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "正确性 · mark/restore", "title": "重复 key 下的正确性基础", "lede": "outer 是 4,5,5,6，inner 是 3,5,5,5,8：第二个 outer=5 到来时 inner 已推进到 8，必须回到第一个 inner=5。", "caption": "图 11　重复 key 下的 Mark 与 Restore；依据原文 3.3 与源码顶部算法注释。", "bridge": "机制是对的，但代价也真实存在 —— 于是规划器得决定：什么时候能不回退？", "notes": "用原文那组数字走一遍，最清楚。outer 是 4、5、5、6，inner 是 3、5、5、5、8。第一个 outer 等于 5 的时候，要和三个 inner 等于 5 各输出一行，inner 指针一路走到 8。问题来了：第二个 outer 还是 5，可 inner 已经回不去了。所以执行器在第一次遇到相等时，就把 inner 当前位置 Mark 下来；后续 outer 的 key 仍然等于被标记的那个 key，就调 ExecRestrPos 把 inner 恢复到 Mark 处，重新发射这一整段。源码顶部的注释举的是同一件事：刚把第一个 outer 5 和最后一个 inner 5 连完，下一步就是 repositioning the inner cursor 回到第一个 inner 5。所以 mark/restore 不是优化技巧，是正确性机制，没有它就会漏掉三行结果。但你也马上能感觉到代价：重复越多，重放越多。于是规划器得回答下一个问题 —— 什么时候可以干脆不回退？", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >mark/restore 不是优化技巧，是重复 key 下的正确性机制<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >正确性 · 原文示例 outer: 4,5,5,6 / inner: 3,5,5,5,8<\/text><text x=\"24\" y=\"74\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"2\" opacity=\"1\" >两侧都有重复 key<\/text><text x=\"24\" y=\"120\" font-size=\"14\" fill=\"#245A6B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >outer<\/text><rect x=\"170\" y=\"92\" width=\"60\" height=\"44\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"200\" y=\"120\" font-size=\"19\" fill=\"#1B2B33\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >4<\/text><rect x=\"246\" y=\"92\" width=\"60\" height=\"44\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"2\" opacity=\"1\" /><text x=\"276\" y=\"120\" font-size=\"19\" fill=\"#245A6B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >5<\/text><rect x=\"322\" y=\"92\" width=\"60\" height=\"44\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"2\" opacity=\"1\" /><text x=\"352\" y=\"120\" font-size=\"19\" fill=\"#245A6B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >5<\/text><rect x=\"398\" y=\"92\" width=\"60\" height=\"44\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"428\" y=\"120\" font-size=\"19\" fill=\"#1B2B33\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >6<\/text><text x=\"24\" y=\"224\" font-size=\"14\" fill=\"#245A6B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >inner<\/text><rect x=\"170\" y=\"196\" width=\"60\" height=\"44\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"200\" y=\"224\" font-size=\"19\" fill=\"#1B2B33\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >3<\/text><rect x=\"246\" y=\"196\" width=\"60\" height=\"44\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"2\" opacity=\"1\" /><text x=\"276\" y=\"224\" font-size=\"19\" fill=\"#AE8A3E\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >5<\/text><rect x=\"322\" y=\"196\" width=\"60\" height=\"44\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" opacity=\"1\" /><text x=\"352\" y=\"224\" font-size=\"19\" fill=\"#2F7A66\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >5<\/text><rect x=\"398\" y=\"196\" width=\"60\" height=\"44\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" opacity=\"1\" /><text x=\"428\" y=\"224\" font-size=\"19\" fill=\"#2F7A66\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"middle\" le
