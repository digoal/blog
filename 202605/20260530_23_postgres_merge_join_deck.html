l=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"84\" width=\"440\" height=\"44\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"40\" y=\"113.2\" font-size=\"20\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >面向数据库架构师<\/text><rect x=\"40\" y=\"165.92\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"57\" y=\"172.68\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >设计 B-tree 索引时，不只看单表过滤，还要看 join key 顺序<\/text><text x=\"57\" y=\"199.68\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >能否被复用。<\/text><rect x=\"40\" y=\"219.92\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"57\" y=\"226.68\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >报表链路优先评估「索引顺序 → Merge Join → 上层聚合」的连续<\/text><text x=\"57\" y=\"253.68\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >有序路径。<\/text><rect x=\"40\" y=\"273.92\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"57\" y=\"280.68\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >重复 key 很多的模型要谨慎：输出规模本身就会爆炸。<\/text><rect x=\"40\" y=\"300.92\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"57\" y=\"307.68\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >列存 / 压缩 / 向量化系统不要机械套用 PostgreSQL 的执行成<\/text><text x=\"57\" y=\"334.68\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >本。<\/text><rect x=\"480\" y=\"84\" width=\"440\" height=\"300\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"480\" y=\"84\" width=\"440\" height=\"44\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"496\" y=\"113.2\" font-size=\"20\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >面向 DBA<\/text><rect x=\"496\" y=\"179.42\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"513\" y=\"186.18\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >慢 SQL 先看孩子节点：两个大 Sort？Materialize？是否写临时<\/text><text x=\"513\" y=\"213.18\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >文件？<\/text><rect x=\"496\" y=\"233.42\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"513\" y=\"240.18\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >work_mem 按「每个操作、每个并发会话、每个 worker」理解。<\/text><rect x=\"496\" y=\"260.42\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"513\" y=\"267.18\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >计划选错先查统计信息与相关列分布、倾斜、过时统计。<\/text><rect x=\"496\" y=\"287.42\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"513\" y=\"294.18\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >关注 Sort Method: external merge Disk，别把开关当长期配<\/text><text x=\"513\" y=\"321.18\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >置。<\/text><rect x=\"936\" y=\"84\" width=\"440\" height=\"300\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"936\" y=\"84\" width=\"440\" height=\"44\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"952\" y=\"113.2\" font-size=\"20\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >面向业务开发者<\/text><rect x=\"952\" y=\"179.42\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"969\" y=\"186.18\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >写清晰的等值 join 条件，别在 join key 外包函数或混用类型。<\/text><rect x=\"952\" y=\"206.42\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"969\" y=\"213.18\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >业务需要有序结果时，让 ORDER BY 与 join key / 索引顺序一<\/text><text x=\"969\" y=\"240.18\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >致。<\/text><rect x=\"952\" y=\"260.42\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"969\" y=\"267.18\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >别把多对多 join 的慢归咎于算法：先确认结果规模是否合理。<\/text><rect x=\"952\" y=\"287.42\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"969\" y=\"294.18\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >分页与首屏查询，小 outer + inner index 的 NestLoop 可能<\/text><text x=\"969\" y=\"321.18\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >更合适。<\/text><text x=\"24\" y=\"414\" font-size=\"13.5\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >三类动作指向同一件事：让「有序」这个前提便宜，让「组合规模」这个结果合理。<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "场景 · 适合与不适合", "title": "优势区间很窄", "lede": "两侧已有顺序、下游还要同样顺序、重复 key 可控 —— 三个条件同时成立，才谈得上它的强项。", "caption": "图 22　适合 / 不适合各五个信号与三问速查；依据原文第八节。", "bridge": "最后把反复出现的老坑归归类，大半指向同一个误会。", "notes": "把场景压成一张速查表。适合的一边：两侧都能通过 B-tree 索引按 join key 顺序读；上游已经排序或者下游还需要同样顺序，排序成本能被复用；大批量等值 join 但 hash build 侧过大或内存压力明显；报表、批处理、按业务键归并；还有 FULL JOIN，尤其是没有 join clause 的特殊 full join，源码注释说明普通 clauseless nestloop 不合适，需要 merge join 路径支持。不适合的一边：两边都大又都没有有用顺序；work_mem 明显不足、排序频繁落盘；join key 重复度极高；条件不是 mergejoinable；只要极少量结果且 inner 有高选择率参数化索引，这时候小 outer 加 inner index 的 Nested Loop 首行延迟可能低得多；build 侧适中又无序输入很多时，Hash Join 往往更简单便宜。底下那三问最实用：两侧已有顺序吗？下游还需要同样顺序吗？重复 key 会不会让输出规模本身爆炸？最后把反复出现的老坑归归类。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >优势区间很窄：顺序已有、下游还要、重复可控<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >场景 · 适合与不适合的信号清单<\/text><rect x=\"24\" y=\"84\" width=\"660\" height=\"280\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"84\" width=\"660\" height=\"44\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"42\" y=\"113.2\" font-size=\"20\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >适合<\/text><rect x=\"42\" y=\"183.09\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"59\" y=\"190.11\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >两侧都能通过 B-tree 索引按 join key 顺序读取。<\/text><rect x=\"42\" y=\"210.09\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"59\" y=\"217.11\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >上游已排序，或下游还需要同样顺序，排序成本可复用。<\/text><rect x=\"42\" y=\"237.09\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"59\" y=\"244.11\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >大批量等值 join，但 hash build 侧过大或内存压力明显。<\/text><rect x=\"42\" y=\"264.09\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"59\" y=\"271.11\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >报表查询、批处理、按业务键归并数据。<\/text><rect x=\"42\" y=\"291.09\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"59\" y=\"298.11\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >FULL JOIN，尤其无 join clause 的特殊 full join。<\/text><rect x=\"700\" y=\"84\" width=\"676\" height=\"280\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"700\" y=\"84\" width=\"676\" height=\"44\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"718\" y=\"113.2\" font-size=\"20\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >不适合<\/text><rect x=\"718\" y=\"183.09\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"735\" y=\"190.11\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >两边都很大且都没有有用顺序，显式 Sort 成本高。<\/text><rect x=\"718\" y=\"210.09\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"735\" y=\"217.11\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >work_mem 明显不足，排序频繁落盘。<\/text><rect x=\"718\" y=\"237.09\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"735\" y=\"244.11\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >join key 重复度极高，输出规模与 inner 重放都很大。<\/text><rect x=\"718\" y=\"264.09\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"735\" y=\"271.11\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >条件不是 mergejoinable：复杂表达式、非等值、无合适 opfamily。<\/text><rect x=\"718\" y=\"291.09\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"735\" y=\"298.11\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >只要极少量结果，且 inner 有高选择率参数化索引。<\/text><rect x=\"24\" y=\"376\" width=\"1352\" height=\"36\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"44\" y=\"400\" font-size=\"14\" fill=\"#AE8A3E\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >三问速查：两侧已有顺序吗？下游还需要同样顺序吗？重复 key 是否让输出规模本身爆炸？<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "避坑 · 八个坑", "title": "大半指向同一个误会", "lede": "概念、语义、统计、工程四类误读；最该记住的是：有序输入从哪来，重复 key 重放多少。", "caption": "图 23　八个常见坑按四类成因归类；依据原文第九节。", "bridge": "把整条链压回一张地层剖面收尾。", "notes": "八个坑，归类其实就四种。概念类：只看 Merge Join 不看 Sort；误以为索引一定比 Seq Scan 加 Sort 快 —— 官方文档专门提醒，处理大量行时顺序扫描再排序经常胜过按索引做大量非顺序访问。语义类：忽略 inner 的 Materialize；把 NULL 当成普通重复 key。统计类：误读 EXPLAIN ANALYZE 的 child rows，忘了提前停止和重复发射；让 Join Filter 承担真正选择性，说明很多组合要先产生再过滤。工程类：把 enable_mergejoin = off 当优化方案；忽略 collation 和 opfamily，跨类型、不同排序语义、不完整操作符族都会影响可用性。你会发现大半的坑指向同一个误会：把「Merge Join」当成一个孤立的节点，而没去问有序输入从哪来、重复 key 让 inner 段重放了多少。收尾我们就把整条链压回那张地层剖面。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >八个常见坑，按四类成因归类<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >避坑 · 概念 / 语义 / 统计 / 工程；大半指向同一个误会<\/text><rect x=\"24\" y=\"84\" width=\"660\" height=\"72\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"84\" width=\"6\" height=\"72\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><rect x=\"42\" y=\"104\" width=\"60\" height=\"30\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"72\" y=\"122.91\" font-size=\"11.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >概念<\/text><text x=\"116\" y=\"114\" font-size=\"15.5\" fill=\"#1B2B33\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >只看 Merge Join，不看 Sort<\/text><text x=\"116\" y=\"140\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >两个大 Sort 加外部落盘，常比 join 本身更贵。<\/text><rect x=\"700\" y=\"84\" width=\"660\" height=\"72\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"700\" y=\"84\" width=\"6\" height=\"72\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><rect x=\"718\" y=\"104\" width=\"60\" height=\"30\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"748\" y=\"122.91\" font-size=\"11.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >概念<\/text><text x=\"792\" y=\"114\" font-size=\"15.5\" fill=\"#1B2B33\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >误以为索引一定比 Seq Scan + Sort 快<\/text><text x=\"792\" y=\"140\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >处理大量行时，顺序扫描再排序经常胜过大批量非顺序访问。<\/text><rect x=\"24\" y=\"164\" width=\"660\" height=\"72\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"164\" width=\"6\" height=\"72\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><rect x=\"42\" y=\"184\" width=\"60\" height=\"30\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"72\" y=\"202.91\" font-size=\"11.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >语义<\/text><text x=\"116\" y=\"194\" font-size=\"15.5\" fill=\"#1B2B33\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >忽略 inner 的 Materialize<\/text><text x=\"116\" y=\"220\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >它可能是为 mark/restore 的正确性，或为降低重复发射成本。<\/text><rect x=\"700\" y=\"164\" width=\"660\" height=\"72\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"700\" y=\"164\" width=\"6\" height=\"72\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><rect x=\"718\" y=\"184\" width=\"60\" height=\"30\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"748\" y=\"202.91\" font-size=\"11.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >语义<\/text><text x=\"792\" y=\"194\" font-size=\"15.5\" fill=\"#1B2B33\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >把 NULL 当成普通重复 key<\/text><text x=\"792\" y=\"220\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >SQL 中 NULL = NULL 不为真，执行器专门避免误报匹配。<\/text><rect x=\"24\" y=\"244\" width=\"660\" height=\"72\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"244\" width=\"6\" height=\"72\" rx=\"0\" fill=\"#AE8A3E\" opacity=\"1\" /><rect x=\"42\" y=\"264\" width=\"60\" height=\"30\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"72\" y=\"282.91\" font-size=\"11.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >统计<\/text><text x=\"116\" y=\"274\" font-size=\"15.5\" fill=\"#1B2B33\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >误读 EXPLAIN ANALYZE 的 child rows<\/text><text x=\"116\" y=\"300\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >提前停止读取、重复发射都会影响统计，要结合 loops 看。<\/text><rect x=\"700\" y=\"244\" width=\"660\" height=\"72\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"700\" y=\"244\" width=\"6\" height=\"72\" rx=\"0\" fill=\"#AE8A3E\" opacity=\"1\" /><rect x=\"718\" y=\"264\" width=\"60\" height=\"30\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"748\" y=\"282.91\" font-size=\"11.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >统计<\/text><text x=\"792\" y=\"274\" font-size=\"15.5\" fill=\"#1B2B33\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >让 Join Filter 承担真正选择性<\/text><text x=\"792\" y=\"300\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >大量组合要先产生再过滤，成本会明显变高。<\/text><rect x=\"24\" y=\"324\" width=\"660\" height=\"72\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"324\" width=\"6\" height=\"72\" rx=\"0\" fill=\"#AE8A3E\" opacity=\"1\" /><rect x=\"42\" y=\"344\" width=\"60\" height=\"30\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"72\" y=\"362.91\" font-size=\"11.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >工程<\/text><text x=\"116\" y=\"354\" font-size=\"15.5\" fill=\"#1B2B33\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >以为 enable_mergejoin = off 是优化方案<\/text><text x=\"116\" y=\"380\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >它只是诊断工具，修复通常是索引、统计、内存与 SQL。<\/text><rect x=\"700\" y=\"324\" width=\"660\" height=\"72\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"700\" y=\"324\" width=\"6\" height=\"72\" rx=\"0\" fill=\"#AE8A3E\" opacity=\"1\" /><rect x=\"718\" y=\"344\" width=\"60\" height=\"30\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"748\" y=\"362.91\" font-size=\"11.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >工程<\/text><text x=\"792\" y=\"354\" font-size=\"15.5\" fill=\"#1B2B33\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >忽略 collation 和 opfamily<\/text><text x=\"792\" y=\"380\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >跨类型、不同排序语义或不完整操作符族会影响可用性。<\/text><text x=\"24\" y=\"414\" font-size=\"13.5\" fill=\"#BE653B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >误会的核心：把「Merge Join」当孤立节点，忽略有序输入从哪来、重复 key 重放多少。<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "收束 · 七层剖面", "title": "分水岭在第三层", "lede": "从物理执行机制一路到业务语义；L3 的「有序输入」把「两条流的合并」改写成「一条可复用的顺序」。", "caption": "图 24　全篇机制的七层剖面、源码主线与五个扩展问题；扩展阅读仅作概念参照。", "bridge": "谢谢。带着这几个问题，去自己的库里跑一遍 EXPLAIN。", "notes": "最底下是执行机制，ExecMergeJoin 的状态机、mark/restore、补 NULL、semi 和 anti 的早停；往上是比较语义，B-tree opfamily、collation、方向和 NULL 排序规则，MJCompare 在这里决定谁大谁小；第三层是有序输入，索引顺序、上游 pathkeys、显式 Sort 在这里汇合 —— 整篇的分水岭就在这儿，正是它把「两条流的合并」改写成「一条可以被上下游反复复用的顺序」；第四层成本，两阶段估算、rescannedtuples、skip_mark_restore 和 materialize_inner；第五层计划，MergePath 展开成最多四个运行时节点；第六层优化器，pathkeys、EquivalenceClass、mergejoinable clause 和 path 竞争决定选谁；最顶上才是业务语义：join 条件怎么写、ORDER BY 对不对齐、结果规模合不合理。越深的靛青越底层。右边留了源码主线和五个没展开的问题：为什么要 opfamily、倾斜分布下谁更稳、inner 的 incremental sort 要补什么能力、列存压缩该在哪儿比较、分布式下 shuffle 怎么改写代价。补充一句，System R 的访问路径选择、多核 sort-merge、压缩执行融合这三份资料，原文只作概念背景，没有引用任何无法本地核验的实验数字，我也照这个口径处理。谢谢，带着这几个问题，去自己的库里跑一遍 EXPLAIN (ANALYZE, BUFFERS)。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >七层剖面：分水岭在第三层「有序输入」<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >收束 · 从物理页面一路到业务语义；越深的靛青越底层<\/text><rect x=\"24\" y=\"84\" width=\"760\" height=\"41\" rx=\"0\" fill=\"#EBF1EE\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"38\" y=\"111\" font-size=\"13\" fill=\"#1B2B33\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >L7<\/text><text x=\"92\" y=\"111\" font-size=\"15\" fill=\"#1B2B33\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >业务语义<\/text><text x=\"232\" y=\"110\" font-size=\"11.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >join 条件怎么写、ORDER BY 是否对齐、结果规模是否合理<\/text><rect x=\"24\" y=\"129\" width=\"760\" height=\"41\" rx=\"0\" fill=\"#CFE0DC\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"38\" y=\"156\" font-size=\"13\" fill=\"#1B2B33\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >L6<\/text><text x=\"92\" y=\"156\" font-size=\"15\" fill=\"#1B2B33\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >优化器<\/text><text x=\"232\" y=\"155\" font-size=\"11.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >pathkeys / EquivalenceClass / mergejoinable clause 与 path 竞争<\/text><rect x=\"24\" y=\"174\" width=\"760\" height=\"41\" rx=\"0\" fill=\"#A4C4C6\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"38\" y=\"201\" font-size=\"13\" fill=\"#1B2B33\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >L5<\/text><text x=\"92\" y=\"201\" font-size=\"15\" fill=\"#1B2B33\" font-family=\"Songti SC, const N = D.length;
let cur = 0, panelOn = false, panelMode = '', autoTimer = null, autoOn = false;
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const pad = n => String(n).padStart(2,'0');
const setA = (id,a,v) => { const e=document.getElementById(id); if(e) e.setAttribute(a,v); };
const setT = (id,s) => { const e=document.getElementById(id); if(e) e.textContent=s; };
const fmt = n => Math.round(n).toLocaleString('en-US');
const KEYS = [
  ['→ / 空格','下一页'],['←','上一页'],['F','全屏 / 退出全屏（按键条常驻）'],['G','目录（再按关闭）'],
  ['N','本页讲稿（再按关闭）'],['T','全文讲稿（再按关闭）'],['P','自动播放 / 暂停'],
  ['1–9','直接跳页'],['输入页码 + 回车','跳到指定页'],['Home / End','首页 / 末页'],
  ['Esc','关闭讲稿窗 / 退出全屏'],['? 或 H','本帮助'],['点击底部按钮','同上']
];

function fit(){
  const vp=$('#viewport'), W=vp.clientWidth, H=vp.clientHeight;
  const pw = panelOn ? $('#notes').offsetWidth : 0;
  const aw = Math.max(320, W-pw);
  const s = Math.min(aw/1600, H/900);
  const st=$('#stage');
  st.style.transform='scale('+s+')';
  st.style.left=((aw-1600*s)/2)+'px';
  st.style.top=((H-900*s)/2)+'px';
}
window.addEventListener('resize', fit);

function render(){
  $('#slides').innerHTML = D.map((d,i)=>
    '<section class="slide'+(d.ctrl?' anim':'')+'" id="s'+i+'">'
    + '<div class="eyebrow"><span class="num">'+pad(i+1)+' / '+pad(N)+'</span>'+d.eyebrow+'</div>'
    + '<h1 class="title">'+d.title+'</h1>'
    + '<div class="lede">'+d.lede+'</div>'
    + '<div class="rule"></div>'
    + '<div class="figwrap">'+d.svg+'</div>'
    + '<div class="caption">'+d.caption+'</div>'
    + (d.ctrl ? '<div class="ctrls">'+d.ctrl+'</div>' : '')
    + '<div class="bridge"><span class="bk">承接 · NEXT</span>'+d.bridge+'</div>'
    + '<div class="footer"><div class="fbar"><i id="fbar'+i+'"></i></div>'
    + '<span class="fl">数据库筑基课 · Merge Join</span>'
    + '<span class="fr">'+pad(i+1)+' / '+pad(N)+'</span></div>'
    + '</section>').join('');
}

function toast(s){
  const t=$('#toast'); t.textContent=s; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1600);
}

/* ---------- 页内开窗：右侧讲稿 ---------- */
function secHTML(d,i){
  return '<div class="nsec" id="nsec'+i+'"><span class="sn">'+pad(i+1)+' · '+d.eyebrow+'</span>'
    +'<h3>'+d.title+'</h3><p>'+d.notes+'</p>'
    +'<div class="br">「'+d.bridge+'」</div></div>';
}
function renderPanel(){
  const h=$('#nTitle'), sub=$('#nSub'), b=$('#nBody');
  if(panelMode==='here'){
    h.textContent='本页讲稿'; sub.textContent=pad(cur+1)+' / '+pad(N);
    b.innerHTML=secHTML(D[cur],cur); b.scrollTop=0;
  }else if(panelMode==='all'){
    h.textContent='全文讲稿'; sub.textContent='自动跟随当前页 · 共 '+N+' 页';
    b.innerHTML=D.map((d,i)=>secHTML(d,i)).join('');
  }else if(panelMode==='toc'){
    h.textContent='目录'; sub.textContent='点击跳转 · 共 '+N+' 页';
    b.innerHTML='<div class="tocgrid">'+D.map((d,i)=>
      '<a data-i="'+i+'" onclick="jump('+i+')"><span class="gn">'+pad(i+1)+'</span>'
      +'<span class="gt">'+d.title+'</span></a>').join('')+'</div>';
  }else{
    h.textContent='快捷键'; sub.textContent='全屏后底部同样常驻';
    b.innerHTML='<div class="keygrid">'+KEYS.map(k=>'<div><kbd>'+k[0]+'</kbd>'+k[1]+'</div>').join('')+'</div>'
      +'<div class="nsec"><p>讲稿采用页内开窗：按一下显示，再按一下关闭；显示时画面矢量缩放到左侧。'
      +'按 T 显示全部讲稿时自动定位到当前页，翻页时右侧讲稿会联动滚动并高亮当前页。'
      +'三处动画页（09 / 12 / 16）都提供输入、播放 / 暂停、单步与重置，均为确定性示意模型，不代表实测数据。</p></div>';
  }
  syncNotes(true);
}
function syncNotes(instant){
  if(!panelOn) return;
  if(panelMode==='all'){
    $$('.nsec').forEach(e=>e.classList.remove('cur'));
    const el=document.getElementById('nsec'+cur), nb=$('#nBody');
    if(el && nb){
      el.classList.add('cur');
      const top=Math.max(0, el.getBoundingClientRect().top - nb.getBoundingClientRect().top + nb.scrollTop - 8);
      if(instant){
        const old=nb.style.scrollBehavior;
        nb.style.scrollBehavior='auto';
        nb.scrollTop=top;
        nb.style.scrollBehavior=old;
      }else{
        nb.scrollTo({top:top,behavior:'smooth'});
      }
    }
  }else if(panelMode==='toc'){
    $$('.tocgrid a').forEach(a=>a.classList.toggle('cur', +a.dataset.i===cur));
  }
}
function openPanel(mode){
  if(panelOn && panelMode===mode){ closePanel(); return; }
  panelOn=true; panelMode=mode;
  document.body.classList.add('panel-on');
  renderPanel(); fit(); syncChrome();
  if(mode==='all') setTimeout(()=>syncNotes(true),90);
}
function closePanel(){
  if(!panelOn) return;
  panelOn=false; panelMode='';
  document.body.classList.remove('panel-on');
  fit(); syncChrome();
}
function jump(i){ closePanel(); go(i); }
function syncChrome(){
  $('#btnNotes').classList.toggle('act', panelOn && panelMode==='here');
  $('#btnAll').classList.toggle('act', panelOn && panelMode==='all');
  $('#btnToc').classList.toggle('act', panelOn && panelMode==='toc');
  $('#btnHelp').classList.toggle('act', panelOn && panelMode==='help');
  $('#btnFs').textContent = document.body.classList.contains('immersive') ? '退出全屏 F' : '全屏 F';
}

/* ---------- 翻页 ---------- */
function go(i,silent){
  i=Math.max(0,Math.min(N-1,i));
  $$('.slide').forEach((el,k)=>el.classList.toggle('on',k===i));
  cur=i;
  try{ localStorage.setItem('mj-slide',String(i)); }catch(e){}
  $('#pg').textContent=pad(i+1)+' / '+pad(N);
  const jp=$('#jump'); if(jp) jp.value=String(i+1);
  $('#bar').style.width=((i+1)/N*100)+'%';
  for(let k=0;k<N;k++){ const b=document.getElementById('fbar'+k); if(b) b.style.width=(k<=i?100:0)+'%'; }
  stopAnims();
  if(panelOn){
    if(panelMode==='here') renderPanel(); else syncNotes(false);
  }
  if(!silent) toast(pad(i+1)+'　'+D[i].title);
  syncChrome();
}
function next(){ if(cur<N-1) go(cur+1); else stopAuto(); }
function prev(){ if(cur>0) go(cur-1); }

/* ---------- 自动播放 / 全屏 ---------- */
function stopAuto(){
  autoOn=false; clearInterval(autoTimer); autoTimer=null;
  $('#btnAuto').textContent='自动播放 P'; $('#btnAuto').classList.remove('act');
}
function toggleAuto(){
  if(autoOn){ stopAuto(); toast('已暂停自动播放'); return; }
  autoOn=true; $('#btnAuto').textContent='❚❚ 暂停 P'; $('#btnAuto').classList.add('act');
  autoTimer=setInterval(()=>{ if(cur<N-1) go(cur+1,true); else stopAuto(); },12000);
  toast('自动播放：每 12 秒一页（P 暂停）');
}
function fs(){
  const el=document.documentElement;
  const immersive=document.body.classList.contains('immersive');
  if(document.fullscreenElement || immersive){
    document.body.classList.remove('immersive');
    try{ if(document.fullscreenElement) document.exitFullscreen(); }catch(e){}
    toast('已退出全屏');
    fit(); syncChrome();
    return;
  }
  try{
    const p=el.requestFullscreen && el.requestFullscreen();
    if(p && p.catch) p.catch(()=>toast('浏览器拦截了原生全屏，已进入沉浸模式'));
  }catch(e){}
  document.body.classList.add('immersive');
  toast('全屏：底部快捷键常驻（F 或 Esc 退出）');
  fit(); syncChrome();
}
document.addEventListener('fullscreenchange',()=>{
  if(!document.fullscreenElement) document.body.classList.remove('immersive');
  fit(); syncChrome();
});

/* ---------- 三处动画：输入 + 播放/暂停 + 单步 + 重置 ---------- */
const ANIMS=[];
function mkBase(max){ const a={step:0,max:max,timer:null,
  pause(){ if(this.timer){clearInterval(this.timer);this.timer=null;} const b=document.getElementById(this.playId); if(b)b.textContent='▶ 播放'; },
  play(){ if(this.step>=this.max) this.step=0; this.pause(); this.paint();
    const b=document.getElementById(this.playId); if(b)b.textContent='❚❚ 暂停';
    this.timer=setInterval(()=>{ if(this.step>=this.max){this.pause();return;} this.step++; this.paint(); },720); },
  stepOnce(){ this.pause(); if(this.step<this.max){this.step++;this.paint();} },
  reset(){ this.pause(); this.step=0; this.paint(); }
}; ANIMS.push(a); return a; }
function stopAnims(){ ANIMS.forEach(a=>a.pause()); }

/* A · 第 09 页：两条有序流同步推进（去重简化版 + 重复 key 的 mark/restore） */
const A_PRESETS=[
  {o:[1,2,4,6,8,10], i:[2,3,4,7,9,11]},
  {o:[1,3,5,5,8,10], i:[2,3,5,5,9,12]},
  {o:[4,5,5,6,9,11], i:[3,5,5,5,8,12]}
];
const A=mkBase(12); A.playId='p09-play';
A.build=function(){
  const P=A_PRESETS[+document.getElementById('p09-seq').value];
  const O=P.o, I=P.i;
  let oi=0,ii=0,mark=null,outs=[],advO=0,advI=0,restores=0;
  const snap=(cmp,act,rf,done)=>({oi:Math.min(oi,O.length-1),ii:Math.min(ii,I.length-1),
      mark:mark,cmp:cmp,act:act,outs:outs.slice(),advO:advO,advI:advI,restores:restores,
      rf:!!rf,done:!!done});
  const S=[snap('—','等待开始 · 点播放或单步',false,false)];
  let guard=0;
  while(oi<O.length && ii<I.length && guard++<160){
    const a=O[oi], b=I[ii];
    if(a<b){ S.push(snap('‹','outer 较小 → 推进 outer')); advO++; oi++; continue; }
    if(a>b){ S.push(snap('›','inner 较小 → 推进 inner')); advI++; ii++; continue; }
    const marking=(mark===null);
    if(mark===null) mark=ii;
    outs.push('('+a+','+b+')');
    S.push(snap('=','key 相等 → 输出'+(marking?'，并 Mark inner':'')));
    ii++;
    if(ii<I.length && I[ii]===a) continue;
    oi++;
    if(oi<O.length && O[oi]===a && mark!==null){
      ii=mark; restores++;
      S.push(snap('↺','TESTOUTER → Restore 到 mark',true));
    }else{ mark=null; }
  }
  S.push(snap('·','一侧输入耗尽 → 结束',false,true));
  return {O:O,I:I,S:S};
};
A.paint=function(){
  const {O,I,S}=this.build();
  this.max=S.length-1;
  if(this.step>this.max) this.step=this.max;
  const s=S[this.step];
  for(let j=0;j<6;j++){
    setA('p09-o'+j,'fill', j===s.oi?'#E5EFF0':(j<s.oi?'#F1EFE9':'#FFFFFF'));
    setA('p09-o'+j,'stroke', j===s.oi?'#245A6B':'#D9D5CB');
    setA('p09-o'+j,'stroke-width', j===s.oi?'2':'1');
    setT('p09-ot'+j, j<O.length?String(O[j]):'·');
    setA('p09-ot'+j,'fill', j===s.oi?'#245A6B':(j<s.oi?'#89938F':'#1B2B33'));
    const isMark=(s.mark===j);
    setA('p09-i'+j,'fill', j===s.ii?'#F7E9DE':(isMark?'#F5EDDC':'#FFFFFF'));
    setA('p09-i'+j,'stroke', j===s.ii?'#BE653B':(isMark?'#AE8A3E':'#D9D5CB'));
    setA('p09-i'+j,'stroke-width',(j===s.ii||isMark)?'2':'1');
    setT('p09-it'+j, j<I.length?String(I[j]):'·');
    setA('p09-it'+j,'fill', j===s.ii?'#BE653B':(j<s.ii?'#89938F':'#1B2B33'));
  }
  setA('p09-rst','opacity', s.rf?'1':'0.12');
  setT('p09-cmp',s.cmp);
  setT('p09-act',s.act);
  setT('p09-c0',String(this.step));
  setT('p09-c1',String(s.advO));
  setT('p09-c2',String(s.advI));
  setT('p09-c3',String(s.outs.length));
  setT('p09-c4',String(s.restores));
  for(let j=0;j<8;j++){
    const v=s.outs[s.outs.length-8+j];
    setT('p09-r'+j, v||'—');
    setA('p09-r'+j,'fill', v?'#2F7A66':'#89938F');
  }
  setT('p09-stage','第 '+this.step+' / '+this.max+' 步　·　'+s.act
      +(s.rf?'　（inner 回退到 mark）':''));
  const out=document.getElementById('p09-out');
  if(out) out.innerHTML='<b>比较 '+this.step+' 次</b>　推进 outer '+s.advO
    +' / inner '+s.advI+' · 输出 '+s.outs.length+' 组 · Restore '+s.restores+' 次（示意 · 非实测）';
};

/* B · 第 12 页：重复 key 重放与 skip_mark_restore */
const B_PRESETS=[
  {o:[4,5,5,6,9,11], i:[3,5,5,5,8,12]},
  {o:[4,5,5,5,6,9], i:[3,5,5,5,8,12]},
  {o:[4,5,5,6,9,11], i:[3,5,8,9,12,14]}
];
const B=mkBase(12); B.playId='p12-play';
B.build=function(){
  const P=B_PRESETS[+document.getElementById('p12-seq').value];
  const skip=document.getElementById('p12-skip').value==='1';
  const O=P.o, I=P.i;
  let oi=0,ii=0,mark=null,markSeg=0,outs=[],restores=0,replayed=0;
  const S=[];
  const snap=(cmp,act,rf,done)=>({oi:Math.min(oi,O.length-1),ii:Math.min(ii,I.length-1),
      mark:mark,cmp:cmp,act:act,outs:outs.slice(),restores:restores,replayed:replayed,
      rf:!!rf,done:!!done,skip:skip});
  S.push(snap('—','等待开始 · 点播放或单步',false,false));
  let guard=0;
  while(oi<O.length && ii<I.length && guard++<160){
    const a=O[oi], b=I[ii];
    if(a<b){ S.push(snap('‹','outer 较小 → 推进 outer')); oi++; continue; }
    if(a>b){ S.push(snap('›','inner 较小 → 推进 inner')); ii++; continue; }
    if(skip){
      outs.push('('+a+','+b+')');
      S.push(snap('=','首个匹配 → 输出；skip 生效，不回退'));
      while(oi<O.length && O[oi]===a) oi++;
      while(ii<I.length && I[ii]===b) ii++;
      continue;
    }
    if(mark===null){
      mark=ii; markSeg=0;
      let q=ii; while(q<I.length && I[q]===a){ markSeg++; q++; }
    }
    outs.push('('+a+','+b+')');
    S.push(snap('=','key 相等 → 输出 '+'('+a+','+b+')'));
    ii++;
    if(ii<I.length && I[ii]===a) continue;
    oi++;
    if(oi<O.length && O[oi]===a && mark!==null){
      ii=mark; restores++; replayed+=markSeg;
      S.push(snap('↺','TESTOUTER → Restore 到 mark',true));
    }else{ mark=null; markSeg=0; }
  }
  S.push(snap('·','一侧输入耗尽 → 结束',false,true));
  return {O:O,I:I,S:S,skip:skip};
};
B.paint=function(){
  const {O,I,S,skip}=this.build();
  this.max=S.length-1;
  if(this.step>this.max) this.step=this.max;
  const s=S[this.step];
  for(let j=0;j<6;j++){
    setA('p12-o'+j,'fill', j===s.oi?'#E5EFF0':(j<s.oi?'#F1EFE9':'#FFFFFF'));
    setA('p12-o'+j,'stroke', j===s.oi?'#245A6B':'#D9D5CB');
    setA('p12-o'+j,'stroke-width', j===s.oi?'2':'1');
    setT('p12-ot'+j, j<O.length?String(O[j]):'·');
    setA('p12-ot'+j,'fill', j===s.oi?'#245A6B':(j<s.oi?'#89938F':'#1B2B33'));
    const isMark=(s.mark===j);
    setA('p12-i'+j,'fill', j===s.ii?'#F7E9DE':(isMark?'#F5EDDC':'#FFFFFF'));
    setA('p12-i'+j,'stroke', j===s.ii?'#BE653B':(isMark?'#AE8A3E':'#D9D5CB'));
    setA('p12-i'+j,'stroke-width',(j===s.ii||isMark)?'2':'1');
    setT('p12-it'+j, j<I.length?String(I[j]):'·');
    setA('p12-it'+j,'fill', j===s.ii?'#BE653B':(j<s.ii?'#89938F':'#1B2B33'));
  }
  const seg=(s.mark!==null)?('inner['+s.mark+'] = '+I[s.mark]):'—';
  setT('p12-mark','mark 位置：'+seg);
  setT('p12-cmp',s.cmp);
  setT('p12-act',s.act);
  setT('p12-k0',String(s.outs.length));
  setT('p12-k1',String(s.restores));
  setT('p12-k2',String(s.replayed));
  setT('p12-k3',String(this.step));
  setT('p12-conc','结论：'+(skip?'skip_mark_restore 开 → 首个匹配即推进，无需回退 inner'
      :(s.restores>0?'重复 outer key → inner 段被重放，Restore '+s.restores+' 次':'暂未发生回退')));
  for(let j=0;j<12;j++){
    const idx=j+1, sn=S[idx];
    const cell=document.getElementById('p12-t'+j);
    if(!cell) continue;
    if(idx<=this.step && sn){
      setA('p12-t'+j,'fill', sn.rf?'#F7E9DE':'#FFFFFF');
      setA('p12-t'+j,'stroke', sn.rf?'#BE653B':'#D9D5CB');
      setA('p12-t'+j,'stroke-width', sn.rf?'2':'1');
      setT('p12-tv'+j, sn.cmp==='↺'?'↺ 回退':(sn.cmp==='='?'输出':'推进'));
      setA('p12-tv'+j,'fill', sn.rf?'#BE653B':(sn.cmp==='='?'#2F7A66':'#46585F'));
      setT('p12-ti'+j,'ii = '+sn.ii);
      setA('p12-ti'+j,'fill', sn.rf?'#BE653B':'#89938F');
    }else{
      setA('p12-t'+j,'fill','#F1EFE9');
      setA('p12-t'+j,'stroke','#D9D5CB');
      setA('p12-t'+j,'stroke-width','1');
      setT('p12-tv'+j,'—'); setA('p12-tv'+j,'fill','#89938F');
      setT('p12-ti'+j,'ii = —'); setA('p12-ti'+j,'fill','#89938F');
    }
  }
  setT('p12-stage','第 '+this.step+' / '+this.max+' 步　·　'+s.act);
  const out=document.getElementById('p12-out');
  if(out) out.innerHTML='<b>'+(skip?'skip 开':'skip 关')+'</b>　输出 '+s.outs.length
    +' 组 · Restore '+s.restores+' 次 · 重放 inner 行 '+(skip?0:s.replayed)+'（示意 · 非实测）';
};

/* C · 第 16 页：重复 key 的成本放大（相对量示意，非 PostgreSQL 成本单位） */
const C=mkBase(8); C.playId='p16-play';
C.paint=function(){
  const m=+document.getElementById('p16-m').value;
  const n=+document.getElementById('p16-n').value;
  const k=+document.getElementById('p16-k').value;
  const mat=document.getElementById('p16-mat').value==='1';
  this.max=k;
  if(this.step>this.max) this.step=this.max;
  const t=this.step;
  const outN=t*m*n, matchN=t*n, rescanN=t*(m-1)*n;
  const costN=mat?rescanN*0.25:rescanN*1.0;
  const peak=Math.max(1,k*m*n,k*n,k*(m-1)*n,k*(m-1)*n*1.0);
  const vals=[outN,matchN,rescanN,costN];
  for(let j=0;j<4;j++){
    setA('p16-b'+j,'width',(400*vals[j]/peak).toFixed(1));
    setT('p16-v'+j,fmt(vals[j]));
  }
  for(let j=0;j<8;j++){
    const on=j<t && j<k;
    setA('p16-g'+j,'fill',on?'#E5EFF0':'#F1EFE9');
    setA('p16-g'+j,'stroke',on?'#245A6B':'#D9D5CB');
    setA('p16-gt'+j,'fill',on?'#245A6B':'#89938F');
  }
  setT('p16-ratio','rescanratio：'+(m>1?(m-1)+'.00':'0.00')+'　·　重放 / 匹配');
  setT('p16-mat','Materialize：'+(mat?'开（示意系数 0.25）':'关（示意系数 1.00）'));
  setT('p16-stage','第 '+t+' / '+k+' 组 key　·　输出 '+fmt(outN)
      +' 行 / inner 匹配 '+fmt(matchN)+' 行 / 重放 '+fmt(rescanN)+' 行');
  const out=document.getElementById('p16-out');
  if(out) out.innerHTML='<b>m='+m+' · n='+n+' · '+k+' 组</b>　输出 '+fmt(k*m*n)
    +' / 匹配 '+fmt(k*n)+' / 重放 '+fmt(k*(m-1)*n)+'（相对量示意 · 非实测）';
};

function bindAnim(pre,a){
  document.getElementById(a.playId).onclick=()=>{ if(a.timer)a.pause(); else a.play(); };
  document.getElementById(pre+'-step').onclick=()=>a.stepOnce();
  document.getElementById(pre+'-reset').onclick=()=>a.reset();
  a.paint();
}

/* ---------- 键盘 ---------- */
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  const typing=(tag==='input'||tag==='select'||tag==='textarea');
  const k=e.key;
  if(k==='Escape'){
    if(typing){ e.target.blur(); return; }
    if(panelOn) closePanel();
    else if(document.fullscreenElement || document.body.classList.contains('immersive')) fs();
    return;
  }
  if(typing) return;
  if(k==='ArrowRight'||k===' '||k==='PageDown'){ e.preventDefault(); next(); }
  else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); prev(); }
  else if(k==='f'||k==='F'){ e.preventDefault(); fs(); }
  else if(k==='g'||k==='G'){ e.preventDefault(); openPanel('toc'); }
  else if(k==='n'||k==='N'){ e.preventDefault(); openPanel('here'); }
  else if(k==='t'||k==='T'){ e.preventDefault(); openPanel('all'); }
  else if(k==='p'||k==='P'){ e.preventDefault(); toggleAuto(); }
  else if(k==='?'||k==='h'||k==='H'){ e.preventDefault(); openPanel('help'); }
  else if(k==='Home'){ e.preventDefault(); go(0); }
  else if(k==='End'){ e.preventDefault(); go(N-1); }
  else if(/^[1-9]$/.test(k)){ go(parseInt(k,10)-1); }
});

/* ---------- 启动 ---------- */
function init(){
  render();
  $('#jump').max=String(N);
  $('#btnPrev').onclick=prev; $('#btnNext').onclick=next;
  $('#btnToc').onclick=()=>openPanel('toc');
  $('#btnNotes').onclick=()=>openPanel('here');
  $('#btnAll').onclick=()=>openPanel('all');
  $('#btnHelp').onclick=()=>openPanel('help');
  $('#btnAuto').onclick=toggleAuto;
  $('#btnFs').onclick=fs;
  $('#nClose').onclick=closePanel;
  $('#jump').onkeydown=e=>{
    if(e.key==='Enter'){ e.preventDefault();
      const v=parseInt($('#jump').value||'1',10);
      go(Number.isNaN(v)?0:Math.max(0,Math.min(N-1,v-1))); $('#jump').blur(); }
  };
  const inputs={
    'p09-seq':A,
    'p12-seq':B,'p12-skip':B,
    'p16-m':C,'p16-n':C,'p16-k':C,'p16-mat':C
  };
  Object.keys(inputs).forEach(id=>{
    const e=document.getElementById(id), an=inputs[id];
    if(e) ['input','change'].forEach(t=>e.addEventListener(t,()=>{ an.pause(); an.step=0; an.paint(); }));
  });
  bindAnim('p09',A); bindAnim('p12',B); bindAnim('p16',C);
  fit(); go(0,true);
  setTimeout(()=>document.body.classList.add('ready'),80);
}
document.addEventListener('DOMContentLoaded',init);

</script>
