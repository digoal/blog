" opacity=\"1\" /><text x=\"1116\" y=\"154.76\" font-size=\"14\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >(5,5)  (5,5)  (5,5)　→ 3 行<\/text><text x=\"720\" y=\"208\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >outer 第二个 5：<\/text><rect x=\"880\" y=\"186\" width=\"472\" height=\"32\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1116\" y=\"206.76\" font-size=\"14\" fill=\"#2F7A66\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >(5,5)  (5,5)  (5,5)　→ 3 行<\/text><rect x=\"720\" y=\"244\" width=\"632\" height=\"48\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"736\" y=\"274\" font-size=\"14\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >若不回到 mark，inner 已经推进到 8，第二个 outer=5 会漏掉 3 行。<\/text><text x=\"720\" y=\"330\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >重复越多 → inner 段被重放越多 → final_cost_mergejoin 估算 rescannedtuples。<\/text><text x=\"720\" y=\"354\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >规划器据此决定是否给 inner 加 Materialize。<\/text><text x=\"24\" y=\"414\" font-size=\"13.5\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >这也是为什么 inner 侧需要支持 mark/restore，而 incremental sort 暂时不行。<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "动画 B · 重放与跳过", "title": "什么时候可以跳过 mark/restore", "lede": "可交互演示：切换重复序列与 skip 开关，观察输出组合、Restore 次数与 inner 指针是否回退。", "caption": "图 12　可交互：skip_mark_restore 关 / 开对照，陶橙格表示 inner 指针回退（示意 · 非实测）。", "bridge": "能跳过回退是一部分答案；另一部分答案藏在「NULL 也算有序」这个陷阱里。", "notes": "这一页把上一页的机制做成可以拨的开关。final_cost_mergejoin 给了一个明确的判定：当 join 是 SEMI 或 ANTI，或者 inner 已知唯一，并且所有 join restriction 都是 merge clauses 的时候，执行器找到第一个匹配就不需要回退 inner，这个决定写进 MergePath.skip_mark_restore，再传到计划节点。你先看默认那组，outer 两个 5、inner 三个 5：每一步 inner 指针往前走，遇到下一个相同的 outer 就往回跳一次，陶橙格标出回退。然后把 skip 打开，换成 SEMI 或者 inner 唯一的情形：每个 outer 只取首个匹配就推进，指针一路向前，Restore 次数归零，重放行数也归零。这里同样是设定示意值，用来对比重放次数，不是实测。能跳过回退，只解决了一半问题；另一半藏在一个更容易被忽略的地方 —— 排序把 NULL 放在一端，可 SQL 里 NULL 等于 NULL 根本不为真。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >可交互：重复 key 的重放，以及什么时候可以跳过<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >动画 B · skip_mark_restore 的判定；key 序列为设定示意值<\/text><rect x=\"1226\" y=\"14\" width=\"150\" height=\"22\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1301\" y=\"28.91\" font-size=\"11.5\" fill=\"#AE8A3E\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >示意 · 非实测<\/text><text x=\"24\" y=\"72\" font-size=\"13\" fill=\"#245A6B d=\"p12-tn8\">步 9<\/text><text x=\"882\" y=\"328\" font-size=\"15\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" id=\"p12-tv8\">—<\/text><text x=\"882\" y=\"348\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" id=\"p12-ti8\">ii = —<\/text><rect x=\"998\" y=\"278\" width=\"122\" height=\"78\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" id=\"p12-t9\"/><text x=\"1008\" y=\"300\" font-size=\"11\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" id=\"p12-tn9\">步 10<\/text><text x=\"1008\" y=\"328\" font-size=\"15\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" id=\"p12-tv9\">—<\/text><text x=\"1008\" y=\"348\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" id=\"p12-ti9\">ii = —<\/text><rect x=\"1124\" y=\"278\" width=\"122\" height=\"78\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" id=\"p12-t10\"/><text x=\"1134\" y=\"300\" font-size=\"11\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" id=\"p12-tn10\">步 11<\/text><text x=\"1134\" y=\"328\" font-size=\"15\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" id=\"p12-tv10\">—<\/text><text x=\"1134\" y=\"348\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" id=\"p12-ti10\">ii = —<\/text><rect x=\"1250\" y=\"278\" width=\"122\" height=\"78\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" id=\"p12-t11\"/><text x=\"1260\" y=\"300\" font-size=\"11\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" id=\"p12-tn11\">步 12<\/text><text x=\"1260\" y=\"328\" font-size=\"15\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" id=\"p12-tv11\">—<\/text><text x=\"1260\" y=\"348\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" id=\"p12-ti11\">ii = —<\/text><text x=\"24\" y=\"410\" font-size=\"13\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" id=\"p12-stage\">等待开始 · 点播放或单步<\/text><\/svg>", "ctrl": "<label>重复序列<\/label><select id=\"p12-seq\"><option value=\"0\">outer 2 个 5 / inner 3 个 5<\/option><option value=\"1\">outer 3 个 5 / inner 3 个 5<\/option><option value=\"2\">outer 2 个 5 / inner 1 个 5<\/option><\/select><label>skip<\/label><select id=\"p12-skip\"><option value=\"0\">关 · 需要 mark/restore<\/option><option value=\"1\">开 · SEMI / ANTI / inner 唯一<\/option><\/select><button class=\"btn play\" id=\"p12-play\">▶ 播放<\/button><button class=\"btn\" id=\"p12-step\">单步 →<\/button><button class=\"btn\" id=\"p12-reset\">重置<\/button><span class=\"out\" id=\"p12-out\"><\/span>"}, {"eyebrow": "语义 · NULL 边界", "title": "排序说相等，SQL 说不匹配", "lede": "MJCompare 对 NULL-vs-NULL 强制返回非零；MJEval*Values 把含 NULL key 的元组标为不可匹配，必要时提前结束。", "caption": "图 13　NULL-vs-NULL 的处理与提前结束条件；依据 MJCompare / MJEvalOuterValues / MJEvalInnerValues。", "bridge": "执行器这边都守住了，那规划器呢？它看到的从来不只是一个 Merge Join 节点。", "notes": "这一页是个特别好的例子，说明「有序流合并」不能脱离 SQL 语义。B-tree 排序会把 NULL 放在一端，所以 NULL 对 NULL 用排序比较看起来是相等的；可 SQL 的等值 join 里，NULL = NULL 不为真，mergejoin 操作符又是严格的，任一侧 key 是 NULL 就不可能匹配。MJCompare 的处理很直接：只要出现 NULL-vs-NULL，就算 result 还是 0，也强制改成 +1，让状态机继续推进 inner 侧，绝不报告「可连接的相等」。MJEvalOuterValues 和 MJEvalInnerValues 还会把这类元组标成 NONMATCHABLE；如果第一列 key 就是 NULL、排序规则是 NULLS LAST、而且这一侧不需要补空，执行器甚至可以判定后面全都匹配不上，提前结束这个方向。这说明一件重要的事：Merge Join 不是数组归并算法，它得把 B-tree 排序语义、NULL 位置、外连接补空、join qual 一起扛住。执行器这边守住了，规划器那边看到的，可从来不只是一个孤零零的 Merge Join 节点。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >排序比较说「相等」，SQL 等值 join 却说「不匹配」<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >语义 · NULL-vs-NULL 的特殊处理与提前结束；依据 MJCompare / MJEval*Values<\/text><text x=\"24\" y=\"72\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"2\" opacity=\"1\" >SQL 语义<\/text><rect x=\"24\" y=\"84\" width=\"440\" height=\"150\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"46\" y=\"128.44\" font-size=\"16\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >NULL = NULL 不为真。<\/text><text x=\"46\" y=\"152.44\" font-size=\"16\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >mergejoin 操作符是严格的，<\/text><text x=\"46\" y=\"176.44\" font-size=\"16\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >任一侧 key 为 NULL 时<\/text><text x=\"46\" y=\"200.44\" font-size=\"16\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >这个元组不可能匹配普通等值条件。<\/text><text x=\"24\" y=\"262\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"2\" opacity=\"1\" >排序语义<\/text><rect x=\"24\" y=\"274\" width=\"440\" height=\"116\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"46\" y=\"325.85\" font-size=\"15\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >但 B-tree 排序把 NULL 放在一端，<\/text><text x=\"46\" y=\"348.35\" font-size=\"15\" fill=\"#1B2B33\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >NULL-vs-NULL 用排序比较看起来是相等。<\/text><rect x=\"500\" y=\"84\" width=\"876\" height=\"96\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"500\" y=\"84\" width=\"6\" height=\"96\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"522\" y=\"116\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >① MJCompare：强制非零<\/text><text x=\"522\" y=\"142\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >若出现 NULL-vs-NULL，即使 result 为 0 也改成 +1，<\/text><text x=\"522\" y=\"166\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >让状态机推进 inner 侧，而不是报告「可连接的相等」。<\/text><rect x=\"500\" y=\"190\" width=\"876\" height=\"96\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"500\" y=\"190\" width=\"6\" height=\"96\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"522\" y=\"222\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >② MJEvalOuter / InnerValues<\/text><text x=\"522\" y=\"248\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >把含 NULL key 的元组标为 NONMATCHABLE；<\/text><text x=\"522\" y=\"272\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >第一列 key 为 NULL 且 NULLS LAST 时，非补空一侧可提前结束。<\/text><rect x=\"500\" y=\"296\" width=\"876\" height=\"96\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"500\" y=\"296\" width=\"6\" height=\"96\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"522\" y=\"328\" font-size=\"17\" fill=\"#2F7A66\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >③ 语义叠加<\/text><text x=\"522\" y=\"354\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >有序流合并必须同时处理 B-tree 排序语义、<\/text><text x=\"522\" y=\"378\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >NULL 排序位置、外连接补空与 join qual 语义。<\/text><text x=\"24\" y=\"414\" font-size=\"13.5\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >结论：Merge Join 不是脱离 SQL 语义的数组归并算法。<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "计划 · MergePath", "title": "一个路径，最多四个节点", "lede": "MergePath 不只代表 Merge Join 本身，还可能代表 outer Sort、inner Sort 与 inner Materialize。", "caption": "图 14　从 MergePath 字段到运行时四类节点；依据 pathnodes.h 注释与原文 3.5。", "bridge": "既然计划形状里已经含了排序和物化，成本模型自然得把这几笔一起算。", "notes": "pathnodes.h 里对 MergePath 的注释值得单独讲一页：一个 MergePath 最多可以代表四类运行时节点 —— Merge Join 本身、outer 输入上的 Sort、inner 输入上的 Sort、还有 inner 上的 Materialize。字段也对得上：path_mergeclauses 记录能用哪些条件同步，outersortkeys 和 innersortkeys 决定要不要插入排序，skip_mark_restore 和 materialize_inner 是两个实际决策。所以读 EXPLAIN 的时候，千万别把 Merge Join 当孤立节点看。一个看起来很便宜的 merge join，两侧可能都挂着大排序，启动成本高得吓人；反过来，一个看起来「多此一举」的 Materialize，往往是在保护 inner 免受昂贵的 mark/restore 重扫。规划器生成路径时还有两条线：sort_inner_and_outer 基于 cheapest-total 输入考虑显式排两侧，generate_mergejoin_paths 则在某个 outer path 已有有用 pathkeys 时去找 inner 的排序路径。多个 merge clause 时它会尝试几种 pathkey 顺序，但不会穷举全排列，因为规划时间受不了。计划形状里既然已经含了排序和物化，成本模型就得把这几笔一起算清楚。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >一个 MergePath，最多代表四个运行时节点<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >计划 · 读 EXPLAIN 时别把 Merge Join 当成孤立节点<\/text><rect x=\"24\" y=\"84\" width=\"520\" height=\"300\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"84\" width=\"520\" height=\"42\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"42\" y=\"112\" font-size=\"17\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >MergePath · 优化器候选<\/text><rect x=\"40\" y=\"140\" width=\"488\" height=\"38\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"54\" y=\"165\" font-size=\"14\" fill=\"#245A6B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >path_mergeclauses<\/text><rect x=\"40\" y=\"182\" width=\"488\" height=\"38\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"54\" y=\"207\" font-size=\"14\" fill=\"#245A6B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >outersortkeys / innersortkeys<\/text><rect x=\"40\" y=\"224\" width=\"488\" height=\"38\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"54\" y=\"249\" font-size=\"14\" fill=\"#245A6B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >outer_presorted_keys<\/text><rect x=\"40\" y=\"266\" width=\"488\" height=\"38\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"54\" y=\"291\" font-size=\"14\" fill=\"#245A6B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >skip_mark_restore<\/text><rect x=\"40\" y=\"308\" width=\"488\" height=\"38\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"54\" y=\"333\" font-size=\"14\" fill=\"#245A6B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >materialize_inner<\/text><text x=\"40\" y=\"372\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >排序成本、inner 物化、能否跳过 mark/restore，都在这里被计入。<\/text><path d=\"M 544 234 L 576 234\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"/><line x1=\"576\" y1=\"118\" x2=\"576\" y2=\"346\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><path d=\"M 576 118 L 600 118\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.5\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-prim)\"/><rect x=\"600\" y=\"84\" width=\"776\" height=\"66\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"600\" y=\"84\" width=\"6\" height=\"66\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"622\" y=\"114\" font-size=\"17\" fill=\"#1B2B33\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >Merge Join 节点<\/text><text x=\"622\" y=\"138\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >核心同步与输出<\/text><path d=\"M 576 194 L 600 194\" fill=\"none\" stroke=\"#AE8A3E\" stroke-width=\"1.5\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-gold)\"/><rect x=\"600\" y=\"160\" width=\"776\" height=\"66\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"600\" y=\"160\" width=\"6\" height=\"66\" rx=\"0\" fill=\"#AE8A3E\" opacity=\"1\" /><text x=\"622\" y=\"190\" font-size=\"17\" fill=\"#1B2B33\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >outer Sort<\/text><text x=\"622\" y=\"214\" font-size=\"13\" fill=\"#AE8A3E\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >outersortkeys 非 NIL 时插入<\/text><path d=\"M 576 270 L 600 270\" fill=\"none\" stroke=\"#AE8A3E\" stroke-width=\"1.5\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-gold)\"/><rect x=\"600\" y=\"236\" width=\"776\" height=\"66\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"600\" y=\"236\" width=\"6\" height=\"66\" rx=\"0\" fill=\"#AE8A3E\" opacity=\"1\" /><text x=\"622\" y=\"266\" font-size=\"17\" fill=\"#1B2B33\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >inner Sort<\/text><text x=\"622\" y=\"290\" font-size=\"13\" fill=\"#AE8A3E\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >innersortkeys 非 NIL 时插入<\/text><path d=\"M 576 346 L 600 346\" fill=\"none\" stroke=\"#BE653B\" stroke-width=\"1.5\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-acc)\"/><rect x=\"600\" y=\"312\" width=\"776\" height=\"66\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"600\" y=\"312\" width=\"6\" height=\"66\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"622\" y=\"342\" font-size=\"17\" fill=\"#1B2B33\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >inner Materialize<\/text><text x=\"622\" y=\"366\" font-size=\"13\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >支持 mark/restore 或降低重扫成本<\/text><text x=\"24\" y=\"414\" font-size=\"13.5\" fill=\"#BE653B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >看似便宜的 merge join 可能两侧都要大排序；多出的 Materialize 往往是在保护 inner。<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "成本 · 两阶段", "title": "先淘汰，再补全", "lede": "initial_cost_mergejoin 给快速下界；final_cost_mergejoin 决定 skip_mark_restore 与 materialize_inner，并估算 rescannedtuples。", "caption": "图 15　六个成本来源、两阶段分工与重复 key 估算公式；依据原文 3.6 与 costsize.c。", "bridge": "公式里的 (mᵢ − 1) 就是重复 key 的全部代价来源，下一页把它拨大看看。", "notes": "把成本摊开是六个来源：拿 outer 有序输入、拿 inner 有序输入、merge key 比较、重复 key 引起的 inner 重扫、额外 join 和 filter 条件、输出投影。估算分两步，跟 path 数量赛跑。initial_cost_mergejoin 先给一个快速下界，用 merge clause 的扫描选择率估计两侧有多少前缀可以跳过、真正参与 merge 的区间有多长；需要排序就调 cost_sort，outer 侧还能用 cost_incremental_sort。final_cost_mergejoin 才做两件实事：能不能 skip_mark_restore，要不要 materialize_inner。重复 key 的估算特别朴素，也特别贴切：设每个 key 在 outer 出现 mᵢ 次、inner 出现 nᵢ 次，join 输出约等于 Σ(mᵢ × nᵢ)，inner 被重复 outer key 重新发射的规模约等于 Σ((mᵢ − 1) × nᵢ)，也就是输出规模减掉 inner 匹配规模。PostgreSQL 用 mergejointuples 减 inner_path_rows 去近似 rescannedtuples，再算 rescanratio 放大 inner 的运行成本。源码自己都承认这个近似对某些无匹配 inner tuple 的情况不精确，但足够指导 Materialize 的选择。公式里那个 (mᵢ − 1)，就是重复 key 全部代价的来源，下一页我们把它拨大看看。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >成本不是「合并一下」：排序、比较、重扫、物化都要算<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >成本 · initial_cost_mergejoin 先淘汰，final_cost_mergejoin 做两个实际决策<\/text><text x=\"24\" y=\"72\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"2\" opacity=\"1\" >total_cost 的六个来源<\/text><rect x=\"24\" y=\"84\" width=\"620\" height=\"42\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"36\" y=\"92\" width=\"32\" height=\"26\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"52\" y=\"108.74\" font-size=\"11\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >1<\/text><text x=\"84\" y=\"112\" font-size=\"15\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >获取 outer 有序输入<\/text><rect x=\"24\" y=\"132\" width=\"620\" height=\"42\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"36\" y=\"140\" width=\"32\" height=\"26\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"52\" y=\"156.74\" font-size=\"11\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >2<\/text><text x=\"84\" y=\"160\" font-size=\"15\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >获取 inner 有序输入<\/text><rect x=\"24\" y=\"180\" width=\"620\" height=\"42\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"36\" y=\"188\" width=\"32\" height=\"26\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"52\" y=\"204.74\" font-size=\"11\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >3<\/text><text x=\"84\" y=\"208\" font-size=\"15\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >merge key 比较成本<\/text><rect x=\"24\" y=\"228\" width=\"620\" height=\"42\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"36\" y=\"236\" width=\"32\" height=\"26\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"52\" y=\"252.74\" font-size=\"11\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >4<\/text><text x=\"84\" y=\"256\" font-size=\"15\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >重复 key 导致的 inner 重扫<\/text><rect x=\"24\" y=\"276\" width=\"620\" height=\"42\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"36\" y=\"284\" width=\"32\" height=\"26\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"52\" y=\"300.74\" font-size=\"11\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >5<\/text><text x=\"84\" y=\"304\" font-size=\"15\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >额外 join / filter 条件<\/text><rect x=\"24\" y=\"324\" width=\"620\" height=\"42\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"36\" y=\"332\" width=\"32\" height=\"26\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"52\" y=\"348.74\" font-size=\"11\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >6<\/text><text x=\"84\" y=\"352\" font-size=\"15\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >输出投影成本<\/text><rect x=\"24\" y=\"376\" width=\"620\" height=\"30\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"36\" y=\"395.08\" font-size=\"12\" fill=\"#AE8A3E\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >示意公式 · 非 PostgreSQL 成本单位<\/text><text x=\"680\" y=\"72\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"2\" opacity=\"1\" >两阶段估算<\/text><rect x=\"680\" y=\"84\" width=\"696\" height=\"132\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\" opacity=\"1\" /><text x=\"700\" y=\"114\" font-size=\"16\" fill=\"#245A6B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >initial_cost_mergejoin()<\/text><text x=\"700\" y=\"144\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >快速下界：用 merge clause 的扫描选择率估计可跳过的前缀；<\/text><text x=\"700\" y=\"168\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >需要排序时调用 cost_sort()，outer 可用 cost_incremental_sort()。<\/text><text x=\"700\" y=\"198\" font-size=\"13\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >给 add_path_precheck 用，明显不行的路径不做完整估算。<\/text><path d=\"M 1028 216 L 1028 236\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\" marker-end=\"url(#arr-prim)\"/><rect x=\"680\" y=\"236\" width=\"696\" height=\"170\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"680\" y=\"236\" width=\"6\" height=\"170\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"700\" y=\"266\" font-size=\"16\" fill=\"#BE653B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >final_cost_mergejoin()<\/text><text x=\"700\" y=\"296\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >决策一：能否 skip_mark_restore<\/text><text x=\"700\" y=\"322\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >决策二：是否 materialize_inner<\/text><text x=\"700\" y=\"352\" font-size=\"13.5\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >Σ(mᵢ × nᵢ) = join 输出规模<\/text><text x=\"700\" y=\"378\" font-size=\"13.5\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >Σ((mᵢ − 1) × nᵢ) = 输出 − inner 匹配规模 ≈ rescannedtuples<\/text><text x=\"24\" y=\"414\" font-size=\"13.5\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >rescanratio 据此放大 inner run cost；源码也承认这个近似对某些无匹配情况不精确。<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "动画 C · 成本放大", "title": "从线性推到相乘", "lede": "可交互演示：调整 m、n 与 key 组数，观察 join 输出、inner 匹配规模与 rescannedtuples 如何分叉。", "caption": "图 16　可交互：Σ(mᵢ×nᵢ) 与 Σ((mᵢ−1)×nᵢ) 随 key 组累积；相对量示意，非实测、非 PostgreSQL 成本单位。", "bridge": "成本边界清楚了，就能把三种 join 并排放在一起，看各自的形状。", "notes": "这一页专门让你亲手把那条公式拨大。m 是每个 key 在 outer 里重复几次，n 是在 inner 里重复几次，key 组数是参与归并的不同 key 个数。点播放，一组一组往前推：绿色的 inner 匹配规模是线性长，深靛的 join 输出是 m 乘 n 地长，陶橙那条 rescannedtuples 是 (m 减 1) 乘 n 地长。m 等于 1 的时候，重放那条永远是零，这正是「inner 唯一或者 outer 无重复」时可以跳过 mark/restore 的直观原因；m 一变大，陶橙立刻追上来。把 Materialize 打开，第四根条会明显压下去 —— 这是示意系数，表示重放改由物化节点承担，不是 PostgreSQL 的成本单位，也不是实测数字。规划器那个 materialize_inner 决策，本质上就是在替你做这个判断。成本边界清楚了，我们就能把三种 join 并排放在一起，看各自的形状。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >可交互：重复 key 怎样把成本从「线性」推到「相乘」<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >动画 C · Σ(mᵢ×nᵢ) 与 rescannedtuples；相对量示意，非实测<\/text><rect x=\"1226\" y=\"14\" width=\"150\" height=\"22\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1301\" y=\"28.91\" font-size=\"11.5\" fill=\"#AE8A3E\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >示意 · 非实测<\/text><rect x=\"24\" y=\"84\" width=\"600\" height=\"264\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"84\" width=\"600\" height=\"38\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"42\" y=\"110\" font-size=\"16\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >重复 key 的规模推导<\/text><text x=\"44\" y=\"158\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >mᵢ = 每个 key 在 outer 中出现的次数<\/text><text x=\"44\" y=\"190\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >nᵢ = 每个 key 在 inner 中出现的次数<\/text><rect x=\"40\" y=\"212\" width=\"568\" height=\"1\" rx=\"0\" fill=\"#D9D5CB\" stroke=\"1\" stroke-width=\"1\" opacity=\"1\" /><text x=\"44\" y=\"246\" font-size=\"16\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >join 输出规模　≈　Σ(mᵢ × nᵢ)<\/text><text x=\"44\" y=\"282\" font-size=\"16\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >inner 重放规模　≈　Σ((mᵢ − 1) × nᵢ)<\/text><text x=\"44\" y=\"314\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >　　　　　　　= mergejointuples − inner_path_rows<\/text><text x=\"44\" y=\"338\" font-size=\"12.5\" fill=\"#89938F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >PostgreSQL 用后者近似 rescannedtuples，指导 Materialize 选择。<\/text><text x=\"660\" y=\"72\" font-size=\"12\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"2\" opacity=\"1\" >相对规模（随 key 组逐步累积）<\/text><text x=\"660\" y=\"116\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >join 输出 Σ(m·n)<\/text><rect x=\"900\" y=\"96\" width=\"400\" height=\"24\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"900\" y=\"96\" width=\"0\" height=\"24\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" id=\"p16-b0\"/><text x=\"1370\" y=\"114\" font-size=\"13\" fill=\"#245A6B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"end\" letter-spacing=\"0\" opacity=\"1\" id=\"p16-v0\">0<\/text><text x=\"660\" y=\"180\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >inner 匹配规模 Σn<\/text><rect x=\"900\" y=\"160\" width=\"400\" height=\"24\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"900\" y=\"160\" width=\"0\" height=\"24\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" id=\"p16-b1\"/><text x=\"1370\" y=\"178\" font-size=\"13\" fill=\"#2F7A66\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"end\" letter-spacing=\"0\" opacity=\"1\" id=\"p16-v1\">0<\/text><text x=\"660\" y=\"244\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >重放 rescannedtuples<\/text><rect x=\"900\" y=\"224\" width=\"400\" height=\"24\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"900\" y=\"224\" width=\"0\" height=\"24\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" id=\"p16-b2\"/><text x=\"1370\" y=\"242\" font-size=\"13\" fill=\"#BE653B\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"end\" letter-spacing=\"0\" opacity=\"1\" id=\"p16-v2\">0<\/text><text x=\"660\" y=\"308\" font-size=\"13\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >重复执行成本（示意系数）<\/text><rect x=\"900\" y=\"288\" width=\"400\" height=\"24\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"900\" y=\"288\" width=\"0\" height=\"24\" rx=\"0\" fill=\"#AE8A3E\" opacity=\"1\" id=\"p16-b3\"/><text x=\"1370\" y=\"306\" font-size=\"13\" fill=\"#AE8A3E\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"700\" text-anchor=\"end\" letter-spacing=\"0\" opacity=\"1\" id=\"p16-v3\">0<\/text><rect x=\"660\" y=\"356\" width=\"716\" height=\"40\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"676\" y=\"382\" font-size=\"14\" fill=\"#AE8A3E\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" id=\"p16-ratio\">rescanratio：—<\/text><text x=\"1000\" y=\"382\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" id=\"p16-mat\">Materialize：关<\/text><text x=\"24\" y=\"372\" font-size=\"12\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"2\" opacity=\"1\" >key 组推进<\/text><rect x=\"24\" y=\"384\" width=\"72\" height=\"26\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" id=\"p16-g0\"/><text x=\"60\" y=\"402\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" id=\"p16-gt0\">k1<\/text><rect x=\"104\" y=\"384\" width=\"72\" height=\"26\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" id=\"p16-g1\"/><text x=\"140\" y=\"402\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" id=\"p16-gt1\">k2<\/text><rect x=\"184\" y=\"384\" width=\"72\" height=\"26\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" id=\"p16-g2\"/><text x=\"220\" y=\"402\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" id=\"p16-gt2\">k3<\/text><rect x=\"264\" y=\"384\" width=\"72\" height=\"26\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" id=\"p16-g3\"/><text x=\"300\" y=\"402\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" id=\"p16-gt3\">k4<\/text><rect x=\"344\" y=\"384\" width=\"72\" height=\"26\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" id=\"p16-g4\"/><text x=\"380\" y=\"402\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" id=\"p16-gt4\">k5<\/text><rect x=\"424\" y=\"384\" width=\"72\" height=\"26\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" id=\"p16-g5\"/><text x=\"460\" y=\"402\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" id=\"p16-gt5\">k6<\/text><rect x=\"504\" y=\"384\" width=\"72\" height=\"26\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" id=\"p16-g6\"/><text x=\"540\" y=\"402\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" id=\"p16-gt6\">k7<\/text><rect x=\"584\" y=\"384\" width=\"72\" height=\"26\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" id=\"p16-g7\"/><text x=\"620\" y=\"402\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" id=\"p16-gt7\">k8<\/text><text x=\"700\" y=\"414\" font-size=\"13\" fill=\"#BE653B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" id=\"p16-stage\">等待开始 · 点播放或单步<\/text><\/svg>", "ctrl": "<label>m 每 key outer 重复<\/label><select id=\"p16-m\"><option value=\"1\">1<\/option><option value=\"2\" selected>2<\/option><option value=\"4\">4<\/option><option value=\"8\">8<\/option><\/select><label>n inner 重复<\/label><select id=\"p16-n\"><option value=\"1\">1<\/option><option value=\"2\">2<\/option><option value=\"4\" selected>4<\/option><option value=\"8\">8<\/option><\/select><label>key 组数<\/label><select id=\"p16-k\"><option value=\"4\">4<\/option><option value=\"6\">6<\/option><option value=\"8\" selected>8<\/option><\/select><label>Materialize<\/label><select id=\"p16-mat\"><option value=\"0\">关<\/option><option value=\"1\">开<\/option><\/select><button class=\"btn play\" id=\"p16-play\">▶ 播放<\/button><button class=\"btn\" id=\"p16-step\">单步 →<\/button><button class=\"btn\" id=\"p16-reset\">重置<\/button><span class=\"out\" id=\"p16-out\"><\/span>"}, {"eyebrow": "横向 · 数据流形态", "title": "没有一种方法天然更高级", "lede": "启动成本、总成本形状、输出顺序、重复 key 风险、索引价值，全从「谁先动」长出来。", "caption": "图 17　三种 join 在八个维度上的对照；依据原文第四节对比表重排。", "bridge": "形状定了，适合与不适合的边界也就定了；先把好处算清楚。", "notes": "把三种方法并排看，最有用的不是背那张九行表，是看数据流形态。Nested Loop 是 demand-driven，上层要一行就推一行，首行延迟低，还能被 LIMIT、semi、anti 提前掐断，可一旦 outer 变大，inner 成本就按倍数放大。Hash Join 是批处理，得先建 hash table 再探测，启动成本高但吞吐稳，通常不保序，内存压力落在 work_mem 和 hash_mem_multiplier 上。Merge Join 是有序流，越是有序输入越占便宜，输出还能继续交給上层；代价是排序启动成本、重复 key 重放，以及只有 mergejoinable 条件能参与同步。顺着形态往下推，索引价值、重复 key 风险、适合场景就都不用死记了。原文那句话说得很好：没有一种 join 方法天然更高级，只有 workload、索引、统计信息、内存和输出顺序是否匹配。形状定了，边界也就定了，我们先把好处算清楚。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >三种 Join 的差别，落在数据流形态上<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" 5F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >inner 匹配段反复重放<\/text><rect x=\"592\" y=\"284\" width=\"392\" height=\"37\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"602\" y=\"304.125\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >组合放大，但无需回退输入<\/text><rect x=\"984\" y=\"284\" width=\"392\" height=\"37\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"994\" y=\"304.125\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >inner 重扫被 outer 行数放大<\/text><rect x=\"24\" y=\"321\" width=\"176\" height=\"37\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"34\" y=\"341.125\" font-size=\"12.5\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >索引价值<\/text><rect x=\"200\" y=\"321\" width=\"392\" height=\"37\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"210\" y=\"341.125\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >B-tree 直接提供有序输入<\/text><rect x=\"592\" y=\"321\" width=\"392\" height=\"37\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"602\" y=\"341.125\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >索引通常不是核心<\/text><rect x=\"984\" y=\"321\" width=\"392\" height=\"37\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"994\" y=\"341.125\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >参数化索引扫描价值极高<\/text><rect x=\"24\" y=\"358\" width=\"176\" height=\"37\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"34\" y=\"378.125\" font-size=\"12.5\" fill=\"#245A6B\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >适合场景<\/text><rect x=\"200\" y=\"358\" width=\"392\" height=\"37\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"210\" y=\"378.125\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >报表 / 有序输出 / 两边已有索引<\/text><rect x=\"592\" y=\"358\" width=\"392\" height=\"37\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"602\" y=\"378.125\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >大表等值 join / 无有用顺序<\/text><rect x=\"984\" y=\"358\" width=\"392\" height=\"37\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"994\" y=\"378.125\" font-size=\"12.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >OLTP 点查 / 小 outer / EXISTS<\/text><text x=\"24\" y=\"414\" font-size=\"13.5\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >只有 workload、索引、统计信息、内存与输出顺序匹配时，才谈得上谁更合适。<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "效果 · 收益与代价", "title": "四类收益，五类代价", "lede": "稳定的大批量等值 join、B-tree 顺序、天然有序输出、不依赖 hash 容量；对应排序启动、work_mem、重扫、opfamily 限制与并行协调。", "caption": "图 18　四类收益与五类代价；论文背景仅作概念参照，未引用未核验数字。", "bridge": "这些说法不靠感觉 —— 用四组 EXPLAIN 实验自己看。", "notes": "收益归成四类：两侧有序之后主流程是顺序推进，对大批量等值 join 很稳；如果索引已经提供所需 pathkeys，Sort 可以整块省掉；输出天然有序，上层的 ORDER BY、GROUP BY、DISTINCT 或更高层 merge join 可能继续复用；还有一条容易被忽略，它不依赖 hash table 容量，build 侧特别大或者 hash 内存压力高的时候，sort-based 路径反而更可控。代价也是五条，一一对应：两侧都要 Sort 时首行延迟明显拉高；work_mem 要按每个操作、每个会话、每个并行 worker 去理解，别只算一条 SQL；重复 key 让 inner 段被 restore 后反复重放；merge 条件受 opfamily 限制；并行不是免费，full、right、right-anti 有额外限制，排序与有序合并本身也要协调。补一句诚实的边界：多核内存 sort-merge join 研究的是分区、NUMA 和并行合并，压缩执行融合关心的是比较、延迟解码和物化之间的代价边界，PostgreSQL 主执行器仍是 tuple slot 驱动的通用执行器，不能把列存向量化系统的数字直接套过来。这些说法不靠感觉，用四组 EXPLAIN 自己看。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >四类收益，五类代价，都从「有序」这一个前提长出来<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >效果 · 收益与代价；论文背景仅作概念参照，不引用未核验数字<\/text><rect x=\"24\" y=\"84\" width=\"660\" height=\"300\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"84\" width=\"660\" height=\"44\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"42\" y=\"113.2\" font-size=\"20\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >四类收益<\/text><rect x=\"42\" y=\"206.76\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"59\" y=\"214.04\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >大批量等值 join 稳定：两侧有序后主流程是顺序推进。<\/text><rect x=\"42\" y=\"233.76\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"59\" y=\"241.04\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >能利用 B-tree 顺序：索引已提供 pathkeys 时可省掉 Sort。<\/text><rect x=\"42\" y=\"260.76\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"59\" y=\"268.04\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >输出天然有序：ORDER BY / GROUP BY / DISTINCT 或上层 merge join 可复用。<\/text><rect x=\"42\" y=\"287.76\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#2F7A66\" opacity=\"1\" /><text x=\"59\" y=\"295.04\" font-size=\"14\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >不依赖 hash table 容量：build 侧很大或内存压力高时更可控。<\/text><rect x=\"700\" y=\"84\" width=\"676\" height=\"300\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"700\" y=\"84\" width=\"676\" height=\"44\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"718\" y=\"113.2\" font-size=\"20\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >五类代价<\/text><rect x=\"718\" y=\"193.09\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"735\" y=\"200.11\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >排序启动成本：两侧都要 Sort 时首行延迟明显更高。<\/text><rect x=\"718\" y=\"220.09\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"735\" y=\"227.11\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >work_mem 影响排序与物化：按每个操作、每个会话理解。<\/text><rect x=\"718\" y=\"247.09\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"735\" y=\"254.11\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >重复 key 导致重扫：outer 重复越多，inner 段重放越多。<\/text><rect x=\"718\" y=\"274.09\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"735\" y=\"281.11\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >merge 条件受 opfamily 限制：其余条件只能作为额外过滤。<\/text><rect x=\"718\" y=\"301.09\" width=\"5\" height=\"5\" rx=\"0\" fill=\"#BE653B\" opacity=\"1\" /><text x=\"735\" y=\"308.11\" font-size=\"13.5\" fill=\"#46585F\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >并行不是免费：full / right 有额外限制，排序与合并仍需协调。<\/text><text x=\"24\" y=\"414\" font-size=\"13.5\" fill=\"#AE8A3E\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >多核 sort-merge 关注分区与并行合并；压缩执行融合改变比较 / 解码 / 物化边界，不可套用列存数字。<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "验证 · 四组 DEMO", "title": "让 EXPLAIN 自己说出答案", "lede": "两侧索引顺序看无 Sort；去掉一个索引看显式 Sort；重复 key 看 Materialize 与 loops；开关只用来对比计划。", "caption": "图 19　四组可执行 SQL 骨架与观察点；原文未运行实例，不提供伪造输出。", "bridge": "跑出来之后，怎么读才不会看漏关键信号？", "notes": "原文给了一套能直接复制的最小实验，我按验证顺序拆成四组。第一组造两张各二十万行的表，给 payments.order_id 建索引，ANALYZE，关掉 hashjoin 和 nestloop 逼出 Merge Join，跑带 ORDER BY o.id 和 LIMIT 的 EXPLAIN (ANALYZE, BUFFERS)：看 Merge Cond 是不是 join key，两侧是不是按 key 顺序的 index scan，上层排序有没有被省掉。第二组把 payments 的索引 DROP 掉再跑一次：如果还选 Merge Join，这一侧通常要出现 Sort，重点看 Sort Key、Sort Method 是内存 quicksort 还是 external merge，以及调 work_mem 之后能不能从磁盘回内存。第三组故意用 g 模 1000 造出大量重复 key，看 join 输出行数是不是远大于输入、inner 侧有没有 Materialize、loops 和行数有没有体现重复发射。第四组是 enable_mergejoin = off，只用来回答「不用 Merge Join 优化器会选什么」。这里必须说清楚：原文作者没有启动实例执行这些 SQL，所以全文没有实测输出，我也不编数字。跑出来之后，怎么读才不会看漏关键信号？", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >四组可复制实验：让 EXPLAIN 自己说出答案<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >实操 · 原文 SQL 骨架；作者未运行实例，不提供伪造输出<\/text><rect x=\"1226\" y=\"14\" width=\"150\" height=\"22\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"1301\" y=\"28.91\" font-size=\"11.5\" fill=\"#AE8A3E\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"middle\" letter-spacing=\"0\" opacity=\"1\" >原文 SQL · 非实测<\/text><rect x=\"24\" y=\"84\" width=\"660\" height=\"150\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"84\" width=\"660\" height=\"30\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"38\" y=\"105\" font-size=\"13\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >6.1 两侧索引顺序 · 无显式 Sort<\/text><text x=\"38\" y=\"136\" font-size=\"11.5\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >CREATE INDEX demo_payment_order_id_idx ...;<\/text><text x=\"38\" y=\"155\" font-size=\"11.5\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >SET enable_hashjoin = off; SET enable_nestloop = off;<\/text><text x=\"38\" y=\"174\" font-size=\"11.5\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >EXPLAIN (ANALYZE, BUFFERS) SELECT ... ORDER BY o.id;<\/text><rect x=\"24\" y=\"202\" width=\"660\" height=\"32\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"38\" y=\"223\" font-size=\"11.5\" fill=\"#AE8A3E\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >观察：Merge Cond、两侧 index scan、ORDER BY 是否省排序<\/text><rect x=\"700\" y=\"84\" width=\"676\" height=\"150\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"700\" y=\"84\" width=\"676\" height=\"30\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"714\" y=\"105\" font-size=\"13\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >6.2 去掉一个索引 · 观察显式 Sort<\/text><text x=\"714\" y=\"136\" font-size=\"11.5\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >DROP INDEX demo_payment_order_id_idx;<\/text><text x=\"714\" y=\"155\" font-size=\"11.5\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >SET enable_hashjoin = off; SET enable_nestloop = off;<\/text><text x=\"714\" y=\"174\" font-size=\"11.5\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >EXPLAIN (ANALYZE, BUFFERS) SELECT ... JOIN ...;<\/text><rect x=\"700\" y=\"202\" width=\"676\" height=\"32\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"714\" y=\"223\" font-size=\"11.5\" fill=\"#AE8A3E\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >观察：Sort Key、Sort Method、work_mem 改变后是否回内存<\/text><rect x=\"24\" y=\"246\" width=\"660\" height=\"150\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"24\" y=\"246\" width=\"660\" height=\"30\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"38\" y=\"267\" font-size=\"13\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >6.3 重复 key · 观察 Materialize 与重放<\/text><text x=\"38\" y=\"298\" font-size=\"11.5\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >INSERT ... SELECT (g % 1000) FROM generate_series(1, 200000);<\/text><text x=\"38\" y=\"317\" font-size=\"11.5\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >CREATE INDEX ... ON demo_left_dup(k); ...<\/text><text x=\"38\" y=\"336\" font-size=\"11.5\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >EXPLAIN (ANALYZE, BUFFERS) SELECT count(*) FROM l JOIN r ...;<\/text><rect x=\"24\" y=\"364\" width=\"660\" height=\"32\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"38\" y=\"385\" font-size=\"11.5\" fill=\"#AE8A3E\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >观察：输出行数远大于输入、inner 侧 Materialize 与 loops<\/text><rect x=\"700\" y=\"246\" width=\"676\" height=\"150\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><rect x=\"700\" y=\"246\" width=\"676\" height=\"30\" rx=\"0\" fill=\"#245A6B\" opacity=\"1\" /><text x=\"714\" y=\"267\" font-size=\"13\" fill=\"#FFFFFF\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >6.4 用开关做诊断 · 不要当长期修复<\/text><text x=\"714\" y=\"298\" font-size=\"11.5\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >SET enable_mergejoin = off;<\/text><text x=\"714\" y=\"317\" font-size=\"11.5\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >EXPLAIN (ANALYZE, BUFFERS) SELECT ...;<\/text><text x=\"714\" y=\"336\" font-size=\"11.5\" fill=\"#46585F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >RESET enable_mergejoin;<\/text><rect x=\"700\" y=\"364\" width=\"676\" height=\"32\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" opacity=\"1\" /><text x=\"714\" y=\"385\" font-size=\"11.5\" fill=\"#AE8A3E\" font-family=\"PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif\" font-weight=\"600\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >观察：不用 Merge Join 时优化器会选什么；长期修复回到索引与统计<\/text><\/svg>", "ctrl": ""}, {"eyebrow": "诊断 · EXPLAIN", "title": "看上下游的五个位置", "lede": "两个大 Sort？inner 有没有 Materialize？Sort Method 是否 external merge Disk？loops 与行数？估算与实际是否偏离？", "caption": "图 20　计划树结构示意（数值用占位符）与五项诊断读数；不编造实际测量数字。", "bridge": "会诊断之后，落到日常，不同角色该做的动作并不一样。", "notes": "读 Merge Join 的计划，别盯着节点名字，看五个位置。第一，两侧是不是各挂着一个大 Sort —— 两个大排序加外部落盘，往往比 join 本身贵得多。第二，inner 侧有没有 Materialize；它可能是为了支持 mark/restore 的正确性，也可能是为了降低重复发射成本，不是「多余节点」的同义词。第三，Sort Method 有没有出现 external merge Disk，那说明排序已经写临时文件，得回头看索引、SQL、work_mem 或者输入规模。第四，inner 子节点的 loops 和行数，重复 outer key 时 inner 行可能被重复发射并计入统计。第五，估算 rows 和实际 rows 是不是严重偏离，重复 key、倾斜分布、过时统计都会影响 mergejointuples 和 rescannedtuples。还有两个文档级别的提醒：Merge Join 在某些情况下会提前停止读取一个输入，所以 child rows 不等于全表；LIMIT 让执行没读完，也不是估算错误。最后再强调一次，enable_mergejoin = off 是诊断工具，不是长期配置修复。会诊断之后，落到日常，不同角色该做的动作并不一样。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"24\" y=\"24\" font-size=\"17\" fill=\"#245A6B\" font-family=\"Songti SC, STSong, Noto Serif CJK SC, Georgia, serif\" font-weight=\"700\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >别只看「Merge Join」四个字，看它上下游的五个位置<\/text><text x=\"24\" y=\"44\" font-size=\"11.5\" fill=\"#89938F\" font-family=\"SF Mono, Menlo, Consolas, monospace\" font-weight=\"400\" text-anchor=\"start\" letter-spacing=\"0\" opacity=\"1\" >诊断 · 计划树为结构
