=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\"/><text x=\"1140\" y=\"203.56\" text-anchor=\"middle\" font-size=\"16\" fill=\"#2F7A66\" font-weight=\"700\" class=\"\">sort_bounded_heap()</text><text x=\"1140\" y=\"223.27\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">把堆变成有序数组</text><text x=\"1140\" y=\"240.81\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" class=\"\">EXPLAIN: top-N heapsort</text><path d=\"M555 219 L585 219\" fill=\"none\" stroke=\"#89938F\" stroke-width=\"1.4\" stroke-linejoin=\"miter\"/><polygon points=\"577,215 585,219 577,223\" fill=\"#89938F\"/><path d=\"M935 219 L965 219\" fill=\"none\" stroke=\"#89938F\" stroke-width=\"1.4\" stroke-linejoin=\"miter\"/><polygon points=\"957,215 965,219 957,223\" fill=\"#89938F\"/><rect x=\"40\" y=\"296\" width=\"150\" height=\"118\" rx=\"0\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1\"/><text x=\"115\" y=\"348.88\" text-anchor=\"middle\" font-size=\"17\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"serif\">外部排序</text><text x=\"115\" y=\"368.31\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#CFE0DC\" font-weight=\"400\" class=\"\">第 3 条路</text><rect x=\"205\" y=\"296\" width=\"350\" height=\"118\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\"/><text x=\"380\" y=\"339.56\" text-anchor=\"middle\" font-size=\"16\" fill=\"#245A6B\" font-weight=\"700\" class=\"mono\">TSS_INITIAL</text><text x=\"380\" y=\"359.27\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">LACKMEM → inittapes()</text><text x=\"380\" y=\"376.81\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" class=\"\">开始写 logical tape</text><rect x=\"585\" y=\"296\" width=\"350\" height=\"118\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.8\"/><text x=\"760\" y=\"339.56\" text-anchor=\"middle\" font-size=\"16\" fill=\"#BE653B\" font-weight=\"700\" class=\"mono\">TSS_BUILDRUNS</text><text x=\"760\" y=\"359.27\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">dumptuples()</text><text x=\"760\" y=\"376.81\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" class=\"\">每批先 quicksort 再写成 run</text><rect x=\"965\" y=\"296\" width=\"350\" height=\"118\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\"/><text x=\"1140\" y=\"339.56\" text-anchor=\"middle\" font-size=\"16\" fill=\"#245A6B\" font-weight=\"700\" class=\"\">TSS_FINALMERGE</text><text x=\"1140\" y=\"359.27\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">balanced k-way merge</text><text x=\"1140\" y=\"376.81\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" class=\"\">或冻结为 TSS_SORTEDONTAPE</text><path d=\"M555 355 L585 355\" fill=\"none\" stroke=\"#89938F\" stroke-width=\"1.4\" stroke-linejoin=\"miter\"/><polygon points=\"577,351 585,355 577,359\" fill=\"#89938F\"/><path d=\"M935 355 L965 355\" fill=\"none\" stroke=\"#89938F\" stroke-width=\"1.4\" stroke-linejoin=\"miter\"/><polygon points=\"957,351 965,355 957,359\" fill=\"#89938F\"/></svg>","ctrl":"","anim":false},{"eyebrow":"12 · 判定｜内存批次的三个分支","title":"不是复杂度最低者胜出，是综合代价最低者胜出","lede":"tuplesort_sort_memtuples() 先看 key 表示和批次规模，再决定 radix sort、qsort_ssup 还是 qsort_tuple。","caption":"图 12　源码简化后的判定阶梯；QSORT_THRESHOLD = 40 是「低于它 qsort_tuple 通常比 radix 更快」的经验阈值。","bridge":"判定条件里反复出现「比较器是不是整数类」，这就把话题带到 SortSupport：比较器本身才是大头。","notes":"我们把 tuplesort_sort_memtuples 的源码逻辑压成一张判定阶梯。第一问：haveDatum1 有没有值、sortKeys 存在、并且首 key 的 comparator 是 ssup_datum_uint64_cmp、int64、uint32、int32 这一族整数比较函数？如果成立，而且 memtupcount 不小于 QSORT_THRESHOLD，也就是 40，就走 radix_sort_tuple。第二问：base.onlyKey 是不是非空？也就是单 key 的 MinimalTuple 或 Datum 排序，成立就走 qsort_ssup。其余情况一律 qsort_tuple。这个 40 不是什么魔法数字，源码注释写的是「低于这个阈值，qsort_tuple 通常比 radix sort 更快」。请注意这句话的分量：radix sort 在复杂度上很吸引人，但批次小的时候，准备分区和计数的固定开销划不来；反过来，key 能按整数比较、批次够大时，按字节表示分桶又能把大量昂贵比较直接绕开。所以数据库排序的选择标准，从来不是「谁的理论复杂度最低」，而是数据表示、比较成本、常数、缓存行为和分支预测的综合结果。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40\" y=\"20\" width=\"800\" height=\"64\" rx=\"0\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1\"/><text x=\"440\" y=\"54.52\" text-anchor=\"middle\" font-size=\"18\" fill=\"#FFFFFF\" font-weight=\"600\" class=\"serif\">tuplesort_sort_memtuples()：这一批内存元素怎么排？</text><rect x=\"40\" y=\"120\" width=\"800\" height=\"68\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"440\" y=\"147.4\" text-anchor=\"middle\" font-size=\"16\" fill=\"#1B2B33\" font-weight=\"600\" class=\"\">① haveDatum1 &amp;&amp; 整数类 comparator &amp;&amp; n ≥ 40</text><text x=\"440\" y=\"166.7\" text-anchor=\"middle\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">首 key 可按整数比较，且批次不小于 QSORT_THRESHOLD</text><rect x=\"900\" y=\"120\" width=\"460\" height=\"68\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\"/><text x=\"1130\" y=\"147.54\" text-anchor=\"middle\" font-size=\"17\" fill=\"#2F7A66\" font-weight=\"700\" class=\"mono\">radix_sort_tuple()</text><text x=\"1130\" y=\"167.38\" text-anchor=\"middle\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">按 key 的字节 / 整数表示分桶</text><path d=\"M840 154 L900 154\" fill=\"none\" stroke=\"#2F7A66\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"/><polygon points=\"892,150 900,154 892,158\" fill=\"#2F7A66\"/><rect x=\"40\" y=\"220\" width=\"800\" height=\"68\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"440\" y=\"247.4\" text-anchor=\"middle\" font-size=\"16\" fill=\"#1B2B33\" font-weight=\"600\" class=\"\">② onlyKey != NULL（单 key MinimalTuple / Datum）</text><text x=\"440\" y=\"266.7\" text-anchor=\"middle\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">可以使用编译期固定的 SortSupport 比较表达式</text><rect x=\"900\" y=\"220\" width=\"460\" height=\"68\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\"/><text x=\"1130\" y=\"247.54\" text-anchor=\"middle\" font-size=\"17\" fill=\"#245A6B\" font-weight=\"700\" class=\"mono\">qsort_ssup()</text><text x=\"1130\" y=\"267.38\" text-anchor=\"middle\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">ApplySortComparator 快路径</text><path d=\"M840 254 L900 254\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"/><polygon points=\"892,250 900,254 892,258\" fill=\"#245A6B\"/><rect x=\"40\" y=\"320\" width=\"800\" height=\"68\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#89938F\" stroke-width=\"1\"/><text x=\"440\" y=\"347.4\" text-anchor=\"middle\" font-size=\"16\" fill=\"#1B2B33\" font-weight=\"600\" class=\"\">③ 其余情况：通用 SortTuple</text><text x=\"440\" y=\"366.7\" text-anchor=\"middle\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">多列、collation、NULLS、tie-break 都要照顾</text><rect x=\"900\" y=\"320\" width=\"460\" height=\"68\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\"/><text x=\"1130\" y=\"347.54\" text-anchor=\"middle\" font-size=\"17\" fill=\"#245A6B\" font-weight=\"700\" class=\"mono\">qsort_tuple()</text><text x=\"1130\" y=\"367.38\" text-anchor=\"middle\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">comparetup 通用比较</text><path d=\"M840 354 L900 354\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"/><polygon points=\"892,350 900,354 892,358\" fill=\"#245A6B\"/><path d=\"M440 84 L440 100 L25 100 L25 354\" fill=\"none\" stroke=\"#89938F\" stroke-width=\"1.4\" stroke-linejoin=\"miter\"/><path d=\"M25 154 L40 154\" fill=\"none\" stroke=\"#89938F\" stroke-width=\"1.2\" stroke-linejoin=\"miter\"/><polygon points=\"32,150 40,154 32,158\" fill=\"#89938F\"/><path d=\"M25 254 L40 254\" fill=\"none\" stroke=\"#89938F\" stroke-width=\"1.2\" stroke-linejoin=\"miter\"/><polygon points=\"32,250 40,254 32,258\" fill=\"#89938F\"/><path d=\"M25 354 L40 354\" fill=\"none\" stroke=\"#89938F\" stroke-width=\"1.2\" stroke-linejoin=\"miter\"/><polygon points=\"32,350 40,354 32,358\" fill=\"#89938F\"/></svg>","ctrl":"","anim":false},{"eyebrow":"13 · 比较成本｜SortSupport 与 abbreviated key","title":"排序慢，很多时候不是数据多，是比较太贵","lede":"SortSupport 让 opclass 提供更便宜的 comparator 和 abbreviated key；采样发现区分度不够，还能主动中止这个优化。","caption":"图 13　上排是传统 btree 比较函数路径，下排是 abbreviated key 路径；底部金带是 abbrev abort 的保护机制。","bridge":"把单批排快之后，还有一个更现实的问题：这一批根本装不下全部输入。","notes":"为什么我要专门拿一页讲 SortSupport？因为很多人一看到排序慢，第一反应是「数据太多了」，但真正的主成本常常是单次比较。传统路径是反复调用 SQL 可见的 btree 比较函数，遇到 varlena 文本、复杂 collation、多列 tuple 解包，一次比较就可能做很多工作。SortSupport 给 opclass 开了一扇后门：除了低开销 comparator，还可以提供 abbreviated key converter，把原始 key 压成一个便宜的、通常能 pass-by-value 的代理值放进 datum1；绝大多数比较只需要比这个代理值，只有当代理值相等、区分不出来时，才回退到完整比较。对文本、numeric、uuid、network、bytea 这些类型，这个转换可能把一长串昂贵比较变成整数比较。但它不是白送的：转换本身要付费，而且如果数据前缀高度相似，代理值区分度太低，就会频繁回退，等于白转换一遍。所以框架里还有 abbrev abort 和 costing：采样发现区分度不够，就主动停掉这个优化。这一页的落点只有一个：调优时先分清「比较次数」和「单次比较成本」，两者不在一个层面上。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40\" y=\"40\" width=\"400\" height=\"140\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"240\" y=\"94.16\" text-anchor=\"middle\" font-size=\"18\" fill=\"#BE653B\" font-weight=\"700\" class=\"serif\">传统路径</text><text x=\"240\" y=\"115.36\" text-anchor=\"middle\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" class=\"\">SQL 可见的 btree 比较函数</text><text x=\"240\" y=\"133.58\" text-anchor=\"middle\" font-size=\"13\" fill=\"#89938F\" font-weight=\"400\" class=\"\">每次比较都走 opclass</text><rect x=\"470\" y=\"40\" width=\"400\" height=\"140\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"670\" y=\"94.16\" text-anchor=\"middle\" font-size=\"18\" fill=\"#BE653B\" font-weight=\"700\" class=\"serif\">解包与语义</text><text x=\"670\" y=\"115.36\" text-anchor=\"middle\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" class=\"\">varlena / 多列 / collation</text><text x=\"670\" y=\"133.58\" text-anchor=\"middle\" font-size=\"13\" fill=\"#89938F\" font-weight=\"400\" class=\"\">比较器常常比算法更贵</text><rect x=\"900\" y=\"40\" width=\"460\" height=\"140\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1130\" y=\"94.16\" text-anchor=\"middle\" font-size=\"18\" fill=\"#BE653B\" font-weight=\"700\" class=\"serif\">结果</text><text x=\"1130\" y=\"115.36\" text-anchor=\"middle\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" class=\"\">比较次数 × 单次比较成本</text><text x=\"1130\" y=\"133.58\" text-anchor=\"middle\" font-size=\"13\" fill=\"#89938F\" font-weight=\"400\" class=\"\">长文本排序的主要开销</text><path d=\"M440 110 L470 110\" fill=\"none\" stroke=\"#89938F\" stroke-width=\"1.5\" stroke-linejoin=\"miter\"/><polygon points=\"462,106 470,110 462,114\" fill=\"#89938F\"/><path d=\"M870 110 L900 110\" fill=\"none\" stroke=\"#89938F\" stroke-width=\"1.5\" stroke-linejoin=\"miter\"/><polygon points=\"892,106 900,110 892,114\" fill=\"#89938F\"/><rect x=\"40\" y=\"220\" width=\"400\" height=\"140\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"240\" y=\"274.16\" text-anchor=\"middle\" font-size=\"18\" fill=\"#2F7A66\" font-weight=\"700\" class=\"serif\">SortSupport 路径</text><text x=\"240\" y=\"295.36\" text-anchor=\"middle\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" class=\"\">abbreviated key converter</text><text x=\"240\" y=\"313.58\" text-anchor=\"middle\" font-size=\"13\" fill=\"#89938F\" font-weight=\"400\" class=\"\">把 key 压成便宜代理值</text><rect x=\"470\" y=\"220\" width=\"400\" height=\"140\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"670\" y=\"274.16\" text-anchor=\"middle\" font-size=\"18\" fill=\"#2F7A66\" font-weight=\"700\" class=\"serif\">datum1 代理比较</text><text x=\"670\" y=\"295.36\" text-anchor=\"middle\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" class=\"\">pass-by-value 整数比较</text><text x=\"670\" y=\"313.58\" text-anchor=\"middle\" font-size=\"13\" fill=\"#89938F\" font-weight=\"400\" class=\"\">必要时再回退完整比较</text><rect x=\"900\" y=\"220\" width=\"460\" height=\"140\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1130\" y=\"274.16\" text-anchor=\"middle\" font-size=\"18\" fill=\"#2F7A66\" font-weight=\"700\" class=\"serif\">结果</text><text x=\"1130\" y=\"295.36\" text-anchor=\"middle\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" class=\"\">昂贵比较被大量替换</text><text x=\"1130\" y=\"313.58\" text-anchor=\"middle\" font-size=\"13\" fill=\"#89938F\" font-weight=\"400\" class=\"\">文本 / numeric / uuid 等受益</text><path d=\"M440 290 L470 290\" fill=\"none\" stroke=\"#89938F\" stroke-width=\"1.5\" stroke-linejoin=\"miter\"/><polygon points=\"462,286 470,290 462,294\" fill=\"#89938F\"/><path d=\"M870 290 L900 290\" fill=\"none\" stroke=\"#89938F\" stroke-width=\"1.5\" stroke-linejoin=\"miter\"/><polygon points=\"892,286 900,290 892,294\" fill=\"#89938F\"/><rect x=\"40\" y=\"376\" width=\"1320\" height=\"48\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1\"/><text x=\"700\" y=\"401.96\" text-anchor=\"middle\" font-size=\"14\" fill=\"#AE8A3E\" font-weight=\"500\" class=\"\">abbrev abort / costing：采样发现代理 key 区分度太低时，主动中止优化，避免白付转换成本</text></svg>","ctrl":"","anim":false},{"eyebrow":"14 · 外部排序｜run 与 balanced k-way merge","title":"超内存时，quicksort 退到每个 run 里","lede":"memtuples[] 每满一批就排好写成一个 sorted run；最后用 balanced k-way merge 把 run 合成一条有序输出流。","caption":"图 14　外部排序流水线：quicksort 只负责每个内存批次，归并阶段主导因素换成 tape、预读 buffer 和堆。","bridge":"还有一种情况连「完整有序」都不需要：只要前 100 条。这时候连全排都省了。","notes":"当 memtuples[] 装不下全部输入，tuplesort 会进 TSS_BUILDRUNS：初始化 logical tape，每批满了调用 dumptuples，dumptuples 里面调用 tuplesort_sort_memtuples，也就是我们前面讲的 quicksort 或者 radix sort，把这一批排好，写成一个 sorted run；输入结束后剩下的批次也写成 run；最后用 balanced k-way merge 合并。这里有个容易被忽略的事实，tuplesort.c 顶部注释专门讲了：15 以前用的是 Knuth 的 polyphase merge，现在改成 straightforward balanced merge。理由是 Knuth 假设磁带机很贵、run 数远多于磁带数；而在 PostgreSQL 里一条 tape 不过是几 KB 的 buffer，可以用很多 tape，甚至让 tape 数跟 run 数一样多，把重复 I/O 整个消掉。归并阶段不是再对全部数据做一次 quicksort，而是在堆里维护每条输入 tape 当前最小的那个 tuple：输出一个，就从同一条 tape 读下一个补进堆顶，堆空这轮归并就结束。于是内存只需要保存每条 tape 的前端候选和预读 buffer。所以外部排序慢，先别怪 quicksort——它只干了每个 run 那一段活。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40\" y=\"30\" width=\"210\" height=\"100\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"145\" y=\"73.4\" text-anchor=\"middle\" font-size=\"16\" fill=\"#1B2B33\" font-weight=\"700\" class=\"serif\">ExecSort 输入</text><text x=\"145\" y=\"92.7\" text-anchor=\"middle\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">持续喂 tuple</text><rect x=\"270\" y=\"30\" width=\"230\" height=\"100\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\"/><text x=\"385\" y=\"73.4\" text-anchor=\"middle\" font-size=\"16\" fill=\"#1B2B33\" font-weight=\"700\" class=\"serif\">memtuples[]</text><text x=\"385\" y=\"92.7\" text-anchor=\"middle\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">受 work_mem 约束</text><rect x=\"520\" y=\"30\" width=\"290\" height=\"100\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\"/><text x=\"665\" y=\"73.4\" text-anchor=\"middle\" font-size=\"16\" fill=\"#1B2B33\" font-weight=\"700\" class=\"serif\">sort_memtuples()</text><text x=\"665\" y=\"92.7\" text-anchor=\"middle\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">quicksort / radix</text><rect x=\"830\" y=\"30\" width=\"230\" height=\"100\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\"/><text x=\"945\" y=\"73.4\" text-anchor=\"middle\" font-size=\"16\" fill=\"#1B2B33\" font-weight=\"700\" class=\"serif\">sorted run</text><text x=\"945\" y=\"92.7\" text-anchor=\"middle\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">写到 logical tape</text><rect x=\"1080\" y=\"30\" width=\"280\" height=\"100\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1220\" y=\"73.4\" text-anchor=\"middle\" font-size=\"16\" fill=\"#1B2B33\" font-weight=\"700\" class=\"serif\">输入结束</text><text x=\"1220\" y=\"92.7\" text-anchor=\"middle\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">剩余批次也写成 run</text><path d=\"M250 80 L270 80\" fill=\"none\" stroke=\"#89938F\" stroke-width=\"1.4\" stroke-linejoin=\"miter\"/><polygon points=\"262,76 270,80 262,84\" fill=\"#89938F\"/><path d=\"M500 80 L520 80\" fill=\"none\" stroke=\"#89938F\" stroke-width=\"1.4\" stroke-linejoin=\"miter\"/><polygon points=\"512,76 520,80 512,84\" fill=\"#89938F\"/><path d=\"M810 80 L830 80\" fill=\"none\" stroke=\"#89938F\" stroke-width=\"1.4\" stroke-linejoin=\"miter\"/><polygon points=\"822,76 830,80 822,84\" fill=\"#89938F\"/><path d=\"M1060 80 L1080 80\" fill=\"none\" stroke=\"#89938F\" stroke-width=\"1.4\" stroke-linejoin=\"miter\"/><polygon points=\"1072,76 1080,80 1072,84\" fill=\"#89938F\"/><rect x=\"120\" y=\"180\" width=\"230\" height=\"64\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\"/><text x=\"235\" y=\"214.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#1B2B33\" font-weight=\"500\" class=\"\">run 1（已排序）</text><rect x=\"390\" y=\"180\" width=\"230\" height=\"64\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\"/><text x=\"505\" y=\"214.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#1B2B33\" font-weight=\"500\" class=\"\">run 2（已排序）</text><rect x=\"660\" y=\"180\" width=\"230\" height=\"64\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\"/><text x=\"775\" y=\"214.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#1B2B33\" font-weight=\"500\" class=\"\">run 3（已排序）</text><rect x=\"930\" y=\"180\" width=\"230\" height=\"64\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\"/><text x=\"1045\" y=\"214.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#1B2B33\" font-weight=\"500\" class=\"\">run M（已排序）</text><path d=\"M940 130 L940 160 L235 160 L1045 160\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.5\" stroke-linejoin=\"miter\"/><path d=\"M235 160 L235 180\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.3\" stroke-linejoin=\"miter\"/><polygon points=\"231,172 235,180 239,172\" fill=\"#245A6B\"/><path d=\"M505 160 L505 180\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.3\" stroke-linejoin=\"miter\"/><polygon points=\"501,172 505,180 509,172\" fill=\"#245A6B\"/><path d=\"M775 160 L775 180\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.3\" stroke-linejoin=\"miter\"/><polygon points=\"771,172 775,180 779,172\" fill=\"#245A6B\"/><path d=\"M1045 160 L1045 180\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.3\" stroke-linejoin=\"miter\"/><polygon points=\"1041,172 1045,180 1049,172\" fill=\"#245A6B\"/><rect x=\"380\" y=\"290\" width=\"640\" height=\"96\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\"/><text x=\"700\" y=\"322.78\" text-anchor=\"middle\" font-size=\"20\" fill=\"#2F7A66\" font-weight=\"700\" class=\"serif\">balanced k-way merge</text><text x=\"700\" y=\"344.65\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">每条输入 tape 只留 1 个前端候选，堆中最多 M 个</text><text x=\"700\" y=\"362.6\" text-anchor=\"middle\" font-size=\"13\" fill=\"#89938F\" font-weight=\"400\" class=\"\">输出一个，就从同一 tape 补一个</text><path d=\"M235 244 L235 268 L1045 268 L1045 244\" fill=\"none\" stroke=\"#2F7A66\" stroke-width=\"1.5\" stroke-linejoin=\"miter\"/><path d=\"M700 268 L700 290\" fill=\"none\" stroke=\"#2F7A66\" stroke-width=\"1.5\" stroke-linejoin=\"miter\"/><polygon points=\"696,282 700,290 704,282\" fill=\"#2F7A66\"/><rect x=\"1080\" y=\"290\" width=\"280\" height=\"96\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1220\" y=\"331.68\" text-anchor=\"middle\" font-size=\"18\" fill=\"#1B2B33\" font-weight=\"700\" class=\"serif\">有序输出流</text><text x=\"1220\" y=\"352.06\" text-anchor=\"middle\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">上层 Sort 节点取用</text><path d=\"M1020 338 L1080 338\" fill=\"none\" stroke=\"#2F7A66\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"/><polygon points=\"1072,334 1080,338 1072,342\" fill=\"#2F7A66\"/></svg>","ctrl":"","anim":false},{"eyebrow":"15 · Top-N｜LIMIT 让排序变成维护 N 个候选","title":"一亿行取前 100，不需要把一亿行排完","lede":"tuplesort_set_bound() 只是 hint；一旦切到 bounded heap，堆里始终只有 N 个候选，比根差的直接丢掉。","caption":"图 15　bounded heap 的切换条件与四个动作；根节点被特意反转成「当前候选里最差的那个」。","bridge":"到这儿，六条路线都出现过了。把它们放在同一张边界图上，才知道什么时候不该找 quicksort。","notes":"ORDER BY score DESC LIMIT 100 这种查询，理想情况不是把一亿行完整排好再切前一百，而是扫描过程中一直维护一百个候选。tuplesort_set_bound 会把 N 告诉排序器，但源码注释明确写着：这只是 hint，不保证只返回 N 个，而且并行 leader 会直接忽略它。真正的切换发生在 tuplesort_puttuple_common：当 memtupcount 大于 2 倍 bound，或者大于 bound 且 LACKMEM 内存紧张时，就调用 make_bounded_heap 进 TSS_BOUNDED。bounded heap 的做法很巧：先反转比较方向，让堆根变成「当前候选里最差的那个」；堆没满就插入，堆满了以后，新 tuple 如果比根还差就直接丢弃，比根更好就替换根并下沉调整；输入结束后用 sort_bounded_heap 把堆变成有序数组。于是内存里始终只有 N 个候选，比较成本是 n log N，而不是 n log n。这就是 EXPLAIN ANALYZE 里出现「Sort Method: top-N heapsort  Memory: …」的原因。顺便留一个思考题，也是原文扩展问题之一：为什么 bounded sort 要禁用 abbreviated key？在 Top-N 场景下，为大量很快会被丢弃的 tuple 先做一遍代理 key 转换，未必划算。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40\" y=\"24\" width=\"560\" height=\"78\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\"/><text x=\"320\" y=\"56.82\" text-anchor=\"middle\" font-size=\"19\" fill=\"#BE653B\" font-weight=\"700\" class=\"mono\">memtupcount &gt; 2 × bound</text><text x=\"320\" y=\"77.74\" text-anchor=\"middle\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">或 &gt; bound 且 LACKMEM(state) → 切到 bounded heap</text><rect x=\"40\" y=\"126\" width=\"560\" height=\"70\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\"/><text x=\"320\" y=\"154.54\" text-anchor=\"middle\" font-size=\"17\" fill=\"#245A6B\" font-weight=\"700\" class=\"serif\">make_bounded_heap()：反转比较方向</text><text x=\"320\" y=\"174.38\" text-anchor=\"middle\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">让「当前候选里最差的那个」坐在堆根</text><rect x=\"190\" y=\"230\" width=\"260\" height=\"54\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1\"/><text x=\"320\" y=\"259.38\" text-anchor=\"middle\" font-size=\"17\" fill=\"#AE8A3E\" font-weight=\"700\" class=\"\">根 = 最差候选</text><rect x=\"60\" y=\"320\" width=\"260\" height=\"54\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"190\" y=\"349.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#46585F\" font-weight=\"400\" class=\"\">候选 1</text><rect x=\"340\" y=\"320\" width=\"260\" height=\"54\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"470\" y=\"349.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#46585F\" font-weight=\"400\" class=\"\">候选 2</text><path d=\"M320 196 L320 230\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.5\" stroke-linejoin=\"miter\"/><polygon points=\"316,222 320,230 324,222\" fill=\"#245A6B\"/><path d=\"M320 284 L320 302 L190 302 L470 302\" fill=\"none\" stroke=\"#AE8A3E\" stroke-width=\"1.5\" stroke-linejoin=\"miter\"/><path d=\"M190 302 L190 320\" fill=\"none\" stroke=\"#AE8A3E\" stroke-width=\"1.3\" stroke-linejoin=\"miter\"/><polygon points=\"186,312 190,320 194,312\" fill=\"#AE8A3E\"/><path d=\"M470 302 L470 320\" fill=\"none\" stroke=\"#AE8A3E\" stroke-width=\"1.3\" stroke-linejoin=\"miter\"/><polygon points=\"466,312 470,320 474,312\" fill=\"#AE8A3E\"/><rect x=\"640\" y=\"24\" width=\"720\" height=\"80\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1000\" y=\"66.24\" text-anchor=\"middle\" font-size=\"16\" fill=\"#1B2B33\" font-weight=\"500\" class=\"\">1　新 tuple 比根还差 → 直接丢弃，不进堆</text><rect x=\"640\" y=\"120\" width=\"720\" height=\"80\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\"/><text x=\"1000\" y=\"162.24\" text-anchor=\"middle\" font-size=\"16\" fill=\"#1B2B33\" font-weight=\"500\" class=\"\">2　新 tuple 更好 → 替换根并下沉调整</text><rect x=\"640\" y=\"216\" width=\"720\" height=\"80\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\"/><text x=\"1000\" y=\"258.24\" text-anchor=\"middle\" font-size=\"16\" fill=\"#1B2B33\" font-weight=\"500\" class=\"\">3　堆里始终只保留 N 个候选，内存 O(N)</text><rect x=\"640\" y=\"312\" width=\"720\" height=\"80\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\"/><text x=\"1000\" y=\"354.24\" text-anchor=\"middle\" font-size=\"16\" fill=\"#1B2B33\" font-weight=\"500\" class=\"\">4　输入结束 → sort_bounded_heap() 变成有序数组</text></svg>","ctrl":"","anim":false},{"eyebrow":"16 · 横向｜六条路线各管一段","title":"算法选择是分层的，不是优劣排行","lede":"quicksort、radix、top-N、external merge 各有触发条件；introsort 与 dual-pivot 是重要参照，不是 PG 当前路线。","caption":"图 16　按「触发条件」摆放的六条路线。金色两格是算法谱系参照，PostgreSQL 当前 tuplesort 并未采用。","bridge":"讲了这么多机制，怎么在真实库里看见它？答案是 EXPLAIN、trace_sort 和三条最小实验。","notes":"把前面所有内容摊到一张边界图上，会清楚很多。PostgreSQL 当前真正在跑的四条：quicksort 管通用内存批次和 run generation，只要给得出三路比较器就能排任意 SortTuple；radix sort 在 leading key 能按整数比较、而且批次不小于 40 时抢下热点；top-N heapsort 服务 ORDER BY ... LIMIT N，只保留 N 个候选；external merge 服务超过 work_mem 的大排序，代价主要是临时文件 I/O 和多路归并。另外两格是算法谱系里的参照：introsort 会在递归深度过大时切 heapsort，给出最坏 O(n log n) 的硬上界；dual-pivot quicksort 用两个枢轴三段切分，改善某些数组排序的常数，但对重复值和实现细节更敏感。这两者都不是 PostgreSQL 当前 quicksort 的路线，所以我把它们画成金色，跟实际路径分开。这张图想纠正的是一个很常见的误会：问「哪个排序算法最好」本身问错了，正确的问题是「在这个规模、这个 key 表示、这个 LIMIT、这个 work_mem 下，谁被触发了」。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40\" y=\"30\" width=\"170\" height=\"150\" rx=\"0\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1\"/><text x=\"125\" y=\"97.86\" text-anchor=\"middle\" font-size=\"17\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"serif\">PostgreSQL</text><text x=\"125\" y=\"118.52\" text-anchor=\"middle\" font-size=\"14\" fill=\"#CFE0DC\" font-weight=\"400\" class=\"\">当前路线</text><rect x=\"40\" y=\"196\" width=\"170\" height=\"150\" rx=\"0\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1\"/><text x=\"125\" y=\"263.86\" text-anchor=\"middle\" font-size=\"17\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"serif\">算法参照</text><text x=\"125\" y=\"284.52\" text-anchor=\"middle\" font-size=\"14\" fill=\"#CFE0DC\" font-weight=\"400\" class=\"\">与超内存路径</text><rect x=\"230\" y=\"30\" width=\"340\" height=\"150\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\"/><text x=\"400\" y=\"89.3\" text-anchor=\"middle\" font-size=\"19\" fill=\"#245A6B\" font-weight=\"700\" class=\"serif\">quicksort</text><text x=\"400\" y=\"111.04\" text-anchor=\"middle\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" class=\"\">通用内存批次</text><text x=\"400\" y=\"129.26\" text-anchor=\"middle\" font-size=\"13\" fill=\"#89938F\" font-weight=\"400\" class=\"\">qsort_tuple / qsort_ssup</text><rect x=\"600\" y=\"30\" width=\"340\" height=\"150\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\"/><text x=\"770\" y=\"89.3\" text-anchor=\"middle\" font-size=\"19\" fill=\"#2F7A66\" font-weight=\"700\" class=\"serif\">top-N heapsort</text><text x=\"770\" y=\"111.04\" text-anchor=\"middle\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" class=\"\">ORDER BY … LIMIT N</text><text x=\"770\" y=\"129.26\" text-anchor=\"middle\" font-size=\"13\" fill=\"#89938F\" font-weight=\"400\" class=\"\">只维护 N 个候选</text><rect x=\"970\" y=\"30\" width=\"340\" height=\"150\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\"/><text x=\"1140\" y=\"89.3\" text-anchor=\"middle\" font-size=\"19\" fill=\"#2F7A66\" font-weight=\"700\" class=\"serif\">radix sort</text><text x=\"1140\" y=\"111.04\" text-anchor=\"middle\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" class=\"\">整数化 leading key</text><text x=\"1140\" y=\"129.26\" text-anchor=\"middle\" font-size=\"13\" fill=\"#89938F\" font-weight=\"400\" class=\"\">n ≥ 40 且按整数比较</text><rect x=\"230\" y=\"196\" width=\"340\" height=\"150\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\"/><text x=\"400\" y=\"255.3\" text-anchor=\"middle\" font-size=\"19\" fill=\"#245A6B\" font-weight=\"700\" class=\"serif\">external merge</text><text x=\"400\" y=\"277.04\" text-anchor=\"middle\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" class=\"\">数据超过 work_mem</text><text x=\"400\" y=\"295.26\" text-anchor=\"middle\" font-size=\"13\" fill=\"#89938F\" font-weight=\"400\" class=\"\">run + 临时 I/O 主导</text><rect x=\"600\" y=\"196\" width=\"340\" height=\"150\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1\"/><text x=\"770\" y=\"255.3\" text-anchor=\"middle\" font-size=\"19\" fill=\"#AE8A3E\" font-weight=\"700\" class=\"serif\">introsort</text><text x=\"770\" y=\"277.04\" text-anchor=\"middle\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" class=\"\">非 PG 当前路线</text><text x=\"770\" y=\"295.26\" text-anchor=\"middle\" font-size=\"13\" fill=\"#89938F\" font-weight=\"400\" class=\"\">深度过大切 heapsort 兜底</text><rect x=\"970\" y=\"196\" width=\"340\" height=\"150\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1\"/><text x=\"1140\" y=\"255.3\" text-anchor=\"middle\" font-size=\"19\" fill=\"#AE8A3E\" font-weight=\"700\" class=\"serif\">dual-pivot</text><text x=\"1140\" y=\"277.04\" text-anchor=\"middle\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" class=\"\">非 PG 当前路线</text><text x=\"1140\" y=\"295.26\" text-anchor=\"middle\" font-size=\"13\" fill=\"#89938F\" font-weight=\"400\" class=\"\">双枢轴三段切分，常数敏感</text><rect x=\"40\" y=\"362\" width=\"1320\" height=\"60\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1\"/><text x=\"700\" y=\"394.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#AE8A3E\" font-weight=\"500\" class=\"\">边界不是优劣，而是触发条件：规模、key 表示、LIMIT、work_mem 共同决定谁上场</text></svg>","ctrl":"","anim":false},{"eyebrow":"17 · 实证｜怎么看见它","title":"别猜，用 EXPLAIN 和 trace_sort 去读","lede":"Sort 节点会显示 Sort Method 和空间类型；要更细的过程日志，短时打开 trace_sort。","caption":"图 17　三个可观察通道：EXPLAIN 的 Sort Method、tuplesort_method_name 的四种取值、trace_sort 的 run 日志。","bridge":"能把方法读出来，也就能把代价读出来。我们把收益和代价摊在同一页上，不藏。","notes":"机制讲得再顺，也要有办法在真实库里验证。第一个通道是 EXPLAIN (ANALYZE, BUFFERS)：explain.c 会调用 tuplesort_get_stats，把排序方法和空间用量打出来，形如「Sort Method: quicksort  Memory: 74kB」。tuplesort_method_name 可能返回四种值：top-N heapsort、quicksort、external sort、external merge；空间类型是 Memory 或 Disk。记住，节点名 Sort 只说明逻辑算子，不说明物理方法，一定要看 Sort Method。第二个通道是 trace_sort，官方配置文档说它会输出排序过程的资源使用信息；tuplesort.c 在 run 生成时还会打「starting quicksort of run N」和「finished quicksort of run N」，用来判断到底是不是 spill 到磁盘，比猜 work_mem 可靠得多。第三个通道是三条最小实验：work_mem 设 64MB 对十万行整数列全排，通常能看到 quicksort；加 LIMIT 100，可能看到 top-N heapsort；把 work_mem 压到 1MB 再按长文本 payload 排序，可能看到 external merge Disk。原文给了完整 SQL。这里我再强调一次：本轮没有启动本地实例，所以上面写的是「可能看到」和实验框架，不是我伪造的执行结果；日志量大，trace_sort 只适合短时诊断，别在高并发生产里长期开着。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40\" y=\"24\" width=\"420\" height=\"382\" rx=\"0\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1\"/><text x=\"58\" y=\"150.46\" text-anchor=\"start\" font-size=\"15\" fill=\"#CFE0DC\" font-weight=\"400\" class=\"mono\">EXPLAIN (ANALYZE, BUFFERS)</text><text x=\"58\" y=\"170.04\" text-anchor=\"start\" font-size=\"14\" fill=\"#EBF1EE\" font-weight=\"400\" class=\"mono\">Sort  (cost=… rows=…)</text><text x=\"58\" y=\"189.08\" text-anchor=\"start\" font-size=\"14\" fill=\"#EBF1EE\" font-weight=\"400\" class=\"mono\">  Sort Key: score</text><text x=\"58\" y=\"208.94\" text-anchor=\"start\" font-size=\"15\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"mono\">  Sort Method: quicksort</text><text x=\"58\" y=\"228.52\" text-anchor=\"start\" font-size=\"14\" fill=\"#EBF1EE\" font-weight=\"400\" class=\"mono\">  Memory: 74kB</text><text x=\"58\" y=\"245.92\" text-anchor=\"start\" font-size=\"12\" fill=\"#89938F\" font-weight=\"400\" class=\"\"> </text><text x=\"58\" y=\"264.7\" text-anchor=\"start\" font-size=\"15\" fill=\"#CFE0DC\" font-weight=\"400\" class=\"\">只看节点名 Sort 不够</text><text x=\"58\" y=\"284.28\" text-anchor=\"start\" font-size=\"14\" fill=\"#CFE0DC\" font-weight=\"400\" class=\"\">要看 Sort Method 与空间类型</text><rect x=\"480\" y=\"24\" width=\"420\" height=\"382\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\"/><text x=\"498\" y=\"143.6\" text-anchor=\"start\" font-size=\"17\" fill=\"#245A6B\" font-weight=\"700\" class=\"serif\">tuplesort_method_name()</text><text x=\"498\" y=\"161.8\" text-anchor=\"start\" font-size=\"11\" fill=\"#89938F\" font-weight=\"400\" class=\"\"> </text><text x=\"498\" y=\"180.04\" text-anchor=\"start\" font-size=\"15\" fill=\"#1B2B33\" font-weight=\"400\" class=\"mono\">top-N heapsort</text><text x=\"498\" y=\"200.44\" text-anchor=\"start\" font-size=\"15\" fill=\"#1B2B33\" font-weight=\"400\" class=\"mono\">quicksort</text><text x=\"498\" y=\"220.84\" text-anchor=\"start\" font-size=\"15\" fill=\"#1B2B33\" font-weight=\"400\" class=\"mono\">external sort</text><text x=\"498\" y=\"241.24\" text-anchor=\"start\" font-size=\"15\" fill=\"#1B2B33\" font-weight=\"400\" class=\"mono\">external merge</text><text x=\"498\" y=\"258.36\" text-anchor=\"start\" font-size=\"11\" fill=\"#89938F\" font-weight=\"400\" class=\"\"> </text><text x=\"498\" y=\"275.78\" text-anchor=\"start\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" class=\"\">空间类型：Memory / Disk</text><text x=\"498\" y=\"293.59\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" class=\"\">数据来自 tuplesort_get_stats()</text><rect x=\"920\" y=\"24\" width=\"440\" height=\"382\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1\"/><text x=\"938\" y=\"137.82\" text-anchor=\"start\" font-size=\"17\" fill=\"#AE8A3E\" font-weight=\"700\" class=\"serif\">trace_sort = on（短时诊断）</text><text x=\"938\" y=\"156.02\" text-anchor=\"start\" font-size=\"11\" fill=\"#89938F\" font-weight=\"400\" class=\"\"> </text><text x=\"938\" y=\"173.03\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" class=\"mono\">starting quicksort of run N</text><text x=\"938\" y=\"191.39\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" class=\"mono\">finished quicksort of run N</text><text x=\"938\" y=\"209.34\" text-anchor=\"start\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">tape 数 / merge 阶段日志</text><text x=\"938\" y=\"225.38\" text-anchor=\"start\" font-size=\"11\" fill=\"#89938F\" font-weight=\"400\" class=\"\"> </text><text x=\"938\" y=\"243.62\" text-anchor=\"start\" font-size=\"15\" fill=\"#AE8A3E\" font-weight=\"600\" class=\"\">三条最小实验路径</text><text x=\"938\" y=\"262.79\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" class=\"mono\">64MB 全排 → quicksort</text><text x=\"938\" y=\"281.15\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" class=\"mono\">LIMIT 100 → top-N heapsort</text><text x=\"938\" y=\"299.1\" text-anchor=\"start\" font-size=\"13\" fill=\"#1B2B33\" font-weight=\"400\" class=\"mono\">1MB 按 payload 排 → external merge</text></svg>","ctrl":"","anim":false},{"eyebrow":"18 · 取舍｜五条收益，五条代价","title":"quicksort 换来的，和它换不来的","lede":"它换来通用、原地、缓存友好和一整套工程兜底；换来的是不稳定、无硬上界、以及超内存后不再主导。","caption":"图 18　左侧青绿是收益，右侧陶橙是代价；两边一一对应，不把任何一面藏起来。","bridge":"代价讲清楚之后，最常见的误判和对应的正确动作，基本就能一一对应了。","notes":"现在可以给一个不含糊的清单。收益五条：通用性强，只要有三路比较器就能排任意 SortTuple；内存占用可控，原地分区为主，不用为每次排序复制完整数组；缓存表现较好，数组上的顺序扫描和原地交换比指针结构友好；工程兜底充分，预排序检测、等值归位、ninther 枢轴、小分区递归大分区迭代，把常见坏情况一个个压住；还能嵌入外部排序，超内存时继续当 run generation 的基础步骤。代价也五条，必须说清楚：第一，不稳定排序，相等 key 的原始顺序不保证保留，而 SQL 本来就不保证未出现在 ORDER BY 中的同 key 行顺序，业务不能依赖偶然顺序；第二，比较器可能比算法更贵，复杂 collation、多列解包、varlena 比较会让 comparator 成为主成本；第三，最坏复杂度不是硬上界，PostgreSQL 用的是工程手段，不是 Musser introsort 那种深度兜底；第四，超过 work_mem 后 quicksort 不再是全局主角，瓶颈转到临时文件、merge order、tape buffer；第五，work_mem 是「每个 sort/hash 类操作」的基础额度，不是会话总额度，复杂查询多节点叠加、多会话并发，总内存可能远高于单个 work_mem。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40\" y=\"20\" width=\"640\" height=\"68\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"360\" y=\"47.74\" text-anchor=\"middle\" font-size=\"16\" fill=\"#2F7A66\" font-weight=\"700\" class=\"serif\">收益 ①　通用性强</text><text x=\"360\" y=\"66.63\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">有三路比较器就能排任意 SortTuple</text><rect x=\"720\" y=\"20\" width=\"640\" height=\"68\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1040\" y=\"47.74\" text-anchor=\"middle\" font-size=\"16\" fill=\"#BE653B\" font-weight=\"700\" class=\"serif\">代价 ①　不稳定排序</text><text x=\"1040\" y=\"66.63\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">同 key 原始顺序不保留，SQL 也不承诺</text><rect x=\"40\" y=\"98\" width=\"640\" height=\"68\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"360\" y=\"125.74\" text-anchor=\"middle\" font-size=\"16\" fill=\"#2F7A66\" font-weight=\"700\" class=\"serif\">收益 ②　内存占用可控</text><text x=\"360\" y=\"144.63\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">原地分区为主，不复制整份数组</text><rect x=\"720\" y=\"98\" width=\"640\" height=\"68\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1040\" y=\"125.74\" text-anchor=\"middle\" font-size=\"16\" fill=\"#BE653B\" font-weight=\"700\" class=\"serif\">代价 ②　比较器可能更贵</text><text x=\"1040\" y=\"144.63\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">collation、多列解包、varlena 才是主成本</text><rect x=\"40\" y=\"176\" width=\"640\" height=\"68\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"360\" y=\"203.74\" text-anchor=\"middle\" font-size=\"16\" fill=\"#2F7A66\" font-weight=\"700\" class=\"serif\">收益 ③　缓存表现较好</text><text x=\"360\" y=\"222.63\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">顺序扫描数组比指针结构友好</text><rect x=\"720\" y=\"176\" width=\"640\" height=\"68\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1040\" y=\"203.74\" text-anchor=\"middle\" font-size=\"16\" fill=\"#BE653B\" font-weight=\"700\" class=\"serif\">代价 ③　最坏不是硬上界</text><text x=\"1040\" y=\"222.63\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">没有 Musser introsort 的深度兜底</text><rect x=\"40\" y=\"254\" width=\"640\" height=\"68\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"360\" y=\"281.74\" text-anchor=\"middle\" font-size=\"16\" fill=\"#2F7A66\" font-weight=\"700\" class=\"serif\">收益 ④　工程兜底充分</text><text x=\"360\" y=\"300.63\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">预排序 / 等值归位 / ninther / 栈深控制</text><rect x=\"720\" y=\"254\" width=\"640\" height=\"68\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1040\" y=\"281.74\" text-anchor=\"middle\" font-size=\"16\" fill=\"#BE653B\" font-weight=\"700\" class=\"serif\">代价 ④　超内存不再是主角</text><text x=\"1040\" y=\"300.63\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">主导因素变成 tape、merge 与临时 I/O</text><rect x=\"40\" y=\"332\" width=\"640\" height=\"68\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"360\" y=\"359.74\" text-anchor=\"middle\" font-size=\"16\" fill=\"#2F7A66\" font-weight=\"700\" class=\"serif\">收益 ⑤　能嵌入外部排序</text><text x=\"360\" y=\"378.63\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">超内存时仍是 run generation 的第一步</text><rect x=\"720\" y=\"332\" width=\"640\" height=\"68\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1040\" y=\"359.74\" text-anchor=\"middle\" font-size=\"16\" fill=\"#BE653B\" font-weight=\"700\" class=\"serif\">代价 ⑤　work_mem 会叠加</text><text x=\"1040\" y=\"378.63\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">每个 sort/hash 节点、每个会话都可用</text></svg>","ctrl":"","anim":false},{"eyebrow":"19 · 实践｜四个错误认知，四个正确动作","title":"调优的方向，取决于你读对了哪一层","lede":"看到 Sort 就以为快排、把 work_mem 当全局内存、分页不补唯一键、外部排序慢怪算法 —— 这四个坑最常见。","caption":"图 19　四个错误认知与对应正确动作的一一映射；调优动作要落在真正产生代价的那一层。","bridge":"最后，把这一整场收成一条从「不排」到「装不下」的决策链。","notes":"把代价清单落到实践，四个坑基本就浮出来了。第一，看到 Sort 节点就以为一定是 quicksort，错；Sort Method 可能是 quicksort、top-N heapsort、external sort、external merge，节点名只说明逻辑算子。正确动作是读 Sort Method 和 Memory/Disk。第二，把 work_mem 当成全局排序内存，错；它是每个 sort/hash 类操作写临时文件前的基础额度，多个节点、多个会话会叠加。正确动作是结合并发数和计划里的排序节点数评估，别一味调大，太大可能造成并发内存压力、OS swap 或缓存挤压。第三，分页只按非唯一列排序，比如 ORDER BY created_at DESC LIMIT 20 OFFSET 100，同一时间戳下行序不确定，翻页会重复或漏行；正确动作是补唯一 tie-break：ORDER BY created_at DESC, id DESC。第四，把外部排序慢归咎于 quicksort，错；外部排序里 quicksort 只负责每个内存 run，真正慢的可能是 run 太多、归并多轮、临时文件 I/O 或磁盘争用。正确动作是看 log_temp_files、临时表空间、磁盘延迟和并发排序数量。再补一句给业务开发者：没有 ORDER BY，数据库没有义务按插入顺序、主键顺序或物理顺序返回，别依赖偶然输出顺序。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40\" y=\"24\" width=\"560\" height=\"80\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\"/><text x=\"320\" y=\"59.44\" text-anchor=\"middle\" font-size=\"16\" fill=\"#BE653B\" font-weight=\"600\" class=\"serif\">错误认知　看到 Sort 节点，就以为用了 quicksort</text><text x=\"320\" y=\"76.28\" text-anchor=\"middle\" font-size=\"10\" fill=\"#89938F\" font-weight=\"400\" class=\"\"> </text><rect x=\"660\" y=\"24\" width=\"700\" height=\"80\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\"/><text x=\"1010\" y=\"55.28\" text-anchor=\"middle\" font-size=\"13\" fill=\"#2F7A66\" font-weight=\"600\" class=\"\">正确动作</text><text x=\"1010\" y=\"75.01\" text-anchor=\"middle\" font-size=\"15.5\" fill=\"#1B2B33\" font-weight=\"500\" class=\"\">看 Sort Method：quicksort / top-N heapsort / external merge</text><path d=\"M600 64 L660 64\" fill=\"none\" stroke=\"#89938F\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"/><polygon points=\"652,60 660,64 652,68\" fill=\"#89938F\"/><rect x=\"40\" y=\"120\" width=\"560\" height=\"80\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\"/><text x=\"320\" y=\"155.44\" text-anchor=\"middle\" font-size=\"16\" fill=\"#BE653B\" font-weight=\"600\" class=\"serif\">错误认知　把 work_mem 当成全局排序内存</text><text x=\"320\" y=\"172.28\" text-anchor=\"middle\" font-size=\"10\" fill=\"#89938F\" font-weight=\"400\" class=\"\"> </text><rect x=\"660\" y=\"120\" width=\"700\" height=\"80\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\"/><text x=\"1010\" y=\"151.28\" text-anchor=\"middle\" font-size=\"13\" fill=\"#2F7A66\" font-weight=\"600\" class=\"\">正确动作</text><text x=\"1010\" y=\"171.01\" text-anchor=\"middle\" font-size=\"15.5\" fill=\"#1B2B33\" font-weight=\"500\" class=\"\">每个 sort/hash 节点都可用该额度，多节点与并发会叠加</text><path d=\"M600 160 L660 160\" fill=\"none\" stroke=\"#89938F\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"/><polygon points=\"652,156 660,160 652,164\" fill=\"#89938F\"/><rect x=\"40\" y=\"216\" width=\"560\" height=\"80\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\"/><text x=\"320\" y=\"251.44\" text-anchor=\"middle\" font-size=\"16\" fill=\"#BE653B\" font-weight=\"600\" class=\"serif\">错误认知　分页只按非唯一列排序</text><text x=\"320\" y=\"268.28\" text-anchor=\"middle\" font-size=\"10\" fill=\"#89938F\" font-weight=\"400\" class=\"\"> </text><rect x=\"660\" y=\"216\" width=\"700\" height=\"80\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\"/><text x=\"1010\" y=\"247.28\" text-anchor=\"middle\" font-size=\"13\" fill=\"#2F7A66\" font-weight=\"600\" class=\"\">正确动作</text><text x=\"1010\" y=\"267.01\" text-anchor=\"middle\" font-size=\"15.5\" fill=\"#1B2B33\" font-weight=\"500\" class=\"\">ORDER BY created_at DESC, id DESC，补上唯一 tie-break</text><path d=\"M600 256 L660 256\" fill=\"none\" stroke=\"#89938F\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"/><polygon points=\"652,252 660,256 652,260\" fill=\"#89938F\"/><rect x=\"40\" y=\"312\" width=\"560\" height=\"80\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\"/><text x=\"320\" y=\"347.44\" text-anchor=\"middle\" font-size=\"16\" fill=\"#BE653B\" font-weight=\"600\" class=\"serif\">错误认知　外部排序慢，就归咎于 quicksort</text><text x=\"320\" y=\"364.28\" text-anchor=\"middle\" font-size=\"10\" fill=\"#89938F\" font-weight=\"400\" class=\"\"> </text><rect x=\"660\" y=\"312\" width=\"700\" height=\"80\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\"/><text x=\"1010\" y=\"343.28\" text-anchor=\"middle\" font-size=\"13\" fill=\"#2F7A66\" font-weight=\"600\" class=\"\">正确动作</text><text x=\"1010\" y=\"363.01\" text-anchor=\"middle\" font-size=\"15.5\" fill=\"#1B2B33\" font-weight=\"500\" class=\"\">先查 run 数、merge 轮次、临时文件 I/O 与磁盘争用</text><path d=\"M600 352 L660 352\" fill=\"none\" stroke=\"#89938F\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"/><polygon points=\"652,348 660,352 652,356\" fill=\"#89938F\"/></svg>","ctrl":"","anim":false},{"eyebrow":"20 · 收束｜一句话带走","title":"算法名称不是答案，代价发生在哪一层才是答案","lede":"从「能不排」到「装不下」五层决策链：quicksort 只在第四层当主角，第五层仍参与但不再主导。","caption":"图 20　从上层语义到下层 I/O 的五层决策链；每一层的正确动作都不在上一次争论「哪个算法最快」的层面上。","bridge":"这场就到这里。下次看到 Sort 节点，先看 Sort Method，再问代价发生在哪一层。","notes":"收一下。第一层，能不排：常见报表维度、时间线、Top-N，能不能用 B-tree 顺序、分区顺序、pathkeys 顺序复用或物化结果，把显式 Sort 直接消掉。第二层，能少排：产品只展示前一百条，就让 SQL 明确带 LIMIT，给执行器走 bounded heap 的机会。第三层，能便宜排：SortSupport、abbreviated key、先筛选投影再排序，压低的是单次比较成本和 tuple 宽度。第四层，必须完整排：一批内存元素要全序，这才轮到 qsort_tuple、qsort_ssup、radix sort，quicksort 在这一层是主角。第五层，装不下：quicksort 退到每个 run 里，balanced k-way merge 和临时文件 I/O 接管全局。所以下次再遇到排序慢，别先争论「是不是该换个更快的算法」，先看 EXPLAIN 的 Sort Method，再顺着这条链问：代价到底发生在语义层、比较器层、内存层，还是 I/O 层。最后留几个可以自己往下挖的问题：要给极端恶意输入提供最坏时间上界，你会在 sort_template.h 里加什么切换条件、牺牲哪些常数；bounded sort 为什么禁用 abbreviated key；中文文本排序里 collation 成本、代理 key 区分度和索引顺序怎么一起影响计划。谢谢大家。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40\" y=\"20\" width=\"220\" height=\"68\" rx=\"0\" fill=\"#EBF1EE\" stroke=\"#EBF1EE\" stroke-width=\"1\"/><text x=\"150\" y=\"56.52\" text-anchor=\"middle\" font-size=\"18\" fill=\"#1B2B33\" font-weight=\"700\" class=\"serif\">① 能不排</text><rect x=\"270\" y=\"20\" width=\"1090\" height=\"68\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\"/><text x=\"815\" y=\"47.88\" text-anchor=\"middle\" font-size=\"17\" fill=\"#2F7A66\" font-weight=\"600\" class=\"serif\">B-tree 索引顺序、pathkeys 顺序复用</text><text x=\"815\" y=\"67.31\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">最优的排序，是不发生的排序</text><rect x=\"40\" y=\"98\" width=\"220\" height=\"68\" rx=\"0\" fill=\"#CFE0DC\" stroke=\"#CFE0DC\" stroke-width=\"1\"/><text x=\"150\" y=\"134.52\" text-anchor=\"middle\" font-size=\"18\" fill=\"#1B2B33\" font-weight=\"700\" class=\"serif\">② 能少排</text><rect x=\"270\" y=\"98\" width=\"1090\" height=\"68\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\"/><text x=\"815\" y=\"125.88\" text-anchor=\"middle\" font-size=\"17\" fill=\"#2F7A66\" font-weight=\"600\" class=\"serif\">ORDER BY … LIMIT N → bounded heap 只维护 N 个候选</text><text x=\"815\" y=\"145.31\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">让执行器知道你只要前 N 条</text><rect x=\"40\" y=\"176\" width=\"220\" height=\"68\" rx=\"0\" fill=\"#A4C4C6\" stroke=\"#A4C4C6\" stroke-width=\"1\"/><text x=\"150\" y=\"212.52\" text-anchor=\"middle\" font-size=\"18\" fill=\"#1B2B33\" font-weight=\"700\" class=\"serif\">③ 能便宜排</text><rect x=\"270\" y=\"176\" width=\"1090\" height=\"68\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1\"/><text x=\"815\" y=\"203.88\" text-anchor=\"middle\" font-size=\"17\" fill=\"#AE8A3E\" font-weight=\"600\" class=\"serif\">SortSupport / abbreviated key、先投影再排序</text><text x=\"815\" y=\"223.31\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">压低的是单次比较成本，不是比较次数</text><rect x=\"40\" y=\"254\" width=\"220\" height=\"68\" rx=\"0\" fill=\"#74A5AD\" stroke=\"#74A5AD\" stroke-width=\"1\"/><text x=\"150\" y=\"290.52\" text-anchor=\"middle\" font-size=\"18\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"serif\">④ 必须完整排</text><rect x=\"270\" y=\"254\" width=\"1090\" height=\"68\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\"/><text x=\"815\" y=\"281.88\" text-anchor=\"middle\" font-size=\"17\" fill=\"#245A6B\" font-weight=\"600\" class=\"serif\">内存批次 → qsort_tuple / qsort_ssup / radix sort</text><text x=\"815\" y=\"301.31\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">quicksort 在这一层才是主角</text><rect x=\"40\" y=\"332\" width=\"220\" height=\"68\" rx=\"0\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1\"/><text x=\"150\" y=\"368.52\" text-anchor=\"middle\" font-size=\"18\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"serif\">⑤ 装不下</text><rect x=\"270\" y=\"332\" width=\"1090\" height=\"68\" rx=\"0\" fill=\"#2E6373\" stroke=\"#1E4B5A\" stroke-width=\"1\"/><text x=\"815\" y=\"359.88\" text-anchor=\"middle\" font-size=\"17\" fill=\"#FFFFFF\" font-weight=\"600\" class=\"serif\">quicksort 生成 run → balanced k-way merge</text><text x=\"815\" y=\"379.31\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#CFE0DC\" font-weight=\"400\" class=\"\">瓶颈已经从 CPU 比较换成临时文件 I/O</text></svg>","ctrl":"","anim":false}];

const N = D.length;
let cur = 0, autoTimer = null, autoOn = false;
let sideOpen = false, sideMode = 'note';
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const pad = n => String(n).padStart(2, '0');
const h = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* ---------- 舞台：等比缩放 + letterbox，讲稿展开时缩到左侧 ---------- */
function fit(){
  const vp = $('#viewport');
  const W = vp.clientWidth, H = vp.clientHeight;
  const sw = sideOpen ? ($('#side').offsetWidth || 0) : 0;
  const availW = W - sw;
  const s = Math.min((availW - 24) / 1600, (H - 24) / 900);
  const st = $('#stage');
  st.style.transform = 'scale(' + s + ')';
  st.style.left = ((availW - 1600 * s) / 2) + 'px';
  st.style.top  = ((H - 900 * s) / 2) + 'px';
}
window.addEventListener('resize', fit);

function render(){
  $('#slides').innerHTML = D.map((d,i) =>
    '<section class="slide' + (d.anim ? ' anim' : '') + '" id="s' + i + '">'
    + '<div class="eyebrow"><span class="num">' + pad(i+1) + ' / ' + pad(N) + '</span>' + h(d.eyebrow) + '</div>'
    + '<h1 class="title">' + h(d.title) + '</h1>'
    + '<div class="lede">' + h(d.lede) + '</div>'
    + '<div class="rule"></div>'
    + '<div class="figwrap">' + d.svg + '</div>'
    + '<div class="caption">' + h(d.caption) + '</div>'
    + (d.ctrl ? '<div class="ctrls">' + d.ctrl + '</div>' : '')
    + '<div class="bridge"><span class="bk">承接 · NEXT</span>' + h(d.bridge) + '</div>'
    + '<div class="footer"><div class="fbar"><i id="fbar' + i + '"></i></div>'
    + '<span class="fl">数据库筑基课 · 快速排序 Quicksort</span>'
    + '<span class="fr">' + pad(i+1) + ' / ' + pad(N) + '</span></div>'
    + '</section>').join('');
}

function toast(s){
  const t = $('#toast'); t.textContent = s; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 1800);
}
function go(i, silent){
  i = Math.max(0, Math.min(N-1, i));
  $$('.slide').forEach((el,k) => el.classList.toggle('on', k === i));
  cur = i;
  try{ localStorage.setItem('qsort-slide', String(i)); }catch(e){}
  $('#pg').textContent = pad(i+1) + ' / ' + pad(N);
  $('#track i').style.width = ((i+1)/N*100) + '%';
  for(let k=0;k<N;k++){ const b = $('#fbar'+k); if(b) b.style.width = (k<=i?100:0) + '%'; }
  pauseAnims();
  if(cur === 4) aPaint();
  if(cur === 6) bPaint();
  syncSide(true);
  if(!silent) toast(D[i].eyebrow + ' · ' + D[i].title);
}
function next(){ if(cur < N-1) go(cur+1); else stopAuto(); }
function prev(){ if(cur > 0) go(cur-1); }

function stopAuto(){
  autoOn = false; clearInterval(autoTimer); autoTimer = null;
  $('#btnAuto').textContent = '▶ 自动播放 P'; $('#btnAuto').classList.remove('act');
}
function toggleAuto(){
  if(autoOn){ stopAuto(); toast('已暂停自动播放'); return; }
  autoOn = true; $('#btnAuto').textContent = '❚❚ 暂停 P'; $('#btnAuto').classList.add('act');
  autoTimer = setInterval(() => { if(cur < N-1) go(cur+1, true); else stopAuto(); }, 12000);
  toast('自动播放：每 12 秒一页');
}

/* ---------- 右侧页内开窗：讲稿 / 全文 / 目录 / 帮助 ---------- */
function renderSide(){
  const body = $('#sideBody');
  if(sideMode === 'note'){
    $('#sideMode').textContent = '本页讲稿 · 页内开窗';
    $('#sideTitle').textContent = D[cur].title;
    body.innerHTML = noteSec(cur);
    body.scrollTop = 0;
  } else if(sideMode === 'all'){
    $('#sideMode').textContent = '全文讲稿 · 页内开窗';
    $('#sideTitle').textContent = '共 ' + N + ' 页 · 已定位到当前页';
    body.innerHTML = D.map((d,i) => noteSec(i)).join('');
  } else if(sideMode === 'toc'){
    $('#sideMode').textContent = '目录 · 页内开窗';
    $('#sideTitle').textContent = '点击任意一页跳转';
    body.innerHTML = '<div class="tocgrid">' + D.map((d,i) =>
      '<button class="tocitem" id="toc' + i + '" onclick="jump(' + i + ')">'
      + '<span class="tn">' + pad(i+1) + ' / ' + pad(N) + '</span>' + h(d.title) + '</button>').join('') + '</div>';
  } else {
    $('#sideMode').textContent = '快捷键 · 页内开窗';
    $('#sideTitle').textContent = '演说时的操作备忘';
    body.innerHTML = '<div class="keys">'
      + '<div><kbd>→ / 空格 / PageDown</kbd>下一页</div>'
      + '<div><kbd>← / PageUp</kbd>上一页</div>'
      + '<div><kbd>G</kbd>目录（再按一次关闭）</div>'
      + '<div><kbd>N</kbd>本页讲稿（再按一次关闭）</div>'
      + '<div><kbd>T</kbd>全文讲稿，自动定位当前页（再按一次关闭）</div>'
      + '<div><kbd>P</kbd>自动播放 / 暂停</div>'
      + '<div><kbd>F</kbd>全屏 / 退出全屏，按键条始终在底部</div>'
      + '<div><kbd>1–9</kbd>直接跳到第 1–9 页</div>'
      + '<div><kbd>Home / End</kbd>首页 / 末页</div>'
      + '<div><kbd>? / H</kbd>本帮助</div>'
      + '<div><kbd>Esc</kbd>关闭讲稿窗 / 退出全屏</div>'
      + '<div><kbd>输入框聚焦时</kbd>快捷键暂时让位给输入</div>'
      + '</div>';
    body.scrollTop = 0;
  }
  markCur();
}
function noteSec(i){
  const d = D[i];
  return '<div class="nsec" id="nsec' + i + '">'
    + '<div class="nmeta">' + pad(i+1) + ' / ' + pad(N) + '　' + h(d.eyebrow) + '</div>'
    + '<h3>' + h(d.title) + '</h3><p>' + h(d.notes) + '</p>'
    + '<div class="nbridge">承接 · NEXT　' + h(d.bridge) + '</div></div>';
}
function markCur(){
  $$('.nsec').forEach(el => el.classList.remove('cur'));
  $$('.tocitem').forEach(el => el.classList.remove('cur'));
  const a = $('#nsec' + cur), b = $('#toc' + cur);
  if(a) a.classList.add('cur');
  if(b) b.classList.add('cur');
}
function syncSide(smooth){
  if(!sideOpen) return;
  if(sideMode === 'note'){ renderSide(); return; }
  if(sideMode !== 'all' && sideMode !== 'toc') return;
  markCur();
  const el = $('#nsec' + cur) || $('#toc' + cur);
  if(el){
    const body = $('#sideBody');
    const top = Math.max(0, el.offsetTop - 12);
    const delta = Math.abs(top - body.scrollTop);
    /* 相邻翻页用平滑滚动；目录大跨度跳转直接定位，保证一定落在当前页 */
    body.scrollTo({top: top, behavior: (smooth && delta < 1400) ? 'smooth' : 'instant'});
  }
}
function openSide(mode){
  if(sideOpen && sideMode === mode){ closeSide(); return; }
  sideMode = mode; sideOpen = true;
  $('#side').classList.add('on');
  document.body.classList.add('sideOpen');
  $('#btnToc').classList.toggle('act', mode === 'toc');
  $('#btnNotes').classList.toggle('act', mode === 'note');
  $('#btnAll').classList.toggle('act', mode === 'all');
  $('#btnHelp').classList.toggle('act', mode === 'help');
  renderSide();
  fit();
  requestAnimationFrame(() => syncSide(false));
  toast(mode === 'note' ? '本页讲稿已展开（再按 N 关闭）'
       : mode === 'all' ? '全文讲稿已展开，已定位当前页（再按 T 关闭）'
       : mode === 'toc' ? '目录已展开（再按 G 关闭）' : '快捷键帮助已展开');
}
function closeSide(){
  sideOpen = false;
  $('#side').classList.remove('on');
  document.body.classList.remove('sideOpen');
  ['btnToc','btnNotes','btnAll','btnHelp'].forEach(id => $('#'+id).classList.remove('act'));
  fit();
  toast('讲稿窗已关闭');
}
function jump(i){ go(i); }

/* ---------- 全屏：底部按键条始终可见 ---------- */
function fs(){
  const entering = !document.body.classList.contains('fs');
  if(entering){
    document.body.classList.add('fs');
    try{
      const pr = document.documentElement.requestFullscreen ? document.documentElement.requestFullscreen() : null;
      if(pr && pr.catch) pr.catch(() => {});
    }catch(e){}
    fit();
    toast('全屏：底部快捷键条保持可见');
  }else{
    document.body.classList.remove('fs');
    try{ if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen(); }catch(e){}
    fit();
    toast('已退出全屏');
  }
}
document.addEventListener('fullscreenchange', () => {
  if(!document.fullscreenElement) document.body.classList.remove('fs');
  fit();
});

document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  const typing = (tag === 'input' || tag === 'select' || tag === 'textarea');
  const k = e.key;
  if(k === 'Escape'){
    if(sideOpen) closeSide();
    else if(document.body.classList.contains('fs')) fs();
    return;
  }
  if(typing) return;               /* 输入控件聚焦时，快捷键让位给输入 */
  if(k === 'ArrowRight' || k === ' ' || k === 'PageDown'){ e.preventDefault(); next(); }
  else if(k === 'ArrowLeft' || k === 'PageUp'){ e.preventDefault(); prev(); }
  else if(k === 'f' || k === 'F'){ e.preventDefault(); fs(); }
  else if(k === 'g' || k === 'G'){ e.preventDefault(); openSide('toc'); }
  else if(k === 'n' || k === 'N'){ e.preventDefault(); openSide('note'); }
  else if(k === 't' || k === 'T'){ e.preventDefault(); openSide('all'); }
  else if(k === 'p' || k === 'P'){ e.preventDefault(); toggleAuto(); }
  else if(k === '?' || k === 'h' || k === 'H'){ e.preventDefault(); openSide('help'); }
  else if(k === 'Home'){ e.preventDefault(); go(0); }
  else if(k === 'End'){ e.preventDefault(); go(N-1); }
  else if(/^[1-9]$/.test(k)){ go(parseInt(k,10) - 1); }
});

/* ---------- 内联 SVG 绘制助手（动画页使用，几何固定、零遮挡） ---------- */
const C = {ink:'#1B2B33',ink2:'#46585F',muted:'#89938F',line:'#D9D5CB',white:'#FFFFFF',
  primary:'#245A6B',primL:'#E5EFF0',accent:'#BE653B',accL:'#F7E9DE',
  green:'#2F7A66',greenL:'#E4F0EA',gold:'#AE8A3E',goldL:'#F5EDDC',bg2:'#F1EFE9'};
function jEsc(v){ return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&apos;'); }
function jW(s,z){ let w=0; for(let i=0;i<s.length;i++){ const c=s[i];
  w += (/[\u2E80-\uFFFF]/.test(c) ? 1 : (c === ' ' ? 0.32 : 0.57)); } return w*z; }
function jTxt(s,x,y,z,fill,anchor,weight,cls,maxw){
  let sz=z, w=jW(s,sz);
  while(maxw && w > maxw && sz > 10){ sz = Math.round((sz-0.5)*10)/10; w = jW(s,sz); }
  return '<text x="'+x+'" y="'+y+'" text-anchor="'+(anchor||'middle')+'" font-size="'+sz
    +'" fill="'+fill+'" font-weight="'+(weight||400)+'" class="'+(cls||'')+'">'+jEsc(s)+'</text>';
}
function jRect(x,y,w,h,fill,stroke,sw){
  return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill
    +'" stroke="'+(stroke||fill)+'" stroke-width="'+(sw||1)+'"/>';
}
function jLine(x1,y1,x2,y2,color,sw){
  return '<path d="M'+x1+' '+y1+' L'+x2+' '+y2+'" stroke="'+color
    +'" stroke-width="'+(sw||1.4)+'" fill="none"/>';
}

/* ---------- 动画 A：三路分区逐步演示 ---------- */
const A_DFT = '5,3,8,3,9,1,7,3,6,2,8,4';
let aVals=[], aPivot=0, aPivotIdx=0, aSteps=[], aStep=-1, aTimer=null, aPlaying=false;
function aParse(){
  const el = $('#aInput'); const raw = el ? el.value : A_DFT;
  let v = raw.split(/[,，\s]+/).map(x => parseInt(x,10)).filter(x => !isNaN(x)).slice(0,12);
  if(v.length < 3) v = A_DFT.split(',').map(Number);
  return v;
}
function aMed(a,b,c){ return [a,b,c].sort((x,y) => x-y)[1]; }
function aChoose(v,st){
  const n=v.length, mid=(n-1)>>1;
  if(st === 'first') return 0;
  if(st === 'med3') return v.indexOf(aMed(v[0], v[mid], v[n-1]));
  const d = Math.max(1, Math.floor(n/8));
  const ix = [0,d,2*d,mid-d,mid,mid+d,n-1-2*d,n-1-d,n-1]
    .map(i => Math.max(0, Math.min(n-1, i)));
  const s = ix.map(i => v[i]);
  const m = aMed(aMed(s[0],s[1],s[2]), aMed(s[3],s[4],s[5]), aMed(s[6],s[7],s[8]));
  return v.indexOf(m);
}
function aBuild(){
  aVals = aParse();
  const el = $('#aStrat'); const st = el ? el.value : 'med3';
  aPivotIdx = aChoose(aVals, st); aPivot = aVals[aPivotIdx];
  const stName = {first:'首元素',med3:'三点取中 median-of-three',ninther:'九点取中 Tukey ninther'}[st];
  const flags = new Array(aVals.length).fill(''); flags[aPivotIdx] = 'P';
  const L=[],E=[],G=[];
  aSteps = [];
  aSteps.push({kind:'choose',cell:aPivotIdx,L:[],E:[],G:[],flags:flags.slice(),
    desc:'选枢轴：'+stName+' → pivot = '+aPivot+'（第 '+(aPivotIdx+1)+' 个元素）', strat:stName});
  for(let i=0;i<aVals.length;i++){
    if(i === aPivotIdx) continue;
    const val = aVals[i];
    const side = val < aPivot ? 'L' : (val > aPivot ? 'G' : 'E');
    const zone = side === 'L' ? '< pivot' : (side === 'E' ? '= pivot' : '> pivot');
    const rel  = side === 'L' ? '小于' : (side === 'E' ? '等于' : '大于');
    aSteps.push({kind:'compare',cell:i,L:L.slice(),E:E.slice(),G:G.slice(),flags:flags.slice(),
      desc:'比较 '+val+' 与枢轴 '+aPivot+' → '+rel+'，应放入 '+zone+' 区'});
    (side === 'L' ? L : (side === 'E' ? E : G)).push(val);
    flags[i] = side;
    aSteps.push({kind:'place',cell:i,L:L.slice(),E:E.slice(),G:G.slice(),flags:flags.slice(),
      desc:'把 '+val+' 归位到 '+zone+' 区；目前三区规模 '+L.length+' / '+E.length+' / '+G.length});
  }
  aSteps.push({kind:'done',cell:-1,L:L.slice(),E:E.slice(),G:G.slice(),flags:flags.slice(),
    desc:'分区完成：< 区 '+L.length+' 个、= 区 '+E.length+' 个（已归位不递归）、> 区 '+G.length
      +' 个；左右规模差 '+Math.abs(L.length-G.length)+' 个'});
  aStep = -1; aPaint();
}
function aPaint(){
  const host = $('#animA'); if(!host || !aVals.length) return;
  const st = aStep < 0 ? null : aSteps[aStep];
  let flags;
  if(!st){ flags = new Array(aVals.length).fill(''); flags[aPivotIdx] = 'P'; }
  else flags = st.flags;
  const L = st ? st.L : [], E = st ? st.E : [], G = st ? st.G : [];
  const n = aVals.length, cw = Math.min(92, (1280-(n-1)*12)/n), gap = 12;
  const total = n*cw + (n-1)*gap, x0 = 60 + (1280-total)/2;
  const el = $('#aStrat');
  const stName = el ? {first:'首元素',med3:'三点取中 median-of-three',ninther:'九点取中 Tukey ninther'}[el.value] : '三点取中 median-of-three';
  let s = '';
  s += jTxt('原始数组（'+n+' 个元素 · 数值由下方输入框决定）', 60, 28, 13, C.muted, 'start');
  for(let i=0;i<n;i++){
    const fl = flags[i];
    let fill=C.white, stroke=C.line, tc=C.ink, sw=1;
    if(fl === 'P'){ fill=C.goldL; stroke=C.gold; tc=C.gold; sw=1.8; }
    else if(fl === 'L'){ fill=C.primL; stroke=C.primary; tc=C.primary; }
    else if(fl === 'E'){ fill=C.goldL; stroke=C.gold; tc=C.gold; }
    else if(fl === 'G'){ fill=C.accL; stroke=C.accent; tc=C.accent; }
    if(st && st.cell === i){ stroke=C.accent; sw=2.8; }
    const x = x0 + i*(cw+gap);
    s += jRect(x, 40, cw, 56, fill, stroke, sw);
    s += jTxt(String(aVals[i]), x+cw/2, 77, 21, tc, 'middle', 600, 'mono', cw-16);
  }
  s += jRect(60, 116, 1280, 52, C.goldL, C.gold, 1.2);
  s += jTxt('枢轴 pivot = '+aPivot+'　·　策略：'+stName+'　·　第 '+(aPivotIdx+1)+' 个元素',
            80, 149, 15, C.ink, 'start', 500, '', 1200);
  const regs = [
    {x:60,  t:'< pivot', v:L, c:C.primary, f:C.primL, note:'继续递归'},
    {x:495, t:'= pivot', v:E, c:C.gold,    f:C.goldL, note:'一次归位，不递归'},
    {x:930, t:'> pivot', v:G, c:C.accent,  f:C.accL,  note:'继续递归'}];
  regs.forEach(r => {
    s += jRect(r.x, 196, 410, 132, r.f, r.c, 1.4);
    s += jTxt(r.t, r.x+205, 224, 18, r.c, 'middle', 700, 'serif', 380);
    const parts = [];
    for(let i=0;i<r.v.length;i+=6) parts.push(r.v.slice(i,i+6).join('  '));
    if(!parts.length) parts.push('—');
    s += jTxt(parts[0], r.x+205, 256, 13.5, C.ink2, 'middle', 400, 'mono', 382);
    if(parts[1]) s += jTxt(parts[1], r.x+205, 278, 13.5, C.ink2, 'middle', 400, 'mono', 382);
    s += jTxt('已归位 '+r.v.length+' 个　·　'+r.note, r.x+205, 310, 13, C.muted, 'middle', 400, '', 382);
  });
  s += jRect(60, 344, 1280, 64, C.white, C.line, 1.2);
  const desc = st ? st.desc
    : '点「播放」或「单步」开始：先选枢轴，再逐个比较并归位（等于枢轴的元素一次到位，不再递归）';
  s += jTxt(desc, 80, 384, 15.5, C.ink, 'start', 400, '', 1230);
  host.innerHTML = s;
  const out = $('#aOut');
  if(out) out.innerHTML = aStep < 0
    ? '<b>准备就绪</b> 共 '+aSteps.length+' 步，可播放 / 单步 / 重置'
    : '<b>第 '+(aStep+1)+' / '+aSteps.length+' 步</b> '+jEsc(st.desc);
}
function aPause(){
  aPlaying = false; clearInterval(aTimer); aTimer = null;
  const b = $('#aPlay'); if(b){ b.textContent = '▶ 播放'; b.classList.remove('play'); }
}
function aPlay(){
  if(aPlaying){ aPause(); return; }
  aPlaying = true; const b = $('#aPlay'); if(b){ b.textContent = '❚❚ 暂停'; b.classList.add('play'); }
  if(aStep >= aSteps.length-1) aStep = -1;
  aTimer = setInterval(() => { aStep++; aPaint(); if(aStep >= aSteps.length-1) aPause(); }, 720);
}
function aTick(){ aPause(); if(aStep < aSteps.length-1){ aStep++; aPaint(); } }
function aReset(){ aPause(); aBuild(); toast('分区演示已重置'); }

/* ---------- 动画 B：枢轴质量模拟（读数由脚本真实计算） ---------- */
let bSweep = 24, bTimer = null, bPlaying = false;
function bData(n, dist){
  const a = [];
  if(dist === 'sorted'){ for(let i=0;i<n;i++) a.push(i+1); }
  else if(dist === 'dup'){ for(let i=0;i<n;i++) a.push(i%7); }
  else { let s=1234567; for(let i=0;i<n;i++){ s=(s*1103515245+12345)&0x7fffffff; a.push(1+s%n); } }
  return a;
}
function bSim(n, dist, strat){
  const arr = bData(n, dist);
  let cmp = 0, depth = 0;
  function qs(a, d){
    if(a.length < 2) return;
    if(d > depth) depth = d;
    let p;
    if(strat === 'min'){ p = a[0]; for(const v of a) if(v < p) p = v; }
    else if(strat === 'med3'){ p = aMed(a[0], a[a.length>>1], a[a.length-1]); }
    else { const s = a.slice().sort((x,y)=>x-y); p = s[s.length>>1]; }
    const L=[],E=[],G=[];
    for(const v of a){ cmp++; if(v < p) L.push(v); else if(v > p) G.push(v); else E.push(v); }
    qs(L, d+1); qs(G, d+1);
  }
  qs(arr, 1);
  return {cmp:cmp, depth:depth};
}
function distName(d){ return {sorted:'已排序',random:'随机（固定种子）',dup:'大量重复 key'}[d] || d; }
function bPaint(){
  const host = $('#animB'); if(!host) return;
  const target = +($('#bN') ? $('#bN').value : 256);
  const dist = $('#bDist') ? $('#bDist').value : 'sorted';
  const nShown = Math.max(16, Math.round(16 + (target-16) * bSweep / 24));
  const r1 = bSim(nShown, dist, 'min'), r2 = bSim(nShown, dist, 'med3'), r3 = bSim(nShown, dist, 'ideal');
  const max = Math.max(r1.cmp, r2.cmp, r3.cmp, 1);
  let s = '';
  s += jTxt('比较次数（柱高按本轮最大值归一化）', 60, 36, 13, C.muted, 'start');
  s += jLine(60, 120, 1000, 120, C.line, 1);
  s += jLine(60, 330, 1000, 330, C.ink2, 1.4);
  const bars = [
    {cx:200, n:'总是取最小（最坏）', r:r1, c:C.accent},
    {cx:500, n:'三点取中', r:r2, c:C.primary},
    {cx:800, n:'理想中位数（参照）', r:r3, c:C.green}];
  bars.forEach(b => {
    const h = Math.max(3, 210 * b.r.cmp / max), y = 330 - h;
    s += jRect(b.cx-60, y, 120, h, b.c, b.c, 1.2);
    s += jTxt(b.n, b.cx, 356, 14, C.ink, 'middle', 600, '', 280);
    s += jTxt('比较 '+b.r.cmp.toLocaleString()+' 次', b.cx, 380, 13, C.ink2, 'middle', 400, 'mono', 280);
    s += jTxt('最大递归深度 '+b.r.depth, b.cx, 402, 12.5, C.muted, 'middle', 400, '', 280);
  });
  s += jRect(1040, 30, 320, 372, C.bg2, C.line, 1.2);
  const ratio = r3.cmp > 0 ? (r1.cmp/r3.cmp).toFixed(1) : '—';
  const lines = [
    ['本轮模拟读数', 18, C.primary, 700, 'serif'],
    ['n = '+nShown+'　·　'+distName(dist), 14, C.ink, 600, ''],
    ['最坏 / 理想 倍数：'+ratio+'×', 13, C.accent, 600, ''],
    ['总是取最小　'+r1.cmp.toLocaleString()+' 次', 12.5, C.ink2, 400, 'mono'],
    ['三点取中　　'+r2.cmp.toLocaleString()+' 次', 12.5, C.ink2, 400, 'mono'],
    ['理想中位数　'+r3.cmp.toLocaleString()+' 次', 12.5, C.ink2, 400, 'mono'],
    ['递归深度　'+r1.depth+' / '+r2.depth+' / '+r3.depth, 12.5, C.ink2, 400, 'mono'],
    ['柱高归一基准 '+max.toLocaleString()+' 次', 12, C.muted, 400, ''],
    ['数值由本页脚本模拟计算，', 12, C.muted, 400, ''],
    ['不是 PostgreSQL 实测基准。', 12, C.muted, 400, '']];
  const ys = [70,110,144,176,208,240,272,304,332,352];
  lines.forEach((l,i) => { s += jTxt(l[0], 1060, ys[i], l[1], l[2], 'start', l[3], l[4], 292); });
  host.innerHTML = s;
  const out = $('#bOut');
  if(out) out.innerHTML = '<b>n = '+nShown+' · '+distName(dist)+'</b>　比较次数 '
    + r1.cmp.toLocaleString()+' / '+r2.cmp.toLocaleString()+' / '+r3.cmp.toLocaleString()
    + '　深度 '+r1.depth+' / '+r2.depth+' / '+r3.depth;
}
function bPause(){
  bPlaying = false; clearInterval(bTimer); bTimer = null;
  const b = $('#bPlay'); if(b){ b.textContent = '▶ 播放'; b.classList.remove('play'); }
}
function bPlay(){
  if(bPlaying){ bPause(); return; }
  bPlaying = true; const b = $('#bPlay'); if(b){ b.textContent = '❚❚ 暂停'; b.classList.add('play'); }
  if(bSweep >= 24) bSweep = 0;
  bTimer = setInterval(() => { bSweep++; bPaint(); if(bSweep >= 24) bPause(); }, 700);
}
function bTick(){
  bPause(); if(bSweep >= 24) bSweep = 0;
  bSweep = Math.min(24, bSweep+1); bPaint();
}
function bReset(){ bPause(); bSweep = 24; bPaint(); toast('模拟演示已重置'); }
function pauseAnims(){ aPause(); bPause(); }

/* ---------- 启动 ---------- */
function init(){
  render(); fit();
  let saved = 0;
  try{ saved = parseInt(localStorage.getItem('qsort-slide') || '0', 10) || 0; }catch(e){}
  go(Math.max(0, Math.min(N-1, saved)), true);
  $('#btnPrev').onclick = prev; $('#btnNext').onclick = next;
  $('#btnToc').onclick = () => openSide('toc');
  $('#btnNotes').onclick = () => openSide('note');
  $('#btnAll').onclick = () => openSide('all');
  $('#btnAuto').onclick = toggleAuto;
  $('#btnFs').onclick = fs;
  $('#btnHelp').onclick = () => openSide('help');
  $('#sideClose').onclick = closeSide;
  aBuild(); bPaint();
  const ai = $('#aInput'), as = $('#aStrat');
  if(ai) ai.addEventListener('change', () => { aPause(); aBuild(); });
  if(as) as.addEventListener('change', () => { aPause(); aBuild(); });
  const bn = $('#bN'), bd = $('#bDist');
  if(bn) bn.addEventListener('input', () => { bPause(); bSweep = 24; bPaint(); });
  if(bd) bd.addEventListener('change', () => { bPause(); bSweep = 24; bPaint(); });
  const bind = (id, fn) => { const el = $(id); if(el) el.onclick = fn; };
  bind('#aPlay', aPlay); bind('#aTick', aTick); bind('#aReset', aReset);
  bind('#bPlay', bPlay); bind('#bTick', bTick); bind('#bReset', bReset);
}
document.addEventListener('DOMContentLoaded', init);
