<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数据库筑基课 · 快速排序｜把全局排序拆成一次分区</title>
<!-- 单文件交付：所有原理图均为现场绘制的内联 SVG，零外部图片 / 字体 / 脚本依赖。 -->
<!-- 视觉母题：地层剖面 / 工程蓝图。内容按因果推演链组织，一页一图一命题。 -->
<style>
:root{
  --bg:#F7F6F2; --bg2:#F1EFE9; --ink:#1B2B33; --ink2:#46585F;
  --muted:#89938F; --line:#D9D5CB; --white:#FFFFFF;
  --primary:#245A6B; --prim-l:#E5EFF0; --accent:#BE653B; --acc-l:#F7E9DE;
  --green:#2F7A66; --green-l:#E4F0EA; --gold:#AE8A3E; --gold-l:#F5EDDC;
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#E9E7E1}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
#viewport{position:absolute;inset:0 0 72px 0;overflow:hidden}
#stage{position:absolute;width:1600px;height:900px;background:var(--bg);
  transform-origin:top left;box-shadow:0 18px 60px rgba(27,43,51,.13);
  transition:transform .36s cubic-bezier(.2,.7,.2,1),left .36s cubic-bezier(.2,.7,.2,1),top .36s cubic-bezier(.2,.7,.2,1)}
.slide{position:absolute;inset:0;display:none}
.slide.on{display:block;animation:fadein .42s cubic-bezier(.2,.7,.2,1)}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{position:absolute;left:64px;top:44px;font-size:13px;letter-spacing:3.4px;
  color:var(--primary);font-weight:600}
.eyebrow .num{font-family:var(--mono);letter-spacing:1px;color:var(--accent);margin-right:14px}
h1.title{position:absolute;left:64px;top:70px;margin:0;font-family:var(--serif);
  font-size:44px;line-height:1.25;font-weight:700;letter-spacing:1.2px;color:var(--ink)}
.lede{position:absolute;left:64px;top:139px;width:1440px;font-size:19px;color:var(--ink2);
  line-height:1.5;letter-spacing:.3px}
.rule{position:absolute;left:64px;top:181px;width:1472px;height:1px;background:var(--line)}
.figwrap{position:absolute;left:100px;top:198px;width:1400px;height:430px}
svg.figure{display:block;overflow:visible}
svg.figure text{font-family:var(--sans)}
svg.figure text.serif{font-family:var(--serif)}
svg.figure text.mono{font-family:var(--mono)}
.caption{position:absolute;left:100px;top:638px;width:1400px;font-size:13px;
  color:var(--muted);letter-spacing:.4px}
.bridge{position:absolute;left:64px;top:706px;width:1472px;font-size:20px;
  color:var(--accent);line-height:1.55;letter-spacing:.4px;padding-left:18px;
  border-left:3px solid var(--accent);font-family:var(--serif)}
.bridge .bk{font-family:var(--sans);font-size:13px;color:var(--muted);
  letter-spacing:2px;display:block;margin-bottom:2px}
.footer{position:absolute;left:64px;top:846px;width:1472px;height:1px;background:var(--line)}
.footer .fl{position:absolute;left:0;top:14px;font-size:12.5px;color:var(--muted);letter-spacing:2px}
.footer .fr{position:absolute;right:0;top:12px;font-family:var(--mono);font-size:14px;color:var(--ink2)}
.footer .fbar{position:absolute;left:0;right:0;top:-1px;height:2px;background:transparent}
.footer .fbar i{display:block;height:2px;background:var(--primary);width:0;transition:width .4s ease}
/* 动画页：控件独立于图，绝不覆盖图 */
.slide.anim .caption{top:632px}
.slide.anim .bridge{top:718px}
.ctrls{position:absolute;left:100px;top:660px;width:1400px;height:42px;display:flex;
  align-items:center;gap:10px}
.ctrls label{font-size:13px;color:var(--ink2);white-space:nowrap}
.ctrls input[type=text],.ctrls select{font-family:var(--sans);font-size:13px;color:var(--ink);
  background:#fff;border:1px solid var(--line);border-radius:4px;padding:5px 8px;outline:none;height:30px}
.ctrls input[type=range]{width:170px;padding:0;accent-color:var(--primary);border:none;background:transparent;height:30px}
.ctrls .btn{height:30px;padding:4px 13px;border:1px solid var(--primary);border-radius:4px;
  background:#fff;color:var(--primary);font-size:13px;cursor:pointer;font-family:var(--sans);white-space:nowrap}
.ctrls .btn.play{background:var(--primary);color:#fff}
.ctrls .btn:hover{filter:brightness(.94)}
.ctrls .out{font-size:12.5px;color:var(--ink2);margin-left:auto;min-width:0;flex:1;
  max-width:520px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrls .out b{color:var(--accent);font-weight:600}
/* 底部外壳：全屏时也保持可见 */
.chrome{position:fixed;left:0;right:0;bottom:0;height:72px;background:#FCFBF8;
  border-top:1px solid var(--line);z-index:50;display:flex;flex-direction:column}
.bar{height:42px;display:flex;align-items:center;gap:5px;padding:0 14px}
.chrome .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.chrome button{font-family:var(--sans);font-size:12.5px;color:var(--ink2);background:transparent;
  border:1px solid transparent;border-radius:5px;padding:6px 9px;cursor:pointer;white-space:nowrap}
.chrome button:hover{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome button.act{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome .pg{font-family:var(--mono);font-size:13.5px;color:var(--ink);min-width:74px;text-align:center}
.chrome .track{flex:1;height:3px;background:var(--line);border-radius:3px;margin:0 10px;position:relative}
.chrome .track i{position:absolute;left:0;top:0;height:3px;background:var(--primary);border-radius:3px;transition:width .35s}
.keybar{height:30px;border-top:1px solid var(--line);display:flex;align-items:center;
  justify-content:center;font-size:12px;color:var(--muted);letter-spacing:.5px;
  white-space:nowrap;overflow:hidden;background:#FCFBF8}
.keybar b{color:var(--primary);font-weight:600;margin-right:12px}
.keybar span{margin:0 8px}
body.fs .keybar{background:var(--gold-l);color:#7A5D22}
body.fs .keybar b{color:#7A5D22}
body.fs .chrome{background:#F1EFE9}
/* 右侧页内开窗（不是弹窗 / 模态） */
.side{position:fixed;right:0;top:0;bottom:72px;width:clamp(380px,34vw,560px);
  background:#FCFBF8;border-left:1px solid var(--line);z-index:45;
  transform:translateX(103%);transition:transform .36s cubic-bezier(.2,.7,.2,1);
  display:flex;flex-direction:column;box-shadow:-14px 0 40px rgba(27,43,51,.08)}
.side.on{transform:none}
.sideHead{padding:20px 26px 15px;border-bottom:1px solid var(--line);position:relative;flex:none}
.sideHead .sm{font-size:12px;letter-spacing:3px;color:var(--accent);font-weight:600}
.sideHead h2{margin:7px 30px 0 0;font-family:var(--serif);font-size:23px;line-height:1.35;color:var(--ink)}
.sideHead .close{position:absolute;right:20px;top:20px;background:#fff;border:1px solid var(--line);
  border-radius:5px;padding:6px 10px;font-size:12.5px;cursor:pointer;color:var(--ink2)}
.sideBody{flex:1;overflow:auto;position:relative;padding:6px 26px 46vh}
.sideFoot{flex:none;border-top:1px solid var(--line);padding:10px 26px;font-size:12px;
  color:var(--muted);letter-spacing:.5px;background:var(--bg2)}
.nsec{padding:22px 12px 26px 16px;border-bottom:1px solid var(--line)}
.nsec.cur{background:var(--gold-l);box-shadow:inset 3px 0 0 var(--accent)}
.nsec .nmeta{font-family:var(--mono);font-size:11.5px;color:var(--accent);letter-spacing:1px}
.nsec h3{margin:9px 0 12px;font-family:var(--serif);font-size:20px;color:var(--primary);line-height:1.4}
.nsec p{margin:0;font-size:15px;line-height:2.05;color:var(--ink2);letter-spacing:.3px}
.nsec .nbridge{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);
  font-family:var(--serif);font-size:14px;line-height:1.8;color:var(--accent)}
.tocgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:18px 0}
.tocitem{display:block;width:100%;text-align:left;padding:11px 12px;border:1px solid var(--line);
  border-radius:5px;background:#fff;cursor:pointer;color:var(--ink);font-family:var(--sans);font-size:14px}
.tocitem:hover{border-color:var(--primary);background:var(--prim-l)}
.tocitem.cur{border-color:var(--accent);background:var(--gold-l);box-shadow:inset 3px 0 0 var(--accent)}
.tocitem .tn{font-family:var(--mono);font-size:11.5px;color:var(--accent);display:block;margin-bottom:4px}
.keys{padding:18px 0;font-size:14.5px;line-height:2.1;color:var(--ink2)}
.keys kbd{font-family:var(--mono);background:#fff;border:1px solid var(--line);
  border-bottom-width:2px;border-radius:4px;padding:2px 7px;color:var(--primary);margin-right:8px}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);
  color:#fff;font-size:13px;padding:9px 16px;border-radius:5px;opacity:0;transition:.3s;z-index:80;pointer-events:none}
.toast.on{opacity:1}
@media print{
  .chrome,.side,.toast{display:none!important}
  #viewport{position:static}
  #stage{position:static;transform:none!important;box-shadow:none}
  .slide{display:block!important;page-break-after:always;position:relative;height:900px}
}
</style>
</head>
<body>
<div id="viewport"><div id="stage"><div id="slides"></div></div></div>

<aside class="side" id="side" aria-label="页内讲稿窗">
  <div class="sideHead">
    <div class="sm" id="sideMode">本页讲稿</div>
    <h2 id="sideTitle"></h2>
    <button class="close" id="sideClose">关闭 ✕</button>
  </div>

  <div class="sideFoot">页内开窗 · 按同一按键再按一次即关闭 · 翻页时讲稿自动联动</div>
</aside>

<div class="chrome">
  <div class="bar">
    <button id="btnPrev">← 上一页</button>
    <button id="btnNext">下一页 →</button>
    <span class="pg" id="pg">01 / 20</span>

    <button id="btnHelp">? 帮助</button>
  </div>

    <span>← → / 空格 翻页</span><span>G 目录</span><span>N 本页讲稿</span>
    <span>T 全文讲稿</span><span>P 自动播放</span><span>F 全屏</span>

  </div>
</div>

<script>
const D = [{"eyebrow":"01 · 起点｜一句话背后的五个问题","title":"一条 ORDER BY，落到执行器是五个问题","lede":"业务看到的是「按时间倒序取 100 条」；执行器看到的是内存、比较成本、结果完整性、顺序复用和临时文件 I/O。","caption":"图 01　左边是 SQL 的一句话，右边是执行器必须逐条回答的五个代价问题；越往下越贴近物理资源。","bridge":"所以先别急着谈算法。我们要先确定，quicksort 到底站在这一叠问题的哪一层。","notes":"大家好，今天讲快速排序，但我想先从一句最普通的 SQL 讲起：SELECT * FROM t ORDER BY score DESC LIMIT 100。对写业务的人来说，这就是「按分数取前一百」。可对执行器来说，这一句话至少要回答五个问题：这批输入能不能放进内存；比较一次 tuple 到底有多贵；你只要前一百条，还是要完整有序的结果；上层是不是还要接着用这个顺序，比如 Merge Join 或者有序聚合；以及一旦超过 work_mem，瓶颈到底在 CPU 比较，还是在临时文件的读写上。为什么值得把这五个问题摆出来？因为 ORDER BY 只是最显眼的入口，DISTINCT、GROUP BY、窗口函数、Merge Join、部分索引构建、有序聚合，都可能把排序拉进计划里。也就是说，排序不是某个孤立算子，它是一条贯穿执行器的代价链。今天这一场，我们只切这条链上的一格：当一批元素已经躺在内存数组里，怎么用较少的比较和较少的额外空间把它排好。先说清楚证据来源，免得讲成玄学：这一场的关键结论，我都回到 PostgreSQL 的 src/include/lib/sort_template.h、src/backend/utils/sort/tuplesort.c、nodeSort.c 和 explain.c 里核过；官方配置文档关于 work_mem、trace_sort 的说明也核过。本轮没有启动本地 PostgreSQL 实例去跑 SQL，所以我不会贴任何「实测输出」，DEMO 部分只给可执行的实验框架，你可以自己复现。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40\" y=\"40\" width=\"340\" height=\"340\" rx=\"0\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1\"/><text x=\"210\" y=\"161.8\" text-anchor=\"middle\" font-size=\"20\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"serif\">业务看到的一句话</text><text x=\"210\" y=\"184.9\" text-anchor=\"middle\" font-size=\"15\" fill=\"#CFE0DC\" font-weight=\"400\" class=\"mono\">SELECT * FROM t</text><text x=\"210\" y=\"205.3\" text-anchor=\"middle\" font-size=\"15\" fill=\"#CFE0DC\" font-weight=\"400\" class=\"mono\">ORDER BY score DESC</text><text x=\"210\" y=\"225.7\" text-anchor=\"middle\" font-size=\"15\" fill=\"#CFE0DC\" font-weight=\"400\" class=\"mono\">LIMIT 100;</text><text x=\"210\" y=\"245.28\" text-anchor=\"middle\" font-size=\"14\" fill=\"#A4C4C6\" font-weight=\"400\" class=\"\">执行器看到的却是</text><text x=\"210\" y=\"265.96\" text-anchor=\"middle\" font-size=\"16\" fill=\"#FFFFFF\" font-weight=\"600\" class=\"serif\">一连串代价问题</text><rect x=\"430\" y=\"24\" width=\"930\" height=\"70\" rx=\"0\" fill=\"#EBF1EE\" stroke=\"#EBF1EE\" stroke-width=\"1\"/><text x=\"895\" y=\"53.02\" text-anchor=\"middle\" font-size=\"18\" fill=\"#1B2B33\" font-weight=\"600\" class=\"serif\">① 输入能不能放进内存？</text><text x=\"895\" y=\"72.99\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">决定是内存排序还是临时文件</text><rect x=\"430\" y=\"96\" width=\"930\" height=\"70\" rx=\"0\" fill=\"#CFE0DC\" stroke=\"#CFE0DC\" stroke-width=\"1\"/><text x=\"895\" y=\"125.02\" text-anchor=\"middle\" font-size=\"18\" fill=\"#1B2B33\" font-weight=\"600\" class=\"serif\">② 比较一次 tuple 有多贵？</text><text x=\"895\" y=\"144.99\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">多列 / collation / NULLS / 宽行</text><rect x=\"430\" y=\"168\" width=\"930\" height=\"70\" rx=\"0\" fill=\"#A4C4C6\" stroke=\"#A4C4C6\" stroke-width=\"1\"/><text x=\"895\" y=\"197.02\" text-anchor=\"middle\" font-size=\"18\" fill=\"#1B2B33\" font-weight=\"600\" class=\"serif\">③ 只要 Top-N，还是要完整有序？</text><text x=\"895\" y=\"216.99\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">决定 bounded heap 还是全排</text><rect x=\"430\" y=\"240\" width=\"930\" height=\"70\" rx=\"0\" fill=\"#74A5AD\" stroke=\"#74A5AD\" stroke-width=\"1\"/><text x=\"895\" y=\"269.02\" text-anchor=\"middle\" font-size=\"18\" fill=\"#1B2B33\" font-weight=\"600\" class=\"serif\">④ 上层还要不要继续用这个顺序？</text><text x=\"895\" y=\"288.99\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">pathkeys / Merge Join / 有序聚合</text><rect x=\"430\" y=\"312\" width=\"930\" height=\"70\" rx=\"0\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1\"/><text x=\"895\" y=\"341.02\" text-anchor=\"middle\" font-size=\"18\" fill=\"#FFFFFF\" font-weight=\"600\" class=\"serif\">⑤ 超 work_mem 后谁主导？</text><text x=\"895\" y=\"360.99\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#EBF1EE\" font-weight=\"400\" class=\"\">CPU 比较，还是 tape I/O</text><path d=\"M380 210 L405 210 L405 59 L405 347\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"/><path d=\"M405 59 L430 59\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.4\" stroke-linejoin=\"miter\"/><polygon points=\"422,55 430,59 422,63\" fill=\"#245A6B\"/><path d=\"M405 131 L430 131\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.4\" stroke-linejoin=\"miter\"/><polygon points=\"422,127 430,131 422,135\" fill=\"#245A6B\"/><path d=\"M405 203 L430 203\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.4\" stroke-linejoin=\"miter\"/><polygon points=\"422,199 430,203 422,207\" fill=\"#245A6B\"/><path d=\"M405 275 L430 275\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.4\" stroke-linejoin=\"miter\"/><polygon points=\"422,271 430,275 422,279\" fill=\"#245A6B\"/><path d=\"M405 347 L430 347\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.4\" stroke-linejoin=\"miter\"/><polygon points=\"422,343 430,347 422,351\" fill=\"#245A6B\"/></svg>","ctrl":"","anim":false},{"eyebrow":"02 · 定位｜把「排序」拆成七层","title":"quicksort 不是排序框架，它只是其中一层","lede":"把数据库排序剖成七层：SQL 语义、Sort 节点、tuplesort 状态、内存批次、比较与分区、tape、硬件。","caption":"图 02　地层剖面：越往下越底层。陶橙描边的第五层才是本讲范围；上面三层管语义与状态，下面两层管 I/O 与硬件。","bridge":"既然范围圈定了，接下来要看：这一层拿到的「元素」和「比较」，跟教科书里的整数数组有什么不同。","notes":"上一页那五个问题，其实可以叠成一副剖面。最上面是 SQL 与算子语义，决定要不要排、按什么 key 排；往下是执行器里的 Sort 节点，nodeSort.c 第一次被调用时会把外层子计划的全部 tuple 读进来，喂给 tuplesort，然后再从 tuplesort 里一条条取结果；再往下是 tuplesort 自己的状态机，决定这次走内存、Top-N 还是外部排序；再往下才是内存里的 memtuples[] 数组、datum1 和 SortSupport 提供的 key 表示；第五层，也就是图上用陶橙描出来的那一层，才是「比较与分区」，quicksort 和 radix sort 在这里工作。底下两层是 logical tape 和硬件。这个剖面想说明一件事：PostgreSQL 从来没把 quicksort 当成排序的唯一答案，它只是把 quicksort 放进 tuplesort 框架里，跟 top-N heapsort、radix sort、external merge、SortSupport、临时 tape、并行排序一起协作。很多调优之所以走偏，就是因为把某一层的现象，归到了另一层的原因上。比如看到排序慢就怪算法，实际上瓶颈可能在比较器，也可能在临时文件 I/O。先把层找准，后面的判断才不会飘。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40\" y=\"24\" width=\"1060\" height=\"48\" rx=\"0\" fill=\"#EBF1EE\" stroke=\"#EBF1EE\" stroke-width=\"1\"/><text x=\"570\" y=\"50.24\" text-anchor=\"middle\" font-size=\"16\" fill=\"#1B2B33\" font-weight=\"500\" class=\"\">第 1 层　SQL 与算子语义　ORDER BY / DISTINCT / GROUP BY / 窗口 / Merge Join</text><rect x=\"40\" y=\"80\" width=\"1060\" height=\"48\" rx=\"0\" fill=\"#CFE0DC\" stroke=\"#CFE0DC\" stroke-width=\"1\"/><text x=\"570\" y=\"106.24\" text-anchor=\"middle\" font-size=\"16\" fill=\"#1B2B33\" font-weight=\"500\" class=\"\">第 2 层　执行器 Sort 节点　nodeSort.c：吃满子计划输入，再取排序结果</text><rect x=\"40\" y=\"136\" width=\"1060\" height=\"48\" rx=\"0\" fill=\"#A4C4C6\" stroke=\"#A4C4C6\" stroke-width=\"1\"/><text x=\"570\" y=\"162.24\" text-anchor=\"middle\" font-size=\"16\" fill=\"#1B2B33\" font-weight=\"500\" class=\"\">第 3 层　tuplesort 状态机　内存 / bounded / 外部排序三条路</text><rect x=\"40\" y=\"192\" width=\"1060\" height=\"48\" rx=\"0\" fill=\"#74A5AD\" stroke=\"#74A5AD\" stroke-width=\"1\"/><text x=\"570\" y=\"218.24\" text-anchor=\"middle\" font-size=\"16\" fill=\"#1B2B33\" font-weight=\"500\" class=\"\">第 4 层　内存批次与 key 表示　memtuples[] · datum1 · SortSupport</text><rect x=\"40\" y=\"248\" width=\"1060\" height=\"48\" rx=\"0\" fill=\"#47808D\" stroke=\"#BE653B\" stroke-width=\"2\"/><text x=\"570\" y=\"274.24\" text-anchor=\"middle\" font-size=\"16\" fill=\"#FFFFFF\" font-weight=\"500\" class=\"\">第 5 层　比较与分区　quicksort / radix sort ← 本讲的主角</text><rect x=\"40\" y=\"304\" width=\"1060\" height=\"48\" rx=\"0\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1\"/><text x=\"570\" y=\"330.24\" text-anchor=\"middle\" font-size=\"16\" fill=\"#FFFFFF\" font-weight=\"500\" class=\"\">第 6 层　临时文件与 logical tape　run generation · merge</text><rect x=\"40\" y=\"360\" width=\"1060\" height=\"48\" rx=\"0\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1\"/><text x=\"570\" y=\"386.24\" text-anchor=\"middle\" font-size=\"16\" fill=\"#FFFFFF\" font-weight=\"500\" class=\"\">第 7 层　硬件　CPU cache / 内存带宽 / 临时文件 I/O</text><rect x=\"1120\" y=\"212\" width=\"240\" height=\"120\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\"/><text x=\"1240\" y=\"248\" text-anchor=\"middle\" font-size=\"18\" fill=\"#BE653B\" font-weight=\"700\" class=\"serif\">quicksort 的位置</text><text x=\"1240\" y=\"268.38\" text-anchor=\"middle\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">只负责内存中这一批</text><text x=\"1240\" y=\"286.06\" text-anchor=\"middle\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">memtuples[] 怎么排好</text><text x=\"1240\" y=\"303.74\" text-anchor=\"middle\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">不是整个排序框架</text><path d=\"M1100 272 L1120 272\" fill=\"none\" stroke=\"#BE653B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"/><polygon points=\"1112,268 1120,272 1112,276\" fill=\"#BE653B\"/></svg>","ctrl":"","anim":false},{"eyebrow":"03 · 元素｜SortTuple 与比较器","title":"要排的不是整数，是 SortTuple","lede":"一个元素可能是 heap tuple、index tuple、datum 或聚合中间值；比较器也不是一个简单的「小于号」。","caption":"图 03　SortTuple 的三个关键字段，与比较器必须处理的六类语义；算法只移动元素，语义全在比较器里。","bridge":"元素变复杂、比较变贵之后，算法能做的就只剩一件事：把比较次数和移动次数压下去。这就是分区。","notes":"教科书里排的是一数组整数，比较一次就是一条 CPU 指令。数据库里排的是 SortTuple：它可能代表 heap tuple、index tuple、一个 datum、聚合的中间值，或者外部排序从 tape 上读回来的 tuple。源码里的 SortTuple 有几个关键字段，datum1 放首 key 或者 abbreviated key，isnull1 是 NULL 标记，剩下的才是完整元组或者值。而比较器要照顾的东西就多了：多列排序 key、升序降序、NULLS FIRST 还是 NULLS LAST、collation、类型 opclass 提供的比较函数，还有 abbreviated key 这种「先拿便宜代理值比，必要时再回到完整比较」的优化。这里有个很重要的分工：算法负责把元素挪来挪去，顺序的定义完全交给比较器。所以 quicksort 在数据库里的价值，不是「分治很漂亮」，而是它用尽量少的比较器调用完成排序——因为每一次调用，都可能是一次带 collation 的文本比较，或者一次多列 tuple 解包。你如果记住这一页，后面很多选择就好懂了：为什么 PostgreSQL 愿意为了省一层函数指针，专门生成两个排序入口；为什么 radix sort 只在 key 能按整数比较时才上场。答案都指向同一件事，比较器才是那个可能最贵的部件。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40\" y=\"40\" width=\"360\" height=\"60\" rx=\"0\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1\"/><text x=\"220\" y=\"72.38\" text-anchor=\"middle\" font-size=\"17\" fill=\"#FFFFFF\" font-weight=\"600\" class=\"serif\">SortTuple：内存里的一个元素</text><rect x=\"40\" y=\"110\" width=\"360\" height=\"60\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\"/><text x=\"220\" y=\"142.03\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"400\" class=\"mono\">datum1　首 key 或 abbreviated key</text><rect x=\"40\" y=\"180\" width=\"360\" height=\"60\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\"/><text x=\"220\" y=\"212.03\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"400\" class=\"mono\">isnull1　NULL 标记</text><rect x=\"40\" y=\"250\" width=\"360\" height=\"60\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\"/><text x=\"220\" y=\"282.03\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"400\" class=\"mono\">tup / datum　完整元组或值</text><rect x=\"460\" y=\"140\" width=\"280\" height=\"140\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\"/><text x=\"600\" y=\"194.16\" text-anchor=\"middle\" font-size=\"18\" fill=\"#BE653B\" font-weight=\"700\" class=\"serif\">比较器 comparator</text><text x=\"600\" y=\"215.36\" text-anchor=\"middle\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" class=\"\">决定「谁在前」</text><text x=\"600\" y=\"233.58\" text-anchor=\"middle\" font-size=\"13\" fill=\"#89938F\" font-weight=\"400\" class=\"\">不是一个简单的 &lt;</text><rect x=\"800\" y=\"18\" width=\"540\" height=\"54\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1070\" y=\"47.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#1B2B33\" font-weight=\"500\" class=\"\">① 多列排序 key 与 tie-break</text><rect x=\"800\" y=\"84\" width=\"540\" height=\"54\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1070\" y=\"113.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#1B2B33\" font-weight=\"500\" class=\"\">② 升序 / 降序</text><rect x=\"800\" y=\"150\" width=\"540\" height=\"54\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1070\" y=\"179.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#1B2B33\" font-weight=\"500\" class=\"\">③ NULLS FIRST / NULLS LAST</text><rect x=\"800\" y=\"216\" width=\"540\" height=\"54\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1070\" y=\"245.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#1B2B33\" font-weight=\"500\" class=\"\">④ collation 与类型 opclass</text><rect x=\"800\" y=\"282\" width=\"540\" height=\"54\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1070\" y=\"311.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#1B2B33\" font-weight=\"500\" class=\"\">⑤ 运行时比较函数 comparetup</text><rect x=\"800\" y=\"348\" width=\"540\" height=\"54\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1070\" y=\"377.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#1B2B33\" font-weight=\"500\" class=\"\">⑥ abbreviated key：先比代理值</text><path d=\"M400 210 L460 210\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"/><polygon points=\"452,206 460,210 452,214\" fill=\"#245A6B\"/><path d=\"M740 210 L770 210 L770 45 L770 375\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"/><path d=\"M770 45 L800 45\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.3\" stroke-linejoin=\"miter\"/><polygon points=\"792,41 800,45 792,49\" fill=\"#245A6B\"/><path d=\"M770 111 L800 111\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.3\" stroke-linejoin=\"miter\"/><polygon points=\"792,107 800,111 792,115\" fill=\"#245A6B\"/><path d=\"M770 177 L800 177\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.3\" stroke-linejoin=\"miter\"/><polygon points=\"792,173 800,177 792,181\" fill=\"#245A6B\"/><path d=\"M770 243 L800 243\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.3\" stroke-linejoin=\"miter\"/><polygon points=\"792,239 800,243 792,247\" fill=\"#245A6B\"/><path d=\"M770 309 L800 309\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.3\" stroke-linejoin=\"miter\"/><polygon points=\"792,305 800,309 792,313\" fill=\"#245A6B\"/><path d=\"M770 375 L800 375\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.3\" stroke-linejoin=\"miter\"/><polygon points=\"792,371 800,375 792,379\" fill=\"#245A6B\"/></svg>","ctrl":"","anim":false},{"eyebrow":"04 · 机制｜一次三路分区","title":"把全局排序，换成围绕枢轴的反复分区","lede":"选一个枢轴，把元素分成小于、等于、大于三块；等于的那块一次归位，剩下两块继续处理。","caption":"图 04　三路分区的骨架（数组值为示意值）。等值区不参与递归，是 Bentley–McIlroy 风格实现减少无意义递归的关键。","bridge":"道理说起来一句话，但「等于枢轴」那一格怎么摆，恰恰是工程实现和教科书差别最大的地方。我们现场走一遍。","notes":"快速排序的核心动作其实只有三步：选一个枢轴 pivot，把数组分成小于、等于、大于三块，然后对小于区和大于区继续做同样的事，小数组再换成插入排序。它把「全局有序」这个大问题，转化成「围绕枢轴反复分区」这个局部问题。这里最值得盯住的是中间那块「等于」。报表排序里大量重复 key 太常见了，比如按状态、按地区、按日期分组统计；如果分区算法把等于枢轴的元素随便丢到某一侧，它们就会在后续的递归里被反复比较、反复搬动，产生一大堆毫无意义的工作。PostgreSQL 的做法是扫描时把等于枢轴的元素分别攒到数组两端，分区结束后再统一换回中间，让它们一次性归位，不再进入递归。另一个要点是分区质量：枢轴接近中位数，两边规模差不多，递归树就矮，总比较次数接近 n log n；枢轴长期偏向一端，递归树就变成一条长链，比较次数往 n² 走。所以快速排序的关键从来不是「递归」这个形式，而是「这一次分区分得均不均匀」。注意上面那排数字只是示意值，用来讲结构，不代表任何实测数据。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40\" y=\"24\" width=\"100\" height=\"60\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"90\" y=\"62\" text-anchor=\"middle\" font-size=\"21\" fill=\"#1B2B33\" font-weight=\"600\" class=\"mono\">5</text><rect x=\"150\" y=\"24\" width=\"100\" height=\"60\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"200\" y=\"62\" text-anchor=\"middle\" font-size=\"21\" fill=\"#1B2B33\" font-weight=\"600\" class=\"mono\">3</text><rect x=\"260\" y=\"24\" width=\"100\" height=\"60\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"310\" y=\"62\" text-anchor=\"middle\" font-size=\"21\" fill=\"#1B2B3  x=\"1250\" y=\"24\" width=\"100\" height=\"60\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1300\" y=\"62\" text-anchor=\"middle\" font-size=\"21\" fill=\"#1B2B33\" font-weight=\"600\" class=\"mono\">4</text><rect x=\"560\" y=\"118\" width=\"280\" height=\"60\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1\"/><text x=\"700\" y=\"150.66\" text-anchor=\"middle\" font-size=\"19\" fill=\"#AE8A3E\" font-weight=\"700\" class=\"serif\">选枢轴 pivot = 5</text><path d=\"M680 84 L680 118\" fill=\"none\" stroke=\"#AE8A3E\" stroke-width=\"1.5\" stroke-linejoin=\"miter\"/><polygon points=\"676,110 680,118 684,110\" fill=\"#AE8A3E\"/><rect x=\"40\" y=\"230\" width=\"420\" height=\"140\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><text x=\"250\" y=\"284.18\" text-anchor=\"middle\" font-size=\"23\" fill=\"#245A6B\" font-weight=\"700\" class=\"serif\">&lt; pivot</text><text x=\"250\" y=\"308.9\" text-anchor=\"middle\" font-size=\"15\" fill=\"#46585F\" font-weight=\"400\" class=\"\">继续递归排序</text><text x=\"250\" y=\"327.66\" text-anchor=\"middle\" font-size=\"13\" fill=\"#89938F\" font-weight=\"400\" class=\"\">左区规模决定递归深度</text><rect x=\"490\" y=\"230\" width=\"420\" height=\"140\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.6\"/><text x=\"700\" y=\"284.18\" text-anchor=\"middle\" font-size=\"23\" fill=\"#AE8A3E\" font-weight=\"700\" class=\"serif\">= pivot</text><text x=\"700\" y=\"308.9\" text-anchor=\"middle\" font-size=\"15\" fill=\"#46585F\" font-weight=\"400\" class=\"\">一次归位，不再递归</text><text x=\"700\" y=\"327.66\" text-anchor=\"middle\" font-size=\"13\" fill=\"#89938F\" font-weight=\"400\" class=\"\">重复 key 越多越省事</text><rect x=\"940\" y=\"230\" width=\"420\" height=\"140\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.6\"/><text x=\"1150\" y=\"284.18\" text-anchor=\"middle\" font-size=\"23\" fill=\"#BE653B\" font-weight=\"700\" class=\"serif\">&gt; pivot</text><text x=\"1150\" y=\"308.9\" text-anchor=\"middle\" font-size=\"15\" fill=\"#46585F\" font-weight=\"400\" class=\"\">继续递归排序</text><text x=\"1150\" y=\"327.66\" text-anchor=\"middle\" font-size=\"13\" fill=\"#89938F\" font-weight=\"400\" class=\"\">右区规模决定递归深度</text><path d=\"M700 178 L700 205 L250 205 L250 205\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"/><path d=\"M250 205 L1150 205\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"/><path d=\"M250 205 L250 230\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.5\" stroke-linejoin=\"miter\"/><polygon points=\"246,222 250,230 254,222\" fill=\"#245A6B\"/><path d=\"M700 205 L700 230\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.5\" stroke-linejoin=\"miter\"/><polygon points=\"696,222 700,230 704,222\" fill=\"#245A6B\"/><path d=\"M1150 205 L1150 230\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.5\" stroke-linejoin=\"miter\"/><polygon points=\"1146,222 1150,230 1154,222\" fill=\"#245A6B\"/></svg>","ctrl":"","anim":false},{"eyebrow":"05 · 机制 · 动画｜走一遍分区","title":"亲手把一批元素分完，看等值如何归位","lede":"输入自己的数组、换枢轴策略，然后播放或单步；每一步的比较结果和三区内容都摊在图上。","caption":"图 05　可交互的三路分区演示。上方是原始数组，下方三个区实时累计；数值与计数由本页脚本按输入实时计算。","bridge":"分区走完了，还有一个悬着的问题：这个枢轴凭什么选得好？选砸了会怎样？","notes":"这一页请大家自己动手。上面那个输入框里可以填一组逗号分隔的数字，默认给了一组含重复值的数据；旁边的下拉框可以换枢轴策略：直接拿首元素、三点取中、或者九点取中的 ninther 思路。点「播放」会自动一步一步走，也可以点「单步」自己控制节奏，「重置」回到起点。走的时候请看三件事。第一，每个元素只跟枢轴比一次，就被决定丢进哪个区，分区这一层的成本跟 n 是线性的。第二，等于枢轴的那些值全部进中间那一格，一次归位，后面不再递归；你可以把输入改成大量重复值，会看到左右两区很瘦、中间很胖，递归几乎立刻结束。第三，看最后左右两区的规模差：差得越远，说明这次枢轴选得越偏，后面的递归树就越瘦长。这里必须说清楚，页面上的九点取样是对 Tukey ninther 思路的教学化模拟，不是逐行照抄源码的取样下标；源码里 n 大于 40 时，用 n/8 作为间隔，在头、中、尾各取三个点做三次取中，再对三个中位值取一次中。演示的目的是让你看见「取样越充分，坏枢轴越不容易出现」，而不是给出一组性能基准。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><g id=\"animA\"></g></svg>","ctrl":"<label for=\"aInput\">数组</label><input id=\"aInput\" type=\"text\" value=\"5,3,8,3,9,1,7,3,6,2,8,4\" spellcheck=\"false\" style=\"width:290px\" title=\"逗号分隔的数字，最多 12 个\"><label for=\"aStrat\">枢轴</label><select id=\"aStrat\"><option value=\"first\">首元素（最易偏）</option><option value=\"med3\" selected>三点取中 median-of-three</option><option value=\"ninther\">九点取中 Tukey ninther</option></select><button class=\"btn play\" id=\"aPlay\">▶ 播放</button><button class=\"btn\" id=\"aTick\">单步 →</button><button class=\"btn\" id=\"aReset\">↺ 重置</button><span class=\"out\" id=\"aOut\"></span>","anim":true},{"eyebrow":"06 · 枢轴｜阈值分层的工程选择","title":"n<7、7<n≤40、n>40，各用各的办法","lede":"源码里没有「一个枢轴走天下」：规模不同，插入排序、三点取中、九点取中依次上场，还要先查是否已有序。","caption":"图 06　按输入规模分层的四条工程规则；阈值 7 与 40 来自 sort_template.h 与 tuplesort.c，n = 7 时源码直接取中间元素作枢轴。","bridge":"这些阈值降低的是「遇到坏枢轴的概率」，不是把最坏情况消灭掉。下一页用可计算的模拟把代价摆出来。","notes":"我们回到源码。sort_template.h 顶部的注释写得很直白：这套 qsort 例程基于 Bentley 和 McIlroy 1993 年的《Engineering a Sort Function》，并做了几项改造。我按规模把它排成四条。第一，n 小于 7 直接插入排序，元素太少的时候，递归和分区的开销比排序本身还大。第二，先从头到尾扫一遍，如果整段已经有序就直接返回，这条是 2006 年 pgsql-hackers 讨论后加上的，替换掉了 NetBSD 原版那个 swap_cnt 切换插入排序的做法；数据库里接近有序的输入不少，这一扫很划算。第三，n 大于 7 时用 median-of-three，取头、中、尾三点做一次取中。第四，n 大于 40 时升级成 Tukey ninther：以 n/8 为间隔，在头、中、尾各取三个点，做三次取中，再对三个中位值取一次中。还有两条同样来自注释：等于枢轴的元素被集中处理；只递归较小分区，较大分区用循环继续，把递归深度约束在 log n 级别。可选打开 ST_CHECK_FOR_INTERRUPTS，让长排序能响应取消请求。你会发现这些都不是教科书装饰，每一条都对应数据库里一种具体的风险：重复 key、接近有序的输入、恶意或巧合的坏分布、以及长排序期间用户按了取消。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><path d=\"M28 24 L28 404\" fill=\"none\" stroke=\"#89938F\" stroke-width=\"1.4\" stroke-linejoin=\"miter\"/><polygon points=\"24,396 28,404 32,396\" fill=\"#89938F\"/><text x=\"28\" y=\"16\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" class=\"\">n 增大</text><rect x=\"40\" y=\"24\" width=\"250\" height=\"86\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\"/><text x=\"165\" y=\"61.02\" text-anchor=\"middle\" font-size=\"18\" fill=\"#245A6B\" font-weight=\"700\" class=\"mono\">n &lt; 7</text><text x=\"165\" y=\"80.99\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" class=\"\">规模阈值</text><rect x=\"300\" y=\"24\" width=\"330\" height=\"86\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"465\" y=\"61.16\" text-anchor=\"middle\" font-size=\"19\" fill=\"#1B2B33\" font-weight=\"700\" class=\"serif\">插入排序</text><text x=\"465\" y=\"81.67\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" class=\"\">本层采取的动作</text><rect x=\"640\" y=\"24\" width=\"720\" height=\"86\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1000\" y=\"69.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#46585F\" font-weight=\"400\" class=\"\">元素太少，递归与分区的开销反而更大；插入排序常数最小、缓存友好。</text><path d=\"M28 67 L40 67\" fill=\"none\" stroke=\"#89938F\" stroke-width=\"1.2\" stroke-linejoin=\"miter\"/><rect x=\"40\" y=\"122\" width=\"250\" height=\"86\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\"/><text x=\"165\" y=\"159.02\" text-anchor=\"middle\" font-size=\"18\" fill=\"#245A6B\" font-weight=\"700\" class=\"mono\">7 &lt; n ≤ 40</text><text x=\"165\" y=\"178.99\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" class=\"\">规模阈值</text><rect x=\"300\" y=\"122\" width=\"330\" height=\"86\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"465\" y=\"159.16\" text-anchor=\"middle\" font-size=\"19\" fill=\"#1B2B33\" font-weight=\"700\" class=\"serif\">median-of-three</text><text x=\"465\" y=\"179.67\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" class=\"\">本层采取的动作</text><rect x=\"640\" y=\"122\" width=\"720\" height=\"86\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1000\" y=\"167.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#46585F\" font-weight=\"400\" class=\"\">取头、中、尾三点做一次取中，避免单个端点当成枢轴。</text><path d=\"M28 165 L40 165\" fill=\"none\" stroke=\"#89938F\" stroke-width=\"1.2\" stroke-linejoin=\"miter\"/><rect x=\"40\" y=\"220\" width=\"250\" height=\"86\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.6\"/><text x=\"165\" y=\"257.02\" text-anchor=\"middle\" font-size=\"18\" fill=\"#BE653B\" font-weight=\"700\" class=\"mono\">n &gt; 40</text><text x=\"165\" y=\"276.99\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" class=\"\">规模阈值</text><rect x=\"300\" y=\"220\" width=\"330\" height=\"86\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"465\" y=\"257.16\" text-anchor=\"middle\" font-size=\"19\" fill=\"#1B2B33\" font-weight=\"700\" class=\"serif\">Tukey ninther</text><text x=\"465\" y=\"277.67\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" class=\"\">本层采取的动作</text><rect x=\"640\" y=\"220\" width=\"720\" height=\"86\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1000\" y=\"265.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#46585F\" font-weight=\"400\" class=\"\">头 / 中 / 尾各取三点，三次取中后再对三个中位值取中，压低坏枢轴概率。</text><path d=\"M28 263 L40 263\" fill=\"none\" stroke=\"#89938F\" stroke-width=\"1.2\" stroke-linejoin=\"miter\"/><rect x=\"40\" y=\"318\" width=\"250\" height=\"86\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1\"/><text x=\"165\" y=\"355.02\" text-anchor=\"middle\" font-size=\"18\" fill=\"#AE8A3E\" font-weight=\"700\" class=\"mono\">任意 n，先扫一遍</text><text x=\"165\" y=\"374.99\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" class=\"\">规模阈值</text><rect x=\"300\" y=\"318\" width=\"330\" height=\"86\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"465\" y=\"355.16\" text-anchor=\"middle\" font-size=\"19\" fill=\"#1B2B33\" font-weight=\"700\" class=\"serif\">预排序检测</text><text x=\"465\" y=\"375.67\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" class=\"\">本层采取的动作</text><rect x=\"640\" y=\"318\" width=\"720\" height=\"86\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1000\" y=\"363.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#46585F\" font-weight=\"400\" class=\"\">整段有序就直接返回；这是 PostgreSQL 在 2006 年讨论后加上的改造。</text><path d=\"M28 361 L40 361\" fill=\"none\" stroke=\"#89938F\" stroke-width=\"1.2\" stroke-linejoin=\"miter\"/></svg>","ctrl":"","anim":false},{"eyebrow":"07 · 枢轴 · 动画｜坏枢轴的代价","title":"坏枢轴到底贵在哪：比较次数与递归深度","lede":"拖动 n、换输入分布，脚本会真的跑一遍分区排序，把三种枢轴策略的比较次数和递归深度算给你看。","caption":"图 07　柱高按本轮模拟的最大比较次数归一化；所有读数由页面内脚本实时模拟计算，不是实测基准数据。","bridge":"既然坏分区的代价这么具体，源码里还有一条专门针对「递归栈」的改造，我们接着看。","notes":"这一页的数字是现场算出来的，不是我编的。页面里有一个真实的模拟排序器：你拖动 n，选择输入分布是已排序、随机还是大量重复，它会用三种枢轴策略分别把数组排一遍——总是取最小值这个最坏策略、三点取中、以及每次都取真实中位数这个理想策略——统计实际发生的比较次数和最大递归深度，再画成三根柱子。建议这样试：先把分布放在「已排序」，把 n 从 64 拖到 512，会看到最坏策略那根柱子长得特别快，因为它每轮只把规模减一，比较次数按 n 平方增长，递归深度也接近 n；三点取中在已排序输入上表现很好，因为头中尾的中位值恰好接近真中位数；理想策略则给出接近 n log n 的下界参照。再切到「大量重复」，你会看到等值归位把所有策略的柱高都压下来，这就是上一页那条工程规则的价值。这里要强调两点：第一，这些是教学用的模拟计数，不是 PostgreSQL 的 benchmark，绝对数字不能拿来做容量规划；第二，ninther 和三点取中都是降低遇到坏枢轴的概率，它们没有给出最坏时间的硬上界，这一点跟 Musser 的 introsort 有本质区别，我们后面还会回来讲。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><g id=\"animB\"></g></svg>","ctrl":"<label for=\"bN\">规模 n</label><input id=\"bN\" type=\"range\" min=\"64\" max=\"512\" step=\"16\" value=\"256\" style=\"width:170px\"><label for=\"bDist\">输入分布</label><select id=\"bDist\"><option value=\"sorted\" selected>已排序（最坏策略最吃亏）</option><option value=\"random\">随机（固定种子）</option><option value=\"dup\">大量重复 key</option></select><button class=\"btn play\" id=\"bPlay\">▶ 播放</button><button class=\"btn\" id=\"bTick\">单步 →</button><button class=\"btn\" id=\"bReset\">↺ 重置</button><span class=\"out\" id=\"bOut\"></span>","anim":true},{"eyebrow":"08 · 栈深｜只递归较小分区","title":"把递归深度按进 ⌈log₂ n⌉，是线上稳定性的要求","lede":"两条分区都要处理，但只把较小的那条压进递归栈，较大的那条用循环原地继续。","caption":"图 08　左边是两边都递归的瘦长栈，右边是 PostgreSQL 的写法：每轮只压入不超过一半的那块。","bridge":"算法骨架讲完了。现在把它放回 PostgreSQL：同一份骨架，怎么变成五个不同的入口？","notes":"sort_template.h 里有一段注释我特别喜欢，因为它把「工程判断」写得很诚实。原文大意是：Bentley 和 McIlroy 明确拒绝过「只递归较小分区」这个做法，理由是「不值得费这个劲」；但 PostgreSQL 这边在线上见过因为栈溢出导致的崩溃，所以认为那个判断是错的。具体实现是：分区结束后比较左右两块的大小，对较小的那块调用 DO_SORT 递归，对较大的那块直接改指针和长度，goto loop 回到函数开头继续。因为被压栈的那块一定不超过当前规模的一半，递归层数就不会超过 log₂ n。这跟上一页的模拟正好接上：坏枢轴会让比较次数变多，是性能问题；但如果不做这个改造，坏枢轴还会让栈深度变长，是稳定性问题。数据库是不能随便崩的进程，所以后者往往比前者更要命。当然也要说清楚边界：这个改造管的是栈深度，不是时间复杂度。PostgreSQL 用预排序检测、等值归位、ninther 枢轴这些手段把常见坏情况压下去，但它没有「递归深度超过阈值就切 heapsort」这种理论兜底，最坏 O(n²) 依然留在那里。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40\" y=\"24\" width=\"640\" height=\"54\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\"/><text x=\"360\" y=\"53.66\" text-anchor=\"middle\" font-size=\"19\" fill=\"#BE653B\" font-weight=\"700\" class=\"serif\">两边都递归 · 教科书式写法</text><rect x=\"40\" y=\"100\" width=\"160\" height=\"268\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"120\" y=\"196.66\" text-anchor=\"middle\" font-size=\"15\" fill=\"#BE653B\" font-weight=\"600\" class=\"\">枢轴长期偏一端</text><text x=\"120\" y=\"215.42\" text-anchor=\"middle\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">分区变成</text><text x=\"120\" y=\"238.02\" text-anchor=\"middle\" font-size=\"19\" fill=\"#BE653B\" font-weight=\"700\" class=\"mono\">1 : n-1</text><text x=\"120\" y=\"258.94\" text-anchor=\"middle\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">递归深度趋近 n</text><text x=\"120\" y=\"276.62\" text-anchor=\"middle\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">栈可能溢出</text><rect x=\"220\" y=\"100\" width=\"280\" height=\"44\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\"/><text x=\"360\" y=\"124.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#46585F\" font-weight=\"400\" class=\"\">递归第 1 层</text><path d=\"M360 144 L360 156\" fill=\"none\" stroke=\"#BE653B\" stroke-width=\"1.3\" stroke-linejoin=\"miter\"/><polygon points=\"356,148 360,156 364,148\" fill=\"#BE653B\"/><rect x=\"220\" y=\"156\" width=\"280\" height=\"44\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\"/><text x=\"360\" y=\"180.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#46585F\" font-weight=\"400\" class=\"\">递归第 2 层</text><path d=\"M360 200 L360 212\" fill=\"none\" stroke=\"#BE653B\" stroke-width=\"1.3\" stroke-linejoin=\"miter\"/><polygon points=\"356,204 360,212 364,204\" fill=\"#BE653B\"/><rect x=\"220\" y=\"212\" width=\"280\" height=\"44\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\"/><text x=\"360\" y=\"236.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#46585F\" font-weight=\"400\" class=\"\">递归第 3 层</text><path d=\"M360 256 L360 268\" fill=\"none\" stroke=\"#BE653B\" stroke-width=\"1.3\" stroke-linejoin=\"miter\"/><polygon points=\"356,260 360,268 364,260\" fill=\"#BE653B\"/><rect x=\"220\" y=\"268\" width=\"280\" height=\"44\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\"/><text x=\"360\" y=\"292.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#46585F\" font-weight=\"400\" class=\"\">递归第 4 层</text><path d=\"M360 312 L360 324\" fill=\"none\" stroke=\"#BE653B\" stroke-width=\"1.3\" stroke-linejoin=\"miter\"/><polygon points=\"356,316 360,324 364,316\" fill=\"#BE653B\"/><rect x=\"220\" y=\"324\" width=\"280\" height=\"44\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"360\" y=\"348.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#46585F\" font-weight=\"400\" class=\"\">递归第 5 层</text><text x=\"360\" y=\"392\" text-anchor=\"middle\" font-size=\"13\" fill=\"#89938F\" font-weight=\"400\" class=\"\">… 还可能继续往下</text><rect x=\"720\" y=\"24\" width=\"640\" height=\"54\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\"/><text x=\"1040\" y=\"53.66\" text-anchor=\"middle\" font-size=\"19\" fill=\"#2F7A66\" font-weight=\"700\" class=\"serif\">只递归较小分区 · 大分区 goto loop</text><rect x=\"720\" y=\"100\" width=\"640\" height=\"90\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#2F7A66\" stroke-width=\"1\"/><text x=\"1040\" y=\"139.38\" text-anchor=\"middle\" font-size=\"23\" fill=\"#2F7A66\" font-weight=\"700\" class=\"serif\">递归栈最多 ⌈log₂ n⌉ 层</text><text x=\"1040\" y=\"162.46\" text-anchor=\"middle\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">源码注释：现场见过 stack overrun，才改成这个写法</text><rect x=\"720\" y=\"210\" width=\"310\" height=\"80\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\"/><text x=\"875\" y=\"243.54\" text-anchor=\"middle\" font-size=\"17\" fill=\"#2F7A66\" font-weight=\"700\" class=\"serif\">较小分区</text><text x=\"875\" y=\"263.38\" text-anchor=\"middle\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">DO_SORT() 压栈递归</text><rect x=\"1050\" y=\"210\" width=\"310\" height=\"80\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\"/><text x=\"1205\" y=\"243.54\" text-anchor=\"middle\" font-size=\"17\" fill=\"#245A6B\" font-weight=\"700\" class=\"serif\">较大分区</text><text x=\"1205\" y=\"263.38\" text-anchor=\"middle\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">goto loop 原地循环</text><rect x=\"720\" y=\"310\" width=\"640\" height=\"80\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1040\" y=\"343.4\" text-anchor=\"middle\" font-size=\"16\" fill=\"#1B2B33\" font-weight=\"500\" class=\"\">每轮只把「不超过一半」的那块压栈，剩下的那块不新增栈帧</text><text x=\"1040\" y=\"362.7\" text-anchor=\"middle\" font-size=\"13\" fill=\"#89938F\" font-weight=\"400\" class=\"\">代价是理论最坏 O(n²) 依然存在，但线上不会再因栈深而崩</text><path d=\"M1040 190 L1040 200 L875 200 L1205 200\" fill=\"none\" stroke=\"#2F7A66\" stroke-width=\"1.5\" stroke-linejoin=\"miter\"/><path d=\"M875 200 L875 210\" fill=\"none\" stroke=\"#2F7A66\" stroke-width=\"1.4\" stroke-linejoin=\"miter\"/><polygon points=\"871,202 875,210 879,202\" fill=\"#2F7A66\"/><path d=\"M1205 200 L1205 210\" fill=\"none\" stroke=\"#2F7A66\" stroke-width=\"1.4\" stroke-linejoin=\"miter\"/><polygon points=\"1201,202 1205,210 1209,202\" fill=\"#2F7A66\"/></svg>","ctrl":"","anim":false},{"eyebrow":"09 · 模板｜一份骨架，五个入口","title":"C 预处理宏代替 C++ 模板","lede":"调用方在 #include 之前定义好宏，同一份 sort_template.h 就生成不同元素类型、不同比较器、不同中断行为的排序函数。","caption":"图 09　一份算法骨架通过宏实例化出五个入口；绿色两个是 tuplesort.c 直接服务于执行器的实例。","bridge":"五个入口里，真正服务执行器的是 tuplesort.c 里那两个。它们的差别不在算法，在比较表达式。","notes":"PostgreSQL 是 C 项目，没有 C++ 模板，但它照样做到了「算法只有一份」。做法是在包含 sort_template.h 之前，先把一串宏定义好：ST_SORT 决定生成出来的函数叫什么名字，ST_ELEMENT_TYPE 或者 ST_ELEMENT_TYPE_VOID 决定元素类型，ST_COMPARE、ST_COMPARE_RUNTIME_POINTER、ST_COMPARE_ARG_TYPE 决定比较逻辑和是否要传额外上下文，ST_CHECK_FOR_INTERRUPTS 决定循环里要不要检查中断。头文件被包含一次，就实例化出一个专用函数。源码里实际有五个入口：src/port/qsort.c 生成 pg_qsort，是自带的通用 qsort 兼容入口；qsort_arg.c 生成 qsort_arg，比较器可以带一个 void *arg；qsort_interruptible.c 生成 qsort_interruptible，长排序可以响应取消；tuplesort.c 里连续包含两次，生成 qsort_tuple 和 qsort_ssup。这么绕一圈图什么？图的是把函数指针、元素大小、上下文参数这些在热点路径上的间接开销，尽量在编译期消掉，同时实现只维护一份。你可以把它理解成：算法骨架不动，把「怎么比」和「比的是什么」当成参数插进去。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"470\" y=\"20\" width=\"460\" height=\"72\" rx=\"0\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1\"/><text x=\"700\" y=\"49.68\" text-anchor=\"middle\" font-size=\"18\" fill=\"#FFFFFF\" font-weight=\"600\" class=\"mono\">src/include/lib/sort_template.h</text><text x=\"700\" y=\"70.06\" text-anchor=\"middle\" font-size=\"13\" fill=\"#CFE0DC\" font-weight=\"400\" class=\"\">同一份 Bentley–McIlroy 风格排序骨架</text><rect x=\"470\" y=\"100\" width=\"460\" height=\"86\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\"/><text x=\"700\" y=\"125.92\" text-anchor=\"middle\" font-size=\"14\" fill=\"#1B2B33\" font-weight=\"400\" class=\"mono\">宏：ST_SORT / ST_ELEMENT_TYPE</text><text x=\"700\" y=\"144.96\" text-anchor=\"middle\" font-size=\"14\" fill=\"#1B2B33\" 336.68\" text-anchor=\"middle\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">长排序可响应取消</text><text x=\"700\" y=\"353.54\" text-anchor=\"middle\" font-size=\"12\" fill=\"#89938F\" font-weight=\"400\" class=\"\">宏实例化</text><rect x=\"840\" y=\"250\" width=\"240\" height=\"150\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.6\"/><text x=\"960\" y=\"302.28\" text-anchor=\"middle\" font-size=\"15\" fill=\"#245A6B\" font-weight=\"700\" class=\"mono\">qsort_tuple</text><text x=\"960\" y=\"319.81\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"400\" class=\"mono\">tuplesort.c</text><text x=\"960\" y=\"336.68\" text-anchor=\"middle\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">SortTuple + comparetup</text><text x=\"960\" y=\"353.54\" text-anchor=\"middle\" font-size=\"12\" fill=\"#2F7A66\" font-weight=\"400\" class=\"\">宏实例化</text><rect x=\"1100\" y=\"250\" width=\"240\" height=\"150\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.6\"/><text x=\"1220\" y=\"302.28\" text-anchor=\"middle\" font-size=\"15\" fill=\"#245A6B\" font-weight=\"700\" class=\"mono\">qsort_ssup</text><text x=\"1220\" y=\"319.81\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"400\" class=\"mono\">tuplesort.c</text><text x=\"1220\" y=\"336.68\" text-anchor=\"middle\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">单 key SortSupport 快路径</text><text x=\"1220\" y=\"353.54\" text-anchor=\"middle\" font-size=\"12\" fill=\"#2F7A66\" font-weight=\"400\" class=\"\">宏实例化</text><path d=\"M700 186 L700 214 L180 214 L1220 214\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"/><path d=\"M180 214 L180 250\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.4\" stroke-linejoin=\"miter\"/><polygon points=\"176,242 180,250 184,242\" fill=\"#245A6B\"/><path d=\"M440 214 L440 250\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.4\" stroke-linejoin=\"miter\"/><polygon points=\"436,242 440,250 444,242\" fill=\"#245A6B\"/><path d=\"M700 214 L700 250\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.4\" stroke-linejoin=\"miter\"/><polygon points=\"696,242 700,250 704,242\" fill=\"#245A6B\"/><path d=\"M960 214 L960 250\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.4\" stroke-linejoin=\"miter\"/><polygon points=\"956,242 960,250 964,242\" fill=\"#245A6B\"/><path d=\"M1220 214 L1220 250\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.4\" stroke-linejoin=\"miter\"/><polygon points=\"1216,242 1220,250 1224,242\" fill=\"#245A6B\"/></svg>","ctrl":"","anim":false},{"eyebrow":"10 · 入口｜qsort_tuple 与 qsort_ssup","title":"同一套分区代码，只替换「怎么比」","lede":"qsort_tuple 用运行期传入的 comparetup；qsort_ssup 把比较压成编译期固定的 ApplySortComparator 表达式。","caption":"图 10　两个实例的分工：上排照顾全部排序语义，下排只在单 key 场景下启用，省掉一层通用比较间接。","bridge":"但即使比较器选对了，也不代表一定会用 quicksort。决定权在 tuplesort 的状态机手里。","notes":"把 tuplesort.c 里那两段宏摊开看，差别特别清楚。qsort_tuple 定义的是 ST_SORT 为 qsort_tuple，元素类型是 SortTuple，用 ST_COMPARE_RUNTIME_POINTER，比较器参数类型是 Tuplesortstate，还打开了 ST_CHECK_FOR_INTERRUPTS。也就是说，它在运行期拿到 comparetup 函数指针，什么都能排：多列、升降序、NULLS FIRST/LAST、collation、tie-break，都由那个比较函数处理。qsort_ssup 则把 ST_COMPARE 直接写成一段宏：ApplySortComparator((a)->datum1, (a)->isnull1, (b)->datum1, (b)->isnull1, (ssup))，参数类型是 SortSupportData。这段表达式在编译期就固定了，不用每次比较都绕一层通用分发。源码注释说得很准：qsort_ssup 专门用于 comparetup 可以退化成 ApplySortComparator 的情形，也就是单 key 的 MinimalTuple 排序和 Datum 排序。所以这两个入口不是「两个快速排序算法」，而是同一个算法配两种比较成本。理解这一点，下一页那个判定树就好懂了：执行器先问的不是「用哪个算法」，而是「这批元素能不能走更便宜的比较路径」。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40\" y=\"30\" width=\"300\" height=\"170\" rx=\"0\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1\"/><text x=\"190\" y=\"99.04\" text-anchor=\"middle\" font-size=\"22\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"mono\">qsort_tuple</text><text x=\"190\" y=\"123.22\" text-anchor=\"middle\" font-size=\"15\" fill=\"#CFE0DC\" font-weight=\"400\" class=\"\">通用路径</text><text x=\"190\" y=\"141.98\" text-anchor=\"middle\" font-size=\"13\" fill=\"#CFE0DC\" font-weight=\"400\" class=\"\">任何 SortTuple 变体</text><rect x=\"350\" y=\"30\" width=\"520\" height=\"170\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"610\" y=\"98.74\" text-anchor=\"middle\" font-size=\"15\" fill=\"#245A6B\" font-weight=\"600\" class=\"mono\">ST_COMPARE_RUNTIME_POINTER</text><text x=\"610\" y=\"118.32\" text-anchor=\"middle\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" class=\"\">运行期把 comparetup() 当函数指针传进来</text><text x=\"610\" y=\"136.54\" text-anchor=\"middle\" font-size=\"13\" fill=\"#89938F\" font-weight=\"400\" class=\"\">还带着 Tuplesortstate 上下文</text><rect x=\"880\" y=\"30\" width=\"480\" height=\"170\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\"/><text x=\"1120\" y=\"99.16\" text-anchor=\"middle\" font-size=\"18\" fill=\"#245A6B\" font-weight=\"700\" class=\"serif\">要照顾的语义</text><text x=\"1120\" y=\"119.95\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">多列 key · 升序降序 · NULLS FIRST/LAST</text><text x=\"1120\" y=\"138.31\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">collation · opclass · tie-break</text><rect x=\"40\" y=\"220\" width=\"300\" height=\"170\" rx=\"0\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1\"/><text x=\"190\" y=\"289.04\" text-anchor=\"middle\" font-size=\"22\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"mono\">qsort_ssup</text><text x=\"190\" y=\"313.22\" text-anchor=\"middle\" font-size=\"15\" fill=\"#CFE0DC\" font-weight=\"400\" class=\"\">单 key 快路径</text><text x=\"190\" y=\"331.98\" text-anchor=\"middle\" font-size=\"13\" fill=\"#CFE0DC\" font-weight=\"400\" class=\"\">onlyKey != NULL 时启用</text><rect x=\"350\" y=\"220\" width=\"520\" height=\"170\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"610\" y=\"289.08\" text-anchor=\"middle\" font-size=\"15\" fill=\"#2F7A66\" font-weight=\"600\" class=\"mono\">ST_COMPARE(a, b, ssup) 宏</text><text x=\"610\" y=\"308.25\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">ApplySortComparator(datum1, isnull1, …)</text><text x=\"610\" y=\"326.2\" text-anchor=\"middle\" font-size=\"13\" fill=\"#89938F\" font-weight=\"400\" class=\"\">比较表达式在编译期就固定下来</text><rect x=\"880\" y=\"220\" width=\"480\" height=\"170\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\"/><text x=\"1120\" y=\"289.16\" text-anchor=\"middle\" font-size=\"18\" fill=\"#2F7A66\" font-weight=\"700\" class=\"serif\">省掉的层次</text><text x=\"1120\" y=\"309.95\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">MinimalTuple / Datum 单列排序</text><text x=\"1120\" y=\"328.31\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">少一层通用比较与函数指针间接</text></svg>","ctrl":"","anim":false},{"eyebrow":"11 · 状态机｜quicksort 的边界","title":"三条路，只有两条半用到 quicksort","lede":"TSS_INITIAL、TSS_BOUNDED、TSS_BUILDRUNS、TSS_SORTEDINMEM、TSS_SORTEDONTAPE、TSS_FINALMERGE —— 六个状态，三种命运。","caption":"图 11　tuplesort 的三条主路径。陶橙框是 quicksort / radix 参与的位置；绿色那条完全走堆，不做完整快排。","bridge":"先看第一条路：一批内存元素摆在你面前，执行器到底凭什么选 quicksort、radix 还是 qsort_ssup？","notes":"tuplesort 的状态枚举就在 tuplesort.c 里，一共六个：TSS_INITIAL 是输入还在内存数组里累积；TSS_BOUNDED 是 Top-N 的 bounded heap；TSS_BUILDRUNS 是内存放不下、正在生成外部排序的 run；TSS_SORTEDINMEM 是内存排序完成；TSS_SORTEDONTAPE 是最终结果冻结在 tape 上；TSS_FINALMERGE 是边读边做最后一轮归并。我把它们整理成三条路。第一条内存路：INITIAL 收满输入，performsort 时调用 tuplesort_sort_memtuples 用 quicksort 或 radix 排好，进 SORTEDINMEM，顺序扫数组返回。第二条 Top-N 路：set_bound 给出 hint，输入多到一定程度切到 BOUNDED，堆里只留 N 个候选，最后 sort_bounded_heap 输出，这条路根本不做完整快排。第三条外部路：LACKMEM 时进 BUILDRUNS，dumptuples 每次把一批内存元素排好写成一个 run，最后做 FINALMERGE 或者冻结成 SORTEDONTAPE。所以 quicksort 的边界非常清楚：它只回答「内存中这一批 memtuples[] 怎么排好」。没超 work_mem，排序到此结束；超了，它只是 run generation 的第一步，后面还有归并。","svg":"<s
