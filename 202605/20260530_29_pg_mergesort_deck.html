=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1018\" y=\"310.89\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">通常不落盘</text><rect x=\"1132\" y=\"280\" width=\"228\" height=\"58\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1246\" y=\"310.89\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">可能随机访问 heap</text><rect x=\"40\" y=\"346\" width=\"170\" height=\"58\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"125\" y=\"376.89\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"600\" class=\"\">适合场景</text><rect x=\"220\" y=\"346\" width=\"228\" height=\"58\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"334\" y=\"376.89\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">大排序 / 索引构建</text><rect x=\"448\" y=\"346\" width=\"228\" height=\"58\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"562\" y=\"376.89\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">中小排序 / run 生成</text><rect x=\"676\" y=\"346\" width=\"228\" height=\"58\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"790\" y=\"376.89\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">整数 leading key</text><rect x=\"904\" y=\"346\" width=\"228\" height=\"58\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1018\" y=\"376.89\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">ORDER BY ... LIMIT</text><rect x=\"1132\" y=\"346\" width=\"228\" height=\"58\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1246\" y=\"376.89\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">只取少量行</text></svg>","ctrl":"","anim":false},{"eyebrow":"并发 · 并行排序","title":"work_mem 要乘上倍数","lede":"每个 worker 有自己的 Tuplesortstate；资源限制按每个 worker 分别应用。","caption":"图 19　worker 各自产 run、leader 接管 tapes 做最终 merge；右侧为内存峰值倍数示意","bridge":"道理讲完了，接下来全部落到可复现的实验和可执行动作。","notes":"tuplesort.h 对并行排序的调用顺序有专门说明：每个 worker 有自己的 Tuplesortstate，处理自己的输入分片，最终各自保证产生一条输出 run；leader 接管 worker 的 tapes，把它们拼成统一的 logical tapeset，执行最终 merge。观察并行排序时有个坑——tuplesort_get_stats() 只报告某个 worker 或 leader 自己的角色，不一定等于整个并行排序的总资源消耗。更关键的是内存：PostgreSQL 官方文档明确写，复杂查询可能同时执行多个 sort 和 hash 操作，每个操作都能用到 work_mem；多个会话还会并发；并行查询里资源限制按每个 worker 分别应用，4 个 worker 的查询可能用掉 5 倍的资源。所以 work_mem = 128MB 看着不大，乘上计划里的多个排序／哈希节点，再乘并行 worker 和并发会话，峰值可能很快失控。这也是我反对「看到 Disk 就全局调大 work_mem」的根本原因——你解决的是一个会话的落盘，制造的是整个实例的内存风险。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40\" y=\"40\" width=\"300\" height=\"110\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\"/><text x=\"190\" y=\"79.7\" text-anchor=\"middle\" font-size=\"17\" fill=\"#245A6B\" font-weight=\"700\" class=\"mono\">worker 1</text><text x=\"190\" y=\"99.54\" text-anchor=\"middle\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">自己的 Tuplesortstate</text><text x=\"190\" y=\"117.22\" text-anchor=\"middle\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">处理输入分片 → 1 条 run</text><rect x=\"40\" y=\"170\" width=\"300\" height=\"110\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\"/><text x=\"190\" y=\"209.7\" text-anchor=\"middle\" font-size=\"17\" fill=\"#245A6B\" font-weight=\"700\" class=\"mono\">worker 2</text><text x=\"190\" y=\"229.54\" text-anchor=\"middle\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">自己的 Tuplesortstate</text><text x=\"190\" y=\"247.22\" text-anchor=\"middle\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">处理输入分片 → 1 条 run</text><rect x=\"40\" y=\"300\" width=\"300\" height=\"110\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\"/><text x=\"190\" y=\"339.7\" text-anchor=\"middle\" font-size=\"17\" fill=\"#245A6B\" font-weight=\"700\" class=\"mono\">worker 3</text><text x=\"190\" y=\"359.54\" text-anchor=\"middle\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">自己的 Tuplesortstate</text><text x=\"190\" y=\"377.22\" text-anchor=\"middle\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">处理输入分片 → 1 条 run</text><path d=\"M340 95 L410 95 L410 220\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.4\" stroke-linejoin=\"miter\"/><path d=\"M340 225 L410 225\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.4\" stroke-linejoin=\"miter\"/><path d=\"M340 355 L410 355 L410 220\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.4\" stroke-linejoin=\"miter\"/><path d=\"M410 220 L440 220\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"/><polygon points=\"432,216 440,220 432,224\" fill=\"#245A6B\"/><rect x=\"440\" y=\"130\" width=\"340\" height=\"180\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.6\"/><text x=\"610\" y=\"194.78\" text-anchor=\"middle\" font-size=\"19\" fill=\"#BE653B\" font-weight=\"700\" class=\"mono\">leader</text><text x=\"610\" y=\"216.52\" text-anchor=\"middle\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" class=\"\">接管 worker 的 tapes</text><text x=\"610\" y=\"234.74\" text-anchor=\"middle\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">拼成统一 logical tapeset</text><text x=\"610\" y=\"253.24\" text-anchor=\"middle\" font-size=\"14\" fill=\"#2F7A66\" font-weight=\"600\" class=\"\">执行最终 merge</text><rect x=\"820\" y=\"40\" width=\"540\" height=\"250\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.4\"/><text x=\"1090\" y=\"130.94\" text-anchor=\"middle\" font-size=\"19\" fill=\"#AE8A3E\" font-weight=\"700\" class=\"serif\">work_mem 的倍数陷阱</text><text x=\"1090\" y=\"152.27\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">一个计划可同时有多个 Sort / Hash 节点</text><text x=\"1090\" y=\"170.63\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">每个节点都按 work_mem 拿预算</text><text x=\"1090\" y=\"188.99\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">并行 worker 各自再拿一份</text><text x=\"1090\" y=\"207.35\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">并发会话继续叠乘</text><rect x=\"820\" y=\"310\" width=\"540\" height=\"100\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1090\" y=\"353.46\" text-anchor=\"middle\" font-size=\"14\" fill=\"#1B2B33\" font-weight=\"600\" class=\"mono\">峰值 ≈ work_mem × 节点数 × (1 + worker 数) × 并发会话数</text><text x=\"1090\" y=\"371.27\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">官方文档：资源限制按每个 worker 分别应用</text></svg>","ctrl":"","anim":false},{"eyebrow":"实证 · 最小可验证实验","title":"六步，自己把它跑出来","lede":"从造数、压内存、加 LIMIT、建索引到打开诊断日志，每一步都有明确的观察目标。","caption":"图 20　可复现实验脚本的六个步骤与预期观察点；本文未在本机执行，不含实测输出","bridge":"跑完实验，还得会算账：CPU、I/O、内存、临时空间分别怎么估。","notes":"这一页给的是复现路径，不是结果。第一步用 generate_series 造一百万行，paid_at 带时间偏移、payload 用 md5 撑起行宽，然后 ANALYZE。第二步把 work_mem 设为 1MB 再 EXPLAIN (ANALYZE, BUFFERS) 全量排序，重点看 Sort 节点是不是 external merge Disk。第三步把 work_mem 提到 256MB 再跑同一句，看能不能变成 quicksort Memory。第四步加 LIMIT 100，看是不是 top-N heapsort——它不是归并排序，说明 LIMIT 改变了问题本身。第五步建 (paid_at, id) 复合索引，看计划会不会变成 Index Scan 而不再出现 Sort 节点。第六步会话级打开 client_min_messages、trace_sort、log_temp_files = 0，看排序过程日志和临时文件记录。这里必须说清楚：原文没有在本机启动 PostgreSQL 执行这些 SQL，所有输出都只是 PostgreSQL 的真实输出格式，不是伪造的实测结果；实际是否从外部归并变成内存排序，取决于版本、行宽、并发、配置和执行环境。log_temp_files = 0 生产上要谨慎，建议只在会话级、短时间诊断。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40\" y=\"26\" width=\"420\" height=\"158\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.3\"/><text x=\"250\" y=\"81.88\" text-anchor=\"middle\" font-size=\"17\" fill=\"#245A6B\" font-weight=\"700\" class=\"serif\">① 造数</text><text x=\"250\" y=\"101.31\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">generate_series(1, 1000000)</text><text x=\"250\" y=\"118.31\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">md5(g::text) AS payload</text><text x=\"250\" y=\"135.31\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" class=\"\">目标：撑起行宽</text><rect x=\"490\" y=\"26\" width=\"420\" height=\"158\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.3\"/><text x=\"700\" y=\"81.88\" text-anchor=\"middle\" font-size=\"17\" fill=\"#BE653B\" font-weight=\"700\" class=\"serif\">② 压内存</text><text x=\"700\" y=\"101.31\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">SET work_mem = 1MB</text><text x=\"700\" y=\"118.31\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">EXPLAIN (ANALYZE, BUFFERS)</text><text x=\"700\" y=\"135.31\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" class=\"\">目标：external merge　Disk</text><rect x=\"940\" y=\"26\" width=\"420\" height=\"158\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.3\"/><text x=\"1150\" y=\"81.88\" text-anchor=\"middle\" font-size=\"17\" fill=\"#2F7A66\" font-weight=\"700\" class=\"serif\">③ 放大内存</text><text x=\"1150\" y=\"101.31\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">SET work_mem = 256MB</text><text x=\"1150\" y=\"118.31\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">同一句 SQL 重跑</text><text x=\"1150\" y=\"135.31\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" class=\"\">目标：quicksort　Memory</text><rect x=\"40\" y=\"208\" width=\"420\" height=\"158\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.3\"/><text x=\"250\" y=\"263.88\" text-anchor=\"middle\" font-size=\"17\" fill=\"#AE8A3E\" font-weight=\"700\" class=\"serif\">④ 加 LIMIT</text><text x=\"250\" y=\"283.31\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">ORDER BY paid_at, id</text><text x=\"250\" y=\"300.31\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">LIMIT 100</text><text x=\"250\" y=\"317.31\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" class=\"\">目标：top-N heapsort</text><rect x=\"490\" y=\"208\" width=\"420\" height=\"158\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.3\"/><text x=\"700\" y=\"263.88\" text-anchor=\"middle\" font-size=\"17\" fill=\"#245A6B\" font-weight=\"700\" class=\"serif\">⑤ 建索引</text><text x=\"700\" y=\"283.31\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">CREATE INDEX (paid_at, id)</text><text x=\"700\" y=\"300.31\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">再跑同一句</text><text x=\"700\" y=\"317.31\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" class=\"\">目标：Index Scan，无 Sort</text><rect x=\"940\" y=\"208\" width=\"420\" height=\"158\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.3\"/><text x=\"1150\" y=\"263.88\" text-anchor=\"middle\" font-size=\"17\" fill=\"#BE653B\" font-weight=\"700\" class=\"serif\">⑥ 开诊断</text><text x=\"1150\" y=\"283.31\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">trace_sort = on</text><text x=\"1150\" y=\"300.31\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">log_temp_files = 0</text><text x=\"1150\" y=\"317.31\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" class=\"\">目标：过程日志与临时文件</text><rect x=\"40\" y=\"376\" width=\"1320\" height=\"50\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"700\" y=\"403.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#BE653B\" font-weight=\"600\" class=\"serif\">诚实声明：本文未在本机启动 PostgreSQL 执行这些 SQL；输出仅示意真实格式，不含实测结果</text></svg>","ctrl":"","anim":false},{"eyebrow":"算账 · cost_tuplesort()","title":"代价要量化地看","lede":"完整排序约 N log₂ N 次比较，bounded 约 N log₂ K；磁盘流量按 merge pass 计。","caption":"图 21　CPU / I/O / 内存 / 临时空间四项代价的估算口径与对应配置","bridge":"有了这四笔账，最佳实践才不是空话。","notes":"优化器自己是怎么估的？cost_tuplesort() 里，内存完整排序按约 N log₂ N 次比较计；bounded heap-sort 按 N log₂ K 次比较计，这就是 LIMIT 能大幅压低估算的原因；磁盘排序会算 run 数、merge order 和 log_M(r) 个 merge pass，页面访问数约 2 × npages × log_runs，并且粗略假设四分之三顺序、四分之一随机。这些是估算口径，不是实测计时器，但足以解释规划器为什么在小 LIMIT 下偏爱有序索引路径。内存那笔账前面说过：work_mem 是「每个排序操作」的上限近似值，不是整条 SQL 的预算。临时空间那笔账则有两个抓手——temp_file_limit 限制单进程临时文件占用，它不能让慢查询变快，但能防止一个会话把临时空间耗尽；log_temp_files 记录超过阈值的临时文件。反过来，归并这边的三个收益也要量化地认：能处理远大于内存的数据、预读让 I/O 尽量顺序、FINALMERGE 省掉最后一轮物化。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40\" y=\"30\" width=\"315\" height=\"230\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.4\"/><text x=\"197.5\" y=\"120.12\" text-anchor=\"middle\" font-size=\"19\" fill=\"#245A6B\" font-weight=\"700\" class=\"serif\">CPU</text><text x=\"197.5\" y=\"141.45\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">完整排序 N log₂ N</text><text x=\"197.5\" y=\"159.81\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">bounded N log₂ K</text><text x=\"197.5\" y=\"178.17\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">cost_tuplesort()</text><rect x=\"375\" y=\"30\" width=\"315\" height=\"230\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.4\"/><text x=\"532.5\" y=\"120.12\" text-anchor=\"middle\" font-size=\"19\" fill=\"#BE653B\" font-weight=\"700\" class=\"serif\">I/O</text><text x=\"532.5\" y=\"141.45\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">2 × npages × log_M(r)</text><text x=\"532.5\" y=\"159.81\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">3/4 顺序 + 1/4 随机</text><text x=\"532.5\" y=\"178.17\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">每个 pass 读写一遍</text><rect x=\"710\" y=\"30\" width=\"315\" height=\"230\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.4\"/><text x=\"867.5\" y=\"120.12\" text-anchor=\"middle\" font-size=\"19\" fill=\"#AE8A3E\" font-weight=\"700\" class=\"serif\">内存</text><text x=\"867.5\" y=\"141.45\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">work_mem 是「每操作」上限</text><text x=\"867.5\" y=\"159.81\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">多节点 × worker × 会话</text><text x=\"867.5\" y=\"178.17\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">hash 另有 multiplier</text><rect x=\"1045\" y=\"30\" width=\"315\" height=\"230\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.4\"/><text x=\"1202.5\" y=\"120.12\" text-anchor=\"middle\" font-size=\"19\" fill=\"#2F7A66\" font-weight=\"700\" class=\"serif\">临时空间</text><text x=\"1202.5\" y=\"141.45\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">temp_file_limit 设边界</text><text x=\"1202.5\" y=\"159.81\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">log_temp_files 记录</text><text x=\"1202.5\" y=\"178.17\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">temp_tablespaces 定盘</text><rect x=\"40\" y=\"280\" width=\"1320\" height=\"70\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"700\" y=\"307.86\" text-anchor=\"middle\" font-size=\"17\" fill=\"#2F7A66\" font-weight=\"700\" class=\"serif\">归并侧的三个收益</text><text x=\"700\" y=\"328.52\" text-anchor=\"middle\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" class=\"\">能处理远大于内存的数据　·　每条 tape 预读让 I/O 尽量顺序　·　FINALMERGE 省掉最后一轮物化</text><rect x=\"40\" y=\"360\" width=\"1320\" height=\"56\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"700\" y=\"389.96\" text-anchor=\"middle\" font-size=\"14\" fill=\"#89938F\" font-weight=\"400\" class=\"\">估算口径来自源码，不是实测计时器；真实耗时还受版本、行宽、并发、OS cache 与存储介质影响</text></svg>","ctrl":"","anim":false},{"eyebrow":"落地 · 三层最佳实践","title":"架构师、DBA、开发者各管一段","lede":"减少排序需求、治理落盘、修正 SQL 语义——这三件事不在同一层，不能互相替代。","caption":"图 22　按角色拆分的可执行动作；绿色为优先动作，陶橙为需要警惕的代价","bridge":"不过最容易踩的，往往是几个看似不起眼的认知坑。","notes":"架构师这一段，核心是「先减少排序需求」：业务若经常 ORDER BY tenant_id, created_at DESC LIMIT 50，就该评估复合 B-tree 能不能同时服务过滤和排序；要区分全量报表排序和交互式 Top-N，前者可能需要批处理窗口与临时空间治理，后者更该用索引顺序或 bounded sort；宽表排序尤其要小心，可以先只排 key 和主键再回表取宽字段，但必须用 EXPLAIN (ANALYZE, BUFFERS) 验证总成本真的降了。DBA 这一段，别把 work_mem 当全局越大越好的参数，用 EXPLAIN 盯 Sort Method 和 Memory/Disk，持续出现大 Disk 再结合 pg_stat_database.temp_files/temp_bytes、log_temp_files 和慢 SQL 定位，给 temp_tablespaces 准备合适的盘，用 temp_file_limit 设边界。开发者这一段，ORDER BY 要和分页方式一起设计：深分页 OFFSET 1000000 LIMIT 50 常常迫使数据库处理大量不会返回的行，keyset pagination 通常更好；相同排序键必须追加确定性 tie-break key，比如 created_at DESC, id DESC，否则分页可能重复或漏行；别以为 LIMIT 一定便宜；少在大结果集上按表达式排序。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40\" y=\"30\" width=\"420\" height=\"310\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.4\"/><text x=\"250\" y=\"141.76\" text-anchor=\"middle\" font-size=\"19\" fill=\"#245A6B\" font-weight=\"700\" class=\"serif\">面向架构师</text><text x=\"250\" y=\"163.09\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">· 先用访问路径减少排序需求</text><text x=\"250\" y=\"181.45\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">· 复合 B-tree 服务过滤 + 排序</text><text x=\"250\" y=\"199.81\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">· 区分全量报表与交互式 Top-N</text><text x=\"250\" y=\"218.17\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">· 宽表可先排 key 再回表</text><text x=\"250\" y=\"236.53\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">· 用 EXPLAIN 验证总成本</text><rect x=\"490\" y=\"30\" width=\"420\" height=\"310\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.4\"/><text x=\"700\" y=\"141.76\" text-anchor=\"middle\" font-size=\"19\" fill=\"#2F7A66\" font-weight=\"700\" class=\"serif\">面向 DBA</text><text x=\"700\" y=\"163.09\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">· 别把 work_mem 当全局越大越好</text><text x=\"700\" y=\"181.45\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">· 盯 Sort Method / Memory / Disk</text><text x=\"700\" y=\"199.81\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">· 结合 temp_bytes、慢 SQL 定位</text><text x=\"700\" y=\"218.17\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">· 给 temp_tablespaces 选合适的盘</text><text x=\"700\" y=\"236.53\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">· 用 temp_file_limit 设边界</text><rect x=\"940\" y=\"30\" width=\"420\" height=\"310\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.4\"/><text x=\"1150\" y=\"141.76\" text-anchor=\"middle\" font-size=\"19\" fill=\"#BE653B\" font-weight=\"700\" class=\"serif\">面向业务开发者</text><text x=\"1150\" y=\"163.09\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">· ORDER BY 与分页方式一起设计</text><text x=\"1150\" y=\"181.45\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">· 深分页改用 keyset pagination</text><text x=\"1150\" y=\"199.81\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">· 相同 key 必须追加 tie-break</text><text x=\"1150\" y=\"218.17\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">· LIMIT 不等于一定便宜</text><text x=\"1150\" y=\"236.53\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">· 少在大结果集上按表达式排序</text><rect x=\"40\" y=\"352\" width=\"1320\" height=\"64\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"700\" y=\"377.4\" text-anchor=\"middle\" font-size=\"16\" fill=\"#BE653B\" font-weight=\"600\" class=\"serif\">顺序不能反：先用访问路径减少排序需求，再谈内存参数，最后才治理临时文件</text><text x=\"700\" y=\"396.7\" text-anchor=\"middle\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">任何改动都要用 EXPLAIN (ANALYZE, BUFFERS) 验证总成本，而不是只看 Sort Method 变没变</text></svg>","ctrl":"","anim":false},{"eyebrow":"避坑 · 六个高频误解","title":"别让排序替业务背锅","lede":"落盘不总是错误，稳定顺序也不是任何算法能替你补上的。","caption":"图 23　六个常见坑与纠正；底部为「适合 / 不适合交给外部归并硬扛」的分界","bridge":"最后把整条因果链收起来，留几个值得继续追问的问题。","notes":"六个坑，一个一个说。第一，把 external merge 理解成「数据库用 mergesort 排内存数组」——错，run 内部通常是 quicksort 或 radix sort。第二，只看 work_mem，不看并发倍数——一个计划多个节点、并行 worker、并发会话会叠乘。第三，看到 Disk 就盲目加内存——低频批处理、维护任务、一次性报表落盘完全可以接受，真正要治理的是高频、长尾、阻塞业务链路的排序。第四，忽略行宽——同样一百万行，排三列整数和排一列大 JSONB 完全不是一回事。第五，没有确定性排序键——created_at 大量重复时 ORDER BY created_at DESC LIMIT 50 不保证稳定分页，归并、quicksort、索引扫描都补不上缺失的业务语义。第六，把 log_temp_files 当永久全量审计——繁忙系统会写爆日志，建议会话级或设合理阈值。分界线也清楚：报表、批处理、导出、CREATE INDEX、Merge Join 输入需要有序，适合外部归并；高频在线接口对大表做无索引 ORDER BY、只取 Top-N 却不用索引、高并发靠大 work_mem 才不落盘、临时空间不足、排序 key 不确定，这些都不该硬扛。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40\" y=\"24\" width=\"420\" height=\"132\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"250\" y=\"75.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#BE653B\" font-weight=\"700\" class=\"serif\">坑 1　external merge ≠ 内存 mergesort</text><text x=\"250\" y=\"93.45\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">run 内部通常是 quicksort 或 radix sort</text><text x=\"250\" y=\"110.45\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">归并只发生在 run 之间</text><rect x=\"490\" y=\"24\" width=\"420\" height=\"132\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"700\" y=\"75.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#BE653B\" font-weight=\"700\" class=\"serif\">坑 2　只看 work_mem，不看并发倍数</text><text x=\"700\" y=\"93.45\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">多节点、并行 worker、并发会话会叠乘</text><text x=\"700\" y=\"110.45\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">全局调大容易制造内存峰值</text><rect x=\"940\" y=\"24\" width=\"420\" height=\"132\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1150\" y=\"75.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#BE653B\" font-weight=\"700\" class=\"serif\">坑 3　看到 Disk 就盲目加内存</text><text x=\"1150\" y=\"93.45\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">低频批处理、维护任务落盘可接受</text><text x=\"1150\" y=\"110.45\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">要治理的是高频长尾排序</text><rect x=\"40\" y=\"166\" width=\"420\" height=\"132\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"250\" y=\"217.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#BE653B\" font-weight=\"700\" class=\"serif\">坑 4　忽略行宽</text><text x=\"250\" y=\"235.45\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">同样 100 万行，整数与大 JSONB 完全不同</text><text x=\"250\" y=\"252.45\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">必要时只排 key 再回表</text><rect x=\"490\" y=\"166\" width=\"420\" height=\"132\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"700\" y=\"217.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#BE653B\" font-weight=\"700\" class=\"serif\">坑 5　没有确定性排序键</text><text x=\"700\" y=\"235.45\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">created_at 大量重复时分页不稳定</text><text x=\"700\" y=\"252.45\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">补 id 等 tie-break key</text><rect x=\"940\" y=\"166\" width=\"420\" height=\"132\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1150\" y=\"217.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#BE653B\" font-weight=\"700\" class=\"serif\">坑 6　log_temp_files 当永久审计</text><text x=\"1150\" y=\"235.45\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">繁忙系统可能被日志写爆</text><text x=\"1150\" y=\"252.45\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">会话级或设合理阈值</text><rect x=\"40\" y=\"312\" width=\"640\" height=\"104\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\"/><text x=\"360\" y=\"348.7\" text-anchor=\"middle\" font-size=\"17\" fill=\"#2F7A66\" font-weight=\"700\" class=\"serif\">适合外部归并</text><text x=\"360\" y=\"368.54\" text-anchor=\"middle\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">报表 / 批处理 / 导出 / CREATE INDEX</text><text x=\"360\" y=\"386.22\" text-anchor=\"middle\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">Merge Join 输入有序、临时空间充足</text><rect x=\"700\" y=\"312\" width=\"660\" height=\"104\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\"/><text x=\"1030\" y=\"348.7\" text-anchor=\"middle\" font-size=\"17\" fill=\"#BE653B\" font-weight=\"700\" class=\"serif\">不适合硬扛</text><text x=\"1030\" y=\"368.54\" text-anchor=\"middle\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">高频在线接口无索引大表 ORDER BY</text><text x=\"1030\" y=\"386.22\" text-anchor=\"middle\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">高并发靠大 work_mem、空间不足、key 不稳定</text></svg>","ctrl":"","anim":false},{"eyebrow":"收束 · 一条因果链","title":"从 O(m+n) 到那行 Disk","lede":"归并的价值不在算法本身，而在它让「超过内存」变成一个仍可顺序处理的问题。","caption":"图 24　全讲因果链回顾与五个值得继续追问的扩展问题","bridge":"讲完了。回去找一条真实慢 SQL，用 EXPLAIN (ANALYZE, BUFFERS) 把这条链走一遍。","notes":"我们把整条链收一下。因为两个有序序列的全局最小只可能在两个前端里，合并是 O(m+n) 的线性动作；因为输入超过 work_mem，排序器把大输入切成若干条内存里排好的 run；因为 run 各自有序，归并阶段只需要 M 个前端候选和一个小堆，就能顺序地吐出全局有序结果；因为 logical tape 会回收读完的块，磁盘峰值不必是数据量的两倍；因为最后一轮可以在线归并，EXPLAIN 上才会写 external merge Disk。然后优化器在更上面还有索引有序、Incremental Sort、Top-N 这些捷径，work_mem 则同时受并行 worker 和并发会话放大。留五个问题给大家：为什么 PG15 以后 balanced merge 比 polyphase 更适配 logical tape？work_mem 翻倍时 run 数、merge pass、heap 和每条 tape 预读缓冲分别怎么变？为什么 ORDER BY ... LIMIT 有时用 Top-N heapsort、有时却走 Index Scan？对同一个大排序，减小行宽和增大 work_mem 哪个收益更大，怎么用实验验证？把 GPU 论文里的 radix/merge hybrid 搬进执行器，会先撞上 tuple 格式、varlena、collation、MVCC、PCIe 拷贝，还是并发调度？","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40\" y=\"24\" width=\"760\" height=\"52\" rx=\"0\" fill=\"#EBF1EE\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"420\" y=\"52.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#1B2B33\" font-weight=\"500\" class=\"\">① 两个有序前端 → 全局最小只在二者之一 → O(m+n)</text><rect x=\"40\" y=\"86\" width=\"760\" height=\"52\" rx=\"0\" fill=\"#CFE0DC\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"420\" y=\"114.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#1B2B33\" font-weight=\"500\" class=\"\">② 输入超 work_mem → 拆成内存里排好的 sorted run</text><rect const N = D.length;
let cur = 0, autoTimer = null, autoOn = false;
let sideOpen = false, sideMode = 'note';
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const pad = n => String(n).padStart(2, '0');
const h = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* ---------- 舞台：等比缩放 + letterbox，讲稿展开时缩到左侧 ---------- */
function fit(){
  const vp = $('#viewport');
  const W = vp.clientWidth, H = vp.clientHeight;
  const sw = sideOpen ? ($('#side').offsetWidth || 0) : 0;
  const availW = W - sw;
  const s = Math.min((availW - 24) / 1600, (H - 24) / 900);
  const st = $('#stage');
  st.style.transform = 'scale(' + s + ')';
  st.style.left = ((availW - 1600 * s) / 2) + 'px';
  st.style.top  = ((H - 900 * s) / 2) + 'px';
}
window.addEventListener('resize', fit);

function render(){
  $('#slides').innerHTML = D.map((d,i) =>
    '<section class="slide' + (d.anim ? ' anim' : '') + '" id="s' + i + '">'
    + '<div class="eyebrow"><span class="num">' + pad(i+1) + ' / ' + pad(N) + '</span>' + h(d.eyebrow) + '</div>'
    + '<h1 class="title">' + h(d.title) + '</h1>'
    + '<div class="lede">' + h(d.lede) + '</div>'
    + '<div class="rule"></div>'
    + '<div class="figwrap">' + d.svg + '</div>'
    + '<div class="caption">' + h(d.caption) + '</div>'
    + (d.ctrl ? '<div class="ctrls">' + d.ctrl + '</div>' : '')
    + '<div class="bridge"><span class="bk">承接 · NEXT</span>' + h(d.bridge) + '</div>'
    + '<div class="footer"><div class="fbar"><i id="fbar' + i + '"></i></div>'
    + '<span class="fl">数据库筑基课 · 归并排序 Mergesort</span>'
    + '<span class="fr">' + pad(i+1) + ' / ' + pad(N) + '</span></div>'
    + '</section>').join('');
}

function toast(s){
  const t = $('#toast'); t.textContent = s; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 1800);
}
function go(i, silent){
  i = Math.max(0, Math.min(N-1, i));
  $$('.slide').forEach((el,k) => el.classList.toggle('on', k === i));
  cur = i;
  try{ localStorage.setItem('mergesort-slide', String(i)); }catch(e){}
  $('#pg').textContent = pad(i+1) + ' / ' + pad(N);
  $('#track i').style.width = ((i+1)/N*100) + '%';
  for(let k=0;k<N;k++){ const b = $('#fbar'+k); if(b) b.style.width = (k<=i?100:0) + '%'; }
  pauseAnims();
  if(cur === 3) aPaint();
  if(cur === 9) bPaint();
  syncSide(true);
  if(!silent) toast(D[i].eyebrow + ' · ' + D[i].title);
}
function next(){ if(cur < N-1) go(cur+1); else stopAuto(); }
function prev(){ if(cur > 0) go(cur-1); }

function stopAuto(){
  autoOn = false; clearInterval(autoTimer); autoTimer = null;
  $('#btnAuto').textContent = '▶ 自动播放 P'; $('#btnAuto').classList.remove('act');
}
function toggleAuto(){
  if(autoOn){ stopAuto(); toast('已暂停自动播放'); return; }
  autoOn = true; $('#btnAuto').textContent = '❚❚ 暂停 P'; $('#btnAuto').classList.add('act');
  autoTimer = setInterval(() => { if(cur < N-1) go(cur+1, true); else stopAuto(); }, 12000);
  toast('自动播放：每 12 秒一页');
}

/* ---------- 右侧页内开窗：讲稿 / 全文 / 目录 / 帮助 ---------- */
function renderSide(){
  const body = $('#sideBody');
  if(sideMode === 'note'){
    $('#sideMode').textContent = '本页讲稿 · 页内开窗';
    $('#sideTitle').textContent = D[cur].title;
    body.innerHTML = noteSec(cur);
    body.scrollTop = 0;
  } else if(sideMode === 'all'){
    $('#sideMode').textContent = '全文讲稿 · 页内开窗';
    $('#sideTitle').textContent = '共 ' + N + ' 页 · 已定位到当前页';
    body.innerHTML = D.map((d,i) => noteSec(i)).join('');
  } else if(sideMode === 'toc'){
    $('#sideMode').textContent = '目录 · 页内开窗';
    $('#sideTitle').textContent = '点击任意一页跳转';
    body.innerHTML = '<div class="tocgrid">' + D.map((d,i) =>
      '<button class="tocitem" id="toc' + i + '" onclick="jump(' + i + ')">'
      + '<span class="tn">' + pad(i+1) + ' / ' + pad(N) + '</span>' + h(d.title) + '</button>').join('') + '</div>';
  } else {
    $('#sideMode').textContent = '快捷键 · 页内开窗';
    $('#sideTitle').textContent = '演说时的操作备忘';
    body.innerHTML = '<div class="keys">'
      + '<div><kbd>→ / 空格 / PageDown</kbd>下一页</div>'
      + '<div><kbd>← / PageUp</kbd>上一页</div>'
      + '<div><kbd>G</kbd>目录（再按一次关闭）</div>'
      + '<div><kbd>N</kbd>本页讲稿（再按一次关闭）</div>'
      + '<div><kbd>T</kbd>全文讲稿，自动定位当前页（再按一次关闭）</div>'
      + '<div><kbd>P</kbd>自动播放 / 暂停</div>'
      + '<div><kbd>F</kbd>全屏 / 退出全屏，按键条始终在底部</div>'
      + '<div><kbd>1–9</kbd>直接跳到第 1–9 页</div>'
      + '<div><kbd>Home / End</kbd>首页 / 末页</div>'
      + '<div><kbd>? / H</kbd>本帮助</div>'
      + '<div><kbd>Esc</kbd>关闭讲稿窗 / 退出全屏</div>'
      + '<div><kbd>输入框聚焦时</kbd>快捷键暂时让位给输入</div>'
      + '</div>';
    body.scrollTop = 0;
  }
  markCur();
}
function noteSec(i){
  const d = D[i];
  return '<div class="nsec" id="nsec' + i + '">'
    + '<div class="nmeta">' + pad(i+1) + ' / ' + pad(N) + '　' + h(d.eyebrow) + '</div>'
    + '<h3>' + h(d.title) + '</h3><p>' + h(d.notes) + '</p>'
    + '<div class="nbridge">承接 · NEXT　' + h(d.bridge) + '</div></div>';
}
function markCur(){
  $$('.nsec').forEach(el => el.classList.remove('cur'));
  $$('.tocitem').forEach(el => el.classList.remove('cur'));
  const a = $('#nsec' + cur), b = $('#toc' + cur);
  if(a) a.classList.add('cur');
  if(b) b.classList.add('cur');
}
function syncSide(smooth){
  if(!sideOpen) return;
  if(sideMode === 'note'){ renderSide(); return; }
  if(sideMode !== 'all' && sideMode !== 'toc') return;
  markCur();
  const el = $('#nsec' + cur) || $('#toc' + cur);
  if(el){
    const body = $('#sideBody');
    const top = Math.max(0, el.offsetTop - 12);
    const delta = Math.abs(top - body.scrollTop);
    body.scrollTo({top: top, behavior: (smooth && delta < 1400) ? 'smooth' : 'instant'});
  }
}
function openSide(mode){
  if(sideOpen && sideMode === mode){ closeSide(); return; }
  sideMode = mode; sideOpen = true;
  $('#side').classList.add('on');
  document.body.classList.add('sideOpen');
  $('#btnToc').classList.toggle('act', mode === 'toc');
  $('#btnNotes').classList.toggle('act', mode === 'note');
  $('#btnAll').classList.toggle('act', mode === 'all');
  $('#btnHelp').classList.toggle('act', mode === 'help');
  renderSide();
  fit();
  requestAnimationFrame(() => syncSide(false));
  toast(mode === 'note' ? '本页讲稿已展开（再按 N 关闭）'
       : mode === 'all' ? '全文讲稿已展开，已定位当前页（再按 T 关闭）'
       : mode === 'toc' ? '目录已展开（再按 G 关闭）' : '快捷键帮助已展开');
}
function closeSide(){
  sideOpen = false;
  $('#side').classList.remove('on');
  document.body.classList.remove('sideOpen');
  ['btnToc','btnNotes','btnAll','btnHelp'].forEach(id => $('#'+id).classList.remove('act'));
  fit();
  toast('讲稿窗已关闭');
}
function jump(i){ go(i); }

/* ---------- 全屏：底部按键条始终可见 ---------- */
function fs(){
  const entering = !document.body.classList.contains('fs');
  if(entering){
    document.body.classList.add('fs');
    try{
      const pr = document.documentElement.requestFullscreen ? document.documentElement.requestFullscreen() : null;
      if(pr && pr.catch) pr.catch(() => {});
    }catch(e){}
    fit();
    toast('全屏：底部快捷键条保持可见');
  }else{
    document.body.classList.remove('fs');
    try{ if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen(); }catch(e){}
    fit();
    toast('已退出全屏');
  }
}
document.addEventListener('fullscreenchange', () => {
  if(!document.fullscreenElement) document.body.classList.remove('fs');
  fit();
});

document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  const typing = (tag === 'input' || tag === 'select' || tag === 'textarea');
  const k = e.key;
  if(k === 'Escape'){
    if(sideOpen) closeSide();
    else if(document.body.classList.contains('fs')) fs();
    return;
  }
  if(typing) return;               /* 输入控件聚焦时，快捷键让位给输入 */
  if(k === 'ArrowRight' || k === ' ' || k === 'PageDown'){ e.preventDefault(); next(); }
  else if(k === 'ArrowLeft' || k === 'PageUp'){ e.preventDefault(); prev(); }
  else if(k === 'f' || k === 'F'){ e.preventDefault(); fs(); }
  else if(k === 'g' || k === 'G'){ e.preventDefault(); openSide('toc'); }
  else if(k === 'n' || k === 'N'){ e.preventDefault(); openSide('note'); }
  else if(k === 't' || k === 'T'){ e.preventDefault(); openSide('all'); }
  else if(k === 'p' || k === 'P'){ e.preventDefault(); toggleAuto(); }
  else if(k === '?' || k === 'h' || k === 'H'){ e.preventDefault(); openSide('help'); }
  else if(k === 'Home'){ e.preventDefault(); go(0); }
  else if(k === 'End'){ e.preventDefault(); go(N-1); }
  else if(/^[1-9]$/.test(k)){ go(parseInt(k,10) - 1); }
});

/* ---------- 内联 SVG 绘制助手（动画页使用，几何固定、零遮挡） ---------- */
const C = {ink:'#1B2B33',ink2:'#46585F',muted:'#89938F',line:'#D9D5CB',white:'#FFFFFF',
  primary:'#245A6B',primL:'#E5EFF0',accent:'#BE653B',accL:'#F7E9DE',
  green:'#2F7A66',greenL:'#E4F0EA',gold:'#AE8A3E',goldL:'#F5EDDC',bg2:'#F1EFE9'};
function jEsc(v){ return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&apos;'); }
function jW(s,z){ let w=0; for(let i=0;i<s.length;i++){ const c=s[i];
  w += (/[\u2E80-\uFFFF]/.test(c) ? 1 : (c === ' ' ? 0.32 : 0.57)); } return w*z; }
function jTxt(s,x,y,z,fill,anchor,weight,cls,maxw){
  let sz=z, w=jW(s,sz);
  while(maxw && w > maxw && sz > 10){ sz = Math.round((sz-0.5)*10)/10; w = jW(s,sz); }
  return '<text x="'+x+'" y="'+y+'" text-anchor="'+(anchor||'middle')+'" font-size="'+sz
    +'" fill="'+fill+'" font-weight="'+(weight||400)+'" class="'+(cls||'')+'">'+jEsc(s)+'</text>';
}
function jRect(x,y,w,h,fill,stroke,sw){
  return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill
    +'" stroke="'+(stroke||fill)+'" stroke-width="'+(sw||1)+'"/>';
}
function jLine(x1,y1,x2,y2,color,sw){
  return '<path d="M'+x1+' '+y1+' L'+x2+' '+y2+'" stroke="'+color
    +'" stroke-width="'+(sw||1.4)+'" fill="none"/>';
}
function jCell(x,y,w,h,v,fill,stroke,tc,sw){
  return jRect(x,y,w,h,fill,stroke,sw||1.2)
    + jTxt(String(v), x+w/2, y+h/2+6, 18, tc, 'middle', 600, 'mono', w-24);
}

/* ---------- 动画 A：两路归并逐步演示 ---------- */
const A_DEF='2,5,9,13,18,21', B_DEF='1,6,7,14,20,25';
let aA=[], aB=[], aSteps=[], aStep=-1, aTimer=null, aPlaying=false;
function aParse(raw, def){
  let v = String(raw||'').split(/[,，\s]+/).map(x => parseInt(x,10)).filter(x => !isNaN(x)).slice(0,8);
  if(v.length < 2) v = def.split(',').map(Number);
  const s = v.slice().sort((x,y) => x-y);
  return {s:s, sorted:v.every((x,i) => x === s[i])};
}
function aBuild(){
  const A = aParse($('#aIn') ? $('#aIn').value : A_DEF, A_DEF);
  const B = aParse($('#bIn') ? $('#bIn').value : B_DEF, B_DEF);
  aA = A.s; aB = B.s;
  let i=0, j=0, out=[], cmp=0;
  const snap = (desc) => ({i:i, j:j, out:out.slice(), cmp:cmp, desc:desc});
  aSteps = [];
  aSteps.push(snap('两条序列已按升序规整' + (A.sorted && B.sorted ? '；归并的前提就是输入各自有序' : '（检测到乱序，已自动排序）')));
  while(i < aA.length && j < aB.length){
    const va = aA[i], vb = aB[j]; cmp++;
    aSteps.push(snap('比较前端 A['+i+']='+va+' 与 B['+j+']='+vb+' → '+(va<=vb?'A 侧':'B 侧')+'较小，累计比较 '+cmp+' 次'));
    if(va <= vb){ out.push(va); i++; }
    else { out.push(vb); j++; }
    aSteps.push(snap('输出 '+(va<=vb?va:vb)+'；'+(va<=vb?'A':'B')+' 侧指针前进一步，两侧剩余部分仍各自有序'));
  }
  if(i < aA.length || j < aB.length){
    const rest = aA.slice(i).concat(aB.slice(j));
    out = out.concat(rest);
    aSteps.push(snap('一侧耗尽：另一侧剩余 '+rest.length+' 个元素直接顺序接上，不再需要比较'));
  }
  aSteps.push(snap('完成：共输出 '+out.length+' 个元素，比较 '+cmp+' 次（≤ m+n = '+(aA.length+aB.length)+'）'));
  aStep = -1; aPaint();
}
function aPaint(){
  const host = $('#animA'); if(!host || !aA.length) return;
  const st = aStep < 0 ? null : aSteps[aStep];
  const i = st ? st.i : 0, j = st ? st.j : 0;
  const out = st ? st.out : [], cmp = st ? st.cmp : 0;
  const nmax = Math.max(aA.length, aB.length, 2);
  const cw = Math.min(100, (880 - (nmax-1)*10) / nmax), gp = 10;
  const nO = aA.length + aB.length;
  const ocw = Math.min(62, (1180 - (nO-1)*6) / nO);
  const ox0 = 170 + (880 - (nO*ocw + (nO-1)*6)) / 2;
  let s = '';
  s += jTxt('序列 A（有序）', 40, 70, 13.5, C.ink2, 'start', 600, '', 120);
  s += jTxt('序列 B（有序）', 40, 160, 13.5, C.ink2, 'start', 600, '', 120);
  s += jTxt('输出流', 40, 328, 13.5, C.ink2, 'start', 600, '', 120);
  for(let k=0;k<aA.length;k++){
    let fl=C.white, stc=C.line, tc=C.ink, sw=1.2;
    if(k < i){ fl=C.bg2; tc=C.muted; }
    else if(k === i){ fl=C.accL; stc=C.accent; tc=C.accent; sw=2.4; }
    s += jCell(170 + k*(cw+gp), 40, cw, 56, aA[k], fl, stc, tc, sw);
  }
  for(let k=0;k<aB.length;k++){
    let fl=C.white, stc=C.line, tc=C.ink, sw=1.2;
    if(k < j){ fl=C.bg2; tc=C.muted; }
    else if(k === j){ fl=C.accL; stc=C.accent; tc=C.accent; sw=2.4; }
    s += jCell(170 + k*(cw+gp), 130, cw, 56, aB[k], fl, stc, tc, sw);
  }
  s += jRect(170, 210, 280, 52, C.primL, C.primary, 1.2);
  s += jTxt('① 只比两个前端', 190, 243, 15, C.primary, 'start', 600, 'serif', 244);
  s += jRect(470, 210, 280, 52, C.greenL, C.green, 1.2);
  s += jTxt('② 输出较小者', 490, 243, 15, C.green, 'start', 600, 'serif', 244);
  s += jRect(770, 210, 280, 52, C.accL, C.accent, 1.2);
  s += jTxt('③ 该侧指针 +1', 790, 243, 15, C.accent, 'start', 600, 'serif', 244);
  for(let k=0;k<out.length;k++){
    const last = (k === out.length-1);
    s += jCell(ox0 + k*(ocw+6), 294, ocw, 56, out[k],
      C.greenL, last ? C.accent : C.green, C.green, last ? 2 : 1.2);
  }
  s += jRect(1080, 36, 280, 146, C.primL, C.primary, 1.2);
  s += jTxt('前端候选', 1100, 64, 17, C.primary, 'start', 700, 'serif', 244);
  s += jTxt('A['+i+'] = '+(i<aA.length ? aA[i] : '已耗尽'), 1100, 96, 13.5, C.ink, 'start', 500, 'mono', 244);
  s += jTxt('B['+j+'] = '+(j<aB.length ? aB[j] : '已耗尽'), 1100, 124, 13.5, C.ink, 'start', 500, 'mono', 244);
  s += jTxt('比较次数　'+cmp, 1100, 156, 13, C.accent, 'start', 600, 'mono', 244);
  s += jRect(1080, 200, 280, 150, C.accL, C.accent, 1.2);
  s += jTxt('不变式', 1100, 228, 17, C.accent, 'start', 700, 'serif', 244);
  s += jTxt('输出后两侧仍各自有序', 1100, 258, 13, C.ink2, 'start', 400, '', 244);
  s += jTxt('指针只前进，不回退', 1100, 284, 13, C.ink2, 'start', 400, '', 244);
  s += jTxt('已输出 '+out.length+' / '+nO+' 个', 1100, 318, 13, C.muted, 'start', 500, 'mono', 244);
  s += jRect(40, 370, 1320, 48, C.white, C.line, 1.2);
  const desc = st ? st.desc : '点「播放」或「单步」开始：先选前端候选，再逐个比较、输出、移动指针；读数由本页脚本实时计算';
  s += jTxt(desc, 60, 401, 15, C.ink, 'start', 400, '', 1260);
  host.innerHTML = s;
  const o = $('#aOut');
  if(o) o.innerHTML = aStep < 0
    ? '<b>准备就绪</b> 共 ' + aSteps.length + ' 步，可播放 / 单步 / 重置'
    : '<b>第 ' + (aStep+1) + ' / ' + aSteps.length + ' 步</b> ' + jEsc(st.desc);
}
function aPause(){
  aPlaying = false; clearInterval(aTimer); aTimer = null;
  const b = $('#aPlay'); if(b){ b.textContent = '▶ 播放'; b.classList.remove('play'); }
}
function aPlay(){
  if(aPlaying){ aPause(); return; }
  aPlaying = true; const b = $('#aPlay'); if(b){ b.textContent = '❚❚ 暂停'; b.classList.add('play'); }
  if(aStep >= aSteps.length-1) aStep = -1;
  aTimer = setInterval(() => { aStep++; aPaint(); if(aStep >= aSteps.length-1) aPause(); }, 760);
}
function aTick(){ aPause(); if(aStep < aSteps.length-1){ aStep++; aPaint(); } }
function aReset(){ aPause(); aBuild(); toast('归并演示已重置'); }

/* ---------- 动画 B：work_mem → run 数 → merge pass 推演 ---------- */
const MEM_STEPS = [1,2,4,8,16,32,64,128,256];
let bSweep = 2, bTimer = null, bPlaying = false;
function bCalc(memMB){
  const rows = +($('#bRows') ? $('#bRows').value : 5000000);
  const width = +($('#bWidth') ? $('#bWidth').value : 128);
  const mem = memMB * 1024 * 1024;
  const total = rows * width;
  const runs = Math.max(1, Math.ceil(total / mem));
  const perTape = 2*8192 + 32*8192;               /* BLCKSZ=8kB 默认 */
  const M = Math.max(6, Math.min(500, Math.floor(mem / perTape)));
  const passes = runs <= 1 ? 0 : (runs <= M ? 1 : Math.ceil(Math.log(runs) / Math.log(M)));
  const io = passes > 0 ? 2 * total * passes : 0;
  return {rows:rows, width:width, memMB:memMB, total:total, runs:runs, M:M, passes:passes, io:io};
}
function fmtB(v){
  if(v >= 1024*1024*1024) return (v/1024/1024/1024).toFixed(1)+' GB';
  return Math.round(v/1024/1024)+' MB';
}
function fmtN(v){ return v >= 10000 ? (v/1000).toFixed(0)+'k' : String(v); }
function bPaint(){
  const host = $('#animB'); if(!host) return;
  const memMB = +($('#bMem') ? $('#bMem').value : 4);
  const r = bCalc(memMB);
  const mv = $('#bMemVal'); if(mv) mv.textContent = memMB + 'MB';
  let s = '';
  const metrics = [
    {t:'初始 run 数 ≈ 数据量 / work_mem', v:fmtN(r.runs), sub:'run 越多，后续归并越重', c:C.accent},
    {t:'merge order M（6..500 夹逼）', v:String(r.M), sub:'clamp(mem / 272kB, 6, 500)', c:C.primary},
    {t:'merge pass ≈ ⌈log_M(runs)⌉', v:String(r.passes), sub:'pass 多一轮就多一遍读写', c:C.gold},
    {t:'累计临时 I/O ≈ 2×数据量×pass', v:fmtB(r.io), sub:'示意估算，不是实测基准', c:C.green},
  ];
  metrics.forEach((m,i) => {
    const x = 40 + 335*i;
    s += jRect(x, 24, 315, 104, C.bg2, C.line, 1.2);
    s += jTxt(m.t, x+16, 48, 12.5, C.muted, 'start', 400, '', 283);
    s += jTxt(m.v, x+16, 86, 28, m.c, 'start', 700, 'mono', 283);
    s += jTxt(m.sub, x+16, 112, 12, C.ink2, 'start', 400, '', 283);
  });
  /* 柱状：work_mem 从 1MB 到 256MB 时 run 数的变化（对数刻度，示意） */
  s += jRect(40, 146, 820, 180, C.bg2, C.line, 1.2);
  s += jTxt('work_mem（MB）→ 初始 run 数（对数刻度，示意）', 60, 172, 13, C.muted, 'start', 400, '', 780);
  const series = MEM_STEPS.map(m => bCalc(m));
  const mx = Math.max.apply(null, series.map(o => Math.log10(o.runs+1)));
  s += jLine(60, 300, 840, 300, C.line, 1.2);
  series.forEach((o,i) => {
    const x = 70 + 86*i, hh = Math.max(3, 100 * Math.log10(o.runs+1) / (mx || 1));
    const isCur = MEM_STEPS[i] === memMB;
    s += jRect(x, 300-hh, 56, hh, isCur ? C.accent : C.primary, isCur ? C.accent : C.primary, isCur ? 2 : 1);
    s += jTxt(fmtN(o.runs), x+28, 300-hh-7, 10.5, isCur ? C.accent : C.ink2, 'middle', 600, 'mono', 70);
    s += jTxt(String(MEM_STEPS[i]), x+28, 318, 11.5, isCur ? C.accent : C.muted, 'middle', 600, 'mono', 70);
  });
  s += jRect(880, 146, 480, 180, C.primL, C.primary, 1.2);
  s += jTxt('源码公式 · 本页示意模型', 900, 174, 15, C.primary, 'start', 700, 'serif', 444);
  s += jTxt('nruns ≈ input_bytes / sort_mem_bytes', 900, 204, 12.5, C.ink, 'start', 400, 'mono', 444);
  s += jTxt('M = clamp(mem / 278528B, 6, 500)', 900, 230, 12.5, C.ink, 'start', 400, 'mono', 444);
  s += jTxt('passes ≈ ⌈log_M(nruns)⌉，I/O ≈ 2 × 数据量 × passes', 900, 256, 12.5, C.ink, 'start', 400, 'mono', 444);
  s += jTxt('当前：'+fmtB(r.total)+' 数据 / '+memMB+'MB 预算', 900, 282, 12.5, C.accent, 'start', 600, '', 444);
  s += jTxt('常数：BLCKSZ=8kB，MERGE_BUFFER=32×BLCKSZ', 900, 308, 11, C.muted, 'start', 400, '', 444);
  s += jRect(40, 342, 1320, 72, C.white, C.line, 1.2);
  s += jTxt('示意模型：行宽被近似为排序 tuple 的内存占用；读数由本页脚本按源码公式计算，不是 PostgreSQL 实测基准。',
            60, 368, 13, C.accent, 'start', 600, '', 1260);
  s += jTxt('真实环境还受 tuple 头、palloc、abbreviated key、并行 worker、并发会话与 OS cache 影响。',
            60, 394, 12.5, C.ink2, 'start', 400, '', 1260);
  host.innerHTML = s;
  const o = $('#bOut');
  if(o) o.innerHTML = '<b>work_mem ' + memMB + 'MB</b>　run ' + fmtN(r.runs)
    + '　M ' + r.M + '　pass ' + r.passes + '　临时 I/O ' + fmtB(r.io);
}
function bPause(){
  bPlaying = false; clearInterval(bTimer); bTimer = null;
  const b = $('#bPlay'); if(b){ b.textContent = '▶ 播放'; b.classList.remove('play'); }
}
function bSetStep(k){
  bSweep = Math.max(0, Math.min(MEM_STEPS.length-1, k));
  const el = $('#bMem'); if(el) el.value = String(MEM_STEPS[bSweep]);
  bPaint();
}
function bPlay(){
  if(bPlaying){ bPause(); return; }
  bPlaying = true; const b = $('#bPlay'); if(b){ b.textContent = '❚❚ 暂停'; b.classList.add('play'); }
  if(bSweep >= MEM_STEPS.length-1) bSetStep(0);
  bTimer = setInterval(() => {
    if(bSweep >= MEM_STEPS.length-1){ bPause(); return; }
    bSetStep(bSweep+1);
  }, 780);
}
function bTick(){ bPause(); if(bSweep >= MEM_STEPS.length-1) bSweep = -1; bSetStep(bSweep+1); }
function bReset(){ bPause(); bSetStep(2); toast('推演已重置到 work_mem = 4MB'); }
function pauseAnims(){ aPause(); bPause(); }

/* ---------- 启动 ---------- */
function init(){
  render(); fit();
  let saved = 0;
  try{ saved = parseInt(localStorage.getItem('mergesort-slide') || '0', 10) || 0; }catch(e){}
  go(Math.max(0, Math.min(N-1, saved)), true);
  $('#btnPrev').onclick = prev; $('#btnNext').onclick = next;
  $('#btnToc').onclick = () => openSide('toc');
  $('#btnNotes').onclick = () => openSide('note');
  $('#btnAll').onclick = () => openSide('all');
  $('#btnAuto').onclick = toggleAuto;
  $('#btnFs').onclick = fs;
  $('#btnHelp').onclick = () => openSide('help');
  $('#sideClose').onclick = closeSide;
  aBuild(); bPaint();
  const ai = $('#aIn'), bi = $('#bIn');
  if(ai) ai.addEventListener('change', () => { aPause(); aBuild(); });
  if(bi) bi.addEventListener('change', () => { aPause(); aBuild(); });
  const br = $('#bRows'), bw = $('#bWidth'), bm = $('#bMem');
  if(br) br.addEventListener('change', () => { bPause(); bPaint(); });
  if(bw) bw.addEventListener('change', () => { bPause(); bPaint(); });
  if(bm) bm.addEventListener('input', () => {
    bPause();
    const v = +bm.value; let best = 0, bd = 1e9;
    MEM_STEPS.forEach((m,i) => { const d = Math.abs(m-v); if(d < bd){ bd = d; best = i; } });
    bSweep = best; bPaint();
  });
  const bind = (id, fn) => { const el = $(id); if(el) el.onclick = fn; };
  bind('#aPlay', aPlay); bind('#aTick', aTick); bind('#aReset', aReset);
  bind('#bPlay', bPlay); bind('#bTick', bTick); bind('#bReset', bReset);
}
document.addEventListener('DOMContentLoaded', init);
</script>
