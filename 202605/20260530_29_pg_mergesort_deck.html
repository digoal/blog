<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数据库筑基课 · 归并排序 Mergesort｜从 O(m+n) 到 external merge Disk</title>
<!-- 单文件交付：所有原理图均为现场绘制的内联 SVG，零外部图片 / 字体 / 脚本依赖。 -->
<!-- 视觉母题：地层剖面 / 工程蓝图。内容按因果推演链组织，一页一图一命题。 -->
<style>
:root{
  --bg:#F7F6F2; --bg2:#F1EFE9; --ink:#1B2B33; --ink2:#46585F;
  --muted:#89938F; --line:#D9D5CB; --white:#FFFFFF;
  --primary:#245A6B; --prim-l:#E5EFF0; --accent:#BE653B; --acc-l:#F7E9DE;
  --green:#2F7A66; --green-l:#E4F0EA; --gold:#AE8A3E; --gold-l:#F5EDDC;
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#E9E7E1}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
#viewport{position:absolute;inset:0 0 72px 0;overflow:hidden}
#stage{position:absolute;width:1600px;height:900px;background:var(--bg);
  transform-origin:top left;box-shadow:0 18px 60px rgba(27,43,51,.13);
  transition:transform .36s cubic-bezier(.2,.7,.2,1),left .36s cubic-bezier(.2,.7,.2,1),top .36s cubic-bezier(.2,.7,.2,1)}
.slide{position:absolute;inset:0;display:none}
.slide.on{display:block;animation:fadein .42s cubic-bezier(.2,.7,.2,1)}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{position:absolute;left:64px;top:44px;font-size:13px;letter-spacing:3.4px;
  color:var(--primary);font-weight:600}
.eyebrow .num{font-family:var(--mono);letter-spacing:1px;color:var(--accent);margin-right:14px}
h1.title{position:absolute;left:64px;top:70px;margin:0;font-family:var(--serif);
  font-size:44px;line-height:1.25;font-weight:700;letter-spacing:1.2px;color:var(--ink)}
.lede{position:absolute;left:64px;top:139px;width:1440px;font-size:19px;color:var(--ink2);
  line-height:1.5;letter-spacing:.3px}
.rule{position:absolute;left:64px;top:181px;width:1472px;height:1px;background:var(--line)}
.figwrap{position:absolute;left:100px;top:198px;width:1400px;height:430px}
svg.figure{display:block;overflow:visible}
svg.figure text{font-family:var(--sans)}
svg.figure text.serif{font-family:var(--serif)}
svg.figure text.mono{font-family:var(--mono)}
.caption{position:absolute;left:100px;top:638px;width:1400px;font-size:13px;
  color:var(--muted);letter-spacing:.4px}
.bridge{position:absolute;left:64px;top:706px;width:1472px;font-size:20px;
  color:var(--accent);line-height:1.55;letter-spacing:.4px;padding-left:18px;
  border-left:3px solid var(--accent);font-family:var(--serif)}
.bridge .bk{font-family:var(--sans);font-size:13px;color:var(--muted);
  letter-spacing:2px;display:block;margin-bottom:2px}
.footer{position:absolute;left:64px;top:846px;width:1472px;height:1px;background:var(--line)}
.footer .fl{position:absolute;left:0;top:14px;font-size:12.5px;color:var(--muted);letter-spacing:2px}
.footer .fr{position:absolute;right:0;top:12px;font-family:var(--mono);font-size:14px;color:var(--ink2)}
.footer .fbar{position:absolute;left:0;right:0;top:-1px;height:2px;background:transparent}
.footer .fbar i{display:block;height:2px;background:var(--primary);width:0;transition:width .4s ease}
/* 动画页：控件独立于图，绝不覆盖图 */
.slide.anim .caption{top:632px}
.slide.anim .bridge{top:718px}
.ctrls{position:absolute;left:100px;top:660px;width:1400px;height:42px;display:flex;
  align-items:center;gap:10px}
.ctrls label{font-size:13px;color:var(--ink2);white-space:nowrap}
.ctrls input[type=text],.ctrls select{font-family:var(--sans);font-size:13px;color:var(--ink);
  background:#fff;border:1px solid var(--line);border-radius:4px;padding:5px 8px;outline:none;height:30px}
.ctrls input[type=range]{width:130px;padding:0;accent-color:var(--primary);border:none;background:transparent;height:30px}
.ctrls .btn{height:30px;padding:4px 13px;border:1px solid var(--primary);border-radius:4px;
  background:#fff;color:var(--primary);font-size:13px;cursor:pointer;font-family:var(--sans);white-space:nowrap}
.ctrls .btn.play{background:var(--primary);color:#fff}
.ctrls .btn:hover{filter:brightness(.94)}
.ctrls .out{font-size:12.5px;color:var(--ink2);margin-left:auto;min-width:0;flex:1;
  max-width:460px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrls .out b{color:var(--accent);font-weight:600}
/* 底部外壳：全屏时也保持可见 */
.chrome{position:fixed;left:0;right:0;bottom:0;height:72px;background:#FCFBF8;
  border-top:1px solid var(--line);z-index:50;display:flex;flex-direction:column}
.bar{height:42px;display:flex;align-items:center;gap:5px;padding:0 14px}
.chrome .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.chrome button{font-family:var(--sans);font-size:12.5px;color:var(--ink2);background:transparent;
  border:1px solid transparent;border-radius:5px;padding:6px 9px;cursor:pointer;white-space:nowrap}
.chrome button:hover{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome button.act{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome .pg{font-family:var(--mono);font-size:13.5px;color:var(--ink);min-width:74px;text-align:center}
.chrome .track{flex:1;height:3px;background:var(--line);border-radius:3px;margin:0 10px;position:relative}
.chrome .track i{position:absolute;left:0;top:0;height:3px;background:var(--primary);border-radius:3px;transition:width .35s}
.keybar{height:30px;border-top:1px solid var(--line);display:flex;align-items:center;
  justify-content:center;font-size:12px;color:var(--muted);letter-spacing:.5px;
  white-space:nowrap;overflow:hidden;background:#FCFBF8}
.keybar b{color:var(--primary);font-weight:600;margin-right:12px}
.keybar span{margin:0 8px}
body.fs .keybar{background:var(--gold-l);color:#7A5D22}
body.fs .keybar b{color:#7A5D22}
body.fs .chrome{background:#F1EFE9}
/* 右侧页内开窗（不是弹窗 / 模态） */
.side{position:fixed;right:0;top:0;bottom:72px;width:clamp(380px,34vw,560px);
  background:#FCFBF8;border-left:1px solid var(--line);z-index:45;
  transform:translateX(103%);transition:transform .36s cubic-bezier(.2,.7,.2,1);
  display:flex;flex-direction:column;box-shadow:-14px 0 40px rgba(27,43,51,.08)}
.side.on{transform:none}
.sideHead{padding:20px 26px 15px;border-bottom:1px solid var(--line);position:relative;flex:none}
.sideHead .sm{font-size:12px;letter-spacing:3px;color:var(--accent);font-weight:600}
.sideHead h2{margin:7px 30px 0 0;font-family:var(--serif);font-size:23px;line-height:1.35;color:var(--ink)}
.sideHead .close{position:absolute;right:20px;top:20px;background:#fff;border:1px solid var(--line);
  border-radius:5px;padding:6px 10px;font-size:12.5px;cursor:pointer;color:var(--ink2)}
.sideBody{flex:1;overflow:auto;position:relative;padding:6px 26px 46vh}
.sideFoot{flex:none;border-top:1px solid var(--line);padding:10px 26px;font-size:12px;
  color:var(--muted);letter-spacing:.5px;background:var(--bg2)}
.nsec{padding:22px 12px 26px 16px;border-bottom:1px solid var(--line)}
.nsec.cur{background:var(--gold-l);box-shadow:inset 3px 0 0 var(--accent)}
.nsec .nmeta{font-family:var(--mono);font-size:11.5px;color:var(--accent);letter-spacing:1px}
.nsec h3{margin:9px 0 12px;font-family:var(--serif);font-size:20px;color:var(--primary);line-height:1.4}
.nsec p{margin:0;font-size:15px;line-height:2.05;color:var(--ink2);letter-spacing:.3px}
.nsec .nbridge{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);
  font-family:var(--serif);font-size:14px;line-height:1.8;color:var(--accent)}
.tocgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:18px 0}
.tocitem{display:block;width:100%;text-align:left;padding:11px 12px;border:1px solid var(--line);
  border-radius:5px;background:#fff;cursor:pointer;color:var(--ink);font-family:var(--sans);font-size:14px}
.tocitem:hover{border-color:var(--primary);background:var(--prim-l)}
.tocitem.cur{border-color:var(--accent);background:var(--gold-l);box-shadow:inset 3px 0 0 var(--accent)}
.tocitem .tn{font-family:var(--mono);font-size:11.5px;color:var(--accent);display:block;margin-bottom:4px}
.keys{padding:18px 0;font-size:14.5px;line-height:2.1;color:var(--ink2)}
.keys kbd{font-family:var(--mono);background:#fff;border:1px solid var(--line);
  border-bottom-width:2px;border-radius:4px;padding:2px 7px;color:var(--primary);margin-right:8px}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);
  color:#fff;font-size:13px;padding:9px 16px;border-radius:5px;opacity:0;transition:.3s;z-index:80;pointer-events:none}
.toast.on{opacity:1}
@media print{
  .chrome,.side,.toast{display:none!important}
  #viewport{position:static}
  #stage{position:static;transform:none!important;box-shadow:none}
  .slide{display:block!important;page-break-after:always;position:relative;height:900px}
}
</style>
</head>
<body>
<div id="viewport"><div id="stage"><div id="slides"></div></div></div>

<aside class="side" id="side" aria-label="页内讲稿窗">
  <div class="sideHead">
    <div class="sm" id="sideMode">本页讲稿</div>
    <h2 id="sideTitle"></h2>
    <button class="close" id="sideClose">关闭 ✕</button>
  </div>
  <div class="sideBody" id="sideBody"></div>
  <div class="sideFoot">页内开窗 · 按同一按键再按一次即关闭 · 翻页时讲稿自动联动</div>
</aside>

<div class="chrome">
  <div class="bar">
    <button id="btnPrev">← 上一页</button>
    <button id="btnNext">下一页 →</button>
    <span class="pg" id="pg">01 / 24</span>
    <div class="track" id="track"><i></i></div>
    <div class="sep"></div>
    <button id="btnToc">目录 G</button>
    <button id="btnNotes">本页讲稿 N</button>
    <button id="btnAll">全文讲稿 T</button>
    <button id="btnAuto">▶ 自动播放 P</button>
    <button id="btnFs">全屏 F</button>
    <button id="btnHelp">? 帮助</button>
  </div>
  <div class="keybar" id="keybar">
    <b>快捷键</b>
    <span>← → / 空格 翻页</span><span>G 目录</span><span>N 本页讲稿</span>
    <span>T 全文讲稿</span><span>P 自动播放</span><span>F 全屏</span>
    <span>1–9 跳页</span><span>? 帮助</span><span>Esc 关闭 / 退出</span>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const D = [{"eyebrow":"开场 · 从一条 EXPLAIN 说起","title":"同一句 ORDER BY，两种命运","lede":"业务写的是排序意图；执行器回答的是内存、临时文件与 I/O 这一串工程问题。","caption":"图 1　同一条 SQL 在两种输入规模下，落到 tuplesort 的两条不同分支（示意）","bridge":"要解释这条分叉，先得知道「排序」这件事落在数据库的哪一层。","notes":"先从一个每天都能碰到的现象说起。业务侧写的是 SELECT customer_id, paid_at, amount FROM orders ORDER BY paid_at DESC, id DESC；执行器那边，有时候 EXPLAIN ANALYZE 干干净净给你一行 Sort Method: quicksort Memory，有时候却变成 Sort Method: external merge Disk。这两个名字不是我编的，它们来自 tuplesort_method_name() 和 tuplesort_space_type_name()，是 Sort 节点真实打印的格式。差别不在 SQL，也不在优化器突然换了个更高级的算法，而在于同一批输入有没有被 work_mem 装下。装得下，内存里一批 quicksort 就交卷；装不下，排序器只能把大输入切成多条已经有序的 run，再用多路归并合成全局有序输出。所以今天这一讲不是背算法，我们要把这条分叉从最底层的两路合并，一路推到 EXPLAIN 上那行字，最后落到怎么验证、怎么调优。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40\" y=\"24\" width=\"1320\" height=\"64\" rx=\"0\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1\"/><text x=\"700\" y=\"58.66\" text-anchor=\"middle\" font-size=\"19\" fill=\"#FFFFFF\" font-weight=\"500\" class=\"mono\">SELECT customer_id, paid_at, amount FROM orders ORDER BY paid_at DESC, id DESC;</text><path d=\"M700 88 L700 108\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"/><path d=\"M360 108 L1040 108\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"/><path d=\"M360 108 L360 130\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.4\" stroke-linejoin=\"miter\"/><polygon points=\"356,122 360,130 364,122\" fill=\"#245A6B\"/><path d=\"M1040 108 L1040 130\" fill=\"none\" stroke=\"#BE653B\" stroke-width=\"1.4\" stroke-linejoin=\"miter\"/><polygon points=\"1036,122 1040,130 1044,122\" fill=\"#BE653B\"/><text x=\"1110\" y=\"104\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" class=\"\">分叉判据：work_mem</text><rect x=\"40\" y=\"130\" width=\"640\" height=\"166\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><text x=\"360\" y=\"188.06\" text-anchor=\"middle\" font-size=\"21\" fill=\"#245A6B\" font-weight=\"700\" class=\"serif\">装得下 work_mem</text><text x=\"360\" y=\"210.88\" text-anchor=\"middle\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">TSS_SORTEDINMEM　·　内存里一批 quicksort / radix</text><text x=\"360\" y=\"229.92\" text-anchor=\"middle\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">Sort Method: quicksort    Memory: 74kB</text><text x=\"360\" y=\"248.14\" text-anchor=\"middle\" font-size=\"13\" fill=\"#89938F\" font-weight=\"400\" class=\"\">无临时文件，无 merge pass</text><rect x=\"720\" y=\"130\" width=\"640\" height=\"166\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.6\"/><text x=\"1040\" y=\"188.06\" text-anchor=\"middle\" font-size=\"21\" fill=\"#BE653B\" font-weight=\"700\" class=\"serif\">装不下 work_mem</text><text x=\"1040\" y=\"210.88\" text-anchor=\"middle\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">TSS_BUILDRUNS　·　切成多条 sorted run</text><text x=\"1040\" y=\"229.92\" text-anchor=\"middle\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">Sort Method: external merge    Disk: 123456kB</text><text x=\"1040\" y=\"248.14\" text-anchor=\"middle\" font-size=\"13\" fill=\"#89938F\" font-weight=\"400\" class=\"\">写临时文件，多轮顺序读写</text><rect x=\"40\" y=\"320\" width=\"1320\" height=\"90\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"700\" y=\"358\" text-anchor=\"middle\" font-size=\"18\" fill=\"#1B2B33\" font-weight=\"600\" class=\"serif\">同一个判据：memtuples[] 或 tuple 内存是否触碰 work_mem</text><text x=\"700\" y=\"379.2\" text-anchor=\"middle\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" class=\"\">触碰 → inittapes() → TSS_BUILDRUNS → dumptuples() 生成 run；未触碰 → 直接内存排序</text></svg>","ctrl":"","anim":false},{"eyebrow":"定位 · 排序在数据库的哪一层","title":"七层剖面：归并排在第几层","lede":"归并不是「一个排序算法」，而是超内存之后，执行器、tuplesort 与临时文件之间的一整套协作。","caption":"图 2　地层七阶：从 SQL 语义下沉到硬件，越深越底层；外部归并落在第 5、6 层","bridge":"先把最底下的最小单元说清楚：两个有序序列，怎么变成一个。","notes":"很多人一听到归并排序，脑子里立刻浮出教科书那张递归拆分的图。但在数据库里，这个定位是错的。我们把它放回地层剖面看：最上面是 SQL 语义，ORDER BY、DISTINCT、窗口、Merge Join 的排序需求；往下是执行器 Sort 节点；再往下是 tuplesort 状态机，它决定走内存、Top-N 还是外部；再往下才是每个内存批次怎么排——这里用的是 quicksort 或较新版本里的 radix sort；外部归并其实在更下面一层，是 logical tape 和 k-way merge 的事；最底下才是 CPU cache、内存带宽和临时文件 I/O。你会发现，归并排序在这个体系里不是「替代 quicksort 的那个算法」，而是「内存装不下之后，怎么把磁盘上的多条有序序列接起来」的机制。这个定位一摆正，后面所有细节都不会拧巴。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40\" y=\"18\" width=\"1060\" height=\"48\" rx=\"0\" fill=\"#EBF1EE\" stroke=\"#EBF1EE\" stroke-width=\"1\"/><text x=\"570\" y=\"44.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#1B2B33\" font-weight=\"500\" class=\"\">第 1 层　SQL 语义　ORDER BY / DISTINCT / 窗口 / Merge Join 的排序需求</text><rect x=\"40\" y=\"74\" width=\"1060\" height=\"48\" rx=\"0\" fill=\"#CFE0DC\" stroke=\"#CFE0DC\" stroke-width=\"1\"/><text x=\"570\" y=\"100.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#1B2B33\" font-weight=\"500\" class=\"\">第 2 层　执行器 Sort 节点　nodeSort.c：吃满子计划输入，才返回第一行</text><rect x=\"40\" y=\"130\" width=\"1060\" height=\"48\" rx=\"0\" fill=\"#A4C4C6\" stroke=\"#A4C4C6\" stroke-width=\"1\"/><text x=\"570\" y=\"156.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#1B2B33\" font-weight=\"500\" class=\"\">第 3 层　tuplesort 状态机　内存 / Top-N / 外部三条路</text><rect x=\"40\" y=\"186\" width=\"1060\" height=\"48\" rx=\"0\" fill=\"#74A5AD\" stroke=\"#74A5AD\" stroke-width=\"1\"/><text x=\"570\" y=\"212.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#1B2B33\" font-weight=\"500\" class=\"\">第 4 层　内存批次与 key 表示　memtuples[] · datum1 · SortSupport</text><rect x=\"40\" y=\"242\" width=\"1060\" height=\"48\" rx=\"0\" fill=\"#47808D\" stroke=\"#BE653B\" stroke-width=\"2\"/><text x=\"570\" y=\"268.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#FFFFFF\" font-weight=\"500\" class=\"\">第 5 层　外部归并①　run generation：批内 quicksort / radix 写成 run</text><rect x=\"40\" y=\"298\" width=\"1060\" height=\"48\" rx=\"0\" fill=\"#2E6373\" stroke=\"#BE653B\" stroke-width=\"2\"/><text x=\"570\" y=\"324.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#FFFFFF\" font-weight=\"500\" class=\"\">第 6 层　外部归并②　logical tape + balanced k-way merge</text><rect x=\"40\" y=\"354\" width=\"1060\" height=\"48\" rx=\"0\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1\"/><text x=\"570\" y=\"380.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#FFFFFF\" font-weight=\"500\" class=\"\">第 7 层　硬件　CPU cache / 内存带宽 / 临时文件 I/O</text><rect x=\"1120\" y=\"190\" width=\"240\" height=\"150\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.6\"/><text x=\"1240\" y=\"232.3\" text-anchor=\"middle\" font-size=\"19\" fill=\"#BE653B\" font-weight=\"700\" class=\"serif\">本讲主角</text><text x=\"1240\" y=\"253.22\" text-anchor=\"middle\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">不是替代 quicksort</text><text x=\"1240\" y=\"270.9\" text-anchor=\"middle\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">而是超内存之后</text><text x=\"1240\" y=\"288.58\" text-anchor=\"middle\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">把磁盘上的有序 run</text><text x=\"1240\" y=\"306.26\" text-anchor=\"middle\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">接起来的机制</text><path d=\"M1100 265 L1120 265\" fill=\"none\" stroke=\"#BE653B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"/><polygon points=\"1112,261 1120,265 1112,269\" fill=\"#BE653B\"/></svg>","ctrl":"","anim":false},{"eyebrow":"最小单元 · 归并为什么是线性的","title":"两个有序序列，只要比前端","lede":"A、B 已经各自有序时，全局最小值必然是 A 的前端或 B 的前端——再没有第三种可能。","caption":"图 3　两路归并：比较前端 → 输出较小者 → 该侧指针前进一步；m+n 次必然结束","bridge":"道理简单，但它的每一步都值得看清。下一页让它真的动起来。","notes":"归并排序解决的原问题特别朴素：把两个或多个已经有序的序列，合成一个更大的有序序列。为什么代价是 O(m+n)？因为 A 和 B 都排好序了，A 前端那个元素已经是 A 里最小的，B 前端也是 B 里最小的，那全局最小只可能从这两个里产生。比较一次，输出较小的那个，那一侧的指针往前挪一格，剩下的还是两个有序序列——问题规模缩小了一格，结构完全没变。这个不变式一直保持到某一边耗尽，再把另一边剩余的直接接上。整个过程每个元素只被看一次、输出一次，没有回退，所以是线性的。注意这句话后面会反复用到：数据库之所以愿意为超内存排序写临时文件，正是因为它换来了这种「只顺序读、只比较前端」的访问模式。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"40\" y=\"70\" text-anchor=\"start\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" class=\"\">序列 A（有序）</text><text x=\"40\" y=\"160\" text-anchor=\"start\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" class=\"\">序列 B（有序）</text><text x=\"40\" y=\"328\" text-anchor=\"start\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" class=\"\">输出流</text><text x=\"170\" y=\"26\" text-anchor=\"start\" font-size=\"12\" fill=\"#BE653B\" font-weight=\"600\" class=\"\">前端</text><text x=\"170\" y=\"116\" text-anchor=\"start\" font-size=\"12\" fill=\"#BE653B\" font-weight=\"600\" class=\"\">前端</text><rect x=\"170\" y=\"36\" width=\"100\" height=\"56\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\"/><text x=\"220\" y=\"70\" text-anchor=\"middle\" font-size=\"18\" fill=\"#BE653B\" font-weight=\"600\" class=\"mono\">2</text><rect x=\"280\" y=\"36\" width=\"100\" height=\"56\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"330\" y=\"70\" text-anchor=\"middle\" font-size=\"18\" fill=\"#1B2B33\" font-weight=\"600\" class=\"mono\">5</text><rect x=\"390\" y=\"36\" width=\"100\" height=\"56\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"440\" y=\"70\" text-anchor=\"middle\" font-size=\"18\" fill=\"#1B2B33\" font-weight=\"600\" class=\"mono\">9</text><rect x=\"500\" y=\"36\" width=\"100\" height=\"56\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"550\" y=\"70\" text-anchor=\"middle\" font-size=\"18\" fill=\"#1B2B33\" font-weight=\"600\" class=\"mono\">13</text><rect x=\"610\" y=\"36\" width=\"100\" height=\"56\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"660\" y=\"70\" text-anchor=\ "M830 154 L1080 154\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.4\" stroke-linejoin=\"miter\"/><polygon points=\"1072,150 1080,154 1072,158\" fill=\"#245A6B\"/><rect x=\"170\" y=\"210\" width=\"280\" height=\"52\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\"/><text x=\"310\" y=\"238.24\" text-anchor=\"middle\" font-size=\"16\" fill=\"#245A6B\" font-weight=\"600\" class=\"serif\">①　只比两个前端</text><rect x=\"470\" y=\"210\" width=\"280\" height=\"52\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\"/><text x=\"610\" y=\"238.24\" text-anchor=\"middle\" font-size=\"16\" fill=\"#2F7A66\" font-weight=\"600\" class=\"serif\">②　输出较小者</text><rect x=\"770\" y=\"210\" width=\"280\" height=\"52\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\"/><text x=\"910\" y=\"238.24\" text-anchor=\"middle\" font-size=\"16\" fill=\"#BE653B\" font-weight=\"600\" class=\"serif\">③　该侧指针 +1</text><rect x=\"170\" y=\"294\" width=\"66\" height=\"56\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\"/><text x=\"203\" y=\"328\" text-anchor=\"middle\" font-size=\"18\" fill=\"#2F7A66\" font-weight=\"600\" class=\"mono\">1</text><rect x=\"242\" y=\"294\" width=\"66\" height=\"56\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\"/><text x=\"275\" y=\"328\" text-anchor=\"middle\" font-size=\"18\" fill=\"#2F7A66\" font-weight=\"600\" class=\"mono\">2</text><rect x=\"314\" y=\"294\" width=\"66\" height=\"56\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\"/><text x=\"347\" y=\"328\" text-anchor=\"middle\" font-size=\"18\" fill=\"#2F7A66\" font-weight=\"600\" class=\"mono\">5</text><rect x=\"386\" y=\"294\" width=\"66\" height=\"56\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\"/><text x=\"419\" y=\"328\" text-anchor=\"middle\" font-size=\"18\" fill=\"#2F7A66\" font-weight=\"600\" class=\"mono\">6</text><rect x=\"458\" y=\"294\" width=\"66\" height=\"56\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\"/><text x=\"491\" y=\"328\" text-anchor=\"middle\" font-size=\"18\" fill=\"#2F7A66\" font-weight=\"600\" class=\"mono\">7</text><rect x=\"530\" y=\"294\" width=\"66\" height=\"56\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\"/><text x=\"563\" y=\"328\" text-anchor=\"middle\" font-size=\"18\" fill=\"#2F7A66\" font-weight=\"600\" class=\"mono\">9</text><rect x=\"602\" y=\"294\" width=\"66\" height=\"56\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\"/><text x=\"635\" y=\"328\" text-anchor=\"middle\" font-size=\"18\" fill=\"#2F7A66\" font-weight=\"600\" class=\"mono\">13</text><rect x=\"674\" y=\"294\" width=\"66\" height=\"56\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\"/><text x=\"707\" y=\"328\" text-anchor=\"middle\" font-size=\"18\" fill=\"#2F7A66\" font-weight=\"600\" class=\"mono\">14</text><rect x=\"746\" y=\"294\" width=\"66\" height=\"56\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\"/><text x=\"779\" y=\"328\" text-anchor=\"middle\" font-size=\"18\" fill=\"#2F7A66\" font-weight=\"600\" class=\"mono\">18</text><rect x=\"818\" y=\"294\" width=\"66\" height=\"56\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\"/><text x=\"851\" y=\"328\" text-anchor=\"middle\" font-size=\"18\" fill=\"#2F7A66\" font-weight=\"600\" class=\"mono\">20</text><rect x=\"890\" y=\"294\" width=\"66\" height=\"56\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\"/><text x=\"923\" y=\"328\" text-anchor=\"middle\" font-size=\"18\" fill=\"#2F7A66\" font-weight=\"600\" class=\"mono\">21</text><rect x=\"962\" y=\"294\" width=\"66\" height=\"56\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\"/><text x=\"995\" y=\"328\" text-anchor=\"middle\" font-size=\"18\" fill=\"#2F7A66\" font-weight=\"600\" class=\"mono\">25</text><rect x=\"1080\" y=\"36\" width=\"280\" height=\"146\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\"/><text x=\"1220\" y=\"92.82\" text-anchor=\"middle\" font-size=\"18\" fill=\"#245A6B\" font-weight=\"700\" class=\"serif\">只需要两个候选</text><text x=\"1220\" y=\"114.84\" text-anchor=\"middle\" font-size=\"15\" fill=\"#1B2B33\" font-weight=\"500\" class=\"mono\">A[i] 与 B[j]</text><text x=\"1220\" y=\"133.19\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">其余元素仍在各自序列里</text><rect x=\"1080\" y=\"200\" width=\"280\" height=\"150\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\"/><text x=\"1220\" y=\"250.32\" text-anchor=\"middle\" font-size=\"18\" fill=\"#BE653B\" font-weight=\"700\" class=\"serif\">不变式</text><text x=\"1220\" y=\"271.11\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">输出后两侧仍各自有序</text><text x=\"1220\" y=\"289.47\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">问题规模只缩小一格</text><text x=\"1220\" y=\"307.42\" text-anchor=\"middle\" font-size=\"13\" fill=\"#89938F\" font-weight=\"400\" class=\"\">所以没有回退、没有重读</text><rect x=\"40\" y=\"370\" width=\"1320\" height=\"48\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"700\" y=\"396.24\" text-anchor=\"middle\" font-size=\"16\" fill=\"#1B2B33\" font-weight=\"600\" class=\"serif\">每个元素只被比较一次、输出一次　→　总代价 O(m+n)，与 n log n 无关</text></svg>","ctrl":"","anim":false},{"eyebrow":"演示 · 两路归并逐步走","title":"指针只前进，不回头","lede":"改一改两边的输入，用播放／单步看清楚：比较次数怎样一路累加到 m+n。","caption":"图 4　可交互演示：输入两条已排序序列，观察前端候选、输出流与比较次数（读数由本页脚本实时计算）","bridge":"把这个最小单元放大到「内存装不下」，就得到数据库的外部排序。","notes":"这一页请大家盯住三件事。第一，高亮的前端候选永远只有两个，跟输入有多长没关系；第二，每输出一个值，只有被输出的那一侧指针动，另一侧原地不动；第三，比较次数最后一定收敛到 m+n 量级。你可以在输入框里改成自己的数字，就算故意写成乱序，脚本也会先把它规整成升序并提示你——因为归并的前提就是输入已经有序，这个前提不能省。播放、暂停、单步、重置都在下面，愿意的话我们单步走完一轮。等一下把这两条序列换成几十条、上百条写在临时文件里的 run，你会看到结构一模一样：只不过前端候选从两个变成 M 个，比较工具从一个 if 变成一个 heap。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><g id=\"animA\"></g></svg>","ctrl":"<label>序列 A</label><input type=\"text\" id=\"aIn\" value=\"2,5,9,13,18,21\" size=\"17\"><label>序列 B</label><input type=\"text\" id=\"bIn\" value=\"1,6,7,14,20,25\" size=\"17\"><button class=\"btn play\" id=\"aPlay\">▶ 播放</button><button class=\"btn\" id=\"aTick\">单步 →</button><button class=\"btn\" id=\"aReset\">重置</button><div class=\"out\" id=\"aOut\"></div>","anim":true},{"eyebrow":"放大 · 外部排序的四个动作","title":"把「排不下」翻译成「多条 run」","lede":"内存装不下的不是排序问题本身，而是「一次性把所有 tuple 都留在内存里」这个做法。","caption":"图 5　外部排序流水线：攒批 → 批内排序写成 run → 重复产 run → 多路归并输出","bridge":"于是有个常见误解必须先拆掉：这不是教科书那个递归 mergesort。","notes":"现在把数据量放大一千倍。输入太大，不能一次性放进内存，怎么办？排序器做了四个动作：先在 memtuples[] 里攒够一批，攒到 work_mem 触碰上限；然后把这一批在内存里排好序，整批写进 logical tape，形成一条 sorted run；输入还在继续，就攒下一批、再写一条 run；等所有输入都吃完了，手上是若干条各自有序的 run，这时候只需要从每条 run 的前端各拿一个候选，就能不断吐出全局最小。你看，第三步那条 O(m+n) 的性质被完整继承了，只是把「两个序列」换成了「多条 tape」。这里面真正的工程智慧是：把一次做不到的全局排序，转换成若干次内存里做得到的局部排序，加一次顺序友好的合并。代价也很直白——临时文件的写入和多轮读取。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40\" y=\"20\" width=\"1320\" height=\"44\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"700\" y=\"44.24\" text-anchor=\"middle\" font-size=\"16\" fill=\"#1B2B33\" font-weight=\"600\" class=\"serif\">输入 tuple 持续从子计划流入，work_mem 是每一批的上限</text><rect x=\"40\" y=\"70\" width=\"290\" height=\"180\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.4\"/><text x=\"185\" y=\"144.64\" text-anchor=\"middle\" font-size=\"19\" fill=\"#245A6B\" font-weight=\"700\" class=\"serif\">① 攒够一批</text><text x=\"185\" y=\"165.97\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">memtuples[] 里积累 tuple</text><text x=\"185\" y=\"183.92\" text-anchor=\"middle\" font-size=\"13\" fill=\"#89938F\" font-weight=\"400\" class=\"\">触碰 work_mem 就停</text><rect x=\"390\" y=\"70\" width=\"290\" height=\"180\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.4\"/><text x=\"535\" y=\"144.64\" text-anchor=\"middle\" font-size=\"19\" fill=\"#2F7A66\" font-weight=\"700\" class=\"serif\">② 批内排序写 run</text><text x=\"535\" y=\"165.97\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">quicksort / radix 排好这一批</text><text x=\"535\" y=\"183.92\" text-anchor=\"middle\" font-size=\"13\" fill=\"#89938F\" font-weight=\"400\" class=\"\">顺序写入 logical tape</text><rect x=\"740\" y=\"70\" width=\"290\" height=\"180\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.4\"/><text x=\"885\" y=\"144.64\" text-anchor=\"middle\" font-size=\"19\" fill=\"#AE8A3E\" font-weight=\"700\" class=\"serif\">③ 重复产 run</text><text x=\"885\" y=\"165.97\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">输入继续，攒下一批再写</text><text x=\"885\" y=\"183.92\" text-anchor=\"middle\" font-size=\"13\" fill=\"#89938F\" font-weight=\"400\" class=\"\">得到多条各自有序的 run</text><rect x=\"1090\" y=\"70\" width=\"290\" height=\"180\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.4\"/><text x=\"1235\" y=\"144.64\" text-anchor=\"middle\" font-size=\"19\" fill=\"#BE653B\" font-weight=\"700\" class=\"serif\">④ 多路归并输出</text><text x=\"1235\" y=\"165.97\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">每条 run 只留一个前端候选</text><text x=\"1235\" y=\"183.92\" text-anchor=\"middle\" font-size=\"13\" fill=\"#89938F\" font-weight=\"400\" class=\"\">heap 吐出全局有序结果</text><path d=\"M330 160 L390 160\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.4\" stroke-linejoin=\"miter\"/><polygon points=\"382,156 390,160 382,164\" fill=\"#245A6B\"/><path d=\"M680 160 L740 160\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.4\" stroke-linejoin=\"miter\"/><polygon points=\"732,156 740,160 732,164\" fill=\"#245A6B\"/><path d=\"M1030 160 L1090 160\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.4\" stroke-linejoin=\"miter\"/><polygon points=\"1082,156 1090,160 1082,164\" fill=\"#245A6B\"/><rect x=\"40\" y=\"275\" width=\"1320\" height=\"135\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"700\" y=\"324.62\" text-anchor=\"middle\" font-size=\"18\" fill=\"#BE653B\" font-weight=\"700\" class=\"serif\">关键转化</text><text x=\"700\" y=\"347.46\" text-anchor=\"middle\" font-size=\"16\" fill=\"#1B2B33\" font-weight=\"500\" class=\"\">把「一次排不下」变成「若干次内存里排得下的局部排序 + 一次顺序友好的合并」</text><text x=\"700\" y=\"367.58\" text-anchor=\"middle\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" class=\"\">代价：临时文件写入，以及每个 merge pass 的重复读写</text></svg>","ctrl":"","anim":false},{"eyebrow":"辨误 · 两个都叫 merge，不是一回事","title":"run 内部不是 mergesort","lede":"教科书递归拆分两半再合并；PostgreSQL 是批内 quicksort／radix，批间 balanced k-way merge。","caption":"图 6　左侧为算法教科书中的递归 mergesort，右侧为 PostgreSQL 当前外部排序实现","bridge":"那执行器到底是怎样把 tuple 喂进这套机制的？看 Sort 节点。","notes":"这里是最容易翻车的地方，我得多说两句。经典 mergesort 从无序数组开始，不断二分、递归排序左右两半、再自底向上合并，复杂度 O(n log n)，优点是顺序访问友好、稳定排序容易实现。PostgreSQL 现在不这么干。tuplesort.c 的顶部注释写得很清楚：历史上用过 replacement selection，也就是用堆生成尽量长的 run；但当前总是用 quicksort（较新版本还有 radix sort 快路径）来生成 run。堆现在主要用在两个地方——Top-N heapsort，以及归并阶段管理每条 tape 的前端候选。所以准确的说法是：run 内部由 quicksort 或 radix sort 排序，run 之间由 balanced k-way merge 合并。为什么要改？因为乱序数据下 quicksort 对 CPU cache 更友好，而 logical tape 让「多几条磁带」几乎不要钱，没必要再用 replacement selection 拼命把 run 撑长。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40\" y=\"40\" width=\"620\" height=\"56\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\"/><text x=\"350\" y=\"70.66\" text-anchor=\"middle\" font-size=\"19\" fill=\"#245A6B\" font-weight=\"700\" class=\"serif\">教科书 · 递归 mergesort</text><rect x=\"740\" y=\"40\" width=\"620\" height=\"56\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\"/><text x=\"1050\" y=\"70.66\" text-anchor=\"middle\" font-size=\"19\" fill=\"#BE653B\" font-weight=\"700\" class=\"serif\">PostgreSQL · 当前外部排序</text><rect x=\"40\" y=\"106\" width=\"620\" height=\"54\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"350\" y=\"135.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#46585F\" font-weight=\"400\" class=\"\">无序数组 → 不断二分拆成左右两半</text><rect x=\"740\" y=\"106\" width=\"620\" height=\"54\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1050\" y=\"135.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#46585F\" font-weight=\"400\" class=\"\">输入流 → 攒满一批 memtuples[]</text><rect x=\"40\" y=\"168\" width=\"620\" height=\"54\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"350\" y=\"197.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#46585F\" font-weight=\"400\" class=\"\">递归排序两半，再自底向上合并</text><rect x=\"740\" y=\"168\" width=\"620\" height=\"54\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1050\" y=\"197.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#46585F\" font-weight=\"400\" class=\"\">批内 quicksort / radix → 写成 sorted run</text><rect x=\"40\" y=\"230\" width=\"620\" height=\"54\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"350\" y=\"259.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#46585F\" font-weight=\"400\" class=\"\">额外空间通常 O(n)，稳定排序易实现</text><rect x=\"740\" y=\"230\" width=\"620\" height=\"54\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1050\" y=\"259.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#46585F\" font-weight=\"400\" class=\"\">多条 run → balanced k-way merge 输出</text><rect x=\"40\" y=\"292\" width=\"620\" height=\"54\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"350\" y=\"321.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#46585F\" font-weight=\"400\" class=\"\">整个框架从头到尾都是 merge</text><rect x=\"740\" y=\"292\" width=\"620\" height=\"54\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1050\" y=\"321.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#46585F\" font-weight=\"400\" class=\"\">heap 用于 Top-N 与归并前端候选</text><text x=\"700\" y=\"208\" text-anchor=\"middle\" font-size=\"32\" fill=\"#BE653B\" font-weight=\"700\" class=\"serif\">≠</text><rect x=\"40\" y=\"362\" width=\"1320\" height=\"56\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1\"/><text x=\"700\" y=\"392.38\" text-anchor=\"middle\" font-size=\"17\" fill=\"#1B2B33\" font-weight=\"600\" class=\"serif\">准确说法：run 内部 quicksort / radix sort，run 之间 balanced k-way merge</text></svg>","ctrl":"","anim":false},{"eyebrow":"入口 · nodeSort.c","title":"Sort 是个阻塞算子","lede":"第一次 ExecSort() 会先吃完整个子计划输入，才允许返回第一行结果。","caption":"图 7　ExecSort() 的调用顺序：初始化 → 设预算／bound → 循环喂入 → performsort → 逐个取出","bridge":"喂进去之后，谁决定走内存还是落盘？是 tuplesort 的状态机。","notes":"看源码顺序最能说明问题。nodeSort.c 里，第一次调用 ExecSort() 做六件事：用 tuplesort_begin_heap() 或 begin_datum() 初始化排序器；把 work_mem 作为内存预算传进去；如果计划节点带 bounded 信息，就调 tuplesort_set_bound()；然后循环执行外层子计划，把每一行通过 tuplesort_puttupleslot() 或 putdatum() 喂进去；喂完调用 tuplesort_performsort()；之后的调用才用 gettupleslot() 逐个取结果。这条顺序直接解释了为什么普通 Sort 是阻塞算子——最后一行输入没进来之前，它不知道全局最小是谁，第一行就不能返回。反过来也解释了为什么小 LIMIT 场景下，优化器特别想用匹配 ORDER BY 的 B-tree 索引：索引能直接按序吐出前 N 行，连 Sort 节点都不用建。官方文档在讲索引满足 ORDER BY 时也说了这一点。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40\" y=\"18\" width=\"70\" height=\"50\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"75\" y=\"45.8\" text-anchor=\"middle\" font-size=\"20\" fill=\"#245A6B\" font-weight=\"700\" class=\"serif\">①</text><rect x=\"120\" y=\"18\" width=\"520\" height=\"50\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"380\" y=\"45.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#1B2B33\" font-weight=\"500\" class=\"mono\">tuplesort_begin_heap() / begin_datum()</text><rect x=\"660\" y=\"18\" width=\"700\" height=\"50\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1010\" y=\"45.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#46585F\" font-weight=\"400\" class=\"\">初始化排序器，确定 tuple 读写与比较回调</text><rect x=\"40\" y=\"78\" width=\"70\" height=\"50\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"75\" y=\"105.8\" text-anchor=\"middle\" font-size=\"20\" fill=\"#245A6B\" font-weight=\"700\" class=\"serif\">②</text><rect x=\"120\" y=\"78\" width=\"520\" height=\"50\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"380\" y=\"105.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#1B2B33\" font-weight=\"500\" class=\"mono\">以 work_mem 作为内存预算</text><rect x=\"660\" y=\"78\" width=\"700\" height=\"50\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1010\" y=\"105.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#46585F\" font-weight=\"400\" class=\"\">决定这一批能攒多少 tuple</text><rect x=\"40\" y=\"138\" width=\"70\" height=\"50\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"75\" y=\"165.8\" text-anchor=\"middle\" font-size=\"20\" fill=\"#245A6B\" font-weight=\"700\" class=\"serif\">③</text><rect x=\"120\" y=\"138\" width=\"520\" height=\"50\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"380\" y=\"165.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#1B2B33\" font-weight=\"500\" class=\"mono\">tuplesort_set_bound()（若有 bound）</text><rect x=\"660\" y=\"138\" width=\"700\" height=\"50\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1010\" y=\"165.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#46585F\" font-weight=\"400\" class=\"\">把 LIMIT 信息传给排序器</text><rect x=\"40\" y=\"198\" width=\"70\" height=\"50\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"75\" y=\"225.8\" text-anchor=\"middle\" font-size=\"20\" fill=\"#BE653B\" font-weight=\"700\" class=\"serif\">④</text><rect x=\"120\" y=\"198\" width=\"520\" height=\"50\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"380\" y=\"225.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#1B2B33\" font-weight=\"500\" class=\"mono\">循环子计划：puttupleslot() / putdatum()</text><rect x=\"660\" y=\"198\" width=\"700\" height=\"50\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1010\" y=\"225.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#46585F\" font-weight=\"400\" class=\"\">把输入全部吃进来</text><rect x=\"40\" y=\"258\" width=\"70\" height=\"50\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"75\" y=\"285.8\" text-anchor=\"middle\" font-size=\"20\" fill=\"#BE653B\" font-weight=\"700\" class=\"serif\">⑤</text><rect x=\"120\" y=\"258\" width=\"520\" height=\"50\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"380\" y=\"285.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#1B2B33\" font-weight=\"500\" class=\"mono\">tuplesort_performsort()</text><rect x=\"660\" y=\"258\" width=\"700\" height=\"50\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1010\" y=\"285.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#46585F\" font-weight=\"400\" class=\"\">内存排序，或生成 run 后归并</text><rect x=\"40\" y=\"318\" width=\"70\" height=\"50\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"75\" y=\"345.8\" text-anchor=\"middle\" font-size=\"20\" fill=\"#245A6B\" font-weight=\"700\" class=\"serif\">⑥</text><rect x=\"120\" y=\"318\" width=\"520\" height=\"50\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"380\" y=\"345.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#1B2B33\" font-weight=\"500\" class=\"mono\">gettupleslot() / getdatum() 逐个取结果</text><rect x=\"660\" y=\"318\" width=\"700\" height=\"50\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1010\" y=\"345.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#46585F\" font-weight=\"400\" class=\"\">上层这才开始看到行</text><rect x=\"40\" y=\"380\" width=\"1320\" height=\"48\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1\"/><text x=\"700\" y=\"406.24\" text-anchor=\"middle\" font-size=\"16\" fill=\"#BE653B\" font-weight=\"600\" class=\"serif\">阻塞：最后一行输入没进来之前，Sort 不知道全局最小是谁，第一行就不能返回</text></svg>","ctrl":"","anim":false},{"eyebrow":"分流 · tuplesort 状态机","title":"六态三条路，只有一个判据","lede":"TSS_INITIAL 是乐观起点；内存、Top-N、外部，三条路在触碰 work_mem 的那一刻分叉。","caption":"图 8　TupSortStatus 状态迁移：INITIAL / BOUNDED / SORTEDINMEM / BUILDRUNS / SORTEDONTAPE / FINALMERGE","bridge":"分叉之后，外部那条路上第一个具体动作叫 dumptuples()。","notes":"tuplesort.c 里定义了一个六状态枚举，整个模块基本就是围着它做 switch。TSS_INITIAL 是「正在加载 tuple，还在内存限制内」的乐观状态；如果输入到结束都没超预算，performsort 直接排完，进 TSS_SORTEDINMEM。如果规划器传了 bound，也就是 ORDER BY ... LIMIT，会转进 TSS_BOUNDED 用固定大小的堆只留前 K 个候选，这条路不是归并排序。真正跟今天有关的是：puttuple_common() 发现 memtuples[] 或 tuple 内存触碰 work_mem 时，调 inittapes() 进 TSS_BUILDRUNS，然后 dumptuples() 把当前批次排序并写到 tape 上。收尾时要么把最终结果物化成一条 tape，进 TSS_SORTEDONTAPE；要么在最后一轮边归并边返回，进 TSS_FINALMERGE。记住这六个名字，等一下读 EXPLAIN 的时候，方法名就是它们映射出来的。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40\" y=\"30\" width=\"250\" height=\"80\" rx=\"0\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1\"/><text x=\"165\" y=\"64.02\" text-anchor=\"middle\" font-size=\"18\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"mono\">TSS_INITIAL</text><text x=\"165\" y=\"83.99\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#CFE0DC\" font-weight=\"400\" class=\"\">正在加载 tuple</text><path d=\"M290 70 L330 70 L330 368\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"/><path d=\"M330 64 L370 64\" fill=\"none\" stroke=\"#AE8A3E\" stroke-width=\"1.4\" stroke-linejoin=\"miter\"/><polygon points=\"362,60 370,64 362,68\" fill=\"#AE8A3E\"/><rect x=\"370\" y=\"30\" width=\"990\" height=\"68\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.3\"/><text x=\"865\" y=\"57.54\" text-anchor=\"middle\" font-size=\"17\" fill=\"#AE8A3E\" font-weight=\"700\" class=\"mono\">TSS_BOUNDED　·　Top-N heapsort</text><text x=\"865\" y=\"77.38\" text-anchor=\"middle\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">只保留 K 个候选；空间 Memory；不是归并排序</text><path d=\"M330 140 L370 140\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.4\" stroke-linejoin=\"miter\"/><polygon points=\"362,136 370,140 362,144\" fill=\"#245A6B\"/><rect x=\"370\" y=\"106\" width=\"990\" height=\"68\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.3\"/><text x=\"865\" y=\"133.54\" text-anchor=\"middle\" font-size=\"17\" fill=\"#245A6B\" font-weight=\"700\" class=\"mono\">TSS_SORTEDINMEM　·　quicksort</text><text x=\"865\" y=\"153.38\" text-anchor=\"middle\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">输入没超预算，排完 memtuples[] 直接返回</text><path d=\"M330 216 L370 216\" fill=\"none\" stroke=\"#BE653B\" stroke-width=\"1.4\" stroke-linejoin=\"miter\"/><polygon points=\"362,212 370,216 362,220\" fill=\"#BE653B\"/><rect x=\"370\" y=\"182\" width=\"990\" height=\"68\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.3\"/><text x=\"865\" y=\"209.54\" text-anchor=\"middle\" font-size=\"17\" fill=\"#BE653B\" font-weight=\"700\" class=\"mono\">TSS_BUILDRUNS　·　生成 run</text><text x=\"865\" y=\"229.38\" text-anchor=\"middle\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">触碰 work_mem → inittapes() → dumptuples() 写 tape</text><path d=\"M330 292 L370 292\" fill=\"none\" stroke=\"#BE653B\" stroke-width=\"1.4\" stroke-linejoin=\"miter\"/><polygon points=\"362,288 370,292 362,296\" fill=\"#BE653B\"/><rect x=\"370\" y=\"258\" width=\"990\" height=\"68\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.3\"/><text x=\"865\" y=\"285.54\" text-anchor=\"middle\" font-size=\"17\" fill=\"#BE653B\" font-weight=\"700\" class=\"mono\">TSS_SORTEDONTAPE　·　external sort</text><text x=\"865\" y=\"305.38\" text-anchor=\"middle\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">最终结果物化在一条 tape 上；空间 Disk</text><path d=\"M330 368 L370 368\" fill=\"none\" stroke=\"#2F7A66\" stroke-width=\"1.4\" stroke-linejoin=\"miter\"/><polygon points=\"362,364 370,368 362,372\" fill=\"#2F7A66\"/><rect x=\"370\" y=\"334\" width=\"990\" height=\"68\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.3\"/><text x=\"865\" y=\"361.54\" text-anchor=\"middle\" font-size=\"17\" fill=\"#2F7A66\" font-weight=\"700\" class=\"mono\">TSS_FINALMERGE　·　external merge</text><text x=\"865\" y=\"381.38\" text-anchor=\"middle\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">最后一轮边归并边返回，省掉一轮全量写读</text></svg>","ctrl":"","anim":false},{"eyebrow":"前半段 · run generation","title":"一批 tuple 变成一条 run","lede":"dumptuples() 只做三件事，但它把内存压力翻译成了后续归并的工作量。","caption":"图 9　dumptuples() 的三步与 tape 上的多条 sorted run；run 越多，后续 merge pass 越多","bridge":"run 数到底由什么决定？下一页用可调参数把它算给你看。","notes":"dumptuples() 的逻辑干净得有点出乎意料：第一，确认当前内存批次该落盘了；第二，调 tuplesort_sort_memtuples() 把 memtuples[] 排好；第三，按顺序把排好的 tuple 写进当前输出 tape，markrunend 收尾，形成一条 run。tuplesort_sort_memtuples() 内部还有一层选择：leading key 可用且比较器是整数类、元素数达到 QSORT_THRESHOLD 时走 radix_sort_tuple()；单 key 快路径走 qsort_ssup()；其余走 qsort_tuple()。输入结束后，performsort() 对 BUILDRUNS 做收尾，先 dumptuples(state, true) 写出最后一批，再调 mergeruns()。这一步的工程含义特别重要：排序器不再硬扛「把所有输入留在内存」，而是把内存不足转换成「生成更多有序 run」。run 数于是成了一个枢纽指标——它越多，heap 越大、merge pass 越多、临时文件重复 I/O 越多；它越少，说明每批更大，往往意味着 work_mem 更宽裕或者行更窄。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40\" y=\"24\" width=\"540\" height=\"96\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.4\"/><text x=\"310\" y=\"65.2\" text-anchor=\"middle\" font-size=\"17\" fill=\"#245A6B\" font-weight=\"700\" class=\"serif\">① 确认当前批次需要落盘</text><text x=\"310\" y=\"85.45\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">memtuples[] 或 tuple 内存触碰 work_mem</text><rect x=\"40\" y=\"142\" width=\"540\" height=\"96\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.4\"/><text x=\"310\" y=\"183.2\" text-anchor=\"middle\" font-size=\"17\" fill=\"#2F7A66\" font-weight=\"700\" class=\"serif\">② 排序这一批</text><text x=\"310\" y=\"203.45\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">tuplesort_sort_memtuples()：quicksort / radix</text><rect x=\"40\" y=\"260\" width=\"540\" height=\"96\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.4\"/><text x=\"310\" y=\"301.2\" text-anchor=\"middle\" font-size=\"17\" fill=\"#BE653B\" font-weight=\"700\" class=\"serif\">③ 写成一条 run</text><text x=\"310\" y=\"321.45\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">顺序写入输出 tape，markrunend() 收尾</text><path d=\"M580 190 L620 190\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.4\" stroke-linejoin=\"miter\"/><polygon points=\"612,186 620,190 612,194\" fill=\"#245A6B\"/><rect x=\"620\" y=\"30\" width=\"740\" height=\"336\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"640\" y=\"58\" text-anchor=\"start\" font-size=\"16\" fill=\"#1B2B33\" font-weight=\"600\" class=\"serif\">logical tape 上的多条 sorted run</text><rect x=\"650\" y=\"90\" width=\"680\" height=\"44\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#245A6B\" stroke-width=\"1\"/><text x=\"990\" y=\"113.96\" text-anchor=\"middle\" font-size=\"14\" fill=\"#245A6B\" font-weight=\"600\" class=\"mono\">run 1　内存批次已排好序　→　tape A</text><rect x=\"650\" y=\"150\" width=\"680\" height=\"44\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#47808D\" stroke-width=\"1\"/><text x=\"990\" y=\"173.96\" text-anchor=\"middle\" font-size=\"14\" fill=\"#47808D\" font-weight=\"600\" class=\"mono\">run 2　内存批次已排好序　→　tape B</text><rect x=\"650\" y=\"210\" width=\"680\" height=\"44\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#74A5AD\" stroke-width=\"1\"/><text x=\"990\" y=\"233.96\" text-anchor=\"middle\" font-size=\"14\" fill=\"#74A5AD\" font-weight=\"600\" class=\"mono\">run 3　内存批次已排好序　→　tape C</text><rect x=\"650\" y=\"270\" width=\"680\" height=\"44\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#BE653B\" stroke-width=\"1\"/><text x=\"990\" y=\"293.96\" text-anchor=\"middle\" font-size=\"14\" fill=\"#BE653B\" font-weight=\"600\" class=\"mono\">run 4　内存批次已排好序　→　tape D</text><text x=\"650\" y=\"345\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#BE653B\" font-weight=\"600\" class=\"\">run 数 ↑　→　heap 大小 ↑ / merge pass ↑ / 重复 I/O ↑</text><rect x=\"40\" y=\"382\" width=\"1320\" height=\"44\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1\"/><text x=\"700\" y=\"406.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#1B2B33\" font-weight=\"600\" class=\"mono\">输入结束后 performsort() 先 dumptuples(state, true) 写最后一批，再 mergeruns()</text></svg>","ctrl":"","anim":false},{"eyebrow":"演示 · work_mem 怎样改变成本","title":"调大内存，究竟改了什么","lede":"拖动 work_mem，观察 run 数、merge order、merge pass 与累计临时 I/O 的联动。","caption":"图 10　可交互推演：按 cost_tuplesort() 与 tuplesort_merge_order() 的公式实时计算（示意模型，非实测基准）","bridge":"run 数降下来了，接住这些 run 的结构，是一个 heap。","notes":"这一页请大家自己动手。左边的行数、行宽，中间的 work_mem 滑杆，右边四个读数会跟着变。计算用的是源码里的关系：run 数约等于输入字节数除以 work_mem 字节数；merge order M 由 tuplesort_merge_order() 给出，等于 allowedMem 除以「两条 tape 的固定开销加一条 tape 的预读缓冲」，再被 MINORDER=6 和 MAXORDER=500 两头夹住；merge pass 数约等于以 M 为底对 run 数取对数再上取整。我必须强调：这是按源码公式做的示意模型，行宽被近似成排序 tuple 的内存占用，不是 PostgreSQL 实测基准，真实环境还受 tuple 头、palloc、abbreviated key、并发和 OS cache 影响。但趋势是真实的：work_mem 变大，run 数下降、pass 数下降；而 M 撞到 500 就不动了，说明「内存越大越快」并不成立。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><g id=\"animB\"></g></svg>","ctrl":"<label>行数</label><select id=\"bRows\"><option value=\"1000000\">100 万行</option><option value=\"5000000\" selected>500 万行</option><option value=\"20000000\">2000 万行</option></select><label>行宽</label><select id=\"bWidth\"><option value=\"32\">窄 32B</option><option value=\"128\" selected>中 128B</option><option value=\"512\">宽 512B</option></select><label>work_mem</label><input type=\"range\" id=\"bMem\" min=\"1\" max=\"256\" step=\"1\" value=\"4\"><span id=\"bMemVal\" style=\"font-family:var(--mono);font-size:12.5px;color:var(--accent);min-width:48px\">4MB</span><button class=\"btn play\" id=\"bPlay\">▶ 播放</button><button class=\"btn\" id=\"bTick\">单步 →</button><button class=\"btn\" id=\"bReset\">重置</button><div class=\"out\" id=\"bOut\"></div>","anim":true},{"eyebrow":"后半段 · balanced k-way merge","title":"每条 run 只留一个候选","lede":"归并阶段不需要把任何一条 run 完整读进内存，只需要 M 个前端 tuple 和一个小堆。","caption":"图 11　beginmerge() 从每条输入 tape 读第一个 tuple 入堆；堆大小约等于本轮输入 tape 数 M","bridge":"那这个堆每输出一个 tuple，内部具体怎么动？看一轮循环。","notes":"多路归并的核心结构是个二叉最小堆。beginmerge() 从每条输入 tape 读第一个 tuple，插进 memtuples[] 维护的堆里——注意这个 memtuples[] 已经被重新分配过，mergeruns() 会把原来装整批 tuple 的大数组释放掉，只留每条输入 tape 一个槽，元组内存改用 slab allocator 固定大小的 slot，剩下的内存全部给 tape 做预读缓冲。所以归并阶段的内存画像跟攒批阶段完全不同。复杂度也跟着变了：每输出一个 tuple，只需要在大小约为 M 的堆上做一次替换堆顶加下滤，代价 O(log M)。I/O 上，每个 merge pass 大致把参与归并的数据读一遍写一遍。这里还有个版本差异值得记：PG15 之前用的是 polyphase merge，Knuth 的 5.4.2D；2021 年 Heikki Linnakangas 的 commit 65014000b 换成了 straightforward balanced k-way merge。理由很实在——Knuth 假设磁带机很贵、run 数远多于磁带数；而 logical tape 只花几 KB 缓冲，多开几条几乎不要钱，tape 数足够接近 run 数时甚至能把重复 I/O 完全消掉。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"40\" y=\"62\" text-anchor=\"start\" font-size=\"14\" fill=\"#46585F\" font-weight=\"600\" class=\"mono\">run 1</text><rect x=\"150\" y=\"30\" width=\"88\" height=\"52\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\"/><text x=\"194\" y=\"62\" text-anchor=\"middle\" font-size=\"18\" fill=\"#BE653B\" font-weight=\"600\" class=\"mono\">1</text> 小 ≈ 本轮输入 tape 数 M</text><rect x=\"880\" y=\"80\" width=\"460\" height=\"48\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\"/><text x=\"1110\" y=\"106.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#1B2B33\" font-weight=\"500\" class=\"mono\">1　← tape 1</text><rect x=\"880\" y=\"138\" width=\"460\" height=\"48\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1110\" y=\"164.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#1B2B33\" font-weight=\"500\" class=\"mono\">3　← tape 2</text><rect x=\"880\" y=\"196\" width=\"460\" height=\"48\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1110\" y=\"222.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#1B2B33\" font-weight=\"500\" class=\"mono\">5　← tape 3</text><rect x=\"880\" y=\"254\" width=\"460\" height=\"48\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1110\" y=\"280.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#1B2B33\" font-weight=\"500\" class=\"mono\">7　← tape 4</text><rect x=\"40\" y=\"350\" width=\"1320\" height=\"68\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"700\" y=\"377.2\" text-anchor=\"middle\" font-size=\"17\" fill=\"#1B2B33\" font-weight=\"600\" class=\"serif\">每输出一个 tuple，只在大小约 M 的堆上调整一次　→　O(log M)</text><text x=\"700\" y=\"397.45\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">mergeruns() 已把大 memtuples[] 换成「每 tape 一个 slab slot + tape 预读缓冲」</text></svg>","ctrl":"","anim":false},{"eyebrow":"机制 · 一轮 heap 循环","title":"输出堆顶，同源补位","lede":"mergeonerun() 的循环只有三步，却保证了全局有序且不重复读。","caption":"图 12　四个时刻的快照：输出堆顶 → 从同一 tape 取下一个 → replace_top 下滤 → tape 耗尽则删堆顶","bridge":"堆的大小 M 从哪来？这正是 merge order 要回答的问题。","notes":"把一轮循环拆成慢动作。时刻一，堆里是四条 tape 的前端候选，堆顶是当前全局最小；时刻二，把这个堆顶写到输出 tape，同时记下它来自哪条 tape——SortTuple 结构里有个 srctape 字段，就是干这个用的；时刻三，只从那一条 tape 读下一个 tuple，用 tuplesort_heap_replace_top() 覆盖堆顶再下滤，一次完成，避免先删后插两次调整；时刻四，如果那条 tape 已经读到头，就调 "400\" class=\"\">但每条 tape 缓冲变薄、预读退化</text><text x=\"360\" y=\"353.1\" text-anchor=\"middle\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">heap 与 CPU cache 压力上升</text><rect x=\"720\" y=\"240\" width=\"640\" height=\"160\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.4\"/><text x=\"1040\" y=\"294.78\" text-anchor=\"middle\" font-size=\"19\" fill=\"#2F7A66\" font-weight=\"700\" class=\"serif\">调大 work_mem 的真正收益</text><text x=\"1040\" y=\"316.52\" text-anchor=\"middle\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" class=\"\">run 数减少</text><text x=\"1040\" y=\"335.56\" text-anchor=\"middle\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" class=\"\">给到合理的 merge order</text><text x=\"1040\" y=\"353.78\" text-anchor=\"middle\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">改善 tape 预读、减少重复 I/O</text></svg>","ctrl":"","anim":false},{"eyebrow":"存储 · logtape.c","title":"一个文件，模拟多条磁带","lede":"读完的块立刻回收，避免了「输入 tape 加输出 tape」把磁盘峰值撑到两倍数据量的老问题。","caption":"图 14　logtape.c 在单个 logical file 中用 BLCKSZ 块链模拟多条 tape，free block 池循环利用","bridge":"空间复用之后，还有一轮 I/O 可以省：最后一轮别写回去了。","notes":"logtape.c 的注释点出外部归并一个很老的问题：如果每条 tape 都用独立文件，最终归并时同一份数据会同时存在于输入 tape 和输出 tape 里，峰值空间至少接近数据量的两倍。PostgreSQL 的办法是在一个 logical file 里模拟多条 tape，每条 tape 用 BLCKSZ 大小的块串成链；某个 tape 的块被读完后，这些块立刻回收进 free block 池，可以分配给新的输出 tape。读 tape 时一次读多个块，改善顺序访问；并行排序时 leader 还能把各 worker 的 tapeset 拼成统一的 logical tapeset，底层由 buffile.c 处理超过单文件限制的情况。这里直接推出一个很实用的结论：EXPLAIN 里的 Disk: xxxkB 不是「排序结果文件大小」的同义词，它是 tuplesort_get_stats() 记录到的排序过程中最大磁盘空间占用。真实压力还得结合 temp_tablespaces 所在的盘、log_temp_files、pg_stat_database.temp_bytes、并发查询和 OS cache 一起看。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40\" y=\"20\" width=\"1320\" height=\"44\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"700\" y=\"44.24\" text-anchor=\"middle\" font-size=\"16\" fill=\"#1B2B33\" fon B\" font-weight=\"600\" class=\"serif\">读完的块立刻回收复用　→　Disk 是排序过程中的峰值占用，不是结果文件大小</text></svg>","ctrl":"","anim":false},{"eyebrow":"优化 · TSS_FINALMERGE","title":"最后一轮，边归并边返回","lede":"如果调用方不需要随机访问，最终结果没必要先完整写进 tape 再读回来。","caption":"图 15　两条收尾路径：物化成一条 tape → external sort；在线归并输出 → external merge","bridge":"这正好解释了 EXPLAIN 里那几个方法名的来历。","notes":"mergeruns() 有个特别讨喜的优化。如果调用方没有要求 TUPLESORT_RANDOMACCESS，而且已经到了最后一轮归并，它就不把全局有序结果完整写到一个 tape 上再读回来，而是进 TSS_FINALMERGE，由 tuplesort_gettuple_common() 在调用方不断取 tuple 的时候在线归并、边算边吐。省掉的是一整轮「写全部 + 读全部」。这个状态直接对应 tuplesort_get_stats() 里的两个方法名：最终结果已经物化在 tape 上是 external sort，正在或曾经通过最终在线归并输出是 external merge。顺便说一句，这也是为什么我们在真实环境里更常看到 external merge 而不是 external sort——大多数上层算子都是顺序取结果的。到这里，从状态机到方法名的链条就闭合了：状态不是抽象概念，它会被 explain.c 的 show_sort_info() 原样打印给你看。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40\" y=\"40\" width=\"640\" height=\"250\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><text x=\"360\" y=\"130.4\" text-anchor=\"middle\" font-size=\"20\" fill=\"#245A6B\" font-weight=\"700\" class=\"serif\">需要随机访问 / 物化结果</text><text x=\"360\" y=\"152.68\" text-anchor=\"middle\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" class=\"\">mergeruns() 把最终结果完整写成一个 tape</text><text x=\"360\" y=\"171.72\" text-anchor=\"middle\" font-size=\"14\" fill=\"#46585F\" font-weight=\"500\" class=\"mono\">状态 TSS_SORTEDONTAPE</text><text x=\"360\" y=\"190.76\" text-anchor=\"middle\" font-size=\"14\" fill=\"#BE653B\" font-weight=\"600\" class=\"mono\">Sort Method: external sort   Disk: ...</text><text x=\"360\" y=\"208.98\" text-anchor=\"middle\" font-size=\"13\" fill=\"#89938F\" font-weight=\"400\" class=\"\">多一轮「写全部 + 读全部」</text><rect x=\"720\" y=\"40\" width=\"640\" height=\"250\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.6\"/><text x=\"1040\" y=\"131.08\" text-anchor=\"middle\" font-size=\"20\" fill=\"#2F7A66\" font-weight=\ 式，方法名由 tuplesort_method_name() 定义，但本文没有在本机启动 PostgreSQL 跑出这些数字，所以不要把它们当成本文的实测结果。看计划时的正确姿势是：先看方法名判路径，再看 Memory/Disk 判有没有落盘，最后结合 BUFFERS 和耗时判是不是真的该治理。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40\" y=\"24\" width=\"300\" height=\"48\" rx=\"0\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1\"/><text x=\"190\" y=\"50.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#FFFFFF\" font-weight=\"600\" class=\"mono\">Sort Method</text><rect x=\"350\" y=\"24\" width=\"440\" height=\"48\" rx=\"0\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1\"/><text x=\"570\" y=\"50.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#FFFFFF\" font-weight=\"600\" class=\"mono\">触发条件</text><rect x=\"800\" y=\"24\" width=\"280\" height=\"48\" rx=\"0\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1\"/><text x=\"940\" y=\"50.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#FFFFFF\" font-weight=\"600\" class=\"mono\">tuplesort 状态</text><rect x=\"1090\" y=\"24\" width=\"270\" height=\"48\" rx=\"0\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1\"/><text x=\"1225\" y=\"50.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#FFFFFF\" font-weight=\"600\" class=\"mono\">空间类型</text><rect x=\"40\" y=\"80\" width=\"300\" height=\"70\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\"/><text x=\"190\" y=\"117.24\" text-anchor=\"middle\" font-size=\"16\" fill=\"#245A6B\" font-weight=\"700\" class=\"mono\">quicksort</text><rect x=\"350\" y=\"80\" width=\"440\" height=\"70\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"570\" y=\"117.03\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">输入没超 work_mem，完整排序</text><rect x=\"800\" y=\"80\" width=\"280\" height=\"70\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"940\" y=\"116.82\" text-anchor=\"middle\" font-size=\"13\" fill= 返回结果，其他索引类型通常不保证 ORDER BY 需要的顺序。所以调优顺序应该是「先用访问路径减少排序需求」，再谈内存参数。顺序搞反了，就是把本该用索引解决的在线接口，硬扛成批处理式的落盘排序。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"80\" y=\"26\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" class=\"\">判断</text><text x=\"850\" y=\"26\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" class=\"\">命中则</text><text x=\"1257\" y=\"26\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" class=\"\">否则</text><rect x=\"40\" y=\"44\" width=\"70\" height=\"76\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"75\" y=\"84.8\" text-anchor=\"middle\" font-size=\"20\" fill=\"#2F7A66\" font-weight=\"700\" class=\"serif\">①</text><rect x=\"125\" y=\"44\" width=\"430\" height=\"76\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"340\" y=\"75.74\" text-anchor=\"middle\" font-size=\"16\" fill=\"#1B2B33\" font-weight=\"600\" class=\"serif\">已有有序路径？</text><text x=\"340\" y=\"94.63\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">B-tree / pathkeys / 有序前缀</text><rect x=\"575\" y=\"44\" width=\"560\" height=\"76\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\"/><text x=\"855\" y=\"75.6\" text-anchor=\"middle\" font-size=\"15\" fill=\"#2F7A66\" font-weight=\"600\" class=\"\">直接有序输出或 Incremental Sort</text><text x=\"855\" y=\"93.95\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">Sort 节点可能根本不出现</text><rect x=\"1155\" y=\"44\" width=\"205\" height=\"76\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1257.5\" y=\"84.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#89938F\" font-weight=\"600\" class=\"\">否 ↓</text><rect x=\"40\" y=\"132\" width=\"70\" height=\"76\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"75\" y=\"172.8\" text-anchor=\"middle\" font-size=\"20\" fill=\"#2F7A66\" font-weight=\"700\" class=\"serif\">②</text><rect x=\"125\" y=\"132\" width=\"430\" height=\"76\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"340\" y=\"163.74\" text-anchor=\"middle\" font-size=\"16\" fill=\"#1B2B33\" font-weight=\"600\" class=\"serif\">只要前 K 行？</text><text x=\"340\" y=\"182.63\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">ORDER BY ... LIMIT</text><rect x=\"575\" y=\"132\" width=\"560\" height=\"76\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\"/><text x=\"855\" y=\"163.6\" text-anchor=\"middle\" font-size=\"15\" fill=\"#2F7A66\" font-weight=\"600\" class=\"\">Top-N heapsort（TSS_BOUNDED）</text><text x=\"855\" y=\"181.95\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">只保留 K 个候选</text><rect x=\"1155\" y=\"132\" width=\"205\" height=\"76\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1257.5\" y=\"172.1\" text-anchor=\"middle\" font-size=\"15\" fill=\"#89938F\" font-weight=\"600\" class=\"\">否 ↓</text><rect x=\"40\" y=\"220\" width=\"70\" height=\"76\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"75\" y=\"260.8\" text-anchor=\"middle\" font-size=\"20\" fill=\"#2F7A66\" font-weight=\"700\" class=\"serif\">③</text><rect x=\"125\" y=\"220\" width=\"430\" height=\"76\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"340\" y=\"251.74\" text-anchor=\"middle\" font-size=\"16\" fill=\"#1B2B33\" font-weight=\"600\" class=\"serif\">放得进 work_mem？</text><text x=\"340\" y=\"270.63\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">行数 × 行宽 vs 内存预算</text><rect x=\"575\" y=\"220\" width=\"560\" height=\"76\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\"/><text x=\"855\" y=\"251.6\ rt / radix / Top-N heap / B-tree 有序扫描在目标、位置、内存、磁盘与场景上的对比","bridge":"组合策略一旦碰上并行查询，内存账就要重新算。","notes":"这张表真正要读的不是「谁更高级」，而是「输入条件不同」。外部归并的目标是超内存后合并多条有序 run，位置在 mergeruns() 和 mergeonerun()，需要 tape buffer、小 heap 和 slab slot，会写临时文件，适合大排序、索引构建、宽输入超 work_mem。quicksort 和 radix sort 负责内存批次的完整排序，位置在 tuplesort_sort_memtuples()；radix 的快路径依赖 leading key 能整数化，复杂 collation、多列比较并不适配。Top-N heapsort 对应 TSS_BOUNDED，只留 K 个候选。B-tree 有序扫描由规划器选，可能连 Sort 节点都不建，但大比例扫描时随机 heap 访问可能很重。所以同一个 ORDER BY，加上 LIMIT、加上匹配索引、把行宽从一列 JSONB 缩成 key 加主键，走的路完全不同。这也是为什么我更愿意把 tuplesort 理解成一个「按条件分派的策略集合」，而不是一个算法。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40\" y=\"20\" width=\"170\" height=\"54\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"125\" y=\"49.03\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"700\" class=\"mono\">维度</text><rect x=\"220\" y=\"20\" width=\"228\" height=\"54\" rx=\"0\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1\"/><text x=\"334\" y=\"49.03\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"mono\">external merge</text><rect x=\"448\" y=\"20\" width=\"228\" height=\"54\" rx=\"0\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1\"/><text x=\"562\" y=\"49.03\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"mono\">quicksort</text><rect x=\"676\" y=\"20\" width=\"228\" height=\"54\" rx=\"0\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1\"/><text x=\"790\" y=\"49.03\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"mono\">radix sort</text><rect x=\"904\" y=\"20\" width=\"228\" height=\"54\" rx=\"0\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1\"/><text x=\"1018\" y=\"49.03\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"mono\">Top-N heap</text><rect x=\"11
