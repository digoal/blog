<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据库筑基课 —— 外部归并排序 (External Merge Sort)</title>
<style>
  :root {
    --bg-paper: #F7F6F2;
    --bg-sub: #F1EFE9;
    --bg-desk: #EAE7DF;
    --ink: #1B2B33;
    --ink-sub: #46585F;
    --ink-muted: #89938F;
    --border: #D9D5CB;

    --indigo: #245A6B;
    --indigo-light: #E5EFF0;
    --orange: #BE653B;
    --orange-light: #F7E9DE;
    --green: #2F7A66;
    --green-light: #E6F2EE;
    --gold: #AE8A3E;
    --gold-light: #F6F0E1;

    --stratum-1: #1E4B5A;
    --stratum-2: #2E6373;
    --stratum-3: #47808D;
    --stratum-4: #74A5AD;
    --stratum-5: #A4C4C6;
    --stratum-6: #CFE0DC;
    --stratum-7: #EBF1EE;

    --font-title: "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", "SimSun", serif;
    --font-body: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    --font-mono: "SF Mono", "JetBrains Mono", "Menlo", "Consolas", monospace;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    border-radius: 0 !important;
    box-shadow: none !important;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg-desk);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  #app-shell {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    background: var(--bg-desk);
  }

  #workspace {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: row;
    position: relative;
    overflow: hidden;
  }

  /* Left In-Page TOC Drawer */
  #toc-panel {
    width: 0;
    overflow: hidden;
    background: var(--bg-sub);
    border-right: 0 solid var(--border);
    transition: width 0.22s ease;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
  }
  #toc-panel.open {
    width: 340px;
    border-right-width: 1px;
  }
  .panel-inner {
    width: 340px;
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #notes-panel .panel-inner {
    width: 440px;
  }

  .drawer-header {
    height: 48px;
    padding: 0 18px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-paper);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .drawer-title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--indigo);
    font-family: var(--font-body);
  }
  .drawer-actions {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .drawer-tab, .drawer-close {
    border: 1px solid var(--border);
    background: var(--bg-paper);
    color: var(--ink-sub);
    font-size: 12px;
    padding: 4px 10px;
    cursor: pointer;
    font-family: var(--font-body);
  }
  .drawer-tab.active {
    background: var(--indigo);
    color: var(--bg-paper);
    border-color: var(--indigo);
  }
  .drawer-tab:hover, .drawer-close:hover {
    border-color: var(--indigo);
    color: var(--ink);
  }

  .drawer-body {
    flex: 1;
    overflow-y: auto;
    padding: 14px 18px 24px 18px;
    user-select: text;
  }

  /* Custom slim scrollbar for drawers */
  .drawer-body::-webkit-scrollbar {
    width: 6px;
  }
  .drawer-body::-webkit-scrollbar-track {
    background: var(--bg-sub);
  }
  .drawer-body::-webkit-scrollbar-thumb {
    background: var(--border);
  }

  .toc-group-label {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--ink-muted);
    margin: 14px 0 6px 0;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--border);
  }
  .toc-group-label:first-child {
    margin-top: 2px;
  }
  .toc-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 8px 10px;
    margin-bottom: 4px;
    border: 1px solid transparent;
    border-left: 3px solid transparent;
    cursor: pointer;
    background: transparent;
    text-align: left;
    width: 100%;
    font-family: var(--font-body);
  }
  .toc-item:hover {
    background: var(--bg-paper);
    border-color: var(--border);
  }
  .toc-item.active {
    background: var(--bg-paper);
    border-color: var(--border);
    border-left-color: var(--orange);
  }
  .toc-num {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--indigo);
    font-weight: 700;
    padding-top: 2px;
    flex-shrink: 0;
  }
  .toc-item.active .toc-num {
    color: var(--orange);
  }
  .toc-name {
    font-size: 13px;
    line-height: 1.4;
    color: var(--ink);
    font-weight: 500;
  }

  /* Center Stage Viewport */
  #stage-viewport {
    flex: 1;
    min-width: 0;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 14px;
    overflow: hidden;
    position: relative;
  }

  #stage-wrapper {
    position: relative;
    flex-shrink: 0;
    border: 1px solid var(--border);
    background: var(--bg-paper);
  }

  #stage {
    position: absolute;
    top: 0;
    left: 0;
    width: 1600px;
    height: 900px;
    transform-origin: top left;
    background-color: var(--bg-paper);
    background-image:
      linear-gradient(to right, rgba(36, 90, 107, 0.04) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(36, 90, 107, 0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    overflow: hidden;
  }

  /* Corner blueprint registration marks */
  .reg-mark {
    position: absolute;
    width: 14px;
    height: 14px;
    pointer-events: none;
    z-index: 20;
  }
  .reg-mark::before, .reg-mark::after {
    content: "";
    position: absolute;
    background: var(--ink-muted);
    opacity: 0.45;
  }
  .reg-mark::before { width: 14px; height: 1px; top: 7px; left: 0; }
  .reg-mark::after { width: 1px; height: 14px; left: 7px; top: 0; }
  .reg-tl { top: 14px; left: 14px; }
  .reg-tr { top: 14px; right: 14px; }
  .reg-bl { bottom: 14px; left: 14px; }
  .reg-br { bottom: 14px; right: 14px; }

  /* Slide structure inside 1600x900 fixed canvas */
  .slide {
    position: absolute;
    inset: 0;
    padding: 38px 64px 28px 64px;
    display: none;
    flex-direction: column;
  }
  .slide.active {
    display: flex;
  }

  .slide-eyebrow-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 22px;
    flex-shrink: 0;
  }
  .slide-eyebrow {
    font-family: var(--font-mono);
    font-size: 13px;
    letter-spacing: 3.4px;
    color: var(--indigo);
    font-weight: 700;
    text-transform: uppercase;
  }
  .slide-section-meta {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 1.5px;
    color: var(--ink-muted);
  }

  .slide-title {
    margin-top: 8px;
    font-family: var(--font-title);
    font-size: 44px;
    line-height: 1.18;
    font-weight: 700;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex-shrink: 0;
  }

  .slide-lead {
    margin-top: 8px;
    font-family: var(--font-body);
    font-size: 19px;
    line-height: 1.45;
    color: var(--ink-sub);
    max-width: 1400px;
    flex-shrink: 0;
  }

  .slide-divider {
    margin-top: 12px;
    height: 1px;
    width: 1400px;
    background: var(--border);
    flex-shrink: 0;
  }

  .diagram-zone {
    margin-top: 16px;
    width: 1400px;
    height: 430px;
    border: 1px solid var(--border);
    background: var(--bg-paper);
    position: relative;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .demo-toolbar {
    height: 44px;
    width: 100%;
    padding: 0 16px;
    background: var(--bg-sub);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-shrink: 0;
  }
  .demo-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .demo-label {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-sub);
    font-weight: 600;
  }
  .demo-btn {
    border: 1px solid var(--border);
    background: var(--bg-paper);
    color: var(--ink);
    font-size: 12px;
    font-family: var(--font-body);
    padding: 5px 11px;
    cursor: pointer;
    font-weight: 500;
  }
  .demo-btn:hover {
    border-color: var(--indigo);
  }
  .demo-btn.active {
    background: var(--indigo);
    color: var(--bg-paper);
    border-color: var(--indigo);
  }
  .demo-btn.primary {
    background: var(--green);
    color: var(--bg-paper);
    border-color: var(--green);
  }
  .demo-btn.warn {
    background: var(--orange);
    color: var(--bg-paper);
    border-color: var(--orange);
  }
  .demo-readout {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--indigo);
    background: var(--indigo-light);
    border: 1px solid #C6D8DC;
    padding: 4px 10px;
  }

  input[type="range"].bp-slider {
    width: 150px;
    accent-color: var(--indigo);
    cursor: pointer;
  }

  .slide-next {
    margin-top: 18px;
    width: 1400px;
    border-left: 3px solid var(--orange);
    padding: 4px 0 4px 16px;
    flex-shrink: 0;
  }
  .next-tag {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 2.2px;
    color: var(--orange);
    font-weight: 700;
    margin-bottom: 2px;
  }
  .next-text {
    font-family: var(--font-title);
    font-size: 20px;
    line-height: 1.4;
    color: var(--ink);
    font-weight: 600;
  }

  .slide-footer {
    position: absolute;
    bottom: 26px;
    left: 64px;
    right: 64px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid var(--border);
    padding-top: 8px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-muted);
  }
  .footer-page {
    color: var(--ink);
    font-weight: 700;
  }

  /* Right In-Page Notes Panel */
  #notes-panel {
    width: 0;
    overflow: hidden;
    background: var(--bg-sub);
    border-left: 0 solid var(--border);
    transition: width 0.22s ease;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
  }
  #notes-panel.open {
    width: 440px;
    border-left-width: 1px;
  }

  .note-card {
    background: var(--bg-paper);
    border: 1px solid var(--border);
    border-left: 3px solid var(--indigo);
    padding: 14px 16px;
    margin-bottom: 14px;
  }
  .note-card.all-mode {
    cursor: pointer;
    opacity: 0.78;
    border-left-color: var(--border);
  }
  .note-card.all-mode:hover {
    opacity: 0.95;
    border-color: var(--indigo);
  }
  .note-card.all-mode.active-note {
    opacity: 1;
    border-color: var(--orange);
    border-left: 4px solid var(--orange);
    background: #FCFBF8;
  }
  .note-card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .note-card-num {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 700;
    color: var(--indigo);
  }
  .note-card.active-note .note-card-num {
    color: var(--orange);
  }
  .note-card-title {
    font-family: var(--font-title);
    font-size: 16px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 10px;
  }
  .note-para {
    font-size: 14px;
    line-height: 1.72;
    color: var(--ink);
    margin-bottom: 10px;
    text-align: justify;
  }
  .note-para:last-child {
    margin-bottom: 0;
  }
  .note-evidence {
    margin-top: 10px;
    padding: 8px 10px;
    background: var(--indigo-light);
    border-left: 2px solid var(--indigo);
    font-family: var(--font-mono);
    font-size: 12px;
    line-height: 1.55;
    color: var(--stratum-1);
  }

  /* Bottom Hotkey & Navigation Bar (Always visible, including Fullscreen) */
  #hotkey-bar {
    height: 44px;
    background: var(--bg-sub);
    border-top: 1px solid var(--border);
    padding: 0 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    position: relative;
    z-index: 30;
  }
  #autoplay-progress {
    position: absolute;
    top: -2px;
    left: 0;
    height: 2px;
    width: 0%;
    background: var(--orange);
    transition: width 0.2s linear;
  }
  .bar-section {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .hk-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--border);
    background: var(--bg-paper);
    color: var(--ink-sub);
    font-size: 12px;
    font-family: var(--font-body);
    padding: 4px 10px;
    cursor: pointer;
    height: 28px;
  }
  .hk-btn:hover {
    border-color: var(--indigo);
    color: var(--ink);
  }
  .hk-btn.active {
    background: var(--indigo);
    color: var(--bg-paper);
    border-color: var(--indigo);
  }
  .hk-btn.active .hk-key {
    background: rgba(247, 246, 242, 0.2);
    color: var(--bg-paper);
    border-color: rgba(247, 246, 242, 0.4);
  }
  .hk-btn.autoplay-on {
    background: var(--orange);
    color: var(--bg-paper);
    border-color: var(--orange);
  }
  .hk-btn.autoplay-on .hk-key {
    background: rgba(247, 246, 242, 0.2);
    color: var(--bg-paper);
    border-color: rgba(247, 246, 242, 0.4);
  }
  .hk-key {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 700;
    padding: 1px 5px;
    background: var(--bg-sub);
    border: 1px solid var(--border);
    color: var(--ink);
  }
  .page-indicator {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 700;
    color: var(--ink);
    padding: 0 8px;
    min-width: 72px;
    text-align: center;
  }
</style>
</head>
<body>
<div id="app-shell">
  <div id="workspace">
    <!-- Left In-Page TOC Drawer -->
    <aside id="toc-panel" aria-label="课件目录">
      <div class="panel-inner">
        <div class="drawer-header">
          <span class="drawer-title">目录 · CONTENTS</span>
          <div class="drawer-actions">
            <button class="drawer-close" id="btn-close-toc" title="关闭目录 (G / Esc)">关闭</button>
          </div>
        </div>
        <div class="drawer-body" id="toc-body"></div>
      </div>
    </aside>

    <!-- Center 16:9 Vector-Scaled Stage -->
    <main id="stage-viewport">
      <div id="stage-wrapper">
        <div id="stage">
          <div class="reg-mark reg-tl"></div>
          <div class="reg-mark reg-tr"></div>
          <div class="reg-mark reg-bl"></div>
          <div class="reg-mark reg-br"></div>
          <!-- Slides injected cleanly by JS -->
        </div>
      </div>
    </main>

    <!-- Right In-Page Speaker Notes Panel -->
    <aside id="notes-panel" aria-label="演说讲稿">
      <div class="panel-inner">
        <div class="drawer-header">
          <span class="drawer-title" id="notes-panel-title">本页讲稿 · NOTES</span>
          <div class="drawer-actions">
            <button class="drawer-tab" id="tab-note-current">本页 N</button>
            <button class="drawer-tab" id="tab-note-all">全文 T</button>
            <button class="drawer-close" id="btn-close-notes" title="关闭讲稿">关闭</button>
          </div>
        </div>
        <div class="drawer-body" id="notes-body"></div>
      </div>
    </aside>
  </div>

  <!-- Bottom Persistent Shortcut & Control Bar -->
  <footer id="hotkey-bar">
    <div id="autoplay-progress"></div>
    <div class="bar-section">
      <button class="hk-btn" id="btn-prev" title="上一页 (Left / PgUp)">
        <span class="hk-key">←</span><span>上一页</span>
      </button>
      <span class="page-indicator" id="bar-page-num">01 / 14</span>
      <button class="hk-btn" id="btn-next" title="下一页 (Right / PgDn)">
        <span>下一页</span><span class="hk-key">→</span>
      </button>
      <button class="hk-btn" id="btn-toc" title="目录 (G)">
        <span class="hk-key">G</span><span>目录</span>
      </button>
    </div>

    <div class="bar-section">
      <button class="hk-btn" id="btn-note-current" title="本页讲稿 (N)">
        <span class="hk-key">N</span><span>本页讲稿</span>
      </button>
      <button class="hk-btn" id="btn-note-all" title="全文讲稿 (T)">
        <span class="hk-key">T</span><span>全文讲稿</span>
      </button>
      <button class="hk-btn" id="btn-anim-toggle" title="播放/暂停本页演示动画 (Space)">
        <span class="hk-key">Space</span><span id="anim-btn-label">本页动画</span>
      </button>
      <button class="hk-btn" id="btn-autoplay" title="自动播放翻页 (P)">
        <span class="hk-key">P</span><span id="autoplay-label">自动播放</span>
      </button>
      <button class="hk-btn" id="btn-fullscreen" title="全屏切换 (F)">
        <span class="hk-key">F</span><span id="fs-label">全屏</span>
      </button>
    </div>
  </footer>
</div>

<script>
(function() {
  "use strict";

  /* =========================================================================
     SLIDES DATA MODEL (Content + SVG Generators + Cohesive Oral Speaker Notes)
     ========================================================================= */
  const SLIDES = [
    /* 01 */
    {
      id: 1,
      group: "一 · 地层全景与问题提出",
      eyebrow: "DATABASE FOUNDATIONS · POSTGRESQL EXECUTION",
      meta: "AUTHOR: DIGOAL · 2026-05-30",
      title: "外部归并排序：当数据溢出 work_mem 之后",
      lead: "一条简单的 ORDER BY，在数据库执行器内部如何跨越「内存阵列 → 逻辑磁带 → 临时磁盘块」七层地层结构。",
      next: "表面只是一行 SQL 排序请求，执行器真正面对的却是五道彼此牵制的资源考题。",
      renderDiagram: () => `
        <svg viewBox="0 0 1400 430" width="1400" height="430" xmlns="http://www.w3.org/2000/svg" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">
          <defs>
            <marker id="m1-ind" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M0 1 L9 5 L0 9 Z" fill="#245A6B"/>
            </marker>
          </defs>
          <!-- Left Title Column for Stratigraphy -->
          <rect x="20" y="16" width="980" height="398" fill="#F7F6F2" stroke="#D9D5CB" stroke-width="1"/>

          <!-- 7 Strata Bands (Top shallow -> Bottom deepest) -->
          <rect x="36" y="28" width="948" height="48" fill="#EBF1EE" stroke="#CFE0DC" stroke-width="1"/>
          <text x="54" y="57" font-size="13" font-weight="700" fill="#1B2B33" font-family="SF Mono, monospace">L7 · SQL QUERY</text>
          <text x="230" y="57" font-size="14" fill="#1B2B33">业务层 ORDER BY paid_at DESC, order_id DESC —— 优化器先判定是否已有索引顺序</text>

          <rect x="36" y="82" width="948" height="48" fill="#CFE0DC" stroke="#A4C4C6" stroke-width="1"/>
          <text x="54" y="111" font-size="13" font-weight="700" fill="#1B2B33" font-family="SF Mono, monospace">L6 · EXECUTOR</text>
          <text x="230" y="111" font-size="14" fill="#1B2B33">nodeSort.c · ExecSort() 阻塞算子：拉取全量输入后触发排序状态机</text>

          <rect x="36" y="136" width="948" height="48" fill="#A4C4C6" stroke="#74A5AD" stroke-width="1"/>
          <text x="54" y="165" font-size="13" font-weight="700" fill="#1B2B33" font-family="SF Mono, monospace">L5 · SORT MEM</text>
          <text x="230" y="165" font-size="14" fill="#1B2B33">memtuples[] 与 availMem 预算：按 work_mem 转化为字节级 allowedMem（最低 64KB）</text>

  function rgStep() {
    if (rgState.phase === "READY_MERGE" || rgState.phase === "TSS_SORTEDINMEM") {
      return true;
    }
    // Step 1: If mem is sorted, dump it as a run
    if (rgState.sortedMem) {
      rgState.runs.push([...rgState.mem]);
      rgState.mem = [];
      rgState.sortedMem = false;
      if (rgState.cursor >= rgData.length) {
        rgState.phase = "READY_MERGE";
        rgRender();
        return true;
      }
      rgRender();
      return false;
    }

    // Step 2: If mem is full OR input finished while in BUILDRUNS -> sort memtuples[]
    if (rgState.mem.length >= rgState.cap) {
      rgState.phase = "TSS_BUILDRUNS";
      rgState.mem.sort((a, b) => a - b);
      rgState.sortedMem = true;
      rgRender();
      return false;
    }

    if (rgState.cursor < rgData.length) {
      rgState.mem.push(rgData[rgState.cursor]);
      rgState.cursor += 1;
      // Check if input just ended
      if (rgState.cursor >= rgData.length) {
        if (rgState.runs.length === 0 && rgState.mem.length <= rgState.cap) {
          // Fits completely in work_mem!
          rgState.mem.sort((a, b) => a - b);
          rgState.sortedMem = true;
          rgState.phase = "TSS_SORTEDINMEM";
          rgRender();
          return true;
        } else {
          // Last batch after already spilling -> must sort & dump final run
          rgState.mem.sort((a, b) => a - b);
          rgState.sortedMem = true;
          rgRender();
          return false;
        }
      }
      rgRender();
      return false;
    }
    return true;
  }

  /* --- SIMULATOR 2: Balanced k-Way Merge (Slide 06, index 5) --- */
  const kwInitTapes = [
    [5, 17, 42, 89],
    [14, 28, 63, 91],
    [8, 33, 50, 76],
    [11, 21, 67, 84]

  const kwState = {
    ra: "off", // 'off' (TSS_FINALMERGE) | 'on' (TSS_SORTEDONTAPE)
    cursors: [0, 0, 0, 0],
    heap: [], // { val, tape }
    output: [],
    started: false,
    done: false,
    timer: null
  };

  function kwReset() {
    kwPause();
    kwState.cursors = [0, 0, 0, 0];
    kwState.heap = [];
    kwState.output = [];
    kwState.started = false;
    kwState.done = false;
    kwRender();
  }

  function kwPause() {
    if (kwState.timer) {
      clearInterval(kwState.timer);
      kwState.timer = null;
    }
    const btn = document.getElementById("kw-play");
    if (btn) btn.textContent = "▶ 播放归并";
    updateBottomAnimBtn();
  }

  function kwTogglePlay() {
    if (kwState.timer) {
      kwPause();
      return;
    }
    if (kwState.done) kwReset();
    const btn = document.getElementById("kw-play");
    if (btn) btn.textContent = "❚❚ 暂停";
    kwState.timer = setInterval(() => {
      const finished = kwStep();
      if (finished) kwPause();
    }, 520);
    updateBottomAnimBtn();
  }

  function kwStep() {
    if (kwState.done) return true;
    if (!kwState.started) {
      // beginmerge(): pull 1 tuple from each tape
      kwState.started = true;
      for (let t = 0; t < 4; t++) {
        kwState.heap.push({ val: kwInitTapes[t][0], tape: t });
        kwState.cursors[t] = 1;
      }
      kwState.heap.sort((a, b) => a.val - b.val);
      kwRender();
      return false;
    }

    if (kwState.heap.length === 0) {
      kwState.done = true;
      kwRender();
      return true;
    }

    // Pop min root
    const minItem = kwState.heap.shift();
    kwState.output.push(minItem.val);
    const srcTape = minItem.tape;

    // Pull next from same source tape
    if (kwState.cursors[srcTape] < kwInitTapes[srcTape].length) {
      const nextVal = kwInitTapes[srcTape][kwState.cursors[srcTape]];
      kwState.cursors[srcTape] += 1;
      kwState.heap.push({ val: nextVal, tape: srcTape });
    }
    // Maintain min-heap property
    kwState.heap.sort((a, b) => a.val - b.val);

    if (kwState.heap.length === 0) {
      kwState.done = true;
      kwRender();
      return true;
    }
    kwRender();
    return false;
  }

      <!-- Left: SQL & Structural EXPLAIN Output -->
      <rect x="20" y="16" width="690" height="352" fill="#F7F6F2" stroke="#245A6B" stroke-width="1.5"/>
      <rect x="20" y="16" width="690" height="34" fill="#1E4B5A"/>
      <text x="36" y="38" font-size="13" font-weight="700" fill="#F7F6F2" font-family="SF Mono, monospace">实验 SQL 与 EXPLAIN (ANALYZE, BUFFERS) 结构对照</text>

      <!-- SQL Box -->
      <rect x="36" y="64" width="658" height="108" fill="#F1EFE9" stroke="#D9D5CB" stroke-width="1"/>
      <text x="50" y="84" font-size="11" font-weight="700" fill="#245A6B" font-family="SF Mono, monospace">SQL QUERY:</text>
      ${item.sql.map((line, i) => `<text x="50" y="${102 + i * 15}" font-size="12" fill="#1B2B33" font-family="SF Mono, monospace">${line}</text>`).join("")}

      <!-- EXPLAIN Output Box -->
      <rect x="36" y="184" width="658" height="120" fill="#EBF1EE" stroke="#245A6B" stroke-width="1"/>
      <text x="50" y="204" font-size="11" font-weight="700" fill="#2F7A66" font-family="SF Mono, monospace">EXPECTED PLAN STRUCTURE (不编造实测耗时数字):</text>
      ${item.plan.map((line, i) => `<text x="50" y="${224 + i * 16}" font-size="12" font-weight="${i === 2 ? '700' : '400'}" fill="${i === 2 ? '#BE653B' : '#1B2B33'}" font-family="SF Mono, monospace">${line}</text>`).join("")}

      <rect x="36" y="314" width="658" height="42" fill="#F7E9DE" stroke="#BE653B" stroke-width="1"/>
      <text x="50" y="340" font-size="12" font-weight="700" fill="#1B2B33">解读：${item.verdict}</text>

      <!-- Right: 4-Step Observability Closed Loop -->
      <rect x="734" y="16" width="646" height="352" fill="#F1EFE9" stroke="#D9D5CB" stroke-width="1"/>
      <rect x="734" y="16" width="646" height="34" fill="#245A6B"/>
      <text x="750" y="38" font-size="13" font-weight="700" fill="#F7F6F2" font-family="SF Mono, monospace">外部排序观测与调优闭环 (4-STEP LOOP)</text>
    `;

    const loopSteps = [
      { t: "STEP 1 · 定位方法与是否 Spill", d: "看 EXPLAIN 是否仍有 Sort；看 Sort Method 与 Memory/Disk 占用" },
      { t: "STEP 2 · 交叉核对临时 I/O", d: "结合 BUFFERS (temp read/written) 与 log_temp_files = 0 实证" },
      { t: "STEP 3 · 根因分流决策", d: "优先减少输入（索引顺序 / 过滤 / 裁剪列），其次局部调节 work_mem" },
      { t: "STEP 4 · 长期趋势与保护", d: "盯住 pg_stat_database.temp_bytes 与 pg_stat_statements.temp_blks_*" }
    ];

    loopSteps.forEach((st, idx) => {
      const sy = 68 + idx * 72;
      const isLit = idx === item.highlightStep || idx === 0;
      html += `
        <rect x="756" y="${sy}" width="540" height="54" fill="${isLit ? '#E5EFF0' : '#F7F6F2'}" stroke="${isLit ? '#245A6B' : '#D9D5CB'}" stroke-width="${isLit ? 2 : 1}"/>
        <text x="772" y="${sy + 22}" font-size="13" font-weight="700" fill="${isLit ? '#245A6B' : '#1B2B33'}">${st.t}</text>
        <text x="772" y="${sy + 42}" font-size="12" fill="#46585F">${st.d}</text>
      `;
      if (idx < 3) {
        html += `<path d="M1026 ${sy + 54} V${sy + 68}" stroke="#245A6B" stroke-width="1.5" fill="none" marker-end="url(#m11-ind)"/>`;
      }
    });

    // Orthogonal loop-back arrow from Step 4 back to Step 1 on right margin
    html += `
      <path d="M1296 311 H1346 V95 H1302" stroke="#2F7A66" stroke-width="2" fill="none" marker-end="url(#m11-ind)"/>
      <rect x="1312" y="180" width="56" height="44" fill="#F1EFE9"/>
      <text x="1340" y="198" font-size="11" font-weight="700" text-anchor="middle" fill="#2F7A66">持续</text>
      <text x="1340" y="214" font-size="11" font-weight="700" text-anchor="middle" fill="#2F7A66">复验</text>
    `;

    svg.innerHTML = html;
  }

  /* Bind all Interactive Simulator Controls */
  function bindSimulators() {
    // Slide 05: Run Gen
    const rgCtrl = document.getElementById("rungen-controls");
    if (rgCtrl) {
      rgCtrl.querySelectorAll("[data-rg-cap]").forEach(btn => {
        btn.addEventListener("click", () => {
          rgCtrl.querySelectorAll("[data-rg-cap]").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          rgState.cap = parseInt(btn.dataset.rgCap, 10);
          rgReset();
          btn.blur();
        });
      });
      rgCtrl.querySelectorAll("[data-rg-mode]").forEach(btn => {
        btn.addEventListener("click", () => {
          rgCtrl.querySelectorAll("[data-rg-mode]").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          rgState.mode = btn.dataset.rgMode;
          rgRender();
          btn.blur();
        });
      });
      document.getElementById("rg-play").addEventListener("click", e => { rgTogglePlay(); e.currentTarget.blur(); });
      document.getElementById("rg-step").addEventListener("click", e => { rgPause(); rgStep(); e.currentTarget.blur(); });
      document.getElementById("rg-reset").addEventListener("click", e => { rgReset(); e.currentTarget.blur(); });
      rgRender();
    }

    // Slide 06: k-Way Merge
    const kwCtrl = document.getElementById("kway-controls");
    if (kwCtrl) {
      kwCtrl.querySelectorAll("[data-kw-ra]").forEach(btn => {
        btn.addEventListener("click", () => {
          kwCtrl.querySelectorAll("[data-kw-ra]").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          kwState.ra = btn.dataset.kwRa;
          kwRender();
          btn.blur();
        });
      });
      document.getElementById("kw-play").addEventListener("click", e => { kwTogglePlay(); e.currentTarget.blur(); });
      document.getElementById("kw-step").addEventListener("click", e => { kwPause(); kwStep(); e.currentTarget.blur(); });
      document.getElementById("kw-reset").addEventListener("click", e => { kwReset(); e.currentTarget.blur(); });
      kwRender();
    }

    // Slide 07: Merge Order & Logtape
    const tpCtrl = document.getElementById("tape-controls");
    if (tpCtrl) {
      const slider = document.getElementById("tp-wmem-slider");
      slider.addEventListener("input", () => {
        tpState.workMemMB = parseInt(slider.value, 10);
        tpRender();
      });
      slider.addEventListener("change", () => slider.blur());
      tpCtrl.querySelectorAll("[data-tp-data]").forEach(btn => {
        btn.addEventListener("click", () => {
          tpCtrl.querySelectorAll("[data-tp-data]").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          tpState.dataMB = parseInt(btn.dataset.tpData, 10);
          tpRender();
          btn.blur();
        });
      });
      document.getElementById("tp-step").addEventListener("click", e => {
        tpState.reclaimStep = (tpState.reclaimStep + 1) % 5;
        tpRender();
        e.currentTarget.blur();
      });
      document.getElementById("tp-reset").addEventListener("click", e => {
        tpState.reclaimStep = 0;
        tpRender();
        e.currentTarget.blur();
      });
      tpRender();
    }

    // Slide 08: Parallel Sort
    const parCtrl = document.getElementById("par-controls");
    if (parCtrl) {
      const bindGroup = (attr, key) => {
        parCtrl.querySelectorAll(`[${attr}]`).forEach(btn => {
          btn.addEventListener("click", () => {
            parCtrl.querySelectorAll(`[${attr}]`).forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            parState[key] = parseInt(btn.getAttribute(attr), 10);
            parRender();
            btn.blur();
          });
        });
      };
      bindGroup("data-pw", "workers");
      bindGroup("data-ps", "sessions");
      bindGroup("data-pn", "nodes");
      bindGroup("data-pm", "workMemMB");
      parRender();
    }

    // Slide 11: Observability Presets
    const expCtrl = document.getElementById("exp-controls");
    if (expCtrl) {
      expCtrl.querySelectorAll("[data-exp]").forEach(btn => {
        btn.addEventListener("click", () => {
          expCtrl.querySelectorAll("[data-exp]").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          expActiveIdx = parseInt(btn.dataset.exp, 10);
          expRender();
          btn.blur();
        });
      });
      expRender();
    }
  }
  bindSimulators();

  /* =========================================================================
     NAVIGATION, DRAWERS, AUTOPLAY & FULLSCREEN LOGIC
     ========================================================================= */
  const tocPanel = document.getElementById("toc-panel");
  const notesPanel = document.getElementById("notes-panel");
  const barPageNum = document.getElementById("bar-page-num");

  function updateBottomAnimBtn() {
    const animBtn = document.getElementById("btn-anim-toggle");
    const animLabel = document.getElementById("anim-btn-label");
    const slide = SLIDES[currentIndex];
    if (!slide.hasAnim) {
      animBtn.style.opacity = "0.45";
      animLabel.textContent = "本页无动画";
      animBtn.classList.remove("active");
    } else {
      animBtn.style.opacity = "1";
      const running = (currentIndex === 4 && rgState.timer) || (currentIndex === 5 && kwState.timer);
      animBtn.classList.toggle("active", Boolean(running));
      if (currentIndex === 6) animLabel.textContent = "步进回收";
      else animLabel.textContent = running ? "暂停动画" : "播放动画";
    }
  }

  function triggerCurrentSlideAnim() {
    if (currentIndex === 4) rgTogglePlay();
    else if (currentIndex === 5) kwTogglePlay();
    else if (currentIndex === 6) {
      tpState.reclaimStep = (tpState.reclaimStep + 1) % 5;
      tpRender();
    }
  }

  function pauseAllSlideTimers() {
    rgPause();
    kwPause();
  }

  function goToSlide(idx) {
    const clamped = Math.max(0, Math.min(totalSlides - 1, idx));
    if (clamped !== currentIndex) {
      pauseAllSlideTimers();
    }
    currentIndex = clamped;

    // Update slide visibility
    stageEl.querySelectorAll(".slide").forEach((el, i) => {
      el.classList.toggle("active", i === currentIndex);
    });

    // Update TOC active
    tocBodyEl.querySelectorAll(".toc-item").forEach((el, i) => {
      el.classList.toggle("active", i === currentIndex);
      if (i === currentIndex && tocOpen) {
        el.scrollIntoView({ block: "nearest", behavior: "smooth" });
      }
    });

    // Update page indicator
    barPageNum.textContent = `${String(currentIndex + 1).padStart(2, "0")} / ${String(totalSlides).padStart(2, "0")}`;

    // Sync speaker notes if open
    if (notesMode) {
      renderNotesContent("smooth");
    }

    // Reset autoplay countdown progress bar if active
    if (autoplayTimer) {
      autoplayStartTs = Date.now();
    }

    updateBottomAnimBtn();
  }

  function toggleTOC() {
    tocOpen = !tocOpen;
    tocPanel.classList.toggle("open", tocOpen);
    document.getElementById("btn-toc").classList.toggle("active", tocOpen);
    if (tocOpen) {
      const activeToc = tocBodyEl.querySelector(`.toc-item[data-toc-index="${currentIndex}"]`);
      if (activeToc) activeToc.scrollIntoView({ block: "nearest" });
    }
  }

  // Press once -> show, press again -> close (cycle)
  function toggleNotes(mode) {
    if (notesMode === mode) {
      notesMode = null;
      notesPanel.classList.remove("open");
    } else {
      const wasClosed = notesMode === null;
      notesMode = mode;
      notesPanel.classList.add("open");
      renderNotesContent(wasClosed ? "instant" : "instant");
    }
    document.getElementById("btn-note-current").classList.toggle("active", notesMode === "current");
    document.getElementById("btn-note-all").classList.toggle("active", notesMode === "all");
  }

  function closeNotes() {
    notesMode = null;
    notesPanel.classList.remove("open");
    document.getElementById("btn-note-current").classList.remove("active");
    document.getElementById("btn-note-all").classList.remove("active");
  }

  function stopAutoplay() {
    if (autoplayTimer) {
      clearInterval(autoplayTimer);
      autoplayTimer = null;
    }
    if (autoplayTickTimer) {
      clearInterval(autoplayTickTimer);
      autoplayTickTimer = null;
    }
    document.getElementById("autoplay-progress").style.width = "0%";
    document.getElementById("btn-autoplay").classList.remove("autoplay-on");
    document.getElementById("autoplay-label").textContent = "自动播放";
  }

  function toggleAutoplay() {
    if (autoplayTimer) {
      stopAutoplay();
      return;
    }
    if (currentIndex >= totalSlides - 1) {
      goToSlide(0);
    }
    autoplayStartTs = Date.now();
    document.getElementById("btn-autoplay").classList.add("autoplay-on");
    document.getElementById("autoplay-label").textContent = "自动播放中";

    autoplayTickTimer = setInterval(() => {
      const elapsed = Date.now() - autoplayStartTs;
      const pct = Math.min(100, (elapsed / AUTOPLAY_INTERVAL_MS) * 100);
      document.getElementById("autoplay-progress").style.width = pct + "%";
    }, 150);

    autoplayTimer = setInterval(() => {
      if (currentIndex < totalSlides - 1) {
        goToSlide(currentIndex + 1);
      } else {
        stopAutoplay();
      }
    }, AUTOPLAY_INTERVAL_MS);
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen().catch(() => {});
    }
  }

  document.addEventListener("fullscreenchange", () => {
    const isFs = Boolean(document.fullscreenElement);
    document.getElementById("btn-fullscreen").classList.toggle("active", isFs);
    document.getElementById("fs-label").textContent = isFs ? "退出全屏" : "全屏";
    setTimeout(resizeStage, 60);
  });

  // Button click bindings
  document.getElementById("btn-prev").addEventListener("click", e => { goToSlide(currentIndex - 1); e.currentTarget.blur(); });
  document.getElementById("btn-next").addEventListener("click", e => { goToSlide(currentIndex + 1); e.currentTarget.blur(); });
  document.getElementById("btn-toc").addEventListener("click", e => { toggleTOC(); e.currentTarget.blur(); });
  document.getElementById("btn-close-toc").addEventListener("click", e => { if (tocOpen) toggleTOC(); e.currentTarget.blur(); });
  document.getElementById("btn-note-current").addEventListener("click", e => { toggleNotes("current"); e.currentTarget.blur(); });
  document.getElementById("btn-note-all").addEventListener("click", e => { toggleNotes("all"); e.currentTarget.blur(); });
  document.getElementById("tab-note-current").addEventListener("click", e => { toggleNotes("current"); e.currentTarget.blur(); });
  document.getElementById("tab-note-all").addEventListener("click", e => { toggleNotes("all"); e.currentTarget.blur(); });
  document.getElementById("btn-close-notes").addEventListener("click", e => { closeNotes(); e.currentTarget.blur(); });
  document.getElementById("btn-anim-toggle").addEventListener("click", e => { triggerCurrentSlideAnim(); e.currentTarget.blur(); });
  document.getElementById("btn-autoplay").addEventListener("click", e => { toggleAutoplay(); e.currentTarget.blur(); });
  document.getElementById("btn-fullscreen").addEventListener("click", e => { toggleFullscreen(); e.currentTarget.blur(); });

  // Global keyboard shortcuts
  document.addEventListener("keydown", e => {
    const tag = e.target && e.target.tagName ? e.target.tagName.toUpperCase() : "";
    if (tag === "INPUT" && e.target.type !== "range") return;

    const k = e.key;
    if (k === "ArrowRight" || k === "PageDown") {
      e.preventDefault();
      goToSlide(currentIndex + 1);
    } else if (k === "ArrowLeft" || k === "PageUp") {
      e.preventDefault();
      goToSlide(currentIndex - 1);
    } else if (k === "Home") {
      e.preventDefault();
      goToSlide(0);
    } else if (k === "End") {
      e.preventDefault();
      goToSlide(totalSlides - 1);
    } else if (k === "g" || k === "G") {
      e.preventDefault();
      toggleTOC();
    } else if (k === "n" || k === "N") {
      e.preventDefault();
      toggleNotes("current");
    } else if (k === "t" || k === "T") {
      e.preventDefault();
      toggleNotes("all");
    } else if (k === "p" || k === "P") {
      e.preventDefault();
      toggleAutoplay();
    } else if (k === "f" || k === "F") {
      e.preventDefault();
      toggleFullscreen();
    } else if (k === " ") {
      e.preventDefault();
      triggerCurrentSlideAnim();
    } else if (k === "Escape") {
      if (notesMode) closeNotes();
      else if (tocOpen) toggleTOC();
    }
  });

  // Initialize state
  goToSlide(0);
})();
</script>
</body>
</html>
