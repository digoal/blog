 font-weight=\"400\" >目标顺序<\/text><line x1=\"836.0\" y1=\"141.0\" x2=\"847.6\" y2=\"141.0\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><polygon points=\"854.0,141.0 846.0,136.6 846.0,145.4\" fill=\"#7BA6AF\"/><rect x=\"856.0\" y=\"56.0\" width=\"250.0\" height=\"170.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#245A6B\" stroke-width=\"1.4\" /><rect x=\"856.0\" y=\"56.0\" width=\"250.0\" height=\"34.0\" rx=\"4\" fill=\"#74A5AD\" stroke=\"#74A5AD\" stroke-width=\"1.0\" /><text x=\"870.0\" y=\"79.0\" class=\"sv m\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"600\" >04<\/text><text x=\"981.0\" y=\"125.6\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.5\" fill=\"#1B2B33\" font-weight=\"600\" >调用<\/text><text x=\"981.0\" y=\"145.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.5\" fill=\"#1B2B33\" font-weight=\"600\" >cost_incremental_sort()<\/text><line x1=\"874.0\" y1=\"166.0\" x2=\"1088.0\" y2=\"166.0\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"981.0\" y=\"199.2\" class=\"sv m\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >估算启动与总成本<\/text><line x1=\"1108.0\" y1=\"141.0\" x2=\"1119.6\" y2=\"141.0\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><polygon points=\"1126.0,141.0 1118.0,136.6 1118.0,145.4\" fill=\"#7BA6AF\"/><rect x=\"1128.0\" y=\"56.0\" width=\"250.0\" height=\"170.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"1128.0\" y=\"56.0\" width=\"250.0\" height=\"34.0\" rx=\"4\" fill=\"#A4C4C6\" stroke=\"#A4C4C6\" stroke-width=\"1.0\" /><text x=\"1142.0\" y=\"79.0\" class=\"sv m\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"600\" >05<\/text><text x=\"1253.0\" y=\"135.3\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.5\" fill=\"#1B2B33\" font-weight=\"600\" >保存 nPresortedCols<\/text><line x1=\"1146.0\" y1=\"166.0\" x2=\"1360.0\" y2=\"166.0\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1253.0\" y=\"199.2\" class=\"sv m\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >= presorted_keys<\/text><rect x=\"40.0\" y=\"258.0\" width=\"1300.0\" height=\"62.0\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"60.0\" y=\"284.0\" class=\"sv m\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" >create_incremental_sort_path()<\/text><text x=\"60.0\" y=\"308.0\" class=\"sv m\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >位置：postgres/src/backend/optimizer/util/pathnode.c<\/text><rect x=\"40.0\" y=\"334.0\" width=\"1300.0\" height=\"74.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"690.0\" y=\"376.1\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#46585F\" font-weight=\"400\" >输出 IncrementalSortPath，nPresortedCols = presorted_keys；成本由 cost_incremental_sort() 给出，成为与普通 Sort 竞争的候选。<\/text><\/svg>","ctrl":""},{"eyebrow":"第三章 · 优化器","title":"成本模型押在 input_groups 上","lede":"先估前缀能切出多少组，再算单组排序成本，乘组数，最后加分组检测、tuple copy 与 reset。","caption":"图 10：cost_incremental_sort() 的简化式与两类估计风险。公式取自原文 3.2，为便于阅读做了对齐。","bridge":"账算完了，执行器却并不照着「一组一排」的朴素模型走。","notes":"cost_incremental_sort() 在 costsize.c，源码注释把模型讲得很直接：输入已按前 presorted_keys 个 pathkeys 排序；先估前缀键能把输入切成多少个 group；再估单个 group 用 tuplesort 排序的成本；最后乘组数，并加上分组检测、tuple copy、tuplesort_reset 的额外成本。\n\n写成简化式就是：input_groups = estimate_num_groups(前缀表达式, input_tuples)，group_tuples = input_tuples / input_groups；startup_cost 只需要覆盖输入启动成本、第一组输入和第一组排序启动；total_cost 再叠上所有组的排序运行成本、剩余输入、每行分组检测和每组 reset。\n\n看出关键了吗？startup_cost 里只有「第一组」。这就是 LIMIT、游标分页、窗口函数局部排序特别容易受益的原因。而最敏感的变量是 input_groups：低估组大小，实际会撞上少数巨型组；高估组数，又会低估频繁 reset 的开销。统计信息一旦失真，整条账就歪了。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40.0\" y=\"24.0\" width=\"850.0\" height=\"306.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"58.0\" y=\"52.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#245A6B\" font-weight=\"600\" >cost_incremental_sort() · costsize.c（简化式）<\/text><text x=\"58.0\" y=\"78.0\" class=\"sv m\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"400\" >input_groups = estimate_num_groups(前缀表达式,<\/text><text x=\"58.0\" y=\"101.2\" class=\"sv m\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"400\" >                                  input_tuples)<\/text><text x=\"58.0\" y=\"124.4\" class=\"sv m\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" >group_tuples = input_tuples / input_groups<\/text><text x=\"58.0\" y=\"147.7\" class=\"sv m\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" >startup_cost = input_startup_cost + 第一组输入<\/text><text x=\"58.0\" y=\"170.9\" class=\"sv m\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" >               + 第一组排序启动成本<\/text><text x=\"58.0\" y=\"194.1\" class=\"sv m\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" >total_cost   = startup_cost + 所有组排序运行<\/text><text x=\"58.0\" y=\"217.3\" class=\"sv m\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" >               + 剩余输入 + 每行分组检测<\/text><text x=\"58.0\" y=\"240.5\" class=\"sv m\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" >               + 每组 tuplesort_reset<\/text><rect x=\"920.0\" y=\"24.0\" width=\"440.0\" height=\"142.0\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\" /><text x=\"940.0\" y=\"52.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#BE653B\" font-weight=\"600\" >风险 A · 低估组大小<\/text><text x=\"940.0\" y=\"76.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >优化器以为每组很小，实际撞上少数巨型组 → 单次排序规模没降<\/text><text x=\"940.0\" y=\"95.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >下来。<\/text><rect x=\"920.0\" y=\"178.0\" width=\"440.0\" height=\"142.0\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\" /><text x=\"940.0\" y=\"206.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#BE653B\" font-weight=\"600\" >风险 B · 高估组数<\/text><text x=\"940.0\" y=\"230.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >以为组很多，却低估了频繁 reset 与分组检测的开销，计划反而<\/text><text x=\"940.0\" y=\"249.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >更差。<\/text><rect x=\"40.0\" y=\"344.0\" width=\"1320.0\" height=\"66.0\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1.0\" /><text x=\"700.0\" y=\"381.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#AE8A3E\" font-weight=\"600\" >最敏感变量是 input_groups：先估前缀表达式能切出多少组，再算单组 tuplesort 成本，最后乘组数并加分组检测、tuple copy、reset 的额外成本。<\/text><\/svg>","ctrl":""},{"eyebrow":"第四章 · 执行器","title":"两种装载模式：小组与大组的实用主义","lede":"PostgreSQL 没有照着「一组一排」的朴素模型实现，而是用 32 / 64 两个阈值在两种模式间切换。","caption":"图 11：两个模式与组内累计行数的示意刻度。阈值 32 与 64 来自 nodeIncrementalSort.c 的源码宏。","bridge":"模式切换的开关，是「这个 tuple 还在不在当前组」—— 下页看判定细节。","notes":"理论模型很简单：按前缀键相等拆组，组内只排剩余列。但真实工程里有个麻烦——如果每个前缀组只有一两行，为每个组单独开一次 tuplesort，管理成本会盖过排序本身。\n\n所以 nodeIncrementalSort.c 做了两种装载模式。full sort 模式按全部 sort keys 排序，对小组友好，避免太多小 tuplesort；presorted prefix 模式只按未预排序的后缀 keys 排序，对大组友好，省掉比较已知相等的前缀列。\n\n两个源码阈值是关键：DEFAULT_MIN_GROUP_SIZE = 32，DEFAULT_MAX_FULL_SORT_GROUP_SIZE = 2 × 32 = 64。小于 32 行先别急着按组切分，整批 full sort 更划算；如果累计超过 64 行还没遇到新前缀组，说明大概率进了大组，切到 prefix sort。\n\n请动一下下面的滑块或按播放：这不是实测曲线，是把源码阈值可视化，帮你记住「小组免管理开销、大组免重复比较」这句设计意图。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40.0\" y=\"18.0\" width=\"630.0\" height=\"108.0\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.3\" /><text x=\"60.0\" y=\"46.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"600\" >full sort 模式<\/text><text x=\"60.0\" y=\"76.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"600\" >排序键：全部 sort keys<\/text><text x=\"60.0\" y=\"104.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >对小组友好：避免为很多小组反复建 tuplesort<\/text><rect x=\"730.0\" y=\"18.0\" width=\"630.0\" height=\"108.0\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.3\" /><text x=\"750.0\" y=\"46.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#2F7A66\" font-weight=\"600\" >presorted prefix 模式<\/text><text x=\"750.0\" y=\"76.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"600\" >排序键：只排未预排序的后缀 keys<\/text><text x=\"750.0\" y=\"104.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >对大组友好：少比较已知相等的前缀列<\/text><text x=\"40.0\" y=\"152.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >组内累计行数（示意刻度；阈值 32 / 64 取自 nodeIncrementalSort.c 源码宏）<\/text><rect x=\"100.0\" y=\"166.0\" width=\"400.0\" height=\"54.0\" rx=\"3\" fill=\"#CFE0DC\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"300.0\" y=\"188.8\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"600\" >小组积累区  &lt; 32<\/text><text x=\"300.0\" y=\"209.1\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >不急着切组<\/text><rect x=\"500.0\" y=\"166.0\" width=\"400.0\" height=\"54.0\" rx=\"3\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"700.0\" y=\"188.8\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"600\" >边界检测区  32 – 64<\/text><text x=\"700.0\" y=\"209.1\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >开始比较前缀键<\/text><rect x=\"900.0\" y=\"166.0\" width=\"400.0\" height=\"54.0\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"1100.0\" y=\"188.8\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"600\" >大组切换区  &gt; 64<\/text><text x=\"1100.0\" y=\"209.1\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >切到 prefix sort<\/text><rect x=\"100.0\" y=\"246.0\" width=\"1200.0\" height=\"12.0\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"100.0\" y=\"246.0\" width=\"0.0\" height=\"12.0\" rx=\"2\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1.0\" id=\"aBar\"/><polygon id=\"aMark\" points=\"91,238 109,238 100,248\" fill=\"#BE653B\"/><line x1=\"100.0\" y1=\"258.0\" x2=\"100.0\" y2=\"266.0\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"100.0\" y=\"282.0\" class=\"sv m\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" >0<\/text><line x1=\"500.0\" y1=\"258.0\" x2=\"500.0\" y2=\"266.0\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"500.0\" y=\"282.0\" class=\"sv m\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" >32<\/text><line x1=\"900.0\" y1=\"258.0\" x2=\"900.0\" y2=\"266.0\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"900.0\" y=\"282.0\" class=\"sv m\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" >64<\/text><line x1=\"1300.0\" y1=\"258.0\" x2=\"1300.0\" y2=\"266.0\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"1300.0\" y=\"282.0\" class=\"sv m\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" >96<\/text><text x=\"100.0\" y=\"312.0\" class=\"sv m\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"600\" id=\"aVal\">0 行<\/text><rect x=\"40.0\" y=\"330.0\" width=\"1300.0\" height=\"82.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"690.0\" y=\"375.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >源码注释的实用主义：DEFAULT_MIN_GROUP_SIZE = 32 让小组免于管理开销；DEFAULT_MAX_FULL_SORT_GROUP_SIZE = 2 × 32 = 64，超过仍无新组边界就判定为大组。<\/text><\/svg>","ctrl":"<label>组内累计行数<\/label><input type=\"range\" id=\"aSize\" min=\"0\" max=\"96\" step=\"4\" value=\"0\"><span class=\"mono\" id=\"aSizeLbl\">0<\/span><button class=\"btn play\" id=\"aPlay\">▶ 播放<\/button><button class=\"btn\" id=\"aStep\">单步<\/button><button class=\"btn\" id=\"aReset\">重置<\/button><span class=\"out\" id=\"aOut\"><\/span>"},{"eyebrow":"第四章 · 执行器","title":"一个 tuple 属于当前组吗？","lede":"isCurrentGroup() 比较 group_pivot 与新 tuple 的前缀键，等值语义由 opclass 提供。","caption":"图 12：四类判定条件与对应结论。最后一行是源码注释给出的比较顺序理由。","bridge":"边界判定清楚了，四个执行状态就能串成一台状态机。","notes":"要在组与组之间切换，总得回答一个问题：这个新来的 tuple，还在不在当前前缀组里？\n\npreparePresortedCols() 先为每个 presorted key 准备等值比较函数：从排序操作符反查 equality operator，取出对应函数，存进 PresortedKeyData。然后 isCurrentGroup() 拿当前 group_pivot 和新 tuple 比。四种情况：两值都是 NULL，认为这一列相等；一个 NULL 一个非 NULL，不属于同组；都非 NULL 时调用 equality function；比较顺序是从最后一个 presorted key 往前，源码注释解释说尾部 key 更可能变化，可以更早发现不等。\n\n这里藏着一个很容易忽略的边界：增量排序依赖「排序语义」和「等值语义」之间的匹配。PostgreSQL 不硬编码类型比较，而是通过 opclass / operator 体系拿到对应等值操作符。这也是为什么它必须是一个数据库内核节点，而不是应用层能随手模拟的小技巧。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40.0\" y=\"24.0\" width=\"420.0\" height=\"44.0\" rx=\"3\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.0\" /><text x=\"56.0\" y=\"52.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#FFFFFF\" font-weight=\"600\" >判定条件<\/text><rect x=\"470.0\" y=\"24.0\" width=\"260.0\" height=\"44.0\" rx=\"3\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.0\" /><text x=\"486.0\" y=\"52.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#FFFFFF\" font-weight=\"600\" >结论<\/text><rect x=\"740.0\" y=\"24.0\" width=\"620.0\" height=\"44.0\" rx=\"3\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.0\" /><text x=\"756.0\" y=\"52.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#FFFFFF\" font-weight=\"600\" >说明 / 依据<\/text><rect x=\"40.0\" y=\"76.0\" width=\"420.0\" height=\"58.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"470.0\" y=\"76.0\" width=\"260.0\" height=\"58.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"740.0\" y=\"76.0\" width=\"620.0\" height=\"58.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"250.0\" y=\"109.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"600\" >两个值都是 NULL<\/text><text x=\"600.0\" y=\"109.6\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#2F7A66\" font-weight=\"600\" >同组（相等）<\/text><text x=\"1050.0\" y=\"109.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >isCurrentGroup() 把双 NULL 视为这一列相等<\/text><rect x=\"40.0\" y=\"142.0\" width=\"420.0\" height=\"58.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"470.0\" y=\"142.0\" width=\"260.0\" height=\"58.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"740.0\" y=\"142.0\" width=\"620.0\" height=\"58.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"250.0\" y=\"175.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"600\" >一个 NULL、一个非 NULL<\/text><text x=\"600.0\" y=\"175.6\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#2F7A66\" font-weight=\"600\" >新组（不等）<\/text><text x=\"1050.0\" y=\"175.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >前缀键不同，当前前缀组到此结束<\/text><rect x=\"40.0\" y=\"208.0\" width=\"420.0\" height=\"58.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"470.0\" y=\"208.0\" width=\"260.0\" height=\"58.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"740.0\" y=\"208.0\" width=\"620.0\" height=\"58.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"250.0\" y=\"241.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"600\" >两边都是非 NULL<\/text><text x=\"600.0\" y=\"241.6\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"600\" >调用 equality function<\/text><text x=\"1050.0\" y=\"241.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >preparePresortedCols() 从排序操作符反查 equality operator，存入 PresortedKeyData<\/text><rect x=\"40.0\" y=\"274.0\" width=\"420.0\" height=\"58.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"470.0\" y=\"274.0\" width=\"260.0\" height=\"58.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"740.0\" y=\"274.0\" width=\"620.0\" height=\"58.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"250.0\" y=\"307.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"600\" >比较的先后顺序<\/text><text x=\"600.0\" y=\"307.6\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"600\" >从最后一个 presorted key 往前<\/text><text x=\"1050.0\" y=\"307.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >源码注释：尾部 key 更可能变化，可以更早发现不等<\/text><rect x=\"40.0\" y=\"348.0\" width=\"1320.0\" height=\"64.0\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1.0\" /><text x=\"700.0\" y=\"384.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#AE8A3E\" font-weight=\"600\" >边界：Incremental Sort 依赖「排序语义」与「等值语义」匹配。PostgreSQL 借 opclass / operator 体系取对应等值操作符，不硬编码类型比较。<\/text><\/svg>","ctrl":""},{"eyebrow":"第四章 · 执行器","title":"四个状态，一台状态机","lede":"LOAD / READ × FULL / PREFIX 共四种状态，随组规模在两条路径之间来回切换。","caption":"图 13：IncrementalSortExecutionStatus 的四个状态。下方列出 IncrementalSortState 的关键字段。","bridge":"状态机解释了「怎么排」，下一页解释「为什么可以不排完」。","notes":"执行期状态定义在 IncrementalSortExecutionStatus 里，四个状态：INCSORT_LOADFULLSORT 从下层拉 tuple 装入 fullsort_state；INCSORT_READFULLSORT 从 fullsort 结果里返回；INCSORT_LOADPREFIXSORT 在当前组足够大时，只把后续 tuple 装进 prefixsort_state；INCSORT_READPREFIXSORT 从 prefixsort 结果返回。\n\nIncrementalSortState 里几个字段值得记住：fullsort_state 由 tuplesort_begin_heap() 创建、按完整 sort key 排；prefixsort_state 只按后缀排；presorted_keys 存比较函数和属性号；group_pivot 是当前组代表 tuple；transfer_tuple 负责从 fullsort 切到 prefixsort 时搬运跨组 tuple；n_fullsort_remaining 记着还没转移完的数量；bounded / bound / bound_Done 服务上层 LIMIT。\n\n按下面的场景选择器切换「小组」和「大组」，再播放：小组走 LOADFULLSORT → READFULLSORT → 下一组；大组走 LOADFULLSORT → LOADPREFIXSORT → READPREFIXSORT → 下一组。同一台状态机，两条路径。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><g class=\"sgroup\" data-i=\"0\"><rect x=\"40.0\" y=\"44.0\" width=\"270.0\" height=\"142.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.6\" class=\"sbg\" data-i=\"0\"/><\/g><text x=\"175.0\" y=\"78.0\" class=\"sv m\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#BE653B\" font-weight=\"600\" >01<\/text><text x=\"175.0\" y=\"109.9\" class=\"sv m\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"600\" >LOADFULLSORT<\/text><line x1=\"58.0\" y1=\"128.0\" x2=\"292.0\" y2=\"128.0\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"175.0\" y=\"146.2\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >从下层拉 tuple<\/text><text x=\"175.0\" y=\"168.2\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >装入 fullsort_state<\/text><line x1=\"312.0\" y1=\"115.0\" x2=\"381.6\" y2=\"115.0\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><polygon points=\"388.0,115.0 380.0,110.6 380.0,119.4\" fill=\"#7BA6AF\"/><g class=\"sgroup\" data-i=\"1\"><rect x=\"390.0\" y=\"44.0\" width=\"270.0\" height=\"142.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.6\" class=\"sbg\" data-i=\"1\"/><\/g><text x=\"525.0\" y=\"78.0\" class=\"sv m\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#BE653B\" font-weight=\"600\" >02<\/text><text x=\"525.0\" y=\"109.9\" class=\"sv m\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"600\" >READFULLSORT<\/text><line x1=\"408.0\" y1=\"128.0\" x2=\"642.0\" y2=\"128.0\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"525.0\" y=\"146.2\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >读出排序结果<\/text><text x=\"525.0\" y=\"168.2\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >返回当前小批次<\/text><line x1=\"662.0\" y1=\"115.0\" x2=\"731.6\" y2=\"115.0\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><polygon points=\"738.0,115.0 730.0,110.6 730.0,119.4\" fill=\"#7BA6AF\"/><g class=\"sgroup\" data-i=\"2\"><rect x=\"740.0\" y=\"44.0\" width=\"270.0\" height=\"142.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.6\" class=\"sbg\" data-i=\"2\"/><\/g><text x=\"875.0\" y=\"78.0\" class=\"sv m\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#BE653B\" font-weight=\"600\" >03<\/text><text x=\"875.0\" y=\"109.9\" class=\"sv m\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"600\" >LOADPREFIXSORT<\/text><line x1=\"758.0\" y1=\"128.0\" x2=\"992.0\" y2=\"128.0\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"875.0\" y=\"146.2\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >确认大组后切换<\/text><text x=\"875.0\" y=\"168.2\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >装入 prefixsort_state<\/text><line x1=\"1012.0\" y1=\"115.0\" x2=\"1081.6\" y2=\"115.0\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><polygon points=\"1088.0,115.0 1080.0,110.6 1080.0,119.4\" fill=\"#7BA6AF\"/><g class=\"sgroup\" data-i=\"3\"><rect x=\"1090.0\" y=\"44.0\" width=\"270.0\" height=\"142.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.6\" class=\"sbg\" data-i=\"3\"/><\/g><text x=\"1225.0\" y=\"78.0\" class=\"sv m\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#BE653B\" font-weight=\"600\" >04<\/text><text x=\"1225.0\" y=\"109.9\" class=\"sv m\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"600\" >READPREFIXSORT<\/text><line x1=\"1108.0\" y1=\"128.0\" x2=\"1342.0\" y2=\"128.0\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1225.0\" y=\"146.2\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >读出后缀排序结果<\/text><text x=\"1225.0\" y=\"168.2\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >组结束后回到 fullsort<\/text><line x1=\"1225.0\" y1=\"186.0\" x2=\"1225.0\" y2=\"230.0\" stroke=\"#7BA6AF\" stroke-width=\"1.5\"/><line x1=\"1225.0\" y1=\"230.0\" x2=\"175.0\" y2=\"230.0\" stroke=\"#7BA6AF\" stroke-width=\"1.5\"/><line x1=\"175.0\" y1=\"230.0\" x2=\"175.0\" y2=\"198.4\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><polygon points=\"175.0,192.0 170.6,200.0 179.4,200.0\" fill=\"#7BA6AF\"/><text x=\"700.0\" y=\"254.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" >输出完一组 → 回到 LOADFULLSORT 处理下一组<\/text><rect x=\"40.0\" y=\"278.0\" width=\"1300.0\" height=\"62.0\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"690.0\" y=\"313.6\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >IncrementalSortState：fullsort_state 排全部 key；prefixsort_state 只排后缀；group_pivot 是当前组代表；transfer_tuple 搬运跨组 tuple；bounded / bound 服务上层 LIMIT。<\/text><rect x=\"40.0\" y=\"350.0\" width=\"1300.0\" height=\"62.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"690.0\" y=\"385.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"600\" >路径随组规模变化：小组走 LOADFULLSORT → READFULLSORT → 下一组；大组走 LOADFULLSORT → LOADPREFIXSORT → READPREFIXSORT → 下一组。<\/text><\/svg>","ctrl":"<label>场景<\/label><select id=\"bCase\"><option value=\"small\">小组（&lt; 32 行）<\/option><option value=\"large\">大组（&gt; 64 行）<\/option><\/select><button class=\"btn play\" id=\"bPlay\">▶ 播放<\/button><button class=\"btn\" id=\"bStep\">单步<\/button><button class=\"btn\" id=\"bReset\">重置<\/button><span class=\"out\" id=\"bOut\"><\/span>"},{"eyebrow":"第四章 · 执行器","title":"LIMIT 为什么特别容易受益","lede":"第一组排完就能输出；前几组够 LIMIT 用，就不必为了完整结果排序所有组。","caption":"图 14：五个前缀组为概念示意，非实测数据。回归测试注释与深分页的注意事项见最下方。","bridge":"说得再好也得能观测 —— 接下来看 EXPLAIN ANALYZE 给的三类证据。","notes":"普通 Sort 通常要读完所有输入，才能保证全局有序输出，这是正确性的代价。增量排序不一样：第一组排完就能交货。如果上层有 LIMIT 100，而头几个前缀组已经凑够一百行，后面的组根本不用排。\n\nPostgreSQL 自带的回归测试 incremental_sort.sql 第一段就把这个目标写进注释：When there is a LIMIT clause, incremental sort is beneficial because it only has to sort some of the groups, and not the entire table. 对应期望计划是 Limit → Incremental Sort（Sort Key: tenk1.four, tenk1.ten；Presorted Key: tenk1.four）→ Sort（Sort Key: four）→ Seq Scan on tenk1。注意前缀顺序来自另一个 Sort，不是索引。\n\n但别把 LIMIT 当成万能符。原文坑 4 提醒：深分页 OFFSET 1000000 LIMIT 100 仍要处理前面大量组，收益会消失，更好的做法通常是 keyset pagination。请用下面的组数输入与播放按钮，把这个「只排前 k 组」的过程走一遍。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40.0\" y=\"34.0\" width=\"120.0\" height=\"76.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"100.0\" y=\"76.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"600\" >普通 Sort<\/text><rect x=\"40.0\" y=\"190.0\" width=\"120.0\" height=\"76.0\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"100.0\" y=\"224.5\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"600\" >Incremental<\/text><text x=\"100.0\" y=\"240.7\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"600\" >Sort<\/text><rect x=\"170.0\" y=\"34.0\" width=\"195.0\" height=\"76.0\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\" /><text x=\"267.5\" y=\"76.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#BE653B\" font-weight=\"600\" >组 1（必须处理）<\/text><rect x=\"170.0\" y=\"190.0\" width=\"195.0\" height=\"76.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" class=\"cInc\" data-i=\"0\"/><text x=\"267.5\" y=\"236.0\" class=\"sv m\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#46585F\" font-weight=\"600\" data-ct=\"0\">组 1<\/text><rect x=\"395.0\" y=\"34.0\" width=\"195.0\" height=\"76.0\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\" /><text x=\"492.5\" y=\"76.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#BE653B\" font-weight=\"600\" >组 2（必须处理）<\/text><rect x=\"395.0\" y=\"190.0\" width=\"195.0\" height=\"76.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" class=\"cInc\" data-i=\"1\"/><text x=\"492.5\" y=\"236.0\" class=\"sv m\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#46585F\" font-weight=\"600\" data-ct=\"1\">组 2<\/text><rect x=\"620.0\" y=\"34.0\" width=\"195.0\" height=\"76.0\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\" /><text x=\"717.5\" y=\"76.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#BE653B\" font-weight=\"600\" >组 3（必须处理）<\/text><rect x=\"620.0\" y=\"190.0\" width=\"195.0\" height=\"76.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" class=\"cInc\" data-i=\"2\"/><text x=\"717.5\" y=\"236.0\" class=\"sv m\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#46585F\" font-weight=\"600\" data-ct=\"2\">组 3<\/text><rect x=\"845.0\" y=\"34.0\" width=\"195.0\" height=\"76.0\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\" /><text x=\"942.5\" y=\"76.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#BE653B\" font-weight=\"600\" >组 4（必须处理）<\/text><rect x=\"845.0\" y=\"190.0\" width=\"195.0\" height=\"76.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" class=\"cInc\" data-i=\"3\"/><text x=\"942.5\" y=\"236.0\" class=\"sv m\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#46585F\" font-weight=\"600\" data-ct=\"3\">组 4<\/text><rect x=\"1070.0\" y=\"34.0\" width=\"195.0\" height=\"76.0\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\" /><text x=\"1167.5\" y=\"76.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#BE653B\" font-weight=\"600\" >组 5（必须处理）<\/text><rect x=\"1070.0\" y=\"190.0\" width=\"195.0\" height=\"76.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" class=\"cInc\" data-i=\"4\"/><text x=\"1167.5\" y=\"236.0\" class=\"sv m\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#46585F\" font-weight=\"600\" data-ct=\"4\">组 5<\/text><line x1=\"1295.0\" y1=\"72.0\" x2=\"1338.6\" y2=\"72.0\" stroke=\"#BE653B\" stroke-width=\"1.8\"/><polygon points=\"1345.0,72.0 1337.0,67.6 1337.0,76.4\" fill=\"#BE653B\"/><text x=\"1348.0\" y=\"76.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#BE653B\" font-weight=\"600\" >输出<\/text><line x1=\"1295.0\" y1=\"228.0\" x2=\"1338.6\" y2=\"228.0\" stroke=\"#2F7A66\" stroke-width=\"1.8\"/><polygon points=\"1345.0,228.0 1337.0,223.6 1337.0,232.4\" fill=\"#2F7A66\"/><text x=\"1348.0\" y=\"232.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#2F7A66\" font-weight=\"600\" >输出<\/text><rect x=\"40.0\" y=\"124.0\" width=\"1300.0\" height=\"48.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"690.0\" y=\"152.8\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >普通 Sort 通常要读完所有输入，才能保证全局有序输出 —— 5 个组都得进排序器。<\/text><rect x=\"40.0\" y=\"280.0\" width=\"1300.0\" height=\"48.0\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1.0\" /><text x=\"690.0\" y=\"308.8\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#2F7A66\" font-weight=\"600\" >增量排序：前 k 组已够 LIMIT 所需，就可以停下；bounded / bound / bound_Done 服务这个上界。<\/text><rect x=\"40.0\" y=\"340.0\" width=\"1300.0\" height=\"70.0\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1.0\" /><text x=\"690.0\" y=\"379.8\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#AE8A3E\" font-weight=\"400\" >回归测试 incremental_sort.sql 注释：有 LIMIT 时只需排序部分组而非整表。但深分页 OFFSET 1000000 仍要处理前面大量组，更好的做法通常是 keyset pagination。<\/text><\/svg>","ctrl":"<label>LIMIT 需要的组数<\/label><select id=\"cK\"><option value=\"1\">1 组<\/option><option value=\"2\">2 组<\/option><option value=\"3\">3 组<\/option><option value=\"4\">4 组<\/option><option value=\"5\">5 组<\/option><\/select><button class=\"btn play\" id=\"cPlay\">▶ 播放<\/button><button class=\"btn\" id=\"cStep\">单步<\/button><button class=\"btn\" id=\"cReset\">重置<\/button><span class=\"out\" id=\"cOut\"><\/span>"},{"eyebrow":"第四章 · 执行器","title":"EXPLAIN 里能看到的四类信息","lede":"Sort Key / Presorted Key 说明它复用了什么；两类 Groups 说明它实际怎么跑的。","caption":"图 15：explain.c 的展示函数与字段映射。Full-sort / Pre-sorted Groups 只在 EXPLAIN ANALYZE 出现。","bridge":"会读计划，才谈得上评估收益边界 —— 下一章开始做横向比较。","notes":"explain.c 对增量排序做了两类展示。show_incremental_sort_keys() 输出完整的 Sort Key 和前缀 Presorted Key；show_incremental_sort_info() 在 EXPLAIN ANALYZE 时输出分组统计。\n\n所以你在执行分析里会看到类似这样的结构：Incremental Sort，Sort Key: a, b，Presorted Key: a，Full-sort Groups: …，Pre-sorted Groups: …。前两行是计划层面的承诺，后两行是执行层面的事实：Full-sort Groups 对应 full sort 模式处理过的组，Pre-sorted Groups 对应切到 prefix sort 后处理的大前缀组。incremental_sort.sql 还专门用 JSON 格式检查这些节点和统计字段。\n\n实操时我建议按这个顺序读：先看 Presorted Key 覆盖了目标排序键的几列，再看两类 Groups 的比例，最后结合 BUFFERS 看有没有落盘。节点名本身不提供信息，字段才提供信息。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40.0\" y=\"24.0\" width=\"620.0\" height=\"330.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"58.0\" y=\"52.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#245A6B\" font-weight=\"600\" >EXPLAIN (ANALYZE) 片段（字段示意）<\/text><text x=\"58.0\" y=\"78.0\" class=\"sv m\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#BE653B\" font-weight=\"400\" >Incremental Sort<\/text><text x=\"58.0\" y=\"134.0\" class=\"sv m\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"400\" >  Sort Key: a, b<\/text><text x=\"58.0\" y=\"189.9\" class=\"sv m\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"400\" >  Presorted Key: a<\/text><text x=\"58.0\" y=\"245.9\" class=\"sv m\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >  Full-sort Groups: ...<\/text><text x=\"58.0\" y=\"301.9\" class=\"sv m\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >  Pre-sorted Groups: ...<\/text><line x1=\"660.0\" y1=\"78.0\" x2=\"716.0\" y2=\"78.0\" stroke=\"#7BA6AF\" stroke-width=\"1.5\"/><rect x=\"720.0\" y=\"50.0\" width=\"640.0\" height=\"56.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"736.0\" y=\"84.0\" class=\"sv m\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#BE653B\" font-weight=\"600\" >节点名<\/text><text x=\"960.0\" y=\"84.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >显式计划节点，不是普通 Sort 的别名<\/text><line x1=\"660.0\" y1=\"134.0\" x2=\"716.0\" y2=\"134.0\" stroke=\"#7BA6AF\" stroke-width=\"1.5\"/><rect x=\"720.0\" y=\"106.0\" width=\"640.0\" height=\"56.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"736.0\" y=\"140.0\" class=\"sv m\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#BE653B\" font-weight=\"600\" >Sort Key<\/text><text x=\"960.0\" y=\"140.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >完整目标排序键，必须由本节点保证<\/text><line x1=\"660.0\" y1=\"190.0\" x2=\"716.0\" y2=\"190.0\" stroke=\"#7BA6AF\" stroke-width=\"1.5\"/><rect x=\"720.0\" y=\"162.0\" width=\"640.0\" height=\"56.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"736.0\" y=\"196.0\" class=\"sv m\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#BE653B\" font-weight=\"600\" >Presorted Key<\/text><text x=\"960.0\" y=\"196.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >下层已保证的前缀键，无需重排<\/text><line x1=\"660.0\" y1=\"246.0\" x2=\"716.0\" y2=\"246.0\" stroke=\"#7BA6AF\" stroke-width=\"1.5\"/><rect x=\"720.0\" y=\"218.0\" width=\"640.0\" height=\"56.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"736.0\" y=\"252.0\" class=\"sv m\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#BE653B\" font-weight=\"600\" >Full-sort Groups<\/text><text x=\"960.0\" y=\"252.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >full sort 模式处理过的组数<\/text><line x1=\"660.0\" y1=\"302.0\" x2=\"716.0\" y2=\"302.0\" stroke=\"#7BA6AF\" stroke-width=\"1.5\"/><rect x=\"720.0\" y=\"274.0\" width=\"640.0\" height=\"56.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"736.0\" y=\"308.0\" class=\"sv m\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#BE653B\" font-weight=\"600\" >Pre-sorted Groups<\/text><text x=\"960.0\" y=\"308.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >切到 prefix sort 后处理的大前缀组数<\/text><rect x=\"40.0\" y=\"358.0\" width=\"1320.0\" height=\"56.0\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"700.0\" y=\"390.8\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"400\" >show_incremental_sort_keys() 输出两类键；show_incremental_sort_info() 在 EXPLAIN ANALYZE 时输出分组统计；回归测试还用 JSON 格式检查这些字段。<\/text><\/svg>","ctrl":""},{"eyebrow":"第五章 · 边界","title":"五种有序手段，各管一段","lede":"关键差别不是谁更快，而是工作单位不同：整个输入，还是前缀组。","caption":"图 16：原文第四章横向对比表的图形化整理。高亮列为主角；其余四项为对照，不是优劣排名。","bridge":"分工清楚了，还剩一个反直觉的结论：收益并不随组变大而单调上升。","notes":"把增量排序放回工具箱里看，会更容易定位。普通 Sort 从无序输入得到完整目标顺序，没有顺序前提，但启动延迟和内存压力都随输入总量走；Index Scan 顺序输出在查询顺序与索引完全匹配时最省事，可过滤条件一旦和索引顺序冲突就不灵；Top-N Heapsort 只保留前 N 个候选，适合 ORDER BY … LIMIT，但输入仍需扫描；MergeAppend 负责合并多个已排序子路径，成本落在多路合并和子路径约束上。\n\n增量排序占的格子是：输入已有前缀有序，目标要更长的排序键。它的额外成本是分组检测、tuple copy、reset；不适合前缀组极小且多，或者统计误导的场景。\n\n所以别问「它是不是比 Sort 快」。要问的是：这条查询的资源瓶颈，是启动延迟、单次排序内存，还是组管理的固定开销？","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"0.0\" y=\"20.0\" width=\"150.0\" height=\"44.0\" rx=\"2\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.0\" /><text x=\"75.0\" y=\"46.6\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#FFFFFF\" font-weight=\"600\" >维度<\/text><rect x=\"150.0\" y=\"20.0\" width=\"250.0\" height=\"44.0\" rx=\"2\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.0\" /><text x=\"275.0\" y=\"46.6\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#FFFFFF\" font-weight=\"600\" >Incremental Sort<\/text><rect x=\"400.0\" y=\"20.0\" width=\"250.0\" height=\"44.0\" rx=\"2\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.0\" /><text x=\"525.0\" y=\"46.6\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#FFFFFF\" font-weight=\"600\" >普通 Sort<\/text><rect x=\"650.0\" y=\"20.0\" width=\"250.0\" height=\"44.0\" rx=\"2\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.0\" /><text x=\"775.0\" y=\"46.6\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#FFFFFF\" font-weight=\"600\" >Index Scan 顺序输出<\/text><rect x=\"900.0\" y=\"20.0\" width=\"250.0\" height=\"44.0\" rx=\"2\" fill=\"#2E6373\" stroke=\"#2E6373\" 不同：普通 Sort 面向整个输入，增量排序面向前缀组。<\/text><text x=\"0.0\" y=\"418.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >表格据原文第四章整理；Index Scan / Top-N Heapsort / MergeAppend 为对照项，非优劣排名。<\/text><\/svg>","ctrl":""},{"eyebrow":"第五章 · 边界","title":"收益不是单调的","lede":"组小而多、组中等偏大、组极端巨大，是三段完全不同的账。","caption":"图 17：概念示意，纵轴无刻度、无实测数值。三根柱只表达相对关系与成因。","bridge":"边界清楚了，就该把它放到自己的库里复现一遍。","notes":"原文第五章拆得很细，我们把它压成一条曲线。最明显的是启动成本：cost_incremental_sort() 的 startup cost 只覆盖第一组，普通 Sort 的启动成本接近完整排序，所以 LIMIT、游标分页、窗口函数局部排序特别有价值。其次是单次排序内存：如果全量输入一千万行，按 tenant_id 分组后每组约一千行，增量排序面对的是很多个一千行的排序，只要每组能放进 work_mem，就可能避开外部排序临时文件。\n\n但边界也很硬。某个 tenant 是超级大户、占九成数据时，它仍会形成巨型前缀组，组内排序照样可能落盘——增量排序不能把一个前缀值内部的排序魔法般消除。反过来，前缀列基数极高、每组只有一两行时，分组检测和 tuplesort_reset 会成为主要矛盾，源码里那个 32 行的最小组阈值就是为了压住它。\n\n所以这张图故意不标数字：收益由组大小、组数、LIMIT、work_mem 和统计信息共同决定，不是一条可以外推的性能曲线。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"40.0\" y=\"30.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >纵轴：相对收益（概念示意，无刻度、无实测数值）<\/text><line x1=\"120.0\" y1=\"340.0\" x2=\"1320.0\" y2=\"340.0\" stroke=\"#46585F\" stroke-width=\"1.4\"/><rect x=\"180.0\" y=\"230.0\" width=\"300.0\" height=\"110.0\" rx=\"3\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.2\" /><text x=\"330.0\" y=\"214.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#AE8A3E\" font-weight=\"700\" >组小而多<\/text><text x=\"330.0\" y=\"277.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"500\" >分组检测与 reset<\/text><text x=\"330.0\" y=\"299.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"500\" >占比变重<\/text><line x1=\"330.0\" y1=\"340.0\" x2=\"330.0\" y2=\"348.0\" stroke=\"#46585F\" stroke-width=\"1.2\"/><rect x=\"560.0\" y=\"90.0\" width=\"300.0\" height=\"250.0\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" 据，建 (tenant_id) 单列索引，ANALYZE。第二步 SET enable_incremental_sort = on，带 LIMIT 100 跑 EXPLAIN (ANALYZE, COSTS OFF, SUMMARY OFF)，要观察的不是耗时，而是计划里有没有 Incremental Sort 以及 Presorted Key: tenant_id。\n\n第三步把 GUC 关掉跑同一条 SQL，看计划是否退回普通 Sort 或另一条完全有序路径——这个对照能帮你判断收益到底来自前缀复用，还是来自别的原因。第四步 SET work_mem = '1MB'，去掉 LIMIT 再跑，观察组内后缀排序是否仍然落盘。\n\n两点必须说清楚：这些 SQL 本轮没有执行；如果优化器选了 Seq Scan + Sort，可能是表太小、成本参数、统计信息、索引相关性或 LIMIT 估算所致，可以临时关 enable_seqscan 做机制验证，但绝不能当生产优化方案。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40.0\" y=\"24.0\" width=\"1300.0\" height=\"76.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"40.0\" y=\"24.0\" width=\"56.0\" height=\"76.0\" rx=\"4\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.0\" /><text x=\"68.0\" y=\"70.0\" class=\"sv m\" text-anchor=\"middle\" font-size=\"18.0\" fill=\"#FFFFFF\" font-weight=\"600\" >01<\/text><text x=\"114.0\" y=\"54.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"700\" >建表 + 单列索引 + ANALYZE<\/text><text x=\"114.0\" y=\"82.0\" class=\"sv m\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#245A6B\" font-weight=\"400\" >generate_series(1, 200000) · (tenant_id)<\/text><rect x=\"790.0\" y=\"32.0\" width=\"530.0\" height=\"60.0\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"1055.0\" y=\"66.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >20 万行示意造数；建立单列前缀索引（原文 6.1）<\/text><rect x=\"40.0\" y=\"108.0\" width=\"1300.0\" height=\"76.0\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"40.0\" y=\"108.0\" width=\"56.0\" height=\"76.0\" rx=\"4\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.0\" /><text x=\"68.0\" y=\"154.0\" class=\"sv m\" text-anchor=\"middle\" font-size=\"18.0\" fill=\"#FFFFFF\" font-weight=\"600\" >02<\/text><text x=\"114.0\" y=\"138.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"700\" >打开 GUC，带 LIMIT 看计划<\/text><text x=\"114.0\" y=\"166.0\" class=\"sv m\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#245A6B\" font-weight=\"400\" >enable_incremental_sort = on; EXPLAIN … LIMIT 100;<\/text><rect x=\"790.0\" y=\"116.0\" width=\"530.0\" height=\"60.0\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"1055.0\" y=\"150.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >观察 Presorted Key: tenant_id 是否出现<\/text><rect x=\"40.0\" y=\"192.0\" width=\"1300.0\" height=\"76.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"40.0\" y=\"192.0\" width=\"56.0\" height=\"76.0\" rx=\"4\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1.0\" /><text x=\"68.0\" y=\"238.0\" class=\"sv m\" text-anchor=\"middle\" font-size=\"18.0\" fill=\"#FFFFFF\" font-weight=\"600\" >03<\/text><text x=\"114.0\" y=\"222.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"700\" >关闭 GUC，跑同一条 SQL<\/text><text x=\"114.0\" y=\"250.0\" class=\"sv m\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#245A6B\" font-weight=\"400\" >enable_incremental_sort = off; EXPLAIN …<\/text><rect x=\"790.0\" y=\"200.0\" width=\"530.0\" height=\"60.0\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"1055.0\" y=\"234.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >对照：普通 Sort 或完全有序路径，判断收益来源<\/text><rect x=\"40.0\" y=\"276.0\" width=\"1300.0\" height=\"76.0\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"40.0\" y=\"276.0\" width=\"56.0\" height=\"76.0\" rx=\"4\" fill=\"#74A5AD\" stroke=\"#74A5AD\" stroke-width=\"1.0\" /><text x=\"68.0\" y=\"322.0\" class=\"sv m\" text-anchor=\"middle\" font-size=\"18.0\" fill=\"#1B2B33\" font-weight=\"600\" >04<\/text><text x=\"114.0\" y=\"306.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"700\" >压低 work_mem，去掉 LIMIT<\/text><text x=\"114.0\" y=\"334.0\" class=\"sv m\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#245A6B\" font-weight=\"400\" >work_mem = &#x27;1MB&#x27;; EXPLAIN (ANALYZE) …<\/text><rect x=\"790.0\" y=\"284.0\" width=\"530.0\" height=\"60.0\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"1055.0\" y=\"318.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >观察组内后缀排序是否仍落盘<\/text><rect x=\"40.0\" y=\"364.0\" width=\"1300.0\" height=\"52.0\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1.0\" /><text x=\"690.0\" y=\"394.6\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#AE8A3E\" font-weight=\"400\" >SQL 未在本轮环境执行，按 PostgreSQL 语法编写并参考 incremental_sort.sql 的可验证模式；可临时关 enable_seqscan 做机制验证，勿当生产优化方案。<\/text><\/svg>","ctrl":""},{"eyebrow":"第六章 · 实操","title":"复合索引不是被替代，而是另一条路","lede":"固定完整顺序且成本可接受时，索引直出；否则短前缀索引 + 增量排序更均衡。","caption":"图 19：一个二选一的工程决策。底部橙色框是原文 6.4 与坑 1 的共同结论。","bridge":"把这个判断落到日常，就是三个角色各自的最佳实践。","notes":"如果查询长期固定为 ORDER BY tenant_id, created_at DESC, order_id DESC，并且过滤条件、写入成本、索引大小都能接受，复合索引 (tenant_id, created_at DESC, order_id DESC) 会更直接：优化器可能通过 Index Scan 直接输出完整顺序，连增量排序节点都不需要。\n\n反过来，对写入密集的表，为一个低频报表背一个很宽的复合索引未必划算。原文给架构师的建议是：单列或短前缀索引加 Incremental Sort，可能是更均衡的方案；强 SLA 的 Top-N 查询，优先验证复合索引能否完全满足顺序，增量排序是候选而不是唯一答案。\n\n所以请把这一页记成一句定位：Incremental Sort 是「已有路径只能提供部分顺序时的补齐器」，不是复合索引的替代品。看到计划里有它，先问一句：这个完整顺序，能不能直接由索引给？能给，就少一个执行节点；不能给，再看补齐是否划算。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"320.0\" y=\"20.0\" width=\"760.0\" height=\"76.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#245A6B\" stroke-width=\"1.4\" /><text x=\"700.0\" y=\"63.8\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"600\" >查询是否长期固定为 ORDER BY tenant_id, created_at DESC, order_id DESC？<\/text><line x1=\"700.0\" y1=\"96.0\" x2=\"700.0\" y2=\"126.0\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><line x1=\"350.0\" y1=\"126.0\" x2=\"1050.0\" y2=\"126.0\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><line x1=\"350.0\" y1=\"126.0\" x2=\"350.0\" y2=\"160.0\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><line x1=\"1050.0\" y1=\"126.0\" x2=\"1050.0\" y2=\"160.0\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><rect x=\"60.0\" y=\"160.0\" width=\"580.0\" height=\"150.0\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.4\" /><text x=\"82.0\" y=\"190.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#2F7A66\" font-weight=\"600\" >是 · 且写入成本 / 索引大小可接受<\/text><text x=\"82.0\" y=\"216.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#1B2B33\" font-weight=\"600\" >建复合索引 (tenant_id, created_at DESC, order_id DESC)<\/text><text x=\"82.0\" y=\"260.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >Index Scan 直接输出完整顺序，执行节点更少；强分页与强延迟场景优先验证。<\/text><rect x=\"760.0\" y=\"160.0\" width=\"580.0\" height=\"150.0\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.4\" /><text x=\"782.0\" y=\"190.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"600\" >否 · 低频报表 / 写入密集 / 只有前缀索引<\/text><text x=\"782.0\" y=\"216.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#1B2B33\" font-weight=\"600\" >保留短前缀索引，由 Incremental Sort 补齐后缀<\/text><text x=\"782.0\" y=\"260.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >不为低频查询背很宽索引的写入与存储成本，整体更均衡。<\/text><rect x=\"40.0\" y=\"330.0\" width=\"1300.0\" height=\"80.0\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"690.0\" y=\"375.1\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"600\" >定位：Incremental Sort 是「已有路径只能提供部分顺序时的补齐器」，不是复合索引的替代品。看到节点先问一句：完整顺序能不能直接由索引给？<\/text><\/svg>","ctrl":""},{"eyebrow":"第七章 · 实践","title":"三个角色，三套动作","lede":"架构师决定索引形态，DBA 决定可观测与调优，开发者决定 SQL 能不能复用顺序。","caption":"图 20：原文第七章按角色整理。条目均为机制性建议，未附加原文之外的实验结论。","bridge":"动作清单反过来读，就是哪些场景别用、哪些坑别踩。","notes":"把机制落到人身上，三类角色的动作完全不同。\n\n架构师要区分「完全服务排序」和「只服务前缀排序」：前者减少执行节点，后者为增量排序留出空间。多租户、分区、时间线场景里，常见形态就是 (tenant_id, time desc, id desc)；如果只能维护 (tenant_id) 或 (tenant_id, time)，增量排序就是补齐机制。别为低频报表盲目建很宽的复合索引。\n\nDBA 看到节点先读 Sort Key 和 Presorted Key，再用 EXPLAIN (ANALYZE, BUFFERS) 看真实行数、是否落盘、两类 Groups；计划明显误判时先 ANALYZE、再考虑扩展统计信息，而不是立刻关 GUC；work_mem 要按并发和活跃排序节点数估算；版本升级要复测关键 SQL。\n\n开发者这边更朴素：ORDER BY 写完整稳定顺序，分页追加唯一列；别在排序列上包不可索引表达式；排序键顺序必须和索引或上游路径的前缀一致；LIMIT 越小越可能体现启动延迟优势，全量导出则更看组内大小和 work_mem。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"20.0\" y=\"20.0\" width=\"440.0\" height=\"46.0\" rx=\"3\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.0\" /><text x=\"240.0\" y=\"50.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#FFFFFF\" font-weight=\"700\" >数据库架构师<\/text><rect x=\"20.0\" y=\"74.0\" width=\"440.0\" height=\"64.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"34.0\" y=\"98.0\" width=\"7.0\" height=\"7.0\" rx=\"1\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1.0\" /><text x=\"60.0\" y=\"110.4\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >区分「完全服务排序」与「只服务前缀」，后者留出补齐空间<\/text><rect x=\"20.0\" y=\"146.0\" width=\"440.0\" height=\"64.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"34.0\" y=\"170.0\" width=\"7.0\" height=\"7.0\" rx=\"1\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1.0\" /><text x=\"60.0\" y=\"174.4\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >多租户常见 (tenant_id, time desc, id desc)；只维护短前<\/text><text x=\"60.0\" y=\"190.3\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >缀时可补齐<\/text><rect x=\"20.0\" y=\"218.0\" width=\"440.0\" height=\"64.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"34.0\" y=\"242.0\" width=\"7.0\" height=\"7.0\" rx=\"1\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1.0\" /><text x=\"60.0\" y=\"254.4\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >别为低频报表盲目建很宽的复合索引，写入密集表尤其如此<\/text><rect x=\"20.0\" y=\"290.0\" width=\"440.0\" height=\"64.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"34.0\" y=\"314.0\" width=\"7.0\" height=\"7.0\" rx=\"1\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1.0\" /><text x=\"60.0\" y=\"326.4\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >强 SLA 的 Top-N 先验证复合索引；增量排序只是候选<\/text><rect x=\"480.0\" y=\"20.0\" width=\"440.0\" height=\"46.0\" rx=\"3\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1.0\" /><text x=\"700.0\" y=\"50.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#FFFFFF\" font-weight=\"700\" >DBA<\/text><rect x=\"480.0\" y=\"74.0\" width=\"440.0\" height=\"64.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"494.0\" y=\"98.0\" width=\"7.0\" height=\"7.0\" rx=\"1\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1.0\" /><text x=\"520.0\" y=\"102.4\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >先读 Sort Key 与 Presorted Key，确认到底复用了哪一段顺<\/text><text x=\"520.0\" y=\"118.3\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >序<\/text><rect x=\"480.0\" y=\"146.0\" width=\"440.0\" height=\"64.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"494.0\" y=\"170.0\" width=\"7.0\" height=\"7.0\" rx=\"1\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1.0\" /><text x=\"520.0\" y=\"174.4\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >EXPLAIN (ANALYZE, BUFFERS) 看真实行数、落盘与两类<\/text><text x=\"520.0\" y=\"190.3\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >Groups<\/text><rect x=\"480.0\" y=\"218.0\" width=\"440.0\" height=\"64.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"494.0\" y=\"242.0\" width=\"7.0\" height=\"7.0\" rx=\"1\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1.0\" /><text x=\"520.0\" y=\"246.4\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >计划误判先 ANALYZE / 扩展统计，别立刻关<\/text><text x=\"520.0\" y=\"262.3\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >enable_incremental_sort<\/text><rect x=\"480.0\" y=\"290.0\" width=\"440.0\" height=\"64.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"494.0\" y=\"314.0\" width=\"7.0\" height=\"7.0\" rx=\"1\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1.0\" /><text x=\"520.0\" y=\"326.4\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >work_mem 按并发与排序节点数估算；升级后复测关键 SQL<\/text><rect x=\"940.0\" y=\"20.0\" width=\"440.0\" height=\"46.0\" rx=\"3\" fill=\"#74A5AD\" stroke=\"#74A5AD\" stroke-width=\"1.0\" /><text x=\"1160.0\" y=\"50.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"700\" >业务开发者<\/text><rect x=\"940.0\" y=\"74.0\" width=\"440.0\" height=\"64.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"954.0\" y=\"98.0\" width=\"7.0\" height=\"7.0\" rx=\"1\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1.0\" /><text x=\"980.0\" y=\"110.4\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >ORDER BY 写完整稳定顺序，分页追加唯一列（如 order_id）<\/text><rect x=\"940.0\" y=\"146.0\" width=\"440.0\" height=\"64.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"954.0\" y=\"170.0\" width=\"7.0\" height=\"7.0\" rx=\"1\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1.0\" /><text x=\"980.0\" y=\"182.4\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >不在排序列上包不可索引表达式，除非有匹配的表达式索引<\/text><rect x=\"940.0\" y=\"218.0\" width=\"440.0\" height=\"64.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"954.0\" y=\"242.0\" width=\"7.0\" height=\"7.0\" rx=\"1\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1.0\" /><text x=\"980.0\" y=\"254.4\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >排序键顺序必须与索引或上游路径的前缀一致<\/text><rect x=\"940.0\" y=\"290.0\" width=\"440.0\" height=\"64.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"954.0\" y=\"314.0\" width=\"7.0\" height=\"7.0\" rx=\"1\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1.0\" /><text x=\"980.0\" y=\"318.4\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >LIMIT 越小越可能体现启动延迟优势；全量导出看组内大小与<\/text><text x=\"980.0\" y=\"334.3\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >work_mem<\/text><text x=\"20.0\" y=\"374.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >同一个机制，三个角色的动作不同：一个决定索引形态，一个决定可观测与调优，一个决定 SQL 能否复用顺序。<\/text><text x=\"20.0\" y=\"400.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >条目据原文第七章整理，未添加原文之外的实验结论。<\/text><\/svg>","ctrl":""},{"eyebrow":"第七章 · 实践","title":"什么时候让它上场，什么时候换路","lede":"判断依据始终是同一组变量：可复用前缀、组规模分布、LIMIT、work_mem 与统计信息质量。","caption":"图 21：原文第八章的适合 / 不适合清单，按变量归拢成两列。","bridge":"清单之外，还有六个特别容易踩的坑，值得单独一页。","notes":"适合的一侧，其实都是同一个条件的不同说法：有可复用前缀，而且组内排序值得做。已有索引 (a) 而查询要 ORDER BY a, b 或 a, b, c；分区表里部分分区只有前缀索引，Append / MergeAppend 可以部分补齐；窗口函数或聚合路径已经产生部分排序，上层需要更长排序键；ORDER BY … LIMIT 且前缀组能较快产出足够结果；全量排序会落盘，但组内排序大多能放进 work_mem。\n\n不适合的一侧，也都指向同一件事：这个前提不成立，或者代价盖过收益。输入完全无序；查询经常要完整固定顺序且复合索引成本可接受；前缀列基数极高、每组只有一两行；前缀列极端倾斜，少数大组仍会导致大排序和落盘；统计信息严重失真、优化器长期误判前缀组数。\n\n把两列对照着看，你会发现根本不需要背清单，只要问：前缀有没有、组有多大、LIMIT 在哪、work_mem 够不够、统计准不准。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40.0\" y=\"20.0\" width=\"640.0\" height=\"46.0\" rx=\"3\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1.0\" /><text x=\"360.0\" y=\"50.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#FFFFFF\" font-weight=\"700\" >适合 · 让它上场<\/text><rect x=\"40.0\" y=\"74.0\" width=\"640.0\" height=\"56.0\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"40.0\" y=\"74.0\" width=\"40.0\" height=\"56.0\" rx=\"3\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1.0\" /><text x=\"60.0\" y=\"109.0\" class=\"sv m\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"600\" >1<\/text><text x=\"100.0\" y=\"106.4\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >已有索引 (a)，查询要 ORDER BY a, b 或 a, b, c<\/text><rect x=\"40.0\" y=\"138.0\" width=\"640.0\" height=\"56.0\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"40.0\" y=\"138.0\" width=\"40.0\" height=\"56.0\" rx=\"3\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1.0\" /><text x=\"60.0\" y=\"173.0\" class=\"sv m\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"600\" >2<\/text><text x=\"100.0\" y=\"170.4\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >分区表部分分区只有前缀索引，Append / MergeAppend 可部分补齐<\/text><rect x=\"40.0\" y=\"202.0\" width=\"640.0\" height=\"56.0\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"40.0\" y=\"202.0\" width=\"40.0\" height=\"56.0\" rx=\"3\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1.0\" /><text x=\"60.0\" y=\"237.0\" class=\"sv m\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"600\" >3<\/text><text x=\"100.0\" y=\"234.4\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >窗口函数或聚合路径已产生部分排序，上层需要更长排序键<\/text><rect x=\"40.0\" y=\"266.0\" width=\"640.0\" height=\"56.0\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"40.0\" y=\"266.0\" width=\"40.0\" height=\"56.0\" rx=\"3\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1.0\" /><text x=\"60.0\" y=\"301.0\" class=\"sv m\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"600\" >4<\/text><text x=\"100.0\" y=\"298.4\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >ORDER BY … LIMIT，且前缀组能较快产出足够结果<\/text><rect x=\"40.0\" y=\"330.0\" width=\"640.0\" height=\"56.0\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"40.0\" y=\"330.0\" width=\"40.0\" height=\"56.0\" rx=\"3\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1.0\" /><text x=\"60.0\" y=\"365.0\" class=\"sv m\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"600\" >5<\/text><text x=\"100.0\" y=\"362.4\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >全量排序会落盘，但组内排序大多能放进 work_mem<\/text><rect x=\"720.0\" y=\"20.0\" width=\"640.0\" height=\"46.0\" rx=\"3\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1.0\" /><text x=\"1040.0\" y=\"50.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#FFFFFF\" font-weight=\"700\" >不适合 · 换条路<\/text><rect x=\"720.0\" y=\"74.0\" width=\"640.0\" height=\"56.0\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"720.0\" y=\"74.0\" width=\"40.0\" height=\"56.0\" rx=\"3\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1.0\" /><text x=\"740.0\" y=\"109.0\" class=\"sv m\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"600\" >1<\/text><text x=\"780.0\" y=\"106.4\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >输入完全无序，没有任何目标排序前缀可复用<\/text><rect x=\"720.0\" y=\"138.0\" width=\"640.0\" height=\"56.0\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"720.0\" y=\"138.0\" width=\"40.0\" height=\"56.0\" rx=\"3\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1.0\" /><text x=\"740.0\" y=\"173.0\" class=\"sv m\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"600\" >2<\/text><text x=\"780.0\" y=\"170.4\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >经常需要完整固定顺序，且复合索引成本可以接受<\/text><rect x=\"720.0\" y=\"202.0\" width=\"640.0\" height=\"56.0\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"720.0\" y=\"202.0\" width=\"40.0\" height=\"56.0\" rx=\"3\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1.0\" /><text x=\"740.0\" y=\"237.0\" class=\"sv m\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"600\" >3<\/text><text x=\"780.0\" y=\"234.4\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >前缀列基数极高，每组只有一两行，分组管理成本占比高<\/text><rect x=\"720.0\" y=\"266.0\" width=\"640.0\" height=\"56.0\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"720.0\" y=\"266.0\" width=\"40.0\" height=\"56.0\" rx=\"3\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1.0\" /><text x=\"740.0\" y=\"301.0\" class=\"sv m\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"600\" >4<\/text><text x=\"780.0\" y=\"298.4\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >前缀列极端倾斜，少数大组仍导致大排序和落盘<\/text><rect x=\"720.0\" y=\"330.0\" width=\"640.0\" height=\"56.0\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"720.0\" y=\"330.0\" width=\"40.0\" height=\"56.0\" rx=\"3\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1.0\" /><text x=\"740.0\" y=\"365.0\" class=\"sv m\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"600\" >5<\/text><text x=\"780.0\" y=\"362.4\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >统计信息严重失真，优化器长期误判前缀组数<\/text><text x=\"40.0\" y=\"412.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >判断依据始终是同一组变量：可复用前缀、组规模分布、LIMIT、work_mem 与统计信息质量。<\/text><\/svg>","ctrl":""},{"eyebrow":"第七章 · 实践","title":"六个常见坑，一次说清","lede":"从「以为不用建索引」到「Merge Join 内侧不能用」，多数坑都源于把机制记成了开关。","caption":"图 22：原文第九章六个坑及对应修正动作。第六条是 createplan.c 的明确注释。","bridge":"坑讲完，把整条因果链收起来，留几个值得继续验证的问题。","notes":"坑一，以为有增量排序就不用建复合索引——写少读多、强分页、强延迟场景，复合索引仍可能更优。坑二，只看节点名不看 Presorted Key——Presorted Key: a 补 b,c，和 a,b 只补 c，代价完全不同。坑三，统计信息过期导致错误计划，数据倾斜时普通 ANALYZE 可能不够，要考虑提高统计目标或扩展统计。\n\n坑四，忽视 LIMIT 的语义，深分页 OFFSET 1000000 仍要处理前面大量组，改用 keyset pagination。坑五，认为它总能避免磁盘临时文件——单个前缀组很大时，组内后缀排序仍可能超过 work_mem；它降低的是单次排序输入规模，不是消灭排序。\n\n坑六最容易被忽略，也最有源码味：createplan.c 对 Merge Join 有明确注释，内侧路径不考虑 incremental sort，因为它不支持 mark/restore；外侧在有 presorted keys 时可以使用。这不是经验推测，是实现约束。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"20.0\" y=\"24.0\" width=\"440.0\" height=\"186.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"20.0\" y=\"24.0\" width=\"440.0\" height=\"40.0\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"36.0\" y=\"50.0\" class=\"sv m\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#BE653B\" font-weight=\"600\" >坑 1<\/text><text x=\"92.0\" y=\"50.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"700\" >以为有它就不用建复合索引<\/text><line x1=\"36.0\" y1=\"80.0\" x2=\"444.0\" y2=\"80.0\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"36.0\" y=\"108.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#46585F\" font-weight=\"400\" >写少读多、强分页、强延迟场景，复合索引仍可能更优；增量排序只<\/text><text x=\"36.0\" y=\"127.8\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#46585F\" font-weight=\"400\" >补后缀。<\/text><rect x=\"480.0\" y=\"24.0\" width=\"440.0\" height=\"186.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"480.0\" y=\"24.0\" width=\"440.0\" height=\"40.0\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"496.0\" y=\"50.0\" class=\"sv m\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#BE653B\" font-weight=\"600\" >坑 2<\/text><text x=\"552.0\" y=\"50.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"700\" >只看节点名，不看 Presorted Key<\/text><line x1=\"496.0\" y1=\"80.0\" x2=\"904.0\" y2=\"80.0\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"496.0\" y=\"108.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#46585F\" font-weight=\"400\" >覆盖多少前缀决定代价：a 补 b,c 与 a,b 只补 c，完全不同。<\/text><rect x=\"940.0\" y=\"24.0\" width=\"440.0\" height=\"186.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"940.0\" y=\"24.0\" width=\"440.0\" height=\"40.0\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"956.0\" y=\"50.0\" class=\"sv m\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#BE653B\" font-weight=\"600\" >坑 3<\/text><text x=\"1012.0\" y=\"50.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"700\" >统计信息过期导致错误计划<\/text><line x1=\"956.0\" y1=\"80.0\" x2=\"1364.0\" y2=\"80.0\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"956.0\" y=\"108.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#46585F\" font-weight=\"400\" >前缀组数估错直接影响成本模型；数据倾斜时先 ANALYZE、提高统计<\/text><text x=\"956.0\" y=\"127.8\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#46585F\" font-weight=\"400\" >目标或建扩展统计。<\/text><rect x=\"20.0\" y=\"224.0\" width=\"440.0\" height=\"186.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"20.0\" y=\"224.0\" width=\"440.0\" height=\"40.0\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"36.0\" y=\"250.0\" class=\"sv m\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#BE653B\" font-weight=\"600\" >坑 4<\/text><text x=\"92.0\" y=\"250.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"700\" >忽视 LIMIT 的语义<\/text><line x1=\"36.0\" y1=\"280.0\" x2=\"444.0\" y2=\"280.0\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"36.0\" y=\"308.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#46585F\" font-weight=\"400\" >收益来自少处理后续组；深分页 OFFSET 1000000 仍要处理前面大<\/text><text x=\"36.0\" y=\"327.8\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#46585F\" font-weight=\"400\" >量组，改用 keyset pagination。<\/text><rect x=\"480.0\" y=\"224.0\" width=\"440.0\" height=\"186.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"480.0\" y=\"224.0\" width=\"440.0\" height=\"40.0\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"496.0\" y=\"250.0\" class=\"sv m\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#BE653B\" font-weight=\"600\" >坑 5<\/text><text x=\"552.0\" y=\"250.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"700\" >认为总能避免磁盘临时文件<\/text><line x1=\"496.0\" y1=\"280.0\" x2=\"904.0\" y2=\"280.0\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"496.0\" y=\"308.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#46585F\" font-weight=\"400\" >单个前缀组很大时，组内后缀排序仍可能超过 work_mem；它降低输<\/text><text x=\"496.0\" y=\"327.8\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#46585F\" font-weight=\"400\" >入规模，不消灭排序。<\/text><rect x=\"940.0\" y=\"224.0\" width=\"440.0\" height=\"186.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"940.0\" y=\"224.0\" width=\"440.0\" height=\"40.0\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"956.0\" y=\"250.0\" class=\"sv m\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#BE653B\" font-weight=\"600\" >坑 6<\/text><text x=\"1012.0\" y=\"250.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"700\" >Merge Join 内侧不能随便用<\/text><line x1=\"956.0\" y1=\"280.0\" x2=\"1364.0\" y2=\"280.0\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"956.0\" y=\"308.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#46585F\" font-weight=\"400\" >createplan.c 注明：incremental sort 不支持 mark/restore<\/text><text x=\"956.0\" y=\"327.8\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#46585F\" font-weight=\"400\" >，内侧不考虑，外侧有 presorted keys 时可用。<\/text><text x=\"20.0\" y=\"424.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >六个坑来自原文第九章；其中 Merge Join 限制是明确的源码注释，不是经验推测。<\/text><\/svg>","ctrl":""},{"eyebrow":"收束 · 一条因果链","title":"它改变的是资源曲线，不是消灭排序","lede":"问题 → 节点 → 优化器 → 执行器 → 边界 → 实践；每一环都能回到源码或官方文档核验。","caption":"图 23：六步因果链、依据清单与三个扩展问题。本演说未引用无法核验的论文实验数字。","bridge":"讲完了。带走的应该是那句判断，而不是节点名。","notes":"我们把整条链收一下。问题是多列排序键遇上已有序的输入前缀；PostgreSQL 的答案是四层齐备的显式节点；优化器用 pathkeys 包含关系和组数成本决定要不要用它；执行器用 fullsort / prefixsort 双模式和四状态状态机，在小组与大组之间取平衡；边界由组大小、组数、LIMIT、work_mem 和统计信息划定；实践落回索引选型、EXPLAIN 验证和避坑。\n\n这一路的依据都能回到本地源码和官方文档：nodeIncrementalSort.c、costsize.c、pathnode.c、createplan.c、三个 nodes 头文件、explain.c、perform.sgml、config.sgml，以及 incremental_sort.sql 和它的期望输出。原文提到的两篇论文与分享，因为项目里没有原文、实验数字无法核验，我们只借了「复用已有顺序或排序状态」这个思想背景，没有引用任何数字。\n\n最后留三个值得自己压一压的问题：三种索引在不同 LIMIT 下优化器怎么选；高度倾斜的前缀列下扩展统计能否改善 estimate_num_groups()；以及压测到底该看平均查询，还是该看最大租户、最大分区、最大 group。","svg":"<svg class=\"fi
