<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数据库筑基课 · 增量排序 Incremental Sort｜复用已有顺序，只补齐后缀</title>
<!-- 单文件交付：所有原理图均为现场绘制的内联 SVG；零外部图片、字体、脚本依赖。 -->
<!-- 视觉母题：地层剖面 / 工程蓝图。内容按「问题→节点→优化器→执行器→边界→实践」的因果推演组织。 -->
<style>
:root{
  --bg:#F7F6F2; --paper2:#F1EFE9; --ink:#1B2B33; --ink2:#46585F; --muted:#89938F;
  --line:#D9D5CB; --white:#FFFFFF; --primary:#245A6B; --prim-l:#E5EFF0; --prim-m:#7BA6AF;
  --accent:#BE653B; --acc-l:#F7E9DE; --green:#2F7A66; --green-l:#E4F0EA;
  --gold:#AE8A3E; --gold-l:#F5EDDC;
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --dockw:clamp(340px,30vw,460px);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#E9E7E1}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
#viewport{position:fixed;inset:0 0 70px 0;display:flex;background:#E9E7E1}
#left{position:relative;flex:1 1 auto;min-width:0;overflow:hidden}
#stage{position:absolute;width:1600px;height:900px;background:var(--bg);
  transform-origin:top left;box-shadow:0 18px 60px rgba(27,43,51,.13)}
.slide{position:absolute;inset:0;display:none}
.slide.on{display:block;animation:fadein .42s cubic-bezier(.2,.7,.2,1)}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{position:absolute;left:64px;top:44px;font-size:13px;letter-spacing:3.4px;
  color:var(--primary);font-weight:600}
.eyebrow .num{font-family:var(--mono);letter-spacing:1px;color:var(--accent);margin-right:14px}
h1.title{position:absolute;left:64px;top:70px;margin:0;font-family:var(--serif);
  font-size:44px;line-height:1.25;font-weight:700;letter-spacing:1.2px;color:var(--ink)}
.lede{position:absolute;left:64px;top:139px;width:1440px;font-size:19px;color:var(--ink2);
  line-height:1.5;letter-spacing:.3px}
.rule{position:absolute;left:64px;top:181px;width:1472px;height:1px;background:var(--line)}
.figwrap{position:absolute;left:100px;top:198px;width:1400px;height:430px}
svg.figure{display:block;overflow:visible}
svg.figure text{font-family:var(--sans)}
svg.figure text.m{font-family:var(--mono)}
.caption{position:absolute;left:100px;top:636px;width:1400px;font-size:13px;
  color:var(--muted);letter-spacing:.4px;line-height:1.4}
.bridge{position:absolute;left:64px;top:716px;width:1472px;font-size:20px;
  color:var(--accent);line-height:1.55;letter-spacing:.4px;padding-left:18px;
  border-left:3px solid var(--accent);font-family:var(--serif)}
.bridge .bk{font-family:var(--sans);font-size:13px;color:var(--muted);
  letter-spacing:2px;display:block;margin-bottom:2px}
.footer{position:absolute;left:64px;top:846px;width:1472px;height:1px;background:var(--line)}
.footer .fl{position:absolute;left:0;top:14px;font-size:12.5px;color:var(--muted);letter-spacing:2px}
.footer .fr{position:absolute;right:0;top:12px;font-family:var(--mono);font-size:14px;color:var(--ink2)}
.footer .fbar{position:absolute;left:0;right:0;top:-1px;height:2px;background:transparent}
.footer .fbar i{display:block;height:2px;background:var(--primary);width:0;transition:width .4s ease}

/* 动画控件：独立条带，绝不覆盖图区与承接句 */
.ctrls{position:absolute;left:100px;top:658px;width:1400px;height:48px;display:flex;
  align-items:center;gap:10px}
.ctrls label{font-size:13px;color:var(--ink2);white-space:nowrap}
.ctrls select{font-family:var(--sans);font-size:13px;color:var(--ink);background:#fff;
  border:1px solid var(--line);border-radius:4px;padding:5px 8px;outline:none}
.ctrls input[type=range]{width:170px;padding:0;accent-color:var(--accent);border:none;background:transparent}
.ctrls .mono{font-family:var(--mono);font-size:13px;color:var(--accent);min-width:26px}
.ctrls .btn{min-height:30px;padding:5px 13px;border:1px solid var(--primary);border-radius:4px;
  background:#fff;color:var(--primary);font-size:13px;cursor:pointer;font-family:var(--sans);white-space:nowrap}
.ctrls .btn.play{background:var(--primary);color:#fff}
.ctrls .btn:hover{filter:brightness(.94)}
.ctrls .out{flex:1;min-width:0;text-align:right;font-size:12.5px;line-height:1.35;
  color:var(--ink2);max-height:36px;overflow:hidden}
.ctrls .out b{color:var(--accent);font-weight:600}

/* 右侧页内讲稿窗（不是弹窗） */
#dock{flex:0 0 0;width:0;overflow:hidden;background:#FCFBF8;border-left:0 solid var(--line);
  display:flex;flex-direction:column;
  transition:flex-basis .34s ease,width .34s ease,border-left-width .34s ease}
#viewport.dock-on #dock{flex:0 0 var(--dockw);width:var(--dockw);border-left-width:1px}
#dockHead{flex:0 0 60px;height:60px;display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;border-bottom:1px solid var(--line)}
#dockHead h2{margin:0;font-family:var(--serif);font-size:20px;color:var(--ink);line-height:1.2}
#dockHead .sub{font-size:11.5px;color:var(--muted);letter-spacing:1px;margin-top:3px}
#dockHead button{font-family:var(--sans);font-size:12.5px;color:var(--ink2);background:#fff;
  border:1px solid var(--line);border-radius:4px;padding:6px 10px;cursor:pointer;white-space:nowrap}
#dockHead button:hover{border-color:var(--primary);color:var(--primary)}
#dockBody{position:relative;flex:1;overflow-y:auto;padding:4px 18px 32px;scroll-behavior:smooth}
#dockBody::-webkit-scrollbar{width:8px}
#dockBody::-webkit-scrollbar-thumb{background:#C9CFC9;border-radius:4px}
.dsec{border-bottom:1px solid var(--line);padding:16px 2px 20px}
.dsec .sn{font-family:var(--mono);font-size:11.5px;color:var(--accent);letter-spacing:1px}
.dsec .eb{font-size:11.5px;color:var(--muted);letter-spacing:1.5px;margin-left:8px}
.dsec h3{margin:7px 0 12px;font-family:var(--serif);font-size:21px;color:var(--primary);line-height:1.35}
.dsec p{margin:0 0 10px;font-size:15px;line-height:1.95;color:var(--ink2);letter-spacing:.3px}
.dsec .br{margin-top:12px;padding-left:12px;border-left:3px solid var(--accent);
  font-family:var(--serif);font-size:14.5px;color:var(--accent);line-height:1.7}
.dsec.on{background:var(--prim-l);margin:0 -18px;padding:16px 18px 20px;
  border-left:3px solid var(--accent)}
.dgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding-top:6px}
.dgrid a{display:block;padding:11px 12px;border:1px solid var(--line);border-radius:5px;
  background:#fff;text-decoration:none;color:var(--ink);cursor:pointer;transition:.18s}
.dgrid a:hover{border-color:var(--primary);background:var(--prim-l)}
.dgrid a.cur{border-color:var(--accent);background:var(--acc-l)}
.dgrid a .gn{font-family:var(--mono);font-size:11.5px;color:var(--accent)}
.dgrid a .gt{font-family:var(--serif);font-size:14.5px;line-height:1.4;display:block;margin-top:4px}
.keys{font-size:14px;line-height:2.1;color:var(--ink2);padding-top:6px}
.keys kbd{font-family:var(--mono);background:#fff;border:1px solid var(--line);
  border-bottom-width:2px;border-radius:4px;padding:2px 7px;color:var(--primary);margin-right:8px}

/* 底部控制条：全屏时同样常驻，按键始终可见 */
.chrome{position:fixed;left:0;right:0;bottom:0;height:70px;z-index:40;background:#FCFBF8;
  border-top:1px solid var(--line);display:flex;flex-direction:column;padding:0 16px}
.chrome .r1{height:41px;display:flex;align-items:center;gap:7px;min-width:0}
.chrome .r2{height:28px;display:flex;align-items:center;gap:13px;white-space:nowrap;
  overflow:hidden;border-top:1px solid #EFEDE7;font-size:11px;color:var(--muted);font-family:var(--mono)}
.chrome kbd{font-family:var(--mono);background:#fff;border:1px solid var(--line);
  border-bottom-width:2px;border-radius:3px;padding:1px 5px;color:var(--primary);
  margin-right:4px;font-size:11px}
.chrome button{font-family:var(--sans);font-size:12.8px;color:var(--ink2);background:transparent;
  border:1px solid transparent;border-radius:5px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.chrome button:hover{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome button.act{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.chrome .pg{font-family:var(--mono);font-size:13.5px;color:var(--ink);min-width:72px;text-align:center}
.chrome .track{flex:1;min-width:40px;height:3px;background:var(--line);border-radius:3px;
  margin:0 10px;position:relative}
.chrome .track i{position:absolute;left:0;top:0;height:3px;background:var(--primary);
  border-radius:3px;transition:width .35s}
.chrome .flag{color:var(--accent);font-family:var(--mono);font-size:11px}
body.fs .chrome{box-shadow:0 -3px 18px rgba(27,43,51,.08)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);
  color:#fff;font-size:13px;padding:9px 16px;border-radius:5px;opacity:0;transition:.3s;
  z-index:80;pointer-events:none}
.toast.on{opacity:1}
@media print{
  html,body{overflow:visible;height:auto;background:#fff}
  #viewport{position:static;display:block} #left{overflow:visible}
  #stage{position:static;transform:none!important;box-shadow:none;width:1600px}
  .slide{display:block!important;position:relative;height:900px;page-break-after:always}
  #dock,.chrome,.toast{display:none!important}
}
</style>
</head>
<body>
<div id="viewport">
  <div id="left"><div id="stage"><div id="slides"></div></div></div>
  <aside id="dock" aria-hidden="true">
    <div id="dockHead">
      <div><h2 id="dockTitle">讲稿</h2><div class="sub" id="dockSub"></div></div>
      <button id="dockClose">关闭 ✕</button>
    </div>
    <div id="dockBody"></div>
  </aside>
</div>
<div class="chrome">
  <div class="r1">
    <button id="btnPrev">← 上一页</button>
    <button id="btnNext">下一页 →</button>
    <span class="pg">01 / 23</span>
    <div class="track" id="track"><i></i></div>
    <div class="sep"></div>
    <button id="btnToc">目录 G</button>
    <button id="btnNotes">本页讲稿 N</button>
    <button id="btnAll">全文讲稿 T</button>
    <button id="btnAuto">▶ 自动播放 P</button>
    <button id="btnFs">全屏 F</button>
    <button id="btnHelp">? 快捷键</button>
  </div>
  <div class="r2">
    <span><kbd>←</kbd><kbd>→</kbd>翻页</span>
    <span><kbd>空格</kbd>下一页</span>
    <span><kbd>G</kbd>目录</span>
    <span><kbd>N</kbd>本页讲稿</span>
    <span><kbd>T</kbd>全文讲稿</span>
    <span><kbd>P</kbd>自动播放</span>
    <span><kbd>F</kbd>全屏</span>
    <span><kbd>1–9</kbd>跳页</span>
    <span><kbd>Home/End</kbd>首末页</span>
    <span><kbd>Esc</kbd>关闭</span>
    <span><kbd>?</kbd>帮助</span>
    <span class="flag" id="fsFlag"></span>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const D = [{"eyebrow":"开篇 · 一个被浪费的资源","title":"排序，不必从零开始","lede":"目标排序键有三列，输入已经按第一列有序 —— 数据库真的要把全部结果重排一遍吗？","caption":"图 1：三列目标排序键的地层剖面。最深的靛青是已经保证有序的前缀，浅层是待补齐的后缀。","bridge":"先看一条真实的业务查询，问题是怎么长出来的。","notes":"我们先把问题摆到桌面上。一条很普通的订单查询，ORDER BY 里写了三列：tenant_id、created_at DESC、order_id DESC，最后还加了 LIMIT 100。如果表上有一个 (tenant_id) 的索引，或者上游节点本来就是按 tenant_id 吐数据的，那么输入流其实已经带着一段顺序了。\n\n这段顺序是资源，不是噪声。可传统排序的做法是：把所有候选行都收进来，按三列完整排好，然后才敢输出第一行。这就等于把已经排好的那一段扔掉，重新付一次代价。\n\n今天要讲的 Incremental Sort，就是 PostgreSQL 对这件事的回答：它不否认全量排序的正确性，只是问了一句——既然前缀已经有序，能不能只补齐后面那几列？这一问，把「工作单位」从整个输入换成了前缀组，后面所有收益和代价，都从这一句里长出来。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"60.0\" y=\"46.0\" width=\"1000.0\" height=\"84.0\" rx=\"3\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.0\" /><text x=\"86.0\" y=\"97.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"23.0\" fill=\"#FFFFFF\" font-weight=\"600\" >①  tenant_id<\/text><text x=\"530.0\" y=\"94.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#FFFFFF\" font-weight=\"400\" >下层路径已保证有序 · Presorted Key<\/text><rect x=\"60.0\" y=\"142.0\" width=\"1000.0\" height=\"84.0\" rx=\"3\" fill=\"#74A5AD\" stroke=\"#74A5AD\" stroke-width=\"1.0\" /><text x=\"86.0\" y=\"193.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"23.0\" fill=\"#1B2B33\" font-weight=\"600\" >②  created_at DESC<\/text><text x=\"530.0\" y=\"190.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#1B2B33\" font-weight=\"400\" >目标排序键的后缀 · 需要补齐<\/text><rect x=\"60.0\" y=\"238.0\" width=\"1000.0\" height=\"84.0\" rx=\"3\" fill=\"#CFE0DC\" stroke=\"#CFE0DC\" stroke-width=\"1.0\" /><text x=\"86.0\" y=\"289.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"23.0\" fill=\"#1B2B33\" font-weight=\"600\" >③  order_id DESC<\/text><text x=\"530.0\" y=\"286.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#1B2B33\" font-weight=\"400\" >目标排序键的后缀 · 需要补齐<\/text><rect x=\"1095.0\" y=\"46.0\" width=\"245.0\" height=\"276.0\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"1115.0\" y=\"78.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#BE653B\" font-weight=\"600\" >一个命题<\/text><line x1=\"1115.0\" y1=\"90.0\" x2=\"1320.0\" y2=\"90.0\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1115.0\" y=\"116.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"600\" >排序不必从零开始<\/text><text x=\"1115.0\" y=\"180.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >复用已经有序的前缀，只在等值组<\/text><text x=\"1115.0\" y=\"200.2\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >内补齐后缀。<\/text><text x=\"1115.0\" y=\"252.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"400\" >PostgreSQL 把它做成了一个显式<\/text><text x=\"1115.0\" y=\"272.2\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"400\" >执行节点。<\/text><line x1=\"60.0\" y1=\"344.0\" x2=\"1340.0\" y2=\"344.0\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"60.0\" y=\"380.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#BE653B\" font-weight=\"600\" >Incremental Sort：复用 ①，只在 ① 的等值组内排序 ②③ —— 排完一组，即可输出一组<\/text><text x=\"60.0\" y=\"410.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >依据：postgres/src/backend/executor/nodeIncrementalSort.c · perform.sgml<\/text><\/svg>","ctrl":""},{"eyebrow":"第一章 · 问题","title":"一条查询，两个事实，一个矛盾","lede":"输入侧已按 tenant_id 有序；目标侧要三列完整顺序；中间差了两列。","caption":"图 2：SQL 与两侧事实。橙色框是要回答的问题：补齐两列，值得重排全部结果吗？","bridge":"把两个思路并排放，差别就不在快慢，而在工作单位的形状。","notes":"看左边这条 SQL：tenant_id 做了范围过滤，ORDER BY 是 tenant_id、created_at DESC、order_id DESC，LIMIT 100。这是多租户系统里最常见的形态——先看某个租户，再按时间倒序翻订单。\n\n右边是两个事实。第一，输入侧：已有索引或上游执行节点能按 tenant_id 输出，所以前缀有序。第二，目标侧：查询要的是三列完整顺序，而且只要最前面一百行。中间就差 created_at 和 order_id 这两列。\n\n矛盾就在这里：为了补齐两列，要不要把整个结果集当成完全无序的集合重新排一遍？注意 LIMIT 100 意味着我们很可能只需要头几个租户的数据，却要为所有租户付完整的排序成本。这个不对称，就是增量排序的立足点。原文在背景段把这句话说得很直白：业务查询里，排序经常不是从零开始排。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40.0\" y=\"30.0\" width=\"700.0\" height=\"316.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"58.0\" y=\"58.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#245A6B\" font-weight=\"600\" >业务查询（原文 · 背景）<\/text><text x=\"58.0\" y=\"84.0\" class=\"sv m\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"400\" >SELECT tenant_id, created_at, order_id, amount<\/text><text x=\"58.0\" y=\"110.2\" class=\"sv m\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"400\" >FROM orders<\/text><text x=\"58.0\" y=\"136.5\" class=\"sv m\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"400\" >WHERE tenant_id BETWEEN 100 AND 200<\/text><text x=\"58.0\" y=\"162.8\" class=\"sv m\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"400\" >ORDER BY tenant_id, created_at DESC,<\/text><text x=\"58.0\" y=\"189.0\" class=\"sv m\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"400\" >         order_id DESC<\/text><text x=\"58.0\" y=\"215.2\" class=\"sv m\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"400\" >LIMIT 100;<\/text><rect x=\"780.0\" y=\"30.0\" width=\"580.0\" height=\"104.0\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"800.0\" y=\"58.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" >输入侧事实<\/text><text x=\"800.0\" y=\"82.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"400\" >已有索引或上游执行节点能按 tenant_id 输出 —— 前缀已经有序。<\/text><rect x=\"780.0\" y=\"148.0\" width=\"580.0\" height=\"104.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"800.0\" y=\"176.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" >目标侧要求<\/text><text x=\"800.0\" y=\"200.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"400\" >ORDER BY 三列完整顺序，并且只要最前面的 100 行。<\/text><rect x=\"780.0\" y=\"266.0\" width=\"580.0\" height=\"80.0\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\" /><text x=\"800.0\" y=\"294.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#BE653B\" font-weight=\"600\" >矛盾<\/text><text x=\"800.0\" y=\"316.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#BE653B\" font-weight=\"600\" >要不要为补齐两列，把全部结果从零重排一遍？<\/text><line x1=\"744.0\" y1=\"188.0\" x2=\"769.6\" y2=\"188.0\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><polygon points=\"776.0,188.0 768.0,183.6 768.0,192.4\" fill=\"#7BA6AF\"/><text x=\"40.0\" y=\"382.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >「排序经常不是从零开始排」—— 输入顺序是可复用的资源，不是噪声。<\/text><text x=\"40.0\" y=\"408.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >SQL 取自原文背景段；未在本轮环境执行。<\/text><\/svg>","ctrl":""},{"eyebrow":"第一章 · 问题","title":"两种工作单位，两条资源曲线","lede":"普通 Sort 的工作单位是整个输入；Incremental Sort 的工作单位是前缀组。","caption":"图 3：同一目标顺序的时序对比。绿色块是「可以向上层交货」的时刻，越靠左启动延迟越低。","bridge":"工作单位一换，先出来的是三个收益，紧接着是四类代价。","notes":"把两种做法画成时序图，差别一眼就能看出来。上面是普通全量排序：读入全部输入，完整排好 (key1…keyN)，然后才开始输出。它必须先拥有全部数据，才敢保证全局有序——这是正确性的要求，不是实现偷懒。\n\n下面是增量排序：输入已经按 (key1…keyM) 有序，M 小于 N。执行器找到前缀键相同的连续组，每组只补排后面的 (keyM+1…keyN)，排完一组就能交一组。因为同一个前缀值的行在输入里天然连续，把这些组按顺序串接起来，全局结果依然满足完整排序键——这一步是正确性保证，不是近似。\n\n于是第一组结束的位置，就是第一行输出的位置，它比普通排序的首行输出早得多。记住这张图，后面讲启动成本、work_mem、LIMIT，全都是在解释这两个绿色块之间的距离。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"40.0\" y=\"34.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"600\" >普通 Sort · 工作单位 = 整个输入<\/text><text x=\"40.0\" y=\"200.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"600\" >Incremental Sort · 工作单位 = 前缀组<\/text><rect x=\"40.0\" y=\"52.0\" width=\"880.0\" height=\"74.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"480.0\" y=\"94.1\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >读入全部输入<\/text><rect x=\"920.0\" y=\"52.0\" width=\"250.0\" height=\"74.0\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"1045.0\" y=\"94.1\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >完整排序<\/text><rect x=\"1170.0\" y=\"52.0\" width=\"180.0\" height=\"74.0\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"1260.0\" y=\"94.1\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >开始输出<\/text><rect x=\"40.0\" y=\"218.0\" width=\"180.0\" height=\"74.0\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"130.0\" y=\"259.2\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"600\" >组 1 读入<\/text><rect x=\"220.0\" y=\"218.0\" width=\"110.0\" height=\"74.0\" rx=\"3\" fill=\"#A4C4C6\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"275.0\" y=\"259.2\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"600\" >组内补排<\/text><rect x=\"330.0\" y=\"218.0\" width=\"120.0\" height=\"74.0\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"390.0\" y=\"259.2\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"600\" >输出组 1<\/text><rect x=\"450.0\" y=\"218.0\" width=\"180.0\" height=\"74.0\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"540.0\" y=\"259.2\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"600\" >组 2 读入<\/text><rect x=\"630.0\" y=\"218.0\" width=\"110.0\" height=\"74.0\" rx=\"3\" fill=\"#A4C4C6\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"685.0\" y=\"259.2\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"600\" >组内补排<\/text><rect x=\"740.0\" y=\"218.0\" width=\"120.0\" height=\"74.0\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"800.0\" y=\"259.2\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"600\" >输出组 2<\/text><rect x=\"860.0\" y=\"218.0\" width=\"180.0\" height=\"74.0\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"950.0\" y=\"259.2\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"600\" >组 3 读入<\/text><rect x=\"1040.0\" y=\"218.0\" width=\"110.0\" height=\"74.0\" rx=\"3\" fill=\"#A4C4C6\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"1095.0\" y=\"259.2\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"600\" >组内补排<\/text><rect x=\"1150.0\" y=\"218.0\" width=\"190.0\" height=\"74.0\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"1245.0\" y=\"259.2\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"600\" >输出组 3 …<\/text><polygon points=\"1160,178 1180,178 1170,164\" fill=\"#245A6B\"/><text x=\"1010.0\" y=\"160.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" >普通 Sort 首行输出<\/text><polygon points=\"320,300 340,300 330,286\" fill=\"#BE653B\"/><text x=\"238.0\" y=\"324.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#BE653B\" font-weight=\"600\" >第一组排完就能输出<\/text><rect x=\"40.0\" y=\"350.0\" width=\"1300.0\" height=\"62.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"690.0\" y=\"386.1\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#46585F\" font-weight=\"400\" >同一个目标顺序，两种资源曲线：普通 Sort 必须先拥有全部数据；增量排序先拥有一组就先交一组。<\/text><\/svg>","ctrl":""},{"eyebrow":"第一章 · 问题","title":"收益是真的，代价也是真的","lede":"三个直接收益来自「拆小排序」，四类代价来自「拆」这个动作本身。","caption":"图 4：左侧青绿为收益，右侧陶橙为代价。净收益由组规模、组数、LIMIT、work_mem 共同决定。","bridge":"账算清楚了，下一步得弄清：它在 PostgreSQL 里究竟是个什么东西？","notes":"拆成大排序变小排序，直接带来三件事。第一，启动延迟低：第一组排完就能向上层返回，LIMIT 特别容易受益。第二，峰值内存低：单次只处理一个或少量前缀组，更可能落在 work_mem 里。第三，落盘概率低：全量排序可能走 external merge，分组排序多数能在内存完成。原文第一章把这三条列得很清楚。\n\n但「拆」本身要付钱。要检测前缀组边界，就多了 tuple copy 和前缀键比较；小组非常多时，反复启动或 reset tuplesort 会把收益吃回去；成本模型依赖前缀组数估计，统计信息不准就可能选错计划；最根本的是，它只能复用「前缀有序」，不能凭空解决任意乱序。\n\n所以别把它记成「比 Sort 快」的开关。它改变的是资源曲线，而这条曲线由前缀组规模、组数、LIMIT、work_mem 和上游路径顺序一起决定。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><text x=\"40.0\" y=\"32.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#2F7A66\" font-weight=\"600\" >三个直接收益<\/text><text x=\"720.0\" y=\"32.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"600\" >四类真实代价<\/text><rect x=\"40.0\" y=\"52.0\" width=\"620.0\" height=\"80.0\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1.0\" /><text x=\"58.0\" y=\"98.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#2F7A66\" font-weight=\"600\" >更低启动延迟<\/text><text x=\"276.0\" y=\"88.8\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >第一组排完即返回，LIMIT 特别容易受益<\/text><rect x=\"40.0\" y=\"144.0\" width=\"620.0\" height=\"80.0\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1.0\" /><text x=\"58.0\" y=\"189.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#2F7A66\" font-weight=\"600\" >更低峰值内存<\/text><text x=\"276.0\" y=\"180.8\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >单次只处理一个或少量前缀组，更可能落在 work_mem 内<\/text><rect x=\"40.0\" y=\"236.0\" width=\"620.0\" height=\"80.0\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1.0\" /><text x=\"58.0\" y=\"281.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#2F7A66\" font-weight=\"600\" >更少落盘概率<\/text><text x=\"276.0\" y=\"272.8\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >全量排序可能 external merge，分组排序多数在内存完成<\/text><rect x=\"720.0\" y=\"52.0\" width=\"620.0\" height=\"58.0\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"738.0\" y=\"86.2\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"600\" >分组检测<\/text><text x=\"906.0\" y=\"77.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >多出 tuple copy 与前缀键比较成本<\/text><rect x=\"720.0\" y=\"120.0\" width=\"620.0\" height=\"58.0\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"738.0\" y=\"154.2\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"600\" >频繁 reset<\/text><text x=\"906.0\" y=\"145.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >小组很多时反复启动 tuplesort 抵消收益<\/text><rect x=\"720.0\" y=\"188.0\" width=\"620.0\" height=\"58.0\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"738.0\" y=\"222.2\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"600\" >统计误判<\/text><text x=\"906.0\" y=\"213.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >成本模型依赖前缀组数估计<\/text><rect x=\"720.0\" y=\"256.0\" width=\"620.0\" height=\"58.0\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"738.0\" y=\"290.2\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"600\" >前提限制<\/text><text x=\"906.0\" y=\"281.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >只能复用前缀有序，不能凭空解决乱序<\/text><rect x=\"40.0\" y=\"348.0\" width=\"1300.0\" height=\"64.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"690.0\" y=\"385.3\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.5\" fill=\"#245A6B\" font-weight=\"600\" >净收益不是开关，而是「前缀组规模 × 组数 × LIMIT × work_mem × 上游路径顺序」共同决定的资源曲线。<\/text><\/svg>","ctrl":""},{"eyebrow":"第二章 · 它是什么","title":"一个显式计划节点的四层剖面","lede":"从 Path 到 Plan 到 Executor 再到 EXPLAIN，它是一个有名字、有状态、可观测的节点。","caption":"图 5：地层越深越底层。四层分别对应候选路径、计划节点、执行状态机与可观测输出。","bridge":"四层里最容易被我们看见的是 EXPLAIN，先从那儿读起。","notes":"在 PostgreSQL 里，Incremental Sort 不是一个优化技巧的俗称，而是一个显式计划节点，是 Sort 的变体。原文第二章给了四层结构，我们按地层剖面从深到浅看一遍。\n\n最底层是 Path：IncrementalSortPath，优化器的候选路径，里面记着 nPresortedCols，也就是前缀列数。往上是 Plan：IncrementalSort，执行计划节点，继承 Sort 的字段并记录前缀列数。再往上是 Executor：IncrementalSortState，执行期状态机，手里握着 fullsort 和 prefixsort 两个 tuplesort 状态。最上面是 EXPLAIN：Sort Key 与 Presorted Key，把完整目标排序键和已由下层保证的前缀键直接写给你看。\n\n这四层不是并列的概念，是同一个节点从被考虑、被选中、被执行到被观测的完整生命周期。对应文件分别是 pathnodes.h、plannodes.h、execnodes.h 和 explain.c。后面三章，就是沿着这四层往下挖。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><line x1=\"40.0\" y1=\"30.0\" x2=\"40.0\" y2=\"372.0\" stroke=\"#7BA6AF\" stroke-width=\"2.0\"/><line x1=\"40.0\" y1=\"69.0\" x2=\"60.0\" y2=\"69.0\" stroke=\"#7BA6AF\" stroke-width=\"2.0\"/><rect x=\"60.0\" y=\"30.0\" width=\"1280.0\" height=\"78.0\" rx=\"3\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.0\" /><text x=\"84.0\" y=\"76.0\" class=\"sv m\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"600\" >01  PATH<\/text><text x=\"300.0\" y=\"76.0\" class=\"sv m\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#FFFFFF\" font-weight=\"600\" >IncrementalSortPath<\/text><text x=\"690.0\" y=\"56.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#FFFFFF\" font-weight=\"400\" >优化器候选路径，记录 nPresortedCols（pathnodes.h）<\/text><line x1=\"40.0\" y1=\"157.0\" x2=\"60.0\" y2=\"157.0\" stroke=\"#7BA6AF\" stroke-width=\"2.0\"/><rect x=\"60.0\" y=\"118.0\" width=\"1280.0\" height=\"78.0\" rx=\"3\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1.0\" /><text x=\"84.0\" y=\"164.0\" class=\"sv m\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"600\" >02  PLAN<\/text><text x=\"300.0\" y=\"164.0\" class=\"sv m\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#FFFFFF\" font-weight=\"600\" >IncrementalSort<\/text><text x=\"690.0\" y=\"144.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#FFFFFF\" font-weight=\"400\" >执行计划节点，继承 Sort 字段并记录前缀列数（plannodes.h）<\/text><line x1=\"40.0\" y1=\"245.0\" x2=\"60.0\" y2=\"245.0\" stroke=\"#7BA6AF\" stroke-width=\"2.0\"/><rect x=\"60.0\" y=\"206.0\" width=\"1280.0\" height=\"78.0\" rx=\"3\" fill=\"#A4C4C6\" stroke=\"#A4C4C6\" stroke-width=\"1.0\" /><text x=\"84.0\" y=\"252.0\" class=\"sv m\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"600\" >03  EXECUTOR<\/text><text x=\"300.0\" y=\"252.0\" class=\"sv m\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#1B2B33\" font-weight=\"600\" >IncrementalSortState<\/text><text x=\"690.0\" y=\"232.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" >执行期状态机，持有 fullsort 与 prefixsort 两个 tuplesort（execnodes.h）<\/text><line x1=\"40.0\" y1=\"333.0\" x2=\"60.0\" y2=\"333.0\" stroke=\"#7BA6AF\" stroke-width=\"2.0\"/><rect x=\"60.0\" y=\"294.0\" width=\"1280.0\" height=\"78.0\" rx=\"3\" fill=\"#EBF1EE\" stroke=\"#EBF1EE\" stroke-width=\"1.0\" /><text x=\"84.0\" y=\"340.0\" class=\"sv m\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"600\" >04  EXPLAIN<\/text><text x=\"300.0\" y=\"340.0\" class=\"sv m\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#1B2B33\" font-weight=\"600\" >Sort Key / Presorted Key<\/text><text x=\"690.0\" y=\"320.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" >展示完整目标排序键与下层保证的前缀键（explain.c）<\/text><text x=\"60.0\" y=\"412.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >越深的靛青 = 越底层；从候选路径到可观测输出，是一个显式节点的完整生命周期。<\/text><\/svg>","ctrl":""},{"eyebrow":"第二章 · 它是什么","title":"读计划：Sort Key 与 Presorted Key","lede":"官方文档的例子里，前缀顺序来自索引，节点只负责在组内补 ten。","caption":"图 6：perform.sgml 的 tenk1 例子。计划树是原文给出的示意文本，右侧为逐行释义。","bridge":"这里最容易被误读的一句是「前缀顺序来自索引」——其实优化器只认路径顺序。","notes":"官方文档 perform.sgml 在 EXPLAIN 章节给了一个典型例子：EXPLAIN SELECT * FROM tenk1 ORDER BY hundred, ten LIMIT 100。计划形态是 Limit 套 Incremental Sort，Sort Key 是 hundred, ten，Presorted Key 是 hundred，下面是 Index Scan using tenk1_hundred。\n\n怎么读？Limit 说明只要前一百行；Sort Key 是这个节点必须保证的完整目标顺序；Presorted Key 是下层已经替它保证好的前缀；Index Scan 说明前缀顺序的来源是索引按 hundred 输出。于是执行器不需要把 (hundred, ten) 当成完全无序的组合从零排，只要按 hundred 分组、组内补 ten，再把组串起来。\n\n请注意一个容易踩的坑：这句话的重点不是「有索引」，而是「下层路径的输出顺序」。原文 3.6 的回归测试里，前缀顺序甚至来自另一个 Sort 节点。优化器判断的是 pathkeys，不是索引的名字。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"60.0\" y=\"34.0\" width=\"480.0\" height=\"62.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#245A6B\" stroke-width=\"1.3\" /><text x=\"82.0\" y=\"74.0\" class=\"sv m\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#245A6B\" font-weight=\"600\" >Limit<\/text><rect x=\"120.0\" y=\"130.0\" width=\"590.0\" height=\"104.0\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.6\" /><text x=\"142.0\" y=\"162.0\" class=\"sv m\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#BE653B\" font-weight=\"700\" >Incremental Sort<\/text><text x=\"142.0\" y=\"190.0\" class=\"sv m\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"400\" >Sort Key: hundred, ten<\/text><text x=\"142.0\" y=\"216.0\" class=\"sv m\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"400\" >Presorted Key: hundred<\/text><rect x=\"180.0\" y=\"264.0\" width=\"620.0\" height=\"68.0\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.3\" /><text x=\"202.0\" y=\"304.0\" class=\"sv m\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"600\" >Index Scan using tenk1_hundred on tenk1<\/text><line x1=\"90.0\" y1=\"96.0\" x2=\"90.0\" y2=\"298.0\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><line x1=\"90.0\" y1=\"96.0\" x2=\"90.0\" y2=\"130.0\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><line x1=\"90.0\" y1=\"182.0\" x2=\"120.0\" y2=\"182.0\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><line x1=\"90.0\" y1=\"298.0\" x2=\"180.0\" y2=\"298.0\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><rect x=\"760.0\" y=\"34.0\" width=\"600.0\" height=\"298.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"782.0\" y=\"64.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" >三行计划，三件事<\/text><line x1=\"782.0\" y1=\"76.0\" x2=\"1340.0\" y2=\"76.0\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"782.0\" y=\"90.0\" width=\"556.0\" height=\"50.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"796.0\" y=\"121.0\" class=\"sv m\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#BE653B\" font-weight=\"600\" >Limit<\/text><text x=\"1000.0\" y=\"121.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >只要前 100 行 → 给「早输出」留出价值<\/text><rect x=\"782.0\" y=\"148.0\" width=\"556.0\" height=\"50.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"796.0\" y=\"179.0\" class=\"sv m\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#BE653B\" font-weight=\"600\" >Sort Key<\/text><text x=\"1000.0\" y=\"179.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >完整目标排序键，由本节点负责保证<\/text><rect x=\"782.0\" y=\"206.0\" width=\"556.0\" height=\"50.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"796.0\" y=\"237.0\" class=\"sv m\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#BE653B\" font-weight=\"600\" >Presorted Key<\/text><text x=\"1000.0\" y=\"237.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >已由下层保证、无需重排的前缀<\/text><rect x=\"782.0\" y=\"264.0\" width=\"556.0\" height=\"50.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"796.0\" y=\"295.0\" class=\"sv m\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#BE653B\" font-weight=\"600\" >Index Scan<\/text><text x=\"1000.0\" y=\"295.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >前缀顺序的来源：索引按 hundred 输出<\/text><text x=\"60.0\" y=\"366.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >官方例子：EXPLAIN SELECT * FROM tenk1 ORDER BY hundred, ten LIMIT 100;<\/text><text x=\"60.0\" y=\"392.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >含义：按 hundred 分组，组内补 ten；串接后仍满足 (hundred, ten) 的全局顺序。<\/text><text x=\"60.0\" y=\"418.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >依据：perform.sgml 的 EXPLAIN 章节；计划形态为原文给出的示意文本。<\/text><\/svg>","ctrl":""},{"eyebrow":"第三章 · 优化器","title":"前缀有序的来源，不止索引","lede":"前提是下层路径的 pathkeys 覆盖目标排序键的前缀，而不是「表上有索引」。","caption":"图 7：七类路径顺序汇入同一个前提。绿色框是本页要带走的一句话。","bridge":"有了这个前提，优化器下一步就是做一次包含关系判定。","notes":"这一页我想专门纠正一个直觉。很多人把 Incremental Sort 记成「有索引就能用」，其实原文 3.1 写得很明确：前提不是「有索引」，而是「下层路径的 pathkeys 覆盖了目标排序键的前缀」。\n\n能提供这段顺序的路径有七类：B-tree Index Scan；GiST 等支持 amcanorderbyop 的距离顺序扫描；上游 Sort；MergeAppend；Append 子路径；Merge Join 外侧路径；以及 WindowAgg、GROUP BY、DISTINCT、ORDER BY 这些上层构造过程中产生的部分有序输入。\n\n它们长得完全不一样，但对优化器来说是同一种东西——一段可用的 pathkeys。优化器在多个地方调用 pathkeys_count_contained_in()：完全覆盖就不排序，只覆盖前缀才考虑增量补齐。后面我们会看到回归测试里那个「前缀来自 Sort」的例子，正好把这句话钉死。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><line x1=\"640.0\" y1=\"51.0\" x2=\"640.0\" y2=\"351.0\" stroke=\"#7BA6AF\" stroke-width=\"2.0\"/><rect x=\"40.0\" y=\"30.0\" width=\"560.0\" height=\"42.0\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"56.0\" y=\"57.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"500\" >B-tree Index Scan<\/text><line x1=\"600.0\" y1=\"51.0\" x2=\"640.0\" y2=\"51.0\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><rect x=\"40.0\" y=\"80.0\" width=\"560.0\" height=\"42.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"56.0\" y=\"107.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"500\" >GiST 等支持 amcanorderbyop 的距离顺序扫描<\/text><line x1=\"600.0\" y1=\"101.0\" x2=\"640.0\" y2=\"101.0\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><rect x=\"40.0\" y=\"130.0\" width=\"560.0\" height=\"42.0\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"56.0\" y=\"157.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"500\" >上游 Sort<\/text><line x1=\"600.0\" y1=\"151.0\" x2=\"640.0\" y2=\"151.0\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><rect x=\"40.0\" y=\"180.0\" width=\"560.0\" height=\"42.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"56.0\" y=\"207.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"500\" >MergeAppend<\/text><line x1=\"600.0\" y1=\"201.0\" x2=\"640.0\" y2=\"201.0\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><rect x=\"40.0\" y=\"230.0\" width=\"560.0\" height=\"42.0\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"56.0\" y=\"257.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"500\" >Append 子路径<\/text><line x1=\"600.0\" y1=\"251.0\" x2=\"640.0\" y2=\"251.0\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><rect x=\"40.0\" y=\"280.0\" width=\"560.0\" height=\"42.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"56.0\" y=\"307.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"500\" >Merge Join 外侧路径<\/text><line x1=\"600.0\" y1=\"301.0\" x2=\"640.0\" y2=\"301.0\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><rect x=\"40.0\" y=\"330.0\" width=\"560.0\" height=\"42.0\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"56.0\" y=\"357.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"500\" >WindowAgg / GROUP BY / DISTINCT / ORDER BY 的部分有序输入<\/text><line x1=\"600.0\" y1=\"351.0\" x2=\"640.0\" y2=\"351.0\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><line x1=\"640.0\" y1=\"191.0\" x2=\"708.8\" y2=\"191.0\" stroke=\"#245A6B\" stroke-width=\"2.0\"/><polygon points=\"716.0,191.0 707.0,186.1 707.0,195.9\" fill=\"#245A6B\"/><rect x=\"720.0\" y=\"106.0\" width=\"640.0\" height=\"180.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#245A6B\" stroke-width=\"1.4\" /><text x=\"744.0\" y=\"140.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" >共同前提<\/text><text x=\"744.0\" y=\"180.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#1B2B33\" font-weight=\"700\" >下层 pathkeys 覆盖目标排序键的前缀<\/text><text x=\"744.0\" y=\"206.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >优化器多处调用 pathkeys_count_contained_in()：完全覆盖就不排序，只覆盖前缀才考虑<\/text><text x=\"744.0\" y=\"227.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >增量补齐。<\/text><rect x=\"720.0\" y=\"296.0\" width=\"640.0\" height=\"60.0\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1.0\" /><text x=\"1040.0\" y=\"330.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#2F7A66\" font-weight=\"600\" >关键不是「有索引」，而是「路径顺序」。前缀顺序甚至可以来自另一个 Sort。<\/text><text x=\"40.0\" y=\"390.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >来源清单取自原文 3.1；回归测试 incremental_sort.sql 就用了「上游 Sort 提供前缀」这一形态。<\/text><text x=\"40.0\" y=\"416.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >越往下越靠近执行器；优化器只认 pathkeys，不认「索引」这个名字。<\/text><\/svg>","ctrl":""},{"eyebrow":"第三章 · 优化器","title":"三种包含关系，三条分支","lede":"完全覆盖 → 免排序；只覆盖前缀且 GUC 打开 → 增量补齐；完全不覆盖 → 普通 Sort。","caption":"图 8：pathkeys_count_contained_in() 的三个出口。中间橙色分支才是本演说的主角。","bridge":"选中候选路径之后，还得算账 —— 成本模型开始接管。","notes":"优化器不是看到「部分有序」就无脑加节点。它先做包含关系判定：目标 pathkeys 与输入 pathkeys 谁覆盖谁。\n\n三个出口很清楚。第一，目标排序键已经完全被输入覆盖，那连排序都不需要，直接沿用。第二，只覆盖前缀，并且 enable_incremental_sort 打开，才构造 IncrementalSortPath。第三，完全没有可复用顺序，退回普通 Sort，从零全排。\n\n这里有个可核验的开关：enable_incremental_sort 是用户级 GUC，默认值 on，PostgreSQL 13 引入，config.sgml 有明确说明。它关掉，优化器就不再生成增量排序的候选路径——这也是后面 DEMO 里做对照实验的基础。\n\n所以「出现了 Incremental Sort」这件事，本身就说明两件事：优化器认为输入有可用前缀，并且它算完账觉得补齐比全排划算。下一个问题自然是，这笔账怎么算。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"390.0\" y=\"20.0\" width=\"620.0\" height=\"66.0\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.3\" /><text x=\"410.0\" y=\"48.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"600\" >目标 pathkeys  vs  输入 pathkeys<\/text><text x=\"410.0\" y=\"72.0\" class=\"sv m\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"400\" >pathkeys_count_contained_in()<\/text><line x1=\"700.0\" y1=\"86.0\" x2=\"700.0\" y2=\"112.0\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><line x1=\"230.0\" y1=\"112.0\" x2=\"1170.0\" y2=\"112.0\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><line x1=\"230.0\" y1=\"112.0\" x2=\"230.0\" y2=\"142.0\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><rect x=\"60.0\" y=\"142.0\" width=\"340.0\" height=\"106.0\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.3\" /><text x=\"230.0\" y=\"178.1\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#2F7A66\" font-weight=\"600\" >完全覆盖<\/text><line x1=\"84.0\" y1=\"198.0\" x2=\"376.0\" y2=\"198.0\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"230.0\" y=\"226.8\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\" >不需要排序<\/text><line x1=\"700.0\" y1=\"112.0\" x2=\"700.0\" y2=\"142.0\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><rect x=\"530.0\" y=\"142.0\" width=\"340.0\" height=\"106.0\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.3\" /><text x=\"700.0\" y=\"178.1\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"600\" >只覆盖前缀 + GUC on<\/text><line x1=\"554.0\" y1=\"198.0\" x2=\"846.0\" y2=\"198.0\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"700.0\" y=\"226.8\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\" >构造 IncrementalSortPath<\/text><line x1=\"1170.0\" y1=\"112.0\" x2=\"1170.0\" y2=\"142.0\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><rect x=\"1000.0\" y=\"142.0\" width=\"340.0\" height=\"106.0\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#46585F\" stroke-width=\"1.3\" /><text x=\"1170.0\" y=\"178.1\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#46585F\" font-weight=\"600\" >完全不覆盖<\/text><line x1=\"1024.0\" y1=\"198.0\" x2=\"1316.0\" y2=\"198.0\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1170.0\" y=\"226.8\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\" >退回普通 Sort<\/text><rect x=\"40.0\" y=\"276.0\" width=\"1300.0\" height=\"62.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"60.0\" y=\"302.0\" class=\"sv m\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" >enable_incremental_sort<\/text><text x=\"60.0\" y=\"326.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >用户级 GUC，默认 on（PostgreSQL 13 引入，config.sgml）；关闭则不再生成增量排序候选路径。<\/text><rect x=\"40.0\" y=\"350.0\" width=\"1300.0\" height=\"62.0\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1.0\" /><text x=\"690.0\" y=\"386.1\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#AE8A3E\" font-weight=\"600\" >判定对象是「包含关系」：覆盖全部 → 免排序；覆盖前缀 → 增量补齐；完全不覆盖 → 从零全排。<\/text><\/svg>","ctrl":""},{"eyebrow":"第三章 · 优化器","title":"五步造出一条候选路径","lede":"create_incremental_sort_path() 把 subpath 包装成 IncrementalSortPath，并记下前缀列数。","caption":"图 9：五个步骤位于 optimizer/util/pathnode.c。第四步把成本估算交给了 costsize.c。","bridge":"五步里唯一有不确定性的，是成本估算 —— 它押在一个变量上。","notes":"选中分支之后，pathnode.c 里的 create_incremental_sort_path() 会做五件事，整齐得像一条流水线。\n\n一，设置 pathtype = T_IncrementalSort，给这条路径打上身份。二，继承 subpath 的 target、并行安全属性和 worker 数——它只是包一层，不改变下层能交付什么。三，把输出 pathkeys 设置为目标顺序，这是它对上层的承诺。四，调用 cost_incremental_sort() 估算成本。五，保存 nPresortedCols = presorted_keys，把「复用了几列」这件事写进路径里。\n\n前四步里，只有第四步带有不确定性：成本是估出来的，不是量出来的。其余都是确定性的结构动作。这也解释了为什么后面的计划风险几乎都集中在统计信息上。我们现在就去看那个成本函数。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40.0\" y=\"56.0\" width=\"250.0\" height=\"170.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"40.0\" y=\"56.0\" width=\"250.0\" height=\"34.0\" rx=\"4\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.0\" /><text x=\"54.0\" y=\"79.0\" class=\"sv m\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"600\" >01<\/text><text x=\"165.0\" y=\"135.3\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.5\" fill=\"#1B2B33\" font-weight=\"600\" >设置 pathtype<\/text><line x1=\"58.0\" y1=\"166.0\" x2=\"272.0\" y2=\"166.0\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"165.0\" y=\"199.
