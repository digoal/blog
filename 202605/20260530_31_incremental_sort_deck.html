const N = D.length;
let cur = 0, autoTimer = null, autoOn = false, dockMode = '';
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

/* ---------- 舞台等比缩放 + letterbox；讲稿窗打开时缩到左侧 ---------- */
let fitRAF = null;
function fit(){
  const vp = $('#left');
  const W = vp.clientWidth, H = vp.clientHeight;
  const s = Math.min(W/1600, H/900);
  const st = $('#stage');
  st.style.transform = 'scale(' + s + ')';
  st.style.left = ((W - 1600*s)/2) + 'px';
  st.style.top  = ((H -  900*s)/2) + 'px';
}
function fitLoop(ms){
  cancelAnimationFrame(fitRAF);
  const t0 = performance.now();
  const step = t => { fit(); if(t - t0 < ms) fitRAF = requestAnimationFrame(step); };
  fitRAF = requestAnimationFrame(step);
}
window.addEventListener('resize', fit);

function render(){
  $('#slides').innerHTML = D.map((d,i) =>
    '<section class="slide" id="s'+i+'">'
    + '<div class="eyebrow"><span class="num">'+String(i+1).padStart(2,'0')+' / '+String(N).padStart(2,'0')+'</span>'+d.eyebrow+'</div>'
    + '<h1 class="title">'+d.title+'</h1>'
    + '<div class="lede">'+d.lede+'</div>'
    + '<div class="rule"></div>'
    + '<div class="figwrap">'+d.svg+'</div>'
    + '<div class="caption">'+d.caption+'</div>'
    + (d.ctrl ? '<div class="ctrls">'+d.ctrl+'</div>' : '')
    + '<div class="bridge"><span class="bk">承接 · NEXT</span>'+d.bridge+'</div>'
    + '<div class="footer"><div class="fbar"><i id="fbar'+i+'"></i></div>'
    + '<span class="fl">数据库筑基课 · 增量排序 Incremental Sort</span>'
    + '<span class="fr">'+String(i+1).padStart(2,'0')+' / '+String(N).padStart(2,'0')+'</span></div>'
    + '</section>').join('');
}

function go(i, silent){
  i = Math.max(0, Math.min(N-1, i));
  $$('.slide').forEach((el,k)=>el.classList.toggle('on', k===i));
  cur = i;
  try{ localStorage.setItem('incsort-slide', String(i)); }catch(e){}
  $('.pg').textContent = String(i+1).padStart(2,'0') + ' / ' + String(N).padStart(2,'0');
  $('#track i').style.width = ((i+1)/N*100)+'%';
  for(let k=0;k<N;k++){ const b=$('#fbar'+k); if(b) b.style.width = (k<=i?100:0)+'%'; }
  if(dockMode) syncDock();
  if(!silent) toast(D[i].eyebrow + ' · ' + D[i].title);
}
function next(){ if(cur<N-1) go(cur+1); else stopAuto(); }
function prev(){ if(cur>0) go(cur-1); }
function toast(s){
  const t=$('#toast'); t.textContent=s; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1700);
}

/* ---------- 自动播放 ---------- */
function stopAuto(){
  autoOn=false; clearInterval(autoTimer); autoTimer=null;
  $('#btnAuto').textContent='▶ 自动播放 P'; $('#btnAuto').classList.remove('act');
}
function toggleAuto(){
  if(autoOn){ stopAuto(); toast('已暂停自动播放'); return; }
  autoOn=true; $('#btnAuto').textContent='❚❚ 暂停 P'; $('#btnAuto').classList.add('act');
  autoTimer=setInterval(()=>{ if(cur<N-1) go(cur+1,true); else stopAuto(); }, 12000);
  toast('自动播放：每 12 秒一页');
}

/* ---------- 右侧页内开窗：目录 / 本页讲稿 / 全文讲稿 / 快捷键 ---------- */
const MODE_TITLE = {here:'本页讲稿', all:'全文讲稿', toc:'目录', help:'快捷键'};
function dockOpen(mode){
  const wasOpen = !!dockMode;
  dockMode = mode;
  $('#viewport').classList.add('dock-on');
  $('#dock').setAttribute('aria-hidden','false');
  buildDock();
  $('#dockBody').scrollTop = 0;
  fitLoop(430);
  markButtons();
  /* 首次开窗时讲稿窗宽度仍在过渡，文字换行高度未定；等布局稳定再定位，
     否则会按 0 宽度算出的巨大 offsetTop 滚到末尾。 */
  if(wasOpen) requestAnimationFrame(()=>requestAnimationFrame(()=>scrollDockTo(cur)));
  else setTimeout(()=>{ if(dockMode) scrollDockTo(cur); }, 400);
}
function dockClose(){
  dockMode='';
  $('#viewport').classList.remove('dock-on');
  $('#dock').setAttribute('aria-hidden','true');
  fitLoop(430);
  markButtons();
}
function dockToggle(mode){
  if(dockMode===mode) dockClose(); else dockOpen(mode);
}
function markButtons(){
  $('#btnToc').classList.toggle('act', dockMode==='toc');
  $('#btnNotes').classList.toggle('act', dockMode==='here');
  $('#btnAll').classList.toggle('act', dockMode==='all');
  $('#btnHelp').classList.toggle('act', dockMode==='help');
}
function secHTML(d,i,on){
  const paras = d.notes.split('\n\n').map(p=>'<p>'+p+'</p>').join('');
  return '<div class="dsec'+(on?' on':'')+'" data-sec="'+i+'">'
    + '<span class="sn">'+String(i+1).padStart(2,'0')+' / '+String(N).padStart(2,'0')+'</span>'
    + '<span class="eb">'+d.eyebrow+'</span>'
    + '<h3>'+d.title+'</h3>' + paras
    + '<div class="br">承接 · '+d.bridge+'</div></div>';
}
function buildDock(){
  const body=$('#dockBody');
  $('#dockTitle').textContent = MODE_TITLE[dockMode] || '讲稿';
  $('#dockSub').textContent = dockMode==='all'
    ? '共 '+N+' 页 · 已定位到第 '+String(cur+1).padStart(2,'0')+' 页'
    : (dockMode==='here' ? '当前第 '+String(cur+1).padStart(2,'0')+' 页 · 翻页自动更新'
       : (dockMode==='toc' ? '点击任意一页跳转' : '演说操作备忘'));
  if(dockMode==='here'){
    body.innerHTML = secHTML(D[cur],cur,true);
  }else if(dockMode==='all'){
    body.innerHTML = D.map((d,i)=>secHTML(d,i,i===cur)).join('');
  }else if(dockMode==='toc'){
    body.innerHTML = '<div class="dgrid">' + D.map((d,i)=>
      '<a data-jump="'+i+'" class="'+(i===cur?'cur':'')+'"><span class="gn">'
      +String(i+1).padStart(2,'0')+'</span><span class="gt">'+d.title+'</span></a>').join('') + '</div>';
    $$('#dockBody [data-jump]').forEach(a=>a.onclick=()=>go(+a.getAttribute('data-jump')));
  }else if(dockMode==='help'){
    body.innerHTML = '<div class="keys">'
      + '<div><kbd>→ / 空格</kbd>下一页</div><div><kbd>←</kbd>上一页</div>'
      + '<div><kbd>G</kbd>目录（再按一次关闭）</div><div><kbd>N</kbd>本页讲稿（再按一次关闭）</div>'
      + '<div><kbd>T</kbd>全文讲稿（再按一次关闭）</div><div><kbd>P</kbd>自动播放 / 暂停</div>'
      + '<div><kbd>F</kbd>全屏 / 退出全屏</div><div><kbd>1–9</kbd>直接跳页</div>'
      + '<div><kbd>Home / End</kbd>首页 / 末页</div><div><kbd>Esc</kbd>关闭讲稿窗 / 退出全屏</div>'
      + '<div><kbd>?</kbd>本帮助</div><div><kbd>点击底部按钮</kbd>同上</div>'
      + '</div><div class="dsec" style="margin-top:18px"><p style="font-size:13.5px;color:var(--muted)">'
      + '讲稿窗是页内开窗，不是弹窗：打开时舞台矢量缩放到左侧；全文讲稿会自动定位到当前页，翻页时联动滚动。</p></div>';
  }
}
function syncDock(){
  if(dockMode==='here'){ buildDock(); $('#dockBody').scrollTop=0; }
  else if(dockMode==='all'){
    $$('#dockBody .dsec').forEach((el,i)=>el.classList.toggle('on', i===cur));
    $('#dockSub').textContent = '共 '+N+' 页 · 已定位到第 '+String(cur+1).padStart(2,'0')+' 页';
    scrollDockTo(cur);
  }
  else if(dockMode==='toc'){
    $$('#dockBody .dgrid a').forEach((el,i)=>el.classList.toggle('cur', i===cur));
    scrollDockTo(cur);
  }
}
function scrollDockTo(i){
  const body=$('#dockBody');
  const sec=body.querySelector('[data-sec="'+i+'"]') || body.querySelector('.dgrid a[data-jump="'+i+'"]');
  if(!sec) return;
  const max=Math.max(0, body.scrollHeight - body.clientHeight);
  const top=Math.min(max, Math.max(0, sec.offsetTop - 10));
  body.scrollTo({top:top, behavior:'smooth'});
}

/* ---------- 全屏：底部快捷键常驻 ---------- */
function fs(){
  const el=document.documentElement;
  if(document.fullscreenElement){
    try{ document.exitFullscreen(); }catch(e){}
    return;
  }
  let p=null;
  try{ p = el.requestFullscreen ? el.requestFullscreen() : null; }catch(e){}
  if(p && p.catch) p.catch(()=>{ toast('浏览器限制了全屏，已切换沉浸布局；底部快捷键仍可用'); });
  document.body.classList.add('fs');
  $('#btnFs').textContent='退出全屏 F';
  $('#fsFlag').textContent='● 全屏中';
  fitLoop(320);
  toast('全屏：底部快捷键始终可见');
}
document.addEventListener('fullscreenchange', ()=>{
  if(!document.fullscreenElement){
    document.body.classList.remove('fs');
    $('#btnFs').textContent='全屏 F';
    $('#fsFlag').textContent='';
  }
  fitLoop(220);
});

/* ---------- 键盘 ---------- */
document.addEventListener('keydown', e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  const k=e.key;
  const typing=(tag==='input'||tag==='select'||tag==='textarea');
  const navKey=(k.indexOf('Arrow')===0||k===' '||k==='Home'||k==='End'||k==='PageUp'||k==='PageDown');
  if(k==='Escape'){
    if(dockMode) dockClose();
    if(document.fullscreenElement){ try{ document.exitFullscreen(); }catch(err){} }
    else if(document.body.classList.contains('fs')) document.body.classList.remove('fs');
    return;
  }
  if(typing && navKey) return;
  if(k==='ArrowRight'||k===' '||k==='PageDown'){ e.preventDefault(); next(); }
  else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); prev(); }
  else if(k==='f'||k==='F'){ e.preventDefault(); fs(); }
  else if(k==='g'||k==='G'){ e.preventDefault(); dockToggle('toc'); }
  else if(k==='n'||k==='N'){ e.preventDefault(); dockToggle('here'); }
  else if(k==='t'||k==='T'){ e.preventDefault(); dockToggle('all'); }
  else if(k==='p'||k==='P'){ e.preventDefault(); toggleAuto(); }
  else if(k==='?'||k==='h'||k==='H'){ e.preventDefault(); dockToggle('help'); }
  else if(k==='Home'){ e.preventDefault(); go(0); }
  else if(k==='End'){ e.preventDefault(); go(N-1); }
  else if(/^[1-9]$/.test(k)){ go(parseInt(k,10)-1); }
});

/* ---------- 动画 A：组规模阈值 32 / 64 ---------- */
let aTimer=null, aPlaying=false;
function aPaint(){
  const v=+$('#aSize').value;
  const mx=100 + 1200*v/96;
  const bar=$('#aBar'); if(bar) bar.setAttribute('width',(mx-100).toFixed(1));
  const mark=$('#aMark'); if(mark) mark.setAttribute('points',
    (mx-9).toFixed(1)+',238 '+(mx+9).toFixed(1)+',238 '+mx.toFixed(1)+',248');
  const val=$('#aVal');
  if(val){ val.setAttribute('x',mx.toFixed(1)); val.textContent=v+' 行'; }
  const lbl=$('#aSizeLbl'); if(lbl) lbl.textContent=v;
  const out=$('#aOut'); if(!out) return;
  let msg;
  if(v<32) msg='<b>『积累中』</b> 未达 32 行：不急着按组切分，full sort 一小批更划算';
  else if(v<=64) msg='<b>『边界检测』</b> 32–64 行：开始比较前缀键，遇到组边界就排序并输出这一批';
  else msg='<b>『大组切换』</b> 超过 64 行仍无新组：切到 presorted prefix 模式，只排后缀 key';
  out.innerHTML=msg;
}
function aPause(){ aPlaying=false; clearInterval(aTimer); aTimer=null;
  const b=$('#aPlay'); if(b){ b.textContent='▶ 播放'; b.classList.remove('play'); } }
function aPlay(){
  if(aPlaying){ aPause(); return; }
  if(+$('#aSize').value>=96) $('#aSize').value=0;
  aPlaying=true; $('#aPlay').textContent='❚❚ 暂停'; $('#aPlay').classList.add('play');
  aTimer=setInterval(()=>{ const v=+$('#aSize').value+4; $('#aSize').value=Math.min(96,v);
    aPaint(); if(v>=96) aPause(); },420);
}
function aStep(){ aPause(); $('#aSize').value=Math.min(96,+$('#aSize').value+4); aPaint(); }
function aReset(){ aPause(); $('#aSize').value=0; aPaint(); }

/* ---------- 动画 B：四状态状态机 ---------- */
const B_PATHS={small:[0,1,0], large:[0,2,3,0]};
let bIdx=0, bTimer=null, bPlaying=false;
function bPaint(){
  const seq=B_PATHS[$('#bCase').value];
  const active=seq[Math.min(bIdx,seq.length-1)];
  $$('.sbg').forEach(r=>{
    const on=(+r.getAttribute('data-i')===active);
    r.setAttribute('fill', on?'#F7E9DE':'#FFFFFF');
    r.setAttribute('stroke', on?'#BE653B':'#D9D5CB');
    r.setAttribute('stroke-width', on?'2.4':'1.6');
  });
  const names=['LOADFULLSORT','READFULLSORT','LOADPREFIXSORT','READPREFIXSORT'];
  const desc=[
    '从下层拉 tuple，装入 fullsort_state；按全部 sort key 排序',
    '从小批次排序结果中返回 tuple；组结束后回到装载状态',
    '判定为大组，切换装载模式：只把后续 tuple 装入 prefixsort_state',
    '从只排后缀的排序结果中返回 tuple；组结束后回到下一个前缀组'
  ];
  const out=$('#bOut'); if(out) out.innerHTML='<b>步骤 '+(bIdx+1)+' / '+seq.length+' · '+names[active]+'</b>　'+desc[active];
}
function bPause(){ bPlaying=false; clearInterval(bTimer); bTimer=null;
  const x=$('#bPlay'); if(x){ x.textContent='▶ 播放'; x.classList.remove('play'); } }
function bPlay(){
  if(bPlaying){ bPause(); return; }
  const seq=B_PATHS[$('#bCase').value];
  if(bIdx>=seq.length-1) bIdx=0;
  bPlaying=true; $('#bPlay').textContent='❚❚ 暂停'; $('#bPlay').classList.add('play');
  bTimer=setInterval(()=>{ bIdx++; bPaint();
    if(bIdx>=seq.length-1) bPause(); },950);
}
function bStep(){ bPause(); const seq=B_PATHS[$('#bCase').value];
  bIdx=(bIdx+1)%seq.length; bPaint(); }
function bReset(){ bPause(); bIdx=0; bPaint(); }

/* ---------- 动画 C：LIMIT 只排前 k 组 ---------- */
let cTimer=null, cPlaying=false, cK=1;
function cPaint(){
  const k=+$('#cK').value;
  $$('.cInc').forEach(r=>{
    const i=+r.getAttribute('data-i');
    r.setAttribute('fill', i<k?'#E4F0EA':'#F1EFE9');
    r.setAttribute('stroke', i<k?'#2F7A66':'#D9D5CB');
  });
  $$('[data-ct]').forEach(t=>{
    const i=+t.getAttribute('data-ct');
    t.setAttribute('fill', i<k?'#2F7A66':'#89938F');
  });
  const out=$('#cOut'); if(out) out.innerHTML=
    '<b>前 '+k+' 组即可停</b>　普通 Sort 仍需处理全部 5 组才能输出第一行；增量排序排完第 '
    +k+' 组就能满足 LIMIT（bounded sort）。5 个组为示意，非实测数据。';
}
function cPause(){ cPlaying=false; clearInterval(cTimer); cTimer=null;
  const x=$('#cPlay'); if(x){ x.textContent='▶ 播放'; x.classList.remove('play'); } }
function cPlay(){
  if(cPlaying){ cPause(); return; }
  if(+$('#cK').value>=5) $('#cK').value=1;
  cPlaying=true; $('#cPlay').textContent='❚❚ 暂停'; $('#cPlay').classList.add('play');
  cTimer=setInterval(()=>{ const v=+$('#cK').value+1; $('#cK').value=Math.min(5,v);
    cPaint(); if(v>=5) cPause(); },700);
}
function cStep(){ cPause(); $('#cK').value=(+$('#cK').value)%5+1; cPaint(); }
function cReset(){ cPause(); $('#cK').value=1; cPaint(); }

/* ---------- 初始化 ---------- */
function init(){
  render(); fit();
  let saved=0; try{ saved=parseInt(localStorage.getItem('incsort-slide')||'0',10)||0; }catch(e){}
  go(saved,true);
  $('#btnPrev').onclick=prev; $('#btnNext').onclick=next;
  $('#btnToc').onclick=()=>dockToggle('toc');
  $('#btnNotes').onclick=()=>dockToggle('here');
  $('#btnAll').onclick=()=>dockToggle('all');
  $('#btnAuto').onclick=toggleAuto;
  $('#btnFs').onclick=fs;
  $('#btnHelp').onclick=()=>dockToggle('help');
  $('#dockClose').onclick=dockClose;
  aPaint(); bPaint(); cPaint();
  $('#aSize').addEventListener('input',aPaint);
  $('#bCase').addEventListener('change',()=>{ bPause(); bIdx=0; bPaint(); });
  $('#cK').addEventListener('change',cPaint);
  $('#aPlay').onclick=aPlay; $('#aStep').onclick=aStep; $('#aReset').onclick=aReset;
  $('#bPlay').onclick=bPlay; $('#bStep').onclick=bStep; $('#bReset').onclick=bReset;
  $('#cPlay').onclick=cPlay; $('#cStep').onclick=cStep; $('#cReset').onclick=cReset;
}
document.addEventListener('DOMContentLoaded', init);
</script>
