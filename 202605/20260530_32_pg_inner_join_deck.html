/svg\" role=\"img\"><rect x=\"40\" y=\"16\" width=\"640\" height=\"50\" rx=\"0\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1.2\"/><text x=\"360\" y=\"45.41\" text-anchor=\"middle\" font-size=\"18\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"serif\">收益 · 组合能力</text><rect x=\"720\" y=\"16\" width=\"640\" height=\"50\" rx=\"0\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1.2\"/><text x=\"1040\" y=\"45.41\" text-anchor=\"middle\" font-size=\"18\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"serif\">代价 · 优化器账单</text><rect x=\"40\" y=\"78\" width=\"640\" height=\"64\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\"/><text x=\"58\" y=\"106.322\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#2F7A66\" font-weight=\"700\" class=\"serif\">避免大宽表冗余</text><text x=\"58\" y=\"122.097\" text-anchor=\"start\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">事实 / 维度 / 状态按职责拆分，再按 key 组合</text><rect x=\"720\" y=\"78\" width=\"640\" height=\"64\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\"/><text x=\"738\" y=\"106.322\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#BE653B\" font-weight=\"700\" class=\"serif\">搜索空间增长</text><text x=\"738\" y=\"122.097\" text-anchor=\"start\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">表数达到 geqo_threshold 时可能启用 GEQO</text><rect x=\"40\" y=\"150\" width=\"640\" height=\"64\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\"/><text x=\"58\" y=\"178.323\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#2F7A66\" font-weight=\"700\" class=\"serif\">让优化器挑访问路径</text><text x=\"58\" y=\"194.097\" text-anchor=\"start\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">同一 SQL 可随数据量在三种实现之间切换</text><rect x=\"720\" y=\"150\" width=\"640\" height=\"64\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\"/><text x=\"738\" y=\"178.323\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#BE653B\" font-weight=\"700\" class=\"serif\">错误会乘法放大</text><text x=\"738\" y=\"194.097\" text-anchor=\"start\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">漏条件、低估行数、重复 key、错误顺序</text><rect x=\"40\" y=\"222\" width=\"640\" height=\"64\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\"/><text x=\"58\" y=\"250.323\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#2F7A66\" font-weight=\"700\" class=\"serif\">过滤下推到合适位置</text><text x=\"58\" y=\"266.098\" text-anchor=\"start\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">单表 restriction 先缩小输入，join clause 再组合</text><rect x=\"720\" y=\"222\" width=\"640\" height=\"64\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\"/><text x=\"738\" y=\"250.323\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#BE653B\" font-weight=\"700\" class=\"serif\">资源边界更复杂</text><text x=\"738\" y=\"266.098\" text-anchor=\"start\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">一条 SQL 可同时有多个 hash / sort / memoize 节点</text><rect x=\"40\" y=\"294\" width=\"640\" height=\"64\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\"/><text x=\"58\" y=\"322.322\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#2F7A66\" font-weight=\"700\" class=\"serif\">支撑复杂业务表达</text><text x=\"58\" y=\"338.098\" text-anchor=\"start\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">多表查询、半连接改写、子查询拉平、星型模型</text><rect x=\"720\" y=\"294\" width=\"640\" height=\"64\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\"/><text x=\"738\" y=\"322.322\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#BE653B\" font-weight=\"700\" class=\"serif\">可解释性下降</text><text x=\"738\" y=\"338.098\" text-anchor=\"start\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">SQL 写法相似，计划可能完全不同</text><path d=\"M700 78 L700 358\" fill=\"none\" stroke=\"#D9D5CB\" stroke-width=\"1.4\" stroke-linejoin=\"miter\"/><rect x=\"40\" y=\"370\" width=\"1320\" height=\"48\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"58\" y=\"397.675\" text-anchor=\"start\" font-size=\"15\" fill=\"#1B2B33\" font-weight=\"600\" class=\"serif\">本文不提供编造的性能数字；真实效果以你自己的数据分布、索引、统计信息、参数和硬件为准</text></svg>","ctrl":"","anim":false},{"eyebrow":"实操 · DEMO 装置","title":"一个可复现、不伪造数字的最小实验","lede":"customers 一万行、orders 三十万行，两个索引，ANALYZE 之后用 EXPLAIN 观察默认计划；再用三个 enable 开关看替代路径。","caption":"图 22　数据量来自原文 DEMO 的 generate_series 参数；本文未执行 SQL，不展示编造的 ANALYZE 输出。","bridge":"实验跑起来之后，第一现场该看什么？","notes":"原文给了一套能直接在 PostgreSQL 里跑的最小实验，我把它画成装置图，方便你照着复现。\n\n准备阶段：建 customers 和 orders 两张表，用 generate_series 灌入一万行客户和三十万行订单，region 按模十分之一给 CN，status 按模七分之一给 inactive；建 orders_customer_id_idx 和 customers_region_idx 两个索引，最后 ANALYZE 两张表。这些数字是 DEMO 的参数，不是性能结论。\n\n观察阶段分三步。第一步，EXPLAIN (ANALYZE, BUFFERS) 那条 region = 'CN' 的查询，看默认计划落在哪种节点上。选择率低可能看到小表过滤后驱动订单索引扫描的 Nested Loop，输入规模大可能看到 Hash Join，两侧有合适索引且上层需要排序可能看到 Merge Join。第二步，用 enable_hashjoin、enable_mergejoin、enable_nestloop 三个开关分别劝退某种方法，对比替代计划；官方文档提醒 enable_nestloop 不能被完全禁止，只能劝退，而且这些开关只适合做诊断工具，别长期挂在业务参数里。第三步，加一条 o.amount > c.customer_id % 500，观察它如何变成 Join Filter。\n\n原文明确说明：本地 postgres 源码目录没有配置好的 build/server，所以这些 SQL 未被执行，也没有伪造 EXPLAIN ANALYZE 输出。这种诚实我觉得比贴一张好看的截图更重要。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40\" y=\"16\" width=\"310\" height=\"50\" rx=\"0\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.2\"/><text x=\"195\" y=\"44.92\" text-anchor=\"middle\" font-size=\"16\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"serif\">① 准备数据</text><path d=\"M350 41 L375 41\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"/><polygon points=\"367,37 375,41 367,45\" fill=\"#245A6B\"/><rect x=\"40\" y=\"78\" width=\"310\" height=\"58\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"54\" y=\"110.062\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" class=\"mono\">CREATE TABLE customers</text><rect x=\"40\" y=\"146\" width=\"310\" height=\"58\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"54\" y=\"178.062\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" class=\"mono\">CREATE TABLE orders</text><rect x=\"40\" y=\"214\" width=\"310\" height=\"58\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"54\" y=\"246.062\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">字段含主键 / region / status</text><rect x=\"40\" y=\"284\" width=\"310\" height=\"88\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\"/><text x=\"195\" y=\"331.185\" text-anchor=\"middle\" font-size=\"13\" fill=\"#245A6B\" font-weight=\"600\" class=\"\">两张表，职责分开</text><rect x=\"375\" y=\"16\" width=\"310\" height=\"50\" rx=\"0\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.2\"/><text x=\"530\" y=\"44.92\" text-anchor=\"middle\" font-size=\"16\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"serif\">② 灌数与索引</text><path d=\"M685 41 L710 41\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"/><polygon points=\"702,37 710,41 702,45\" fill=\"#245A6B\"/><rect x=\"375\" y=\"78\" width=\"310\" height=\"58\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"389\" y=\"110.062\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" class=\"mono\">customers 10,000 行</text><rect x=\"375\" y=\"146\" width=\"310\" height=\"58\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"389\" y=\"178.062\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" class=\"mono\">orders 300,000 行</text><rect x=\"375\" y=\"214\" width=\"310\" height=\"58\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"389\" y=\"246.062\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">两个索引 + ANALYZE</text><rect x=\"375\" y=\"284\" width=\"310\" height=\"88\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\"/><text x=\"530\" y=\"331.185\" text-anchor=\"middle\" font-size=\"13\" fill=\"#245A6B\" font-weight=\"600\" class=\"\">规模来自 generate_series 参数</text><rect x=\"710\" y=\"16\" width=\"310\" height=\"50\" rx=\"0\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.2\"/><text x=\"865\" y=\"44.92\" text-anchor=\"middle\" font-size=\"16\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"serif\">③ 观察默认计划</text><path d=\"M1020 41 L1045 41\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"/><polygon points=\"1037,37 1045,41 1037,45\" fill=\"#245A6B\"/><rect x=\"710\" y=\"78\" width=\"310\" height=\"58\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"724\" y=\"110.062\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" class=\"mono\">EXPLAIN (ANALYZE, BUFFERS)</text><rect x=\"710\" y=\"146\" width=\"310\" height=\"58\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"724\" y=\"178.062\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" class=\"mono\">region = CN 的 join 查询</text><rect x=\"710\" y=\"214\" width=\"310\" height=\"58\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"724\" y=\"246.062\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">看落在哪种 Join 节点</text><rect x=\"710\" y=\"284\" width=\"310\" height=\"88\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.2\"/><text x=\"865\" y=\"331.185\" text-anchor=\"middle\" font-size=\"13\" fill=\"#AE8A3E\" font-weight=\"600\" class=\"\">输入规模决定节点形态</text><rect x=\"1045\" y=\"16\" width=\"310\" height=\"50\" rx=\"0\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.2\"/><text x=\"1200\" y=\"44.92\" text-anchor=\"middle\" font-size=\"16\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"serif\">④ 对比替代路径</text><rect x=\"1045\" y=\"78\" width=\"310\" height=\"58\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"1059\" y=\"110.062\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" class=\"mono\">三个 enable_* 开关</text><rect x=\"1045\" y=\"146\" width=\"310\" height=\"58\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"1059\" y=\"178.062\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" class=\"mono\">加一条非等值条件</text><rect x=\"1045\" y=\"214\" width=\"310\" height=\"58\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"1059\" y=\"246.062\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">观察 Join Filter 出现</text><rect x=\"1045\" y=\"284\" width=\"310\" height=\"88\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.2\"/><text x=\"1200\" y=\"331.185\" text-anchor=\"middle\" font-size=\"13\" fill=\"#AE8A3E\" font-weight=\"600\" class=\"\">开关只作诊断工具</text><rect x=\"40\" y=\"384\" width=\"1320\" height=\"38\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"56\" y=\"406.185\" text-anchor=\"start\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">原文未执行这些 SQL，也不伪造 EXPLAIN ANALYZE 输出；这里展示的是实验装置与观察顺序</text></svg>","ctrl":"","anim":false},{"eyebrow":"实操 · 诊断清单","title":"慢 join 的现场检查，只有六项","lede":"估算偏差、被过滤掉的候选行、Hash Batches、临时文件、参数化索引、连接顺序限制——按这个顺序查，基本不会漏。","caption":"图 23　先看估算与实际，再看候选组合、内存批次、临时 I/O、索引与连接顺序。","bridge":"检查出问题之后，不同角色该动的居然不是同一处。","notes":"第一项，EXPLAIN (ANALYZE, BUFFERS) 里每个节点的 estimated rows 和 actual rows 是否偏离，这是第一现场。第二项，Rows Removed by Join Filter 有没有大量增长，它说明定位条件产生了太多候选、真正条件执行得太晚。\n\n第三项，Hash Join 的 Batches 是不是从 1 变大了，变大就意味着 build 侧装不进内存、开始分批。第四项，Sort 或 Hash 有没有出现临时文件 I/O，外部排序和 spill 都会把内存问题放大成磁盘问题。第五项，inner 侧索引是不是真的被参数化扫描用上了——Nested Loop 的优势全押在这上面。第六项，多表 join 的连接顺序有没有被外连接、LATERAL、显式括号或 join_collapse_limit 限制住，有时候优化器不是不想换顺序，是被语义或配置钉死了。\n\n这六项的顺序不是随便排的：前两项查估算和候选，中间两项查资源边界，后两项查可用路径。从「输入是不是算错了」一路走到「有没有更好的路可走」，正好沿着我们这一讲的地层从上往下走一遍。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40\" y=\"16\" width=\"640\" height=\"124\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\"/><text x=\"58\" y=\"66.64\" text-anchor=\"start\" font-size=\"17\" fill=\"#245A6B\" font-weight=\"700\" class=\"serif\">① 估算偏差</text><text x=\"58\" y=\"83.73\" text-anchor=\"start\" font-size=\"14\" fill=\"#1B2B33\" font-weight=\"600\" class=\"mono\">estimated rows vs actual rows</text><text x=\"58\" y=\"99.01\" text-anchor=\"start\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">EXPLAIN (ANALYZE, BUFFERS) 的第一现场</text><rect x=\"720\" y=\"16\" width=\"640\" height=\"124\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\"/><text x=\"738\" y=\"66.64\" text-anchor=\"start\" font-size=\"17\" fill=\"#BE653B\" font-weight=\"700\" class=\"serif\">② 候选过滤量</text><text x=\"738\" y=\"83.73\" text-anchor=\"start\" font-size=\"14\" fill=\"#1B2B33\" font-weight=\"600\" class=\"mono\">Rows Removed by Join Filter</text><text x=\"738\" y=\"99.01\" text-anchor=\"start\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">大量增长说明真正条件执行得太晚</text><rect x=\"40\" y=\"152\" width=\"640\" height=\"124\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.2\"/><text x=\"58\" y=\"202.64\" text-anchor=\"start\" font-size=\"17\" fill=\"#AE8A3E\" font-weight=\"700\" class=\"serif\">③ 内存批次</text><text x=\"58\" y=\"219.73\" text-anchor=\"start\" font-size=\"14\" fill=\"#1B2B33\" font-weight=\"600\" class=\"mono\">Hash Join 的 Batches</text><text x=\"58\" y=\"235.01\" text-anchor=\"start\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">从 1 变大 = build 侧装不进内存</text><rect x=\"720\" y=\"152\" width=\"640\" height=\"124\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\"/><text x=\"738\" y=\"202.64\" text-anchor=\"start\" font-size=\"17\" fill=\"#BE653B\" font-weight=\"700\" class=\"serif\">④ 临时文件 I/O</text><text x=\"738\" y=\"219.73\" text-anchor=\"start\" font-size=\"14\" fill=\"#1B2B33\" font-weight=\"600\" class=\"mono\">Sort / Hash 的 Disk</text><text x=\"738\" y=\"235.01\" text-anchor=\"start\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">外部排序与 spill 把问题放大到磁盘</text><rect x=\"40\" y=\"288\" width=\"640\" height=\"124\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\"/><text x=\"58\" y=\"338.64\" text-anchor=\"start\" font-size=\"17\" fill=\"#2F7A66\" font-weight=\"700\" class=\"serif\">⑤ 参数化索引</text><text x=\"58\" y=\"355.73\" text-anchor=\"start\" font-size=\"14\" fill=\"#1B2B33\" font-weight=\"600\" class=\"mono\">inner 侧是否真的用上</text><text x=\"58\" y=\"371.01\" text-anchor=\"start\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">Nested Loop 的优势全押在这里</text><rect x=\"720\" y=\"288\" width=\"640\" height=\"124\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\"/><text x=\"738\" y=\"338.64\" text-anchor=\"start\" font-size=\"17\" fill=\"#245A6B\" font-weight=\"700\" class=\"serif\">⑥ 连接顺序限制</text><text x=\"738\" y=\"355.73\" text-anchor=\"start\" font-size=\"14\" fill=\"#1B2B33\" font-weight=\"600\" class=\"mono\">外连接 / LATERAL / 括号</text><text x=\"738\" y=\"371.01\" text-anchor=\"start\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">join_collapse_limit 也可能钉死顺序</text></svg>","ctrl":"","anim":false},{"eyebrow":"实操 · 最佳实践","title":"架构师、DBA、开发者，各自该动的地方不同","lede":"模型层管基数与倾斜，运维层管统计与内存，应用层管写法与取列；把问题放错层，越调越乱。","caption":"图 24　三栏动作清单：左边是设计，中间是运维，右边是日常写 SQL 的纪律。","bridge":"还得知道什么时候根本不该用 inner join。","notes":"给数据库架构师的四条：先把连接键的基数和方向在模型层说清楚，事实表到维度表是多对一还是一对多、有没有多对多，因为 inner_unique 这类优化依赖「每个 outer 最多匹配一个 inner」的可证明性；为高频 join key 建索引但别机械建双边，Nested Loop 最依赖 inner 侧，Merge Join 能吃 B-tree 顺序，Hash Join 不靠索引 probe；控制多表 join 的中间结果规模，让高选择率维度先过滤；把数据倾斜当一等风险，热点租户、热门商品、默认状态值都会破坏平均选择率，必要时用扩展统计、分区、局部索引或 SQL 改写。\n\n给 DBA 的四条：慢 join 先看估算偏差；及时 ANALYZE、提高关键列 statistics target、建 extended statistics；谨慎使用 enable 开关，它们适合诊断替代计划，长期依赖通常是在掩盖统计、索引或 SQL 形态问题；监控临时文件与内存压力，别忘了并发会乘上去。\n\n给业务开发者的四条：显式写 join 条件，生产里不用 NATURAL JOIN；只取需要的列，宽 tuple 会加重 build、Sort、临时文件和网络返回；别用函数包住 join key，lower(a.email) 这类写法会让普通索引失效，要就用表达式索引或预规范化字段；别以为 LIMIT 10 就等于低成本，join 可能得先构造大量中间结果再排序。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40\" y=\"16\" width=\"420\" height=\"50\" rx=\"0\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.2\"/><text x=\"250\" y=\"45.165\" text-anchor=\"middle\" font-size=\"17\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"serif\">数据库架构师</text><rect x=\"40\" y=\"78\" width=\"420\" height=\"64\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\"/><text x=\"56\" y=\"106.61\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#245A6B\" font-weight=\"700\" class=\"serif\">基数与方向</text><text x=\"56\" y=\"121.975\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">多对一 / 一对多 / 多对多在模型层说清</text><rect x=\"40\" y=\"150\" width=\"420\" height=\"64\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\"/><text x=\"56\" y=\"178.61\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#245A6B\" font-weight=\"700\" class=\"serif\">高频 key 建索引</text><text x=\"56\" y=\"193.975\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">别机械建双边，inner 侧最关键</text><rect x=\"40\" y=\"222\" width=\"420\" height=\"64\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\"/><text x=\"56\" y=\"250.61\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#245A6B\" font-weight=\"700\" class=\"serif\">控制中间结果</text><text x=\"56\" y=\"265.975\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">高选择率维度先过滤，别让事实表早膨胀</text><rect x=\"40\" y=\"294\" width=\"420\" height=\"64\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\"/><text x=\"56\" y=\"322.61\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#245A6B\" font-weight=\"700\" class=\"serif\">倾斜当一等风险</text><text x=\"56\" y=\"337.975\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">扩展统计 / 分区 / 局部索引 / SQL 改写</text><rect x=\"490\" y=\"16\" width=\"420\" height=\"50\" rx=\"0\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1.2\"/><text x=\"700\" y=\"45.165\" text-anchor=\"middle\" font-size=\"17\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"serif\">DBA</text><rect x=\"490\" y=\"78\" width=\"420\" height=\"64\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\"/><text x=\"506\" y=\"106.61\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#BE653B\" font-weight=\"700\" class=\"serif\">先看估算偏差</text><text x=\"506\" y=\"121.975\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">每个节点 estimated 与 actual 是否偏离</text><rect x=\"490\" y=\"150\" width=\"420\" height=\"64\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\"/><text x=\"506\" y=\"178.61\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#BE653B\" font-weight=\"700\" class=\"serif\">维护统计信息</text><text x=\"506\" y=\"193.975\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">ANALYZE / statistics target / extended stats</text><rect x=\"490\" y=\"222\" width=\"420\" height=\"64\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\"/><text x=\"506\" y=\"250.61\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#BE653B\" font-weight=\"700\" class=\"serif\">谨慎用 enable 开关</text><text x=\"506\" y=\"265.975\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">适合诊断，长期依赖是在掩盖问题</text><rect x=\"490\" y=\"294\" width=\"420\" height=\"64\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\"/><text x=\"506\" y=\"322.61\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#BE653B\" font-weight=\"700\" class=\"serif\">监控内存与临时文件</text><text x=\"506\" y=\"337.975\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">batch、外部排序，还要乘上并发</text><rect x=\"940\" y=\"16\" width=\"420\" height=\"50\" rx=\"0\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1.2\"/><text x=\"1150\" y=\"45.165\" text-anchor=\"middle\" font-size=\"17\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"serif\">业务开发者</text><rect x=\"940\" y=\"78\" width=\"420\" height=\"64\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\"/><text x=\"956\" y=\"106.61\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#2F7A66\" font-weight=\"700\" class=\"serif\">显式写连接条件</text><text x=\"956\" y=\"121.975\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">不用逗号 join，生产不用 NATURAL JOIN</text><rect x=\"940\" y=\"150\" width=\"420\" height=\"64\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\"/><text x=\"956\" y=\"178.61\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#2F7A66\" font-weight=\"700\" class=\"serif\">只取需要的列</text><text x=\"956\" y=\"193.975\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">宽 tuple 加重 build / Sort / 网络返回</text><rect x=\"940\" y=\"222\" width=\"420\" height=\"64\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\"/><text x=\"956\" y=\"250.61\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#2F7A66\" font-weight=\"700\" class=\"serif\">别用函数包 join key</text><text x=\"956\" y=\"265.975\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">需要时用表达式索引或预规范化字段</text><rect x=\"940\" y=\"294\" width=\"420\" height=\"64\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\"/><text x=\"956\" y=\"322.61\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#2F7A66\" font-weight=\"700\" class=\"serif\">LIMIT 不等于低成本</text><text x=\"956\" y=\"337.975\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">join 可能先构造大量中间结果再排序</text><rect x=\"40\" y=\"370\" width=\"1320\" height=\"48\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"58\" y=\"397.675\" text-anchor=\"start\" font-size=\"15\" fill=\"#1B2B33\" font-weight=\"600\" class=\"serif\">正确动作：把问题放回它所属的那层——模型层、运维层、应用层，别越层调</text></svg>","ctrl":"","anim":false},{"eyebrow":"边界 · 适合与不适合","title":"边界在「未匹配行」和「重复 key」","lede":"只关心双方都存在的业务事实时，inner join 正合适；需要保留未匹配、只判断存在、多对多未去重、连接条件模糊时，就该换工具。","caption":"图 25　四种「不适合」都有对应替代：outer join、EXISTS / semi join、先去重、专门索引与分桶。","bridge":"最后把七个最容易踩的坑，按地层从浅到深排一遍。","notes":"适合的一侧很清晰：只关心双方都存在的业务事实，比如有订单且有客户、有支付且有账单、有库存且有商品；关系模型清晰、连接键稳定，主外键和维表 key 都能说清楚；过滤条件能显著缩小输入，先过滤再 join，或靠索引分区把规模控住；报表和分析查询里的大批量等值连接，交给 Hash Join 或 Merge Join 稳定处理。\n\n不适合的一侧更值得记。需要保留未匹配行，就用 left / right / full outer join，别拿 inner join 硬凑。只判断是否存在，很多时候 EXISTS 更清晰，优化器也可能把它转成 semi join，避免无意义的重复输出。多对多关系没去重，两侧 key 都重复时输出是组合乘法，得先想清楚要去重到什么粒度。连接条件不确定或依赖模糊匹配，比如文本相似度、范围 join、地理距离 join，普通等值连接的三套算法都不对口，需要专门索引、分桶或近似策略。\n\n一句话：inner join 的适用边界不是「能不能写出这条 SQL」，而是「结果语义和中间结果规模是不是都还符合业务预期」。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40\" y=\"16\" width=\"640\" height=\"48\" rx=\"0\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1.2\"/><text x=\"360\" y=\"44.165\" text-anchor=\"middle\" font-size=\"17\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"serif\">适合 inner join</text><rect x=\"720\" y=\"16\" width=\"640\" height=\"48\" rx=\"0\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1.2\"/><text x=\"1040\" y=\"44.165\" text-anchor=\"middle\" font-size=\"17\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"serif\">不适合直接使用</text><rect x=\"40\" y=\"76\" width=\"640\" height=\"54\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\"/><text x=\"58\" y=\"106.43\" text-anchor=\"start\" font-size=\"14\" fill=\"#2F7A66\" font-weight=\"600\" class=\"\">只关心双方都存在的业务事实</text><rect x=\"720\" y=\"76\" width=\"640\" height=\"54\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\"/><text x=\"738\" y=\"106.43\" text-anchor=\"start\" font-size=\"14\" fill=\"#BE653B\" font-weight=\"600\" class=\"\">需要保留未匹配行 → outer join</text><rect x=\"40\" y=\"138\" width=\"640\" height=\"54\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\"/><text x=\"58\" y=\"168.43\" text-anchor=\"start\" font-size=\"14\" fill=\"#2F7A66\" font-weight=\"600\" class=\"\">关系模型清晰、连接键稳定</text><rect x=\"720\" y=\"138\" width=\"640\" height=\"54\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\"/><text x=\"738\" y=\"168.43\" text-anchor=\"start\" font-size=\"14\" fill=\"#BE653B\" font-weight=\"600\" class=\"\">只判断存在 → EXISTS / semi join</text><rect x=\"40\" y=\"200\" width=\"640\" height=\"54\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\"/><text x=\"58\" y=\"230.43\" text-anchor=\"start\" font-size=\"14\" fill=\"#2F7A66\" font-weight=\"600\" class=\"\">过滤条件能显著缩小输入</text><rect x=\"720\" y=\"200\" width=\"640\" height=\"54\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\"/><text x=\"738\" y=\"230.43\" text-anchor=\"start\" font-size=\"14\" fill=\"#BE653B\" font-weight=\"600\" class=\"\">多对多未去重 → 输出是组合乘法</text><rect x=\"40\" y=\"262\" width=\"640\" height=\"54\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\"/><text x=\"58\" y=\"292.43\" text-anchor=\"start\" font-size=\"14\" fill=\"#2F7A66\" font-weight=\"600\" class=\"\">报表与分析的大批量等值连接</text><rect x=\"720\" y=\"262\" width=\"640\" height=\"54\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\"/><text x=\"738\" y=\"292.43\" text-anchor=\"start\" font-size=\"14\" fill=\"#BE653B\" font-weight=\"600\" class=\"\">模糊匹配 / 范围 / 距离 → 专门索引</text><rect x=\"40\" y=\"330\" width=\"310\" height=\"84\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\"/><text x=\"56\" y=\"368.488\" text-anchor=\"start\" font-size=\"15\" fill=\"#245A6B\" font-weight=\"700\" class=\"mono\">EXISTS</text><text x=\"56\" y=\"383.688\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">优化器可能转成 semi join</text><rect x=\"375\" y=\"330\" width=\"310\" height=\"84\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.2\"/><text x=\"391\" y=\"368.488\" text-anchor=\"start\" font-size=\"15\" fill=\"#AE8A3E\" font-weight=\"700\" class=\"mono\">LEFT / FULL JOIN</text><text x=\"391\" y=\"383.688\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">保留未匹配行并补 NULL</text><rect x=\"710\" y=\"330\" width=\"310\" height=\"84\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\"/><text x=\"726\" y=\"368.488\" text-anchor=\"start\" font-size=\"15\" fill=\"#2F7A66\" font-weight=\"700\" class=\"mono\">先去重 / 定粒度</text><text x=\"726\" y=\"383.688\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">避免多对多组合乘法</text><rect x=\"1045\" y=\"330\" width=\"310\" height=\"84\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\"/><text x=\"1061\" y=\"368.488\" text-anchor=\"start\" font-size=\"15\" fill=\"#BE653B\" font-weight=\"700\" class=\"mono\">专门索引 / 分桶</text><text x=\"1061\" y=\"383.688\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">相似度、范围、地理距离</text></svg>","ctrl":"","anim":false},{"eyebrow":"收束 · 七阶坑","title":"七个常见坑，越底层的越致命","lede":"从漏写条件、混用 outer 经验，到误判算法、只看 work_mem、忽略 Join Filter，再到过期统计和 hint 思维。","caption":"图 26　七阶地层：表层是写法坑，底层是统计信息与调优思维坑。","bridge":"收束：把一条 SQL 的三段旅程，和六个值得继续追问的问题留给你。","notes":"按地层从浅到深排一遍。第一阶，漏写 join 条件：FROM a, b 或 JOIN b ON true 生成笛卡尔积，小表测试没问题，上线直接爆炸。第二阶，把 outer join 经验误套到 inner join 或反过来，inner 里 ON 和 WHERE 常可交换，outer 里不可交换，别凭一次计划形状做通用结论。\n\n第三阶，看到 Hash Join 就以为不需要索引：它本身不靠索引 probe，但索引可能帮它先过滤输入，也可能让替代计划更好。第四阶，看到 Nested Loop 就判定计划错了：小 outer 加参数化 inner index scan 正是它的优势区间，危险的是 outer 实际行数远大于估算。第五阶，只调 work_mem 不看并发：一条 SQL 可能有多个 hash / sort 节点，多个并发会乘上去，调大内存可能修好一条报表、压垮整个实例。\n\n第六阶，忽略 Join Filter 的过滤量：Rows Removed by Join Filter 很大，说明真正条件太晚才执行，要考虑索引、表达式改写、预过滤或拆分查询。最底下一阶，统计信息过期还抱着 hint 思维：PostgreSQL 核心并不以 hint 为主要调优方式，多数 join 误选应该先修统计信息、索引、SQL 形态和参数边界。\n\n越底层的坑越致命，因为上层的判断全都建立在它的输出之上。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40\" y=\"8\" width=\"70\" height=\"52\" rx=\"0\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.2\"/><text x=\"75\" y=\"37.185\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"\">第 1 阶</text><rect x=\"110\" y=\"8\" width=\"1250\" height=\"52\" rx=\"0\" fill=\"#EBF1EE\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"130\" y=\"37.7975\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#1B2B33\" font-weight=\"500\" class=\"\">漏写 join 条件：ON true / FROM a, b 生成笛卡尔积</text><rect x=\"40\" y=\"67\" width=\"70\" height=\"52\" rx=\"0\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.2\"/><text x=\"75\" y=\"96.185\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"\">第 2 阶</text><rect x=\"110\" y=\"67\" width=\"1250\" height=\"52\" rx=\"0\" fill=\"#CFE0DC\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"130\" y=\"96.7975\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#1B2B33\" font-weight=\"500\" class=\"\">把 outer join 经验误套到 inner join，或反过来</text><rect x=\"40\" y=\"126\" width=\"70\" height=\"52\" rx=\"0\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.2\"/><text x=\"75\" y=\"155.185\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"\">第 3 阶</text><rect x=\"110\" y=\"126\" width=\"1250\" height=\"52\" rx=\"0\" fill=\"#A4C4C6\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"130\" y=\"155.798\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#1B2B33\" font-weight=\"500\" class=\"\">看到 Hash Join 就以为不需要索引</text><rect x=\"40\" y=\"185\" width=\"70\" height=\"52\" rx=\"0\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.2\"/><text x=\"75\" y=\"214.185\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"\">第 4 阶</text><rect x=\"110\" y=\"185\" width=\"1250\" height=\"52\" rx=\"0\" fill=\"#74A5AD\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"130\" y=\"214.798\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#1B2B33\" font-weight=\"500\" class=\"\">看到 Nested Loop 就判定计划错了</text><rect x=\"40\" y=\"244\" width=\"70\" height=\"52\" rx=\"0\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.2\"/><text x=\"75\" y=\"273.185\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"\">第 5 阶</text><rect x=\"110\" y=\"244\" width=\"1250\" height=\"52\" rx=\"0\" fill=\"#47808D\" stroke=\"#1E4B5A\" stroke-width=\"1.2\"/><text x=\"130\" y=\"273.797\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#FFFFFF\" font-weight=\"500\" class=\"\">只调 work_mem 不看并发，多节点内存会相乘</text><rect x=\"40\" y=\"303\" width=\"70\" height=\"52\" rx=\"0\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.2\"/><text x=\"75\" y=\"332.185\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"\">第 6 阶</text><rect x=\"110\" y=\"303\" width=\"1250\" height=\"52\" rx=\"0\" fill=\"#2E6373\" stroke=\"#1E4B5A\" stroke-width=\"1.2\"/><text x=\"130\" y=\"332.797\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#FFFFFF\" font-weight=\"600\" class=\"\">忽略 Rows Removed by Join Filter 的过滤量</text><rect x=\"40\" y=\"362\" width=\"70\" height=\"52\" rx=\"0\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.2\"/><text x=\"75\" y=\"391.185\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"\">第 7 阶</text><rect x=\"110\" y=\"362\" width=\"1250\" height=\"52\" rx=\"0\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.2\"/><text x=\"130\" y=\"391.797\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#FFFFFF\" font-weight=\"600\" class=\"\">统计信息过期还抱着 hint 思维，不先修统计与 SQL 形态</text></svg>","ctrl":"","anim":false},{"eyebrow":"收束 · 三段旅程","title":"一条 SQL，三段旅程，六个问题","lede":"语义定义结果，优化器搜索路径，执行器生产 tuple；真正要长期练的，是把 EXPLAIN 里的现象翻译回这三段中的某一处。","caption":"图 27　三段旅程的总览，以及六个落在「成本与边界」上的扩展问题。","bridge":"下一讲，我们把其中某一种物理算法单独拆开讲透。","notes":"最后收一下。第一段旅程是语义：inner join 只保留连接条件为 true 的行对，false 和 NULL 都不输出，也不补 NULL；ON、USING 决定哪些行对匹配，WHERE 继续过滤结果，INNER 关键字可以省略。第二段是路径：query_planner() 铺好基础关系，standard_join_search() 用动态规划长出 join relation，add_paths_to_joinrel() 让多条候选路径带着成本、顺序、参数化、并行属性竞争，create_join_plan() 把胜出者翻译成计划节点。第三段是执行：Hash Cond、Merge Cond 负责定位，Join Filter 负责候选检查，Filter 负责返回前过滤，三类执行器最后都要过 joinqual 和 otherqual 这道闸门。\n\n留六个问题给你带回去。第一，orders.customer_id 上没有索引，region = 'CN' 选择率很低时 Nested Loop 还一定好吗？第二，Hash Join 的 build 侧该选小表还是过滤后更小的一侧，小表行很宽怎么办？第三，两边都有 B-tree 时 Merge Join 一定比 Hash Join 好吗，随机 I/O、排序复用、输出顺序怎么算进去？第四，先 join 两个大事实表再过滤维表，和反过来，哪个中间结果更危险？第五，为什么 inner join 里 ON 与 WHERE 语义可交换，EXPLAIN 却把它们显示在不同字段？第六，某个租户占全表八成数据，普通单列统计信息对 join 行数估算有什么风险？\n\n这六个问题没有一个是语法问题，全都落在成本和边界上。能顺着三段旅程把它们定位到具体某一层，这一讲就算没白听。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40\" y=\"16\" width=\"420\" height=\"96\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\"/><text x=\"58\" y=\"61.1375\" text-anchor=\"start\" font-size=\"20\" fill=\"#245A6B\" font-weight=\"700\" class=\"serif\">语义</text><text x=\"58\" y=\"78.8075\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">只保留 true 行对，不补 NULL</text><path d=\"M460 64 L490 64\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"/><polygon points=\"482,60 490,64 482,68\" fill=\"#245A6B\"/><rect x=\"490\" y=\"16\" width=\"420\" height=\"96\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.2\"/><text x=\"508\" y=\"61.1375\" text-anchor=\"start\" font-size=\"20\" fill=\"#AE8A3E\" font-weight=\"700\" class=\"serif\">路径</text><text x=\"508\" y=\"78.8075\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">DP 搜顺序，候选 path 竞争</text><path d=\"M910 64 L940 64\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"/><polygon points=\"932,60 940,64 932,68\" fill=\"#245A6B\"/><rect x=\"940\" y=\"16\" width=\"420\" height=\"96\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\"/><text x=\"958\" y=\"61.1375\" text-anchor=\"start\" font-size=\"20\" fill=\"#2F7A66\" font-weight=\"700\" class=\"serif\">执行</text><text x=\"958\" y=\"78.8075\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">定位条件、Join Filter、共同闸门</text><rect x=\"40\" y=\"128\" width=\"640\" height=\"84\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"58\" y=\"166.365\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"600\" class=\"\">① 没有 inner 索引，低选择率时 Nested Loop 还一定好吗</text><text x=\"58\" y=\"181.4\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" class=\"\">都落在「成本与边界」上，而不是语法上</text><rect x=\"720\" y=\"128\" width=\"640\" height=\"84\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"738\" y=\"166.365\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"600\" class=\"\">② build 侧选小表还是过滤后更小的一侧，行很宽呢</text><text x=\"738\" y=\"181.4\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" class=\"\">都落在「成本与边界」上，而不是语法上</text><rect x=\"40\" y=\"220\" width=\"640\" height=\"84\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"58\" y=\"258.365\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"600\" class=\"\">③ 两边都有 B-tree 时 Merge Join 一定更好吗</text><text x=\"58\" y=\"273.4\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" class=\"\">都落在「成本与边界」上，而不是语法上</text><rect x=\"720\" y=\"220\" width=\"640\" height=\"84\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"738\" y=\"258.365\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"600\" class=\"\">④ 先 join 两个大事实表，还是先过滤维表</text><text x=\"738\" y=\"273.4\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" class=\"\">都落在「成本与边界」上，而不是语法上</text><rect x=\"40\" y=\"312\" width=\"640\" height=\"84\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"58\" y=\"350.365\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"600\" class=\"\">⑤ 语义可交换，EXPLAIN 为何仍分栏显示</text><text x=\"58\" y=\"365.4\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" class=\"\">都落在「成本与边界」上，而不是语法上</text><rect x=\"720\" y=\"312\" width=\"640\" height=\"84\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"738\" y=\"350.365\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"600\" class=\"\">⑥ 单租户占八成数据，单列统计会怎么估错</text><text x=\"738\" y=\"365.4\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" class=\"\">都落在「成本与边界」上，而不是语法上</text></svg>","ctrl":"","anim":false}];

const N = D.length;
let cur = 0, autoTimer = null, autoOn = false;
let sideOpen = false, sideMode = 'note';
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const pad = n => String(n).padStart(2, '0');
const h = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* 文字宽度估算 → 标题 / 导语自动缩字号，保证零出界 */
function textW(s,z){ let w=0; for(const c of String(s)){
  w += (/[\u2E80-\uFFFF]/.test(c) ? 1 : (c === ' ' ? 0.34 : 0.58)) * z; } return w; }
function fitFont(s, base, maxw, min){ let z=base;
  while(textW(s,z) > maxw && z > min) z -= 0.5; return z; }

/* ---------- 舞台：等比缩放 + letterbox；讲稿展开时矢量缩到左侧 ---------- */
function fit(){
  const vp = $('#viewport');
  const W = vp.clientWidth, H = vp.clientHeight;
  const sw = sideOpen ? ($('#side').offsetWidth || 0) : 0;
  const availW = W - sw;
  const s = Math.min((availW - 24) / 1600, (H - 24) / 900);
  const st = $('#stage');
  st.style.transform = 'scale(' + s + ')';
  st.style.left = ((availW - 1600 * s) / 2) + 'px';
  st.style.top  = ((H - 900 * s) / 2) + 'px';
}
window.addEventListener('resize', fit);

function render(){
  $('#slides').innerHTML = D.map((d,i) =>
    '<section class="slide' + (d.anim ? ' anim' : '') + '" id="s' + i + '">'
    + '<div class="eyebrow"><span class="num">' + pad(i+1) + ' / ' + pad(N) + '</span>' + h(d.eyebrow) + '</div>'
    + '<h1 class="title" style="font-size:' + fitFont(d.title,44,1430,30) + 'px">' + h(d.title) + '</h1>'
    + '<div class="lede" style="font-size:' + fitFont(d.lede,19,1430,14) + 'px">' + h(d.lede) + '</div>'
    + '<div class="rule"></div>'
    + '<div class="figwrap">' + d.svg + '</div>'
    + '<div class="caption">' + h(d.caption) + '</div>'
    + (d.ctrl ? '<div class="ctrls">' + d.ctrl + '</div>' : '')
    + '<div class="bridge" style="font-size:' + fitFont(d.bridge,20,1410,16) + 'px">'
    + '<span class="bk">承接 · NEXT</span>' + h(d.bridge) + '</div>'
    + '<div class="footer"><div class="fbar"><i id="fbar' + i + '"></i></div>'
    + '<span class="fl">数据库筑基课 · INNER JOIN　｜　从语义到执行的三段旅程</span>'
    + '<span class="fr">' + pad(i+1) + ' / ' + pad(N) + '</span></div>'
    + '</section>').join('');
}

function toast(s){
  const t = $('#toast'); t.textContent = s; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 1900);
}
function go(i, silent){
  i = Math.max(0, Math.min(N-1, i));
  $$('.slide').forEach((el,k) => el.classList.toggle('on', k === i));
  cur = i;
  try{ localStorage.setItem('innerjoin-slide', String(i)); }catch(e){}
  $('#pg').textContent = pad(i+1) + ' / ' + pad(N);
  $('#track i').style.width = ((i+1)/N*100) + '%';
  for(let k=0;k<N;k++){ const b = $('#fbar'+k); if(b) b.style.width = (k<=i?100:0) + '%'; }
  pauseAnims();
  if(cur === 3) aPaint();
  if(cur === 18) bPaint();
  syncSide(true);
  if(!silent) toast(D[i].eyebrow + ' · ' + D[i].title);
}
function next(){ if(cur < N-1) go(cur+1); else stopAuto(); }
function prev(){ if(cur > 0) go(cur-1); }

function stopAuto(){
  autoOn = false; clearInterval(autoTimer); autoTimer = null;
  $('#btnAuto').textContent = '▶ 自动播放 P'; $('#btnAuto').classList.remove('act');
}
function toggleAuto(){
  if(autoOn){ stopAuto(); toast('已暂停自动播放'); return; }
  autoOn = true; $('#btnAuto').textContent = '❚❚ 暂停 P'; $('#btnAuto').classList.add('act');
  autoTimer = setInterval(() => { if(cur < N-1) go(cur+1, true); else stopAuto(); }, 12000);
  toast('自动播放：每 12 秒一页');
}

/* ---------- 右侧页内开窗：本页讲稿 / 全文讲稿 / 目录 / 帮助 ---------- */
function renderSide(){
  const body = $('#sideBody');
  if(sideMode === 'note'){
    $('#sideMode').textContent = '本页讲稿 · 页内开窗';
    $('#sideTitle').textContent = D[cur].title;
    body.innerHTML = noteSec(cur);
    body.scrollTop = 0;
  } else if(sideMode === 'all'){
    $('#sideMode').textContent = '全文讲稿 · 页内开窗';
    $('#sideTitle').textContent = '共 ' + N + ' 页 · 已定位到当前页';
    body.innerHTML = D.map((d,i) => noteSec(i)).join('');
  } else if(sideMode === 'toc'){
    $('#sideMode').textContent = '目录 · 页内开窗';
    $('#sideTitle').textContent = '点击任意一页跳转';
    body.innerHTML = '<div class="tocgrid">' + D.map((d,i) =>
      '<button class="tocitem" id="toc' + i + '" onclick="jump(' + i + ')">'
      + '<span class="tn">' + pad(i+1) + ' / ' + pad(N) + '</span>' + h(d.title) + '</button>').join('') + '</div>';
  } else {
    $('#sideMode').textContent = '快捷键 · 页内开窗';
    $('#sideTitle').textContent = '演说时的操作备忘';
    body.innerHTML = '<div class="keys">'
      + '<div><kbd>→ / 空格 / PageDown</kbd>下一页</div>'
      + '<div><kbd>← / PageUp</kbd>上一页</div>'
      + '<div><kbd>G</kbd>目录（再按一次关闭）</div>'
      + '<div><kbd>N</kbd>本页讲稿（再按一次关闭）</div>'
      + '<div><kbd>T</kbd>全文讲稿，自动定位当前页（再按一次关闭）</div>'
      + '<div><kbd>P</kbd>自动播放 / 暂停</div>'
      + '<div><kbd>F</kbd>全屏 / 退出全屏；按键条始终在底部</div>'
      + '<div><kbd>1–9</kbd>直接跳到第 1–9 页</div>'
      + '<div><kbd>Home / End</kbd>首页 / 末页</div>'
      + '<div><kbd>? / H</kbd>本帮助</div>'
      + '<div><kbd>Esc</kbd>关闭讲稿窗 / 退出全屏</div>'
      + '<div><kbd>输入框聚焦时</kbd>快捷键暂时让位给输入</div>'
      + '</div>';
    body.scrollTop = 0;
  }
  markCur();
}
function noteSec(i){
  const d = D[i];
  const paras = d.notes.split(/\n\s*\n/).map(p => '<p>' + h(p.trim()) + '</p>').join('');
  return '<div class="nsec" id="nsec' + i + '">'
    + '<div class="nmeta">' + pad(i+1) + ' / ' + pad(N) + '　' + h(d.eyebrow) + '</div>'
    + '<h3>' + h(d.title) + '</h3>' + paras
    + '<div class="nbridge">承接 · NEXT　' + h(d.bridge) + '</div></div>';
}
function markCur(){
  $$('.nsec').forEach(el => el.classList.remove('cur'));
  $$('.tocitem').forEach(el => el.classList.remove('cur'));
  const a = $('#nsec' + cur), b = $('#toc' + cur);
  if(a) a.classList.add('cur');
  if(b) b.classList.add('cur');
}
function syncSide(smooth){
  if(!sideOpen) return;
  if(sideMode === 'note'){ renderSide(); return; }
  if(sideMode !== 'all' && sideMode !== 'toc') return;
  markCur();
  const el = $('#nsec' + cur) || $('#toc' + cur);
  if(el){
    const body = $('#sideBody');
    const top = Math.max(0, el.offsetTop - 12);
    const delta = Math.abs(top - body.scrollTop);
    body.scrollTo({top: top, behavior: (smooth && delta < 1400) ? 'smooth' : 'instant'});
  }
}
function openSide(mode){
  if(sideOpen && sideMode === mode){ closeSide(); return; }
  sideMode = mode; sideOpen = true;
  $('#side').classList.add('on');
  document.body.classList.add('sideOpen');
  $('#btnToc').classList.toggle('act', mode === 'toc');
  $('#btnNotes').classList.toggle('act', mode === 'note');
  $('#btnAll').classList.toggle('act', mode === 'all');
  $('#btnHelp').classList.toggle('act', mode === 'help');
  renderSide();
  fit();
  requestAnimationFrame(() => syncSide(false));
  toast(mode === 'note' ? '本页讲稿已展开（再按 N 关闭）'
       : mode === 'all' ? '全文讲稿已展开，已定位当前页（再按 T 关闭）'
       : mode === 'toc' ? '目录已展开（再按 G 关闭）' : '快捷键帮助已展开');
}
function closeSide(){
  sideOpen = false;
  $('#side').classList.remove('on');
  document.body.classList.remove('sideOpen');
  ['btnToc','btnNotes','btnAll','btnHelp'].forEach(id => $('#'+id).classList.remove('act'));
  fit();
  toast('讲稿窗已关闭');
}
function jump(i){ go(i); }

/* ---------- 全屏：底部按键条始终可见 ---------- */
function fs(){
  const entering = !document.body.classList.contains('fs');
  if(entering){
    document.body.classList.add('fs');
    try{
      const pr = document.documentElement.requestFullscreen ? document.documentElement.requestFullscreen() : null;
      if(pr && pr.catch) pr.catch(() => {});
    }catch(e){}
    fit();
    toast('全屏：底部快捷键条保持可见');
  }else{
    document.body.classList.remove('fs');
    try{ if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen(); }catch(e){}
    fit();
    toast('已退出全屏');
  }
}
document.addEventListener('fullscreenchange', () => {
  if(!document.fullscreenElement) document.body.classList.remove('fs');
  fit();
});

document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  const typing = (tag === 'input' || tag === 'select' || tag === 'textarea');
  const k = e.key;
  if(k === 'Escape'){
    if(sideOpen) closeSide();
    else if(document.body.classList.contains('fs')) fs();
    return;
  }
  if(typing) return;               /* 输入控件聚焦时，快捷键让位给输入 */
  if(k === 'ArrowRight' || k === ' ' || k === 'PageDown'){ e.preventDefault(); next(); }
  else if(k === 'ArrowLeft' || k === 'PageUp'){ e.preventDefault(); prev(); }
  else if(k === 'f' || k === 'F'){ e.preventDefault(); fs(); }
  else if(k === 'g' || k === 'G'){ e.preventDefault(); openSide('toc'); }
  else if(k === 'n' || k === 'N'){ e.preventDefault(); openSide('note'); }
  else if(k === 't' || k === 'T'){ e.preventDefault(); openSide('all'); }
  else if(k === 'p' || k === 'P'){ e.preventDefault(); toggleAuto(); }
  else if(k === '?' || k === 'h' || k === 'H'){ e.preventDefault(); openSide('help'); }
  else if(k === 'Home'){ e.preventDefault(); go(0); }
  else if(k === 'End'){ e.preventDefault(); go(N-1); }
  else if(/^[1-9]$/.test(k)){ go(parseInt(k,10) - 1); }
});

/* ---------- 内联 SVG 绘制助手（动画页现场重绘，几何固定、零遮挡） ---------- */
const C = {ink:'#1B2B33',ink2:'#46585F',muted:'#89938F',line:'#D9D5CB',white:'#FFFFFF',
  bg2:'#F1EFE9',primary:'#245A6B',primL:'#E5EFF0',accent:'#BE653B',accL:'#F7E9DE',
  green:'#2F7A66',greenL:'#E4F0EA',gold:'#AE8A3E',goldL:'#F5EDDC',
  L0:'#1E4B5A',L1:'#2E6373',L2:'#47808D',L3:'#74A5AD',L4:'#A4C4C6',L5:'#CFE0DC',L6:'#EBF1EE'};
function jEsc(v){ return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&apos;'); }
function jW(s,z){ let w=0; for(let i=0;i<s.length;i++){ const c=s[i];
  w += (/[\u2E80-\uFFFF]/.test(c) ? 1 : (c === ' ' ? 0.32 : 0.57)); } return w*z; }
function jTxt(s,x,y,z,fill,anchor,weight,cls,maxw){
  let sz=z, w=jW(s,sz);
  while(maxw && w > maxw && sz > 10){ sz = Math.round((sz-0.5)*10)/10; w = jW(s,sz); }
  return '<text x="'+x+'" y="'+y+'" text-anchor="'+(anchor||'middle')+'" font-size="'+sz
    +'" fill="'+fill+'" font-weight="'+(weight||400)+'" class="'+(cls||'')+'">'+jEsc(s)+'</text>';
}
function jRect(x,y,w,h,fill,stroke,sw){
  return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill
    +'" stroke="'+(stroke||fill)+'" stroke-width="'+(sw||1.2)+'"/>';
}
function jLine(x1,y1,x2,y2,color,sw){
  return '<path d="M'+x1+' '+y1+' L'+x2+' '+y2+'" stroke="'+color
    +'" stroke-width="'+(sw||1.4)+'" fill="none"/>';
}
function jBox(x,y,w,h,lines,fill,stroke,tc,size,weight,cls,pad){
  let s = jRect(x,y,w,h,fill,stroke,1.4);
  const p = pad || 16;
  const lh = lines.map(o => o[1]*1.15);
  const block = lh.reduce((a,b)=>a+b,0);
  let top = y + (h-block)/2;
  lines.forEach((o,i) => {
    s += jTxt(o[0], x+p, top + lh.slice(0,i).reduce((a,b)=>a+b,0) + o[1]*0.82,
              o[1], o[2] || tc, 'start', o[3] || weight || 400, cls || '', w-2*p);
  });
  return s;
}

/* ---------- 动画 A：inner join 行对逐对判定 ---------- */
const A_LDEF='7,9,42', A_RDEF='7,42,8,NULL';
let aL=[], aR=[], aSteps=[], aStep=-1, aTimer=null, aPlaying=false;
function aParse(raw, def){
  let parts = String(raw||'').split(/[,，\s]+/).filter(x => x.length).slice(0,6);
  let v = parts.map(x => {
    const t = x.toUpperCase();
    if(t === 'NULL' || t === 'N' || t === '∅') return null;
    const n = parseInt(x,10); return isNaN(n) ? undefined : n;
  }).filter(x => x !== undefined);
  if(!v.length) v = def.split(',').map(x => x.toUpperCase()==='NULL' ? null : Number(x));
  return v;
}
function aFmt(v){ return v === null ? 'NULL' : String(v); }
function aBuild(){
  aL = aParse($('#aL') ? $('#aL').value : A_LDEF, A_LDEF);
  aR = aParse($('#aR') ? $('#aR').value : A_RDEF, A_RDEF);
  aSteps = []; let out = [], checked = 0, kept = 0;
  aSteps.push({i:-1,j:-1,out:[],desc:'两条输入已就绪：共 '+aL.length+' × '+aR.length+' = '
    +(aL.length*aR.length)+' 个候选行对，按连接键逐对检查（输入 NULL 或 N 可观察 unknown）'});
  for(let i=0;i<aL.length;i++){
    for(let j=0;j<aR.length;j++){
      const lv=aL[i], rv=aR[j], checked0=++checked;
      const res = (lv===null || rv===null) ? 'NULL' : (lv===rv ? 'TRUE' : 'FALSE');
      if(res==='TRUE'){ out.push('R'+(i+1)+'·S'+(j+1)); kept++; }
      aSteps.push({i:i,j:j,lv:lv,rv:rv,res:res,out:out.slice(),checked:checked0,kept:kept,
        desc:'第 '+checked0+' 对：左 '+aFmt(lv)+' 与 右 '+aFmt(rv)+' → 条件为 '+res
          +'；'+(res==='TRUE' ? '输出这个行对' : (res==='NULL' ? 'unknown 不是 true，丢弃' : '条件不成立，丢弃'))});
    }
  }
  aSteps.push({i:-1,j:-1,out:out.slice(),done:true,checked:checked,kept:kept,
    desc:'完成：检查 '+checked+' 个行对，输出 '+kept+' 行；未匹配行直接消失，不补 NULL'});
  aStep = -1; aPaint();
}
function aPaint(){
  const host = $('#animA'); if(!host || !aL.length) return;
  const st = aStep < 0 ? null : aSteps[aStep];
  const out = st ? st.out : [], desc = st ? st.desc : aSteps[0].desc;
  let s = '';
  /* 左表 */
  s += jRect(40,24,250,230,C.L6,C.L3,1.2);
  s += jRect(40,24,250,40,C.L1,C.L1,1.2);
  s += jTxt('左表 orders (k)',54,50,15,C.white,'start',600,'',226);
  for(let i=0;i<aL.length;i++){
    const y=70+i*30, on = st && st.i===i;
    s += jRect(54,y,222,26,on?C.accL:C.white,on?C.accent:C.line,on?2:1.2);
    s += jTxt('R'+(i+1)+'　k = '+aFmt(aL[i]),66,y+18,13.5,on?C.accent:C.ink,'start',600,'mono',198);
  }
  /* 右表 */
  s += jRect(1110,24,250,230,C.L6,C.L3,1.2);
  s += jRect(1110,24,250,40,C.L1,C.L1,1.2);
  s += jTxt('右表 customers (k)',1124,50,15,C.white,'start',600,'',226);
  for(let j=0;j<aR.length;j++){
    const y=70+j*30, on = st && st.j===j;
    s += jRect(1124,y,222,26,on?C.accL:C.white,on?C.accent:C.line,on?2:1.2);
    s += jTxt('S'+(j+1)+'　k = '+aFmt(aR[j]),1136,y+18,13.5,on?C.accent:C.ink,'start',600,'mono',198);
  }
  /* 中间检查区 */
  s += jRect(320,24,760,230,C.white,C.line,1.2);
  s += jRect(320,24,760,44,C.primL,C.primary,1.2);
  s += jTxt('join condition　o.customer_id = c.customer_id',336,52,15,C.primary,'start',600,'mono',728);
  const res = st && st.res ? st.res : '—';
  const rcol = res==='TRUE'?C.green:res==='FALSE'?C.accent:res==='NULL'?C.gold:C.primary;
  const rfill = res==='TRUE'?C.greenL:res==='FALSE'?C.accL:res==='NULL'?C.goldL:C.bg2;
  s += jBox(340,84,210,66,[['左侧值',12.5,C.ink2,600],
    [st&&!st.done ? 'R'+(st.i+1)+'　'+aFmt(st.lv) : '待检查',16,rcol,700]],C.white,C.line,C.ink,14,600,'mono',14);
  s += jRect(570,84,260,66,rfill,rcol,2);
  s += jTxt('条件结果',700,108,12.5,C.ink2,'middle',500,'',236);
  s += jTxt(res,700,137,21,rcol,'middle',700,'mono',236);
  s += jBox(850,84,210,66,[['右侧值',12.5,C.ink2,600],
    [st&&!st.done ? 'S'+(st.j+1)+'　'+aFmt(st.rv) : '待检查',16,rcol,700]],C.white,C.line,C.ink,14,600,'mono',14);
  s += jRect(320,164,760,80,C.bg2,C.line,1.2);
  s += jTxt('TRUE → 输出行对',336,188,13,C.green,'start',600,'',230);
  s += jTxt('FALSE → 丢弃',576,188,13,C.accent,'start',600,'',230);
  s += jTxt('NULL / unknown → 丢弃',816,188,13,C.gold,'start',600,'',250);
  s += jTxt('SQL 的布尔过滤只接受 true；inner join 不会给未匹配行补 NULL',336,222,13,C.ink2,'start',400,'',710);
  /* 输出条 */
  s += jRect(40,268,1320,62,C.primL,C.primary,1.2);
  s += jTxt('inner join 结果',56,290,13,C.primary,'start',700,'',150);
  if(!out.length){
    s += jTxt('（暂无输出行对）',56,316,13,C.muted,'start',400,'',300);
  }else{
    const shown = out.slice(0,11);
    shown.forEach((v,k) => {
      const x = 200 + k*100;
      s += jRect(x,282,92,34,C.greenL,C.green,1.2);
      s += jTxt(v,x+46,305,12.5,C.green,'middle',600,'mono',82);
    });
    if(out.length>11) s += jTxt('… 共 '+out.length+' 行',1300,305,13,C.accent,'end',600,'',200);
  }
  /* 底部说明 */
  s += jRect(40,342,1320,76,C.white,C.line,1.2);
  s += jTxt(desc,60,368,14.5,C.ink,'start',600,'',1260);
  s += jTxt('左表 / 右表连接键可在下方输入修改；NULL 也可写作 N。读数由本页脚本实时计算。',
            60,398,12.5,C.ink2,'start',400,'',1260);
  host.innerHTML = s;
  const o = $('#aOut');
  if(o) o.innerHTML = aStep < 0
    ? '<b>准备就绪</b> 共 ' + aSteps.length + ' 步，可播放 / 单步 / 重置'
    : '<b>第 ' + (aStep+1) + ' / ' + aSteps.length + ' 步</b> ' + jEsc(desc);
}
function aPause(){
  aPlaying = false; clearInterval(aTimer); aTimer = null;
  const b = $('#aPlay'); if(b){ b.textContent = '▶ 播放'; b.classList.remove('play'); }
}
function aPlay(){
  if(aPlaying){ aPause(); return; }
  aPlaying = true; const b = $('#aPlay'); if(b){ b.textContent = '❚❚ 暂停'; b.classList.add('play'); }
  if(aStep >= aSteps.length-1) aStep = -1;
  aTimer = setInterval(() => { aStep++; aPaint(); if(aStep >= aSteps.length-1) aPause(); }, 720);
}
function aTick(){ aPause(); if(aStep < aSteps.length-1){ aStep++; aPaint(); } }
function aReset(){ aPause(); aBuild(); toast('行对演示已重置'); }

/* ---------- 动画 B：估算误差如何把计划推错（示意模型，非实测） ---------- */
const REAL_STEPS = [100,1000,10000,100000,1000000];
const BUILD = 20, PROBE = 0.002;      /* 固定 build 与每行 probe：可调假设，示意单位 */
let bSweep = 0, bTimer = null, bPlaying = false;
function bUnit(){ const v = $('#bCost') ? +$('#bCost').value : 8; return v/400; }
function bFmt(v){ return v >= 1000 ? v.toLocaleString('en-US') : v.toFixed(1); }
function bCalc(){
  const est = +($('#bEst') ? $('#bEst').value : 100);
  const real = +($('#bReal') ? $('#bReal').value : 100);
  const unit = bUnit();
  const nlEst = est*unit, hjEst = BUILD + est*PROBE;
  const nlReal = real*unit, hjReal = BUILD + real*PROBE;
  const pick = nlEst <= hjEst ? 'Nested Loop' : 'Hash Join';
  const best = nlReal <= hjReal ? 'Nested Loop' : 'Hash Join';
  const picked = pick === 'Nested Loop' ? nlReal : hjReal;
  const optimum = Math.min(nlReal,hjReal);
  return {est:est,real:real,unit:unit,nlEst:nlEst,hjEst:hjEst,
          nlReal:nlReal,hjReal:hjReal,pick:pick,best:best,
          ratio: optimum>0 ? picked/optimum : 1, hit: pick===best};
}
function bBar(x,y,w,val,maxv,color,label,valueTxt,chosen){
  const lab = label + (chosen ? '　← 选中' : '');
  let s = jTxt(lab,x,y,12.5,chosen?C.accent:C.ink2,'start',chosen?700:600,'',w-180);
  s += jTxt(valueTxt,x+w,y,12.5,color,'end',700,'mono',160);
  s += jRect(x,y+8,w,14,C.bg2,C.line,1);
  const bw = Math.max(2, w*Math.min(1,val/(maxv||1)));
  s += jRect(x,y+8,bw,14,color,chosen?C.accent:color,chosen?2.2:1);
  return s;
}
function bPaint(){
  const host = $('#animB'); if(!host) return;
  const r = bCalc();
  const cv = $('#bCostVal'); if(cv) cv.textContent = r.unit.toFixed(3);
  const mv = Math.max(r.nlEst,r.hjEst,r.nlReal,r.hjReal,1);
  let s = '';
  const metrics = [
    {t:'优化器估算的 outer',v:r.est.toLocaleString('en-US')+' 行',c:C.primary,sub:'来自统计信息与选择率估算'},
    {t:'真实发生的 outer',v:r.real.toLocaleString('en-US')+' 行',c:C.accent,sub:'估算偏差在这里产生'},
    {t:'优化器按估算选中',v:r.pick,c:C.gold,sub:'只看 est 侧两条成本'},
    {t:'真实最优计划',v:r.best,c:C.green,sub:'按 real 侧成本重新比较'},
  ];
  metrics.forEach((m,i) => {
    const x = 40 + 335*i;
    s += jRect(x,24,310,96,C.white,C.line,1.2);
    s += jTxt(m.t,x+16,46,12.5,C.muted,'start',400,'',278);
    s += jTxt(m.v,x+16,78,20,m.c,'start',700,'',278);
    s += jTxt(m.sub,x+16,104,11.5,C.ink2,'start',400,'',278);
  });
  s += jRect(40,134,640,176,C.primL,C.primary,1.2);
  s += jTxt('优化器看到的成本（估算 outer）',56,158,14.5,C.primary,'start',700,'',608);
  s += bBar(56,186,608,r.nlEst,mv,C.primary,'Nested Loop 估算 = est × 单次重扫',bFmt(r.nlEst),r.pick==='Nested Loop');
  s += bBar(56,248,608,r.hjEst,mv,C.gold,'Hash Join 估算 = build + est × probe',bFmt(r.hjEst),r.pick==='Hash Join');
  s += jRect(720,134,640,176,C.accL,C.accent,1.2);
  s += jTxt('真实发生的成本（实际 outer）',736,158,14.5,C.accent,'start',700,'',608);
  s += bBar(736,186,608,r.nlReal,mv,C.primary,'Nested Loop 真实 = real × 单次重扫',bFmt(r.nlReal),r.best==='Nested Loop');
  s += bBar(736,248,608,r.hjReal,mv,C.gold,'Hash Join 真实 = build + real × probe',bFmt(r.hjReal),r.best==='Hash Join');
  const ok = r.hit;
  s += jRect(40,322,1320,96,ok?C.greenL:C.accL,ok?C.green:C.accent,1.6);
  s += jTxt(ok ? '估算与实际一致：计划选择正确，成本比较没有失真'
                : '计划被推错：优化器按估算选 '+r.pick+'，真实最优是 '+r.best+'；实际代价约放大 '+r.ratio.toFixed(1)+' 倍',
            60,352,16.5,ok?C.green:C.accent,'start',700,'',1260);
  s += jTxt('示意模型：build 固定 20、每行 probe 0.002、单次重扫成本可调；所有读数由本页脚本实时计算，不是 PostgreSQL 实测基准。',
            60,380,12.5,C.ink2,'start',400,'',1260);
  s += jTxt('真实环境还受统计信息、索引、数据倾斜、work_mem、并发与硬件影响；调 join 先修统计与 SQL 形态。',
            60,402,12.5,C.ink2,'start',400,'',1260);
  host.innerHTML = s;
  const o = $('#bOut');
  if(o) o.innerHTML = '<b>est ' + r.est.toLocaleString('en-US') + ' / real '
    + r.real.toLocaleString('en-US') + '</b>　选中 ' + r.pick + '　最优 ' + r.best
    + (ok ? '　✓ 一致' : '　✗ 放大 ' + r.ratio.toFixed(1) + ' 倍');
}
function bPause(){
  bPlaying = false; clearInterval(bTimer); bTimer = null;
  const b = $('#bPlay'); if(b){ b.textContent = '▶ 播放'; b.classList.remove('play'); }
}
function bSetStep(k){
  bSweep = Math.max(0, Math.min(REAL_STEPS.length-1, k));
  const el = $('#bReal'); if(el) el.value = String(REAL_STEPS[bSweep]);
  bPaint();
}
function bPlay(){
  if(bPlaying){ bPause(); return; }
  bPlaying = true; const b = $('#bPlay'); if(b){ b.textContent = '❚❚ 暂停'; b.classList.add('play'); }
  if(bSweep >= REAL_STEPS.length-1) bSetStep(0);
  bTimer = setInterval(() => {
    if(bSweep >= REAL_STEPS.length-1){ bPause(); return; }
    bSetStep(bSweep+1);
  }, 820);
}
function bTick(){ bPause(); if(bSweep >= REAL_STEPS.length-1) bSetStep(0); else bSetStep(bSweep+1); }
function bReset(){ bPause(); bSetStep(0); toast('推演已重置：实际行数 = 估算行数'); }
function pauseAnims(){ aPause(); bPause(); }

/* ---------- 启动 ---------- */
function init(){
  render(); fit();
  let saved = 0;
  try{ saved = parseInt(localStorage.getItem('innerjoin-slide') || '0', 10) || 0; }catch(e){}
  go(Math.max(0, Math.min(N-1, saved)), true);
  $('#btnPrev').onclick = prev; $('#btnNext').onclick = next;
  $('#btnToc').onclick = () => openSide('toc');
  $('#btnNotes').onclick = () => openSide('note');
  $('#btnAll').onclick = () => openSide('all');
  $('#btnAuto').onclick = toggleAuto;
  $('#btnFs').onclick = fs;
  $('#btnHelp').onclick = () => openSide('help');
  $('#sideClose').onclick = closeSide;
  aBuild(); bPaint();
  const al = $('#aL'), ar = $('#aR');
  if(al) al.addEventListener('change', () => { aPause(); aBuild(); });
  if(ar) ar.addEventListener('change', () => { aPause(); aBuild(); });
  const be = $('#bEst'), br = $('#bReal'), bc = $('#bCost');
  if(be) be.addEventListener('change', () => { bPause(); bPaint(); });
  if(br) br.addEventListener('change', () => {
    bPause(); const v = +br.value; const k = REAL_STEPS.indexOf(v);
    bSweep = k < 0 ? 0 : k; bPaint();
  });
  if(bc) bc.addEventListener('input', () => { bPause(); bPaint(); });
  const bind = (id, fn) => { const el = $(id); if(el) el.onclick = fn; };
  bind('#aPlay', aPlay); bind('#aTick', aTick); bind('#aReset', aReset);
  bind('#bPlay', bPlay); bind('#bTick', bTick); bind('#bReset', bReset);
}
document.addEventListener('DOMContentLoaded', init);
