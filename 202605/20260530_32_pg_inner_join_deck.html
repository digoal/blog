=\"56\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"1200\" y=\"155.308\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">可用，需有序输入</text><rect x=\"40\" y=\"186\" width=\"320\" height=\"56\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"56\" y=\"217.43\" text-anchor=\"start\" font-size=\"14\" fill=\"#1B2B33\" font-weight=\"600\" class=\"\">两侧已有有序输入</text><rect x=\"360\" y=\"186\" width=\"340\" height=\"56\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"530\" y=\"217.308\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">可用</text><rect x=\"700\" y=\"186\" width=\"340\" height=\"56\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\"/><text x=\"870\" y=\"217.308\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#BE653B\" font-weight=\"400\" class=\"\">顺序会被打乱</text><rect x=\"1040\" y=\"186\" width=\"320\" height=\"56\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\"/><text x=\"1200\" y=\"217.308\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#2F7A66\" font-weight=\"600\" class=\"\">优势区间</text><rect x=\"40\" y=\"248\" width=\"320\" height=\"56\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"56\" y=\"279.43\" text-anchor=\"start\" font-size=\"14\" fill=\"#1B2B33\" font-weight=\"600\" class=\"\">首行延迟敏感</text><rect x=\"360\" y=\"248\" width=\"340\" height=\"56\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\"/><text x=\"530\" y=\"279.308\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#2F7A66\" font-weight=\"600\" class=\"\">优势：启动成本低</text><rect x=\"700\" y=\"248\" width=\"340\" height=\"56\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\"/><text x=\"870\" y=\"279.308\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#BE653B\" font-weight=\"400\" class=\"\">需先 build 完</text><rect x=\"1040\" y=\"248\" width=\"320\" height=\"56\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\"/><text x=\"1200\" y=\"279.308\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#BE653B\" font-weight=\"400\" class=\"\">需排序则启动慢</text><rect x=\"40\" y=\"310\" width=\"320\" height=\"56\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"56\" y=\"341.43\" text-anchor=\"start\" font-size=\"14\" fill=\"#1B2B33\" font-weight=\"600\" class=\"\">内存 / 并发压力高</text><rect x=\"360\" y=\"310\" width=\"340\" height=\"56\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\"/><text x=\"530\" y=\"341.308\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#2F7A66\" font-weight=\"600\" class=\"\">通常低，Memoize 例外</text><rect x=\"700\" y=\"310\" width=\"340\" height=\"56\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\"/><text x=\"870\" y=\"341.308\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#BE653B\" font-weight=\"400\" class=\"\">Batches 变大要警惕</text><rect x=\"1040\" y=\"310\" width=\"320\" height=\"56\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\"/><text x=\"1200\" y=\"341.308\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#BE653B\" font-weight=\"400\" class=\"\">Sort 可能写临时文件</text><rect x=\"40\" y=\"372\" width=\"1320\" height=\"46\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"58\" y=\"398.43\" text-anchor=\"start\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" class=\"\">优势区间是成本形状推出来的结果，不是挂在算法名字上的标签；本表为定性判断，不含性能数字</text></svg>","ctrl":"","anim":false},{"eyebrow":"执行层 · 条件分工","title":"一条 ON 条件，会被拆成好几个执行位置","lede":"joinqual 来自 JOIN/ON 或 USING，plan.qual 来自 WHERE；物理算法还会把能利用的条件再拆成定位条件和检查条件。","caption":"图 16　Hash Cond / Merge Cond 是算法能直接利用的条件；Join Filter 是组合候选后的检查；Filter 是返回前过滤。","bridge":"位置不同，但三类执行器最后都守着同一道闸门。","notes":"现在把一条带多个条件的 SQL 拆开看：FROM a JOIN b ON a.k = b.k AND a.ts < b.ts WHERE a.status = 'ok'。\n\na.k = b.k 是等值条件，Hash Join 会把它变成 Hash Cond，用来算 hash 值、定位 bucket；Merge Join 会把它变成 Merge Cond，用来同步两侧有序流。这类条件是物理算法能直接利用的，属于「定位」性质。\n\na.ts < b.ts 是非等值条件，没法建 hash，也没法当 merge key，于是留在 Join Filter：候选 tuple 已经组合出来了，再逐对检查它算不算匹配。a.status = 'ok' 来自 WHERE，属于 plan.qual，通常显示为 Filter，也可能被下推到单表扫描节点先做掉。\n\nexplain.c 的展示顺序也照这个分工：HashJoin 先显示 Hash Cond，再显示 Join Filter 和 Filter；MergeJoin 先显示 Merge Cond；NestLoop 没有专门的 hash/merge 条件，通常显示 Join Filter，或者把参数化索引条件下推到 inner 扫描节点。\n\n这里正好接回第七页：inner join 中这些条件语义可交换，但执行位置不同、能利用的数据结构也不同。语义等价是逻辑层的结论，字段分栏是执行层的事实，两件事别混。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40\" y=\"16\" width=\"1320\" height=\"64\" rx=\"0\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.2\"/><text x=\"700\" y=\"52.165\" text-anchor=\"middle\" font-size=\"17\" fill=\"#FFFFFF\" font-weight=\"500\" class=\"mono\">FROM a JOIN b ON a.k = b.k AND a.ts &lt; b.ts  WHERE a.status = &apos;ok&apos;;</text><path d=\"M700 80 L700 96\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"/><path d=\"M185 96 L1190 96\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"/><path d=\"M185 96 L185 110\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.5\" stroke-linejoin=\"miter\"/><polygon points=\"181,102 185,110 189,102\" fill=\"#245A6B\"/><path d=\"M520 96 L520 110\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.5\" stroke-linejoin=\"miter\"/><polygon points=\"516,102 520,110 524,102\" fill=\"#245A6B\"/><path d=\"M855 96 L855 110\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.5\" stroke-linejoin=\"miter\"/><polygon points=\"851,102 855,110 859,102\" fill=\"#245A6B\"/><path d=\"M1190 96 L1190 110\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.5\" stroke-linejoin=\"miter\"/><polygon points=\"1186,102 1190,110 1194,102\" fill=\"#245A6B\"/><rect x=\"40\" y=\"110\" width=\"310\" height=\"150\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\"/><text x=\"56\" y=\"166.74\" text-anchor=\"start\" font-size=\"17\" fill=\"#245A6B\" font-weight=\"700\" class=\"mono\">Hash Cond</text><text x=\"56\" y=\"183.01\" text-anchor=\"start\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">hashclauses</text><text x=\"56\" y=\"197.96\" text-anchor=\"start\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">例如 a.k = b.k</text><text x=\"56\" y=\"212.91\" text-anchor=\"start\" font-size=\"13\" fill=\"#245A6B\" font-weight=\"600\" class=\"\">定位 bucket（Hash Join）</text><rect x=\"375\" y=\"110\" width=\"310\" height=\"150\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.2\"/><text x=\"391\" y=\"166.74\" text-anchor=\"start\" font-size=\"17\" fill=\"#AE8A3E\" font-weight=\"700\" class=\"mono\">Merge Cond</text><text x=\"391\" y=\"183.01\" text-anchor=\"start\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">mergeclauses</text><text x=\"391\" y=\"197.96\" text-anchor=\"start\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">例如 a.k = b.k</text><text x=\"391\" y=\"212.91\" text-anchor=\"start\" font-size=\"13\" fill=\"#AE8A3E\" font-weight=\"600\" class=\"\">同步有序流（Merge Join）</text><rect x=\"710\" y=\"110\" width=\"310\" height=\"150\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\"/><text x=\"726\" y=\"166.74\" text-anchor=\"start\" font-size=\"17\" fill=\"#BE653B\" font-weight=\"700\" class=\"mono\">Join Filter</text><text x=\"726\" y=\"183.01\" text-anchor=\"start\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">join.joinqual</text><text x=\"726\" y=\"197.96\" text-anchor=\"start\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">例如 a.ts &lt; b.ts</text><text x=\"726\" y=\"212.91\" text-anchor=\"start\" font-size=\"13\" fill=\"#BE653B\" font-weight=\"600\" class=\"\">候选组合后检查是否匹配</text><rect x=\"1045\" y=\"110\" width=\"310\" height=\"150\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\"/><text x=\"1061\" y=\"166.74\" text-anchor=\"start\" font-size=\"17\" fill=\"#2F7A66\" font-weight=\"700\" class=\"mono\">Filter</text><text x=\"1061\" y=\"183.01\" text-anchor=\"start\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">plan.qual</text><text x=\"1061\" y=\"197.96\" text-anchor=\"start\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">例如 a.status = &apos;ok&apos;</text><text x=\"1061\" y=\"212.91\" text-anchor=\"start\" font-size=\"13\" fill=\"#2F7A66\" font-weight=\"600\" class=\"\">返回前最终过滤</text><rect x=\"40\" y=\"276\" width=\"1320\" height=\"60\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"60\" y=\"309.92\" text-anchor=\"start\" font-size=\"16\" fill=\"#1B2B33\" font-weight=\"600\" class=\"serif\">执行位置链：物理定位条件 → 组合候选 tuple → Join Filter 检查 → Filter 返回前过滤</text><rect x=\"40\" y=\"348\" width=\"1320\" height=\"70\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\"/><text x=\"60\" y=\"378.913\" text-anchor=\"start\" font-size=\"15\" fill=\"#245A6B\" font-weight=\"600\" class=\"serif\">explain.c 展示顺序：HashJoin 先 Hash Cond，再 Join Filter / Filter；MergeJoin 先 Merge Cond</text><text x=\"60\" y=\"394.933\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">NestLoop 没有专门的 hash / merge 条件，通常显示 Join Filter，或把参数化条件下推到 inner 扫描节点</text></svg>","ctrl":"","anim":false},{"eyebrow":"执行层 · 共同闸门","title":"无论哪种算法，只有过了闸门才会返回 tuple","lede":"hash 命中只是候选，merge key 相等也只是候选；joinqual 和 otherqual 都通过，才会投影返回。","caption":"图 17　ExecNestLoop / ExecHashJoinImpl / ExecMergeJoin 三条主循环，末端是同一套检查。","bridge":"这道闸门，在 EXPLAIN 里是有名字的——学会读它，就等于拿到了诊断入口。","notes":"翻执行器源码，三类 join 的主循环长得很不一样，但结尾惊人地一致。\n\nExecNestLoop()：取一个 outer tuple，重扫 inner，ExecQual(joinqual, econtext) 通过后，再检查 otherqual，才投影返回。ExecHashJoinImpl()：先 build hash table，再 probe bucket；注意 hash 命中不等于匹配，它只是把候选范围缩小了，仍要执行 joinqual 和 otherqual。ExecMergeJoin()：merge key 同步到相等后进入 EXEC_MJ_JOINTUPLES 状态，再检查额外的 joinqual 和 otherqual。\n\n这个共同模式解释了两个很实际的现象。第一，为什么 EXPLAIN 里会有 Join Filter：定位条件只负责把候选凑到一起，真正的条件还在后面等着。第二，为什么 Rows Removed by Join Filter 会很大：说明定位条件挑出了海量候选组合，而决定性条件执行得太晚，前面的工作大半白做了。\n\n所以调 join 的一个核心动作，是想办法让「有区分度的条件」尽可能早地参与定位，而不是一直挂在闸门后面当看门的。索引、表达式改写、预过滤、拆分查询，都是围绕这件事做文章。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40\" y=\"16\" width=\"240\" height=\"72\" rx=\"0\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.2\"/><text x=\"160\" y=\"55.5525\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"mono\">ExecNestLoop()</text><rect x=\"300\" y=\"16\" width=\"740\" height=\"72\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"318\" y=\"55.3075\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">取 outer tuple → 重扫 inner → ExecQual(joinqual) → otherqual</text><path d=\"M1040 52 L1080 52\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"/><polygon points=\"1072,48 1080,52 1072,56\" fill=\"#245A6B\"/><rect x=\"40\" y=\"102\" width=\"240\" height=\"72\" rx=\"0\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.2\"/><text x=\"160\" y=\"141.552\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"mono\">ExecHashJoinImpl()</text><rect x=\"300\" y=\"102\" width=\"740\" height=\"72\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"318\" y=\"141.308\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">build hash table → probe bucket → 命中只是候选 → joinqual / otherqual</text><path d=\"M1040 138 L1080 138\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"/><polygon points=\"1072,134 1080,138 1072,142\" fill=\"#245A6B\"/><rect x=\"40\" y=\"188\" width=\"240\" height=\"72\" rx=\"0\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.2\"/><text x=\"160\" y=\"227.552\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"mono\">ExecMergeJoin()</text><rect x=\"300\" y=\"188\" width=\"740\" height=\"72\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"318\" y=\"227.308\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">merge key 同步相等 → EXEC_MJ_JOINTUPLES → 额外 joinqual / otherqual</text><path d=\"M1040 224 L1080 224\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"/><polygon points=\"1072,220 1080,224 1072,228\" fill=\"#245A6B\"/><rect x=\"1080\" y=\"16\" width=\"280\" height=\"244\" rx=\"0\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.2\"/><text x=\"1098\" y=\"90.905\" text-anchor=\"start\" font-size=\"19\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"serif\">共同闸门</text><text x=\"1098\" y=\"110.295\" text-anchor=\"start\" font-size=\"16\" fill=\"#FFFFFF\" font-weight=\"600\" class=\"mono\">joinqual</text><text x=\"1098\" y=\"127.875\" text-anchor=\"start\" font-size=\"15\" fill=\"#FFFFFF\" font-weight=\"400\" class=\"\">↓</text><text x=\"1098\" y=\"145.945\" text-anchor=\"start\" font-size=\"16\" fill=\"#FFFFFF\" font-weight=\"600\" class=\"mono\">otherqual</text><text x=\"1098\" y=\"163.525\" text-anchor=\"start\" font-size=\"15\" fill=\"#FFFFFF\" font-weight=\"400\" class=\"\">↓</text><text x=\"1098\" y=\"180.775\" text-anchor=\"start\" font-size=\"15\" fill=\"#FFFFFF\" font-weight=\"600\" class=\"\">投影返回 tuple</text><text x=\"1098\" y=\"196.385\" text-anchor=\"start\" font-size=\"13\" fill=\"#FFFFFF\" font-weight=\"400\" class=\"\">三类执行器都守着它</text><rect x=\"40\" y=\"280\" width=\"1320\" height=\"64\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"60\" y=\"315.92\" text-anchor=\"start\" font-size=\"16\" fill=\"#1B2B33\" font-weight=\"600\" class=\"serif\">hash 命中只是候选，merge key 相等也只是候选；条件没过闸门，tuple 不会被投影返回</text><rect x=\"40\" y=\"356\" width=\"1320\" height=\"62\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\"/><text x=\"60\" y=\"383.158\" text-anchor=\"start\" font-size=\"16\" fill=\"#BE653B\" font-weight=\"600\" class=\"serif\">Rows Removed by Join Filter 很大 = 定位条件挑出海量候选，决定性条件执行得太晚</text><text x=\"60\" y=\"399.507\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">调优方向：让有区分度的条件尽早参与定位——索引、表达式改写、预过滤或拆分查询</text></svg>","ctrl":"","anim":false},{"eyebrow":"诊断 · EXPLAIN 字段","title":"EXPLAIN 的字段名，就是诊断入口","lede":"Hash Cond、Merge Cond、Join Filter、Filter、Rows Removed by Join Filter、Batches——每个字段都对应执行链上的一个具体位置。","caption":"图 18　结构为示意，字段名来自 PostgreSQL explain.c；本页不展示任何实测数字。","bridge":"可计划为什么会选错？多半不是算法坏了，而是喂给成本模型的行数错了。","notes":"读 EXPLAIN 有个省力办法：别一行行看缩进，先把字段名和执行位置对上号。\n\n看到 Hash Cond，说明这是 Hash Join，等值条件被用来 build/probe 定位 bucket。看到 Merge Cond，说明两侧有序流按这个 key 同步。Join Filter 是候选组合之后的检查，它旁边的 Rows Removed by Join Filter 如果很大，就是上一页说的「闸门太靠后」。Filter 是返回前的最终过滤，通常对应 plan.qual。Hash Join 的 Batches 如果从 1 变大，说明 build 侧没装进内存，开始分批和写临时文件了。Sort 节点如果标了 external merge、Disk，说明排序也溢出了。\n\n再往外一层，看每个节点的 estimated rows 和 actual rows。EXPLAIN (ANALYZE, BUFFERS) 里这两个数字的偏离，是所有 join 慢查询的第一现场：估算错了，路径竞争的输入就错了，选出来的算法和顺序自然跟着错。\n\n原文特别声明过：本文没有执行 DEMO 里的 SQL，也不伪造 EXPLAIN ANALYZE 输出。我们这里画的是字段结构示意，不是任何机器的实测结果。真实数字请以你自己的数据分布、索引、统计信息和参数为准。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40\" y=\"16\" width=\"760\" height=\"398\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.4\"/><text x=\"60\" y=\"48\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"600\" class=\"mono\">Hash Join  (cost=... rows=...)</text><text x=\"60\" y=\"88\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"600\" class=\"mono\">  Hash Cond: (o.customer_id = c.customer_id)</text><text x=\"60\" y=\"128\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"600\" class=\"mono\">  Join Filter: (o.amount &gt; (c.customer_id % 500))</text><text x=\"60\" y=\"168\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"600\" class=\"mono\">  Rows Removed by Join Filter: ...</text><text x=\"60\" y=\"208\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">  -&gt;  Seq Scan on orders o</text><text x=\"60\" y=\"248\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">        Filter: (created_at &gt; ...)</text><text x=\"60\" y=\"288\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">  -&gt;  Hash</text><text x=\"60\" y=\"328\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"600\" class=\"mono\">        Buckets: ...  Batches: ...</text><text x=\"60\" y=\"368\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">        -&gt;  Seq Scan on customers c</text><rect x=\"830\" y=\"16\" width=\"530\" height=\"88\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\"/><text x=\"848\" y=\"56.3225\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#245A6B\" font-weight=\"700\" class=\"mono\">① Hash Cond / Merge Cond</text><text x=\"848\" y=\"72.0975\" text-anchor=\"start\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">算法能直接利用的等值定位条件</text><rect x=\"830\" y=\"116\" width=\"530\" height=\"88\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\"/><text x=\"848\" y=\"156.323\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#BE653B\" font-weight=\"700\" class=\"mono\">② Join Filter</text><text x=\"848\" y=\"172.097\" text-anchor=\"start\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">候选组合后的检查；看 Rows Removed 的量</text><rect x=\"830\" y=\"216\" width=\"530\" height=\"88\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\"/><text x=\"848\" y=\"256.322\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#2F7A66\" font-weight=\"700\" class=\"mono\">③ Filter</text><text x=\"848\" y=\"272.098\" text-anchor=\"start\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">返回前过滤，通常对应 plan.qual</text><rect x=\"830\" y=\"316\" width=\"530\" height=\"88\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.2\"/><text x=\"848\" y=\"356.322\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#AE8A3E\" font-weight=\"700\" class=\"mono\">④ Batches / Buckets / Disk</text><text x=\"848\" y=\"372.098\" text-anchor=\"start\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">从 1 变大或标 Disk，说明触碰内存边界</text></svg>","ctrl":"","anim":false},{"eyebrow":"诊断 · 估算误差","title":"慢 join 常常慢在估算误差，而不是算法本身","lede":"优化器不知道真实行数，只能依赖统计信息和成本模型；选择率低估、相关性缺失、数据倾斜、过期统计、内存边界误判都会把计划推偏。","caption":"图 19　可交互示意模型：调整估算行数、真实行数与单次重扫成本，观察计划如何被推错。","bridge":"把语义、成本、顺序、内存放在一起看，才能得到那张完整的对照表。","notes":"这一页请你亲手推一遍。左边这两个输入框是「优化器以为的 outer 行数」和「实际发生的 outer 行数」，滑块是 inner 单次重扫的单位成本。模型很简单：Nested Loop 成本约等于 outer 行数乘单次重扫成本，Hash Join 成本约等于一次固定的 build 加上按行数计的 probe。所有单位成本都是可调假设，是示意模型，不是 PostgreSQL 的实测基准。\n\n按播放，看实际行数一档档放大。估算只有一百行时，优化器算出来 Nested Loop 便宜，于是选它；可真实来了一百万行，重扫成本被放大一万倍，这时候 Hash Join 反而便宜得多。计划没变，输入变了，代价就乘着估算偏差一起放大。\n\n原文列了五类典型风险：选择率低估、多个过滤条件被近似独立估算带来的相关性缺失、热点 key 造成的数据倾斜、ANALYZE 不及时带来的过期统计信息、以及 Hash build 放不进内存或 Sort 写临时文件这类内存边界误判。它们不是五种互不相干的故障，而是同一条链上的不同环节：统计信息偏差 → 估算行数偏差 → 路径成本偏差 → 算法或顺序选错 → 资源被乘法放大。\n\n所以调 join 先修统计信息、索引和 SQL 形态，别急着关 enable 开关。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><g id=\"animB\"></g></svg>","ctrl":"<label>估算 outer</label><select id=\"bEst\"><option value=\"100\" selected>100 行</option><option value=\"1000\">1,000 行</option><option value=\"10000\">10,000 行</option></select><label>实际 outer</label><select id=\"bReal\"><option value=\"100\" selected>100 行</option><option value=\"1000\">1,000 行</option><option value=\"10000\">10,000 行</option><option value=\"100000\">100,000 行</option><option value=\"1000000\">1,000,000 行</option></select><label>单次重扫成本</label><input type=\"range\" id=\"bCost\" min=\"1\" max=\"40\" step=\"1\" value=\"8\"><span id=\"bCostVal\" class=\"val\">0.020</span><button class=\"btn play\" id=\"bPlay\">▶ 播放</button><button class=\"btn\" id=\"bTick\">单步 →</button><button class=\"btn\" id=\"bReset\">重置</button><div class=\"out\" id=\"bOut\"></div>","anim":true},{"eyebrow":"横评 · 完整对照","title":"SQL 只定义结果，不定义算法","lede":"把逻辑语义和三种物理实现并列，差异全部来自数据流和代价模型，而不是语法。","caption":"图 20　八个维度 × 四种视角：目标、条件、启动、成本、索引、内存、顺序、场景。","bridge":"能力是有账单的——组合能力越强，要管理的边界也越多。","notes":"这张对照表值得慢慢看，因为它把前面二十页的结论压在了一起。\n\n主要目标这一行：inner join 逻辑语义只负责保留满足条件的行对，三种实现分别用 outer 驱动 inner 查找、build hash table 后 probe、两侧有序流同步合并来完成它。常见条件这一行：逻辑层接受任意布尔表达式，Nested Loop 也能拿任意条件当过滤，但内表索引条件越好越强；Hash Join 主要依赖可哈希等值条件；Merge Join 主要依赖可排序等值条件。\n\n启动成本：Nested Loop 通常最低，能早出首行；Hash Join 得先 build 完；Merge Join 若需排序，启动成本最高。总成本形状前面讲过，不重复。索引价值：Nested Loop 最依赖 inner 侧参数化索引，Merge Join 可以吃 B-tree 的顺序，Hash Join 不靠索引完成 probe，但索引仍能帮它先过滤输入。内存压力：Hash Join 受 work_mem 乘 hash_mem_multiplier 影响，Merge Join 的 Sort/Materialize 受 work_mem 影响，Nested Loop 通常低，不过 Memoize、Materialize 是例外。\n\n输出顺序：SQL 从不承诺顺序；Nested Loop 通常跟 outer 路径相关，Hash Join 通常不保序，Merge Join 可以保留 merge key 顺序。把这张表和 EXPLAIN 对起来读，基本就能解释你在计划里看到的绝大多数形状。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40\" y=\"16\" width=\"200\" height=\"44\" rx=\"0\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.2\"/><text x=\"140\" y=\"41.5525\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"serif\">维度</text><rect x=\"240\" y=\"16\" width=\"280\" height=\"44\" rx=\"0\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.2\"/><text x=\"380\" y=\"41.5525\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"\">Inner 逻辑语义</text><rect x=\"520\" y=\"16\" width=\"280\" height=\"44\" rx=\"0\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.2\"/><text x=\"660\" y=\"41.5525\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"\">Nested Loop</text><rect x=\"800\" y=\"16\" width=\"280\" height=\"44\" rx=\"0\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.2\"/><text x=\"940\" y=\"41.5525\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"\">Hash Join</text><rect x=\"1080\" y=\"16\" width=\"280\" height=\"44\" rx=\"0\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.2\"/><text x=\"1220\" y=\"41.5525\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"\">Merge Join</text><rect x=\"40\" y=\"60\" width=\"200\" height=\"42\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"140\" y=\"84.3075\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"600\" class=\"\">主要目标</text><rect x=\"240\" y=\"60\" width=\"280\" height=\"42\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"380\" y=\"84.3075\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"400\" class=\"\">保留满足条件的行对</text><rect x=\"520\" y=\"60\" width=\"280\" height=\"42\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"660\" y=\"84.3075\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">outer 驱动 inner 查找</text><rect x=\"800\" y=\"60\" width=\"280\" height=\"42\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"940\" y=\"84.3075\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">build 后 probe</text><rect x=\"1080\" y=\"60\" width=\"280\" height=\"42\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"1220\" y=\"84.3075\" text-anch ass=\"\">通常低，Memoize 例外</text><rect x=\"800\" y=\"280\" width=\"280\" height=\"42\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"940\" y=\"304.308\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">work_mem × hash_mem_multiplier</text><rect x=\"1080\" y=\"280\" width=\"280\" height=\"42\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"1220\" y=\"304.308\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">Sort / Materialize</text><rect x=\"40\" y=\"324\" width=\"200\" height=\"42\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"140\" y=\"348.308\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"600\" class=\"\">输出顺序</text><rect x=\"240\" y=\"324\" width=\"280\" height=\"42\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"380\" y=\"348.308\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"400\" class=\"\">SQL 不承诺顺序</text><rect x=\"520\" y=\"324\" width=\"280\" height=\"42\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"660\" y=\"348.308\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">通常跟 outer 路径相关</text><rect x=\"800\" y=\"324\" width=\"280\" height=\"42\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"940\" y=\"348.308\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">通常不保序</text><rect x=\"1080\" y=\"324\" width=\"280\" height=\"42\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"1220\" y=\"348.308\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">可保留 merge key 顺序</text><rect x=\"40\" y=\"368\" width=\"200\" height=\"42\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"140\"
