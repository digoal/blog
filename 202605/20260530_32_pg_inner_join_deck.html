<script>
const D = [{"eyebrow":"数据库筑基课 · INNER JOIN","title":"INNER JOIN 不是一种算法，是一条链路","lede":"从「哪些行对会被保留」，到优化器怎么搜路径，再到执行器把条件放在哪——同一条 SQL 要穿过三层，才变成结果 tuple。","caption":"图 1　一条 SQL 的三段旅程：语义定义结果，规划挑选路径，执行器生产 tuple。","bridge":"先看这条链路的第一段——业务查询为什么非得把两张表重新拼起来。","notes":"很多人写 INNER JOIN 写了很多年，脑子里装的是一句话：按条件把两张表拼起来。这句话不算错，但它只描述了结果长什么样，没回答工程上真正要命的问题。\n\n我们今天换一个看法：inner join 不是某一种算法，而是一条链路。最上面一层是逻辑语义，它规定哪些行对算匹配、结果里有哪些列；中间一层是优化器，它在成千上万种路径组合里挑一条成本最低的；最下面一层是执行器，它按选中的物理算法，一条一条把 tuple 生产出来。\n\n这三层各自回答不同的问题，混在一起讲就会到处打架。比如你看到执行计划里是 Hash Join，就以为 SQL 写的是「hash join」——不是，SQL 只写了 JOIN，Hash Join 是优化器替你做的工程决定。反过来，你看到 Nested Loop 就判定计划错了，也常常是误判。\n\n所以这一讲的顺序是：先把语义钉死，再看优化器怎么搜，再看执行器怎么落地，最后用 EXPLAIN 把三层重新串起来。顺着这条链走一遍，你会发现线上那些慢 SQL，绝大多数不是语法问题，而是层与层之间的估算和边界没对上。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40\" y=\"16\" width=\"1320\" height=\"58\" rx=\"0\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1\"/><text x=\"700\" y=\"48.92\" text-anchor=\"middle\" font-size=\"16\" fill=\"#FFFFFF\" font-weight=\"500\" class=\"mono\">SELECT o.order_id, o.amount, c.region FROM orders o INNER JOIN customers c ON c.customer_id = o.customer_id WHERE c.region = &apos;CN&apos;;</text><rect x=\"40\" y=\"94\" width=\"72\" height=\"86\" rx=\"0\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.2\"/><text x=\"76\" y=\"141.9\" text-anchor=\"middle\" font-size=\"20\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"mono\">01</text><rect x=\"112\" y=\"94\" width=\"948\" height=\"86\" rx=\"0\" fill=\"#EBF1EE\" stroke=\"#74A5AD\" stroke-width=\"1.2\"/><text x=\"134\" y=\"141.655\" text-anchor=\"start\" font-size=\"19\" fill=\"#1B2B33\" font-weight=\"600\" class=\"serif\">语义层　定义哪些行对匹配、输出哪些列</text><rect x=\"40\" y=\"194\" width=\"72\" height=\"86\" rx=\"0\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.2\"/><text x=\"76\" y=\"241.9\" text-anchor=\"middle\" font-size=\"20\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"mono\">02</text><rect x=\"112\" y=\"194\" width=\"948\" height=\"86\" rx=\"0\" fill=\"#CFE0DC\" stroke=\"#47808D\" stroke-width=\"1.2\"/><text x=\"134\" y=\"241.655\" text-anchor=\"start\" font-size=\"19\" fill=\"#1B2B33\" font-weight=\"600\" class=\"serif\">规划层　枚举 join 顺序与候选路径，按成本竞争</text><rect x=\"40\" y=\"294\" width=\"72\" height=\"86\" rx=\"0\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.2\"/><text x=\"76\" y=\"341.9\" text-anchor=\"middle\" font-size=\"20\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"mono\">03</text><rect x=\"112\" y=\"294\" width=\"948\" height=\"86\" rx=\"0\" fill=\"#47808D\" stroke=\"#1E4B5A\" stroke-width=\"1.2\"/><text x=\"134\" y=\"341.655\" text-anchor=\"start\" font-size=\"19\" fill=\"#FFFFFF\" font-weight=\"600\" class=\"serif\">执行层　按物理算法生产 tuple，条件各就各位</text><rect x=\"1080\" y=\"94\" width=\"280\" height=\"286\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.4\"/><text x=\"1100\" y=\"146\" text-anchor=\"start\" font-size=\"19\" fill=\"#BE653B\" font-weight=\"700\" class=\"serif\">同一条 SQL</text><text x=\"1100\" y=\"180\" text-anchor=\"start\" font-size=\"19\" fill=\"#245A6B\" font-weight=\"700\" class=\"serif\">三次翻译</text><text x=\"1100\" y=\"214\" text-anchor=\"start\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" class=\"\">语义只定义结果</text><text x=\"1100\" y=\"248\" text-anchor=\"start\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" class=\"\">优化器选择路径</text><text x=\"1100\" y=\"282\" text-anchor=\"start\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" class=\"\">执行器生产 tuple</text><text x=\"1100\" y=\"316\" text-anchor=\"start\" font-size=\"14\" fill=\"#89938F\" font-weight=\"400\" class=\"\">三层各自回答</text><text x=\"1100\" y=\"350\" text-anchor=\"start\" font-size=\"14\" fill=\"#89938F\" font-weight=\"400\" class=\"\">不同的问题</text></svg>","ctrl":"","anim":false},{"eyebrow":"起点 · 正常化","title":"正常化把数据拆开，查询必须把它们重新组合","lede":"订单表存交易事实，客户表存属性，商品表存维度，支付表存资金状态；信息按职责分开存放，是设计的胜利，也是查询的起点。","caption":"图 2　事实表与维度表按职责拆分，join 是按连接键把它们重新组合的入口。","bridge":"于是有了那条最常见的 SQL——可它一写出来，工程问题就跟着来了。","notes":"业务系统很少把全部信息塞进一张宽表。订单表里只有 customer_id，客户属于哪个 region、状态是 active 还是 inactive，放在客户表；金额、时间、支付状态又分别落在别的地方。这是正常化带来的好处：冗余少、更新不会互相打架、职责清楚。\n\n代价是，只要业务问一个稍微完整一点的问题，比如「CN 地区客户的订单金额」，数据库就必须把分开存的关系重新组合起来。组合的凭据是连接键，也就是主外键、维表 key、事实表关联 key 这些稳定的列。\n\n这里要建立一个直觉：join 的输入是两张已经各自存在的关系，输出是一个新的关系。它不是把两张表物理上粘起来，更不是把列拼成一张大宽表存下去。每一步 join 都会产生中间结果，而中间结果有多大，直接决定了后面要花多少 CPU、内存和 I/O。\n\n所以从这个起点看，join 不是一个语法点，是数据模型的必然结果。模型拆得越干净，join 就越频繁，也就越值得把它的成本边界搞清楚。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"490\" y=\"16\" width=\"420\" height=\"56\" rx=\"0\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.2\"/><text x=\"700\" y=\"48.41\" text-anchor=\"middle\" font-size=\"18\" fill=\"#FFFFFF\" font-weight=\"600\" class=\"serif\">一次查询：CN 地区客户的订单金额</text><path d=\"M700 72 L700 92\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"/><path d=\"M175 92 L1225 92\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"/><path d=\"M175 92 L175 110\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.5\" stroke-linejoin=\"miter\"/><polygon points=\"171,102 175,110 179,102\" fill=\"#245A6B\"/><path d=\"M525 92 L525 110\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.5\" stroke-linejoin=\"miter\"/><polygon points=\"521,102 525,110 529,102\" fill=\"#245A6B\"/><path d=\"M875 92 L875 110\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.5\" stroke-linejoin=\"miter\"/><polygon points=\"871,102 875,110 879,102\" fill=\"#245A6B\"/><path d=\"M1225 92 L1225 110\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.5\" stroke-linejoin=\"miter\"/><polygon points=\"1221,102 1225,110 1229,102\" fill=\"#245A6B\"/><rect x=\"40\" y=\"110\" width=\"270\" height=\"52\" rx=\"0\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.2\"/><text x=\"175\" y=\"139.92\" text-anchor=\"middle\" font-size=\"16\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"serif\">orders　订单事实</text><rect x=\"40\" y=\"168\" width=\"270\" height=\"104\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"56\" y=\"215.545\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">order_id / customer_id</text><text x=\"56\" y=\"231.07\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">amount / created_at</text><rect x=\"40\" y=\"278\" width=\"270\" height=\"46\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\"/><text x=\"175\" y=\"304.308\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"600\" class=\"mono\">连接键　customer_id</text><rect x=\"390\" y=\"110\" width=\"270\" height=\"52\" rx=\"0\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.2\"/><text x=\"525\" y=\"139.92\" text-anchor=\"middle\" font-size=\"16\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"serif\">customers　客户属性</text><rect x=\"390\" y=\"168\" width=\"270\" height=\"104\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"406\" y=\"215.545\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">customer_id / region</text><text x=\"406\" y=\"231.07\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">status</text><rect x=\"390\" y=\"278\" width=\"270\" height=\"46\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\"/><text x=\"525\" y=\"304.308\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"600\" class=\"mono\">连接键　customer_id</text><rect x=\"740\" y=\"110\" width=\"270\" height=\"52\" rx=\"0\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.2\"/><text x=\"875\" y=\"139.92\" text-anchor=\"middle\" font-size=\"16\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"serif\">products　商品维度</text><rect x=\"740\" y=\"168\" width=\"270\" height=\"104\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"756\" y=\"215.545\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">product_id / category</text><text x=\"756\" y=\"231.07\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">price</text><rect x=\"740\" y=\"278\" width=\"270\" height=\"46\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\"/><text x=\"875\" y=\"304.308\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"600\" class=\"mono\">连接键　product_id</text><rect x=\"1090\" y=\"110\" width=\"270\" height=\"52\" rx=\"0\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.2\"/><text x=\"1225\" y=\"139.92\" text-anchor=\"middle\" font-size=\"16\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"serif\">payments　资金状态</text><rect x=\"1090\" y=\"168\" width=\"270\" height=\"104\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"1106\" y=\"215.545\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">payment_id / order_id</text><text x=\"1106\" y=\"231.07\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">state / paid_at</text><rect x=\"1090\" y=\"278\" width=\"270\" height=\"46\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\"/><text x=\"1225\" y=\"304.308\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"600\" class=\"mono\">连接键　order_id</text><rect x=\"40\" y=\"340\" width=\"1320\" height=\"76\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"60\" y=\"374.115\" text-anchor=\"start\" font-size=\"17\" fill=\"#1B2B33\" font-weight=\"600\" class=\"serif\">信息按职责拆开存放，是设计的胜利；查询要回答完整问题，就必须按连接键重新组合</text><text x=\"60\" y=\"391.205\" text-anchor=\"start\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" class=\"\">join 的输出是一个新关系，中间结果有多大，直接决定后续 CPU / 内存 / I/O 的代价</text></svg>","ctrl":"","anim":false},{"eyebrow":"起点 · 五个工程问题","title":"写下一行 JOIN，数据库要回答五个问题","lede":"SELECT o.order_id, o.amount, c.region FROM orders o INNER JOIN customers c ON c.customer_id = o.customer_id WHERE c.region = 'CN';","caption":"图 3　SQL 只写「要什么」，五个问题全都落在「怎么算」这一侧。","bridge":"先把最底下那层钉死：inner join 究竟保留了哪些行对。","notes":"看这条 SQL：从订单出发，按 customer_id 找到客户，只要 CN 地区的。逻辑上就一句话——订单能找到客户，并且客户属于 CN。\n\n可数据库面对的是五个很具体的问题。第一，如果 c.region = 'CN' 过滤完只剩几十行，是不是应该用这些客户 id 去订单表的索引里点查？第二，如果两边都很大，是不是该把较小一侧先建成 hash table？第三，如果两侧刚好都按连接键有序，是不是顺序合并更省？第四，如果估计只有几十行、实际却有几百万行，原来挑的计划会不会灾难性放大？第五，条件到底该放在 ON、USING 还是 WHERE，执行器会把它摆在哪儿？\n\n注意，这五个问题没有一个能靠 SQL 语法回答。SQL 只定义了要什么结果，成本、顺序、内存、索引、统计信息这些全在另一层。\n\n原文把这句话说得很准：INNER JOIN 解决的是「把多个关系按谓词组合成一个关系」的语义问题；物理执行方法解决的是「用什么数据流和资源代价完成组合」的工程问题。理解 inner join，必须同时看这两层。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40\" y=\"16\" width=\"1320\" height=\"92\" rx=\"0\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.2\"/><text x=\"60\" y=\"56.39\" text-anchor=\"start\" font-size=\"17\" fill=\"#FFFFFF\" font-weight=\"500\" class=\"mono\">SELECT o.order_id, o.amount, c.region</text><text x=\"60\" y=\"75.94\" text-anchor=\"start\" font-size=\"17\" fill=\"#FFFFFF\" font-weight=\"500\" class=\"mono\">FROM orders o INNER JOIN customers c ON c.customer_id = o.customer_id WHERE c.region = &apos;CN&apos;;</text><path d=\"M700 108 L700 120\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"/><path d=\"M165 120 L1235 120\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"/><path d=\"M165 120 L165 130\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.5\" stroke-linejoin=\"miter\"/><polygon points=\"161,122 165,130 169,122\" fill=\"#245A6B\"/><path d=\"M433 120 L433 130\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.5\" stroke-linejoin=\"miter\"/><polygon points=\"429,122 433,130 437,122\" fill=\"#245A6B\"/><path d=\"M701 120 L701 130\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.5\" stroke-linejoin=\"miter\"/><polygon points=\"697,122 701,130 705,122\" fill=\"#245A6B\"/><path d=\"M969 120 L969 130\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.5\" stroke-linejoin=\"miter\"/><polygon points=\"965,122 969,130 973,122\" fill=\"#245A6B\"/><path d=\"M1237 120 L1237 130\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.5\" stroke-linejoin=\"miter\"/><polygon points=\"1233,122 1237,130 1241,122\" fill=\"#245A6B\"/><rect x=\"40\" y=\"130\" width=\"250\" height=\"48\" rx=\"0\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.2\"/><text x=\"165\" y=\"157.675\" text-anchor=\"middle\" font-size=\"15\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"serif\">① 过滤后有多少行</text><rect x=\"40\" y=\"178\" width=\"250\" height=\"142\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"56\" y=\"238.055\" text-anchor=\"start\" font-size=\"14\" fill=\"#1B2B33\" font-weight=\"500\" class=\"\">region = CN 若只剩几十行</text><text x=\"56\" y=\"253.335\" text-anchor=\"start\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">能不能用客户 id 去订单索引点查</text><text x=\"56\" y=\"267.465\" text-anchor=\"start\" font-size=\"12\" fill=\"#89938F\" font-weight=\"400\" class=\"\">SQL 语法回答不了</text><rect x=\"308\" y=\"130\" width=\"250\" height=\"48\" rx=\"0\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.2\"/><text x=\"433\" y=\"157.675\" text-anchor=\"middle\" font-size=\"15\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"serif\">② 是否建 hash table</text><rect x=\"308\" y=\"178\" width=\"250\" height=\"142\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"324\" y=\"238.055\" text-anchor=\"start\" font-size=\"14\" fill=\"#1B2B33\" font-weight=\"500\" class=\"\">两边都很大时</text><text x=\"324\" y=\"253.335\" text-anchor=\"start\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">较小一侧先 build 再 probe</text><text x=\"324\" y=\"267.465\" text-anchor=\"start\" font-size=\"12\" fill=\"#89938F\" font-weight=\"400\" class=\"\">SQL 语法回答不了</text><rect x=\"576\" y=\"130\" width=\"250\" height=\"48\" rx=\"0\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.2\"/><text x=\"701\" y=\"157.675\" text-anchor=\"middle\" font-size=\"15\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"serif\">③ 是否顺序合并</text><rect x=\"576\" y=\"178\" width=\"250\" height=\"142\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"592\" y=\"238.055\" text-anchor=\"start\" font-size=\"14\" fill=\"#1B2B33\" font-weight=\"500\" class=\"\">两侧刚好按 key 有序</text><text x=\"592\" y=\"253.335\" text-anchor=\"start\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">省掉排序，还能复用输出顺序</text><text x=\"592\" y=\"267.465\" text-anchor=\"start\" font-size=\"12\" fill=\"#89938F\" font-weight=\"400\" class=\"\">SQL 语法回答不了</text><rect x=\"844\" y=\"130\" width=\"250\" height=\"48\" rx=\"0\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.2\"/><text x=\"969\" y=\"157.675\" text-anchor=\"middle\" font-size=\"15\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"serif\">④ 估算会不会错</text><rect x=\"844\" y=\"178\" width=\"250\" height=\"142\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"860\" y=\"238.055\" text-anchor=\"start\" font-size=\"14\" fill=\"#1B2B33\" font-weight=\"500\" class=\"\">估计几十行，实际几百万</text><text x=\"860\" y=\"253.335\" text-anchor=\"start\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">原计划会不会被灾难性放大</text><text x=\"860\" y=\"267.465\" text-anchor=\"start\" font-size=\"12\" fill=\"#89938F\" font-weight=\"400\" class=\"\">SQL 语法回答不了</text><rect x=\"1112\" y=\"130\" width=\"250\" height=\"48\" rx=\"0\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.2\"/><text x=\"1237\" y=\"157.675\" text-anchor=\"middle\" font-size=\"15\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"serif\">⑤ 条件放在哪里</text><rect x=\"1112\" y=\"178\" width=\"250\" height=\"142\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"1128\" y=\"238.055\" text-anchor=\"start\" font-size=\"14\" fill=\"#1B2B33\" font-weight=\"500\" class=\"\">ON / USING / WHERE</text><text x=\"1128\" y=\"253.335\" text-anchor=\"start\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">执行器把条件摆到哪个字段</text><text x=\"1128\" y=\"267.465\" text-anchor=\"start\" font-size=\"12\" fill=\"#89938F\" font-weight=\"400\" class=\"\">SQL 语法回答不了</text><rect x=\"40\" y=\"336\" width=\"1320\" height=\"80\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"60\" y=\"372.115\" text-anchor=\"start\" font-size=\"17\" fill=\"#245A6B\" font-weight=\"600\" class=\"serif\">INNER JOIN 解决「把多个关系按谓词组合成一个关系」的语义问题</text><text x=\"60\" y=\"389.205\" text-anchor=\"start\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" class=\"\">物理执行方法解决「用什么数据流和资源代价完成组合」的工程问题——理解 join，必须同时看这两层</text></svg>","ctrl":"","anim":false},{"eyebrow":"语义层 · 行对过滤","title":"只保留 join condition 为 true 的行对","lede":"对左表每一行 R1，结果包含右表中所有与 R1 满足连接条件的行；false 不输出，NULL 也不输出，因为 SQL 的布尔过滤只接受 true。","caption":"图 4　可交互演示：修改两侧连接键，逐对观察 true / false / NULL 的去向。","bridge":"那没匹配上的行呢？inner join 的处理方式，正是它和 outer join 的分界线。","notes":"官方文档对 joined table 的定义很朴素：对左表每一行 R1，结果中包含所有右表里与 R1 满足 join condition 的行。换句更直接的话，inner join 的结果就是「所有让连接条件为 true 的左右行组合」。\n\n这里有两个边界特别容易被忽略。第一个是 false：条件不成立的行对不会输出，这大家都懂。第二个是 NULL：连接键里只要出现 NULL，等值条件的结果不是 true 也不是 false，而是 unknown，SQL 的过滤只认 true，所以这类行对同样不输出。右边这张演示里，你可以把任意一侧的连接键改成 NULL，亲手看它被丢掉。\n\n还有一点要钉死：INNER 关键字本身可以省略。在 qualified join 里，不写 INNER 默认就是 inner join；逗号加 WHERE 的写法，语义上也是内连接，只是条件和连接关系分开写，可读性差得多。\n\n这一页的动画建议你按一次单步走一对：左边取一行、右边取一行、算条件、决定去留。看完就会明白，所谓「拼表」，本质是对候选行对做一次布尔过滤。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><g id=\"animA\"></g></svg>","ctrl":"<label>左表键</label><input type=\"text\" id=\"aL\" value=\"7,9,42\" size=\"10\" title=\"可输入 NULL 或 N\"><label>右表键</label><input type=\"text\" id=\"aR\" value=\"7,42,8,NULL\" size=\"12\" title=\"可输入 NULL 或 N\"><button class=\"btn play\" id=\"aPlay\">▶ 播放</button><button class=\"btn\" id=\"aTick\">单步 →</button><button class=\"btn\" id=\"aReset\">重置</button><div class=\"out\" id=\"aOut\"></div>","anim":true},{"eyebrow":"语义层 · 与 outer 的分界","title":"不补 NULL，是 inner join 最硬的边界","lede":"左表里找不到匹配的行，在 inner join 里直接消失；outer join 才会为它补上一行 NULL 保留下来。","caption":"图 5　同样是 R2 没有匹配：inner 丢弃这行，left join 补 NULL 保留这行。","bridge":"既然没有「补 NULL」这个阶段，条件的摆放位置也就有了回旋余地。","notes":"很多人第一次分不清 inner 和 outer，是因为只盯着「有没有匹配」。真正的分界在没匹配上之后做了什么。\n\ninner join 没有补 NULL 阶段。左表某行在右表找不到任何让条件为 true 的行对，这一行就 quietly 消失了，结果集里连个痕迹都没有。left join 不一样：它会把这行保留下来，右表对应的列全部填 NULL，先形成一个「未匹配」的结果行，后面的 WHERE 才有机会看到它。\n\n这个差别会直接改变结果行数，也会改变条件能不能挪位置。举个最常见的坑：LEFT JOIN 时把右表的过滤条件写在 WHERE 里，那些补了 NULL 的行会被 WHERE 一并滤掉，outer join 就悄悄退化成了 inner join 的效果。而 inner join 里根本不存在这批补 NULL 的行，所以压根没这个坑。\n\n记住这个分界，后面讲 joinqual 和 plan.qual 为什么在 INNER 下可交换、在 OUTER 下不可交换，就有根了：可交换的前提，正是「没有补 NULL 阶段」。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40\" y=\"16\" width=\"1320\" height=\"60\" rx=\"0\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.2\"/><text x=\"700\" y=\"49.92\" text-anchor=\"middle\" font-size=\"16\" fill=\"#FFFFFF\" font-weight=\"500\" class=\"mono\">左表 R1(7)  R2(9)  R3(42)　·　右表 S1(7)  S2(42)  S3(8)　·　条件 a.k = b.k</text><rect x=\"40\" y=\"92\" width=\"640\" height=\"46\" rx=\"0\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.2\"/><text x=\"360\" y=\"119.165\" text-anchor=\"middle\" font-size=\"17\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"serif\">INNER JOIN　结果</text><rect x=\"720\" y=\"92\" width=\"640\" height=\"46\" rx=\"0\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1.2\"/><text x=\"1040\" y=\"119.165\" text-anchor=\"middle\" font-size=\"17\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"serif\">LEFT JOIN　结果</text><rect x=\"40\" y=\"146\" width=\"640\" height=\"44\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\"/><text x=\"58\" y=\"171.675\" text-anchor=\"start\" font-size=\"15\" fill=\"#2F7A66\" font-weight=\"600\" class=\"\">(R1, S1)　id = 7　输出</text><rect x=\"720\" y=\"146\" width=\"640\" height=\"44\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\"/><text x=\"738\" y=\"171.675\" text-anchor=\"start\" font-size=\"15\" fill=\"#2F7A66\" font-weight=\"600\" class=\"\">(R1, S1)　id = 7　输出</text><rect x=\"40\" y=\"196\" width=\"640\" height=\"44\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\"/><text x=\"58\" y=\"221.675\" text-anchor=\"start\" font-size=\"15\" fill=\"#2F7A66\" font-weight=\"600\" class=\"\">(R3, S2)　id = 42　输出</text><rect x=\"720\" y=\"196\" width=\"640\" height=\"44\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\"/><text x=\"738\" y=\"221.675\" text-anchor=\"start\" font-size=\"15\" fill=\"#2F7A66\" font-weight=\"600\" class=\"\">(R3, S2)　id = 42　输出</text><rect x=\"40\" y=\"246\" width=\"640\" height=\"44\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\"/><text x=\"58\" y=\"271.675\" text-anchor=\"start\" font-size=\"15\" fill=\"#BE653B\" font-weight=\"600\" class=\"\">R2(9)　没有匹配 → 直接丢弃</text><rect x=\"720\" y=\"246\" width=\"640\" height=\"44\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.2\"/><text x=\"738\" y=\"271.675\" text-anchor=\"start\" font-size=\"15\" fill=\"#AE8A3E\" font-weight=\"600\" class=\"\">R2(9)　|　NULL　NULL　保留</text><rect x=\"40\" y=\"296\" width=\"640\" height=\"44\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"58\" y=\"321.675\" text-anchor=\"start\" font-size=\"15\" fill=\"#46585F\" font-weight=\"600\" class=\"\">结果 2 行：不出现任何补 NULL 行</text><rect x=\"720\" y=\"296\" width=\"640\" height=\"44\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"738\" y=\"321.675\" text-anchor=\"start\" font-size=\"15\" fill=\"#46585F\" font-weight=\"600\" class=\"\">结果 3 行：保留未匹配行并补 NULL</text><rect x=\"40\" y=\"352\" width=\"1320\" height=\"64\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"60\" y=\"380.402\" text-anchor=\"start\" font-size=\"17\" fill=\"#BE653B\" font-weight=\"600\" class=\"serif\">分界不在「有没有匹配」，而在「没匹配之后做了什么」</text><text x=\"60\" y=\"397.082\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">把右表过滤条件写进 WHERE，会把 left join 补出来的 NULL 行一起滤掉，outer 悄悄退化成 inner 的效果</text></svg>","ctrl":"","anim":false},{"eyebrow":"语义层 · 三种写法","title":"三种写法，连接键与输出列各不相同","lede":"ON 最一般，后面可以是任意布尔表达式；USING 是等值连接的简写，还会合并共同列；NATURAL JOIN 自动用同名列，写起来短，风险却高。","caption":"图 6　USING (a, b) 等价于 ON t1.a = t2.a AND t1.b = t2.b，但输出列顺序不同。","bridge":"还有一个更常被问到的差异：ON 里的条件，能不能挪到 WHERE。","notes":"先看 ON，它后面可以跟任意布尔表达式。你既可以写 c.customer_id = o.customer_id，也可以顺手加上 AND c.status = 'active'，甚至写不等式、表达式、函数，只要能算出布尔值就行。\n\nUSING 是等值连接的简写。官方文档说得很明确：USING (a, b) 等价于 ON t1.a = t2.a AND t1.b = t2.b。但输出列的组织不一样——JOIN ON 会把左表的列全部输出，再输出右表的列，共同列出现两次；JOIN USING 会把共同列合并，先输出共同列，再输出两边剩下的列。所以 SELECT * 的时候，两者结果的列数和列名都不同，这不是细节，是写报表和对接下游时最容易踩的坑。\n\nNATURAL JOIN 更省事，它自动把两边同名的列抓出来凑成 USING 列表。但工程上真不建议在生产 SQL 里用它：哪天有张表加了一个同名列，连接条件就悄悄变了，代码审查还看不出真实连接键是谁。\n\n一句话：显式写 ON，把连接键摆在最显眼的地方，是给自己和后来人省事。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40\" y=\"16\" width=\"420\" height=\"54\" rx=\"0\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.2\"/><text x=\"250\" y=\"47.41\" text-anchor=\"middle\" font-size=\"18\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"mono\">JOIN ... ON</text><rect x=\"40\" y=\"78\" width=\"420\" height=\"40\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\"/><text x=\"250\" y=\"101.43\" text-anchor=\"middle\" font-size=\"14\" fill=\"#46585F\" font-weight=\"600\" class=\"\">任意布尔表达式</text><rect x=\"40\" y=\"128\" width=\"420\" height=\"104\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"58\" y=\"167.33\" text-anchor=\"start\" font-size=\"14\" fill=\"#1B2B33\" font-weight=\"500\" class=\"mono\">ON t1.a = t2.a</text><text x=\"58\" y=\"183.43\" text-anchor=\"start\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" class=\"\">AND c.status = &apos;active&apos;</text><text x=\"58\" y=\"199.53\" text-anchor=\"start\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" class=\"\">条件可以任意复杂</text><rect x=\"40\" y=\"242\" width=\"420\" height=\"38\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"250\" y=\"264.185\" text-anchor=\"middle\" font-size=\"13\" fill=\"#89938F\" font-weight=\"600\" class=\"\">SELECT * 的输出列顺序</text><rect x=\"40\" y=\"288\" width=\"97.5\" height=\"52\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\"/><text x=\"88.75\" y=\"317.185\" text-anchor=\"middle\" font-size=\"13\" fill=\"#245A6B\" font-weight=\"600\" class=\"mono\">a.k</text><rect x=\"147.5\" y=\"288\" width=\"97.5\" height=\"52\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\"/><text x=\"196.25\" y=\"317.185\" text-anchor=\"middle\" font-size=\"13\" fill=\"#245A6B\" font-weight=\"600\" class=\"mono\">a.x</text><rect x=\"255\" y=\"288\" width=\"97.5\" height=\"52\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\"/><text x=\"303.75\" y=\"317.185\" text-anchor=\"middle\" font-size=\"13\" fill=\"#245A6B\" font-weight=\"600\" class=\"mono\">b.k</text><rect x=\"362.5\" y=\"288\" width=\"97.5\" height=\"52\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\"/><text x=\"411.25\" y=\"317.185\" text-anchor=\"middle\" font-size=\"13\" fill=\"#245A6B\" font-weight=\"600\" class=\"mono\">b.y</text><rect x=\"490\" y=\"16\" width=\"420\" height=\"54\" rx=\"0\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.2\"/><text x=\"700\" y=\"47.41\" text-anchor=\"middle\" font-size=\"18\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"mono\">JOIN ... USING (k)</text><rect x=\"490\" y=\"78\" width=\"420\" height=\"40\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\"/><text x=\"700\" y=\"101.43\" text-anchor=\"middle\" font-size=\"14\" fill=\"#46585F\" font-weight=\"600\" class=\"\">等值连接简写</text><rect x=\"490\" y=\"128\" width=\"420\" height=\"104\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"508\" y=\"167.33\" text-anchor=\"start\" font-size=\"14\" fill=\"#1B2B33\" font-weight=\"500\" class=\"mono\">USING (a, b) 等价于</text><text x=\"508\" y=\"183.43\" text-anchor=\"start\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" class=\"\">ON t1.a = t2.a</text><text x=\"508\" y=\"199.53\" text-anchor=\"start\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" class=\"\">AND t1.b = t2.b</text><rect x=\"490\" y=\"242\" width=\"420\" height=\"38\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"700\" y=\"264.185\" text-anchor=\"middle\" font-size=\"13\" fill=\"#89938F\" font-weight=\"600\" class=\"\">SELECT * 的输出列顺序</text><rect x=\"490\" y=\"288\" width=\"133.333\" height=\"52\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\"/><text x=\"556.667\" y=\"317.185\" text-anchor=\"middle\" font-size=\"13\" fill=\"#2F7A66\" font-weight=\"600\" class=\"mono\">k</text><rect x=\"633.333\" y=\"288\" width=\"133.333\" height=\"52\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\"/><text x=\"700\" y=\"317.185\" text-anchor=\"middle\" font-size=\"13\" fill=\"#2F7A66\" font-weight=\"600\" class=\"mono\">a.x</text><rect x=\"776.667\" y=\"288\" width=\"133.333\" height=\"52\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\"/><text x=\"843.333\" y=\"317.185\" text-anchor=\"middle\" font-size=\"13\" fill=\"#2F7A66\" font-weight=\"600\" class=\"mono\">b.y</text><rect x=\"940\" y=\"16\" width=\"420\" height=\"54\" rx=\"0\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1.2\"/><text x=\"1150\" y=\"47.41\" text-anchor=\"middle\" font-size=\"18\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"mono\">NATURAL JOIN</text><rect x=\"940\" y=\"78\" width=\"420\" height=\"40\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\"/><text x=\"1150\" y=\"101.43\" text-anchor=\"middle\" font-size=\"14\" fill=\"#46585F\" font-weight=\"600\" class=\"\">自动取同名列</text><rect x=\"940\" y=\"128\" width=\"420\" height=\"104\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"958\" y=\"167.33\" text-anchor=\"start\" font-size=\"14\" fill=\"#1B2B33\" font-weight=\"500\" class=\"mono\">表结构新增同名列</text><text x=\"958\" y=\"183.43\" text-anchor=\"start\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" class=\"\">会悄悄改变条件</text><text x=\"958\" y=\"199.53\" text-anchor=\"start\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" class=\"\">生产 SQL 不建议依赖</text><rect x=\"940\" y=\"242\" width=\"420\" height=\"38\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"1150\" y=\"264.185\" text-anchor=\"middle\" font-size=\"13\" fill=\"#89938F\" font-weight=\"600\" class=\"\">SELECT * 的输出列顺序</text><rect x=\"940\" y=\"288\" width=\"133.333\" height=\"52\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\"/><text x=\"1006.67\" y=\"317.185\" text-anchor=\"middle\" font-size=\"13\" fill=\"#BE653B\" font-weight=\"600\" class=\"mono\">同名列</text><rect x=\"1083.33\" y=\"288\" width=\"133.333\" height=\"52\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\"/><text x=\"1150\" y=\"317.185\" text-anchor=\"middle\" font-size=\"13\" fill=\"#BE653B\" font-weight=\"600\" class=\"mono\">a.x</text><rect x=\"1226.67\" y=\"288\" width=\"133.333\" height=\"52\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\"/><text x=\"1293.33\" y=\"317.185\" text-anchor=\"middle\" font-size=\"13\" fill=\"#BE653B\" font-weight=\"600\" class=\"mono\">b.y</text><rect x=\"40\" y=\"354\" width=\"1320\" height=\"64\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"60\" y=\"382.158\" text-anchor=\"start\" font-size=\"16\" fill=\"#1B2B33\" font-weight=\"600\" class=\"serif\">ON 输出「左表全部列 + 右表全部列」，USING 输出「共同列 + 两侧剩余列」</text><text x=\"60\" y=\"398.507\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">显式写 ON，把连接键摆在最显眼的地方，是给自己和后来人省事</text></svg>","ctrl":"","anim":false},{"eyebrow":"语义层 · 条件位置","title":"inner join 里 ON 与 WHERE 通常可交换，outer join 不行","lede":"把 b.flag = true 从 WHERE 挪到 ON，inner join 的结果不变；同样的改写放到 outer join 上，语义就会变。","caption":"图 7　plannodes.h 注释：jointype = INNER 时 joinqual 与 plan.qual 可交换；outer join 不可交换。","bridge":"语义钉死了，接下来把镜头抬到规划层：这句话怎么变成一棵计划树。","notes":"这一页是面试和线上评审里最容易吵起来的地方。先看结论：对 inner join，把单表过滤条件写在 ON 还是 WHERE，通常语义等价；对 outer join，不等价。\n\n为什么？PostgreSQL 的 Join 计划节点里有个字段叫 joinqual，它来自 JOIN/ON 或 JOIN/USING；普通 Plan 节点还有个 qual，来自 WHERE。plannodes.h 的注释讲得很直白：当 jointype 是 INNER 时，joinqual 和 plan.qual 语义可交换；对 outer join 不可交换，因为只有 joinqual 用来判断「这一行到底有没有找到匹配」，它决定是否要补 NULL。\n\n把上一页的分界接过来就通了：inner join 没有补 NULL 阶段，两个条件都是对已经形成的行对做布尔过滤，先算后算结果一样；outer join 多了一个「判断是否匹配」的语义动作，条件挪位置就改变了这个动作的输入。\n\n但要注意「语义等价」不等于「执行展示相同」。优化器仍可能把条件分配到不同节点、不同字段里，EXPLAIN 里会看到 Join Filter、Filter、Hash Cond 各就各位。这是执行位置的问题，不是语义的问题，第十八页我们会专门读它。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40\" y=\"16\" width=\"150\" height=\"186\" rx=\"0\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.2\"/><text x=\"54\" y=\"98.13\" text-anchor=\"start\" font-size=\"19\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"mono\">INNER</text><text x=\"54\" y=\"115.88\" text-anchor=\"start\" font-size=\"14\" fill=\"#FFFFFF\" font-weight=\"500\" class=\"mono\">JOIN</text><text x=\"54\" y=\"131.16\" text-anchor=\"start\" font-size=\"13\" fill=\"#FFFFFF\" font-weight=\"400\" class=\"\">条件位置</text><rect x=\"210\" y=\"28\" width=\"340\" height=\"130\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\"/><text x=\"228\" y=\"89.28\" text-anchor=\"start\" font-size=\"16.5\" fill=\"#245A6B\" font-weight=\"700\" class=\"serif\">① 形成行对</text><text x=\"228\" y=\"105.795\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">左右输入按条件组合</text><path d=\"M550 93 L580 93\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"/><polygon points=\"572,89 580,93 572,97\" fill=\"#245A6B\"/><rect x=\"580\" y=\"28\" width=\"340\" height=\"130\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\"/><text x=\"598\" y=\"89.28\" text-anchor=\"start\" font-size=\"16.5\" fill=\"#245A6B\" font-weight=\"700\" class=\"serif\">② 没有补 NULL 阶段</text><text x=\"598\" y=\"105.795\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">未匹配行直接消失</text><path d=\"M920 93 L950 93\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"/><polygon points=\"942,89 950,93 942,97\" fill=\"#245A6B\"/><rect x=\"950\" y=\"28\" width=\"340\" height=\"130\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\"/><text x=\"968\" y=\"89.28\" text-anchor=\"start\" font-size=\"16.5\" fill=\"#245A6B\" font-weight=\"700\" class=\"serif\">③ joinqual / plan.qual</text><text x=\"968\" y=\"105.795\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">都只是对行对做布尔过滤</text><rect x=\"210\" y=\"164\" width=\"1080\" height=\"38\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\"/><text x=\"750\" y=\"186.308\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#2F7A66\" font-weight=\"600\" class=\"serif\">结论：条件挪位置，结果集不变 → 语义可交换</text><rect x=\"40\" y=\"218\" width=\"150\" height=\"186\" rx=\"0\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1.2\"/><text x=\"54\" y=\"300.13\" text-anchor=\"start\" font-size=\"19\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"mono\">OUTER</text><text x=\"54\" y=\"317.88\" text-anchor=\"start\" font-size=\"14\" fill=\"#FFFFFF\" font-weight=\"500\" class=\"mono\">JOIN</text><text x=\"54\" y=\"333.16\" text-anchor=\"start\" font-size=\"13\" fill=\"#FFFFFF\" font-weight=\"400\" class=\"\">条件位置</text><rect x=\"210\" y=\"230\" width=\"340\" height=\"130\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\"/><text x=\"228\" y=\"291.28\" text-anchor=\"start\" font-size=\"16.5\" fill=\"#BE653B\" font-weight=\"700\" class=\"serif\">① 形成行对</text><text x=\"228\" y=\"307.795\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">左右输入按条件组合</text><path d=\"M550 295 L580 295\" fill=\"none\" stroke=\"#BE653B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"/><polygon points=\"572,291 580,295 572,299\" fill=\"#BE653B\"/><rect x=\"580\" y=\"230\" width=\"340\" height=\"130\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\"/><text x=\"598\" y=\"291.28\" text-anchor=\"start\" font-size=\"16.5\" fill=\"#BE653B\" font-weight=\"700\" class=\"serif\">② 补 NULL 保留未匹配</text><text x=\"598\" y=\"307.795\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">先形成未匹配结果行</text><path d=\"M920 295 L950 295\" fill=\"none\" stroke=\"#BE653B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"/><polygon points=\"942,291 950,295 942,299\" fill=\"#BE653B\"/><rect x=\"950\" y=\"230\" width=\"340\" height=\"130\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\"/><text x=\"968\" y=\"291.28\" text-anchor=\"start\" font-size=\"16.5\" fill=\"#BE653B\" font-weight=\"700\" class=\"serif\">③ joinqual 决定匹配</text><text x=\"968\" y=\"307.795\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">plan.qual 会滤掉补 NULL 行</text><rect x=\"210\" y=\"366\" width=\"1080\" height=\"38\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\"/><text x=\"750\" y=\"388.308\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#BE653B\" font-weight=\"600\" class=\"serif\">结论：条件挪位置，结果集改变 → 语义不可交换</text></svg>","ctrl":"","anim":false},{"eyebrow":"全链路 · 六层结构","title":"从 SQL 语义到执行器，中间隔着六层","lede":"SQL 写法、查询规划、join 顺序搜索、路径生成、计划生成、执行器——每一层都在回答一个不同的问题。","caption":"图 8　地层剖面：越靠下越贴近物理实现，越靠上越贴近用户意图。","bridge":"先看主流程：join 搜索到底发生在调用栈的哪一层。","notes":"把整条链路摊开，是六层。第一层 SQL 语义，JOIN ... ON、JOIN ... USING、NATURAL JOIN 描述哪些行对匹配、输出列怎么组织。第二层 query_planner()，生成基础关系，把 restriction 和 join clauses 拆开，顺手识别哪些条件能支持 merge join 或 hash join。\n\n第三层是 join 搜索，standard_join_search() 和 join_search_one_level() 用动态规划枚举 join relation 和连接顺序。第四层路径生成，add_paths_to_joinrel() 为同一个 join relation 生成 Nested Loop、Merge Join、Hash Join 等候选路径。第五层 create_join_plan()，把胜出的 JoinPath 转成真正的计划节点。第六层才是执行器，ExecNestLoop、ExecHashJoin、ExecMergeJoin 按物理算法生产 tuple。\n\n这张图我特意画成地层剖面：越往上越贴近人写的东西，越往下越贴近机器跑的东西。很多人调 join 只盯着最上面那层改 SQL，或者只盯着最下面那层看 EXPLAIN，其实故障常常发生在中间——第三层顺序选错、第四层路径被成本模型带偏、第五层节点形态和预期不符。\n\n后面几页就顺着这个剖面，一层一层往下走。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40\" y=\"12\" width=\"62\" height=\"58\" rx=\"0\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.2\"/><text x=\"71\" y=\"45.165\" text-anchor=\"middle\" font-size=\"17\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"mono\">01</text><rect x=\"102\" y=\"12\" width=\"1258\" height=\"58\" rx=\"0\" fill=\"#EBF1EE\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"120\" y=\"37.69\" text-anchor=\"start\" font-size=\"17\" fill=\"#1B2B33\" font-weight=\"700\" class=\"serif\">SQL 语义　JOIN ... ON / USING / NATURAL JOIN</text><text x=\"120\" y=\"53.96\" text-anchor=\"start\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">描述行对匹配与输出列组织</text><rect x=\"40\" y=\"78\" width=\"62\" height=\"58\" rx=\"0\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.2\"/><text x=\"71\" y=\"111.165\" text-anchor=\"middle\" font-size=\"17\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"mono\">02</text><rect x=\"102\" y=\"78\" width=\"1258\" height=\"58\" rx=\"0\" fill=\"#CFE0DC\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"120\" y=\"103.69\" text-anchor=\"start\" font-size=\"17\" fill=\"#1B2B33\" font-weight=\"700\" class=\"serif\">查询规划　query_planner()</text><text x=\"120\" y=\"119.96\" text-anchor=\"start\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">建基础关系，拆 restriction 与 join clauses</text><rect x=\"40\" y=\"144\" width=\"62\" height=\"58\" rx=\"0\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.2\"/><text x=\"71\" y=\"177.165\" text-anchor=\"middle\" font-size=\"17\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"mono\">03</text><rect x=\"102\" y=\"144\" width=\"1258\" height=\"58\" rx=\"0\" fill=\"#A4C4C6\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"120\" y=\"169.69\" text-anchor=\"start\" font-size=\"17\" fill=\"#1B2B33\" font-weight=\"700\" class=\"serif\">Join 搜索　standard_join_search() / join_search_one_level()</text><text x=\"120\" y=\"185.96\" text-anchor=\"start\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">动态规划枚举 join relation 与顺序</text><rect x=\"40\" y=\"210\" width=\"62\" height=\"58\" rx=\"0\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.2\"/><text x=\"71\" y=\"243.165\" text-anchor=\"middle\" font-size=\"17\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"mono\">04</text><rect x=\"102\" y=\"210\" width=\"1258\" height=\"58\" rx=\"0\" fill=\"#74A5AD\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"120\" y=\"235.69\" text-anchor=\"start\" font-size=\"17\" fill=\"#1B2B33\" font-weight=\"700\" class=\"serif\">路径生成　add_paths_to_joinrel()</text><text x=\"120\" y=\"251.96\" text-anchor=\"start\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" class=\"\">生成 Nested Loop / Merge / Hash 候选 path</text><rect x=\"40\" y=\"276\" width=\"62\" height=\"58\" rx=\"0\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.2\"/><text x=\"71\" y=\"309.165\" text-anchor=\"middle\" font-size=\"17\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"mono\">05</text><rect x=\"102\" y=\"276\" width=\"1258\" height=\"58\" rx=\"0\" fill=\"#47808D\" stroke=\"#1E4B5A\" stroke-width=\"1.2\"/><text x=\"120\" y=\"301.69\" text-anchor=\"start\" font-size=\"17\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"serif\">计划生成　create_join_plan()</text><text x=\"120\" y=\"317.96\" text-anchor=\"start\" font-size=\"13\" fill=\"#FFFFFF\" font-weight=\"400\" class=\"\">把最优 JoinPath 转成计划节点</text><rect x=\"40\" y=\"342\" width=\"62\" height=\"58\" rx=\"0\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.2\"/><text x=\"71\" y=\"375.165\" text-anchor=\"middle\" font-size=\"17\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"mono\">06</text><rect x=\"102\" y=\"342\" width=\"1258\" height=\"58\" rx=\"0\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.2\"/><text x=\"120\" y=\"367.69\" text-anchor=\"start\" font-size=\"17\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"serif\">执行器　ExecNestLoop() / ExecHashJoin() / ExecMergeJoin()</text><text x=\"120\" y=\"383.96\" text-anchor=\"start\" font-size=\"13\" fill=\"#FFFFFF\" font-weight=\"400\" class=\"\">按物理算法生产结果 tuple</text></svg>","ctrl":"","anim":false},{"eyebrow":"规划层 · 主流程","title":"join 搜索发生在 make_rel_from_joinlist() 之后","lede":"planner() → subquery_planner() → grouping_planner() → query_planner() → make_one_rel()，然后才轮到 join 顺序搜索。","caption":"图 9　query_planner() 先建基础关系、拆条件；standard_join_search() 才枚举 join 顺序。","bridge":"这个 standard_join_search()，做的其实是一件很朴素的事：动态规划。","notes":"PostgreSQL 优化器 README 给的主线是这样的：planner 调 subquery_planner，再调 grouping_planner，再进 query_planner，再到 make_one_rel，里面先 set_base_rel_pathlists() 给每张基础表生成访问路径，然后 make_rel_from_joinlist() 进到 standard_join_search()。\n\n为什么要先做基础关系？因为 join 的成本是由输入决定的。一张表是 Seq Scan 还是 Index Scan、估计多少行、行宽多少、输出有没有 pathkeys 顺序，这些属性决定了它跟别的表组合时能长出哪些路径。基础关系都没定，谈 join 顺序是空的。\n\nquery_planner() 里还有两件关键准备工作：把 restriction（单表过滤）和 join clauses（跨表条件）拆开；识别哪些连接条件是 mergejoinable 或 hashjoinable。拆开是为了能把单表条件下推，先缩小输入；打标记是为了后面知道哪些物理算法有资格参与竞争。\n\n所以优化器不是在三个算法名字里投票。它先铺好输入，再在输入之上搜索组合，最后让候选路径按成本竞争。这个顺序记住了，看执行计划就不会只盯着最上面那个 Join 节点发呆。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40\" y=\"12\" width=\"700\" height=\"40\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"56\" y=\"35.5525\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"400\" class=\"mono\">planner()</text><rect x=\"66\" y=\"60\" width=\"674\" height=\"40\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"82\" y=\"83.5525\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"400\" class=\"mono\">subquery_planner()</text><rect x=\"92\" y=\"108\" width=\"648\" height=\"40\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"108\" y=\"131.552\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"400\" class=\"mono\">grouping_planner()</text><rect x=\"118\" y=\"156\" width=\"622\" height=\"40\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"134\" y=\"179.552\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"600\" class=\"mono\">query_planner()</text><rect x=\"144\" y=\"204\" width=\"596\" height=\"40\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"160\" y=\"227.552\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"400\" class=\"mono\">make_one_rel()</text><rect x=\"170\" y=\"252\" width=\"570\" height=\"40\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"186\" y=\"275.553\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"400\" class=\"mono\">set_base_rel_pathlists()</text><rect x=\"196\" y=\"300\" width=\"544\" height=\"40\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"212\" y=\"323.553\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"600\" class=\"mono\">make_rel_from_joinlist()</text><rect x=\"222\" y=\"348\" width=\"518\" height=\"40\" rx=\"0\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.2\"/><text x=\"238\" y=\"371.553\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#FFFFFF\" font-weight=\"600\" class=\"mono\">standard_join_search()  →  join_search_one_level()</text><rect x=\"790\" y=\"12\" width=\"570\" height=\"300\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"810\" y=\"117.535\" text-anchor=\"start\" font-size=\"18\" fill=\"#245A6B\" font-weight=\"700\" class=\"serif\">query_planner() 先做两件准备</text><text x=\"810\" y=\"134.955\" text-anchor=\"start\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" class=\"\">① 拆 restriction 与 join clauses</text><text x=\"810\" y=\"151.055\" text-anchor=\"start\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" class=\"\">② 标记 mergejoinable / hashjoinable</text><text x=\"810\" y=\"168.795\" text-anchor=\"start\" font-size=\"16\" fill=\"#1B2B33\" font-weight=\"600\" class=\"serif\">基础关系属性先定下来</text><text x=\"810\" y=\"185.145\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">Seq Scan / Index Scan · rows · width</text><text x=\"810\" y=\"200.67\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">pathkeys（输出顺序）· cost</text><text x=\"810\" y=\"216.605\" text-anchor=\"start\" font-size=\"14\" fill=\"#BE653B\" font-weight=\"400\" class=\"\">输入没定，谈 join 顺序是空的</text><rect x=\"790\" y=\"324\" width=\"570\" height=\"64\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\"/><text x=\"808\" y=\"351.913\" text-anchor=\"start\" font-size=\"15\" fill=\"#245A6B\" font-weight=\"600\" class=\"mono\">root-&gt;join_rel_level[j]</text><text x=\"808\" y=\"367.933\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">保存含 j 个 item 的 join relation</text><path d=\"M765 224 L765 356\" fill=\"none\" stroke=\"#7BA6AF\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"/></svg>","ctrl":"","anim":false},{"eyebrow":"规划层 · 动态规划","title":"join relation 是一层一层长出来的","lede":"先构造所有两表 join，再三表、四表，直到包含全部关系；root->join_rel_level[j] 保存含 j 个 item 的 join relation。","caption":"图 10　每层只由更小的层组合而成；join clause 优先，无 clause 时生成笛卡尔积候选。","bridge":"顺带解释一个线上灾难：如果两层之间没有 join clause，会发生什么。","notes":"allpaths.c 里 standard_join_search() 的注释特别直白：先构造两个 jointree item 的 join，再构造三个、四个，直到所有 item 都被考虑过。这就是动态规划——第 j 层的所有 join relation，都由第 k 层和第 j-k 层拼出来，不会重复枚举同一批组合。\n\n每一层里，join_search_one_level() 会优先用 join clauses 把有关联的关系连起来。什么叫有关联？就是两个输入之间存在跨表的连接条件，比如 o.customer_id = c.customer_id。有这种条件，组合出来的中间结果才有意义，也才容易被估算。\n\n那没有 join clause 的两个关系呢？优化器不会报错，它会生成笛卡尔积候选。因为 SQL 里 FROM a, b 本身是合法写法，数据库必须给它一个能执行的计划。\n\n这里就埋着一个很重要的判断：连接顺序不是随便排的，它同时决定中间结果有多大。星型模型里，先让高选择率的维度过滤生效，再碰庞大的事实表，和先让两张大事实表互连再过滤维表，中间结果可能差出好几个数量级。优化器靠估算行数来做这个判断，估算一旦错了，顺序就跟着错。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40\" y=\"16\" width=\"310\" height=\"56\" rx=\"0\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.2\"/><text x=\"56\" y=\"40.855\" text-anchor=\"start\" font-size=\"16.5\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"mono\">Level 1</text><text x=\"56\" y=\"56.55\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#FFFFFF\" font-weight=\"400\" class=\"\">基础关系</text><path d=\"M350 41 L390 41\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"/><polygon points=\"382,37 390,41 382,45\" fill=\"#245A6B\"/><rect x=\"40\" y=\"80\" width=\"310\" height=\"54\" rx=\"0\" fill=\"#EBF1EE\" stroke=\"#47808D\" stroke-width=\"1.2\"/><text x=\"195\" y=\"111.165\" text-anchor=\"middle\" font-size=\"17\" fill=\"#1B2B33\" font-weight=\"500\" class=\"mono\">{A}</text><rect x=\"40\" y=\"142\" width=\"310\" height=\"54\" rx=\"0\" fill=\"#EBF1EE\" stroke=\"#47808D\" stroke-width=\"1.2\"/><text x=\"195\" y=\"173.165\" text-anchor=\"middle\" font-size=\"17\" fill=\"#1B2B33\" font-weight=\"500\" class=\"mono\">{B}</text><rect x=\"40\" y=\"204\" width=\"310\" height=\"54\" rx=\"0\" fill=\"#EBF1EE\" stroke=\"#47808D\" stroke-width=\"1.2\"/><text x=\"195\" y=\"235.165\" text-anchor=\"middle\" font-size=\"17\" fill=\"#1B2B33\" font-weight=\"500\" class=\"mono\">{C}</text><rect x=\"40\" y=\"266\" width=\"310\" height=\"54\" rx=\"0\" fill=\"#EBF1EE\" stroke=\"#47808D\" stroke-width=\"1.2\"/><text x=\"195\" y=\"297.165\" text-anchor=\"middle\" font-size=\"17\" fill=\"#1B2B33\" font-weight=\"500\" class=\"mono\">{D}</text><rect x=\"390\" y=\"16\" width=\"310\" height=\"56\" rx=\"0\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.2\"/><text x=\"406\" y=\"40.855\" text-anchor=\"start\" font-size=\"16.5\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"mono\">Level 2</text><text x=\"406\" y=\"56.55\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#FFFFFF\" font-weight=\"400\" class=\"\">两表 join</text><path d=\"M700 41 L740 41\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"/><polygon points=\"732,37 740,41 732,45\" fill=\"#245A6B\"/><rect x=\"390\" y=\"80\" width=\"310\" height=\"54\" rx=\"0\" fill=\"#CFE0DC\" stroke=\"#47808D\" stroke-width=\"1.2\"/><text x=\"545\" y=\"111.165\" text-anchor=\"middle\" font-size=\"17\" fill=\"#1B2B33\" font-weight=\"500\" class=\"mono\">{A,B}</text><rect x=\"390\" y=\"142\" width=\"310\" height=\"54\" rx=\"0\" fill=\"#CFE0DC\" stroke=\"#47808D\" stroke-width=\"1.2\"/><text x=\"545\" y=\"173.165\" text-anchor=\"middle\" font-size=\"17\" fill=\"#1B2B33\" font-weight=\"500\" class=\"mono\">{A,C}</text><rect x=\"390\" y=\"204\" width=\"310\" height=\"54\" rx=\"0\" fill=\"#CFE0DC\" stroke=\"#47808D\" stroke-width=\"1.2\"/><text x=\"545\" y=\"235.165\" text-anchor=\"middle\" font-size=\"17\" fill=\"#1B2B33\" font-weight=\"500\" class=\"mono\">{B,C}</text><rect x=\"740\" y=\"16\" width=\"310\" height=\"56\" rx=\"0\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.2\"/><text x=\"756\" y=\"40.855\" text-anchor=\"start\" font-size=\"16.5\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"mono\">Level 3</text><text x=\"756\" y=\"56.55\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#FFFFFF\" font-weight=\"400\" class=\"\">三表 join</text><path d=\"M1050 41 L1090 41\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"/><polygon points=\"1082,37 1090,41 1082,45\" fill=\"#245A6B\"/><rect x=\"740\" y=\"80\" width=\"310\" height=\"54\" rx=\"0\" fill=\"#74A5AD\" stroke=\"#47808D\" stroke-width=\"1.2\"/><text x=\"895\" y=\"111.165\" text-anchor=\"middle\" font-size=\"17\" fill=\"#1B2B33\" font-weight=\"500\" class=\"mono\">{A,B,C}</text><rect x=\"740\" y=\"142\" width=\"310\" height=\"54\" rx=\"0\" fill=\"#74A5AD\" stroke=\"#47808D\" stroke-width=\"1.2\"/><text x=\"895\" y=\"173.165\" text-anchor=\"middle\" font-size=\"17\" fill=\"#1B2B33\" font-weight=\"500\" class=\"mono\">{A,B,D}</text><rect x=\"1090\" y=\"16\" width=\"310\" height=\"56\" rx=\"0\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.2\"/><text x=\"1106\" y=\"40.855\" text-anchor=\"start\" font-size=\"16.5\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"mono\">Level 4</text><text x=\"1106\" y=\"56.55\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#FFFFFF\" font-weight=\"400\" class=\"\">最终 join relation</text><rect x=\"1090\" y=\"80\" width=\"310\" height=\"54\" rx=\"0\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.2\"/><text x=\"1245\" y=\"111.165\" text-anchor=\"middle\" font-size=\"17\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"mono\">{A,B,C,D}</text><rect x=\"40\" y=\"336\" width=\"1320\" height=\"82\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"60\" y=\"373.402\" text-anchor=\"start\" font-size=\"17\" fill=\"#1B2B33\" font-weight=\"600\" class=\"serif\">第 j 层只由更小的层组合而成，同一批组合不会重复枚举</text><text x=\"60\" y=\"390.082\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">join_search_one_level() 优先用 join clauses 连接有关系的输入；没有可用 clause 时，生成笛卡尔积候选</text></svg>","ctrl":"","anim":false},{"eyebrow":"规划层 · 乘法膨胀","title":"漏写 join 条件：SQL 合法，规模按乘法膨胀","lede":"JOIN b ON true 或 FROM a, b 都会生成笛卡尔积；小表测试毫无感觉，数据一上量就是乘法级放大。","caption":"图 11　示意数字：3 行 × 3 行 = 9 个候选行对；两侧 key 重复时输出规模也是乘法。","bridge":"有了合法的 join relation，下一步是给同一个关系找多条可行路径。","notes":"这一页单独拿出来讲，因为它太常见了。漏写连接条件时，SQL 仍然是合法语句，解析器不会拦你，小表上测试甚至跑得飞快——三行乘三行才九个行对，谁都看不出问题。\n\n但规模是乘法。左表 M 行、右表 N 行，笛卡尔积就是 M × N 行。放到线上，订单几十万、客户上万，中间结果立刻变成几十亿这个量级。而且膨胀不只发生在结果里：优化器的搜索空间也在膨胀，join_search_one_level() 在没有 join clause 时生成的笛卡尔积候选，同样会让候选路径数量和估算难度一起变大。\n\n还有个更隐蔽的版本：条件写了，但两侧连接键都有重复值。多对多关系里，输出行数是每个 key 上左行数乘右行数再求和，可能远超你以为的「匹配行数」。原文把这类风险归到「错误会乘法放大」，和漏条件、低估行数、错误 join 顺序放在一起，我觉得很准确。\n\n所以生产 SQL 的第一条纪律就是：显式写出连接条件，别让条件散在大段 WHERE 里，更别用 ON true。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40\" y=\"16\" width=\"310\" height=\"40\" rx=\"0\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1.2\"/><text x=\"195\" y=\"39.675\" text-anchor=\"middle\" font-size=\"15\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"serif\">漏写条件：3 行 × 3 行 = 9 个行对</text><rect x=\"40\" y=\"64\" width=\"92\" height=\"48\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\"/><text x=\"86\" y=\"91.185\" text-anchor=\"middle\" font-size=\"13\" fill=\"#2F7A66\" font-weight=\"600\" class=\"mono\">R1,S1</text><rect x=\"140\" y=\"64\" width=\"92\" height=\"48\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"186\" y=\"91.185\" text-anchor=\"middle\" font-size=\"13\" fill=\"#89938F\" font-weight=\"600\" class=\"mono\">R1,S2</text><rect x=\"240\" y=\"64\" width=\"92\" height=\"48\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"286\" y=\"91.185\" text-anchor=\"middle\" font-size=\"13\" fill=\"#89938F\" font-weight=\"600\" class=\"mono\">R1,S3</text><rect x=\"40\" y=\"120\" width=\"92\" height=\"48\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"86\" y=\"147.185\" text-anchor=\"middle\" font-size=\"13\" fill=\"#89938F\" font-weight=\"600\" class=\"mono\">R2,S1</text><rect x=\"140\" y=\"120\" width=\"92\" height=\"48\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\"/><text x=\"186\" y=\"147.185\" text-anchor=\"middle\" font-size=\"13\" fill=\"#2F7A66\" font-weight=\"600\" class=\"mono\">R2,S2</text><rect x=\"240\" y=\"120\" width=\"92\" height=\"48\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"286\" y=\"147.185\" text-anchor=\"middle\" font-size=\"13\" fill=\"#89938F\" font-weight=\"600\" class=\"mono\">R2,S3</text><rect x=\"40\" y=\"176\" width=\"92\" height=\"48\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"86\" y=\"203.185\" text-anchor=\"middle\" font-size=\"13\" fill=\"#89938F\" font-weight=\"600\" class=\"mono\">R3,S1</text><rect x=\"140\" y=\"176\" width=\"92\" height=\"48\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"186\" y=\"203.185\" text-anchor=\"middle\" font-size=\"13\" fill=\"#89938F\" font-weight=\"600\" class=\"mono\">R3,S2</text><rect x=\"240\" y=\"176\" width=\"92\" height=\"48\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\"/><text x=\"286\" y=\"203.185\" text-anchor=\"middle\" font-size=\"13\" fill=\"#2F7A66\" font-weight=\"600\" class=\"mono\">R3,S3</text><rect x=\"380\" y=\"64\" width=\"400\" height=\"160\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"400\" y=\"124.59\" text-anchor=\"start\" font-size=\"17\" fill=\"#245A6B\" font-weight=\"700\" class=\"serif\">有连接键时</text><text x=\"400\" y=\"141.68\" text-anchor=\"start\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" class=\"\">只输出让条件为 true 的行对</text><text x=\"400\" y=\"157.78\" text-anchor=\"start\" font-size=\"14\" fill=\"#2F7A66\" font-weight=\"600\" class=\"mono\">(R1,S1)  (R2,S2)  (R3,S3)</text><text x=\"400\" y=\"173.06\" text-anchor=\"start\" font-size=\"13\" fill=\"#89938F\" font-weight=\"400\" class=\"\">输出规模由匹配关系决定</text><rect x=\"800\" y=\"64\" width=\"560\" height=\"160\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\"/><text x=\"820\" y=\"124.303\" text-anchor=\"start\" font-size=\"17\" fill=\"#BE653B\" font-weight=\"700\" class=\"serif\">没有连接键时</text><text x=\"820\" y=\"142.213\" text-anchor=\"start\" font-size=\"15\" fill=\"#BE653B\" font-weight=\"600\" class=\"mono\">M 行 × N 行 = M × N 行候选</text><text x=\"820\" y=\"158.233\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">示意：3 × 3 = 9；订单 30 万 × 客户 1 万</text><text x=\"820\" y=\"173.347\" text-anchor=\"start\" font-size=\"13\" fill=\"#89938F\" font-weight=\"400\" class=\"\">即进入几十亿量级的中间结果（仅示意量级）</text><rect x=\"40\" y=\"240\" width=\"1320\" height=\"76\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"60\" y=\"274.402\" text-anchor=\"start\" font-size=\"17\" fill=\"#1B2B33\" font-weight=\"600\" class=\"serif\">搜索空间与结果规模同时膨胀</text><text x=\"60\" y=\"291.082\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">join_search_one_level() 生成笛卡尔积候选 → 候选路径数量与估算难度一起变大；SQL 仍然合法，解析器不会拦你</text><rect x=\"40\" y=\"328\" width=\"1320\" height=\"86\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\"/><text x=\"60\" y=\"367.402\" text-anchor=\"start\" font-size=\"17\" fill=\"#BE653B\" font-weight=\"600\" class=\"serif\">更隐蔽的版本：条件写了，但两侧连接键都有重复值</text><text x=\"60\" y=\"384.082\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">多对多关系里，输出行数是每个 key 上左行数 × 右行数再求和，可能远超预期；先想清楚要去重到什么粒度</text></svg>","ctrl":"","anim":false},{"eyebrow":"路径层 · 候选竞争","title":"同一个 join relation，会同时长出多条候选路径","lede":"add_paths_to_joinrel() 考虑所有可行路径，把未被支配的加入 pathlist；胜出者未必是总成本最低的那一条。","caption":"图 12　候选 path 带着成本、pathkeys、参数化依赖、并行属性一起竞争。","bridge":"竞争结束后，胜出的 path 会被翻译成真正的计划节点。","notes":"add_paths_to_joinrel() 是路径层的核心入口。给定一个 join relation 和两个组成关系，它会把能想到的可行路径都生成出来，交给 add_path() 去淘汰被支配的那些。\n\n对 inner join，核心候选通常是三类。Nested Loop 在 match_unsorted_outer() 里生成，尤其适合 outer 小、inner 能参数化索引查找的场景；Merge Join 由 sort_inner_and_outer() 等逻辑处理，需要 mergejoinable 条件和有序输入，必要时补一个 Sort；Hash Join 由 hash_inner_and_outer() 处理，需要 hashjoinable 条件，通常用于大批量等值连接。\n\n关键在于，「被支配」不是只看总成本。一条路径还带着启动成本、输出顺序 pathkeys、参数化依赖、并行属性。上层如果要 ORDER BY，一条总成本略高但输出已经有序的路径，可能因为省掉一个 Sort 而胜出；一条启动成本极低的路径，在 LIMIT 场景里也可能被优先选中。\n\n这就是为什么 SQL 写法差不多、计划却可能完全不同：优化器在多维属性上做取舍，而不是套一张固定映射表。理解这一点，才不会看见某个 Join 节点就下结论说「选错了」。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"490\" y=\"16\" width=\"420\" height=\"60\" rx=\"0\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.2\"/><text x=\"700\" y=\"49.92\" text-anchor=\"middle\" font-size=\"16\" fill=\"#FFFFFF\" font-weight=\"600\" class=\"serif\">一个 join relation（例如 orders ⋈ customers）</text><path d=\"M700 76 L700 100\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"/><path d=\"M250 100 L1150 100\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"/><path d=\"M250 100 L250 120\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.5\" stroke-linejoin=\"miter\"/><polygon points=\"246,112 250,120 254,112\" fill=\"#245A6B\"/><path d=\"M700 100 L700 120\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.5\" stroke-linejoin=\"miter\"/><polygon points=\"696,112 700,120 704,112\" fill=\"#245A6B\"/><path d=\"M1150 100 L1150 120\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.5\" stroke-linejoin=\"miter\"/><polygon points=\"1146,112 1150,120 1154,112\" fill=\"#245A6B\"/><rect x=\"40\" y=\"120\" width=\"420\" height=\"140\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\"/><text x=\"58\" y=\"171\" text-anchor=\"start\" font-size=\"17.5\" fill=\"#245A6B\" font-weight=\"700\" class=\"serif\">Nested Loop Path</text><text x=\"58\" y=\"187.845\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">match_unsorted_outer()</text><text x=\"58\" y=\"203.37\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">outer 驱动 inner 重扫</text><text x=\"58\" y=\"218.895\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">可用参数化索引路径</text><rect x=\"490\" y=\"120\" width=\"420\" height=\"140\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.2\"/><text x=\"508\" y=\"171\" text-anchor=\"start\" font-size=\"17.5\" fill=\"#AE8A3E\" font-weight=\"700\" class=\"serif\">Merge Join Path</text><text x=\"508\" y=\"187.845\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">sort_inner_and_outer()</text><text x=\"508\" y=\"203.37\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">需要 mergejoinable 条件</text><text x=\"508\" y=\"218.895\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">必要时补 Sort</text><rect x=\"940\" y=\"120\" width=\"420\" height=\"140\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\"/><text x=\"958\" y=\"171\" text-anchor=\"start\" font-size=\"17.5\" fill=\"#BE653B\" font-weight=\"700\" class=\"serif\">Hash Join Path</text><text x=\"958\" y=\"187.845\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\">hash_inner_and_outer()</text><text x=\"958\" y=\"203.37\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">需要 hashjoinable 条件</text><text x=\"958\" y=\"218.895\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">build + probe</text><rect x=\"40\" y=\"276\" width=\"310\" height=\"54\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"195\" y=\"306.43\" text-anchor=\"middle\" font-size=\"14\" fill=\"#245A6B\" font-weight=\"600\" class=\"\">总成本</text><rect x=\"375\" y=\"276\" width=\"310\" height=\"54\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"530\" y=\"306.43\" text-anchor=\"middle\" font-size=\"14\" fill=\"#245A6B\" font-weight=\"600\" class=\"\">启动成本</text><rect x=\"710\" y=\"276\" width=\"310\" height=\"54\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"865\" y=\"306.43\" text-anchor=\"middle\" font-size=\"14\" fill=\"#245A6B\" font-weight=\"600\" class=\"\">输出顺序 pathkeys</text><rect x=\"1045\" y=\"276\" width=\"310\" height=\"54\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"1200\" y=\"306.43\" text-anchor=\"middle\" font-size=\"14\" fill=\"#245A6B\" font-weight=\"600\" class=\"\">参数化依赖 / 并行属性</text><rect x=\"40\" y=\"344\" width=\"1320\" height=\"72\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"60\" y=\"376.402\" text-anchor=\"start\" font-size=\"17\" fill=\"#1B2B33\" font-weight=\"600\" class=\"serif\">add_path() 淘汰被支配路径：胜出者未必是总成本最低的那一条</text><text x=\"60\" y=\"393.082\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" class=\"\">上层要 ORDER BY 时，输出已有序的路径可能省掉一个 Sort；有 LIMIT 时，低启动成本路径也可能胜出</text></svg>","ctrl":"","anim":false},{"eyebrow":"计划层 · 节点分派","title":"pathtype 一锤定音，落成三种计划节点","lede":"create_join_plan() 按最优 path 的 pathtype 分派：T_MergeJoin、T_HashJoin、T_NestLoop 各有自己的建计划函数。","caption":"图 13　逻辑上都是 inner join，计划树里却是三种不同的执行节点。","bridge":"那这三种节点，数据到底是怎么流过去的？","notes":"路径竞争有了结果，create_join_plan() 就按 pathtype 分派：T_MergeJoin 走 create_mergejoin_plan()，T_HashJoin 走 create_hashjoin_plan()，T_NestLoop 走 create_nestloop_plan()。最后落到执行器的三个入口：ExecMergeJoin()、ExecHashJoin()、ExecNestLoop()。\n\n这一步看着像机械映射，其实是整条链路的分水岭。在它之前，所有东西都还是「关系」和「路径」，是逻辑对象；在它之后，计划树里出现了具体的节点类型、具体的条件字段、具体的资源假设。\n\n也正因为这样，同一条 SQL 在数据量变化、统计信息刷新、索引增删之后，计划可能换一个完全不同的节点。SQL 没改一行，行为却变了——这不是数据库不稳定，是它按新的成本输入重新做了一次工程决定。\n\n有个常见误解顺便破掉：Hash Join、Merge Join、Nested Loop 不是 SQL 的 join 类型，不是你写出来的东西，它们是 PostgreSQL 认为成本最低的执行方式。SQL 里只有 INNER、LEFT、FULL、CROSS 这些语义类型。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40\" y=\"16\" width=\"300\" height=\"96\" rx=\"0\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.2\"/><text x=\"190\" y=\"67.92\" text-anchor=\"middle\" font-size=\"16\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"mono\">T_NestLoop</text><rect x=\"400\" y=\"16\" width=\"380\" height=\"96\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\"/><text x=\"590\" y=\"67.675\" text-anchor=\"middle\" font-size=\"15\" fill=\"#245A6B\" font-weight=\"600\" class=\"mono\">create_nestloop_plan()</text><rect x=\"840\" y=\"16\" width=\"240\" height=\"96\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"960\" y=\"67.675\" text-anchor=\"middle\" font-size=\"15\" fill=\"#1B2B33\" font-weight=\"600\" class=\"\">NestLoop 节点</text><rect x=\"1120\" y=\"16\" width=\"240\" height=\"96\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"1240\" y=\"67.43\" text-anchor=\"middle\" font-size=\"14\" fill=\"#46585F\" font-weight=\"500\" class=\"mono\">ExecNestLoop()</text><path d=\"M340 64 L400 64\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"/><polygon points=\"392,60 400,64 392,68\" fill=\"#245A6B\"/><path d=\"M780 64 L840 64\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"/><polygon points=\"832,60 840,64 832,68\" fill=\"#245A6B\"/><path d=\"M1080 64 L1120 64\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"/><polygon points=\"1112,60 1120,64 1112,68\" fill=\"#245A6B\"/><rect x=\"40\" y=\"132\" width=\"300\" height=\"96\" rx=\"0\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.2\"/><text x=\"190\" y=\"183.92\" text-anchor=\"middle\" font-size=\"16\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"mono\">T_HashJoin</text><rect x=\"400\" y=\"132\" width=\"380\" height=\"96\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\"/><text x=\"590\" y=\"183.675\" text-anchor=\"middle\" font-size=\"15\" fill=\"#BE653B\" font-weight=\"600\" class=\"mono\">create_hashjoin_plan()</text><rect x=\"840\" y=\"132\" width=\"240\" height=\"96\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"960\" y=\"183.675\" text-anchor=\"middle\" font-size=\"15\" fill=\"#1B2B33\" font-weight=\"600\" class=\"\">HashJoin 节点</text><rect x=\"1120\" y=\"132\" width=\"240\" height=\"96\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"1240\" y=\"183.43\" text-anchor=\"middle\" font-size=\"14\" fill=\"#46585F\" font-weight=\"500\" class=\"mono\">ExecHashJoin()</text><path d=\"M340 180 L400 180\" fill=\"none\" stroke=\"#BE653B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"/><polygon points=\"392,176 400,180 392,184\" fill=\"#BE653B\"/><path d=\"M780 180 L840 180\" fill=\"none\" stroke=\"#BE653B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"/><polygon points=\"832,176 840,180 832,184\" fill=\"#BE653B\"/><path d=\"M1080 180 L1120 180\" fill=\"none\" stroke=\"#BE653B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"/><polygon points=\"1112,176 1120,180 1112,184\" fill=\"#BE653B\"/><rect x=\"40\" y=\"248\" width=\"300\" height=\"96\" rx=\"0\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.2\"/><text x=\"190\" y=\"299.92\" text-anchor=\"middle\" font-size=\"16\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"mono\">T_MergeJoin</text><rect x=\"400\" y=\"248\" width=\"380\" height=\"96\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.2\"/><text x=\"590\" y=\"299.675\" text-anchor=\"middle\" font-size=\"15\" fill=\"#AE8A3E\" font-weight=\"600\" class=\"mono\">create_mergejoin_plan()</text><rect x=\"840\" y=\"248\" width=\"240\" height=\"96\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"960\" y=\"299.675\" text-anchor=\"middle\" font-size=\"15\" fill=\"#1B2B33\" font-weight=\"600\" class=\"\">MergeJoin 节点</text><rect x=\"1120\" y=\"248\" width=\"240\" height=\"96\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"1240\" y=\"299.43\" text-anchor=\"middle\" font-size=\"14\" fill=\"#46585F\" font-weight=\"500\" class=\"mono\">ExecMergeJoin()</text><path d=\"M340 296 L400 296\" fill=\"none\" stroke=\"#AE8A3E\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"/><polygon points=\"392,292 400,296 392,300\" fill=\"#AE8A3E\"/><path d=\"M780 296 L840 296\" fill=\"none\" stroke=\"#AE8A3E\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"/><polygon points=\"832,292 840,296 832,300\" fill=\"#AE8A3E\"/><path d=\"M1080 296 L1120 296\" fill=\"none\" stroke=\"#AE8A3E\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"/><polygon points=\"1112,292 1120,296 1112,300\" fill=\"#AE8A3E\"/><rect x=\"40\" y=\"364\" width=\"1320\" height=\"54\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"60\" y=\"394.92\" text-anchor=\"start\" font-size=\"16\" fill=\"#1B2B33\" font-weight=\"600\" class=\"serif\">create_join_plan() 按 pathtype 分派：逻辑上同为 inner join，计划树里却是三种执行节点</text></svg>","ctrl":"","anim":false},{"eyebrow":"执行层 · 数据流","title":"三种算法，三种数据流","lede":"Nested Loop 由 outer 驱动 inner 反复查找；Hash Join 先 build 再 probe；Merge Join 依赖两侧有序流同步推进。","caption":"图 14　三种数据流的几何形状不同，成本形状自然也不同。","bridge":"数据流不同，成本形状就不同——没有一种方法永远正确。","notes":"把三种算法的数据流并排看，差别非常直观。\n\nNested Loop 是双层循环：取一行 outer tuple，拿它的连接键去 inner 侧查一次，再把结果配对输出；outer 有多少行，inner 侧就可能被访问多少次。它的命门是 inner 单次访问成本，所以 inner 侧有参数化索引扫描时特别强，反之就是灾难。\n\nHash Join 是一次性建结构：先扫较小或过滤后较小的一侧，按连接键 build 一张 hash table，再扫另一侧逐行 probe 对应 bucket。它的成本形状是 build 加 probe，不需要索引来定位，但 build 侧要装得进内存，装不下就 batch、spill 到临时文件。\n\nMerge Join 是两路同步：两侧都按连接键有序，然后像拉链一样同步前进，key 相等时进入匹配状态输出组合。有序可以来自 B-tree 索引，也可以来自现加的 Sort；重复 key 多的时候还要 mark/restore 重放。\n\n原文给的三个成本形状很凝练：outer rows × inner rescan cost、build + probe、有序输入获取 + 同步合并。记住这三个形状，比记住三个名字有用得多。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40\" y=\"16\" width=\"420\" height=\"48\" rx=\"0\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.2\"/><text x=\"250\" y=\"44.41\" text-anchor=\"middle\" font-size=\"18\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"serif\">Nested Loop</text><rect x=\"40\" y=\"80\" width=\"420\" height=\"56\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\"/><text x=\"56\" y=\"111.552\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"400\" class=\"\">① 取一行 outer tuple</text><path d=\"M250 136 L250 150\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.5\" stroke-linejoin=\"miter\"/><polygon points=\"246,142 250,150 254,142\" fill=\"#245A6B\"/><rect x=\"40\" y=\"150\" width=\"420\" height=\"56\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\"/><text x=\"56\" y=\"181.552\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"400\" class=\"\">② 用连接键重扫 inner</text><path d=\"M250 206 L250 220\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.5\" stroke-linejoin=\"miter\"/><polygon points=\"246,212 250,220 254,212\" fill=\"#245A6B\"/><rect x=\"40\" y=\"220\" width=\"420\" height=\"56\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\"/><text x=\"56\" y=\"251.552\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"400\" class=\"\">③ 参数化索引点查</text><path d=\"M250 276 L250 290\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.5\" stroke-linejoin=\"miter\"/><polygon points=\"246,282 250,290 254,282\" fill=\"#245A6B\"/><rect x=\"40\" y=\"290\" width=\"420\" height=\"56\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\"/><text x=\"56\" y=\"321.553\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"600\" class=\"\">④ 组合并检查 joinqual</text><rect x=\"490\" y=\"16\" width=\"420\" height=\"48\" rx=\"0\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1.2\"/><text x=\"700\" y=\"44.41\" text-anchor=\"middle\" font-size=\"18\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"serif\">Hash Join</text><rect x=\"490\" y=\"80\" width=\"420\" height=\"56\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\"/><text x=\"506\" y=\"111.552\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"400\" class=\"\">① 扫描 build 侧输入</text><path d=\"M700 136 L700 150\" fill=\"none\" stroke=\"#BE653B\" stroke-width=\"1.5\" stroke-linejoin=\"miter\"/><polygon points=\"696,142 700,150 704,142\" fill=\"#BE653B\"/><rect x=\"490\" y=\"150\" width=\"420\" height=\"56\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\"/><text x=\"506\" y=\"181.552\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"400\" class=\"\">② 按 key 建 hash table</text><path d=\"M700 206 L700 220\" fill=\"none\" stroke=\"#BE653B\" stroke-width=\"1.5\" stroke-linejoin=\"miter\"/><polygon points=\"696,212 700,220 704,212\" fill=\"#BE653B\"/><rect x=\"490\" y=\"220\" width=\"420\" height=\"56\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\"/><text x=\"506\" y=\"251.552\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"400\" class=\"\">③ 扫描 probe 侧输入</text><path d=\"M700 276 L700 290\" fill=\"none\" stroke=\"#BE653B\" stroke-width=\"1.5\" stroke-linejoin=\"miter\"/><polygon points=\"696,282 700,290 704,282\" fill=\"#BE653B\"/><rect x=\"490\" y=\"290\" width=\"420\" height=\"56\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\"/><text x=\"506\" y=\"321.553\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#BE653B\" font-weight=\"600\" class=\"\">④ 命中 bucket 后检查 joinqual</text><rect x=\"940\" y=\"16\" width=\"420\" height=\"48\" rx=\"0\" fill=\"#AE8A3E\" stroke=\"#AE8A3E\" stroke-width=\"1.2\"/><text x=\"1150\" y=\"44.41\" text-anchor=\"middle\" font-size=\"18\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"serif\">Merge Join</text><rect x=\"940\" y=\"80\" width=\"420\" height=\"56\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.2\"/><text x=\"956\" y=\"111.552\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"400\" class=\"\">① 两侧按 key 有序</text><path d=\"M1150 136 L1150 150\" fill=\"none\" stroke=\"#AE8A3E\" stroke-width=\"1.5\" stroke-linejoin=\"miter\"/><polygon points=\"1146,142 1150,150 1154,142\" fill=\"#AE8A3E\"/><rect x=\"940\" y=\"150\" width=\"420\" height=\"56\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.2\"/><text x=\"956\" y=\"181.552\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"400\" class=\"\">② 同步推进两侧指针</text><path d=\"M1150 206 L1150 220\" fill=\"none\" stroke=\"#AE8A3E\" stroke-width=\"1.5\" stroke-linejoin=\"miter\"/><polygon points=\"1146,212 1150,220 1154,212\" fill=\"#AE8A3E\"/><rect x=\"940\" y=\"220\" width=\"420\" height=\"56\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.2\"/><text x=\"956\" y=\"251.552\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"400\" class=\"\">③ key 相等进入匹配状态</text><path d=\"M1150 276 L1150 290\" fill=\"none\" stroke=\"#AE8A3E\" stroke-width=\"1.5\" stroke-linejoin=\"miter\"/><polygon points=\"1146,282 1150,290 1154,282\" fill=\"#AE8A3E\"/><rect x=\"940\" y=\"290\" width=\"420\" height=\"56\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.2\"/><text x=\"956\" y=\"321.553\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#AE8A3E\" font-weight=\"600\" class=\"\">④ 检查额外 joinqual</text><rect x=\"40\" y=\"364\" width=\"1320\" height=\"54\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"60\" y=\"394.92\" text-anchor=\"start\" font-size=\"16\" fill=\"#1B2B33\" font-weight=\"600\" class=\"serif\">成本形状：outer rows × inner rescan cost　｜　build + probe　｜　有序输入获取 + 同步合并</text></svg>","ctrl":"","anim":false},{"eyebrow":"执行层 · 成本边界","title":"选谁，取决于输入规模和已有资源","lede":"首行延迟、outer 行数、等值条件、已有顺序、work_mem 边界——每一项都会把天平推向不同的一侧。","caption":"图 15　优势区间是成本形状推出来的结果，不是挂在算法名字上的标签。","bridge":"计划树定下来之后，SQL 里的条件会被拆到不同位置执行。","notes":"这一页把成本边界摊成一张判据表，请注意它是定性判断，不是性能数字。\n\n小 outer 加 inner 参数化索引点查，Nested Loop 启动成本低、能早出首行，是 OLTP 点查和 EXISTS 的优势区间；真正的风险是 outer 实际行数远大于估算，或者 inner 每次都要高成本重扫。大批量等值连接，Hash Join 的 build + probe 更稳，但要盯住 build 侧大小和倾斜，Batches 从 1 变大就是内存边界被触碰的信号。两侧本来就有序、或者上层还要按同样顺序输出，Merge Join 可以省掉排序、还能把顺序复用给上层；若得现排序，启动成本就上去了。\n\n还有两个横向因素。首行延迟敏感时，优化器会偏向低启动成本路径；并发高时，一个 SQL 里可能同时有好几个 hash、sort、materialize 节点，单看 work_mem 不够，得乘上并发数。\n\n所以「看到 Hash Join 就说不需要索引」「看到 Nested Loop 就说计划错了」都是把定性判断做成了条件反射。先看输入规模、再看估算准不准、最后看资源边界，顺序不能反。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"40\" y=\"16\" width=\"320\" height=\"46\" rx=\"0\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.2\"/><text x=\"200\" y=\"42.92\" text-anchor=\"middle\" font-size=\"16\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"serif\">判断维度</text><rect x=\"360\" y=\"16\" width=\"340\" height=\"46\" rx=\"0\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.2\"/><text x=\"530\" y=\"42.92\" text-anchor=\"middle\" font-size=\"16\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"mono\">Nested Loop</text><rect x=\"700\" y=\"16\" width=\"340\" height=\"46\" rx=\"0\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.2\"/><text x=\"870\" y=\"42.92\" text-anchor=\"middle\" font-size=\"16\" fill=\"#FFFFFF\" font-weight=\"700\" class=\"mono\">Hash Join</text><rect x=\"1040\" y=\"16\" width=\"320\" height=\"46\" rx=\"0\" fill=\"#2E6373\" stroke=
