<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数据库筑基课 · LEFT OUTER JOIN｜语义边界与七层剖面</title>
<!-- 单文件交付：所有原理图均为现场绘制的内联 SVG，零外部图片 / 字体 / 脚本依赖。 -->
<!-- 视觉母题：地层剖面 / 工程蓝图。内容按「消失的订单 → 语义边界 → 七层剖面 → 实证 → 收束」推演。 -->
<style>
:root{
  --bg:#F7F6F2; --ink:#1B2B33; --ink2:#46585F; --muted:#89938F; --line:#D9D5CB;
  --primary:#245A6B; --prim-l:#E5EFF0; --accent:#BE653B; --acc-l:#F7E9DE;
  --green:#2F7A66; --green-l:#E4F0EA; --gold:#AE8A3E; --dw:520px;
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#E9E7E1}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
#viewport{position:absolute;inset:0 0 58px 0;overflow:hidden}
#stage{position:absolute;width:1600px;height:900px;background:var(--bg);
  transform-origin:top left;box-shadow:0 18px 60px rgba(27,43,51,.13)}
.slide{position:absolute;inset:0;display:none}
.slide.on{display:block;animation:fadein .42s cubic-bezier(.2,.7,.2,1)}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{position:absolute;left:64px;top:44px;font-size:13px;letter-spacing:3.4px;
  color:var(--primary);font-weight:600}
.eyebrow .num{font-family:var(--mono);letter-spacing:1px;color:var(--accent);margin-right:14px}
h1.title{position:absolute;left:64px;top:70px;margin:0;font-family:var(--serif);
  font-size:44px;line-height:1.25;font-weight:700;letter-spacing:1.2px;color:var(--ink)}
.lede{position:absolute;left:64px;top:139px;width:1440px;font-size:19px;color:var(--ink2);
  line-height:1.5;letter-spacing:.3px}
.rule{position:absolute;left:64px;top:181px;width:1472px;height:1px;background:var(--line)}
.figwrap{position:absolute;left:100px;top:198px;width:1400px;height:430px}
svg.figure{display:block;overflow:visible}
svg.figure text{font-family:var(--sans)}
svg.figure text.serif{font-family:var(--serif)}
svg.figure text.mono{font-family:var(--mono)}
.caption{position:absolute;left:100px;top:638px;width:1400px;font-size:13px;
  color:var(--muted);letter-spacing:.4px}
.caption.cap-tight{top:624px}
.bridge{position:absolute;left:64px;top:706px;width:1472px;font-size:20px;
  color:var(--accent);line-height:1.55;letter-spacing:.4px;padding-left:18px;
  border-left:3px solid var(--accent);font-family:var(--serif)}
.bridge .bk{font-family:var(--sans);font-size:13px;color:var(--muted);
  letter-spacing:2px;display:block;margin-bottom:2px}
.footer{position:absolute;left:64px;top:846px;width:1472px;height:1px;background:var(--line)}
.footer .fl{position:absolute;left:0;top:14px;font-size:12.5px;color:var(--muted);letter-spacing:2px}
.footer .fr{position:absolute;right:0;top:12px;font-family:var(--mono);font-size:14px;color:var(--ink2)}
.footer .fbar{position:absolute;left:0;right:0;top:-1px;height:2px;background:transparent}
.footer .fbar i{display:block;height:2px;background:var(--primary);width:0;transition:width .4s ease}

/* 动画页控件：图下方独立条带，绝不覆盖图 */
.ctrls{position:absolute;left:100px;top:650px;width:1400px;height:48px;display:flex;
  align-items:center;gap:8px}
.ctrls label{font-size:12px;color:var(--ink2);white-space:nowrap}
.ctrls select{font-family:var(--sans);font-size:12px;color:var(--ink);max-width:250px;
  background:#fff;border:1px solid var(--line);border-radius:4px;padding:4px 6px;outline:none}
.ctrls .btn{min-height:28px;padding:4px 11px;border:1px solid var(--primary);border-radius:4px;
  background:#fff;color:var(--primary);font-size:12px;cursor:pointer;font-family:var(--sans);
  white-space:nowrap}
.ctrls .btn.play{background:var(--primary);color:#fff}
.ctrls .btn:hover{filter:brightness(.94)}
.ctrls .out{font-size:12.5px;color:var(--ink2);margin-left:auto;min-width:150px;flex:1;
  max-width:460px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrls .out b{color:var(--accent);font-weight:600}

/* 底部外壳：全屏时也必须显示按键 */
.chrome{position:fixed;left:0;right:0;bottom:0;height:58px;background:#FCFBF8;
  border-top:1px solid var(--line);display:flex;align-items:center;gap:6px;
  padding:0 16px;z-index:50;font-size:13px;color:var(--ink2)}
.chrome .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.chrome button{font-family:var(--sans);font-size:12.5px;color:var(--ink2);background:transparent;
  border:1px solid transparent;border-radius:5px;padding:6px 9px;cursor:pointer;white-space:nowrap}
.chrome button:hover{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome button.act{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome button.k{font-family:var(--mono);font-size:12px;color:var(--muted)}
.chrome .pg{font-family:var(--mono);font-size:14px;color:var(--ink);min-width:74px;text-align:center}
.chrome .track{flex:0 1 110px;height:3px;background:var(--line);border-radius:3px;margin:0 8px;position:relative}
.chrome .track i{position:absolute;left:0;top:0;height:3px;background:var(--primary);border-radius:3px;transition:width .35s}
.chrome .hint{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;
  letter-spacing:.2px;flex:1;text-align:right;overflow:hidden;text-overflow:ellipsis}
body.immersive .chrome{background:#F1EFE9;box-shadow:0 -2px 14px rgba(27,43,51,.08)}
body.immersive .chrome .hint{color:var(--primary);font-weight:600}

/* 页内右侧讲稿窗（不是弹窗）：打开时舞台矢量缩到左侧 */
#drawer{position:fixed;right:0;top:0;bottom:58px;width:var(--dw);background:#FCFBF8;
  border-left:1px solid var(--line);z-index:45;display:none;flex-direction:column;
  box-shadow:-14px 0 34px rgba(27,43,51,.07)}
body.notes-on #drawer{display:flex}
#drawer .dh{padding:18px 24px 14px;border-bottom:1px solid var(--line);background:#F7F6F2;
  display:flex;align-items:flex-start;gap:12px}
#drawer .dh .dt{font-family:var(--serif);font-size:22px;color:var(--ink);line-height:1.25}
#drawer .dh .ds{font-size:12px;color:var(--muted);letter-spacing:1.2px;margin-top:5px}
#drawer .dh .dc{font-family:var(--mono);font-size:13px;color:var(--accent);margin-left:auto;
  white-space:nowrap;padding-top:4px}
#drawer .dh button{border:1px solid var(--line);background:#fff;border-radius:5px;
  font-size:12px;color:var(--ink2);padding:5px 9px;cursor:pointer;margin-left:10px}
#drawerBody{position:relative;flex:1;overflow-y:auto;padding:8px 24px 40px;scroll-behavior:auto}
.nsec{border-bottom:1px solid var(--line);padding:18px 12px 20px;cursor:pointer;
  border-left:3px solid transparent;transition:background .25s}
.nsec:hover{background:#F1EFE9}
.nsec.cur{background:var(--prim-l);border-left-color:var(--primary)}
.nsec .nn{font-family:var(--mono);font-size:11.5px;color:var(--accent);letter-spacing:1px}
.nsec h3{margin:6px 0 10px;font-family:var(--serif);font-size:19px;color:var(--primary);font-weight:700}
.nsec p{margin:0;font-size:15px;line-height:1.95;color:var(--ink2);letter-spacing:.3px}
.nsec .nx{margin-top:12px;font-family:var(--serif);font-size:14px;color:var(--accent);
  line-height:1.7;border-left:2px solid var(--accent);padding-left:10px}
.here{padding:16px 12px 30px}
.here .hn{font-family:var(--mono);font-size:11.5px;color:var(--accent);letter-spacing:1px}
.here h3{margin:8px 0 18px;font-family:var(--serif);font-size:25px;color:var(--primary)}
.here p{font-size:16px;line-height:2.05;color:var(--ink2);letter-spacing:.4px;margin:0 0 18px}
.here .tip{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;
  line-height:1.8}

/* 目录 / 帮助：页内浮窗，非全屏模态 */
.veil{position:fixed;inset:0 0 58px 0;background:rgba(27,43,51,.20);z-index:60;display:none;
  align-items:center;justify-content:center}
.veil.on{display:flex}
.panel{width:min(1060px,92vw);max-height:82vh;overflow:auto;background:var(--bg);
  border:1px solid var(--line);border-radius:8px;box-shadow:0 24px 70px rgba(27,43,51,.22);
  padding:30px 36px 36px}
.panel h2{margin:0 0 6px;font-family:var(--serif);font-size:29px;color:var(--ink)}
.panel .psub{font-size:13px;color:var(--muted);margin-bottom:22px;letter-spacing:1px}
.panel .close{position:sticky;top:0;float:right;background:#fff;border:1px solid var(--line);
  border-radius:5px;padding:6px 12px;font-size:12.5px;cursor:pointer;color:var(--ink2)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.grid a{display:block;padding:12px 12px;border:1px solid var(--line);border-radius:5px;
  background:#fff;text-decoration:none;color:var(--ink);cursor:pointer;transition:.2s}
.grid a:hover{border-color:var(--primary);background:var(--prim-l);transform:translateY(-2px)}
.grid a .gn{font-family:var(--mono);font-size:11.5px;color:var(--accent)}
.grid a .gt{font-family:var(--serif);font-size:15px;line-height:1.4;display:block;margin-top:5px}
.keys{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 30px;font-size:14.5px;line-height:1.9}
.keys kbd{font-family:var(--mono);background:#fff;border:1px solid var(--line);
  border-bottom-width:2px;border-radius:4px;padding:2px 7px;color:var(--primary);margin-right:8px}
.toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);background:var(--ink);
  color:#fff;font-size:12.5px;padding:9px 16px;border-radius:5px;opacity:0;transition:.3s;
  z-index:80;pointer-events:none;max-width:80vw}
.toast.on{opacity:1}
@media print{.chrome,.veil,.toast,#drawer{display:none!important}#viewport{position:static}
  #stage{position:static;transform:none!important;box-shadow:none}
  .slide{display:block!important;page-break-after:always;position:relative;height:900px}}
</style>
</head>

<div id="viewport"><div id="stage"><div id="slides"></div></div></div>

<div id="drawer">
  <div class="dh">
    <div><div class="dt" id="drawerTitle">本页讲稿 · N</div><div class="ds" id="drawerSub">只显示当前页 · 翻页自动联动</div></div>
    <div class="dc" id="drawerCount">01 / 23</div>
    <button id="drawerClose">关闭 ✕</button>
  </div>
  <div id="drawerBody"></div>
</div>

<div class="chrome">
  <button id="btnPrev">← 上一页</button>
  <button id="btnNext">下一页 →</button>
  <span class="pg" id="pg">01 / 23</span>
  <div class="track" id="track"><i></i></div>
  <div class="sep"></div>
  <button id="btnToc">目录 G</button>
  <button id="btnNotes">本页讲稿 N</button>

<div class="veil" id="veil"><div class="panel" id="panel"></div></div>

<script>
const D = [{"eyebrow":"开场 · 一个会真实发生的场景","title":"一条 INNER JOIN，让订单凭空消失","lede":"订单表三笔、支付表两笔。用 INNER JOIN 查「所有订单的支付状态」，结果只回来两行 —— 没支付的那笔订单不见了。","caption":"图 01　示意数据取自本文第 6 节 DEMO；此处为语义推导，不是本机实测输出。","bridge":"先别急着改 SQL。我们得把业务到底要什么，翻译成数据库能执行的数据流约束。","notes":"我想从一个特别常见、也特别容易糊弄过去的场景讲起。订单表里躺着三笔订单，支付表里只有两笔支付记录：第一笔成功，第二笔失败，第三笔订单压根还没产生支付动作。业务同学过来说，我要看「所有订单的支付状态」，于是有人写了 INNER JOIN。跑出来两行。看起来挺干净，对吧？可第三笔订单去哪了？它没有支付记录，和支付表组合不出任何满足 join condition 的行对，INNER JOIN 就把它丢掉了。注意，这不是数据库算错了，是它忠实执行了我们写下的语义：只输出两边都匹配上的行。问题出在写 SQL 的人身上——他把「所有订单」这个需求，偷偷换成了「已经有过支付动作的订单」。而且这种错特别隐蔽，因为结果集不报错、不为空，只是少了几行；报表数字差一点，往往要等到月底对账才被发现。所以今天这一场，我们不背语法，就追一件事：数据库凭什么能保证「主表一行都不少」，以及为了这个保证，它和我们各自要付出什么代价。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"40\" y=\"24\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >示意数据：本文第 6 节 DEMO 的 orders / payments；以下为语义推导，不是实测 EXPLAIN 输出</text><rect x=\"40\" y=\"40\" width=\"150\" height=\"38\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"115.0\" y=\"63.55\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\">orders.order_id</text><rect x=\"190\" y=\"40\" width=\"150\" height=\"38\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"265.0\" y=\"63.55\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\">customer_id</text><rect x=\"340\" y=\"40\" width=\"150\" height=\"38\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"415.0\" y=\"63.55\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\">amount</text><rect x=\"40\" y=\"78\" width=\"150\" height=\"40\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"115.0\" y=\"102.9\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\">1</t =\"14.0\" fill=\"#1B2B33\" font-weight=\"400\">299.00</text><rect x=\"530\" y=\"96\" width=\"200\" height=\"76\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"630.0\" y=\"127.675\" class=\"sv s\" text-anchor=\"middle\" font-size=\"19.0\" fill=\"#245A6B\" font-weight=\"600\" >INNER JOIN</text><text x=\"630.0\" y=\"148.375\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >ON p.order_id = o.order_id</text><line x1=\"490\" y1=\"134\" x2=\"523.6\" y2=\"134\" stroke=\"#245A6B\" stroke-width=\"2.0\"/><polygon points=\"530,134 522,129.6 522,138.4\" fill=\"#245A6B\"/><line x1=\"760\" y1=\"134\" x2=\"736.4\" y2=\"134\" stroke=\"#245A6B\" stroke-width=\"2.0\"/><polygon points=\"730,134 738,129.6 738,138.4\" fill=\"#245A6B\"/><rect x=\"760\" y=\"40\" width=\"130\" height=\"38\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"825.0\" y=\"63.55\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\">payment_id</text><rect x=\"890\" y=\"40\" width=\"130\" height=\"38\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"955.0\" y=\"63.55\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\">order_id</text><rect x=\"1020\" y=\"40\" width=\"140\" height=\"38\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"1090.0\" y=\"63.55\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\">status</text><rect x=\"760\" y=\"78\" width=\"130\" height=\"40\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"825.0\" y=\"102.9\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\">1001</text><rect x=\"890\" y=\"78\" width=\"130\" height=\"40\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"955.0\" y=\"102.9\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\">1</text><rect x=\"1020\" y=\"78\" width=\"140\" height=\"40\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"1090.0\" y=\"102.9\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\">successful</text><rect x=\"760\" y=\"118\" width=\"130\" height=\"40\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"825.0\" y=\"142.9\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\">1002</text><rect x=\"890\" y=\"118\" width=\"130\" height=\"40\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"955.0\" y=\"142.9\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\">2</text><rect x=\"1020\" y=\"118\" width=\"140\" height=\"40\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"1090.0\" y=\"142.9\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\">failed</text><line x1=\"630\" y1=\"172\" x2=\"630\" y2=\"213.6\" stroke=\"#245A6B\" stroke-width=\"2.0\"/><polygon points=\"630,220 625.6,212 634.4,212\" fill=\"#245A6B\"/><text x=\"40\" y=\"214\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >INNER JOIN 只输出 join condition 为 true 的行对</text><rect x=\"40\" y=\"228\" width=\"160\" height=\"38\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"120.0\" y=\"251.55\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\">order_id</text><rect x=\"200\" y=\"228\" width=\"150\" height=\"38\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"275.0\" y=\"251.55\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\">amount</text><rect x=\"350\" y=\"228\" width=\"150\" height=\"38\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"425.0\" y=\"251.55\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\">payment_id</text><rect x=\"500\" y=\"228\" width=\"160\" height=\"38\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"580.0\" y=\"251.55\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\">p.status</text><rect x=\"40\" y=\"266\" width=\"160\" height=\"40\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"120.0\" y=\"290.9\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\">1</text><rect x=\"200\" y=\"266\" width=\"150\" height=\"40\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"275.0\" y=\"290.9\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\">99.00</text><rect x=\"350\" y=\"266\" width=\"150\" height=\"40\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"425.0\" y=\"290.9\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\">1001</text><rect x=\"500\" y=\"266\" width=\"160\" height=\"40\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"580.0\" y=\"290.9\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\">successful</text><rect x=\"40\" y=\"306\" width=\"160\" height=\"40\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"120.0\" y=\"330.9\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\">2</text><rect x=\"200\" y=\"306\" width=\"150\" height=\"40\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"275.0\" y=\"330.9\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\">199.00</text><rect x=\"350\" y=\"306\" width=\"150\" height=\"40\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"425.0\" y=\"330.9\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\">1002</text><rect x=\"500\" y=\"306\" width=\"160\" height=\"40\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"580.0\" y=\"330.9\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\">failed</text><rect x=\"880\" y=\"228\" width=\"480\" height=\"118\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.4\" stroke-dasharray=\"6 4\"/><text x=\"902\" y=\"264\" class=\"sv serif\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#BE653B\" font-weight=\"700\" >订单 3 · payments 中没有匹配行</text><text x=\"902\" y=\"296\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >INNER JOIN 不会为它输出任何一行</text><text x=\"902\" y=\"322\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >于是报表里，这笔订单凭空消失了。</text><rect x=\"40\" y=\"372\" width=\"1320\" height=\"44\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1\" /><text x=\"54\" y=\"399.6\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#AE8A3E\" font-weight=\"600\">业务要的是「所有订单的支付状态」，不是「已经支付过的订单」。</text></svg>","ctrl":"","anim":""},{"eyebrow":"需求 · 把业务话翻译成数据流","title":"业务要的是「所有订单」","lede":"把「所有订单的支付状态」拆开，其实是四条必须同时成立的数据流约束，而不是一句模糊的需求。","caption":"图 02　四条约束从左到右依次收紧：先保证不丢行，再规定匹配，再规定补 NULL，最后规定上层看到什么。","bridge":"四条约束里，最要命的是第四条：上层算子看到的是补完 NULL 之后的结果。这句话决定了后面所有的坑。","notes":"我们把业务那句话拆细一点。第一，每个左表订单至少贡献一行结果——注意是「至少」，不是「恰好」，因为右边可能有多笔支付。第二，右表真有匹配记录时，输出真实的右表列，不能拿占位符糊弄。第三，右表没有匹配时，左行照样输出，右侧所有列补成 NULL。第四，也是最容易漏的：后面的 WHERE、聚合、排序、窗口函数，看到的都已经是补完 NULL 之后的那张结果表了。这四条不是并列的四个愿望，是有先后顺序的一条流水线：先保证不丢行，再判匹配，再补 NULL，最后才允许上层过滤。为什么要强调顺序？因为 SQL 里真正能把这个顺序写错的，恰恰是我们自己——一个条件放错位置，就等于把它从流水线尾部挪到了头部。相比 INNER JOIN，LEFT JOIN 换来的是主表完整性，牺牲的是两样东西：优化器重排的自由度，和开发者对结果的语义直觉。这两笔账，后面会一次一次地回来找我们。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"40\" y=\"24\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >把需求翻译成数据库内部的数据流约束：四个必须同时成立</text><rect x=\"40\" y=\"54\" width=\"310\" height=\"250\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><rect x=\"40\" y=\"54\" width=\"310\" height=\"8\" rx=\"2\" fill=\"#EBF1EE\" stroke=\"#EBF1EE\" stroke-width=\"1\" /><text x=\"60\" y=\"112\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"700\" >① 每个左表订单</text><text x=\"60\" y=\"158\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#1B2B33\" font-weight=\"700\" >至少贡献一行结果</text><line x1=\"60\" y1=\"186\" x2=\"330\" y2=\"186\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"60\" y=\"220\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >不能因为右侧缺失而消失</text><text x=\"60\" y=\"250\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >LEFT JOIN 负责</text><line x1=\"350\" y1=\"180\" x2=\"364.4\" y2=\"180\" stroke=\"#7BA6AF\" stroke-width=\"2\"/><polygon points=\"370,180 363,176.15 363,183.85\" fill=\"#7BA6AF\"/><rect x=\"370\" y=\"54\" width=\"310\" height=\"250\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><rect x=\"370\" y=\"54\" width=\"310\" height=\"8\" rx=\"2\" fill=\"#CFE0DC\" stroke=\"#CFE0DC\" stroke-width=\"1\" /><text x=\"390\" y=\"112\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"700\" >② 右表有匹配</text><text x=\"390\" y=\"158\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#1B2B33\" font-weight=\"700\" >输出真实右表列</text><line x1=\"390\" y1=\"186\" x2=\"660\" y2=\"186\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"390\" y=\"220\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >匹配由 join condition 判定</text><text x=\"390\" y=\"250\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >LEFT JOIN 负责</text><line x1=\"680\" y1=\"180\" x2=\"694.4\" y2=\"180\" stroke=\"#7BA6AF\" stroke-width=\"2\"/><polygon points=\"700,180 693,176.15 693,183.85\" fill=\"#7BA6AF\"/><rect x=\"700\" y=\"54\" width=\"310\" height=\"250\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><rect x=\"700\" y=\"54\" width=\"310\" height=\"8\" rx=\"2\" fill=\"#A4C4C6\" stroke=\"#A4C4C6\" stroke-width=\"1\" /><text x=\"720\" y=\"112\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"700\" >③ 右表无匹配</text><text x=\"720\" y=\"158\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#1B2B33\" font-weight=\"700\" >右侧列补成 NULL</text><line x1=\"720\" y1=\"186\" x2=\"990\" y2=\"186\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"720\" y=\"220\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >左行仍保留</text><text x=\"720\" y=\"250\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >LEFT JOIN 负责</text><line x1=\"1010\" y1=\"180\" x2=\"1024.4\" y2=\"180\" stroke=\"#7BA6AF\" stroke-width=\"2\"/><polygon points=\"1030,180 1023,176.15 1023,183.85\" fill=\"#7BA6AF\"/><rect x=\"1030\" y=\"54\" width=\"310\" height=\"250\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><rect x=\"1030\" y=\"54\" width=\"310\" height=\"8\" rx=\"2\" fill=\"#74A5AD\" stroke=\"#74A5AD\" stroke-width=\"1\" /><text x=\"1050\" y=\"112\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"700\" >④ 上层算子看到</text><text x=\"1050\" y=\"158\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#1B2B33\" font-weight=\"700\" >已补 NULL 后的结果</text><line x1=\"1050\" y1=\"186\" x2=\"1320\" y2=\"186\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1050\" y=\"220\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >WHERE / 聚合 / 排序 / 窗口</text><text x=\"1050\" y=\"250\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >LEFT JOIN 负责</text><rect x=\"40\" y=\"332\" width=\"1320\" height=\"76\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"54\" y=\"375.95\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"600\">这四条约束决定了后面的一切：谁有资格判「匹配」、什么时候补 NULL、补完以后谁能再过滤。</text></svg>","ctrl":"","anim":""},{"eyebrow":"核心命题 · 一句话讲完语义边界","title":"三个台阶，顺序不能交换","lede":"先按 join condition 找匹配；找不到仍输出左侧行、右侧列补 NULL；补 NULL 之后再执行上层过滤。","caption":"图 03　PostgreSQL 官方 SELECT 文档：只有 JOIN 子句自身的条件参与判定匹配，外层条件在之后应用。","bridge":"这句话不是记忆口诀，它是一条可以一路推到执行器状态机的因果链。先把它写成集合定义看看。","notes":"整个 left join，其实可以压缩成一句话，而且是官方文档那句话的口语版：先按 join condition 找匹配；找不到的时候，左侧行不丢，右侧列补 NULL；补完 NULL 之后，才轮到上层过滤。我特意去核对了 PostgreSQL 官方 SELECT 文档，原文写得更严谨——「只有 JOIN 子句自身的条件参与判定哪些行有匹配；外层条件在之后应用」。三个台阶，顺序不能交换。你可能会说，这不就是定义吗，记住不就行了？不行的地方在于：SQL 文本里，ON 和 WHERE 是两行字，挨得很近，看起来像是两个可以随手挪动的过滤条件；但在数据库内部，它们分别落在流水线的第一步和第三步，中间隔着一次「补 NULL」这个会改变数据形态的动作。一旦把第三步的条件挪回第一步，你改变的不是过滤强度，是「哪些行算匹配」这个判定本身。今天后面所有内容——执行器的状态变量、优化器为什么不敢重排、为什么计划里有时候根本看不到 left join——都是这一句话在不同层次上的投影。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"40\" y=\"24\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >一句话语义边界：三个台阶，顺序不能交换（官方 SELECT 文档原文语义）</text><rect x=\"40\" y=\"54\" width=\"1320\" height=\"92\" rx=\"4\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"70\" y=\"96\" class=\"sv serif\" text-anchor=\"start\" font-size=\"22.0\" fill=\"#FFFFFF\" font-weight=\"700\" >第一步 · 找匹配</text><line x1=\"340\" y1=\"72\" x2=\"340\" y2=\"128\" stroke=\"#FFFFFF\" stroke-width=\"1\"/><text x=\"370\" y=\"98\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#FFFFFF\" font-weight=\"400\" >按 JOIN / ON 或 JOIN / USING 的 join condition 组合行对</text><line x1=\"700\" y1=\"146\" x2=\"700\" y2=\"163.6\" stroke=\"#BE653B\" stroke-width=\"2.2\"/><polygon points=\"700,170 695.6,162 704.4,162\" fill=\"#BE653B\"/><rect x=\"40\" y=\"170\" width=\"1320\" height=\"92\" rx=\"4\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"70\" y=\"212\" class=\"sv serif\" text-anchor=\"start\" font-size=\"22.0\" fill=\"#FFFFFF\" font-weight=\"700\" >第二步 · 补 NULL</text><line x1=\"340\" y1=\"188\" x2=\"340\" y2=\"244\" stroke=\"#FFFFFF\" stroke-width=\"1\"/><text x=\"370\" y=\"214\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#FFFFFF\" font-weight=\"400\" >左表中没有任何匹配行的，追加一行、右侧列全部补 NULL</text><line x1=\"700\" y1=\"262\" x2=\"700\" y2=\"279.6\" stroke=\"#BE653B\" stroke-width=\"2.2\"/><polygon points=\"700,286 695.6,278 704.4,278\" fill=\"#BE653B\"/><rect x=\"40\" y=\"286\" width=\"1320\" height=\"92\" rx=\"4\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"70\" y=\"328\" class=\"sv serif\" text-anchor=\"start\" font-size=\"22.0\" fill=\"#FFFFFF\" font-weight=\"700\" >第三步 · 上层过滤</text><line x1=\"340\" y1=\"304\" x2=\"340\" y2=\"360\" stroke=\"#FFFFFF\" stroke-width=\"1\"/><text x=\"370\" y=\"330\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#FFFFFF\" font-weight=\"400\" >WHERE / 聚合 / 排序 / 窗口函数看到的是补 NULL 之后的结果</text><rect x=\"40\" y=\"404\" width=\"1320\" height=\"22\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#FFFFFF\" stroke-width=\"1\" /><text x=\"40\" y=\"420\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"600\" >把第三步的条件误放回第一步，语义就变了 —— 这是绝大多数 left join 线上问题的共同来源。</text></svg>","ctrl":"","anim":""},{"eyebrow":"形式化 · 结果集是两个集合的并","title":"匹配行对 ∪ 未匹配左行 + NULL","lede":"T1 LEFT JOIN T2 ON P = { 满足 P 的行对 } UNION ALL { T1 未匹配行 + T2 列 NULL }；「未匹配」只看 join condition。","caption":"图 04　示例沿用本文 DEMO：o1、o2 有匹配行对，o3 没有，于是多出一行右侧全 NULL。","bridge":"集合定义说「至少一行」，那「多行」从哪来？下一个图把一对多和右表孤儿行一起摆出来。","notes":"把刚才那句话写成集合，就是图里这两个框。第一部分是所有满足 P 的 T1×T2 行对；第二部分是 T1 里那些一个匹配行都没找到的行，每行右侧补 NULL；两部分 UNION ALL 起来就是结果。这里有个词必须咬死：「未匹配」只由 JOIN/ON 或 JOIN/USING 的 join condition 决定，不由 WHERE 决定。官方文档说得非常直白，判定匹配时只看 JOIN 子句自己的条件。用本文 DEMO 的数据代入：o1 配上 p1001、o2 配上 p1002，这是前两行；o3 没有支付，于是补一行右侧全 NULL。所以结果至少为左表每一行输出一行——注意「至少」两个字。为什么不是「恰好」？因为右表一个 order_id 可能对应多笔支付，一个左行就会配出多个行对，被复制多行。这个「至少」，就是后面行数膨胀、金额重复累计的根。另外补一句：右表里那些没被任何左行匹配上的行，不会单独出现在结果里——保留侧只有左边。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"40\" y=\"24\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >形式化定义：结果集是两个集合的 UNION ALL，判定「未匹配」只看 join condition</text><rect x=\"40\" y=\"54\" width=\"610\" height=\"150\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"345.0\" y=\"120.2\" class=\"sv s\" text-anchor=\"middle\" font-size=\"26.0\" fill=\"#245A6B\" font-weight=\"600\" >① 匹配行对</text><text x=\"345.0\" y=\"149.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#46585F\" font-weight=\"400\" >{ T1 行 × T2 行 | P 为 true }</text><rect x=\"690\" y=\"54\" width=\"610\" height=\"150\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.1\" /><text x=\"995.0\" y=\"120.2\" class=\"sv s\" text-anchor=\"middle\" font-size=\"26.0\" fill=\"#BE653B\" font-weight=\"600\" >② 左表未匹配行</text><text x=\"995.0\" y=\"149.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#46585F\" font-weight=\"400\" >{ T1 未匹配行 + T2 列 NULL }</text><text x=\"680\" y=\"236\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#AE8A3E\" font-weight=\"700\" >UNION ALL</text><line x1=\"650\" y1=\"204\" x2=\"650\" y2=\"229.6\" stroke=\"#AE8A3E\" stroke-width=\"2\"/><polygon points=\"650,236 645.6,228 654.4,228\" fill=\"#AE8A3E\"/><rect x=\"40\" y=\"244\" width=\"180\" height=\"38\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"130.0\" y=\"267.55\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\">结果性质</text><rect x=\"220\" y=\"244\" width=\"180\" height=\"38\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"310.0\" y=\"267.55\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\">左表行</text><rect x=\"400\" y=\"244\" width=\"180\" height=\"38\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"490.0\" y=\"267.55\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\">右表匹配</text><rect x=\"580\" y=\"244\" width=\"180\" height=\"38\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"670.0\" y=\"267.55\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\">右侧列</text><rect x=\"760\" y=\"244\" width=\"180\" height=\"38\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"850.0\" y=\"267.55\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\">行数</text><rect x=\"40\" y=\"282\" width=\"180\" height=\"34\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"130.0\" y=\"303.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\">匹配行对</text><rect x=\"220\" y=\"282\" width=\"180\" height=\"34\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"310.0\" y=\"303.9\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\">o1</text><rect x=\"400\" y=\"282\" width=\"180\" height=\"34\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"490.0\" y=\"303.9\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\">p1001</text><rect x=\"580\" y=\"282\" width=\"180\" height=\"34\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"670.0\" y=\"303.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\">真实值</text><rect x=\"760\" y=\"282\" width=\"180\" height=\"34\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"850.0\" y=\"303.9\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\">1</text><rect x=\"40\" y=\"316\" width=\"180\" height=\"34\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"130.0\" y=\"337.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\">匹配行对</text><rect x=\"220\" y=\"316\" width=\"180\" height=\"34\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"310.0\" y=\"337.9\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\">o2</text><rect x=\"400\" y=\"316\" width=\"180\" height=\"34\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"490.0\" y=\"337.9\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\">p1002</text><rect x=\"580\" y=\"316\" width=\"180\" height=\"34\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"670.0\" y=\"337.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\">真实值</text><rect x=\"760\" y=\"316\" width=\"180\" height=\"34\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"850.0\" y=\"337.9\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\">1</text><rect x=\"40\" y=\"350\" width=\"180\" height=\"34\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"130.0\" y=\"371.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\">null-extended</text><rect x=\"220\" y=\"350\" width=\"180\" height=\"34\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"310.0\" y=\"371.9\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\">o3</text><rect x=\"400\" y=\"350\" width=\"180\" height=\"34\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"490.0\" y=\"371.9\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\">无</text><rect x=\"580\" y=\"350\" width=\"180\" height=\"34\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"670.0\" y=\"371.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\">全为 NULL</text><rect x=\"760\" y=\"350\" width=\"180\" height=\"34\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"850.0\" y=\"371.9\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\">1</text><rect x=\"950\" y=\"244\" width=\"350\" height=\"140\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"1125.0\" y=\"306.85\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#2F7A66\" font-weight=\"600\" >结果至少为左表每行输出一行</text><text x=\"1125.0\" y=\"330.25\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >右表匹配多行 → 左行会被复制多行</text><rect x=\"40\" y=\"392\" width=\"1320\" height=\"32\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1\" /><text x=\"54\" y=\"413.075\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#AE8A3E\" font-weight=\"600\">「未匹配」只由 JOIN / ON 或 JOIN / USING 决定，不由 WHERE 决定。</text></svg>","ctrl":"","anim":""},{"eyebrow":"逻辑模型 · 一对多与孤儿行","title":"左行会被复制，右行不会单独出现","lede":"右侧一个 key 对应多行时，左行被复制多行；右表中没被任何左行匹配到的行，不会因 left join 单独输出。","caption":"图 05　示意行 1003 为说明一对多而增设，非本文 DEMO 数据；右侧孤儿行结论来自原图 1 的逻辑模型。","bridge":"到这里我们一直在讲「应该输出什么」。接下来把镜头推进数据库内部，看这条规则在七层里各留下了什么。","notes":"把一对多摊开看，就很直观了。假设订单 1 有两笔 successful 支付，那 left join 的结果里订单 1 就出现两次，amount 也跟着出现两次。如果这时候有人写 SUM(o.amount)，99 块就被算成了 198 块——慢 SQL 和错误汇总，经常是同一个根因一起冒出来的。所以业务上如果是一对一，就该给右表 join key 建唯一约束或唯一索引，把这件事在模型层钉死，而不是在报表里祈祷。另一半同样重要：右表是「可补 NULL 侧」，不是「保留侧」。右表里存在一笔没有任何左行能匹配上的支付记录，它不会自己蹦到结果里；想找它，那是另一种查询。这两个方向一合起来，你就明白 left join 的行数为什么既可能比左表多、又永远不会因为右表孤儿行而变多。好，语义边界我们立住了。接下来把镜头往里推：这么一条「左行不能丢」的规则，从一句 SQL 到执行器里一个布尔变量，中间要穿过哪些层？","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"40\" y=\"24\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >逻辑模型：左行可被复制；右表没被任何左行匹配到的行，不会单独输出</text><text x=\"40\" y=\"62\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" >左表 orders</text><text x=\"470\" y=\"62\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" >右表 payments（示意：含一对多）</text><text x=\"950\" y=\"62\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" >LEFT JOIN 结果</text><rect x=\"40\" y=\"76\" width=\"110\" height=\"36\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"95.0\" y=\"98.55\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\">order_id</text><rect x=\"150\" y=\"76\" width=\"110\" height=\"36\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"205.0\" y=\"98.55\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\">amount</text><rect x=\"260\" y=\"76\" width=\"110\" height=\"36\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"315.0\" y=\"98.55\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#245A6B\" font-w ght=\"400\" >SpecialJoinInfo / join_is_legal()：记录外连接左右边界，挡住非法重排</text><rect x=\"40\" y=\"242\" width=\"1320\" height=\"46\" rx=\"4\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1\" /><text x=\"60\" y=\"271\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#FFFFFF\" font-weight=\"700\" >路径生成</text><line x1=\"320\" y1=\"252\" x2=\"320\" y2=\"278\" stroke=\"#FFFFFF\" stroke-width=\"1\"/><text x=\"344\" y=\"271\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#CFE0DC\" font-weight=\"400\" >add_paths_to_joinrel()：Nested Loop / Hash / Merge 候选路径</text><rect x=\"40\" y=\"292\" width=\"1320\" height=\"46\" rx=\"4\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1\" /><text x=\"60\" y=\"321\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#FFFFFF\" font-weight=\"700\" >计划节点</text><line x1=\"320\" y1=\"302\" x2=\"320\" y2=\"328\" stroke=\"#FFFFFF\" stroke-width=\"1\"/><text x=\"344\" y=\"321\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#CFE0DC\" font-weight=\"400\" >Join.jointype / joinqual / Plan.qual：匹配判据与上层过滤分家</text><rect x=\"40\" y=\"342\" width=\"1320\" height=\"46\" rx=\"4\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1\" /><text x=\"60\" y=\"371\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#FFFFFF\" font-weight=\"700\" >执行器</text><line x1=\"320\" y1=\"352\" x2=\"320\" y2=\"378\" stroke=\"#FFFFFF\" stroke-width=\"1\"/><text x=\"344\" y=\"371\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#CFE0DC\" font-weight=\"400\" >MatchedOuter + NullInnerTupleSlot：维护匹配状态，必要时补 NULL</text><text x=\"40\" y=\"412\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"600\" >结论：不要把 left join 当成一条语法糖；它是一条从解析一路贯穿到执行器状态机的约束。</text></svg>","ctrl":"","anim":""},{"eyebrow":"语义层 · 条件位置决定结果","title":"ON 决定匹配，WHERE 决定保留","lede":"同一个 p.status = 'successful'，写在 ON 里是「匹配条件」，写在 WHERE 里是「补 NULL 之后的最终过滤」。","caption":"图 07　写法 A/B 流水线对照；官方 SELECT 文档对 ON 与 WHERE 的差异有专门示例。","bridge":"光讲流水线还是有点抽象。我们拿本文 DEMO 那三笔订单，把两种写法的结果一行一行摆出来。","notes":"现在来到全篇最容易出事的地方：条件位置。左边写法 A，把 p.status = 'successful' 放在 ON 里。这时候它的身份是「匹配条件」：某笔订单只有 failed 支付，那就不算匹配，但左行不丢，右侧补 NULL 照常输出。右边写法 B，ON 里只留 p.order_id = o.order_id，把状态条件放到 WHERE。这时候连接先按 join key 做，未匹配的左行照样补 NULL；然后 WHERE 在补完 NULL 之后执行，p.status 是 NULL，NULL = 'successful' 的结果不是 true，而是 unknown，WHERE 只保留 true 的行，于是这行被删掉。结果是什么？这个查询通常已经退化成「只看有 successful 支付的订单」，和「保留所有订单」完全不是一回事。官方文档里那个 t1 LEFT JOIN t2 ... AND t2.value = 'xxx' 对 ... WHERE t2.value = 'xxx' 的例子，讲的就是这件事。所以以后写右表条件，先别管索引，先问自己一句：这个条件是「什么样的右表行算匹配」，还是「最终结果里要留下什么」？前者放 ON，后者放 WHERE。要是答案是要留下匹配行——那就坦率写 INNER JOIN，让语义、优化器和代码审查都轻松一点。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"40\" y=\"24\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >同一个右表条件，放在 ON 与 WHERE 走的是两条不同的流水线</text><rect x=\"40\" y=\"48\" width=\"640\" height=\"296\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><rect x=\"700\" y=\"48\" width=\"640\" height=\"296\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"62\" y=\"82\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#2F7A66\" font-weight=\"700\" >写法 A · 条件在 ON：保留所有左行</text><text x=\"722\" y=\"82\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#BE653B\" font-weight=\"700\" >写法 B · 条件在 WHERE：删掉补 NULL 行</text><rect x=\"62\" y=\"106\" width=\"596\" height=\"62\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"80\" y=\"133\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >ON: p.order_id = o.order_id</text><text x=\"80\" y=\"156\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >AND p.status = &#x27;successful&#x27;</text><line x1=\"360\" y1=\"168\" x2=\"360\" y2=\"176.4\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"360,182 356.15,175 363.85,175\" fill=\"#245A6B\"/><rect x=\"62\" y=\"182\" width=\"596\" height=\"62\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"80\" y=\"209\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >右表 failed 不算匹配</text><text x=\"80\" y=\"232\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >左行仍输出，右侧列补 NULL</text><line x1=\"360\" y1=\"244\" x2=\"360\" y2=\"252.4\" stroke=\"#BE653B\" stroke-width=\"1.8\"/><polygon points=\"360,258 356.15,251 363.85,251\" fill=\"#BE653B\"/><rect x=\"62\" y=\"258\" width=\"596\" height=\"62\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"80\" y=\"285\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >结果：订单全部在</text><text x=\"80\" y=\"308\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >未匹配处显示 NULL</text><rect x=\"722\" y=\"106\" width=\"596\" height=\"62\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"740\" y=\"133\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >ON: p.order_id = o.order_id</text><text x=\"740\" y=\"156\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >先按 join key 连接，再补 NULL</text><line x1=\"1020\" y1=\"168\" x2=\"1020\" y2=\"176.4\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"1020,182 1016.15,175 1023.85,175\" fill=\"#245A6B\"/><rect x=\"722\" y=\"182\" width=\"596\" height=\"62\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"740\" y=\"209\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >WHERE p.status = &#x27;successful&#x27;</text><text x=\"740\" y=\"232\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >在补 NULL 之后执行</text><line x1=\"1020\" y1=\"244\" x2=\"1020\" y2=\"252.4\" stroke=\"#BE653B\" stroke-width=\"1.8\"/><polygon points=\"1020,258 1016.15,251 1023.85,251\" fill=\"#BE653B\"/><rect x=\"722\" y=\"258\" width=\"596\" height=\"62\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"740\" y=\"285\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >NULL = &#x27;successful&#x27; 不为 true</text><text x=\"740\" y=\"308\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >补 NULL 行被删除 → 退化成 inner</text><rect x=\"40\" y=\"364\" width=\"1320\" height=\"52\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1\" /><text x=\"54\" y=\"395.425\" class=\"sv serif\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#AE8A3E\" font-weight=\"600\">官方 SELECT 文档：「只有 JOIN 子句自身的条件参与判定哪些行有匹配；外层条件在之后应用。」</text></svg>","ctrl":"","anim":""},{"eyebrow":"实证 · 三笔订单两种写法","title":"3 行 vs 1 行，是语义不是性能","lede":"同一份数据、同一个条件，只因位置不同：ON 写法输出三行，WHERE 写法只剩一行。本文未启动实例，以下为预期语义推导。","caption":"图 08　预期结果按本文 6.2 / 6.3 节推导；文中明确不提供伪造的实测输出。","bridge":"把这三笔订单做成可以自己拨的输入，逐行看它怎么走，比盯静态表格更容易记住。","notes":"我们把 DEMO 摆实。orders 有 1、2、3 三笔；payments 有 1001（订单 1，successful）和 1002（订单 2，failed）。写法 A 把状态条件放 ON：订单 1 命中 successful，输出真实值；订单 2 只有 failed，ON 不算匹配，输出 NULL；订单 3 没有支付记录，也输出 NULL。三行，一笔不少。写法 B 把状态条件放 WHERE：订单 1 通过；订单 2 的 failed 行被删；订单 3 补出来的 NULL 行也被删。只剩一行。我要特别说明一句：本文并没有在本机启动 PostgreSQL 跑这些 SQL，所以这里给的是按语义推导的预期结果，不是伪造的 EXPLAIN 输出——这一点原作者写得很诚实，我也照办。大家回去在自己的库里跑一遍，重点观察的正是这个「3 行 vs 1 行」的落差。它提醒我们，left join 的问题经常不是慢，是错；慢还能靠加资源扛一阵，错的数字进了报表，谁都看不出来。下一页我把它做成可拨的模拟器，你可以换条件位置、换右表数据，逐行看结果怎么长出来。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"40\" y=\"24\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >实证推演：本文第 6 节三笔订单 -size=\"13.2\" fill=\"#1B2B33\" font-weight=\"400\">订单 3 的补 NULL 行被删除</text><rect x=\"40\" y=\"384\" width=\"1270\" height=\"34\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"54\" y=\"406.25\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"600\">同一份数据、同一个条件，只是位置不同：3 行 vs 1 行。这不是性能差异，是语义差异。</text></svg>","ctrl":"","anim":""},{"eyebrow":"动画 · 逐行匹配模拟器","title":"亲手把三笔订单跑一遍","lede":"选择条件位置与右表数据，按播放或单步，观察每个左行是输出真实值、补 NULL，还是被 WHERE 删除。","caption":"图 09　动画输出按语义规则推导；「示意：订单 1 多一笔 successful」用于演示一对多行复制。","bridge":"模拟器里最值得停下来看的是「订单 3」那一步：NULL 一旦补出来，就进入三值逻辑了。","notes":"这一页请自己动手。上面有两个输入：条件位置选 ON 还是 WHERE，右表数据选原文 DEMO 的两笔支付，还是加一笔让订单 1 变成一对多。然后按播放，或者一格一格按单步；暂停、重置都在旁边。你会看到左边高亮当前处理的订单，中间列出这一刻右表的候选行，右边把已经产出的结果行逐行累积出来。默认 ON 写法走下来是三行：successful、NULL、NULL。切到 WHERE，订单 2 和订单 3 那两步右边不再新增任何行。再把右表切成一对多，回到 ON，订单 1 那一步会一次冒出两行——这就是行数膨胀最直观的证据。请特别盯住「订单 3」这一步：它没有任何候选行，于是执行器补出右侧全 NULL 的一行。这行 NULL 一旦生成，就已经不是「空字符串」了，它会进入 SQL 的三值逻辑，后面所有的比较、聚合、判空都得按它的规矩来。所以我们下一页就专门讲 NULL。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"40\" y=\"22\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >逐行匹配模拟器：输入条件位置与右表数据，播放观察每一笔左行如何被处理</text><text x=\"40\" y=\"58\" class=\"sv serif\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"700\" >左表 orders</text><rect x=\"40\" y=\"68\" width=\"90\" height=\"34\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"85.0\" y=\"89.375\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#245A6B\" font-weight=\"600\">order_id</text><rect x=\"130\" y=\"68\" width=\"90\" height=\"34\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"175.0\" y=\"89.375\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#245A6B\" font-weight=\"600\">amount</text><rect x=\"40\" y=\"102\" width=\"90\" height=\"3 \"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" id=\"simo-bg-3-1\"/><text x=\"790.0\" y=\"239.725\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" id=\"simo-3-1\"></text><rect x=\"610\" y=\"254\" width=\"110\" height=\"38\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" id=\"simo-bg-4-0\"/><text x=\"665.0\" y=\"277.725\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" id=\"simo-4-0\"></text><rect x=\"720\" y=\"254\" width=\"140\" height=\"38\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" id=\"simo-bg-4-1\"/><text x=\"790.0\" y=\"277.725\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" id=\"simo-4-1\"></text><line x1=\"220\" y1=\"150\" x2=\"264.4\" y2=\"150\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><polygon points=\"270,150 263,146.15 263,153.85\" fill=\"#7BA6AF\"/><line x1=\"560\" y1=\"150\" x2=\"604.4\" y2=\"150\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><polygon points=\"610,150 603,146.15 603,153.85\" fill=\"#7BA6AF\"/><rect x=\"900\" y=\"68\" width=\"440\" height=\"224\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"920\" y=\"98\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" >规则（不随动画变化）</text><line x1=\"920\" y1=\"112\" x2=\"1320\" y2=\"112\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"920\" y=\"142\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >ON 条件失败</text><text x=\"920\" y=\"166\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >只说明右表没匹配；左行仍补 NULL 输出</text><text x=\"920\" y=\"202\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >WHERE 条件失败</text><text x=\"920\" y=\"226\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >补 NULL 后执行；NULL 比较不为 true → 删行</text><text x=\"920\" y=\"264\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"600\" >步骤</text><text x=\"1000\" y=\"264\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"700\" id=\"simStepNo\">0 / 4</text><rect x=\"40\" y=\"312\" width=\"1300\" height=\"44\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1\" /><text x=\"54\" y=\"339.075\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#AE8A3E\" font-weight=\"600\">一对多输入会看到左行被复制多行；这是 left join 行数膨胀最直观的证据。</text><rect x=\"40\" y=\"366\" width=\"1300\" height=\"44\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#F1EFE9\" stroke-width=\"1\" /><text x=\"54\" y=\"392.725\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#89938F\" font-weight=\"600\">本模拟按语义规则推导输出行，不代表某台机器上 EXPLAIN ANALYZE 的实测结果。</text></svg>","ctrl":"<label>输入 · 条件位置</label><select id=\"simMode\"><option value=\"on\">ON 中过滤（保留左行）</option><option value=\"where\">WHERE 中过滤（删除补 NULL 行）</option></select><label>输入 · 右表</label><select id=\"simMulti\"><option value=\"0\">DEMO：2 笔支付</option><option value=\"1\">示意：订单 1 多 1 笔 successful</option></select><button class=\"btn play\" id=\"simPlay\">▶ 播放</button><button class=\"btn\" id=\"simPause\">❚❚ 暂停</button><button class=\"btn\" id=\"simOne\">单步 →</button><button class=\"btn\" id=\"simReset\">重置</button><div class=\"out\" id=\"simOut\"></div>","anim":"sim"},{"eyebrow":"三值逻辑 · NULL 不是空字符串","title":"补出来的 NULL 会改判断结果","lede":"NULL = 'x' 与 NULL <> 'x' 都不是 true，而是 unknown；WHERE 只保留 true，因此补 NULL 行会被静默丢掉。","caption":"图 10　三值逻辑与反连接写法对照；p.payment_id 为右表主键、非空键。","bridge":"既然 NULL 会让比较失效，那「找没有支付的订单」该怎么写才稳？答案不是把比较换得更花哨。","notes":"补 NULL 最容易被误当成「空字符串」或者「0」。不是的。SQL 是三值逻辑：true、false、unknown。补出来的 p.status 是 NULL，NULL = 'successful' 得 unknown，NULL <> 'successful' 也得 unknown，而 WHERE 只保留结果为 true 的行，所以这两句都留不住它。这就解释了一个特别坑的写法：有人想找「没有 successful 支付的订单」，顺手写了 WHERE p.status <> 'successful'，结果一笔都找不到——因为真正没支付的那些行，恰恰是被补成 NULL 的那批。那怎么表达「缺失」？两条路。一条是 LEFT JOIN ... WHERE right.pk IS NULL，但判据一定要挑右表的主键或唯一非空键，比如 p.payment_id；别拿 p.status 这种可空业务列，否则「有支付行但 status 本身就是 NULL」会被误伤。另一条，也是更推荐的一条：直接写 NOT EXISTS 子查询，把「不存在这样的支付」这句话原样表达出来。语义直白，PostgreSQL 还能把它规划成 anti join，顺带避开右侧一对多带来的行复制。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"40\" y=\"24\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >补出来的 NULL 不是空字符串：它会进入 SQL 三值逻辑</text><text x=\"40\" y=\"62\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" >普通比较遇到补 NULL 的右表列</text><rect x=\"40\" y=\"76\" width=\"280\" height=\"38\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"180.0\" y=\"99.55\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\">表达式</text><rect x=\"320\" y=\"76\" width=\"180\" height=\"38\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"410.0\" y=\"99.55\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\">结果</text><rect x=\"500\" y=\"76\" width=\"180\" height=\"38\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"590.0\" y=\"99.55\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\">WHERE 是否保留</text><rect x=\"40\" y=\"114\" width=\"280\" height=\"42\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"180.0\" y=\"139.9\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\">p.status = &#x27;successful&#x27;</text><rect x=\"320\" y=\"114\" width=\"180\" height=\"42\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"410.0\" y=\"139.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\">unknown</text><rect x=\"500\" y=\"114\" width=\"180\" height=\"42\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"590.0\" y=\"139.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\">否</text><rect x=\"40\" y=\"156\" width=\"280\" height=\"42\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"180.0\" y=\"181.9\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\">p.status &lt;&gt; &#x27;successful&#x27;</text><rect x=\"320\" y=\"156\" width=\"180\" height=\"42\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"410.0\" y=\"181.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\">unknown</text><rect x=\"500\" y=\"156\" width=\"180\" height=\"42\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"590.0\" y=\"181.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\">否</text><rect x=\"40\" y=\"198\" width=\"280\" height=\"42\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"180.0\" y=\"223.9\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\">p.status IS NULL</text><rect x=\"320\" y=\"198\" width=\"180\" height=\"42\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"410.0\" y=\"223.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\">true</text><rect x=\"500\" y=\"198\" width=\"180\" height=\"42\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"590.0\" y=\"223.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\">是</text><text x=\"730\" y=\"62\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" >找「没有 successful 支付」的订单，写法对比</text><rect x=\"730\" y=\"76\" width=\"620\" height=\"62\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"748\" y=\"102\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"600\" >不推荐：WHERE p.status &lt;&gt; &#x27;successful&#x27;</text><text x=\"748\" y=\"126\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >补 NULL 行得到 unknown，会被 WHERE 丢掉</text><rect x=\"730\" y=\"150\" width=\"620\" height=\"86\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"748\" y=\"178\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#2F7A66\" font-weight=\"700\" >推荐：WHERE NOT EXISTS (</text><text x=\"748\" y=\"202\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >  SELECT 1 FROM payments p WHERE p.order_id = o.order_id</text><text x=\"748\" y=\"224\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >    AND p.status = &#x27;successful&#x27; )</text><rect x=\"40\" y=\"258\" width=\"1320\" height=\"48\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"54\" y=\"287.425\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#245A6B\" font-weight=\"600\">LEFT JOIN … WHERE right.pk IS NULL 也能表达反连接，但要确保判断列是非空键。</text><rect x=\"40\" y=\"322\" width=\"640\" height=\"84\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"58\" y=\"350\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >更稳的判据：WHERE p.payment_id IS NULL</text><text x=\"58\" y=\"378\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >主键、非空、且对匹配行不可能为 NULL</text><rect x=\"710\" y=\"322\" width=\"640\" height=\"84\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"728\" y=\"350\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"600\" >别用 WHERE p.status IS NULL</text><text x=\"728\" y=\"378\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >会混进「有支付行、但 status 本身为 NULL」</text></svg>","ctrl":"","anim":""},{"eyebrow":"执行器 · 匹配状态与 null slot","title":"一个布尔变量撑起补 NULL","lede":"执行器为每个左行保存「是否已匹配」；只有 joinqual 能置真，候选耗尽仍未匹配才切到 NullInnerTupleSlot。","caption":"图 11　状态机取自本文 3.2 节对 nodeNestloop.c 的梳理；三种执行节点的变量名与源码位置见下表。","bridge":"这个状态机用嘴讲还是有点绕，下一页把它拆成逐帧的状态表，三种场景各自播一遍。","notes":"规则落到代码里，是一个很朴素的状态机。以 Nested Loop 为例：每读到一个 outer tuple，先把 nl_MatchedOuter 置为 false；内侧每来一个候选，就执行 ExecQual(joinqual)；通过了，把 nl_MatchedOuter 置成 true；真正返回之前还要检查 otherqual。如果内侧候选耗尽，而这个标志仍然是 false，并且 join 类型是 JOIN_LEFT，执行器就把 inner tuple slot 切到 nl_NullInnerTupleSlot，再查一次 otherqual，通过才返回补 NULL 行。Hash Join 和 Merge Join 的实现细节不同，但 hj_MatchedOuter / mj_MatchedOuter 和对应的 null tuple slot 一个都不少。这里最关键的区分是：joinqual 来自 ON，是「是否匹配」的判据；otherqual 来自 WHERE，是「是否返回」的判据。plannodes.h 里说得很清楚，inner join 中两者语义可以交换，outer join 中绝对不行。为什么不行？下一页的动画会把这个反直觉的后果演给你看。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"40\" y=\"24\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >执行器把语义落成状态机：三种物理算法共用「匹配状态 + null tuple slot」</text><rect x=\"40\" y=\"50\" width=\"300\" height=\"66\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"190.0\" y=\"76.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" >读到一个 outer tuple</text><text x=\"190.0\" y=\"98.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >nl_MatchedOuter = false</text><rect x=\"400\" y=\"50\" width=\"300\" height=\"66\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"550.0\" y=\"76.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" >取 inner 候选 tuple</text><text x=\"550.0\" y=\"98.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >执行 ExecQual(joinqual)</text><rect x=\"760\" y=\"50\" width=\"300\" height=\"66\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.1\" /><text x=\"910.0\" y=\"76.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#AE8A3E\" font-weight=\"600\" >joinqual 为 true？</text><text x=\"910.0\" y=\"98.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >只有它能置 MatchedOuter</text><line x1=\"340\" y1=\"83\" x2=\"393.6\" y2=\"83\" stroke=\"#245A6B\" stroke-width=\"2.0\"/><polygon points=\"400,83 392,78.6 392,87.4\" fill=\"#245A6B\"/><line x1=\"700\" y1=\"83\" x2=\"753.6\" y2=\"83\" stroke=\"#245A6B\" stroke-width=\"2.0\"/><polygon points=\"760,83 752,78.6 752,87.4\" fill=\"#245A6B\"/><rect x=\"760\" y=\"172\" width=\"300\" height=\"66\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"910.0\" y=\"198.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#2F7A66\" font-weight=\"600\" >置 MatchedOuter = true</text><text x=\"910.0\" y=\"220.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >该左行已匹配</text><rect x=\"400\" y=\"172\" width=\"300\" height=\"66\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"550.0\" y=\"198.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" >检查 otherqual</text><text x=\"550.0\" y=\"220.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >决定这一行是否返回</text><rect x=\"40\" y=\"172\" width=\"300\" height=\"66\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"190.0\" y=\"198.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#2F7A66\" font-weight=\" p.c</text><rect x=\"40\" y=\"372\" width=\"280\" height=\"28\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"180.0\" y=\"390.025\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#1B2B33\" font-weight=\"400\">Hash Join</text><rect x=\"320\" y=\"372\" width=\"300\" height=\"28\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"470.0\" y=\"390.025\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#1B2B33\" font-weight=\"400\">hj_MatchedOuter</text><rect x=\"620\" y=\"372\" width=\"300\" height=\"28\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"770.0\" y=\"390.025\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#1B2B33\" font-weight=\"400\">hj_NullInnerTupleSlot</text><rect x=\"920\" y=\"372\" width=\"300\" height=\"28\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"1070.0\" y=\"390.025\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#1B2B33\" font-weight=\"400\">nodeHashjoin.c</text><rect x=\"40\" y=\"400\" width=\"280\" height=\"28\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"180.0\" y=\"418.025\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#1B2B33\" font-weight=\"400\">Merge Join</text><rect x=\"320\" y=\"400\" width=\"300\" height=\"28\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"470.0\" y=\"418.025\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#1B2B33\" font-weight=\"400\">mj_MatchedOuter</text><rect x=\"620\" y=\"400\" width=\"300\" height=\"28\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"770.0\" y=\"418.025\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#1B2B33\" font-weight=\"400\">mj_NullInnerTupleSlot</text><rect x=\"920\" y=\"400\" width=\"300\" height=\"28\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"1070.0\" y=\"418.025\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#1B2B33\" font-weight=\"400\">nodeMergejoin.c</text></svg>","ctrl":"","anim":""},{"eyebrow":"动画 · 状态机逐帧演示","title":"三种场景，看清状态怎么变","lede":"选一种场景播放：匹配成功、无候选补 NULL、ON 通过但 WHERE 拒绝。逐帧观察 MatchedOuter 与 null slot。","caption":"图 12　每帧的状态值按本文 3.2 节执行器逻辑推导；第 5、6 行留白用于对齐帧数。","bridge":"第三种场景最值得记住：一个右表候选通过 ON，却让左行永远失去了补 NULL 的机会。","notes":"这一页也请动手。输入选三种场景之一，播放或单步，表格会一帧一帧亮起来。第一种「joinqual 通过并返回」：帧 1 状态归零，帧 2 通过 joinqual 把 MatchedOuter 置真，帧 3 otherqual 通过就返回真实行，帧 4 这个左行结束，不会补 NULL。第二种「无候选」：帧 2 joinqual 从没通过，帧 3 候选耗尽且未匹配，切到 null tuple slot，帧 4 返回补 NULL 行。请把注意力放到第三种：joinqual 通过了，MatchedOuter 变成 true，但帧 3 的 otherqual ——也就是 WHERE 来源的条件——不通过，这行不返回；到帧 4 候选耗尽时，因为左行已经是 matched，执行器不会为它补 NULL。也就是说，这一笔订单在结果里彻底消失了。很多人以为把条件从 ON 挪到 WHERE 只是「多删几行」，其实它改变的是 matched 状态产生的时机，进而改变了补 NULL 的机会。这就是两者不可交换最实在的证据。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"40\" y=\"22\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >状态机逐帧演示：输入一种场景，播放观察 MatchedOuter / null slot / 返回如何变化</text><rect x=\"40\" y=\"50\" width=\"70\" height=\"40\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"75.0\" y=\"74.55\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\">帧</text><rect x=\"110\" y=\"50\" width=\"330\" height=\"40\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"275.0\" y=\"74.55\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\">当前动作</text><rect x=\"440\" y=\"50\" width=\"130\" height=\"40\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"505.0\" y=\"74.55\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\">joinqual</text><rect x=\"570\" y=\"50\" width=\"18
