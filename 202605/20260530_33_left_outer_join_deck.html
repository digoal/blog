mOne\">单步 →</button><button class=\"btn\" id=\"smReset\">重置</button><div class=\"out\" id=\"smOut\"></div>","anim":"sm"},{"eyebrow":"洞察 · 两个判据不可交换","title":"匹配过了，就不再补 NULL","lede":"只要有一个右表候选通过 joinqual，左行即进入 matched；此后即便被 WHERE 拦下，也不会再补 NULL 输出。","caption":"图 13　三种组合对照；结论来自 plannodes.h 对 joinqual 与 plan.qual 的注释。","bridge":"语义层和执行器层都讲完了。再往上走一层：left join 会不会限制优化器选算法？不会——它限制的是别的。","notes":"把上一页的结论单独拎出来，因为它太反直觉了。三种组合：ON 通过、WHERE 通过，返回真实行；ON 从未通过，补 NULL 行再查 otherqual；而中间那种——ON 通过、WHERE 拒绝——既不返回真实行，也不补 NULL，这个左行在结果里就没有了。原因就在那句：只有 joinqual 能把 MatchedOuter 置真，WHERE 来源的 otherqual 不能阻止补 NULL 的机会被「消耗掉」，它只能阻止最终返回。所以 plannodes.h 才反复强调，outer join 里 joinqual 和 plan.qual 不可交换。这也解释了很多「我把条件从 ON 挪到 WHERE，结果怎么少了这么多」的工单：你不是多删了几行，你是让一批左行从「未匹配、可补 NULL」变成了「已匹配、被过滤」。想通这一层，再回头看优化器就好办了：left join 会不会限制它选 Nested、Hash、Merge？不会，那三种照样能用；它真正限制的是「哪些关系可以先跟谁连」。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"40\" y=\"24\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >最容易忽略的一点：ON 匹配成功但被 WHERE 拒绝，这个左行也不会补 NULL</text><rect x=\"40\" y=\"50\" width=\"1320\" height=\"62\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"60\" y=\"88\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" >一个右表候选行通过 joinqual，就把左行置为 matched；此后即便 otherqual 把它拦下，左行也不再补 NULL。</text><rect x=\"40\" y=\"142\" width=\"420\" height=\"176\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\" /><text x=\"60\" y=\"176\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#2F7A66\" font-weight=\"700\" >ON 通过 · WHERE 通过</text><line x1=\"60\" y1=\"194\" x2=\"440\" y2=\"194\" stroke=\"#2F7A66\" stroke-width=\"1\"/><text x=\"60\" y=\"228\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"600\" >MatchedOuter = true</text><text x=\"60\" y=\"260\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#46585F\" font-weight=\"600\" >返回真实行</text><text x=\"60\" y=\"296\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >joinqual 决定状态 · otherqual 决定返回</text><rect x=\"490\" y=\"142\" width=\"420\" height=\"176\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\" /><text x=\"510\" y=\"176\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#BE653B\" font-weight=\"700\" >ON 通过 · WHERE 拒绝</text><line x1=\"510\" y1=\"194\" x2=\"890\" y2=\"194\" stroke=\"#BE653B\" stroke-width=\"1\"/><text x=\"510\" y=\"228\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"600\" >MatchedOuter = true</text><text x=\"510\" y=\"260\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#46585F\" font-weight=\"600\" >不返回，也不补 NULL</text><text x=\"510\" y=\"296\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >joinqual 决定状态 · otherqual 决定返回</text><rect x=\"940\" y=\"142\" width=\"420\" height=\"176\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.2\" /><text x=\"960\" y=\"176\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#AE8A3E\" font-weight=\"700\" >ON 从未通过</text><line x1=\"960\" y1=\"194\" x2=\"1340\" y2=\"194\" stroke=\"#AE8A3E\" stroke-width=\"1\"/><text x=\"960\" y=\"228\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"600\" >MatchedOuter = false</text><text x=\"960\" y=\"260\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#46585F\" font-weight=\"600\" >补 NULL 行再查 otherqual</text><text x=\"960\" y=\"296\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >joinqual 决定状态 · otherqual 决定返回</text><rect x=\"40\" y=\"342\" width=\"1320\" height=\"66\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1\" /><text x=\"54\" y=\"380.6\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#BE653B\" font-weight=\"600\">所以把条件从 ON 挪到 WHERE，不只是「多删几行」：它改变的是 matched 状态产生的时机，进而改变补 NULL 的机会。</text></svg>","ctrl":"","anim":""},{"eyebrow":"物理算法 · 语义与算法分离","title":"Left 是语义，三种算法照样选","lede":"EXPLAIN 里「Left Join」表示逻辑语义，「Nested Loop / Hash / Merge」表示物理算法；create_join_plan() 按 pathtype 分派。","caption":"图 14　三种算法的适用场景与诊断点取自本文 3.3 节；不含任何性能数字。","bridge":"算法选定之后，EXPLAIN 会把条件拆成几个字段显示。搞清每个字段来自哪一层，才不会误读计划。","notes":"一个常见误会：以为 left join 是一种执行算法。不是。它只是逻辑语义，PostgreSQL 照样在三种物理路径里挑。Nested Loop Left Join 是左侧逐行驱动右侧，适合左侧行数少、右侧有可用索引、或者需要快速吐出前几行的场景；风险是左侧实际行数远超估算时，右侧被反复扫描。Hash Left Join 通常把右侧建成 hash table，左侧逐行 probe，适合大批量等值连接；要看 Batches 是不是超过 1、有没有临时文件 I/O。Merge Left Join 两侧按 join key 有序同步推进，适合已有排序或后续还要同样排序；代价是可能为排序付出较高启动成本。create_join_plan() 会按最优 path 的 pathtype 分派到对应的 create_*_plan()。所以看 EXPLAIN 时，把名字拆成两半读：「Left Join」告诉你谁被保留，「Nested / Hash / Merge」告诉你数据库打算怎么找行对。这两半各管一件事，别混。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"40\" y=\"24\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >LEFT JOIN 是逻辑语义，不是执行算法：优化器仍可选三种物理路径</text><rect x=\"40\" y=\"50\" width=\"420\" height=\"290\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\" /><text x=\"60\" y=\"86\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" >Nested Loop Left Join</text><text x=\"60\" y=\"114\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >左侧逐行驱动右侧</text><line x1=\"60\" y1=\"132\" x2=\"440\" y2=\"132\" stroke=\"#245A6B\" stroke-width=\"1\"/><rect x=\"60\" y=\"150\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"76\" y=\"162\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\" >左侧行数少</text><rect x=\"60\" y=\"182\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"76\" y=\"194\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\" >右侧有可用索引</text><rect x=\"60\" y=\"214\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"76\" y=\"226\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\" >需要快速返回前几行</text><rect x=\"60\" y=\"270\" width=\"380\" height=\"52\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"74\" y=\"302\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#BE653B\" font-weight=\"600\" >风险：左侧估算偏小 → 右侧被重复扫描</text><rect x=\"490\" y=\"50\" width=\"420\" height=\"290\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\" /><text x=\"510\" y=\"86\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#2F7A66\" font-weight=\"700\" >Hash Left Join</text><text x=\"510\" y=\"114\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >右侧建 hash table，左侧 probe</text><line x1=\"510\" y1=\"132\" x2=\"890\" y2=\"132\" stroke=\"#2F7A66\" stroke-width=\"1\"/><rect x=\"510\" y=\"150\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"526\" y=\"162\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\" >大批量等值连接</text><rect x=\"510\" y=\"182\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"526\" y=\"194\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\" >右侧可先物化</text><rect x=\"510\" y=\"214\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"526\" y=\"226\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\" >无需保持有序</text><rect x=\"510\" y=\"270\" width=\"380\" height=\"52\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"524\" y=\"302\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#BE653B\" font-weight=\"600\" >风险：Batches &gt; 1、临时文件 I/O</text><rect x=\"940\" y=\"50\" width=\"420\" height=\"290\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.2\" /><text x=\"960\" y=\"86\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#AE8A3E\" font-weight=\"700\" >Merge Left Join</text><text x=\"960\" y=\"114\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >两侧按 join key 有序推进</text><line x1=\"960\" y1=\"132\" x2=\"1340\" y2=\"132\" stroke=\"#AE8A3E\" stroke-width=\"1\"/><rect x=\"960\" y=\"150\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#AE8A3E\" stroke=\"#AE8A3E\" stroke-width=\"1\" /><text x=\"976\" y=\"162\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\" >已有排序可用</text><rect x=\"960\" y=\"182\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#AE8A3E\" stroke=\"#AE8A3E\" stroke-width=\"1\" /><text x=\"976\" y=\"194\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\" >索引顺序可利用</text><rect x=\"960\" y=\"214\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#AE8A3E\" stroke=\"#AE8A3E\" stroke-width=\"1\" /><text x=\"976\" y=\"226\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\" >后续还要同序输出</text><rect x=\"960\" y=\"270\" width=\"380\" height=\"52\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"974\" y=\"302\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#BE653B\" font-weight=\"600\" >风险：为排序付出启动成本</text><rect x=\"40\" y=\"358\" width=\"1320\" height=\"52\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"54\" y=\"389.25\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"600\">create_join_plan() 按最优 path 的 pathtype 分派；EXPLAIN 里「Left Join」是语义，「Nested / Hash / Merge」是算法。</text></svg>","ctrl":"","anim":""},{"eyebrow":"计划 · 读懂 EXPLAIN 的字段来源","title":"Join Filter 与 Filter 不是一回事","lede":"Hash Cond / Merge Cond 是物理定位键，Join Filter 来自 ON 中剩余条件，Filter 来自 WHERE —— 后者在补 NULL 之后执行。","caption":"图 15　字段来源结构示意，不是某次 EXPLAIN 的实测输出；真实计划请用 EXPLAIN (ANALYZE, BUFFERS, VERBOSE) 观察。","bridge":"字段看懂了，还有一类现象会让人以为优化器「算错了」：计划里压根没出现 left join。那多半是预处理做的。","notes":"EXPLAIN 里最容易误读的一对字段，是 Join Filter 和 Filter。我们按来源拆：ON 里能做 hash/merge key 的等值条件，会显示成 Hash Cond 或 Merge Cond，它是物理算法直接拿来定位行对的；ON 里剩下那些不能当 key 的条件，落到 Join Filter，它仍然属于 joinqual，参与「是否匹配」的判定。而 WHERE 里的条件，落到 Filter，也就是 Plan.qual，在补 NULL 之后无条件执行。所以 outer join 里，Join Filter 失败的行对仍可能让左行补 NULL 输出；Filter 则是在补 NULL 之后把行删掉。plannodes.h 和 explain.c 都强调这两者不可交换。别把这张图当成实测输出——我没有跑实例，也不打算编一份 EXPLAIN 给你看；它只是字段来源的结构示意。真要诊断，请在自己的库上跑 EXPLAIN (ANALYZE, BUFFERS, VERBOSE)，重点看估算行数与实际行数的偏差、Rows Removed by Join Filter、Hash 的 Buckets / Batches / Memory Usage，以及右表扫描有没有被重复执行。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"40\" y=\"24\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >EXPLAIN 字段来源示意：字段对应哪一层条件（结构示意，非某次实测输出）</text><rect x=\"40\" y=\"50\" width=\"420\" height=\"200\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"58\" y=\"80\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" >SQL 写法</text><line x1=\"58\" y1=\"94\" x2=\"442\" y2=\"94\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"58\" y=\"124\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" >SELECT o.order_id, p.status</text><text x=\"58\" y=\"150\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" >FROM orders o LEFT JOIN payments p</text><text x=\"58\" y=\"176\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" >  ON p.order_id = o.order_id</text><text x=\"58\" y=\"202\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" > AND p.status = &#x27;successful&#x27;</text><text x=\"58\" y=\"232\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#BE653B\" font-weight=\"600\" >WHERE o.amount &gt; 0</text><line x1=\"460\" y1=\"150\" x2=\"504.4\" y2=\"150\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><polygon points=\"510,150 503,146.15 503,153.85\" fill=\"#7BA6AF\"/><rect x=\"510\" y=\"50\" width=\"270\" height=\"38\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"645.0\" y=\"73.55\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\">计划字段（示意）</text><rect x=\"780\" y=\"50\" width=\"190\" height=\"38\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"875.0\" y=\"73.55\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\">来自</text><rect x=\"970\" y=\"50\" width=\"190\" height=\"38\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"1065.0\" y=\"73.55\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\">作用层次</text><rect x=\"510\" y=\"88\" width=\"270\" height=\"44\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"645.0\" y=\"114.725\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\">Hash Cond / Merge Cond</text><rect x=\"780\" y=\"88\" width=\"190\" height=\"44\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"875.0\" y=\"114.725\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\">ON 中的等值键</text><rect x=\"970\" y=\"88\" width=\"190\" height=\"44\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"1065.0\" y=\"114.725\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\">物理定位行对</text><rect x=\"510\" y=\"132\" width=\"270\" height=\"44\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"645.0\" y=\"158.725\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\">Join Filter</text><rect x=\"780\" y=\"132\" width=\"190\" height=\"44\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"875.0\" y=\"158.725\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\">ON 中剩余条件</text><rect x=\"970\" y=\"132\" width=\"190\" height=\"44\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"1065.0\" y=\"158.725\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\">joinqual，判匹配</text><rect x=\"510\" y=\"176\" width=\"270\" height=\"44\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"645.0\" y=\"202.725\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\">Filter</text><rect x=\"780\" y=\"176\" width=\"190\" height=\"44\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"875.0\" y=\"202.725\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\">WHERE</text><rect x=\"970\" y=\"176\" width=\"190\" height=\"44\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"1065.0\" y=\"202.725\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\">plan.qual，补 NULL 后</text><rect x=\"40\" y=\"272\" width=\"1320\" height=\"62\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1\" /><text x=\"58\" y=\"298\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#AE8A3E\" font-weight=\"700\" >outer join 中 Join Filter 失败的行仍可能补 NULL；Filter 是补 NULL 之后无条件过滤。</text><text x=\"58\" y=\"324\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >二者不可交换 —— 源码 explain.c 展示这些字段，plannodes.h 定义它们在 Join 节点上的归属。</text><rect x=\"40\" y=\"352\" width=\"1320\" height=\"58\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"54\" y=\"386.075\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"600\">观察真实计划请用 EXPLAIN (ANALYZE, BUFFERS, VERBOSE)：看估算 vs 实际行数、Rows Removed by Join Filter、Buckets / Batches / Memory Usage。</text></svg>","ctrl":"","anim":""},{"eyebrow":"优化器 · 外连接边界约束重排","title":"nullable side 挡住非法 join order","lede":"left join 把输入分成保留侧与可补 NULL 侧；SpecialJoinInfo 记录最小 relid 集合，join_is_legal() 据此排除非法顺序。","caption":"图 16　合法 / 非法重排对照；依据本文 3.4 节与优化器 README 的 Valid OUTER JOIN Optimizations。","bridge":"优化器不只是「不敢重排」，它还会主动「降低强度」：某些 left join 会被化简掉，甚至整个删掉。","notes":"现在说优化自由度这笔账。inner join 的显式 JOIN 语法通常不约束 PostgreSQL 的 join 顺序——文档明说，显式 inner join 语义上等同于把输入关系列在 FROM 里。但 outer join 不行。left join 必须保留左侧未匹配行，所以优化器不能随便把某个 inner join 推到 nullable side 那一侧去先做。PostgreSQL 优化器 README 讲得很清楚：查询含 LEFT/RIGHT outer join 或被转换出的 semi/anti join 时，一些 join order 是非法的；优化器创建 SpecialJoinInfo，记录形成外连接所需的最小左右 relid 集合，再由 join_is_legal() 检查候选 join 是否有效。图里给了典型对照：把 C 先合到 A 侧通常合法，前提是谓词不依赖 B 的 NULL 扩展值；把 inner join 推入 B 侧通常非法，因为它可能改变未匹配左行到底该不该补 NULL 输出。两个工程现象就由此而来：多表 left join 的计划空间比同规模 inner join 更受约束；调 SQL 括号、join_collapse_limit、from_collapse_limit 时，outer join 的效果和 inner join 不一样。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"40\" y=\"24\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >优化器：外连接把输入分成保留侧与可补 NULL 侧，join order 因此受约束</text><rect x=\"40\" y=\"54\" width=\"300\" height=\"84\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"190.0\" y=\"89.125\" class=\"sv s\" text-anchor=\"middle\" font-size=\"19.0\" fill=\"#245A6B\" font-weight=\"600\" >A · 保留侧</text><text x=\"190.0\" y=\"111.625\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >non-nullable side</text><rect x=\"440\" y=\"54\" width=\"300\" height=\"84\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.1\" /><text x=\"590.0\" y=\"89.125\" class=\"sv s\" text-anchor=\"middle\" font-size=\"19.0\" fill=\"#BE653B\" font-weight=\"600\" >B · 可补 NULL 侧</text><text x=\"590.0\" y=\"111.625\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >nullable side</text><line x1=\"340\" y1=\"96\" x2=\"433.6\" y2=\"96\" stroke=\"#245A6B\" stroke-width=\"2.0\"/><polygon points=\"440,96 432,91.6 432,100.4\" fill=\"#245A6B\"/><text x=\"365\" y=\"82\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"600\" >A LEFT JOIN B</text><rect x=\"820\" y=\"44\" width=\"520\" height=\"104\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"840\" y=\"74\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"700\" >SpecialJoinInfo</text><text x=\"840\" y=\"102\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >min_lefthand / min_righthand：形成外连接所需的最小 relid 集合</text><text x=\"840\" y=\"128\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >join_is_legal() 用它过滤非法 join order</text><rect x=\"40\" y=\"192\" width=\"620\" height=\"104\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"350.0\" y=\"237.125\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#2F7A66\" font-weight=\"600\" >通常合法：C 先合入 A 侧</text><text x=\"350.0\" y=\"259.625\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >(A JOIN C) LEFT JOIN B；谓词不依赖 B 的 NULL 扩展</text><rect x=\"700\" y=\"192\" width=\"620\" height=\"104\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.1\" /><text x=\"1010.0\" y=\"237.125\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#BE653B\" font-weight=\"600\" >通常非法：inner join 推入 B 侧</text><text x=\"1010.0\" y=\"259.625\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >A LEFT JOIN (B JOIN C) 可能改变未匹配左行的输出</text><line x1=\"350\" y1=\"138\" x2=\"350\" y2=\"186.4\" stroke=\"#2F7A66\" stroke-width=\"1.8\"/><polygon points=\"350,192 346.15,185 353.85,185\" fill=\"#2F7A66\"/><line x1=\"1010\" y1=\"138\" x2=\"1010\" y2=\"186.4\" stroke=\"#BE653B\" stroke-width=\"1.8\"/><polygon points=\"1010,192 1006.15,185 1013.85,185\" fill=\"#BE653B\"/><rect x=\"40\" y=\"320\" width=\"1320\" height=\"44\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1\" /><text x=\"54\" y=\"347.25\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#AE8A3E\" font-weight=\"600\">工程现象：多表 left join 的计划空间更受约束；调括号、join_collapse_limit 的效果与 inner join 不同。</text><rect x=\"40\" y=\"374\" width=\"1320\" height=\"40\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"54\" y=\"399.075\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"600\">inner join 通常可自由重排（显式 JOIN 等价于 FROM 列表）；outer join 不行。</text></svg>","ctrl":"","anim":""},{"eyebrow":"预处理 · 化简、翻转与删除","title":"计划里没有 left join，不一定是错","lede":"reduce_outer_joins() 可把外连接降为 inner join 或 anti join；remove_useless_joins() 甚至能删掉整个 join。","caption":"图 17　三条化简路径取自本文 3.5 节与 prepjointree.c / analyzejoins.c 源码注释。","bridge":"把 left join 和它的几个邻居放一张表里横向比一比，什么时候该用谁就更清楚了。","notes":"PostgreSQL 不会机械地保留你写的每一个 left join，预处理阶段会先尝试降低外连接强度。第一条路径：WHERE b.y = 42，如果 = 是 strict 操作符，那么所有补出来的 b.y = NULL 行都过不了这一关；既然它们最终必被删，就没必要先做 outer join，直接化简成普通 inner join。第二条：WHERE b.y IS NULL，如果优化器能证明匹配行里的 b.y 不可能为 NULL，这个查询表达的就是「找不到匹配 b 的 a 行」，可以被识别成 anti join——源码注释里提到 JOIN_LEFT 到 JOIN_ANTI 的转换；RIGHT JOIN 也会被翻转成 LEFT JOIN 以减少后续处理复杂度。第三条最狠：remove_useless_joins() / join_is_removable()，如果右侧是单个基础关系、join 条件最多匹配一行、且上层根本不用右侧列，这个 left join 只会重复或不改变左输入，可以被整个删掉——ORM 自动生成和视图展开之后特别常见。但千万别拿它当建模理由：右侧键不唯一就会复制左行，上层要右列就删不掉。所以计划里看不到 left join，先别急着怀疑优化器，回头看看 WHERE 里有没有 strict 条件。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"40\" y=\"24\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >预处理：PostgreSQL 不会机械保留所有 left join，会先尝试降低外连接强度</text><rect x=\"40\" y=\"50\" width=\"1320\" height=\"88\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"60\" y=\"86\" class=\"sv serif\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#245A6B\" font-weight=\"700\" >化简为 inner join</text><line x1=\"300\" y1=\"66\" x2=\"300\" y2=\"122\" stroke=\"#245A6B\" stroke-width=\"1\"/><text x=\"320\" y=\"82\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >WHERE b.y = 42（strict）</text><text x=\"320\" y=\"112\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >补出的 b.y = NULL 必被删 → 外连接没必要</text><rect x=\"40\" y=\"150\" width=\"1320\" height=\"88\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1\" /><text x=\"60\" y=\"186\" class=\"sv serif\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#AE8A3E\" font-weight=\"700\" >识别为 anti join</text><line x1=\"300\" y1=\"166\" x2=\"300\" y2=\"222\" stroke=\"#AE8A3E\" stroke-width=\"1\"/><text x=\"320\" y=\"182\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >WHERE b.y IS NULL</text><text x=\"320\" y=\"212\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >能证明匹配行 b.y 非 NULL 时 → JOIN_ANTI</text><rect x=\"40\" y=\"250\" width=\"1320\" height=\"88\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"60\" y=\"286\" class=\"sv serif\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#2F7A66\" font-weight=\"700\" >直接删除 join</text><line x1=\"300\" y1=\"266\" x2=\"300\" y2=\"322\" stroke=\"#2F7A66\" stroke-width=\"1\"/><text x=\"320\" y=\"282\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >右侧键唯一 + 上层不用右列</text><text x=\"320\" y=\"312\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >remove_useless_joins() / join_is_removable()</text><rect x=\"40\" y=\"356\" width=\"1320\" height=\"54\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1\" /><text x=\"54\" y=\"388.425\" class=\"sv serif\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#BE653B\" font-weight=\"600\">计划里看不到 left join 不一定是优化器出错：先看 WHERE 里有没有 strict 条件把它化简掉了。</text></svg>","ctrl":"","anim":""},{"eyebrow":"横向对比 · 五种连接方式","title":"差别都在「未匹配行」怎么处理","lede":"把保留侧、ON/WHERE 敏感度、重排自由度、可化简性、物理算法与常见风险放在同一张表里对照。","caption":"图 18　五种连接方式 × 七个维度，取自本文第 4 节横向对比表；单元格为压缩表述，完整论述见各节。","bridge":"比完邻居，回到自己身上：left join 到底给我们带来什么，又收走什么？","notes":"把几种连接摆在一起看，分野其实非常干净，就一句话：未匹配行怎么办。LEFT 保留左侧、右侧补 NULL；INNER 直接删；RIGHT 保留右侧、左侧补 NULL；FULL 两侧都补；NOT EXISTS 只输出左侧没找到匹配的行，还不带右侧列。顺着这一列往下，其它差异几乎都能推出来：只要存在「补 NULL」这个动作，ON 和 WHERE 就变得非常关键，join 顺序就受 nullable side 约束，预处理就有化简空间，NULL 解释就变复杂。INNER JOIN 因为不补 NULL，重排自由度最大，ON 与 WHERE 通常可交换。RIGHT JOIN 理论上是 LEFT JOIN 交换左右表，预处理里也会被翻转成 LEFT；工程上建议优先写 left join，因为「保留谁」一眼就能看出来。FULL JOIN 两侧都补，约束最重、结果解释最麻烦，一般出现在对账和差异比较里。至于 NOT EXISTS，它把「不存在」直接说出来了，避开了 NOT IN 遇到子查询 NULL 时的语义陷阱。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"40\" y=\"22\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >横向对比：五种连接方式在「未匹配行」与「优化自由度」上的分野</text><rect x=\"40\" y=\"42\" width=\"150\" height=\"38\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"115.0\" y=\"65. \"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"710.0\" y=\"315.55\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\">同级三种</text><rect x=\"810\" y=\"290\" width=\"200\" height=\"42\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"910.0\" y=\"315.55\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\">Hash/Merge 等</text><rect x=\"1010\" y=\"290\" width=\"220\" height=\"42\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"1120.0\" y=\"315.55\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\">Anti Join</text><rect x=\"40\" y=\"332\" width=\"150\" height=\"42\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"115.0\" y=\"357.55\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\">常见风险</text><rect x=\"190\" y=\"332\" width=\"220\" height=\"42\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"300.0\" y=\"357.55\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\">条件位置 / 重复</text><rect x=\"410\" y=\"332\" width=\"200\" height=\"42\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"510.0\" y=\"357.55\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\">漏条件笛卡尔积</text><rect x=\"610\" y=\"332\" width=\"200\" height=\"42\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"710.0\" y=\"357.55\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\">可读性差</text><rect x=\"810\" y=\"332\" width=\"200\" height=\"42\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"910.0\" y=\"357.55\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\">NULL 解释复杂 =\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"600\" >保留主实体完整性：报表不丢主记录</text><rect x=\"40\" y=\"138\" width=\"640\" height=\"52\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"58\" y=\"171\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"600\" >表达缺失关系：right.pk IS NULL</text><rect x=\"40\" y=\"198\" width=\"640\" height=\"52\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"58\" y=\"231\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"600\" >支持可选维度：profile / 标签 / 最近事件</text><rect x=\"40\" y=\"258\" width=\"640\" height=\"52\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"58\" y=\"291\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"600\" >优化器统一选择 hash、merge、nested loop 等路径</text><rect x=\"720\" y=\"78\" width=\"620\" height=\"48\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"738\" y=\"109\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"600\" >行数可能膨胀：右侧一对多复制左行</text><rect x=\"720\" y=\"130\" width=\"620\" height=\"48\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"738\" y=\"161\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"600\" >优化约束更强：nullable side 限制重排</text><rect x=\"720\" y=\"182\" width=\"620\" height=\"48\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"738\" y=\"213\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"600\" >过滤位置影响语义：ON 挪到 WHERE 可能变 inner</text><rect x=\"720\" y=\"234\" width=\"620\" height=\"48\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"738\" y=\"265\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"600\" >NULL 传播复杂：聚合、比较、唯一性都要重算</text><rect x=\"720\" y=\"286\" width=\"620\" height=\"48\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"738\" y=\"317\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"600\" >估算更难：缺失比例、重复度、倾斜都影响行数</text><rect x=\"40\" y=\"352\" width=\"1300\" height=\"58\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"54\" y=\"386.25\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"600\">不伪造性能数字：用 EXPLAIN (ANALYZE, BUFFERS, VERBOSE) 看你自己的估算行数、实际行数与临时文件 I/O。</text></svg>","ctrl":"","anim":""},{"eyebrow":"场景 · 适合与不适合","title":"判断标准只有一句：左侧必须完整吗","lede":"主表必须完整、右侧是可选属性、数据质量检查、对账基准、缺失分析——适合；两边都必须存在、只关心不存在、指标不能重复——不适合。","caption":"图 20　适合 / 不适合各五条，取自本文第 8 节。","bridge":"场景选错之后，通常表现为一条慢 SQL。诊断它得按证据链走，不能一上来就问「建哪个索引」。","notes":"判断标准其实可以压成一句：左侧是不是必须一行不少地输出？是，left join 就站得住——订单列表、客户清单、商品目录、设备清单；右侧是 profile、配置、标签、最近事件这类可选属性；做数据质量检查找「左有右无」；做对账报表以业务主流水为基准查支付、发票、物流有没有缺；或者既想看匹配信息也想看缺失信息。反过来，几种情况就别硬用：两边都必须存在，用 inner join，别误导优化器和读代码的人；只关心「不存在」，多数时候 NOT EXISTS 更直接；右侧一对多而左侧指标不能重复，应该先把右表聚合或去重再 join；用 left join 去掩盖脏数据更是错——业务要求必须有维表记录，长期方案是外键约束和数据修复，让问题暴露出来；复杂多表随手全写成 left join，会把 NULL 语义范围铺得很大，限制重排，测试覆盖也变难。一句话，别为了「看起来安全」把所有 join 都写成 left join。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"40\" y=\"24\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >适合与不适合：判断标准只有一句 —— 左侧是否必须完整输出</text><rect x=\"40\" y=\"50\" width=\"650\" height=\"292\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\" /><text x=\"60\" y=\"84\" class=\"sv serif\" text-anchor=\"start\" font-size=\"20.0\" fill=\"#2F7A66\" font-weight=\"700\" >适合</text><text x=\"60\" y=\"112\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#2F7A66\" font-weight=\"600\" >01</text><text x=\"100\" y=\"112\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\" >主表必须完整：订单 / 客户 / 商品 / 设备清单</text><text x=\"60\" y=\"156\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#2F7A66\" font-weight=\"600\" >02</text><text x=\"100\" y=\"156\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\" >右侧是可选属性：profile、配置、标签、扩展字段</text><text x=\"60\" y=\"200\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#2F7A66\" font-weight=\"600\" >03</text><text x=\"100\" y=\"200\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\" >数据质量检查：左侧有、右侧缺失外键或映射</text><text x=\"60\" y=\"244\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#2F7A66\" font-weight=\"600\" >04</text><text x=\"100\" y=\"244\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\" >对账报表：以业务主流水为基准查支付 / 发票 / 物流</text><text x=\"60\" y=\"288\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#2F7A66\" font-weight=\"600\" >05</text><text x=\"100\" y=\"288\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\" >需要同时带出匹配信息与缺失信息</text><rect x=\"710\" y=\"50\" width=\"650\" height=\"292\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\" /><text x=\"730\" y=\"84\" class=\"sv serif\" text-anchor=\"start\" font-size=\"20.0\" fill=\"#BE653B\" font-weight=\"700\" >不适合</text><text x=\"730\" y=\"112\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#BE653B\" font-weight=\"600\" >01</text><text x=\"770\" y=\"112\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\" >两边都必须存在 → 用 inner join</text><text x=\"730\" y=\"156\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#BE653B\" font-weight=\"600\" >02</text><text x=\"770\" y=\"156\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\" >只关心不存在 → 多数用 NOT EXISTS</text><text x=\"730\" y=\"200\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#BE653B\" font-weight=\"600\" >03</text><text x=\"770\" y=\"200\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\" >右侧一对多但左指标不能重复 → 先聚合再 join</text><text x=\"730\" y=\"244\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#BE653B\" font-weight=\"600\" >04</text><text x=\"770\" y=\"244\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\" >用 left join 掩盖脏数据 → 该建约束、修数据</text><text x=\"730\" y=\"288\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#BE653B\" font-weight=\"600\" >05</text><text x=\"770\" y=\"288\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\" >复杂多表随手全写 left join → NULL 范围扩大、重排受限</text><rect x=\"40\" y=\"358\" width=\"1320\" height=\"52\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1\" /><text x=\"54\" y=\"389.425\" class=\"sv serif\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#AE8A3E\" font-weight=\"600\">别为了「看起来安全」把所有 join 都写成 left join：那会让语义、计划和测试一起变复杂。</text></svg>","ctrl":"","anim":""},{"eyebrow":"诊断 · 慢 SQL 的证据链","title":"先语义，再估算，最后才是索引","lede":"四步诊断：确认条件位置 → 核对估算与实际行数 → 判断算法成本边界 → 按证据修正统计、索引或 SQL 形状。","caption":"图 21　四步路径取自本文第 7 节图 5 与最佳实践；下方八个高频坑取自第 9 节。","bridge":"最后把散落的经验收成三个角色各自要守的关口，然后收尾。","notes":"调一条慢 left join，最常犯的错是直接跳到「建哪个索引」。原文给的路径是四步，我按证据链念一遍。第一步，确认语义：右表条件到底在 ON 还是 WHERE，业务究竟要不要保留左行？这一步错了，后面全白做。第二步，拿 EXPLAIN (ANALYZE, BUFFERS) 核对估算行数和实际行数；偏差大就先更新统计信息、检查 NDV、MCV、相关性和扩展统计。第三步，判断 Nested、Hash、Merge 的成本边界：Join Filter 是不是移除了大量候选行对，Hash Batches 有没有超过 1 或写临时文件，Nested Loop 是不是因为 outer 低估而反复重扫 inner。第四步才按证据动手：改统计、建索引、调整 SQL 形状。enable_hashjoin、enable_nestloop 适合临时验证假设，不适合当长期修复。下面那八条高频坑，基本都能归到这四步里的某一格：条件位置、一对多重复、可空列判缺失、NOT IN、误读 Join Filter / Filter、以为能任意换序、NATURAL 和把 COALESCE 写进 join key、忽略外连接化简、拿 left join 当数据约束。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"40\" y=\"24\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >慢 SQL 诊断路径：先语义，再估算，最后才谈索引与算法</text><rect x=\"40\" y=\"54\" width=\"305\" height=\"158\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\" /><text x=\"58\" y=\"88\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"700\" >1 · 确认语义</text><line x1=\"58\" y1=\"104\" x2=\"327\" y2=\"104\" stroke=\"#245A6B\" stroke-width=\"1\"/><text x=\"58\" y=\"136\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" >右表条件在 ON 还是 WHERE？</text><text x=\"58\" y=\"168\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >要不要保留左行？</text><text x=\"58\" y=\"196\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"600\" >证据优先</text><line x1=\"345\" y1=\"133\" x2=\"364.4\" y2=\"133\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"370,133 363,129.15 363,136.85\" fill=\"#245A6B\"/><rect x=\"370\" y=\"54\" width=\"305\" height=\"158\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.2\" /><text x=\"388\" y=\"88\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#AE8A3E\" font-weight=\"700\" >2 · 核对估算</text><line x1=\"388\" y1=\"104\" x2=\"657\" y2=\"104\" stroke=\"#AE8A3E\" stroke-width=\"1\"/><text x=\"388\" y=\"136\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" >EXPLAIN ANALYZE 的估算 vs 实际</text><text x=\"388\" y=\"168\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >更新统计 / 扩展统计</text><text x=\"388\" y=\"196\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"600\" >证据优先</text><line x1=\"675\" y1=\"133\" x2=\"694.4\" y2=\"133\" stroke=\"#AE8A3E\" stroke-width=\"1.8\"/><polygon points=\"700,133 693,129.15 693,136.85\" fill=\"#AE8A3E\"/><rect x=\"700\" y=\"54\" width=\"305\" height=\"158\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\" /><text x=\"718\" y=\"88\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"700\" >3 · 判断算法</text><line x1=\"718\" y1=\"104\" x2=\"987\" y2=\"104\" stroke=\"#245A6B\" stroke-width=\"1\"/><text x=\"718\" y=\"136\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" >Nested / Hash / Merge 的成本边界</text><text x=\"718\" y=\"168\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >看 Batches、Sort、重扫</text><text x=\"718\" y=\"196\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"600\" >证据优先</text><line x1=\"1005\" y1=\"133\" x2=\"1024.4\" y2=\"133\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"1030,133 1023,129.15 1023,136.85\" fill=\"#245A6B\"/><rect x=\"1030\" y=\"54\" width=\"305\" height=\"158\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\" /><text x=\"1048\" y=\"88\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#2F7A66\" font-weight=\"700\" >4 · 按证据修正</text><line x1=\"1048\" y1=\"104\" x2=\"1317\" y2=\"104\" stroke=\"#2F7A66\" stroke-width=\"1\"/><text x=\"1048\" y=\"136\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" >统计信息 / 索引 / SQL 形状</text><text x=\"1048\" y=\"168\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >不长期依赖 enable_*join</text><text x=\"1048\" y=\"196\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"600\" >证据优先</text><text x=\"40\" y=\"244\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" >高频坑（按出现位置归类）</text><rect x=\"40\" y=\"260\" width=\"320\" height=\"46\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"54\" y=\"289\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >WHERE 写右表条件 → 变 inner</text><rect x=\"370\" y=\"260\" width=\"320\" height=\"46\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"384\" y=\"289\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >右侧一对多 → 金额重复累计</text><rect x=\"700\" y=\"260\" width=\"320\" height=\"46\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"714\" y=\"289\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >用可空列判缺失 → 误伤真实 NULL</text><rect x=\"1030\" y=\"260\" width=\"320\" height=\"46\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"1044\" y=\"289\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >NOT IN 遇 NULL → 语义陷阱</text><rect x=\"40\" y=\"316\" width=\"320\" height=\"46\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"54\" y=\"345\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >误读 Join Filter / Filter</text><rect x=\"370\" y=\"316\" width=\"320\" height=\"46\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"384\" y=\"345\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >以为 left join 可任意换序</text><rect x=\"700\" y=\"316\" width=\"320\" height=\"46\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"714\" y=\"345\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >NATURAL / COALESCE 写进 join key</text><rect x=\"1030\" y=\"316\" width=\"320\" height=\"46\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"1044\" y=\"345\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >忽略外连接化简 / 拿 join 当约束</text><rect x=\"40\" y=\"378\" width=\"1320\" height=\"38\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1\" /><text x=\"54\" y=\"402.075\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#BE653B\" font-weight=\"600\">调 left join 不要直接跳到「建哪个索引」：前两步没确认，索引很可能建在一个语义就错了的查询上。</text></svg>","ctrl":"","anim":""},{"eyebrow":"最佳实践 · 三个角色三道关","title":"语义先于性能，证据先于猜测","lede":"架构师守模型与唯一性，DBA 守语义与估算，开发者守条件位置与列清单；三者共用一条底线。","caption":"图 22　三条角色清单取自本文第 7 节；可直接作为 code review 检查项。","bridge":"讲到这里，只剩最后一件事：把开头那句话再念一遍，看看它能不能一口气解释完全场。","notes":"把经验按角色收一下，方便直接拿去做 code review。架构师守模型：左侧应该是业务主实体或事实表，不要为了安全把所有 join 都写 left；业务语义是一对一，就给右表 join key 建唯一约束或唯一索引，否则报表行数会被重复放大；找缺失记录优先评估 NOT EXISTS，需要带出右侧列时才用 left join；为可选维度的 ON 等值键、状态过滤、时间范围设计索引。DBA 守语义与估算：先看条件在 ON 还是 WHERE 再谈索引和算法；EXPLAIN 输出行数偏差大就查 ANALYZE、NDV、MCV、扩展统计；关注右侧重复度和 Rows Removed by Join Filter；观察 Hash 的 batch、Merge 的 Sort、Materialize 与 work_mem；enable_*join 只用来验证。开发者守写法：写右表条件前先问「匹配条件还是最终过滤条件」；不要 SELECT *，明确列清单；用右表非空主键判断缺失；聚合前先处理一对多；COALESCE 只用来处理展示，不替代严格的匹配逻辑。共同底线就一句：语义先于性能，约束先于兜底，证据先于猜测。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"40\" y=\"24\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >最佳实践：三个角色，各自把哪一道关</text><rect x=\"40\" y=\"50\" width=\"420\" height=\"316\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\" /><text x=\"60\" y=\"86\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#245A6B\" font-weight=\"700\" >数据库架构师</text><line x1=\"60\" y1=\"102\" x2=\"440\" y2=\"102\" stroke=\"#245A6B\" stroke-width=\"1\"/><rect x=\"60\" y=\"123\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"76\" y=\"134\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" >明确主从：左侧应是业务主实体</text><rect x=\"60\" y=\"179\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"76\" y=\"190\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" >约束右侧唯一性：一对一就建唯一索引</text><rect x=\"60\" y=\"235\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"76\" y=\"246\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" >缺失匹配优先评估 NOT EXISTS</text><rect x=\"60\" y=\"291\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"76\" y=\"302\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" >为可选维度的 ON 条件设计索引</text><rect x=\"490\" y=\"50\" width=\"420\" height=\"316\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.2\" /><text x=\"510\" y=\"86\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#AE8A3E\" font-weight=\"700\" >DBA</text><line x1=\"510\" y1=\"102\" x2=\"890\" y2=\"102\" stroke=\"#AE8A3E\" stroke-width=\"1\"/><rect x=\"510\" y=\"123\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#AE8A3E\" stroke=\"#AE8A3E\" stroke-width=\"1\" /><text x=\"526\" y=\"134\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" >先看语义再看计划：条件在 ON 还是 WHERE</text><rect x=\"510\" y=\"179\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#AE8A3E\" stroke=\"#AE8A3E\" stroke-width=\"1\" /><text x=\"526\" y=\"190\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" >检查估算误差：ANALYZE / NDV / MCV / 扩展统计</text><rect x=\"510\" y=\"235\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#AE8A3E\" stroke=\"#AE8A3E\" stroke-width=\"1\" /><text x=\"526\" y=\"246\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" >关注右侧重复度与 Join Filter 移除行数</text><rect x=\"510\" y=\"291\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#AE8A3E\" stroke=\"#AE8A3E\" stroke-width=\"1\" /><text x=\"526\" y=\"302\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" >观察 Hash Batches、Sort、work_mem 临时文件</text><rect x=\"940\" y=\"50\" width=\"420\" height=\"316\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\" /><text x=\"960\" y=\"86\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#2F7A66\" font-weight=\"700\" >业务开发者</text><line x1=\"960\" y1=\"102\" x2=\"1340\" y2=\"102\" stroke=\"#2F7A66\" stroke-width=\"1\"/><rect x=\"960\" y=\"123\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"976\" y=\"134\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" >问自己：匹配条件还是最终过滤条件</text><rect x=\"960\" y=\"179\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"976\" y=\"190\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" >不写 SELECT *，明确列清单</text><rect x=\"960\" y=\"235\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"976\" y=\"246\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" >用右表非空主键判断缺失</text><rect x=\"960\" y=\"291\" width=\"6\" height=\"6\" rx=\"1\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"976\" y=\"302\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" >聚合前先处理一对多；COALESCE 只用于展示</text><rect x=\"40\" y=\"382\" width=\"1300\" height=\"34\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1\" /><text x=\"54\" y=\"404.25\" class=\"sv serif\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"600\">共同底线：语义先于性能，约束先于兜底，证据先于猜测。</text></svg>","ctrl":"","anim":""},{"eyebrow":"收束 · 把一句话带回现场","title":"能解释全场的，还是那一句","lede":"先按 join condition 找匹配；找不到仍输出左侧行、右侧补 NULL；补 NULL 之后再执行上层过滤。","caption":"图 23　核心句、六个扩展问题与依据来源；参考资料以官方文档与 PostgreSQL 本地源码为准。","bridge":"就讲到这儿。下次遇到一条 left join 慢 SQL，希望你先问的是「哪一步的语义」，而不是「加哪个索引」。谢谢。","notes":"最后我们把开头那句话再念一遍：先按 join condition 找匹配；找不到仍输出左侧行、右侧列补 NULL；补 NULL 之后再执行上层过滤。现在回头看，它是不是能把全场都串起来？ON 与 WHERE 的差异，是因为它们分别落在第一步和第三步；执行器为什么要存 MatchedOuter，是因为只有第一步能决定「该不该补 NULL」；优化器为什么用 SpecialJoinInfo 挡住非法重排，是因为任何重排都不能改变第一步的匹配判定；预处理为什么能化简成 inner 或 anti，是因为第三步的条件能保证补 NULL 行最终必被删；三值逻辑的坑，是因为第二步真的把 NULL 放进了数据里。一句话，四个层次，全对得上。留了六个扩展问题在图上：右侧 key 不唯一怎么证明最多一行、IS NULL 转 anti join 依赖什么条件、几种聚合在补 NULL 结果上各表达什么、串联 left join 的 NULL 传播、Hash spill 该先调什么、partitionwise join 需要哪些条件。它们都能用第 6 节那份最小 DEMO 自己动手验证。依据都在官方文档 queries.sgml、perform.sgml 和本地源码里，关键机制我回到源码和文档核对过，没有编造任何实测数字。谢谢大家。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"40\" y=\"24\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >收束：把一句话带回现场，再留六个可以自己动手验证的问题</text><rect x=\"40\" y=\"48\" width=\"1320\" height=\"96\" rx=\"4\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"66\" y=\"88\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#FFFFFF\" font-weight=\"700\" >先按 join condition 找匹配；找不到仍输出左侧行、右侧列补 NULL；补 NULL 之后再执行上层过滤。</text><text x=\"66\" y=\"122\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#CFE0DC\" font-weight=\"400\" >这一句同时解释了 ON / WHERE、执行器状态、join order 约束和外连接化简。</text><text x=\"40\" y=\"176\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" >扩展问题（可用第 6 节 DEMO 自行验证）</text><rect x=\"40\" y=\"190\" width=\"640\" height=\"52\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"56\" y=\"222\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >右侧 join key 不唯一，如何证明每左行最多一行？</text><rect x=\"40\" y=\"250\" width=\"640\" height=\"52\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"56\" y=\"282\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >IS NULL 转 anti join 依赖哪些 NOT NULL / strict 条件？</text><rect x=\"40\" y=\"310\" width=\"640\" height=\"52\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"56\" y=\"342\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >COUNT(*) / COUNT(right.col) / SUM(COALESCE(...)) 各表达什么？</text><rect x=\"700\" y=\"190\" width=\"640\" height=\"52\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"716\" y=\"222\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >串联 left join 时，第二个 ON 引用第一个右表列会怎样？</text><rect x=\"700\" y=\"250\" width=\"640\" height=\"52\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"716\" y=\"282\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >Hash Left Join spill 到磁盘，先调 work_mem 还是先改过滤位置？</text><rect x=\"700\" y=\"310\" width=\"640\" height=\"52\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"716\" y=\"342\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >分区表 partitionwise join 需要哪些分区键与等值条件？</text><rect x=\"40\" y=\"380\" width=\"1320\" height=\"38\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#F1EFE9\" stroke-width=\"1\" /><text x=\"54\" y=\"403.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"600\">依据：PostgreSQL 官方 queries.sgml / perform.sgml；源码 plannodes.h、prepjointree.c、joinrels.c、analyzejoins.c、nodeNestloop.c、explain.c。</text></svg>","ctrl":"","anim":""}];
const N = D.length;
const WHITE='#FFFFFF', PAPER2='#F1EFE9', INK='#1B2B33', INK2='#46585F';
const MUTED='#89938F', ACC_L='#F7E9DE', ACCENT='#BE653B', GREEN_L='#E4F0EA';
const GOLD_L='#F5EDDC', PRIM_L='#E5EFF0';
let cur = 0, autoOn = false, autoTimer = null, drawerMode = '';
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

function fit(){
  const vp = $('#viewport');
  const W = vp.clientWidth, H = vp.clientHeight;
  const notes = document.body.classList.contains('notes-on');
  const dw = notes ? Math.max(360, Math.min(620, Math.round(W * 0.34))) : 0;
  document.documentElement.style.setProperty('--dw', dw + 'px');
  const aw = Math.max(320, W - dw);
  const s = Math.min(aw / 1600, H / 900);
  const st = $('#stage');
  st.style.transform = 'scale(' + s + ')';
  st.style.left = ((aw - 1600 * s) / 2) + 'px';
  st.style.top  = ((H - 900 * s) / 2) + 'px';
}
window.addEventListener('resize', fit);

function render(){
  $('#slides').innerHTML = D.map((d,i) =>
    '<section class="slide" id="s'+i+'">'
    + '<div class="eyebrow"><span class="num">'+String(i+1).padStart(2,'0')+' / '+String(N).padStart(2,'0')+'</span>'+d.eyebrow+'</div>'
    + '<h1 class="title">'+d.title+'</h1>'
    + '<div class="lede">'+d.lede+'</div>'
    + '<div class="rule"></div>'
    + '<div class="figwrap">'+d.svg+'</div>'
    + (d.ctrl
        ? '<div class="caption cap-tight">'+d.caption+'</div><div class="ctrls">'+d.ctrl+'</div>'
        : '<div class="caption">'+d.caption+'</div>')
    + '<div class="bridge"><span class="bk">承接 · NEXT</span>'+d.bridge+'</div>'
    + '<div class="footer"><div class="fbar"><i id="fbar'+i+'"></i></div>'
    + '<span class="fl">数据库筑基课 · LEFT OUTER JOIN</span>'
    + '<span class="fr">'+String(i+1).padStart(2,'0')+' / '+String(N).padStart(2,'0')+'</span></div>'
    + '</section>').join('');
}

function toast(s){
  const t = $('#toast'); t.textContent = s; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('on'), 1800);
}
function prev(){ if(cur>0) go(cur-1); }
function next(){ if(cur<N-1) go(cur+1); else stopAuto(); }

function go(i, silent){
  i = Math.max(0, Math.min(N-1, i));
  if(i !== cur) pauseAnims();
  $$('.slide').forEach((el,k)=>el.classList.toggle('on', k===i));
  cur = i;
  try{ localStorage.setItem('leftjoin-slide', String(i)); }catch(e){}
  $('.pg').textContent = String(i+1).padStart(2,'0') + ' / ' + String(N).padStart(2,'0');
  $('#track i').style.width = ((i+1)/N*100)+'%';
  for(let k=0;k<N;k++){ const b=$('#fbar'+k); if(b) b.style.width = (k<=i?100:0)+'%'; }
  if(drawerMode) syncDrawer(false);
  if(D[i].anim === 'sim') simPaint();
  if(D[i].anim === 'sm')  smPaint();
  if(!silent) toast(D[i].eyebrow + ' · ' + D[i].title);
}

/* ---------- 自动播放 ---------- */
function stopAuto(){
  autoOn=false; clearInterval(autoTimer); autoTimer=null;
  $('#btnAuto').textContent='▶ 自动播放 P'; $('#btnAuto').classList.remove('act');
}
function toggleAuto(){
  if(autoOn){ stopAuto(); toast('已暂停自动播放'); return; }
  autoOn=true; $('#btnAuto').textContent='❚❚ 暂停 P'; $('#btnAuto').classList.add('act');
  autoTimer=setInterval(()=>{ if(cur<N-1) go(cur+1,true); else stopAuto(); }, 12000);
  toast('自动播放：每 12 秒一页（P 暂停）');
}

/* ---------- 讲稿：页内右侧开窗，按一下开、再按一下关 ---------- */
function singleNote(i){
  const d=D[i];
  return '<div class="here"><div class="hn">'+String(i+1).padStart(2,'0')+' · '+d.eyebrow+'</div>'
    + '<h3>'+d.title+'</h3><p>'+d.notes+'</p>'
    + '<div class="tip">按 N 关闭 · 按 T 切换为全文讲稿 · 翻页时本窗自动联动到当前页<br>'
    + '本页承接下一页：「'+d.bridge+'」</div></div>';
}
function buildDrawer(){
  const body=$('#drawerBody');
  if(drawerMode==='all'){
    body.innerHTML = D.map((d,i)=>
      '<div class="nsec" id="nsec'+i+'" data-i="'+i+'">'
      +'<div class="nn">'+String(i+1).padStart(2,'0')+' · '+d.eyebrow+'</div>'
      +'<h3>'+d.title+'</h3><p>'+d.notes+'</p>'
      +'<div class="nx">承接 · '+d.bridge+'</div></div>').join('');
    $$('.nsec').forEach(el=>el.onclick=()=>go(parseInt(el.dataset.i,10),true));
  }else{
    body.innerHTML = '<div id="hereNote">'+singleNote(cur)+'</div>';
  }
}
function syncDrawer(instant){
  if(!drawerMode) return;
  const body=$('#drawerBody');
  if(drawerMode==='here'){
    $('#hereNote').innerHTML = singleNote(cur);
    body.scrollTo({top:0,behavior:instant?'auto':'smooth'});
  }else{
    $$('.nsec').forEach((el,k)=>el.classList.toggle('cur', k===cur));
    const el=$('#nsec'+cur);
    if(el) body.scrollTo({top:Math.max(0,el.offsetTop-12),behavior:instant?'auto':'smooth'});
  }
  $('#drawerTitle').textContent = drawerMode==='all' ? '全文讲稿 · T' : '本页讲稿 · N';
  $('#drawerSub').textContent  = drawerMode==='all'
    ? '按顺序通读 · 自动定位当前页 · 点任意一段可跳页'
    : '只显示当前页 · 翻页自动联动 · 按 N 关闭';
  $('#drawerCount').textContent = String(cur+1).padStart(2,'0')+' / '+String(N).padStart(2,'0');
}
function setDrawerButtons(){
  $('#btnNotes').classList.toggle('act', drawerMode==='here');
  $('#btnAll').classList.toggle('act', drawerMode==='all');
}
function openDrawer(mode){
  if(drawerMode===mode){ closeDrawer(); return; }   /* 再按一下关闭，循环 */
  drawerMode=mode;
  document.body.classList.add('notes-on');
  buildDrawer(); fit(); syncDrawer(true); setDrawerButtons();
  toast(mode==='all' ? '全文讲稿：已定位到当前页' : '本页讲稿：画面已缩到左侧');
}
function closeDrawer(){
  drawerMode=''; document.body.classList.remove('notes-on');
  fit(); setDrawerButtons();
}

/* ---------- 目录 / 帮助：页内浮窗 ---------- */
function showVeil(inner){
  $('#panel').innerHTML='<button class="close" onclick="closeVeil()">关闭 ✕</button>'+inner;
  $('#veil').classList.add('on');
}
function closeVeil(){ $('#veil').classList.remove('on'); }
function toc(){
  showVeil('<h2>目录</h2><div class="psub">点击任意一页跳转 · 共 '+N+' 页 · G 开关</div><div class="grid">'
    + D.map((d,i)=>'<a onclick="jump('+i+')"><span class="gn">'+String(i+1).padStart(2,'0')+'</span>'
      +'<span class="gt">'+d.title+'</span></a>').join('') + '</div>');
}
function jump(i){ closeVeil(); go(i); }
function help(){
  showVeil('<h2>快捷键</h2><div class="psub">全屏状态下底部按键条依然可见</div><div class="keys">'
    + '<div><kbd>→ / 空格</kbd>下一页</div><div><kbd>←</kbd>上一页</div>'
    + '<div><kbd>G</kbd>目录</div><div><kbd>N</kbd>本页讲稿（右侧开窗）</div>'
    + '<div><kbd>T</kbd>全文讲稿（自动定位当前页）</div><div><kbd>P</kbd>自动播放 / 暂停</div>'
    + '<div><kbd>F</kbd>全屏 / 退出全屏</div><div><kbd>1–9</kbd>直接跳页</div>'
    + '<div><kbd>Home / End</kbd>首页 / 末页</div><div><kbd>Esc</kbd>关闭讲稿 / 退出全屏</div>'
    + '<div><kbd>?</kbd>本帮助</div><div><kbd>页面按钮</kbd>与快捷键等价</div></div>');
}

/* ---------- 全屏：底部按键条始终显示 ---------- */
function fs(){
  const el=document.documentElement;
  const on = !!document.fullscreenElement || document.body.classList.contains('immersive');
  if(!on){
    document.body.classList.add('immersive');
    $('#btnFs').textContent='退出全屏 F'; fit();
    toast('全屏：底部快捷键条保持可见（F / Esc 退出）');
    try{ const pr=el.requestFullscreen?el.requestFullscreen():null; if(pr&&pr.catch)pr.catch(()=>{}); }catch(e){}
  }else{
    document.body.classList.remove('immersive');
    $('#btnFs').textContent='全屏 F';
    try{ if(document.fullscreenElement&&document.exitFullscreen) document.exitFullscreen(); }catch(e){}
    fit(); toast('已退出全屏');
  }
}
document.addEventListener('fullscreenchange', ()=>{
  if(!document.fullscreenElement){
    document.body.classList.remove('immersive');
    $('#btnFs').textContent='全屏 F';
  }
  fit();
});
document.addEventListener('keydown', e=>{
  const k=e.key, tag=(e.target.tagName||'').toLowerCase();
  const typing=(tag==='input'||tag==='select'||tag==='textarea');
  if(k==='Escape'){
    if($('#veil').classList.contains('on')){ closeVeil(); return; }
    if(drawerMode){ closeDrawer(); return; }
    if(document.fullscreenElement||document.body.classList.contains('immersive')) fs();
    return;
  }
  if($('#veil').classList.contains('on')||typing) return;
  if(k==='ArrowRight'||k===' '||k==='PageDown'){ e.preventDefault(); next(); }
  else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); prev(); }
  else if(k==='f'||k==='F'){ e.preventDefault(); fs(); }
  else if(k==='g'||k==='G'){ e.preventDefault(); $('#veil').classList.contains('on')?closeVeil():toc(); }
  else if(k==='n'||k==='N'){ e.preventDefault(); openDrawer('here'); }
  else if(k==='t'||k==='T'){ e.preventDefault(); openDrawer('all'); }
  else if(k==='p'||k==='P'){ e.preventDefault(); toggleAuto(); }
  else if(k==='?'||k==='h'||k==='H'){ e.preventDefault(); help(); }
  else if(k==='Home'){ e.preventDefault(); go(0); }
  else if(k==='End'){ e.preventDefault(); go(N-1); }
  else if(/^[1-9]$/.test(k)){ go(parseInt(k,10)-1); }
});

/* ---------- 动画 A：ON / WHERE 逐行匹配模拟 ---------- */
let simStep=0, simTimer=null;
const SIM_LAST=4;
function simPause(){ clearInterval(simTimer); simTimer=null; }
function simData(){
  const mode=$('#simMode').value, multi=$('#simMulti').value==='1';
  const pays=[['1001','1','successful'],['1002','2','failed']];
  if(multi) pays.push(['1003','1','successful']);
  const outs=[];
  for(let o=1;o<=3;o++){
    if(mode==='on'){
      const m=pays.filter(p=>p[1]===String(o)&&p[2]==='successful');
      if(m.length) m.forEach(p=>outs.push([String(o),p[2]]));
      else outs.push([String(o),'NULL']);
    }else{
      pays.filter(p=>p[1]===String(o)&&p[2]==='successful').forEach(p=>outs.push([String(o),p[2]]));
    }
  }
  return {mode,multi,pays,outs};
}
function simSet(tid,txt,bg,color){
  const t=document.getElementById(tid); if(t){ t.textContent=txt; if(color) t.setAttribute('fill',color); }
  const b=document.getElementById(tid.replace(/^(sim[a-z]+)-/,'$1-bg-'));
  if(bg && b) b.setAttribute('fill',bg);
}
function simPaint(){
  if(!$('#simMode')) return;
  const {mode,multi,pays,outs}=simData();
  for(let r=0;r<3;r++){
    const row=pays[r];
    for(let c=0;c<3;c++){
      const id='simp-'+r+'-'+c, bg='simp-bg-'+r+'-'+c;
      const t=document.getElementById(id), b=document.getElementById(bg);
      if(t) t.textContent=row?row[c]:'';
      if(b) b.setAttribute('fill', (row && simStep===r+1) ? GOLD_L : (row ? WHITE : PAPER2));
    }
  }
  for(let r=0;r<3;r++){
    const b=document.getElementById('siml-bg-'+r+'-0');
    const b2=document.getElementById('siml-bg-'+r+'-1');
    const f=(simStep===r+1)?ACC_L:WHITE;
    if(b) b.setAttribute('fill',f); if(b2) b2.setAttribute('fill',f);
  }
  const shown = simStep>=1 ? outs.filter(x=>Number(x[0])<=Math.min(simStep,3)) : [];
  for(let r=0;r<5;r++){
    const row=shown[r];
    for(let c=0;c<2;c++){
      const t=document.getElementById('simo-'+r+'-'+c);
      const b=document.getElementById('simo-bg-'+r+'-'+c);
      if(t){ t.textContent=row?row[c]:''; t.setAttribute('fill', row&&row[c]==='NULL'?ACCENT:INK); }
      const hot=row&&simStep<=3&&Number(row[0])===simStep;
      if(b) b.setAttribute('fill', hot?GREEN_L:(row&&row[c]==='NULL'?ACC_L:WHITE));
    }
  }
  const out=$('#simOut');
  let msg='';
  if(simStep===0) msg='已重置：选择条件位置与右表数据，按「播放」或「单步」逐行推演';
  else if(simStep===1) msg= mode==='on'
      ? '订单 1：ON 命中 successful'+(multi?'（2 笔 → 输出 2 行）':' → 输出真实右表列')
      : '订单 1：先按 order_id 连接，WHERE 保留 successful'+(multi?'（2 行）':'（1 行）');
  else if(simStep===2) msg= mode==='on'
      ? '订单 2：只有 failed 支付，ON 不算匹配 → 左行保留、右侧补 NULL'
      : '订单 2：failed 行被 WHERE 删除 → 该订单无输出';
  else if(simStep===3) msg= mode==='on'
      ? '订单 3：无支付记录 → 左行保留、右侧补 NULL'
      : '订单 3：补 NULL 行被 WHERE 删除 → 无输出';
  else msg='完成：共输出 '+outs.length+' 行；'
      + (mode==='on'?'所有左行都在，未匹配处为 NULL':'只留下 successful 匹配行');
  out.innerHTML='<b>第 '+simStep+' 步</b>　'+msg;
  $('#simStepNo').textContent = simStep+' / '+SIM_LAST;
}
function simTick(){ if(simStep<SIM_LAST){ simStep++; simPaint(); } else simPause(); }
function simPlay(){ simPause(); if(simStep>=SIM_LAST) simStep=0; simPaint();
  simTimer=setInterval(simTick,1000); }
function simOne(){ simPause(); if(simStep<SIM_LAST) simStep++; simPaint(); }
function simReset(){ simPause(); simStep=0; simPaint(); }

/* ---------- 动画 B：执行器状态逐帧演示 ---------- */
const SM_SCEN = {
  match: [
    ['1','读到一个 outer tuple','—','false','未使用','—'],
    ['2','inner 候选通过 joinqual','true','true','未使用','—'],
    ['3','otherqual 通过','—','true','未使用','返回真实 joined row'],
    ['4','该左行处理完毕','—','true','不补 NULL','后续候选继续'],
    ['','','','','',''],['','','','','','']
  ],
  miss: [
    ['1','读到一个 outer tuple','—','false','未使用','—'],
    ['2','无 inner 候选通过 joinqual','false','false','未使用','—'],
    ['3','inner 侧耗尽且未匹配','—','false','切换到 null slot','—'],
    ['4','otherqual 在补 NULL 行上通过','—','false','右侧列全为 NULL','返回补 NULL 行'],
    ['','','','','',''],['','','','','','']
  ],
  reject: [
    ['1','读到一个 outer tuple','—','false','未使用','—'],
    ['2','inner 候选通过 joinqual','true','true','未使用','—'],
    ['3','WHERE 来源的 otherqual 不通过','—','true','未使用','不返回该行'],
    ['4','后续候选耗尽，MatchedOuter 已为真','—','true','不补 NULL','该左行无输出'],
    ['','','','','',''],['','','','','','']
  ]
};
let smStep=0, smTimer=null;
function smPause(){ clearInterval(smTimer); smTimer=null; }
function smLast(){ return 4; }
function smPaint(){
  if(!$('#smScenario')) return;
  const rows=SM_SCEN[$('#smScenario').value];
  for(let r=0;r<6;r++){
    const active=(r+1===smStep), visible=(r+1<=smStep);
    for(let c=0;c<6;c++){
      const t=document.getElementById('smt-'+r+'-'+c);
      const b=document.getElementById('smt-bg-'+r+'-'+c);
      if(t){
        if(c===0){ t.textContent = r<4 ? String(r+1) : ''; t.setAttribute('fill',visible?INK:MUTED); }
        else { t.textContent = visible?rows[r][c]:''; t.setAttribute('fill',visible?INK:MUTED); }
      }
      if(b) b.setAttribute('fill', active?ACC_L:(visible?WHITE:PAPER2));
    }
  }
  const labels=[
    '已重置：选择场景，按「播放」或「单步」观察状态变量',
    '帧 1：每读到一个新左行，匹配状态先归零',
    '帧 2：只有 joinqual 能把 MatchedOuter 置真',
    '帧 3：otherqual 只决定「返不返回」，不决定「匹不匹配」',
    '帧 4：已匹配左行不会补 NULL；未匹配左行才补 NULL'];
  $('#smOut').innerHTML='<b>第 '+smStep+' 帧</b>　'+(labels[smStep]||'');
  $('#smStepNo').textContent=smStep+' / '+smLast();
}
function smTick(){ if(smStep<smLast()){ smStep++; smPaint(); } else smPause(); }
function smPlay(){ smPause(); if(smStep>=smLast()) smStep=0; smPaint();
  smTimer=setInterval(smTick,1100); }
function smOne(){ smPause(); if(smStep<smLast()) smStep++; smPaint(); }
function smReset(){ smPause(); smStep=0; smPaint(); }
function pauseAnims(){ simPause(); smPause(); }

function init(){
  render();
  const bind=(id,fn)=>{ const el=$(id); if(el) el.onclick=fn; };
  bind('#btnPrev',prev); bind('#btnNext',next);
  bind('#btnToc',()=>$('#veil').classList.contains('on')?closeVeil():toc());
  bind('#btnNotes',()=>openDrawer('here'));
  bind('#btnAll',()=>openDrawer('all'));
  bind('#btnAuto',toggleAuto); bind('#btnFs',fs); bind('#btnHelp',help);
  bind('#drawerClose',closeDrawer);
  bind('#simPlay',simPlay); bind('#simPause',simPause); bind('#simOne',simOne); bind('#simReset',simReset);
  bind('#smPlay',smPlay); bind('#smPause',smPause); bind('#smOne',smOne); bind('#smReset',smReset);
  ['#simMode','#simMulti'].forEach(s=>{ const el=$(s); if(el) el.onchange=simReset; });
  const sc=$('#smScenario'); if(sc) sc.onchange=smReset;
  simPaint(); smPaint(); fit();
  let saved=0; try{ saved=parseInt(localStorage.getItem('leftjoin-slide')||'0',10)||0; }catch(e){}
  go(Math.min(saved,N-1), true);
}
document.addEventListener('DOMContentLoaded', init);
</script>
