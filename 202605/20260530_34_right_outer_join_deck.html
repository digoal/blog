<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数据库筑基课 · RIGHT OUTER JOIN</title>
<style>
:root{
  --bg:#F7F6F2; --bg2:#F1EFE9; --letter:#E9E7E1;
  --ink:#1B2B33; --ink2:#46585F; --ink3:#89938F; --line:#D9D5CB;
  --white:#FFFFFF; --ind:#245A6B; --indL:#E5EFF0; --indD:#1E4B5A;
  --ora:#BE653B; --oraL:#F7E9DE; --grn:#2F7A66; --grnL:#E4F0EA;
  --gld:#AE8A3E; --gldL:#F5EDDC;
  --serif:"Songti SC","STSong","Noto Serif CJK SC",Georgia,serif;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden;background:var(--letter)}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
html:fullscreen,body:fullscreen{background:var(--letter)}
button,select{font-family:inherit}
#app{position:fixed;inset:0;background:var(--letter);overflow:hidden}
body.immersive #app{z-index:9999}
#stageHost{position:absolute;left:0;top:0;bottom:0;overflow:hidden}
#stage{position:absolute;width:1600px;height:900px;background:var(--bg);
  transform-origin:0 0;overflow:hidden;border:1px solid var(--line)}
#progress{position:absolute;left:0;top:0;height:3px;background:var(--ind);width:0;
  transition:width .35s ease}
#eyebrow{position:absolute;left:64px;top:40px;height:20px;font-size:13px;
  letter-spacing:3.4px;color:var(--ind);font-weight:600;white-space:nowrap}
#title{position:absolute;left:64px;top:70px;width:1472px;height:58px;
  font-family:var(--serif);font-size:44px;line-height:1.24;color:var(--ink);
  font-weight:600;white-space:nowrap}
#lead{position:absolute;left:64px;top:134px;width:1472px;height:32px;
  font-size:19px;line-height:1.6;color:var(--ink2);white-space:nowrap}
#rule{position:absolute;left:64px;top:180px;width:1472px;height:1px;background:var(--line)}
#figure{position:absolute;left:100px;top:198px;width:1400px;height:430px}
#figure svg{display:block}
#caption{position:absolute;left:100px;top:640px;width:1400px;font-size:13px;
  color:var(--ink3);line-height:1.5;white-space:nowrap}
#nextWrap{position:absolute;left:64px;top:692px;width:1472px;
  border-left:3px solid var(--ora);padding-left:20px}
#nextTag{font-size:12px;letter-spacing:2.4px;color:var(--ora);font-weight:600}
#nextText{margin-top:6px;font-family:var(--serif);font-size:20px;
  line-height:1.5;color:var(--ink);white-space:nowrap}
#footer{position:absolute;left:64px;top:820px;width:1472px;height:52px;
  border-top:1px solid var(--line);padding-top:14px;display:flex;
  align-items:flex-start;justify-content:space-between}
#keyhints{display:flex;align-items:center;gap:0;flex-wrap:nowrap}
#keyhints button{background:none;border:0;padding:2px 11px;margin:0;
  font-size:13px;color:var(--ink3);cursor:pointer;white-space:nowrap;
  border-right:1px solid var(--line);line-height:1.3}
#keyhints button:first-child{padding-left:0}
#keyhints button:hover{color:var(--ind);background:var(--indL)}
#keyhints .khStatic{padding:2px 11px;font-size:13px;color:var(--ink3);white-space:nowrap}
#footRight{display:flex;align-items:center;gap:18px;white-space:nowrap}
#autoBadge{font-family:var(--mono);font-size:12px;color:var(--ora);letter-spacing:1px}
#pageno{font-family:var(--mono);font-size:14px;color:var(--ink2);letter-spacing:1.5px}
#toast{position:absolute;right:40px;top:28px;background:var(--ink);color:var(--white);
  font-size:14px;letter-spacing:.5px;padding:10px 18px;opacity:0;
  transition:opacity .25s ease;pointer-events:none}
#toast.show{opacity:1}
/* ---- 动画控制条 ---- */
.animBar{position:absolute;left:0;top:352px;width:1400px;height:76px;
  border-top:1px solid var(--line);display:flex;align-items:center;gap:12px}
.abLabel{font-size:12px;letter-spacing:1.6px;color:var(--ink3);margin-right:2px}
.animBar select{height:32px;min-width:154px;border:1px solid var(--line);
  background:var(--white);color:var(--ink2);font-size:13px;padding:0 8px;
  border-radius:0;outline:none}
.animBar select:focus{border-color:var(--ind)}
.animBar button{height:32px;min-width:70px;border:1px solid var(--line);
  background:var(--white);color:var(--ink2);font-size:13px;cursor:pointer;padding:0 12px}
.animBar button:hover{border-color:var(--ind);color:var(--ind);background:var(--indL)}
.animBar button.abOn{background:var(--ind);border-color:var(--ind);color:var(--white)}
.abCount{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--ink3);
  letter-spacing:1px}
#figure .anode{transition:opacity .35s ease}
/* ---- 右侧页内讲稿开窗 ---- */
#sidePanel{position:absolute;right:0;top:0;height:100%;display:none;
  flex-direction:column;background:var(--white);border-left:1px solid var(--line);
  z-index:20;overflow:hidden}
.panelHead{padding:24px 28px 16px;border-bottom:1px solid var(--line);
  display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.panelTitle{font-family:var(--serif);font-size:24px;color:var(--ink);line-height:1.3}
.panelHint{margin-top:7px;font-size:12px;color:var(--ink3);letter-spacing:.4px}
.panelClose{background:none;border:1px solid var(--line);color:var(--ink2);
  width:30px;height:30px;font-size:17px;line-height:1;cursor:pointer;flex:none}
.panelClose:hover{background:var(--oraL);border-color:var(--ora);color:var(--ora)}
.panelBody{flex:1;overflow-y:auto;position:relative;padding:24px 28px 80px}
.panelBody::-webkit-scrollbar{width:8px}
.panelBody::-webkit-scrollbar-thumb{background:var(--line)}
.panelBody::-webkit-scrollbar-track{background:var(--bg)}
.npNum{font-family:var(--mono);font-size:12px;color:var(--ora);letter-spacing:2px}
.noteWrap h2{font-family:var(--serif);font-size:25px;line-height:1.45;
  color:var(--ink);margin:12px 0 10px;font-weight:600}
.npLead{font-size:14px;line-height:1.8;color:var(--ink2);padding-bottom:18px;
  border-bottom:1px solid var(--line)}
.npSec{margin:24px 0 10px;font-size:12px;letter-spacing:2.2px;color:var(--ind);
  font-weight:600}
.npBody{font-size:15.5px;line-height:2.05;color:var(--ink2);text-align:justify}
.npNext{font-family:var(--serif);font-size:16px;line-height:1.8;color:var(--ora);
  border-left:3px solid var(--ora);padding-left:14px}
.npCap{font-size:13px;line-height:1.8;color:var(--ink3)}
.scriptBlock{padding:16px 18px 18px;margin-bottom:14px;border:1px solid var(--line);
  border-left:3px solid transparent;background:var(--bg)}
.scriptBlock.cur{border-left-color:var(--ora);background:var(--oraL)}
.sbHead{font-family:var(--serif);font-size:18px;color:var(--ink);line-height:1.5}
.sbNo{font-family:var(--mono);font-size:12px;color:var(--ind);margin-right:12px;
  letter-spacing:1px}
.scriptBlock.cur .sbNo{color:var(--ora)}
.sbLead{margin-top:6px;font-size:12.5px;line-height:1.7;color:var(--ink3)}
.sbNote{margin-top:10px;font-size:14px;line-height:1.95;color:var(--ink2);
  text-align:justify}
.tocRow{display:flex;align-items:baseline;gap:14px;padding:11px 12px;
  border-bottom:1px solid var(--line);cursor:pointer;font-size:14px;color:var(--ink2)}
.tocRow:hover{background:var(--indL);color:var(--ind)}
.tocRow.cur{background:var(--oraL);color:var(--ora)}
.tocNo{font-family:var(--mono);font-size:12px;color:var(--ink3);min-width:26px}
.tocRow.cur .tocNo{color:var(--ora)}
.tocEyebrow{margin-left:auto;font-size:11px;color:var(--ink3);white-space:nowrap}
.helpRow{display:flex;gap:18px;align-items:baseline;padding:10px 0;
  border-bottom:1px solid var(--line);font-size:14px;color:var(--ink2)}
.helpKey{font-family:var(--mono);font-size:13px;color:var(--ind);min-width:104px;
  letter-spacing:.5px}
.helpNote{margin-top:20px;font-size:13px;line-height:1.9;color:var(--ink3);
  border-left:3px solid var(--gld);padding-left:14px;background:var(--gldL);padding:12px 14px}
</style>
</head>
<body>
<div id="app">
  <div id="stageHost">
    <div id="stage">
      <div id="progress"></div>
      <div id="eyebrow"></div>
      <div id="title"></div>
      <div id="lead"></div>
      <div id="rule"></div>
      <div id="figure"></div>
      <div id="caption"></div>
      <div id="nextWrap">
        <div id="nextTag">承接 · NEXT</div>
        <div id="nextText"></div>
      </div>
      <div id="footer">
        <div id="keyhints">
          <button data-act="prev">← 上一页</button>
          <button data-act="next">→ 下一页</button>
          <button data-act="toc">G 目录</button>
          <button data-act="note">N 本页讲稿</button>
          <button data-act="all">T 全文讲稿</button>
          <button data-act="auto">P 自动播放</button>
          <button data-act="full">F 全屏</button>
          <button data-act="help">? 快捷键</button>
          <span class="khStatic">1–9 跳页 · 空格翻页 · Esc 关闭</span>
        </div>
        <div id="footRight"><span id="autoBadge"></span><span id="pageno"></span></div>
      </div>
      <div id="toast"></div>
    </div>
  </div>
  <aside id="sidePanel">
    <div class="panelHead">
      <div><div class="panelTitle" id="panelTitle"></div>
        <div class="panelHint" id="panelHint"></div></div>
      <button class="panelClose" data-act="close" title="关闭">×</button>
    </div>
    <div class="panelBody" id="panelBody"></div>
  </aside>
</div>

extLength=\"271.4\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:11.50px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">可能显示 Hash Right Join / Merge Right Join</text></svg>","caption":"图 01｜两条镜像写法与七层处理路径：从 SQL 文本到 EXPLAIN，方向会被改写两次。","nxt":"先回到业务现场，看这个「方向」到底在替我们解决什么。","note":"这一讲不讨论 right join 能不能用，只追一件事：方向。官方文档里那句「只是记法便利」，其实已经把结论说完了——交换左右表，它就是一个 left join。可一旦方向写反，后面所有事情都会跟着别扭：读 SQL 的人要反向理解保留侧，写条件的人容易把过滤放错位置，看 EXPLAIN 的人还会被计划名称误导。所以我们按一条因果链往下走：先看业务到底要保留谁，再看精确定义，再看 ON 和 WHERE 的分叉，然后钻进 PostgreSQL 的规划器和执行器，最后回到工程上该怎么写。底下这七层横带就是今天的地图，越深的靛青越靠近语义底层。","anim":""},{"eyebrow":"一 · 问题的起点","title":"需求：列出所有订单，包括没有物流的","lead":"orders 是完整清单，shipments 只记录已发货的订单；SQL 却是从 shipments 开始写的。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" preserveAspectRatio=\"xMidYMid meet\" role=\"img\" aria-label=\"讲稿示意图\"><defs><marker id=\"arI\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#245A6B\"/></marker><marker id=\"arO\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#BE653B\"/></marker><marker id=\"arG\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#2F7A66\"/></marker><marker id=\"arN\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#89938F\"/></marker></defs><rect x=\"40.0\" y=\"18.0\" width=\"1320.0\" height=\"56.0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.0\"/><text x=\"700.0\" y=\"46.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"424.8\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC 谁负责保证「orders 每一行都出现」。","nxt":"既然差别只在「保留侧写在哪」，那命题就可以收得很紧了。","note":"先把场景钉死。订单表是业务的完整清单，物流表只有已经发货的那些行。现在要列出所有订单和它们的物流状态，注意，是「所有」。可是 SQL 已经从 shipments 写起了，这是真实工程里很常见的状态：查询是长出来的，不是一次设计好的。这时候有三条路。写成 inner join，订单 3 没有物流记录，直接消失，业务上就漏了。放到应用层，先查订单再逐条查物流，会多出 N 次往返，而且两次查询之间数据可能已经变了，一致性说不清。第三条路就是 right join：让数据库一次性把右侧的 orders 完整保留下来。所以你看，right join 解决的从来不是性能，是「谁必须出现」这件事该由谁来负责表达。","anim":""},{"eyebrow":"二 · 核心命题","title":"RIGHT JOIN 就是交换输入后的 LEFT JOIN","lead":"官方文档：它只是记法便利，交换左右表即可变成 LEFT OUTER JOIN。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" preserveAspectRatio=\"xMidYMid meet\" role=\"img\" aria-label=\"讲稿示意图\"><defs><marker id=\"arI\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#245A6B\"/></marker><marker id=\"arO\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#BE653B\"/></marker><marker id=\"arG\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#2F7A66\"/></marker><marker id=\"arN\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#89938F\"/></marker></defs><rect x=\"40.0\" y=\"34.0\" width=\"600.0\" height=\"116.0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"58.0\" y=\"68.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"155.5\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:16.00px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">写法 A｜RIGHT JOIN</text><text x=\"58.0\" y=\"92.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"277.8\" lengthAdjust=\"spacingAndGlyph "middle\" textLength=\"446.6\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:10.56px;font-weight:400;fill:#46585F;letter-spacing:0.00px\">结果集至少为 T2 的每一行保留一行；RIGHT OUTER JOIN 是 LEFT OUTER JOIN 的反向形式</text></svg>","caption":"图 04｜按文中 DEMO 数据推导：右侧三行全部输出，未匹配的 o3 由左侧补 NULL。","nxt":"定义是静态的；真正容易错的是「每一行怎么走到这一步」，我们让它动起来。","note":"把定义写成可推导的形式：结果集等于两部分并起来。第一部分是满足 ON 条件的左右行对，第二部分是右表里一个左表行都没匹配上的那些行，配上一整排左侧 NULL。用文中的 DEMO 数据走一遍：orders 有 1、2、3 三行，shipments 有 order_id 1 和 2 两行。o1 配 s1，o2 配 s2，o3 找不到任何左表行，于是输出 NULL 加 o3。注意一个对称的边界：左表里如果有匹配不上右表的行，它不会被单独输出，因为右侧保留不等于左侧保留。官方文档在 7.2 节也是这么定义的，先 inner join，再为 T2 的未匹配行补 T1 的 NULL，结果集至少为 T2 每行保留一行。","anim":""},{"eyebrow":"三 · 语义层 · 逐行推演","title":"右表每一行都独立走一次「匹配 / 补 NULL」","lead":"选择要观察的右表行，用播放或单步看它如何进入结果集。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1400 350\" width=\"1400\" height=\"350\" preserveAspectRatio=\"xMidYMid meet\" role=\"img\" aria-label=\"讲稿示意图\"><defs><marker id=\"arI\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#245A6B\"/></marker><marker id=\"arO\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#BE653B\"/></marker><marker id=\"arG\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#2F7A66\"/></marker><marker id=\"arN\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#89938F\"/></marker></defs><rect x=\"30.0\" y=\"10.0\" width=\"300.0\" height=\"36.0\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.0\"/><text x=\"180.0\" y=\"28.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"111.8\" lengthAdjus  dominant-baseline=\"middle\" textLength=\"126.0\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'SF Mono',Menlo,Consolas,monospace;font-size:15.00px;font-weight:600;fill:#BE653B;letter-spacing:0.00px\">NULL · NULL · 3</text></g><rect x=\"30.0\" y=\"278.0\" width=\"1340.0\" height=\"46.0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text id=\"p5-label\" x=\"52\" y=\"301\" dominant-baseline=\"middle\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:15px;fill:#46585F\">准备就绪：按「播放」或「单步」观察右表三行如何各自走完一条分支</text></svg>","caption":"图 05｜可交互推演：输入选择观察范围，播放 / 暂停 / 单步 / 重置控制时序。","nxt":"把同一份结果换成 LEFT JOIN 写出来，语义不变，但还有几处细节要复核。","note":"这一页值得慢一点看。右侧 orders 的每一行，都是一次独立的判断：拿 join key 去左表找，找到就输出真实行对，找不到就走 NULL 扩展分支。关键点在于，这两条分支是「或」的关系，不是先后过滤的关系。所以右表行永远不会因为匹配失败而消失——它只会从「带出左表列」变成「左表列全 NULL」。图上可以用下拉框选只看某一行，也可以播放完整三行。建议你专门单步看 o3：它走的是和 o1、o2 完全不同的分支，但最后一样出现在结果里。这就是 outer join 和 inner join 最本质的分界，也是后面所有条件位置问题的源头。","anim":"p5"},{"eyebrow":"三 · 语义层 · 等价改写","title":"改写交换的是 FROM 输入，不是整条 SQL 的含义","lead":"结果集等价，但列引用、SELECT 清单与 USING 列合并都要同步复核。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" preserveAspectRatio=\"xMidYMid meet\" role=\"img\" aria-label=\"讲稿示意图\"><defs><marker id=\"arI\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#245A6B\"/></marker><marker id=\"arO\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#BE653B\"/></marker><marker id=\"arG\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#2F7A66\"/></marker><marker id=\"arN\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#89938F\"/></marker></defs><rect x=\"40.0\" y=\"26.0\" width=\"620.0\" height=\"142.0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"58.0\" y=\"63.2\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"70.2\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'SF Mono',Menlo,Consolas,monospace;font-size:15.00px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">-- 原写法</text><text x=\"58.0\" y=\"85.8\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"352.8\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'SF Mono',Menlo,Consolas,monospace;font-size:15.00px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">SELECT s.shipment_id, s.status, o.order_id</text><text x=\"58.0\" y=\"108.2\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"134.4\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'SF Mono',Menlo,Consolas,monospace;font-size:15.00px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">FROM shipments s</text><text x=\"58.0\" y=\"130.8\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"394.8\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'SF Mono',Menlo,Consolas,monospace;font-size:15.00px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">RIGHT JOIN orders o ON s.order_id = o.order_id;</text><rect x=\"740.0\" y=\"26.0\" width=\"620.0\" height=\"142.0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.0\"/><text x=\"758.0\" y=\"63.2\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"85.2\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'SF Mono',Menlo,Consolas,monospace;font-size:15.00px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">-- 推荐改写</text><text x=\"758.0\" y=\"85.8\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"352.8\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'SF Mono',Menlo,Consolas,monospace;font-size:15.00px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">SELECT s.shipment_id, s.status, o.order_id</text><text x=\"758.0\" y=\"108.2\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"109.2\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'SF Mono',Menlo,Consolas,monospace;font-size:15.00px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">FROM orders o</text><text x=\"758.0\" y=\"130.8\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"411.6\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'SF Mono',Menlo,Consolas,monospace;font-size:15.00px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">LEFT JOIN shipments s ON s.order_id = o.order_id;</text><text x=\"700.0\" y=\"70.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"52.0\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:13.00px;font-weight:400;fill:#BE653B;letter-spacing:0.00px\">交换输入</text><line x1=\"665.0\" y1=\"98.0\" x2=\"735.0\" y2=\"98.0\" stroke=\"#BE653B\" stroke-width=\"2.0\" fill=\"none\" marker-end=\"url(#arO)\"/><rect x=\"40.0\" y=\"196.0\" width=\"650.0\" height=\"90.0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"58.0\" y=\"241.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"423.0\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:15.00px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">[&#x27;① 结果集等价&#x27;, &#x27;行集合相同；行序只由 ORDER BY 决定&#x27;]</text><rect x=\"690.0\" y=\"196.0\" width=\"650.0\" height=\"90.0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"708.0\" y=\"241.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"393.0\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:15.00px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">[&#x27;② 显式列清单&#x27;, &#x27;改写后不要依赖 SELECT * 的位置&#x27;]</text><rect x=\"40.0\" y=\"286.0\" width=\"650.0\" height=\"90.0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"58.0\" y=\"331.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"441.6\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:15.00px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">[&#x27;③ 列顺序会变&#x27;, &#x27;SELECT * 下，FROM 顺序决定输出列顺序&#x27;]</text><rect x=\"690.0\" y=\"286.0\" width=\"650.0\" height=\"90.0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"708.0\" y=\"331.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"465.0\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:15.00px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">[&#x27;④ USING / NATURAL&#x27;, &#x27;同名列会被合并，改写后须复核列集合&#x27;]</text><text x=\"40.0\" y=\"398.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"535.6\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:13.00px;font-weight:400;fill:#89938F;letter-spacing:0.00px\">改写只交换 FROM 中的输入；列引用、表别名、SELECT 清单与 USING 列合并都要同步复核</text></svg>","caption":"图 06｜两条等价 SQL 与四个改写检查点：结果集、列清单、列顺序、列合并。","nxt":"改写之后，最容易出事的就是条件放哪里；我们来看那个分叉点。","note":"改写成 left join 是很轻的一步，但别以为只是把两个表名对调就完事了。结果集确实等价，行序依然只由 ORDER BY 决定，数据库不承诺别的顺序。可是 SELECT * 会变：JOIN ON 的输出列是 T1 全部列再接 T2 全部列，FROM 顺序一换，列顺序就跟着换，靠位置取列的应用层代码会悄悄错位。USING 和 NATURAL 更要小心，它们会合并同名列，改写后列集合和列的先后都要重新核一遍。所以实践里的动作是：交换 FROM 输入、保留显式列清单、复核别名和列引用，然后跑一次结果比对。改写很便宜，验证不能省。","anim":""},{"eyebrow":"三 · 语义层 · 条件位置","title":"ON 决定「是否匹配」，WHERE 在补 NULL 之后才生效","lead":"引用左表列的同一个条件，放在 ON 和放在 WHERE，会差出两行结果。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1 Sans CJK SC','Microsoft YaHei',sans-serif;font-size:13.00px;font-weight:400;fill:#46585F;letter-spacing:0.00px\">所以若本意是保留所有订单，就不要把可补 NULL 侧列的非空条件写进 WHERE；计划里看不到 right join 不一定是 bug</text></svg>","caption":"图 09｜reduce_outer_joins() 的化简链：strict qual 让 outer join 失去存在意义。","nxt":"语义层到此为止；接下来钻进 PostgreSQL，看方向在哪一层被改写。","note":"顺着上一页再推一步。如果 WHERE 里写的是 s.shipment_id IS NOT NULL，那么所有补 NULL 出来的订单行，左侧主键必然是 NULL，一定被过滤掉。既然这些行最终一个都留不下，优化器就没必要先生成它们。prepjointree.c 里 reduce_outer_joins 的注释说得很清楚：当上方存在 strict qual 约束可空侧列为非空时，外连接可以降低强度，降到 inner join。于是计划里看不到 right join，甚至看不到任何 outer join——这不是优化器出错，是你自己写的 WHERE 把保留语义取消了。所以别把「保留所有订单」的意图和「左侧列非空」的条件同时塞进一条 SQL，它们本来就是矛盾的。","anim":""},{"eyebrow":"四 · 系统层 · 分层剖面","title":"一条 RIGHT JOIN 要穿过 PostgreSQL 的七层","lead":"从 SQL 文本到 EXPLAIN，方向在预处理层被翻转，在路径层又可能反转。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" preserveAspectRatio=\"xMidYMid meet\" role=\"img\" aria-label=\"讲稿示意图\"><defs><marker id=\"arI\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#245A6B\"/></marker><marker id=\"arO\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#BE653B\"/></marker><marker id=\"arG\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#2F7A66\"/></marker><marker id=\"arN\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#89938F\"/></marker></defs><text x=\"56.0\" y=\"12.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"22.0\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:11.00px;font-weight:400;fill:#89938F;le "middle\" textLength=\"306.8\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:13.00px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">可能显示 Hash Right Join / Merge Right Join</text><text x=\"40.0\" y=\"414.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"448.3\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:12.00px;font-weight:400;fill:#89938F;letter-spacing:0.00px\">越深的靛青＝越靠近语义底层；方向在第 3 层被改写，在第 5 层又可能按成本反转</text></svg>","caption":"图 10｜地层剖面：越深的靛青越靠近语义底层，第 3 层是方向的转折点。","nxt":"先解释最反直觉的一层：为什么规划阶段要主动消灭 JOIN_RIGHT。","note":"现在换视角，从「SQL 是什么意思」切到「数据库怎么处理它」。这七层是理解后面所有现象的地基。语法层声明右侧保留；解析树里 JoinExpr.jointype 确实可以是 JOIN_RIGHT；到了预处理，reduce_outer_joins 把它翻转成 JOIN_LEFT；SpecialJoinInfo 从此不再保留 JOIN_RIGHT；但路径和计划生成阶段，joinrels.c 又可能按成本生成 JOIN_RIGHT 形态的物理路径；执行器用 NullOuterTupleSlot 真正补出左侧 NULL；最后 EXPLAIN 把物理方向显示成 Hash Right Join 之类。请特别记住第 3 层和第 5 层这两个转折：语义方向在规划早期被规范化，物理方向在后期按成本又可能被换回来。两件事发生在不同层，不矛盾。","anim":""},{"eyebrow":"四 · 系统层 · 预处理","title":"为什么规划阶段要主动消灭 JOIN_RIGHT","lead":"不是为了不支持，而是为了不必再发明一个 JOIN_REVERSE_ANTI。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" preserveAspectRatio=\"xMidYMid meet\" role=\"img\" aria-label=\"讲稿示意图\"><defs><marker id=\"arI\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#245A6B\"/></marker><marker id=\"arO\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#BE653B\"/></marker><marker id=\"arG\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#2F7A66\"/></marker><marker id=\"arN\" markerWidth if;font-size:15.00px;font-weight:600;fill:#FFFFFF;letter-spacing:0.00px\">（保留侧）</text><rect x=\"1090.0\" y=\"148.0\" width=\"270.0\" height=\"76.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"1225.0\" y=\"186.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"141.0\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:15.00px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">rarg｜shipments s</text><text x=\"700.0\" y=\"78.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"104.6\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:12.00px;font-weight:400;fill:#BE653B;letter-spacing:0.00px\">交换 larg / rarg</text><line x1=\"650.0\" y1=\"104.0\" x2=\"750.0\" y2=\"104.0\" stroke=\"#BE653B\" stroke-width=\"2.0\" fill=\"none\" marker-end=\"url(#arO)\"/><rect x=\"40.0\" y=\"244.0\" width=\"1320.0\" height=\"100.0\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.0\"/><text x=\"60.0\" y=\"274.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"354.8\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:13.79px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">源码注释｜prepjointree.c · reduce_outer_joins()</text><text x=\"60.0\" y=\"294.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"647.2\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:13.79px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">「Also, we get rid of JOIN_RIGHT cases by flipping them around to become JOIN_LEFT …</text><text x=\"60.0\" y=\"314.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"631.7\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:13.79px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">the main reason to do it is to not need to invent a JOIN_REVERSE_ANTI join type.」</text><rect x=\"40.0\" y=\"356.0\" width=\"1320.0\" height=\"62.0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"700.0\" y=\"379.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"637.2\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:10.56px;font-weight:400;fill:#46585F;letter-spacing:0.00px\">pathnodes.h：SpecialJoinInfo 的 jointype is never JOIN_RIGHT；join_info_list 只保留 LEFT / FULL / SEMI / ANTI</text><text x=\"700.0\" y=\"394.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"500.3\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:10.56px;font-weight:400;fill:#46585F;letter-spacing:0.00px\">实践：读源码或调计划时，别只搜索 JOIN_RIGHT，还要看 JOIN_LEFT、输入交换逻辑与 reversed 状态</text></svg>","caption":"图 11｜jointree 翻转前后，以及 prepjointree.c 源码注释的直接引述。","nxt":"既然 SpecialJoinInfo 里没有 JOIN_RIGHT，那 EXPLAIN 里的 Right Join 又从哪来？","note":"这里补一条网上和源码里都能核对到的实证。reduce_outer_joins 的注释原文是：我们去掉 JOIN_RIGHT，靠把 larg 和 rarg 交换，把它变成 JOIN_LEFT；这样做省掉一些代码，但主要理由是不必再发明一种 JOIN_REVERSE_ANTI 连接类型。这比「优化器不喜欢 right join」这种含糊说法准确得多——它是为了控制 planner 里需要维护的对称状态数量。相应地，pathnodes.h 对 SpecialJoinInfo 的注释写明：jointype 永远不是 JOIN_RIGHT，join_info_list 里允许的类型只有 LEFT、FULL、SEMI、ANTI。所以调计划、读源码的时候，只搜 JOIN_RIGHT 会漏掉大量关键逻辑，真正要看的是 JOIN_LEFT、输入交换和 reversed 状态。","anim":""},{"eyebrow":"四 · 系统层 · 路径生成","title":"LEFT JOIN 也能生成 Hash Right Join 计划","lead":"计划名称描述的是物理输入方向，不是你写的 SQL 文本方向。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" preserveAspectRatio=\"xMidYMid meet\" role=\"img\" aria-label=\"讲稿示意图\"><defs><marker id=\"arI\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#245A6B\"/></marker><marker id=\"arO\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#BE653B\"/></marker><marker id=\"arG\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#2F7A66\"/></marker><marker id=\"arN\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#89938F\"/></marker></defs><rect x=\"470.0\" y=\"16.0\" width=\"460.0\" height=\"56.0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.0\"/><text x=\"700.0\" y=\"44.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"329.6\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:16.00px;font-weight:600;fill:#1B2B33;letter-spacing:0.00px\">SpecialJoinInfo｜jointype = JOIN_LEFT</text><line x1=\"700.0\" y1=\"72.0\" x2=\"700.0\" y2=\"108.0\" stroke=\"#245A6B\" stroke-width=\"1.6\" fill=\"none\"/><line x1=\"350.0\" y1=\"108.0\" x2=\"1050.0\" y2=\"108.0\" stroke=\"#245A6B\" stroke-width=\"1.6\" fill=\"none\"/><line x1=\"350.0\" y1=\"108.0\" x2=\"350.0\" y2=\"138.0\" stroke=\"#245A6B\" stroke-width=\"1.6\" fill=\"none\" marker-end=\"url(#arI)\"/><line x1=\"1050.0\" y1=\"108.0\" x2=\"1050.0\" y2=\"138.0\" stroke=\"#BE653B\" stroke-width=\"1.6\" fill=\"none\" marker-end=\"url(#arO)\"/><rect x=\"40.0\" y=\"138.0\" width=\"620.0\" height=\"110.0\" fill=\"#FFFFFF\" stroke=\"#245A6B\" stroke-width=\"1.0\"/><text x=\"350.0\" y=\"182.3\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"423.0\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:15.00px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">路径 A｜add_paths_to_joinrel(rel1, rel2, JOIN_LEFT)</text><text x=\"350.0\" y=\"203.6\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"474.6\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:15.00px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">保留侧在物理 outer｜Hash Left Join / Nested Loop Left Join</text><rect x=\"740.0\" y=\"138.0\" width=\"620.0\" height=\"110.0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.0\"/><text x=\"1050.0\" y=\"182.3\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"431.4\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:15.00px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">路径 B｜add_paths_to_joinrel(rel2, rel1, JOIN_RIGHT)</text><text x=\"1050.0\" y=\"203.6\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"441.0\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:15.00px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">保留侧在物理 inner｜Hash Right Join / Merge Right Join</text><line x1=\"350.0\" y1=\"248.0\" x2=\"350.0\" y2=\"288.0\" stroke=\"#245A6B\" stroke-width=\"1.6\" fill=\"none\" marker-end=\"url(#arI)\"/><line x1=\"1050.0\" y1=\"248.0\" x2=\"1050.0\" y2=\"288.0\" stroke=\"#BE653B\" stroke-width=\"1.6\" fill=\"none\" marker-end=\"url(#arO)\"/><rect x=\"40.0\" y=\"288.0\" width=\"1320.0\" height=\"56.0\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.0\"/><text x=\"700.0\" y=\"316.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"405.6\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:14.08px;font-weight:600;fill:#1B2B33;letter-spacing:0.00px\">按成本择一｜计划名称描述物理输入方向，不描述 SQL 文本方向</text><rect x=\"40.0\" y=\"356.0\" width=\"1320.0\" height=\"64.0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"700.0\" y=\"380.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"508.4\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:11.27px;font-weight:400;fill:#46585F;letter-spacing:0.00px\">源码｜joinrels.c · populate_joinrel_with_paths()：JOIN_LEFT 分支同时枚举两种输入顺序</text><text x=\"700.0\" y=\"396.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"567.4\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:11.27px;font-weight:400;fill:#46585F;letter-spacing:0.00px\">推论：你写 LEFT JOIN，EXPLAIN 也可能显示 Hash Right Join；写 RIGHT JOIN 同样可能显示 Left Join</text></svg>","caption":"图 12｜populate_joinrel_with_paths() 为 JOIN_LEFT 同时枚举两种输入顺序。","nxt":"方向落到执行器时，就变成一个很具体的问题：谁来补那一排 NULL。","note":"这是最容易被误判成「优化器出 bug」的一页。joinrels.c 的 populate_joinrel_with_paths 在处理 JOIN_LEFT 时，会同时枚举两条路径：一条是 rel1 LEFT JOIN rel2，另一条是把输入交换后的 rel2 RIGHT JOIN rel1。为什么？因为哈希连接总希望把较小的那个关系放进内存建表，如果保留侧恰好很小，把它当作物理 inner 去哈希就更划算，于是计划节点显示成 Hash Right Join。反过来，你写 RIGHT JOIN，经过预处理翻成 LEFT，最后也可能显示 Hash Left Join。所以读 EXPLAIN 时不要拿计划名称去对 SQL 文本顺序，要追的是「哪一侧是语义保留侧」以及 Hash Cond 对应的 join key。","anim":""},{"eyebrow":"四 · 系统层 · 执行器","title":"补 NULL 的方向，决定哪个执行节点能接住它","lead":"Hash / Merge 有 NullOuterTupleSlot；Nested Loop 只准备了 NullInnerTupleSlot。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" preserveAspectRatio=\"xMidYMid meet\" role=\"img\" aria-label=\"讲稿示意图\"><defs><marker id=\"arI\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" or join.c</text><rect x=\"240.0\" y=\"160.0\" width=\"340.0\" height=\"78.0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"410.0\" y=\"199.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"169.1\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:14.00px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">有｜LEFT / ANTI / FULL</text><rect x=\"580.0\" y=\"160.0\" width=\"340.0\" height=\"78.0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"750.0\" y=\"199.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"224.0\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:14.00px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">有｜RIGHT / RIGHT_ANTI / FULL</text><rect x=\"920.0\" y=\"160.0\" width=\"460.0\" height=\"78.0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"1150.0\" y=\"199.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"304.6\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:14.00px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">支持｜HJ_FILL_INNER 扫描未匹配 inner 表项</text><rect x=\"20.0\" y=\"238.0\" width=\"220.0\" height=\"78.0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"130.0\" y=\"267.1\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"78.4\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:14.00px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">Merge Join</text><text x=\"130.0\" y=\"286.9\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"117.6\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:14.00px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">nodeMergejoin.c</text><rect x=\"240.0\" y=\"238.0\" width=\"340.0\" height=\"78.0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"410.0\" y=\"277.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"169.1\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:14.00px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">有｜LEFT / ANTI / FULL</text><rect x=\"580.0\" y=\"238.0\" width=\"340.0\" height=\"78.0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"750.0\" y=\"277.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"122.1\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:14.00px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">有｜RIGHT / FULL</text><rect x=\"920.0\" y=\"238.0\" width=\"460.0\" height=\"78.0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"1150.0\" y=\"277.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"334.3\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:14.00px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">支持｜但额外 joinqual 必须可并入 merge clause</text><rect x=\"20.0\" y=\"340.0\" width=\"660.0\" height=\"56.0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.0\"/><text x=\"350.0\" y=\"368.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"296.3\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:16.00px;font-weight:600;fill:#1B2B33;letter-spacing:0.00px\">LEFT JOIN｜未匹配左行 → 补右 s-serif;font-size:15.00px;font-weight:600;fill:#1B2B33;letter-spacing:0.00px\">改写成等价 left join 后再跑一次，比较计划和结果</text></svg>","caption":"图 17｜收益 / 代价清单，以及 EXPLAIN (ANALYZE, BUFFERS, VERBOSE) 的四项观察点。","nxt":"把前面的结论收成一条可执行的排障路径。","note":"这里我特意不写任何「快多少」「慢多少」的数字，因为没跑过的实例就不该有数字。收益可以讲清楚：右侧基准关系能直接声明、兼容生成器产出的 SQL、临时对账语法直接。代价也很清楚：审查要反向理解保留侧、左表条件放 WHERE 会把外连接化简掉、EXPLAIN 方向和文本方向可能不一致、物理执行还有 Nested Loop 与 Merge 的边界，多表混用时阅读成本陡增。那怎么评估一条真实 SQL？用 EXPLAIN (ANALYZE, BUFFERS, VERBOSE)，盯四件事：哪一侧是语义保留侧、Hash Cond 或 Merge Cond 是否对应 join key、Join Filter 和 Filter 各自来自哪里、估算行数和实际行数偏了多少。然后把 SQL 改写成等价 left join 再跑一次，比较计划和结果——很多时候改写后更容易定位索引、统计信息和过滤位置的问题。","anim":""},{"eyebrow":"五 · 工程层 · 诊断路径","title":"先把「方向问题」从「性能问题」里剥离出来","lead":"四步：确认保留侧 → 交换输入改写 → 检查条件位置 → 验证计划。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" preserveAspectRatio=\"xMidYMid meet\" role=\"img\" aria-label=\"讲稿示意图\"><defs><marker id=\"arI\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#245A6B\"/></marker><marker id=\"arO\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#BE653B\"/></marker><marker id=\"arG\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#2F7A66\"/></marker><marker id=\"arN\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#89938F\"/></marker></defs><rect x=\"40.0\" y=\"36.0\" width=\"310.0\" height=\"110.0\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.0\"/><text x=\"195.0\" y=\"81.1\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"85.7\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC',' N 还是 WHERE</text><rect x=\"1090.0\" y=\"36.0\" width=\"310.0\" height=\"110.0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.0\"/><text x=\"1245.0\" y=\"81.1\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"71.7\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:14.00px;font-weight:600;fill:#1B2B33;letter-spacing:0.00px\">④ 验证计划</text><text x=\"1245.0\" y=\"100.9\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"203.8\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:14.00px;font-weight:600;fill:#1B2B33;letter-spacing:0.00px\">EXPLAIN (ANALYZE, BUFFERS)</text><line x1=\"350.0\" y1=\"91.0\" x2=\"390.0\" y2=\"91.0\" stroke=\"#245A6B\" stroke-width=\"1.8\" fill=\"none\" marker-end=\"url(#arI)\"/><line x1=\"700.0\" y1=\"91.0\" x2=\"740.0\" y2=\"91.0\" stroke=\"#245A6B\" stroke-width=\"1.8\" fill=\"none\" marker-end=\"url(#arI)\"/><line x1=\"1050.0\" y1=\"91.0\" x2=\"1090.0\" y2=\"91.0\" stroke=\"#245A6B\" stroke-width=\"1.8\" fill=\"none\" marker-end=\"url(#arI)\"/><line x1=\"195.0\" y1=\"146.0\" x2=\"195.0\" y2=\"208.0\" stroke=\"#BE653B\" stroke-width=\"1.6\" fill=\"none\" stroke-dasharray=\"5 4\" marker-end=\"url(#arO)\"/><rect x=\"40.0\" y=\"208.0\" width=\"310.0\" height=\"78.0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.0\"/><text x=\"195.0\" y=\"247.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"238.0\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:14.00px;font-weight:500;fill:#1B2B33;letter-spacing:0.00px\">可读性风险｜读者要反向理解右侧保留</text><line x1=\"545.0\" y1=\"146.0\" x2=\"545.0\" y2=\"208.0\" stroke=\"#BE653B\" stroke-width=\"1.6\" fill=\"none\" stroke-dasharray=\"5 4\" marker-end=\"url(#arO)\"/><rect x=\"390.0\" y=\"208.0\" width=\"310.0\" height=\"78.0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.0\"/><text x=\"545.0\" y=\"247.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"282.0\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:13.77px;font-weight:500;fill:#1B2B33;letter-spacing:0.00px\">计划可能翻转｜EXPLAIN 名称不等于文本方向</text><line x1=\"895.0\" y1=\"146.0\" x2=\"895.0\" y2=\"208.0\" stroke=\"#BE653B\" stroke-width=\"1.6\" fill=\"none\" stroke-dasharray=\"5 4\" marker-end=\"url(#arO)\"/><rect x=\"740.0\" y=\"208.0\" width=\"310.0\" height=\"78.0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.0\"/><text x=\"895.0\" y=\"247.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"282.0\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:13.61px;font-weight:500;fill:#1B2B33;letter-spacing:0.00px\">过滤误删保留行｜WHERE 左侧列删补 NULL 行</text><line x1=\"1245.0\" y1=\"146.0\" x2=\"1245.0\" y2=\"208.0\" stroke=\"#2F7A66\" stroke-width=\"1.6\" fill=\"none\" marker-end=\"url(#arG)\"/><rect x=\"1090.0\" y=\"208.0\" width=\"310.0\" height=\"78.0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.0\"/><text x=\"1245.0\" y=\"247.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"224.0\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:14.00px;font-weight:500;fill:#1B2B33;letter-spacing:0.00px\">方向问题已剥离｜剩下的是性能问题</text><rect x=\"40.0\" y=\"304.0\" width=\"1320.0\" height=\"64.0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.0\"/><text x=\"700.0\" y=\"336.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"655.4\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:16.00px;font-weight:600;fill:#1B2B33;letter-spacing:0.00px\">行动顺序：语义改写为 LEFT JOIN → 比较结果与计划 → 再定位索引、统计信息与过滤位置</text><text x=\"40.0\" y=\"392.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"508.6\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:13.00px;font-weight:400;fill:#BE653B;letter-spacing:0.00px\">核心：先把「谁必须出现」定清楚，再讨论「跑得快不快」——方向问题不该混进性能问题</text></svg>","caption":"图 18｜诊断与改写路径；前三步各自对应一个典型风险，第四步才进入性能分析。","nxt":"路径落到不同角色身上，动作会略有不同。","note":"排障最怕一上来就调索引、调参数，结果发现是语义写错了。所以顺序应该是固定的四步。第一步，先问「谁必须完整出现」，right join 的答案是右表。第二步，交换输入改写成 left join，语义一点没变，但沟通和阅读成本立刻降下来。第三步，检查所有引用可选侧列的条件，看它究竟是匹配条件还是最终过滤条件——这一步解决的是误删保留行和外连接化简。第四步，才拿 EXPLAIN ANALYZE 去看估算、Hash Batches、Join Filter 移除行数这些真正的性能问题。前三步把方向问题清干净，第四步剩下的才是性能问题。混在一起查，两边都查不明白。","anim":""},{"eyebrow":"五 · 工程层 · 最佳实践","title":"三个角色，同一个动作：保留侧放左边","lead":"架构师管建模方向，DBA 管计划解读，开发者管 SQL 写法。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" preserveAspectRatio=\"xMidYMid meet\" role=\"img\" aria-label=\"讲稿示意图\"><defs><marker id=\"arI\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#245A6B\"/></marker><marker id=\"arO\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#BE653B\"/></marker><marker id=\"arG\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#2F7A66\"/></marker><marker id=\"arN\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#89938F\"/></marker></defs><rect x=\"40.0\" y=\"18.0\" width=\"430.0\" height=\"48.0\" fill=\"#1E4B5A\" str t-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:15.00px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">③ 不用 SELECT *，用显式列清单</text><rect x=\"930.0\" y=\"312.0\" width=\"430.0\" height=\"82.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"946.0\" y=\"353.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"184.2\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:15.00px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">④ 找缺失优先 NOT EXISTS</text><text x=\"40.0\" y=\"412.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"433.9\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:12.00px;font-weight:400;fill:#89938F;letter-spacing:0.00px\">三类角色的共同动作只有一个：把必须完整保留的一侧，放到 LEFT JOIN 的左边</text></svg>","caption":"图 19｜面向架构师、DBA、业务开发者的各四条实践清单。","nxt":"清单之外，把最常见的十类坑按根因归成四组。","note":"把建议按角色拆开，是为了让每个人知道自己该在哪一层发力。架构师管的是建模方向：把必须完整保留的关系放在 SQL 左边，把 right join 当等价记法而不是设计模式，控制可选侧基数，能用约束表达的业务必然性别长期靠补 NULL 兜着。DBA 管的是排障和计划：先改写再排障、检查外连接化简、别被 EXPLAIN 方向误导、用 ANALYZE 和 BUFFERS 验证估算，还要留意右侧保留侧「至少输出右表行数」带来的下游成本。业务开发者的动作最朴素：生产 SQL 首选 left join、可选侧列条件慎放 WHERE、不用 SELECT *、找缺失优先 NOT EXISTS、测试覆盖「一个匹配 / 多个匹配 / 没有匹配 / 可选侧列为 NULL」四类边界。三个角色指向同一个动作。","anim":""},{"eyebrow":"五 · 工程层 · 常见坑","title":"十类坑，根因只有三件事","lead":"保留方向、条件位置、输出基数——按这四组去自查就够了。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" preserveAspectRatio=\"xMidYMid meet\" role=\"img\" aria-label=\"讲稿示意图\"><defs><marker id=\"arI\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#245A6B\"/></marker><marker id=\"arO\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUni ;font-weight:400;fill:#89938F;letter-spacing:0.00px\">十类坑的共同根因只有三件事：保留方向、条件位置、输出基数</text></svg>","caption":"图 20｜语义 / 过滤 / 计划 / 基数四类坑位地图，覆盖文中常见坑清单。","nxt":"最后把三层结论压成一句话。","note":"把常见的坑摊开看，会发现它们并不是十个孤立技巧，而是三个根因的不同副作用。第一组是方向理解错：把 right join 当成更强的 left join、依赖 NATURAL 的隐式同名列、拿可空列去判断缺失——最后一条尤其阴险，状态为空和压根没有这一行，是两件完全不同的事，判断缺失要用左侧主键或非空 join key。第二组是条件位置：左表条件放 WHERE、忽略外连接化简、用 COALESCE 把 join key 包起来改掉 NULL 匹配规则，还可能顺手废掉索引。第三组是把物理方向当语义方向。第四组是基数：左侧一对多会把右侧金额指标放大，改写后 SELECT * 的列顺序变化，以及 USING、NATURAL 场景下没验证等价性。按这三件事去自查，比背十条清单管用。","anim":""},{"eyebrow":"六 · 收束","title":"一句话心法：保留侧写左边，条件写在 ON","lead":"语义层看谁必须出现，规划层看方向被翻转，执行层看谁补 NULL。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" preserveAspectRatio=\"xMidYMid meet\" role=\"img\" aria-label=\"讲稿示意图\"><defs><marker id=\"arI\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#245A6B\"/></marker><marker id=\"arO\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#BE653B\"/></marker><marker id=\"arG\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#2F7A66\"/></marker><marker id=\"arN\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#89938F\"/></marker></defs><rect x=\"40.0\" y=\"20.0\" width=\"1320.0\" height=\"76.0\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"0.0\"/><text x=\"60.0\" y=\"58.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"57.0\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'Songti SC','STSong','Noto Serif CJK SC',Georgia,serif;font-size:19.00px;font-weight:600;fill:#FFFFFF;letter-spacing:0.00px\">语义层</text><text x=\"268.0\" y=\"58.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"341.8\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:16.00px;font-weight:400;fill:#FFFFFF;letter-spacing:0.00px\">保留侧决定谁必须出现；被补 NULL 的是另一侧</text><rect x=\"40.0\" y=\"110.0\" width=\"1320.0\" height=\"76.0\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"0.0\"/><text x=\"60.0\" y=\"148.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"57.0\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'Songti SC','STSong','Noto Serif CJK SC',Georgia,serif;font-size:19.00px;font-weight:600;fill:#FFFFFF;letter-spacing:0.00px\">规划层</text><text x=\"268.0\" y=\"148.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"338.6\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:16.00px;font-weight:400;fill:#FFFFFF;letter-spacing:0.00px\">JOIN_RIGHT 被翻转；物理路径按成本交换输入</text><rect x=\"40.0\" y=\"200.0\" width=\"1320.0\" height=\"76.0\" fill=\"#A4C4C6\" stroke=\"#A4C4C6\" stroke-width=\"0.0\"/><text x=\"60.0\" y=\"238.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"57.0\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'Songti SC','STSong','Noto Serif CJK SC',Georgia,serif;font-size:19.00px;font-weight:600;fill:#1B2B33;letter-spacing:0.00px\">执行层</text><text x=\"268.0\" y=\"238.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"563.2\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:16.00px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">Hash / Merge 用 NullOuterTupleSlot 补左侧；Nested Loop 不直接支持</text><rect x=\"40.0\" y=\"296.0\" width=\"1320.0\" height=\"70.0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.0\"/><text x=\"700.0\" y=\"331.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"611.8\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'Songti SC','STSong','Noto Serif CJK SC',Georgia,serif;font-size:21.13px;font-weight:600;fill:#1B2B33;letter-spacing:0.00px\">生产 SQL 的心法：把必须完整保留的一侧写在 LEFT JOIN 左边</text><rect x=\"40.0\" y=\"378.0\" width=\"1320.0\" height=\"44.0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"700.0\" y=\"400.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"559.3\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:11.27px;font-weight:400;fill:#46585F;letter-spacing:0.00px\">延伸思考｜SpecialJoinInfo 为何不含 JOIN_RIGHT？NOT EXISTS 何时等价？USING 改写后列顺序如何变？</text></svg>","caption":"图 21｜三层结论与生产 SQL 心法；底部给出可继续追问的三个扩展问题。","nxt":"讲到这里，可以带着这三个扩展问题去读源码了。","note":"收一下。语义层只有一句话：保留侧决定谁必须出现，被补 NULL 的是另一侧；所以 ON 决定匹配，WHERE 在补 NULL 之后才生效。规划层是两句：reduce_outer_joins 把 JOIN_RIGHT 翻成 JOIN_LEFT，而路径生成又会按成本把输入换回来，因此 EXPLAIN 的方向不等于 SQL 文本的方向。执行层是最后一句：Hash 和 Merge 用 NullOuterTupleSlot 补左侧 NULL，Nested Loop 不直接生成 right join 节点，Merge Right Join 对额外 joinqual 还有边界。把三层合起来，工程结论就非常朴素——生产 SQL 里，把必须完整保留的一侧写在 LEFT JOIN 左边，把可选侧的匹配条件写在 ON 里，显式的列清单，改写后跑一次结果和计划的比对。留三个问题给你继续追：SpecialJoinInfo 为何不含 JOIN_RIGHT、NOT EXISTS 何时与 right join 加 IS NULL 等价、USING 改写后列顺序怎么变。","anim":""}];
const N = PAGES.length;
const PANEL_TITLE = {note:"本页讲稿", all:"全文讲稿", toc:"目录", help:"快捷键"};
const PANEL_HINT = {
  note:"按 N 再按一次关闭 · 翻页时讲稿同步",
  all:"按 T 再按一次关闭 · 翻页自动定位到当前页",
  toc:"按 G 再按一次关闭 · 点击条目跳页",
  help:"按 ? 或 H 再按一次关闭"
};
const state = {page:0, panel:null, auto:false, autoTimer:null,
               anim:{name:null, step:0, playing:false, timer:null}};

const $ = id => document.getElementById(id);
const stage=$("stage"), stageHost=$("stageHost"), figure=$("figure");
const sidePanel=$("sidePanel"), panelBody=$("panelBody");
const autoBadge=$("autoBadge"), toastEl=$("toast");
let toastTimer=null;

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
function pad(n){return n<10?"0"+n:String(n);}
function toast(msg){
  toastEl.textContent=msg; toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toastEl.classList.remove("show"),2100);
}

/* ---------------- 舞台等比缩放 + letterbox ---------------- */
function panelWidth(){
  const vw=window.innerWidth;
  return state.panel ? Math.max(340, Math.min(480, Math.round(vw*0.33))) : 0;
}
function layout(){
  const vw=window.innerWidth, vh=window.innerHeight;
  const pw=panelWidth();
  const availW=vw-pw;
  sidePanel.style.width=pw+"px";
  sidePanel.style.display=state.panel?"flex":"none";
  stageHost.style.width=availW+"px";
  const k=Math.min(availW/1600, vh/900);
  stage.style.transform="scale("+k+")";
  stage.style.left=((availW-1600*k)/2)+"px";
  stage.style.top=((vh-900*k)/2)+"px";
}
window.addEventListener("resize",layout);
document.addEventListener("fullscreenchange",layout);

/* ---------------- 动画步骤 ---------------- */
function p5Steps(sel){
  const rows = sel==="all" ? [1,2,3] : [parseInt(sel,10)];
  let on=[];
  const steps=[{on:[],label:"准备就绪：按「播放」或「单步」观察右表三行如何各自走完一条分支"}];
  rows.forEach(r=>{
    steps.push({on:on.concat(["p5-r"+r]),
      label:"取右表第 "+r+" 行 o"+r+"（order_id = "+r+"）"});
    steps.push({on:on.concat(["p5-r"+r,"p5-d"+r]),
      label:r===3?"左表无 order_id = 3 的行 → 进入 NULL 扩展分支":
                  "在左表找到 s"+r+"（order_id = "+r+"）→ 匹配成功"});
    on=on.concat(["p5-r"+r,"p5-d"+r,"p5-o"+r]);
    steps.push({on:on.slice(),
      label:r===3?"输出 NULL · NULL · 3｜右行仍然保留":
                  "输出真实行对，进入结果集"});
  });
  steps.push({on:on.slice(),
    label:"结论：右表每一行至少输出一次；匹配失败只是把左表列换成 NULL"});
  return steps;
}
function p14Steps(sel){
  const mk=(on,flags,label)=>({on:on,flags:flags,label:label});
  const B=["p14-build"], BP=["p14-build","p14-probe"],
        BPF=["p14-build","p14-probe","p14-fill"],
        ALL=["p14-build","p14-probe","p14-fill","p14-null"];
  if(sel==="fill"){
    return [
      mk([],false,"准备就绪：只观察阶段三的 NULL 扩展"),
      mk(BPF,true,"前置状态：o1、o2 已标记 matched，两条真实行对已输出"),
      mk(ALL,true,"③ FILL：o3 未被标记 → 用 NullOuterTupleSlot 输出左侧 NULL + o3"),
      mk(ALL,true,"结论：补 NULL 是探测全部结束之后的收尾动作")
    ];
  }
  return [
    mk([],false,"准备就绪：按「播放」观察建表 → 探测 → 补 NULL 的完整时序"),
    mk(B,false,"① BUILD：保留侧 orders 全部装入哈希表，每项带 matched 标记"),
    mk(BP,false,"② PROBE：左表 shipments 逐行按 order_id 探测哈希表"),
    mk(BPF,true,"命中 o1、o2 → 标记 matched，并输出两条真实行对"),
    mk(ALL,true,"③ FILL：o3 未被标记 → NullOuterTupleSlot 补左侧 NULL"),
    mk(ALL,true,"结论：right join 至少输出右侧行数；补 NULL 发生在探测结束之后")
  ];
}
function animSteps(name){
  const inp=$("aInput");
  const sel=inp?inp.value:"all";
  return name==="p5"?p5Steps(sel):p14Steps(sel);
}
function animBar(name){
  const opts = name==="p5"
    ? '<option value="all">全部三行 o1 / o2 / o3</option><option value="1">仅看 o1（命中）</option><option value="2">仅看 o2（命中）</option><option value="3">仅看 o3（补 NULL）</option>'
    : '<option value="all">完整流程：三阶段</option><option value="fill">仅阶段三：补 NULL</option>';
  return '<div class="animBar" data-anim="'+name+'">'+
    '<span class="abLabel">输入 · 观察范围</span>'+
    '<select id="aInput" aria-label="观察范围">'+opts+'</select>'+
    '<button data-a="play" id="aPlay">播放</button>'+
    '<button data-a="pause">暂停</button>'+
    '<button data-a="step">单步</button>'+
    '<button data-a="reset">重置</button>'+
    '<span class="abCount" id="aCount"></span></div>';
}
function applyAnim(){
  const name=state.anim.name; if(!name) return;
  const steps=animSteps(name), k=Math.min(state.anim.step,steps.length-1);
  const st=steps[k];
  const initial=(st.on.length===0);
  figure.querySelectorAll(".anode").forEach(el=>{
    el.style.opacity = initial ? "1" : (st.on.indexOf(el.id)>=0 ? "1" : "0.48");
  });
  if(name==="p14"){
    for(let i=0;i<3;i++){
      const a=$("p14-f"+i+"-0"), b=$("p14-f"+i+"-1");
      if(!a||!b) continue;
      const matched=!!st.flags && i<2;
      a.style.display=matched?"none":"";
      b.style.display=matched?"":"none";
    }
  }
  const lab=$(name+"-label"); if(lab) lab.textContent=st.label;
  const c=$("aCount"); if(c) c.textContent=pad(k+1)+" / "+pad(steps.length);
  const pb=$("aPlay"); if(pb) pb.classList.toggle("abOn",!!state.anim.playing);
}
function stopAnim(){
  if(state.anim.timer) clearInterval(state.anim.timer);
  state.anim={name:null,step:0,playing:false,timer:null};
}
function animPause(){
  if(state.anim.timer) clearInterval(state.anim.timer);
  state.anim.timer=null; state.anim.playing=false; applyAnim();
}
function animPlay(){
  const name=state.anim.name; if(!name) return;
  const steps=animSteps(name);
  if(state.anim.step>=steps.length-1) state.anim.step=0;
  animPause();
  state.anim.playing=true;
  state.anim.timer=setInterval(()=>{
    const ss=animSteps(name);
    if(state.anim.step>=ss.length-1){animPause();return;}
    state.anim.step++; applyAnim();
  },1150);
  applyAnim();
}
function animStep(){
  const name=state.anim.name; if(!name) return;
  animPause();
  const steps=animSteps(name);
  if(state.anim.step<steps.length-1) state.anim.step++;
  applyAnim();
}
function animReset(){ animPause(); state.anim.step=0; applyAnim(); }
function initAnim(name){
  stopAnim();
  state.anim={name:name,step:0,playing:false,timer:null};
  applyAnim();
}
figure.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]"); if(!b) return;
  const a=b.getAttribute("data-a");
  if(a==="play")animPlay(); else if(a==="pause")animPause();
  else if(a==="step")animStep(); else if(a==="reset")animReset();
});
figure.addEventListener("change",e=>{
  if(e.target && e.target.id==="aInput"){
    animPause(); state.anim.step=0; applyAnim();
  }
});

/* ---------------- 页面渲染 ---------------- */
function renderPage(){
  const p=PAGES[state.page];
  $("eyebrow").textContent=p.eyebrow;
  $("title").textContent=p.title;
  $("lead").textContent=p.lead;
  figure.innerHTML=p.svg+(p.anim?animBar(p.anim):"");
  $("caption").textContent=p.caption;
  $("nextText").textContent=p.nxt;
  $("pageno").textContent=pad(state.page+1)+" / "+pad(N);
  $("progress").style.width=((state.page+1)/N*100)+"%";
  if(p.anim) initAnim(p.anim); else stopAnim();
}
function restartAutoTimer(){
  clearInterval(state.autoTimer);
  if(state.auto) state.autoTimer=setInterval(()=>goto(state.page+1),9000);
}
function goto(i){
  state.page=((i%N)+N)%N;
  renderPage();
  if(state.panel==="note") buildPanel();
  else if(state.panel==="all") scrollToCurrent(true);
  else if(state.panel==="toc") markCurrent();
  if(state.auto) restartAutoTimer();
}

/* ---------------- 右侧页内开窗 ---------------- */
function noteHTML(i){
  const p=PAGES[i];
  return '<div class="noteWrap"><div class="npNum">'+pad(i+1)+" / "+pad(N)+'</div>'+
    '<h2>'+esc(p.title)+'</h2><div class="npLead">'+esc(p.lead)+'</div>'+
    '<div class="npSec">本页讲稿</div><div class="npBody">'+esc(p.note)+'</div>'+
    '<div class="npSec">承接 · NEXT</div><div class="npNext">'+esc(p.nxt)+'</div>'+
    '<div class="npSec">图注</div><div class="npCap">'+esc(p.caption)+'</div></div>';
}
function allHTML(){
  return PAGES.map((p,i)=>
    '<div class="scriptBlock" data-page="'+i+'">'+
    '<div class="sbHead"><span class="sbNo">'+pad(i+1)+'</span>'+esc(p.title)+'</div>'+
    '<div class="sbLead">'+esc(p.lead)+'</div>'+
    '<div class="sbNote">'+esc(p.note)+'</div></div>').join("");
}
function tocHTML(){
  return PAGES.map((p,i)=>
    '<div class="tocRow" data-jump="'+i+'"><span class="tocNo">'+pad(i+1)+'</span>'+
    '<span>'+esc(p.title)+'</span><span class="tocEyebrow">'+esc(p.eyebrow)+'</span></div>').join("");
}
function helpHTML(){
  const rows=[
    ["← / → / ↑ / ↓","上一页 / 下一页"],
    ["空格 / PageDown","下一页；PageUp 上一页"],
    ["1 – 9","跳到第 1 – 9 页"],
    ["Home / End","第一页 / 最后一页"],
    ["G","目录（再按一次关闭）"],
    ["N","本页讲稿（再按一次关闭）"],
    ["T","全文讲稿（再按一次关闭，自动定位当前页）"],
    ["P","自动播放开 / 关"],
    ["F","全屏开 / 关"],
    ["? / H","本快捷键说明"],
    ["Esc","关闭右侧开窗 / 退出全屏"]
  ];
  return rows.map(r=>'<div class="helpRow"><span class="helpKey">'+esc(r[0])+
    '</span><span>'+esc(r[1])+'</span></div>').join("")+
    '<div class="helpNote">右侧开窗为页内开窗，不是弹窗：打开时舞台等比缩放到左侧；'+
    'T 模式下翻页会自动把右侧讲稿滚动到当前页。带动画的两页提供观察范围输入，'+
    '以及播放 / 暂停 / 单步 / 重置按钮。全屏后底部快捷键仍然可见可点。</div>';
}
function markCurrent(){
  panelBody.querySelectorAll(".scriptBlock,.tocRow").forEach(el=>{
    el.classList.toggle("cur", el.getAttribute("data-page")===String(state.page) ||
                               el.getAttribute("data-jump")===String(state.page));
  });
}
function scrollToCurrent(smooth){
  if(state.panel!=="all") return;
  markCurrent();
  const el=panelBody.querySelector('.scriptBlock[data-page="'+state.page+'"]');
  if(!el) return;
  panelBody.scrollTo({top:Math.max(0,el.offsetTop-14),behavior:smooth?"smooth":"auto"});
}
function buildPanel(){
  $("panelTitle").textContent=PANEL_TITLE[state.panel]||"";
  $("panelHint").textContent=PANEL_HINT[state.panel]||"";
  if(state.panel==="note") panelBody.innerHTML=noteHTML(state.page);
  else if(state.panel==="all") panelBody.innerHTML=allHTML();
  else if(state.panel==="toc") panelBody.innerHTML=tocHTML();
  else if(state.panel==="help") panelBody.innerHTML=helpHTML();
  markCurrent();
  panelBody.scrollTop=0;
}
function setPanel(mode){
  if(state.panel===mode || mode===null){
    state.panel=null; layout(); return;
  }
  state.panel=mode;
  buildPanel();
  layout();
  if(mode==="all"){
    scrollToCurrent(false);
    requestAnimationFrame(()=>scrollToCurrent(false));
  }
}
panelBody.addEventListener("click",e=>{
  const r=e.target.closest("[data-jump]");
  if(r){ goto(parseInt(r.getAttribute("data-jump"),10)); }
});

/* ---------------- 自动播放 / 全屏 ---------------- */
function toggleAuto(){
  state.auto=!state.auto;
  autoBadge.textContent=state.auto?"AUTO ●":"";
  if(state.auto){restartAutoTimer();toast("自动播放已开启 · 每页 9 秒");}
  else{clearInterval(state.autoTimer);toast("自动播放已关闭");}
}
function toggleFull(){
  if(!document.fullscreenElement){
    const el=document.documentElement;
    if(el.requestFullscreen){
      el.requestFullscreen().then(()=>{layout();toast("已进入全屏 · 底部快捷键仍然可用");})
        .catch(()=>{document.body.classList.add("immersive");layout();
                    toast("浏览器未允许全屏，已切换沉浸模式");});
    }else{
      document.body.classList.toggle("immersive"); layout();
      toast(document.body.classList.contains("immersive")?"已切换沉浸模式":"已退出沉浸模式");
    }
  }else{
    document.exitFullscreen().then(()=>{
      document.body.classList.remove("immersive");layout();toast("已退出全屏");
    }).catch(()=>{});
  }
}

/* ---------------- 底部按键与键盘 ---------------- */
function act(a){
  if(a==="prev")goto(state.page-1);
  else if(a==="next")goto(state.page+1);
  else if(a==="toc")setPanel("toc");
  else if(a==="note")setPanel("note");
  else if(a==="all")setPanel("all");
  else if(a==="auto")toggleAuto();
  else if(a==="full")toggleFull();
  else if(a==="help")setPanel("help");
  else if(a==="close")setPanel(null);
}
$("keyhints").addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(b) act(b.getAttribute("data-act"));
});
sidePanel.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(b) act(b.getAttribute("data-act"));
});
document.addEventListener("keydown",e=>{
  const t=e.target;
  const k=e.key;
  const inField=t && (t.tagName==="SELECT"||t.tagName==="INPUT"||t.tagName==="TEXTAREA");
  if(inField){
    if(k==="Escape"){t.blur();setPanel(null);return;}
    if(k.indexOf("Arrow")===0||k===" "||k.indexOf("Page")===0||
       k==="Home"||k==="End"||/^[1-9]$/.test(k)) return;
  }
  if(k==="ArrowRight"||k==="ArrowDown"||k===" "||k==="PageDown"){
    e.preventDefault();goto(state.page+1);
  }else if(k==="ArrowLeft"||k==="ArrowUp"||k==="PageUp"){
    e.preventDefault();goto(state.page-1);
  }else if(k==="Home"){goto(0);}
  else if(k==="End"){goto(N-1);}
  else if(/^[1-9]$/.test(k)){goto(parseInt(k,10)-1);}
  else{
    const q=k.toLowerCase();
    if(q==="g")setPanel("toc");
    else if(q==="n")setPanel("note");
    else if(q==="t")setPanel("all");
    else if(q==="p")toggleAuto();
    else if(q==="f")toggleFull();
    else if(q==="?"||q==="h")setPanel("help");
    else if(k==="Escape"){
      if(state.panel)setPanel(null);
      else if(document.fullscreenElement)toggleFull();
      else if(document.body.classList.contains("immersive")){
        document.body.classList.remove("immersive");layout();
      }
    }
  }
});

/* ---------------- 启动 ---------------- */
renderPage();
layout();
</script>
</body>
</html>
