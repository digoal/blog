<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数据库筑基课 · CROSS JOIN</title>
<style>
:root{
  --bg:#F7F6F2; --bg2:#F1EFE9; --letter:#E9E7E1;
  --ink:#1B2B33; --ink2:#46585F; --ink3:#89938F; --line:#D9D5CB;
  --white:#FFFFFF; --ind:#245A6B; --indL:#E5EFF0; --indD:#1E4B5A;
  --ora:#BE653B; --oraL:#F7E9DE; --grn:#2F7A66; --grnL:#E4F0EA;
  --gld:#AE8A3E; --gldL:#F5EDDC;
  --serif:"Songti SC","STSong","Noto Serif CJK SC",Georgia,serif;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden;background:var(--letter)}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
html:fullscreen,body:fullscreen{background:var(--letter)}
button,select{font-family:inherit}
#app{position:fixed;inset:0;background:var(--letter);overflow:hidden}
body.immersive #app{z-index:9999}
#stageHost{position:absolute;left:0;top:0;bottom:0;overflow:hidden}
#stage{position:absolute;width:1600px;height:900px;background:var(--bg);
  transform-origin:0 0;overflow:hidden;border:1px solid var(--line)}
#progress{position:absolute;left:0;top:0;height:3px;background:var(--ind);width:0;
  transition:width .35s ease}
#eyebrow{position:absolute;left:64px;top:40px;height:20px;font-size:13px;
  letter-spacing:3.4px;color:var(--ind);font-weight:600;white-space:nowrap}
#title{position:absolute;left:64px;top:70px;width:1472px;height:58px;
  font-family:var(--serif);font-size:44px;line-height:1.24;color:var(--ink);
  font-weight:600;white-space:nowrap}
#lead{position:absolute;left:64px;top:134px;width:1472px;height:32px;
  font-size:19px;line-height:1.6;color:var(--ink2);white-space:nowrap}
#rule{position:absolute;left:64px;top:180px;width:1472px;height:1px;background:var(--line)}
#figure{position:absolute;left:100px;top:198px;width:1400px;height:430px}
#figure svg{display:block}
#caption{position:absolute;left:100px;top:640px;width:1400px;font-size:13px;
  color:var(--ink3);line-height:1.5;white-space:nowrap}
#nextWrap{position:absolute;left:64px;top:692px;width:1472px;
  border-left:3px solid var(--ora);padding-left:20px}
#nextTag{font-size:12px;letter-spacing:2.4px;color:var(--ora);font-weight:600}
#nextText{margin-top:6px;font-family:var(--serif);font-size:20px;
  line-height:1.5;color:var(--ink);white-space:nowrap}
#footer{position:absolute;left:64px;top:820px;width:1472px;height:52px;
  border-top:1px solid var(--line);padding-top:14px;display:flex;
  align-items:flex-start;justify-content:space-between}
#keyhints{display:flex;align-items:center;gap:0;flex-wrap:nowrap}
#keyhints button{background:none;border:0;padding:2px 11px;margin:0;
  font-size:13px;color:var(--ink3);cursor:pointer;white-space:nowrap;
  border-right:1px solid var(--line);line-height:1.3}
#keyhints button:first-child{padding-left:0}
#keyhints button:hover{color:var(--ind);background:var(--indL)}
#keyhints .khStatic{padding:2px 11px;font-size:13px;color:var(--ink3);white-space:nowrap}
#footRight{display:flex;align-items:center;gap:18px;white-space:nowrap}
#autoBadge{font-family:var(--mono);font-size:12px;color:var(--ora);letter-spacing:1px}
#pageno{font-family:var(--mono);font-size:14px;color:var(--ink2);letter-spacing:1.5px}
#toast{position:absolute;right:40px;top:28px;background:var(--ink);color:var(--white);
  font-size:14px;letter-spacing:.5px;padding:10px 18px;opacity:0;
  transition:opacity .25s ease;pointer-events:none}
#toast.show{opacity:1}
/* ---- 动画：页内控制条与步骤说明 ---- */
.animBar{position:absolute;left:0;top:352px;width:1400px;height:76px;
  border-top:1px solid var(--line);display:flex;align-items:center;gap:12px}
.abLabel{font-size:12px;letter-spacing:1.6px;color:var(--ink3);margin-right:2px;
  white-space:nowrap}
.animBar select{height:32px;min-width:186px;border:1px solid var(--line);
  background:var(--white);color:var(--ink2);font-size:13px;padding:0 8px;
  border-radius:0;outline:none}
.animBar select:focus{border-color:var(--ind)}
.animBar button{height:32px;min-width:70px;border:1px solid var(--line);
  background:var(--white);color:var(--ink2);font-size:13px;cursor:pointer;padding:0 12px}
.animBar button:hover{border-color:var(--ind);color:var(--ind);background:var(--indL)}
.animBar button.abOn{background:var(--ind);border-color:var(--ind);color:var(--white)}
.abCount{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--ink3);
  letter-spacing:1px}
.animLabel{position:absolute;left:20px;top:248px;width:1360px;height:88px;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  background:var(--bg2);display:flex;align-items:center;padding:0 24px;
  font-family:var(--serif);font-size:19px;line-height:1.65;color:var(--ind)}
.animLabel::before{content:"步骤 · ";font-family:var(--sans);font-size:12px;
  letter-spacing:2px;color:var(--ora);font-weight:600;margin-right:14px;flex:none}
#figure .anode{transition:opacity .35s ease}
/* ---- 右侧页内讲稿开窗 ---- */
#sidePanel{position:absolute;right:0;top:0;height:100%;display:none;
  flex-direction:column;background:var(--white);border-left:1px solid var(--line);
  z-index:20;overflow:hidden}
.panelHead{padding:24px 28px 16px;border-bottom:1px solid var(--line);
  display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.panelTitle{font-family:var(--serif);font-size:24px;color:var(--ink);line-height:1.3}
.panelHint{margin-top:7px;font-size:12px;color:var(--ink3);letter-spacing:.4px}
.panelClose{background:none;border:1px solid var(--line);color:var(--ink2);
  width:30px;height:30px;font-size:17px;line-height:1;cursor:pointer;flex:none}
.panelClose:hover{background:var(--oraL);border-color:var(--ora);color:var(--ora)}
.panelBody{flex:1;overflow-y:auto;position:relative;padding:24px 28px 80px}
.panelBody::-webkit-scrollbar{width:8px}
.panelBody::-webkit-scrollbar-thumb{background:var(--line)}
.panelBody::-webkit-scrollbar-track{background:var(--bg)}
.npNum{font-family:var(--mono);font-size:12px;color:var(--ora);letter-spacing:2px}
.noteWrap h2{font-family:var(--serif);font-size:25px;line-height:1.45;
  color:var(--ink);margin:12px 0 10px;font-weight:600}
.npLead{font-size:14px;line-height:1.8;color:var(--ink2);padding-bottom:18px;
  border-bottom:1px solid var(--line)}
.npSec{margin:24px 0 10px;font-size:12px;letter-spacing:2.2px;color:var(--ind);
  font-weight:600}
.npBody{font-size:15.5px;line-height:2.05;color:var(--ink2);text-align:justify}
.npNext{font-family:var(--serif);font-size:16px;line-height:1.8;color:var(--ora);
  border-left:3px solid var(--ora);padding-left:14px}
.npCap{font-size:13px;line-height:1.8;color:var(--ink3)}
.scriptBlock{padding:16px 18px 18px;margin-bottom:14px;border:1px solid var(--line);
  border-left:3px solid transparent;background:var(--bg);cursor:pointer}
.scriptBlock:hover{border-color:var(--ind)}
.scriptBlock.cur{border-left-color:var(--ora);background:var(--oraL)}
.sbHead{font-family:var(--serif);font-size:18px;color:var(--ink);line-height:1.5}
.sbNo{font-family:var(--mono);font-size:12px;color:var(--ind);margin-right:12px;
  letter-spacing:1px}
.scriptBlock.cur .sbNo{color:var(--ora)}
.sbLead{margin-top:6px;font-size:12.5px;line-height:1.7;color:var(--ink3)}
.sbNote{margin-top:10px;font-size:14px;line-height:1.95;color:var(--ink2);
  text-align:justify}
.tocRow{display:flex;align-items:baseline;gap:14px;padding:11px 12px;
  border-bottom:1px solid var(--line);cursor:pointer;font-size:14px;color:var(--ink2)}
.tocRow:hover{background:var(--indL);color:var(--ind)}
.tocRow.cur{background:var(--oraL);color:var(--ora)}
.tocNo{font-family:var(--mono);font-size:12px;color:var(--ink3);min-width:26px}
.tocRow.cur .tocNo{color:var(--ora)}
.tocEyebrow{margin-left:auto;font-size:11px;color:var(--ink3);white-space:nowrap}
.helpRow{display:flex;gap:18px;align-items:baseline;padding:10px 0;
  border-bottom:1px solid var(--line);font-size:14px;color:var(--ink2)}
.helpKey{font-family:var(--mono);font-size:13px;color:var(--ind);min-width:112px;
  letter-spacing:.5px}
.helpNote{margin-top:20px;font-size:13px;line-height:1.9;color:var(--ink3);
  border-left:3px solid var(--gld);padding:12px 14px;background:var(--gldL)}
</style>
</head>
<body>
<div id="app">
  <div id="stageHost">
    <div id="stage">
      <div id="progress"></div>
      <div id="eyebrow"></div>
      <div id="title"></div>
      <div id="lead"></div>
      <div id="rule"></div>
      <div id="figure"></div>
      <div id="caption"></div>
      <div id="nextWrap">
        <div id="nextTag">承接 · NEXT</div>
        <div id="nextText"></div>
      </div>
      <div id="footer">
        <div id="keyhints">
          <button data-act="prev">← 上一页</button>
          <button data-act="next">→ 下一页</button>
          <button data-act="toc">G 目录</button>
          <button data-act="note">N 本页讲稿</button>
          <button data-act="all">T 全文讲稿</button>
          <button data-act="auto">P 自动播放</button>
          <button data-act="full">F 全屏</button>
          <button data-act="help">? 快捷键</button>
          <span class="khStatic">1–9 跳页 · 空格翻页 · Esc 关闭</span>
        </div>
        <div id="footRight"><span id="autoBadge"></span><span id="pageno"></span></div>
      </div>
      <div id="toast"></div>
    </div>
  </div>
  <aside id="sidePanel">
    <div class="panelHead">
      <div><div class="panelTitle" id="panelTitle"></div>
        <div class="panelHint" id="panelHint"></div></div>
      <button class="panelClose" data-act="close" title="关闭">×</button>
    </div>
    <div class="panelBody" id="panelBody"></div>
  </aside>
</div>
<script>
"use strict";
const PAGES = [{"eyebrow":"数据库筑基课 · 执行算法 / 01","title":"一行之差：从业务关联到笛卡尔积","lead":"同一句 SQL，少写一个 ON，语义就从「按 key 匹配」变成「所有组合」。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" preserveAspectRatio=\"xMidYMid meet\" role=\"img\" aria-label=\"讲稿示意图\"><defs><marker id=\"arI\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#245A6B\"/></marker><marker id=\"arO\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#BE653B\"/></marker><marker id=\"arG\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#2F7A66\"/></marker><marker id=\"arN\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#89938F\"/></marker></defs><text x=\"40.0\" y=\"26.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"211.1\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:13.00px;font-weight:600;fill:#245A6B;letter-spacing:2.20px\">意图：订单关联客户，再筛 CN 地区</text><text x=\"720.0\" y=\"26.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"125.8\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:13.00px;font-weight:600;fill:#BE653B;letter-spacing:2.20px\">实际：少写了一行 ON</text><rect x=\"40.0\" y=\"44.0\" width=\"620.0\" height=\"132.0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"58.0\" y=\"78.1\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"268.8\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'SF Mono',Menlo,Consolas,monospace;font-size:15.00px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">SELECT o.order_id, c.customer_id</text><text x=\"58.0\" y=\"99.4\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"109.2\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'SF Mono',Menlo,Consolas,monospace;font-size:15.00px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">FROM orders o</text><text x=\"58.0\" y=\"120.7\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"411.6\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'SF Mono',Menlo,Consolas,monospace;font-size:15.00px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">JOIN customers c ON c.customer_id = o.customer_id</text><text x=\"58.0\" y=\"142.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"184.8\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'SF Mono',Menlo,Consolas,monospace;font-size:15.00px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">WHERE c.region = &#x27;CN&#x27;;</text><rect x=\"720.0\" y=\"44.0\" width=\"620.0\" height=\"132.0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"738.0\" y=\"78.1\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"268.8\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'SF Mono',Menlo,Consolas,monospace;font-size:15.00px;font-weight:400;fill:#BE653B;letter-spacing:0.00px\">SELECT o.order_id, c.customer_id</text><text x=\"738.0\" y=\"99.4\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"109.2\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'SF Mono',Menlo,Consolas,monospace;font-size:15.00px;font-weight:400;fill:#BE653B;letter-spacing:0.00px\">FROM orders o</text><text x=\"738.0\" y=\"120.7\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"184.8\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'SF Mono',Menlo,Consolas,monospace;font-size:15.00px;font-weight:400;fill:#BE653B;letter-spacing:0.00px\">CROSS JOIN customers c</text><text x=\"738.0\" y=\"142.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"184.8\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'SF Mono',Menlo,Consolas,monospace;font-size:15.00px;font-weight:400;fill:#BE653B;letter-spacing:0.00px\">WHERE c.region = &#x27;CN&#x27;;</text><rect x=\"20.0\" y=\"190.0\" width=\"1360.0\" height=\"44.0\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\"/><text x=\"700.0\" y=\"212.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"280.8\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'SF Mono',Menlo,Consolas,monospace;font-size:11.27px;font-weight:600;fill:#BE653B;letter-spacing:0.00px\">差别只有一行：ON c.customer_id = o.customer_id</text><rect x=\"20.0\" y=\"248.0\" width=\"660.0\" height=\"84.0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"38.0\" y=\"278.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"240.7\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:16.90px;font-weight:400;fill:#2F7A66;letter-spacing:0.00px\">结果规模 = 匹配的订单-客户对</text><text x=\"38.0\" y=\"302.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"242.7\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:16.90px;font-weight:400;fill:#2F7A66;letter-spacing:0.00px\">业务语义在 JOIN 层就被限制住</text><rect x=\"720.0\" y=\"248.0\" width=\"660.0\" height=\"84.0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"738.0\" y=\"278.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"352.9\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:16.90px;font-weight:400;fill:#BE653B;letter-spacing:0.00px\">中间候选 = orders 行数 × customers 行数</text><text x=\"738.0\" y=\"302.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"344.1\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:16.90px;font-weight:400;fill:#BE653B;letter-spacing:0.00px\">WHERE 只决定最后留下多少，不决定生成多少</text><rect x=\"20.0\" y=\"348.0\" width=\"1360.0\" height=\"46.0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><rect x=\"20.0\" y=\"348.0\" width=\"4.0\" height=\"46.0\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"0.0\"/><text x=\"42.0\" y=\"371.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"534.4\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:16.00px;font-weight:400;fill:#46585F;letter-spacing:0.00px\">cross join 本身不是错误；错误是「业务意图」和「SQL 语义」对不上。</text></svg>","caption":"图 1：两段 SQL 只差一行 ON；差别不在结果，而在中间生成的候选规模。","nxt":"要判断这一行到底改变了什么，得先回到定义：cross join 只有一条规则。","note":"先别急着说 cross join 是坏东西。我们看一个最普通的线上场景：订单要关联客户，然后只保留 CN 地区的客户。正确的写法是 JOIN ... ON，把 customer_id 这个业务 key 明明白白写在 ON 里。可一旦有人把它写成了 CROSS JOIN，或者干脆用逗号把两张表并列、WHERE 里又忘了补关联条件，事情就变了。数据库不知道你的业务是什么，它只会忠实执行字面语义：orders 的每一行，都要和 customers 的每一行配成一对。于是中间候选集是 orders 行数乘以 customers 行数，WHERE c.region = CN 只能在这堆组合形成之后再决定谁留下。注意这里的关键：最终返回的行数，可能和正确写法完全一样，这恰恰是它最危险的地方——功能测试容易过，压测和上线才炸。所以这一页我想立的命题不是「不要用 cross join」，而是「意图和语义必须对齐」。顺着这个问法往下走，我们得先把 cross join 的定义讲死，才知道后面每一层机制为什么会这样表现。","anim":""},{"eyebrow":"数据库筑基课 · 执行算法 / 02","title":"定义只有一条：N 行 × M 行 = N × M 行","lead":"官方文档：对每个可能的行组合输出一行，列按 T1 全部列后跟 T2 全部列。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" preserveAspectRatio=\"xMidYMid meet\" role=\"img\" aria-label=\"讲稿示意图\"><defs><marker id=\"arI\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#245A6B\"/></marker><marker id=\ ,Menlo,Consolas,monospace;font-size:17.00px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">N = 3（colors）</text><rect x=\"1000.0\" y=\"130.0\" width=\"360.0\" height=\"60.0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"1180.0\" y=\"160.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"129.2\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'SF Mono',Menlo,Consolas,monospace;font-size:17.00px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">M = 4（sizes）</text><rect x=\"1000.0\" y=\"202.0\" width=\"360.0\" height=\"96.0\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\"/><text x=\"1180.0\" y=\"250.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"186.2\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'SF Mono',Menlo,Consolas,monospace;font-size:26.00px;font-weight:600;fill:#BE653B;letter-spacing:0.00px\">N × M = 12 行</text><text x=\"1000.0\" y=\"318.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"154.0\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:14.00px;font-weight:400;fill:#89938F;letter-spacing:0.00px\">没有「匹配失败」这一说</text><text x=\"1000.0\" y=\"340.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"220.1\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:14.00px;font-weight:400;fill:#89938F;letter-spacing:0.00px\">结果列 = T1 全部列 + T2 全部列</text><rect x=\"20.0\" y=\"364.0\" width=\"1360.0\" height=\"46.0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><rect x=\"20.0\" y=\"364.0\" width=\"4.0\" height=\"46.0\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"0.0\"/><text x=\"42.0\" y=\"387.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"499.8\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:16.00px;font-weight:400;fill:#245A6B;letter-spacing:0.00px\">输入规模只要稍大，乘积就会迅速膨胀 —— 所有成本都从这一步开始。</text></svg>","caption":"图 2：3 个颜色 × 4 个尺码 = 12 格；示意数据由本文设定，不是实测统计。","nxt":"既然定义是乘法，那几种写法之间到底有没有差别？下一页把三条路径并起来看。","note":"PostgreSQL 官方文档对 CROSS JOIN 的定义非常干脆：对 T1 和 T2 的每一个可能行组合，输出一行，这一行先放 T1 的全部列，再放 T2 的全部列；两表分别有 N 行和 M 行，结果就是 N 乘 M 行。图里我用 3 个颜色和 4 个尺码画成一张 12 格的网格，是想让你看见一个容易被忽略的事实——这里根本没有「匹配失败」这个概念。inner join 会有配对不上的行被丢掉，outer join 会给没配上的行补 NULL，cross join 两者都不做。每一个左行都必然和每一个右行相遇一次，一个不多，一个不少。所以结果行数不取决于数据内容，不取决于有没有索引，只取决于两个输入各有多少行。这就是后面所有优化讨论的起点：既然选择性为零，成本必然从乘法开始。","anim":""},{"eyebrow":"数据库筑基课 · 执行算法 / 03","title":"三种写法，同一个结果","lead":"CROSS JOIN ≡ INNER JOIN ON TRUE ≡ FROM T1, T2（两表场景）。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" preserveAspectRatio=\"xMidYMid meet\" role=\"img\" aria-label=\"讲稿示意图\"><defs><marker id=\"arI\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#245A6B\"/></marker><marker id=\"arO\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#BE653B\"/></marker><marker id=\"arG\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#2F7A66\"/></marker><marker id=\"arN\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#89938F\"/></marker></defs><text x=\"40.0\" y=\"32.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"161.2\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:13.00px;font-weight:600;fill:#245A6B;letter-spacing:2.20px\">写法 ①  显式 CROSS JOIN</text><rect x=\"40.0\" y=\"44.0\" width=\"700.0\" height=\"62.0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"58.0\" y=\"75.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"211.7\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'SF Mono',Menlo,Consolas,monospace;font-size:18.00px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">FROM T1 CROSS JOIN T2</text><line x1=\"740.0\" y1=\"75.0\" x2=\"780.0\" y2=\"75.0\" stroke=\"#245A6B\" stroke-width=\"1.5\" fill=\"none\"/><text x=\"40.0\" y=\"132.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"186.2\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:13.00px;font-weight:600;fill:#245A6B;letter-spacing:2.20px\">写法 ②  INNER JOIN ON TRUE</text><rect x=\"40.0\" y=\"144.0\" width=\"700.0\" height=\"62.0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"58.0\" y=\"175.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"292.3\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'SF Mono',Menlo,Consolas,monospace;font-size:18.00px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">FROM T1 INNER JOIN T2 ON TRUE</text><line x1=\"740.0\" y1=\"175.0\" x2=\"780.0\" y2=\"175.0\" stroke=\"#245A6B\" stroke-width=\"1.5\" fill=\"none\"/><text x=\"40.0\" y=\"232.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"150.8\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:13.00px;font-weight:600;fill:#245A6B;letter-spacing:2.20px\">写法 ③  顶层 FROM 列表</text><rect x=\"40.0\" y=\"244.0\" width=\"700.0\" height=\"62.0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"58.0\" y=\"275.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"110.9\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'SF Mono',Menlo,Consolas,monospace;font-size:18.00px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">FROM T1, T2</text><line x1=\"740.0\" y1=\"275.0\" x2=\"780.0\" y2=\"275.0\" stroke=\"#245A6B\" stroke-width=\"1.5\" fill=\"none\"/><line x1=\"780.0\" y1=\"75.0\" x2=\"780.0\" y2=\"275.0\" stroke=\"#245A6B\" stroke-width=\"1.5\" fill=\"none\"/><line x1=\"780.0\" y1=\"175.0\" x2=\"820.0\" y2=\"175.0\" stroke=\"#245A6B\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#arI)\"/><rect x=\"820.0\" y=\"130.0\" width=\"280.0\" height=\"90.0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"960.0\" y=\"162.9\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"85.0\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:17.00px;font-weight:400;fill:#245A6B;letter-spacing:0.00px\">同一个语义</text><text x=\"960.0\" y=\"187.1\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"205.4\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:17.00px;font-weight:400;fill:#245A6B;letter-spacing:0.00px\">无 quals 的 INNER JOIN</text><line x1=\"1100.0\" y1=\"175.0\" x2=\"1140.0\" y2=\"175.0\" stroke=\"#245A6B\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#arI)\"/><rect x=\"1140.0\" y=\"130.0\" width=\"240.0\" height=\"90.0\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\"/><text x=\"1260.0\" y=\"175.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"95.9\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'SF Mono',Menlo,Consolas,monospace;font-size:22.00px;font-weight:600;fill:#BE653B;letter-spacing:0.00px\">N × M 行</text><rect x=\"20.0\" y=\"348.0\" width=\"1360.0\" height=\"46.0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><rect x=\"20.0\" y=\"348.0\" width=\"4.0\" height=\"46.0\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"0.0\"/><text x=\"42.0\" y=\"371.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"626.6\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:16.00px;font-weight:400;fill:#2F7A66;letter-spacing:0.00px\">三条路径在优化器眼里是同一件事；CROSS JOIN 的价值不在语义，而在「意图显式」。</text></svg>","caption":"图 3：三条 SQL 路径汇入同一个「无 quals 的 INNER JOIN」语义。","nxt":"但等价是有边界的：一旦出现第三张表，逗号和显式 JOIN 就不再等价。","note":"官方文档紧接着给了两条等价关系：FROM T1 CROSS JOIN T2 等价于 FROM T1 INNER JOIN T2 ON TRUE，也等价于 FROM T1, T2。这句话很重要，因为它把 cross join 从「一种特殊语法」拉回到「inner join 的一个特例」——条件恒为真，等于没有条件。三条路径在优化器眼里最终是同一件事：一个没有 quals 的 inner join，输出 N 乘 M 行。那为什么还要有 CROSS JOIN 这个关键字？因为意图。ON TRUE 要读者自己反应一下「哦，恒真，那就是笛卡尔积」；逗号写法更容易被当成漏了条件；而 CROSS JOIN 直接把「我就是要所有组合」写在脸上，代码审查时一眼能看出来。这是它唯一的、但相当实在的价值。接下来我们要拆掉一个常见的误解：等价关系不是无条件的。","anim":""},{"eyebrow":"数据库筑基课 · 执行算法 / 04","title":"三表以上，等价关系就断了","lead":"JOIN 绑定比逗号更紧，ON 能引用哪些表随之改变。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" preserveAspectRatio=\"xMidYMid meet\" role=\"img\" aria-label=\"讲稿示意图\"><defs><marker id=\"arI\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#245A6B\"/></marker><marker id=\"arO\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#BE653B\"/></marker><marker id=\"arG\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#2F7A66\"/></marker><marker id=\"arN\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#89938F\"/></marker></defs><text x=\"40.0\" y=\"28.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"97.2\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:13.00px;font-weight:600;fill:#245A6B;letter-spacing:2.20px\">① 显式 JOIN 链</text><text x=\"720.0\" y=\"28.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"149.2\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:13.00px;font-weight:600;fill:#BE653B;letter-spacing:2.20px\">② 逗号与显式 JOIN 混用</text><rect x=\"40.0\" y=\"44.0\" width=\"640.0\" height=\"78.0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"58.0\" y=\"72.5\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"173.9\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'SF Mono',Menlo,Consolas,monospace;font-size:14.79px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">FROM T1 CROSS JOIN T2</text><text x=\"58.0\" y=\"93.5\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"256.7\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'SF Mono',Menlo,Consolas,monospace;font-size:14.79px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">     INNER JOIN T3 ON condition</text><rect x=\"720.0\" y=\"44.0\" width=\"640.0\" height=\"78.0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"738.0\" y=\"72.5\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"207.0\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'SF Mono',Menlo,Consolas,monospace;font-size:14.79px;font-weight:400;fill:#BE653B;letter-spacing:0.00px\">FROM T1, T2 INNER JOIN T3</text><text x=\"738.0\" y=\"93.5\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"231.9\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'SF Mono',Menlo,Consolas,monospace;font-size:14.79px;font-weight:400;fill:#BE653B;letter-spacing:0.00px\">                ON condition</text><rect x=\"40.0\" y=\"136.0\" width=\"640.0\" height=\"62.0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"360.0\" y=\"167.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"259.2\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'SF Mono',Menlo,Consolas,monospace;font-size:20.00px;font-weight:600;fill:#245A6B;letter-spacing:0.00px\">括号化：((T1 × T2) ⋈ T3)</text><rect x=\"720.0\" y=\"136.0\" width=\"640.0\" height=\"62.0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"1040.0\" y=\"167.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"259.2\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'SF Mono',Menlo,Consolas,monospace;font-size:20.00px;font-weight:600;fill:#BE653B;letter-spacing:0.00px\">括号化：(T1 × (T2 ⋈ T3))</text><rect x=\"40.0\" y=\"212.0\" width=\"640.0\" height=\"88.0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"58.0\" y=\"243.9\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"125.1\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:17.00px;font-weight:400;fill:#2F7A66;letter-spacing:0.00px\">ON 可以引用 T1</text><text x=\"58.0\" y=\"268.1\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"299.2\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:17.00px;font-weight:400;fill:#2F7A66;letter-spacing:0.00px\">因为 T1 已经在本次 JOIN 的左输入里</text><rect x=\"720.0\" y=\"212.0\" width=\"640.0\" height=\"88.0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"738.0\" y=\"243.9\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"210.1\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:17.00px;font-weight:400;fill:#BE653B;letter-spacing:0.00px\">ON 不能以同样方式引用 T1</text><text x=\"738.0\" y=\"268.1\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"212.8\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:17.00px;font-weight:400;fill:#BE653B;letter-spacing:0.00px\">t2 INNER JOIN t3 先绑定</text><text x=\"40.0\" y=\"324.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"294.6\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:14.00px;font-weight:400;fill:#89938F;letter-spacing:0.00px\">JOIN 比逗号绑定更紧 —— 官方文档给出的原例</text><text x=\"720.0\" y=\"324.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"247.5\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:14.00px;font-weight:400;fill:#89938F;letter-spacing:0.00px\">混用时，ON 能看见的表范围和直觉不同</text><rect x=\"20.0\" y=\"348.0\" width=\"1360.0\" height=\"46.0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><rect x=\"20.0\" y=\"348.0\" width=\"4.0\" height=\"46.0\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"0.0\"/><text x=\"42.0\" y=\"371.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"441.6\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:16.00px;font-weight:400;fill:#2F7A66;letter-spacing:0.00px\">生产 SQL 统一显式 JOIN，把可引用范围和连接意图写清楚。</text></svg>","caption":"图 4：同一串表，两种括号化顺序；ON 的作用域随绑定顺序变化。","nxt":"语法层说完了，我们把镜头推进到 PostgreSQL 内部，看它到底怎么表示这件事。","note":"官方文档在给出等价关系后专门加了一条 Note：超过两张表时，这个等价不再严格成立，因为 JOIN 比逗号绑定得更紧。原文的例子是，FROM T1 CROSS JOIN T2 INNER JOIN T3 ON condition，和 FROM T1, T2 INNER JOIN T3 ON condition 不是一回事——前者的 condition 可以引用 T1，后者不行。原因就在括号化：前者是 ((T1 × T2) ⋈ T3)，T1 已经在本次 JOIN 的左输入里；后者是 (T1 × (T2 ⋈ T3))，t2 和 t3 先绑成一个整体，ON 的可见范围被关在了里面。这不是抠语法细节，生产里混用逗号和显式 JOIN，很容易出现「我明明写了条件，怎么引用不到」或者「怎么先做了笛卡尔积」。所以结论很朴素：统一用显式 JOIN，把连接顺序和引用范围写清楚。到这儿，SQL 层面的四件事——定义、等价、边界、意图——就齐了。下面进到引擎里。","anim":""},{"eyebrow":"数据库筑基课 · 执行算法 / 05","title":"cross join 在 PostgreSQL 内部走过七层","lead":"从 SQL 文本到执行器，它始终不是一种独立的物理算法。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" preserveAspectRatio=\"xMidYMid meet\" role=\"img\" aria-label=\"讲稿示意图\"><defs><marker id=\"arI\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#245A6B\"/></marker><marker id=\"arO\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#BE653B\"/></marker><marker id=\"arG\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#2F7A66\"/></marker><marker id=\"arN\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#89938F\"/></marker></defs><text x=\"20.0\" y=\"12.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"279.2\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:13.00px;font-weight:600;fill:#245A6B;letter-spacing:2.20px\">地层剖面 · 从 SQL 文本到执行器，越深越底层</text><rect x=\"20.0\" y=\"24.0\" width=\"1360.0\" height=\"46.0\" fill=\"#1E4B5A\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"34.0\" y=\"47.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"14.6\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'SF Mono',Menlo,Consolas,monospace;font-size:13.00px;font-weight:600;fill:#FFFFFF;letter-spacing:0.00px\">L1</text><text x=\"90.0\" y=\"47.0\" text-anchor=\"start\" d ke-width=\"1.0\"/><text x=\"752.0\" y=\"256.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"245.4\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:15.00px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">有条件的 join 还取决于连接选择率</text><rect x=\"30.0\" y=\"292.0\" width=\"90.0\" height=\"72.0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"75.0\" y=\"328.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"8.4\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:15.00px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">④</text><rect x=\"120.0\" y=\"292.0\" width=\"620.0\" height=\"72.0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"132.0\" y=\"328.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"245.4\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:15.00px;font-weight:400;fill:#BE653B;letter-spacing:0.00px\">WHERE 只是对已形成的组合继续过滤</text><rect x=\"740.0\" y=\"292.0\" width=\"630.0\" height=\"72.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"752.0\" y=\"328.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"291.0\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:15.00px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">join condition 在形成组合时就限制规模</text><rect x=\"20.0\" y=\"370.0\" width=\"1360.0\" height=\"44.0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><rect x=\"20.0\" y=\"370.0\" width=\"4.0\" height=\"44.0\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"0.0\"/><text x=\"42.0\" y=\"392.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"473.6\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:16.00px;font-weight:400;fill:#BE653B;letter-spacing:0.00px\">第 ④ 条是事故根源：过滤写在 WHERE 里时，组合已经生成完了。</text></svg>","caption":"图 7：四条语义后果；第 ④ 条是「过滤写晚」这一类事故的根源。","nxt":"既然优化器手里没有条件，它会不会干脆拒绝执行？不会，但它会尽量把无条件连接往后推。","note":"把「没有 quals」翻译成人话，是四条很具体的后果。第一，不会因为 key 不相等而删行——inner join 靠 ON 筛掉不匹配的行对，cross join 不筛。第二，不补 NULL——outer join 会给未匹配行做 NULL 扩展，cross join 完全没有这个分支。第三，结果只取决于左右输入行数，有条件的 join 还要额外乘上连接选择率。第四，也是最要命的一条：WHERE 只是对「已经形成的组合」继续过滤，而 join condition 是在形成组合的过程中就限制规模。很多人以为 WHERE 写在哪儿都一样，优化器会帮忙提前——对能下推到单表扫描的限制，它确实会；但对必须跨两张表才能判断的条件，组合已经生成了。这四条合起来，就解释了为什么 cross join 的事故总是表现为「内存、CPU、排序、网络一起被拖垮」，而不是「结果算错了」。","anim":""},{"eyebrow":"数据库筑基课 · 执行算法 / 08","title":"优化器不是不知道危险，它把无条件 join 推迟","lead":"README 原文：有可用 join clause 才考虑成对连接；没有就只能做笛卡尔积。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" preserveAspectRatio=\"xMidYMid meet\" role=\"img\" aria-label=\"讲稿示意图\"><defs><marker id=\"arI\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#245A6B\"/></marker><marker id=\"arO\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#BE653B\"/></marker><marker id=\"arG\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#2F7A66\"/></marker><marker id=\"arN\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#89938F\"/></marker></defs><rect x=\"40.0\" y=\"30.0\" width=\"300.0\" height=\"70.0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"190.0\" y=\"65.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"193.2\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'SF Mono',Menlo,Consolas,monospace;font-size:15.00px;font-weight:600;fill:#1B2B33;letter-spacing:0.00px\">join_search_one_level()</text><line x1=\"340.0\" y1=\"65.0\" x2=\"390.0\" y2=\"65.0\" stroke=\"#245A6B\" stroke-width=\"1.5\" fill=\"none\"/><line x1=\"390.0\" y1=\"65.0\" x2=\"390.0\" y2=\"280.0\" stroke=\"#245A6B\" stroke-width=\"1.5\" fill=\"none\"/><line x1=\"390.0\" y1=\"160.0\" x2=\"430.0\" y2=\"160.0\" stroke=\"#245A6B\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#arI)\"/><rect x=\"430.0\" y=\"120.0\" width=\"270.0\" height=\"80.0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"565.0\" y=\"160.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"165.2\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:17.00px;font-weight:600;fill:#2F7A66;letter-spacing:0.00px\">有可用 join clause</text><line x1=\"700.0\" y1=\"160.0\" x2=\"730.0\" y2=\"160.0\" stroke=\"#245A6B\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#arI)\"/><rect x=\"730.0\" y=\"120.0\" width=\"310.0\" height=\"80.0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"885.0\" y=\"160.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"211.7\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'SF Mono',Menlo,Consolas,monospace;font-size:14.00px;font-weight:400;fill:#46585F;letter-spacing:0.00px\">make_rels_by_clause_joins()</text><line x1=\"1040.0\" y1=\"160.0\" x2=\"1070.0\" y2=\"160.0\" stroke=\"#245A6B\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#arI)\"/><rect x=\"1070.0\" y=\"120.0\" width=\"290.0\" height=\"80.0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"1215.0\" y=\"160.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"229.1\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:16.00px;font-weight:400;fill:#2F7A66;letter-spacing:0.00px\">Nested / Hash / Merge 候选</text><line x1=\"390.0\" y1=\"280.0\" x2=\"430.0\" y2=\"280.0\" stroke=\"#245A6B\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#arI)\"/><rect x=\"430.0\" y=\"240.0\" width=\"270.0\" height=\"80.0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"565.0\" y=\"280.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"148.2\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:17.00px;font-weight:600;fill:#BE653B;letter-spacing:0.00px\">没有 join clause</text><line x1=\"700.0\" y1=\"280.0\" x2=\"730.0\" y2=\"280.0\" stroke=\"#245A6B\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#arI)\"/><rect x=\"730.0\" y=\"240.0\" width=\"310.0\" height=\"80.0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"885.0\" y=\"270.1\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"101.9\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'SF Mono',Menlo,Consolas,monospace;font-size:14.00px;font-weight:400;fill:#46585F;letter-spacing:0.00px\">make_rels_by_</text><text x=\"885.0\" y=\"289.9\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"141.1\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'SF Mono',Menlo,Consolas,monospace;font-size:14.00px;font-weight:400;fill:#46585F;letter-spacing:0.00px\">clauseless_joins()</text><line x1=\"1040.0\" y1=\"280.0\" x2=\"1070.0\" y2=\"280.0\" stroke=\"#245A6B\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#arI)\"/><rect x=\"1070.0\" y=\"240.0\" width=\"290.0\" height=\"80.0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"1215.0\" y=\"280.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"176.0\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:16.00px;font-weight:400;fill:#BE653B;letter-spacing:0.00px\">笛卡尔积候选（被推迟）</text><rect x=\"20.0\" y=\"336.0\" width=\"1360.0\" height=\"46.0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><rect x=\"20.0\" y=\"336.0\" width=\"4.0\" height=\"46.0\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"0.0\"/><text x=\"42.0\" y=\"359.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"698.2\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:16.00px;font-weight:400;fill:#245A6B;letter-spacing:0.00px\">优化器 README：优先用有条件的连接降低规模；实在没有条件，才生成 clauseless 笛卡尔积。</text></svg>","caption":"图 8：join_search_one_level() 的两条分支，有条件的连接优先。","nxt":"理解了「推迟」，下一页就能回答那个高频疑问：EXPLAIN 里为什么没有 Cross Join 节点。","note":"src/backend/optimizer/README 有一段几乎是替我们写好的说明：Consider joining each RelOptInfo to each other RelOptInfo for which there is a usable joinclause；如果某个 RelOptInfo 没有 join clauses，we have no choice but to generate a clauseless Cartesian-product join。README 后面的流程摘要也写清楚了：standard_join_search() 调用 join_search_one_level()，对每个上一层 joinrel，有 join clauses 就 make_rels_by_clause_joins()，没有就 make_rels_by_clauseless_joins()。joinrels.c 里的注释还补了一句：clauseless bushy joins are put off as long as possible，也就是尽量往后拖。这个设计很合理——先做有条件的连接把规模压下来，实在没条件了再承认必须做笛卡尔积。但请分清楚「推迟」和「消除」：如果 SQL 语义就是无条件组合，或者外连接、IN/EXISTS 的 join order 限制迫使必须先做一次 clauseless join，优化器只能在这些路径里挑相对便宜的，它不能凭空发明一个业务条件出来。","anim":""},{"eyebrow":"数据库筑基课 · 执行算法 / 09","title":"EXPLAIN 里找不到一个叫 Cross Join 的节点","lead":"cross join 是逻辑语义，物理算子由成本与可用路径决定。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" preserveAspectRatio=\"xMidYMid meet\" role=\"img\" aria-label=\"讲稿示意图\"><defs><marker id=\"arI\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" ne=\"middle\" textLength=\"246.4\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:16.00px;font-weight:400;fill:#BE653B;letter-spacing:0.00px\">不可用：无 mergejoinable 条件</text><rect x=\"960.0\" y=\"298.0\" width=\"400.0\" height=\"50.0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"1160.0\" y=\"323.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"206.1\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:14.00px;font-weight:400;fill:#46585F;letter-spacing:0.00px\">出现 Merge Cond 才说明有条件</text><rect x=\"20.0\" y=\"360.0\" width=\"1360.0\" height=\"46.0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><rect x=\"20.0\" y=\"360.0\" width=\"4.0\" height=\"46.0\" fill=\"#AE8A3E\" stroke=\"#AE8A3E\" stroke-width=\"0.0\"/><text x=\"42.0\" y=\"383.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"752.6\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:16.00px;font-weight:400;fill:#AE8A3E;letter-spacing:0.00px\">看到 Nested Loop 不等于普通 key join：先查有没有 Join Filter / Hash Cond / Merge Cond。</text></svg>","caption":"图 9：逻辑层一个语义，落到物理层的 Nested Loop / Hash / Merge 三种可能。","nxt":"既然物理落点基本锁定了 Nested Loop，成本模型是怎么给这个落点定价的？","note":"把上一页的结论再往下推一步，就得到一个很实用的判断：cross join 是逻辑层的语义，EXPLAIN 显示的是物理层的算子，两者不在一个层面。物理层有三种常见的 join 实现：Nested Loop、Hash Join、Merge Join。后两者需要可用的连接条件——Hash Join 要 hashable 的 Hash Cond，Merge Join 要 mergejoinable 的 Merge Cond；clauseless join 一个都给不出来，所以路径生成阶段根本不会为它们生成候选。剩下 Nested Loop：外侧读一行，内侧扫一遍，不需要任何 key，天然适配「所有组合」。小表在内侧还常常被 Materialize 缓存，避免反复真实扫描。所以你会看到 Nested Loop 下面挂 Seq Scan 和 Materialize，这不是执行器算错了，是无条件语义的自然数据流。反过来，这也给 DBA 一个非常具体的排查动作：看到巨大的 Nested Loop，不要默认它是普通 key join，先去找有没有 Join Filter、Hash Cond、Merge Cond；一个都没有，就该怀疑漏条件了。","anim":""},{"eyebrow":"数据库筑基课 · 执行算法 / 10","title":"代价写在源码里：先乘，再乘选择率","lead":"costsize.c：nrows = outer_rows * inner_rows * fkselec * jselec。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" preserveAspectRatio=\"xMidYMid meet\" role=\"img\" aria-label=\"讲稿示意图\"><defs><marker id=\"arI\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#245A6B\"/></marker><marker id=\"arO\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#BE653B\"/></marker><marker id=\"arG\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#2F7A66\"/></marker><marker id=\"arN\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#89938F\"/></marker></defs><rect x=\"40.0\" y=\"28.0\" width=\"820.0\" height=\"76.0\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.0\"/><text x=\"450.0\" y=\"66.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"616.0\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'SF Mono',Menlo,Consolas,monospace;font-size:22.00px;font-weight:600;fill:#FFFFFF;letter-spacing:0.00px\">nrows = outer_rows * inner_rows * fkselec * jselec</text><rect x=\"40.0\" y=\"118.0\" width=\"195.0\" height=\"72.0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"137.5\" y=\"144.1\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"78.4\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:14.00px;font-weight:400;fill:#245A6B;letter-spacing:0.00px\">outer_rows</text><text x=\"137.5\" y=\"163.9\" text-anchor=\"m 子里，fkselec 来自外键匹配的 join 条件，jselec 来自本层的 join quals。cross join 一条 join qual 都没有，这两个选择率都取 1.0，于是估算基线干干净净地退化成 outer_rows 乘 inner_rows。原文给的例子是 1,000 行和 10,000 行，乘出来 1,000 万个候选组合——我特意在图里标注这是示意设定，不是实测性能数据，本文没有在本机启动 PostgreSQL，也不会编造耗时。这里想让你记住的是因果：乘法放大不是优化器的缺陷，也不是估算不准，它是语义本身。估算误差只会在这个乘法上再放大一层。","anim":""},{"eyebrow":"数据库筑基课 · 执行算法 / 11","title":"过滤写晚：候选集先爆炸，再被丢掉","lead":"中间规模由乘法决定，WHERE 只能决定最后留下多少。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" preserveAspectRatio=\"xMidYMid meet\" role=\"img\" aria-label=\"讲稿示意图\"><defs><marker id=\"arI\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#245A6B\"/></marker><marker id=\"arO\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#BE653B\"/></marker><marker id=\"arG\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#2F7A66\"/></marker><marker id=\"arN\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#89938F\"/></marker></defs><text x=\"20.0\" y=\"22.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"144.6\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:13.00px;font-weight:600;fill:#BE653B;letter-spacing:2.20px\">① 先组合后过滤（危险）</text><text x=\"20.0\" y=\"142.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"131.6\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:13.00px;font-weight:600;fill:#2F7A66;letter-spacing:2.20px\">② 先过滤输入（推荐）</text><g id=\"p11-a1\" class=\"a lass=\"anode\"><rect x=\"320.0\" y=\"158.0\" width=\"280.0\" height=\"74.0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"460.0\" y=\"183.6\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"49.9\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:16.00px;font-weight:400;fill:#2F7A66;letter-spacing:0.00px\">输入 B</text><text x=\"460.0\" y=\"206.4\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"80.0\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:16.00px;font-weight:400;fill:#2F7A66;letter-spacing:0.00px\">先下推限制</text></g><g id=\"p11-b3\" class=\"anode\"><rect x=\"620.0\" y=\"158.0\" width=\"280.0\" height=\"74.0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"760.0\" y=\"183.6\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"98.6\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:16.00px;font-weight:400;fill:#2F7A66;letter-spacing:0.00px\">JOIN ... ON</text><text x=\"760.0\" y=\"206.4\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"171.5\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:16.00px;font-weight:400;fill:#2F7A66;letter-spacing:0.00px\">或 CROSS JOIN 小输入</text></g><g id=\"p11-b4\" class=\"anode\"><rect x=\"920.0\" y=\"158.0\" width=\"440.0\" height=\"74.0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"1140.0\" y=\"183.6\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"32.0\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:16.00px;font-weight:400;fill:#2F7A66;letter-spacing:0.00px\">结果</text><text x=\"1140.0\" y=\"206.4\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"128.0\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:16.00px;font-weight:400;fill:#2F7A66;letter-spacing:0.00px\">中间规模显著变小</text></g><line x1=\"300.0\" y1=\"75.0\" x2=\"320.0\" y2=\"75.0\" stroke=\"#BE653B\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#arI)\"/><line x1=\"300.0\" y1=\"195.0\" x2=\"320.0\" y2=\"195.0\" stroke=\"#2F7A66\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#arG)\"/><line x1=\"600.0\" y1=\"75.0\" x2=\"620.0\" y2=\"75.0\" stroke=\"#BE653B\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#arI)\"/><line x1=\"600.0\" y1=\"195.0\" x2=\"620.0\" y2=\"195.0\" stroke=\"#2F7A66\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#arG)\"/><line x1=\"900.0\" y1=\"75.0\" x2=\"920.0\" y2=\"75.0\" stroke=\"#BE653B\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#arI)\"/><line x1=\"900.0\" y1=\"195.0\" x2=\"920.0\" y2=\"195.0\" stroke=\"#2F7A66\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#arG)\"/></svg><div class=\"animLabel\" id=\"p11-label\">准备就绪：按「播放」或「单步」，观察候选规模在哪里被放大。</div>","caption":"图 11：上下两条流水线的行数对比；可用下拉框选择观察范围，逐步播放。","nxt":"知道了「生成多少」，再看执行器具体怎么把这 1,000 万行一行一行吐出来。","note":"这一页请用页面上的输入和播放按钮跟着走一遍。上面那条是危险的写法：读 A 的 1,000 行、读 B 的 10,000 行，CROSS JOIN 一步就生成 1,000 万个候选行，然后 WHERE 才在这堆行上做过滤。EXPLAIN ANALYZE 里如果出现很大的 Rows Removed by Filter，通常就是在告诉你「过滤来得太晚了」。下面那条是推荐的形状：能下推到单表的限制，先放到输入子查询里，让 A 和 B 各自变小，再组合；如果本来就有业务 key，就干脆写成 JOIN ... ON，从源头把选择性用起来。两条流水线最终返回的行数可以完全一样，但中间候选规模、CPU、内存、后续排序和聚合的成本完全不同。所以我一直强调一个判断口径：评估 cross join 时别只问「最后返回几行」，要问「中间生成了几行」。这个差别，光看结果集是看不出来的。","anim":"p11"},{"eyebrow":"数据库筑基课 · 执行算法 / 12","title":"Nested Loop：外侧一行，内侧重放一遍","lead":"9 个组合不是一次算出来的，是 3 次外侧读取 × 3 次内侧扫描。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1400 430\" width=\"1400  stroke=\"#245A6B\" stroke-width=\"1.2\" fill=\"none\"/><line x1=\"200.0\" y1=\"121.0\" x2=\"225.0\" y2=\"121.0\" stroke=\"#245A6B\" stroke-width=\"1.2\" fill=\"none\"/><line x1=\"200.0\" y1=\"185.0\" x2=\"225.0\" y2=\"185.0\" stroke=\"#245A6B\" stroke-width=\"1.2\" fill=\"none\"/><line x1=\"225.0\" y1=\"57.0\" x2=\"225.0\" y2=\"185.0\" stroke=\"#245A6B\" stroke-width=\"1.2\" fill=\"none\"/><line x1=\"225.0\" y1=\"121.0\" x2=\"250.0\" y2=\"121.0\" stroke=\"#245A6B\" stroke-width=\"1.2\" fill=\"none\" marker-end=\"url(#arI)\"/><line x1=\"430.0\" y1=\"121.0\" x2=\"465.0\" y2=\"121.0\" stroke=\"#2F7A66\" stroke-width=\"1.2\" fill=\"none\"/><line x1=\"465.0\" y1=\"57.0\" x2=\"465.0\" y2=\"185.0\" stroke=\"#2F7A66\" stroke-width=\"1.2\" fill=\"none\"/><line x1=\"465.0\" y1=\"57.0\" x2=\"500.0\" y2=\"57.0\" stroke=\"#2F7A66\" stroke-width=\"1.2\" fill=\"none\" marker-end=\"url(#arG)\"/><line x1=\"465.0\" y1=\"121.0\" x2=\"500.0\" y2=\"121.0\" stroke=\"#2F7A66\" stroke-width=\"1.2\" fill=\"none\" marker-end=\"url(#arG)\"/><line x1=\"465.0\" y1=\"185.0\" x2=\"500.0\" y2=\"185.0\" stroke=\"#2F7A66\" stroke-width=\"1.2\" fill=\"none\" marker-end=\"url(#arG)\"/><text x=\"20.0\" y=\"228.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"301.9\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:12.00px;font-weight:400;fill:#89938F;letter-spacing:0.00px\">Materialize：内侧小表可能被缓存，避免重复真实扫描</text></svg><div class=\"animLabel\" id=\"p12-label\">准备就绪：选择要观察的外侧行，按「播放」看内侧重放与输出。</div>","caption":"图 12：选择外侧行后逐步播放，看内侧重放如何产生 3 个组合。","nxt":"动画看完了，我们把这个「几乎总是 Nested Loop」的结论再钉死一次。","note":"这页也请动手播一下。左侧是 colors 的三行，右侧是 sizes 的三行，中间那一列代表内侧扫描被重放。Nested Loop 的执行方式非常朴素：外侧取到 red，内侧从 S 到 L 走一遍，输出 red·S、red·M、red·L；外侧换到 green，内侧再从 S 到 L 走一遍；blue 同理。三次外侧读取，每次内侧三行，总共九个组合，全程没有任何一次「判断 key 是否相等」。内侧这张小表如果每次都真实扫描就太浪费了，所以 PostgreSQL 常在中间加一个 Materialize 把结果缓存下来——这就是 EXPLAIN 里 Materialize 的来历。我特意用 3 乘 3 这种能手算的规模，是想让你把「乘法」从公式还原成具体的数据流：N 乘 M 不是一个抽象数字，它就是这么一行一行累加出来的。规模换到 1,000 乘 10,000，动作一模一样，只是次数变成了 1,000 万。","anim":"p12"},{"eyebrow":"数据库筑基课 · 执行算法 / 13","title":"没有 join key，Hash 和 Merge 就无从下手","lead":"三种物理 join 都要求可用的连接条件，缺了它只剩嵌套循环。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" preserveAspectRatio=\"xMidYMid meet\" role=\"img\" aria-label=\"讲稿示意图\"><defs><marker id=\"arI\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#245A6B\"/></marker><marker id=\"arO\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#BE653B\"/></marker><marker id=\"arG\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#2F7A66\"/></marker><marker id=\"arN\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#89938F\"/></marker></defs><rect x=\"20.0\" y=\"30.0\" width=\"220.0\" height=\"48.0\" fill=\"#245A6B\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"130.0\" y=\"54.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"60.0\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:15.00px;font-weight:600;fill:#FFFFFF;letter-spacing:0.00px\">物理算子</text><rect x=\"240.0\" y=\"30.0\" width=\"430.0\" height=\"48.0\" fill=\"#245A6B\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"252.0\" y=\"54.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"105.0\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:15.00px;font-weight:600;fill:#FFFFFF rt\" dominant-baseline=\"middle\" textLength=\"165.0\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:15.00px;font-weight:400;fill:#2F7A66;letter-spacing:0.00px\">可用（几乎是唯一选择）</text><rect x=\"1030.0\" y=\"78.0\" width=\"350.0\" height=\"86.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"1042.0\" y=\"121.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"223.2\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:15.00px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">Nested Loop，无 Join Filter</text><rect x=\"20.0\" y=\"164.0\" width=\"220.0\" height=\"86.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"130.0\" y=\"207.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"75.6\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:15.00px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">Hash Join</text><rect x=\"240.0\" y=\"164.0\" width=\"430.0\" height=\"86.0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"252.0\" y=\"207.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"234.0\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:15.00px;font-weight:400;fill:#BE653B;letter-spacing:0.00px\">需要可哈希的等值条件 Hash Cond</text><rect x=\"670.0\" y=\"164.0\" width=\"360.0\" height=\"86.0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"682.0\" y=\"207.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"189.0\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:15.00px;font-weight:400;fill:#BE653B;letter-spacing:0.00px\">不可用：无 hashable 条件</text><rect x=\"1030.0\" y=\"164.0\" width=\"350.0\" height=\"86.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"1042.0\" y=\"207.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"212.4\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:15.00px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">若出现 Hash Cond 说明有条件</text><rect x=\"20.0\" y=\"250.0\" width=\"220.0\" height=\"86.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"130.0\" y=\"293.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"84.0\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:15.00px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">Merge Join</text><rect x=\"240.0\" y=\"250.0\" width=\"430.0\" height=\"86.0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"252.0\" y=\"293.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"212.4\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:15.00px;font-weight:400;fill:#BE653B;letter-spacing:0.00px\">需要可排序合并的 Merge Cond</text><rect x=\"670.0\" y=\"250.0\" width=\"360.0\" height=\"86.0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"682.0\" y=\"293.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"231.0\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:15.00px;font-weight:400;fill:#BE653B;letter-spacing:0.00px\">不可用：无 mergejoinable 条件</text><rect x=\"1030.0\" y=\"250.0\" width=\"350.0\" height=\"86.0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" \" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:15.00px;font-weight:400;fill:#BE653B;letter-spacing:0.00px\">对比估算 rows 与实际 rows；输入估错，乘法后偏差更大</text><rect x=\"40.0\" y=\"120.0\" width=\"620.0\" height=\"68.0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"52.0\" y=\"144.1\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"141.1\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'SF Mono',Menlo,Consolas,monospace;font-size:14.00px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">②   -&gt; Materialize</text><text x=\"52.0\" y=\"163.9\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"211.7\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'SF Mono',Menlo,Consolas,monospace;font-size:14.00px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">       -&gt; Seq Scan on sizes</text><line x1=\"660.0\" y1=\"154.0\" x2=\"700.0\" y2=\"154.0\" stroke=\"#BE653B\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#arI)\"/><rect x=\"700.0\" y=\"120.0\" width=\"660.0\" height=\"68.0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"718.0\" y=\"154.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"360.0\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:15.00px;font-weight:400;fill:#BE653B;letter-spacing:0.00px\">内侧小表被缓存说明在重复扫描，不代表存在匹配条件</text><rect x=\"40.0\" y=\"200.0\" width=\"620.0\" height=\"68.0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"52.0\" y=\"234.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"242.5\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'SF Mono',Menlo,Consolas,monospace;font-size:14.00px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">③ Sort / HashAggregate（若出现）</text><line x1=\"660.0\" y1=\"234.0\" x2=\"700.0\" y2=\"234.0\" stroke=\"#BE653B\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#arI)\"/><rect x=\"700.0\" y=\"200.0\" width=\"660.0\" height=\"68.0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"718.0\" y=\"234.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"285.0\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:15.00px;font-weight:400;fill:#BE653B;letter-spacing:0.00px\">排序、聚合、窗口都在处理放大后的结果集</text><rect x=\"40.0\" y=\"280.0\" width=\"620.0\" height=\"68.0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"52.0\" y=\"314.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"188.2\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'SF Mono',Menlo,Consolas,monospace;font-size:14.00px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">④ Rows Removed by Filter</text><line x1=\"660.0\" y1=\"314.0\" x2=\"700.0\" y2=\"314.0\" stroke=\"#BE653B\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#arI)\"/><rect x=\"700.0\" y=\"280.0\" width=\"660.0\" height=\"68.0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"718.0\" y=\"314.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"285.0\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:15.00px;font-weight:400;fill:#BE653B;letter-spacing:0.00px\">过滤发生得太晚，巨大候选集已经生成过了</text><rect x=\"20.0\" y=\"364.0\" width=\"1360.0\" height=\"46.0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><rect x=\"20.0\" y=\"364.0\" width=\"4.0\" height=\"46.0\" fill=\"#AE8A3E\" stroke=\"#AE8A3E\" stroke-width=\"0.0\"/><text x=\"42.0\" y=\"387.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"680.3\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:16.00px;font-weight:400;fill:#AE8A3E;letter-spacing:0.00px\">计划里没有 Join Filter / Hash Cond / Merge Cond 是正常的 —— 语义本来就是无条件。</text></svg>","caption":"图 16：计划片段与四个观察点；计划形状为常见形态示意，非实测输出。","nxt":"单条 SQL 会看了，还得把 cross join 放回工具箱，和其他写法横向比一比。","note":"第三组实验是观察计划。跑 EXPLAIN (ANALYZE, BUFFERS) SELECT c.color, s.size FROM colors c CROSS JOIN sizes s，常见的形状是 Nested Loop，内侧小表可能挂 Materialize，再下面是 Seq Scan。我列了四个观察点：第一，对比估算 rows 和实际 rows，输入行数估错，经过乘法偏差会被放大；第二，看到 Materialize 说明内侧在被重复扫描，别误读成「有匹配条件」；第三，留意是否出现很大的 Sort、HashAggregate 或窗口节点，它们处理的是放大之后的结果集；第四，看 Rows Removed by Filter，数值大往往意味着过滤发生得太晚。还有一条反向确认：计划里没有 Join Filter、Hash Cond、Merge Cond 是正常的，因为语义本来就是无条件。再次强调，本文没有跑实例，所以这里不提供 cost、耗时、buffers 的具体数字——这些只能由你在自己的环境里测出来。","anim":""},{"eyebrow":"数据库筑基课 · 执行算法 / 17","title":"五种写法，五种意图","lead":"选哪种，取决于「要不要匹配」和「右侧是否依赖左侧」。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" preserveAspectRatio=\"xMidYMid meet\" role=\"img\" aria-label=\"讲稿示意图\"><defs><marker id=\"arI\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#245A6B\"/></marker><marker id=\"arO\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#BE653B\"/></marker><marker id=\"arG\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#2F7A66\"/></marker><marker id=\"arN\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#89938F\"/></marker></defs><rect x=\"20.0\" y=\"20.0\" width=\"220.0\" height=\"42.0\" fill=\"#245A6B\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"32.0\" y=\"41.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"25.4\" lengthAdjust=\"spacingAndGlyphs\" style just=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:15.00px;font-weight:400;fill:#245A6B;letter-spacing:0.00px\">选哪种写法，取决于「要不要匹配」以及「右侧是否依赖左侧」。</text></svg>","caption":"图 17：CROSS JOIN / INNER JOIN / 逗号 FROM / LATERAL / generate_series 横向对比。","nxt":"把工具摆清楚之后，就可以算总账了：它给我们什么，又拿走什么。","note":"横向对比能帮我们把边界画清楚。CROSS JOIN 的目标是生成所有组合，没有 join condition，输出 N 乘 M，优化器按 clauseless inner join 处理，典型风险就是结果爆炸。INNER JOIN 是按条件匹配行对，输出是 N 乘 M 再乘选择率，有 join clause 时优先被考虑。FROM a, b 在两表时和 cross join 等价，但它是旧式写法，少了条件也很难一眼看出来。LATERAL 加 CROSS JOIN 是另一类东西：右侧可以引用左侧的列，每行驱动一次相关生成，规模取决于每行生成多少，走的是参数化路径，风险在右侧昂贵且外侧很大。generate_series 通常只是输入侧的维度构造器，行数可控。这张表我想传递的判断标准只有一条：先问「要不要匹配」。要匹配，就写 JOIN ... ON；不要匹配、就是要完整组合，才写 CROSS JOIN，并且把预期行数写下来。","anim":""},{"eyebrow":"数据库筑基课 · 执行算法 / 18","title":"收益是意图，代价是乘法","lead":"它把「完整组合空间」变成一行 SQL，也把行数不确定性放大到下游。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" preserveAspectRatio=\"xMidYMid meet\" role=\"img\" aria-label=\"讲稿示意图\"><defs><marker id=\"arI\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#245A6B\"/></marker><marker id=\"arO\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#BE653B\"/></marker><marker id=\"arG\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#2F7A66\"/></marker><marker id=\"arN\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#89938F\"/></marker></defs><text x=\"40.0\" y=\"22.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"177.8\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hi
