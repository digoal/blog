g SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:14.08px;font-weight:400;fill:#BE653B;letter-spacing:0.00px\">④ 拖累后续算子：排序、聚合、窗口、网络返回</text><rect x=\"40.0\" y=\"282.0\" width=\"640.0\" height=\"52.0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"56.0\" y=\"308.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"327.9\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:14.08px;font-weight:400;fill:#2F7A66;letter-spacing:0.00px\">⑤ 完整枚举空间：再 LEFT JOIN 事实表找缺失数据</text><rect x=\"720.0\" y=\"282.0\" width=\"640.0\" height=\"52.0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"736.0\" y=\"308.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"311.5\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:14.08px;font-weight:400;fill:#BE653B;letter-spacing:0.00px\">⑤ 估算误差放大：输入行数估错，乘法后偏差更大</text><rect x=\"20.0\" y=\"352.0\" width=\"1360.0\" height=\"46.0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><rect x=\"20.0\" y=\"352.0\" width=\"4.0\" height=\"46.0\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"0.0\"/><text x=\"42.0\" y=\"375.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"592.6\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:16.00px;font-weight:400;fill:#245A6B;letter-spacing:0.00px\">评估顺序：先手算 N × M，再跑 EXPLAIN (ANALYZE, BUFFERS) 看估算与实际。</text></svg>","caption":"图 18：五项收益与五项代价对照；评估顺序是先手算 N × M，再看计划。","nxt":"既然代价这么集中，出事时就该有一套固定的排查顺序，而不是先去翻索引。","note":"把账算总。收益这一侧：组合生成直接，规格、维度、时间网格、参数矩阵一行 SQL 就能表达；没有匹配语义歧义，不涉及 NULL 扩展、匹配失败、右侧保留这些 outer join 的麻烦；小维表组合结果可预测；配合 generate_series、VALUES 很适合构造测试数据；还能先铺完整枚举空间，再 LEFT JOIN 事实表找缺失数据。代价这一侧：每多一个输入，行数就乘上它的行数；没有等值 join key，hash 和 merge 的选择性完全用不上；逗号 FROM 和动态 SQL 拼接容易把漏条件藏起来；排序、聚合、窗口、网络返回全都在处理放大后的结果；输入行数估错，乘法之后误差更大。所以评估顺序我建议固定下来：先手算 N 乘 M，判断这个数量级是否可接受，再跑 EXPLAIN (ANALYZE, BUFFERS) 看估算和实际的差距。不要在没算过乘法之前就去调参数。","anim":""},{"eyebrow":"数据库筑基课 · 执行算法 / 19","title":"排障第一步不是看索引，是确认意图","lead":"意图 → 规模 → 计划 → 动作，四步把「疑似 bug」收敛到可处置。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" preserveAspectRatio=\"xMidYMid meet\" role=\"img\" aria-label=\"讲稿示意图\"><defs><marker id=\"arI\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#245A6B\"/></marker><marker id=\"arO\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#BE653B\"/></marker><marker id=\"arG\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#2F7A66\"/></marker><marker id=\"arN\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#89938F\"/></marker></defs><rect x=\"20.0\" y=\"24.0\" width=\"320.0\" height=\"88.0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"180.0\" y=\"68.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"97.3\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:19.00px;font-weight:600;fill:#245A6B;letter-spacing:0.00px\">① 确认意图</text><rect x=\"370.0\" y=\"24.0\" width=\"310.0\" height=\"88.0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"525.0\" y=\"68.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"123.1\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:19.00px;font-weight:600;fill:#245A6B;letter-spacing:0.00px\">② 手算 N × M</text><rect x=\"720.0\" y=\"24.0\" width=\"320.0\" height=\"88.0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"880.0\" y=\"68.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"180.9\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:19.00px;font-weight:600;fill:#245A6B;letter-spacing:0.00px\">③ EXPLAIN ANALYZE</text><rect x=\"1070.0\" y=\"24.0\" width=\"310.0\" height=\"88.0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"1225.0\" y=\"68.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"97.3\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:19.00px;font-weight:600;fill:#245A6B;letter-spacing:0.00px\">④ 采取动作</text><line x1=\"340.0\" y1=\"68.0\" x2=\"370.0\" y2=\"68.0\" stroke=\"#245A6B\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#arI)\"/><line x1=\"680.0\" y1=\"68.0\" x2=\"720.0\" y2=\"68.0\" stroke=\"#245A6B\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#arI)\"/><line x1=\"1040.0\" y1=\"68.0\" x2=\"1070.0\" y2=\"68.0\" stroke=\"#245A6B\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#arI)\"/><line x1=\"180.0\" y1=\"112.0\" x2=\"180.0\" y2=\"150.0\" stroke=\"#245A6B\" stroke-width=\"1.5\" fill=\"none\"/><line x1=\"180.0\" y1=\"150.0\" x2=\"1220.0\" y2=\"150.0\" stroke=\"#245A6B\" stroke-width=\"1.5\" fill=\"none\"/><line x1=\"220.0\" y1=\"150.0\" x2=\"220.0\" y2=\"180.0\" stroke=\"#245A6B\" stroke-width=\"1.5\" fill=\"none\"/><rect x=\"20.0\" y=\"180.0\" width=\"400.0\" height=\"116.0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"220.0\" y=\"226.6\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"64.0\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:16.00px;font-weight:400;fill:#2F7A66;letter-spacing:0.00px\">有意组合</text><text x=\"220.0\" y=\"249.4\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"352.6\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:16.00px;font-weight:400;fill:#2F7A66;letter-spacing:0.00px\">控制输入规模 / 先过滤 / 分批 / 写清预期行数</text><line x1=\"700.0\" y1=\"150.0\" x2=\"700.0\" y2=\"180.0\" stroke=\"#245A6B\" stroke-width=\"1.5\" fill=\"none\"/><rect x=\"490.0\" y=\"180.0\" width=\"420.0\" height=\"116.0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"700.0\" y=\"226.6\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"96.6\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:16.00px;font-weight:400;fill:#BE653B;letter-spacing:0.00px\">漏 join key</text><text x=\"700.0\" y=\"249.4\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"332.2\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:16.00px;font-weight:400;fill:#BE653B;letter-spacing:0.00px\">直接补 JOIN ... ON，不要调 planner 开关</text><line x1=\"1180.0\" y1=\"150.0\" x2=\"1180.0\" y2=\"180.0\" stroke=\"#245A6B\" stroke-width=\"1.5\" fill=\"none\"/><rect x=\"980.0\" y=\"180.0\" width=\"400.0\" height=\"116.0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"1180.0\" y=\"226.6\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"96.0\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:16.00px;font-weight:400;fill:#AE8A3E;letter-spacing:0.00px\">生成测试数据</text><text x=\"1180.0\" y=\"249.4\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"306.6\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:16.00px;font-weight:400;fill:#AE8A3E;letter-spacing:0.00px\">LIMIT / 分批 / 明确上限，保护生产环境</text><rect x=\"20.0\" y=\"308.0\" width=\"1360.0\" height=\"46.0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><rect x=\"20.0\" y=\"308.0\" width=\"4.0\" height=\"46.0\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"0.0\"/><text x=\"42.0\" y=\"331.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"636.8\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:16.00px;font-weight:400;fill:#245A6B;letter-spacing:0.00px\">行动顺序：确认意图 → 估算 N * M → 看计划 → 把过滤前置或补上 join condition。</text><rect x=\"20.0\" y=\"362.0\" width=\"1360.0\" height=\"46.0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><rect x=\"20.0\" y=\"362.0\" width=\"4.0\" height=\"46.0\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"0.0\"/><text x=\"42.0\" y=\"385.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"417.3\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:16.00px;font-weight:400;fill:#BE653B;letter-spacing:0.00px\">不要用 enable_*join 修语义问题：漏条件必须改 SQL。</text></svg>","caption":"图 19：四步诊断顺序，以及按意图分出的三条处置分支。","nxt":"顺序定了，还要落到人：架构师、DBA、业务开发者各自把哪一道关。","note":"线上看到一个巨大的 Nested Loop，很多人的第一反应是「是不是没走索引」。但对 cross join 来说，第一步永远是确认意图：这到底是有意的组合生成，还是漏了 join condition？图里我把顺序钉成四步——确认意图、手算 N 乘 M、跑 EXPLAIN ANALYZE、采取动作。然后按意图分三条分支。如果是有意组合，动作是控制输入规模、把过滤前置、大规模分批、在注释里写清预期行数。如果是漏了业务 key，动作非常直接：补上 JOIN ... ON，改 SQL，不要去动 planner 开关——enable_nestloop、enable_hashjoin 这类参数只能改变物理路径，改不了语义，漏出来的组合还是得生成。如果是造测试数据，就用 LIMIT、分批和明确上限把生产环境保护起来。这条顺序的价值在于，它把「性能问题」重新翻译回「语义问题」，而语义问题通常只需要改一行 SQL。","anim":""},{"eyebrow":"数据库筑基课 · 执行算法 / 20","title":"三层角色，各自把一道关","lead":"架构师管规模、DBA 管识别、开发者管意图表达。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" preserveAspectRatio=\"xMidYMid meet\" role=\"img\" aria-label=\"讲稿示意图\"><defs><marker id=\"arI\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#245A6B\"/></marker><marker id=\"arO\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#BE653B\"/></marker><marker id=\"arG\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#2F7A66\"/></marker><marker id=\"arN\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#89938F\"/></marker></defs><rect x=\"20.0\" y=\"20.0\" width=\"440.0\" height=\"44.0\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.0\"/><text x=\"240.0\" y=\"42.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"108.2\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:14.08px;font-weight:600;fill:#FFFFFF;letter-spacing:0.00px\">架构师 · 管规模</text><rect x=\"20.0\" y=\"72.0\" width=\"440.0\" height=\"52.0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"36.0\" y=\"98.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"225.7\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:14.00px;font-weight:400;fill:#46585F;letter-spacing:0.00px\">① 只在业务确需完整组合空间时使用</text><rect x=\"20.0\" y=\"130.0\" width l:#46585F;letter-spacing:0.00px\">④ 检查动态 SQL：空条件列表退化成 cross join</text><rect x=\"480.0\" y=\"304.0\" width=\"440.0\" height=\"52.0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"496.0\" y=\"330.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"223.4\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:14.00px;font-weight:400;fill:#46585F;letter-spacing:0.00px\">⑤ 不用 enable_*join 修语义问题</text><rect x=\"940.0\" y=\"20.0\" width=\"440.0\" height=\"44.0\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.0\"/><text x=\"1160.0\" y=\"42.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"136.3\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:14.08px;font-weight:600;fill:#FFFFFF;letter-spacing:0.00px\">业务开发者 · 管表达</text><rect x=\"940.0\" y=\"72.0\" width=\"440.0\" height=\"52.0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"956.0\" y=\"98.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"207.8\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:14.00px;font-weight:400;fill:#46585F;letter-spacing:0.00px\">① 有匹配关系就写 JOIN ... ON</text><rect x=\"940.0\" y=\"130.0\" width=\"440.0\" height=\"52.0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"956.0\" y=\"156.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"213.9\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:14.00px;font-weight:400;fill:#46585F;letter-spacing:0.00px\">② 有意笛卡尔积才写 CROSS JOIN</text><rect x=\"940.0\" y=\"188.0\" width=\"440.0\" height=\"52.0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1. 、日期、参数桶设清晰上限；把日期范围、租户、状态这些限制尽量放进输入子查询；大规模组合按日期、租户、业务线分批；在注释或任务说明里写明预期 N 乘 M。DBA 管识别：看到巨大 Nested Loop 先查有没有 Join Filter、Hash Cond、Merge Cond；用行数乘法做第一判断；关注 Materialize 和 temp I/O；特别检查动态 SQL 生成器，条件列表为空时很容易从 inner join 退化成 cross join；绝不用 enable_*join 去修语义问题。业务开发者管表达：有匹配关系就写 JOIN ... ON；有意笛卡尔积才写 CROSS JOIN；避免逗号 join；给 cross join 加注释或封装输入，写明预期行数；测试边界规模。三道关合起来其实是一句话：让「是否有意」和「结果多少行」都能被代码审查看见。","anim":""},{"eyebrow":"数据库筑基课 · 执行算法 / 21","title":"六个高频坑，都指向同一个缺失","lead":"漏条件、逗号、晚过滤、误读计划、绑定顺序、无上限维度。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" preserveAspectRatio=\"xMidYMid meet\" role=\"img\" aria-label=\"讲稿示意图\"><defs><marker id=\"arI\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#245A6B\"/></marker><marker id=\"arO\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#BE653B\"/></marker><marker id=\"arG\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#2F7A66\"/></marker><marker id=\"arN\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#89938F\"/></marker></defs><rect x=\"20.0\" y=\"16.0\" width=\"400.0\" height=\"44.0\" fill=\"#245A6B\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"30.0\" y=\"38.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"42.0\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:14.00px;font-weight:600;fill:#FFFFFF;letter-spacing:0.00px\">高频坑</text><rect x=\"420.0\" y=\"16.0\" width=\"450.0\" height=\"44.0\" fill=\"#245A6B\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"430.0\" y=\"38. crosoft YaHei',sans-serif;font-size:14.00px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">查 Join Filter / Hash Cond / Merge Cond</text><rect x=\"20.0\" y=\"268.0\" width=\"400.0\" height=\"52.0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"30.0\" y=\"294.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"127.7\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:14.00px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">⑤ 多表绑定顺序误判</text><rect x=\"420.0\" y=\"268.0\" width=\"450.0\" height=\"52.0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"430.0\" y=\"294.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"163.5\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:14.00px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">ON 可引用范围与直觉不同</text><rect x=\"870.0\" y=\"268.0\" width=\"510.0\" height=\"52.0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"880.0\" y=\"294.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"151.2\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:14.00px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">不混用逗号和显式 JOIN</text><rect x=\"20.0\" y=\"320.0\" width=\"400.0\" height=\"52.0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"30.0\" y=\"346.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"127.7\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:14.00px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">⑥ 生成维度没有上限</text><rect x=\"420.0\" y=\"320.0\" width=\"450.0\" height=\"52.0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"430.0\" y=\"346.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"169.1\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:14.00px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">generate_series × 大表</text><rect x=\"870.0\" y=\"320.0\" width=\"510.0\" height=\"52.0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"880.0\" y=\"346.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"235.2\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:14.00px;font-weight:400;fill:#1B2B33;letter-spacing:0.00px\">设日期范围、租户范围、LIMIT、分批</text><rect x=\"20.0\" y=\"376.0\" width=\"1360.0\" height=\"44.0\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><rect x=\"20.0\" y=\"376.0\" width=\"4.0\" height=\"44.0\" fill=\"#AE8A3E\" stroke=\"#AE8A3E\" stroke-width=\"0.0\"/><text x=\"42.0\" y=\"398.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"550.2\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:15.00px;font-weight:400;fill:#AE8A3E;letter-spacing:0.00px\">隐蔽项：NATURAL JOIN 无共同列时等价于 CROSS JOIN —— 官方文档明确说明。</text></svg>","caption":"图 21：坑 → 后果 → 正确动作；末行提示 NATURAL JOIN 的隐蔽退化。","nxt":"坑列举完了，最后用一张链条图把整场演说收束成一句可以带走的话。","note":"最后把常见坑收成一张映射表。忘写 join condition，后果是两个大表直接做 N 乘 M，动作是改成 JOIN ... ON。逗号 FROM 把笛卡尔积藏起来，少一个条件就爆，动作是统一显式 JOIN。过滤写晚，巨大候选集形成后才 Filter，动作是把限制下推到输入侧。误读 EXPLAIN，把 clauseless 当普通 key join，动作是去查 Join Filter、Hash Cond、Merge Cond。多表绑定顺序误判，ON 可引用范围和直觉不同，动作是不混用逗号和显式 JOIN。生成维度没有上限，generate_series 乘上大表，动作是设日期范围、租户范围、LIMIT 和分批。另外补一条特别隐蔽的：官方文档明确说，NATURAL JOIN 在两表没有共同列名时 behaves like CROSS JOIN——因为它等价于 USING 一个空列表，也就是 ON TRUE。这类 SQL 千万别放进生产。你会发现这六条其实是同一个缺失：没有人负责「中间会生成多少行」。","anim":""},{"eyebrow":"数据库筑基课 · 执行算法 / 22","title":"一句话带走：意图写清楚，规模算清楚","lead":"从 SQL 文本到结果行数，每一层都只是把 N × M 实现出来。","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" preserveAspectRatio=\"xMidYMid meet\" role=\"img\" aria-label=\"讲稿示意图\"><defs><marker id=\"arI\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#245A6B\"/></marker><marker id=\"arO\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#BE653B\"/></marker><marker id=\"arG\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#2F7A66\"/></marker><marker id=\"arN\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#89938F\"/></marker></defs><rect x=\"20.0\" y=\"30.0\" width=\"250.0\" height=\"82.0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"145.0\" y=\"58.9\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"72.1\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:17.00px;font-weight:400;fill:#245A6B;letter-spacing:0.00px\">SQL 写法</text><text x=\"145.0\" y=\"83.1\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"95.2\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:17.00px;font-weight:400;fill:#245A6B;letter-spacing:0.00px\">CROSS JOIN</text><rect x=\"300.0\" y=\"30.0\" width=\"250.0\" height=\"82.0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"425.0\" y=\"58.9\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"76.2\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:17.00px;font-weight:400;fill:#245A6B;letter-spacing:0.00px\">JoinExpr</text><text x=\"425.0\" y=\"83.1\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"114.2\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:17.00px;font-weight:400;fill:#245A6B;letter-spacing:0.00px\">quals = NULL</text><rect x=\"580.0\" y=\"30.0\" width=\"250.0\" height=\"82.0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"705.0\" y=\"58.9\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"95.2\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:17.00px;font-weight:400;fill:#245A6B;letter-spacing:0.00px\">clauseless</text><text x=\"705.0\" y=\"83.1\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"38.1\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:17.00px;font-weight:400;fill:#245A6B;letter-spacing:0.00px\">join</text><rect x=\"860.0\" y=\"30.0\" width=\"250.0\" height=\"82.0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"985.0\" y=\"58.9\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"47.6\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:17.00px;font-weight:400;fill:#245A6B;letter-spacing:0.00px\">nrows</text><text x=\"985.0\" y=\"83.1\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"123.8\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:17.00px;font-weight:400;fill:#245A6B;letter-spacing:0.00px\">outer × inner</text><rect x=\"1140.0\" y=\"30.0\" width=\"240.0\" height=\"82.0\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"1260.0\" y=\"58.9\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"104.7\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:17.00px;font-weight:400;fill:#245A6B;letter-spacing:0.00px\">Nested Loop</text><text x=\"1260.0\" y=\"83.1\" text-anchor=\"middle\" dominant-baseline=\"middle\" textLength=\"123.8\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:17.00px;font-weight:400;fill:#245A6B;letter-spacing:0.00px\">+ Materialize</text><line x1=\"270.0\" y1=\"71.0\" x2=\"300.0\" y2=\"71.0\" stroke=\"#245A6B\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#arI)\"/><line x1=\"550.0\" y1=\"71.0\" x2=\"580.0\" y2=\"71.0\" stroke=\"#245A6B\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#arI)\"/><line x1=\"830.0\" y1=\"71.0\" x2=\"860.0\" y2=\"71.0\" stroke=\"#245A6B\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#arI)\"/><line x1=\"1110.0\" y1=\"71.0\" x2=\"1140.0\" y2=\"71.0\" stroke=\"#245A6B\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#arI)\"/><rect x=\"20.0\" y=\"130.0\" width=\"1360.0\" height=\"62.0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1.0\"/><text x=\"40.0\" y=\"161.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"548.5\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:15.49px;font-weight:400;fill:#2F7A66;letter-spacing:0.00px\">正确动作：先确认是否有意 → 手算 N × M → 把过滤前置 → 注释写明预期行数</text><rect x=\"20.0\" y=\"202.0\" width=\"1360.0\" height=\"62.0\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" s .0\"/><text x=\"42.0\" y=\"400.0\" text-anchor=\"start\" dominant-baseline=\"middle\" textLength=\"530.6\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:16.00px;font-weight:400;fill:#245A6B;letter-spacing:0.00px\">一句话带走：意图写清楚，规模算清楚；cross join 从来不是性能技巧。</text></svg>","caption":"图 22：完整因果链、正确动作与风险对照，以及三个值得继续追的问题。","nxt":"演说到这里结束；下面三个扩展问题，留给你回到源码和自己的库里验证。","note":"我们把整条链再走一遍收尾：SQL 写法是 CROSS JOIN，parser 给出 quals = NULL 的 JoinExpr，优化器只能走 clauseless join，成本模型的基线是 outer_rows 乘 inner_rows，执行器落成 Nested Loop 加 Materialize，把组合一行行吐给下游。从头到尾，没有任何一层替你减少组合数量——这不是优化器不努力，是语义本来如此。所以真正能改变结果的只有两件事：把意图写清楚，让审查者一眼看出这是有意的组合生成还是漏了条件；把规模算清楚，先手算 N 乘 M，再决定要不要先过滤、要不要分批、要不要写上限。cross join 是语义，不是优化提示，更不是性能技巧。最后留三个值得继续追的问题：为什么 parser 不为它设独立 join type？三表以上逗号和显式 JOIN 的绑定差异具体有哪些？生成完整网格之后怎么用 LEFT JOIN 找缺失事实？带着这三个问题回去翻官方文档和源码，比记住任何一条结论都更有用。","anim":""}];

const N = PAGES.length;
const PANEL_TITLE = {note:"本页讲稿", all:"全文讲稿", toc:"目录", help:"快捷键"};
const PANEL_HINT = {
  note:"按 N 再按一次关闭 · 翻页时讲稿同步",
  all:"按 T 再按一次关闭 · 翻页自动定位到当前页",
  toc:"按 G 再按一次关闭 · 点击条目跳页",
  help:"按 ? 或 H 再按一次关闭"
};
const state = {page:0, panel:null, auto:false, autoTimer:null,
               anim:{name:null, step:0, playing:false, timer:null}};

const $ = id => document.getElementById(id);
const stage=$("stage"), stageHost=$("stageHost"), figure=$("figure");
const sidePanel=$("sidePanel"), panelBody=$("panelBody");
const autoBadge=$("autoBadge"), toastEl=$("toast");
let toastTimer=null;

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
function pad(n){return n<10?"0"+n:String(n);}
function toast(msg){
  toastEl.textContent=msg; toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toastEl.classList.remove("show"),2100);
}

/* ---------------- 舞台等比缩放 + letterbox ---------------- */
function panelWidth(){
  const vw=window.innerWidth;
  return state.panel ? Math.max(340, Math.min(480, Math.round(vw*0.33))) : 0;
}
function layout(){
  const vw=window.innerWidth, vh=window.innerHeight;
  const pw=panelWidth();
  const availW=vw-pw;
  sidePanel.style.width=pw+"px";
  sidePanel.style.display=state.panel?"flex":"none";
  stageHost.style.width=availW+"px";
  const k=Math.min(availW/1600, vh/900);
  stage.style.transform="scale("+k+")";
  stage.style.left=((availW-1600*k)/2)+"px";
  stage.style.top=((vh-900*k)/2)+"px";
}
window.addEventListener("resize",layout);
document.addEventListener("fullscreenchange",layout);

/* ---------------- 动画：数据驱动的步骤 ---------------- */
function animCfg(){return ANIMS[state.anim.name]||null;}
function animSel(){
  const inp=$("aInput"), c=animCfg();
  return (inp && inp.value) || (c ? c.def : "");
}
function animSteps(){
  const c=animCfg(); if(!c) return [];
  return c.variants[animSel()] || [];
}
function animBar(name){
  const c=ANIMS[name];
  const opts=c.opts.map(o=>'<option value="'+esc(o[0])+'"'+
    (o[0]===c.def?' selected':'')+'>'+esc(o[1])+'</option>').join("");
  return '<div class="animBar" data-anim="'+name+'">'+
    '<span class="abLabel">输入 · 观察范围</span>'+
    '<select id="aInput" aria-label="观察范围">'+opts+'</select>'+
    '<button data-a="play" id="aPlay">播放</button>'+
    '<button data-a="pause">暂停</button>'+
    '<button data-a="step">单步</button>'+
    '<button data-a="reset">重置</button>'+
    '<span class="abCount" id="aCount"></span></div>';
}
function applyAnim(){
  const name=state.anim.name; if(!name) return;
  const steps=animSteps(); if(!steps.length) return;
  const k=Math.min(state.anim.step,steps.length-1), st=steps[k], c=ANIMS[name];
  const initial=(!st.on || st.on.length===0);
  figure.querySelectorAll(".anode").forEach(el=>{
    el.style.opacity = initial ? "1" : (st.on.indexOf(el.id)>=0 ? "1" : "0.24");
  });
  const vals=Object.assign({}, c.base||{}, st.set||{});
  for(const id in vals){ const el=$(id); if(el) el.textContent=vals[id]; }
  const lab=$(name+"-label");
  if(lab) lab.textContent=st.label||"";
  const cnt=$("aCount");
  if(cnt) cnt.textContent=pad(k+1)+" / "+pad(steps.length);
  const pb=$("aPlay");
  if(pb) pb.classList.toggle("abOn",!!state.anim.playing);
}
function stopAnim(){
  if(state.anim.timer) clearInterval(state.anim.timer);
  state.anim={name:null,step:0,playing:false,timer:null};
}
function animPause(){
  if(state.anim.timer) clearInterval(state.anim.timer);
  state.anim.timer=null; state.anim.playing=false; applyAnim();
}
function animPlay(){
  if(!state.anim.name) return;
  if(state.anim.step>=animSteps().length-1) state.anim.step=0;
  animPause();
  state.anim.playing=true;
  state.anim.timer=setInterval(()=>{
    if(state.anim.step>=animSteps().length-1){animPause();return;}
    state.anim.step++; applyAnim();
  },1250);
  applyAnim();
}
function animStep(){
  if(!state.anim.name) return;
  animPause();
  if(state.anim.step<animSteps().length-1) state.anim.step++;
  applyAnim();
}
function animReset(){ animPause(); state.anim.step=0; applyAnim(); }
function initAnim(name){
  stopAnim();
  state.anim={name:name,step:0,playing:false,timer:null};
  applyAnim();
}
figure.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]"); if(!b) return;
  const a=b.getAttribute("data-a");
  if(a==="play")animPlay(); else if(a==="pause")animPause();
  else if(a==="step")animStep(); else if(a==="reset")animReset();
});
figure.addEventListener("change",e=>{
  if(e.target && e.target.id==="aInput"){
    animPause(); state.anim.step=0; applyAnim();
  }
});

/* ---------------- 页面渲染 ---------------- */
function renderPage(){
  const p=PAGES[state.page];
  $("eyebrow").textContent=p.eyebrow;
  $("title").textContent=p.title;
  $("lead").textContent=p.lead;
  figure.innerHTML=p.svg+(p.anim?animBar(p.anim):"");
  $("caption").textContent=p.caption;
  $("nextText").textContent=p.nxt;
  $("pageno").textContent=pad(state.page+1)+" / "+pad(N);
  $("progress").style.width=((state.page+1)/N*100)+"%";
  if(p.anim) initAnim(p.anim); else stopAnim();
}
function restartAutoTimer(){
  clearInterval(state.autoTimer);
  if(state.auto) state.autoTimer=setInterval(()=>goto(state.page+1),9000);
}
function goto(i){
  state.page=((i%N)+N)%N;
  renderPage();
  if(state.panel==="note") buildPanel();
  else if(state.panel==="all") scrollToCurrent(true);
  else if(state.panel==="toc") markCurrent();
  if(state.auto) restartAutoTimer();
}

/* ---------------- 右侧页内开窗 ---------------- */
function noteHTML(i){
  const p=PAGES[i];
  return '<div class="noteWrap"><div class="npNum">'+pad(i+1)+" / "+pad(N)+'</div>'+
    '<h2>'+esc(p.title)+'</h2><div class="npLead">'+esc(p.lead)+'</div>'+
    '<div class="npSec">本页讲稿</div><div class="npBody">'+esc(p.note)+'</div>'+
    '<div class="npSec">承接 · NEXT</div><div class="npNext">'+esc(p.nxt)+'</div>'+
    '<div class="npSec">图注</div><div class="npCap">'+esc(p.caption)+'</div></div>';
}
function allHTML(){
  return PAGES.map((p,i)=>
    '<div class="scriptBlock" data-page="'+i+'">'+
    '<div class="sbHead"><span class="sbNo">'+pad(i+1)+'</span>'+esc(p.title)+'</div>'+
    '<div class="sbLead">'+esc(p.lead)+'</div>'+
    '<div class="sbNote">'+esc(p.note)+'</div></div>').join("");
}
function tocHTML(){
  return PAGES.map((p,i)=>
    '<div class="tocRow" data-jump="'+i+'"><span class="tocNo">'+pad(i+1)+'</span>'+
    '<span>'+esc(p.title)+'</span><span class="tocEyebrow">'+esc(p.eyebrow)+'</span></div>').join("");
}
function helpHTML(){
  const rows=[
    ["← / → / ↑ / ↓","上一页 / 下一页"],
    ["空格 / PageDown","下一页；PageUp 上一页"],
    ["1 – 9","跳到第 1 – 9 页"],
    ["Home / End","第一页 / 最后一页"],
    ["G","目录（再按一次关闭）"],
    ["N","本页讲稿（再按一次关闭）"],
    ["T","全文讲稿（再按一次关闭，自动定位当前页）"],
    ["P","自动播放开 / 关（每页 9 秒）"],
    ["F","全屏开 / 关；全屏后底部按键仍可见"],
    ["? / H","本快捷键说明"],
    ["Esc","关闭右侧开窗 / 退出全屏"]
  ];
  return rows.map(r=>'<div class="helpRow"><span class="helpKey">'+esc(r[0])+
    '</span><span>'+esc(r[1])+'</span></div>').join("")+
    '<div class="helpNote">右侧开窗是页内开窗，不是弹窗：打开时舞台等比缩放到左侧；'+
    'T 模式下翻页会自动把右侧讲稿滚动到当前页，N 模式下翻页会同步换成本页讲稿。'+
    '第 11、12 页提供观察范围输入，以及播放 / 暂停 / 单步 / 重置。'+
    '全文讲稿里的每一页方块也可点击直接跳页。</div>';
}
function markCurrent(){
  panelBody.querySelectorAll(".scriptBlock,.tocRow").forEach(el=>{
    el.classList.toggle("cur", el.getAttribute("data-page")===String(state.page) ||
                               el.getAttribute("data-jump")===String(state.page));
  });
}
function scrollToCurrent(smooth){
  if(state.panel!=="all") return;
  markCurrent();
  const el=panelBody.querySelector('.scriptBlock[data-page="'+state.page+'"]');
  if(!el) return;
  panelBody.scrollTo({top:Math.max(0,el.offsetTop-14),behavior:smooth?"smooth":"auto"});
}
function buildPanel(){
  $("panelTitle").textContent=PANEL_TITLE[state.panel]||"";
  $("panelHint").textContent=PANEL_HINT[state.panel]||"";
  if(state.panel==="note") panelBody.innerHTML=noteHTML(state.page);
  else if(state.panel==="all") panelBody.innerHTML=allHTML();
  else if(state.panel==="toc") panelBody.innerHTML=tocHTML();
  else if(state.panel==="help") panelBody.innerHTML=helpHTML();
  markCurrent();
  panelBody.scrollTop=0;
}
function setPanel(mode){
  if(state.panel===mode || mode===null){
    state.panel=null; layout(); return;
  }
  state.panel=mode;
  buildPanel();
  layout();
  if(mode==="all"){
    scrollToCurrent(false);
    requestAnimationFrame(()=>scrollToCurrent(false));
  }
}
panelBody.addEventListener("click",e=>{
  const r=e.target.closest("[data-jump],[data-page]");
  if(!r) return;
  const v=r.getAttribute("data-jump");
  goto(parseInt(v!==null?v:r.getAttribute("data-page"),10));
});

/* ---------------- 自动播放 / 全屏 ---------------- */
function toggleAuto(){
  state.auto=!state.auto;
  autoBadge.textContent=state.auto?"AUTO ●":"";
  if(state.auto){restartAutoTimer();toast("自动播放已开启 · 每页 9 秒");}
  else{clearInterval(state.autoTimer);toast("自动播放已关闭");}
}
function toggleFull(){
  if(!document.fullscreenElement){
    const el=document.documentElement;
    if(el.requestFullscreen){
      el.requestFullscreen().then(()=>{layout();toast("已进入全屏 · 底部快捷键仍然可用");})
        .catch(()=>{document.body.classList.add("immersive");layout();
                    toast("浏览器未允许全屏，已切换沉浸模式");});
    }else{
      document.body.classList.toggle("immersive"); layout();
      toast(document.body.classList.contains("immersive")?"已切换沉浸模式":"已退出沉浸模式");
    }
  }else{
    document.exitFullscreen().then(()=>{
      document.body.classList.remove("immersive");layout();toast("已退出全屏");
    }).catch(()=>{});
  }
}

/* ---------------- 底部按键与键盘 ---------------- */
function act(a){
  if(a==="prev")goto(state.page-1);
  else if(a==="next")goto(state.page+1);
  else if(a==="toc")setPanel("toc");
  else if(a==="note")setPanel("note");
  else if(a==="all")setPanel("all");
  else if(a==="auto")toggleAuto();
  else if(a==="full")toggleFull();
  else if(a==="help")setPanel("help");
  else if(a==="close")setPanel(null);
}
$("keyhints").addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(b) act(b.getAttribute("data-act"));
});
sidePanel.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(b) act(b.getAttribute("data-act"));
});
document.addEventListener("keydown",e=>{
  const t=e.target, k=e.key;
  const inField=t && (t.tagName==="SELECT"||t.tagName==="INPUT"||t.tagName==="TEXTAREA");
  if(inField){
    if(k==="Escape"){t.blur();setPanel(null);return;}
    if(k.indexOf("Arrow")===0||k===" "||k.indexOf("Page")===0||
       k==="Home"||k==="End"||/^[1-9]$/.test(k)) return;
  }
  if(k==="ArrowRight"||k==="ArrowDown"||k===" "||k==="PageDown"){
    e.preventDefault();goto(state.page+1);
  }else if(k==="ArrowLeft"||k==="ArrowUp"||k==="PageUp"){
    e.preventDefault();goto(state.page-1);
  }else if(k==="Home"){goto(0);}
  else if(k==="End"){goto(N-1);}
  else if(/^[1-9]$/.test(k)){goto(parseInt(k,10)-1);}
  else{
    const q=k.toLowerCase();
    if(q==="g")setPanel("toc");
    else if(q==="n")setPanel("note");
    else if(q==="t")setPanel("all");
    else if(q==="p")toggleAuto();
    else if(q==="f")toggleFull();
    else if(q==="?"||q==="h")setPanel("help");
    else if(k==="Escape"){
      if(state.panel)setPanel(null);
      else if(document.fullscreenElement)toggleFull();
      else if(document.body.classList.contains("immersive")){
        document.body.classList.remove("immersive");layout();
      }
    }
  }
});

/* ---------------- 启动 ---------------- */
renderPage();
layout();
</script>
