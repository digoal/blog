<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数据库筑基课 · Semi Join｜只问存在，不求行对</title>
<style>
:root{
  --paper:#F7F6F2; --paper2:#F1EFE9; --letter:#E9E7E1;
  --ink:#1B2B33; --sub:#46585F; --faint:#89938F; --line:#D9D5CB;
  --indigo:#245A6B; --indigoL:#E5EFF0; --indigoM:#7BA6AF;
  --terra:#BE653B; --terraL:#F7E9DE;
  --green:#2F7A66; --greenL:#E4F0EA; --gold:#AE8A3E; --goldL:#F5EDDC;
  --s1:#1E4B5A; --s2:#2E6373; --s3:#47808D; --s4:#74A5AD; --s5:#A4C4C6; --s6:#CFE0DC; --s7:#EBF1EE;
  --serif:"Songti SC","STSong","Noto Serif CJK SC",Georgia,serif;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--letter);font-family:var(--sans);-webkit-font-smoothing:antialiased}
#viewport{position:fixed;inset:0;background:var(--letter);overflow:hidden}
#viewport:fullscreen{width:100vw;height:100vh;background:var(--letter)}
#stage{position:absolute;width:1600px;height:900px;background:var(--paper);transform-origin:0 0;overflow:hidden;border:0}
.slide{position:absolute;left:0;top:0;width:1600px;height:900px;opacity:0;pointer-events:none}
.slide.active{opacity:1;pointer-events:auto}
.slide svg{display:block}
.eyebrow{position:absolute;left:64px;top:40px;font-size:13px;letter-spacing:3.4px;color:var(--faint)}
.title{position:absolute;left:64px;top:76px;margin:0;width:1472px;font-family:var(--serif);font-size:44px;font-weight:600;line-height:1.24;color:var(--ink)}
.lead{position:absolute;left:64px;top:142px;width:1472px;font-size:19px;line-height:1.55;color:var(--sub)}
.rule{position:absolute;left:64px;top:208px;width:1472px;height:1px;background:var(--line)}
.figWrap{position:absolute;left:100px;top:216px;width:1400px;height:430px}
.figWrap>svg{width:1400px;height:430px}
.cap{position:absolute;left:100px;top:654px;width:1400px;font-size:13px;line-height:1.5;color:var(--faint)}
.prop{position:absolute;left:100px;top:678px;width:1400px;display:flex;align-items:flex-start;gap:14px;font-family:var(--serif);font-size:20px;line-height:1.45;color:var(--indigo)}
.propTag{flex:none;margin-top:4px;font-family:var(--sans);font-size:11px;letter-spacing:2px;color:#fff;background:var(--indigo);padding:4px 9px}
.next{position:absolute;left:64px;top:742px;width:1472px;border-left:3px solid var(--terra);padding-left:18px;font-family:var(--serif);font-size:20px;line-height:1.5;color:var(--ink)}
.nextTag{color:var(--terra);margin-right:14px}
.foot{position:absolute;left:64px;top:846px;width:1472px;border-top:1px solid var(--line);padding-top:12px;display:flex;justify-content:space-between;font-size:12px;letter-spacing:1px;color:var(--faint)}
.pg{font-family:var(--mono);font-size:13px;color:var(--sub);letter-spacing:0}
/* animation bar */
.animBar{position:absolute;left:0;bottom:0;width:1400px;height:44px;display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);background:var(--paper)}
.animBar label{font-size:13px;color:var(--sub);letter-spacing:1px;margin-left:2px}
.animBar select,.animBar button{font-family:var(--sans);font-size:13px;color:var(--ink);background:#fff;border:1px solid var(--line);padding:5px 11px;border-radius:0;cursor:pointer;height:29px}
.animBar select{min-width:132px}
.animBar button:hover{border-color:var(--indigo);color:var(--indigo)}
.animBar button.on{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.aStatus{font-family:var(--mono);font-size:12px;color:var(--sub);margin-left:6px;white-space:nowrap}
.aHint{font-size:12px;color:var(--faint);margin-left:auto;margin-right:2px}
/* notes panel */
#notes{position:fixed;right:0;top:0;bottom:58px;display:none;flex-direction:column;background:var(--paper2);border-left:1px solid var(--line);z-index:6}
#notesHead{flex:none;height:58px;display:flex;align-items:center;gap:12px;padding:0 22px;border-bottom:1px solid var(--line);background:var(--paper)}
#notesMode{font-family:var(--serif);font-size:18px;color:var(--ink)}
#notesPg{font-family:var(--mono);font-size:12px;color:var(--faint);margin-left:auto}
#notesHead button{font-family:var(--sans);font-size:12px;color:var(--sub);background:transparent;border:1px solid var(--line);padding:5px 10px;cursor:pointer}
#notesHead button:hover{border-color:var(--terra);color:var(--terra)}
#notesHint{flex:none;padding:10px 24px 0;font-size:12px;color:var(--faint);letter-spacing:1px}
#notesBody{flex:1;overflow-y:auto;padding:14px 26px 60px}
.noteSec{margin:0 0 30px;padding:0 0 24px;border-bottom:1px solid var(--line)}
.noteSec.isCur .noteHead h3{color:var(--terra)}
.noteHead{display:flex;gap:12px;align-items:baseline;margin-bottom:12px}
.noteNo{font-family:var(--mono);font-size:12px;color:var(--faint)}
.noteHead h3{margin:0;font-family:var(--serif);font-size:21px;font-weight:600;color:var(--ink)}
.noteBody p{margin:0 0 12px;font-size:16px;line-height:1.92;color:var(--sub)}
.noteBody code{font-family:var(--mono);font-size:13px;background:var(--paper);border:1px solid var(--line);padding:2px 6px;color:var(--indigo)}
.evi{margin:14px 0 6px;padding:10px 14px;background:var(--indigoL);border-left:3px solid var(--indigo);font-family:var(--mono);font-size:12.5px;line-height:1.75;color:var(--sub)}
.noteNext{margin-top:14px;font-family:var(--serif);font-size:14px;line-height:1.7;color:var(--terra)}
/* overlays inside stage */
.overlay{position:absolute;inset:0;z-index:20;display:none;background:rgba(247,246,242,.985);padding:52px 64px}
.overlay.open{display:block}
.ovHead{display:flex;align-items:baseline;gap:18px;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:24px}
.ovHead h2{margin:0;font-family:var(--serif);font-size:34px;color:var(--ink)}
.ovHead .ovSub{font-size:14px;color:var(--faint);letter-spacing:2px}
.ovHead button{margin-left:auto;font-family:var(--sans);font-size:13px;background:transparent;border:1px solid var(--line);color:var(--sub);padding:7px 14px;cursor:pointer}
#dirGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 18px}
.dirItem{display:flex;gap:12px;align-items:baseline;text-align:left;font-family:var(--sans);font-size:15px;color:var(--sub);background:#fff;border:1px solid var(--line);padding:12px 14px;cursor:pointer;white-space:nowrap;overflow:hidden}
.dirItem:hover{border-color:var(--indigo);color:var(--indigo)}
.dirItem.cur{border-left:3px solid var(--terra);color:var(--ink);background:var(--terraL)}
.dirNum{font-family:var(--mono);font-size:12px;color:var(--faint);flex:none}
.helpGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 40px;max-width:1200px}
.helpRow{display:flex;gap:18px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:10px;font-size:16px;color:var(--sub)}
.helpRow kbd{font-family:var(--mono);font-size:13px;color:var(--indigo);background:var(--indigoL);border:1px solid var(--line);padding:3px 9px;min-width:74px;text-align:center}
/* control bar */
#bar{position:fixed;left:0;right:0;bottom:0;height:58px;z-index:30;display:flex;align-items:center;gap:18px;padding:0 20px;background:var(--paper2);border-top:1px solid var(--line)}
#progress{position:absolute;left:0;top:-2px;height:2px;background:var(--terra);transition:width .3s ease}
.barLeft{flex:none;display:flex;align-items:baseline;gap:14px;min-width:230px}
#barPg{font-family:var(--mono);font-size:14px;color:var(--indigo)}
#barTitle{font-size:13px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.barBtns{display:flex;align-items:center;gap:7px;flex:1;justify-content:center;flex-wrap:nowrap}
#bar button{font-family:var(--sans);font-size:12.5px;color:var(--sub);background:#fff;border:1px solid var(--line);padding:7px 11px;border-radius:0;cursor:pointer;white-space:nowrap}
#bar button:hover{border-color:var(--indigo);color:var(--indigo)}
#bar button.on{background:var(--indigo);color:#fff;border-color:var(--indigo)}
#bar kbd{font-family:var(--mono);font-size:11px;color:var(--faint);margin-left:4px}
#bar button.on kbd{color:#cfe0dc}
.barRight{flex:none;font-size:12px;color:var(--faint);white-space:nowrap;min-width:230px;text-align:right}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-8px);z-index:60;background:var(--ink);color:#fff;font-size:13px;padding:9px 18px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;letter-spacing:.5px}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:1100px){.barRight{display:none}.barLeft{min-width:150px}}
</style>
</head>
<body>
<div id="viewport">
  <div id="stage"></div>

  <aside id="notes">
    <div id="notesHead"><span id="notesMode">本页讲稿</span><span id="notesPg">第 01 页</span><button data-act="noteClose">关闭 ×</button></div>
    <div id="notesHint">讲稿在页内开窗 · 翻页时自动联动到当前页</div>
    <div id="notesBody"></div>
  </aside>

  <div id="bar">
    <div id="progress"></div>
    <div class="barLeft"><span id="barPg">01 / 23</span><span id="barTitle"></span></div>
    <div class="barBtns">
      <button data-act="prev">← 上一页</button>
      <button data-act="next">下一页 →</button>
      <button data-act="dir">目录 <kbd>G</kbd></button>
      <button data-act="note">本页讲稿 <kbd>N</kbd></button>
      <button data-act="all">全文讲稿 <kbd>T</kbd></button>
      <button data-act="play">自动播放 <kbd>P</kbd></button>
      <button data-act="fs">全屏 <kbd>F</kbd></button>
      <button data-act="help">快捷键 <kbd>?</kbd></button>
    </div>
    <div class="barRight">← → 翻页 · 空格前进 · 1–9 跳页 · Esc 关闭</div>
  </div>

  <div id="toast"></div>
</div>

<script>
/* ============ 色卡与绘图语法 ============ */
const C={paper:'#F7F6F2',paper2:'#F1EFE9',ink:'#1B2B33',sub:'#46585F',faint:'#89938F',line:'#D9D5CB',
 indigo:'#245A6B',indigoL:'#E5EFF0',indigoM:'#7BA6AF',terra:'#BE653B',terraL:'#F7E9DE',
 green:'#2F7A66',greenL:'#E4F0EA',gold:'#AE8A3E',goldL:'#F5EDDC',white:'#FFFFFF'};
const S=['#1E4B5A','#2E6373','#47808D','#74A5AD','#A4C4C6','#CFE0DC','#EBF1EE'];
const FF={serif:"'Songti SC','STSong','Noto Serif CJK SC',Georgia,serif",
 sans:"'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif",
 mono:"'SF Mono',Menlo,Consolas,monospace"};
const pad=n=>String(n).padStart(2,'0');
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function T(x,y,s,o={}){
  const size=o.size||16, fill=o.fill||C.ink, anchor=o.anchor||'start', weight=o.weight||400;
  const ff=o.mono?FF.mono:(o.serif?FF.serif:FF.sans);
  const mw=o.maxw?` data-maxw="${o.maxw}"`:'';
  const ls=o.ls?` letter-spacing="${o.ls}"`:'';
  return `<text x="${x}" y="${y}" font-family="${ff}" font-size="${size}" fill="${fill}" text-anchor="${anchor}" font-weight="${weight}"${ls}${mw}>${esc(s)}</text>`;
}
function DYN(x,y,key,init,o={}){return T(x,y,init,o).replace('<text ',`<text data-dyn="${key}" `);}
function R(x,y,w,h,o={}){
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${o.rx||0}" fill="${o.fill||'none'}" stroke="${o.stroke===undefined?C.line:o.stroke}" stroke-width="${o.sw===undefined?1:o.sw}"${o.dash?` stroke-dasharray="${o.dash}"`:''}/>`;
}
function ARH(x1,x2,y,o={}){
  const c=o.stroke||C.indigo,sw=o.sw||1.6,d=x2>=x1?1:-1;
  return `<line x1="${x1}" y1="${y}" x2="${x2-d*7}" y2="${y}" stroke="${c}" stroke-width="${sw}"/>`+
   `<polygon points="${x2},${y} ${x2-d*9},${y-4.5} ${x2-d*9},${y+4.5}" fill="${c}"/>`;
}
function ARV(x,y1,y2,o={}){
  const c=o.stroke||C.indigo,sw=o.sw||1.6,d=y2>=y1?1:-1;
  return `<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2-d*7}" stroke="${c}" stroke-width="${sw}"/>`+
   `<polygon points="${x},${y2} ${x-4.5},${y2-d*9} ${x+4.5},${y2-d*9}" fill="${c}"/>`;
}
/* 只允许水平/竖直直角的折线 */
function ORTHO(pts,o={}){
  const c=o.stroke||C.indigo,sw=o.sw||1.5,n=pts.length;
  const [x2,y2]=pts[n-1],[px,py]=pts[n-2];
  let head;
  if(x2===px){const d=y2>py?1:-1;head=`<polygon points="${x2},${y2} ${x2-4.5},${y2-d*9} ${x2+4.5},${y2-d*9}" fill="${c}"/>`;}
  else{const d=x2>px?1:-1;head=`<polygon points="${x2},${y2} ${x2-d*9},${y2-4.5} ${x2-d*9},${y2+4.5}" fill="${c}"/>`;}
  return `<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${c}" stroke-width="${sw}"${o.dash?` stroke-dasharray="${o.dash}"`:''}/>`+head;
}
/* 框：文字与框分离，框内留白 >=14px，按框宽自动缩字号 */
function BOXM(x,y,w,h,lines,o={}){
  let s=R(x,y,w,h,{fill:o.fill||C.indigoL,stroke:o.stroke||C.line,sw:o.sw||1,dash:o.dash});
  const arr=Array.isArray(lines)?lines:[lines],size=o.size||15,lh=o.lh||size*1.45;
  const sy=y+h/2-((arr.length-1)*lh)/2+size*0.35;
  const tx=o.align==='left'?x+(o.pad||14):x+w/2;
  arr.forEach((ln,i)=>{
    const ob=(typeof ln==='string')?{t:ln}:ln;
    s+=T(tx,sy+i*lh,ob.t,{size:ob.size||size,fill:ob.fill||o.color||C.ink,anchor:o.align==='left'?'start':'middle',
      weight:ob.weight||o.weight||500,mono:o.mono||ob.mono,serif:o.serif,maxw:w-2*(o.pad||14)});
  });
  return s;
}
/* 横带 */
function BAND(x,y,w,h,lines,o={}){
  let s=R(x,y,w,h,{fill:o.fill||C.indigoL,stroke:o.stroke||C.line,sw:o.sw||1});
  if(o.bar)s+=R(x,y,o.bar,h,{fill:o.barColor||C.indigo,stroke:o.barColor||C.indigo,sw:0});
  const arr=Array.isArray(lines)?lines:[lines],size=o.size||15,lh=o.lh||size*1.5;
  const sy=y+h/2-((arr.length-1)*lh)/2+size*0.35;
  const tx=o.align==='center'?x+w/2:x+(o.pad||16)+(o.bar?4:0);
  arr.forEach((ln,i)=>{
    const ob=(typeof ln==='string')?{t:ln}:ln;
    s+=T(tx,sy+i*lh,ob.t,{size:ob.size||size,fill:ob.fill||o.color||C.ink,anchor:o.align==='center'?'middle':'start',
      weight:ob.weight||o.weight||400,mono:o.mono||ob.mono,serif:o.serif,maxw:w-2*(o.pad||16)-(o.bar?4:0)});
  });
  return s;
}
/* 表格 */
function TABLE(x,y,cw,headers,rows,o={}){
  const hh=o.hh||42,bh=o.bh||54,size=o.size||13,hf=o.headFill||S[0];
  let s='',cx=x;
  headers.forEach((h,i)=>{
    s+=R(cx,y,cw[i],hh,{fill:hf,stroke:hf,sw:1});
    s+=T(cx+cw[i]/2,y+hh/2+size*0.35,h,{size:o.headSize||size,fill:'#FFFFFF',anchor:'middle',weight:600,maxw:cw[i]-18});
    cx+=cw[i];
  });
  rows.forEach((r,ri)=>{
    let c=x,ry=y+hh+ri*bh;
    r.forEach((cell,ci)=>{
      const ob=(typeof cell==='string')?{t:cell}:cell;
      const bg=ob.fill||(ri%2?C.paper2:'#FFFFFF');
      s+=R(c,ry,cw[ci],bh,{fill:bg,stroke:C.line,sw:1});
      const lines=String(ob.t).split('\n'),lh=size*1.4;
      const sy=ry+bh/2-((lines.length-1)*lh)/2+size*0.35;
      lines.forEach((ln,li)=>s+=T(c+cw[ci]/2,sy+li*lh,ln,{size,fill:ob.color||C.sub,anchor:'middle',weight:ob.weight||400,maxw:cw[ci]-18,mono:ob.mono}));
      c+=cw[ci];
    });
  });
  return s;
}
function FIG(inner){return `<svg viewBox="0 0 1400 430" width="1400" height="430" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;}
function g(attr,inner){return `<g ${attr}>${inner}</g>`;}

/* ============ 各页示意图（全部现场绘制的内联 SVG） ============ */
function figCover(){
  let s=`<rect x="0" y="0" width="1600" height="900" fill="${C.paper}"/>`;
  s+=`<line x1="790" y1="0" x2="790" y2="900" stroke="${C.line}" stroke-width="1"/>`;
  s+=T(64,96,'数据库筑基课 · 执行算法 / 筑基第七讲',{size:14,fill:C.faint,ls:3.4});
  s+=T(64,244,'Semi Join',{size:104,fill:C.ink,serif:true,weight:600});
  s+=T(64,322,'只问存在，不求行对',{size:34,fill:C.terra,serif:true});
  s+=`<line x1="64" y1="358" x2="720" y2="358" stroke="${C.line}" stroke-width="1"/>`;
  s+=T(64,402,'从一条 EXISTS 出发，一路挖到执行器的「首个匹配即停」。',{size:19,fill:C.sub,maxw:650});
  s+=T(64,438,'把「用另一张表过滤当前表」的意图，交给正确的算子。',{size:19,fill:C.sub,maxw:650});
  s+=T(64,522,'digoal · 2026-05-30',{size:16,fill:C.faint,mono:true});
  s+=T(64,554,'PostgreSQL 源码 / 官方文档 / 数据库筑基课',{size:15,fill:C.faint,maxw:650});
  s+=T(830,116,'地层剖面 · 本课的七层结构（越深，越靠近执行器）',{size:13,fill:C.faint,ls:2,maxw:670});
  const layers=[
    ['01','SQL 意图 · EXISTS / IN / = ANY',S[6],C.ink],
    ['02','SubLink · 子查询表达式',S[5],C.ink],
    ['03','pull_up_sublinks · 拉平闸门',S[4],C.ink],
    ['04','JOIN_SEMI · 逻辑算子',S[3],C.ink],
    ['05','SpecialJoinInfo · join order 边界',S[2],'#FFFFFF'],
    ['06','物理路径 · NL / Hash / Merge',S[1],'#FFFFFF'],
    ['07','single_match + 成本因子 · 执行短路',S[0],'#FFFFFF']
  ];
  let y=140;
  layers.forEach(l=>{
    s+=R(830,y,670,88,{fill:l[2],stroke:l[2],sw:0});
    s+=T(852,y+53,l[0],{size:20,fill:l[3],mono:true,weight:600});
    s+=T(914,y+52,l[1],{size:19,fill:l[3],weight:500,maxw:566});
    y+=92;
  });
  s+=R(64,806,3,34,{fill:C.terra,stroke:C.terra,sw:0});
  s+=T(84,832,'承接 · NEXT',{size:20,fill:C.terra,serif:true});
  s+=T(232,832,'两条看起来等价的 SQL，为什么走的是两个算子？',{size:20,fill:C.ink,serif:true,maxw:1280});
  s+=`<line x1="64" y1="866" x2="1536" y2="866" stroke="${C.line}" stroke-width="1"/>`;
  s+=T(64,888,'数据库筑基课 · SEMI JOIN',{size:12,fill:C.faint});
  s+=T(1536,888,'01 / 23',{size:13,fill:C.sub,mono:true,anchor:'end'});
  return `<svg viewBox="0 0 1600 900" width="1600" height="900" xmlns="http://www.w3.org/2000/svg">${s}</svg>`;
}

function figTwoSQL(){
  let s='';
  const codeA=['SELECT o.* FROM demo_orders o','WHERE EXISTS (','  SELECT 1 FROM demo_payments p','  WHERE p.order_id = o.order_id',"    AND p.status = 'success');"];
  const codeB=['SELECT DISTINCT o.* FROM demo_orders o','JOIN demo_payments p','  ON p.order_id = o.order_id'," AND p.status = 'success';",''];
  s+=R(20,14,660,400,{fill:'#FFFFFF',stroke:C.line,sw:1});
  s+=R(20,14,660,40,{fill:C.indigoL,stroke:C.line,sw:1});

const ANIM_CFG={

   }},
 single:{label:'内侧元组条数',options:[['2','2 条'],['3','3 条'],['4','4 条（默认）'],['5','5 条']],def:'4',

   }},

function vis(el,on){el.style.opacity=on?'1':'0.32';}
function hide(el){el.style.opacity='0';}
function setDyn(svg,key,str){
  svg.querySelectorAll(`[data-dyn="${key}"]`).forEach(el=>{el.textContent=str;fitOne(el);});
}
function fitOne(el){
  const maxw=+el.dataset.maxw||0;if(!maxw)return;
  let fs=+(el.dataset.fs||parseFloat(el.getAttribute('font-size'))||16);
  el.setAttribute('font-size',fs);
  let guard=0;
  while(el.getComputedTextLength()>maxw&&fs>9&&guard++<80){fs-=0.5;el.setAttribute('font-size',fs);}
}
function fitAll(){
  document.querySelectorAll('#stage svg text[data-maxw]').forEach(el=>{
    el.dataset.fs=parseFloat(el.getAttribute('font-size'))||16;fitOne(el);
  });
}
function animBarHTML(id){
  const c=ANIM_CFG[id];
  const opts=c.options.map(o=>`<option value="${o[0]}"${o[0]===c.def?' selected':''}>${o[1]}</option>`).join('');
  return `<div class="animBar" data-anim="${id}"><label>${c.label}</label><select class="animInput">${opts}</select>
    <button class="aPlay">播放</button><button class="aStep">单步 →</button><button class="aReset">重置</button>
    <span class="aStatus">步骤 0 / 0</span><span class="aHint">浅色为未演到的步骤 · 数字均为示意数据</span></div>`;
}
function setupAnims(){
  document.querySelectorAll('.animBar').forEach(bar=>{
    const id=bar.dataset.anim,cfg=ANIM_CFG[id],slide=bar.closest('.slide'),svg=slide.querySelector('svg');
    const sel=bar.querySelector('.animInput'),bPlay=bar.querySelector('.aPlay'),
          bStep=bar.querySelector('.aStep'),bReset=bar.querySelector('.aReset'),st=bar.querySelector('.aStatus');
    let step=0,timer=null,on=false;
    const total=()=>cfg.total(+sel.value);
    function draw(){cfg.apply(svg,step,+sel.value);st.textContent=`步骤 ${step} / ${total()}`;bPlay.textContent=on?'暂停':'播放';bPlay.classList.toggle('on',on);}
    function stop(){on=false;clearInterval(timer);timer=null;draw();}
    bPlay.onclick=()=>{if(on){stop();return;}if(step>=total())step=0;on=true;draw();
      timer=setInterval(()=>{if(step>=total()){stop();return;}step++;draw();},900);};
    bStep.onclick=()=>{stop();if(step<total())step++;draw();};
    bReset.onclick=()=>{stop();step=0;draw();};
    sel.onchange=()=>{stop();step=0;draw();};
    draw();
  });
}

/* ============ 布局：固定 1600×900 舞台，等比缩放 + letterbox ============ */
function layout(){
  const vw=window.innerWidth,vh=window.innerHeight,BAR=58,availH=vh-BAR;
  const n=document.getElementById('notes'),open=notesMode!=='none';
  let nw=0;
  if(open){nw=Math.max(360,Math.min(620,Math.round(vw*0.36)));n.style.width=nw+'px';}
  const leftW=vw-nw-(open?12:0);
  const s=Math.min(leftW/1600,availH/900);
  const st=document.getElementById('stage');
  st.style.transform=`scale(${s})`;
  st.style.left=Math.round((leftW-1600*s)/2)+'px';
  st.style.top=Math.round((availH-900*s)/2)+'px';
}

let cur=0,autoTimer=null;
function goto(i){
  cur=(i+SLIDES.length)%SLIDES.length;
  document.querySelectorAll('.slide').forEach((el,k)=>el.classList.toggle('active',k===cur));
  document.querySelectorAll('.dirItem').forEach((el,k)=>el.classList.toggle('cur',k===cur));
  updateBar();
  if(notesMode==='page')renderNotes(false);
  else if(notesMode==='all')scrollNotesTo(cur);
}
function updateBar(){
  document.getElementById('barPg').textContent=`${pad(cur+1)} / ${pad(SLIDES.length)}`;
  document.getElementById('barTitle').textContent=SLIDES[cur].title;
  document.getElementById('progress').style.width=((cur+1)/SLIDES.length*100)+'%';
  const b=k=>document.querySelector(`#bar [data-act="${k}"]`);
  b('note').classList.toggle('on',notesMode==='page');
  b('all').classList.toggle('on',notesMode==='all');
  b('play').classList.toggle('on',!!autoTimer);
  b('play').innerHTML=autoTimer?'暂停播放 <kbd>P</kbd>':'自动播放 <kbd>P</kbd>';
  b('dir').classList.toggle('on',document.getElementById('dir').classList.contains('open'));
  b('help').classList.toggle('on',document.getElementById('help').classList.contains('open'));
}
function toggleOverlay(id){
  const el=document.getElementById(id);el.classList.toggle('open');updateBar();
}
function closeAll(){
  document.getElementById('dir').classList.remove('open');
  document.getElementById('help').classList.remove('open');
  notesMode='none';document.getElementById('notes').style.display='none';
  layout();updateBar();
}
let toastTimer=null;
function toast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}
function toggleAuto(){
  if(autoTimer){clearInterval(autoTimer);autoTimer=null;toast('自动播放已暂停');}
  else{autoTimer=setInterval(()=>goto(cur+1),9000);toast('自动播放已开启 · 每 9 秒翻一页');}
  updateBar();
}
function toggleFS(){
  const el=document.getElementById('viewport');
  if(!document.fullscreenElement){
    if(el.requestFullscreen){
      el.requestFullscreen().then(()=>toast('已进入全屏 · 底部快捷键保持可见')).catch(()=>{
        document.body.classList.add('fsFallback');toast('浏览器未允许全屏，已启用沉浸降级');});
    }else{document.body.classList.add('fsFallback');toast('浏览器不支持全屏 API，已启用沉浸降级');}
  }else if(document.exitFullscreen)document.exitFullscreen();
}
document.addEventListener('fullscreenchange',()=>setTimeout(layout,80));
window.addEventListener('resize',layout);

/* ============ 输入 ============ */
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  if(tag==='select'||tag==='input'||tag==='textarea')return;
  const k=e.key;
  if(k==='ArrowRight'||k===' '||k==='PageDown'){e.preventDefault();goto(cur+1);}
  else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();goto(cur-1);}
  else if(/^[1-9]$/.test(k))goto(+k-1);
  else if(k==='g'||k==='G')toggleOverlay('dir');
  else if(k==='n'||k==='N')toggleNotes('page');
  else if(k==='t'||k==='T')toggleNotes('all');
  else if(k==='p'||k==='P')toggleAuto();
  else if(k==='f'||k==='F')toggleFS();
  else if(k==='?'||k==='/')toggleOverlay('help');
  else if(k==='Escape')closeAll();
});
document.addEventListener('click',e=>{
  const go=e.target.closest('[data-go]');
  if(go){goto(+go.dataset.go);document.getElementById('dir').classList.remove('open');updateBar();return;}
  const btn=e.target.closest('[data-act]');
  if(!btn)return;
  const a=btn.dataset.act;
  if(a==='prev')goto(cur-1);
  else if(a==='next')goto(cur+1);
  else if(a==='dir')toggleOverlay('dir');
  else if(a==='dirClose'){document.getElementById('dir').classList.remove('open');updateBar();}
  else if(a==='note')toggleNotes('page');
  else if(a==='all')toggleNotes('all');
  else if(a==='noteClose'){notesMode='none';document.getElementById('notes').style.display='none';layout();updateBar();}
  else if(a==='play')toggleAuto();
  else if(a==='fs')toggleFS();
  else if(a==='help')toggleOverlay('help');
  else if(a==='helpClose'){document.getElementById('help').classList.remove('open');updateBar();}
});

/* ============ 启动 ============ */
renderStage();
layout();
updateBar();
</script>
</body>
</html>
