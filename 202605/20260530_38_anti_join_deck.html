<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数据库筑基课 · Anti Join｜找出「没有发生过」的那些行</title>
<!-- 单文件交付：所有原理图均为现场绘制的内联 SVG，无外部图片、字体、脚本依赖。 -->
<!-- 视觉母题：地层 / 剖面。内容按「业务问句 → 定义 → 规划管线 → 执行器 → 代价 → 实践」因果推演。 -->
<style>
:root{
  --bg:#F7F6F2; --ink:#1B2B33; --ink2:#46585F; --muted:#89938F; --line:#D9D5CB;
  --primary:#245A6B; --prim-l:#E5EFF0; --accent:#BE653B; --acc-l:#F7E9DE;
  --green:#2F7A66; --green-l:#E4F0EA; --gold:#AE8A3E; --pw:520px;
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#E9E7E1}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
#viewport{position:absolute;inset:0 0 58px 0;overflow:hidden}
#stage{position:absolute;width:1600px;height:900px;background:var(--bg);
  transform-origin:top left;box-shadow:0 18px 60px rgba(27,43,51,.13)}
.slide{position:absolute;inset:0;display:none}
.slide.on{display:block;animation:fadein .40s cubic-bezier(.2,.7,.2,1)}
@keyframes fadein{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.eyebrow{position:absolute;left:64px;top:44px;font-size:13px;letter-spacing:3.4px;
  color:var(--primary);font-weight:600}
.eyebrow .num{font-family:var(--mono);letter-spacing:1px;color:var(--accent);margin-right:14px}
h1.title{position:absolute;left:64px;top:70px;margin:0;font-family:var(--serif);
  font-size:44px;line-height:1.25;font-weight:700;letter-spacing:1.2px;color:var(--ink)}
.lede{position:absolute;left:64px;top:139px;width:1440px;font-size:19px;color:var(--ink2);
  line-height:1.5;letter-spacing:.3px}
.rule{position:absolute;left:64px;top:181px;width:1472px;height:1px;background:var(--line)}
.figwrap{position:absolute;left:100px;top:198px;width:1400px;height:430px}
svg.figure{display:block;overflow:visible}
svg.figure text{font-family:var(--sans)}
svg.figure text.serif{font-family:var(--serif)}
svg.figure text.mono{font-family:var(--mono)}
svg.figure text.s{font-family:var(--sans)}
.caption{position:absolute;left:100px;top:640px;width:1400px;font-size:13px;
  color:var(--muted);letter-spacing:.4px}
.bridge{position:absolute;left:64px;top:706px;width:1472px;font-size:20px;
  color:var(--accent);line-height:1.55;letter-spacing:.4px;padding-left:18px;
  border-left:3px solid var(--accent);font-family:var(--serif)}
.bridge .bk{font-family:var(--sans);font-size:13px;color:var(--muted);
  letter-spacing:2px;display:block;margin-bottom:2px}
.footer{position:absolute;left:64px;top:846px;width:1472px;height:1px;background:var(--line)}
.footer .fl{position:absolute;left:0;top:14px;font-size:12.5px;color:var(--muted);letter-spacing:2px}
.footer .fr{position:absolute;right:0;top:12px;font-family:var(--mono);font-size:14px;color:var(--ink2)}
.footer .fbar{position:absolute;left:0;right:0;top:-1px;height:2px;background:transparent}
.footer .fbar i{display:block;height:2px;background:var(--primary);width:0;transition:width .4s ease}

/* 动画页控件：独立条带，绝不覆盖图 */
.ctrls{position:absolute;left:100px;top:636px;width:1400px;height:44px;display:flex;
  align-items:center;gap:10px}
.ctrls label{font-size:13.5px;color:var(--ink2);white-space:nowrap}
.ctrls select{font-family:var(--sans);font-size:13.5px;color:var(--ink);
  background:#fff;border:1px solid var(--line);border-radius:4px;padding:5px 8px;outline:none;max-width:300px}
.ctrls .btn{min-height:30px;padding:5px 14px;border:1px solid var(--primary);border-radius:4px;
  background:#fff;color:var(--primary);font-size:13.5px;cursor:pointer;font-family:var(--sans);white-space:nowrap}
.ctrls .btn.play{background:var(--primary);color:#fff}
.ctrls .btn:hover{filter:brightness(.94)}
.ctrls .out{font-size:13.5px;color:var(--ink2);margin-left:auto;min-width:0;flex:1;
  max-width:620px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.ctrls .out b{color:var(--accent);font-weight:600}

/* 底部外壳：全屏时也始终可见，按键常驻 */
.chrome{position:fixed;left:0;right:0;bottom:0;height:58px;background:#FCFBF8;
  border-top:1px solid var(--line);display:flex;align-items:center;gap:6px;
  padding:0 16px;z-index:60;font-size:13px;color:var(--ink2)}
.chrome .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.chrome button{font-family:var(--sans);font-size:13px;color:var(--ink2);background:transparent;
  border:1px solid transparent;border-radius:5px;padding:7px 10px;cursor:pointer;white-space:nowrap}
.chrome button:hover{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome button.act{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome .pg{font-family:var(--mono);font-size:14px;color:var(--ink);min-width:76px;text-align:center}
.chrome .track{flex:1;min-width:30px;height:3px;background:var(--line);border-radius:3px;margin:0 8px;position:relative}
.chrome .track i{position:absolute;left:0;top:0;height:3px;background:var(--primary);border-radius:3px;transition:width .35s}
.chrome .hint{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 页内右侧开窗：不是弹窗，不遮挡舞台而是把舞台矢量缩到左侧 */
.panel{position:fixed;right:0;top:0;bottom:58px;width:var(--pw);background:#FCFBF8;
  border-left:1px solid var(--line);z-index:45;transform:translateX(103%);
  transition:transform .36s cubic-bezier(.2,.75,.2,1);display:flex;flex-direction:column;
  box-shadow:-16px 0 44px rgba(27,43,51,.10)}
body.panel-on .panel{transform:translateX(0)}
.phead{height:70px;flex:none;padding:0 22px;display:flex;align-items:center;
  justify-content:space-between;border-bottom:1px solid var(--line);background:var(--bg)}
.phead .pm{font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:1.6px;display:block;margin-bottom:3px}
.phead .pt{font-family:var(--serif);font-size:20px;color:var(--ink);line-height:1.2}
.phead button{font-family:var(--sans);font-size:12.5px;color:var(--ink2);background:#fff;
  border:1px solid var(--line);border-radius:5px;padding:7px 11px;cursor:pointer;white-space:nowrap}
.phead button:hover{border-color:var(--primary);color:var(--primary)}
.pbody{flex:1;overflow-y:auto;padding:20px 24px 46px}
.pbody::-webkit-scrollbar{width:8px}
.pbody::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.note-sec{border-top:1px solid var(--line);padding:16px 12px 20px;margin:0 -12px;border-radius:4px}
.note-sec:first-child{border-top:none}
.note-sec.cur{background:var(--prim-l)}
.note-sec .nn{font-family:var(--mono);font-size:11.5px;color:var(--accent);letter-spacing:1.2px}
.note-sec h3{font-family:var(--serif);font-size:19px;color:var(--primary);margin:6px 0 10px;line-height:1.35}
.note-sec p{margin:0;font-size:14.5px;line-height:1.95;color:var(--ink2);letter-spacing:.2px}
.note-sec .br{margin-top:12px;padding-left:12px;border-left:3px solid var(--accent);
  font-family:var(--serif);font-size:14px;color:var(--accent);line-height:1.7}
.note-sec .tip{margin-top:12px;font-size:13px;color:var(--muted);line-height:1.7}
.toc-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.toc-grid a{display:block;padding:11px 12px;border:1px solid var(--line);border-radius:5px;
  background:#fff;text-decoration:none;color:var(--ink);cursor:pointer;transition:.18s}
.toc-grid a:hover{border-color:var(--primary);background:var(--prim-l)}
.toc-grid a.cur{border-color:var(--accent);background:var(--acc-l)}
.toc-grid a .gn{display:block;font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:1px}
.toc-grid a .gt{display:block;font-family:var(--serif);font-size:14px;line-height:1.45;margin-top:4px}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;font-size:13.5px;line-height:1.8}
.keys kbd{font-family:var(--mono);background:#fff;border:1px solid var(--line);
  border-bottom-width:2px;border-radius:4px;padding:2px 7px;color:var(--primary);margin-right:7px}
.help-h{font-family:var(--serif);font-size:21px;color:var(--ink);margin:0 0 6px}
.help-s{font-size:13px;color:var(--muted);margin:0 0 18px}
.toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);background:var(--ink);
  color:#fff;font-size:13px;padding:9px 16px;border-radius:5px;opacity:0;transition:.3s;z-index:80;pointer-events:none}
.toast.on{opacity:1}
body.immersive #viewport{inset:0 0 58px 0}
body.immersive .chrome{background:#FCFBF8}
@media print{.chrome,.panel,.toast{display:none!important}#viewport{position:static}
  #stage{position:static;transform:none!important;box-shadow:none}
  .slide{display:block!important;page-break-after:always;position:relative;height:900px}}
</style>
</head>

<script>
const D = [{"eyebrow":"数据库筑基课 · Anti Join","title":"找出「没有发生过」的那些行","lede":"一句 SQL 问的是缺失，数据库却更愿意把它理解成一次连接。","caption":"图 1：四类业务问句，落到同一个关系代数命题；右侧是本文贯穿始终的示例查询。","bridge":"先别急着选写法，得给「反连接」一个精确定义。","notes":"咱们今天只聊一件事：业务里那些「找出没有发生某件事的对象」。你一定写过——找出没有下过单的用户、找出没有成功支付的订单、找出没被授权的资源、找出没被调度到的分片。这些问句看着完全不同，但把表结构一抽象，它们是同一句话：保留左表里，在右表找不到匹配的那些行。\n有意思的地方在这儿：SQL 写出来是个 WHERE 里的否定条件，人读着像「过滤」，可数据库内部不这么看。它更愿意把这个问题抬成一个连接问题——拿左表每一行去右表问一次「有没有匹配」。为什么？因为一旦抬成连接，优化器就能用整套连接的东西：join order、成本估算、Hash、Merge、Nested Loop。要是留在过滤里，它就只是个黑盒 SubPlan，一次一行地调，什么全局优化都用不上。\n所以这一讲的路线是：先给定义，再拆 PostgreSQL 怎么把三种 SQL 写法收进同一个算子 JOIN_ANTI，然后看执行器真正做了什么，最后回到收益、代价和你该怎么写。原文没有在本机编译启动 PostgreSQL，所以全程不贴伪造的 EXPLAIN 数字；能核对的源码和文档，我都回查过。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><text x=\"40\" y=\"34\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"400\" >业务里反复出现的四类问句</text><rect x=\"40\" y=\"48\" width=\"780\" height=\"52\" rx=\"4\" fill=\"#EBF1EE\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"66\" y=\"77.12\" class=\"sv \" text-anchor=\"start\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"600\" >无订单的用户</text><text x=\"346\" y=\"76.63250000000001\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" >在订单表里找不到这个 user_id</text><rect x=\"40\" y=\"110\" width=\"780\" height=\"52\" rx=\"4\" fill=\"#CFE0DC\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"66\" y=\"139.12\" class=\"sv \" text-anchor=\"start\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"600\" >没有成功支付的订单</text><text x=\"346\" y=\"138.6325\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" >在支付表里找不到 status=success 的匹配</text><rect x=\"40\" y=\"172\" width=\"780\" height=\"52\" rx=\"4\" fill=\"#A4C4C6\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"66\" y=\"201.12\" class=\"sv \" text-anchor=\"start\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"600\" >没有授权记录的资源</text><text x=\"346\" y=\"200.6325\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" >在授权表里找不到对应的 resource_id</text><rect x=\"40\" y=\"234\" width=\"780\" height=\"52\" rx=\"4\" fill=\"#74A5AD\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"66\" y=\"263.12\" class=\"sv \" text-anchor=\"start\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"600\" >没有被任务调度到的分片</text><text x=\"346\" y=\"262.6325\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" >在调度记录里找不到这个 shard_id</text><rect x=\"860\" y=\"48\" width=\"500\" height=\"268\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\" /><text x=\"1110.0\" y=\"114.28999999999999\" class=\"sv \" text-anchor=\"middle\" font-size=\"22.0\" fill=\"#245A6B\" font-weight=\"700\" >保留左表中，在右表找不到匹配的那些行</text><line x1=\"884\" y1=\"158\" x2=\"1336\" y2=\"158\" stroke=\"#245A6B\" stroke-width=\"1\"/><rect x=\"884\" y=\"168\" width=\"452\" height=\"136\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"900\" y=\"192.57142857142858\" class=\"sv mono\" text-anchor=\"start\" font-size=\"10.7\" fill=\"#245A6B\" font-weight=\"400\" >-- 找出没有成功支付记录的订单</text><text x=\"900\" y=\"209.14285714285714\" class=\"sv mono\" text-anchor=\"start\" font-size=\"10.7\" fill=\"#46585F\" font-weight=\"400\" >SELECT o.* FROM orders o</text><text x=\"900\" y=\"225.71428571428572\" class=\"sv mono\" text-anchor=\"start\" font-size=\"10.7\" fill=\"#46585F\" font-weight=\"400\" >WHERE NOT EXISTS (</text><text x=\"900\" y=\"242.28571428571428\" class=\"sv mono\" text-anchor=\"start\" font-size=\"10.7\" fill=\"#46585F\" font-weight=\"400\" >  SELECT 1 FROM payments p</text><text x=\"900\" y=\"258.8571428571429\" class=\"sv mono\" text-anchor=\"start\" font-size=\"10.7\" fill=\"#46585F\" font-weight=\"400\" >  WHERE p.order_id = o.order_id</text><text x=\"900\" y=\"275.42857142857144\" class=\"sv mono\" text-anchor=\"start\" font-size=\"10.7\" fill=\"#46585F\" font-weight=\"400\" >    AND p.status = &#x27;success&#x27;</text><text x=\"900\" y=\"292.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"10.7\" fill=\"#46585F\" font-weight=\"400\" >);</text><rect x=\"40\" y=\"330\" width=\"1320\" height=\"82\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"60\" y=\"374.70500000000004\" class=\"sv \" text-anchor=\"start\" font-size=\"19.0\" fill=\"#BE653B\" font-weight=\"600\" >关键转译</text><text x=\"294\" y=\"373.925\" class=\"sv \" text-anchor=\"start\" font-size=\"15.0\" fill=\"#46585F\" font-weight=\"400\" >这不是一个「负条件过滤器」，而是一个连接算子：A ANTI JOIN B。右表只参与判断，不参与结果。</text></svg>","ctrl":""},{"eyebrow":"一 · 从业务问句出发","title":"三种 SQL，一个共同的追问","lede":"写法不同，结果看着一样；真正拉开差距的是语义边界与优化器能不能接住。","caption":"图 2：三种常见写法汇合到同一个逻辑命题；推荐程度来自 NULL 安全性与改写难度，不是「谁跑得快」。","bridge":"要判断它们是不是真等价，得先把这个算子定义清楚。","notes":"传统写法就这三种。第一种 NOT EXISTS，最直接，语义上就是「不存在满足条件的行」；第二种 LEFT JOIN 加 IS NULL，靠左连接补出来的 NULL 去反推没匹配，读起来很直观，但依赖优化器能不能把它降强度；第三种 NOT IN，写起来最短，也最容易踩坑。\n先说个容易混淆的点：这三种在很多数据约束下结果确实一样，可「结果一样」和「是同一个东西」是两回事。SQL 是声明式语言，你写的是语义，不是执行步骤。优化器得从你的写法里认出这个「找无匹配」的意图，才谈得上生成 JOIN_ANTI；认不出来，它就留在 SubPlan 里逐行求值，join order 和物理算法的选择空间一下子就小了。\n更麻烦的是 NULL。前两种写法里，关联谓词按正常 WHERE 的二值逻辑判断；NOT IN 却落在 SQL 三值逻辑上，只要右侧混进一个 NULL，很多你以为该保留的行会得到 UNKNOWN，然后被 WHERE 悄悄丢掉。这不是性能问题，是结果对不对的问题。\n所以别急着背「谁最快」。我们先把这个算子本身钉死：它输出什么、否决条件是什么、什么时候才算数。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40\" y=\"40\" width=\"400\" height=\"46\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"60\" y=\"65.925\" class=\"sv \" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"600\" >写法一 · 推荐入口</text><rect x=\"40\" y=\"96\" width=\"400\" height=\"216\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"56\" y=\"132.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"400\" >-- NOT EXISTS</text><text x=\"56\" y=\"160.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >SELECT a.*</text><text x=\"56\" y=\"188.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >FROM a</text><text x=\"56\" y=\"216.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >WHERE NOT EXISTS (</text><text x=\"56\" y=\"244.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >  SELECT 1 FROM b</text><text x=\"56\" y=\"272.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >  WHERE b.k = a.k</text><text x=\"56\" y=\"300.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >);</text><line x1=\"240\" y1=\"314\" x2=\"240\" y2=\"328.4\" stroke=\"#2F7A66\" stroke-width=\"1.8\"/><polygon points=\"240,334 236.15,327 243.85,327\" fill=\"#2F7A66\"/><rect x=\"500\" y=\"40\" width=\"400\" height=\"46\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"520\" y=\"65.925\" class=\"sv \" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"600\" >写法二 · 可读，但要看降强度</text><rect x=\"500\" y=\"96\" width=\"400\" height=\"216\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"516\" y=\"143.2\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"400\" >-- LEFT JOIN ... IS NULL</text><text x=\"516\" y=\"182.4\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >SELECT a.*</text><text x=\"516\" y=\"221.60000000000002\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >FROM a LEFT JOIN b</text><text x=\"516\" y=\"260.8\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >  ON b.k = a.k</text><text x=\"516\" y=\"300.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >WHERE b.k IS NULL;</text><line x1=\"700\" y1=\"314\" x2=\"700\" y2=\"328.4\" stroke=\"#AE8A3E\" stroke-width=\"1.8\"/><polygon points=\"700,334 696.15,327 703.85,327\" fill=\"#AE8A3E\"/><rect x=\"960\" y=\"40\" width=\"400\" height=\"46\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"980\" y=\"65.925\" class=\"sv \" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"600\" >写法三 · NULL 语义高风险</text><rect x=\"960\" y=\"96\" width=\"400\" height=\"216\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"976\" y=\"136.66666666666666\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"400\" >-- NOT IN</text><text x=\"976\" y=\"169.33333333333331\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >SELECT a.*</text><text x=\"976\" y=\"202.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >FROM a</text><text x=\"976\" y=\"234.66666666666666\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >WHERE a.k NOT IN (</text><text x=\"976\" y=\"267.3333333333333\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >  SELECT b.k FROM b</text><text x=\"976\" y=\"300.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >);</text><line x1=\"1160\" y1=\"314\" x2=\"1160\" y2=\"328.4\" stroke=\"#BE653B\" stroke-width=\"1.8\"/><polygon points=\"1160,334 1156.15,327 1163.85,327\" fill=\"#BE653B\"/><rect x=\"40\" y=\"340\" width=\"1320\" height=\"74\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"700.0\" y=\"380.315\" class=\"sv \" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"600\" >同一个逻辑命题：保留左表中在右表找不到匹配的行　｜　三条路的差别在 NULL 语义、优化器入口和计划空间</text></svg>","ctrl":""},{"eyebrow":"二 · 它是什么","title":"它不是过滤器，是一个逻辑算子","lede":"JOIN_ANTI：输出每个没有匹配的左侧行的一份副本。","caption":"图 3：形式化定义与三个关键词。源码 src/include/nodes/nodes.h 同时说明：Semi / Anti Join 不出现在 SQL JOIN 语法里，靠 EXISTS 惯用法表达，规划器识别后转换。","bridge":"定义落到具体行上，会看到一条很干脆的否决规则。","notes":"PostgreSQL 在 src/include/nodes/nodes.h 里把 JOIN_ANTI 定义成「1 copy of each LHS row that has no match」，也就是每个没有匹配的左侧行输出一份副本；同一段注释还特意说，输出行保证是 null-extended 的。它和 JOIN_SEMI 都不出现在 SQL 的 JOIN 语法里，是靠 EXISTS 这类标准惯用法表达、由规划器识别转换出来的。\n形式化写就是：A ANTI JOIN B ON predicate 等于所有满足「不存在 b 使 predicate(a,b) 为真」的 a。这句话里有三个词得咬住。第一，只输出左侧行——右表只参与判断，一旦你想 select 右表字段，这就不是反连接了。第二，任意一条匹配都足够否决——右侧有 1 条和 100 条匹配，对结果没有区别，左侧行都不输出；所以右表重复不会像普通 join 那样把结果放大。第三，无匹配才输出——执行器必须把候选匹配都查完、确认都失败，才敢返回这行。\n第三条特别关键，后面讲成本时会反复回来找它：确认「没有」通常比确认「有」贵。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><text x=\"60\" y=\"44\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"400\" >左表 A（外侧）</text><text x=\"560\" y=\"44\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"400\" >右表 B（内侧，只参与判断）</text><text x=\"1000\" y=\"44\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#2F7A66\" font-weight=\"400\" >JOIN_ANTI 输出</text><rect x=\"60\" y=\"60\" width=\"380\" height=\"42\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"250.0\" y=\"83.925\" class=\"sv \" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >a1　·　左侧行</text><rect x=\"60\" y=\"112\" width=\"380\" height=\"42\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"250.0\" y=\"135.925\" class=\"sv \" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >a2　·　左侧行</text><rect x=\"60\" y=\"164\" width=\"380\" height=\"42\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"250.0\" y=\"187.925\" class=\"sv \" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >a3　·　左侧行</text><rect x=\"60\" y=\"216\" width=\"380\" height=\"42\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"250.0\" y=\"239.925\" class=\"sv \" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >a4　·　左侧行</text><rect x=\"560\" y=\"60\" width=\"380\" height=\"42\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"750.0\" y=\"83.925\" class=\"sv \" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#46585F\" font-weight=\"400\" >b1　·　右表候选</text><rect x=\"560\" y=\"112\" width=\"380\" height=\"42\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"750.0\" y=\"135.925\" class=\"sv \" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#46585F\" font-weight=\"400\" >b2　·　右表候选</text><rect x=\"560\" y=\"164\" width=\"380\" height=\"42\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"750.0\" y=\"187.925\" class=\"sv \" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#46585F\" font-weight=\"400\" >b3　·　右表候选</text><line x1=\"440\" y1=\"81\" x2=\"560\" y2=\"81\" stroke=\"#BE653B\" stroke-width=\"2.2\"/><line x1=\"440\" y1=\"185\" x2=\"560\" y2=\"185\" stroke=\"#BE653B\" stroke-width=\"2.2\"/><text x=\"500\" y=\"72\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"400\" >匹配</text><text x=\"500\" y=\"176\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"400\" >匹配</text><rect x=\"1000\" y=\"60\" width=\"360\" height=\"218\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\" /><text x=\"1180.0\" y=\"117.67999999999999\" class=\"sv \" text-anchor=\"middle\" font-size=\"24.0\" fill=\"#2F7A66\" font-weight=\"700\" >输出 a2、a4</text><line x1=\"1014\" y1=\"158\" x2=\"1346\" y2=\"158\" stroke=\"#2F7A66\" stroke-width=\"1\"/><text x=\"1180.0\" y=\"209.57999999999998\" class=\"sv \" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >a1、a3 在右表有匹配，被否决；a2、a4 无匹配</text><text x=\"1180.0\" y=\"229.88\" class=\"sv \" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >，各输出一份副本。右侧列不参与结果。</text><rect x=\"40\" y=\"292\" width=\"1320\" height=\"56\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"700.0\" y=\"323.315\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"600\" >A ANTI JOIN B ON predicate = { a | a ∈ A，且不存在 b ∈ B 使 predicate(a, b) 为 true }</text><rect x=\"40\" y=\"360\" width=\"440\" height=\"60\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"260.0\" y=\"383.62\" class=\"sv \" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" >只输出左侧行</text><text x=\"260.0\" y=\"406.8375\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >右表只参与判断，不进结果列</text><rect x=\"500\" y=\"360\" width=\"440\" height=\"60\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"720.0\" y=\"383.62\" class=\"sv \" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" >任意一条匹配即否决</text><text x=\"720.0\" y=\"406.8375\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >1 条匹配和 100 条匹配，结果一样</text><rect x=\"960\" y=\"360\" width=\"440\" height=\"60\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"1180.0\" y=\"383.62\" class=\"sv \" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" >无匹配才输出</text><text x=\"1180.0\" y=\"406.8375\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >必须确认候选匹配全部失败</text></svg>","ctrl":""},{"eyebrow":"二 · 行级推演","title":"一条匹配，就足够否决一整行","lede":"把四行订单逐行送进探测，输出集合怎么变，一眼看得见。","caption":"","bridge":"有匹配的那面，就是 Semi Join；两者共用同一场探测。","notes":"咱们把图 3 的定义落到具体数据上。左表四行订单，customer 分别是 10、20、10、30；右表支付记录里，customer=10 有两条，一条 success 一条 retry，另外还有一条 customer=40 的。逐行走：order_id=1 的 customer=10，右表第一条就命中，这行直接丢掉，后面那条 retry 根本不用看；order_id=2 的 customer=20，把候选查完没有任何匹配，输出；order_id=3 又是 10，同样丢弃；order_id=4 的 customer=30，无匹配，输出。所以结果是 2 和 4。\n你可以用上面的下拉框改数据自己验证两件事。第一，给 customer=20 补一条成功支付，order_id=2 立刻从输出里消失——这说明「不存在」是绑定在准确的 join 条件上的，条件变了，结论就变。第二，给 customer=10 加三条重复支付，输出还是 2 和 4，一条不多一条不少。这就是刚才说的「任意一条匹配即否决」：右表重复不放大输出，因为 Anti Join 压根不输出有匹配的左侧行；重复只影响探测成本，不影响结果。\n顺带留个业务上的钩子：如果条件写成「没有任何支付」而不是「没有成功支付」，有失败支付但无成功支付的订单就会被错误排除。条件完整性是反连接最容易出事的地方之一。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><text x=\"40\" y=\"48\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"400\" >orders · 外侧左表</text><text x=\"500\" y=\"48\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"400\" >在 payments 中查找匹配</text><text x=\"980\" y=\"48\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#2F7A66\" font-weight=\"400\" >JOIN_ANTI 输出</text><line x1=\"40\" y1=\"56\" x2=\"1360\" y2=\"56\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"40\" y=\"346\" width=\"1320\" height=\"64\" rx=\"5\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><g id=\"aj4dyn\"></g><text x=\"40\" y=\"424\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >图 4 · 行级推演：改变右表数据会改变输出，右表重复记录只改变探测成本。</text></svg>","ctrl":"<label>右表数据</label><select id=\"aj4Sel\">\n<option value=\"0\">原表：10 有两条支付，20 / 30 无支付</option>\n<option value=\"1\">给 customer=20 补一条支付</option>\n<option value=\"2\">给 customer=10 加三条重复支付</option></select>\n<button class=\"btn play\" id=\"aj4Play\">▶ 播放</button><button class=\"btn\" id=\"aj4Step\">单步 →</button>\n<button class=\"btn\" id=\"aj4Reset\">重置</button><span class=\"out\" id=\"aj4Out\"></span>"},{"eyebrow":"二 · 与 Semi Join 对照","title":"同一场探测，两种相反的去留","lede":"Semi 保留有匹配，Anti 保留无匹配；它们都不是「普通 join 再加一层过滤」。","caption":"图 5：同一个外侧行集合、同一组匹配关系，两条分支给出互补的结果集。","bridge":"定义和边界都清楚了，接下来问代价。","notes":"把 Anti Join 和它的镜像 Semi Join 摆在一起，最容易看清它不是什么。同一批外侧行，a1、a3 有匹配，a2、a4 无匹配；优化器要做的是同一场探测，区别只在最后那一下：Semi Join 说「找着了就留」，Anti Join 说「找着了就删」。结果集正好互补。\n为什么强调「不是普通 join 加过滤」？因为普通 inner join 会把每一对匹配都构造成结果行，右表重复会把结果放大；Semi 和 Anti 都只输出左侧行的一份副本，右侧行配对根本不进结果。这不是过滤能表达的——过滤得先有行对，再丢掉，代价结构和语义都不一样。PostgreSQL 干脆为它们在 JoinType 枚举里留了专门的码：JOIN_SEMI、JOIN_ANTI。\n这个对照也解释了后面一件事：既然执行器在 Semi / Anti 里「找到第一条匹配就停」，成本模型就必须为这个提前停止单独修正，不能套普通 join 的估算。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40\" y=\"36\" width=\"1320\" height=\"50\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"60\" y=\"64.315\" class=\"sv \" text-anchor=\"start\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"600\" >同一批外侧行 a1–a4，同一场逐行探测</text><text x=\"514\" y=\"63.6325\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >a1、a3 有匹配；a2、a4 无匹配。右侧只用于判断，两种连接都不输出右侧列。</text><rect x=\"40\" y=\"100\" width=\"660\" height=\"258\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><rect x=\"40\" y=\"100\" width=\"660\" height=\"50\" rx=\"4\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"370.0\" y=\"128.315\" class=\"sv \" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#FFFFFF\" font-weight=\"600\" >JOIN_SEMI · 保留「有匹配」</text><rect x=\"56\" y=\"158\" width=\"628\" height=\"32\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"370.0\" y=\"176.73\" class=\"sv \" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#2F7A66\" font-weight=\"500\" >a1　有匹配　→　输出</text><rect x=\"56\" y=\"196\" width=\"628\" height=\"32\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"370.0\" y=\"214.73\" class=\"sv \" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#89938F\" font-weight=\"500\" >a2　无匹配　→　不输出</text><rect x=\"56\" y=\"234\" width=\"628\" height=\"32\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"370.0\" y=\"252.73\" class=\"sv \" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#2F7A66\" font-weight=\"500\" >a3　有匹配　→　输出</text><rect x=\"56\" y=\"272\" width=\"628\" height=\"32\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"370.0\" y=\"290.73\" class=\"sv \" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#89938F\" font-weight=\"500\" >a4　无匹配　→　不输出</text><rect x=\"56\" y=\"314\" width=\"628\" height=\"34\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"370.0\" y=\"333.925\" class=\"sv \" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"700\" >输出：a1、a3</text><rect x=\"700\" y=\"100\" width=\"660\" height=\"258\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><rect x=\"700\" y=\"100\" width=\"660\" height=\"50\" rx=\"4\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"1030.0\" y=\"128.315\" class=\"sv \" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#FFFFFF\" font-weight=\"600\" >JOIN_ANTI · 保留「无匹配」</text><rect x=\"716\" y=\"158\" width=\"628\" height=\"32\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"1030.0\" y=\"176.73\" class=\"sv \" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#89938F\" font-weight=\"500\" >a1　有匹配　→　不输出</text><rect x=\"716\" y=\"196\" width=\"628\" height=\"32\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"1030.0\" y=\"214.73\" class=\"sv \" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#2F7A66\" font-weight=\"500\" >a2　无匹配　→　输出</text><rect x=\"716\" y=\"234\" width=\"628\" height=\"32\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"1030.0\" y=\"252.73\" class=\"sv \" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#89938F\" font-weight=\"500\" >a3　有匹配　→　不输出</text><rect x=\"716\" y=\"272\" width=\"628\" height=\"32\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"1030.0\" y=\"290.73\" class=\"sv \" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#2F7A66\" font-weight=\"500\" >a4　无匹配　→　输出</text><rect x=\"716\" y=\"314\" width=\"628\" height=\"34\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"1030.0\" y=\"333.925\" class=\"sv \" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"700\" >输出：a2、a4</text><line x1=\"690\" y1=\"100\" x2=\"690\" y2=\"358\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"40\" y=\"372\" width=\"1320\" height=\"48\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1.0\" /><text x=\"60\" y=\"399.12\" class=\"sv \" text-anchor=\"start\" font-size=\"16.0\" fill=\"#AE8A3E\" font-weight=\"600\" >同一场探测，两条相反的去留规则</text><text x=\"474\" y=\"398.53499999999997\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >差别只在于「命中算不算数」；两者都是逻辑算子，都可以落成多种物理算法。</text></svg>","ctrl":""},{"eyebrow":"二 · 边界与代价","title":"语义清晰，代价也很具体","lede":"前三层决定「结果对不对」，最后一层决定「计划贵不贵」。","caption":"图 6：地层越深越底层。四条代价不是注意事项清单，而是后面每一页机制的原因。","bridge":"语义与代价都摆出来了，现在看 PostgreSQL 怎么把 SQL 变成这个算子。","notes":"定义漂亮，不等于用起来省心。我把原文里散落的代价按「层」排一下，越往下越底层。最上面是语义层：右表列不进结果，想要右表字段就别用反连接。第二层是条件层：「不存在」必须绑定准确的 join 条件，少写一个谓词，结果就错——这不是慢一点，是错。第三层是逻辑层：NOT IN 遇到 NULL 走三值逻辑，不能天然等价为 Anti Join。\n第四层往下才轮到性能：反连接的选择率估计依赖统计信息，右侧的 NULL 比例、distinct 值、MCV、多列相关性，都会影响优化器估出来的「有多少外侧行会命中」。这个数一偏，Hash、Merge、Nested Loop 之间的选择就可能整个翻掉。\n请注意这个分层顺序：很多团队一上来就调 work_mem、加索引，其实卡在第三层——SQL 语义本身就是错的。先确认结果对，再谈贵不贵。后面三页讲优化器入口，本质上就是在讲前三层怎么被代码检查、被证明。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40\" y=\"36\" width=\"1320\" height=\"84\" rx=\"4\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1\" /><text x=\"72\" y=\"81.51\" class=\"sv \" text-anchor=\"start\" font-size=\"18.0\" fill=\"#FFFFFF\" font-weight=\"600\" >语义层 · 右侧列不进结果</text><text x=\"512\" y=\"80.8275\" class=\"sv \" text-anchor=\"start\" font-size=\"14.5\" fill=\"#FFFFFF\" font-weight=\"400\" >如果要输出右侧字段，这就不是 Anti Join，得换写法或换模型。</text><rect x=\"40\" y=\"132\" width=\"1320\" height=\"84\" rx=\"4\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1\" /><text x=\"72\" y=\"177.51\" class=\"sv \" text-anchor=\"start\" font-size=\"18.0\" fill=\"#FFFFFF\" font-weight=\"600\" >条件层 · join 条件必须完整</text><text x=\"512\" y=\"176.82750000000001\" class=\"sv \" text-anchor=\"start\" font-size=\"14.5\" fill=\"#FFFFFF\" font-weight=\"400\" >少写一个谓词，「没有成功支付」会退化成「没有任何支付」，结果被误删或误保留。</text><rect x=\"40\" y=\"228\" width=\"1320\" height=\"84\" rx=\"4\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1\" /><text x=\"72\" y=\"273.51\" class=\"sv \" text-anchor=\"start\" font-size=\"18.0\" fill=\"#FFFFFF\" font-weight=\"600\" >逻辑层 · NOT IN 是三值逻辑</text><text x=\"512\" y=\"272.8275\" class=\"sv \" text-anchor=\"start\" font-size=\"14.5\" fill=\"#FFFFFF\" font-weight=\"400\" >NULL 让比较结果变成 UNKNOWN，不能天然等价为反连接；这是正确性边界。</text><rect x=\"40\" y=\"324\" width=\"1320\" height=\"84\" rx=\"4\" fill=\"#74A5AD\" stroke=\"#74A5AD\" stroke-width=\"1\" /><text x=\"72\" y=\"369.51\" class=\"sv \" text-anchor=\"start\" font-size=\"18.0\" fill=\"#1B2B33\" font-weight=\"600\" >估算层 · 依赖统计信息</text><text x=\"512\" y=\"368.8275\" class=\"sv \" text-anchor=\"start\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >右侧 NULL 比例、distinct 值、MCV、多列相关性都会影响选择率与计划选择。</text></svg>","ctrl":""},{"eyebrow":"三 · 核心原理（总览）","title":"三条 SQL 入口，一道会合口","lede":"从 SQL 文本到 JOIN_ANTI，再到物理计划；每条入口都要先过自己的门槛。","caption":"图 7：规划管线总览。三条入口触发条件不同，但成功改写后都汇入同一个 JoinExpr.jointype。","bridge":"先拆最顺的那条：NOT EXISTS 是怎么被拉平的。","notes":"这张图是整讲骨架，后面五页都在拆它。左边三条 SQL 入口，中间三道门槛，汇到中间的 JOIN_ANTI，再往右是 join order 约束、成本估算、物理计划。\n读图先抓住一个判断：所谓「优化」，其实是把一个子查询从黑盒变成一等关系。做成 JOIN_ANTI 之后，优化器能把它放进 jointree，参与全局的 join order 搜索，按代价挑 Hash、Merge 还是 Nested Loop；做不成，它就留在 SubPlan / hashed SubPlan 里，作为扫描上的一个过滤器，一次一行地调用，join 条件也没法下推去驱动索引扫描。原文引用 PostgreSQL 回归测试的预期文件，能看到两侧 NOT NULL 时期望 Hash Anti Join，nullable 时保留 hashed SubPlan，说的就是这个分界。\n三条门槛的严格程度不一样。NOT EXISTS 主要受「子查询能不能拉平」限制；LEFT JOIN 加 IS NULL 需要优化器证明那个 NULL 只可能来自补空；NOT IN 最苛刻，还得跨过 NULL 安全。下面依次拆。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><text x=\"40\" y=\"42\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"400\" >① SQL 入口</text><text x=\"370\" y=\"42\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"400\" >② 优化器门槛</text><text x=\"740\" y=\"42\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"400\" >③ 逻辑算子</text><text x=\"1000\" y=\"42\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"400\" >④ 下游：约束 / 成本 / 物理计划</text><rect x=\"40\" y=\"56\" width=\"290\" height=\"104\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"185.0\" y=\"91.72\" class=\"sv \" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" >NOT EXISTS</text><text x=\"185.0\" y=\"126.60000000000001\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >NOT(EXISTS_SUBLINK)　最贴近业务语义，优化</text><text x=\"185.0\" y=\"144.0\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >器最容易接住</text><rect x=\"370\" y=\"56\" width=\"330\" height=\"104\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"535.0\" y=\"91.52499999999999\" class=\"sv \" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"600\" >pull_up_sublinks()</text><text x=\"535.0\" y=\"126.60000000000001\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >prepjointree.c　拉平顶层子链接；检查 WITH / </text><text x=\"535.0\" y=\"144.0\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >volatile / 父变量位置</text><rect x=\"1000\" y=\"56\" width=\"360\" height=\"104\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"1180.0\" y=\"91.6225\" class=\"sv \" text-anchor=\"middle\" font-size=\"15.5\" fill=\"#1B2B33\" font-weight=\"600\" >SpecialJoinInfo</text><text x=\"1180.0\" y=\"126.60000000000001\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >join_info_list　记录重排边界，join_is_legal() 排除非</text><text x=\"1180.0\" y=\"144.0\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >法顺序</text><line x1=\"332\" y1=\"108\" x2=\"360.4\" y2=\"108\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"366,108 359,104.15 359,111.85\" fill=\"#245A6B\"/><line x1=\"702\" y1=\"108\" x2=\"730.4\" y2=\"108\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"736,108 729,104.15 729,111.85\" fill=\"#245A6B\"/><line x1=\"962\" y1=\"108\" x2=\"990.4\" y2=\"108\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"996,108 989,104.15 989,111.85\" fill=\"#245A6B\"/><rect x=\"40\" y=\"172\" width=\"290\" height=\"104\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"185.0\" y=\"207.72\" class=\"sv \" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" >LEFT JOIN ... IS NULL</text><text x=\"185.0\" y=\"242.59999999999997\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >JOIN_LEFT + IS NULL　靠补空行表达「没匹配</text><text x=\"185.0\" y=\"259.99999999999994\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >到」</text><rect x=\"370\" y=\"172\" width=\"330\" height=\"104\" rx=\"5\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"535.0\" y=\"207.525\" class=\"sv \" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#AE8A3E\" font-weight=\"600\" >reduce_outer_joins()</text><text x=\"535.0\" y=\"242.59999999999997\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >prepjointree.c　证明 IS NULL 只可能来自未匹配补</text><text x=\"535.0\" y=\"259.99999999999994\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >空行</text><rect x=\"1000\" y=\"172\" width=\"360\" height=\"104\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"1180.0\" y=\"207.62249999999997\" class=\"sv \" text-anchor=\"middle\" font-size=\"15.5\" fill=\"#1B2B33\" font-weight=\"600\" >joinpath.c / costsize.c</text><text x=\"1180.0\" y=\"242.59999999999997\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >compute_semi_anti_join_factors()　估命中比例与匹配数</text><text x=\"1180.0\" y=\"259.99999999999994\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >量，修正提前停止</text><line x1=\"332\" y1=\"224\" x2=\"360.4\" y2=\"224\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"366,224 359,220.15 359,227.85\" fill=\"#245A6B\"/><line x1=\"702\" y1=\"224\" x2=\"730.4\" y2=\"224\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"736,224 729,220.15 729,227.85\" fill=\"#245A6B\"/><line x1=\"962\" y1=\"224\" x2=\"990.4\" y2=\"224\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"996,224 989,220.15 989,227.85\" fill=\"#245A6B\"/><rect x=\"40\" y=\"288\" width=\"290\" height=\"104\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"185.0\" y=\"323.72\" class=\"sv \" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" >NOT IN</text><text x=\"185.0\" y=\"367.3\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >NOT(ANY_SUBLINK)　必须跨过 NULL 安全门槛</text><rect x=\"370\" y=\"288\" width=\"330\" height=\"104\" rx=\"5\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"535.0\" y=\"323.52500000000003\" class=\"sv \" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"600\" >convert_ANY_sublink_to_join()</text><text x=\"535.0\" y=\"358.6\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >subselect.c　两侧可证非空 + 操作符安全，才允许 </text><text x=\"535.0\" y=\"376.0\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >under_not</text><rect x=\"1000\" y=\"288\" width=\"360\" height=\"104\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"1180.0\" y=\"323.6225\" class=\"sv \" text-anchor=\"middle\" font-size=\"15.5\" fill=\"#1B2B33\" font-weight=\"600\" >物理计划</text><text x=\"1180.0\" y=\"358.6\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >Hash / Merge / Nested Loop　可出现 Right Anti Join</text><text x=\"1180.0\" y=\"376.0\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >：优化器交换了物理输入方向</text><line x1=\"332\" y1=\"340\" x2=\"360.4\" y2=\"340\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"366,340 359,336.15 359,343.85\" fill=\"#245A6B\"/><line x1=\"702\" y1=\"340\" x2=\"730.4\" y2=\"340\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"736,340 729,336.15 729,343.85\" fill=\"#245A6B\"/><line x1=\"962\" y1=\"340\" x2=\"990.4\" y2=\"340\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"996,340 989,336.15 989,343.85\" fill=\"#245A6B\"/><rect x=\"740\" y=\"56\" width=\"220\" height=\"336\" rx=\"5\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"850.0\" y=\"109.28999999999999\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"22.0\" fill=\"#FFFFFF\" font-weight=\"700\" >JOIN_ANTI</text><line x1=\"760\" y1=\"146\" x2=\"940\" y2=\"146\" stroke=\"#7BA6AF\" stroke-width=\"1\"/><text x=\"850.0\" y=\"187.4375\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#CFE0DC\" font-weight=\"500\" >JoinExpr.jointype</text><text x=\"850.0\" y=\"254.73\" class=\"sv \" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"600\" >只输出左侧无匹配行</text><text x=\"850.0\" y=\"320.73\" class=\"sv \" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"500\" >右侧列不进结果</text><text x=\"850.0\" y=\"367.4375\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#CFE0DC\" font-weight=\"400\" >一个逻辑算子</text><rect x=\"40\" y=\"398\" width=\"1320\" height=\"28\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1\" /><text x=\"58\" y=\"414.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#BE653B\" font-weight=\"500\" >门槛未通过 → 保留 SubPlan / hashed SubPlan：子查询成为不透明过滤器，无法参与全局 join order 搜索。</text></svg>","ctrl":""},{"eyebrow":"三 · 入口一","title":"优化器最容易接住的那条路","lede":"pull_up_sublinks() 拉平，convert_EXISTS_sublink_to_join() 构造 JoinExpr。","caption":"图 8：src/backend/optimizer/plan/subselect.c 的六项检查；任何一项不满足，子链接就留在 SubPlan 里。","bridge":"第二条路要绕一圈：用补出来的 NULL 反推「没匹配」。","notes":"NOT EXISTS 的语义天然就贴着 Anti Join，所以这条路最短。优化器预处理阶段的入口是 prepjointree.c 里的 pull_up_sublinks()，它尝试把顶层 ANY、EXISTS 子链接拉进 jointree，作为 Semi 或 Anti Join 处理。真正构造 JoinExpr 的是 subselect.c 里的 convert_EXISTS_sublink_to_join()：调用者发现的是 NOT EXISTS 时，参数 under_not 为 true，函数直接把 result->jointype 设成 JOIN_ANTI。\n但它有一串检查，图里列了六条。含 WITH 的 EXISTS 会被拒绝，因为把 WITH 提到父查询可能改变「执行一次还是多次」；simplify_EXISTS_query() 会去掉和 EXISTS 结果无关的 target list；子查询剩余主体不能还引用父查询变量，关联条件得集中在 WHERE；WHERE 又必须真的引用父查询变量，否则压根不是 join；最后，WHERE 里不能有 volatile 函数，否则改写会改变副作用或求值次数。\n这串检查直接给出一条实践建议：关联条件写在子查询 WHERE 里，别散在 SELECT 列表或更深层；子查询里也别放有副作用的函数。官方文档还提醒，EXISTS 通常只执行到能判断是否存在为止，不会完整跑完——放副作用函数进去，行为就不可预期了。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><text x=\"40\" y=\"42\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"400\" >SQL 写法</text><text x=\"470\" y=\"42\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"400\" >convert_EXISTS_sublink_to_join() 的检查清单</text><rect x=\"40\" y=\"56\" width=\"400\" height=\"250\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"56\" y=\"80\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"600\" >src/backend/optimizer/prep/prepjointree.c</text><text x=\"56\" y=\"117.42857142857143\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >SELECT a.*</text><text x=\"56\" y=\"146.85714285714286\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >FROM a</text><text x=\"56\" y=\"176.28571428571428\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >WHERE NOT EXISTS (</text><text x=\"56\" y=\"205.71428571428572\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >  SELECT 1 FROM b</text><text x=\"56\" y=\"235.14285714285714\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >  WHERE b.k = a.k</text><text x=\"56\" y=\"264.57142857142856\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >    AND b.status = &#x27;ok&#x27;</text><text x=\"56\" y=\"294.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >);</text><line x1=\"442\" y1=\"180\" x2=\"460.4\" y2=\"180\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"466,180 459,176.15 459,183.85\" fill=\"#245A6B\"/><rect x=\"470\" y=\"56\" width=\"430\" height=\"78\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"486\" y=\"77.8275\" class=\"sv \" text-anchor=\"start\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"600\" >① 顶层 WHERE / JOIN ON</text><text x=\"486\" y=\"113.24249999999999\" class=\"sv \" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >pull_up_sublinks() 只尝试拉平顶层可处理的 ANY / EXISTS 子链接。</text><rect x=\"920\" y=\"56\" width=\"430\" height=\"78\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"936\" y=\"77.8275\" class=\"sv \" text-anchor=\"start\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"600\" >② under_not = true</text><text x=\"936\" y=\"113.24249999999999\" class=\"sv \" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >调用者发现 NOT EXISTS 时传入，函数据此设 jointype = JOIN_ANTI。</text><rect x=\"470\" y=\"144\" width=\"430\" height=\"78\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"486\" y=\"165.82750000000001\" class=\"sv \" text-anchor=\"start\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"600\" >③ 拒绝含 WITH 的 EXISTS</text><text x=\"486\" y=\"201.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >把 WITH 拉到父查询会改变「执行一次还是多次」的语义。</text><rect x=\"920\" y=\"144\" width=\"430\" height=\"78\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"936\" y=\"165.82750000000001\" class=\"sv \" text-anchor=\"start\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"600\" >④ simplify_EXISTS_query()</text><text x=\"936\" y=\"201.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >去掉与 EXISTS 结果无关的 target list，只保留判断所需的主体。</text><rect x=\"470\" y=\"232\" width=\"430\" height=\"78\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"486\" y=\"253.82750000000001\" class=\"sv \" text-anchor=\"start\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"600\" >⑤ 父变量只在 WHERE</text><text x=\"486\" y=\"289.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >子查询剩余主体不能再引用父查询变量，关联条件要集中在 WHERE。</text><rect x=\"920\" y=\"232\" width=\"430\" height=\"78\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"936\" y=\"253.82750000000001\" class=\"sv \" text-anchor=\"start\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"600\" >⑥ 必须引用父变量且无 volatile</text><text x=\"936\" y=\"289.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >否则不构成 join；volatile 函数会因改写改变副作用或求值次数。</text><rect x=\"40\" y=\"326\" width=\"1320\" height=\"82\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1.0\" /><text x=\"60\" y=\"370.70500000000004\" class=\"sv \" text-anchor=\"start\" font-size=\"19.0\" fill=\"#2F7A66\" font-weight=\"600\" >改写成功 → JOIN_ANTI</text><text x=\"344\" y=\"369.73\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >实践建议：表达「没有匹配」优先写 NOT EXISTS，把关联键和业务过滤条件完整放进子查询 WHERE；这既贴合语义，也给优化器最清晰的入口。</text></svg>","ctrl":""},{"eyebrow":"三 · 入口二","title":"补出来的 NULL，和本来就有的 NULL","lede":"LEFT JOIN ... IS NULL 能否降强度，取决于优化器能不能证明 NULL 只来自补空。","caption":"图 9：a=3 那一行是陷阱——它匹配到了，但 b.z 本身就是 NULL；若检查 b.z IS NULL，会被误当成未匹配。","bridge":"最凶险的是第三条入口：NOT IN 连二值逻辑都不保证。","notes":"很多开发者喜欢写 LEFT JOIN 加 IS NULL：左连接保留所有 a，b 没匹配时右侧列补 NULL，再用 WHERE b.k IS NULL 把补空行挑出来。逻辑成立，但有个前提——那个 IS NULL 必须只能代表「没匹配」。\n看左边这张结果表。a=2 和 a=4 是真正的 null-extended 行；可 a=3 呢？它匹配到了 b=3，只是 b.z 这个业务字段本来就是 NULL。如果你检查的恰好是 b.z，a=3 就会被当成「无匹配」混进结果，答案错了。\nPostgreSQL 的 reduce_outer_joins() 会识别这类模式，但只在「能证明」的时候把 JOIN_LEFT 改成 JOIN_ANTI。证明来源有三类：join 条件本身对右侧变量是 strict 的，比如等值条件涉及的右侧 key；右侧列有已验证的 NOT NULL 约束；以及这一列没有被更低层外连接重新 nullable 化。prepjointree.c 的注释给的例子就是 SELECT ... FROM a LEFT JOIN b ON (a.x = b.y) WHERE b.z IS NULL。\n所以原文 DEMO 里检查的是 p.order_id，而不是某个业务状态字段：order_id 同时出现在 strict 等值条件里，优化器更容易证明这个 NULL 来自补空。这一条落到日常习惯就是——别拿可空的右表业务列做 IS NULL 判断。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><text x=\"40\" y=\"42\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"400\" >LEFT JOIN 之后的结果（a 为左表）</text><text x=\"580\" y=\"42\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"400\" >reduce_outer_joins() 要证明什么</text><text x=\"990\" y=\"42\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"400\" >两种结局</text><rect x=\"40\" y=\"56\" width=\"100\" height=\"38\" rx=\"3\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"90.0\" y=\"77.535\" class=\"sv \" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#FFFFFF\" font-weight=\"600\" >a.k</text><rect x=\"140\" y=\"56\" width=\"110\" height=\"38\" rx=\"3\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"195.0\" y=\"77.535\" class=\"sv \" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#FFFFFF\" font-weight=\"600\" >b.k</text><rect x=\"250\" y=\"56\" width=\"110\" height=\"38\" rx=\"3\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"305.0\" y=\"77.535\" class=\"sv \" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#FFFFFF\" font-weight=\"600\" >b.z</text><rect x=\"360\" y=\"56\" width=\"200\" height=\"38\" rx=\"3\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"460.0\" y=\"77.535\" class=\"sv \" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#FFFFFF\" font-weight=\"600\" >这一行是什么</text><rect x=\"40\" y=\"94\" width=\"100\" height=\"48\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"90.0\" y=\"120.4375\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >1</text><rect x=\"140\" y=\"94\" width=\"110\" height=\"48\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"195.0\" y=\"120.4375\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >1</text><rect x=\"250\" y=\"94\" width=\"110\" height=\"48\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"305.0\" y=\"120.4375\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >&#x27;x&#x27;</text><rect x=\"360\" y=\"94\" width=\"200\" height=\"48\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"372\" y=\"120.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >真实匹配行</text><rect x=\"40\" y=\"142\" width=\"100\" height=\"48\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"90.0\" y=\"168.4375\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >2</text><rect x=\"140\" y=\"142\" width=\"110\" height=\"48\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"195.0\" y=\"168.4375\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >NULL</text><rect x=\"250\" y=\"142\" width=\"110\" height=\"48\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"305.0\" y=\"168.4375\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >NULL</text><rect x=\"360\" y=\"142\" width=\"200\" height=\"48\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"372\" y=\"159.375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >未匹配补空（null-extended</text><text x=\"372\" y=\"177.5\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >）</text><rect x=\"40\" y=\"190\" width=\"100\" height=\"48\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"90.0\" y=\"216.4375\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >3</text><rect x=\"140\" y=\"190\" width=\"110\" height=\"48\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"195.0\" y=\"216.4375\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >3</text><rect x=\"250\" y=\"190\" width=\"110\" height=\"48\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"305.0\" y=\"216.4375\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >NULL</text><rect x=\"360\" y=\"190\" width=\"200\" height=\"48\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"372\" y=\"207.375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >匹配到了，但 b.z 本来就是 </text><text x=\"372\" y=\"225.5\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >NULL</text><rect x=\"40\" y=\"238\" width=\"100\" height=\"48\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"90.0\" y=\"264.4375\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >4</text><rect x=\"140\" y=\"238\" width=\"110\" height=\"48\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"195.0\" y=\"264.4375\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >NULL</text><rect x=\"250\" y=\"238\" width=\"110\" height=\"48\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"305.0\" y=\"264.4375\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >NULL</text><rect x=\"360\" y=\"238\" width=\"200\" height=\"48\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"372\" y=\"255.375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >未匹配补空（null-extended</text><text x=\"372\" y=\"273.5\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >）</text><rect x=\"580\" y=\"56\" width=\"380\" height=\"240\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"592\" y=\"66\" width=\"356\" height=\"68\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"608\" y=\"84.63250000000001\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"600\" >strict 等值条件</text><text x=\"608\" y=\"116.34\" class=\"sv \" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >join 条件里涉及的右侧 key，在匹配行中不可能为 NULL。</text><rect x=\"592\" y=\"144\" width=\"356\" height=\"68\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"608\" y=\"162.6325\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"600\" >已验证的 NOT NULL</text><text x=\"608\" y=\"194.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >右侧列上有可证明的 NOT NULL 约束。</text><rect x=\"592\" y=\"222\" width=\"356\" height=\"68\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"608\" y=\"240.6325\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"600\" >未被重新 nullable 化</text><text x=\"608\" y=\"272.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >该列没有被更低层的外连接再次变成可空。</text><line x1=\"562\" y1=\"176\" x2=\"571.2\" y2=\"176\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"576,176 570,172.7 570,179.3\" fill=\"#245A6B\"/><line x1=\"962\" y1=\"125\" x2=\"981.2\" y2=\"125\" stroke=\"#2F7A66\" stroke-width=\"1.8\"/><polygon points=\"986,125 980,121.7 980,128.3\" fill=\"#2F7A66\"/><line x1=\"962\" y1=\"250\" x2=\"981.2\" y2=\"250\" stroke=\"#BE653B\" stroke-width=\"1.8\"/><polygon points=\"986,250 980,246.7 980,253.3\" fill=\"#BE653B\"/><rect x=\"990\" y=\"56\" width=\"370\" height=\"108\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\" /><text x=\"1175.0\" y=\"84.12\" class=\"sv \" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#2F7A66\" font-weight=\"700\" >能证明 → 降强度为 JOIN_ANTI</text><text x=\"1175.0\" y=\"134.4375\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >b.z IS NULL 只可能筛出补空行，等价于反半连接。</text><rect x=\"990\" y=\"180\" width=\"370\" height=\"108\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\" /><text x=\"1175.0\" y=\"208.12\" class=\"sv \" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#BE653B\" font-weight=\"700\" >不能证明 → 保留 JOIN_LEFT</text><text x=\"1175.0\" y=\"249.375\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >WHERE b.z IS NULL 可能在找「匹配到了但字段为 NULL</text><text x=\"1175.0\" y=\"267.5\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >」的行。</text><rect x=\"40\" y=\"312\" width=\"1320\" height=\"96\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1.0\" /><text x=\"60\" y=\"363.51\" class=\"sv \" text-anchor=\"start\" font-size=\"18.0\" fill=\"#AE8A3E\" font-weight=\"600\" >检查哪一列，决定结果对不对</text><text x=\"374\" y=\"352.58\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >应检查 join key 或有 NOT NULL 约束的列，而不是右表可空的业务字段。原文 DEMO 用 p.order_id IS NULL，因为它同时出现在 strict 等值 </text><text x=\"374\" y=\"372.88\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >join 条件里。</text></svg>","ctrl":""},{"eyebrow":"三 · 入口三","title":"一个 NULL，把整行判成 UNKNOWN","lede":"SELECT 2 NOT IN (1, NULL) 的结果既不是 true，也不是 false。","caption":"","bridge":"那 NOT IN 到底什么时候能变成 Anti Join？这里有一道版本分水岭。","notes":"NOT IN 是 Anti Join 教学里最重要的坑，而且它是正确性问题，不是性能问题。官方文档 doc/src/sgml/func/func-subquery.sgml 讲得很清楚：EXISTS 的结果只取决于子查询是否返回至少一行；IN 等价于 = ANY；而 NOT IN 在两种情况下返回 NULL 而不是 true——左侧表达式为 NULL，或者右侧没有相等值、但至少有一个右侧行让比较结果为 NULL。\n拿最经典的例子：SELECT 2 NOT IN (1, NULL)。按三值逻辑展开，2=1 是 FALSE，2=NULL 是 UNKNOWN；OR 累积里只要没有 TRUE 又混着 UNKNOWN，整体就是 UNKNOWN；NOT 取反还是 UNKNOWN；到了 WHERE，UNKNOWN 和 false 一样不保留行。于是这行被丢掉。可如果按 Anti Join 的语义，「右表没有相等值」应该保留这一行。两者分道扬镳，就分在 UNKNOWN 上。\n上面的动画可以换左值和右侧集合自己走一遍。你会看到 (2, NULL) 这种「先命中」的情况反而不分歧：只要 OR 里出现 TRUE，UNKNOWN 就被盖过去了。所以真正的边界是「没有相等值且存在 NULL」。这也是为什么 WHERE a.k NOT IN (SELECT b.k FROM b) 只有在能证明两侧都不可能为 NULL、且操作符对非 NULL 输入不会返回 NULL 时，才等价于 NOT EXISTS。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><text x=\"40\" y=\"48\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"400\" >三值逻辑逐步演算：x NOT IN (v1, v2)</text><text x=\"920\" y=\"48\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"400\" >累积真值</text><line x1=\"40\" y1=\"56\" x2=\"1360\" y2=\"56\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"40\" y=\"346\" width=\"1320\" height=\"64\" rx=\"5\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><g id=\"aj10dyn\"></g><text x=\"40\" y=\"424\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >图 10 · 改变左值与右侧集合，观察 UNKNOWN 如何把整行从结果里拿掉。</text></svg>","ctrl":"<label>右侧集合</label><select id=\"aj10Sel\">\n<option value=\"a\">(1, NULL) · 经典陷阱</option><option value=\"b\">(1, 2) · 有相等值</option>\n<option value=\"c\">(NULL, 2) · 含 NULL</option><option value=\"d\">(2, NULL) · 先命中</option></select>\n<label>左值</label><select id=\"aj10Left\"><option value=\"2\">2</option><option value=\"NULL\">NULL</option><option value=\"1\">1</option></select>\n<button class=\"btn play\" id=\"aj10Play\">▶ 播放</button><button class=\"btn\" id=\"aj10Step\">单步 →</button>\n<button class=\"btn\" id=\"aj10Reset\">重置</button><span class=\"out\" id=\"aj10Out\"></span>"},{"eyebrow":"三 · 入口三（实证补充）","title":"门槛写在代码里，也写在版本里","lede":"PG 18 及更早：即使两侧 NOT NULL，NOT IN 也始终是 SubPlan。","caption":"图 11：2008 年提出的证明条件，2026 年 3 月才随 commit 383eb21eb 落地 master；此处为源码与邮件列表事实，非性能实测。","bridge":"好不容易进了 JOIN_ANTI，也别以为可以随便重排。","notes":"这一页是我在原文之外补的实证，因为它直接关系到你会不会把 demo 结论用错版本。Tom Lane 在 2008 年那封讨论 IN vs EXISTS 等价性的邮件里就说过：想优化 NOT IN，光靠 NOT NULL 约束不够，还得假设比较操作符对非 NULL 输入永远不会返回 NULL，而当时并没有这样的显式知识，所以他建议继续告诉大家避开 NOT IN。十八年过去，这条优化才真正落地。\n2026 年 3 月 12 日，Richard Guo 的 commit 383eb21eb「Convert NOT IN sublinks to anti-joins when safe」合入 master，面向 PostgreSQL 19。补丁要证明三件事：外层表达式非空，来自 NOT NULL 约束、外连接可空 Var 元数据以及条件推导；子查询输出列非空；操作符属于 B-tree 或 Hash 操作符族——用这个成员资格当作「非 NULL 输入不会返回 NULL」的代理，因为真会返回 NULL 的操作符会破坏它自己声称支持的索引。\n关键的版本结论是：REL_18 及更早完全没有这个分支。有资料在 18.4 上把两侧都声明 NOT NULL 重跑，计划依旧是不透明的 SubPlan。所以原文 DEMO 那句「如果你的版本支持转换，第二个查询更可能出现 Anti Join」必须按版本解读；在老版本上，正确做法仍然是改写为 NOT EXISTS。这也是「回查源码」比「背结论」更值钱的地方。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><text x=\"40\" y=\"34\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"400\" >一条走了十八年的路：NOT IN → Anti Join</text><rect x=\"40\" y=\"46\" width=\"420\" height=\"84\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"56\" y=\"67.8275\" class=\"sv \" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"600\" >2008 · pgsql-hackers</text><text x=\"56\" y=\"96.64\" class=\"sv \" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >Tom Lane 在讨论 IN vs EXISTS 等价性时指出：NOT IN 的改写要同</text><text x=\"56\" y=\"114.03999999999999\" class=\"sv \" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >时证明操作数非空与操作符安全，当时未实现。</text><line x1=\"462\" y1=\"88\" x2=\"491.2\" y2=\"88\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><polygon points=\"496,88 490,84.7 490,91.3\" fill=\"#245A6B\"/><rect x=\"500\" y=\"46\" width=\"420\" height=\"84\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"516\" y=\"67.8275\" class=\"sv \" text-anchor=\"start\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"600\" >2026-03-12 · commit 383eb21eb</text><text x=\"516\" y=\"96.64\" class=\"sv \" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >Richard Guo 的补丁合入 master，首次在安全时把 NOT IN 转为反连</text><text x=\"516\" y=\"114.03999999999999\" class=\"sv \" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >接，面向 PostgreSQL 19。</text><line x1=\"922\" y1=\"88\" x2=\"951.2\" y2=\"88\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><polygon points=\"956,88 950,84.7 950,91.3\" fill=\"#245A6B\"/><rect x=\"960\" y=\"46\" width=\"420\" height=\"84\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"976\" y=\"67.8275\" class=\"sv \" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"600\" >master → PostgreSQL 19</text><text x=\"976\" y=\"96.64\" class=\"sv \" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >REL_18 及更早不含该转换：即使两侧都声明 NOT NULL，计划仍是 </text><text x=\"976\" y=\"114.03999999999999\" class=\"sv \" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >SubPlan / hashed SubPlan。</text><rect x=\"40\" y=\"142\" width=\"420\" height=\"102\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"40\" y=\"142\" width=\"420\" height=\"34\" rx=\"4\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"58\" y=\"161.925\" class=\"sv \" text-anchor=\"start\" font-size=\"15.0\" fill=\"#FFFFFF\" font-weight=\"600\" >① 外层表达式非空</text><text x=\"58\" y=\"203.375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >NOT NULL 约束、外连接可空 Var 元数据、以及条件推导出的非空</text><text x=\"58\" y=\"221.5\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >变量。</text><rect x=\"500\" y=\"142\" width=\"420\" height=\"102\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"500\" y=\"142\" width=\"420\" height=\"34\" rx=\"4\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"518\" y=\"161.925\" class=\"sv \" text-anchor=\"start\" font-size=\"15.0\" fill=\"#FFFFFF\" font-weight=\"600\" >② 子查询输出非空</text><text x=\"518\" y=\"203.375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >query_outputs_are_not_nullable() 检查子查询结果列是否可能</text><text x=\"518\" y=\"221.5\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >为 NULL。</text><rect x=\"960\" y=\"142\" width=\"420\" height=\"102\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"960\" y=\"142\" width=\"420\" height=\"34\" rx=\"4\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"978\" y=\"161.925\" class=\"sv \" text-anchor=\"start\" font-size=\"15.0\" fill=\"#FFFFFF\" font-weight=\"600\" >③ 操作符安全</text><text x=\"978\" y=\"203.375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >操作符必须属于 B-tree 或 Hash 操作符族，作为「非 NULL 输入</text><text x=\"978\" y=\"221.5\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >不返回 NULL」的代理。</text><rect x=\"40\" y=\"258\" width=\"640\" height=\"96\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\" /><text x=\"360.0\" y=\"283.315\" class=\"sv \" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#BE653B\" font-weight=\"700\" >PG 18 及更早 · 一律 SubPlan</text><text x=\"360.0\" y=\"318.375\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >子查询是不透明过滤器：不能参与全局 join order，不能下推外层 join 条件驱动索引扫描，也没有多批</text><text x=\"360.0\" y=\"336.5\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >次落盘逻辑。</text><rect x=\"720\" y=\"258\" width=\"640\" height=\"96\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\" /><text x=\"1040.0\" y=\"283.315\" class=\"sv \" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#2F7A66\" font-weight=\"700\" >PG 19（master）· 可改写为 JOIN_ANTI</text><text x=\"1040.0\" y=\"327.4375\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >三道证明全部通过后才转换：子链接变成一等关系，按代价挑选物理连接算法。</text><rect x=\"40\" y=\"366\" width=\"1320\" height=\"52\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"64\" y=\"394.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >事实核对：commit 消息、回归测试 src/test/regress/sql/subselect.sql 与 pgsql-hackers 讨论；原文 DEMO 中「加 IS NOT NULL 后更可能出现 Anti Join」需按实际版本解读。</text></svg>","ctrl":""},{"eyebrow":"三 · Join order","title":"反连接会收窄优化器的搜索空间","lede":"它不是 inner join 加一层过滤，位置挪错会改变「哪些行算有匹配」。","caption":"图 12：优化器 README 明确排除非法重排；src/include/nodes/pathnodes.h 说明外连接、Semi、Anti 都会存 SpecialJoinInfo 到 join_info_list。","bridge":"顺序定下来之后，才轮到挑物理算法。","notes":"PostgreSQL 优化器 README 在讲 join 重排时有句话很硬：ANTI joins work approximately like LEFT joins，但不能把反连接重排进左连接或反连接的右侧，也不能从这些右侧移出来，即使相关子句是 strict 的。原因是 identity 3 在反连接上会失效。\n用业务话说：Anti Join 的右侧只用来否决左侧行。你要是把这个右侧提前或滞后到错误位置，「哪些左侧行被认为存在匹配」的范围就变了，答案跟着变。这不是优化器保守，是语义不允许。\n实现上，外连接、Semi、Anti 都会在 PlannerInfo.join_info_list 里留一个 SpecialJoinInfo，记录两侧的最小 Relid 集合；join_is_legal() 拿这张表去排除非法 join order。对 DBA 来说，这解释了两个常见现象：一是复杂查询里反连接会让可选计划明显变少；二是你把 SQL 结构改写一下，哪怕人读着逻辑等价，也可能得到完全不同的 join order 和物理算法。所以「少一层子查询看起来更简洁」这种改法，值不值得，得看 EXPLAIN，不能看代码行数。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40\" y=\"36\" width=\"1320\" height=\"62\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"58\" y=\"56.339999999999996\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#245A6B\" font-weight=\"500\" >README: ANTI joins work approximately like LEFT joins ... we can&#x27;t reorder antijoins into or out of the RHS of a leftjoin or antijoin, even if the relevant clause is strict.</text><text x=\"58\" y=\"84.34\" class=\"sv \" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >译：反连接大致像左连接，但不能重排进左连接／反连接的右侧，也不能从这些右侧移出——即使子句是 strict 的。</text><rect x=\"40\" y=\"110\" width=\"640\" height=\"226\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><rect x=\"40\" y=\"110\" width=\"640\" height=\"42\" rx=\"4\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"360.0\" y=\"134.12\" class=\"sv \" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#FFFFFF\" font-weight=\"600\" >合法 · LHS 侧可以自由重关联</text><rect x=\"58\" y=\"164\" width=\"604\" height=\"56\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"360.0\" y=\"194.73\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"500\" >(A ANTI JOIN B ON Pab)  INNER JOIN C ON Pac</text><rect x=\"58\" y=\"230\" width=\"604\" height=\"56\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"360.0\" y=\"260.53499999999997\" class=\"sv \" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >非 FULL join 可关联进外连接的左侧；C 放进来不改变「哪些左侧行有匹配」。</text><text x=\"360.0\" y=\"313.53499999999997\" class=\"sv \" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#2F7A66\" font-weight=\"600\" >结果：join order 搜索空间仍然开阔。</text><rect x=\"700\" y=\"110\" width=\"660\" height=\"226\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><rect x=\"700\" y=\"110\" width=\"660\" height=\"42\" rx=\"4\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"1030.0\" y=\"134.12\" class=\"sv \" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#FFFFFF\" font-weight=\"600\" >非法 · 移进／移出 RHS 会改变结果</text><rect x=\"718\" y=\"164\" width=\"624\" height=\"56\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"1030.0\" y=\"194.73\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"500\" >A LEFT JOIN (B ANTI JOIN C ON Pbc) ON Pab</text><rect x=\"718\" y=\"230\" width=\"624\" height=\"56\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"1030.0\" y=\"260.53499999999997\" class=\"sv \" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >identity 3 在 antijoin 上失效：右侧是否「存在匹配」的范围被改写，答案会变。</text><text x=\"1030.0\" y=\"313.53499999999997\" class=\"sv \" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#BE653B\" font-weight=\"600\" >机制：SpecialJoinInfo 记录边界，join_is_legal() 排除非法顺序。</text><rect x=\"40\" y=\"348\" width=\"1320\" height=\"38\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#F1EFE9\" stroke-width=\"1.0\" /><text x=\"60\" y=\"369.73\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"600\" >现象一</text><text x=\"214\" y=\"369.53499999999997\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >复杂查询里，反连接会限制优化器的 join order 搜索空间，可选计划变少。</text><rect x=\"40\" y=\"392\" width=\"1320\" height=\"34\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#F1EFE9\" stroke-width=\"1.0\" /><text x=\"60\" y=\"411.73\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"600\" >现象二</text><text x=\"214\" y=\"411.53499999999997\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >改写 SQL 结构后，即使逻辑相似，也可能得到完全不同的 join order 和物理算法。</text></svg>","ctrl":""},{"eyebrow":"三 · 路径生成","title":"JOIN_ANTI 是一句话，落地有四条路","lede":"回归测试预期文件里能看到 Hash、Merge、Nested Loop 以及 Right Anti 等形态。","caption":"图 13：joinpath.c 为 join relation 生成可选路径；同一语义由不同物理查找方式实现。","bridge":"优化器凭什么在这几条里选？看成本模型。","notes":"JOIN_ANTI 是逻辑层的东西，落到执行计划并不只有一种形态。PostgreSQL 回归测试的预期文件里能看到 Hash Anti Join、Merge Anti Join、Nested Loop Anti Join、Hash Right Anti Join、Merge Right Anti Join 这些名字。joinpath.c 会为 join relation 生成可选路径，再按代价挑一条。\n四条路的区别在「怎么找匹配」：Hash 是构建 hash table 后逐行探 bucket，怕 work_mem 不够导致分批和落临时文件；Merge 是两侧有序后按 key group 推进，怕排序成本和重复 key；Nested Loop 是每个外侧行做一次内侧索引探测，最怕外侧行数被低估、loops 爆掉；Right Anti 则是优化器认为交换物理输入方向更便宜。\n特别提醒最后一个：看到 Hash Right Anti Join 别以为业务 SQL 里写了 right join，那只是物理方向交换。读计划要看 Hash Cond、输出列，确认谁才是逻辑上被保留的那一侧。原文把这个列为常见坑之一，因为它最容易让人把结果解释反。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40\" y=\"36\" width=\"1320\" height=\"56\" rx=\"4\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"700.0\" y=\"67.9\" class=\"sv \" text-anchor=\"middle\" font-size=\"20.0\" fill=\"#FFFFFF\" font-weight=\"700\" >JOIN_ANTI　·　一个逻辑算子，不是单一物理算法</text><line x1=\"185\" y1=\"92\" x2=\"1235\" y2=\"92\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><line x1=\"700\" y1=\"92\" x2=\"700\" y2=\"112\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><line x1=\"185\" y1=\"92\" x2=\"185\" y2=\"122\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><line x1=\"185\" y1=\"112\" x2=\"185\" y2=\"117.2\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><polygon points=\"185,122 181.7,116 188.3,116\" fill=\"#245A6B\"/><rect x=\"40\" y=\"126\" width=\"290\" height=\"222\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><rect x=\"40\" y=\"126\" width=\"290\" height=\"44\" rx=\"4\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1\" /><text x=\"185.0\" y=\"150.925\" class=\"sv \" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#FFFFFF\" font-weight=\"700\" >Hash Anti Join</text><text x=\"58\" y=\"195.375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >查找方式　构建 hash table，逐行探测 </text><text x=\"58\" y=\"213.5\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >bucket</text><text x=\"58\" y=\"247.375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#BE653B\" font-weight=\"400\" >主要风险　work_mem 不足导致 batch 或落</text><text x=\"58\" y=\"265.5\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#BE653B\" font-weight=\"400\" >临时文件</text><text x=\"58\" y=\"312.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#2F7A66\" font-weight=\"400\" >适用边界　等值条件，右侧可接受构建集</text><line x1=\"535\" y1=\"92\" x2=\"535\" y2=\"122\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><line x1=\"535\" y1=\"112\" x2=\"535\" y2=\"117.2\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><polygon points=\"535,122 531.7,116 538.3,116\" fill=\"#245A6B\"/><rect x=\"390\" y=\"126\" width=\"290\" height=\"222\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><rect x=\"390\" y=\"126\" width=\"290\" height=\"44\" rx=\"4\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1\" /><text x=\"535.0\" y=\"150.925\" class=\"sv \" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#FFFFFF\" font-weight=\"700\" >Merge Anti Join</text><text x=\"408\" y=\"204.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >查找方式　两侧有序后按 key group 推进</text><text x=\"408\" y=\"256.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#BE653B\" font-weight=\"400\" >主要风险　排序成本、重复 key group 成本</text><text x=\"408\" y=\"312.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#2F7A66\" font-weight=\"400\" >适用边界　两侧已有顺序或排序便宜</text><line x1=\"885\" y1=\"92\" x2=\"885\" y2=\"122\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><line x1=\"885\" y1=\"112\" x2=\"885\" y2=\"117.2\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><polygon points=\"885,122 881.7,116 888.3,116\" fill=\"#245A6B\"/><rect x=\"740\" y=\"126\" width=\"290\" height=\"222\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><rect x=\"740\" y=\"126\" width=\"290\" height=\"44\" rx=\"4\" fill=\"#74A5AD\" stroke=\"#74A5AD\" stroke-width=\"1\" /><text x=\"885.0\" y=\"150.925\" class=\"sv \" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"700\" >Nested Loop Anti Join</text><text x=\"758\" y=\"204.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >查找方式　每个外侧行做一次内侧索引探测</text><text x=\"758\" y=\"256.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"
