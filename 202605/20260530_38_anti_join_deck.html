12.5\" fill=\"#BE653B\" font-weight=\"400\" >主要风险　外侧行数低估导致大量 loops</text><text x=\"758\" y=\"312.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#2F7A66\" font-weight=\"400\" >适用边界　外侧很小，内侧有高选择性索引</text><line x1=\"1235\" y1=\"92\" x2=\"1235\" y2=\"122\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><line x1=\"1235\" y1=\"112\" x2=\"1235\" y2=\"117.2\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><polygon points=\"1235,122 1231.7,116 1238.3,116\" fill=\"#245A6B\"/><rect x=\"1090\" y=\"126\" width=\"290\" height=\"222\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><rect x=\"1090\" y=\"126\" width=\"290\" height=\"44\" rx=\"4\" fill=\"#A4C4C6\" stroke=\"#A4C4C6\" stroke-width=\"1\" /><text x=\"1235.0\" y=\"150.925\" class=\"sv \" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"700\" >Right Anti Join</text><text x=\"1108\" y=\"204.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >查找方式　优化器交换了物理输入方向</text><text x=\"1108\" y=\"256.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#BE653B\" font-weight=\"400\" >主要风险　读计划时容易误解保留侧</text><text x=\"1108\" y=\"303.375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#2F7A66\" font-weight=\"400\" >适用边界　看 Hash Cond / 输出列确认逻辑</text><text x=\"1108\" y=\"321.5\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#2F7A66\" font-weight=\"400\" >保留侧</text><rect x=\"40\" y=\"362\" width=\"1320\" height=\"56\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1.0\" /><text x=\"60\" y=\"393.12\" class=\"sv \" text-anchor=\"start\" font-size=\"16.0\" fill=\"#AE8A3E\" font-weight=\"600\" >读计划提醒</text><text x=\"244\" y=\"392.53499999999997\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >Hash Right Anti Join 不是业务上写了 right join，而是优化器交换了物理输入方向；要看条件和输出列确认谁是被保留的逻辑左侧。</text></svg>","ctrl":""},{"eyebrow":"三 · 成本估算","title":"提前停止，与必须走到底","lede":"outer_match_frac 和 match_count，决定 Anti Join 代价估算的两面。","caption":"图 14：方格仅示意探测次数，不含任何性能实测数字；公式与因子名来自 costsize.c / joinpath.c。","bridge":"成本算完，执行器到底做了什么？","notes":"为什么优化器要专门给 Anti Join 准备成本因子？因为执行器的行为很不对称。对有匹配的外侧行，找到第一条匹配就立刻丢弃，后面的内侧行根本不看；对无匹配的外侧行，必须把候选查完才能确认「不存在」。前者便宜，后者贵，而无匹配比例越高，整体越接近完整探测成本。\njoinpath.c 对 JOIN_SEMI、JOIN_ANTI 或内侧已证明唯一的 join 调用 compute_semi_anti_join_factors()，准备两个因子：outer_match_frac 是外侧行中预计至少有一个匹配的比例，match_count 是对有匹配的外侧行预计平均匹配多少个内侧行。costsize.c 的注释说得很直白：Hash 或 Nested Loop 的 Semi/Anti Join 里，执行器一旦为当前外侧行找到匹配就停止扫描更多内侧行，成本模型必须为这个提前停止做修正；源码里用 2/(match_count+1) 去估提前停止后的内侧扫描比例，还加了 fuzz factor。\n这就把统计信息的分量称出来了：右侧 key 重复严重但统计没反映，Nested Loop 会低估内侧探测；右侧比预期大很多，Hash Anti Join 可能批处理甚至落临时文件。原文的结论是「统计信息不准时，Anti Join 很容易选错算法」，我觉得还可以再补一句——它不是对统计特别敏感，而是对「命中比例」这一个量特别敏感，而这个量本来就难估。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><text x=\"40\" y=\"34\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"400\" >同一条成本曲线，两种外侧行（下方方格为示意，非实测数据）</text><rect x=\"40\" y=\"46\" width=\"640\" height=\"172\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><rect x=\"40\" y=\"46\" width=\"640\" height=\"42\" rx=\"4\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"360.0\" y=\"70.12\" class=\"sv \" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#FFFFFF\" font-weight=\"700\" >有匹配的外侧行</text><rect x=\"68.0\" y=\"100\" width=\"134.0\" height=\"38\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"135.0\" y=\"121.4375\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#2F7A66\" font-weight=\"500\" >探测 1</text><rect x=\"214.0\" y=\"100\" width=\"134.0\" height=\"38\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"281.0\" y=\"121.4375\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"500\" >探测 2</text><rect x=\"360.0\" y=\"100\" width=\"134.0\" height=\"38\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"427.0\" y=\"121.4375\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"500\" >探测 3</text><rect x=\"506.0\" y=\"100\" width=\"134.0\" height=\"38\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"573.0\" y=\"121.4375\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"500\" >探测 4</text><text x=\"360.0\" y=\"179.535\" class=\"sv \" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >找到第一条匹配就丢弃当前外侧行，内侧扫描提前停止。成本随命中比例下降。</text><rect x=\"700\" y=\"46\" width=\"660\" height=\"172\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><rect x=\"700\" y=\"46\" width=\"660\" height=\"42\" rx=\"4\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"1030.0\" y=\"70.12\" class=\"sv \" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#FFFFFF\" font-weight=\"700\" >无匹配的外侧行</text><rect x=\"728.0\" y=\"100\" width=\"139.0\" height=\"38\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"797.5\" y=\"121.4375\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#BE653B\" font-weight=\"500\" >探测 1</text><rect x=\"879.0\" y=\"100\" width=\"139.0\" height=\"38\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"948.5\" y=\"121.4375\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#BE653B\" font-weight=\"500\" >探测 2</text><rect x=\"1030.0\" y=\"100\" width=\"139.0\" height=\"38\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"1099.5\" y=\"121.4375\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#BE653B\" font-weight=\"500\" >探测 3</text><rect x=\"1181.0\" y=\"100\" width=\"139.0\" height=\"38\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"1250.5\" y=\"121.4375\" class=\"sv \" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#BE653B\" font-weight=\"500\" >探测 4</text><text x=\"1030.0\" y=\"179.535\" class=\"sv \" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >必须确认没有匹配：探测完整 hash bucket、完整索引范围或完整 merge key group。</text><rect x=\"40\" y=\"230\" width=\"640\" height=\"76\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"60\" y=\"251.12\" class=\"sv mono\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" >outer_match_frac</text><text x=\"60\" y=\"285.53499999999997\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >外侧行中预计「至少有一个匹配」的比例。</text><rect x=\"700\" y=\"230\" width=\"660\" height=\"76\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"720\" y=\"251.12\" class=\"sv mono\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" >match_count</text><text x=\"720\" y=\"285.53499999999997\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >对有匹配的外侧行，预计平均匹配多少个内侧行。</text><rect x=\"40\" y=\"316\" width=\"1320\" height=\"48\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#F1EFE9\" stroke-width=\"1.0\" /><text x=\"60\" y=\"342.925\" class=\"sv \" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"600\" >compute_semi_anti_join_factors()</text><text x=\"454\" y=\"342.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >costsize.c 注释：Semi / Anti Join 一旦找到匹配就停止扫描内侧，成本模型必须修正；源码用 2/(match_count+1) 估计提前停止的扫描比例。</text><rect x=\"40\" y=\"372\" width=\"1320\" height=\"46\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"60\" y=\"397.925\" class=\"sv \" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"600\" >统计失真的后果</text><text x=\"294\" y=\"397.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >右侧 key 重复度、NULL 比例、distinct、MCV 与过滤选择率估偏，会让计划从 Hash 翻到 Nested Loop，或反过来。</text></svg>","ctrl":""},{"eyebrow":"三 · 执行器","title":"匹配即丢弃，无匹配才输出","lede":"三种物理算法不同，语义状态机相同；成本风险集中在「确认不存在」那一步。","caption":"","bridge":"内部机制讲完了，回到选型：四种写法到底差在哪。","notes":"执行器层面的语义反而最干净，就三步：对当前外侧行查找内侧匹配；join qual 一旦命中，当前外侧行不输出，直接进入下一行；候选内侧都查完仍无匹配，才输出当前外侧行。\n源码里三处都能对上。nodeHashjoin.c 的 JOIN_ANTI 分支，一旦匹配 joinqual 就把状态设为 HJ_NEED_NEW_OUTER 然后 continue，不返回匹配 tuple；nodeNestloop.c 类似，匹配后设 nl_NeedNewOuter = true；nodeMergejoin.c 在 Anti 命中后推进到下一个 outer。三种物理查找方式完全不同，但跳过的都是同一件事：不把匹配对交给上层。\n用上面的动画切三种输入看：第 1 条即命中，只探一次就走人；第 3 条才命中，探三次；完全无匹配，四条都得探完才能输出。这正好把上一页的成本模型演出来了——Anti Join 的钱，主要花在「证明没有」上。也正因为执行器这么干脆，EXISTS 子查询通常不会完整执行，官方文档才提醒别在里面放有副作用的函数。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><text x=\"40\" y=\"48\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"400\" >Anti Join 执行器状态机（Hash / Nested Loop / Merge 共用语义）</text><line x1=\"40\" y1=\"56\" x2=\"1360\" y2=\"56\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"40\" y=\"346\" width=\"1320\" height=\"64\" rx=\"5\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"40\" y=\"330\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" >源码：nodeHashjoin.c 设 HJ_NEED_NEW_OUTER · nodeNestloop.c 设 nl_NeedNewOuter · nodeMergejoin.c 推进下一个 outer</text><g id=\"aj15dyn\"></g><text x=\"40\" y=\"424\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >图 15 · 三种物理算法的查找方式不同，但「匹配即丢弃、无匹配才输出」完全一致。</text></svg>","ctrl":"<label>内侧命中位置</label><select id=\"aj15Sel\">\n<option value=\"0\">第 1 条即命中</option><option value=\"1\">第 3 条才命中</option>\n<option value=\"2\">完全无匹配（走到底）</option></select>\n<button class=\"btn play\" id=\"aj15Play\">▶ 播放</button><button class=\"btn\" id=\"aj15Step\">单步 →</button>\n<button class=\"btn\" id=\"aj15Reset\">重置</button><span class=\"out\" id=\"aj15Out\"></span>"},{"eyebrow":"四 · 横向对比","title":"结果可能相同，语义与计划空间不同","lede":"把四种写法摆在一张表里，差异就不在「谁快」，而在「谁能被证明」。","caption":"图 16：维度来自原文对比表；推荐程度是语义稳健性判断，不是性能排序。","bridge":"看清差异，才好谈收益和代价。","notes":"把 NOT EXISTS、LEFT JOIN 加 IS NULL、NOT IN、EXCEPT 摆在一起，最容易破掉一个执念：大家都在比「哪个快」，可真正该比的是「哪个语义站得住、能被优化器证明」。\nNULL 风险这一行最说明问题。NOT EXISTS 低，因为关联谓词按正常 WHERE 的二值逻辑判断；LEFT JOIN 加 IS NULL 中等，全看你检查的那一列能不能代表未匹配；NOT IN 高，右侧一个 NULL 就能让结果变 UNKNOWN；EXCEPT 走的是集合语义，还要考虑去重。优化器入口那一行也一样：前两个是 join 树里的改写，NOT IN 得跨 NULL 安全门槛，EXCEPT 干脆是 SetOp 节点，不进 JoinExpr。\n所以结论不是「永远别用 NOT IN」。原文说得很克制：如果列有明确 NOT NULL 约束，你要表达的又只是单列集合排除，NOT IN 可以很清楚。但在业务表默认允许 NULL、子查询经过外连接或表达式计算的场景里，NOT EXISTS 更稳。这里我再叠一条上一页的版本事实：老版本上 NOT IN 连改写的机会都没有，稳定地留在 SubPlan。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><text x=\"40\" y=\"34\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"400\" >结果可能相同，但 NULL 语义、优化器入口与计划空间并不相同</text><rect x=\"40\" y=\"48\" width=\"180\" height=\"40\" rx=\"3\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"130.0\" y=\"70.535\" class=\"sv \" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#FFFFFF\" font-weight=\"600\" >维度</text><rect x=\"220\" y=\"48\" width=\"280\" height=\"40\" rx=\"3\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"360.0\" y=\"70.535\" class=\"sv \" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#FFFFFF\" font-weight=\"600\" >Anti Join / NOT EXISTS</text><rect x=\"500\" y=\"48\" width=\"280\" height=\"40\" rx=\"3\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"640.0\" y=\"70.535\" class=\"sv \" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#FFFFFF\" font-weight=\"600\" >LEFT JOIN ... IS NULL</text><rect x=\"780\" y=\"48\" width=\"280\" height=\"40\" rx=\"3\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"920.0\" y=\"70.535\" class=\"sv \" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#FFFFFF\" font-weight=\"600\" >NOT IN</text><rect x=\"1060\" y=\"48\" width=\"280\" height=\"40\" rx=\"3\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"1200.0\" y=\"70.535\" class=\"sv \" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#FFFFFF\" font-weight=\"600\" >EXCEPT</text><rect x=\"40\" y=\"88\" width=\"180\" height=\"50\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"52\" y=\"115.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >主要目标</text><rect x=\"220\" y=\"88\" width=\"280\" height=\"50\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"232\" y=\"115.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >保留左侧无匹配行</text><rect x=\"500\" y=\"88\" width=\"280\" height=\"50\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"512\" y=\"115.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >用左连接补空表达无匹配</text><rect x=\"780\" y=\"88\" width=\"280\" height=\"50\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"792\" y=\"115.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >判断值不属于子查询集合</text><rect x=\"1060\" y=\"88\" width=\"280\" height=\"50\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"1072\" y=\"115.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >集合差（SetOp，不是 JoinExpr）</text><rect x=\"40\" y=\"138\" width=\"180\" height=\"50\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"52\" y=\"165.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >NULL 风险</text><rect x=\"220\" y=\"138\" width=\"280\" height=\"50\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"232\" y=\"165.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >低：谓词按正常 WHERE 二值判断</text><rect x=\"500\" y=\"138\" width=\"280\" height=\"50\" rx=\"3\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"512\" y=\"165.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >中：IS NULL 列必须能代表未匹配</text><rect x=\"780\" y=\"138\" width=\"280\" height=\"50\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"792\" y=\"165.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >高：右侧 NULL 让结果变 UNKNOWN</text><rect x=\"1060\" y=\"138\" width=\"280\" height=\"50\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"1072\" y=\"165.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >取决于集合语义与去重</text><rect x=\"40\" y=\"188\" width=\"180\" height=\"50\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"52\" y=\"215.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >输出右侧列</text><rect x=\"220\" y=\"188\" width=\"280\" height=\"50\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"232\" y=\"215.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >否</text><rect x=\"500\" y=\"188\" width=\"280\" height=\"50\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"512\" y=\"215.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >通常不应输出</text><rect x=\"780\" y=\"188\" width=\"280\" height=\"50\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"792\" y=\"215.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >否</text><rect x=\"1060\" y=\"188\" width=\"280\" height=\"50\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"1072\" y=\"215.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >否</text><rect x=\"40\" y=\"238\" width=\"180\" height=\"50\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"52\" y=\"265.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >右侧重复</text><rect x=\"220\" y=\"238\" width=\"280\" height=\"50\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"232\" y=\"265.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >不改结果，但影响成本</text><rect x=\"500\" y=\"238\" width=\"280\" height=\"50\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"512\" y=\"265.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >不改反连接结果，但影响成本</text><rect x=\"780\" y=\"238\" width=\"280\" height=\"50\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"792\" y=\"265.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >不改集合判断，但影响成本</text><rect x=\"1060\" y=\"238\" width=\"280\" height=\"50\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"1072\" y=\"265.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >默认去重；EXCEPT ALL 保留计数</text><rect x=\"40\" y=\"288\" width=\"180\" height=\"50\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"52\" y=\"315.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >优化器入口</text><rect x=\"220\" y=\"288\" width=\"280\" height=\"50\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"232\" y=\"315.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >NOT EXISTS 拉平为 JOIN_ANTI</text><rect x=\"500\" y=\"288\" width=\"280\" height=\"50\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"512\" y=\"315.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >reduce_outer_joins() 降强度</text><rect x=\"780\" y=\"288\" width=\"280\" height=\"50\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"792\" y=\"315.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >满足 NULL 安全才可能改写</text><rect x=\"1060\" y=\"288\" width=\"280\" height=\"50\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"1072\" y=\"315.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >SetOp 节点，不进入 JoinExpr</text><rect x=\"40\" y=\"338\" width=\"180\" height=\"50\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"52\" y=\"365.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >推荐程度</text><rect x=\"220\" y=\"338\" width=\"280\" height=\"50\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"232\" y=\"365.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >最推荐</text><rect x=\"500\" y=\"338\" width=\"280\" height=\"50\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"512\" y=\"365.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >可用，但要写对 IS NULL 列</text><rect x=\"780\" y=\"338\" width=\"280\" height=\"50\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"792\" y=\"365.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >谨慎，仅在非空约束明确时用</text><rect x=\"1060\" y=\"338\" width=\"280\" height=\"50\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"1072\" y=\"365.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >适合集合差，不适合保留行上下文</text><rect x=\"40\" y=\"396\" width=\"1320\" height=\"30\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"58\" y=\"413.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >结论不是「永远别用 NOT IN」：列有明确 NOT NULL 约束、且只是单列集合排除时，它可以很清楚；业务表默认可空、子查询经过外连接或表达式计算时，NOT EXISTS 更稳。</text></svg>","ctrl":""},{"eyebrow":"五 · 效果如何","title":"省下的是输出与探测，欠下的是证明","lede":"三条收益、五条代价，都从前面几页的机制里长出来。","caption":"图 17：青绿为正确动作与收益，陶橙为代价与风险；净收益不是常数，随数据分布变化。","bridge":"这些差异落到 EXPLAIN 上，该盯哪几个数？","notes":"收益其实只有三条，而且都能从前面的机制推出来。第一，减少无意义输出：只输出左侧无匹配行，压根不构造匹配行对。第二，匹配时提前停止：有匹配的外侧行找到第一条就丢，不必枚举完右侧。第三，给优化器明确语义：一旦是 JOIN_ANTI，成本模型就能用 outer_match_frac 和 match_count，而不是把它当普通 join 之后再过滤。\n代价有五条，同样有出处：无匹配行必须证明「不存在」，比例越高越接近完整探测；内侧构建成本一分不少，hash 表、排序、索引探测都在；join order 被 SpecialJoinInfo 收窄；NULL 安全检查失败就退回 SubPlan；统计信息一偏，算法选择就翻。\n我想强调那个金带：净收益不是常数。同一个查询，右侧命中比例从低到高，成本结构会反过来。所以不要记「Hash Anti Join 好」这种结论，要记「我现在是在为什么付费」——是为构建集付费，还是为确认不存在付费。这也是下一页读 EXPLAIN 的出发点。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40\" y=\"46\" width=\"640\" height=\"44\" rx=\"4\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"360.0\" y=\"71.51\" class=\"sv \" text-anchor=\"middle\" font-size=\"18.0\" fill=\"#FFFFFF\" font-weight=\"700\" >收益 · 省下了什么</text><rect x=\"700\" y=\"46\" width=\"660\" height=\"44\" rx=\"4\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"1030.0\" y=\"71.51\" class=\"sv \" text-anchor=\"middle\" font-size=\"18.0\" fill=\"#FFFFFF\" font-weight=\"700\" >代价 · 欠下了什么</text><rect x=\"40\" y=\"100\" width=\"640\" height=\"66\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"60\" y=\"118.63250000000001\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#2F7A66\" font-weight=\"600\" >减少无意义输出</text><text x=\"60\" y=\"149.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >只输出左侧无匹配行，不构造匹配行对；右表重复不会放大结果。</text><rect x=\"40\" y=\"176\" width=\"640\" height=\"66\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"60\" y=\"194.6325\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#2F7A66\" font-weight=\"600\" >匹配时可提前停止</text><text x=\"60\" y=\"225.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >有匹配的外侧行不必枚举所有右侧匹配，执行器找到第一条就走。</text><rect x=\"40\" y=\"252\" width=\"640\" height=\"66\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"60\" y=\"270.6325\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#2F7A66\" font-weight=\"600\" >给优化器明确语义</text><text x=\"60\" y=\"301.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >JOIN_ANTI 让成本模型使用 outer_match_frac 与 match_count，而非「先 join 再过滤」。</text><rect x=\"700\" y=\"100\" width=\"660\" height=\"48\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"718\" y=\"126.63250000000001\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#BE653B\" font-weight=\"600\" >无匹配行可能更贵</text><text x=\"922\" y=\"126.34\" class=\"sv \" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >必须证明「不存在」，无匹配比例越高越接近完整探测成本。</text><rect x=\"700\" y=\"154\" width=\"660\" height=\"48\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"718\" y=\"180.6325\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#BE653B\" font-weight=\"600\" >内侧构建成本仍在</text><text x=\"922\" y=\"180.34\" class=\"sv \" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >Hash 要建表，Merge 可能要排序，Nested Loop 可能大量索引探测。</text><rect x=\"700\" y=\"208\" width=\"660\" height=\"48\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"718\" y=\"234.6325\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#BE653B\" font-weight=\"600\" >join order 受限</text><text x=\"922\" y=\"234.34\" class=\"sv \" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >SpecialJoinInfo 排除非法重排，复杂 SQL 下可选计划变少。</text><rect x=\"700\" y=\"262\" width=\"660\" height=\"48\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"718\" y=\"288.6325\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#BE653B\" font-weight=\"600\" >NULL 语义不能简化</text><text x=\"922\" y=\"288.34000000000003\" class=\"sv \" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >NOT IN 的 NULL 安全检查失败时，计划退回 SubPlan。</text><rect x=\"700\" y=\"316\" width=\"660\" height=\"48\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"718\" y=\"342.6325\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#BE653B\" font-weight=\"600\" >统计信息敏感</text><text x=\"922\" y=\"342.34000000000003\" class=\"sv \" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >distinct、NULL fraction、MCV、过滤选择率不准都会影响算法选择。</text><rect x=\"40\" y=\"346\" width=\"1320\" height=\"72\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1.0\" /><text x=\"60\" y=\"385.51\" class=\"sv \" text-anchor=\"start\" font-size=\"18.0\" fill=\"#AE8A3E\" font-weight=\"600\" >净收益取决于什么</text><text x=\"344\" y=\"384.73\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >「无匹配」的比例、右侧构建集的大小、以及统计信息准不准。示意，不含任何性能实测数字。</text></svg>","ctrl":""},{"eyebrow":"五 · 读计划","title":"读计划时，该盯哪几个数","lede":"形态只是结果，偏差才是指挥棒：估算行数与真实行数差在哪一侧。","caption":"图 18：四种常见计划形态的适用边界与观察点，来自原文「效果如何」一节。","bridge":"这些都要在自己的库里验证，所以给一套可复现实验。","notes":"落到 EXPLAIN，别只盯着「有没有 Anti Join」这个节点名。真正有用的是对比：估算行数和真实行数差多少，差在哪一侧。原文给 DBA 的第一条建议就是这个。\n按形态拆：Hash Anti Join 怕 work_mem 不够，去看 Hash 节点的 buckets、batches、memory usage，有没有落临时文件；Merge Anti Join 怕排序成本和重复 key group，看 Sort、Merge Cond 和输入行数；Nested Loop Anti Join 怕外侧被低估，看 loops 和内侧 Index Scan 次数，外侧行数低估通常是根因；Hash Right Anti Join 最容易被误读，先确认右边那个计划里谁才是逻辑保留侧。\n再往后是三个具体动作：Hash 慢就查 batches、临时文件、work_mem 和右侧条件能不能提前下推；Nested Loop 慢就查外侧 loops；统计信息旧了就 ANALYZE，多列相关性必要时上 extended statistics。这些动作看着琐碎，其实都指向上一页那句——你现在是在为构建集付费，还是为确认不存在付费。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><text x=\"40\" y=\"34\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"400\" >读计划时该盯哪几个数：形态、边界、风险、观察点</text><rect x=\"40\" y=\"48\" width=\"220\" height=\"44\" rx=\"3\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"150.0\" y=\"72.6325\" class=\"sv \" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#FFFFFF\" font-weight=\"600\" >物理形态</text><rect x=\"260\" y=\"48\" width=\"340\" height=\"44\" rx=\"3\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"430.0\" y=\"72.6325\" class=\"sv \" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#FFFFFF\" font-weight=\"600\" >适合场景</text><rect x=\"600\" y=\"48\" width=\"340\" height=\"44\" rx=\"3\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"770.0\" y=\"72.6325\" class=\"sv \" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#FFFFFF\" font-weight=\"600\" >主要风险</text><rect x=\"940\" y=\"48\" width=\"400\" height=\"44\" rx=\"3\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"1140.0\" y=\"72.6325\" class=\"sv \" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#FFFFFF\" font-weight=\"600\" >EXPLAIN 观察点</text><rect x=\"40\" y=\"92\" width=\"220\" height=\"72\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"52\" y=\"130.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >Hash Anti Join</text><rect x=\"260\" y=\"92\" width=\"340\" height=\"72\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"272\" y=\"130.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >等值条件，右侧可接受构建 hash table</text><rect x=\"600\" y=\"92\" width=\"340\" height=\"72\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"612\" y=\"130.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >work_mem 不足导致 batch 或落临时文件</text><rect x=\"940\" y=\"92\" width=\"400\" height=\"72\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"952\" y=\"130.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >Hash 节点 buckets、batches、memory usage</text><rect x=\"40\" y=\"164\" width=\"220\" height=\"72\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"52\" y=\"202.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >Merge Anti Join</text><rect x=\"260\" y=\"164\" width=\"340\" height=\"72\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"272\" y=\"202.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >两侧已有顺序，或排序成本低</text><rect x=\"600\" y=\"164\" width=\"340\" height=\"72\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"612\" y=\"202.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >排序成本、重复 key group 成本</text><rect x=\"940\" y=\"164\" width=\"400\" height=\"72\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"952\" y=\"202.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >Sort、Merge Cond、两侧输入行数</text><rect x=\"40\" y=\"236\" width=\"220\" height=\"72\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"52\" y=\"274.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >Nested Loop Anti Join</text><rect x=\"260\" y=\"236\" width=\"340\" height=\"72\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"272\" y=\"274.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >外侧很小，内侧有高选择性索引</text><rect x=\"600\" y=\"236\" width=\"340\" height=\"72\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"612\" y=\"274.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >外侧行数低估导致大量探测</text><rect x=\"940\" y=\"236\" width=\"400\" height=\"72\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"952\" y=\"274.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >loops、内侧 Index Scan 次数</text><rect x=\"40\" y=\"308\" width=\"220\" height=\"72\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"52\" y=\"346.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >Hash Right Anti Join</text><rect x=\"260\" y=\"308\" width=\"340\" height=\"72\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"272\" y=\"346.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >优化器认为交换物理方向更便宜</text><rect x=\"600\" y=\"308\" width=\"340\" height=\"72\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"612\" y=\"346.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >读计划时容易误解保留侧</text><rect x=\"940\" y=\"308\" width=\"400\" height=\"72\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"952\" y=\"346.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >Right Anti 中谁才是逻辑保留侧</text><rect x=\"40\" y=\"392\" width=\"1320\" height=\"34\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#F1EFE9\" stroke-width=\"1.0\" /><text x=\"60\" y=\"411.73\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"600\" >DBA 第一动作</text><text x=\"244\" y=\"411.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >用 EXPLAIN (ANALYZE, BUFFERS) 对比真实行数与估算行数，重点看 Anti Join 两侧输入行数。</text></svg>","ctrl":""},{"eyebrow":"六 · 实操 DEMO","title":"不贴伪造数字，只给可复现的实验","lede":"造两张表、四个 EXPLAIN，把前面每一页的结论自己验一遍。","caption":"图 19：原文 DEMO 脚本的结构化读法；100000 / 80000 是造数参数，不是性能测量结果。","bridge":"实验之后，要把结论变成日常习惯。","notes":"原文作者很诚实地说明：没有在本机编译并启动 PostgreSQL，所以不贴伪造的 EXPLAIN ANALYZE 数字。我觉得这个态度比贴一串漂亮毫秒数更值得学——计划形态可以讲清楚，具体耗时必须在你的版本、你的数据量、你的统计信息下测。\n实验设计本身很巧。orders_demo 里 order_id 是主键、customer_id 非空；payments_demo 的 order_id 故意允许 NULL，status 非空；造数时 payments 只覆盖部分订单，还用 g % 5 <> 0 挖掉一部分。于是四个观察点各自验证一件事：NOT EXISTS 能不能落成 Anti Join，关掉 hashjoin 后备选路径长什么样；LEFT JOIN 加 IS NULL 用 p.order_id 判断能不能被降强度；右侧可空的 NOT IN 是不是留在 SubPlan；以及加上显式 IS NOT NULL 之后会不会出现 Anti Join。\n最后一条要连着第 11 页读：PG 18 及更早不会转，PG 19 的 master 才有这个能力。所以同一份脚本在不同版本跑出不同结果，恰恰是这套实验想让你看见的东西。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><text x=\"40\" y=\"34\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"400\" >最小可验证实验：造数 → 四个 EXPLAIN 观察点</text><rect x=\"40\" y=\"48\" width=\"620\" height=\"330\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"56\" y=\"74.23529411764706\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.8\" fill=\"#245A6B\" font-weight=\"400\" >-- 行数仅为脚本参数，不是性能结论</text><text x=\"56\" y=\"92.47058823529412\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.8\" fill=\"#46585F\" font-weight=\"400\" >CREATE TABLE orders_demo (</text><text x=\"56\" y=\"110.70588235294117\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.8\" fill=\"#46585F\" font-weight=\"400\" >  order_id bigint PRIMARY KEY,</text><text x=\"56\" y=\"128.94117647058823\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.8\" fill=\"#46585F\" font-weight=\"400\" >  customer_id bigint NOT NULL );</text><text x=\"56\" y=\"147.1764705882353\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.8\" fill=\"#46585F\" font-weight=\"400\" >CREATE TABLE payments_demo (</text><text x=\"56\" y=\"165.41176470588235\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.8\" fill=\"#46585F\" font-weight=\"400\" >  payment_id bigint PRIMARY KEY,</text><text x=\"56\" y=\"183.6470588235294\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.8\" fill=\"#46585F\" font-weight=\"400\" >  order_id bigint,            -- 允许 NULL</text><text x=\"56\" y=\"201.88235294117646\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.8\" fill=\"#46585F\" font-weight=\"400\" >  status text NOT NULL );</text><text x=\"56\" y=\"220.11764705882354\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.8\" fill=\"#46585F\" font-weight=\"400\" >INSERT INTO orders_demo</text><text x=\"56\" y=\"238.35294117647058\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.8\" fill=\"#46585F\" font-weight=\"400\" >  SELECT g, g % 10000</text><text x=\"56\" y=\"256.5882352941176\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.8\" fill=\"#46585F\" font-weight=\"400\" >  FROM generate_series(1,100000) g;</text><text x=\"56\" y=\"274.8235294117647\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.8\" fill=\"#46585F\" font-weight=\"400\" >INSERT INTO payments_demo</text><text x=\"56\" y=\"293.05882352941177\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.8\" fill=\"#46585F\" font-weight=\"400\" >  SELECT g, g, &#x27;success&#x27;</text><text x=\"56\" y=\"311.2941176470588\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.8\" fill=\"#46585F\" font-weight=\"400\" >  FROM generate_series(1,80000) g</text><text x=\"56\" y=\"329.52941176470586\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.8\" fill=\"#46585F\" font-weight=\"400\" >  WHERE g % 5 &lt;&gt; 0;</text><text x=\"56\" y=\"347.7647058823529\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.8\" fill=\"#46585F\" font-weight=\"400\" >CREATE INDEX ON payments_demo(order_id);</text><text x=\"56\" y=\"366.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.8\" fill=\"#46585F\" font-weight=\"400\" >ANALYZE orders_demo; ANALYZE payments_demo;</text><rect x=\"690\" y=\"48\" width=\"670\" height=\"76\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"690\" y=\"48\" width=\"670\" height=\"30\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"708\" y=\"65.8275\" class=\"sv \" text-anchor=\"start\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"600\" >① NOT EXISTS</text><text x=\"708\" y=\"94.905\" class=\"sv \" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >EXPLAIN (ANALYZE, BUFFERS) 通常看到 Hash / Nested Loop Anti Join；SET enable_hashjoin = off 观察备选</text><text x=\"708\" y=\"111.58\" class=\"sv \" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >路径。</text><rect x=\"690\" y=\"132\" width=\"670\" height=\"76\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"690\" y=\"132\" width=\"670\" height=\"30\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"708\" y=\"149.82750000000001\" class=\"sv \" text-anchor=\"start\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"600\" >② LEFT JOIN ... IS NULL</text><text x=\"708\" y=\"187.2425\" class=\"sv \" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >WHERE p.order_id IS NULL。order_id 同时出现在 strict 等值 join 条件里，更容易被降强度为 JOIN_ANTI。</text><rect x=\"690\" y=\"216\" width=\"670\" height=\"76\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"690\" y=\"216\" width=\"670\" height=\"30\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"708\" y=\"233.82750000000001\" class=\"sv \" text-anchor=\"start\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"600\" >③ NOT IN（右侧可空）</text><text x=\"708\" y=\"271.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >o.order_id NOT IN (SELECT p.order_id ...)。右侧列允许 NULL，不能简单等价为反连接。</text><rect x=\"690\" y=\"300\" width=\"670\" height=\"76\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"690\" y=\"300\" width=\"670\" height=\"30\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"708\" y=\"317.8275\" class=\"sv \" text-anchor=\"start\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"600\" >④ NOT IN + 显式非空</text><text x=\"708\" y=\"355.2425\" class=\"sv \" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >子查询加 WHERE p.order_id IS NOT NULL 后更接近可改写条件；是否出现 Anti Join 取决于 PostgreSQL 版本。</text><rect x=\"40\" y=\"388\" width=\"1320\" height=\"38\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1\" /><text x=\"58\" y=\"409.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#BE653B\" font-weight=\"500\" >原文未在本机编译并启动 PostgreSQL，因此不贴伪造的 EXPLAIN ANALYZE 数字；版本、数据量与统计信息都会改变具体计划形态。</text></svg>","ctrl":""},{"eyebrow":"七 · 最佳实践","title":"三种角色，同一条证明链","lede":"约束不是只保护数据，它同时给优化器提供「能证明」的空间。","caption":"图 20：架构师定模型与约束，DBA 守住统计与计划，业务开发者写对语义；三层其实在维护同一条链。","bridge":"再往前一步：哪些场景根本不该用反连接。","notes":"最佳实践按角色分，其实三层在维护同一条链：语义能不能被写对 → 优化器能不能证明 → 代价能不能估准。\n架构师那一层，重点不是「用哪个写法」，而是把模型写成 NOT EXISTS、把关联键和业务过滤条件写全，然后明确主外键、唯一性、NOT NULL 和必要索引。约束在这里有两重身份：保护数据，以及给优化器证明空间——第 9 页的降强度、第 11 页的 NULL 安全门槛，全都靠这些证明。大表反连接还要提前评估右侧构建集和 work_mem，因为 Hash Anti Join 很好，但不是免费。\nDBA 那一层守统计与计划：看真实行数和估算行数的偏差、看 batches 和临时文件、看 loops、必要时用 extended statistics 处理多列相关性。\n业务开发者那一层最朴素也最容易出事：首选 NOT EXISTS，别在 nullable 列上随手写 NOT IN，别在子查询里放有副作用的函数，「没有成功支付」一定要把 status 条件写进子查询。最后这条不是风格问题，是结果对不对。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40\" y=\"42\" width=\"1320\" height=\"114\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"40\" y=\"42\" width=\"240\" height=\"114\" rx=\"4\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"160.0\" y=\"102.9\" class=\"sv \" text-anchor=\"middle\" font-size=\"20.0\" fill=\"#FFFFFF\" font-weight=\"700\" >面向架构师</text><rect x=\"296\" y=\"50\" width=\"516\" height=\"46\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"314\" y=\"75.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >缺失关系优先写成 NOT EXISTS，关联键与业务过滤条件写全</text><rect x=\"832\" y=\"50\" width=\"516\" height=\"46\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"850\" y=\"75.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >明确主外键、唯一性、NOT NULL 与必要索引——约束给优化器证明空间</text><rect x=\"296\" y=\"102\" width=\"516\" height=\"46\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"314\" y=\"127.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >大表反连接提前评估右侧构建集大小、过滤选择率与 work_mem</text><rect x=\"832\" y=\"102\" width=\"516\" height=\"46\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"850\" y=\"127.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >多表复杂查询把 Anti Join 放在语义最清楚的位置，别破坏 join order</text><rect x=\"40\" y=\"166\" width=\"1320\" height=\"114\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"40\" y=\"166\" width=\"240\" height=\"114\" rx=\"4\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1\" /><text x=\"160.0\" y=\"226.9\" class=\"sv \" text-anchor=\"middle\" font-size=\"20.0\" fill=\"#FFFFFF\" font-weight=\"700\" >面向 DBA</text><rect x=\"296\" y=\"174\" width=\"516\" height=\"46\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"314\" y=\"199.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >EXPLAIN (ANALYZE, BUFFERS) 看真实 / 估算行数偏差，重点看两侧输入行数</text><rect x=\"832\" y=\"174\" width=\"516\" height=\"46\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"850\" y=\"199.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >Hash 慢：查 hash batches、临时文件、work_mem、右侧条件能否下推</text><rect x=\"296\" y=\"226\" width=\"516\" height=\"46\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"314\" y=\"251.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >Nested Loop 慢：查外侧 loops 与内侧索引条件，外侧低估常是根因</text><rect x=\"832\" y=\"226\" width=\"516\" height=\"46\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"850\" y=\"251.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >维护统计信息；多列相关性必要时用 extended statistics</text><rect x=\"40\" y=\"290\" width=\"1320\" height=\"114\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"40\" y=\"290\" width=\"240\" height=\"114\" rx=\"4\" fill=\"#AE8A3E\" stroke=\"#AE8A3E\" stroke-width=\"1\" /><text x=\"160.0\" y=\"350.9\" class=\"sv \" text-anchor=\"middle\" font-size=\"20.0\" fill=\"#FFFFFF\" font-weight=\"700\" >面向业务开发者</text><rect x=\"296\" y=\"298\" width=\"516\" height=\"46\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"314\" y=\"323.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >写「没有某记录」首选 NOT EXISTS</text><rect x=\"832\" y=\"298\" width=\"516\" height=\"46\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"850\" y=\"323.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >避免在 nullable 列上随手写 NOT IN；必要时先确认非空约束</text><rect x=\"296\" y=\"350\" width=\"516\" height=\"46\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"314\" y=\"375.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >别在 NOT EXISTS 子查询里调用有副作用的函数：EXISTS 可能提前停止</text><rect x=\"832\" y=\"350\" width=\"516\" height=\"46\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"850\" y=\"375.4375\" class=\"sv \" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >「没有成功支付」必须把 status 条件放进子查询，不能只按订单号判断</text></svg>","ctrl":""},{"eyebrow":"八 · 适合与不适合","title":"什么时候别用反连接，和什么时候用它一样重要","lede":"前三条「不适合」都是需求超出了算子的能力，不是调优能补回来的。","caption":"图 21：上半为场景边界，下半为原文「常见坑」里最高频的三类错误。","bridge":"最后收成一张决策树，以及几条可以带走的追问。","notes":"「适合」那一栏看着杂，其实都是同一类：反查缺失关系、数据质量巡检、幂等任务找未处理分片、约束补偿、反向集合过滤。共同点是「我要的是左表里那些没被右表命中的行」，一行就够，不需要右侧任何字段。\n「不适合」更值得记，因为前三条是需求超出了算子能力，调优补不回来：需要右侧字段，Anti Join 不输出右表列，换普通 join；需要知道匹配数量，该用聚合或窗口函数；需要区分「右侧无匹配」和「匹配到了但字段为 NULL」，就不能用会混淆两者的 LEFT JOIN 加 IS NULL 写法。后两条是语义陷阱：右侧子查询有副作用函数，EXISTS 可能提前停止；nullable 列上直接 NOT IN，等于把业务否定交给三值逻辑。\n下面三个坑是原文九条里最高频的。尤其中间那个：检查错列，结果里会混进「匹配到了但该列为 NULL」的行——这类错误最阴，因为查询不报错，只是 quietly 多给你几行。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40\" y=\"44\" width=\"640\" height=\"44\" rx=\"4\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"360.0\" y=\"69.315\" class=\"sv \" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#FFFFFF\" font-weight=\"700\" >适合 · 反查「缺失关系」</text><rect x=\"700\" y=\"44\" width=\"660\" height=\"44\" rx=\"4\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"1030.0\" y=\"69.315\" class=\"sv \" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#FFFFFF\" font-weight=\"700\" >不适合 · 需求超出了这个算子</text><rect x=\"40\" y=\"96\" width=\"640\" height=\"36\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"60\" y=\"116.535\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >反查缺失关系：无订单用户、无支付订单、无权限资源</text><rect x=\"40\" y=\"138\" width=\"640\" height=\"36\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"60\" y=\"158.535\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >数据质量巡检：事实表孤儿键、维表未引用记录、同步缺口</text><rect x=\"40\" y=\"180\" width=\"640\" height=\"36\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"60\" y=\"200.535\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >幂等任务：找出还没处理过的任务或分片</text><rect x=\"40\" y=\"222\" width=\"640\" height=\"36\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"60\" y=\"242.535\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >约束补偿：历史数据清洗阶段找出不满足新约束的行</text><rect x=\"40\" y=\"264\" width=\"640\" height=\"36\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"60\" y=\"284.53499999999997\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >反向集合过滤：从候选集排除黑名单、已发送、已授权对象</text><rect x=\"700\" y=\"96\" width=\"660\" height=\"36\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"720\" y=\"116.535\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >需要右侧字段：Anti Join 不输出右表列</text><rect x=\"700\" y=\"138\" width=\"660\" height=\"36\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"720\" y=\"158.535\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >需要知道匹配数量：应使用聚合或窗口函数</text><rect x=\"700\" y=\"180\" width=\"660\" height=\"36\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"720\" y=\"200.535\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >要区分「右侧无匹配」与「匹配但字段为 NULL」</text><rect x=\"700\" y=\"222\" width=\"660\" height=\"36\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"720\" y=\"242.535\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >右侧子查询有副作用函数：EXISTS / NOT EXISTS 可能提前停止</text><rect x=\"700\" y=\"264\" width=\"660\" height=\"36\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"720\" y=\"284.53499999999997\" class=\"sv \" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >nullable 列上直接用 NOT IN 表达业务否定</text><rect x=\"40\" y=\"312\" width=\"426\" height=\"106\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"58\" y=\"333.73\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"600\" >坑一 · NOT IN 被 NULL 吃掉</text><text x=\"58\" y=\"374.64000000000004\" class=\"sv \" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >右侧只要有 NULL，很多看似该保留的行会得到 UNKNOWN 并被 WHERE </text><text x=\"58\" y=\"392.04\" class=\"sv \" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >过滤。用 NOT EXISTS，或证明并过滤右侧非空。</text><rect x=\"486\" y=\"312\" width=\"426\" height=\"106\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"504\" y=\"333.73\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"600\" >坑二 · IS NULL 检查错列</text><text x=\"504\" y=\"374.64000000000004\" class=\"sv \" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >检查右表 nullable 业务列，会把「匹配到了但该列为 NULL」的行算进</text><text x=\"504\" y=\"392.04\" class=\"sv \" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >来。应检查 join key 或 NOT NULL 列。</text><rect x=\"932\" y=\"312\" width=\"426\" height=\"106\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"950\" y=\"333.73\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"600\" >坑三 · 条件写错位置</text><text x=\"950\" y=\"374.64000000000004\" class=\"sv \" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >左连接写法里右侧过滤放 WHERE 会把左连接变成内连接语义；匹配条件</text><text x=\"950\" y=\"392.04\" class=\"sv \" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >放 ON，未匹配判断放 WHERE；状态条件要写全。</text></svg>","ctrl":""},{"eyebrow":"九 · 收束","title":"把「找没有」这件事，交回给连接","lede":"一条决策顺序，三句话，四个可以继续追的问题。","caption":"图 22：决策树把全讲的语义门槛、优化器入口、成本观察点串成一条可执行的检查链。","bridge":"谢谢。","notes":"收个尾。今天这条链其实很短：业务问的是「没有发生过」，数据库把它抬成连接问题；定义是「只输出左表里没有匹配的那些行」；PostgreSQL 用三道门槛把三种 SQL 写法收进 JOIN_ANTI；执行器匹配即丢弃、无匹配才输出；成本因此分成「提前停止」和「必须走到底」两面；最后落到约束、统计信息和 EXPLAIN 的观察点。\n带走三句话就够。第一，『找没有』是连接问题，不是过滤问题——这个视角一换，join order、成本估算、物理算法全都进得来。第二，反连接的钱主要花在确认「不存在」，所以别问「Hash Anti Join 快不快」，要问「我现在是在为什么付费」。第三，约束与统计信息不是运维细节，它们是优化器能不能证明的前提；第 9 页的降强度、第 11 页的 NULL 安全门槛，都卡在这儿。\n原文最后留了五个扩展问题，我挑了四个放图上。特别推荐第二个和第三个：一个逼你把唯一性、match_count、提前停止串起来；一个逼你亲手构造错误重排的反例。能自己把反例造出来，这一讲才算真懂了。原文还列了十一份源码与文档入口，从 nodes.h 到三个 executor 文件、优化器 README、回归测试，按这条链去读，比按目录读省力得多。谢谢大家。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><text x=\"40\" y=\"34\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"400\" >写「没有某记录」时的决策顺序</text><text x=\"840\" y=\"34\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"400\" >带走的问题</text><rect x=\"90\" y=\"48\" width=\"690\" height=\"48\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\" /><text x=\"112\" y=\"74.6325\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"600\" >起点：我要找的是「左表里没有发生某件事」的行</text><line x1=\"435\" y1=\"96\" x2=\"435\" y2=\"102.0\" stroke=\"#2 oke-width=\"1.2\" /><text x=\"112\" y=\"374.6325\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >看两侧输入行数、估算偏差与统计信息，再决定调哪一侧</text><rect x=\"840\" y=\"48\" width=\"520\" height=\"366\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><rect x=\"840\" y=\"48\" width=\"520\" height=\"42\" rx=\"4\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"1100.0\" y=\"72.315\" class=\"sv \" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#FFFFFF\" font-weight=\"700\" >三句话</text><rect x=\"854\" y=\"98\" width=\"492\" height=\"40\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"872\" y=\"120.63250000000001\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#2F7A66\" font-weight=\"600\" >「找没有」是连接问题，不是过滤问题。</text><rect x=\"854\" y=\"144\" width=\"492\" height=\"40\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"872\" y=\"166.6325\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#2F7A66\" font-weight=\"600\" >反连接的钱，主要花在确认「不存在」。</text><rect x=\"854\" y=\"190\" width=\"492\" height=\"40\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"872\" y=\"212.6325\" class=\"sv \" text-anchor=\"start\" font-size=\"13.5\" fill=\"#2F7A66\" font-weight=\"600\" >约束与统计信息，是优化器能证明的前提。</text><line x1=\"854\" y1=\"244\" x2=\"1348\" y2=\"244\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"860\" y=\"267.73\" class=\"sv \" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"600\" >扩展问题（原文第十节）</text><text x=\"860\" y=\"299.34000000000003\" class=\"sv \" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >· 为什么 NOT EXISTS 比 NOT IN 稳？从 NULL 语义答，别从性能答。</text><text x=\"860\" y=\"331.34000000000003\" class=\"sv \" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >· 右侧 join key 有唯一索引时，成本模型与执行行为怎么变？</text><text x=\"860\" y=\"363.34000000000003\" class=\"sv \" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >· 为什么 Anti Join 不能自由重排？构造一个三表反例。</text><text x=\"860\" y=\"395.34000000000003\" class=\"sv \" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >· 大表反连接里，Hash 什么时候会比 Nested Loop 更差？</text></svg>","ctrl":""}];
const N = D.length;
let cur = 0, autoOn = false, autoTimer = null;
let panelOn = false, panelMode = '';
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

/* ---------- 舞台等比缩放；开窗时把可用宽度让给左侧 ---------- */
function fit(){
  const vp = $('#viewport');
  const pw = panelOn ? $('#panel').getBoundingClientRect().width : 0;
  const W = Math.max(320, vp.clientWidth - pw), H = vp.clientHeight;
  const s = Math.min(W / 1600, H / 900);
  const st = $('#stage');
  st.style.transform = 'scale(' + s + ')';
  st.style.left = ((W - 1600 * s) / 2) + 'px';
  st.style.top  = ((H -  900 * s) / 2) + 'px';
}
window.addEventListener('resize', fit);

function render(){
  $('#slides').innerHTML = D.map((d, i) =>
    '<section class="slide" id="s' + i + '">'
    + '<div class="eyebrow"><span class="num">' + String(i+1).padStart(2,'0') + ' / ' + String(N).padStart(2,'0')
    + '</span>' + d.eyebrow + '</div>'
    + '<h1 class="title">' + d.title + '</h1>'
    + '<div class="lede">' + d.lede + '</div>'
    + '<div class="rule"></div>'
    + '<div class="figwrap">' + d.svg + '</div>'
    + (d.ctrl ? '<div class="ctrls">' + d.ctrl + '</div>' : '<div class="caption">' + d.caption + '</div>')
    + '<div class="bridge"><span class="bk">承接 · NEXT</span>' + d.bridge + '</div>'
    + '<div class="footer"><div class="fbar"><i id="fbar' + i + '"></i></div>'
    + '<span class="fl">数据库筑基课 · Anti Join</span>'
    + '<span class="fr">' + String(i+1).padStart(2,'0') + ' / ' + String(N).padStart(2,'0') + '</span></div>'
    + '</section>').join('');
}

function toast(s){
  const t = $('#toast'); t.textContent = s; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 1700);
}

function go(i, silent){
  i = Math.max(0, Math.min(N - 1, i));
  $$('.slide').forEach((el, k) => el.classList.toggle('on', k === i));
  cur = i;
  try{ localStorage.setItem('antijoin-slide', String(i)); }catch(e){}
  $('.pg').textContent = String(i+1).padStart(2,'0') + ' / ' + String(N).padStart(2,'0');
  $('#track i').style.width = ((i+1)/N*100) + '%';
  for(let k=0;k<N;k++){ const b=$('#fbar'+k); if(b) b.style.width = (k<=i?100:0)+'%'; }
  if(panelOn){
    if(panelMode === 'here') renderHere();
    else if(panelMode === 'all'){ markCurrent(); scrollCurrent(true); }
    else if(panelMode === 'toc') markToc();
  }
  if(!silent) toast(D[i].eyebrow + ' · ' + D[i].title);
}
function next(){ if(cur < N-1) go(cur+1); else stopAuto(); }
function prev(){ if(cur > 0) go(cur-1); }

/* ---------- 自动播放 ---------- */
function stopAuto(){
  autoOn = false; clearInterval(autoTimer); autoTimer = null;
  $('#btnAuto').textContent = '▶ 自动播放 P'; $('#btnAuto').classList.remove('act');
}
function toggleAuto(){
  if(autoOn){ stopAuto(); toast('已暂停自动播放'); return; }
  autoOn = true; $('#btnAuto').textContent = '❚❚ 暂停 P'; $('#btnAuto').classList.add('act');

document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  const typing = (tag === 'input' || tag === 'select' || tag === 'textarea');
  const k = e.key;
  if(k === 'Escape'){
    if(panelOn){ closePanel(); return; }
    if(document.body.classList.contains('immersive')){ fs(); return; }
    return;
  }
  if(typing && (k.indexOf('Arrow') === 0 || k === ' ' || k === 'Home' || k === 'End')) return;
  if(k === 'ArrowRight' || k === ' ' || k === 'PageDown'){ e.preventDefault(); next(); }
  else if(k === 'ArrowLeft' || k === 'PageUp'){ e.preventDefault(); prev(); }
  else if(k === 'f' || k === 'F' || e.code === 'KeyF'){ e.preventDefault(); fs(); }
  else if(k === 'g' || k === 'G'){ e.preventDefault(); togglePanel('toc'); }
  else if(k === 'n' || k === 'N'){ e.preventDefault(); togglePanel('here'); }
  else if(k === 't' || k === 'T'){ e.preventDefault(); togglePanel('all'); }
  else if(k === 'p' || k === 'P'){ e.preventDefault(); toggleAuto(); }
  else if(k === '?' || k === 'h' || k === 'H'){ e.preventDefault(); togglePanel('help'); }
  else if(k === 'Home'){ e.preventDefault(); go(0); }
  else if(k === 'End'){ e.preventDefault(); go(N-1); }
  else if(/^[1-9]$/.test(k)){ go(parseInt(k,10) - 1); }
});

/* ---------- 动画通用件：输入 + 播放/暂停 + 单步 + 重置 ---------- */
const P = {ink:'#1B2B33', ink2:'#46585F', muted:'#89938F', line:'#D9D5CB', white:'#FFFFFF',
  primary:'#245A6B', primL:'#E5EFF0', accent:'#BE653B', accL:'#F7E9DE',
  green:'#2F7A66', greenL:'#E4F0EA', gold:'#AE8A3E', paper2:'#F1EFE9'};
function jw(s){ let w=0; for(const c of String(s)) w += c.charCodeAt(0)>127 ? 1 : 0.56; return w; }
function jfs(s, base, maxw){ return Math.min(base, maxw / Math.max(jw(s), 0.01)); }
function jesc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function jt(x,y,s,size,fill,anchor,weight,cls){
  return '<text x="'+x+'" y="'+y+'" class="sv '+(cls||'')+'" text-anchor="'+(anchor||'start')+'"'
    + ' font-size="'+size.toFixed(1)+'" fill="'+fill+'" font-weight="'+(weight||400)+'">'+jesc(s)+'</text>';
}
function jct(x,y,w,h,s,size,fill,align,weight,pad){
  pad = pad || 14;
  let fs = size, lines = [];
  while(fs > 8){
    const budget = Math.max(1, (w-2*pad)/fs);
    lines = []; let cur='', cw=0;
    for(const c of String(s)){
      const q = c.charCodeAt(0)>127 ? 1 : 0.56;
      if(cw+q>budget && cur){ lines.push(cur); cur=''; cw=0; }
      cur+=c; cw+=q;
    }
    if(cur) lines.push(cur);
    if(lines.length*1.45*fs <= h-8 && Math.max.apply(null,lines.map(jw))*fs <= w-2*pad+0.6) break;
    fs -= 0.5;
  }
  const total = lines.length*1.45*fs;
  const y0 = y + h/2 - total/2 + fs*0.92;
  const ax = align==='center' ? x+w/2 : (align==='right' ? x+w-pad : x+pad);
  const an = align==='center' ? 'middle' : (align==='right' ? 'end' : 'start');
  return lines.map((ln,i)=>jt(ax, y0+i*1.45*fs, ln, fs, fill, an, weight||400)).join('');
}
function jr(x,y,w,h,fill,stroke,sw,r){
  return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+(r===undefined?4:r)+'"'
    + ' fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+(sw||1)+'"/>';
}
function jline(x1,y1,x2,y2,color,sw){
  return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+color+'" stroke-width="'+(sw||1.4)+'"/>';
}
function jarrowH(x1,y,x2,color){
  return jline(x1,y,x2-7,y,color,2) + '<polygon points="'+x2+','+y+' '+(x2-9)+','+(y-5)+' '+(x2-9)+','+(y+5)+'" fill="'+color+'"/>';
}
function jarrowV(x,y1,y2,color){
  return jline(x,y1,x,y2-7,color,2) + '<polygon points="'+x+','+y2+' '+(x-5)+','+(y2-9)+' '+(x+5)+','+(y2-9)+'" fill="'+color+'"/>';
}
function bindAnim(prefix, totalFn, paintFn, outFn){
  const st = {step:0, timer:null, playing:false};
  function sync(){
    paintFn(st.step);
    const o = $('#'+prefix+'Out'); if(o) o.innerHTML = outFn(st.step);
    const b = $('#'+prefix+'Play'); if(b) b.textContent = st.playing ? '❚❚ 暂停' : '▶ 播放';
    const c = $('#'+prefix+'Count'); if(c) c.textContent = '步 ' + st.step + ' / ' + totalFn();
  }
  function stop(){ st.playing = false; clearInterval(st.timer); st.timer = null; sync(); }
  function play(){
    if(st.playing){ stop(); return; }
    if(st.step >= totalFn()) st.step = 0;
    st.playing = true;
    st.timer = setInterval(() => { if(st.step < totalFn()){ st.step++; sync(); } else stop(); }, 900);
    sync();
  }
  function once(){ stop(); if(st.step < totalFn()) st.step++; sync(); }
  function reset(){ stop(); st.step = 0; sync(); }
  const p = $('#'+prefix+'Play'), s = $('#'+prefix+'Step'), r = $('#'+prefix+'Reset'), sel = $('#'+prefix+'Sel');
  if(p) p.onclick = play;
  if(s) s.onclick = once;
  if(r) r.onclick = reset;
  if(sel) sel.onchange = reset;
  sync();
  return st;
}

/* ---------- 动画 B：NOT IN 的三值逻辑 ---------- */
const A10_RIGHT = {a:['1','NULL'], b:['1','2'], c:['NULL','2'], d:['2','NULL']};
function a10Calc(){
  const left = $('#aj10Left').value;
  const vals = A10_RIGHT[$('#aj10Sel').value] || A10_RIGHT.a;
  const comps = vals.map(v => (left === 'NULL' || v === 'NULL') ? 'UNKNOWN' : (left === v ? 'TRUE' : 'FALSE'));
  const inRes = comps.indexOf('TRUE') >= 0 ? 'TRUE' : (comps.indexOf('UNKNOWN') >= 0 ? 'UNKNOWN' : 'FALSE');
  const notRes = inRes === 'UNKNOWN' ? 'UNKNOWN' : (inRes === 'TRUE' ? 'FALSE' : 'TRUE');
  const keep = notRes === 'TRUE';
  const antiKeep = comps.indexOf('TRUE') < 0;
  return {left, vals, comps, inRes, notRes, keep, antiKeep};
}
function a10Total(){ return 5; }
function a10Color(v){ return v==='TRUE'?P.green : (v==='FALSE'?P.ink2 : P.accent); }
function a10Paint(step){
  const c = a10Calc();
  let g = '';
  const L = 40, W = 840;
  g += jr(L,76,W,56, P.primL, P.line,1);
  g += jct(L,76,W,56,'原式：'+c.left+' NOT IN ('+c.vals.join(', ')+')',16,P.primary,'center',600,14);
  g += jr(L,142,W,78, P.white, P.line,1);
  g += jct(L,142,W,78, step>=1 ? '展开：NOT( '+c.left+' = '+c.vals[0]+'  OR  '+c.left+' = '+c.vals[1]+' )　｜　IN 等价于 = ANY'
                                  : '展开：等待播放', 14, step>=1?P.ink:P.muted,'center',500,14);
  g += jr(L,230,W,86, P.paper2, P.line,1);
  if(step >= 2){
    g += jct(L+12,234,W-24,38, c.left+' = '+c.vals[0]+'  →  '+c.comps[0], 15, a10Color(c.comps[0]),'center',600,8);
    g += jct(L+12,274,W-24,38, c.left+' = '+c.vals[1]+'  →  '+c.comps[1], 15, a10Color(c.comps[1]),'center',600,8);
  }else{
    g += jct(L,230,W,86,'逐项比较：等待播放',14,P.muted,'center',400,14);
  }
  const RX = 920, RW = 440;
  const items = [
    ['① OR 累积（IN 的结果）', step>=3 ? c.inRes : '—', step>=3],
    ['② NOT 取反（NOT IN）', step>=4 ? c.notRes : '—', step>=4],
    ['③ WHERE 去留', step>=5 ? (c.keep?'保留这一行':'丢弃这一行') : '—', step>=5],
    ['④ 对照 Anti Join', step>=5 ? (c.antiKeep?'应保留':'应丢弃') : '—', step>=5]
  ];
  items.forEach((it,i) => {
    const y = 76 + i*66;
    const on = it[2];
    g += jr(RX,y,RW,56, on?(i===3?(c.keep!==c.antiKeep?P.accL:P.greenL):P.white):P.paper2, on?P.line:P.line,1);
    g += jct(RX+12,y,160,56,it[0],12.5,P.ink2,'left',500,4);
    g += jct(RX+178,y,RW-190,56,it[1],15,on?a10Color(it[1]==='保留这一行'||it[1]==='应保留'?'TRUE':(it[1]==='丢弃这一行'||it[1]==='应丢弃'?'FALSE':it[1])):P.muted,'center',600,4);
  });
  const diverge = c.keep !== c.antiKeep;
  const l1 = step>=5
    ? (diverge ? '结论：NOT IN 与 Anti Join 在这里不一致 —— 这正是 NULL 安全边界。'
               : '结论：这一组输入下，NOT IN 与 Anti Join 的去留一致。')
    : '三值逻辑：TRUE / FALSE / UNKNOWN；UNKNOWN 在 WHERE 中与 false 一样不保留行。';
  const l2 = '官方文档 func-subquery.sgml：IN 等价 = ANY；左侧为 NULL 或右侧无相等值但含 NULL 时，NOT IN 得 NULL。';

  g += jct(1040,186,320,62,'无匹配 → 输出左侧行',14,bOut?P.green:P.muted,'center',600,10);
  g += jarrowV(820,140,180, bHit?P.accent:P.line);
  g += jline(962,107,1200,107, bOut?P.green:P.line,1.6);
  g += jarrowV(1200,107,180, bOut?P.green:P.line);
  g += jct(40,266,290,46,'内侧候选（示意 4 条）',12.5,P.muted,'left',400,4);
  const lit = Math.min(step, probes);
  for(let i=0;i<4;i++){
    const x = 360 + i*72, on = i < lit;
    g += jr(x,268,64,44, on?P.primL:P.paper2, on?P.primary:P.line, on?1.6:1);
    g += jct(x,268,64,44,String(i+1),15,on?P.primary:P.muted,'center',600,4);
  }
  let l1, l2;
  if(step===0){ l1='取一行外侧 tuple，准备逐个探测内侧候选。'; l2='Hash bucket / 索引范围 / merge key group 只是查找方式不同，语义状态机相同。'; }
  else if(step<=probes){
    l1 = '探测第 '+step+' 条候选' + (step===probes ? (m.matched?'：命中，立即停止扫描。':'：全部候选查完，确认无匹配。') : '：继续。');
    l2 = m.matched ? '有匹配的外侧行：找到第一条即可丢弃，内侧扫描提前停止。'
                   : '无匹配的外侧行：必须证明不存在，探测要走到底，这是 Anti Join 的成本风险。';
  }else if(step===probes+1){
    l1 = m.matched ? '判定：命中 joinqual → 不返回匹配 tuple，直接取下一外侧行。'
                   : '判定：候选全部失败 → 输出当前左侧行（null-extended 中的左侧部分）。';
    l2 = 'nodeHashjoin.c 设 HJ_NEED_NEW_OUTER；nodeNestloop.c 设 nl_NeedNewOuter；nodeMergejoin.c 推进下一个 outer。';
  }else{
    l1 = '进入下一行外侧 tuple，循环继续。';
    l2 = '有匹配时提前停止，无匹配时必须完整探测 —— 成本模型的两面来自这里。';
  }
  g += jr(40,346,1320,64,P.paper2,P.line,1);
  g += jct(56,350,1288,30,l1,14,P.ink,'left',600,4);
  g += jct(56,378,1288,30,l2,12.5,P.ink2,'left',400,4);
  $('#aj15dyn').innerHTML = g;
}
function a15Out(step){
  const m = a15Mode();
  const used = Math.min(step, m.probes);
  return '已探测 <b>'+used+' / '+m.probes+'</b> 次 · '+(step>=m.probes+1 ? (m.matched?'判定：<b>丢弃</b>':'判定：<b>输出</b>') : '探测中');
}

/* ---------- 初始化 ---------- */
function init(){
  render();
  $('#btnPrev').onclick = prev;
  $('#btnNext').onclick = next;
  $('#btnToc').onclick  = () => togglePanel('toc');
  $('#btnNotes').onclick= () => togglePanel('here');
  $('#btnAll').onclick  = () => togglePanel('all');
  $('#btnAuto').onclick = toggleAuto;
  $('#btnFs').onclick   = fs;
  $('#btnHelp').onclick = () => togglePanel('help');
  $('#pclose').onclick  = closePanel;
  $('#panel').setAttribute('aria-hidden','true');
  bindAnim('aj4',  a4Total,  a4Paint,  a4Out);
  bindAnim('aj10', a10Total, a10Paint, a10Out);
  $('#aj10Left').onchange = () => a10Reset();
  bindAnim('aj15', a15Total, a15Paint, a15Out);
  let start = 0;
  try{ start = parseInt(localStorage.getItem('antijoin-slide') || '0', 10) || 0; }catch(e){}
  go(Math.min(start, N-1), true);
  fit();
}
function a10Reset(){
  const r = $('#aj10Reset'); if(r) r.click();
}
init();
</script>
