<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK', sans-serif">
  <title id="title">PostgreSQL 等待事件的两个层级</title>
  <desc id="desc">展示 wait_event_type 大类与 wait_event 具体事件的从属关系，包括 Lock、LWLock、IO、IPC、Client、Timeout、Buffer、Activity 八个大类及其下的具体事件示例。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f5d8c"/>
    </marker>
  </defs>
  <rect x="20" y="20" width="940" height="580" rx="8" fill="#fbfcfe" stroke="#c8d3df"/>
  <text x="490" y="56" text-anchor="middle" font-size="25" font-weight="700" fill="#22313f">wait_event_type 是大类，wait_event 是具体原因</text>
  <text x="490" y="82" text-anchor="middle" font-size="15" fill="#5b6773">两个字段来自同一个 32 位整数 wait_event_info，不是两套独立统计</text>

  <rect x="60" y="108" width="190" height="56" rx="8" fill="#e7f0fa" stroke="#7fa7cf"/>
  <text x="155" y="134" text-anchor="middle" font-size="16" font-weight="700" fill="#1d3557">Lock</text>
  <text x="155" y="153" text-anchor="middle" font-size="12" fill="#31485f">锁等待</text>

  <rect x="60" y="178" width="190" height="56" rx="8" fill="#e7f0fa" stroke="#7fa7cf"/>
  <text x="155" y="204" text-anchor="middle" font-size="16" font-weight="700" fill="#1d3557">LWLock</text>
  <text x="155" y="223" text-anchor="middle" font-size="12" fill="#31485f">轻量锁</text>

  <rect x="60" y="248" width="190" height="56" rx="8" fill="#e7f0fa" stroke="#7fa7cf"/>
  <text x="155" y="274" text-anchor="middle" font-size="16" font-weight="700" fill="#1d3557">IO</text>
  <text x="155" y="293" text-anchor="middle" font-size="12" fill="#31485f">文件与 WAL</text>

  <rect x="60" y="318" width="190" height="56" rx="8" fill="#e7f0fa" stroke="#7fa7cf"/>
  <text x="155" y="344" text-anchor="middle" font-size="16" font-weight="700" fill="#1d3557">IPC</text>
  <text x="155" y="363" text-anchor="middle" font-size="12" fill="#31485f">进程间通信</text>

  <rect x="60" y="388" width="190" height="56" rx="8" fill="#e7f0fa" stroke="#7fa7cf"/>
  <text x="155" y="414" text-anchor="middle" font-size="16" font-weight="700" fill="#1d3557">Client</text>
  <text x="155" y="433" text-anchor="middle" font-size="12" fill="#31485f">等客户端</text>

  <rect x="60" y="458" width="190" height="56" rx="8" fill="#e7f0fa" stroke="#7fa7cf"/>
  <text x="155" y="484" text-anchor="middle" font-size="16" font-weight="700" fill="#1d3557">Timeout</text>
  <text x="155" y="503" text-anchor="middle" font-size="12" fill="#31485f">定时睡眠</text>

  <rect x="60" y="523" width="190" height="42" rx="8" fill="#e7f0fa" stroke="#7fa7cf"/>
  <text x="155" y="549" text-anchor="middle" font-size="16" font-weight="700" fill="#1d3557">Buffer</text>

  <rect x="60" y="571" width="190" height="42" rx="8" fill="#e7f0fa" stroke="#7fa7cf"/>
  <text x="155" y="597" text-anchor="middle" font-size="16" font-weight="700" fill="#1d3557">Activity</text>

  <path fill="none" d="M250 136 L340 136" stroke="#2f5d8c" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path fill="none" d="M250 206 L340 206" stroke="#2f5d8c" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path fill="none" d="M250 276 L340 276" stroke="#2f5d8c" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path fill="none" d="M250 346 L340 346" stroke="#2f5d8c" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path fill="none" d="M250 416 L340 416" stroke="#2f5d8c" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path fill="none" d="M250 486 L340 486" stroke="#2f5d8c" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path fill="none" d="M250 544 L340 544" stroke="#2f5d8c" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path fill="none" d="M250 592 L340 592" stroke="#2f5d8c" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="345" y="108" width="270" height="56" rx="8" fill="#e9f7ef" stroke="#73b58a"/>
  <text x="480" y="134" text-anchor="middle" font-size="15" font-weight="700" fill="#195c3f">transactionid</text>
  <text x="480" y="153" text-anchor="middle" font-size="12" fill="#2c674d">等事务 id 锁</text>

  <rect x="345" y="178" width="270" height="56" rx="8" fill="#e9f7ef" stroke="#73b58a"/>
  <text x="480" y="204" text-anchor="middle" font-size="15" font-weight="700" fill="#195c3f">tuple</text>
  <text x="480" y="223" text-anchor="middle" font-size="12" fill="#2c674d">等行锁</text>

  <rect x="345" y="248" width="270" height="56" rx="8" fill="#e9f7ef" stroke="#73b58a"/>
  <text x="480" y="274" text-anchor="middle" font-size="15" font-weight="700" fill="#195c3f">WALWrite / WalSync</text>
  <text x="480" y="293" text-anchor="middle" font-size="12" fill="#2c674d">等 WAL 落盘</text>

  <rect x="345" y="318" width="270" height="56" rx="8" fill="#e9f7ef" stroke="#73b58a"/>
  <text x="480" y="344" text-anchor="middle" font-size="15" font-weight="700" fill="#195c3f">ParallelHashJoin</text>
  <text x="480" y="363" text-anchor="middle" font-size="12" fill="#2c674d">并行 hash 协作</text>

  <rect x="345" y="388" width="270" height="56" rx="8" fill="#e9f7ef" stroke="#73b58a"/>
  <text x="480" y="414" text-anchor="middle" font-size="15" font-weight="700" fill="#195c3f">ClientRead</text>
  <text x="480" y="433" text-anchor="middle" font-size="12" fill="#2c674d">等客户端下一条消息</text>

  <rect x="345" y="458" width="270" height="56" rx="8" fill="#e9f7ef" stroke="#73b58a"/>
  <text x="480" y="484" text-anchor="middle" font-size="15" font-weight="700" fill="#195c3f">PgSleep</text>
  <text x="480" y="503" text-anchor="middle" font-size="12" fill="#2c674d">定时等待</text>

  <rect x="345" y="523" width="270" height="42" rx="8" fill="#e9f7ef" stroke="#73b58a"/>
  <text x="480" y="549" text-anchor="middle" font-size="15" font-weight="700" fill="#195c3f">BufferShared</text>

  <rect x="345" y="571" width="270" height="42" rx="8" fill="#e9f7ef" stroke="#73b58a"/>
  <text x="480" y="597" text-anchor="middle" font-size="15" font-weight="700" fill="#195c3f">CheckpointerMain</text>

  <rect x="660" y="150" width="270" height="300" rx="8" fill="#f5f6f8" stroke="#b8c1cc"/>
  <text x="795" y="180" text-anchor="middle" font-size="16" font-weight="700" fill="#34495e">为什么分两层</text>
  <text x="680" y="212" font-size="13" fill="#4a5a6a">类型用于归因统计：</text>
  <text x="680" y="234" font-size="13" fill="#4a5a6a">这一类等待占多少比例</text>
  <text x="680" y="266" font-size="13" fill="#4a5a6a">事件用于精确定位：</text>
  <text x="680" y="288" font-size="13" fill="#4a5a6a">具体卡在哪个资源</text>
  <text x="680" y="322" font-size="13" fill="#4a5a6a">类型可加，事件名唯一</text>
  <text x="680" y="346" font-size="13" fill="#4a5a6a">8 个大类，190 个事件</text>
  <text x="680" y="380" font-size="13" fill="#4a5a6a">先看类型定方向</text>
  <text x="680" y="404" font-size="13" fill="#4a5a6a">再看事件挖根因</text>

  <text x="660" y="500" font-size="13" fill="#4a5a6a">两者由同一个 32 位整数解码</text>
  <text x="660" y="528" font-size="14" font-weight="700" fill="#34495e">要点：类型定方向，事件挖根因</text>
</svg>
