<svg xmlns="http://www.w3.org/2000/svg" width="980" height="640" viewBox="0 0 980 640" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK', sans-serif">
  <title id="title">wait_event_info 32 位编码的完整链路</title>
  <desc id="desc">展示从业务代码调用 pgstat_report_wait_start 到写入 PGPROC.wait_event_info，再由 pg_stat_activity 解码出 wait_event_type 与 wait_event 的完整数据流，标注 32 位编码的位布局。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f5d8c"/>
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1b7f5a"/>
    </marker>
  </defs>
  <rect x="20" y="20" width="940" height="600" rx="8" fill="#fbfcfe" stroke="#c8d3df"/>
  <text x="490" y="56" text-anchor="middle" font-size="25" font-weight="700" fill="#22313f">一个 32 位整数贯穿全链路</text>
  <text x="490" y="82" text-anchor="middle" font-size="15" fill="#5b6773">PG_WAIT_LOCK | locktag_type，或 PG_WAIT_LWLOCK | tranche</text>

  <rect x="55" y="110" width="300" height="70" rx="8" fill="#fff3d6" stroke="#d7aa38"/>
  <text x="205" y="138" text-anchor="middle" font-size="16" font-weight="700" fill="#664d03">业务代码进入等待点</text>
  <text x="205" y="162" text-anchor="middle" font-size="13" fill="#705d28">LWLockAcquire / LockAcquire / latch</text>

  <path fill="none" d="M355 145 L455 145" stroke="#2f5d8c" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="405" y="135" text-anchor="middle" font-size="12" fill="#2f5d8c">上报</text>

  <rect x="460" y="110" width="290" height="70" rx="8" fill="#e7f0fa" stroke="#7fa7cf"/>
  <text x="605" y="136" text-anchor="middle" font-size="16" font-weight="700" fill="#1d3557">pgstat_report_wait_start</text>
  <text x="605" y="160" text-anchor="middle" font-size="13" fill="#31485f">组装 classId | eventId</text>

  <path fill="none" d="M750 145 L850 145" stroke="#2f5d8c" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="855" y="110" width="100" height="70" rx="8" fill="#e9f7ef" stroke="#73b58a"/>
  <text x="905" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#195c3f">PGPROC</text>
  <text x="905" y="160" text-anchor="middle" font-size="12" fill="#2c674d">共享内存</text>

  <path fill="none" d="M905 180 L905 235" stroke="#2f5d8c" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="300" y="240" width="620" height="70" rx="8" fill="#fdf2f2" stroke="#d98c8c"/>
  <text x="610" y="266" text-anchor="middle" font-size="15" font-weight="700" fill="#8c2f2f">wait_event_info  0x09000003</text>
  <text x="610" y="292" text-anchor="middle" font-size="13" fill="#9a4a4a">classId = 0x09 高 8 位　　eventId = 0x0003 低 16 位　　中间 8 位保留为 0</text>

  <path fill="none" d="M300 275 L205 275 L205 360" stroke="#2f5d8c" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="55" y="365" width="300" height="70" rx="8" fill="#e7f0fa" stroke="#7fa7cf"/>
  <text x="205" y="392" text-anchor="middle" font-size="16" font-weight="700" fill="#1d3557">pg_stat_get_activity</text>
  <text x="205" y="416" text-anchor="middle" font-size="13" fill="#31485f">读 PGPROC，按位解码</text>

  <path fill="none" d="M355 400 L455 400" stroke="#1b7f5a" stroke-width="3" marker-end="url(#arrow2)"/>

  <rect x="460" y="330" width="290" height="60" rx="8" fill="#e9f7ef" stroke="#73b58a"/>
  <text x="605" y="366" text-anchor="middle" font-size="15" font-weight="700" fill="#195c3f">wait_event_type = Timeout</text>

  <rect x="460" y="405" width="290" height="60" rx="8" fill="#e9f7ef" stroke="#73b58a"/>
  <text x="605" y="441" text-anchor="middle" font-size="15" font-weight="700" fill="#195c3f">wait_event = PgSleep</text>

  <rect x="55" y="500" width="300" height="60" rx="8" fill="#f5f6f8" stroke="#b8c1cc"/>
  <text x="205" y="538" text-anchor="middle" font-size="15" font-weight="700" fill="#34495e">pg_wait_events 视图</text>

  <path fill="none" d="M605 465 L605 490 L355 490 L355 530 L360 530" stroke="#1b7f5a" stroke-width="3" marker-end="url(#arrow2)"/>

  <rect x="460" y="500" width="460" height="60" rx="8" fill="#f5f6f8" stroke="#b8c1cc"/>
  <text x="690" y="538" text-anchor="middle" font-size="15" font-weight="700" fill="#34495e">190 条事件清单，含 type / name / description</text>

  <path fill="none" d="M905 180 L905 500" stroke="#2f5d8c" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="905" y="592" text-anchor="end" font-size="12" fill="#2f5d8c">其他 backend 也能读到</text>

  <text x="70" y="595" font-size="14" fill="#5b6773">要点：写入与读取走的是同一个字段，SQL 层只是按位解码，没有第二份状态。</text>
</svg>
