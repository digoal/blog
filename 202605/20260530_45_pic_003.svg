<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK', sans-serif">
  <title id="title">八类等待事件的典型来源与诊断方向</title>
  <desc id="desc">按 Lock、LWLock、IO、IPC、Buffer、Client、Timeout、Activity 八个大类，分别列出真实采集到的事件名、典型来源以及对应的排查方向。</desc>
  <rect x="20" y="20" width="940" height="580" rx="8" fill="#fbfcfe" stroke="#c8d3df"/>
  <text x="490" y="56" text-anchor="middle" font-size="25" font-weight="700" fill="#22313f">八个大类，八种完全不同的排查思路</text>
  <text x="490" y="82" text-anchor="middle" font-size="15" fill="#5b6773">下面每个事件名都来自 PG 20devel 实例的真实采样</text>

  <rect x="55" y="105" width="205" height="112" rx="8" fill="#fdf2f2" stroke="#d98c8c"/>
  <text x="157" y="130" text-anchor="middle" font-size="16" font-weight="700" fill="#8c2f2f">Lock</text>
  <text x="70" y="152" font-size="12" fill="#9a4a4a">transactionid / tuple</text>
  <text x="70" y="174" font-size="12" fill="#4a5a6a">来源：行锁、事务冲突</text>
  <text x="70" y="196" font-size="12" fill="#4a5a6a">方向：谁在等谁</text>

  <rect x="277" y="105" width="205" height="112" rx="8" fill="#fdf2f2" stroke="#d98c8c"/>
  <text x="379" y="130" text-anchor="middle" font-size="16" font-weight="700" fill="#8c2f2f">LWLock</text>
  <text x="292" y="152" font-size="12" fill="#9a4a4a">WALWrite 等 tranche</text>
  <text x="292" y="174" font-size="12" fill="#4a5a6a">来源：内部轻量锁</text>
  <text x="292" y="196" font-size="12" fill="#4a5a6a">方向：哪个子系统</text>

  <rect x="499" y="105" width="205" height="112" rx="8" fill="#fff8e6" stroke="#e0c069"/>
  <text x="601" y="130" text-anchor="middle" font-size="16" font-weight="700" fill="#7a5c10">IO</text>
  <text x="514" y="152" font-size="12" fill="#9a7b2e">DataFileRead / WALWrite</text>
  <text x="514" y="174" font-size="12" fill="#4a5a6a">来源：磁盘与网络</text>
  <text x="514" y="196" font-size="12" fill="#4a5a6a">方向：存储是否够快</text>

  <rect x="721" y="105" width="205" height="112" rx="8" fill="#fff8e6" stroke="#e0c069"/>
  <text x="823" y="130" text-anchor="middle" font-size="16" font-weight="700" fill="#7a5c10">IPC</text>
  <text x="736" y="152" font-size="12" fill="#9a7b2e">ParallelHashJoin 等</text>
  <text x="736" y="174" font-size="12" fill="#4a5a6a">来源：进程间协作</text>
  <text x="736" y="196" font-size="12" fill="#4a5a6a">方向：并行是否拖累</text>

  <rect x="55" y="232" width="205" height="112" rx="8" fill="#f2f0fb" stroke="#a99bd4"/>
  <text x="157" y="257" text-anchor="middle" font-size="16" font-weight="700" fill="#4b3a86">Buffer</text>
  <text x="70" y="279" font-size="12" fill="#6a5aa0">BufferShared 等</text>
  <text x="70" y="301" font-size="12" fill="#4a5a6a">来源：缓冲页内容锁</text>
  <text x="70" y="323" font-size="12" fill="#4a5a6a">方向：页级争用</text>

  <rect x="277" y="232" width="205" height="112" rx="8" fill="#e9f7ef" stroke="#73b58a"/>
  <text x="379" y="257" text-anchor="middle" font-size="16" font-weight="700" fill="#195c3f">Client</text>
  <text x="292" y="279" font-size="12" fill="#2c674d">ClientRead</text>
  <text x="292" y="301" font-size="12" fill="#4a5a6a">来源：客户端没发下一条</text>
  <text x="292" y="323" font-size="12" fill="#4a5a6a">方向：应用侧慢</text>

  <rect x="499" y="232" width="205" height="112" rx="8" fill="#e9f7ef" stroke="#73b58a"/>
  <text x="601" y="257" text-anchor="middle" font-size="16" font-weight="700" fill="#195c3f">Timeout</text>
  <text x="514" y="279" font-size="12" fill="#2c674d">PgSleep / VacuumDelay</text>
  <text x="514" y="301" font-size="12" fill="#4a5a6a">来源：主动定时睡眠</text>
  <text x="514" y="323" font-size="12" fill="#4a5a6a">方向：多半是假象</text>

  <rect x="721" y="232" width="205" height="112" rx="8" fill="#f5f6f8" stroke="#b8c1cc"/>
  <text x="823" y="257" text-anchor="middle" font-size="16" font-weight="700" fill="#34495e">Activity</text>
  <text x="736" y="279" font-size="12" fill="#5b6773">CheckpointerMain 等</text>
  <text x="736" y="301" font-size="12" fill="#4a5a6a">来源：后台进程主循环</text>
  <text x="736" y="323" font-size="12" fill="#4a5a6a">方向：通常可忽略</text>

  <rect x="55" y="368" width="871" height="120" rx="8" fill="#f5f6f8" stroke="#b8c1cc"/>
  <text x="490" y="394" text-anchor="middle" font-size="16" font-weight="700" fill="#34495e">排查顺序建议</text>
  <text x="85" y="422" font-size="14" fill="#4a5a6a">1. 先过滤掉 Client 与 Activity，这两类通常说明数据库在等外部，不是数据库自己的问题</text>
  <text x="85" y="448" font-size="14" fill="#4a5a6a">2. Lock 与 LWLock 指向并发与锁竞争，是应用逻辑问题的典型信号</text>
  <text x="85" y="474" font-size="14" fill="#4a5a6a">3. IO 与 Buffer 指向存储层，往往要配合系统层的 iostat、慢盘与缓存命中率一起看</text>

  <text x="70" y="520" font-size="14" fill="#5b6773">要点：等待事件告诉你“卡在哪”，不告诉你“为什么卡”；归因仍然需要结合业务语义和系统指标。</text>
</svg>
