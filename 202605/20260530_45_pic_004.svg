<svg xmlns="http://www.w3.org/2000/svg" width="980" height="640" viewBox="0 0 980 640" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK', sans-serif">
  <title id="title">从 wait_event_info 原始值到等待事件名的解码实证</title>
  <desc id="desc">展示通过 /proc/pid/mem 直读 PGPROC 共享内存，取出 wait_event_info 原始 32 位值，再与 SQL 视图交叉验证的实验方法与四组实测结果。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f5d8c"/>
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1b7f5a"/>
    </marker>
  </defs>
  <rect x="20" y="20" width="940" height="600" rx="8" fill="#fbfcfe" stroke="#c8d3df"/>
  <text x="490" y="56" text-anchor="middle" font-size="25" font-weight="700" fill="#22313f">不猜，直接把内存里的原始值读出来</text>
  <text x="490" y="82" text-anchor="middle" font-size="15" fill="#5b6773">读 PGPROC 共享内存，与 pg_stat_activity 交叉验证同一时刻的编码</text>

  <rect x="55" y="108" width="255" height="96" rx="8" fill="#e7f0fa" stroke="#7fa7cf"/>
  <text x="182" y="134" text-anchor="middle" font-size="16" font-weight="700" fill="#1d3557">第一步：定位 PGPROC</text>
  <text x="70" y="158" font-size="12" fill="#31485f">读 /proc/&lt;pid&gt;/maps 找匿名共享段</text>
  <text x="70" y="180" font-size="12" fill="#31485f">按 sizeof(PGPROC)=896 扫描</text>
  <text x="70" y="198" font-size="12" fill="#31485f">用 offsetof(pid)=24 匹配目标 pid</text>

  <path fill="none" d="M310 156 L370 156" stroke="#2f5d8c" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="375" y="108" width="255" height="96" rx="8" fill="#e7f0fa" stroke="#7fa7cf"/>
  <text x="502" y="134" text-anchor="middle" font-size="16" font-weight="700" fill="#1d3557">第二步：取原始值</text>
  <text x="390" y="158" font-size="12" fill="#31485f">/proc/&lt;pid&gt;/mem 读偏移 856</text>
  <text x="390" y="180" font-size="12" fill="#31485f">offsetof(wait_event_info)</text>
  <text x="390" y="198" font-size="12" fill="#31485f">unpack 4 字节无符号整数</text>

  <path fill="none" d="M630 156 L690 156" stroke="#2f5d8c" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="695" y="108" width="255" height="96" rx="8" fill="#fdf2f2" stroke="#d98c8c"/>
  <text x="822" y="134" text-anchor="middle" font-size="16" font-weight="700" fill="#8c2f2f">第三步：交叉验证</text>
  <text x="710" y="158" font-size="12" fill="#9a4a4a">同一窗口读 SQL 视图的值</text>
  <text x="710" y="180" font-size="12" fill="#9a4a4a">mem → SQL → mem 双读</text>
  <text x="710" y="198" font-size="12" fill="#9a4a4a">两次内存值一致才纳入比对</text>

  <text x="490" y="242" text-anchor="middle" font-size="18" font-weight="700" fill="#22313f">四组实测结果</text>

  <rect x="55" y="262" width="208" height="150" rx="8" fill="#e9f7ef" stroke="#73b58a"/>
  <text x="159" y="288" text-anchor="middle" font-size="15" font-weight="700" fill="#195c3f">pg_sleep(60)</text>
  <text x="159" y="316" text-anchor="middle" font-size="16" font-weight="700" fill="#195c3f">0x09000003</text>
  <text x="159" y="344" text-anchor="middle" font-size="13" fill="#2c674d">Timeout</text>
  <text x="159" y="366" text-anchor="middle" font-size="13" fill="#2c674d">PgSleep</text>
  <text x="159" y="392" text-anchor="middle" font-size="12" fill="#4a5a6a">class 0x09</text>

  <rect x="275" y="262" width="208" height="150" rx="8" fill="#e9f7ef" stroke="#73b58a"/>
  <text x="379" y="288" text-anchor="middle" font-size="15" font-weight="700" fill="#195c3f">行锁冲突</text>
  <text x="379" y="316" text-anchor="middle" font-size="16" font-weight="700" fill="#195c3f">0x03000005</text>
  <text x="379" y="344" text-anchor="middle" font-size="13" fill="#2c674d">Lock</text>
  <text x="379" y="366" text-anchor="middle" font-size="13" fill="#2c674d">transactionid</text>
  <text x="379" y="392" text-anchor="middle" font-size="12" fill="#4a5a6a">locktag type 5</text>

  <rect x="495" y="262" width="208" height="150" rx="8" fill="#e9f7ef" stroke="#73b58a"/>
  <text x="599" y="288" text-anchor="middle" font-size="15" font-weight="700" fill="#195c3f">COPY TO 文件</text>
  <text x="599" y="316" text-anchor="middle" font-size="16" font-weight="700" fill="#195c3f">0x0a000012</text>
  <text x="599" y="344" text-anchor="middle" font-size="13" fill="#2c674d">IO</text>
  <text x="599" y="366" text-anchor="middle" font-size="13" fill="#2c674d">CopyToWrite</text>
  <text x="599" y="392" text-anchor="middle" font-size="12" fill="#4a5a6a">class 0x0a</text>

  <rect x="715" y="262" width="208" height="150" rx="8" fill="#e9f7ef" stroke="#73b58a"/>
  <text x="819" y="288" text-anchor="middle" font-size="15" font-weight="700" fill="#195c3f">WAL 刷盘</text>
  <text x="819" y="316" text-anchor="middle" font-size="16" font-weight="700" fill="#195c3f">0x0a000052</text>
  <text x="819" y="344" text-anchor="middle" font-size="13" fill="#2c674d">IO</text>
  <text x="819" y="366" text-anchor="middle" font-size="13" fill="#2c674d">WALWrite</text>
  <text x="819" y="392" text-anchor="middle" font-size="12" fill="#4a5a6a">class 0x0a</text>

  <rect x="55" y="432" width="868" height="80" rx="8" fill="#f5f6f8" stroke="#b8c1cc"/>
  <text x="490" y="458" text-anchor="middle" font-size="15" font-weight="700" fill="#34495e">最终验证结果</text>
  <text x="490" y="486" text-anchor="middle" font-size="15" fill="#4a5a6a">17 组采样，SQL 视图解码值与共享内存原始值逐条一致，不一致 0 条</text>

  <rect x="55" y="526" width="868" height="64" rx="8" fill="#fff3d6" stroke="#d7aa38"/>
  <text x="490" y="552" text-anchor="middle" font-size="14" font-weight="700" fill="#664d03">踩过的坑</text>
  <text x="490" y="576" text-anchor="middle" font-size="13" fill="#705d28">按 pid 扫描共享内存会误匹配到别的结构体，必须校验解码出的 class 是否属于已知等待类</text>

  <text x="70" y="605" font-size="14" fill="#5b6773">要点：位布局不是从文档推出来的，是从运行中的实例里读出来并与 SQL 视图对上号的。</text>
</svg>
