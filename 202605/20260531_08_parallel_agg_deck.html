<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数据库筑基课 · 聚合之 Parallel Agg</title>
<style>
  :root{
    --paper:#F7F6F2; --sub:#F1EFE9; --letter:#E9E7E1;
    --ink:#1B2B33; --ink2:#46585F; --weak:#89938F; --line:#D9D5CB; --white:#FFFFFF;
    --indigo:#245A6B; --indigoL:#E5EFF0; --indigoM:#7BA6AF;
    --clay:#BE653B; --clayL:#F7E9DE; --green:#2F7A66; --greenL:#E4F0EA;
    --gold:#AE8A3E; --goldL:#F5EDDC;
    --serif:"Songti SC","STSong","Noto Serif CJK SC",Georgia,serif;
    --sans:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
    --mono:"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--letter);color:var(--ink);font-family:var(--sans)}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--letter)}
  #mainRow{flex:1;display:flex;min-height:0}
  #viewport{flex:1;min-width:0;position:relative;overflow:hidden;background:var(--letter)}
  #stageWrap{position:absolute;width:1600px;height:900px;transform-origin:0 0;transform:scale(var(--s,1))}
  #stage{position:absolute;inset:0;width:1600px;height:900px;background:var(--paper);overflow:hidden}
  .page{position:absolute;inset:0;display:none;background:var(--paper)}
  .page.active{display:block}
  .eyebrow{position:absolute;left:64px;top:52px;font:13px/1 var(--sans);letter-spacing:3.4px;color:var(--indigo)}
  .title{position:absolute;left:64px;top:86px;width:1472px;font:44px/1.28 var(--serif);color:var(--ink);font-weight:600}
  .lede{position:absolute;left:64px;top:146px;width:1472px;font:19px/1.55 var(--sans);color:var(--ink2)}
  .rule{position:absolute;left:64px;top:186px;width:1472px;height:1px;background:var(--line)}
  .figure{position:absolute;left:100px;top:198px;width:1400px;height:430px}
  .figure svg{display:block;width:1400px;height:430px;overflow:visible}
  .caption{position:absolute;left:100px;top:640px;width:1400px;font:13px/1.55 var(--sans);color:var(--weak)}
  .next{position:absolute;left:64px;top:716px;width:1472px;min-height:52px;border-left:3px solid var(--clay);padding:5px 0 5px 18px;display:flex;flex-direction:column;gap:3px}
  .next-k{font:12px/1 var(--sans);letter-spacing:2.4px;color:var(--clay)}
  .next-t{font:20px/1.45 var(--serif);color:var(--ink)}
  .footer{position:absolute;left:64px;top:846px;width:1472px;border-top:1px solid var(--line);padding-top:9px;display:flex;justify-content:space-between;font:12px/1 var(--mono);color:var(--weak)}
  /* cover */
  .page.cover .title{top:96px;font-size:68px;line-height:1.38}
  .page.cover .lede{top:214px;font-size:21px}
  .page.cover .rule{top:270px}
  .page.cover .figure{top:290px;height:430px}
  .page.cover .caption{top:730px}
  .page.cover .next{top:770px}
  /* animation controls */
  .anim-ctrl{position:absolute;left:100px;top:566px;width:1400px;height:58px;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--sub);border:1px solid var(--line);font:14px var(--sans);color:var(--ink2)}
  .anim-ctrl label{display:flex;align-items:center;gap:7px;white-space:nowrap}
  .anim-ctrl input{font:14px var(--mono);color:var(--ink);background:var(--white);border:1px solid var(--line);padding:6px 9px;outline:none}
  .anim-ctrl input:focus{border-color:var(--indigo)}
  .anim-ctrl input[type=number]{width:92px}
  .anim-ctrl input[type=text]{width:268px}
  .anim-ctrl button{font:14px var(--sans);color:var(--ink);background:var(--white);border:1px solid var(--indigoM);padding:7px 16px;cursor:pointer}
  .anim-ctrl button:hover{background:var(--indigoL)}
  .anim-ctrl button.primary{background:var(--indigo);color:#fff;border-color:var(--indigo)}
  .anim-ctrl button.primary:hover{background:#1b4856}
  .anim-ctrl .hint{margin-left:auto;font:12px var(--sans);color:var(--weak)}
  /* notes panel */
  #notes{display:none;width:38%;min-width:340px;max-width:620px;flex-direction:column;background:var(--white);border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(27,43,51,.05)}
  body.notes-open #notes{display:flex}
  .notes-head{height:58px;flex:none;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:var(--sub)}
  .notes-head .nt{font:16px var(--serif);color:var(--ink)}
  .notes-head .nm{font:12px var(--mono);color:var(--weak);margin-left:10px}
  .notes-head button{font:13px var(--sans);background:transparent;border:1px solid var(--line);padding:6px 12px;color:var(--ink2);cursor:pointer}
  .notes-head button:hover{border-color:var(--indigoM)}
  .notes-body{position:relative;flex:1;overflow-y:auto;padding:22px 26px 60px;scroll-behavior:smooth}
  .note-sec{border-bottom:1px solid var(--line);padding:6px 0 26px;margin-bottom:24px}
  .note-sec.cur{background:var(--indigoL);border-left:3px solid var(--indigo);padding-left:16px;margin-left:-16px;padding-right:16px;margin-right:-16px}
  .note-sec h3{font:19px/1.4 var(--serif);color:var(--indigo);margin-bottom:12px}
  .note-sec.cur h3{color:var(--indigo)}
  .note-sec h3 span{font:12px var(--mono);color:var(--weak);margin-right:10px}
  .note-sec p{font:15px/1.9 var(--sans);color:var(--ink2);margin-bottom:10px;text-align:justify}
  .note-card h3{font:22px/1.4 var(--serif);color:var(--ink);margin-bottom:6px}
  .note-card .np{font:12px var(--mono);color:var(--weak);margin-bottom:20px}
  .note-card p{font:16px/2 var(--sans);color:var(--ink2);margin-bottom:14px;text-align:justify}
  /* control bar */
  #controlBar{height:58px;flex:none;background:var(--sub);border-top:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 18px;font:13px var(--sans);color:var(--ink2)}
  .cb-nav{display:flex;align-items:center;gap:8px}
  .cb-btn{font:13px var(--sans);background:var(--white);border:1px solid var(--line);color:var(--ink);padding:7px 13px;cursor:pointer;white-space:nowrap}
  .cb-btn:hover{border-color:var(--indigoM);background:var(--indigoL)}
  .cb-btn.on{background:var(--indigo);color:#fff;border-color:var(--indigo)}
  .cb-page{font:13px var(--mono);color:var(--ink);min-width:74px;text-align:center}
  .cb-keys{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-left:6px}
  .k{font:12px var(--sans);color:var(--ink2);white-space:nowrap}
  .k b{display:inline-block;font:11px var(--mono);color:var(--indigo);background:var(--white);border:1px solid var(--line);padding:2px 6px;margin-right:5px}
  .cb-state{margin-left:auto;font:12px var(--mono);color:var(--weak);white-space:nowrap}
  /* progress */
  #progress{position:absolute;left:0;bottom:0;height:3px;background:var(--clay);width:0;transition:width .25s ease;z-index:5}
  /* overlay */
  #overlay{position:absolute;inset:0;z-index:40;display:none;background:rgba(27,43,51,.32)}
  #overlay.show{display:block}
  .ov-panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(1080px,86%);max-height:82%;overflow:auto;background:var(--paper);border:1px solid var(--line);padding:28px 32px 32px}
  .ov-head{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:20px}
  .ov-head h2{font:26px var(--serif);color:var(--ink)}
  .ov-head span{font:12px var(--mono);color:var(--weak)}
  .ov-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .ov-item{background:var(--white);border:1px solid var(--line);padding:11px 13px;cursor:pointer;display:flex;gap:10px;align-items:baseline}
  .ov-item:hover{background:var(--indigoL);border-color:var(--indigoM)}
  .ov-item.cur{background:var(--indigoL);border-color:var(--indigo)}
  .ov-item i{font:12px var(--mono);color:var(--clay);font-style:normal}
  .ov-item b{font:14px/1.4 var(--sans);color:var(--ink);font-weight:500}
  .help-list{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 28px}
  .help-list div{font:15px/1.6 var(--sans);color:var(--ink2);border-bottom:1px dotted var(--line);padding-bottom:8px}
  .help-list b{display:inline-block;min-width:96px;font:13px var(--mono);color:var(--indigo)}
  /* toast */
  #toast{position:absolute;left:50%;bottom:76px;transform:translateX(-50%) translateY(12px);background:var(--ink);color:#fff;font:14px var(--sans);padding:11px 20px;opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;z-index:60}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  /* fullscreen / immersive */
  #app:fullscreen{width:100vw;height:100vh}
  #app:fullscreen #viewport{background:var(--letter)}
  body.immersive #app{position:fixed;inset:0;z-index:100}
  @media print{ #controlBar,#notes,#overlay,#toast{display:none!important} }
</style>
</head>
<body>
<div id="app">
  <div id="mainRow">
    <div id="viewport">
      <div id="stageWrap"><div id="stage"></div></div>
    </div>
    <aside id="notes">
      <div class="notes-head">
        <div><span class="nt" id="notesTitle">本页讲稿</span><span class="nm" id="notesMode">N</span></div>
        <button id="notesClose">关闭 ×</button>
      </div>
      <div class="notes-body" id="notesBody"></div>
    </aside>
  </div>
  <div id="controlBar">
    <div class="cb-nav">
      <button class="cb-btn" id="btnPrev">← 上一页</button>
      <span class="cb-page" id="cbPage">01 / 23</span>
      <button class="cb-btn" id="btnNext">下一页 →</button>
    </div>
    <div class="cb-keys">
      <span class="k"><b>← →</b>翻页</span>
      <span class="k"><b>G</b>目录</span>
      <span class="k"><b>N</b>本页讲稿</span>
      <span class="k"><b>T</b>全文讲稿</span>
      <span class="k"><b>P</b>自动播放</span>
      <span class="k"><b>F</b>全屏</span>
      <span class="k"><b>1–9</b>跳页</span>
      <span class="k"><b>?</b>帮助</span>
      <span class="k"><b>Esc</b>关闭</span>
    </div>
    <span class="cb-state" id="cbState">就绪</span>
  </div>
  <div id="overlay"><div class="ov-panel" id="ovPanel"></div></div>
  <div id="toast"></div>
  <div id="progress"></div>
</div>
<script>
/* ===================== 基础工具 ===================== */
const C={paper:'#F7F6F2',sub:'#F1EFE9',ink:'#1B2B33',ink2:'#46585F',weak:'#89938F',line:'#D9D5CB',white:'#FFFFFF',
  indigo:'#245A6B',indigoL:'#E5EFF0',indigoM:'#7BA6AF',clay:'#BE653B',clayL:'#F7E9DE',
  green:'#2F7A66',greenL:'#E4F0EA',gold:'#AE8A3E',goldL:'#F5EDDC',
  strata:['#1E4B5A','#2E6373','#47808D','#74A5AD','#A4C4C6','#CFE0DC','#EBF1EE']};
const SERIF='"Songti SC","STSong","Noto Serif CJK SC",Georgia,serif';
const SANS='"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif';
const MONO='"SF Mono",Menlo,Consolas,monospace';
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function wide(c){return /[\u2e80-\u9fff\u3000-\u303f\uff00-\uffef]/.test(c);}
function estW(s,fs){let w=0;for(const c of String(s))w+=wide(c)?1:0.56;return w*fs;}
function fitFs(s,maxW,base,min){let f=base;while(f>min&&estW(s,f)>maxW)f-=0.5;return f;}
function label(x,y,t,o={}){const fs=o.fs||15;return `<text x="${x}" y="${y}" text-anchor="${o.anchor||'start'}" font-family='${o.font||SANS}' font-size="${fs}" font-weight="${o.weight||400}" fill="${o.color||C.ink2}" letter-spacing="${o.ls||0}">${esc(t)}</text>`;}
function rect(x,y,w,h,o={}){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${o.fill||C.white}" stroke="${o.stroke||C.line}" stroke-width="${o.sw||1}" rx="${o.rx||0}"/>`;}
function box(o){
  let out=rect(o.x,o.y,o.w,o.h,{fill:o.fill||C.white,stroke:o.stroke||C.line,sw:o.sw||1,rx:o.rx||0});
  const pad=o.pad===undefined?16:o.pad, maxW=o.w-pad*2;
  let rows=[];
  (o.lines||[]).forEach(l=>{const obj=typeof l==='string'?{t:l}:l;String(obj.t).split('|').forEach(p=>rows.push(Object.assign({},obj,{t:p})));});
  const met=rows.map(r=>{const base=r.fs||o.fs||16;const fs=fitFs(r.t,maxW,base,10);return {t:r.t,fs,lh:fs*1.44,color:r.color||o.color||C.ink,weight:r.weight||o.weight||400,font:r.font||o.font||'sans'};});
  const total=met.reduce((s,m)=>s+m.lh,0);let cy=o.y+o.h/2-total/2;
  for(const m of met){
    const by=cy+m.lh/2+m.fs*0.35;
    out+=`<text x="${o.x+o.w/2}" y="${by.toFixed(1)}" text-anchor="middle" font-family='${m.font==='serif'?SERIF:(m.font==='mono'?MONO:SANS)}' font-size="${m.fs.toFixed(1)}" font-weight="${m.weight}" fill="${m.color}">${esc(m.t)}</text>`;
    cy+=m.lh;
  }
  return out;
}
function cell(x,y,w,h,t,o={}){
  let out=rect(x,y,w,h,{fill:o.fill||C.white,stroke:o.stroke||C.line});
  const pad=o.pad===undefined?14:o.pad,maxW=w-pad*2,base=o.fs||14;
  const rows=String(t).split('|').map(p=>({t:p,fs:fitFs(p,maxW,base,10.5)}));
  const total=rows.reduce((s,r)=>s+r.fs*1.4,0);let cy=y+h/2-total/2;
  for(const r of rows){
    const by=cy+r.fs*1.4/2+r.fs*0.35;
    out+=`<text x="${x+pad}" y="${by.toFixed(1)}" font-family='${o.font==='mono'?MONO:(o.font==='serif'?SERIF:SANS)}' font-size="${r.fs.toFixed(1)}" font-weight="${o.weight||400}" fill="${o.color||C.ink2}">${esc(r.t)}</text>`;
    cy+=r.fs*1.4;
  }
  return out;
}
function codeBox(x,y,w,h,lines,o={}){
  let out=rect(x,y,w,h,{fill:o.fill||C.sub,stroke:o.stroke||C.line});
  const fs=o.fs||15,lh=o.lh||25;
  lines.forEach((l,i)=>{const t=typeof l==='string'?l:l.t;out+=`<text x="${x+18}" y="${y+27+i*lh}" font-family='${MONO}' font-size="${fs}" fill="${(typeof l==='object'&&l.c)?l.c:(o.color||C.ink2)}">${esc(t)}</text>`;});
  return out;
}
function line(d,color,w,dash){return `<path d="${d}" fill="none" stroke="${color||C.indigoM}" stroke-width="${w||2}" ${dash?'stroke-dasharray="5 4"':''} stroke-linejoin="miter"/>`;}
function arrow(x,y,dir,color){const c=color||C.indigoM,s=7;let p;
  if(dir==='r')p=`${x},${y} ${x-s},${y-s*0.7} ${x-s},${y+s*0.7}`;
  else if(dir==='l')p=`${x},${y} ${x+s},${y-s*0.7} ${x+s},${y+s*0.7}`;
  else if(dir==='d')p=`${x},${y} ${x-s*0.7},${y-s} ${x+s*0.7},${y-s}`;
  else p=`${x},${y} ${x-s*0.7},${y+s} ${x+s*0.7},${y+s}`;
  return `<polygon points="${p}" fill="${c}"/>`;}
function svg(inner){return `<svg viewBox="0 0 1400 430" width="1400" height="430" xmlns="http://www.w3.org/2000/svg" role="img">${inner}</svg>`;}
function band(x,y,w,h,t,o={}){return box({x,y,w,h,fill:o.fill||C.sub,stroke:o.stroke||C.line,lines:[{t,fs:o.fs||15,color:o.color||C.ink2,weight:o.weight||400,font:o.font||'sans'}],pad:o.pad===undefined?16:o.pad});}

/* ===================== 各页示意图（全部现场绘制，内联 SVG） ===================== */
/* P01 封面 · 地层剖面 */
function fig01(){
  let s='';
  const names=['SQL 文本｜一句 GROUP BY 的声明','计划树｜Agg 路径与代价','执行器｜火山模型与并行 worker','聚合状态｜transition state 是否可合并','函数契约｜combinefn / serialfn','进程通信｜Gather 与 tuple queue','输入元组｜大表扫描与分片'];
  const sub=['声明要把 N 行压成 G 组','决定要不要拆成两阶段','一次一行，多进程拉取元组','本篇落点：拆两段的前提','局部状态如何合并与传输','跨进程搬运的是状态不是行','N 行从这里进来'];
  for(let i=0;i<7;i++){
    const y=12+i*60,col=C.strata[6-i],dark=i>=3;
    s+=rect(0,y,1060,50,{fill:col,stroke:C.line,sw:1});
    s+=rect(0,y,74,50,{fill:i===3?C.clay:C.strata[0],stroke:'none'});
    s+=`<text x="37" y="${y+31}" text-anchor="middle" font-family='${MONO}' font-size="15" fill="#FFFFFF">0${i+1}</text>`;
    s+=label(96,y+21,names[i],{fs:16,color:dark?'#FFFFFF':C.ink,weight:600});
    s+=label(96,y+40,sub[i],{fs:12.5,color:dark?'#FFFFFF':C.ink2});
  }
  s+=rect(1080,12,320,410,{fill:C.white,stroke:C.line});
  s+=label(1100,46,'本篇聚焦',{fs:13,color:C.clay,ls:2.4});
  s+=label(1100,86,'第 04 层',{fs:30,color:C.indigo,font:SERIF,weight:600});
  s+=label(1100,116,'AggSplit · transition state',{fs:12,color:C.ink2,font:MONO});
  s+=line('M1100 136 H1380',C.line,1);
  const t=['问题被转换了：','不是「并行执行聚合函数」，','而是「局部状态能否合并」。','','收益由压缩比决定：','W × G ≪ N 才划算。'];
  t.forEach((v,i)=>{if(v)s+=label(1100,166+i*34,v,{fs:14,color:i>=4?C.clay:C.ink2,weight:i===0||i>=4?600:400});});
  return svg(s);
}
/* P02 一条慢 SQL · 三个瓶颈 */
function fig02(){
  let s='';
  s+=codeBox(0,10,620,236,[
    {t:'SELECT region_id, count(*),',c:C.indigo},
    {t:'       sum(amount), avg(amount)'},
    {t:'FROM orders'},
    {t:"WHERE created_at >= now()"},
    {t:"      - interval '1 day'"},
    {t:'GROUP BY region_id;',c:C.clay},
    '',
    {t:'-- 原文场景假设：一天几十亿行',c:C.weak}
  ],{fs:15,lh:29});
  const bs=[
    {t:'瓶颈 1 · 扫描慢',d:'大表读取本身就要吃时间',f:C.white},
    {t:'瓶颈 2 · transition function 调用多',d:'N 行输入就是 N 次状态更新',f:C.white},
    {t:'瓶颈 3 · 最终分组状态多',d:'G 组状态要同时留在内存里',f:C.white}
  ];
  bs.forEach((b,i)=>{
    const y=10+i*78;
    s+=rect(650,y,750,70,{fill:b.f,stroke:C.line});
    s+=rect(650,y,6,70,{fill:C.indigoM,stroke:'none'});
    s+=label(672,y+28,b.t,{fs:17,color:C.ink,weight:600});
    s+=label(672,y+52,b.d,{fs:14,color:C.ink2});
  });
  s+=box({x:0,y:262,w:1400,h:64,fill:C.indigoL,stroke:C.indigoM,lines:[
    {t:'并行查询先解决「扫描慢」—— 但它只解决三个瓶颈里的一个',fs:19,color:C.indigo,weight:600}
  ]});
  s+=box({x:0,y:338,w:1400,h:64,fill:C.clayL,stroke:C.clay,lines:[
    {t:'并行扫描 ≠ 并行聚合：扫描并行之后，剩下两个瓶颈由谁承担？',fs:18,color:C.clay,weight:600}
  ]});
  return svg(s);
}
/* P03 关键矛盾 · leader 成为新瓶颈 */
function fig03(){
  let s='';
  s+=line('M700 8 V392',C.line,1);
  s+=box({x:0,y:8,w:680,h:44,fill:C.clay,lines:[{t:'只有并行扫描 · leader 单进程聚合',fs:18,color:'#FFFFFF',weight:600}]});
  s+=box({x:720,y:8,w:680,h:44,fill:C.indigo,lines:[{t:'加上局部聚合 · leader 只收局部状态',fs:18,color:'#FFFFFF',weight:600}]});

 next:'链条里最容易出错的一环：partial 阶段为什么绝不能算 finalfn？',
 notes:['把函数调用链摊开看，差别就更清楚了。普通聚合一条链：输入行经过 transfn 得到 transition state，再经 finalfn 出结果。并行聚合因为要把状态跨进程搬运，链路可能会多出 serialfn 和 deserialfn：worker 侧 transfn 之后，如果状态是 internal，先序列化成 bytea 再进 Gather；leader 侧反序列化回来，交给 combinefn 合并，最后才 finalfn。',
 '这里有两个细节容易被忽略。execExpr.c 的 ExecBuildAggTrans() 有专门的 combine 分支，说明 combine 阶段的输入不是来自原始 tuple，而是一个可能已经反序列化的 transition value；另外，如果原聚合写了 FILTER，filter 已经在 partial 阶段处理过了，combine 阶段不会重新执行。',
 '所以 Finalize 的核心不是重新扫描业务数据，是合并状态。这条链看明白，下一页那个「为什么 partial 阶段绝不能算 finalfn」就顺理成章了。']},
{short:'Partial 阶段 · SKIPFINAL',eyebrow:'数据库筑基课 · 扫描与执行算法 / 10',
 title:'Partial 只生产局部状态',
 lede:'一旦在 worker 里执行 finalfn，平均值就再也合不回去了',
 fig:fig11,
 caption:'图 10 · 同一组示意数据：算 finalfn 得 60（错误），保留 (sum, count) 合并得 40（正确）。',
 next:'状态保住了，leader 拿它做什么？combinefn 上场。',
 notes:['Partial Aggregate 仍然可以是 HashAggregate，也可以是 GroupAggregate，区别只在于它不返回最终 SQL 结果，而是返回每个分组的 transition state。为什么？还是刚才那组数字。worker 里 10、20、30 得到 (sum=60, count=3)，如果这里执行了 finalfn 交出 20，leader 拿 20 和另一个 worker 的 100 一平均，得 60，错；正确做法是用 SKIPFINAL 把 (60,3) 原样交出去，leader 合并成 (160,4)，finalfn 一除得 40。',
 'PostgreSQL 就是靠 AGGSPLITOP_SKIPFINAL 避免这个错误的。nodeAgg.c 里负责输出 partial aggregate 的函数叫 finalize_partialaggregate()，这个名字有点误导：它 finalize 的只是当前 worker 的输出形式，不是 SQL 语义上的最终聚合。源码注释还说明，如果设置了 serialization function，就调用它，并在输出 tuple 的上下文里交付结果。',
 '名字里有 finalize，做的事却是「别 finalize」——这个反差值得记住，看源码时不至于被绕进去。']},
{short:'Finalize 阶段 · combinefn',eyebrow:'数据库筑基课 · 扫描与执行算法 / 11',
 title:'Combine 不是节点，是行为',
 lede:'nodeAgg.c 把 transfn 换成 aggcombinefn，最后才轮到 finalfn',
 fig:fig12,
 caption:'图 11 · 伪代码与两处源码实证：DO_AGGSPLIT_COMBINE 与 ExecBuildAggTrans() 的 combine 分支。',
 next:'机制走通了，下一个问题是：PostgreSQL 什么时候允许这么拆？',
 notes:['到了 Finalize 阶段，输入是一批 partial row，每行通常包含 group key 和一个或多个 partial state。它的核心循环可以写成三行：遍历 gathered_rows，用 combinefn 把每个 partial state 并进 global_state，最后 finalfn(global_state)。',
 '源码里这个替换发生在 nodeAgg.c：初始化每个 transition 时会检查 DO_AGGSPLIT_COMBINE(aggstate->aggsplit)，如果是 combine 模式，就把普通的 transition function 换成 aggcombinefn，并且要求 combine function 已经设置，否则直接报错。execExpr.c 那边的 combine 分支我们上一页讲过，配合起来就是完整的执行语义。',
 '所以「Combine Agg」这个词要小心：它不是一个单独的 SQL 节点名，你在 EXPLAIN 里找不到一个叫 Combine 的节点，它是 Finalize Aggregate 内部用 combine function 合并状态的行为。']},
{short:'能不能做 · 能力检查',eyebrow:'数据库筑基课 · 扫描与执行算法 / 12',
 title:'不是看到 GROUP BY 就尝试',
 lede:'prepagg.c 收集能力信息，can_partial_agg() 做顶层判断',
 fig:fig13,
 caption:'图 12 · 左：hasNonPartialAggs / hasNonSerialAggs 的四种来源；右：can_partial_agg() 的判断顺序。',
 next:'允许拆，不代表值得拆。分组基数才是收益的开关。',
 notes:['PostgreSQL 不是看到 GROUP BY 就尝试 Parallel Agg。prepagg.c 在预处理聚合函数的时候先收集能力信息：聚合调用带 ORDER BY 或 DISTINCT，设 hasNonPartialAggs；没有 aggcombinefn，设 hasNonPartialAggs；transition state 是 internal 却缺 serialfn 或 deserialfn，设 hasNonSerialAggs；array_agg 这类依赖输入类型 send/receive 函数的序列化路径，还要额外检查聚合参数类型支不支持发送和接收。',
 '然后 planner.c 的 can_partial_agg() 做顶层判断：没有 aggregate 也没有 GROUP BY，不能；有 grouping sets，不能；有 hasNonPartialAggs 或 hasNonSerialAggs，不能；否则才进入「可以考虑」。官方文档还补了 parallel safe、ordered-set 不支持、相关 join 必须位于并行计划部分这些限制。',
 '这套检查正好解释了一个常见现象：同一张大表、同样写 GROUP BY，sum() 能出 Partial HashAggregate，而 percentile_cont(...) WITHIN GROUP (...) 或者 string_agg(x ORDER BY ts) 出不了并行 partial aggregate。不是优化器偷懒，是这些语义没法被安全地拆成两段。']},
{short:'值不值得 · 分组基数',eyebrow:'数据库筑基课 · 扫描与执行算法 / 13',
 title:'压缩比，才是收益的开关',
 lede:'create_partial_grouping_paths() 估算 partial groups；高基数几乎不压缩',
 fig:fig14,
 caption:'图 13 · 依原图 4 重绘。条长为代数关系的示意比例，非实测数据；官方文档指出高 group 数时计划器会认为不划算。',
 next:'把压缩比算成一个能自己调的演示，手感会更实在。',
 notes:['可以 partial，不代表应该 partial。create_partial_grouping_paths() 会为 partial 阶段和 final 阶段分别收集聚合成本，用的就是 INITIAL_SERIAL 和 FINAL_DESERIAL 这两个模式；它还要估算 partial groups 的数量。',
 '这个估计是全篇最关键的量。低基数的情况：N 很大、G 很小，每个 worker 扫了海量行，最后只交出大约 G 行局部状态，Gather 传输量大约 W 乘 G，远小于 N，leader 的 finalize 很轻，收益明显。高基数的情况：G 接近 N，几乎每行一组，partial 阶段基本没有压缩，Gather 还是要传接近 N 的行，leader 又得单进程合并，这时候并行反而可能更慢；而且 worker 越多，重复出现的同名 group 状态也越多。',
 '图里那两根条是代数关系的示意，不是实测数据。官方文档说得很直接：如果 Finalize Aggregate 看到的 group 数相对输入行很多，计划器会认为并行聚合不划算。所以 worker 不是越多越好，下一页我们把它算成一个可以自己调的演示。']},
{short:'动画 · 压缩比演示',eyebrow:'数据库筑基课 · 扫描与执行算法 / 14',
 title:'动画：改 N、G、W，看压缩比',
 lede:'输入三个参数、按播放，逐阶段看局部状态如何减少 Gather 传输量',
 fig:fig15,anim:true,
 caption:'图 14 · 示意计算：假设分组键独立均匀，每 worker 期望不同组数 = G × (1 − (1 − 1/G)^(N/W))；非实测、非优化器估算公式。',
 next:'单机两级之外，分布式为什么还要多级聚合树？',
 notes:['这一页建议自己按一遍播放，或者干脆改几个输入。三个输入：输入行数 N、分组基数 G、worker 数 W。五个阶段依次是：N 行待扫描、W 个 worker 各扫 N/W 行、各 worker 做 Partial Agg 产出局部状态、Gather 把状态传给 leader、leader 用 combinefn 合并并输出 G 行。',
 '右侧的数字是按一个明确的假设计算的：分组键独立均匀分布，那么每个 worker 期望看到的不同分组数是 G 乘（1 减（1 减 1/G）的 N/W 次方），Gather 总行数就是 W 倍这个数。这是概率模型下的期望值，是示意计算，既不是 PostgreSQL 的实测结果，也不是优化器的估算公式——优化器用的是统计信息和成本模型，比这复杂得多。',
 '你可以先把 G 设成 1000、N 设成一百万，看压缩比有多低；再把 G 改成一百万，看 Gather 行数怎么逼近 N、压缩比怎么趋近百分之百。这就是上一页那句「只有当局部状态行数明显少于原始输入行数」的定量版。看懂它，后面所有调优动作就有了同一个抓手。']},
{short:'从单机到 MPP 多级聚合',eyebrow:'数据库筑基课 · 扫描与执行算法 / 15',
 title:'Partial Partial Aggregates：还能再拆吗',
 lede:'共享同一条原则：先在数据本地减少行数，再跨进程或跨网络移动较小状态',
 fig:fig16,
 caption:'图 15 · 左：Gather 汇聚单点；右：按 group key hash 分发，让 combine / finalize 也并行。',
 next:'把四种做法放进一张表，看状态到底在哪一步被移动。',
 notes:['把视野拉开一点。原文提到的论文 Partial Partial Aggregates 指向一个更一般的问题：只做一次 partial 还不够，能不能在分布式或多层执行树里继续做局部合并，形成多级聚合树？',
 'PostgreSQL 单机并行查询的常见形态是 worker partial 到 Gather 再到 leader finalize，最终 combine 汇聚在单个 leader 上，通常是单点。很多 MPP 或分布式数据库更常见的是 local partial、local combine、exchange 或 shuffle、remote combine、final，按 group key 做 hash 分发，让 combine 和 finalize 也并行化。',
 '两者共享同一条原则：先在数据本地减少行数，再跨进程或跨网络移动较小的状态。Parallel Database Systems 那篇经典论文强调的也正是这件事——高性能不只是更多 CPU，而是把数据划分、operator 并行、交换代价、负载均衡当作整体设计。另外 Aggregating Millions of Groups Fast 那条线提醒我们：即使扫描和部分 transition 被分摊了，每个 worker 内部如果要维护大量 group，哈希表布局、cache miss 和内存访问仍然是瓶颈。']},
{short:'四条路横向对比',eyebrow:'数据库筑基课 · 扫描与执行算法 / 16',
 title:'四条路，差别在状态移动的位置',
 lede:'PG Parallel Agg / 普通聚合 / MPP 多级 / 预聚合：目标、依赖与代价都不同',
 fig:fig17,
 caption:'图 16 · 精简自原文七维对比表；状态要求、高基数风险与资源代价都能从「状态在哪一步移动」推出。',
 next:'坐标系有了，收益和代价就能一条条对上账。',
 notes:['把四种做法放在一张表里，差异就集中到一个问题上：状态到底在哪一步被移动。普通聚合是把原始行移动到单个执行节点；PostgreSQL Parallel Agg 是把 worker 的局部状态移动到 leader；MPP 多级聚合会按 group key 再分发状态，让最终合并也分散；预聚合则把状态提前固化成表或增量物化结果，牺牲实时性和维护复杂度换查询速度。',
 '表里另外几行是这张地图的推论：状态要求、高基数风险、资源代价、适合场景，都能从「状态移动的位置」推出来。比如 MPP 多了一层 shuffle，就多一项数据倾斜风险；预聚合查询时最轻，代价却跑到写入、刷新和一致性上。',
 '横向对比不是为了选一个最好的，是为了知道什么时候该换路。单机 leader finalize 顶不住的时候，硬加 worker 没用，得换形态。']},
{short:'收益与代价',eyebrow:'数据库筑基课 · 扫描与执行算法 / 17',
 title:'四条收益，五条代价',
 lede:'官方提醒：4 个 worker 的并行查询可能消耗接近 5 倍的 CPU、内存与 I/O',
 fig:fig18,
 caption:'图 17 · 收益来自并行扫描与状态压缩；代价集中在 Gather、串行 finalize、按进程内存与序列化上。',
 next:'账算清楚了，怎么判断自己这条查询划不划算？',
 notes:['收益原文列了四条，都能对回前面的机制：并行扫描减少读取大表的墙钟时间；worker 本地先执行 transition，减少 leader 处理的原始行数；低基数分组显著压缩 Gather 传输行数；sum、count、min、max、avg 这类状态小、可合并的聚合特别适合两阶段。',
 '代价五条：Gather 或 Gather Merge 有启动和 tuple 传输成本，受 parallel_setup_cost 和 parallel_tuple_cost 影响；Finalize 在 leader 上执行，group 多时容易变成串行瓶颈；每个 worker 是独立进程，内存限制按 worker 分别应用；worker 实际数量可能少于 planned，因为除了 max_parallel_workers_per_gather，还受 max_worker_processes 和 max_parallel_workers 两级池子限制；internal 状态的序列化和反序列化本身还要 CPU 和内存拷贝。',
 '官方配置文档有一句很值得贴在墙上：4 个 worker 的并行查询可能消耗接近 5 倍的 CPU、内存和 I/O 资源。leader 也算一份。所以并行从来不是免费的，它只是把资源换成了墙钟时间。']},
{short:'诊断决策图',eyebrow:'数据库筑基课 · 扫描与执行算法 / 18',
 title:'EXPLAIN 该怎么读',
 lede:'先分三类：没有并行计划、有并行没 partial、有两阶段却不快',
 fig:fig19,
 caption:'图 18 · 依原图 5 重绘。三类问题根因不同；下方为 EXPLAIN (ANALYZE, VERBOSE, BUFFERS) 的五个观察点。',
 next:'判断要靠证据，得能自己复现一遍才踏实。',
 notes:['判断效果别只看有没有出现 Partial HashAggregate，得看 EXPLAIN (ANALYZE, VERBOSE, BUFFERS)。原文给了一张诊断决策图，我把它重画成三类：没有并行计划、有并行但没有 partial agg、有完整两阶段计划却不快。',
 '第一类去查 parallel safe、min_parallel_table_scan_size、parallel_setup_cost、worker 池够不够；第二类去查 combinefn、ORDER BY、DISTINCT、GROUPING SETS、ordered-set 这些限制；第三类才是压缩比问题——Partial Aggregate 的 actual rows 是不是远小于 scan rows、Finalize 是不是耗时集中、HashAggregate 有没有 Batches 和 Disk Usage、group 数估计和 actual rows 差得远不远。',
 '三类根因完全不同，所以「加 worker」只对其中很小一部分有用。另外别忘了核对 Workers Planned 和 Workers Launched 是否一致：计划 4 个只起来 2 个，问题在资源池，不在聚合算法。']},
{short:'可复现实验脚本',eyebrow:'数据库筑基课 · 扫描与执行算法 / 19',
 title:'实操：一个最小实验',
 lede:'一千万行、1000 个 region_id；三组对照分别打在压缩比、高基数与能力限制上',
 fig:fig20,
 caption:'图 19 · 脚本取自原文；原文未在本地执行，故不提供任何虚构输出，请在自己的测试库运行。',
 next:'跑出结果之后，还得翻译成谁该做什么。',
 notes:['原文给了一个最小可复现实验，我照搬过来，但把话说在前面：作者没有在本地启动 PostgreSQL 执行它，所以这里不提供任何虚构的实际输出，请你自己在测试库里跑。脚本用 generate_series 造一千万行，region_id 取 g 模 1000，amount 是 numeric(12,2)，ANALYZE 之后把 max_parallel_workers_per_gather 设 4，再把 min_parallel_table_scan_size、parallel_setup_cost、parallel_tuple_cost 都压到 0，最后 EXPLAIN (ANALYZE, VERBOSE, BUFFERS) 跑那条 GROUP BY。',
 '三组对照最有意思。第一组就是低基数 region_id，期望看到 Finalize、Gather 加 Partial 的两阶段；第二组把分组键改成 id，几乎每行一个 group，即使出现 partial aggregate 也没什么压缩，Gather 和 Finalize 的压力会很大；第三组用 string_agg(id::text, 逗号 ORDER BY id)，按 PostgreSQL 当前规则，带 ORDER BY 的聚合调用会被标记为不能 partial aggregation。',
 '最后提醒一句，把那几个 cost 参数压到 0 只是为了把计划空间暴露出来观察，不代表生产环境应该这么设。生产里要按并发、内存、I/O 和 CPU 核数统一预算，而且优先在单个会话里做验证。']},
{short:'三种角色的最佳实践',eyebrow:'数据库筑基课 · 扫描与执行算法 / 20',
 title:'最佳实践：谁该做什么',
 lede:'架构师管形态，DBA 管证据，开发者管 SQL 入口 —— 同一套机制的三种视角',
 fig:fig21,
 caption:'图 20 · 三列分别对应原文「面向架构师 / DBA / 业务开发者」的建议，按动作归类。',
 next:'动作有了，适用边界和常见坑也得画出来。',
 notes:['把动作按角色分一下才落得了地。架构师这边：优先把 Parallel Agg 用在扫描大、分组压缩明显、状态可合并的分析查询上，典型是按天、地区、渠道、状态码做 count、sum、avg、min、max；如果 group key 高基数到接近明细行，就该考虑分区预聚合、物化视图、近似聚合或者 MPP 列式引擎了。设计自定义聚合时更要注意，不能只写 SFUNC 和 FINALFUNC，得提供正确的 COMBINEFUNC，internal 状态还要 SERIALFUNC 和 DESERIALFUNC，聚合及依赖函数标记 PARALLEL SAFE——这些是 CREATE AGGREGATE 文档明确写的 partial aggregation 前提。',
 'DBA 这边是一条证据链：先用 EXPLAIN 确认有没有 Partial 和 Finalize，再比较 scan rows、partial rows、finalize rows 判断压缩比，然后看 Workers Planned 和 Launched，再看 HashAggregate 的 Batches、Memory Usage、Disk Usage，最后检查统计信息，尤其是 group key 的 distinct 估计。别全局盲目提高 max_parallel_workers_per_gather，四个 worker 可能就是五倍资源。',
 '业务开发者这边最有效的是「别写破坏 partial aggregation 的表达」：聚合内部的 DISTINCT 和 ORDER BY、ordered-set、GROUPING SETS、parallel unsafe 的函数。另外，如果业务目标是报表而不是明细实时精确计算，把高频固定维度做成分区汇总表或增量物化，比把每次请求都变成高并发大扫描靠谱得多。']},
{short:'适用边界与六个坑',eyebrow:'数据库筑基课 · 扫描与执行算法 / 21',
 title:'适合、不适合，与六个坑',
 lede:'六个坑大半是同一句话的变体：只看单个数字，就会把问题搬去别处',
 fig:fig22,
 caption:'图 21 · 适合 / 不适合各五条；下方六格为原文「常见坑」的精简归纳。',
 next:'到这儿，把整条因果链收回来。',
 notes:['适合的一侧：大表扫描后低到中等基数的 GROUP BY；聚合函数支持 partial mode，比如 count、sum、avg、min、max、bool_and、bool_or；WHERE 条件能在 parallel scan 部分过滤掉大量行；单次分析查询能接受多个 worker 共同消耗 CPU 和内存；分区表上每个分区可并行扫描而且维度不导致极端倾斜。',
 '不适合的一侧：group key 接近唯一键，partial 几乎不压缩；聚合状态很大，比如大量 array_agg、jsonb_agg，即使支持 partial，worker 内存和序列化成本也很高；需要内部排序、去重或 ordered-set 精确语义；系统已经 CPU 或 I/O 饱和；以及需要毫秒级 OLTP 响应的请求路径。',
 '六个常见坑，其实大半是同一句话的变体：看到 Gather 就以为用了 Parallel Agg——不对，得 Partial 和 Finalize 同时出现，Gather 下面直接接 Aggregate 只是并行扫描后 leader 单进程聚合；只看 worker 不看 group 数；忘了 work_mem 是按进程消耗；自定义聚合只实现 finalfn；拿 ordered-set 期待并行 partial；统计信息过旧让优化器误判 group 数。前五个是机制没搞清，最后一个是数据没喂准。']},
{short:'收束与扩展问题',eyebrow:'数据库筑基课 · 扫描与执行算法 / 22',
 title:'把整条链收回来',

/* ===================== 渲染与交互 ===================== */
const stage=document.getElementById('stage');
const TOTAL=PAGES.length;
let cur=0, notesMode=null, autoplay=false, autoTimer=null, ovMode=null;
function pageHTML(p,i){
  const cls='page'+(p.cover?' cover':'')+(i===0?' active':'');
  return `<section class="${cls}" data-i="${i}">
    <div class="eyebrow">${esc(p.eyebrow)}</div>
    <h1 class="title">${esc(p.title)}</h1>
    <div class="lede">${esc(p.lede)}</div>
    <div class="rule"></div>
    <div class="figure">${p.fig()}</div>
    <div class="caption">${esc(p.caption)}</div>
    ${p.anim?`<div class="anim-ctrl">
      <label>输入行数 N <input id="animN" type="number" min="1000" max="100000000" value="1000000"></label>
      <label>分组基数 G <input id="animG" type="number" min="1" max="10000000" value="1000"></label>
      <label>worker 数 W <input id="animW" type="number" min="1" max="4" value="4"></label>
      <button class="primary" data-act="play">播放</button>
      <button data-act="step">单步</button>
      <button data-act="reset">重置</button>
      <span class="hint">示意计算 · 按独立均匀假设计算期望值，非实测数据</span>
    </div>`:''}
    <div class="next"><span class="next-k">承接 · NEXT</span><span class="next-t">${esc(p.next)}</span></div>
    <div class="footer"><span>数据库筑基课 · 聚合之 Parallel Agg　|　digoal　|　2026-05-31</span><span class="pgno">${String(i+1).padStart(2,'0')} / ${String(TOTAL).padStart(2,'0')}</span></div>
  </section>`;
}
stage.innerHTML=PAGES.map(pageHTML).join('');
const pages=[...stage.querySelectorAll('.page')];

function layout(){
  const vp=document.getElementById('viewport'), sw=document.getElementById('stageWrap');
  const vw=vp.clientWidth, vh=vp.clientHeight;
  const s=Math.min(vw/1600,vh/900);
  sw.style.setProperty('--s',s);
  sw.style.left=((vw-1600*s)/2)+'px';
  sw.style.top=((vh-900*s)/2)+'px';
}
window.addEventListener('resize',layout);
new ResizeObserver(layout).observe(document.getElementById('viewport'));

function go(i,fromAuto){
  i=Math.max(0,Math.min(TOTAL-1,i));
  if(i===cur&&fromAuto) {stopAuto();return;}
  cur=i;
  pages.forEach((p,j)=>p.classList.toggle('active',j===cur));
  document.getElementById('cbPage').textContent=String(cur+1).padStart(2,'0')+' / '+TOTAL;
  document.getElementById('progress').style.width=((cur+1)/TOTAL*100)+'%';
  syncNotes();
  if(ovMode==='toc') renderTOC();
  if(fromAuto&&cur===TOTAL-1) stopAuto();
}
function step(d){go(cur+d);}

/* --- 讲稿 --- */
function renderNotes(){
  const body=document.getElementById('notesBody');
  const tt=document.getElementById('notesTitle'), mm=document.getElementById('notesMode');
  if(notesMode==='current'){
    tt.textContent='本页讲稿';mm.textContent='N';
    const p=PAGES[cur];
    body.innerHTML=`<div class="note-card"><h3>${esc(p.title)}</h3><div class="np">PAGE ${String(cur+1).padStart(2,'0')} / ${TOTAL}　·　按 N 关闭</div>${p.notes.map(t=>`<p>${esc(t)}</p>`).join('')}</div>`;
    body.scrollTop=0;
  }else if(notesMode==='all'){
    tt.textContent='全文讲稿';mm.textContent='T';
    body.innerHTML=PAGES.map((p,i)=>`<section class="note-sec" data-p="${i}"><h3><span>${String(i+1).padStart(2,'0')}</span>${esc(p.title)}</h3>${p.notes.map(t=>`<p>${esc(t)}</p>`).join('')}</section>`).join('');
    scrollNotesTo(cur,false);
  }
}
function scrollNotesTo(i,smooth){
  const body=document.getElementById('notesBody');
  body.querySelectorAll('.note-sec').forEach(s=>s.classList.toggle('cur',+s.dataset.p===i));
  const el=body.querySelector(`.note-sec[data-p="${i}"]`);
  if(el){
    const top=el.offsetTop-12;
    if(smooth) body.scrollTo({top,behavior:'smooth'}); else body.scrollTop=top;
  }
}
function syncNotes(){
  if(!notesMode)return;
  if(notesMode==='current')renderNotes();
  else scrollNotesTo(cur,true);
}
function toggleNotes(mode){
  if(notesMode===mode){notesMode=null;document.body.classList.remove('notes-open');document.getElementById('cbState').textContent='讲稿已收起';}
  else{notesMode=mode;document.body.classList.add('notes-open');renderNotes();document.getElementById('cbState').textContent=mode==='current'?'本页讲稿':'全文讲稿';}
  requestAnimationFrame(layout);
}
document.getElementById('notesClose').addEventListener('click',()=>{notesMode=null;document.body.classList.remove('notes-open');requestAnimationFrame(layout);});

/* --- 目录 / 帮助 --- */
const overlay=document.getElementById('overlay'), ovPanel=document.getElementById('ovPanel');
function renderTOC(){
  ovPanel.innerHTML=`<div class="ov-head"><h2>目录</h2><span>G 关闭 · 点击跳转</span></div><div class="ov-grid">${PAGES.map((p,i)=>`<div class="ov-item ${i===cur?'cur':''}" data-go="${i}"><i>${String(i+1).padStart(2,'0')}</i><b>${esc(p.short)}</b></div>`).join('')}</div>`;
  ovPanel.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',()=>{go(+el.dataset.go);closeOv();}));
}
function renderHelp(){
  const H=[['← / → / 空格','上一页 / 下一页'],['G','目录（页内开窗）'],['N','本页讲稿（右侧开窗）'],['T','全文讲稿并定位当前页'],['P','自动播放 / 暂停'],['F','全屏 / 退出全屏'],['1 – 9','跳到对应页'],['?','本帮助'],['Esc','关闭讲稿、目录与帮助']];
  ovPanel.innerHTML=`<div class="ov-head"><h2>快捷键</h2><span>? 或 Esc 关闭</span></div><div class="help-list">${H.map(h=>`<div><b>${esc(h[0])}</b>${esc(h[1])}</div>`).join('')}</div><div style="margin-top:22px;font:14px/1.8 var(--sans);color:var(--weak)">讲稿采用页内开窗：按一下显示、再按一下关闭；显示时舞台矢量缩放到左侧，翻页会自动联动滚动右侧讲稿到当前页。动画页的输入框聚焦时，快捷键暂不响应（Esc 除外）。</div>`;
}
function openOv(mode){ovMode=mode;mode==='toc'?renderTOC():renderHelp();overlay.classList.add('show');}
function closeOv(){ovMode=null;overlay.classList.remove('show');}
overlay.addEventListener('click',e=>{if(e.target===overlay)closeOv();});

/* --- 自动播放 --- */
function startAuto(){
  autoplay=true;document.getElementById('cbState').textContent='自动播放中 · P 停止';
  clearInterval(autoTimer);
  autoTimer=setInterval(()=>{if(cur>=TOTAL-1){stopAuto();return;}go(cur+1,true);},7000);
  toast('自动播放已开启 · 每 7 秒一页 · 按 P 停止');
}
function stopAuto(){
  autoplay=false;clearInterval(autoTimer);autoTimer=null;
  document.getElementById('cbState').textContent=notesMode?(notesMode==='current'?'本页讲稿':'全文讲稿'):'就绪';
}
function toggleAuto(){autoplay?stopAuto():startAuto();}

/* --- 全屏 --- */
async function toggleFull(){
  const app=document.getElementById('app');
  try{
    if(!document.fullscreenElement){
      if(app.requestFullscreen){await app.requestFullscreen();toast('已进入全屏 · 按 F 退出 · 底部按键条保持可见');}
      else{document.body.classList.add('immersive');toast('当前环境不支持原生全屏，已切换沉浸模式');}
    }else{
      if(document.exitFullscreen)await document.exitFullscreen();
      document.body.classList.remove('immersive');
      toast('已退出全屏');
    }
  }catch(e){document.body.classList.toggle('immersive');toast('全屏不可用，已切换沉浸模式 · 按 F 复原');}
  requestAnimationFrame(layout);
}
document.addEventListener('fullscreenchange',()=>requestAnimationFrame(layout));

/* --- toast --- */
let toastTimer=null;
function toast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2600);
}

/* ===================== 动画页逻辑 ===================== */
let frames=[],frameIdx=0,animTimer=null,animCfg=null;
const fmt=n=>Math.round(n).toLocaleString('en-US');
function buildFrames(){
  const nEl=document.getElementById('animN'),gEl=document.getElementById('animG'),wEl=document.getElementById('animW');
  if(!nEl||!gEl||!wEl)return;
  const clamp=(v,lo,hi,d)=>{const x=parseInt(v,10);return isNaN(x)?d:Math.max(lo,Math.min(hi,x));};
  const N=clamp(nEl.value,1000,100000000,1000000);
  const G=clamp(gEl.value,1,10000000,1000);
  const W=clamp(wEl.value,1,4,4);
  const per=N/W;
  const gk=G*(1-Math.pow(1-1/G,per));
  const gather=W*gk;
  const ratio=gather/N;
  animCfg={N,G,W,per,gk,gather,ratio};
  frames=[0,1,2,3,4];frameIdx=0;renderFrame();
}
function renderFrame(){
  const f=frameIdx;if(!animCfg||!frames.length)return;
  const g=id=>document.getElementById(id);
  if(!g('a_note'))return;
  const c=animCfg;
  for(let i=0;i<4;i++){
    const r=g('a_w'+i),t=g('a_wt'+i),s2=g('a_ws'+i),on=i<c.W;
    r.setAttribute('fill',on?((f===1||f===2)?C.indigoL:C.sub):C.paper);
    r.setAttribute('stroke',on?((f===1||f===2)?C.indigo:C.line):C.line);
    r.setAttribute('opacity',on?1:0.35);
    t.textContent=on?('worker '+(i+1)+' · 并行扫描 '+fmt(c.per)+' 行'):('worker '+(i+1)+' · 未启用');
    t.setAttribute('fill',on?C.ink:C.weak);
    s2.textContent=on?(f>=2?('Partial Agg → 期望 '+fmt(c.gk)+' 个局部状态'):'等待执行 transition function'):'—';
    s2.setAttribute('fill',on?(f>=2?C.indigo:C.ink2):C.weak);
  }
  const gOn=f>=3;
  g('a_gather').setAttribute('fill',gOn?C.clayL:C.sub);
  g('a_gather').setAttribute('stroke',gOn?C.clay:C.line);
  g('a_gt').textContent=gOn?('Gather · 传输 '+fmt(c.gather)+' 行 partial state（原始输入 '+fmt(c.N)+' 行）'):'Gather · 等待 worker 产出局部状态';
  g('a_gt').setAttribute('fill',gOn?C.clay:C.ink2);
  const lOn=f>=4;
  g('a_leader').setAttribute('fill',lOn?C.greenL:C.sub);
  g('a_leader').setAttribute('stroke',lOn?C.green:C.line);
  g('a_lt').textContent=lOn?('leader · combinefn 合并 → finalfn 输出 '+fmt(c.G)+' 行结果'):'leader · Finalize 等待中';
  g('a_lt').setAttribute('fill',lOn?C.green:C.ink2);
  g('a_phase').textContent='阶段 '+f+' / 4';
  g('a_m1').textContent='N = '+fmt(c.N);
  g('a_m2').textContent='G = '+fmt(c.G);
  g('a_m3').textContent='W = '+c.W;
  g('a_m4').textContent='N / W = '+fmt(c.per);
  g('a_m5').textContent='G_k = '+fmt(c.gk);
  g('a_m6').textContent='ΣG_k = '+fmt(c.gather);
  g('a_m7').textContent='压缩比 = '+(c.ratio*100).toFixed(2)+'%';
  g('a_m7').setAttribute('fill',c.ratio>0.5?C.clay:C.green);
  const notes=[
    '初始：'+fmt(c.N)+' 行输入待扫描；按独立均匀假设计算期望值（示意计算，非实测）',
    '阶段 1：'+c.W+' 个 worker 并行扫描，每个约 '+fmt(c.per)+' 行；扫描墙钟时间下降',
    '阶段 2：各 worker 本地执行 transition，期望不同分组数 = G × (1 − (1 − 1/G)^(N/W)) = '+fmt(c.gk),
    '阶段 3：Gather 传 '+fmt(c.gather)+' 行，压缩比 '+(c.ratio*100).toFixed(2)+'%；G 接近 N 时压缩比趋近 100%',
    '阶段 4：leader 用 combinefn 合并、finalfn 输出 '+fmt(c.G)+' 行；这一串行段随 group 数变重'
  ];
  g('a_note').textContent=notes[f];
}
function animStep(){
  if(frameIdx>=frames.length-1){animStop();return;}
  frameIdx++;renderFrame();
  if(frameIdx>=frames.length-1)animStop();
}
function animPlay(){
  if(animTimer){animStop();return;}
  if(frameIdx>=frames.length-1){frameIdx=0;renderFrame();}
  const btn=document.querySelector('.anim-ctrl [data-act=play]');
  if(btn)btn.textContent='暂停';
  animTimer=setInterval(animStep,1500);
}
function animStop(){
  clearInterval(animTimer);animTimer=null;
  const btn=document.querySelector('.anim-ctrl [data-act=play]');
  if(btn)btn.textContent='播放';
}
function animReset(){animStop();buildFrames();}
stage.addEventListener('click',e=>{
  const b=e.target.closest('.anim-ctrl button');if(!b)return;
  const a=b.dataset.act;
  if(a==='play')animPlay();else if(a==='step'){animStop();animStep();}else if(a==='reset')animReset();
});
stage.addEventListener('change',e=>{if(['animN','animG','animW'].indexOf(e.target.id)>=0)animReset();});
stage.addEventListener('keydown',e=>{
  if(e.target.matches('.anim-ctrl input')&&e.key==='Enter'){e.preventDefault();animReset();e.target.blur();}
});

/* ===================== 键盘与控制条 ===================== */
document.getElementById('btnPrev').addEventListener('click',()=>step(-1));
document.getElementById('btnNext').addEventListener('click',()=>step(1));
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  const typing=tag==='input'||tag==='textarea'||tag==='select'||e.target.isContentEditable;
  if(e.key==='Escape'){
    if(overlay.classList.contains('show'))closeOv();
    else if(notesMode){notesMode=null;document.body.classList.remove('notes-open');requestAnimationFrame(layout);}
    else if(autoplay)stopAuto();
    return;
  }
  if(typing)return;
  const k=e.key;
  if(k==='ArrowRight'||k===' '||k==='PageDown'){e.preventDefault();step(1);}
  else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();step(-1);}
  else if(k==='Home'){go(0);}
  else if(k==='End'){go(TOTAL-1);}
  else if(k==='g'||k==='G'){ovMode==='toc'?closeOv():openOv('toc');}
  else if(k==='n'||k==='N'){toggleNotes('current');}
  else if(k==='t'||k==='T'){toggleNotes('all');}
  else if(k==='p'||k==='P'){toggleAuto();}
  else if(k==='f'||k==='F'){toggleFull();}
  else if(k==='?'||k==='/'){ovMode==='help'?closeOv():openOv('help');}
  else if(/^[1-9]$/.test(k)){go(parseInt(k)-1);}
});

/* 初始化 */
layout();go(0);buildFrames();
</script>
</body>
</html>
