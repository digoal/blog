nt-weight=\"400\" class=\"\" >取决于窗口、触发与迟到策略<\/text><rect x=\"20\" y=\"292\" width=\"140\" height=\"76\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"90.0\" y=\"337\" font-size=\"13.5\" fill=\"#245A6B\" text-anchor=\"middle\" font-weight=\"600\" class=\"\" >正确性风险<\/text><rect x=\"160\" y=\"292\" width=\"305\" height=\"76\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"312.5\" y=\"337\" font-size=\"13.5\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\" class=\"\" >反函数不精确会改变结果<\/text><rect x=\"465\" y=\"292\" width=\"305\" height=\"76\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"617.5\" y=\"337\" font-size=\"13.5\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\" class=\"\" >风险最低<\/text><rect x=\"770\" y=\"292\" width=\"305\" height=\"76\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"922.5\" y=\"337\" font-size=\"13.5\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\" class=\"\" >算法前提不满足会出错<\/text><rect x=\"1075\" y=\"292\" width=\"305\" height=\"76\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"1227.5\" y=\"337\" font-size=\"13.5\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\" class=\"\" >watermark 过早会丢迟到修正<\/text><rect x=\"20\" y=\"378\" width=\"1360\" height=\"44\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\" /><text x=\"700\" y=\"406\" font-size=\"16\" fill=\"#245A6B\" text-anchor=\"middle\" font-weight=\"600\" class=\"\" >四条路径都减少重复计算，却分别站在：执行器函数契约 / 重算路径 / 代数结构 / 时间语义<\/text><\/svg>","ctrl":null},{"eyebrow":"实操 · 把调用痕迹打出来","title":"用 logging_agg 验证真的走了 moving","lede":"参考 window.sql：让 MSFUNC 写加号、MINVFUNC 写减号，trace 里就能看见帧头移动时是否出现撤销痕迹。","caption":"图 15　预期 trace 形态；依据源码执行路径推演，本文未启动 PostgreSQL 实例实测。","bridge":"把验证方法交到手里之后，最后落到三种角色各自的动作清单。","notes":"原理讲完，得给一个能亲手验证的办法。参考 PostgreSQL 回归测试 window.sql 的做法，写三个函数，让 MSFUNC 往状态里写加号、MINVFUNC 写减号，再定义一个 logging_agg，然后用 ROWS BETWEEN 1 PRECEDING AND CURRENT ROW 跑三行数据。预期是这样：第一行帧里只有 a，trace 里是加入 a；第二行帧头没动，继续追加 b；第三行窗口从 [a,b] 变成 [b,c]，如果 moving mode 真生效，trace 里就应该出现移除 a 和加入 c 的痕迹。我这里要老实交代：文章没有在本地启动实例实测，这些是按执行路径和官方回归测试推演出来的预期观察方式。同样的思路还能验证两个边界：volatile 参数会禁用 moving mode，MINVFUNC 随机返回 NULL 会触发重启。方法交到手里，最后落到三种角色各自的动作清单。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" id=\"fig15\"><rect x=\"20\" y=\"14\" width=\"660\" height=\"400\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"40\" y=\"44\" font-size=\"17\" fill=\"#245A6B\" text-anchor=\"start\" font-weight=\"600\" class=\"\" >logging_agg：让两个函数各写一个符号<\/text><line x1=\"40\" y1=\"58\" x2=\"660\" y2=\"58\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"34\" y=\"70\" width=\"632\" height=\"330\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"52\" y=\"101.0\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >CREATE AGGREGATE logging_agg(text)<\/text><text x=\"52\" y=\"123.75\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >( stype = text,  sfunc  = logging_sfunc,<\/text><text x=\"52\" y=\"146.5\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >  mstype = text, msfunc = logging_msfunc,<\/text><text x=\"52\" y=\"169.25\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >  minvfunc = logging_minvfunc );<\/text><text x=\"52\" y=\"192.0\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" ><\/text><text x=\"52\" y=\"214.75\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >SELECT i, v,<\/text><text x=\"52\" y=\"237.5\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >  logging_agg(v) OVER (<\/text><text x=\"52\" y=\"260.25\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >    ORDER BY i<\/text><text x=\"52\" y=\"283.0\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >    ROWS BETWEEN 1 PRECEDING<\/text><text x=\"52\" y=\"305.75\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >             AND CURRENT ROW<\/text><text x=\"52\" y=\"328.5\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >  ) AS trace<\/text><text x=\"52\" y=\"351.25\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >FROM (VALUES (1,&#x27;a&#x27;),(2,&#x27;b&#x27;),(3,&#x27;c&#x27;))<\/text><text x=\"52\" y=\"374.0\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >     AS t(i,v) ORDER BY i;<\/text><rect x=\"700\" y=\"14\" width=\"680\" height=\"400\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"720\" y=\"44\" font-size=\"17\" fill=\"#245A6B\" text-anchor=\"start\" font-weight=\"600\" class=\"\" >预期 trace 形态<\/text><line x1=\"720\" y1=\"58\" x2=\"1360\" y2=\"58\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"720\" y=\"76\" width=\"640\" height=\"84\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"738\" y=\"102\" font-size=\"14.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"600\" class=\"\" >第 1 行　帧 [a]<\/text><text x=\"1040\" y=\"102\" font-size=\"15\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"600\" class=\"mono\" >+&#x27;a&#x27;<\/text><text x=\"738\" y=\"136\" font-size=\"14\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >帧里只有 a：加入<\/text><rect x=\"720\" y=\"172\" width=\"640\" height=\"84\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"738\" y=\"198\" font-size=\"14.5\" fill=\"#46585F\" text-anchor=\"start\" fon =\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >金额、计数、库存优先用精确类型<\/text><rect x=\"20\" y=\"362\" width=\"1360\" height=\"66\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\" /><text x=\"40\" y=\"386\" font-size=\"14.5\" fill=\"#245A6B\" text-anchor=\"start\" font-weight=\"600\" class=\"mono\" >共同动作：SELECT p.proname, a.aggmtransfn::regproc, a.aggminvtransfn::regproc<\/text><text x=\"40\" y=\"410\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >FROM pg_aggregate a JOIN pg_proc p ON p.oid = a.aggfnoid WHERE a.aggminvtransfn &lt;&gt; 0;<\/text><\/svg>","ctrl":null},{"eyebrow":"适用边界 · 可逆性 × 重算代价","title":"最值得做的只有右上角","lede":"重算代价高、状态可逆性强才是主战场；状态不可逆却硬写 MINVFUNC，会把性能问题变成正确性问题。","caption":"图 17　二维适用边界；横轴状态可逆性，纵轴重算代价，四象限均为定性判断。","bridge":"最后把最容易踩的六个坑收成一张图，然后收束。","notes":"什么时候值得做？把两个维度摆到一张图上就清楚了：横轴是状态可逆性，纵轴是重算代价。右上角「重算很贵、状态可逆」才是主战场——大分区、固定宽度、帧头频繁移动的窗口，count、整数 sum、avg、bool 聚合。左上角最危险：重算很贵但状态不可逆，浮点、精确分位数、top-k、去重集合、volatile 参数，硬写 MINVFUNC 会把性能问题变成正确性问题。左下角和右下角，要么重算本来就便宜，要么窗口很小、帧头不动，工程收益有限。所以判断顺序应该是：先问窗口会不会移动、重算贵不贵，再问状态能不能精确撤销，最后才问能快多少。这张图其实把前面十六页收成了一句话。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" id=\"fig17\"><line x1=\"180\" y1=\"350\" x2=\"1320\" y2=\"350\" stroke=\"#1B2B33\" stroke-width=\"1.4\" /><line x1=\"180\" y1=\"26\" x2=\"180\" y2=\"350\" stroke=\"#1B2B33\" stroke-width=\"1.4\" /><line x1=\"750\" y1=\"26\" x2=\"750\" y2=\"350\" stroke=\"#D9D5CB\" stroke-width=\"1\" stroke-dasharray=\"5 5\"/><line x1=\"180\" y1=\"190\" x2=\"1320\" y2=\"190\" stroke=\"#D9D5CB\" stroke-width=\"1\" stroke-dasharray=\"5 5\"/><text x=\"30\" y=\"46\" font-size=\"13.5\" fill=\"#89938F\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >重算代价 高 ↑<\/text><text x=\"30\" y=\"336\" font-size=\"13.5\" fill=\"#89938F\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >低 ↓<\/text><line x1=\"180\" y1=\"350\" x2=\"1312\" y2=\"350\" stroke= const N = D.length;
let cur = 0, autoTimer = null, autoOn = false, panelMode = 'off';
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const CC = {
  line:'#D9D5CB', prim:'#245A6B', priml:'#E5EFF0', acc:'#BE653B', accl:'#F7E9DE',
  green:'#2F7A66', greenl:'#E4F0EA', ink:'#1B2B33', ink2:'#46585F', muted:'#89938F',

};

/* ---------- 舞台等比缩放 + letterbox；开窗时缩到左侧 ---------- */
function panelWidth(){
  return Math.max(360, Math.min(540, Math.round(window.innerWidth * 0.32)));
}
function fit(){
  const vp = $('#viewport');
  const W = vp.clientWidth, H = vp.clientHeight;
  const pw = panelMode === 'off' ? 0 : panelWidth();
  const avail = Math.max(320, W - pw);
  const s = Math.min(avail / 1600, H / 900);
  const st = $('#stage');
  st.style.transform = 'scale(' + s + ')';
  st.style.left = ((avail - 1600 * s) / 2) + 'px';
  st.style.top  = ((H - 900 * s) / 2) + 'px';
  document.documentElement.style.setProperty('--pw', pw + 'px');
}
window.addEventListener('resize', fit);

function render(){
  $('#slides').innerHTML = D.map((d, i) =>
    '<section class="slide" id="s' + i + '">'
    + '<div class="eyebrow"><span class="num">' + String(i+1).padStart(2,'0') + ' / ' + String(N).padStart(2,'0') + '</span>' + d.eyebrow + '</div>'
    + '<h1 class="title">' + d.title + '</h1>'
    + '<div class="lede">' + d.lede + '</div>'
    + '<div class="rule"></div>'
    + '<div class="figwrap">' + d.svg + '</div>'
    + (d.ctrl ? '<div class="ctrls">' + d.ctrl + '</div>' : '<div class="caption">' + d.caption + '</div>')
    + '<div class="bridge"><span class="bk">承接 · NEXT</span>' + d.bridge + '</div>'
    + '<div class="footer"><div class="fbar"><i id="fbar' + i + '"></i></div>'
    + '<span class="fl">数据库筑基课 · 聚合之 Inverse Transition</span>'
    + '<span class="fr">' + String(i+1).padStart(2,'0') + ' / ' + String(N).padStart(2,'0') + '</span></div>'
    + '</section>').join('');
}

function toast(s){
  const t = $('#toast'); t.textContent = s; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 1800);
}

function go(i, silent){
  i = Math.max(0, Math.min(N - 1, i));
  $$('.slide').forEach((el, k) => el.classList.toggle('on', k === i));
  cur = i;
  try{ localStorage.setItem('invtrans-slide', String(i)); }catch(e){}
  $('#pg').textContent = String(i+1).padStart(2,'0') + ' / ' + String(N).padStart(2,'0');
  $('#track i').style.width = ((i+1) / N * 100) + '%';
  for(let k = 0; k < N; k++){ const b = $('#fbar' + k); if(b) b.style.width = (k <= i ? 100 : 0) + '%'; }
  syncPanel();
  if(!silent) toast(D[i].eyebrow + ' · ' + D[i].title);
}
function next(){ if(cur < N - 1) go(cur + 1); else stopAuto(); }
function prev(){ if(cur > 0) go(cur - 1); }

/* ---------- 自动播放 ---------- */
function stopAuto(){
  autoOn = false; clearInterval(autoTimer); autoTimer = null;
  $('#btnAuto').textContent = '▶ 自动播放 P'; $('#btnAuto').classList.remove('act');
}
function toggleAuto(){
  if(autoOn){ stopAuto(); toast('已暂停自动播放'); return; }
  autoOn = true; $('#btnAuto').textContent = '❚❚ 暂停 P'; $('#btnAuto').classList.add('act');
  autoTimer = setInterval(() => { if(cur < N - 1) go(cur + 1, true); else stopAuto(); }, 12000);
  toast('自动播放：每 12 秒一页');
}

/* ---------- 页内开窗：讲稿 / 目录 / 帮助 ---------- */
function notesSection(d, i, full){
  return '<div class="nsec' + (i === cur ? ' cur' : '') + '" id="nts' + i + '">'
    + '<div class="sn">' + String(i+1).padStart(2,'0') + ' · ' + d.eyebrow + '</div>'
    + '<h3>' + d.title + '</h3>'
    + '<p>' + d.notes + '</p>'
    + (d.caption ? '<div class="ncap">' + d.caption + '</div>' : '')
    + '<div class="bk">「' + d.bridge + '」</div>'
    + '</div>';
}
function renderPanel(){
  const body = $('#notesBody');
  if(panelMode === 'here'){
    $('#nTitle').textContent = '本页讲稿';
    $('#nSub').textContent = '第 ' + String(cur+1).padStart(2,'0') + ' 页 · 按 N 关闭 · 按 T 通读全文';
    body.innerHTML = notesSection(D[cur], cur, false);
  } else if(panelMode === 'all'){
    $('#nTitle').textContent = '全文讲稿';
    $('#nSub').textContent = '共 ' + N + ' 页 · 自动定位到当前页 · 按 T 关闭';
    body.innerHTML = D.map((d, i) => notesSection(d, i, true)).join('');
  } else if(panelMode === 'toc'){
    $('#nTitle').textContent = '目录';
    $('#nSub').textContent = '点击任意一页跳转 · 共 ' + N + ' 页 · 按 G 关闭';
    body.innerHTML = '<div class="tocgrid">' + D.map((d, i) =>
      '<a data-jump="' + i + '" class="' + (i === cur ? 'cur' : '') + '"><span class="gn">'
      + String(i+1).padStart(2,'0') + '</span>' + d.title + '</a>').join('') + '</div>';
  } else if(panelMode === 'help'){
    $('#nTitle').textContent = '快捷键';
    $('#nSub').textContent = '全屏后底部按键条依然可见 · 按 ? 或 Esc 关闭';
    body.innerHTML = '<div class="keylist">'
      + '<div><kbd>→ / 空格</kbd>下一页</div><div><kbd>←</kbd>上一页</div>'
      + '<div><kbd>G</kbd>目录</div><div><kbd>N</kbd>本页讲稿（开 / 关）</div>'
      + '<div><kbd>T</kbd>全文讲稿（开 / 关）</div><div><kbd>P</kbd>自动播放 / 暂停</div>'
      + '<div><kbd>F</kbd>全屏 / 退出全屏</div><div><kbd>1–9 / 0</kbd>直接跳页</div>'
      + '<div><kbd>Home / End</kbd>首页 / 末页</div><div><kbd>Esc</kbd>关闭开窗 / 退出全屏</div>'
      + '<div><kbd>?</kbd>本帮助</div><div><kbd>点击底部按钮</kbd>同上</div>'
      + '</div><div class="nsec"><div class="sn">开窗说明</div>'
      + '<p>讲稿不是弹窗：按 N 或 T 在页面右侧开窗，再按一次关闭；开窗时画面按矢量缩放到左侧展示。按 T 打开全文讲稿会自动定位到当前页，翻页时右侧讲稿也会联动滚动到当前页。</p></div>';
  }
}
function scrollNotesTo(i, smooth){
  const body = $('#notesBody'), el = document.getElementById('nts' + i);
  if(!body || !el) return;
  const br = body.getBoundingClientRect(), er = el.getBoundingClientRect();
  const top = body.scrollTop + (er.top - br.top) - 12;
  const target = Math.max(0, top);
  try{ body.scrollTo({top: target, behavior: smooth ? 'smooth' : 'instant'}); }
  catch(e){ body.scrollTop = target; }
  if(!smooth) body.scrollTop = target;   /* 打开全文时立即定位，不接受平滑动画打断 */
}
function openPanel(mode){
  panelMode = mode;
  $('#notes').classList.add('on');
  $('#btnNotes').classList.toggle('act', mode === 'here');
  $('#btnAll').classList.toggle('act', mode === 'all');
  $('#btnToc').classList.toggle('act', mode === 'toc');
  $('#btnHelp').classList.toggle('act', mode === 'help');
  renderPanel();
  fit();
  if(mode === 'all'){
    requestAnimationFrame(() => { scrollNotesTo(cur, false); setTimeout(() => scrollNotesTo(cur, false), 90); });
  } else {
    $('#notesBody').scrollTop = 0;
  }
}
function closePanel(){
  panelMode = 'off';
  $('#notes').classList.remove('on');
  ['btnNotes','btnAll','btnToc','btnHelp'].forEach(id => $('#' + id).classList.remove('act'));
  fit();
}
function togglePanel(mode){ if(panelMode === mode) closePanel(); else openPanel(mode); }
function syncPanel(){
  if(panelMode === 'off') return;
  if(panelMode === 'here'){ renderPanel(); $('#notesBody').scrollTop = 0; }
  else if(panelMode === 'all'){
    $$('#notesBody .nsec').forEach((el, k) => el.classList.toggle('cur', k === cur));
    scrollNotesTo(cur, true);
  } else if(panelMode === 'toc'){
    $$('#notesBody .tocgrid a').forEach((el, k) => el.classList.toggle('cur', k === cur));
  }
}
$('#nClose').onclick = closePanel;
$('#notesBody').addEventListener('click', e => {
  const a = e.target.closest('[data-jump]');
  if(a){ go(parseInt(a.getAttribute('data-jump'), 10)); closePanel(); }
});

/* ---------- 全屏：底部按键条常驻；API 不可用时降级为页面内沉浸 ---------- */
function enterFs(){
  const el = document.documentElement;
  document.body.classList.add('fs');
  $('#btnFs').textContent = '退出全屏 F';
  try{
    const p = el.requestFullscreen ? el.requestFullscreen() : null;
    if(p && p.catch) p.catch(() => {});
  }catch(e){}
  toast('全屏：底部按键条仍可使用（F 或 Esc 退出）');
  setTimeout(fit, 140);
}
function exitFs(){
  document.body.classList.remove('fs');
  $('#btnFs').textContent = '全屏 F';
  try{ if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen(); }catch(e){}
  toast('已退出全屏');
  setTimeout(fit, 140);
}
function fs(){
  if(document.body.classList.contains('fs') || document.fullscreenElement) exitFs();
  else enterFs();
}
document.addEventListener('fullscreenchange', () => {
  if(!document.fullscreenElement){
    document.body.classList.remove('fs');
    $('#btnFs').textContent = '全屏 F';
  }
  fit();
});

/* ---------- 键盘 ---------- */
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  const typing = (tag === 'input' || tag === 'select' || tag === 'textarea');
  const k = e.key;
  const navKey = (k.indexOf('Arrow') === 0 || k === ' ' || k === 'Home' || k === 'End'
                  || k === 'PageUp' || k === 'PageDown');
  if(k === 'Escape'){
    if(panelMode !== 'off'){ closePanel(); return; }
    if(document.fullscreenElement || document.body.classList.contains('fs')) exitFs();
    return;
  }
  if(typing && navKey) return;
  if(k === 'ArrowRight' || k === ' ' || k === 'PageDown'){ e.preventDefault(); next(); }
  else if(k === 'ArrowLeft' || k === 'PageUp'){ e.preventDefault(); prev(); }
  else if(k === 'f' || k === 'F'){ e.preventDefault(); fs(); }
  else if(k === 'g' || k === 'G'){ e.preventDefault(); togglePanel('toc'); }
  else if(k === 'n' || k === 'N'){ e.preventDefault(); togglePanel('here'); }
  else if(k === 't' || k === 'T'){ e.preventDefault(); togglePanel('all'); }
  else if(k === 'p' || k === 'P'){ e.preventDefault(); toggleAuto(); }
  else if(k === '?' || k === 'h' || k === 'H'){ e.preventDefault(); togglePanel('help'); }
  else if(k === 'Home'){ e.preventDefault(); go(0); }
  else if(k === 'End'){ e.preventDefault(); go(N - 1); }
  else if(/^[1-9]$/.test(k)){ go(parseInt(k, 10) - 1); }
  else if(k === '0'){ go(9); }
});

/* ---------- 动画 A：窗口滑动的调用次数 ---------- */
let aStep = 0, aTimer = null, aPlaying = false;
const A_ROWS = 8;
function aModel(W){
  const rows = [];
  for(let i = 1; i <= A_ROWS; i++){
    const head = Math.max(1, i - W + 1), tail = i;
    const prevHead = i > 1 ? Math.max(1, (i - 1) - W + 1) : head;
    const moved = i > 1 && head > prevHead;
    /* 真实执行路径：帧头不动时两条路径都只追加 1 行；
       帧头移动时，无反函数则从帧头重扫整帧，有反函数则撤销 1 行 + 追加 1 行。 */
    const recalc = moved ? (tail - head + 1) : 1;
    const inv = moved ? 2 : 1;
    rows.push({i, head, tail, recalc, inv, moved});
  }
  return rows;
}
function aSetText(id, s){ const el = document.getElementById(id); if(el) el.textContent = s; }
function aPaint(){
  const W = +($('#aW') ? $('#aW').value : 4);
  const mode = $('#aMode') ? $('#aMode').value : 'inverse';
  const rows = aModel(W);
  const step = Math.min(aStep, A_ROWS);
  const info = step > 0 ? rows[step - 1] : null;
  const prev = step > 1 ? rows[step - 2] : null;
  for(let j = 1; j <= 8; j++){
    const el = document.getElementById('aCell' + j); if(!el) continue;
    let fill = CC.white, stroke = CC.line, sw = 1;
    if(info){
      if(j >= info.head && j <= info.tail){ fill = CC.priml; stroke = CC.prim; sw = 1.4; }
      if(mode === 'inverse' && prev){
        if(info.head > prev.head && j === info.head - 1){ fill = CC.accl; stroke = CC.acc; sw = 1.9; }
        if(j === info.tail){ fill = CC.greenl; stroke = CC.green; sw = 1.9; }
      }
    }
    el.setAttribute('fill', fill); el.setAttribute('stroke', stroke); el.setAttribute('stroke-width', sw);
  }
  const fr = document.getElementById('aFrame');
  if(fr){
    if(info){
      fr.setAttribute('x', 64 + (info.head - 1) * 158 - 6);
      fr.setAttribute('width', (info.tail - info.head + 1) * 158 + 4);
      fr.setAttribute('opacity', '1');
    } else fr.setAttribute('opacity', '0');
  }
  let ops = [];
  if(info){
    if(mode === 'recalc'){
      if(info.moved){ for(let j = info.head; j <= info.tail; j++) ops.push(['+r' + j, 'recalc']); }
      else ops.push(['+r' + info.tail, 'recalc']);
    } else if(step === 1){
      ops.push(['+r1', 'plus']);
    } else if(prev && info.head === prev.head){
      ops.push(['+r' + info.tail, 'plus']);
    } else {
      ops.push(['-r' + (info.head - 1), 'minus']);
      ops.push(['+r' + info.tail, 'plus']);
    }
  }
  const idle = document.getElementById('aIdle');
  if(idle) idle.setAttribute('opacity', ops.length ? '0' : '1');
  for(let k = 0; k < 5; k++){
    const g = document.getElementById('aOpG' + k);
    if(!g) continue;
    if(k < ops.length){
      const [txt, kind] = ops[k];
      const r = document.getElementById('aOpR' + k), t = document.getElementById('aOpT' + k);
      const col = kind === 'plus' ? CC.green : CC.acc;
      const fill = kind === 'plus' ? CC.greenl : CC.accl;
      r.setAttribute('fill', fill); r.setAttribute('stroke', col);
      t.setAttribute('fill', col); t.textContent = txt;
      g.setAttribute('opacity', '1');
    } else g.setAttribute('opacity', '0');
  }
  const totR = rows.reduce((a, r) => a + r.recalc, 0);
  const totI = rows.reduce((a, r) => a + r.inv, 0);
  const scale = 760 / Math.max(totR, totI, 1);
  const br = document.getElementById('aBarR'), bi = document.getElementById('aBarI');
  if(br){ br.setAttribute('width', (totR * scale).toFixed(1)); br.setAttribute('stroke-width', mode === 'recalc' ? 2.4 : 1.2); }
  if(bi){ bi.setAttribute('width', (totI * scale).toFixed(1)); bi.setAttribute('stroke-width', mode === 'inverse' ? 2.4 : 1.2); }
  aSetText('aNumR', totR + ' 次'); aSetText('aNumI', totI + ' 次');
  aSetText('aStep', '第 ' + step + ' / 8 行　W = ' + W);
  if(mode === 'recalc'){
    aSetText('aHint1', '帧头不动：只追加 1 行');
    aSetText('aHint2', '帧头移动：重扫整帧 W 行');
    aSetText('aNote', '帧头移动且无反函数 → 丢弃中间状态，从当前帧头重扫帧内全部行');
  } else {
    aSetText('aHint1', '模式：帧头不动只追加 1 行');
    aSetText('aHint2', '帧头移动撤销 1 行 + 追加 1 行');
    aSetText('aNote', '帧头不动 → 只追加 1 行；帧头移动 → 撤销 1 行 + 追加 1 行');
  }
  const out = $('#aOut');
  if(out){
    if(!info) out.innerHTML = '按「播放」或「单步」，观察每一行调用次数的变化。';
    else {
      const calls = mode === 'recalc' ? info.recalc : info.inv;
      const cum = rows.slice(0, step).reduce((a, r) => a + (mode === 'recalc' ? r.recalc : r.inv), 0);
      out.innerHTML = '<b>第 ' + step + ' 行</b> · 帧 [r' + info.head + ' … r' + info.tail + ']'
        + ' · 本次 ' + calls + ' 次状态转移 · 累计 ' + cum + ' 次';
      out.title = out.textContent;
    }
  }
}
function aPause(){
  aPlaying = false; clearInterval(aTimer); aTimer = null;
  const b = $('#aPlay'); if(b){ b.textContent = '▶ 播放'; b.classList.remove('play'); }
}
function aPlay(){
  if(aPlaying){ aPause(); return; }
  if(aStep >= A_ROWS) aStep = 0;
  aPlaying = true; const b = $('#aPlay'); if(b){ b.textContent = '❚❚ 暂停'; b.classList.add('play'); }
  aPaint();
  aTimer = setInterval(() => {
    aStep++; aPaint();
    if(aStep >= A_ROWS) aPause();
  }, 850);
}
function aTick(){ if(aStep < A_ROWS){ aStep++; aPaint(); } }
function aReset(){ aPause(); aStep = 0; aPaint(); }

/* ---------- 动画 B：WindowAgg 五道闸门 ---------- */
let bStep = 0, bTimer = null, bPlaying = false;
const B_GATES = [
  {id:'bHead', q:'① 帧头是否移动？', ok:'移动', fail:'不移动',
   reason:'帧头不移动：只持续追加新行，本来就用不上 inverse transition', kind:'append'},
  {id:'bInv', q:'② 聚合有 MINVFUNC？', ok:'已登记', fail:'缺失',
   reason:'没有 aggminvtransfn：放弃 moving mode，从当前帧头重新聚合', kind:'restart'},
  {id:'bVol', q:'③ 参数 / filter 稳定？', ok:'稳定', fail:'volatile',
   reason:'volatile 表达式：重启与不重启可能观察到不同结果，禁用 moving mode', kind:'restart'},
  {id:'bExc', q:'④ 是否存在 EXCLUDE？', ok:'无', fail:'有',
   reason:'EXCLUDE：可能聚合非连续行集，源码选择每行重新聚合', kind:'restart'},
  {id:'bNull', q:'⑤ MINVFUNC 返回 NULL？', ok:'成功', fail:'返回 NULL',
   reason:'MINVFUNC 返回 NULL：本次撤销失败，标记该聚合重启', kind:'restart'}
];
function bFail(){
  for(let i = 0; i < B_GATES.length; i++){
    const el = document.getElementById(B_GATES[i].id);
    if(el && el.value === B_GATES[i].fail) return i + 1;
  }
  return 0;
}
function bMaxStep(){ const f = bFail(); return f > 0 ? f + 1 : 6; }
function bSetText(id, s){ const el = document.getElementById(id); if(el) el.textContent = s; }
function bPaint(){
  const f = bFail();
  const max = bMaxStep();
  const verdict = bStep >= max;
  for(let i = 0; i < 5; i++){
    const g = document.getElementById('bG' + i), b = document.getElementById('bB' + i);
    const gate = B_GATES[i], sel = document.getElementById(gate.id);
    const val = sel ? sel.value : gate.ok;
    const failing = (f === i + 1);
    let fill = CC.white, stroke = CC.line, sw = 1, label = '待判断', lc = CC.muted;
    if(bStep > 0){
      if(failing){ fill = CC.accl; stroke = CC.acc; sw = 2.2; label = '→ 退出判断'; lc = CC.acc; }
      else if(verdict && f > 0 && i + 1 > f){ label = '未检查'; }
      else if(i + 1 < bStep || verdict){ fill = CC.greenl; stroke = CC.green; sw = 1.3; label = '→ 继续'; lc = CC.green; }
      else if(i + 1 === bStep){ fill = CC.priml; stroke = CC.prim; sw = 2.2; label = '判断中…'; lc = CC.prim; }
    }
    if(g){ g.setAttribute('fill', fill); g.setAttribute('stroke', stroke); g.setAttribute('stroke-width', sw); }
    if(b){ b.textContent = label; b.setAttribute('fill', lc); }
    if(val === gate.fail && bStep === 0 && b){ b.textContent = '→ 将触发'; b.setAttribute('fill', CC.acc); }
  }
  const vr = document.getElementById('bVerdictR');
  let t1 = '待判断 · 拨动开关后按播放', t2 = '五道闸门逐条检查：只要语义稳定性无法保证，就退回重算',
      t3 = '依据：nodeWindowAgg.c 注释 · CREATE AGGREGATE Notes · window.sql',
      t4 = '尚未执行', fill = CC.sub, stroke = CC.line, c1 = CC.ink;
  if(verdict){
    if(f > 0){
      const gate = B_GATES[f - 1];
      if(gate.kind === 'append'){
        t1 = '只继续追加新行'; t2 = gate.reason;
        fill = CC.greenl; stroke = CC.green; c1 = CC.green;
      } else {
        t1 = '重启：从当前帧头重新聚合'; t2 = gate.reason;
        fill = CC.accl; stroke = CC.acc; c1 = CC.acc;
      }
      t3 = '退出于第 ' + f + ' 道闸门 · ' + gate.q;
      t4 = gate.kind === 'append' ? '不需要 inverse transition' : '放弃 moving mode';
    } else {
      t1 = '采用 inverse transition'; t2 = '删除离开窗口的旧行，再追加新进入的行；复用聚合中间状态';
      t3 = '五道闸门全部通过 · 结果仍须由 MINVFUNC 精确恢复状态保证';
      t4 = '滑动（O(N) 路径）';
      fill = CC.greenl; stroke = CC.green; c1 = CC.green;
    }
  } else if(bStep > 0){
    t1 = '正在判断 · 第 ' + bStep + ' 道闸门';
    t2 = B_GATES[bStep - 1].q + '　当前取值：' + (document.getElementById(B_GATES[bStep-1].id) || {}).value;
    t4 = '判断进行中';
    fill = CC.priml; stroke = CC.prim; c1 = CC.prim;
  }
  if(vr){ vr.setAttribute('fill', fill); vr.setAttribute('stroke', stroke); }
  bSetText('bVerdictT1', t1); bSetText('bVerdictT2', t2);
  bSetText('bVerdictT3', t3); bSetText('bVerdictT4', t4);
  const e1 = document.getElementById('bVerdictT1'); if(e1) e1.setAttribute('fill', c1);
  const out = $('#bOut');
  if(out){
    out.innerHTML = verdict
      ? '<b>' + t1 + '</b> · ' + t2
      : (bStep > 0 ? '<b>第 ' + bStep + ' 道闸门</b> · ' + B_GATES[bStep-1].q : '拨动任意开关，再按「播放」看判定路径。');
    out.title = out.textContent;
  }
}
function bPause(){
  bPlaying = false; clearInterval(bTimer); bTimer = null;
  const b = $('#bPlay'); if(b){ b.textContent = '▶ 播放'; b.classList.remove('play'); }
}
function bPlay(){
  if(bPlaying){ bPause(); return; }
  if(bStep >= bMaxStep()) bStep = 0;
  bPlaying = true; const b = $('#bPlay'); if(b){ b.textContent = '❚❚ 暂停'; b.classList.add('play'); }
  bPaint();
  bTimer = setInterval(() => {
    bStep++; bPaint();
    if(bStep >= bMaxStep()) bPause();
  }, 800);
}
function bTick(){ if(bStep < bMaxStep()){ bStep++; bPaint(); } }
function bReset(){ bPause(); bStep = 0; bPaint(); }

/* ---------- 初始化 ---------- */
function init(){
  render(); fit();
  let saved = 0; try{ saved = parseInt(localStorage.getItem('invtrans-slide') || '0', 10) || 0; }catch(e){}
  go(Math.min(saved, N - 1), true);
  $('#btnPrev').onclick = prev; $('#btnNext').onclick = next;
  $('#btnToc').onclick = () => togglePanel('toc');
  $('#btnNotes').onclick = () => togglePanel('here');
  $('#btnAll').onclick = () => togglePanel('all');
  $('#btnAuto').onclick = toggleAuto;
  $('#btnFs').onclick = fs;
  $('#btnHelp').onclick = () => togglePanel('help');
  ['aW','aMode'].forEach(id => {
    const el = document.getElementById(id);
    if(el) el.addEventListener('change', () => { aPause(); aPaint(); });
  });
  B_GATES.forEach(g => {
    const el = document.getElementById(g.id);
    if(el) el.addEventListener('change', () => { bReset(); bPaint(); });
  });
  const bind = (id, fn) => { const el = $(id); if(el) el.onclick = fn; };
  bind('#aPlay', aPlay); bind('#aTick', aTick); bind('#aReset', aReset);
  bind('#bPlay', bPlay); bind('#bTick', bTick); bind('#bReset', bReset);
  aPaint(); bPaint();
}
document.addEventListener('DOMContentLoaded', init);
</script>
