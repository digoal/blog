<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数据库筑基课 · 聚合之 Inverse Transition｜状态恢复契约</title>
<!-- 单文件交付：所有原理图均为现场绘制的内联 SVG，零外部图片 / 字体 / 脚本依赖。 -->
<!-- 设计母题：地层剖面 / 工程蓝图。内容按「场景→代价→机制→契约→执行→正确性→收益→边界」推演。 -->
<style>
:root{
  --bg:#F7F6F2; --sub:#F1EFE9; --ink:#1B2B33; --ink2:#46585F; --muted:#89938F; --line:#D9D5CB;
  --primary:#245A6B; --prim-l:#E5EFF0; --accent:#BE653B; --acc-l:#F7E9DE;
  --green:#2F7A66; --green-l:#E4F0EA; --gold:#AE8A3E; --gold-l:#F5EDDC;
  --white:#FFFFFF; --pw:460px;
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#E9E7E1}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
#viewport{position:fixed;inset:0 0 58px 0;overflow:hidden}
#stage{position:absolute;width:1600px;height:900px;background:var(--bg);
  transform-origin:top left;box-shadow:0 18px 60px rgba(27,43,51,.13)}
.slide{position:absolute;inset:0;display:none}
.slide.on{display:block;animation:fadein .40s cubic-bezier(.2,.7,.2,1)}
@keyframes fadein{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.eyebrow{position:absolute;left:64px;top:44px;font-size:13px;letter-spacing:3.4px;
  color:var(--primary);font-weight:600}
.eyebrow .num{font-family:var(--mono);letter-spacing:1px;color:var(--accent);margin-right:14px}
h1.title{position:absolute;left:64px;top:70px;margin:0;font-family:var(--serif);
  font-size:44px;line-height:1.25;font-weight:700;letter-spacing:1.2px;color:var(--ink)}
.lede{position:absolute;left:64px;top:139px;width:1440px;font-size:19px;color:var(--ink2);
  line-height:1.5;letter-spacing:.3px}
.rule{position:absolute;left:64px;top:181px;width:1472px;height:1px;background:var(--line)}
.figwrap{position:absolute;left:100px;top:198px;width:1400px;height:430px}
svg.figure{display:block;overflow:visible}
svg.figure text{font-family:var(--sans)}
svg.figure text.serif{font-family:var(--serif)}
svg.figure text.mono{font-family:var(--mono)}
.caption{position:absolute;left:100px;top:638px;width:1400px;font-size:13px;
  color:var(--muted);letter-spacing:.4px}
.bridge{position:absolute;left:64px;top:706px;width:1472px;font-size:20px;
  color:var(--accent);line-height:1.55;letter-spacing:.4px;padding-left:18px;
  border-left:3px solid var(--accent);font-family:var(--serif)}
.bridge .bk{font-family:var(--sans);font-size:13px;color:var(--muted);
  letter-spacing:2px;display:block;margin-bottom:2px}
.footer{position:absolute;left:64px;top:846px;width:1472px;height:1px;background:var(--line)}
.footer .fl{position:absolute;left:0;top:14px;font-size:12.5px;color:var(--muted);letter-spacing:2px}
.footer .fr{position:absolute;right:0;top:12px;font-family:var(--mono);font-size:14px;color:var(--ink2)}
.footer .fbar{position:absolute;left:0;right:0;top:-1px;height:2px;background:transparent}
.footer .fbar i{display:block;height:2px;background:var(--primary);width:0;transition:width .4s ease}

/* 动画控件：位于图下方独立条带，绝不覆盖图 */
.ctrls{position:absolute;left:100px;top:630px;width:1400px;height:72px;display:flex;
  align-items:center;align-content:center;flex-wrap:wrap;gap:6px 10px}
.ctrls label{font-size:12.5px;color:var(--ink2);white-space:nowrap}
.ctrls select{font-family:var(--sans);font-size:12.5px;color:var(--ink);
  background:var(--white);border:1px solid var(--line);border-radius:4px;padding:4px 6px;outline:none}
.ctrls .btn{min-height:30px;padding:5px 12px;border:1px solid var(--primary);border-radius:4px;
  background:var(--white);color:var(--primary);font-size:12.5px;cursor:pointer;font-family:var(--sans)}
.ctrls .btn.play{background:var(--primary);color:var(--white)}
.ctrls .btn:hover{filter:brightness(.94)}
.ctrls .out{font-size:12.8px;color:var(--ink2);margin-left:auto;min-width:220px;flex:1;
  max-width:520px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrls .out b{color:var(--accent);font-weight:600}

/* 底部外壳：常驻，全屏后依然显示按键 */
.chrome{position:fixed;left:0;right:0;bottom:0;height:58px;background:#FCFBF8;
  border-top:1px solid var(--line);z-index:60;display:flex;flex-direction:column;
  justify-content:center;gap:2px;padding:4px 16px 3px;overflow:hidden}
.crow{display:flex;align-items:center;gap:7px;height:30px;min-width:0}
.chrome .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.chrome button{font-family:var(--sans);font-size:12.5px;color:var(--ink2);background:transparent;
  border:1px solid transparent;border-radius:5px;padding:5px 9px;cursor:pointer;white-space:nowrap}
.chrome button:hover{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome button.act{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome .pg{font-family:var(--mono);font-size:13.5px;color:var(--ink);min-width:72px;text-align:center}
.chrome .track{flex:1;min-width:40px;height:3px;background:var(--line);border-radius:3px;margin:0 8px;position:relative}
.chrome .track i{position:absolute;left:0;top:0;height:3px;background:var(--primary);border-radius:3px;transition:width .35s}
.ckeys{font-family:var(--mono);font-size:10.8px;color:var(--muted);letter-spacing:.2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:2px}
body.fs .chrome{border-top:2px solid var(--primary)}
body.fs .ckeys{color:var(--primary)}

/* 右侧页内开窗：讲稿 / 目录 / 帮助，不是弹窗 */
#notes{position:fixed;right:0;top:0;bottom:58px;width:var(--pw);background:#FCFBF8;
  border-left:1px solid var(--line);z-index:50;display:flex;flex-direction:column;
  transform:translateX(101%);transition:transform .32s cubic-bezier(.2,.7,.2,1);
  box-shadow:-10px 0 34px rgba(27,43,51,.07)}
#notes.on{transform:none}
.nhead{flex:0 0 auto;padding:18px 24px 14px;border-bottom:1px solid var(--line);background:var(--bg)}
.nhead .nh1{font-family:var(--serif);font-size:21px;color:var(--ink);font-weight:700}
.nhead .nh2{font-size:12.5px;color:var(--muted);letter-spacing:1px;margin-top:5px}
.nhead .nclose{float:right;background:var(--white);border:1px solid var(--line);border-radius:4px;
  padding:5px 10px;font-size:12px;cursor:pointer;color:var(--ink2);font-family:var(--sans)}
.nhead .nclose:hover{border-color:var(--primary);color:var(--primary)}
#notesBody{flex:1;overflow-y:auto;padding:8px 24px 44px}
#notesBody::-webkit-scrollbar{width:8px}
#notesBody::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.nsec{border-bottom:1px solid var(--line);padding:18px 4px 20px;scroll-margin-top:14px}
.nsec.cur{background:var(--prim-l);border-left:3px solid var(--primary);padding-left:14px;margin-left:-4px}
.nsec .sn{font-family:var(--mono);font-size:11.5px;color:var(--accent);letter-spacing:1px}
.nsec h3{margin:7px 0 12px;font-family:var(--serif);font-size:20px;color:var(--primary);line-height:1.4}
.nsec p{margin:0;font-size:15px;line-height:2.0;color:var(--ink2);letter-spacing:.2px;text-align:justify}
.nsec .bk{margin-top:14px;padding-left:12px;border-left:3px solid var(--accent);
  font-family:var(--serif);font-size:14.5px;color:var(--accent);line-height:1.7}
.nsec .ncap{font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.7}
.tocgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;padding:16px 2px}
.tocgrid a{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:4px;
  background:var(--white);text-decoration:none;color:var(--ink);cursor:pointer;font-size:13.5px;line-height:1.45}
.tocgrid a:hover{border-color:var(--primary);background:var(--prim-l)}
.tocgrid a.cur{border-color:var(--primary);background:var(--prim-l)}
.tocgrid a .gn{font-family:var(--mono);font-size:11.5px;color:var(--accent);margin-right:7px}
.keylist{display:grid;grid-template-columns:repeat(2,1fr);gap:9px 20px;font-size:14px;line-height:1.9;
  color:var(--ink2);padding:16px 2px}
.keylist kbd{font-family:var(--mono);background:var(--white);border:1px solid var(--line);
  border-bottom-width:2px;border-radius:4px;padding:2px 7px;color:var(--primary);margin-right:8px}
.toast{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);background:var(--ink);
  color:var(--white);font-size:12.5px;padding:9px 16px;border-radius:5px;opacity:0;transition:.3s;
  z-index:90;pointer-events:none;letter-spacing:.4px}
.toast.on{opacity:1}
@media print{.chrome,#notes,.toast{display:none!important}#viewport{position:static}
  #stage{position:static;transform:none!important;box-shadow:none}
  .slide{display:block!important;page-break-after:always;position:relative;height:900px}}
</style>
</head>
<body>
<div id="viewport"><div id="stage"><div id="slides"></div></div></div>

<aside id="notes" aria-label="页内讲稿窗口">
  <div class="nhead">
    <button class="nclose" id="nClose">关闭 ✕</button>
    <div class="nh1" id="nTitle">本页讲稿</div>
    <div class="nh2" id="nSub">按 N 关闭 · 按 T 通读全文</div>
  </div>
  <div id="notesBody"></div>
</aside>

<div class="chrome">
  <div class="crow">
    <button id="btnPrev">← 上一页</button>
    <button id="btnNext">下一页 →</button>
    <span class="pg" id="pg">01 / 18</span>
    <div class="track" id="track"><i></i></div>
    <div class="sep"></div>
    <button id="btnToc">目录 G</button>
    <button id="btnNotes">本页讲稿 N</button>
    <button id="btnAll">全文讲稿 T</button>
    <button id="btnAuto">▶ 自动播放 P</button>
    <button id="btnFs">全屏 F</button>
    <button id="btnHelp">? 快捷键</button>
  </div>
  <div class="ckeys" id="ckeys">按键：G 目录 · N 本页讲稿 · T 全文讲稿 · P 自动播放 · F 全屏 · ← → / 空格 翻页 · 1–9 / 0 跳页 · Home / End 首尾 · Esc 关闭 · ? 帮助　｜　显示讲稿时画面矢量缩放到左侧，右侧讲稿随翻页联动</div>
</div>
<div class="toast" id="toast"></div>

<script>
const D = [{"eyebrow":"开场 · 一条看起来很普通的 SQL","title":"滚动平均：一行窗口，一次重算？","lede":"每来一行传感器读数，都要算过去 60 行的平均值。SQL 里只有一个 avg()，执行器却要为每一行输出准备一个窗口帧。","caption":"图 01　左：业务 SQL；右：相邻输出行的窗口帧高度重叠（示意以 4 行代替 60 行）。","bridge":"先别急着谈优化——我们得先把「什么都不做」时的代价算清楚。","notes":"我们先从一个几乎每个人都会写的 SQL 开始：传感器日志里，按设备分区、按时间排序，算过去 60 行的平均读数。这行 SQL 看起来只是 avg，可它跟 GROUP BY 完全不是一回事——GROUP BY 是每组出一个结果，窗口聚合是每一行都出一个结果，而且每一行都带着自己的窗口帧。你看右边这张图，我把 60 行缩成 4 行示意：第 i 行的窗口是 r1 到 r4，第 i+1 行是 r2 到 r5，第 i+2 行是 r3 到 r6。它们几乎完全重叠，只差一行离开、一行进入。问题就藏在这儿：如果执行器老老实实给每一行都从头扫一遍窗口，那大量工作是在重复算已经算过的东西。所以先别急着谈优化，我们先把代价算清楚。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" id=\"fig01\"><text x=\"40\" y=\"28\" font-size=\"17\" fill=\"#245A6B\" text-anchor=\"start\" font-weight=\"600\" class=\"\" >业务里最普通的一条滚动指标 SQL<\/text><line x1=\"40\" y1=\"42\" x2=\"560\" y2=\"42\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"600\" y=\"28\" font-size=\"17\" fill=\"#245A6B\" text-anchor=\"start\" font-weight=\"600\" class=\"\" >但每一行输出，都要配一个自己的窗口帧<\/text><line x1=\"600\" y1=\"42\" x2=\"1380\" y2=\"42\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"20\" y=\"48\" width=\"560\" height=\"350\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"600\" y=\"48\" width=\"780\" height=\"350\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"34\" y=\"62\" width=\"532\" height=\"322\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"52\" y=\"94.0\" font-size=\"14\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >SELECT device_id, ts,<\/text><text x=\"52\" y=\"118.5\" font-size=\"14\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >       avg(value) OVER (<\/text><text x=\"52\" y=\"143.0\" font-size=\"14\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >         PARTITION BY device_id<\/text><text x=\"52\" y=\"167.5\" font-size=\"14\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >         ORDER BY ts<\/text><text x=\"52\" y=\"192.0\" font-size=\"14\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >         ROWS BETWEEN 59 PRECEDING<\/text><text x=\"52\" y=\"216.5\" font-size=\"14\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >                  AND CURRENT ROW<\/text><text x=\"52\" y=\"241.0\" font-size=\"14\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >       ) AS avg_60<\/text><text x=\"52\" y=\"265.5\" font-size=\"14\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >FROM sensor_log;<\/text><text x=\"620\" y=\"80\" font-size=\"13.5\" fill=\"#89938F\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >第 i 行　窗口 [r1 … r4]<\/text><rect x=\"640\" y=\"90\" width=\"76\" height=\"44\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\" /><text x=\"678.0\" y=\"120\" font-size=\"17\" fill=\"#245A6B\" text-anchor=\"middle\" font-weight=\"600\" class=\"mono\" >r1<\/text><rect x=\"724\" y=\"90\" width=\"76\" height=\"44\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\" /><text x=\"762.0\" y=\"120\" font-size=\"17\" fill=\"#245A6B\" text-anchor=\"middle\" font-weight=\"600\" class=\"mono\" >r2<\/text><rect x=\"808\" y=\"90\" width=\"76\" height=\"44\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\" /><text x=\"846.0\" y=\"120\" font-size=\"17\" fill=\"#245A6B\" text-anchor=\"middle\" font-weight=\"600\" class=\"mono\" >r3<\/text><rect x=\"892\" y=\"90\" width=\"76\" height=\"44\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\" /><text x=\"930.0\" y=\"120\" font-size=\"17\" fill=\"#245A6B\" text-anchor=\"middle\" font-weight=\"600\" class=\"mono\" >r4<\/text><rect x=\"976\" y=\"90\" width=\"76\" height=\"44\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"1014.0\" y= .0\" y=\"288\" font-size=\"17\" fill=\"#245A6B\" text-anchor=\"middle\" font-weight=\"600\" class=\"mono\" >r3<\/text><rect x=\"892\" y=\"258\" width=\"76\" height=\"44\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\" /><text x=\"930.0\" y=\"288\" font-size=\"17\" fill=\"#245A6B\" text-anchor=\"middle\" font-weight=\"600\" class=\"mono\" >r4<\/text><rect x=\"976\" y=\"258\" width=\"76\" height=\"44\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\" /><text x=\"1014.0\" y=\"288\" font-size=\"17\" fill=\"#245A6B\" text-anchor=\"middle\" font-weight=\"600\" class=\"mono\" >r5<\/text><rect x=\"1060\" y=\"258\" width=\"76\" height=\"44\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\" /><text x=\"1098.0\" y=\"288\" font-size=\"17\" fill=\"#245A6B\" text-anchor=\"middle\" font-weight=\"600\" class=\"mono\" >r6<\/text><rect x=\"1144\" y=\"258\" width=\"76\" height=\"44\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"1182.0\" y=\"288\" font-size=\"17\" fill=\"#89938F\" text-anchor=\"middle\" font-weight=\"600\" class=\"mono\" >r7<\/text><rect x=\"1228\" y=\"258\" width=\"76\" height=\"44\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"1266.0\" y=\"288\" font-size=\"17\" fill=\"#89938F\" text-anchor=\"middle\" font-weight=\"600\" class=\"mono\" >r8<\/text><line x1=\"805\" y1=\"308\" x2=\"1139\" y2=\"308\" stroke=\"#245A6B\" stroke-width=\"2\" /><text x=\"620\" y=\"344\" font-size=\"16\" fill=\"#BE653B\" text-anchor=\"start\" font-weight=\"600\" class=\"\" >相邻两个窗口只差：1 行离开 + 1 行进入<\/text><text x=\"620\" y=\"374\" font-size=\"13\" fill=\"#89938F\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >示意：把 60 行窗口缩成 4 行，取帧头已可移动的稳态段；r1…r8 为示意行号<\/text><\/svg>","ctrl":null},{"eyebrow":"问题 · 代价从哪里来","title":"帧头一移动，就重扫一整帧","lede":"官方文档写明：没有 inverse transition 时，运行时间与「输入行数 × 平均帧长度」成正比；有它时只与输入行数成正比。","caption":"图 02　上：重算路径丢弃中间状态；下：inverse 路径只处理离开的 r1 与进入的 r5。","bridge":"差别只在「离开的那一行」——那能不能把它从状态里减掉？","notes":"PostgreSQL 官方文档对这件事说得很直白：没有 inverse transition function 的时候，窗口函数机制必须在帧起点每次移动时从头重算，运行时间跟输入行数乘以平均帧长度成正比；有了它，运行时间只跟输入行数成正比。注意，这是文档给的复杂度描述，不是某个版本的实测加速比。图里上面那条路径，帧从 r1–r4 变成 r2–r5，得把 r2、r3、r4、r5 重新喂一遍 sfunc；下面那条路径，只做两件事：把 r1 从状态里撤掉，再把 r5 加进来。收益的来源不是少输出了几行——输出行数一点没少——而是复用了中间状态。那自然就引出下一个问题：什么样的状态，允许你把一行「减掉」？","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" id=\"fig02\"><rect x=\"20\" y=\"16\" width=\"1360\" height=\"180\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"20\" y=\"16\" width=\"1360\" height=\"42\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"40\" y=\"44\" font-size=\"18\" fill=\"#BE653B\" text-anchor=\"start\" font-weight=\"600\" class=\"\" >路径 A · 没有 inverse transition：帧头一移动，整帧重新喂给 sfunc<\/text><text x=\"1340\" y=\"44\" font-size=\"17\" fill=\"#BE653B\" text-anchor=\"end\" font-weight=\"600\" class=\"mono\" >成本 ≈ N × W<\/text><rect x=\"20\" y=\"212\" width=\"1360\" height=\"202\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"20\" y=\"212\" width=\"1360\" height=\"42\" rx=\"2\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"40\" y=\"240\" font-size=\"18\" fill=\"#2F7A66\" text-anchor=\"start\" font-weight=\"600\" class=\"\" >路径 B · 有 inverse transition：复用中间状态，只处理离开与进入的行<\/text><text x=\"1340\" y=\"240\" font-size=\"17\" fill=\"#2F7A66\" text-anchor=\"end\" font-weight=\"600\" class=\"mono\" >成本 ≈ N<\/text><text x=\"40\" y=\"104\" font-size=\"14.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >旧帧 [r1…r4]<\/text><rect x=\"200\" y=\"82\" width=\"92\" height=\"42\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\" /><text x=\"246.0\" y=\"110\" font-size=\"16\" fill=\"#1B2B33\" text-anchor=\"middle\" font-weight=\"600\" class=\"mono\" >r1<\/text><rect x=\"302\" y=\"82\" width=\"92\" height=\"42\" rx=\"2\" 加入<\/text><text x=\"990\" y=\"352\" font-size=\"17\" fill=\"#2F7A66\" text-anchor=\"start\" font-weight=\"600\" class=\"\" >每行 2 次状态转移<\/text><text x=\"990\" y=\"380\" font-size=\"13.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >输出行数一点没少，省的是重复计算<\/text><\/svg>","ctrl":null},{"eyebrow":"机制 · 把窗口滑动一步一步走给你看","title":"两种模式，差在每行调用几次","lede":"调整窗口宽度与执行模式，再播放：看窗口框住哪几行、本次究竟调用了几次状态转移函数。","caption":"","bridge":"机制看完了，接下来得问：状态到底长什么样才撤得动？","notes":"这一页我建议你亲手拨一拨。窗口宽度选 3、4、5，模式选「从头重算」或者「inverse transition」，然后按播放。每走一步，看当前窗口框住哪几行、本次到底调用了几次状态转移函数。数字不是实测，是按执行路径推演的：只要帧头不动，两条路径都只追加一行；帧头一移动，没有反函数就得从帧头把整帧重新扫一遍，有反函数则只撤销一行、追加一行。你会看到 W 越大，两条柱子的差距拉得越开。这里想让你记住的不是 20 和 12 这两个示意数，而是那个结构性差别：重算路径每次帧头移动都随窗口宽度线性增长，inverse 路径基本恒定。好，机制看完了，接下来得问：状态到底长什么样才撤得动？","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" id=\"animSlide\"><text x=\"40\" y=\"26\" font-size=\"14\" fill=\"#89938F\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >输入序列（示意 8 行） · 窗口帧随当前行右移<\/text><text id=\"aStep\" x=\"1360\" y=\"26\" font-size=\"14\" fill=\"#BE653B\" text-anchor=\"end\" font-weight=\"600\">第 0 / 8 行　W = 4<\/text><rect id=\"aFrame\" x=\"58\" y=\"44\" width=\"0\" height=\"64\" rx=\"2\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"2.2\" opacity=\"0\"/><rect id=\"aCell1\" x=\"64\" y=\"50\" width=\"150\" height=\"50\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"139.0\" y=\"82\" font-size=\"19\" fill=\"#1B2B33\" text-anchor=\"middle\" font-weight=\"600\" class=\"mono\" >r1<\/text><rect id=\"aCell2\" x=\"222\" y=\"50\" width=\"150\" height=\"50\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"297.0\" y=\"82\" font-size=\"19\" fill=\"#1B2B33\" text-anchor=\"middle\" font-weight=\"600\" class=\"mono\" >r2<\/text><rect id=\"aCell3\" x=\"380\" y=\"50\" width=\"150\" height=\"50\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"455.0\" y=\  id=\"aOpR1\" x=\"220\" y=\"160\" width=\"168\" height=\"48\" rx=\"2\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\"/><text id=\"aOpT1\" x=\"304\" y=\"190\" font-size=\"17\" fill=\"#2F7A66\" text-anchor=\"middle\" font-weight=\"600\" class=\"mono\">+r1<\/text><\/g><g id=\"aOpG2\" opacity=\"0\"><rect id=\"aOpR2\" x=\"400\" y=\"160\" width=\"168\" height=\"48\" rx=\"2\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\"/><text id=\"aOpT2\" x=\"484\" y=\"190\" font-size=\"17\" fill=\"#2F7A66\" text-anchor=\"middle\" font-weight=\"600\" class=\"mono\">+r1<\/text><\/g><g id=\"aOpG3\" opacity=\"0\"><rect id=\"aOpR3\" x=\"580\" y=\"160\" width=\"168\" height=\"48\" rx=\"2\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\"/><text id=\"aOpT3\" x=\"664\" y=\"190\" font-size=\"17\" fill=\"#2F7A66\" text-anchor=\"middle\" font-weight=\"600\" class=\"mono\">+r1<\/text><\/g><g id=\"aOpG4\" opacity=\"0\"><rect id=\"aOpR4\" x=\"760\" y=\"160\" width=\"168\" height=\"48\" rx=\"2\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\"/><text id=\"aOpT4\" x=\"844\" y=\"190\" font-size=\"17\" fill=\"#2F7A66\" text-anchor=\"middle\" font-weight=\"600\" class=\"mono\">+r1<\/text><\/g><text id=\"aIdle\" x=\"950\" y=\"190\" font-size=\"14\" fill=\"#89938F\" opacity=\"1\">按播放 / 单步显示本次操作<\/text><line x1=\"40\" y1=\"226\" x2=\"1360\" y2=\"226\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"40\" y=\"252\" font-size=\"14\" fill=\"#89938F\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >累计状态转移调用次数 · 同一 N / W 下两条路径的推演对比<\/text><text x=\"40\" y=\"292\" font-size=\"15\" fill=\"#BE653B\" text-anchor=\"start\" font-weight=\"600\" class=\"\" >从头重算<\/text><rect id=\"aBarR\" x=\"150\" y=\"272\" width=\"0\" height=\"26\" rx=\"2\" fill=\"#BE653B\" fill-opacity=\"0.30\" stroke=\"#BE653B\" stroke-width=\"1.2\"/><text id=\"aNumR\" x=\"940\" y=\"292\" font-size=\"15\" fill=\"#BE653B\" font-weight=\"600\" class=\"mono\">0 次<\/text><text x=\"40\" y=\"332\" font-size=\"15\" fill=\"#2F7A66\" text-anchor=\"start\" font-weight=\"600\" class=\"\" >inverse<\/text><rect id=\"aBarI\" x=\"150\" y=\"312\" width=\"0\" height=\"26\" rx=\"2\" fill=\"#2F7A66\" fill-opacity=\"0.30\" stroke=\"#2F7A66\" stroke-width=\"1.2\"/><text id=\"aNumI\" x=\"940\" y=\"332\" font-size=\"15\" fill=\"#2F7A66\" font-weight=\"600\" class=\"mono\">0 次<\/text><rect x=\"1000\" y=\"262\" width=\"360\" height=\"84\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"1016\" y=\"288\" font-size=\"13\" fill=\"#89938F\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >柱长按同一比例绘制<\/text><text id=\"aHint1\" x=\"1016\" y=\"314\" font-size=\"13.5\" fill=\"#46585F\">模式：帧头不动只追加 1 行<\/text><text id=\"aHint2\" x=\"1016\" y=\"336\" font-size=\"13.5\" fill=\"#46585F\">帧头移动撤销 1 行 + 追加 1 行<\/text><line x1=\"40\" y1=\"356\" x2=\"1360\" y2=\"356\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text id=\"aNote\" x=\"40\" y=\"386\" font-size=\"15\" fill=\"#46585F\">帧头不动 → 只追加 1 行；帧头移动 → 撤销 1 行 + 追加 1 行<\/text><text x=\"40\" y=\"412\" font-size=\"12.5\" fill=\"#89938F\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >说明：N = 8、W 可切换；计数由执行路径推导，不是 PostgreSQL 实测性能数字<\/text><\/svg>","ctrl":"<label>窗口宽度 W<\/label><select id=\"aW\"><option value=\"3\">3 行<\/option><option value=\"4\" selected>4 行<\/option><option value=\"5\">5 行<\/option><\/select>\n<label>执行模式<\/label><select id=\"aMode\"><option value=\"recalc\">从头重算<\/option><option value=\"inverse\" selected>inverse transition<\/option><\/select>\n<button class=\"btn play\" id=\"aPlay\">▶ 播放<\/button><button class=\"btn\" id=\"aTick\">单步<\/button><button class=\"btn\" id=\"aReset\">重置<\/button>\n<span class=\"out\" id=\"aOut\">按「播放」或「单步」，观察每一行调用次数的变化。<\/span>"},{"eyebrow":"洞察 · 结果不等于状态","title":"要撤销一行，状态得多存一点","lede":"能输出结果，不等于能撤销旧行。所以 moving-aggregate mode 允许一套完全独立的 MSTYPE 与 MFINALFUNC。","caption":"图 04　依据 pg_aggregate.dat 与 bool.c：avg 存 (sum, count)，bool_and 存 (aggcount, aggtrue)。","bridge":"明白了状态为什么必须更厚，再去看 PostgreSQL 把这套「两套实现」登记在哪。","notes":"很多人第一次写 MINVFUNC 会踩同一个坑：把「结果」当成「状态」。count 的撤销是减一，整数 sum 的撤销是减去那个值，看着很简单。但 avg 不行——如果你只存一个平均值，走了一行你没法把它的贡献摘干净，所以 PostgreSQL 的 avg 存的是 (sum, count)，最后再用 final function 除一下。布尔聚合更说明问题：bool_and 输出只是 true 或 false，可 moving 状态是 BoolAggState，里面两个计数器 aggcount 和 aggtrue，撤销时两个都减。这不是实现细节，是设计原则：能输出结果，不等于能撤销旧行。所以 moving-aggregate mode 允许一套完全独立的 MSTYPE 和 MFINALFUNC。明白了这一点，下一页我们去看 PostgreSQL 把这套「两套实现」登记在哪。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" id=\"fig04\"><rect x=\"20\" y=\"16\" width=\"150\" height=\"46\" rx=\"2\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1\" /><text x=\"95.0\" y=\"46\" font-size=\"15\" fill=\"#FFFFFF\" text-anchor=\"middle\" font-weight=\"600\" class=\"\" >聚合<\/text><rect x=\"170\" y=\"16\" width=\"190\" height=\"46\" rx=\"2\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1\" /><text x=\"265.0\" y=\"46\" font-size=\"15\" fill=\"#FFFFFF\" text-anchor=\"middle\" font-weight=\"600\" class=\"\" >输出结果<\/text><rect x=\"360\" y=\"16\" width=\"450\" height=\"46\" rx=\"2\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1\" /><text x=\"585.0\" y=\"46\" font-size=\"15\" fill=\"#FFFFFF\" text-anchor=\"middle\" font-weight=\"600\" class=\"\" >moving 状态（MSTYPE）<\/text><rect x=\"810\" y=\"16\" width=\"270\" height=\"46\" rx=\"2\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1\" /><text x=\"945.0\" y=\"46\" font-size=\"15\" fill=\"#FFFFFF\" text-anchor=\"middle\" font-weight=\"600\" class=\"\" >撤销函数 / 依据<\/text><rect x=\"1080\" y=\"16\" width=\"300\" height=\"46\" rx=\"2\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1\" /><text x=\"1230.0\" y=\"46\" font-size=\"15\" fill=\"#FFFFFF\" text-anchor=\"middle\" font-weight=\"600\" class=\"\" >为什么必须多存<\/text><rect x=\"20\" y=\"62\" width=\"150\" height=\"66\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"95.0\" y=\"103\" font-size=\"14\" fill=\"#1B2B33\" text-anchor=\"middle\" font-weight=\"600\" class=\"mono\" >count(*)<\/text><rect x=\"170\" y=\"62\" width=\"190\" height=\"66\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"265.0\" y=\"103\" font-size=\"14\" fill=\"#1B2B33\" text-anchor=\"middle\" font-weight=\"400\" class=\"mono\" >N<\/text><rect x=\"360\" y=\"62\" width=\"450\" height=\"66\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"585.0\" y=\"103\" font-size=\"13.5\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\" class=\"mono\" >int8，初值 0<\/text><rect x=\"810\" y=\"62\" width=\"270\" height=\"66\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"945.0\" y=\"103\" font-size=\"14\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\" class=\"mono\" >int8dec<\/text><rect x=\"1080\" y=\"62\" width=\"300\" height=\"66\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"1230.0\" y=\"103\" font-size=\"14\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\" class=\"\" >只要一个计数器<\/text><rect x=\"20\" y=\"128\" width=\"150\" height=\"66\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"95.0\" y=\"169\" font-size=\"14\" fill=\"#1B2B33\" text-anchor=\"middle\" font-weight=\"600\" class=\"mono\" >sum(int4)<\/text><rect x=\"170\" y=\"128\" width=\"190\" height=\"66\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"265.0\" y=\"169\" font-size=\"14\" fill=\"#1B2B33\" text-anchor=\"middle\" font-weight=\"400\" class=\"mono\" >Σx<\/text><rect x=\"360\" y=\"128\" width=\"450\" height=\"66\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"585.0\" y=\"169\" font-size=\"13.5\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\" class=\"mono\" >int8[] {0,0}<\/text><rect x=\"810\" y=\"128\" width=\"270\" height=\"66\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"945.0\" y=\"169\" font-size=\"14\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\" class=\"mono\" >int4_avg_accum_inv<\/text><rect x=\"1080\" y=\"128\" width=\"300\" height=\"66\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"1230.0\" y=\"169\" font-size=\"14\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\" class=\"\" >同时留 sum 与 count<\/text><rect x=\"20\" y=\"194\" width=\"150\" height=\"66\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"95.0\" y=\"235\" font-size=\"14\" fill=\"#1B2B33\" text-anchor=\"middle\" font-weight=\"600\" class=\"mono\" >avg(int4)<\/text><rect x=\"170\" y=\"194\" width=\"190\" height=\"66\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"265.0\" y=\"235\" font-size=\"14\" fill=\"#1B2B33\" text-anchor=\"middle\" font-weight=\"400\" class=\"mono\" >Σx / N<\/text><rect x=\"360\" y=\"194\" width=\"450\" height=\"66\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"585.0\" y=\"235\" font-size=\"13.5\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\" class=\"mono\" >int8[] {0,0} → int8_avg<\/text><rect x=\"810\" y=\"194\" width=\"270\" height=\"66\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"945.0\" y=\"235\" font-size=\"14\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\" class=\"mono\" >int4_avg_accum_inv<\/text><rect x=\"1080\" y=\"194\" width=\"300\" height=\"66\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"1230.0\" y=\"235\" font-size=\"14\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\" class=\"\" >平均值本身不可撤销<\/text><rect x=\"20\" y=\"260\" width=\"150\" height=\"66\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"95.0\" y=\"301\" font-size=\"14\" fill=\"#1B2B33\" text-anchor=\"middle\" font-weight=\"600\" class=\"mono\" >bool_and<\/text><rect x=\"170\" y=\"260\" width=\"190\" height=\"66\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"265.0\" y=\"301\" font-size=\"14\" fill=\"#1B2B33\" text-anchor=\"middle\" font-weight=\"400\" class=\"mono\" >true / false<\/text><rect x=\"360\" y=\"260\" width=\"450\" height=\"66\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"585.0\" y=\"301\" font-size=\"13.5\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\" class=\"mono\" >BoolAggState(aggcount, aggtrue)<\/text><rect x=\"810\" y=\"260\" width=\"270\" height=\"66\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"945.0\" y=\"301\" font-size=\"14\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\" class=\"mono\" >bool_accum_inv<\/text><rect x=\"1080\" y=\"260\" width=\"300\" height=\"66\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"1230.0\" y=\"301\" font-size=\"14\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\" class=\"\" >真值个数与总个数<\/text><rect x=\"20\" y=\"336\" width=\"1360\" height=\"76\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\" /><text x=\"44\" y=\"370\" font-size=\"20\" fill=\"#BE653B\" text-anchor=\"start\" font-weight=\"600\" class=\"serif\" >能输出结果 ≠ 能撤销旧行；所以 moving mode 允许一套完全独立的 MSTYPE 与 MFINALFUNC<\/text><text x=\"44\" y=\"398\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >依据：pg_aggregate.dat / bool.c / xaggr.sgml · Moving-Aggregate Mode<\/text><\/svg>","ctrl":null},{"eyebrow":"目录层 · 一套聚合，两套实现","title":"契约写在 pg_aggregate 里","lede":"PostgreSQL 不在 SFUNC 上临时猜反函数，而是在系统目录里明确登记 moving mode 的前向、反向、状态与 final 函数。","caption":"图 05　左：官方 CREATE AGGREGATE 示例；右：pg_aggregate 中并列的普通字段与 moving 字段。","bridge":"登记不是填完表就完事——创建阶段会先把明显不一致的定义拦下来。","notes":"这页是整套机制的静态契约。左边是官方文档里的 CREATE AGGREGATE 例子：普通路径由 sfunc、stype、initcond 描述；带 m 前缀的 msfunc、minvfunc、mstype、minitcond 是 moving 路径。右边是 pg_aggregate 里并列的字段：aggtransfn 对 aggmtransfn，aggtranstype 对 aggmtranstype，aggfinalfn 对 aggmfinalfn，还有 aggminvtransfn 这个普通路径根本没有的字段。我想强调的是：PostgreSQL 不是在普通 sfunc 上临时猜一个反函数，也不是优化器在计划里变魔术，而是在系统目录里把两套实现写清楚、由执行器按窗口帧的情况直接调用。契约先立住，后面的校验和优化才有依据。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" id=\"fig05\"><text x=\"40\" y=\"28\" font-size=\"17\" fill=\"#245A6B\" text-anchor=\"start\" font-weight=\"600\" class=\"\" >CREATE AGGREGATE · 把两套实现写进目录<\/text><line x1=\"40\" y1=\"42\" x2=\"600\" y2=\"42\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"640\" y=\"28\" font-size=\"17\" fill=\"#245A6B\" text-anchor=\"start\" font-weight=\"600\" class=\"\" >pg_aggregate · 普通字段与 moving 字段并列<\/text><line x1=\"640\" y1=\"42\" x2=\"1380\" y2=\"42\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"20\" y=\"48\" width=\"600\" height=\"350\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"640\" y=\"48\" width=\"740\" height=\"350\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"34\" y=\"62\" width=\"572\" height=\"322\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"52\" y=\"94.0\" font-size=\"14\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >CREATE AGGREGATE sum (complex)<\/text><text x=\"52\" y=\"118.5\" font-size=\"14\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >(<\/text><text x=\"52\" y=\"143.0\" font-size=\"14\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >    sfunc    = complex_add,<\/text><text x=\"52\" y=\"167.5\" font-size=\"14\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >    stype    = complex,<\/text><text x=\"52\" y=\"192.0\" font-size=\"14\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >    initcond = &#x27;(0,0)&#x27;,<\/text><text x=\"52\" y=\"216.5\" font-size=\"14\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >    msfunc   = complex_add,<\/text><text x=\"52\" y=\"241.0\" font-size=\"14\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >    minvfunc = complex_sub,<\/text><text x=\"52\" y=\"265.5\" font-size=\"14\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >    mstype   = complex,<\/text><text x=\"52\" y=\"290.0\" font-size=\"14\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >    minitcond = &#x27;(0,0)&#x27;<\/text><text x=\"52\" y=\"314.5\" font-size=\"14\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >);<\/text><rect x=\"660\" y=\"66\" width=\"330\" height=\"36\" rx=\"2\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1\" /><text x=\"825\" y=\"90\" font-size=\"16\" fill=\"#FFFFFF\" text-anchor=\"middle\" font-weight=\"600\" class=\"\" >普通实现<\/text><rect x=\"1010\" y=\"66\" width=\"350\" height=\"36\" rx=\"2\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"1185\" y=\"90\" font-size=\"16\" fill=\"#FFFFFF\" text-anchor=\"middle\" font-weight=\"600\" class=\"\" >moving 实现<\/text><text x=\"676\" y=\"118\" font-size=\"14.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >aggtransfn<\/text><text x=\"1026\" y=\"118\" font-size=\"14.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >aggmtransfn　加入新行<\/text><line x1=\"660\" y1=\"128\" x2=\"1360\" y2=\"128\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"676\" y=\"152\" font-size=\"14.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >aggfinalfn<\/text><text x=\"1026\" y=\"152\" font-size=\"14.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >aggminvtransfn　移出旧行<\/text><line x1=\"660\" y1=\"162\" x2=\"1360\" y2=\"162\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"676\" y=\"186\" font-size=\"14.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >aggtranstype<\/text><text x=\"1026\" y=\"186\" font-size=\"14.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >aggmfinalfn　产出结果<\/text><line x1=\"660\" y1=\"196\" x2=\"1360\" y2=\"196\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"676\" y=\"220\" font-size=\"14.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >aggtransspace<\/text><text x=\"1026\" y=\"220\" font-size=\"14.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >aggmtranstype　状态类型<\/text><line x1=\"660\" y1=\"230\" x2=\"1360\" y2=\"230\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"676\" y=\"254\" font-size=\"14.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >agginitval<\/text><text x=\"1026\" y=\"254\" font-size=\"14.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >aggmtransspace / aggminitval<\/text><line x1=\"660\" y1=\"264\" x2=\"1360\" y2=\"264\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"676\" y=\"288\" font-size=\"14.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >aggcombinefn（普通路径）<\/text><text x=\"1026\" y=\"288\" font-size=\"14.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >aggmfinalmodify / aggmfinalextra<\/text><line x1=\"660\" y1=\"298\" x2=\"1360\" y2=\"298\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><line x1=\"998\" y1=\"66\" x2=\"998\" y2=\"310\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"660\" y=\"318\" width=\"700\" height=\"74\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\" /><text x=\"1010\" y=\"348\" font-size=\"16\" fill=\"#245A6B\" text-anchor=\"middle\" font-weight=\"600\" class=\"\" >同一个 aggfnoid · 同一结果类型 · 两套状态与函数<\/text><text x=\"676\" y=\"378\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >执行器按窗口帧情况直接调用登记好的函数，不临时推导反函数<\/text><\/svg>","ctrl":null},{"eyebrow":"目录层 · 创建时的校验","title":"四道检查，把错误挡在执行之前","lede":"AggregateCreate 校验签名、状态类型、strictness 与结果类型；回归测试还检查系统目录的一致性。","caption":"图 06　依据 pg_aggregate.c / create_aggregate.sgml / opr_sanity.sql；地层由深到浅对应四道检查。","bridge":"定义过关了，接下来要看谁真正调用它——是 Agg 节点，还是 WindowAgg 节点？","notes":"登记不是填完表就完事。AggregateCreate 会先把明显不一致的定义拦下来：MINVFUNC 的参数数量和类型必须跟 MSFUNC 一致，返回类型必须等于声明的 MSTYPE；两者的 strictness 必须一致，否则报错；moving 实现算出来的结果类型必须跟普通实现一样，不能一个返回 numeric、一个返回 float。回归测试 opr_sanity.sql 还会查目录一致性：aggmtranstype 不为 0 时，aggmtransfn 和 aggminvtransfn 不能缺；反过来，aggmtranstype 为 0 时，moving 相关字段不能莫名其妙存在。另外文档还有一条容易忽略：MSFUNC 不允许返回 NULL 作为新状态值。这些检查把「写错定义」挡在创建阶段，而不是等到执行时给出诡异结果。定义过关了，接下来要看谁真正调用它。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" id=\"fig06\"><rect x=\"20\" y=\"14\" width=\"1360\" height=\"84\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"20\" y=\"14\" width=\"8\" height=\"84\" rx=\"0\" fill=\"#1E4B5A\" stroke=\"none\" stroke-width=\"0\" /><text x=\"44\" y=\"62\" font-size=\"25\" fill=\"#1E4B5A\" text-anchor=\"start\" font-weight=\"600\" class=\"mono\" >01<\/text><text x=\"112\" y=\"48\" font-size=\"18\" fill=\"#245A6B\" text-anchor=\"start\" font-weight=\"600\" class=\"\" >签名一致<\/text><text x=\"112\" y=\"78\" font-size=\"14.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >MINVFUNC 参数数量 / 类型与 MSFUNC 一致；返回类型必须等于声明的 MSTYPE<\/text><text x=\"1340\" y=\"66\" font-size=\"12\" fill=\"#89938F\" text-anchor=\"end\" font-weight=\"400\" class=\"mono\" >CHECK<\/text><rect x=\"20\" y=\"108\" width=\"1360\" height=\"84\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"20\" y=\"108\" width=\"8\" height=\"84\" rx=\"0\" fill=\"#2E6373\" stroke=\"none\" stroke-width=\"0\" /><text x=\"44\" y=\"156\" font-size=\"25\" fill=\"#2E6373\" text-anchor=\"start\" font-weight=\"600\" class=\"mono\" >02<\/text><text x=\"112\" y=\"142\" font-size=\"18\" fill=\"#245A6B\" text-anchor=\"start\" font-weight=\"600\" class=\"\" >strictness 一致<\/text><text x=\"112\" y=\"172\" font-size=\"14.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >MSFUNC 与 MINVFUNC 必须同为 strict 或同为非 strict，否则创建时报错<\/text><text x=\"1340\" y=\"160\" font-size=\"12\" fill=\"#89938F\" text-anchor=\"end\" font-weight=\"400\" class=\"mono\" >CHECK<\/text><rect x=\"20\" y=\"202\" width=\"1360\" height=\"84\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"20\" y=\"202\" width=\"8\" height=\"84\" rx=\"0\" fill=\"#47808D\" stroke=\"none\" stroke-width=\"0\" /><text x=\"44\" y=\"250\" font-size=\"25\" fill=\"#47808D\" text-anchor=\"start\" font-weight=\"600\" class=\"mono\" >03<\/text><text x=\"112\" y=\"236\" font-size=\"18\" fill=\"#245A6B\" text-anchor=\"start\" font-weight=\"600\" class=\"\" >结果类型一致<\/text><text x=\"112\" y=\"266\" font-size=\"14.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >MFINALFUNC 或 MSTYPE 决定的输出类型，必须等于普通实现的结果类型<\/text><text x=\"1340\" y=\"254\" font-size=\"12\" fill=\"#89938F\" text-anchor=\"end\" font-weight=\"400\" class=\"mono\" >CHECK<\/text><rect x=\"20\" y=\"296\" width=\"1360\" height=\"84\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"20\" y=\"296\" width=\"8\" height=\"84\" rx=\"0\" fill=\"#74A5AD\" stroke=\"none\" stroke-width=\"0\" /><text x=\"44\" y=\"344\" font-size=\"25\" fill=\"#74A5AD\" text-anchor=\"start\" font-weight=\"600\" class=\"mono\" >04<\/text><text x=\"112\" y=\"330\" font-size=\"18\" fill=\"#245A6B\" text-anchor=\"start\" font-weight=\"600\" class=\"\" >目录完整性<\/text><text x=\"112\" y=\"360\" font-size=\"14.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >aggmtranstype ≠ 0 时 aggmtransfn / aggminvtransfn 不得缺失（opr_sanity.sql）<\/text><text x=\"1340\" y=\"348\" font-size=\"12\" fill=\"#89938F\" text-anchor=\"end\" font-weight=\"400\" class=\"mono\" >CHECK<\/text><rect x=\"20\" y=\"392\" width=\"1360\" height=\"34\" rx=\"2\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1\" /><text x=\"40\" y=\"414\" font-size=\"14\" fill=\"#AE8A3E\" text-anchor=\"start\" font-weight=\"600\" class=\"\" >另一条硬规则：MSFUNC 不允许返回 NULL 作为新状态值（CREATE AGGREGATE · Notes）<\/text><\/svg>","ctrl":null},{"eyebrow":"执行层 · 位置钉死","title":"只有 WindowAgg 真正使用它","lede":"nodeAgg.c 负责普通 / 哈希 / 排序 / 部分聚合；inverse transition 属于 nodeWindowAgg.c 的条件优化路径。","caption":"图 07　计划中常见 Sort + WindowAgg；右侧列出 inverse transition 明确不优化的几件事。","bridge":"位置清楚了，再看执行器在每一行做的那个判断——用滑动，还是重启？","notes":"这一页把位置钉死。很多人一听「聚合优化」就想到 GROUP BY 的 Agg 节点，其实不对：nodeAgg.c 负责普通聚合、哈希聚合、排序聚合、部分聚合，它初始化 ordinary transition function 时甚至有注释说明这里不需要 invtransfn。真正使用 inverse transition 的是 nodeWindowAgg.c，也就是计划里那个 WindowAgg。你看中间这条地层：SQL 进来，先要按 PARTITION BY 和 ORDER BY 把输入组织好，常见是 Sort 加 WindowAgg，或者用已有索引顺序省掉排序；然后 WindowAgg 在帧头移动时调用反函数。右边这几条特别重要：它不消除排序，不优化 Hash Agg 的哈希表大小，也不优化 parallel aggregation 的 combine 成本。所以 EXPLAIN 里看到 WindowAgg 慢，先别急着怪聚合函数。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" id=\"fig07\"><rect x=\"20\" y=\"14\" width=\"880\" height=\"78\" rx=\"2\" fill=\"#CFE0DC\" stroke=\"#FFFFFF\" stroke-width=\"1.2\" /><rect x=\"20\" y=\"14\" width=\"8\" height=\"78\" rx=\"0\" fill=\"#1E4B5A\" stroke=\"none\" stroke-width=\"0\" /><text x=\"44\" y=\"42\" font-size=\"14\" fill=\"#89938F\" text-anchor=\"start\" font-weight=\"600\" class=\"\" >查询层<\/text><text x=\"44\" y=\"72\" font-size=\"17\" fill=\"#1B2B33\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >SQL：avg(value) OVER (PARTITION BY … ORDER BY …)<\/text><rect x=\"20\" y=\"106\" width=\"880\" height=\"78\" rx=\"2\" fill=\"#F5EDDC\" stroke=\"#FFFFFF\" stroke-width=\"1.2\" /><rect x=\"20\" y=\"106\" width=\"8\" height=\"78\" rx=\"0\" fill=\"#2E6373\" stroke=\"none\" stroke-width=\"0\" /><text x=\"44\" y=\"134\" font-size=\"14\" fill=\"#89938F\" text-anchor=\"start\" font-weight=\"600\" class=\"\" >排序层<\/text><text x=\"44\" y=\"164\" font-size=\"17\" fill=\"#1B2B33\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >Sort / Index Path：按分区键与排序键组织输入<\/text><rect x=\"20\" y=\"198\" width=\"880\" height=\"94\" rx=\"2\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.2\" /><rect x=\"20\" y=\"198\" width=\"8\" height=\"94\" rx=\"0\" fill=\"#47808D\" stroke=\"none\" stroke-width=\"0\" /><text x=\"44\" y=\"226\" font-size=\"14\" fill=\"#FFFFFF\" text-anchor=\"start\" font-weight=\"600\" class=\"\" >执行层<\/text><text x=\"44\" y=\"256\" font-size=\"18\" fill=\"#FFFFFF\" text-anchor=\"start\" font-weight=\"600\" class=\"\" >WindowAgg · nodeWindowAgg.c：帧头移动时调用反函数<\/text><rect x=\"20\" y=\"306\" width=\"880\" height=\"78\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#F1EFE9\" stroke-width=\"1.2\" /><rect x=\"20\" y=\"306\" width=\"8\" height=\"78\" rx=\"0\" fill=\"#74A5AD\" stroke=\"none\" stroke-width=\"0\" /><text x=\"44\" y=\"334\" font-size=\"14\" fill=\"#89938F\" text-anchor=\"start\" font-weight=\"600\" class=\"\" >执行层<\/text><text x=\"44\" y=\"364\" font-size=\"17\" fill=\"#1B2B33\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >Agg · nodeAgg.c：普通 / 哈希 / 排序 / 部分聚合<\/text><text x=\"44\" y=\"377\" font-size=\"12.5\" fill=\"#89938F\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >注释明确：这里不需要 invtransfn<\/text><line x1=\"920\" y1=\"14\" x2=\"920\" y2=\"400\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"950\" y=\"36\" font-size=\"19\" fill=\"#BE653B\" text-anchor=\"start\" font-weight=\"600\" class=\"\" >它不优化什么<\/text><line x1=\"950\" y1=\"50\" x2=\"1360\" y2=\"50\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"950\" y=\"70\" width=\"8\" height=\"8\" rx=\"0\" fill=\"#BE653B\" stroke=\"none\" stroke-width=\"0\" /><text x=\"970\" y=\"84\" font-size=\"15.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >窗口排序：Sort 常是主要成本<\/text><rect x=\"950\" y=\"122\" width=\"8\" height=\"8\" rx=\"0\" fill=\"#BE653B\" stroke=\"none\" stroke-width=\"0\" /><text x=\"970\" y=\"136\" font-size=\"15.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >GROUP BY 的哈希表大小<\/text><rect x=\"950\" y=\"174\" width=\"8\" height=\"8\" rx=\"0\" fill=\"#BE653B\" stroke=\"none\" stroke-width=\"0\" /><text x=\"970\" y=\"188\" font-size=\"15.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >排序聚合的排序成本<\/text><rect x=\"950\" y=\"226\" width=\"8\" height=\"8\" rx=\"0\" fill=\"#BE653B\" stroke=\"none\" stroke-width=\"0\" /><text x=\"970\" y=\"240\" font-size=\"15.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >parallel aggregation 的 combine<\/text><rect x=\"950\" y=\"278\" width=\"8\" height=\"8\" rx=\"0\" fill=\"#BE653B\" stroke=\"none\" stroke-width=\"0\" /><text x=\"970\" y=\"292\" font-size=\"15.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >tuplestore 与表达式计算<\/text><rect x=\"950\" y=\"330\" width=\"410\" height=\"72\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\" /><text x=\"1155\" y=\"358\" font-size=\"15\" fill=\"#245A6B\" text-anchor=\"middle\" font-weight=\"600\" class=\"mono\" >EXPLAIN 常见：Sort → WindowAgg<\/text><text x=\"970\" y=\"386\" font-size=\"12.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >看到 WindowAgg 慢，先判断成本在排序还是聚合<\/text><\/svg>","ctrl":null},{"eyebrow":"执行层 · 决策流程可交互","title":"滑动还是重启？五道闸门","lede":"拨动开关再播放：只要语义稳定性无法保证，PostgreSQL 就宁愿退回从当前帧头重新聚合。","caption":"","bridge":"理解了这道决策，我们再来看它为什么这么怕「不稳定」。","notes":"这一页把执行器每一行的判断拆成五道闸门，你可以逐个拨开关：帧头动不动、聚合有没有 MINVFUNC、参数是不是 volatile、有没有 EXCLUDE、MINVFUNC 这次是不是返回 NULL。按播放，看它走到哪一步停下。你会发现 PostgreSQL 的判断非常保守：只要语义稳定性没法保证，就退回「从当前帧头重新聚合」。这不是能力不够，是刻意的选择——因为重启和不重启如果会观察到不同的结果，那再快也是错的。特别是 volatile 那条，社区 2023 年还专门修过一次：参数或 FILTER 里含 SubPlan 时，原来的 volatile 检查会漏掉，索性直接禁用优化。理解了这道决策，我们再来看它为什么这么怕「不稳定」。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" id=\"animDecision\"><rect id=\"bG0\" x=\"40\" y=\"44\" width=\"248\" height=\"78\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"164\" y=\"76\" font-size=\"16\" fill=\"#1B2B33\" text-anchor=\"middle\" font-weight=\"600\" class=\"\" >① 帧头是否移动？<\/text><text x=\"164\" y=\"102\" font-size=\"12.5\" fill=\"#89938F\" text-anchor=\"middle\" font-weight=\"400\" class=\"\" >UNBOUNDED PRECEDING 通常不移动<\/text><text id=\"bB0\" x=\"164\" y=\"146\" font-size=\"13\" fill=\"#89938F\" text-anchor=\"middle\">待判断<\/text><line x1=\"288\" y1=\"83\" x2=\"300\" y2=\"83\" stroke=\"#7BA6AF\" stroke-width=\"1.2\" /><polygon points=\"300,79 308,83 300,87\" fill=\"#7BA6AF\"/><rect id=\"bG1\" x=\"308\" y=\"44\" width=\"248\" height=\"78\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"432\" y=\"76\" font-size=\"16\" fill=\"#1B2B33\" text-anchor=\"middle\" font-weight=\"600\" class=\"\" >② 有 MINVFUNC？<\/text><text x=\"432\" y=\"102\" font-size=\"12.5\" fill=\"#89938F\" text-anchor=\"middle\" font-weight=\"400\" class=\"\" >pg_aggregate.aggminvtransfn<\/text><text id=\"bB1\" x=\"432\" y=\"146\" font-size=\"13\" fill=\"#89938F\" text-anchor=\"middle\">待判断<\/text><line x1=\"556\" y1=\"83\" x2=\"568\" y2=\"83\" stroke=\"#7BA6AF\" stroke-width=\"1.2\" /><polygon points=\"568,79 576,83 568,87\" fill=\"#7BA6AF\"/><rect id=\"bG2\" x=\"576\" y=\"44\" width=\"248\" height=\"78\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"700\" y=\"76\" font-size=\"16\" fill=\"#1B2B33\" text-anchor=\"middle\" font-weight=\"600\" class=\"\" >③ 参数 / filter 稳定？<\/text><text x=\"700\" y=\"102\" font-size=\"12.5\" fill=\"#89938F\" text-anchor=\"middle\" font-weight=\"400\" class=\"\" >volatile、含 SubPlan 会禁用<\/text><text id=\"bB2\" x=\"700\" y=\"146\" font-size=\"13\" fill=\"#89938F\" text-anchor=\"middle\">待判断<\/text><line x1=\"824\" y1=\"83\" x2=\"836\" y2=\"83\" stroke=\"#7BA6AF\" stroke-width=\"1.2\" /><polygon points=\"836,79 844,83 836,87\" fill=\"#7BA6AF\"/><rect id=\"bG3\" x=\"844\" y=\"44\" width=\"248\" height=\"78\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"968\" y=\"76\" font-size=\"16\" fill=\"#1B2B33\" text-anchor=\"middle\" font-weight=\"600\" class=\"\" >④ 是否存在 EXCLUDE？<\/text><text x=\"968\" y=\"102\" font-size=\"12.5\" fill=\"#89938F\" text-anchor=\"middle\" font-weight=\"400\" class=\"\" >任意 frame exclusion 选项<\/text><text id=\"bB3\" x=\"968\" y=\"146\" font-size=\"13\" fill=\"#89938F\" text-anchor=\"middle\">待判断<\/text><line x1=\"1092\" y1=\"83\" x2=\"1104\" y2=\"83\" stroke=\"#7BA6AF\" stroke-width=\"1.2\" /><polygon points=\"1104,79 1112,83 1104,87\" fill=\"#7BA6AF\"/><rect id=\"bG4\" x=\"1112\" y=\"44\" width=\"248\" height=\"78\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1236\" y=\"76\" font-size=\"16\" fill=\"#1B2B33\" text-anchor=\"middle\" font-weight=\"600\" class=\"\" >⑤ MINVFUNC 返回 NULL？<\/text><text x=\"1236\" y=\"102\" font-size=\"12.5\" fill=\"#89938F\" text-anchor=\"middle\" font-weight=\"400\" class=\"\" >NULL 表示本次撤销失败<\/text><text id=\"bB4\" x=\"1236\" y=\"146\" font-size=\"13\" fill=\"#89938F\" text-anchor=\"middle\">待判断<\/text><line x1=\"40\" y1=\"168\" x2=\"1360\" y2=\"168\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect id=\"bVerdictR\" x=\"40\" y=\"188\" width=\"1320\" height=\"184\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text id=\"bVerdictT1\" x=\"70\" y=\"238\" font-size=\"26\" fill=\"#1B2B33\" font-weight=\"700\" class=\"serif\">待判断 · 拨动开关后按播放<\/text><text id=\"bVerdictT2\" x=\"70\" y=\"282\" font-size=\"16\" fill=\"#46585F\">五道闸门逐条检查：只要语义稳定性无法保证，就退回重算<\/text><text id=\"bVerdictT3\" x=\"70\" y=\"318\" font-size=\"14\" fill=\"#89938F\">依据：nodeWindowAgg.c 注释 · CREATE AGGREGATE Notes · window.sql<\/text><line x1=\"70\" y1=\"338\" x2=\"1330\" y2=\"338\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"70\" y=\"358\" font-size=\"13\" fill=\"#89938F\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >判定结果<\/text><text id=\"bVerdictT4\" x=\"160\" y=\"358\" font-size=\"14\" fill=\"#46585F\">尚未执行<\/text><text x=\"40\" y=\"408\" font-size=\"13\" fill=\"#BE653B\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >说明：这是 WindowAgg 的条件优化路径，不是 planner 承诺的独立计划节点<\/text><\/svg>","ctrl":"<label>帧头<\/label><select id=\"bHead\"><option value=\"移动\">移动<\/option><option value=\"不移动\">不移动<\/option><\/select>\n<label>MINVFUNC<\/label><select id=\"bInv\"><option value=\"已登记\">已登记<\/option><option value=\"缺失\">缺失<\/option><\/select>\n<label>参数<\/label><select id=\"bVol\"><option value=\"稳定\">稳定<\/option><option value=\"volatile\">volatile<\/option><\/select>\n<label>EXCLUDE<\/label><select id=\"bExc\"><option value=\"无\">无<\/option><option value=\"有\">有<\/option><\/select>\n<label>本次撤销<\/label><select id=\"bNull\"><option value=\"成功\">成功<\/option><option value=\"返回 NULL\">返回 NULL<\/option><\/select>\n<button class=\"btn play\" id=\"bPlay\">▶ 播放<\/button><button class=\"btn\" id=\"bTick\">单步<\/button><button class=\"btn\" id=\"bReset\">重置<\/button>\n<span class=\"out\" id=\"bOut\">拨动任意开关，再按「播放」看判定路径。<\/span>"},{"eyebrow":"执行层 · 语义护栏","title":"宁可重算，也不在语义上冒险","lede":"没有反函数、反函数返回 NULL、volatile 表达式、EXCLUDE、帧头不动或删除后无行保留，都有明确的退路。","caption":"图 09　六类边界；依据 nodeWindowAgg.c 注释、CREATE AGGREGATE Notes 与 window.sql。","bridge":"为什么对「不稳定」这么敏感？因为反函数要的不是差不多，是精确恢复。","notes":"把源码里的护栏摊开，一共六类。第一类其实不算失败：UNBOUNDED PRECEDING 起点，帧头不动，只持续追加新行，本来就用不上反函数。第二类是没有 aggminvtransfn，直接放弃 moving mode。第三类是 volatile 参数、volatile filter，甚至含子计划的表达式，全部禁用，因为重启与不重启可能看到不同的随机值和副作用。第四类是任何 EXCLUDE frame option——源码注释写得很清楚，可能出现非连续的行集，所以干脆每行重算。第五类是 MINVFUNC 返回 NULL，标记该聚合重启。第六类是撤销后没有行保留，或者新旧帧根本不重叠，直接重启。还有一条文档里的保证：反函数被调用时，一定能假设移除后至少还剩一行。你看，PostgreSQL 宁可多算，也不肯在语义上冒险。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" id=\"fig09\"><rect x=\"20\" y=\"14\" width=\"670\" height=\"114\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"20\" y=\"14\" width=\"7\" height=\"114\" rx=\"0\" fill=\"#2F7A66\" stroke=\"none\" stroke-width=\"0\" /><text x=\"48\" y=\"50\" font-size=\"15\" fill=\"#2F7A66\" text-anchor=\"start\" font-weight=\"600\" class=\"mono\" >01<\/text><text x=\"88\" y=\"50\" font-size=\"18\" fill=\"#245A6B\" text-anchor=\"start\" font-weight=\"600\" class=\"\" >帧头不移动<\/text><text x=\"48\" y=\"84\" font-size=\"14.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >UNBOUNDED PRECEDING 起点：只持续追加新行，本来就<\/text><text x=\"48\" y=\"108\" font-size=\"14.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >用不上反函数<\/text><rect x=\"710\" y=\"14\" width=\"670\" height=\"114\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"710\" y=\"14\" width=\"7\" height=\"114\" rx=\"0\" fill=\"#BE653B\" stroke=\"none\" stroke-width=\"0\" /><text x=\"738\" y=\"50\" font-size=\"15\" fill=\"#BE653B\" text-anchor=\"start\" font-weight=\"600\" class=\"mono\" >02<\/text><text x=\"778\" y=\"50\" font-size=\"18\" fill=\"#245A6B\" text-anchor=\"start\" font-weight=\"600\" class=\"\" >没有 aggminvtransfn<\/text><text x=\"738\" y=\"84\" font-size=\"14.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >执行器放弃 moving mode，帧头移动时从当前帧头重新聚合<\/text><text x=\"738\" y=\"108\" font-size=\"13.5\" fill=\"#89938F\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >宁可重算，也不在语义上冒险<\/text><rect x=\"20\" y=\"142\" width=\"670\" height=\"114\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"20\" y=\"142\" width=\"7\" height=\"114\" rx=\"0\" fill=\"#BE653B\" stroke=\"none\" stroke-width=\"0\" /><text x=\"48\" y=\"178\" font-size=\"15\" fill=\"#BE653B\" text-anchor=\"start\" font-weight=\"600\" class=\"mono\" >03<\/text><text x=\"88\" y=\"178\" font-size=\"18\" fill=\"#245A6B\" text-anchor=\"start\" font-weight=\"600\" class=\"\" >volatile 参数 / filter<\/text><text x=\"48\" y=\"212\" font-size=\"14.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >含 SubPlan 时也会禁用（社区 2023 年修复漏检），避免重<\/text><text x=\"48\" y=\"236\" font-size=\"14.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >启前后结果不同<\/text><rect x=\"710\" y=\"142\" width=\"670\" height=\"114\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"710\" y=\"142\" width=\"7\" height=\"114\" rx=\"0\" fill=\"#BE653B\" stroke=\"none\" stroke-width=\"0\" /><text x=\"738\" y=\"178\" font-size=\"15\" fill=\"#BE653B\" text-anchor=\"start\" font-weight=\"600\" class=\"mono\" >04<\/text><text x=\"778\" y=\"178\" font-size=\"18\" fill=\"#245A6B\" text-anchor=\"start\" font-weight=\"600\" class=\"\" >任意 EXCLUDE 选项<\/text><text x=\"738\" y=\"212\" font-size=\"14.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >源码注释：可能出现非连续行集，干脆对新帧每行重新聚合<\/text><text x=\"738\" y=\"236\" font-size=\"13.5\" fill=\"#89938F\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >宁可重算，也不在语义上冒险<\/text><rect x=\"20\" y=\"270\" width=\"670\" height=\"114\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"20\" y=\"270\" width=\"7\" height=\"114\" rx=\"0\" fill=\"#BE653B\" stroke=\"none\" stroke-width=\"0\" /><text x=\"48\" y=\"306\" font-size=\"15\" fill=\"#BE653B\" text-anchor=\"start\" font-weight=\"600\" class=\"mono\" >05<\/text><text x=\"88\" y=\"306\" font-size=\"18\" fill=\"#245A6B\" text-anchor=\"start\" font-weight=\"600\" class=\"\" >MINVFUNC 返回 NULL<\/text><text x=\"48\" y=\"340\" font-size=\"14.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >不是普通状态值，是「本次撤销失败」信号，标记该聚合重启<\/text><text x=\"48\" y=\"364\" font-size=\"13.5\" fill=\"#89938F\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >宁可重算，也不在语义上冒险<\/text><rect x=\"710\" y=\"270\" width=\"670\" height=\"114\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"710\" y=\"270\" width=\"7\" height=\"114\" rx=\"0\" fill=\"#AE8A3E\" stroke=\"none\" stroke-width=\"0\" /><text x=\"738\" y=\"306\" font-size=\"15\" fill=\"#AE8A3E\" text-anchor=\"start\" font-weight=\"600\" class=\"mono\" >06<\/text><text x=\"778\" y=\"306\" font-size=\"18\" fill=\"#245A6B\" text-anchor=\"start\" font-weight=\"600\" class=\"\" >删除后无行保留 / 帧不重叠<\/text><text x=\"738\" y=\"340\" font-size=\"14.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >窗口函数机制直接重新聚合；反函数可假设移除后至少还剩一行<\/text><text x=\"738\" y=\"364\" font-size=\"13.5\" fill=\"#89938F\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >宁可重算，也不在语义上冒险<\/text><text x=\"20\" y=\"412\" font-size=\"12.5\" fill=\"#89938F\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >依据：nodeWindowAgg.c 注释 · CREATE AGGREGATE Notes · window.sql · 2023 年 SubPlan 修复公告<\/text><\/svg>","ctrl":null},{"eyebrow":"正确性 · 状态恢复契约","title":"反函数不是数学装饰","lede":"文档给了一个硬反例：给 float8 的 sum 配 float8mi，用户可见结果会从期望的 1 变成 0。","caption":"图 10　unsafe_sum(float8) 的官方反例；1.0e20 + 1.0 在 float8 精度下仍是 1.0e20。","bridge":"那遇到确实撤不掉的值怎么办？PostgreSQL 留了一个很克制的出口。","notes":"为什么这么怕「差一点」？官方文档给了一个非常干净的反例。假设给 float8 的 sum 随手配上 float8mi 当 MINVFUNC：先加入 1.0e20，再加入 1.0，在 float8 的精度下 1.0e20 加 1 还是 1.0e20；这时候把 1.0e20 减掉，得到的是 0，而期望结果是 1。文档里的 unsafe_sum 例子，第二行返回 0 而不是 1，就是这个原因。注意文档特意说明：这是浮点算术本身的精度限制，不是 PostgreSQL 的 bug。所以我要把这句话说重一点：数学上看起来有逆元，不代表计算机里的状态更新可逆。这也是为什么 pg_aggregate.dat 里 float4、float8 的 sum 和 avg 都没有登记 moving 字段。那遇到确实撤不掉的值，工程上怎么办？","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" id=\"fig10\"><rect x=\"20\" y=\"14\" width=\"620\" height=\"92\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"40\" y=\"48\" font-size=\"17\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"600\" class=\"\" >① 加入 1.0e20<\/text><rect x=\"40\" y=\"60\" width=\"570\" height=\"34\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"325\" y=\"84\" font-size=\"15\" fill=\"#245A6B\" text-anchor=\"middle\" font-weight=\"600\" class=\"mono\" >state = 1.0e20<\/text><rect x=\"20\" y=\"118\" width=\"620\" height=\"92\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"40\" y=\"152\" font-size=\"17\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"600\" class=\"\" >② 加入 1.0<\/text><rect x=\"40\" y=\"164\" width=\"570\" height=\"34\" rx=\"2\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1\" /><text x=\"325\" y=\"188\" font-size=\"15\" fill=\"#AE8A3E\" text-anchor=\"middle\" font-weight=\"600\" class=\"mono\" >state = 1.0e20（精度下未变化）<\/text><rect x=\"20\" y=\"222\" width=\"620\" height=\"92\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"40\" y=\"256\" font-size=\"17\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"600\" class=\"\" >③ 撤销 1.0e20<\/text><rect x=\"40\" y=\"268\" width=\"570\" height=\"34\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"325\" y=\"292\" font-size=\"15\" fill=\"#BE653B\" text-anchor=\"middle\" font-weight=\"600\" class=\"mono\" >state = 0　期望应为 1<\/text><rect x=\"660\" y=\"14\" width=\"720\" height=\"306\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"680\" y=\"42\" font-size=\"17\" fill=\"#245A6B\" text-anchor=\"start\" font-weight=\"600\" class=\"\" >官方文档 unsafe_sum(float8) 反例<\/text><line x1=\"680\" y1=\"56\" x2=\"1360\" y2=\"56\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"676\" y=\"68\" width=\"688\" height=\"246\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"694\" y=\"99.5\" font-size=\"13.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >CREATE AGGREGATE unsafe_sum (float8)<\/text><text x=\"694\" y=\"121.33333333333333\" font-size=\"13.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >( stype = float8, sfunc = float8pl,<\/text><text x=\"694\" y=\"143.16666666666666\" font-size=\"13.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >  mstype = float8, msfunc = float8pl,<\/text><text x=\"694\" y=\"165.0\" font-size=\"13.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >  minvfunc = float8mi );<\/text><text x=\"694\" y=\"186.83333333333331\" font-size=\"13.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" ><\/text><text x=\"694\" y=\"208.66666666666666\" font-size=\"13.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >SELECT unsafe_sum(x) OVER (<\/text><text x=\"694\" y=\"230.5\" font-size=\"13.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >  ORDER BY n ROWS BETWEEN CURRENT ROW<\/text><text x=\"694\" y=\"252.33333333333331\" font-size=\"13.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >  AND 1 FOLLOWING)<\/text><text x=\"694\" y=\"274.16666666666663\" font-size=\"13.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >FROM (VALUES (1, 1.0e20::float8),<\/text><text x=\"694\" y=\"296.0\" font-size=\"13.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >             (2, 1.0::float8)) AS v(n,x);<\/text><rect x=\"20\" y=\"334\" width=\"1360\" height=\"58\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\" /><text x=\"44\" y=\"370\" font-size=\"22\" fill=\"#BE653B\" text-anchor=\"start\" font-weight=\"600\" class=\"serif\" >数学上有逆元 ≠ 计算机里的状态更新可逆<\/text><text x=\"44\" y=\"412\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >文档原话：这是浮点算术本身的精度限制，不是 PostgreSQL 的限制；因此 float4 / float8 的 sum 与 avg 未登记 moving 字段<\/text><\/svg>","ctrl":null},{"eyebrow":"正确性 · 失败可退回","title":"MINVFUNC 返回 NULL 是求救信号","lede":"它表示「本次无法可靠撤销」，执行器随即标记该聚合重启，从当前帧头重新聚合；正确性优先于性能。","caption":"图 11　左：认输路径；右：window.sql 的 sum_int_randomrestart 验证的三件事。","bridge":"有了这套机制，收益到底有多大？先说清楚它是复杂度变化，不是固定加速比。","notes":"PostgreSQL 留了一个很克制的出口：MINVFUNC 可以返回 NULL。但千万别把它理解成「状态算出来是空」——文档说得很明确，这是「本次反函数无法撤销这个输入」的信号，执行器会把它当成失败，从当前帧起点重新聚合。对照着记：MSFUNC 不允许返回 NULL 作为新状态，MINVFUNC 的 NULL 反而是专门设计的求救信号。这个约定让「大部分情况能撤销、个别情况撤不掉」的聚合也能享受优化，比如遇到 NaN 就认输。回归测试 window.sql 里专门有个 sum_int_randomrestart，让 MINVFUNC 随机返回 NULL，验证三件事：失败确实触发重启、一个聚合重启不会连累别的聚合、重启后的结果跟从头聚合一致。一句话：正确性优先级高于性能，可以认输，不能撒谎。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" id=\"fig11\"><rect x=\"20\" y=\"60\" width=\"160\" height=\"84\" rx=\"2\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.3\" /><text x=\"100.0\" y=\"98.80799999999999\" font-size=\"15\" fill=\"#2F7A66\" text-anchor=\"middle\" font-weight=\"600\" class=\"\" >正常滑动<\/text><line x1=\"180\" y1=\"102\" x2=\"188\" y2=\"102\" stroke=\"#7BA6AF\" stroke-width=\"1.3\" /><polygon points=\"188,98 196,102 188,106\" fill=\"#7BA6AF\"/><rect x=\"196\" y=\"60\" width=\"160\" height=\"84\" rx=\"2\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.3\" /><text x=\"276.0\" y=\"98.80799999999999\" font-size=\"15\" fill=\"#AE8A3E\" text-anchor=\"middle\" font-weight=\"600\" class=\"\" >遇到撤不掉的值<\/text><line x1=\"356\" y1=\"102\" x2=\"364\" y2=\"102\" stroke=\"#7BA6AF\" stroke-width=\"1.3\" /><polygon points=\"364,98 372,102 364,106\" fill=\"#7BA6AF\"/><rect x=\"372\" y=\"60\" width=\"160\" height=\"84\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.3\" /><text x=\"452.0\" y=\"98.80799999999999\" font-size=\"13.0\" fill=\"#BE653B\" text-anchor=\"middle\" font-weight=\"600\" class=\"\" >MINVFUNC 返回 NULL<\/text><line x1=\"532\" y1=\"102\" x2=\"540\" y2=\"102\" stroke=\"#7BA6AF\" stroke-width=\"1.3\" /><polygon points=\"540,98 548,102 540,106\" fill=\"#7BA6AF\"/><rect x=\"548\" y=\"60\" width=\"160\" height=\"84\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.3\" /><text x=\"628.0\" y=\"98.80799999999999\" font-size=\"15\" fill=\"#BE653B\" text-anchor=\"middle\" font-weight=\"600\" class=\"\" >标记该聚合重启<\/text><line x1=\"708\" y1=\"102\" x2=\"716\" y2=\"102\" stroke=\"#7BA6AF\" stroke-width=\"1.3\" /><polygon points=\"716,98 724,102 716,106\" fill=\"#7BA6AF\"/><rect x=\"724\" y=\"60\" width=\"160\" height=\"84\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.3\" /><text x=\"804.0\" y=\"98.80799999999999\" font-size=\"15\" fill=\"#245A6B\" text-anchor=\"middle\" font-weight=\"600\" class=\"\" >从当前帧头重算<\/text><text x=\"20\" y=\"34\" font-size=\"16\" fill=\"#245A6B\" text-anchor=\"start\" font-weight=\"600\" class=\"\" >一次「认输」的完整路径<\/text><rect x=\"20\" y=\"168\" width=\"880\" height=\"96\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"40\" y=\"200\" font-size=\"16\" fill=\"#1B2B33\" text-anchor=\"start\" font-weight=\"600\" class=\"\" >MSFUNC 不允许返回 NULL 作为新状态值<\/text><text x=\"40\" y=\"232\" font-size=\"15\" fill=\"#BE653B\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >MINVFUNC 的 NULL 是「撤销失败，请重算」的信号，不是普通状态值<\/text><rect x=\"920\" y=\"14\" width=\"460\" height=\"250\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"940\" y=\"44\" font-size=\"17\" fill=\"#245A6B\" text-anchor=\"start\" font-weight=\"600\" class=\"\" >回归测试：window.sql<\/text><line x1=\"940\" y1=\"58\" x2=\"1360\" y2=\"58\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"940\" y=\"92\" font-size=\"14.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >sum_int_randomrestart 让 MINVFUNC<\/text><text x=\"940\" y=\"124\" font-size=\"14.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >随机返回 NULL，验证三件事：<\/text><text x=\"940\" y=\"156\" font-size=\"14.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >① 撤销失败确实触发重启<\/text><text x=\"940\" y=\"188\" font-size=\"14.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >② 一个聚合重启不连累其他聚合<\/text><text x=\"940\" y=\"220\" font-size=\"14.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >③ 重启结果仍与从头聚合一致<\/text><rect x=\"920\" y=\"278\" width=\"460\" height=\"54\" rx=\"2\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\" /><text x=\"1150\" y=\"312\" font-size=\"17\" fill=\"#2F7A66\" text-anchor=\"middle\" font-weight=\"600\" class=\"\" >正确性优先级 &gt; 性能<\/text><rect x=\"20\" y=\"280\" width=\"880\" height=\"52\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\" /><text x=\"460\" y=\"314\" font-size=\"16\" fill=\"#245A6B\" text-anchor=\"middle\" font-weight=\"600\" class=\"\" >正确性优先级高于性能：可以认输，不能为了快返回错误状态<\/text><rect x=\"20\" y=\"342\" width=\"1360\" height=\"60\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\" /><text x=\"44\" y=\"376\" font-size=\"17\" fill=\"#BE653B\" text-anchor=\"start\" font-weight=\"600\" class=\"serif\" >这个约定让「大多数情况可撤销、个别情况撤不掉」的聚合仍能享受优化，例如遇到 NaN 就认输<\/text><text x=\"44\" y=\"422\" font-size=\"12.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >依据：xaggr.sgml / CREATE AGGREGATE Notes · src/test/regress/sql/window.sql<\/text><\/svg>","ctrl":null},{"eyebrow":"效果 · 复杂度收益","title":"从 O(N × W) 到 O(N)","lede":"设分区 N 行、平均帧宽 W：这是执行路径推演出的复杂度变化，不是 PostgreSQL 承诺的性能数字。","caption":"图 12　示意 N = 8、W = 4 的推演计数；真实耗时还受排序、tuplestore、状态大小等因素影响。","bridge":"那到底哪些内置聚合已经享受到了？直接查目录最可靠。","notes":"现在可以谈收益了，但得把话说准。设分区里有 N 行、平均帧宽 W：没有反函数，帧头每动一次重算约 W 行，粗略是 O(N × W)；有反函数且大多数撤销成功，每行最多删一行、加一行，粗略是 O(N)。图里这两组柱子是按这个执行路径推演的示意计数，N=8、W=4，不是实测数据。PostgreSQL 也从来没有承诺一个固定加速比，因为真实耗时还压着一堆因素：分区排序、tuplestore 访问、表达式计算、聚合状态大小、内存上下文、数据类型函数成本。如果 MINVFUNC 经常返回 NULL，就退化成多次重算，收益自然下降。所以这是复杂度层面的变化，不是「打开就快十倍」的开关。那哪些聚合已经享受到了？查目录最可靠。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" id=\"fig12\"><rect x=\"20\" y=\"14\" width=\"680\" height=\"256\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"40\" y=\"42\" font-size=\"16.5\" fill=\"#BE653B\" text-anchor=\"start\" font-weight=\"600\" class=\"\" >从头重算 · 帧头一移动就重扫整帧<\/text><line x1=\"40\" y1=\"56\" x2=\"680\" y2=\"56\" stroke=\"#D9D5CB\" stroke- "别靠印象猜，pg_aggregate.dat 和 pg_aggregate 是权威依据。已经登记 aggmtransfn / aggminvtransfn 的，包括 count（int8inc 对 int8dec）、整数和 numeric 的 sum 与 avg、方差标准差这类统计聚合、interval、money，还有 bool_and、bool_or、every——它们的 moving 状态是 BoolAggState，反函数是 bool_accum_inv。没有登记的也很说明问题：float4、float8 的 sum 和 avg、整个 min / max 系列，还有有序集聚合。右边这条 SQL 可以直接在你自己的实例上跑，列出所有带反函数的聚合及其状态类型。我特别喜欢这个动作：把「我以为支持」变成「我查过目录」。不过，就算查到支持，也别把它当成所有滑动窗口问题的通用答案。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" id=\"fig13\"><rect x=\"20\" y=\"14\" width=\"640\" height=\"190\" rx=\"2\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\" /><text x=\"40\" y=\"44\" font-size=\"17\" fill=\"#2F7A66\" text-anchor=\"start\" font-weight=\"600\" class=\"\" >已登记 moving 支持（pg_aggregate.dat）<\/text><rect x=\"40\" y=\"60\" width=\"7\" height=\"7\" rx=\"0\" fill=\"#2F7A66\" stroke=\"none\" stroke-width=\"0\" /><text x=\"56\" y=\"68\" font-size=\"14\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >count：int8inc / int8dec，状态 int8<\/text><rect x=\"40\" y=\"87\" width=\"7\" height=\"7\" rx=\"0\" fill=\"#2F7A66\" stroke=\"none\" stroke-width=\"0\" /><text x=\"56\" y=\"95\" font-size=\"14\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >sum / avg：整数、numeric、interval、money<\/text><rect x=\"40\" y=\"114\" width=\"7\" height=\"7\" rx=\"0\" fill=\"#2F7A66\" stroke=\"none\" stroke-width=\"0\" /><text x=\"56\" y=\"122\" font-size=\"14\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >方差、标准差、回归统计等数值聚合<\/text><rect x=\"40\" y=\"141\" width=\"7\" height=\"7\" rx=\"0\" fill=\"#2F7A66\" stroke=\"none\" stroke-width=\"0\" /><text x=\"56\" y=\"149\" font-size=\"14\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >bool_and / bool_or / every：bool_accum_inv<\/text><rect x=\"40\" y=\"168\" width=\"7\" height=\"7\" rx=\"0\" fill=\"#2F7A66\" stroke=\"none\" stroke-width=\"0\" /><text x=\"56\" y=\"176\" font-size=\"14\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >moving 状态：BoolAggState(aggcount, aggtrue)<\/text><rect x=\"20\" y=\"216\" width=\"640\" height=\"198\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\" /><text x=\"40\" y=\"246\" font-size=\"17\" fill=\"#BE653B\" text-anchor=\"start\" font-weight=\"600\" class=\"\" >未登记 moving 字段<\/text><rect x=\"40\" y=\"262\" width=\"7\" height=\"7\" rx=\"0\" fill=\"#BE653B\" stroke=\"none\" stroke-width=\"0\" /><text x=\"56\" y=\"270\" font-size=\"14\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >sum(float4) / sum(float8)：浮点精度不可逆<\/text><rect x=\"40\" y=\"289\" width=\"7\" height=\"7\" rx=\"0\" fill=\"#BE653B\" stroke=\"none\" stroke-width=\"0\" /><text x=\"56\" y=\"297\" font-size=\"14\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >avg(float4) / avg(float8)：同上<\/text><rect x=\"40\" y=\"316\" width=\"7\" height=\"7\" rx=\"0\" fill=\"#BE653B\" stroke=\"none\" stroke-width=\"0\" /><text x=\"56\" y=\"324\" font-size=\"14\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >min / max 全系列：旧值离开后无法恢复次优值<\/text><rect x=\"40\" y=\"343\" width=\"7\" height=\"7\" rx=\"0\" fill=\"#BE653B\" stroke=\"none\" stroke-width=\"0\" /><text x=\"56\" y=\"351\" font-size=\"14\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >有序集聚合（percentile_cont 等）<\/text><rect x=\"40\" y=\"370\" width=\"7\" height=\"7\" rx=\"0\" fill=\"#BE653B\" stroke=\"none\" stroke-width=\"0\" /><text x=\"56\" y=\"378\" font-size=\"14\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >「平均值」本身不是可撤销状态<\/text><rect x=\"680\" y=\"14\" width=\"700\" height=\"400\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"700\" y=\"44\" font-size=\"17\" fill=\"#245A6B\" text-anchor=\"start\" font-weight=\"600\" class=\"\" >别靠猜：一条 SQL 查当前实例<\/text><line x1=\"700\" y1=\"58\" x2=\"1360\" y2=\"58\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><rect x=\"696\" y=\"70\" width=\"668\" height=\"240\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"714\" y=\"101.5\" font-size=\"13.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >SELECT p.proname AS agg_name,<\/text><text x=\"714\" y=\"125.125\" font-size=\"13.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >       a.aggmtransfn::regproc AS msfunc,<\/text><text x=\"714\" y=\"148.75\" font-size=\"13.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >       a.aggminvtransfn::regproc AS minvfunc,<\/text><text x=\"714\" y=\"172.375\" font-size=\"13.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >       a.aggmtranstype::regtype AS mstype<\/text><text x=\"714\" y=\"196.0\" font-size=\"13.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >FROM pg_aggregate a<\/text><text x=\"714\" y=\"219.625\" font-size=\"13.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >JOIN pg_proc p ON p.oid = a.aggfnoid<\/text><text x=\"714\" y=\"243.25\" font-size=\"13.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >WHERE a.aggminvtransfn &lt;&gt; 0<\/text><text x=\"714\" y=\"266.875\" font-size=\"13.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\" >ORDER BY 1;<\/text><rect x=\"700\" y=\"326\" width=\"660\" height=\"74\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\" /><text x=\"720\" y=\"356\" font-size=\"15.5\" fill=\"#245A6B\" text-anchor=\"start\" font-weight=\"600\" class=\"\" >权威依据：pg_aggregate.dat（内置定义）<\/text><text x=\"720\" y=\"384\" font-size=\"14\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\" class=\"\" >与 pg_aggregate 系统目录（运行时可查）<\/text><\/svg>","ctrl":null},{"eyebrow":"横向对比 · 四个抽象层","title":"都在省重复计算，边界却不同","lede":"执行器内的函数契约、重算路径、通用滑动窗口数据结构、无界乱序数据的时间语义——问题边界完全不同。","caption":"图 14　四条路径在目标、状态要求、复杂度与正确性风险上的对照。","bridge":"讲到这里都是原理和源码。接下来怎么亲手验证 moving mode 真的被调用了？","notes":"这一页做横向对比，重点不是谁更先进，而是四件事站在四个不同的抽象层。PostgreSQL 的 inverse transition 是执行器内的聚合函数契约；从头重算是同一执行器里的保守路径；论文里讨论的通用滑动窗口结构，讲的是队列、双栈、平衡树、摘要，前提往往是结合律或幺元；Dataflow 模型处理的是无界、乱序数据里的时间语义，要管事件时间、watermark、trigger 和 allowed lateness。它们都在减少重复计算，但问题边界完全不同。复杂度那一栏也是这样：O(N)、O(N × 帧长)、摊还 O(1) 或 O(log W)，量的是不同东西。顺便说一句，这篇文章里那两篇没能稳定核验全文的论文，我只借用了题名指向的思路，没有引用任何未经核实的实验数字——这点在图上也要守住。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" id=\"fig14\"><rect x=\"20\" y=\"14\" width=\"140\" height=\"50\" rx=\"2\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1\" /><text x=\"90.0\" y=\"45\" font-size=\"14.5\" fill=\"#FFFFFF\" text-anchor=\"middle\" font-weight=\"600\" class=\"\" >维度<\/text><rect x=\"160\" y=\"14\" width=\"305\" height=\"50\" rx=\"2\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1\" /><text x=\"312.5\" y=\"45\" font-size=\"14.5\" fill=\"#FFFFFF\" text-anchor=\"middle\" font-weight=\"600\" class=\"\" >Inverse Transition<\/text><rect x=\"465\" y=\"14\" width=\"305\" height=\"50\" rx=\"2\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1\" /><text x=\"617.5\" y=\"45\" font-size=\"14.5\" fill=\"#FFFFFF\" text-anchor=\"middle\" font-weight=\"600\" class=\"\" >从头重算窗口帧<\/text><rect x=\"770\" y=\"14\" width=\"305\" height=\"50\" rx=\"2\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1\" /><text x=\"922.5\" y=\"45\" font-size=\"14.5\" fill=\"#FFFFFF\" text-anchor=\"middle\" font-weight=\"600\" class=\"\" >通用滑动窗口结构<\/text><rect x=\"1075\" y=\"14\" width=\"305\" height=\"50\" rx=\"2\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1\" /><text x=\"1227.5\" y=\"45\" font-size=\"14.5\" fill=\"#FFFFFF\" text-anchor=\"middle\" font-weight=\"600\" class=\"\" >流式 Dataflow 窗口<\/text><rect x=\"20\" y=\"64\" width=\"140\" height=\"76\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x
