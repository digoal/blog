const jesc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                          .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const T=(x,y,s,size=16,fill=INK,anchor='start',weight=400,cls='s',extra='')=>
  '<text x="'+x+'" y="'+y+'" class="sv '+cls+'" text-anchor="'+anchor+
  '" font-size="'+size+'" fill="'+fill+'" font-weight="'+weight+'" '+extra+'>'+jesc(s)+'</text>';
const R=(x,y,w,h,fill=WHITE,stroke=LINE,sw=1,r=3,extra='')=>
  '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+r+
  '" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" '+extra+'/>';
const L=(x1,y1,x2,y2,color=LINE,sw=1.4,dash=null)=>
  '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+color+
  '" stroke-width="'+sw+'"'+(dash?' stroke-dasharray="'+dash+'"':'')+'/>';
const CIRC=(x,y,rr,fill=WHITE,stroke=PRIMARY,sw=1.5,extra='')=>
  '<circle cx="'+x+'" cy="'+y+'" r="'+rr+'" fill="'+fill+'" stroke="'+stroke+
  '" stroke-width="'+sw+'" '+extra+'/>';

function aInputs(){
  const A = +($('#aActual') ? $('#aActual').value : 10000);
  const mode = $('#aMode') ? $('#aMode').value : 'learn';
  const rf = +($('#aRf') ? $('#aRf').value : 1);
  const dlr = +($('#aLr') ? $('#aLr').value : 0.5);
  return {A, mode, rf, dlr};
}
function aSeries(){
  const {A, mode, rf, dlr} = aInputs();
  /* 示意推演：按源码线性平滑 target += lr*(target-y) 计算；
     lr = 学习率 × rfactor。0.1 为源码 learning_rate=1e-1，0.5 为加速演示档。 */
  const lr = dlr * rf;
  const out = [];
  let plog = 0;                          // 第 1 轮无样本 → 回退原生估计 1 行 → ln(1)=0
  for(let t=1;t<=A_ROUNDS;t++){
    let actual = A;
    if(mode==='drift' && t>=5) actual = A*10;      // 数据分布突变
    if(mode==='disabled'){ plog = 0; }
    else if(mode==='frozen' && t>=5){ /* 冻结：不再写入学习结果 */ }
    else if(t>=2){
      const prevActual = (mode==='drift' && t-1>=5) ? A*10 : A;
      plog = plog + lr*(Math.log(prevActual) - plog);
    }
    const pred = Math.exp(plog);
    const ratio = pred/actual;
    const plan = (ratio>=0.1 && ratio<=10) ? 'Hash Join' : 'Nested Loop';
    out.push({t, actual, pred, ratio, plan,
              learned: mode!=='disabled' && !(mode==='frozen' && t>=5)});
  }
  return out;
}
function fmt(n){
  if(n>=1000000) return (n/1000000).toFixed(1)+'M';
  if(n>=1000) return (n/1000).toFixed(n>=10000?0:1)+'k';
  return n>=10 ? Math.round(n).toString() : n.toFixed(1);
}
function aSeriesSVG(series){
  const x0=90, y0=44, plotW=790, plotH=310;
  const ymax=6;                                   // log10(rows) 0..6
  const px = t => x0 + (t-1)*(plotW/(A_ROUNDS-1));
  const py = v => y0 + plotH - (Math.log10(Math.max(1,v))/ymax)*plotH;
  let g=[];
  // 网格
  for(let v=0;v<=ymax;v++){
    const yy=y0+plotH-(v/ymax)*plotH;
    g.push(L(x0,yy,x0+plotW,yy,LINE,1));
    g.push(T(x0-12,yy+4,'10^'+v,11.5,MUTED,'end',400,'mono'));
  }
  for(let t=1;t<=A_ROUNDS;t++){
    g.push(L(px(t),y0,px(t),y0+plotH,LINE,0.7,'3 5'));
    g.push(T(px(t),y0+plotH+20,'R'+t,11.5,MUTED,'middle',400,'mono'));
  }
  g.push(L(x0,y0,x0,y0+plotH,PRIMARY,1.6));
  g.push(L(x0,y0+plotH,x0+plotW,y0+plotH,PRIMARY,1.6));
  g.push(T(x0,y0-14,'log10 ( rows ) · 示意刻度',12,INK2,'start',600));
  // 原生基线（恒定 1 行）
  g.push(L(x0,py(1),x0+plotW,py(1),ACCENT,2,'7 5'));
  g.push(T(x0+plotW-4,py(1)-9,'原生估计 1 行',11.5,ACCENT,'end',600));
  // actual 阶梯线（正交，不斜穿）
  let prevY=py(series[0].actual);
  let dA='M '+px(1)+' '+prevY;
  for(let i=1;i<series.length;i++){
    const yy=py(series[i].actual);
    dA+=' L '+px(series[i].t)+' '+prevY+' L '+px(series[i].t)+' '+yy;
    prevY=yy;
  }
  g.push('<path d="'+dA+'" fill="none" stroke="'+PRIMARY+'" stroke-width="2.6"/>');
  g.push(T(x0+plotW-4,py(series[series.length-1].actual)-10,'实际行数 actual',11.5,PRIMARY,'end',600));
  // AQO 预测阶梯线（正交）
  let prevP=py(series[0].pred);
  let dP='M '+px(1)+' '+prevP;
  for(let i=1;i<series.length;i++){
    const yy=py(series[i].pred);
    dP+=' L '+px(series[i].t)+' '+prevP+' L '+px(series[i].t)+' '+yy;
    prevP=yy;
  }
  g.push('<path d="'+dP+'" fill="none" stroke="'+GREEN+'" stroke-width="2.6"/>');
  // 当前轮竖线 + 圆点
  const cv=series[aRound-1];
  g.push(L(px(aRound),y0,px(aRound),y0+plotH,GOLD,1.6,'4 4'));
  g.push(CIRC(px(aRound),py(cv.pred),6,GREEN,WHITE,1.8));
  g.push(CIRC(px(aRound),py(cv.actual),6,PRIMARY,WHITE,1.8));
  return g.join('');
}
function aCardSVG(series){
  const x=900, w=500;
  const cv=series[aRound-1]; const {mode,rf}=aInputs();
  let g=[];
  g.push(R(x,0,w,430,PAPER2,LINE,1,3));
  g.push(T(x+20,32,'当前轮状态',19,PRIMARY,'start',700,'serif'));
  g.push(T(x+w-20,32,'R'+cv.t+' / '+A_ROUNDS,13,ACCENT,'end',600,'mono'));
  g.push(L(x+20,46,x+w-20,46,LINE,1));
  const rows=[
    ['轮次','第 '+cv.t+' 轮执行'],
    ['模式 / rfactor',mode+' / '+rf.toFixed(1)],
    ['AQO 预测 rows',fmt(cv.pred)+' 行'],
    ['实际 rows',fmt(cv.actual)+' 行'],
    ['估算误差',cv.ratio>=1 ? (cv.ratio>=1000?'高估 ≥1000 ×':'高估 '+cv.ratio.toFixed(1)+' ×')
                            : '低估 '+(1/cv.ratio).toFixed(0)+' ×'],
    ['计划选择（示意）',cv.plan],
    ['知识库样本',cv.learned ? '已采集 · 可反馈' : '未采集 / 已冻结'],
  ];
  rows.forEach((r,i)=>{
    const yy=62+i*38;
    g.push(R(x+16,yy,w-32,32,WHITE,LINE,0.8,2));
    g.push(T(x+28,yy+21,r[0],13,INK2,'start',600));
    g.push(T(x+w-28,yy+21,r[1],13,(i===5 && cv.plan==='Hash Join')?GREEN:ACCENT,'end',600));
  });
  const vy=62+7*38+8;
  g.push(R(x+16,vy,w-32,70,cv.plan==='Hash Join'?GREEN_L:ACC_L,
           cv.plan==='Hash Join'?GREEN:ACCENT,1,2));
  const verdict = cv.plan==='Hash Join'
      ? ['预测进入同一数量级，','代价模型有机会改选更合适的 join']
      : ['低估被放大，','内表访问次数被 rows 误差拖垮'];
  g.push(T(x+28,vy+22,'结论',12.5,cv.plan==='Hash Join'?GREEN:ACCENT,'start',700));
  g.push(T(x+28,vy+43,verdict[0],12.5,INK2,'start',400));
  g.push(T(x+28,vy+61,verdict[1],12.5,INK2,'start',400));
  return g.join('');
}
function animPaint(){
  const series=aSeries();
  const host=$('#animHost');
  if(!host) return;
  host.innerHTML = aSeriesSVG(series)+aCardSVG(series);
  const cv=series[aRound-1];
  const out=$('#aOut');
  const err = cv.ratio>=1 ? '高估 '+cv.ratio.toFixed(1)+'×' : '低估 '+(1/cv.ratio).toFixed(0)+'×';
  if(out) out.innerHTML='<b>第 '+cv.t+' 轮</b> · 预测 '+fmt(cv.pred)+' / 实际 '+fmt(cv.actual)
    +' 行 · '+err+' · '+cv.plan+'（示意）';
  const st=$('#aStepLbl'); if(st) st.textContent='第 '+cv.t+' / '+A_ROUNDS+' 轮';
}
function animPlay(){
  if(aPlaying){ animPause(); return; }
  aPlaying=true; const b=$('#aPlay'); if(b){b.textContent='❚❚ 暂停'; b.classList.add('play');}
  if(aRound>=A_ROUNDS) aRound=1;
  aTimer=setInterval(()=>{
    aRound++; animPaint();
    if(aRound>=A_ROUNDS) animPause();
  },850);
}
function animPause(){
  aPlaying=false; clearInterval(aTimer); aTimer=null;
  const b=$('#aPlay'); if(b){b.textContent='▶ 播放'; b.classList.remove('play');}
}
function animTick(){ if(aRound<A_ROUNDS){ aRound++; animPaint(); } }
function animReset(){ animPause(); aRound=1; animPaint(); }
function animInputsChanged(){ animPause(); aRound=1; animPaint(); }

function init(){
  render(); fit();
  let saved=0; try{ saved=parseInt(localStorage.getItem('aqo-slide')||'0',10)||0; }catch(e){}
  go(saved,true);
  $('#btnPrev').onclick=prev; $('#btnNext').onclick=next;
  $('#btnToc').onclick=()=>toggleView('toc');
  $('#btnNotes').onclick=()=>toggleView('here');
  $('#btnAll').onclick=()=>toggleView('all');
  $('#btnAuto').onclick=toggleAuto;
  $('#btnFs').onclick=fs;
  $('#btnHelp').onclick=()=>toggleView('help');
  $('#dClose').onclick=closeDrawer;
  $$('.dtabs button').forEach(b=>b.onclick=()=>openDrawer(b.getAttribute('data-view')));
  if(window.ResizeObserver) new ResizeObserver(fit).observe($('#viewport'));
  ['aActual','aMode','aRf','aLr'].forEach(id=>{
    const el=$('#'+id); if(el) el.addEventListener('change',animInputsChanged);
  });
  const bind=(id,fn)=>{ const el=$(id); if(el) el.onclick=fn; };
  bind('#aPlay',animPlay); bind('#aTick',animTick); bind('#aReset',animReset);
  animPaint();
}
document.addEventListener('DOMContentLoaded', init);
</script>
