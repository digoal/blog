<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数据库筑基课 · 优化器之 AQO｜让优化器从自己的错误里学习</title>
<!-- 单文件交付：所有原理图均为现场绘制的内联 SVG，零外部图片 / 字体 / 脚本依赖。 -->
<!-- 设计母题：地层剖面 / 工程蓝图。内容按「症状 → 误差来源 → 闭环改造 → 源码落地 → 治理边界」推演。 -->
<style>
:root{
  --bg:#F7F6F2; --ink:#1B2B33; --ink2:#46585F; --muted:#89938F; --line:#D9D5CB;
  --primary:#245A6B; --prim-l:#E5EFF0; --accent:#BE653B; --acc-l:#F7E9DE;
  --green:#2F7A66; --green-l:#E4F0EA; --gold:#AE8A3E; --paper2:#F1EFE9;
  --drawer-w:440px;
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#E9E7E1}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;
  transition:background .3s}
body.immersive{background:#1B2B33}
#viewport{position:absolute;inset:0 0 58px 0;overflow:hidden;
  transition:right .38s cubic-bezier(.2,.7,.2,1)}
body.dopen #viewport{right:var(--drawer-w)}
#stage{position:absolute;width:1600px;height:900px;background:var(--bg);
  transform-origin:top left;box-shadow:0 18px 60px rgba(27,43,51,.13)}
.slide{position:absolute;inset:0;display:none}
.slide.on{display:block;animation:fadein .42s cubic-bezier(.2,.7,.2,1)}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{position:absolute;left:64px;top:44px;font-size:13px;letter-spacing:3.4px;
  color:var(--primary);font-weight:600}
.eyebrow .num{font-family:var(--mono);letter-spacing:1px;color:var(--accent);margin-right:14px}
h1.title{position:absolute;left:64px;top:70px;margin:0;font-family:var(--serif);
  font-size:44px;line-height:1.25;font-weight:700;letter-spacing:1.2px;color:var(--ink);width:1472px}
.lede{position:absolute;left:64px;top:139px;width:1440px;font-size:19px;color:var(--ink2);
  line-height:1.5;letter-spacing:.3px}
.rule{position:absolute;left:64px;top:181px;width:1472px;height:1px;background:var(--line)}
.figwrap{position:absolute;left:100px;top:198px;width:1400px;height:430px}
svg.figure{display:block;overflow:visible}
svg.figure text{font-family:var(--sans)}
svg.figure text.serif{font-family:var(--serif)}
svg.figure text.mono{font-family:var(--mono)}
.caption{position:absolute;left:100px;top:638px;width:1400px;font-size:13px;
  color:var(--muted);letter-spacing:.4px;line-height:1.6}
.bridge{position:absolute;left:64px;top:706px;width:1472px;font-size:20px;
  color:var(--accent);line-height:1.55;letter-spacing:.4px;padding-left:18px;
  border-left:3px solid var(--accent);font-family:var(--serif)}
.bridge .bk{font-family:var(--sans);font-size:13px;color:var(--muted);
  letter-spacing:2px;display:block;margin-bottom:2px}
.footer{position:absolute;left:64px;top:846px;width:1472px;height:1px;background:var(--line)}
.footer .fl{position:absolute;left:0;top:14px;font-size:12.5px;color:var(--muted);letter-spacing:2px}
.footer .fr{position:absolute;right:0;top:12px;font-family:var(--mono);font-size:14px;color:var(--ink2)}
.footer .fbar{position:absolute;left:0;right:0;top:-1px;height:2px;background:transparent}
.footer .fbar i{display:block;height:2px;background:var(--primary);width:0;transition:width .4s ease}

/* 动画页控件：独立条带，绝不覆盖图 */
.ctrls{position:absolute;left:100px;top:636px;width:1400px;height:48px;display:flex;
  align-items:center;gap:10px}
.ctrls label{font-size:13px;color:var(--ink2);white-space:nowrap}
.ctrls select,.ctrls input{font-family:var(--sans);font-size:13px;color:var(--ink);
  background:#fff;border:1px solid var(--line);border-radius:3px;padding:5px 7px;outline:none}
.ctrls .btn{min-height:30px;padding:5px 13px;border:1px solid var(--primary);border-radius:3px;
  background:#fff;color:var(--primary);font-size:13px;cursor:pointer;font-family:var(--sans);
  white-space:nowrap}
.ctrls .btn.play{background:var(--primary);color:#fff}
.ctrls .btn:hover{filter:brightness(.94)}
.ctrls .out{font-size:13px;color:var(--ink2);margin-left:auto;min-width:0;flex:1;
  max-width:520px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrls .out b{color:var(--accent);font-weight:600}

/* 底部外壳：全屏后依然显示按键 */
.chrome{position:fixed;left:0;right:0;bottom:0;height:58px;background:#FCFBF8;
  border-top:1px solid var(--line);display:flex;align-items:center;gap:7px;
  padding:0 16px;z-index:60;font-size:13px;color:var(--ink2)}
body.immersive .chrome{background:rgba(252,251,248,.96);border-top-color:var(--primary)}
.chrome .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.chrome button{font-family:var(--sans);font-size:13px;color:var(--ink2);background:transparent;
  border:1px solid transparent;border-radius:4px;padding:7px 10px;cursor:pointer;white-space:nowrap}
.chrome button:hover{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome button.act{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome .pg{font-family:var(--mono);font-size:14px;color:var(--ink);min-width:78px;text-align:center}
.chrome .track{flex:1;height:3px;background:var(--line);border-radius:3px;margin:0 10px;position:relative;min-width:40px}
.chrome .track i{position:absolute;left:0;top:0;height:3px;background:var(--primary);border-radius:3px;transition:width .35s}
.chrome .hint{font-size:12px;color:var(--muted);white-space:nowrap}

/* 右侧讲稿窗：页内开窗，非弹窗 */
#drawer{position:fixed;right:0;top:0;bottom:58px;width:var(--drawer-w);z-index:50;
  background:var(--bg);border-left:1px solid var(--line);
  transform:translateX(102%);transition:transform .38s cubic-bezier(.2,.7,.2,1);
  display:flex;flex-direction:column;box-shadow:-14px 0 44px rgba(27,43,51,.10)}
body.dopen #drawer{transform:none}
.dhead{flex:none;padding:20px 22px 13px;border-bottom:1px solid var(--line);background:var(--bg)}
.dtop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.dhead h2{margin:0;font-family:var(--serif);font-size:22px;color:var(--ink);line-height:1.3}
.dhead .psub{font-size:12.5px;color:var(--muted);margin-top:5px;letter-spacing:.6px}
.dclose{flex:none;background:#fff;border:1px solid var(--line);border-radius:4px;
  padding:5px 10px;font-size:12.5px;cursor:pointer;color:var(--ink2)}
.dclose:hover{border-color:var(--primary);color:var(--primary)}
.dtabs{display:flex;gap:6px;margin-top:14px}
.dtabs button{flex:1;font-family:var(--sans);font-size:12.5px;color:var(--ink2);background:#fff;
  border:1px solid var(--line);border-radius:4px;padding:7px 4px;cursor:pointer;white-space:nowrap}
.dtabs button:hover{border-color:var(--primary);color:var(--primary)}
.dtabs button.act{background:var(--primary);color:#fff;border-color:var(--primary)}
#dbody{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 22px 34px}
#dbody::-webkit-scrollbar{width:8px}
#dbody::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.dsec{border-top:1px solid var(--line);padding:18px 0 20px;scroll-margin-top:8px}
.dsec:first-child{border-top:none}
.dsec.cur{background:var(--prim-l);margin:0 -22px;padding-left:19px;padding-right:22px;
  border-left:3px solid var(--primary)}
.dsec .sn{font-family:var(--mono);font-size:11.5px;color:var(--accent);letter-spacing:1.2px}
.dsec h3{margin:7px 0 10px;font-family:var(--serif);font-size:19px;color:var(--primary);line-height:1.45}
.dsec p{margin:0;font-size:15px;line-height:1.95;color:var(--ink2);letter-spacing:.3px}
.dsec .br{margin-top:12px;font-family:var(--serif);font-size:14.5px;color:var(--accent);line-height:1.7}
.dsec .br b{font-family:var(--sans);font-size:12px;color:var(--muted);font-weight:400;letter-spacing:2px}
.tocgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-top:16px}
.tocitem{display:block;border:1px solid var(--line);background:#fff;border-radius:4px;
  padding:10px 11px;cursor:pointer;text-decoration:none;color:var(--ink)}
.tocitem:hover{border-color:var(--primary);background:var(--prim-l)}
.tocitem.cur{border-color:var(--primary);background:var(--prim-l);box-shadow:inset 3px 0 0 var(--primary)}
.tocitem .tn{font-family:var(--mono);font-size:11.5px;color:var(--accent)}
.tocitem .tt{font-family:var(--serif);font-size:14px;line-height:1.4;display:block;margin-top:4px}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;font-size:14px;line-height:1.7;
  padding-top:16px;color:var(--ink2)}
.keys kbd{font-family:var(--mono);background:#fff;border:1px solid var(--line);
  border-bottom-width:2px;border-radius:4px;padding:2px 6px;color:var(--primary);margin-right:7px}
.toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);background:var(--ink);
  color:#fff;font-size:13px;padding:9px 16px;border-radius:4px;opacity:0;transition:.3s;
  z-index:80;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
@media print{.chrome,#drawer,.toast{display:none!important}#viewport{position:static;right:0!important}
  #stage{position:static;transform:none!important;box-shadow:none}
  .slide{display:block!important;page-break-after:always;position:relative;height:900px}}
</style>
</head>
<body>
<div id="viewport"><div id="stage"><div id="slides"></div></div></div>

<aside id="drawer">
  <div class="dhead">
    <div class="dtop">
      <div><h2>本页讲稿</h2><div class="psub" id="dsub">只看当前这一页 · 按 N 收起</div></div>
      <button class="dclose" id="dClose">关闭 ✕</button>
    </div>
    <div class="dtabs">
      <button data-view="here">本页 N</button>
      <button data-view="all">全文 T</button>
      <button data-view="toc">目录 G</button>
      <button data-view="help">按键 ?</button>
    </div>
  </div>
  <div id="dbody"></div>
</aside>

<div class="chrome">
  <button id="btnPrev">← 上一页</button>
  <button id="btnNext">下一页 →</button>
  <span class="pg">01 / 25</span>
  <div class="track" id="track"><i></i></div>
  <div class="sep"></div>
  <button id="btnToc">目录 G</button>
  <button id="btnNotes">本页讲稿 N</button>
  <button id="btnAll">全文讲稿 T</button>
  <button id="btnAuto">▶ 自动播放 P</button>
  <button id="btnFs">全屏 F</button>
  <button id="btnHelp">? 快捷键</button>
</div>
<div class="toast" id="toast"></div>
<script>
const D = [{"eyebrow":"开篇 · 命题","title":"把「估不准」变成可学习的问题","lede":"CBO 用行数驱动代价；最常错的恰恰是行数。AQO 不给优化器换脑子，只给它补一条来自执行的反馈线。","caption":"图 1 · 全篇总览：五层查询流水线中，AQO 只挂在「基数估算」；绿色直角回路是它唯一新增的东西。","bridge":"要看懂这条回路为什么值得做，得先从一个把系统拖垮的具体症状说起。","notes":"先说这一场到底讲什么。我们讲 AQO，adaptive query optimization，自适应查询优化。名字听起来很大，像是要把优化器重写一遍，其实不是。你先看这张剖面图：一条 SQL 从解析，到生成候选路径，到估算行数，到算代价，到选计划，最后交给执行器，一共五层，越往下颜色越深，表示越靠近真正干活的地方。PostgreSQL 的优化器几十年来一直这么走，很稳。问题出在中间那一层——估算行数。它给出的 rows，是后面所有代价计算的输入；这个数一旦错，后面全跟着错。AQO 做的事非常克制：它不碰 parser，不碰 join order 搜索，不碰 cost model，也不碰执行器，它只在基数估算这里挂了几个 hook，然后从执行器那头拉了一条线回来，把这次真实跑出来多少行，写回一个模型，供下一次同类查询规划时使用。所以这一整场，我们其实只研究一条反馈线：它凭什么能成立、源码里怎么落地、以及什么时候它会反过来害你。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40.0\" y=\"26.0\" width=\"880.0\" height=\"56.0\" rx=\"2\" fill=\"#EBF1EE\" stroke=\"#EBF1EE\" stroke-width=\"1.0\" /><text x=\"58.0\" y=\"61.0\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#1B2B33\" font-weight=\"700\" >SQL 解析</text><text x=\"300.0\" y=\"60.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"400\" >parse / rewrite，得到 Query 与 queryId</text><text x=\"902.0\" y=\"60.0\" class=\"sv mono\" text-anchor=\"end\" font-size=\"12.0\" fill=\"#1B2B33\" font-weight=\"600\" >L1</text><rect x=\"40.0\" y=\"92.0\" width=\"880.0\" height=\"56.0\" rx=\"2\" fill=\"#CFE0DC\" stroke=\"#CFE0DC\" stroke-width=\"1.0\" /><text x=\"58.0\" y=\"127.0\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#1B2B33\" font-weight=\"700\" >候选路径</text><text x=\"300.0\" y=\"126.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"400\" >RelOptInfo、Path、join order 搜索</text><text x=\"902.0\" y=\"126.0\" class=\"sv mono\" text-anchor=\"end\" font-size=\"12.0\" fill=\"#1B2B33\" font-weight=\"600\" >L2</text><rect x=\"40.0\" y=\"158.0\" width=\"880.0\" height=\"56.0\" rx=\"2\" fill=\"#A4C4C6\" stroke=\"#BE653B\" stroke-width=\"2.4\" /><text x=\"58.0\" y=\"193.0\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#1B2B33\" font-weight=\"700\" >基数估算</text><text x=\"300.0\" y=\"192.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"400\" >rows = tuples × selectivity　← AQO 挂在这一层</text><text x=\"902.0\" y=\"192.0\" class=\"sv mono\" text-anchor=\"end\" font-size=\"12.0\" fill=\"#1B2B33\" font-weight=\"600\" >L3</text><rect x=\"40.0\" y=\"224.0\" width=\"880.0\" height=\"56.0\" rx=\"2\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1.0\" /><text x=\"58.0\" y=\"259.0\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#FFFFFF\" font-weight=\"700\" >成本模型</text><text x=\"300.0\" y=\"258.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#FFFFFF\" font-weight=\"400\" >用 rows 计算每条 Path 的 cost</text><text x=\"902.0\" y=\"258.0\" class=\"sv mono\" text-anchor=\"end\" font-size=\"12.0\" fill=\"#FFFFFF\" font-weight=\"600\" >L4</text><rect x=\"40.0\" y=\"290.0\" width=\"880.0\" height=\"56.0\" rx=\"2\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.0\" /><text x=\"58.0\" y=\"325.0\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#FFFFFF\" font-weight=\"700\" >计划与执行</text><text x=\"300.0\" y=\"324.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#FFFFFF\" font-weight=\"400\" >选 cheapest Path → Executor 真正跑一遍</text><text x=\"902.0\" y=\"324.0\" class=\"sv mono\" text-anchor=\"end\" font-size=\"12.0\" fill=\"#FFFFFF\" font-weight=\"600\" >L5</text><rect x=\"980.0\" y=\"26.0\" width=\"400.0\" height=\"306.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#245A6B\" stroke-width=\"1.8\" /><rect x=\"980.0\" y=\"26.0\" width=\"400.0\" height=\"6.0\" rx=\"0\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"1004.0\" y=\"74.0\" class=\"sv serif\" text-anchor=\"start\" font-size=\"34.0\" fill=\"#245A6B\" font-weight=\"700\" >AQO</text><text x=\"1004.0\" y=\"100.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >Adaptive Query Optimization</text><line x1=\"1004.0\" y1=\"116.0\" x2=\"1356.0\" y2=\"116.0\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1004.0\" y=\"144.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" >学习对象</text><text x=\"1004.0\" y=\"162.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >每个计划对象的真实输出行数</text><text x=\"1004.0\" y=\"184.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" >学习材料</text><text x=\"1004.0\" y=\"202.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >历史执行反馈 actual rows</text><text x=\"1004.0\" y=\"224.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" >生效位置</text><text x=\"1004.0\" y=\"242.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >RelOptInfo→rows / Path→rows</text><text x=\"1004.0\" y=\"264.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" >严格边界</text><text x=\"1004.0\" y=\"282.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >不生成计划，不改 cost model</text><rect x=\"1000.0\" y=\"290.0\" width=\"360.0\" height=\"26.0\" rx=\"2\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"1180.0\" y=\"308.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#2F7A66\" font-weight=\"600\" >把「执行之后」接回「规划之前」</text><line x1=\"920.0\" y1=\"190.0\" x2=\"972.8\" y2=\"190.0\" stroke=\"#245A6B\" stroke-width=\"2.0\"/><polygon points=\"980.0,190.0 971.0,185.1 971.0,194.9\" fill=\"#245A6B\"/><line x1=\"920.0\" y1=\"322.0\" x2=\"950.0\" y2=\"322.0\" stroke=\"#2F7A66\" stroke-width=\"2.2\"/><line x1=\"950.0\" y1=\"322.0\" x2=\"950.0\" y2=\"402.0\" t-size=\"14.0\" fill=\"#245A6B\" font-weight=\"600\" >优化器估计</text><text x=\"60.0\" y=\"135.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"46.0\" fill=\"#245A6B\" font-weight=\"700\" >1 行</text><text x=\"510.0\" y=\"118.0\" class=\"sv mono\" text-anchor=\"end\" font-size=\"22.0\" fill=\"#BE653B\" font-weight=\"700\" >×100,000</text><line x1=\"560.0\" y1=\"107.0\" x2=\"632.0\" y2=\"107.0\" stroke=\"#BE653B\" stroke-width=\"2.4\"/><polygon points=\"640.0,107.0 630.0,101.5 630.0,112.5\" fill=\"#BE653B\"/><rect x=\"660.0\" y=\"48.0\" width=\"500.0\" height=\"118.0\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.4\" /><text x=\"680.0\" y=\"80.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"600\" >实际执行</text><text x=\"680.0\" y=\"135.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"46.0\" fill=\"#BE653B\" font-weight=\"700\" >100,000 行</text><text x=\"40.0\" y=\"190.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >误差不在「差一点」，而在差了五个数量级；后面的每一步都按错的 rows 做决策。</text><rect x=\"40.0\" y=\"222.0\" width=\"320.0\" height=\"112.0\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.3\" /><text x=\"56.0\" y=\"250.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"700\" >01</text><text x=\"56.0\" y=\"282.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#1B2B33\" font-weight=\"700\" >join 输出被低估</text><text x=\"56.0\" y=\"308.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >以为只出 1 行</text><line x1=\"360.0\" y1=\"278.0\" x2=\"383.6\" y2=\"278.0\" stroke=\"#245A6B\" stroke-width=\"2.0\"/><polygon points=\"390.0,278.0 382.0,273.6 382.0,282.4\" fill=\"#245A6B\"/><rect x=\"390.0\" y=\"222.0\" width=\"320.0\" height=\"112.0\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.3\" /><text x=\"406.0\" y=\"250.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"700\" >02</text><text x=\"406.0\" y=\"282.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#1B2B33\" font-weight=\"700\" >选了 Nested Loop</text><text x=\"406.0\" y=\"308.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >小结果集下最便宜</text><line x1=\"710.0\" y1=\"278.0\" x2=\"733.6\" y2=\"278.0\" stroke=\"#BE653B\" stroke-width=\"2.0\"/><polygon points=\"740.0,278.0 732.0,273.6 732.0,282.4\" fill=\"#BE653B\"/><rect x=\"740.0\" y=\"222.0\" width=\"320.0\" height=\"112.0\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.3\" /><text x=\"756.0\" y=\"250.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#BE653B\" font-weight=\"700\" >03</text><text x=\"756.0\" y=\"282.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#1B2B33\" font-weight=\"700\" >内表被反复访问</text><text x=\"756.0\" y=\"308.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >1 次变成 10 万次</text><line x1=\"1060.0\" y1=\"278.0\" x2=\"1083.6\" y2=\"278.0\" stroke=\"#BE653B\" stroke-width=\"2.0\"/><polygon points=\"1090.0,278.0 1082.0,273.6 1082.0,282.4\" fill=\"#BE653B\"/><rect x=\"1090.0\" y=\"222.0\" width=\"320.0\" height=\"112.0\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.3\" /><text x=\"1106.0\" y=\"250.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#BE653B\" font-weight=\"700\" >04</text><text x=\"1106.0\" y=\"282.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#1B2B33\" font-weight=\"700\" >执行期灾难</text><text x=\"1106.0\" y=\"308.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >随机 IO 与耗时被放大</text><text x=\"40.0\" y=\"366.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"600\" >关键点：错的不是某条 SQL 的写法，而是 planner 手里那个「输出多少行」的先验判断。</text><text x=\"40.0\" y=\"394.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#2F7A66\" font-weight=\"600\" >AQO 的切入点就在这里：既然数据库自己已经跑出了真实行数，为什么不能拿它修正下一次的判断？</text></svg>","ctrl":null},{"eyebrow":"第一章 · 机制","title":"rows 是整条代价链的输入","lede":"CBO 的公式很朴素：生成候选路径、估算每条路径输出多少行、用行数驱动成本模型选计划。","caption":"图 3 · 上：CBO 四步，rows 是唯一的「事实接口」。下：误差沿 join tree 逐层传递（结构示意，未标具体倍数）。","bridge":"既然 rows 这么关键，那传统估算到底能做到什么、又天生做不到什么？","notes":"我们退一步，把 CBO 的公式摊开。它其实就四步：生成候选路径，估算每条路径输出多少行，用这个行数去套成本模型，最后挑代价最低的那条计划。四步里，只有第二步在回答「事实是什么」——这张表有多少行、这个条件过滤掉多少、这个 join 会吐多少；其余三步都是在这个事实之上做推理。所以 rows 是整条链的事实接口：统计信息给的是它，代价模型吃的也是它。麻烦在于，第二步不是一个点，而是一棵树。base relation 上每列一个选择率，两个表 join 要把选择率组合起来，三个表、四个表再往上叠，每层都带自己的假设和误差。独立性假设在单表上看着还行，到了多表 join，一个节点低估一点，它的父节点就在这个错误输入上再估一次，误差不是相加，是逐层乘上去。等到了树顶，rows 和真实值差几个数量级一点都不奇怪。文章里说得很准：复杂 SQL 里最容易错的，也正是「输出多少行」。那么下一个问题自然就是——传统估算为什么堵不住这个口子？","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40.0\" y=\"34.0\" width=\"320.0\" height=\"78.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"200.0\" y=\"66.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"18.0\" fill=\"#1B2B33\" font-weight=\"700\" >生成候选 Path</text><text x=\"200.0\" y=\"92.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >枚举扫描与 join 顺序</text><line x1=\"360.0\" y1=\"73.0\" x2=\"378.6\" y2=\"73.0\" stroke=\"#245A6B\" stroke-width=\"2.0\"/><polygon points=\"385.0,73.0 377.0,68.6 377.0,77.4\" fill=\"#245A6B\"/><rect x=\"385.0\" y=\"34.0\" width=\"320.0\" height=\"78.0\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#BE653B\" stroke-width=\"2.2\" /><text x=\"545.0\" y=\"66.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"18.0\" fill=\"#BE653B\" font-weight=\"700\" >估算 rows</text><text x=\"545.0\" y=\"92.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >每个节点输出多少行</text><line x1=\"705.0\" y1=\"73.0\" x2=\"723.6\" y2=\"73.0\" s " x2=\"180.0\" y2=\"297.0\" stroke=\"#245A6B\" stroke-width=\"1.5\"/><line x1=\"460.0\" y1=\"306.0\" x2=\"460.0\" y2=\"297.0\" stroke=\"#245A6B\" stroke-width=\"1.5\"/><line x1=\"740.0\" y1=\"306.0\" x2=\"740.0\" y2=\"297.0\" stroke=\"#245A6B\" stroke-width=\"1.5\"/><line x1=\"320.0\" y1=\"297.0\" x2=\"320.0\" y2=\"293.6\" stroke=\"#245A6B\" stroke-width=\"1.5\"/><polygon points=\"320.0,288.0 316.1,295.0 323.9,295.0\" fill=\"#245A6B\"/><line x1=\"630.0\" y1=\"297.0\" x2=\"630.0\" y2=\"293.6\" stroke=\"#245A6B\" stroke-width=\"1.5\"/><polygon points=\"630.0,288.0 626.1,295.0 633.9,295.0\" fill=\"#245A6B\"/><line x1=\"320.0\" y1=\"229.0\" x2=\"630.0\" y2=\"229.0\" stroke=\"#BE653B\" stroke-width=\"1.7\"/><line x1=\"320.0\" y1=\"238.0\" x2=\"320.0\" y2=\"229.0\" stroke=\"#BE653B\" stroke-width=\"1.7\"/><line x1=\"630.0\" y1=\"238.0\" x2=\"630.0\" y2=\"229.0\" stroke=\"#BE653B\" stroke-width=\"1.7\"/><line x1=\"475.0\" y1=\"229.0\" x2=\"475.0\" y2=\"226.4\" stroke=\"#BE653B\" stroke-width=\"1.8\"/><polygon points=\"475.0,220.0 470.6,228.0 479.4,228.0\" fill=\"#BE653B\"/><line x1=\"900.0\" y1=\"356.0\" x2=\"900.0\" y2=\"182.4\" stroke=\"#AE8A3E\" stroke-width=\"1.6\"/><polygon points=\"900.0,176.0 895.6,184.0 904.4,184.0\" fill=\"#AE8A3E\"/><text x=\"916.0\" y=\"262.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#AE8A3E\" font-weight=\"600\" >误差沿树向上</text><text x=\"916.0\" y=\"284.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#AE8A3E\" font-weight=\"400\" >逐层累积</text><text x=\"40.0\" y=\"396.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#89938F\" font-weight=\"400\" >每一层都把自己的误差乘进下一层；越往树顶，估计与真实的距离越不可控。</text></svg>","ctrl":null},{"eyebrow":"第一章 · 边界","title":"单列统计知道分布，不知道组合","lede":"多表相关性、复杂谓词、倾斜、参数组合、统计过期——误差会在 join tree 上放大。","caption":"图 4 · 传统估算的能力边界。左侧是 PostgreSQL 已成熟的机制，右侧是它的天然盲区。","bridge":"边界清楚了，AQO 的想法就可以用一句话讲完：把问题改写掉。","notes":"PostgreSQL 在传统估算上一点都不弱。pg_class、pg_statistic 给了表和列的分布，ANALYZE 负责采样刷新，后来又加了扩展统计，能捕捉多列之间的 MCV、ndistinct 和函数依赖，选择率函数处理范围条件，外键还能修正 join 的选择率。这套东西很成熟，绝大多数查询靠它就够了。但它的边界也很清楚：它本质上是「预先统计」——先采样、先假设，再在规划时把若干选择率组合起来。组合的那一步，默认列与列之间独立。可业务数据不独立。文章里那个查询模板：城市、SKU、时间窗口三个条件一起上，某些城市订单极少，某些 SKU 是爆品，城市和 SKU 之间还可能有业务相关性。单列统计知道 city 有多少 hot_city，也知道 sku 有多少 hot_sku，但它不知道「hot_city 且 hot_sku 且二月份以后」这三个条件同时成立时到底剩几行。扩展统计能补一部分多列相关，可你不可能给所有组合都建统计对象，更没法覆盖函数表达式、数据倾斜和参数组合。再叠加统计信息过期，误差就有了稳定来源。所以这里不是「统计信息不够努力」，是「一次性、无反馈的估算」这条路本身有天花板。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40.0\" y=\"26.0\" width=\"620.0\" height=\"344.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><rect x=\"740.0\" y=\"26.0\" width=\"620.0\" height=\"344.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><rect x=\"40.0\" y=\"26.0\" width=\"620.0\" height=\"44.0\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><rect x=\"740.0\" y=\"26.0\" width=\"620.0\" height=\"44.0\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1\" /><text x=\"60.0\" y=\"55.0\" class=\"sv serif\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#245A6B\" font-weight=\"700\" >PostgreSQL 已经有的</text><text x=\"760.0\" y=\"55.0\" class=\"sv serif\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#BE653B\" font-weight=\"700\" >它天生不知道的</text><rect x=\"60.0\" y=\"88.0\" width=\"580.0\" height=\"36.0\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><circle cx=\"80.0\" cy=\"106.0\" r=\"5.0\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"98.0\" y=\"111.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >pg_class / pg_statistic</text><rect x=\"60.0\" y=\"133.0\" width=\"580.0\" height=\"36.0\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><circle cx=\"80.0\" cy=\"151.0\" r=\"5.0\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"98.0\" y=\"156.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >ANALYZE 采样刷新</text><rect x=\"60.0\" y=\"178.0\" width=\"580.0\" height=\"36.0\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><circle cx=\"80.0\" cy=\"196.0\" r=\"5.0\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"98.0\" y=\"201.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >CREATE STATISTICS 扩展统计</text><rect x=\"60.0\" y=\"223.0\" width=\"580.0\" height=\"36.0\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><circle cx=\"80.0\" cy=\"241.0\" r=\"5.0\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"98.0\" y=\"246.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >MCV / ndistinct / dependencies</text><rect x=\"60.0\" y=\"268.0\" width=\"580.0\" height=\"36.0\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><circle cx=\"80.0\" cy=\"286.0\" r=\"5.0\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"98.0\" y=\"291.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >选择率函数与范围条件</text><rect x=\"60.0\" y=\"313.0\" width=\"580.0\" height=\"36.0\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><circle cx=\"80.0\" cy=\"331.0\" r=\"5.0\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"98.0\" y=\"336.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >外键带来的选择率修正</text><rect x=\"760.0\" y=\"88.0\" width=\"580.0\" height=\"36.0\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><circle cx=\"780.0\" cy=\"106.0\" r=\"5.0\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"798.0\" y=\"111.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >多表之间的业务相关性</text><rect x=\"760.0\" y=\"133.0\" width=\"580.0\" height=\"36.0\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><circle cx=\"780.0\" cy=\"151.0\" r=\"5.0\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"798.0\" y=\"156.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >复杂谓词与函数表达式</text><rect x=\"760.0\" y=\"178.0\" width=\"580.0\" height=\"36.0\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><circle cx=\"780.0\" cy=\"196.0\" r=\"5.0\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"798.0\" y=\"201.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >数据倾斜：长尾与爆品</text><rect x=\"760.0\" y=\"223.0\" width=\"580.0\" height=\"36.0\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><circle cx=\"780.0\" cy=\"241.0\" r=\"5.0\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"798.0\" y=\"246.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >city × sku × 时间的参数组合</text><rect x=\"760.0\" y=\"268.0\" width=\"580.0\" height=\"36.0\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><circle cx=\"780.0\" cy=\"286.0\" r=\"5.0\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"798.0\" y=\"291.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >统计信息过期与分布漂移</text><rect x=\"760.0\" y=\"313.0\" width=\"580.0\" height=\"36.0\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><circle cx=\"780.0\" cy=\"331.0\" r=\"5.0\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"798.0\" y=\"336.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" >跨 join tree 的误差累积</text><line x1=\"700.0\" y1=\"26.0\" x2=\"700.0\" y2=\"168.0\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" stroke-dasharray=\"5 5\"/><line x1=\"700.0\" y1=\"228.0\" x2=\"700.0\" y2=\"370.0\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" stroke-dasharray=\"5 5\"/><rect x=\"668.0\" y=\"168.0\" width=\"64.0\" height=\"60.0\" rx=\"2\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.2\" /><text x=\"700.0\" y=\"194.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#AE8A3E\" font-weight=\"600\" >独立性</text><text x=\"700.0\" y=\"212.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#AE8A3E\" font-weight=\"600\" >假设</text><text x=\"40.0\" y=\"392.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"600\" >单列统计知道每列的分布，却未必知道「这些条件同时成立」时真实会剩多少行。</text><text x=\"760.0\" y=\"392.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >扩展统计能补多列相关，但覆盖范围有限，且仍属「预先统计」。</text></svg>","ctrl":null},{"eyebrow":"第一章 · 转折","title":"从「预先估算」到「历史反馈」","lede":"既然数据库已经执行过类似 SQL，为什么不把上次真实的 actual rows 反馈给下次规划？","caption":"图 5 · 问题改写前后的对照。收益与代价是同一件事的两面，后面每一页都在展开这张账单。","bridge":"想法有了，但必须先划清边界：AQO 到底改的是什么，不改的是什么。","notes":"于是文章的转折就落在一句很直白的话上：既然数据库已经执行过类似 SQL，为什么不把上次真实的 actual rows 反馈给下次规划？这一问，把问题整个改写了一遍。原问题是「只靠预先统计信息，估算本次查询的 rows」，它是一次性的，跑完就结束，下次遇到同结构的查询还得重新猜一遍，同样的误差会反复出现。转化后的问题变成：用历史执行反馈，学习「相似谓词结构加上当前选择率特征」到「实际行数」之间的映射。收益就很自然了——只要相似查询重复出现，rows 有机会一轮比一轮贴近真实值，代价模型也就有机会换到更合适的 join 顺序、join 方法或者扫描方式。但请注意右下角这半张账单：训练样本要存，共享内存要占，执行期要打开 instrumentation 采数，模型要维护，上线之后还得管白名单、冻结、回滚和重新训练。这不是免费午餐，是一个用「持续的运行期成本」去换「重复 workload 上的估算质量」的交易。后面我们一半的篇幅，其实都在讨论这张账单什么时候划算。现在先做最重要的一件事：把边界划死。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><text x=\"40.0\" y=\"30.0\" class=\"sv serif\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"700\" >把问题从「一次估算」改写成「带反馈的映射学习」</text><rect x=\"40.0\" y=\"48.0\" width=\"1320.0\" height=\"84.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"60.0\" y=\"78.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#89938F\" font-weight=\"700\" >原问题</text><text x=\"190.0\" y=\"78.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#46585F\" font-weight=\"400\" >只靠预先统计信息，估算本次查询的 rows</text><text x=\"60.0\" y=\"112.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >一次性</text><text x=\"190.0\" y=\"112.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >无执行反馈、无法从历史中受益、误差在同类查询上反复出现</text><line x1=\"700.0\" y1=\"134.0\" x2=\"700.0\" y2=\"158.8\" stroke=\"#BE653B\" stroke-width=\"2.2\"/><polygon points=\"700.0,166.0 695.0,157.0 705.0,157.0\" fill=\"#BE653B\"/><rect x=\"40.0\" y=\"172.0\" width=\"1320.0\" height=\"98.0\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.4\" /><text x=\"60.0\" y=\"204.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"700\" >转化后</text><text x=\"190.0\" y=\"204.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#245A6B\" font-weight=\"700\" >相似谓词结构 + 当前选择率特征  →  实际 rows</text><text x=\"60.0\" y=\"240.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#245A6B\" font-weight=\"600\" >闭环</text><text x=\"190.0\" y=\"240.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >执行完采集真实行数 → 写回模型 → 下次规划时预测 → 再采集</text><rect x=\"40.0\" y=\"292.0\" width=\"640.0\" height=\"106.0\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\" /><text x=\"60.0\" y=\"320.0\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#2F7A66\" font-weight=\"700\" >收益</text><text x=\"60.0\" y=\"348.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >相似查询重复出现时，rows 有机会越来越贴近真实值</text><text x=\"60.0\" y=\"374.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >代价模型因此可能换到更合适的 join order / method</text><rect x=\"700.0\" y=\"292.0\" width=\"660.0\" height=\"106.0\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\" /><text x=\"720.0\" y=\"320.0\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#BE653B\" font-weight=\"700\" >代价</text><text x=\"720.0\" y=\"348.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >训练样本、共享内存、执行期 instrumentation、模型维护</text><text x=\"720.0\" y=\"374.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >以及一整套生产治理：白名单、冻结、回滚、再训练</text></svg>","ctrl":null},{"eyebrow":"第二章 · 定位","title":"它只动 cardinality estimation","lede":"AQO 不生成计划，只改善 planner 用到的行数估计；换不换计划，仍由 PostgreSQL 自己决定。","caption":"图 6 · AQO 在查询流水线中的唯一介入层，以及它明确不替代的五件事。","bridge":"边界一划清，马上就冒出一个工程问题：为什么它不能像普通插件那样 CREATE EXTENSION 就完事？","notes":"这一点我必须反复强调，因为「机器学习优化器」这个名字太容易让人误会。AQO 的 README 和源码都把核心目标限定在 cardinality estimation，也就是改善 planner 用到的行数估计。它影响的是 RelOptInfo 的 rows、Path 的 rows，还有 group 的基数估计；然后就交回去了。后面是不是把 Nested Loop 换成 Hash Join、join 顺序怎么排、要不要走并行，全部还是 PostgreSQL 原有的 path 搜索加 cost model 说了算。所以它不是 plan baseline，不会把某个计划钉死；数据、统计、GUC、索引、版本一变，即使 rows 一样，最终计划也可能变。它也不是「开了就快」的开关——如果原生估算本来就准，或者瓶颈在锁、IO、网络、排序落盘，AQO 根本帮不上忙。我更喜欢这么概括：它改的是「输入的事实」，不是「做决策的大脑」。这个定位一确定，下一页那个看起来很重的工程要求就顺理成章了：要改的既然是优化器核心路径上的 rows，就必须能在那里挂钩子、还得有一块跨会话共享的地方存模型，这可不是 SQL 层能办到的。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40.0\" y=\"26.0\" width=\"800.0\" height=\"56.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"58.0\" y=\"60.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.5\" fill=\"#1B2B33\" font-weight=\"700\" >Parser / Rewriter</text><text x=\"300.0\" y=\"60.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >生成 Query、queryId</text><text x=\"824.0\" y=\"60.0\" class=\"sv s\" text-anchor=\"end\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"600\" >不变</text><rect x=\"40.0\" y=\"92.0\" width=\"800.0\" height=\"56.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"58.0\" y=\"126.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.5\" fill=\"#1B2B33\" font-weight=\"700\" >RelOptInfo / Path</text><text x=\"300.0\" y=\"126.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >枚举访问路径与 join order</text><text x=\"824.0\" y=\"126.0\" class=\"sv s\" text-anchor=\"end\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"600\" >不变</text><rect x=\"40.0\" y=\"158.0\" width=\"800.0\" height=\"56.0\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"2.2\" /><text x=\"58.0\" y=\"192.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.5\" fill=\"#BE653B\" font-weight=\"700\" >基数估算</text><text x=\"300.0\" y=\"192.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >base rel、join rel、group 的 rows</text><text x=\"824.0\" y=\"192.0\" class=\"sv s\" text-anchor=\"end\" font-size=\"12.5\" fill=\"#BE653B\" font-weight=\"600\" >AQO 介入</text><rect x=\"40.0\" y=\"224.0\" width=\"800.0\" height=\"56.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"58.0\" y=\"258.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.5\" fill=\"#1B2B33\" font-weight=\"700\" >cost model</text><text x=\"300.0\" y=\"258.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >用 rows 与代价参数算 cost</text><text x=\"824.0\" y=\"258.0\" class=\"sv s\" text-anchor=\"end\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"600\" >不变</text><rect x=\"40.0\" y=\"290.0\" width=\"800.0\" height=\"56.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"58.0\" y=\"324.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.5\" fill=\"#1B2B33\" font-weight=\"700\" >Plan / Executor</text><text x=\"300.0\" y=\"324.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >选 cheapest Path 并执行</text><text x=\"824.0\" y=\"324.0\" class=\"sv s\" text-anchor=\"end\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"600\" >不变</text><rect x=\"880.0\" y=\"26.0\" width=\"480.0\" height=\"296.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#245A6B\" stroke-width=\"1.5\" /><rect x=\"880.0\" y=\"26.0\" width=\"480.0\" height=\"44.0\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"900.0\" y=\"55.0\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"700\" >严格边界：它不替代什么</text><rect x=\"900.0\" y=\"86.0\" width=\"440.0\" height=\"36.0\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"916.0\" y=\"109.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >不生成执行计划，也不是 plan baseline</text><rect x=\"900.0\" y=\"131.0\" width=\"440.0\" height=\"36.0\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"916.0\" y=\"154.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >不替代 join order / Path 搜索</text><rect x=\"900.0\" y=\"176.0\" width=\"440.0\" height=\"36.0\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"916.0\" y=\"199.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >不改写 cost model 与代价参数</text><rect x=\"900.0\" y=\"221.0\" width=\"440.0\" height=\"36.0\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"916.0\" y=\"244.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >不替代 parser、rewriter、executor</text><rect x=\"900.0\" y=\"266.0\" width=\"440.0\" height=\"36.0\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"916.0\" y=\"289.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >不是「每条 SQL 都会变快」的开关</text><line x1=\"840.0\" y1=\"190.0\" x2=\"872.8\" y2=\"190.0\" stroke=\"#245A6B\" stroke-width=\"2.0\"/><polygon points=\"880.0,190.0 871.0,185.1 871.0,194.9\" fill=\"#245A6B\"/><text x=\"40.0\" y=\"374.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"600\" >README 把目标限定在 cardinality estimation；最终是否换成更好的计划，仍由原有 path 搜索与 cost model 决定。</text><text x=\"40.0\" y=\"400.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#89938F\" font-weight=\"400\" >换句话说：AQO 改的是「输入的事实」，不是「做决策的大脑」。</text></svg>","ctrl":null},{"eyebrow":"第二章 · 形态","title":"为什么它必须是一个 patched PostgreSQL","lede":"要在 planner / executor 上挂 hook、要用共享内存存知识库，还得给 RelOptInfo 加字段——SQL 层做不到。","caption":"图 7 · 左侧是 README 给出的安装顺序；右侧是「必须打补丁」的四个真实理由。","bridge":"知道了它长什么样，下一页我们把它拆成源码模块，看看这条反馈线具体由哪几段代码接起来。","notes":"所以 AQO 不是普通插件。README 说得很直接：它是一个 patch 加一个 extension 的组合。你得把 aqo 克隆到 contrib/aqo，对 PostgreSQL 源码打上对应版本的补丁，然后 make clean 全量重编译——因为补丁动了头文件，不彻底重建会有兼容性问题；再进 contrib/aqo 编译安装扩展；接着在 postgresql.conf 里写 shared_preload_libraries 等于 aqo，重启实例；最后才在库里 CREATE EXTENSION。为什么这么重？因为四件事都绕不开内核：第一，它要在 planner 和 executor 的关键路径上注册 hook；第二，模型要放在共享内存里跨会话复用，必须实例启动时申请，所以是 per-cluster 而不是 per-database；第三，补丁给 RelOptInfo 加了 AQO 需要的字段，比如 predicted_cardinality 和 fss_hash；第四，基数估算发生在 C 代码深处，SQL 层根本够不着。等这些都装好，它才会吐出一组 SQL 接口：aqo_queries、aqo_query_texts、aqo_query_stat、aqo_data，后面的白名单治理、误差排查全靠它们。我顺手核对了一下 postgrespro/aqo 的 README 和 aqo.c，确认这几步和「必须 preload、否则直接报错」的行为是一致的。好，形态清楚了，我们把这条反馈线拆成源码里的几段。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><text x=\"40.0\" y=\"28.0\" class=\"sv serif\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"700\" >安装与加载：AQO = 源码补丁 + contrib 扩展 + 启动期预加载</text><rect x=\"40.0\" y=\"48.0\" width=\"760.0\" height=\"56.0\" rx=\"2\" fill=\"#A4C4C6\" stroke=\"#A4C4C6\" stroke-width=\"1.0\" /><text x=\"58.0\" y=\"82.0\" clas 它是什么」的源码表；括号为对应职责。","bridge":"地图铺好了，我们先从最底下那层看起：PostgreSQL 原生的估算入口长什么样，hook 挂在哪。","notes":"文章列了一张很实在的模块表，九个源码文件。如果只是照着念一遍，听完就忘；我们按职责把它归成四层。最上面是治理与初始化：aqo.c 定义 GUC、注册 hook、申请共享内存；preprocessing.c 算 query_hash、查或建 aqo_queries 设置、决定 learn_aqo 和 use_aqo；auto_tuning.c 负责后续要不要继续用 AQO。第二层是规划期预测：cardinality_hooks.c 拦截 base rel、join rel、parameterized path 和 group 数估计；hash.c 把 clauses、等价类、关系集合、选择率转成特征子空间和特征向量；cardinality_estimation.c 调模型预测。第三层是 ML 核心和执行反馈：machine_learning.c 是那个不知道 DBMS、只玩矩阵的 kNN 回归器；postprocessing.c 在执行结束后遍历 PlanState 采真实行数。最底下是存储：storage.c、storage.h、aqo_shared.c 把知识库放进共享内存和持久化文件，补丁负责把 hook 和结构体接进内核。你看，这四层刚好就是一条反馈线的四段：先判断管不管，再预测，再采集学习，最后存下来给下一次用。接下来我们一层一层拆，从最底下的接口开始——先看 PostgreSQL 原生在哪儿估行数，AQO 的钩子又是怎么插进去的。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40.0\" y=\"26.0\" width=\"250.0\" height=\"84.0\" rx=\"2\" fill=\"#A4C4C6\" stroke=\"#A4C4C6\" stroke-width=\"1.0\" /><text x=\"60.0\" y=\"70.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"700\" >治理与初始化</text><text x=\"60.0\" y=\"92.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#1B2B33\" font-weight=\"400\" >L1 · 初始化</text><rect x=\"310.0\" y=\"26.0\" width=\"345.0\" height=\"84.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"326.0\" y=\"60.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"700\" >aqo.c</text><text x=\"326.0\" y=\"86.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >GUC / hook / 共享内存</text><rect x=\"675.0\" y=\"26.0\" width=\"345.0\" height=\"84.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"691.0\" y=\"60.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"700\" >preprocessing.c</text><text x=\"691.0\" y=\"86.0\" class=\"sv s\" text-anchor=\"start\ "250.0\" height=\"84.0\" rx=\"2\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.0\" /><text x=\"60.0\" y=\"358.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#FFFFFF\" font-weight=\"700\" >存储与持久化</text><text x=\"60.0\" y=\"380.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#FFFFFF\" font-weight=\"400\" >L4 · 落地</text><rect x=\"310.0\" y=\"314.0\" width=\"345.0\" height=\"84.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"326.0\" y=\"348.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"700\" >storage.c / .h</text><text x=\"326.0\" y=\"374.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >四类 Entry 结构</text><rect x=\"675.0\" y=\"314.0\" width=\"345.0\" height=\"84.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"691.0\" y=\"348.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"700\" >aqo_shared.c</text><text x=\"691.0\" y=\"374.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >共享内存</text><rect x=\"1040.0\" y=\"314.0\" width=\"345.0\" height=\"84.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"1056.0\" y=\"348.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"700\" >aqo_master.patch</text><text x=\"1056.0\" y=\"374.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >hook 与结构补丁</text><line x1=\"290.0\" y1=\"356.0\" x2=\"304.4\" y2=\"356.0\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><polygon points=\"310.0,356.0 303.0,352.1 303.0,359.9\" fill=\"#245A6B\"/><text x=\"40.0\" y=\"414.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >四层从上到下：先决定「管不管」，再在规划期预测，执行后学习，最后落到共享内存与文件。</text></svg>","ctrl":null},{"eyebrow":"第三章 · 接口","title":"原生在哪儿估，hook 就挂在哪儿","lede":"补丁在 base rel、join rel、parameterized path 与 group 估算入口周围插入钩子，并给 RelOptInfo 加了字段。","caption":"图 9 · 左：costsize.c / clausesel.c 的原生入口；右：补丁新增的 hook。底部字段变化解释了「为什么要打补丁」。","bridge":"钩子挂好了，下一个问题是：到底哪些查询算「同一类」，值得共用一份模型？","notes":"先把原生入口摆出来。base relation 的行数估计在 costsize.c 的 set_baserel_size_estimates，核心就是 rel->rows 等于 rel->tuples 乘上 clauselist_selectivity；join relation 在同文件的 set_joinrel_size_estimates，走 calc_joinrel_size_estimate。clauselist_selectivity 在 clausesel.c 里，它会尝试扩展统计信息、处理范围条件，再把剩余条件的选择率组合起来，统计信息来自 pg_class、pg_statistic 和扩展统计对象，由 ANALYZE 采样更新。AQO 的补丁就贴在这几个入口周围，加了四个 hook：base rel 的、join rel 的，还有两类 parameterized path 的；在 master 分支的 aqo.c 里我核对到，除此之外还注册了 estimate_num_groups_hook、create_plan_hook、create_upper_paths_hook，以及 planner、ExecutorStart/Run/End 和 EXPLAIN 展示相关的 hook。同时补丁给 RelOptInfo 加了 predicted_cardinality 和 fss_hash 两个字段。你看，字段进了优化器核心结构体，钩子进了 planner 主路径——这就是上一页那句「必须重编译」的实物证据。好，接口有了，接下来 AQO 得先回答一个更前置的问题：什么样的两条 SQL 算同一类，可以共用一份模型？","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40.0\" y=\"26.0\" width=\"640.0\" height=\"216.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><rect x=\"40.0\" y=\"26.0\" width=\"640.0\" height=\"42.0\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"60.0\" y=\"54.0\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"700\" >PostgreSQL 原生估算入口</text><text x=\"60.0\" y=\"94.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#245A6B\" font-weight=\"700\" >costsize.c</text><text x=\"200.0\" y=\"94.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >set_baserel_size_estimates()</text><text x=\"60.0\" y=\"125.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >rel-&gt;rows = rel-&gt;tuples * clauselist_selectivity(...)</text><text x=\"60.0\" y=\"156.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#245A6B\" font-weight=\"700\" >costsize.c</text><text x=\"200.0\" y=\"156.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >set_joinrel_size_estimates()</text><text x=\"60.0\" y=\"187.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >rel-&gt;rows = calc_joinrel_size_estimate(...)</text><text x=\"60.0\" y=\"218.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#245A6B\" font-weight=\"700\" >clausesel.c</text><text x=\"200.0\" y=\"218.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >clauselist_selectivity()：扩展统计 → 范围条件 → 组合</text><rect x=\"720.0\" y=\"26.0\" width=\"640.0\" height=\"216.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><rect x=\"720.0\" y=\"26.0\" width=\"640.0\" height=\"42.0\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1\" /><text x=\"740.0\" y=\"54.0\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#BE653B\" font-weight=\"700\" >AQO 补丁在这些入口周围加的 hook</text><rect x=\"740.0\" y=\"82.0\" width=\"600.0\" height=\"26.0\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"752.0\" y=\"100.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >set_baserel_rows_estimate_hook</text><rect x=\"740.0\" y=\"113.0\" width=\"600.0\" height=\"26.0\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"752.0\" y=\"131.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >get_parameterized_baserel_size_hook</text><rect x=\"740.0\" y=\"144.0\" width=\"600.0\" height=\"26.0\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"752.0\" y=\"162.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >set_joinrel_size_estimates_hook</text><rect x=\"740.0\" y=\"175.0\" width=\"600.0\" height=\"26.0\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"752.0\" y=\"193.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >get_parameterized_joinrel_size_hook</text><rect x=\"740.0\" y=\"206.0\" width=\"600.0\" height=\"26.0\" rx=\"2\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"752.0\" y=\"224.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >estimate_num_groups_hook 等（master 分支另注册）</text><line x1=\"680.0\" y1=\"134.0\" x2=\"712.8\" y2=\"134.0\" stroke=\"#BE653B\" stroke-width=\"2.0\"/><polygon points=\"720.0,134.0 711.0,129.1 711.0,138.9\" fill=\"#BE653B\"/><text x=\"700.0\" y=\"122.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#BE653B\" font-weight=\"600\" >挂</text><rect x=\"40.0\" y=\"262.0\" width=\"1320.0\" height=\"78.0\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\" /><text x=\"60.0\" y=\"292.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"700\" >RelOptInfo 新增字段</text><text x=\"250.0\" y=\"292.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >predicted_cardinality　·　fss_hash</text><text x=\"60.0\" y=\"322.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >这些字段要进优化器核心结构体，所以 AQO 必须配 patched PostgreSQL，而不是单纯 SQL extension。</text><text x=\"40.0\" y=\"372.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >实证核对：aqo_master.patch 增加基数估算 hook；aqo.c 的 _PG_init 还注册 planner / ExecutorStart / ExecutorRun / ExecutorEnd、</text><text x=\"40.0\" y=\"394.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >ExplainOnePlan / ExplainOneNode、create_plan、create_upper_paths 等 hook，覆盖规划、执行与 EXPLAIN 展示。</text></svg>","ctrl":null},{"eyebrow":"第三章 · 归一化","title":"相同结构，不同常量，算同一类","lede":"常量被抽掉，queryId 成为 query_hash；差异交给 selectivity 特征，学习成果才能跨执行迁移。","caption":"图 10 · 归一化示意。右侧红色区域对应文章的「query type 爆炸」风险与 README 的临时对象限制。","bridge":"分类规则定了，接着就是治理的开关：遇到未知查询，六种模式分别怎么处理？","notes":"preprocessing.c 里有句很干脆的注释：如果两个查询相等，或者只在常量上不同，就认为它们是同一种查询类型。PostgreSQL 的 queryId 被用作 query_context.query_hash。比如图上这两条 SQL，一条 a 小于 10 且 b 等于 x，一条 a 小于 20 且 b 等于 y，在 AQO 眼里是同一类，共享一个 feature space 和一份模型。那常量差异去哪了？它没有被丢掉，而是变成选择率特征——a 小于 10 和 a 小于 20 的选择率不一样，b 等于 x 和 y 也不一样，这些 log(selectivity) 正是后面 kNN 的输入向量。这一步特别关键：它决定了「上次的反馈能不能迁移到下次」。归一化太紧，每条 SQL 都自成一类，等于没学；太松，把不相似的查询塞进同一个空间，样本互相污染。文章和 README 都提醒了反面：如果每次 SQL 结构都不同，动态拼出来的查询会不断产生新的 query type，feature subspace 跟着膨胀，共享内存压力就上来了；还有个更隐蔽的坑，临时对象的内部 OID 每次都不一样，哪怕名字相同也会破坏归一化。所以「保持 SQL 结构稳定、用绑定参数」在 AQO 场景下不是代码风格建议，是能不能生效的前提。分好类，就该决定管不管了——这正是六种模式在做的事。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40.0\" y=\"26.0\" width=\"560.0\" height=\"200.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><rect x=\"40.0\" y=\"26.0\" width=\"560.0\" height=\"38.0\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"58.0\" y=\"52.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"700\" >两条只在常量上不同的 SQL</text><rect x=\"58.0\" y=\"76.0\" width=\"524.0\" height=\"52.0\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"72.0\" y=\"108.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >SELECT * FROM t WHERE a &lt; 10 AND b = &#x27;x&#x27;;</text><text x=\"560.0\" y=\"108.0\" class=\"sv s\" text-anchor=\"end\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"600\" >常量</text><rect x=\"58.0\" y=\"142.0\" width=\"524.0\" height=\"52.0\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"72.0\" y=\"174.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >SELECT * FROM t WHERE a &lt; 20 AND b = &#x27;y&#x27;;</text><line x1=\"600.0\" y1=\"126.0\" x2=\"664.8\" y2=\"126.0\" stroke=\"#245A6B\" stroke-width=\"2.2\"/><polygon points=\"672.0,126.0 663.0,121.0 663.0,130.9\" fill=\"#245A6B\"/><rect x=\"690.0\" y=\"26.0\" width=\"330.0\" height=\"200.0\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.5\" /><text x=\"710.0\" y=\"62.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"700\" >归一化</text><text x=\"710.0\" y=\"98.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"600\" >queryId → query_hash</text><line x1=\"710.0\" y1=\"116.0\" x2=\"1000.0\" y2=\"116.0\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"710.0\" y=\"146.0\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"700\" >同一 query type</text><text x=\"710.0\" y=\"176.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >共享一个 fs 与模型</text><text x=\"710.0\" y=\"204.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >常量差异由 selectivity 承载</text><rect x=\"1060.0\" y=\"26.0\" width=\"300.0\" height=\"200.0\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\" /><text x=\"1080.0\" y=\"62.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"700\" >反过来：结构变了</text><text x=\"1080.0\" y=\"98.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >每个新结构 = 新 query type</text><text x=\"1080.0\" y=\"132.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >动态 SQL → query type 爆炸</text><text x=\"1080.0\" y=\"166.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >feature subspace 跟着膨胀</text><text x=\"1080.0\" y=\"202.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#BE653B\" font-weight=\"600\" >共享内存与 DSA 压力上升</text><rect x=\"40.0\" y=\"250.0\" width=\"1320.0\" height=\"88.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"60.0\" y=\"280.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"700\" >preprocessing.c 的判据</text><text x=\"250.0\" y=\"280.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >两个查询相等，或只在常量上不同 → 同一种查询类型；PostgreSQL 的 queryId 用作 query_context.query_hash。</text><text x=\"60.0\" y=\"314.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >这一步决定了「上次的执行反馈能不能迁移到下次」：归一化太松，模型被污染；太紧，学不到东西。</text><text x=\"40.0\" y=\"372.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >注意 README 的限制：临时对象内部 OID 每次不同，即使名字相同也会破坏归一化；动态常量没问题，动态结构有问题。</text><text x=\"40.0\" y=\"398.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#2F7A66\" font-weight=\"600\" >所以固定 SQL 模板 + bind parameter，是 AQO 能不能生效的前提，而不是风格偏好。</text></svg>","ctrl":null},{"eyebrow":"第三章 · 模式","title":"六种模式，就是六条治理边界","lede":"controlled 走白名单，learn 负责训练，intelligent 是自动实验器，forced 有污染风险，frozen 冻结，disabled 关停。","caption":"图 11 · 模式对照。行为描述依据文章 3.2 / 7 节与 postgrespro/aqo README 的 Comments on AQO modes。","bridge":"模式选完，真正的活儿开始了：一次规划里，AQO 是怎么把 clauses 变成一个 rows 的？","notes":"这页值得停下来看仔细，因为生产事故大多出在这里。aqo.mode 一共六个值，我核对过 aqo.c 的 config_enum_entry，确实是 intelligent、forced、controlled、learn、frozen、disabled 六个——README 的正文没单列 frozen，但源码枚举里有，文章的表述是对的。controlled 是生产默认：未知查询直接忽略，走原生估算，只有事先登记在 aqo_queries 里的 query type 才按配置使用，等于白名单。learn 会给新 query type 登记一条记录，默认 learn_aqo 和 use_aqo 都为真，fs 等于 queryid，专门用来训练；但 README 明确说不建议全集群长期开着 learn，因为它会给每一类查询都建模型，连不需要的也建，开销可能超过收益。intelligent 和 learn 类似，区别是默认打开 auto_tuning，让系统自己决定哪些查询值得用；README 的措辞很谨慎——它是「完全自动的尝试」，可能工作得并不好，不推荐生产依赖。forced 不登记 query type，把所有未知查询统一塞进 fs=0 的 COMMON feature space，省内存、能应付动态结构，代价是不相似的查询会互相污染样本。frozen 只用已知模型、不再写入学习结果，适合模型收敛后的稳定期，但分布一变就过期。disabled 是临时关停，数据都保留，做 A/B 特别顺手。一句话：模式不是性能档位，是治理边界。选好了模式，我们进规划期，看一条查询怎么被拆成特征、又怎么变回一个 rows。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40.0\" y=\"26.0\" width=\"150.0\" height=\"46.0\" rx=\"0\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"115.0\" y=\"53.7\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#FFFFFF\" font-weight=\"600\" >aqo.mode</text><rect x=\"190.0\" y=\"26.0\" width=\"250.0\" height=\"46.0\" rx=\"0\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"315.0\" y=\"53.7\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#FFFFFF\" font-weight=\"600\" >遇到未知 query type</text><rect x=\"440.0\" y=\"26.0\" width=\"150.0\" height=\"46.0\" rx=\"0\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"515.0\" y=\"53.7\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#FFFFFF\" font-weight=\"600\" >使用 AQO</text><rect x=\"590.0\" y=\"26.0\" width=\"150.0\" height=\"46.0\" rx=\"0\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"665.0\" y=\"53.7\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#FFFFFF\" font-weight=\"600\" >继续学习</text><rect x=\"740.0\" y=\"26.0\" width=\"620.0\" height=\"46.0\" rx=\"0\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"1050.0\" y=\"53.7\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#FFFFFF\" font-weight=\"600\" >适合用途 / 主要风险</text><rect x=\"40.0\" y=\"72.0\" width=\"150.0\" height=\"46.0\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"115.0\" y=\"99.5\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\" " stroke-width=\"1\"/><text x=\"40.0\" y=\"370.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >六个值来自 aqo.c 的 config_enum_entry（intelligent / forced / controlled / learn / frozen / disabled）；README 未列 frozen，源码里有。</text><text x=\"40.0\" y=\"396.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"600\" >模式就是治理边界：controlled 白名单、learn 训练、intelligent 实验、forced 动态结构试验、frozen 稳定、disabled 关停。</text></svg>","ctrl":null},{"eyebrow":"第三章 · 规划期","title":"从 clauses 到预测 rows：六步与三处回退","lede":"aqo_set_baserel_rows_estimate() 的主路径很直，但每个不确定处都留了「回退原生估算」的出口。","caption":"图 12 · 规划期主路径（上）与三处保守回退（下）。依据文章 3.3 与 aqo/cardinality_hooks.c。","bridge":"路径清楚了，下一个问题更本质：交给模型的那串数字，到底代表什么？","notes":"规划期的主路径主要在 cardinality_hooks.c。对 base relation，aqo_set_baserel_rows_estimate 做六件事：先看当前查询是不是禁用了 AQO，是就直接调原生估算；如果 learn_aqo 或 use_aqo 有一个为真，就调 get_selectivities 取谓词选择率；如果 use_aqo 是 false，只保留学习需要的信息，然后回退原生估算；如果 use_aqo 是 true，才把 clauses、selectivities 和关系签名交给 predict_for_relation；预测值非负，就把 rel->rows 和 rel->predicted_cardinality 改掉；预测失败，回退原生估算。join relation 的 aqo_set_joinrel_size_estimates 逻辑一样，只是要额外组合当前 join clauses、外路径和内路径的 clauses 以及对应的选择率，parameterized 的路径还有单独 hook。我特别想让你看下面这三个陶橙出口：禁用、不用 AQO、预测失败，全部回退。文章把这叫「工程设计比较保守」，我倒觉得这是整个扩展最值得学的部分——模型没样本、样本不足、没有底层 plain table、feature subspace 找不到，它都不硬给答案，而是把决定权交还给 PostgreSQL。这样最坏情况只是「白装了」，不会「被一个错得更离谱的数带进沟里」。好，那 predict_for_relation 拿到的那串数字到底是什么？这就到了特征空间。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40.0\" y=\"56.0\" width=\"248.0\" height=\"92.0\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.4\" /><text x=\"164.0\" y=\"92.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"700\" >① 是否禁用</text><text x=\"164.0\" y=\"122.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >禁用 → 直接原生估算</text><line x
