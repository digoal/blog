"1236.0,208.0 1231.6,200.0 1240.4,200.0\" fill=\"#BE653B\"/><rect x=\"1132.0\" y=\"212.0\" width=\"208.0\" height=\"52.0\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.0\" /><text x=\"1236.0\" y=\"234.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#BE653B\" font-weight=\"600\" >预测为负 / 失败</text><text x=\"1236.0\" y=\"254.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >回退 PostgreSQL 原生估算</text><rect x=\"40.0\" y=\"292.0\" width=\"1320.0\" height=\"70.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"60.0\" y=\"322.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"700\" >保守设计</text><text x=\"190.0\" y=\"322.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >模型无可用样本、样本不足、没有底层 plain table、feature subspace 找不到时，AQO 拒绝预测并回退。</text><text x=\"60.0\" y=\"348.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >join rel 的 aqo_set_joinrel_size_estimates() 逻辑相同，只是要组合 join clauses、outer / inner path clauses 与各自 selectivities。</text><text x=\"40.0\" y=\"396.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#2F7A66\" font-weight=\"600\" >「拒绝预测」比「硬给一个数」重要得多：它保证 AQO 在最坏情况下退化为原生优化器，而不是把计划带沟里。</text></svg>","ctrl":null},{"eyebrow":"第三章 · 特征","title":"fs 装查询类型，fss 装计划对象","lede":"clause_hash、eclass_hash、关系集合 hash 组合成 fss_hash；选择率取对数成为特征向量，真实行数取对数成为目标。","caption":"图 13 · 左侧是 fs 与它内部的多个 fss；右侧是 hash.c 的特征构造。依据文章 3.4 与原文图 3。","bridge":"特征有了，模型就简单了：一个不知道数据库的 kNN 回归器，只负责在矩阵里算距离。","notes":"这一页我要把「AQO 到底学什么」彻底说死，因为它最容易被误解成「记住这条 SQL 用什么计划」。不是的。它学的是：在某个关系集合、某种谓词结构、某组选择率特征之下，真实输出多少行。结构上分两层。上面一层叫 feature space，简称 fs，通常对应一个 query type，也可以几个 query type 共享一个；forced 模式干脆让所有查询共用 fs=0 的 COMMON。下面一层叫 feature subspace，简称 fss，对应一个具体的计划对象——base relation、join relation，或者 group 估算对象。同一条 SQL 内部就会产生好几个 fss，因为每个节点面对的 clauses 和关系集合不一样，训练样本实际是存在 (fs, fss) 这个二元组下面的。hash.c 的 get_fss_for_object 怎么造 fss_hash？给每个 clause 算 clause_hash，把等价类算成 eclass_hash，把 relation signatures 算成关系集合 hash，组合起来；还会对相同 clause hash 的常量条件排序，让特征尽量不受谓词书写顺序影响。特征向量 X 是各选择率取 log，并且用 log_selectivity_lower_bound 做下限截断，避免极端选择率把距离拉飞；训练目标 y 是 log(actual rows)。你看，输入和输出都是对数，这正是后面 exp 回映射的原因。好，特征定义完了，剩下的模型反而朴素得有点意外。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40.0\" y=\"26.0\" width=\"640.0\" height=\"306.0\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.5\" /><text x=\"60.0\" y=\"58.0\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#245A6B\" font-weight=\"700\" >Feature Space · fs</text><text x=\"60.0\" y=\"82.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >fs = query_hash；forced 模式下所有查询共用 fs = 0 COMMON</text><rect x=\"62.0\" y=\"104.0\" width=\"188.0\" height=\"132.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"156.0\" y=\"132.0\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"700\" >fss 1</text><text x=\"156.0\" y=\"160.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"600\" >base relation</text><line x1=\"78.0\" y1=\"176.0\" x2=\"234.0\" y2=\"176.0\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"156.0\" y=\"200.0\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >matrix + targets</text><text x=\"156.0\" y=\"222.0\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"11.0\" fill=\"#89938F\" font-weight=\"400\" >reliability · oids</text><rect x=\"266.0\" y=\"104.0\" width=\"188.0\" height=\"132.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"360.0\" y=\"132.0\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"700\" >fss 2</text><text x=\"360.0\" y=\"160.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"600\" >join relation</text><line x1=\"282.0\" y1=\"176.0\" x2=\"438.0\" y2=\"176.0\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"360.0\" y=\"200.0\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >matrix + targets</text><text x=\"360.0\" y=\"222.0\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"11.0\" fill=\"#89938F\" font-weight=\"400\" >reliability · oids</text><rect x=\"470.0\" y=\"104.0\" width=\"188.0\" height=\"132.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"564.0\" y=\"132.0\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"700\" >fss 3</text><text x=\"564.0\" y=\"160.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"600\" >group 估算</text><line x1=\"486.0\" y1=\"176.0\" x2=\"642.0\" y2=\"176.0\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"564.0\" y=\"200.0\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >matrix + targets</text><text x=\"564.0\" y=\"222.0\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"11.0\" fill=\"#89938F\" font-weight=\"400\" >reliability · oids</text><text x=\"60.0\" y=\"266.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >同一条 SQL 内会产生多个 fss：每个 base / join / agg 节点的 clauses 不同。</text><text x=\"60.0\" y=\"296.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#245A6B\" font-weight=\"600\" >训练样本实际存放在 (fs, fss) 下面，而不是「一条 SQL 一个模型」。</text><rect x=\"720.0\" y=\"26.0\" width=\"640.0\" height=\"306.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><rect x=\"720.0\" y=\"26.0\" width=\"640.0\" height=\"42.0\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1\" /><text x=\"740.0\" y=\"54.0\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#BE653B\" font-weight=\"700\" >hash.c：get_fss_for_object() 怎么算 fss_hash</text><rect x=\"740.0\" y=\"82.0\" width=\"600.0\" height=\"36.0\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"754.0\" y=\"105.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"700\" >clause_hash</text><text x=\"930.0\" y=\"105.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >每个 clause 单独哈希</text><rect x=\"740.0\" y=\"126.0\" width=\"600.0\" height=\"36.0\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"754.0\" y=\"149.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"700\" >eclass_hash</text><text x=\"930.0\" y=\"149.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >等价类参与组合</text><rect x=\"740.0\" y=\"170.0\" width=\"600.0\" height=\"36.0\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"754.0\" y=\"193.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"700\" >relation hash</text><text x=\"930.0\" y=\"193.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >关系集合的 signatures</text><rect x=\"740.0\" y=\"214.0\" width=\"600.0\" height=\"36.0\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"754.0\" y=\"237.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"700\" >排序</text><text x=\"930.0\" y=\"237.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >同 clause hash 的常量条件排序，去掉谓词顺序影响</text><line x1=\"740.0\" y1=\"262.0\" x2=\"1340.0\" y2=\"262.0\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"740.0\" y=\"290.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#BE653B\" font-weight=\"700\" >特征向量 X</text><text x=\"880.0\" y=\"290.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >log(selectivity)，用 log_selectivity_lower_bound 做下限截断</text><text x=\"740.0\" y=\"316.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#2F7A66\" font-weight=\"700\" >训练目标 y</text><text x=\"880.0\" y=\"316.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >log(actual rows)，来自执行期采集</text><text x=\"40.0\" y=\"366.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >两层：fs 通常对应 query type，也可以多个 query type 共享；fss 对应一个具体的 plan object。</text><text x=\"40.0\" y=\"396.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"600\" >所以 AQO 学的不是「这条 SQL 该用 Hash Join」，而是「这个关系集合 + 谓词结构 + 选择率特征下，真实输出多少行」。</text></svg>","ctrl":null},{"eyebrow":"第三章 · 模型","title":"OkNN：一个只玩矩阵的 kNN 回归器","lede":"L2 距离挑近邻、1/(0.001+d) 加权、预测 log(rows) 再 exp 回去；学习时用 0.1 的学习率平滑或追加样本。","caption":"图 14 · 左：近邻示意（连线为正交虚线）；右：预测 / 学习 / 源码核对到的常量。依据文章 3.5 与 machine_learning.c。","bridge":"模型会预测了，还差最后半环：真实行数从哪儿来、怎么被采进模型？","notes":"machine_learning.c 开头有句很可爱的话：这个模块不知道 DBMS、不知道 cardinality，它学矩阵、做预测、做学习，并且挺快乐。它实现的是一个有限样本的 kNN 回归变体。预测过程可以压成五步：输入特征向量，也就是一串 log(selectivity)；读当前 (fs, fss) 下的训练矩阵和 targets；算到每个历史样本的 L2 距离；挑最近的 aqo_k 个；按 weight 等于 1 除以 0.001 加距离加权平均，得到 y_hat，再 exp 回行数。我核对了 master 分支的源码，fs_similarity 就是 1.0/(0.001+dist)，预测函数返回负值代表拒绝预测，和文章一致。学习过程是：target 等于 log(actual rows)；如果新样本和已有某行距离小于 object_selection_threshold，也就是 0.1，就不新增行，用 learning_rate 做线性平滑——源码里这个值是 1e-1，而且实际学习率还要乘 rfactor 再除以已有行的 reliability；否则如果矩阵还没到 aqo_K 就追加一行，到上限了就调整近邻，保证矩阵规模不膨胀。这个设计的好处很实在：低开销、增量式、容易塞进共享内存，还能解释——你能查到 fss、样本和误差。代价也很实在：它只认局部相似性，不会从全局 SQL 语义里推理。workload 结构一漂移、数据分布一突变、样本太少或者 query type 太散，泛化就无从谈起。所以别把它想成「大模型进了优化器」，它更像一本按特征分好类、越记越准的账本。还差最后半环：账本里的真实行数从哪儿来？","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40.0\" y=\"26.0\" width=\"660.0\" height=\"342.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"60.0\" y=\"54.0\" class=\"sv serif\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"700\" >特征平面示意：新样本找最近的 k 个历史样本</text><line x1=\"90.0\" y1=\"320.0\" x2=\"660.0\" y2=\"320.0\" stroke=\"#245A6B\" stroke-width=\"1.4\"/><line x1=\"90.0\" y1=\"90.0\" x2=\"90.0\" y2=\"320.0\" stroke=\"#245A6B\" stroke-width=\"1.4\"/><text x=\"650.0\" y=\"340.0\" class=\"sv mono\" text-anchor=\"end\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"400\" >log(sel_1)</text><text x=\"66.0\" y=\"82.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"400\" >log(sel_2)</text><circle cx=\"180.0\" cy=\"270.0\" r=\"7.0\" fill=\"#7BA6AF\" stroke=\"#FFFFFF\" stroke-width=\"1.3\" /><circle cx=\"250.0\" cy=\"200.0\" r=\"7.0\" fill=\"#BE653B\" stroke=\"#FFFFFF\" stroke-width=\"1.3\" /><circle cx=\"330.0\" cy=\"160.0\" r=\"7.0\" fill=\"#BE653B\" stroke=\"#FFFFFF\" stroke-width=\"1.3\" /><circle cx=\"420.0\" cy=\"240.0\" r=\"7.0\" fill=\"#BE653B\" stroke=\"#FFFFFF\" stroke-width=\"1.3\" /><circle cx=\"520.0\" cy=\"130.0\" r=\"7.0\" fill=\"#7BA6AF\" stroke=\"#FFFFFF\" stroke-width=\"1.3\" /><circle cx=\"560.0\" cy=\"285.0\" r=\"7.0\" fill=\"#7BA6AF\" stroke=\"#FFFFFF\" stroke-width=\"1.3\" /><circle cx=\"610.0\" cy=\"195.0\" r=\"7.0\" fill=\"#7BA6AF\" stroke=\"#FFFFFF\" stroke-width=\"1.3\" /><circle cx=\"350.0\" cy=\"215.0\" r=\"9.0\" fill=\"#2F7A66\" stroke=\"#FFFFFF\" stroke-width=\"2\" /><text x=\"366.0\" y=\"205.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#2F7A66\" font-weight=\"700\" >新样本 X</text><line x1=\"350.0\" y1=\"215.0\" x2=\"250.0\" y2=\"215.0\" stroke=\"#BE653B\" stroke-width=\"1.2\" stroke-dasharray=\"4 4\"/><line x1=\"250.0\" y1=\"215.0\" x2=\"250.0\" y2=\"200.0\" stroke=\"#BE653B\" stroke-width=\"1.2\" stroke-dasharray=\"4 4\"/><line x1=\"350.0\" y1=\"215.0\" x2=\"330.0\" y2=\"215.0\" stroke=\"#BE653B\" stroke-width=\"1.2\" stroke-dasharray=\"4 4\"/><line x1=\"330.0\" y1=\"215.0\" x2=\"330.0\" y2=\"160.0\" stroke=\"#BE653B\" stroke-width=\"1.2\" stroke-dasharray=\"4 4\"/><line x1=\"350.0\" y1=\"215.0\" x2=\"420.0\" y2=\"215.0\" stroke=\"#BE653B\" stroke-width=\"1.2\" stroke-dasharray=\"4 4\"/><line x1=\"420.0\" y1=\"215.0\" x2=\"420.0\" y2=\"240.0\" stroke=\"#BE653B\" stroke-width=\"1.2\" stroke-dasharray=\"4 4\"/><text x=\"60.0\" y=\"356.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >距离为 L2；权重 weight = 1 / (0.001 + distance)。</text><rect x=\"720.0\" y=\"26.0\" width=\"640.0\" height=\"342.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"740.0\" y=\"56.0\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" >machine_learning.c：只玩矩阵，不懂 DBMS</text><rect x=\"740.0\" y=\"72.0\" width=\"600.0\" height=\"78.0\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"756.0\" y=\"96.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"700\" >预测</text><text x=\"756.0\" y=\"120.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" >y_hat = Σ (target_i × w_i) / Σ w_i　→　rows = exp(y_hat)</text><text x=\"756.0\" y=\"140.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >取最近 aqo_k 个样本加权平均；返回负值表示拒绝预测</text><rect x=\"740.0\" y=\"160.0\" width=\"600.0\" height=\"92.0\" rx=\"2\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.0\" /><text x=\"756.0\" y=\"184.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#2F7A66\" font-weight=\"700\" >学习</text><text x=\"756.0\" y=\"208.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" >target = log(actual rows)</text><text x=\"756.0\" y=\"230.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >距离 &lt; 0.1：用 learning_rate 平滑更新该行</text><text x=\"756.0\" y=\"246.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >否则样本未满：追加一行；满了：调整近邻</text><rect x=\"740.0\" y=\"262.0\" width=\"600.0\" height=\"92.0\" rx=\"2\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.0\" /><text x=\"756.0\" y=\"286.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#AE8A3E\" font-weight=\"700\" >源码实证（postgrespro/aqo master）</text><text x=\"756.0\" y=\"310.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >object_selection_threshold = 0.1　learning_rate = 1e-1</text><text x=\"756.0\" y=\"332.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >fs_similarity：1.0 / (0.001 + dist)；矩阵行数不超过 aqo_K</text><text x=\"756.0\" y=\"350.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"400\" >rfactor：1.0 完整 / 0.9 部分语句 / 0.1 部分节点</text><text x=\"40.0\" y=\"392.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >优势：低开销、增量式、易与共享内存结合；代价：依赖局部相似性，workload 漂移或样本太少时难以泛化。</text></svg>","ctrl":null},{"eyebrow":"第三章 · 反馈","title":"学习发生在执行之后","lede":"打开 INSTRUMENT_ROWS，遍历 PlanState 读 ntuples / nloops，把 learn_rows 取对数写回 (fs, fss)。","caption":"图 15 · 左：PlanState 树与 instrumentation；中：采集字段；右：样本生成链。依据文章 3.6 与 postprocessing.c。","bridge":"闭环已经接上了。与其再讲一遍，不如让它当着你的面跑一轮——下一页可以自己调参数。","notes":"最后半环在执行之后，由 postprocessing.c 负责。在 aqo_ExecutorStart 里，如果当前查询需要 AQO、需要学习或者被要求强制采集统计，它会把 queryDesc 的 instrument_options 加上 INSTRUMENT_ROWS。执行结束后遍历 PlanState 树，learnOnPlanState 读每个节点的 ntuples、nloops、并行 worker 的 instrumentation、节点是不是从没执行过，以及 AQO 当时的预测值或原生的 plan_rows。然后把真实行数转成样本：learn_rows 等于 ntuples 除以 nloops——因为 Nested Loop 的内表可能被执行很多轮，不除就会把总量当成单轮输出；再取 log 得到 target，写回 (fs, fss) 下的矩阵。这里有个细节特别见工程功力：如果这次是 statement timeout 里的部分执行，AQO 会降低可靠性因子 rfactor，避免低可信样本强行覆盖完整执行的样本。源码注释里三档写得很清楚，1 是查询正常结束，0.1 是部分执行的节点，0.9 是节点跑完但语句被中断。还有一个常见坑也在这层：EXPLAIN 不带 ANALYZE 是学不到东西的，因为 ExecutorStart 会区分 EXEC_FLAG_EXPLAIN_ONLY，没有真实执行就没有可靠的 actual rows。到这儿闭环合上了：规划期预测，执行期采集，后处理写回，下次规划再读。光讲链条还是有点抽象，下一页我们让它当着你的面跑一遍，参数你自己调。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40.0\" y=\"26.0\" width=\"460.0\" height=\"306.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><rect x=\"40.0\" y=\"26.0\" width=\"460.0\" height=\"42.0\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"60.0\" y=\"54.0\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" >执行后遍历 PlanState 树</text><rect x=\"170.0\" y=\"84.0\" width=\"220.0\" height=\"44.0\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"280.0\" y=\"112.0\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"600\" >Result</text><rect x=\"140.0\" y=\"150.0\" width=\"280.0\" height=\"44.0\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"280.0\" y=\"178.0\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"600\" >Hash Join</text><rect x=\"90.0\" y=\"216.0\" width=\"180.0\" height=\"44.0\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"180.0\" y=\"244.0\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"600\" >Seq Scan · orders</text><rect x=\"290.0\" y=\"216.0\" width=\"210.0\" height=\"44.0\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"395.0\" y=\"244.0\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"600\" >Index Scan · items</text><line x1=\" e-width=\"1.0\" /><text x=\"1165.0\" y=\"210.0\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"600\" >target = log(learn_rows)</text><line x1=\"1165.0\" y1=\"242.0\" x2=\"1165.0\" y2=\"261.6\" stroke=\"#2F7A66\" stroke-width=\"1.8\"/><polygon points=\"1165.0,268.0 1160.6,260.0 1169.4,260.0\" fill=\"#2F7A66\"/><rect x=\"990.0\" y=\"274.0\" width=\"350.0\" height=\"44.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"1165.0\" y=\"302.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#2F7A66\" font-weight=\"600\" >写回 (fs, fss) 的 matrix / targets</text><text x=\"40.0\" y=\"358.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#BE653B\" font-weight=\"600\" >EXPLAIN ONLY 不能学习：aqo_ExecutorStart() 会区分 EXEC_FLAG_EXPLAIN_ONLY，只有真实执行并采集 INSTRUMENT_ROWS 才有可靠 actual rows。</text><text x=\"40.0\" y=\"390.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >这条「执行 → 采集 → 写回」的线，才是 AQO 名字里 adaptive 的来源；没有它，前面所有预测都只是静态统计的另一种写法。</text></svg>","ctrl":null},{"eyebrow":"第三章 · 演示","title":"让学习闭环跑一遍（可输入 · 可播放）","lede":"调真实行数、模式、可靠性与学习率，看预测 rows 怎样一轮轮贴近真实值，以及模型过期时会发生什么。","caption":"","bridge":"跑完一轮就明白：闭环要长期可靠，靠的是存储、自动调优和治理，而不是模型本身。","notes":"这一页请自己动手。左边是一到八轮的重复执行，深靛青阶梯是实际行数，青绿阶梯是 AQO 预测，陶橙虚线是原生估计恒定的一行。右边是当前轮的状态卡。默认 learn 模式、真实一万行、rfactor 一点零、学习率用零点五的演示档——按播放，你会看到第一轮没有样本，AQO 直接回退到原生估算，计划还是 Nested Loop；执行完采到真实行数写回模型，从第二轮起预测开始往上爬，几轮之后进入同一数量级，计划才有机会切到 Hash Join。现在改几个输入试试。把 rfactor 调到零点一，模拟 timeout 里只拿到部分执行数据，学习率被乘小，收敛立刻变慢——这就是源码里降 reliability 的意义。把模式换成 disabled，全程没有反馈，预测永远停在原生估计。换成 frozen，第五轮起不再写学习结果，曲线就此僵住。最有意思的是 drift：第五轮数据分布突变，实际行数跳到十万，可模型还记着旧分布，预测滞后、误差回升、计划又退回 Nested Loop；若继续学习，它要几轮才能追上，若刚好冻结，就一直错下去。我必须把话说清楚：这是机制示意推演，不是 benchmark 实测。数字由页面里这个简化模型算出来，公式对应源码的线性平滑，零点一是源码 learning_rate，零点五是为了在八轮内看清收敛方向而放的加速档；计划切换阈值纯属示意，真实环境里换不换计划，始终由 PostgreSQL 的 cost model 决定。跑完这一轮你会发现，闭环能不能长期可靠，靠的不是这个 kNN 有多聪明，而是后面三件事：知识库怎么存、系统怎么决定还要不要继续信它、以及人怎么管它。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><g id=\"animHost\"></g><line x1=\"40.0\" y1=\"384.0\" x2=\"880.0\" y2=\"384.0\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"40.0\" y=\"400.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.0\" fill=\"#89938F\" font-weight=\"400\" >青绿＝AQO 预测 · 深靛＝真实执行 · 陶橙虚线＝原生估计　｜　示意推演，非 benchmark 实测</text><text x=\"40.0\" y=\"418.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.0\" fill=\"#89938F\" font-weight=\"400\" >按源码线性平滑 target += lr·(target − y)，lr = 学习率 × rfactor；0.1 源码值 / 0.5 演示档；计划切换为示意阈值，真实由 cost model 决定。</text></svg>","ctrl":"<label>真实行数</label><select id=\"aActual\"><option value=\"100\">100</option><option value=\"1000\">1,000</option><option value=\"10000\" selected>10,000</option><option value=\"100000\">100,000</option></select><label>模式</label><select id=\"aMode\"><option value=\"learn\">learn 学习闭环</option><option value=\"disabled\">disabled 关闭</option><option value=\"frozen\">frozen 第5轮冻结</option><option value=\"drift\">drift 分布突变</option></select><label>rfactor</label><select id=\"aRf\"><option value=\"1\">1.0 完整</option><option value=\"0.9\">0.9 部分语句</option><option value=\"0.1\">0.1 部分节点</option></select><label>学习率</label><select id=\"aLr\"><option value=\"0.5\" selected>0.5 演示</option><option value=\"0.1\">0.1 源码</option></select><button class=\"btn play\" id=\"aPlay\">▶ 播放</button><button class=\"btn\" id=\"aTick\">单步</button><button class=\"btn\" id=\"aReset\">↺ 重置</button><span class=\"out\" id=\"aOut\"></span>"},{"eyebrow":"第四章 · 存储","title":"知识库放在共享内存，不放在系统表里","lede":"四类 Entry、四个 .stat 文件、SQL 视图；这也是生产上最需要盯住容量的一层。","caption":"图 17 · 左：storage.h 结构体；右：持久化文件与共享内存；底部：膨胀风险与容量上限参数。","bridge":"存得下还得管得住：系统凭什么决定「还要不要继续相信 AQO」？","notes":"模型学完总得有个地方放。AQO 的知识库不是普通系统表，它在共享内存和持久化文件里，再通过 SQL 函数和视图露出来。storage.h 里四类结构各管一件事：QueriesEntry 存每个 query type 的 fs、learn_aqo、use_aqo、auto_tuning，也就是治理开关；QueryTextEntry 存 queryid 到 query text 的映射，方便你排查；StatEntry 存有无 AQO 的执行时间、规划时间和估算误差，是自动调优的依据；DataEntry 才是真正的模型，(fs, fss) 对应的特征矩阵、targets、reliability 和 oids。storage.c 里能看到四个持久化文件：pgaqo_statistics.stat、pgaqo_query_texts.stat、pgaqo_data.stat、pgaqo_queries.stat。这一层直接决定了生产治理的重点：AQO 会消耗共享内存和动态共享区域，query type 太多、feature subspace 太多、动态 SQL 结构太散，知识库就会膨胀。所以 DBA 要盯 aqo_query_stat、aqo_data、aqo_queries 的规模。我核对 master 分支的 aqo.c 时还看到几个现成的闸门：aqo.fs_max_items 默认一万，aqo.fss_max_items 默认十万，aqo.dsm_size_max 限制学习数据能申请的动态共享内存。这些参数文章没展开，但正好印证「膨胀是设计者早就预料到的问题」。存得下只是第一步，更关键的是：系统凭什么决定还要不要继续信这个模型？","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><text x=\"40.0\" y=\"28.0\" class=\"sv serif\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"700\" >知识库不是系统表本体：共享内存 + 持久化文件，再通过 SQL 函数 / 视图暴露</text><rect x=\"40.0\" y=\"48.0\" width=\"200.0\" height=\"52.0\" rx=\"0\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"140.0\" y=\"78.5\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#FFFFFF\" font-weight=\"600\" >storage.h 核心结构</text><rect x=\"240.0\" y=\"48.0\" width=\"480.0\" height=\"52.0\" rx=\"0\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"480.0\" y=\"78.5\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#FFFFFF\" font-weight=\"600\" >含义</text><rect x=\"40.0\" y=\"100.0\" width=\"200.0\" height=\"52.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"140.0\" y=\"130.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"600\" >QueriesEntry</text><rect x=\"240.0\" y=\"100.0\" width=\"480.0\" height=\"52.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"252.0\" y=\"130.4\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >每个 query type 的 fs、learn_aqo、use_aqo、auto_tuning</text><rect x=\"40.0\" y=\"152.0\" width=\"200.0\" height=\"52.0\" rx= =\"12.5\" fill=\"#BE653B\" font-weight=\"600\" >共享内存 + 动态共享区域（DSA）承载模型数据</text><text x=\"780.0\" y=\"348.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" >实例级资源，需在启动时申请</text><rect x=\"40.0\" y=\"322.0\" width=\"680.0\" height=\"76.0\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\" /><text x=\"60.0\" y=\"350.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"700\" >膨胀风险</text><text x=\"60.0\" y=\"378.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >query type 太多、fss 太多、动态 SQL 结构太散 → 知识库膨胀</text><text x=\"40.0\" y=\"414.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >治理动作：监控 aqo_query_stat / aqo_data / aqo_queries 的规模；master 分支另有 aqo.fs_max_items、aqo.fss_max_items、aqo.dsm_size_max 上限。</text></svg>","ctrl":null},{"eyebrow":"第四章 · 调优","title":"自动调优：不是永远相信 AQO","lede":"先基线、再启用、看收敛、比表现，最后按探索概率决定继续或关停；超最大迭代仍不值得就全关。","caption":"图 18 · auto_tuning.c 的简化策略；底部为 aqo.c 中核对到的调优参数常量。","bridge":"机制和治理都讲完了，该把它放到整个基数估算的坐标系里比一比。","notes":"auto_tuning.c 的策略，最值得学的是它的态度：不永远相信 AQO。新 query type 先跑若干次不用 AQO，收集一个 baseline；然后启用 use_aqo 和 learn_aqo，直到 cardinality quality 收敛；接着比较 AQO 和非 AQO 的规划加执行时间，同时看估算误差有没有变小；如果 AQO 更好就倾向继续用，更差就倾向关闭；超过最大迭代还不值得用，就把 auto_tuning、learn_aqo、use_aqo 三个都关掉，彻底放手。我在 aqo.c 里核对到这几个常量：window_size 是 5，exploration 是 0.1，max_iterations 是 50，infinite_loop 是 8——所以它确实是一个带探索概率、带窗口、带终止条件的自动实验器，不是玄学。这也解释了为什么 README 对 intelligent 模式那么保守：它想把这个实验器全交给系统自动跑，但「可能仍然工作得不太好」，不推荐生产完全依赖。这里我想推一句：既然设计者自己都留了关停逻辑，那「上线后就不管了」和「全库长期开 learn」都是对这套机制的误读。AQO 的常态应该是受控的、被观察的、随时能退回原生优化器的。到这儿机制闭环完整了，我们把它放回整个基数估算的坐标系里，横向比一比。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40.0\" y=\"40.0\" width=\"420.0\" height=\"100.0\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\" /><text x=\"58.0\" y=\"74.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"700\" >①</text><text x=\"92.0\" y=\"74.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"700\" >新 query type</text><line x1=\"58.0\" y1=\"88.0\" x2=\"442.0\" y2=\"88.0\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"58.0\" y=\"116.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >先跑若干次不用 AQO，收集 baseline</text><line x1=\"460.0\" y1=\"90.0\" x2=\"484.4\" y2=\"90.0\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"490.0,90.0 483.0,86.2 483.0,93.8\" fill=\"#245A6B\"/><rect x=\"490.0\" y=\"40.0\" width=\"420.0\" height=\"100.0\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\" /><text x=\"508.0\" y=\"74.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"700\" >②</text><text x=\"542.0\" y=\"74.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"700\" >启用 AQO</text><line x1=\"508.0\" y1=\"88.0\" x2=\"892.0\" y2=\"88.0\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"508.0\" y=\"116.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >use_aqo = true，learn_aqo = true</text><line x1=\"910.0\" y1=\"90.0\" x2=\"934.4\" y2=\"90.0\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"940.0,90.0 933.0,86.2 933.0,93.8\" fill=\"#245A6B\"/><rect x=\"940.0\" y=\"40.0\" width=\"420.0\" height=\"100.0\" rx=\"3\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.2\" /><text x=\"958.0\" y=\"74.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#AE8A3E\" font-weight=\"700\" >③</text><text x=\"992.0\" y=\"74.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"700\" >观察收敛</text><line x1=\"958.0\" y1=\"88.0\" x2=\"1342.0\" y2=\"88.0\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"958.0\" y=\"116.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >cardinality quality 是否稳定</text><rect x=\"40.0\" y=\"168.0\" width=\"420.0\" height=\"100.0\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\" /><text x=\"58.0\" y=\"202.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"700\" >④</text><text x=\"92.0\" y=\"202.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"700\" >比较表现</text><line x1=\"58.0\" y1=\"216.0\" x2=\"442.0\" y2=\"216.0\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"58.0\" y=\"244.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >AQO vs 非 AQO 的规划 + 执行时间</text><line x1=\"460.0\" y1=\"218.0\" x2=\"484.4\" y2=\"218.0\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"490.0,218.0 483.0,214.2 483.0,221.8\" fill=\"#245A6B\"/><rect x=\"490.0\" y=\"168.0\" width=\"420.0\" height=\"100.0\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\" /><text x=\"508.0\" y=\"202.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#2F7A66\" font-weight=\"700\" >⑤</text><text x=\"542.0\" y=\"202.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"700\" >倾向决定</text><line x1=\"508.0\" y1=\"216.0\" x2=\"892.0\" y2=\"216.0\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"508.0\" y=\"244.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >更好就继续用；更差就倾向关闭</text><line x1=\"910.0\" y1=\"218.0\" x2=\"934.4\" y2=\"218.0\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"940.0,218.0 933.0,214.2 933.0,221.8\" fill=\"#245A6B\"/><rect x=\"940.0\" y=\"168.0\" width=\"420.0\" height=\"100.0\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\" /><text x=\"958.0\" y=\"202.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"700\" >⑥</text><text x=\"992.0\" y=\"202.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"700\" >超限关停</text><line x1=\"958.0\" y1=\"216.0\" x2=\"1342.0\" y2=\"216.0\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"958.0\" y=\"244.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >auto_tuning / learn / use 三者全关</text><line x1=\"1360.0\" y1=\"218.0\" x2=\"1388.0\" y2=\"218.0\" stroke=\"#AE8A3E\" stroke-width=\"1.6\"/><line x1=\"1388.0\" y1=\"218.0\" x2=\"1388.0\" y2=\"288.0\" stroke=\"#AE8A3E\" stroke-width=\"1.6\"/><line x1=\"1388.0\" y1=\"288.0\" x2=\"20.0\" y2=\"288.0\" stroke=\"#AE8A3E\" stroke-width=\"1.6\"/><line x1=\"20.0\" y1=\"288.0\" x2=\"20.0\" y2=\"90.0\" stroke=\"#AE8A3E\" stroke-width=\"1.6\"/><line x1=\"20.0\" y1=\"90.0\" x2=\"33.6\" y2=\"90.0\" stroke=\"#AE8A3E\" stroke-width=\"1.6\"/><polygon points=\"40.0,90.0 32.0,85.6 32.0,94.4\" fill=\"#AE8A3E\"/><text x=\"700.0\" y=\"310.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#AE8A3E\" font-weight=\"600\" >按探索概率决定下一次是否继续使用 AQO</text><rect x=\"40.0\" y=\"326.0\" width=\"1320.0\" height=\"64.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"60.0\" y=\"350.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"700\" >源码核对（aqo.c）</text><text x=\"220.0\" y=\"350.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >auto_tuning_window_size = 5　·　exploration = 0.1　·　max_iterations = 50　·　infinite_loop = 8</text><text x=\"60.0\" y=\"376.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#BE653B\" font-weight=\"600\" >intelligent 不是「生产无脑开关」，而是一个带探索概率的自动实验器；README 明确说它可能工作得并不好，不推荐生产完全依赖。</text><text x=\"40.0\" y=\"412.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >推论：既然系统会主动关掉不划算的 query type，那么「上线后不管」和「全库长期 learn」都是对这套机制的误读。</text></svg>","ctrl":null},{"eyebrow":"第四章 · 坐标","title":"AQO 不替代 ANALYZE，也不替代扩展统计","lede":"四条路线各有目标、训练来源与风险；AQO 的位置是「前两层都试过之后，仍长期误估的重复模板」。","caption":"图 19 · 依据文章「四、横向对比」表浓缩；底部三步骤是文章给出的推荐顺序。","bridge":"坐标定好了，就能诚实地谈效果：什么时候真赚，什么时候白忙，什么时候反亏。","notes":"这张表我建议记底部那一行就够了。原生统计估算靠 catalog 和选择率函数，训练来源是 ANALYZE 采样，对重复 workload 依赖低，对动态结构友好，风险是相关性和倾斜估不准。扩展统计补的是多列相关、MCV、ndistinct 和函数依赖，训练来源是 CREATE STATISTICS 加 ANALYZE，但它覆盖范围有限，建多了也管不过来。AQO 的 kNN 不一样，它的训练来源是真实执行时每个 plan node 的 rows，所以高度依赖重复 workload，对动态 SQL 结构不友好——learn 和 intelligent 会不断登记新类型，forced 能试但风险更高；它的额外开销在规划期查模型和预测、学习期 instrumentation 与写模型；风险是模型过期、样本污染、内存膨胀。最右边是神经网络 AQO 或 Learned CE，目标是用更强的模型学复杂分布和泛化，但训练成本、过拟合和工程复杂度都上去了，FOSDEM 2021 把它当作潜在改进方向介绍——请注意，本地这份 aqo 源码实现的是 kNN 变体，不是神经网络 AQO，文章也没把它当成当前行为。所以合理的顺序是三步：先保证表统计新鲜，再对明显多列相关的业务谓词建扩展统计，最后，对仍然长期误估、重复出现、执行成本高的 SQL 模板，才考虑 AQO。把 AQO 放在第三位，不是因为它弱，是因为它的成本结构决定了它只该用在最值得的那几条查询上。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40.0\" y=\"26.0\" width=\"180.0\" height=\"42.0\" rx=\"0\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"130.0\" y=\"51.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#FFFFFF\" font-weight=\"600\" >维度</text><rect x=\"220.0\" y=\"26.0\" width=\"270.0\" height=\"42.0\" rx=\"0\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"355.0\" y=\"51.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#FFFFFF\" font-weight=\"600\" >原生统计估算</text><rect x=\"490.0\" y=\"26.0\" width=\"280.0\" height=\"42.0\" rx=\"0\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"630.0\" y=\"51.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#FFFFFF\" font-weight=\"600\" >扩展统计</text><rect x=\"770.0\" y=\"26.0\" width=\"300.0\" height=\"42.0\" rx=\"0\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"920.0\" y=\"51.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#FFFFFF\" font-weight=\"600\" >AQO · kNN</text><rect x=\"1070.0\" y=\"26.0\" width=\"290.0\" height=\"42.0\" rx=\"0\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"1215.0\" y=\"51.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#FFFFFF\" font-weight=\"600\" >神经网络 AQO / Learned CE</text><rect x=\"40.0\" y=\"68.0\" width=\"180.0\" height=\"42.0\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"130.0\" y=\"93.1\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.8\" fill=\"#1B2B33\" font-weight=\"600\" >主要目标</text><rect x=\"220.0\" y=\"68.0\" width=\"270.0\" height=\"42.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"355.0\" y=\"93.1\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.8\" fill=\"#46585F\" font-weight=\"400\" >catalog 统计 + 选择率函数估 rows</text><rect x=\"490.0\" y=\"68.0\" width=\"280.0\" height=\"42.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"630.0\" y=\"93.1\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.8\" fill=\"#46585F\" font-weight=\"400\" >捕捉多列相关性 / MCV / ndistinct</text><rect x=\"770.0\" y=\"68.0\" width=\"300.0\" height=\"42.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"920.0\" y=\"93.1\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.8\" fill=\"#46585F\" font-weight=\"400\" >历史反馈修正相似查询的 rows</text><rect x=\"1070.0\" y=\"68.0\" width=\"290.0\" height=\"42.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"1215.0\" y=\"93.1\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.8\" fill=\"#46585F\" font-weight=\"400\" >更强模型学复杂分布与泛化</text><rect x=\"40.0\" y=\"110.0\" width=\"180.0\" height=\"42.0\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"130.0\" y=\"135.1\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.8\" fill=\"#1B2B33\" font-weight=\"600\" >训练来源</text><rect x=\"220.0\" y=\"110.0\" width=\"270.0\" height=\"42.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"355.0\" y=\"135.1\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.8\" fill=\"#46585F\" font-weight=\"400\" >ANALYZE 采样</text><rect x=\"490.0\" y=\"110.0\" width=\"280.0\" height=\"42.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"630.0\" y=\"135.1\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.8\" fill=\"#46585F\" font-weight=\"400\" >CREATE STATISTICS + ANALYZE</text><rect x=\"770.0\" y=\"110.0\" width=\"300.0\" height=\"42.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"920.0\" y=\"135.1\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.8\" fill=\"#46585F\" font-weight=\"400\" >真实执行的 plan node rows</text><rect x=\"1070.0\" y=\"110.0\" width=\"290.0\" height=\"42.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"1215.0\" y=\"135.1\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.8\" fill=\"#46585F\" font-weight=\"400\" >离线或在线训练数据</text><rect x=\"40.0\" y=\"152.0\" width=\"180.0\" height=\"42.0\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"130.0\" y=\"177.1\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.8\" fill=\"#1B2B33\" font-weight=\"600\" >生效层次</text><rect x=\"220.0\" y=\"152.0\" width=\"270.0\" height=\"42.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"355.0\" y=\"177.1\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.8\" fill=\"#46585F\" font-weight=\"400\" >base / join / group</text><rect x=\"490.0\" y=\"152.0\" width=\"280.0\" height=\"42.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"630.0\" y=\"177.1\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.8\" fill=\"#46585F\" font-weight=\"400\" >多列条件与 group 估计</text><rect x=\"770.0\" y=\"152.0\" width=\"300.0\" height=\"42.0\" r s\" text-anchor=\"middle\" font-size=\"11.8\" fill=\"#1B2B33\" font-weight=\"600\" >动态 SQL 结构</text><rect x=\"220.0\" y=\"236.0\" width=\"270.0\" height=\"42.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"355.0\" y=\"261.1\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.8\" fill=\"#46585F\" font-weight=\"400\" >友好</text><rect x=\"490.0\" y=\"236.0\" width=\"280.0\" height=\"42.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"630.0\" y=\"261.1\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.8\" fill=\"#46585F\" font-weight=\"400\" >友好</text><rect x=\"770.0\" y=\"236.0\" width=\"300.0\" height=\"42.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"920.0\" y=\"261.1\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.8\" fill=\"#46585F\" font-weight=\"400\" >learn / intelligent 不友好</text><rect x=\"1070.0\" y=\"236.0\" width=\"290.0\" height=\"42.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"1215.0\" y=\"261.1\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.8\" fill=\"#46585F\" font-weight=\"400\" >取决于模型</text><rect x=\"40.0\" y=\"278.0\" width=\"180.0\" height=\"42.0\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"130.0\" y=\"303.1\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.8\" fill=\"#1B2B33\" font-weight=\"600\" >额外开销</text><rect x=\"220.0\" y=\"278.0\" width=\"270.0\" height=\"42.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"355.0\" y=\"303.1\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.8\" fill=\"#46585F\" font-weight=\"400\" >低到中</text><rect x=\"490.0\" y=\"278.0\" width=\"280.0\" height=\"42.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"630.0\" y=\"303.1\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.8\" fill=\"#46585F\" font-weight=\"400\" >中</text><rect x=\"770.0\" y=\"278.0\" width=\"300.0\" height=\"42.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"920.0\" y=\"303.1\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.8\" fill=\"#46585F\" font-weight=\"400\" >规划查模型 + 学习期 instrumentation</text><rect x=\"1070.0\" y=\"278.0\" width=\"290.0\" height=\"42.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"1215.0\" y=\"303.1\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.8\" fill=\"#46585F\" font-weight=\"400\" >训练 / 推理可能较高</text><rect x=\"40.0\" y=\"320.0\" width=\"180.0\" height=\"42.0\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"130.0\" y=\"345.1\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.8\" fill=\"#1B2B33\" font-weight=\"600\" >主要风险</text><rect x=\"220.0\" y=\"320.0\" width=\"270.0\" height=\"42.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"355.0\" y=\"345.1\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.8\" fill=\"#46585F\" font-weight=\"400\" >相关性、倾斜估不准</text><rect x=\"490.0\" y=\"320.0\" width=\"280.0\" height=\"42.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"630.0\" y=\"345.1\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.8\" fill=\"#46585F\" font-weight=\"400\" >覆盖范围有限</text><rect x=\"770.0\" y=\"320.0\" width=\"300.0\" height=\"42.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"920.0\" y=\"345.1\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.8\" fill=\"#46585F\" font-weight=\"400\" >模型过期、样本污染、内存膨胀</text><rect x=\"1070.0\" y=\"320.0\" width=\"290.0\" height=\"42.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"1215.0\" y=\"345.1\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.8\" fill=\"#46585F\" font-weight=\"400\" >训练成本、过拟合、工程复杂</text><rect x=\"40.0\" y=\"26.0\" width=\"1320.0\" height=\"336.0\" fill=\"none\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"40.0\" y=\"376.0\" width=\"1320.0\" height=\"40.0\" rx=\"2\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.0\" /><text x=\"60.0\" y=\"401.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#2F7A66\" font-weight=\"600\" >合理顺序：① 表统计信息新鲜　→　② 明显多列相关的谓词建扩展统计　→　③ 仍长期误估、重复出现、代价高的 SQL 模板才考虑 AQO。</text></svg>","ctrl":null},{"eyebrow":"第五章 · 效果","title":"正收益、中性、负收益，各占一块","lede":"把效果拆成三类，才不会把「某个复杂查询变快」误读成「全库提速」。","caption":"图 20 · 依据文章「五、效果如何？」的三分法；顶部提醒来自 README 示例的适用边界。","bridge":"判断标准有了，落到手上就是一套可执行的实验步骤。","notes":"谈效果最忌讳一句话概括。README 里那个 JOB、IMDB 风格的复杂查询，确实说明了收益机制：原计划因为基数估错选了很差的 join 顺序，学习后行数估计和 join 顺序都变了，执行时间显著下降。但文章立刻补了一句：这不能外推成「所有查询都会快几个数量级」。我们把效果老老实实拆成三块。正收益发生在复杂 join 上：行数估计更接近真实，join 顺序、join 方法或扫描方式因此改变，重复模板训练后趋于稳定，EXPLAIN ANALYZE 里 estimated rows 和 actual rows 的数量级差距缩小。中性情况其实很常见：原生估算本来就够好，预测不改变计划；样本不足，AQO 拒绝预测直接回退；或者瓶颈压根不在基数，而在 IO、锁、网络、排序落盘、缓存状态。负收益更值得警惕：样本来自旧数据分布，模型过期；forced 把不相似查询塞进 COMMON，样本互相污染；学习期 instrumentation 和模型更新本身要花时间；还有一种特别憋屈的——AQO 把 rows 给准了，可 cost model 因为 random_page_cost、effective_cache_size、并行成本参数、表膨胀或者相关性，仍然选错计划。所以判断原则只有一句：AQO 解决的是基数误差，如果慢在别处，它不是第一工具。标准清楚了，落到手上就是一套实验步骤。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40.0\" y=\"26.0\" width=\"1320.0\" height=\"56.0\" rx=\"2\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.0\" /><text x=\"60.0\" y=\"60.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >README 的 JOB / IMDB 风格例子说明了收益机制：误估改善 → join 顺序改变 → 执行时间下降；但不能外推成「所有查询都快几个数量级」。</text><rect x=\"40.0\" y=\"100.0\" width=\"420.0\" height=\"262.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#2F7A66\" stroke-width=\"1.2\" /><rect x=\"40.0\" y=\"100.0\" width=\"420.0\" height=\"46.0\" rx=\"2\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"60.0\" y=\"131.0\" class=\"sv serif\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#2F7A66\" font-weight=\"700\" >正收益</text> nchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >样本不足，AQO 拒绝预测并回退</text><rect x=\"506.0\" y=\"256.0\" width=\"388.0\" height=\"40.0\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"520.0\" y=\"281.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >瓶颈在 IO、锁、网络、排序落盘、缓存</text><rect x=\"506.0\" y=\"304.0\" width=\"388.0\" height=\"40.0\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"520.0\" y=\"329.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >rows 变了，但 cost 排序没变</text><rect x=\"940.0\" y=\"100.0\" width=\"420.0\" height=\"262.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#BE653B\" stroke-width=\"1.2\" /><rect x=\"940.0\" y=\"100.0\" width=\"420.0\" height=\"46.0\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"960.0\" y=\"131.0\" class=\"sv serif\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#BE653B\" font-weight=\"700\" >负收益</text><rect x=\"956.0\" y=\"160.0\" width=\"388.0\" height=\"40.0\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"970.0\" y=\"185.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >样本来自旧分布，模型过期</text><rect x=\"956.0\" y=\"208.0\" width=\"388.0\" height=\"40.0\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"970.0\" y=\"233.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >forced 把不相似查询塞进 COMMON，样本污染</text><rect x=\"956.0\" y=\"256.0\" width=\"388.0\" height=\"40.0\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"970.0\" y=\"281.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >学习期 instrumentation 与模型更新增加开销</text><rect x=\"956.0\" y=\"304.0\" width=\"388.0\" height=\"40.0\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"970.0\" y=\"329.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >rows 更准，cost model 仍因硬件 / 缓存参数选错</text><text x=\"40.0\" y=\"392.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"600\" >判断原则：AQO 解决的是基数误差；若慢在锁等待、IO 抖动、网络传输、JIT 或并发争抢，它不是第一工具。</text></svg>","ctrl":null},{"eyebrow":"第六章 · 实操","title":"六步，把误估到收敛走一遍","lede":"从打补丁装好实例，到构造倾斜数据、观察误差、反复训练、切回白名单，再到排障开关。","caption":"图 21 · 文章「六、实操 DEMO」的六步流程；底部的诚实标注与原文一致。","bridge":"会跑实验还不够，得知道三种角色各自该守哪条线。","notes":"实操这块我想强调文章的诚实：它明确写了，本轮没有启动 patched PostgreSQL 加 AQO 的实例，所以没有执行输出，这些 SQL 是可运行的实验模板，不是已经验证过的 benchmark。我觉得这个态度比任何漂亮数字都重要。六步走一遍。第一，安装前提：克隆 aqo 到 contrib、打对应版本补丁、make clean 全量重编译、装扩展、配 shared_preload_libraries、重启、CREATE EXTENSION。第二，构造一个容易误估的相关数据集：customers、orders、order_items 三张表，故意让 hot_city 和 hot_sku 相关，再建索引、ANALYZE。第三，aqo.mode 设成 disabled，跑 EXPLAIN (ANALYZE, BUFFERS, VERBOSE)，盯着每个节点的 rows 估计和 actual rows 差多少、是不是因为低估选了 Nested Loop、Buffers 有没有暴露大量随机访问。第四，切 learn，打开 show_details，把同一条查询反复执行，README 的建议是训练到计划停止变化，而且别把这事放在高峰流量里做。第五，切回 controlled，查 aqo_query_texts 找到 query_hash，再查 aqo_queries 看 learn_aqo、use_aqo、auto_tuning，查 aqo_query_stat 看统计。第六，排障开关：当前会话 disabled 临时禁用但保留数据，controlled 只看白名单，frozen 对已收敛模型停止学习，要彻底停掉某条 query 就 UPDATE aqo_queries 把三个开关都置 false。会跑实验只是第一步，真上生产还得知道三种角色各自守哪条线。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40.0\" y=\"26.0\" width=\"1320.0\" height=\"54.0\" rx=\"2\" fill=\"#EBF1EE\" stroke=\"#EBF1EE\" stroke-width=\"1.0\" /><text x=\"58.0\" y=\"60.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"700\" >① 安装前提</text><text x=\"280.0\" y=\"60.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" >patch + make clean</text><text x=\"640.0\" y=\"60.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" >shared_preload_libraries=&#x27;aqo&#x27;</text><text x=\"1010.0\" y=\"60.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" >CREATE EXTENSION aqo</text><rect x=\"40.0\" y=\"88.0\" width=\"1320.0\" height=\"54.0\" rx=\"2\" fill=\"#CFE0DC\" stroke=\"#CFE0DC\" stroke-width=\"1.0\" /><text x=\"58.0\" y=\"122.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"700\" >② 构造相关数据集</text><text x=\"280.0\" y=\"122.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" >三表 + 倾斜插入</text><text x=\"640.0\" y=\"122.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" >hot_city / hot_sku 组合</text><text x=\"1010.0\" y=\"122.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" >建索引 + ANALYZE</text><rect x=\"40.0\" y=\"150.0\" width=\"1320.0\" height=\"54.0\" rx=\"2\" fill=\"#A4C4C6\" stroke=\"#A4C4C6\" stroke-width=\"1.0\" /><text x=\"58.0\" y=\"184.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"700\" >③ 观察原生误差</text><text x=\"280.0\" y=\"184.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" >aqo.mode = &#x27;disabled&#x27;</text><text x=\"640.0\" y=\"184.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" >EXPLAIN (ANALYZE, BUFFERS)</text><text x=\"1010.0\" y=\"184.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" >看 rows= 与 actual rows=</text><rect x=\"40.0\" y=\"212.0\" width=\"1320.0\" height=\"54.0\" rx=\"2\" fill=\"#74A5AD\" stroke=\"#74A5AD\" stroke-width=\"1.0\" /><text x=\"58.0\" y=\"246.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"700\" >④ 开启学习</text><text x=\"280.0\" y=\"246.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" >aqo.mode = &#x27;learn&#x27;</text><text x=\"640.0\" y=\"246.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" >show_details = on</text><text x=\"1010.0\" y=\"246.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" >重复执行直到计划不变</text><rect x=\"40.0\" y=\"274.0\" width=\"1320.0\" height=\"54.0\" rx=\"2\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1.0\" /><text x=\"58.0\" y=\"308.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#FFFFFF\" font-weight=\"700\" >⑤ 切回 controlled</text><text x=\"280.0\" y=\"308.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#FFFFFF\" font-weight=\"400\" >查 aqo_query_texts</text><text x=\"640.0\" y=\"308.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#FFFFFF\" font-weight=\"400\" >查 aqo_queries</text><text x=\"1010.0\" y=\"308.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#FFFFFF\" font-weight=\"400\" >查 aqo_query_stat</text><rect x=\"40.0\" y=\"336.0\" width=\"1320.0\" height=\"54.0\" rx=\"2\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.0\" /><text x=\"58.0\" y=\"370.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#FFFFFF\" font-weight=\"700\" >⑥ 排障开关</text><text x=\"280.0\" y=\"370.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#FFFFFF\" font-weight=\"400\" >disabled 临时关停</text><text x=\"640.0\" y=\"370.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#FFFFFF\" font-weight=\"400\" >frozen 停止学习</text><text x=\"1010.0\" y=\"370.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#FFFFFF\" font-weight=\"400\" >UPDATE aqo_queries 关单个 query</text><rect x=\"40.0\" y=\"404.0\" width=\"1320.0\" height=\"22.0\" rx=\"0\" fill=\"#F7F6F2\" stroke=\"#F7F6F2\" stroke-width=\"1\" /><text x=\"40.0\" y=\"418.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"600\" >诚实标注：文章本轮没有启动 patched PostgreSQL + AQO 实例，没有执行输出；以上是可运行的实验模板，不是已验证的 benchmark。</text></svg>","ctrl":null},{"eyebrow":"第七章 · 实践","title":"三层顺序，三种角色，一条发布流程","lede":"先 ANALYZE、再扩展统计、最后才是白名单 AQO；架构师定边界、DBA 管治理、开发者稳住 SQL 形态。","caption":"图 22 · 左：不可颠倒的三层与发布流程；右：文章 7.1–7.3 的三角色清单。","bridge":"最后把边界收一收：什么场景值得上，什么场景一开始就不该考虑。","notes":"最佳实践其实就一句话：先守住地基，再谈学习。第一层永远是统计信息新鲜，ANALYZE、采样精度、表膨胀；第二层才是对明显多列相关的业务谓词建扩展统计；第三层才是 AQO 白名单，而且只给高频、复杂 join、行数误差大、执行代价高的那几条模板。这个顺序不能倒，因为 AQO 是拿持续的运行期成本去换估算质量，用它去补一个忘记 ANALYZE 的库，是最亏的买卖。三种角色分工也不同。架构师负责定位——把它定性为「复杂重复查询的基数估算增强」，不是通用加速器；梳理业务查询模板，设计归一化边界，常量变化可以学、结构变化太多就会爆炸；还要把模型生命周期写进发布流程：上线前训练，上线后 controlled 或 frozen，数据分布变更后重新验证。DBA 负责治理：默认不要全库长期 learn，生产优先 controlled 加少数白名单；训练阶段必须用 EXPLAIN (ANALYZE, BUFFERS) 和 aqo.show_details 对比 estimated 和 actual rows；盯住 aqo_query_stat、aqo_data、aqo_queries 的规模；有性能回退先 disabled 做 A/B，再关掉那条 query 的 use_aqo；重大 ANALYZE、数据重分布、批量归档、schema 变更之后，别默认旧模型还可靠。业务开发者那边最实在：保持 SQL 结构稳定，用绑定参数，别拼出大量不同结构的动态 SQL；关注 rows 误差而不是只看总耗时；简单点查、小表扫描就别引入 AQO；更不要把它当成弥补糟糕索引和糟糕写法的工具。还有分区表、临时表、FDW、只读副本这些场景，要提前验证限制。好，最后把适用边界收一收。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><text x=\"40.0\" y=\"28.0\" class=\"sv serif\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"700\" >先守住地基，再谈学习：三层顺序不能倒</text><rect x=\"40.0\" y=\"48.0\" width=\"620.0\" height=\"62.0\" rx=\"2\" fill=\"#EBF1EE\" stroke=\"#EBF1EE\" stroke-width=\"1.0\" /><text x=\"58.0\" y=\"86.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"700\" >第一层</text><text x=\"160.0\" y=\"86.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"700\" >统计信息新鲜</text><rect x=\"360.0\" y=\"60.0\" width=\"288.0\" height=\"38.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"374.0\" y=\"84.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >ANALYZE、采样精度、表膨胀</text><rect x=\"40.0\" y=\"120.0\" width=\"620.0\" height=\"62.0\" rx=\"2\" fill=\"#A4C4C6\" stroke=\"#A4C4C6\" stroke-width=\"1.0\" /><text x=\"58.0\" y=\"158.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"700\" >第二层</text><text x=\"160.0\" y=\"158.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"700\" >扩展统计</text><rect x=\"360.0\" y=\"132.0\" width=\"288.0\" height=\"38.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"374.0\" y=\"156.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >多列相关谓词建 CREATE STATISTICS</text><rect x=\"40.0\" y=\"192.0\" width=\"620.0\" height=\"62.0\" rx=\"2\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1.0\" /><text x=\"58.0\" y=\"230.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"700\" >第三层</text><text x=\"160.0\" y=\"230.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#FFFFFF\" font-weight=\"700\" >AQO 白名单</text><rect x=\"360.0\" y=\"204.0\" width=\"288.0\" height=\"38.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"374.0\" y=\"228.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >仅高频、复杂 join、误差大、代价高的模板</text><rect x=\"700.0\" y=\"48.0\" width=\"660.0\" height=\"82.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"700.0\" y=\"48.0\" width=\"660.0\" height=\"30.0\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"716.0\" y=\"69.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"700\" >数据库架构师</text><text x=\"716.0\" y=\"96.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >· 定位为「复杂重复查询的基数估算增强」</text><text x=\"716.0\" y=\"110.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >· 梳理模板，设计查询归一化边界</text><text x=\"716.0\" y=\"124.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >· 模型生命周期纳入发布流程</text><rect x=\"700.0\" y=\"138.0\" width=\"660.0\" height=\"82.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"700.0\" y=\"138.0\" width=\"660.0\" height=\"30.0\" rx=\"2\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"716.0\" y=\"159.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"700\" >DBA</text><text x=\"716.0\" y=\"186.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >· 生产优先 controlled + 少数白名单</text><text x=\"716.0\" y=\"200.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >· 训练期用 EXPLAIN ANALYZE 对比 rows 误差</text><text x=\"716.0\" y=\"214.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >· 监控知识库规模，变更后重新验证</text><rect x=\"700.0\" y=\"228.0\" width=\"660.0\" height=\"82.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"700.0\" y=\"228.0\" width=\"660.0\" height=\"30.0\" rx=\"2\" fill=\"#F5EDDC\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"716.0\" y=\"249.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"700\" >业务开发者</text><text x=\"716.0\" y=\"276.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >· SQL 结构稳定，用 bind parameter</text><text x=\"716.0\" y=\"290.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >· 关注 rows 误差，不只看总耗时</text><text x=\"716.0\" y=\"304.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >· 别拿 AQO 弥补糟糕索引与 SQL 写法</text><text x=\"40.0\" y=\"288.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"700\" >发布流程</text><rect x=\"40.0\" y=\"302.0\" width=\"140.0\" height=\"42.0\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"110.0\" y=\"328.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >上线前训练</text><line x1=\"180.0\" y1=\"323.0\" x2=\"193.2\" y2=\"323.0\" stroke=\"#245A6B\" stroke-width=\"1.5\"/><polygon points=\"198.0,323.0 192.0,319.7 192.0,326.3\" fill=\"#245A6B\"/><rect x=\"198.0\" y=\"302.0\" width=\"140.0\" height=\"42.0\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"268.0\" y=\"328.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >上线后 controlled</text><line x1=\"338.0\" y1=\"323.0\" x2=\"351.2\" y2=\"323.0\" stroke=\"#245A6B\" stroke-width=\"1.5\"/><polygon points=\"356.0,323.0 350.0,319.7 350.0,326.3\" fill=\"#245A6B\"/><rect x=\"356.0\" y=\"302.0\" width=\"140.0\" height=\"42.0\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"426.0\" y=\"328.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >变更后重新验证</text><line x1=\"496.0\" y1=\"323.0\" x2=\"509.2\" y2=\"323.0\" stroke=\"#245A6B\" stroke-width=\"1.5\"/><polygon points=\"514.0,323.0 508.0,319.7 508.0,326.3\" fill=\"#245A6B\"/><rect x=\"514.0\" y=\"302.0\" width=\"140.0\" height=\"42.0\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"584.0\" y=\"328.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >回退先 disabled</text><text x=\"40.0\" y=\"380.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#BE653B\" font-weight=\"600\" >一句话总纲：索引、统计、SQL 形态仍然是第一层；AQO 是第三层，不该被用来掩盖前两层的问题。</text><text x=\"40.0\" y=\"406.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >分区表、临时表、FDW、动态 SQL、只读副本等场景，要提前验证限制，而不是上线后才发现模型用不上。</text></svg>","ctrl":null},{"eyebrow":"第八章 · 场景","title":"四个条件同时满足，才值得上 AQO","lede":"重复、结构稳定、历史能代表未来、可治理；缺任何一条，先别急着开。","caption":"图 23 · 依据文章「八、适合与不适合场景」；底部两条限制与 postgrespro/aqo README 一致。","bridge":"场景划完，还有七个最容易踩的坑，几乎都是把定位记错了。","notes":"把两边放一起看，规律其实很清楚。适合的一侧，五条全都在说同一件事：重复出现的复杂 SQL 模板；多表 join、半连接、聚合前过滤这类对 cardinality 极敏感的查询；原生统计和扩展统计都消不掉数量级误差；参数组合有业务规律，历史执行能代表未来；系统能承受训练阶段的实验和回滚治理。我把它们压成四个条件：重复、结构稳定、历史能代表未来、可治理。不适合的一侧，基本都是缺了其中一条。一次性 ad hoc 查询没有重复；每次结构都不同的动态报表没有结构稳定，除非受控用 forced 并且接受污染风险；简单主键点查、小表查询、已经稳定走最优计划的 SQL，压根没有误差可改；数据分布剧烈变化又没有再训练机制，历史代表不了未来。还有两个来自 README 的硬限制，我核对过：临时对象密集的场景不行，因为 AQO 归一化用的是对象内部 OID，动态生成的对象即使名字相同 OID 也不同；只读副本上不能直接学习，因为副本只读、不能采集并写入统计——不过二进制副本可以复用主库传过来的统计。所以判断要不要上 AQO，不用先跑测试，先拿这四个条件过一遍筛子就行。最后我们把七个最常见的坑过一遍，你会发现它们大多是同一件事：把定位记错了。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40.0\" y=\"26.0\" width=\"650.0\" height=\"330.0\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\" /><rect x=\"40.0\" y=\"26.0\" width=\"650.0\" height=\"44.0\" rx=\"2\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"60.0\" y=\"55.0\" class=\"sv serif\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#FFFFFF\" font-weight=\"700\" >适合</text><rect x=\"60.0\" y=\"84.0\" width=\"610.0\" height=\"42.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><circle cx=\"82.0\" cy=\"105.0\" r=\"6.0\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"100.0\" y=\"111.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >重复出现的复杂 SQL 模板</text><rect x=\"60.0\" y=\"136.0\" width=\"610.0\" height=\"42.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><circle cx=\"82.0\" cy=\"157.0\" r=\"6.0\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"100.0\" y=\"163.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >多表 join、半连接、聚合前过滤等基数敏感查询</text><rect x=\"60.0\" y=\"188.0\" width=\"610.0\" height=\"42.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><circle cx=\"82.0\" cy=\"209.0\" r=\"6.0\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"100.0\" y=\"215.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >原生统计 + 扩展统计仍无法消除数量级误差</text><rect x=\"60.0\" y=\"240.0\" width=\"610.0\" height=\"42.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><circle cx=\"82.0\" cy=\"261.0\" r=\"6.0\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"100.0\" y=\"267.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >参数组合有业务规律，历史执行能代表未来</text><rect x=\"60.0\" y=\"292.0\" width=\"610.0\" height=\"42.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><circle cx=\"82.0\" cy=\"313.0\" r=\"6.0\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"100.0\" y=\"319.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >能承受训练阶段实验与回滚治理的系统</text><rect x=\"710.0\" y=\"26.0\" width=\"650.0\" height=\"330.0\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\" /><rect x=\"710.0\" y=\"26.0\" width=\"650.0\" height=\"44.0\" rx=\"2\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"730.0\" y=\"55.0\" class=\"sv serif\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#FFFFFF\" font-weight=\"700\" >不适合</text><rect x=\"730.0\" y=\"84.0\" width=\"610.0\" height=\"36.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><circle cx=\"750.0\" cy=\"102.0\" r=\"5.0\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"766.0\" y=\"107.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >一次性 ad hoc 查询</text><rect x=\"730.0\" y=\"128.0\" width=\"610.0\" height=\"36.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><circle cx=\"750.0\" cy=\"146.0\" r=\"5.0\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"766.0\" y=\"151.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >每次结构都不同的动态报表（除非受控 forced 并接受污染）</text><rect x=\"730.0\" y=\"172.0\" width=\"610.0\" height=\"36.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><circle cx=\"750.0\" cy=\"190.0\" r=\"5.0\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"766.0\" y=\"195.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >简单主键点查、小表查询、已稳定走最优计划</text><rect x=\"730.0\" y=\"216.0\" width=\"610.0\" height=\"36.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><circle cx=\"750.0\" cy=\"234.0\" r=\"5.0\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"766.0\" y=\"239.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >数据分布剧烈变化但没有再训练机制</text><rect x=\"730.0\" y=\"260.0\" width=\"610.0\" height=\"36.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><circle cx=\"750.0\" cy=\"278.0\" r=\"5.0\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"766.0\" y=\"283.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >临时对象密集：内部 OID 变化破坏归一化</text><rect x=\"730.0\" y=\"304.0\" width=\"610.0\" height=\"36.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><circle cx=\"750.0\" cy=\"322.0\" r=\"5.0\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"766.0\" y=\"327.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >只读副本上直接学习：副本只读，不能写统计</text><text x=\"40.0\" y=\"386.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"600\" >共同点：适合的一侧都满足「重复 + 结构稳定 + 历史能代表未来 + 可治理」；不适合的一侧至少缺一条。</text><text x=\"40.0\" y=\"412.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >README 两处限制已核对：临时对象内部 OID 每次不同；只读副本不采集统计（二进制副本可复用主库统计）。</text></svg>","ctrl":null},{"eyebrow":"第九章 · 常见坑","title":"七个坑，多半是同一句话没记住","lede":"把 rows 当成计划、把 learn 当成常态、把耗时当成唯一指标——都会把 AQO 用歪。","caption":"图 24 · 文章「九、常见坑」逐条归位；右下角是全篇的一条总原则。","bridge":"收个尾：把这一整场压回一张图、一句话，再留几个值得继续想的问题。","notes":"七个坑快速过一遍，你会发现它们几乎是同一个误会的不同侧面。第一，误把 AQO 当成 plan baseline：它学的是 rows，不是固定计划，数据、统计、GUC、索引、版本一变，rows 类似计划也可能变。第二，全库常开 learn：它会为每个未知 query type 建模型，动态 SQL 一多，query type 和 feature subspace 膨胀，学习开销可能超过收益。第三，forced 污染 COMMON：未知查询全映射到 fs=0，结构不相似的话历史样本互相带偏，预测反而更差。第四，样本过期：AQO 不会自动理解业务变化，大促、归档、迁移、冷热切换之后，旧模型可能要丢掉重学。第五，只看总耗时不看 rows 误差：慢在锁等待、IO 抖动、排序落盘、网络、JIT、并发争抢，AQO 都不是第一工具。第六，忽视 cost model：random_page_cost、effective_cache_size、并行成本参数、表膨胀、相关性，任何一个都可能让更准的 rows 换不来更好的计划。第七，以为 EXPLAIN ONLY 也能学：aqo_ExecutorStart 会区分 EXEC_FLAG_EXPLAIN_ONLY，没有真实执行并采集 INSTRUMENT_ROWS，就没有可靠的 actual rows。七个里有五个，根子都在第六页那条边界——它改的是输入的事实，不是做决策的大脑。对应的治理动作也就那几样：controlled 白名单、训练期对比 rows、变更后重新验证、回退先 disabled 做 A/B。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40.0\" y=\"26.0\" width=\"315.0\" height=\"150.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"40.0\" y=\"26.0\" width=\"315.0\" height=\"40.0\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"54.0\" y=\"52.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"700\" >01</text><text x=\"92.0\" y=\"52.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"700\" >当成 plan baseline</text><text x=\"56.0\" y=\"100.0\" class=\"sv s\" text-anchor=\"start\" font-si .0\" y=\"220.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"700\" >07</text><text x=\"762.0\" y=\"220.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"700\" >EXPLAIN ONLY 想学习</text><text x=\"726.0\" y=\"268.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >没有真实执行就没有可靠 actu</text><text x=\"726.0\" y=\"292.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >al rows</text><line x1=\"726.0\" y1=\"310.0\" x2=\"1009.0\" y2=\"310.0\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"726.0\" y=\"332.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"400\" >回到定位：只改基数估计</text><rect x=\"1065.0\" y=\"194.0\" width=\"295.0\" height=\"150.0\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\" /><text x=\"1085.0\" y=\"228.0\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#2F7A66\" font-weight=\"700\" >一条总原则</text><text x=\"1085.0\" y=\"262.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >AQO 是给重复复杂查询</text><text x=\"1085.0\" y=\"286.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >的行数估算装一条反馈回路。</text><text x=\"1085.0\" y=\"322.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#2F7A66\" font-weight=\"600\" >它不是计划钉子，</text><text x=\"1085.0\" y=\"344.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#2F7A66\" font-weight=\"600\" >也不是全库加速开关。</text><text x=\"40.0\" y=\"386.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"600\" >七个坑里有五个，根子都在第六页那条边界：它改的是「输入的事实」，不是「做决策的大脑」。</text><text x=\"40.0\" y=\"412.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >治理动作也简单：controlled 白名单、训练期对比 rows、变更后重新验证、回退先 disabled 做 A/B。</text></svg>","ctrl":null},{"eyebrow":"收尾 · 归位","title":"一条反馈线，和它该待的位置","lede":"把全篇压回一张闭环图：固定模板 → 归一化 → 预测 → 采集 → 写回 → 下一次规划。","caption":"图 25 · 全篇闭环总览：绿色直角回路表示执行反馈写回模型后回到下一次规划；右侧是一句判断与文章留下的五个扩展问题。","bridge":"讲完了。记住那条线在哪儿，比记住任何一个参数都重要。","notes":"收个尾。这一整场，其实只画了一条回路：固定的 SQL 模板经过归一化落到 fs 和 fss，规划期用 clauses、log(selectivity) 和 OkNN 预测 rows，执行期打开 INSTRUMENT_ROWS 采集 ntuples 和 nloops，后处理把 target 等于 log(actual rows) 写回模型，然后回到下一次规划。就这么一条线，撑起了预处理、hook、特征哈希、机器学习、执行反馈、共享内存和自动调优七个模块，也撑起了模式、白名单、冻结和回滚这一整套治理。所以最后那句判断我想说得尽量短：AQO 是给「重复、复杂、长期误估」的查询，在基数估算这一层装一条执行反馈回路。它不是通用加速器，不是 plan baseline，更不是弥补糟糕索引和 SQL 写法的工具。文章最后留了五个很好的问题，我没有替它回答，只把它们摆在这儿：已有扩展统计为什么还需要 AQO、反过来能不能替代；rows 准了计划仍差该先怀疑谁；多租户该共享 feature space 还是按租户隔离；季节性 workload 要不要分时段模型；以及 kNN 和神经网络 AQO 在泛化能力、训练成本、可解释性和推理延迟之间到底怎么取舍。最后补一句实证边界：FOSDEM 2021 的材料里把 neural network-based AQO 作为潜在改进方向介绍，本地这份 aqo 源码实现的仍然是 kNN 变体，我们没有把神经网络的行为当成当前源码行为来讲。好，讲完了。记住那条反馈线挂在哪一层，比记住任何一个参数都重要。谢谢大家。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><text x=\"40.0\" y=\"28.0\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" >整场只画了一条回路：从执行回到规划</text><rect x=\"40.0\" y=\"40.0\" width=\"700.0\" height=\"48.0\" rx=\"2\" fill=\"#EBF1EE\" stroke=\"#EBF1EE\" stroke-width=\"1.0\" /><text x=\"58.0\" y=\"70.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#1B2B33\" font-weight=\"700\" >固定 SQL 模板</text><text x=\"330.0\" y=\"70.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >结构稳定 + bind parameter</text><rect x=\"40.0\" y=\"96.0\" width=\"700.0\" height=\"48.0\" rx=\"2\" fill=\"#CFE0DC\" stroke=\"#CFE0DC\" stroke-width=\"1.0\" /><text x=\"58.0\" y=\"126.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#1B2B33\" font-weight=\"700\" >query_hash → fs / fss</text><text x=\"330.0\" y=\"126.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weigh const N = D.length;
let cur = 0, autoTimer = null, autoOn = false;
let drawerOpen = false, view = 'here';

const $ = s => document.querySelector(s);

function fit(){
  const vp = $('#viewport');
  const W = vp.clientWidth, H = vp.clientHeight;
  const s = Math.min(W/1600, H/900);
  const st = $('#stage');
  st.style.transform = 'scale(' + s + ')';
  st.style.left = ((W - 1600*s)/2) + 'px';
  st.style.top  = ((H -  900*s)/2) + 'px';
}
window.addEventListener('resize', fit);

function render(){
  const host = $('#slides');
  host.innerHTML = D.map((d,i) =>
    '<section class="slide" id="s'+i+'">'
    + '<div class="eyebrow"><span class="num">'+String(i+1).padStart(2,'0')+' / '+String(N).padStart(2,'0')+'</span>'+d.eyebrow+'</div>'

function toast(s){
  const t=$('#toast'); t.textContent=s; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1700);
}

function go(i, silent){
  i = Math.max(0, Math.min(N-1, i));
  $$('.slide').forEach((el,k)=>el.classList.toggle('on', k===i));
  cur = i;
  try{ localStorage.setItem('aqo-slide', String(i)); }catch(e){}
  $('.pg').textContent = String(i+1).padStart(2,'0') + ' / ' + String(N).padStart(2,'0');
  $('#track i').style.width = ((i+1)/N*100)+'%';
  for(let k=0;k<N;k++){ const b=$('#fbar'+k); if(b) b.style.width = (k<=i?100:0)+'%'; }
  if(!silent) toast(D[i].eyebrow + ' · ' + D[i].title);
  syncNotes(true);
  if(i===ANIM_PAGE) animPaint();
}
function next(){ if(cur<N-1) go(cur+1); else stopAuto(); }
function prev(){ if(cur>0) go(cur-1); }

function stopAuto(){
  autoOn=false; clearInterval(autoTimer); autoTimer=null;
  $('#btnAuto').textContent='▶ 自动播放 P'; $('#btnAuto').classList.remove('act');
}
function toggleAuto(){
  if(autoOn){ stopAuto(); toast('已暂停自动播放'); return; }
  autoOn=true; $('#btnAuto').textContent='❚❚ 暂停 P'; $('#btnAuto').classList.add('act');
  autoTimer=setInterval(()=>{ if(cur<N-1) go(cur+1,true); else stopAuto(); }, 12000);
  toast('自动播放：每 12 秒一页');
}

function renderDrawer(){
  $('#drawer h2').textContent = VIEWS[view][0];
  $('#dsub').textContent = VIEWS[view][1];
  $$('.dtabs button').forEach(b=>b.classList.toggle('act', b.getAttribute('data-view')===view));
  const body = $('#dbody');
  body.innerHTML = view==='here' ? hereHTML() : view==='all' ? allHTML()
                 : view==='toc' ? tocHTML() : helpHTML();
  if(view==='toc'){
    $$('.tocitem').forEach(a=>a.onclick=()=>{ go(+a.getAttribute('data-i')); closeDrawer(); });
  }
}
function scrollNote(i, smooth){
  const el=$('#nsec'+i); if(!el) return;
  try{ el.scrollIntoView({behavior:smooth?'smooth':'auto', block:'start'}); }
  catch(e){ $('#dbody').scrollTop = el.offsetTop; }
}
function openDrawer(v){
  view=v; drawerOpen=true;
  document.body.classList.add('dopen');
  $$('.dtabs button').forEach(b=>b.classList.toggle('act', b.getAttribute('data-view')===v));
  renderDrawer();
  setTimeout(fit,20); setTimeout(fit,420);
  if(v==='all') requestAnimationFrame(()=>scrollNote(cur,false));
  else $('#dbody').scrollTop=0;
  syncButtons();
}
function closeDrawer(){
  drawerOpen=false;
  document.body.classList.remove('dopen');
  setTimeout(fit,20); setTimeout(fit,420);
  syncButtons();
}
function toggleView(v){
  if(drawerOpen && view===v) closeDrawer();
  else openDrawer(v);
}
function syncNotes(scroll){
  if(!drawerOpen) return;
  if(view==='all'){
    $$('.dsec').forEach((e,k)=>e.classList.toggle('cur', k===cur));
    if(scroll) scrollNote(cur,true);
  }else if(view==='here'){
    $('#dbody').innerHTML = hereHTML();
    $('#dbody').scrollTop = 0;
  }else if(view==='toc'){
    $$('.tocitem').forEach((e,k)=>e.classList.toggle('cur', k===cur));
  }
}
function syncButtons(){
  $('#btnToc').classList.toggle('act', drawerOpen && view==='toc');
  $('#btnNotes').classList.toggle('act', drawerOpen && view==='here');
  $('#btnAll').classList.toggle('act', drawerOpen && view==='all');
  $('#btnHelp').classList.toggle('act', drawerOpen && view==='help');
}

function fs(){
  const entering=!document.body.classList.contains('immersive');
  if(entering){
    document.body.classList.add('immersive');
    $('#btnFs').textContent='退出全屏 F';
    $('#btnFs').classList.add('act');
    fit();
    toast('全屏：底部按键仍可用 · F 或 Esc 退出');
    try{
      const pr = document.documentElement.requestFullscreen
                 ? document.documentElement.requestFullscreen() : null;
      if(pr && pr.catch) pr.catch(()=>{});
    }catch(e){}
  }else{
    document.body.classList.remove('immersive');
    $('#btnFs').textContent='全屏 F';
    $('#btnFs').classList.remove('act');
    fit();
    toast('已退出全屏');
    try{ if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen(); }catch(e){}
  }
}
document.addEventListener('fullscreenchange', ()=>{
  if(!document.fullscreenElement && document.body.classList.contains('immersive')){
    document.body.classList.remove('immersive');
    $('#btnFs').textContent='全屏 F'; $('#btnFs').classList.remove('act');
  }
  fit();
});

document.addEventListener('keydown', e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  const typing=(tag==='input'||tag==='select'||tag==='textarea');
  const k=e.key;
  if(k==='Escape'){
    if(drawerOpen) closeDrawer();
    else if(document.body.classList.contains('immersive')) fs();
    return;
  }
  if(typing) return;
  if(k==='ArrowRight'||k===' '||k==='PageDown'){ e.preventDefault(); next(); }
  else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); prev(); }
  else if(k==='f'||k==='F'){ e.preventDefault(); fs(); }
  else if(k==='g'||k==='G'){ e.preventDefault(); toggleView('toc'); }
  else if(k==='n'||k==='N'){ e.preventDefault(); toggleView('here'); }
  else if(k==='t'||k==='T'){ e.preventDefault(); toggleView('all'); }
  else if(k==='p'||k==='P'){ e.preventDefault(); toggleAuto(); }
  else if(k==='?'||k==='h'||k==='H'){ e.preventDefault(); toggleView('help'); }
  else if(k==='Home'){ e.preventDefault(); go(0); }
  else if(k==='End'){ e.preventDefault(); go(N-1); }
  else if(/^[1-9]$/.test(k)){ go(parseInt(k,10)-1); }
});
