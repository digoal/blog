const N = D.length;
let cur = 0, sideMode = null, autoTimer = null, autoOn = false;

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const pad2 = n => String(n).padStart(2,'0');

/* ---------- 舞台等比缩放；开窗时把画面整体缩到左侧 ---------- */
function fit(){
  const vp = $('#viewport'), W = vp.clientWidth, H = vp.clientHeight;
  const on = $('#side').classList.contains('on');
  const sideW = on ? $('#side').getBoundingClientRect().width : 0;
  const availW = Math.max(320, W - sideW);
  const s = Math.min(availW / 1600, H / 900);
  const st = $('#stage');
  st.style.transform = 'scale(' + s + ')';
  st.style.left = ((availW - 1600 * s) / 2) + 'px';
  st.style.top  = ((H - 900 * s) / 2) + 'px';
}
window.addEventListener('resize', fit);

function render(){
  $('#slides').innerHTML = D.map((d,i) =>
    '<section class="slide' + (d.anim ? ' anim' : '') + '" id="s' + i + '">'
    + '<div class="eyebrow"><span class="num">' + pad2(i+1) + ' / ' + pad2(N) + '</span>' + d.eyebrow + '</div>'
    + '<h1 class="title">' + d.title + '</h1>'
    + '<div class="lede">' + d.lede + '</div>'
    + '<div class="rule"></div>'
    + '<div class="figwrap">' + d.svg + '</div>'
    + (d.ctrl ? '<div class="ctrls">' + d.ctrl + '</div><div class="caption">' + d.caption + '</div>'
              : '<div class="caption">' + d.caption + '</div>')
    + '<div class="bridge"><span class="bk">承接 · NEXT</span>' + d.bridge + '</div>'
    + '<div class="footer"><div class="fbar"><i id="fbar' + i + '"></i></div>'
    + '<span class="fl">数据库筑基课 · 应用实践之 pgvector</span>'
    + '<span class="fr">' + pad2(i+1) + ' / ' + pad2(N) + '</span></div>'
    + '</section>').join('');
}

function toast(s){
  const t = $('#toast'); t.textContent = s; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 1700);
}

/* ---------- 右侧页内开窗 ---------- */
function sideOpen(){ return $('#side').classList.contains('on'); }

function hereHTML(i){
  const d = D[i];
  return '<div class="here-e">' + pad2(i+1) + ' / ' + pad2(N) + ' · ' + d.eyebrow + '</div>'
    + '<div class="here-t">' + d.title + '</div>'
    + '<p class="here-p">' + d.notes + '</p>'
    + '<div class="here-b"><b>承接 · </b>' + d.bridge + '</div>'
    + '<div class="sidefoot">按 N 收起本窗 · 按 T 切换全文讲稿 · 翻页时本窗内容联动</div>';
}
function allHTML(){
  return D.map((d,i) => '<div class="sec-note" id="note-' + i + '">'
    + '<span class="sn">' + pad2(i+1) + ' / ' + pad2(N) + ' · ' + d.eyebrow + '</span>'
    + '<h3>' + d.title + '</h3><p>' + d.notes + '</p>'
    + '<p class="bq">「' + d.bridge + '」</p></div>').join('');
}
function tocHTML(){
  return '<div class="tocgrid">' + D.map((d,i) =>
    '<a id="toc-' + i + '" onclick="jump(' + i + ')"><span class="gn">' + pad2(i+1) + '</span>'
    + '<span class="gt">' + d.title + '</span></a>').join('') + '</div>'
    + '<div class="sidefoot">共 ' + N + ' 页 · 点击任意一页跳转 · 按 G 收起目录</div>';
}
function helpHTML(){
  return '<div class="keys2">'
    + '<div><kbd>→ / 空格</kbd>下一页</div><div><kbd>←</kbd>上一页</div>'
    + '<div><kbd>G</kbd>目录</div><div><kbd>N</kbd>本页讲稿</div>'
    + '<div><kbd>T</kbd>全文讲稿（定位当前页）</div><div><kbd>P</kbd>自动播放 / 暂停</div>'
    + '<div><kbd>F</kbd>全屏 / 退出全屏</div><div><kbd>1–9</kbd>直接跳页</div>'
    + '<div><kbd>Home / End</kbd>首页 / 末页</div><div><kbd>?</kbd>本帮助</div>'
    + '<div><kbd>Esc</kbd>收起右侧窗 / 退出全屏</div><div><kbd>点击底部按钮</kbd>同上</div>'
    + '</div><div class="sidefoot">右侧窗为页内开窗，不遮挡画面：画面会矢量缩放到左侧展示。</div>';
}
function setSideContent(){
  const head = $('#sideHead'), body = $('#sideBody');
  const titles = {toc:['目录','按 G 收起 · 点击跳转'], here:['本页讲稿','按 N 收起 · 翻页联动'],
                  all:['全文讲稿','按 T 收起 · 自动定位当前页'], help:['快捷键','按 ? 收起']};
  const t = titles[sideMode];
  head.innerHTML = '<h2>' + t[0] + '</h2><span class="sub">' + t[1]
    + '</span><button class="cl" onclick="closeSide()">收起 ✕</button>';
  if(sideMode === 'toc'){ body.innerHTML = tocHTML(); highlightToc(); }
  else if(sideMode === 'here'){ body.innerHTML = hereHTML(cur); body.scrollTop = 0; }
  else if(sideMode === 'all'){
    body.innerHTML = allHTML(); highlightNote();
    setTimeout(() => scrollNote(cur, false), 50);
  }
  else { body.innerHTML = helpHTML(); body.scrollTop = 0; }
}
function openSide(mode){
  sideMode = mode;
  $('#side').classList.add('on');
  setSideContent();
  fit();
  const b = {toc:'#btnToc', here:'#btnNotes', all:'#btnAll', help:'#btnHelp'};
  $$('.chrome button').forEach(x => x.classList.remove('act'));
  Object.keys(b).forEach(k => { const el = $(b[k]); if(el && k === mode) el.classList.add('act'); });
}
function closeSide(){
  $('#side').classList.remove('on');
  sideMode = null;
  $$('.chrome button').forEach(x => x.classList.remove('act'));
  setTimeout(fit, 30);
  fit();
}
function toggleSide(mode){
  if(sideOpen() && sideMode === mode){ closeSide(); return; }
  openSide(mode);
}
function scrollNote(i, smooth){
  const body = $('#sideBody'), el = document.getElementById('note-' + i);
  if(!el) return;
  const b = body.getBoundingClientRect(), e = el.getBoundingClientRect();
  const top = body.scrollTop + (e.top - b.top) - 16;
  if(smooth === false){ body.scrollTop = Math.max(0, top); }
  else { body.scrollTo({top: Math.max(0, top), behavior: 'smooth'}); }
}
function highlightNote(){
  $$('#sideBody .sec-note').forEach(el => el.classList.remove('cur'));
  const el = document.getElementById('note-' + cur);
  if(el) el.classList.add('cur');
}
function highlightToc(){
  $$('#sideBody .tocgrid a').forEach(el => el.classList.remove('cur'));
  const el = document.getElementById('toc-' + cur);
  if(el) el.classList.add('cur');
}
function syncSide(){
  if(!sideOpen()) return;
  if(sideMode === 'here'){ $('#sideBody').innerHTML = hereHTML(cur); $('#sideBody').scrollTop = 0; }
  else if(sideMode === 'all'){ highlightNote(); scrollNote(cur, true); }
  else if(sideMode === 'toc'){ highlightToc(); }
}
function jump(i){ go(i); }

/* ---------- 翻页 / 自动播放 ---------- */
function go(i, silent){
  i = Math.max(0, Math.min(N-1, i));
  $$('.slide').forEach((el,k) => el.classList.toggle('on', k === i));
  cur = i;
  try{ localStorage.setItem('pgvector-slide', String(i)); }catch(e){}
  $('.pg').textContent = pad2(i+1) + ' / ' + pad2(N);
  $('#track i').style.width = ((i+1)/N*100) + '%';
  for(let k=0;k<N;k++){ const b = $('#fbar'+k); if(b) b.style.width = (k<=i?100:0) + '%'; }
  syncSide();
  if(!silent) toast(D[i].eyebrow + ' · ' + D[i].title);
}
function next(){ if(cur < N-1) go(cur+1); else stopAuto(); }
function prev(){ if(cur > 0) go(cur-1); }
function stopAuto(){
  autoOn = false; clearInterval(autoTimer); autoTimer = null;
  $('#autoLabel').textContent = '自动播放'; $('#btnAuto').classList.remove('act');
}
function toggleAuto(){
  if(autoOn){ stopAuto(); toast('已暂停自动播放'); return; }
  autoOn = true; $('#autoLabel').textContent = '暂停播放'; $('#btnAuto').classList.add('act');
  autoTimer = setInterval(() => { if(cur < N-1) go(cur+1, true); else stopAuto(); }, 13000);
  toast('自动播放：每 13 秒一页');
}

/* ---------- 全屏：底部按键条常显 ---------- */
function fs(){
  if(document.body.classList.contains('immersive')){ leaveFs(); return; }
  document.body.classList.add('immersive');
  $('#btnFs').textContent = '退出全屏 F';
  fit();
  toast('全屏：底部按键条常显，F 或 Esc 退出');
  try{
    const pr = document.documentElement.requestFullscreen
      ? document.documentElement.requestFullscreen() : null;
    if(pr && pr.catch) pr.catch(() => {});
  }catch(e){}
}
function leaveFs(){
  document.body.classList.remove('immersive');
  $('#btnFs').textContent = '全屏 F';
  fit();
  try{ if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen(); }catch(e){}
  toast('已退出全屏');
}
document.addEventListener('fullscreenchange', () => {
  if(!document.fullscreenElement && document.body.classList.contains('immersive')){
    document.body.classList.remove('immersive');
    $('#btnFs').textContent = '全屏 F';
  }
  fit();
});

/* ---------- 动画通用引擎：只改填充/描边，元素不移动，永不重叠 ---------- */
function hl(root, step){
  $$('#' + root + ' [data-step]').forEach(el => {
    const n = +el.getAttribute('data-step');
    const on = n <= step, iscur = n === step;
    const tag = el.tagName.toLowerCase();
    if(tag !== 'line'){
      const f = el.getAttribute('data-on'), o = el.getAttribute('data-off');
      if(f && o) el.setAttribute('fill', on ? f : o);
    }
    el.setAttribute('stroke', on ? (el.getAttribute('data-onstroke') || '#BE653B')
                                 : (el.getAttribute('data-offstroke') || '#D9D5CB'));
    el.setAttribute('stroke-width', tag === 'line' ? (on ? (iscur ? 2.8 : 2.0) : 1.2)
                                                   : (iscur ? 2.4 : 1.1));
  });
}
function makeAnim(p, steps, paint, verdict){
  let step = 0, playing = false, timer = null;
  const P = id => document.getElementById(p + id);
  function refresh(){ paint(step); if(verdict) verdict(); }
  function pause(){
    playing = false; clearInterval(timer); timer = null;
    const b = P('Play'); if(b){ b.textContent = '▶ 播放'; b.classList.remove('play'); }
  }
  function play(){
    if(playing){ pause(); return; }
    playing = true;
    const b = P('Play'); if(b){ b.textContent = '❚❚ 暂停'; b.classList.add('play'); }
    if(step >= steps) step = 0;
    timer = setInterval(() => { step++; refresh(); if(step >= steps) pause(); }, 900);
  }
  function tick(){ pause(); if(step < steps){ step++; refresh(); } }
  function reset(){ pause(); step = 0; refresh(); }
  const b1 = P('Play'), b2 = P('Step'), b3 = P('Reset');
  if(b1) b1.onclick = play;
  if(b2) b2.onclick = tick;
  if(b3) b3.onclick = reset;
  refresh();
  return {refresh: refresh, get step(){ return step; }};
}

/* ---------- 动画 A：优化器是否认得 KNN 形态 ---------- */
function optPaint(step){
  hl('optFlow', step);
  const yes = +$('#optSql').value === 0;
  const y = document.getElementById('optYes'), n = document.getElementById('optNo');
  if(y){ y.setAttribute('fill', yes ? '#E4F0EA' : '#FFFFFF');
         y.setAttribute('stroke', yes ? '#2F7A66' : '#D9D5CB');
         y.setAttribute('stroke-width', yes ? '2.2' : '1.1'); }
  if(n){ n.setAttribute('fill', yes ? '#FFFFFF' : '#F7E9DE');
         n.setAttribute('stroke', yes ? '#D9D5CB' : '#BE653B');
         n.setAttribute('stroke-width', yes ? '1.1' : '2.2'); }
}
function optVerdict(){
  const v = +$('#optSql').value;
  const msg = [
    '<b>走 ANN 索引 →</b> ORDER BY 距离操作符本身 + ASC + LIMIT k，indexorderbys 非空',
    '<b>退回顺序扫描 →</b> 只有 WHERE 距离过滤，没有 ORDER BY / LIMIT，不是 KNN 入口',
    '<b>退回顺序扫描 →</b> 距离被包进 1 - (...) DESC 表达式，语义等价但不匹配 opclass 入口',
    '<b>退回顺序扫描 →</b> 缺 LIMIT k，优化器无法把它当作 TopK 最近邻'
  ];
  const out = $('#optOut'); if(out){ out.innerHTML = msg[v]; out.title = out.textContent; }
}
function optRefresh(){ optPaint(0); optVerdict(); }

/* ---------- 动画 B：HNSW 逐层下降与候选扩展 ---------- */
function hnsPaint(step){ hl('hnsFlow', step); }
function hnsVerdict(){
  const v = $('#hnsEf').value;
  const out = $('#hnsOut');
  if(out){
    out.innerHTML = '<b>hnsw.ef_search = ' + v + ' →</b> 候选队列越大，召回越高，延迟与内存也越高（默认 40）';
    out.title = out.textContent;
  }
}

/* ---------- 动画 C：IVFFlat 训练、分桶与 probes ---------- */
function ivfPaint(step){
  hl('ivfFlow', step);
  const p = +$('#ivfProbes').value;
  $$('#ivfFlow .bucket').forEach((el,i) => {
    const active = step >= 4 && i < p;
    el.setAttribute('fill', active ? '#E4F0EA' : '#FFFFFF');
    el.setAttribute('stroke', active ? '#2F7A66' : '#D9D5CB');
    el.setAttribute('stroke-width', active ? '2.0' : '1.1');
  });
  const lbl = $('#ivfPLbl'); if(lbl) lbl.textContent = String(p);
}
function ivfVerdict(){
  const p = +$('#ivfProbes').value;
  const out = $('#ivfOut');
  if(out){
    out.innerHTML = '<b>probes = ' + p + ' / 8（示意）→</b> 扫描 ' + p
      + ' 个 list；看到的空间更大、召回倾向提高，读取页面也更多';
    out.title = out.textContent;
  }
}

let A_OPT, A_HNS, A_IVF;
function initAnims(){
  A_OPT = makeAnim('opt', 5, optPaint, optVerdict);
  A_HNS = makeAnim('hns', 5, hnsPaint, hnsVerdict);
  A_IVF = makeAnim('ivf', 6, ivfPaint, ivfVerdict);
  [['optSql', optVerdict, 'A_OPT'], ['hnsEf', hnsVerdict, 'A_HNS'],
   ['ivfProbes', ivfVerdict, 'A_IVF']].forEach(([id, fn, key]) => {
    const el = document.getElementById(id); if(!el) return;
    const both = () => { fn(); if(key === 'A_OPT') A_OPT.refresh();
                         else if(key === 'A_HNS') A_HNS.refresh(); else A_IVF.refresh(); };
    el.addEventListener('input', both);
    el.addEventListener('change', both);
  });
  ['optSql', 'hnsEf'].forEach(id => {
    const e = document.getElementById(id);
    if(e) e.addEventListener('change', () => e.blur());
  });
}

/* ---------- 键盘 ---------- */
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  const k = e.key;
  const typing = (tag === 'input' || tag === 'select' || tag === 'textarea');
  const navKey = (k.indexOf('Arrow') === 0 || k === ' ' || k === 'Home' || k === 'End'
                  || k === 'PageUp' || k === 'PageDown');
  if(k === 'Escape'){
    if(sideOpen()){ closeSide(); e.preventDefault(); return; }
    if(document.body.classList.contains('immersive')){ leaveFs(); }
    return;
  }
  if(typing && navKey) return;
  if(k === 'ArrowRight' || k === ' ' || k === 'PageDown'){ e.preventDefault(); next(); }
  else if(k === 'ArrowLeft' || k === 'PageUp'){ e.preventDefault(); prev(); }
  else if(k === 'f' || k === 'F' || e.code === 'KeyF'){ e.preventDefault(); fs(); }
  else if(k === 'g' || k === 'G'){ e.preventDefault(); toggleSide('toc'); }
  else if(k === 'n' || k === 'N'){ e.preventDefault(); toggleSide('here'); }
  else if(k === 't' || k === 'T'){ e.preventDefault(); toggleSide('all'); }
  else if(k === 'p' || k === 'P'){ e.preventDefault(); toggleAuto(); }
  else if(k === '?' || k === 'h' || k === 'H'){ e.preventDefault(); toggleSide('help'); }
  else if(k === 'Home'){ e.preventDefault(); go(0); }
  else if(k === 'End'){ e.preventDefault(); go(N-1); }
  else if(/^[1-9]$/.test(k)){ go(parseInt(k,10) - 1); }
});

function init(){
  render(); fit();
  let saved = 0;
  try{ saved = parseInt(localStorage.getItem('pgvector-slide') || '0', 10) || 0; }catch(e){}
  go(Math.min(saved, N-1), true);
  $('#btnPrev').onclick = prev; $('#btnNext').onclick = next;
  $('#btnToc').onclick = () => toggleSide('toc');
  $('#btnNotes').onclick = () => toggleSide('here');
  $('#btnAll').onclick = () => toggleSide('all');
  $('#btnAuto').onclick = toggleAuto;
  $('#btnFs').onclick = fs;
  $('#btnHelp').onclick = () => toggleSide('help');
  initAnims();
}
document.addEventListener('DOMContentLoaded', init);
</script>
