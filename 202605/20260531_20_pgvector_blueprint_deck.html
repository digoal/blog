<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数据库筑基课 · 应用实践之 pgvector｜把向量检索放回 PostgreSQL</title>
<style>
:root{
  --bg:#F7F6F2; --paper2:#F1EFE9; --ink:#1B2B33; --ink2:#46585F; --muted:#89938F;
  --line:#D9D5CB; --primary:#245A6B; --prim-l:#E5EFF0; --accent:#BE653B;
  --acc-l:#F7E9DE; --green:#2F7A66; --green-l:#E4F0EA; --gold:#AE8A3E;
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#E9E7E1}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
#viewport{position:absolute;left:0;right:0;top:0;bottom:58px;overflow:hidden}
#stage{position:absolute;width:1600px;height:900px;background:var(--bg);
  transform-origin:top left;box-shadow:0 18px 60px rgba(27,43,51,.13);
  transition:transform .34s cubic-bezier(.2,.7,.2,1),left .34s cubic-bezier(.2,.7,.2,1),
             top .34s cubic-bezier(.2,.7,.2,1)}
.slide{position:absolute;inset:0;display:none}
.slide.on{display:block;animation:fadein .40s cubic-bezier(.2,.7,.2,1)}
@keyframes fadein{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.eyebrow{position:absolute;left:64px;top:44px;font-size:13px;letter-spacing:3.4px;
  color:var(--primary);font-weight:600}
.eyebrow .num{font-family:var(--mono);letter-spacing:1px;color:var(--accent);margin-right:14px}
h1.title{position:absolute;left:64px;top:70px;margin:0;font-family:var(--serif);
  font-size:44px;line-height:1.25;font-weight:700;letter-spacing:1.2px;color:var(--ink);width:1472px}
.lede{position:absolute;left:64px;top:139px;width:1440px;font-size:19px;color:var(--ink2);
  line-height:1.5;letter-spacing:.3px}
.rule{position:absolute;left:64px;top:181px;width:1472px;height:1px;background:var(--line)}
.figwrap{position:absolute;left:100px;top:198px;width:1400px;height:430px}
svg.figure{display:block;overflow:visible}
svg.figure text{font-family:var(--sans)}
svg.figure text.serif{font-family:var(--serif)}
svg.figure text.mono{font-family:var(--mono)}
.caption{position:absolute;left:100px;top:638px;width:1400px;font-size:13px;
  color:var(--muted);letter-spacing:.4px;line-height:1.5}
.ctrls{position:absolute;left:100px;top:634px;width:1400px;height:44px;display:flex;
  align-items:center;gap:10px}
.ctrls label{font-size:13.5px;color:var(--ink2);white-space:nowrap}
.ctrls select,.ctrls input[type=range]{font-family:var(--sans);font-size:13.5px;color:var(--ink);
  background:#fff;border:1px solid var(--line);border-radius:4px;padding:5px 8px;outline:none}
.ctrls input[type=range]{width:150px;padding:0;accent-color:var(--primary);border:none;background:transparent}
.ctrls .btn{min-height:30px;padding:5px 12px;border:1px solid var(--primary);border-radius:4px;
  background:#fff;color:var(--primary);font-size:13px;cursor:pointer;font-family:var(--sans);white-space:nowrap}
.ctrls .btn.play{background:var(--primary);color:#fff}
.ctrls .btn:hover{filter:brightness(.94)}
.ctrls .out{font-size:13px;color:var(--ink2);margin-left:auto;min-width:0;flex:1;
  max-width:520px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrls .out b{color:var(--accent);font-weight:600}
.slide.anim .caption{top:684px}
.slide.anim .bridge{top:716px}
.bridge{position:absolute;left:64px;top:706px;width:1472px;font-size:20px;
  color:var(--accent);line-height:1.55;letter-spacing:.4px;padding-left:18px;
  border-left:3px solid var(--accent);font-family:var(--serif)}
.bridge .bk{font-family:var(--sans);font-size:13px;color:var(--muted);
  letter-spacing:2px;display:block;margin-bottom:2px}
.footer{position:absolute;left:64px;top:846px;width:1472px;height:1px;background:var(--line)}
.footer .fl{position:absolute;left:0;top:14px;font-size:12.5px;color:var(--muted);letter-spacing:2px}
.footer .fr{position:absolute;right:0;top:12px;font-family:var(--mono);font-size:14px;color:var(--ink2)}
.footer .fbar{position:absolute;left:0;right:0;top:-1px;height:2px;background:transparent}
.footer .fbar i{display:block;height:2px;background:var(--primary);width:0;transition:width .4s ease}

/* 底部外壳 */
.chrome{position:fixed;left:0;right:0;bottom:0;height:58px;background:#FCFBF8;
  border-top:1px solid var(--line);display:flex;align-items:center;gap:6px;
  padding:0 16px;z-index:40;font-size:13px;color:var(--ink2)}
.chrome .sep{width:1px;height:22px;background:var(--line);margin:0 5px}
.chrome button{font-family:var(--sans);font-size:13px;color:var(--ink2);background:transparent;
  border:1px solid transparent;border-radius:5px;padding:7px 10px;cursor:pointer;white-space:nowrap}
.chrome button:hover{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome button.act{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome kbd,.keystrip kbd{font-family:var(--mono);font-size:11.5px;color:var(--accent);
  background:#fff;border:1px solid var(--line);border-radius:3px;padding:1px 5px;margin-right:5px}
.chrome .pg{font-family:var(--mono);font-size:14px;color:var(--ink);min-width:76px;text-align:center}
.chrome .track{flex:1;height:3px;background:var(--line);border-radius:3px;margin:0 12px;position:relative}
.chrome .track i{position:absolute;left:0;top:0;height:3px;background:var(--primary);border-radius:3px;transition:width .35s}
.chrome .hint{font-size:12px;color:var(--muted);white-space:nowrap}

/* 全屏后底部常显的按键条 */
.keystrip{display:none;position:fixed;left:0;right:0;bottom:0;height:34px;
  background:rgba(252,251,248,.97);border-top:1px solid var(--line);z-index:45;
  align-items:center;justify-content:center;gap:18px;font-size:12.5px;color:var(--ink2);
  white-space:nowrap;overflow:hidden}
body.immersive .keystrip{display:flex}
body.immersive .chrome{display:none}
body.immersive #viewport{bottom:34px}
body.immersive .toast{bottom:48px}

/* 右侧页内开窗：讲稿 / 目录 / 帮助，均非模态、无遮罩 */
#side{position:fixed;right:0;top:0;bottom:58px;width:37%;min-width:370px;max-width:600px;
  background:#FCFBF8;border-left:1px solid var(--line);
  box-shadow:-14px 0 40px rgba(27,43,51,.07);
  transform:translateX(103%);transition:transform .34s cubic-bezier(.2,.7,.2,1);
  z-index:30;display:flex;flex-direction:column}
#side.on{transform:none}
body.immersive #side{bottom:34px}
#sideHead{padding:20px 26px 15px;border-bottom:1px solid var(--line);flex:none;
  display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
#sideHead h2{margin:0;font-family:var(--serif);font-size:24px;color:var(--ink);font-weight:700}
#sideHead .sub{font-size:12.5px;color:var(--muted);letter-spacing:1px}
#sideHead .cl{margin-left:auto;background:#fff;border:1px solid var(--line);border-radius:4px;
  padding:5px 10px;font-size:12.5px;cursor:pointer;color:var(--ink2);font-family:var(--sans)}
#sideHead .cl:hover{background:var(--prim-l);color:var(--primary)}
#sideBody{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 26px 46px}
#sideBody::-webkit-scrollbar{width:8px}
#sideBody::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.sec-note{border-bottom:1px solid var(--line);border-left:3px solid transparent;
  padding:16px 0 17px 15px;margin:0 -15px 0 -15px}
.sec-note.cur{background:var(--acc-l);border-left-color:var(--accent);padding-left:15px}
.sec-note .sn{font-family:var(--mono);font-size:11.5px;color:var(--accent);letter-spacing:1.2px}
.sec-note h3{margin:7px 0 10px;font-family:var(--serif);font-size:19px;color:var(--primary);
  line-height:1.45;font-weight:700}
.sec-note p{margin:0;font-size:15px;line-height:2.02;color:var(--ink2);letter-spacing:.25px}
.sec-note .bq{margin:12px 0 0;font-family:var(--serif);font-size:14.5px;color:var(--accent);
  line-height:1.7;padding-left:12px;border-left:2px solid var(--accent)}
.here-t{font-family:var(--serif);font-size:25px;color:var(--ink);margin:16px 0 4px;font-weight:700}
.here-e{font-size:12px;color:var(--muted);letter-spacing:1.6px;margin-bottom:20px}
.here-p{font-size:16px;line-height:2.12;color:var(--ink2);letter-spacing:.3px}
.here-b{margin-top:22px;padding:14px 16px;background:var(--acc-l);border-left:3px solid var(--accent);
  font-family:var(--serif);font-size:16px;line-height:1.8;color:var(--ink)}
.tocgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;padding:16px 0 10px}
.tocgrid a{display:block;padding:10px 11px;border:1px solid var(--line);background:#fff;
  text-decoration:none;cursor:pointer;color:var(--ink);transition:.18s}
.tocgrid a:hover{border-color:var(--primary);background:var(--prim-l)}
.tocgrid a.cur{border-color:var(--accent);background:var(--acc-l)}
.tocgrid a .gn{font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:1px}
.tocgrid a .gt{font-size:13.5px;line-height:1.45;display:block;margin-top:4px}
.keys2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 18px;padding:16px 0;
  font-size:14px;color:var(--ink2);line-height:1.7}
.keys2 kbd{font-family:var(--mono);font-size:11.5px;color:var(--accent);background:#fff;
  border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:2px 6px;margin-right:7px}
.sidefoot{font-size:12.5px;color:var(--muted);line-height:1.9;padding:14px 0 0;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);background:var(--ink);
  color:#fff;font-size:13px;padding:9px 16px;border-radius:5px;opacity:0;transition:.3s;
  z-index:80;pointer-events:none}
.toast.on{opacity:1}
@media print{.chrome,.keystrip,#side,.toast{display:none!important}#viewport{position:static}
  #stage{position:static;transform:none!important;box-shadow:none}
  .slide{display:block!important;page-break-after:always;position:relative;height:900px}}
</style>
</head>
<body>
<div id="viewport"><div id="stage"><div id="slides"></div></div></div>

<aside id="side" aria-label="页内讲稿窗口">
  <div id="sideHead"></div>
  <div id="sideBody"></div>
</aside>

<div class="chrome">
  <button id="btnPrev">← 上一页</button>
  <button id="btnNext">下一页 →</button>
  <span class="pg" id="pgNum">01 / 01</span>
  <div class="track" id="track"><i></i></div>
  <span class="sep"></span>
  <button id="btnToc"><kbd>G</kbd>目录</button>
  <button id="btnNotes"><kbd>N</kbd>本页讲稿</button>
  <button id="btnAll"><kbd>T</kbd>全文讲稿</button>
  <button id="btnAuto"><kbd>P</kbd><span id="autoLabel">自动播放</span></button>
  <button id="btnFs"><kbd>F</kbd>全屏 F</button>
  <button id="btnHelp"><kbd>?</kbd>快捷键</button>
  <span class="hint">← → 翻页 · 1–9 跳页</span>
</div>

<div class="keystrip" id="keystrip">
  <span><kbd>← →</kbd>翻页</span><span><kbd>G</kbd>目录</span>
  <span><kbd>N</kbd>本页讲稿</span><span><kbd>T</kbd>全文讲稿</span>
  <span><kbd>P</kbd>自动播放</span><span><kbd>F</kbd>退出全屏</span>
  <span><kbd>1–9</kbd>跳页</span><span><kbd>?</kbd>快捷键</span>
  <span><kbd>Esc</kbd>收起 / 退出</span>
</div>

<div class="toast" id="toast"></div>
<script>
const D = [{"eyebrow": "数据库筑基课 · 应用实践之 pgvector", "title": "把向量检索放回 PostgreSQL", "lede": "一个工程判断：向量应该和业务数据待在同一个系统里吗？｜从最上层的应用，一路剖到最底层的 WAL 与备份。", "caption": "图 1　地层剖面：pgvector 的七层位置。越深的靛青＝越底层；近似只发生在索引访问方法那一段。", "bridge": "那就从最上面那层开始：一次 AI 写入，到底要同一个系统管住哪些东西。", "notes": "今天不聊怎么安装扩展，也不聊哪个 embedding 模型好。我们只解决一个工程判断：当一个 AI 应用要把向量存下来，它到底应该放在哪儿。我给的答案是——先别急着引入新系统，看看 PostgreSQL 自己能不能扛住。因为真正的成本不在检索那一秒，而在检索之外的那些东西：权限、事务、审计、备份、恢复。你看这张剖面，最底下那层是 WAL 和备份，它提醒我们：pgvector 的价值不是「快」，是把向量放回了这套已经跑了几十年的工程体系里。接下来我们就从最上面那层往下挖，看看这条链路每一层到底做了什么。", "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><text x=\"20.0\" y=\"11.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.50\" fill=\"#89938F\" font-weight=\"400\" >深度 ↓ 越深＝越底层　·　越浅＝越靠近应用<\/text><rect x=\"20.0\" y=\"18.0\" width=\"1360.0\" height=\"52.0\" rx=\"3\" fill=\"#EBF1EE\" stroke=\"#EBF1EE\" stroke-width=\"1.0\" /><text x=\"38.0\" y=\"49.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.00\" fill=\"#1B2B33\" font-weight=\"600\" >应用与业务<\/text><text x=\"294.0\" y=\"48.7\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.50\" fill=\"#1B2B33\" font-weight=\"400\" >生成 embedding · 业务字段 · 租户权限 · 审计字段<\/text><rect x=\"20.0\" y=\"76.0\" width=\"1360.0\" height=\"52.0\" rx=\"3\" fill=\"#CFE0DC\" stroke=\"#CFE0DC\" stroke-width=\"1.0\" /><text x=\"38.0\" y=\"107.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.00\" fill=\"#1B2B33\" font-weight=\"600\" >SQL 与类型<\/text><text x=\"294.0\" y=\"106.7\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.50\" fill=\"#1B2B33\" font-weight=\"400\" >vector · halfvec · sparsevec · bit 上的距离函数<\/text><rect x=\"20.0\" y=\"134.0\" width=\"1360.0\" height=\"52.0\" rx=\"3\" fill=\"#A4C4C6\" stroke=\"#A4C4C6\" stroke-width=\"1.0\" /><text x=\"38.0\" y=\"165.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.00\" fill=\"#1B2B33\" font-weight=\"600\" >优化器与 opclass<\/text><text x=\"294.0\" y=\"164.7\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.50\" fill=\"#1B2B33\" font-weight=\"400\" >ORDER BY 距离操作符 ASC LIMIT k → 是否形成 KNN 路径<\/text><rect x=\"20.0\" y=\"192.0\" width=\"1360.0\" height=\"52.0\" rx=\"3\" fill=\"#74A5AD\" stroke=\"#74A5AD\" stroke-width=\"1.0\" /><text x=\"38.0\" y=\"223.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.00\" fill=\"#1B2B33\" font-weight=\"600\" >索引访问方法<\/text><text x=\"294.0\" y=\"222.7\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.50\" fill=\"#1B2B33\" font-weight=\"400\" >hnsw · ivfflat：ANN，返回候选 TID<\/text><rect x=\"20.0\" y=\"250.0\" width=\"1360.0\" height=\"52.0\" rx=\"3\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1.0\" /><text x=\"38.0\" y=\"281.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.00\" fill=\"#FFFFFF\" font-weight=\"600\" >执行器与堆表<\/text><text x=\"294.0\" y=\"280.7\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.50\" fill=\"#DCE9E7\" font-weight=\"400\" >回表 · 业务过滤 · MVCC 可见性判断<\/text><rect x=\"20.0\" y=\"308.0\" width=\"1360.0\" height=\"52.0\" rx=\"3\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.0\" /><text x=\"38.0\" y=\"339.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.00\" fill=\"#FFFFFF\" font-weight=\"600\" >事务与持久化<\/text><text x=\"294.0\" y=\"338.7\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.50\" fill=\"#DCE9E7\" font-weight=\"400\" >WAL · 复制 · 备份恢复 · 点时间恢复<\/text><rect x=\"20.0\" y=\"366.0\" width=\"1360.0\" height=\"52.0\" rx=\"3\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.0\" /><text x=\"38.0\" y=\"397.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.00\" fill=\"#FFFFFF\" font-weight=\"600\" >工程底座<\/text><text x=\"294.0\" y=\"396.7\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.50\" fill=\"#DCE9E7\" font-weight=\"400\" >同一套权限、审计、监控与运维体系<\/text><\/svg>", "ctrl": null, "anim": false}, {"eyebrow": "一 · 它解决什么问题", "title": "第一个工程问题不是「能不能存」", "lede": "而是向量、业务属性、权限、事务、审计、冷热与备份，能不能被同一个系统一起管理。", "caption": "图 2　同一事实的六类状态，与两条工程链路的成本对照。", "bridge": "问题问清楚了，接下来把可选的三条路摆到同一张表上。", "notes": "先把问题问对。很多团队一上来问「PostgreSQL 能不能存 16000 维向量」，能，但这不是第一个问题。第一个问题是：这一次写入里，向量、业务属性、租户权限、审计字段、事务边界、备份恢复，能不能被同一个系统管起来？你看上面这六样东西，在业务上属于同一个事实；如果把它拆到两个系统，就变成两次写入、两套权限、两条恢复链路。拆出去当然换来专用向量库的检索优化，但代价是双写一致性、权限同步、召回结果回表，还有故障时两条链路要一起对齐。所以这不是选型题，是成本归属题：你愿意为检索那一秒付多少工程复杂度。", "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20.0\" y=\"10.0\" width=\"1320.0\" height=\"34.0\" rx=\"3\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"34.0\" y=\"32.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.00\" fill=\"#FFFFFF\" font-weight=\"600\" >一个 AI 应用的一次写入：六类状态在业务上属于同一个事实<\/text><rect x=\"20.0\" y=\"52.0\" width=\"220.0\" height=\"72.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"130.0\" y=\"81.8\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.00\" fill=\"#1B2B33\" font-weight=\"400\" >向量<\/text><text x=\"130.0\" y=\"100.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.00\" fill=\"#1B2B33\" font-weight=\"400\" >embedding<\/text><rect x=\"240.0\" y=\"52.0\" width=\"220.0\" height=\"72.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"350.0\" y=\"81.8\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.00\" fill=\"#1B2B33\" font-weight=\"400\" >业务属性<\/text><text x=\"350.0\" y=\"100.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.00\" fill=\"#1B2B33\" font-weight=\"400\" >category / content<\/text><rect x=\"460.0\" y=\"52.0\" width=\"220.0\" height=\"72.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"570.0\" y=\"81.8\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.00\" fill=\"#1B2B33\" font-weight=\"400\" >租户权限<\/text><text x=\"570.0\" y=\"100.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.00\" fill=\"#1B2B33\" font-weight=\"400\" >tenant_id<\/text><rect x=\"680.0\" y=\"52.0\" width=\"220.0\" height=\ or=\"start\" font-size=\"15.00\" fill=\"#1B2B33\" font-weight=\"400\" >顺序扫描算距离<\/text><rect x=\"330.0\" y=\"72.0\" width=\"500.0\" height=\"78.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"344.0\" y=\"114.2\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.00\" fill=\"#1B2B33\" font-weight=\"400\" >事务简单，工程栈少<\/text><rect x=\"830.0\" y=\"72.0\" width=\"540.0\" height=\"78.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"844.0\" y=\"114.2\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.00\" fill=\"#1B2B33\" font-weight=\"400\" >大表 TopK 延迟高；距离语义难以表达<\/text><rect x=\"30.0\" y=\"150.0\" width=\"300.0\" height=\"78.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"44.0\" y=\"182.4\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.00\" fill=\"#1B2B33\" font-weight=\"400\" >向量放专用向量库<\/text><text x=\"44.0\" y=\"201.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.00\" fill=\"#1B2B33\" font-weight=\"400\" >业务数据放 PostgreSQL<\/text><rect x=\"330.0\" y=\"150.0\" width=\"500.0\" height=\"78.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"344.0\" y=\"192.2\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.00\" fill=\"#1B2B33\" font-weight=\"400\" >检索能力强，生态成熟<\/text><rect x=\"830.0\" y=\"150.0\" width=\"540.0\" height=\"78.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"844.0\" y=\"192.2\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.00\" fill=\"#1B2B33\" font-weight=\"400\" >双写、一致性、权限、备份、回表链路复杂<\/text><rect x=\"30.0\" y=\"228.0\" width=\"300.0\" height=\"78.0\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"44.0\" y=\"270.1\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.00\" fill=\"#1B2B33\" font-weight=\"400\" >PostgreSQL + pgvector<\/text><rect x=\"330.0\" y=\"228.0\" width=\"500.0\" height=\"78.0\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" ": "二 · 一次查询的路径", "title": "索引只给候选，正确性由 PostgreSQL 兜底", "lede": "HNSW / IVFFlat 返回候选 TID，之后仍要回堆表、过 MVCC、走 WAL 与普通 SQL 执行体系。", "caption": "图 6　重绘原文图 1：应用 → SQL → pgvector → ANN 候选 → 堆表 / MVCC / WAL。连线全部为水平或竖直直角。", "bridge": "链路的第一环是类型——而这里藏着两套完全不同的上限。", "notes": "我们顺着一次查询，走一遍完整路径。应用生成 embedding 写进 PG，SQL 层拿到的是 ORDER BY 距离操作符 LIMIT k；pgvector 在这里提供类型、操作符和 opclass；优化器如果认定这是 KNN 形态，就交给 HNSW 或 IVFFlat，它们返回的不是最终结果，而是一批候选 TID。注意这个位置——原图里最容易看漏的一点：索引只负责给候选。真正的行还要回堆表，经过 MVCC 可见性判断，读到的页面受 WAL、复制和备份体系约束。换句话说，近似只发生在「选哪些候选」这一步，事务正确性还是 PostgreSQL 兜底。这也是共库方案最实在的收益。", "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20.0\" y=\"20.0\" width=\"340.0\" height=\"80.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"190.0\" y=\"53.1\" class=\"sv s\" text-anchor=\"middle\" font-size=\"18.00\" fill=\"#1B2B33\" font-weight=\"600\" >应用服务<\/text><text x=\"190.0\" y=\"75.6\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.50\" fill=\"#46585F\" font-weight=\"400\" >生成 embedding，写入 PostgreSQL<\/text><rect x=\"400.0\" y=\"20.0\" width=\"440.0\" height=\"80.0\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"620.0\" y=\"53.1\" class=\"sv s\" text-anchor=\"middle\" font-size=\"18.00\" fill=\"#1B2B33\" font-weight=\"600\" >PostgreSQL SQL 层<\/text><text x=\"620.0\" y=\"75.6\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.50\" fill=\"#46585F\" font-weight=\"400\" >ORDER BY 距离操作符 LIMIT k<\/text><rect x=\"880.0\" y=\"20.0\" width=\"500.0\" height=\"80.0\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"1130.0\" y=\"53.1\" class=\"sv s\" text-anchor=\"middle\" font-size=\"18.00\" fill=\"#1B2B33\" font-weight=\"600\" >pgvector 扩展接口<\/text><text x=\"1130.0\" y=\"75.6\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.50\" fill=\"#46585F\" font-weight=\"400\" >类型 · 操作符 · operator class<\/text><line x1=\"360.0\" y1=\"60. \/text><rect x=\"920.0\" y=\"122.0\" width=\"460.0\" height=\"58.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"934.0\" y=\"153.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.00\" fill=\"#1B2B33\" font-weight=\"400\" >HNSW 2000 维 · IVFFlat 2000 维<\/text><rect x=\"730.0\" y=\"180.0\" width=\"190.0\" height=\"58.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"744.0\" y=\"211.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.00\" fill=\"#1B2B33\" font-weight=\"400\" >halfvec<\/text><rect x=\"920.0\" y=\"180.0\" width=\"460.0\" height=\"58.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"934.0\" y=\"211.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.00\" fill=\"#1B2B33\" font-weight=\"400\" >HNSW 4000 维 · IVFFlat 4000 维<\/text><rect x=\"730.0\" y=\"238.0\" width=\"190.0\" height=\"58.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"744.0\" y=\"269.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.00\" fill=\"#1B2B33\" font-weight=\"400\" >bit<\/text><rect x=\"920.0\" y=\"238.0\" width=\"460.0\" height=\"58.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"934.0\" y=\"269.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.00\" fill=\"#1B2B33\" font-weight=\"400\" >HNSW 64000 维 · IVFFlat 64000 维<\/text><rect x=\"730.0\" y=\"296.0\" width=\"190.0\" height=\"58.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"744.0\" y=\"327.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.00\" fill=\"#1B2B33\" font-weight=\"400\" >sparsevec<\/text><rect x=\"920.0\" y=\"296.0\" width=\"460.0\" height=\"58.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"934.0\" y=\"327.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.00\" fill=\"#1B2B33\" font-weight=\"400\" >HNSW 1000 非零；IVFFlat 无对应 opclass<\/text><text x=\"700.0\" y=\"210.0\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"40.00\" fill=\"#BE653B\" font-weight=\"700\" >≠<\/text><rect x=\"20.0\" y=\"368.0\" width=\"1360.0\" height=\"50.0\" rx=\"3\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1.0\" /><text x=\"34.0\" y=\"390.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.00\" fill=\"#1B2B33\" font-weight=\"600\" >超过 2000 维的四条路径：halfvec 半精度索引 · binary quantization · subvector / 降维 · re-rank<\/text><text x=\"34.0\" y=\"410.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.50\" fill=\"#46585F\" font-weight=\"400\" >源码：src/hnsw.h 的 HNSW_MAX_DIM 2000 / HNSW_MAX_NNZ 1000；src/ivfflat.h 的 IVFFLAT_MAX_DIM 2000。能存不等于能建 ANN 索引。<\/text><\/svg>", "ctrl": null, "anim": false}, {"eyebrow": "三 · 核心原理 · 选型", "title": "每维几个字节，决定工作集有多大", "lede": "四种类型的存储公式与用途；按公式计算，1536 维从 6152 B 降到 3080 B。", "caption": "图 8　存储成本取自 README Reference；6152 / 3080 字节为公式代入，非实测统计。", "bridge": "类型定了，距离语义必须写进 SQL；写错一个符号，整条链就断在这里。", "notes": "再看每维几个字节，这决定了工作集有多大。README 的 Reference 给得很明确：vector 是 4 * dimensions + 8 字节，halfvec 是 2 * dimensions + 8，bit 是 dimensions / 8 + 8，sparsevec 是 8 * 非零元素 + 16。按公式算，1536 维的 float32 是 6152 字节，换成 halfvec 是 3080 字节，正好减半。这不是编造的统计，就是公式代入，我特意标出来。所以 halfvec 的典型用途是压低存储和索引工作集，bit 用于二值量化后的 Hamming / Jaccard，sparsevec 用于稀疏特征和关键词权重。但要记住一条：halfvec 和二值量化都不是无损优化，精度可能掉，通常要配合 re-rank。省的是空间，付的是召回。", "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20.0\" y=\"20.0\" width=\"190.0\" height=\"50.0\" rx=\"3\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"34.0\" y=\"48.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.50\" fill=\"#FFFFFF\" font-weight=\"600\" >类型<\/text><rect x=\"210.0\" y=\"20.0\" width=\"330.0\" height=\"50.0\" rx=\"3\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"224.0\" y=\"48.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.50\" fill=\"#FFFFFF\" font-weight=\"600\" >存储模型<\/text><rect x=\"540.0\" y=\"20.0\" width=\"300.0\" height=\"50.0\" rx=\"3\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"554.0\" y=\"48.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.50\" fill=\"#FFFFFF\" font-weight=\"600\" >存储成本（README Reference）<\/text><rect x=\"840.0\" y=\"20.0\" width=\"520.0\" height=\"50.0\" rx=\"3\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"854.0\" y=\"48.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.50\" fill=\"#FFFFFF\" font-weight=\"600\" >常见用途<\/text><rect x=\"20.0\" y=\"70.0\" width=\"190.0\" height=\"62.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"34.0\" y=\"104.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.50\" fill=\"#1B2B33\" font-weight=\"400\" >vector<\/text><rect x=\"210.0\" y=\"70.0\" width=\"330.0\" height=\"62.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"224.0\" y=\"104.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.50\" fill=\"#1B2B33\" font-weight=\"400\" >float32 稠密向量<\/text><rect x=\"540.0\" y=\"70.0\" width=\"300.0\" height=\"62.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"554.0\" y=\"104.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.50\" fill=\"#1B2B33\" font-weight=\"400\" >4 * dimensions + 8 字节<\/text><rect x=\"840.0\" y=\"70.0\" width=\"520.0\" height=\"62.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"854.0\" y=\"104.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.50\" fill=\"#1B2B33\" font-weight=\"400\" >常规 embedding<\/text><rect x=\"20.0\" y=\"132.0\" width=\"190.0\" height=\"62.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"34.0\" y=\"166.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.50\" fill=\"#1B2B33\" font-weight=\"400\" >halfvec<\/text><rect x=\"210.0\" y=\"132.0\" width=\"330.0\" height=\"62.0\" rx=\"3\" ext x=\"34.0\" y=\"290.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.50\" fill=\"#1B2B33\" font-weight=\"400\" >sparsevec<\/text><rect x=\"210.0\" y=\"256.0\" width=\"330.0\" height=\"62.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"224.0\" y=\"290.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.50\" fill=\"#1B2B33\" font-weight=\"400\" >稀疏向量<\/text><rect x=\"540.0\" y=\"256.0\" width=\"300.0\" height=\"62.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"554.0\" y=\"290.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.50\" fill=\"#1B2B33\" font-weight=\"400\" >8 * 非零元素 + 16 字节<\/text><rect x=\"840.0\" y=\"256.0\" width=\"520.0\" height=\"62.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"854.0\" y=\"290.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.50\" fill=\"#1B2B33\" font-weight=\"400\" >稀疏特征、关键词权重<\/text><rect x=\"20.0\" y=\"336.0\" width=\"1340.0\" height=\"82.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"38.0\" y=\"366.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.00\" fill=\"#245A6B\" font-weight=\"600\" >按公式计算：1536 维 float32 = 4×1536+8 = 6152 B；halfvec = 2×1536+8 = 3080 B，工作集减半。<\/text><text x=\"38.0\" y=\"396.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.00\" fill=\"#BE653B\" font-weight=\"400\" >但 halfvec 与 binary quantization 都不是无损优化：精度可能下降，通常需要 re-rank。省的是空间，付的是召回。<\/text><\/svg>", "ctrl": null, "anim": false}, {"eyebrow": "三 · 核心原理 · 操作符", "title": "距离不是相似度，语义必须写进 SQL", "lede": "<=> 是 cosine distance，<#> 是负内积；ORDER BY 必须是距离操作符本身、升序，并配 LIMIT。", "caption": "图 9　六个距离操作符，以及两条语义等价、索引行为却相反的 SQL。", "bridge": "为什么包一层表达式就不认？答案在优化器的成本估算里。", "notes": "现在到操作符这一层，也是线上事故高发区。pgvector 把距离做成了操作符，SQL 里必须写清楚是哪一种距离。<=> 是 cosine distance，不是相似度，越小越近；要展示相似度得写 1 - (embedding <=> query)。<#> 返回的是负内积，因为 PostgreSQL 的索引扫描按升序拿最小值更自然，最大内积被翻转成最小负内积，展示真实内积要乘以 -1。还有最容易中招的一条：README 的 Troublesho  "ctrl": null, "anim": false}, {"eyebrow": "三 · 核心原理 · 优化器入口", "title": "没有 ORDER BY 距离 LIMIT，就不是 KNN 语义", "lede": "cost estimate 里，path->indexorderbys == NIL 会把索引成本置为无穷大。可切换 SQL 形态并逐步播放判定过程。", "caption": "动画 A　选择 SQL 形态 → 播放 / 单步 / 重置，观察五步判定与两个结果框的高亮变化。", "bridge": "入口确认之后，看第一个 ANN 结构：HNSW 怎么用图换速度。", "notes": "为什么包一层表达式就不行？看源码里的 cost estimate。src/hnsw.c 和 src/ivfflat.c 的逻辑很像：如果 path->indexorderbys 是 NIL，也就是说这条路径没有「按索引顺序返回」的要求，就把索引的启动成本和总成本设成无穷大。翻译成人话：ANN 索引不是普通过滤索引，它只认识 ORDER BY 距离操作符 ASC LIMIT k 这一种 TopK 最近邻形态。你在下面这个选择器里换四种 SQL 试一下——带 ORDER BY 距离加 LIMIT 的走索引；写成 WHERE distance < 5 的只是距离过滤；把距离包进 1 - (...) DESC 的语义等价但不匹配入口；少了 LIMIT 的也表达不出 KNN。这就是「建了索引但不走索引」最常见的根因。播放按钮会一步一步把优化器的判定走一遍。", "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" id=\"optFlow\"><rect x=\"10.0\" y=\"20.0\" width=\"248.0\" height=\"100.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" data-step=\"1\" data-on=\"#E5EFF0\" data-off=\"#FFFFFF\" data-onstroke=\"#245A6B\" data-offstroke=\"#D9D5CB\"/><text x=\"134.0\" y=\"63.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.00\" fill=\"#1B2B33\" font-weight=\"600\" >解析 SQL<\/text><text x=\"134.0\" y=\"85.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.00\" fill=\"#46585F\" font-weight=\"400\" >拿到查询树<\/text><rect x=\"292.0\" y=\"20.0\" width=\"248.0\" height=\"100.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" data-step=\"2\" data-on=\"#E5EFF0\" data-off=\"#FFFFFF\" data-onstroke=\"#245A6B\" data-offstroke=\"#D9D5CB\"/><text x=\"416.0\" y=\"63.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.00\" fill=\"#1B2B33\" font-weight=\"600\" >ORDER BY 形态<\/text><text x=\"416.0\" y=\"85.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.00\" fill=\"#46585F\" font-weight=\"400\" >距离操作符本身 · ASC<\/text><rect x=\"574.0\" y=\"20.0\" width=\"248.0\" height=\"100.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" data-step=\"3\" data-on=\"#E5EFF0\" data-off=\"#FFFFFF\" data-onstroke=\"#245A6B\" data-offstroke=\"#D9D5CB\"/><text x=\"698.0\" y=\"63.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.00\" fill=\"#1B2B33\" font-weight=\"600\" >LIMIT k<\/text><text x=\"698.0\" y=\"85.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.00\" fill=\"#46585F\" font-weight=\"400\" >表达 TopK 最近邻<\/text><rect x=\"856.0\" y=\"20.0\" width=\"248.0\" height=\"100.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" data-step=\"4\" data-on=\"#E5EFF0\" data-off=\"#FFFFFF\" data-onstroke=\"#245A6B\" data-offstroke=\"#D9D5CB\"/><text x=\"980.0\" y=\"63.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.00\" fill=\"#1B2B33\" font-weight=\"600\" >opclass 匹配<\/text><text x=\"980.0\" y=\"85.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.00\" fill=\"#46585F\" font-weight=\"400\" >与索引的距离一致<\/text><rect x=\"1138.0\" y=\"20.0\" width=\"248.0\" height=\"100.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" data-step=\"5\" data-on=\"#E5EFF0\" data-off=\"#FFFFFF\" data-onstroke=\"#245A6B\" data-offstroke=\"#D9D5CB\"/><text x=\"1262.0\" y=\"63.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.00\" fill=\"#1B2B33\" font-weight=\"600\" >cost estimate<\/text><text x=\"1262.0\" y=\"85.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.00\" fill=\"#46585F\" font-weight=\"400\" >indexorderbys == NIL ?<\/text><line x1=\"258.0\" y1=\"70.0\" x2=\"292.0\" y2=\"70.0\" stroke=\"#7BA6AF\" stroke-width=\"2.0\" /><polygon points=\"292.0,70.0 283.0,65.0 283.0,75.0\" fill=\"#7BA6AF\"/><line x1=\"540.0\" y1=\"70.0\" x2=\"574.0\" y2=\"70.0\" stroke=\"#7BA6AF\" stroke-width=\"2.0\" /><polygon points=\"574.0,70.0 565.0,65.0 565.0,75.0\" fill=\"#7BA6AF\"/><line x1=\"822.0\" y1=\"70.0\" x2=\"856.0\" y2=\"70.0\" stroke=\"#7BA6AF\" stroke-width=\"2.0\" /><polygon points=\"856.0,70.0 847.0,65.0 847.0,75.0\" fill=\"#7BA6AF\"/><line x1=\"1104.0\" y1=\"70.0\" x2=\"1138.0\" y2=\"70.0\" stroke=\"#7BA6AF\" stroke-width=\"2.0\" /><polygon points=\"1138.0,70.0 1129.0,65.0 1129.0,75.0\" fill=\"#7BA6AF\"/><line x1=\"1262.0\" y1=\"120.0\" x2=\"1262.0\" y2=\"140.0\" stroke=\"#7BA6AF\" stroke-width=\"1.8\" /><line x1=\"350.0\" y1=\"140.0\" x2=\"1262.0\" y2=\"140.0\" stroke=\"#7BA6AF\" stroke-width=\"1.8\" /><line x1=\"350.0\" y1=\"140.0\" x2=\"350.0\" y2=\"160.0\" stroke=\"#7BA6AF\" stroke-width=\"1.8\" /><polygon points=\"350.0,160.0 345.1,151.0 354.9,151.0\" fill=\"#7BA6AF\"/><line x1=\"1048.0\" y1=\"140.0\" x2=\"1048.0\" y2=\"160.0\" stroke=\"#7BA6AF\" stroke-width=\"1.8\" /><polygon points=\"1048.0,160.0 1043.0,151.0 1053.0,151.0\" fill=\"#7BA6AF\"/><rect x=\"10.0\" y=\"160.0\" width=\"680.0\" height=\"100.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" id=\"optYes\"/><text x=\"350.0\" y=\"200.0\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"21.00\" fill=\"#1B2B33\" font-weight=\"600\" >走 ANN 索引<\/text><text x=\"350.0\" y=\"232.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.50\" fill=\"#46585F\" font-weight=\"400\" >HNSW / IVFFlat 的 KNN 扫描，返回候选 TID<\/text><rect x=\"710.0\" y=\"160.0\" width=\"676.0\" height=\"100.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" id=\"optNo\"/><text x=\"1048.0\" y=\"200.0\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"21.00\" fill=\"#1B2B33\" font-weight=\"600\" >退回顺序扫描<\/text><text x=\"1048.0\" y=\"232.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.50\" fill=\"#46585F\" font-weight=\"400\" >path-&gt;indexorderbys == NIL → 启动成本与总成本 = ∞<\/text><rect x=\"10.0\" y=\"282.0\" width=\"1376.0\" height=\"136.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"30.0\" y=\"310.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.50\" fill=\"#1B2B33\" font-weight=\"400\" >源码依据 · src/hnsw.c / src/ivfflat.c 的 cost estimate：path-&gt;indexorderbys == NIL 时，把索引启动成本与总成本设为无穷大。<\/text><text x=\"30.0\" y=\"344.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.50\" fill=\"#46585F\" font-weight=\"400\" >所以 ANN 索引不是普通过滤索引；WHERE embedding &lt;-&gt; q &lt; 5 只是距离过滤，不是 KNN 入口。<\/text><text x=\"30.0\" y=\"378.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.50\" fill=\"#46585F\" font-weight=\"400\" >另外，表太小时顺序扫描本来可能更快；也可以在事务里 SET LOCAL enable_seqscan = off 观察计划变化。<\/text><\/svg>", "ctrl": "<label>SQL 形态<\/label>\n<select id=\"optSql\">\n<option value=\"0\">ORDER BY embedding &lt;-&gt; q LIMIT 5<\/option>\n<option value=\"1\">WHERE embedding &lt;-&gt; q &lt; 5<\/option>\n<option value=\"2\">ORDER BY 1 - (embedding &lt;=&gt; q) DESC LIMIT 5<\/option>\n<option value=\"3\">ORDER BY embedding &lt;-&gt; q（无 LIMIT）<\/option>\n<\/select>\n<button class=\"btn play\" id=\"optPlay\">▶ 播放<\/button>\n<button class=\"btn\" id=\"optStep\">单步<\/button>\n<button class=\"btn\" id=\"optReset\">重置<\/button>\n<span class=\"out\" id=\"optOut\"><\/span>", "anim": true}, {"eyebrow": "三 · 核心原理 · HNSW", "title": "先在稀疏高层找方向，再在第 0 层扩候选", "lede": "多层小世界图，用图质量、候选规模和资源消耗换召回。播放可逐层点亮搜索路径。", "caption": "动画 B　五个步骤：入口点 → 高层贪心 → 逐层下降 → 第 0 层扩展 → 返回 TopK。示意节点不代表真实数据分布。", "bridge": "图看明白了，再把它身上那几个旋钮逐个拧紧。", "notes": "HNSW 为什么快？它建的是一张多层小世界图。高层节点少、边长，负责快速接近目标区域；第 0 层节点全、边密，负责扩展候选。src/hnswscan.c 的 GetScanItems() 就是这个流程：先从 metapage 拿 m 和入口点，从最高层往下逐层用 ef=1 做贪心搜索，到第 0 层再用 hnsw.ef_search 扩展候选队列。你在图上按播放，会看到这几步依次亮起来——先在稀疏高层找方向，再在最密的第 0 层把候选摊开。下面的 ef_search 输入可以换成 10、40、100：候选越大，召回越高，代价是延迟和内存一起上去。README 给的默认就是 40。这里没有奇迹，只有拿资源换召回。", "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" id=\"hnsFlow\"><rect x=\"20.0\" y=\"20.0\" width=\"980.0\" height=\"100.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"20.0\" y=\"20.0\" width=\"120.0\" height=\"100.0\" rx=\"3\" fill=\"#A4C4C6\" stroke=\"#A4C4C6\" stroke-width=\"1.0\" /><text x=\"80.0\" y=\"75.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.50\" fi =\"btn play\" id=\"hnsPlay\">▶ 播放<\/button>\n<button class=\"btn\" id=\"hnsStep\">单步<\/button>\n<button class=\"btn\" id=\"hnsReset\">重置<\/button>\n<span class=\"out\" id=\"hnsOut\"><\/span>", "anim": true}, {"eyebrow": "三 · 核心原理 · 参数代价", "title": "三个旋钮，调的是同一组平衡", "lede": "m / ef_construction / ef_search，加上构建期的 maintenance_work_mem 与迭代扫描边界。", "caption": "图 10　默认值与出处取自 README 与源码注释；收益 / 代价为定性关系，不含实测数字。", "bridge": "同样是 ANN，IVFFlat 换了个思路：不建图，先分桶。", "notes": "把三个旋钮放在一起，你会发现它们调的是同一组平衡。m 是每层最大连接数，默认 16，决定图的连通度；ef_construction 是构图时候选列表大小，默认 64，越大通常召回越好，但构建更慢、插入更慢；hnsw.ef_search 是查询时候选列表大小，默认 40，越大召回越高，延迟和内存也越高。还有构建阶段本身：src/hnswbuild.c 的文件头说，图尽量放在内存里，超过 maintenance_work_mem 就调 FlushPages() 物化到磁盘、切到 on-disk 阶段，内存不够时还会发那条「hnsw graph no longer fits into maintenance_work_mem」的 NOTICE。所以 README 的建议是在不耗尽服务器内存的前提下调高它。至于 0.8.0 之后的 iterative_scan、max_scan_tuples、scan_mem_multiplier，是给过滤后候选不足兜底的。一句话：图质量、候选规模、资源消耗，三者只能一起调。", "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20.0\" y=\"20.0\" width=\"210.0\" height=\"50.0\" rx=\"3\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"34.0\" y=\"47.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.00\" fill=\"#FFFFFF\" font-weight=\"600\" >旋钮<\/text><rect x=\"230.0\" y=\"20.0\" width=\"370.0\" height=\"50.0\" rx=\"3\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"244.0\" y=\"47.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.00\" fill=\"#FFFFFF\" font-weight=\"600\" >默认值与出处<\/text><rect x=\"600.0\" y=\"20.0\" width=\"370.0\" height=\"50.0\" rx=\"3\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"614.0\" y=\"47.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.00\" fill=\"#FFFFFF\" font-weight=\"600\" >调大的收益<\/text><rect x=\"970.0\" y=\"20.0\" width=\"390.0\" height=\"50.0\" rx=\"3\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"984.0\" y=\"47.9\" clas xt><rect x=\"485.0\" y=\"222.0\" width=\"430.0\" height=\"100.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" data-step=\"5\" data-on=\"#E4F0EA\" data-off=\"#FFFFFF\" data-onstroke=\"#245A6B\" data-offstroke=\"#D9D5CB\"/><text x=\"700.0\" y=\"265.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.00\" fill=\"#1B2B33\" font-weight=\"600\" >选最近的 probes 个 list<\/text><text x=\"700.0\" y=\"287.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.00\" fill=\"#46585F\" font-weight=\"400\" >ivfflat.probes 默认 1<\/text><rect x=\"960.0\" y=\"222.0\" width=\"430.0\" height=\"100.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" data-step=\"6\" data-on=\"#E4F0EA\" data-off=\"#FFFFFF\" data-onstroke=\"#245A6B\" data-offstroke=\"#D9D5CB\"/><text x=\"1175.0\" y=\"265.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.00\" fill=\"#1B2B33\" font-weight=\"600\" >扫描条目按真实距离排序<\/text><text x=\"1175.0\" y=\"287.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.00\" fill=\"#46585F\" font-weight=\"400\" >GetScanItems() 返回候选<\/text><line x1=\"440.0\" y1=\"272.0\" x2=\"485.0\" y2=\"272.0\" stroke=\"#7BA6AF\" stroke-width=\"2.0\" /><polygon points=\"485.0,272.0 476.0,267.1 476.0,276.9\" fill=\"#7BA6AF\"/><line x1=\"915.0\" y1=\"272.0\" x2=\"960.0\" y2=\"272.0\" stroke=\"#7BA6AF\" stroke-width=\"2.0\" /><polygon points=\"960.0,272.0 951.0,267.1 951.0,276.9\" fill=\"#7BA6AF\"/><rect x=\"10.0\" y=\"338.0\" width=\"1380.0\" height=\"80.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"28.0\" y=\"366.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.00\" fill=\"#1B2B33\" font-weight=\"600\" >源码：src/ivfbuild.c 的 ComputeCenters() 采样 lists * 50（至少 10000）；样本少于 lists 会发 low recall 的 NOTICE。<\/text><text x=\"28.0\" y=\"396.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.50\" fill=\"#46585F\" font-weight=\"400\" >src/ivfscan.c 的 GetScanLists() 保留最近中心，GetScanItems() 扫描 list 内条目并按真实距离排序；新增行走 ivfinsert.c。<\/text><\/svg>", "ctrl": "<label>probes<\/label>\n<input type=\"range\" id=\"ivfProbes\" min=\"1\" max=\"8\" step=\"1\" value=\"1\">\n<span id=\"ivfPLbl\" style=\"font-family:var(--mono);font-size:13px;color:var(--accent)\">1<\/span>\n<button class=\"btn play\" id=\"ivfPlay\">▶ 播放<\/button>\n<button class=\"btn\" id=\"ivfStep\">单步<\/button>\n<button class=\"btn\" id=\"ivfReset\">重置<\/button>\n<span class=\"out\" id=\"ivfOut\"><\/span>", "anim": true}, {"eyebrow": "三 · 核心原理 · 训练陷阱", "title": "空表建索引，是把错误的中心固化下来", "lede": "lists / probes 的经验起点只是起点；三种低召回成因都指向训练数据。", "caption": "图 11　经验公式取自 README IVFFlat 章节；右侧三条成因对应源码与 Troubleshooting 的提示。", "bridge": "两种索引、精确扫描、专用库，现在可以放在一张表里选了。", "notes": "参数怎么起步？README 给的是经验起点，不是 SLA 保证：100 万行以内，lists 可以从 rows / 1000 开始；超过 100 万行，从 sqrt(rows) 开始；查询时 probes 可以从 sqrt(lists) 开始。lists 默认 100，probes 默认 1。真正要盯的是三种低召回成因：第一，表里数据太少就建索引，中心是从那点样本里学出来的，后面数据涨了也不会自动重学；第二，lists 相对数据量过多，桶太细、每个桶条目太少；第三，probes 太低，查询只看到局部空间。这三个的共同后果都是「返回结果少或召回差」，动作也一致——先装载有代表性的数据再建索引，然后按 recall@K 调参。空表建 IVFFlat，本质上是把一组错误的中心固化下来。", "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20.0\" y=\"20.0\" width=\"300.0\" height=\"46.0\" rx=\"3\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"34.0\" y=\"46.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.50\" fill=\"#FFFFFF\" font-weight=\"600\" >条件<\/text><rect x=\"320.0\" y=\"20.0\" width=\"340.0\" height=\"46.0\" rx=\"3\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"334.0\" y=\"46.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.50\" fill=\"#FFFFFF\" font-weight=\"600\" >经验起点（README）<\/text><rect x=\"20.0\" y=\"66.0\" width=\"300.0\" height=\"60.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"34.0\" y=\"99.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.50\" fill=\"#1B2B33\" font-weight=\"400\" >数据量 ≤ 100 万行<\/text><rect x=\"320.0\" y=\"66.0\" width=\"340.0\" height=\"60.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"334.0\" y=\"99.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.50\" fill=\"#1B2B33\" font-weight=\"400\" >lists = rows / 1000<\/text><rect x=\"20.0\" y=\"126.0\" width=\"300.0\" height=\"60.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"34.0\" y=\"159.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.50\" fill=\"#1B2B33\" font-weight=\"400\" >数据量 &gt; 100 万行<\/text><rect x=\"320.0\" y=\"126.0\" width=\"340.0\" height=\"60.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"334.0\" y=\"159.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.50\" fill=\"#1B2B33\" font-weight=\"400\" >lists = sqrt(rows)<\/text><rect x=\"20.0\" y=\"186.0\" width=\"300.0\" height=\"60.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"34.0\" y=\"219.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.50\" fill=\"#1B2B33\" font-weight=\"400\" >查询阶段<\/text><rect x=\"320.0\" y=\"186.0\" width=\"340.0\" height=\"60.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"334.0\" y=\"219.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.50\" fill=\"#1B2B33\" font-weight=\"400\" >probes = sqrt(lists)<\/text><rect x=\"20.0\" y=\"250.0\" width=\"640.0\" height=\"60.0\" rx=\"3\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1.0\" /><text x=\"36.0\" y=\"275.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.00\" fill=\"#1B2B33\" font-weight=\"600\" >默认值：lists = 100（IVFFLAT_DEFAULT_LISTS）、probes = 1。<\/text><text x=\"36.0\" y=\"298.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.50\" fill=\"#BE653B\" font-weight=\"400\" >注意：这只是起点，不是 SLA 保证；要用 recall@K 复核。<\/text><rect x=\"20.0\" y=\"322.0\" width=\"640.0\" height=\"96.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"36.0\" y=\"352.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.50\" fill=\"#46585F\" font-weight=\"400\" >另有 ivfflat.iterative_scan 与 ivfflat.max_probes：过滤或候选不足时控制迭代扫描边界。<\/text><text x=\"36.0\" y=\"382.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.00\" fill=\"#46585F\" font-weight=\"400\" >构建阶段可看 pg_stat_progress_create_index 的 k-means / assigning / loading。<\/text><rect x=\"700.0\" y=\"20.0\" width=\"680.0\" height=\"46.0\" rx=\"3\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"1040.0\" y=\"46.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.50\" fill=\"#FFFFFF\" font-weight=\"600\" >三种低召回成因 → 对应动作<\/text><rect x=\"700.0\" y=\"66.0\" width=\"680.0\" height=\"100.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"714.0\" y=\"109.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.50\" fill=\"#1B2B33\" font-weight=\"400\" >① 数据太少就建索引<\/text><text x=\"714.0\" y=\"128.5\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.50\" fill=\"#1B2B33\" font-weight=\"400\" >中心来自建索引时的样本；先装载有代表性的数据再建或重建<\/text><rect x=\"700.0\" y=\"166.0\" width=\"680.0\" height=\"100.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"714.0\" y=\"209.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.50\" fill=\"#1B2B33\" font-weight=\"400\" >② lists 相对数据量过多<\/text><text x=\"714.0\" y=\"228.5\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.50\" fill=\"#1B2B33\" font-weight=\"400\" >桶太细、每桶条目太少；按 rows / 1000 或 sqrt(rows) 重新估算<\/text><rect x=\"700.0\" y=\"266.0\" width=\"680.0\" height=\"100.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"714.0\" y=\"309.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.50\" fill=\"#1B2B33\" font-weight=\"400\" >③ probes 过低<\/text><text x=\"714.0\" y=\"328.5\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.50\" fill=\"#1B2B33\" font-weight=\"400\" >查询只看到局部空间；提高 probes 或启用 iterative_scan<\/text><rect x=\"700.0\" y=\" ght=\"56.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"922.5\" y=\"332.7\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.00\" fill=\"#1B2B33\" font-weight=\"400\" >数据相对稳定、快速建索引<\/text><rect x=\"1065.0\" y=\"302.0\" width=\"295.0\" height=\"56.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"1212.5\" y=\"332.7\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.00\" fill=\"#1B2B33\" font-weight=\"400\" >超大规模、专用检索功能<\/text><rect x=\"20.0\" y=\"358.0\" width=\"190.0\" height=\"56.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"34.0\" y=\"388.7\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.00\" fill=\"#1B2B33\" font-weight=\"400\" >不适合场景<\/text><rect x=\"210.0\" y=\"358.0\" width=\"285.0\" height=\"56.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"352.5\" y=\"388.7\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.00\" fill=\"#1B2B33\" font-weight=\"400\" >大表高并发在线检索<\/text><rect x=\"495.0\" y=\"358.0\" width=\"285.0\" height=\"56.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"637.5\" y=\"388.7\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.00\" fill=\"#1B2B33\" font-weight=\"400\" >极快构建、极低内存<\/text><rect x=\"780.0\" y=\"358.0\" width=\"285.0\" height=\"56.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"922.5\" y=\"388.7\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.00\" fill=\"#1B2B33\" font-weight=\"400\" >空表建索引、分布剧变<\/text><rect x=\"1065.0\" y=\"358.0\" width=\"295.0\" height=\"56.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"1212.5\" y=\"388.7\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.00\" fill=\"#1B2B33\" font-weight=\"400\" >强 SQL 一致性却不想双写<\/text><\/svg>", "ctrl": null, "anim": false}, {"eyebrow": "五 · 效果如何", "title": "只看 latency 不看 recall，是业务错误", "lede": "召回率、延迟吞吐、空间内存、维护成本——四组指标，每组都要有可执行的量法。", "caption": "图 13　四组指标与量法。recall@K 的精确基准做法来自 README 的 Monitoring 章节。", "bridge": "指标不会自动变好，它们得进一个能转起来的闭环。", "notes": "效果怎么判断？四组指标，缺一组都不算上线。第一，召回率——README 说得很清楚，默认精确搜索有完美召回，加了近似索引之后查询结果可能不同；生产上要在事务里 SET LOCAL enable_indexscan = off 拿精确 TopK 做基准，抽样对比 recall@K。第二，延迟和吞吐——HNSW 主要看 ef_search、图大小、过滤和内存命中，IVFFlat 看 lists、probes、桶均衡，别脱离 EXPLAIN (ANALYZE, BUFFERS) 谈性能。第三，空间和内存——halfvec 把每维 4 字节降到 2 字节，二值量化能进一步压低索引工作集，但都要 re-rank；索引不必完全放内存，放进去通常更快。第四，维护——HNSW 的 vacuum 可能很慢，README 建议先 REINDEX INDEX CONCURRENTLY 再 VACUUM；IVFFlat 要先装数据再建索引。低延迟但召回错误，对推荐、RAG 和风控相似案例都是业务错误。", "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20.0\" y=\"20.0\" width=\"190.0\" height=\"46.0\" rx=\"3\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"34.0\" y=\"45.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.00\" fill=\"#FFFFFF\" font-weight=\"600\" >指标<\/text><rect x=\"210.0\" y=\"20.0\" width=\"430.0\" height=\"46.0\" rx=\"3\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"224.0\" y=\"45.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.00\" fill=\"#FFFFFF\" font-weight=\"600\" >怎么量（可执行的动作）<\/text><rect x=\"640.0\" y=\"20.0\" width=\"720.0\" height=\"46.0\" rx=\"3\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"654.0\" y=\"45.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.00\" fill=\"#FFFFFF\" font-weight=\"600\" >最容易忽略的一点<\/text><rect x=\"20.0\" y=\"66.0\" width=\"190.0\" height=\"74.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"34.0\" y=\"105.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.00\" fill=\"#1B2B33\" font-weight=\"400\" >召回率<\/text><rect x=\"210.0\" y=\"66.0\" width=\"430.0\" height=\"74.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"224.0\" y=\"105.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"9.49\" fill=\"#1B2B33\" font-weight=\"400\" >BEGIN; SET LOCAL enable_indexscan = off; 取精确 TopK 做基准，抽样对比 recall@K<\/text><rect x=\"640.0\" y=\"66.0\" width=\"720.0\" height=\"74.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"654.0\" y=\"105.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.00\" fill=\"#1B2B33\" font-weight=\"400\" >默认精确搜索有完美召回；加 ANN 索引后查询结果可能不同<\/text><rect x=\"20.0\" y=\"140.0\" width=\"190.0\" height=\"74.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"34.0\" y=\"179.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.00\" fill=\"#1B2B33\" font-weight=\"400\" >延迟 / 吞吐<\/text><rect x=\"210.0\" y=\"140.0\" width=\"430.0\" height=\"74.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"224.0\" y=\"179.5\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.78\" fill=\"#1B2B33\" font-weight=\"400\" >EXPLAIN (ANALYZE, BUFFERS)；分开看 ef_search 与 lists / probes<\/text><rect x=\"640.0\" y=\"140.0\" width=\"720.0\" height=\"74.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"654.0\" y=\"179.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.00\" fill=\"#1B2B33\" font-weight=\"400\" >HNSW 还受图大小、过滤、内存命中影响；IVFFlat 受桶均衡影响<\/text><rect x=\"20.0\" y=\"214.0\" width=\"190.0\" height=\"74.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"34.0\" y=\"253.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.00\" fill=\"#1B2B33\" font-weight=\"400\" >空间 / 内存<\/text><rect x=\"210.0\" y=\"214.0\" width=\"430.0\" height=\"74.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"224.0\" y=\"253.8\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.35\" fill=\"#1B2B33\" font-weight=\"400\" >pg_relation_size；halfvec 每维 2 字节；二值量化压低工作集<\/text><rect x=\"640.0\" y=\"214.0\" width=\"720.0\" height=\"74.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"654.0\" y=\"253.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.00\" fill=\"#1B2B33\" font-weight=\"400\" >索引不必完全放内存，放进去通常更快；量化要 re-rank<\/text><rect x=\"20.0\" y=\"288.0\" width=\"190.0\" height=\"74.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"34.0\" y=\"327.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.00\" fill=\"#1B2B33\" font-weight=\"400\" >维护成本<\/text><rect x=\"210.0\" y=\"288.0\" width=\"430.0\" height=\"74.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"224.0\" y=\"327.7\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.75\" fill=\"#1B2B33\" font-weight=\"400\" >REINDEX INDEX CONCURRENTLY → VACUUM；先装数据再建 IVFFlat<\/text><rect x=\"640.0\" y=\"288.0\" width=\"720.0\" height=\"74.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"654.0\" y=\"327.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.00\" fill=\"#1B2B33\" font-weight=\"400\" >HNSW vacuum 可能耗时；dead tuples 会影响 HNSW 查询结果<\/text><rect x=\"20.0\" y=\"376.0\" width=\"1340.0\" height=\"42.0\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"36.0\" y=\"402.0\" class=\"sv serif\" text-anchor=\"start\" font-size=\"15.00\" fill=\"#BE653B\" font-weight=\"600\" >低延迟但召回错误，对推荐、RAG 与风控相似案例都是业务错误 —— recall@K 与 latency 必须同时进 SLA。<\/text><\/svg>", "ctrl": null, "anim": false}, {"eyebrow": "五 · 生产实践闭环", "title": "pgvector 不是一次建索引就结束", "lede": "目标、表示、参数、上线、校验、维护，必须形成一个能转起来的闭环。", "caption": "图 14　重绘原文图 5：六个环节沿矩形回路首尾相接，橙色回边表示「重新评估 SLA」。", "bridge": "闭环里每一条判断，都应该能被一段最小脚本证伪。", "notes": "所以 pgvector 不是「一次建索引就结束」。把前面所有环节串成一个闭环：先定义业务目标，TopK、P95、recall@K、更新延迟、重建窗口、索引大小都得写进 SLA；再选向量表示和维度；再选索引和参数；上线查询之后做召回校验和性能观测；最后落到维护动作——重建、reindex、vacuum、模型版本切换。然后回到目标重新评估。这个环我建议真的画在团队的运维文档里，因为最常见的线上问题都不是「索引建错了」，而是环断在某一处：模型升级了没记版本，或者调了 ef_search 只看延迟不看召回，或者数据涨了三倍还在用最初的 lists。", "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40.0\" y=\"20.0\" width=\"300.0\" height=\"90.0\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"190.0\" y=\"58.7\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.00\" fill=\"#1B2B33\" font-weight=\"600\" >① 定义业务目标<\/text><text x=\"190.0\" y=\"79.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.50\" fill=\"#46585F\" font-weight=\"400\" >TopK · P95 · recall@K · 索引大小<\/text><rect x=\"500.0\" y=\"20.0\" width=\"300.0\" height=\"90.0\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"650.0\" y=\"58.7\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.00\" fill=\"#1B2B33\" font-weight=\"600\" >② 选择向量表示<\/text><text x=\"650.0\" y=\"79.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.50\" fill=\"#46585F\" font-weight=\"400\" >类型 · 维度 · 归一化 · 模型版本<\/text><rect x=\"960.0\" y=\"20.0\" width=\"300.0\" height=\"90.0\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"1110.0\" y=\"58.7\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.00\" fill=\"#1B2B33\" font-weight=\"600\" >③ 索引与参数<\/text><text x=\"1110.0\" y=\"79.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.50\" fill=\"#46585F\" font-weight=\"400\" >HNSW / IVFFlat · ef · lists / probes<\/text><rect x=\"960.0\" y=\"300.0\" width=\"300.0\" height=\"90.0\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"1110.0\" y=\"338.7\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.00\" fill=\"#1B2B33\" font-weight=\"600\" >④ 上线查询<\/text><text x=\"1110.0\" y=\"359.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.50\" fill=\"#46585F\" font-weight=\"400\" >ORDER BY 距离 LIMIT k<\/text><rect x=\"500.0\" y=\"300.0\" width=\"300.0\" height=\"90.0\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"650.0\" y=\"338.7\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.00\" fill=\"#1B2B33\" font-weight=\"600\" >⑤ 召回校验 / 性能观测<\/text><text x=\"650.0\" y=\"359.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.50\" fill=\"#46585F\" font-weight=\"400\" >精确基准 · EXPLAIN · BUFFERS<\/text><rect x=\"40.0\" y=\"300.0\" width=\"300.0\" height=\"90.0\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"190.0\" y=\"338.7\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.00\" fill=\"#1B2B33\" font-weight=\"600\" >⑥ 维护动作<\/text><text x=\"190.0\" y=\"359.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.50\" fill=\"#46585F\" font-weight=\"400\" >重建 · REINDEX · VACUUM · 版本切换<\/text><line x1=\"340.0\" y1=\"65.0\" x2=\"500.0\" y2=\"65.0\" stroke=\"#245A6B\" stroke-width=\"2.0\" /><polygon points=\"500.0,65.0 491.0,60.0 491.0,70.0\" fill=\"#245A6B\"/><line x1=\"800.0\" y1=\"65.0\" x2=\"960.0\" y2=\"65.0\" stroke=\"#245A6B\" stroke-width=\"2.0\" /><polygon points=\"960.0,65.0 951.0,60.0 951.0,70.0\" fill=\"#245A6B\"/><line x1=\"1260.0\" y1=\"65.0\" x2=\"1310.0\" y2=\"65.0\" stroke=\"#245A6B\" stroke-width=\"2.0\" /><line x1=\"1310.0\" y1=\"65.0\" x2=\"1310.0\" y2=\"345.0\" stroke=\"#245A6B\" stroke-width=\"2.0\" /><line x1=\"1310.0\" y1=\"345.0\" x2=\"1260.0\" y2=\"345.0\" stroke=\"#245A6B\" stroke-width=\"2.0\" /><polygon points=\"1260.0,345.0 1269.0,340.1 1269.0,349.9\" fill=\"#245A6B\"/><line x1=\"960.0\" y1=\"345.0\" x2=\"800.0\" y2=\"345.0\" stroke=\"#245A6B\" stroke-width=\"2.0\" /><polygon points=\"800.0,345.0 809.0,340.1 809.0,349.9\" fill=\"#245A6B\"/><line x1=\"500.0\" y1=\"345.0\" x2=\"340.0\" y2=\"345.0\" stroke=\"#245A6B\" stroke-width=\"2.0\" /><polygon points=\"340.0,345.0 349.0,340.1 349.0,349.9\" fill=\"#245A6B\"/><line x1=\"40.0\" y1=\"345.0\" x2=\"20.0\" y2=\"345.0\" stroke=\"#BE653B\" stroke-width=\"2.0\" /><line x1=\"20.0\" y1=\"345.0\" x2=\"20.0\" y2=\"65.0\" stroke=\"#BE653B\" stroke-width=\"2.0\" /><line x1=\"20.0\" y1=\"65.0\" x2=\"40.0\" y2=\"65.0\" stroke=\"#BE653B\" stroke-width=\"2.0\" /><polygon points=\"40.0,65.0 31.0,60.0 31.0,70.0\" fill= t-anchor=\"start\" font-size=\"11.80\" fill=\"#46585F\" font-weight=\"400\" >CREATE TABLE items (<\/text><text x=\"34.0\" y=\"139.9\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.80\" fill=\"#46585F\" font-weight=\"400\" >  id bigserial PRIMARY KEY,<\/text><text x=\"34.0\" y=\"158.8\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.80\" fill=\"#46585F\" font-weight=\"400\" >  embedding vector(3) NOT NULL);<\/text><rect x=\"480.0\" y=\"20.0\" width=\"440.0\" height=\"170.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"480.0\" y=\"20.0\" width=\"440.0\" height=\"32.0\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"494.0\" y=\"40.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.00\" fill=\"#245A6B\" font-weight=\"600\" >② 精确 TopK（无索引也能执行）<\/text><text x=\"494.0\" y=\"111.6\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.80\" fill=\"#46585F\" font-weight=\"400\" >SELECT id, content FROM items<\/text><text x=\"494.0\" y=\"130.4\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.80\" fill=\"#46585F\" font-weight=\"400\" >ORDER BY embedding &lt;-&gt; &#x27;[3,1,2]&#x27;::vector<\/text><text x=\"494.0\" y=\"149.3\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.80\" fill=\"#46585F\" font-weight=\"400\" >LIMIT 3;<\/text><rect x=\"940.0\" y=\"20.0\" width=\"440.0\" height=\"170.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"940.0\" y=\"20.0\" width=\"440.0\" height=\"32.0\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"954.0\" y=\"40.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.00\" fill=\"#245A6B\" font-weight=\"600\" >③ HNSW 与执行计划<\/text><text x=\"954.0\" y=\"102.1\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.80\" fill=\"#46585F\" font-weight=\"400\" >CREATE INDEX ... USING hnsw<\/text><text x=\"954.0\" y=\"121.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.80\" fill=\"#46585F\" font-weight=\"400\" >  (embedding vector_l2_ops);<\/text><text x=\"954.0\" y=\"139.9\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.80\" fill=\"#46585F\" font-weight=\"400\" >SET hnsw.ef_search = 100;<\/text><text x=\"954.0\" y=\"158.8\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.80\" fill=\"#46585F\" font-weight=\"400\" >EXPLAIN (ANALYZE, BUFFERS) ...<\/text><rect x=\"20.0\" y=\"210.0\" width=\"440.0\" height=\"170.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"20.0\" y=\"210.0\" width=\"440.0\" height=\"32.0\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1.0\" /><text x=\"34.0\" y=\"230.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.00\" fill=\"#2F7A66\" font-weight=\"600\" >④ 过滤条件与迭代扫描<\/text><text x=\"34.0\" y=\"292.1\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.80\" fill=\"#46585F\" font-weight=\"400\" >CREATE INDEX ON items (category_id);<\/text><text x=\"34.0\" y=\"311.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.80\" fill=\"#46585F\" font-weight=\"400\" >SET hnsw.iterative_scan = strict_order;<\/text><text x=\"34.0\" y=\"329.9\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.80\" fill=\"#46585F\" font-weight=\"400\" >SET hnsw.max_scan_tuples = 20000;<\/text><text x=\"34.0\" y=\"348.8\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.80\" fill=\"#46585F\" font-weight=\"400\" >WHERE category_id = 1 ... LIMIT 3;<\/text><rect x=\"480.0\" y=\"210.0\" width=\"440.0\" height=\"170.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"480.0\" y=\"210.0\" width=\"440.0\" height=\"32.0\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1.0\" /><text x=\"494.0\" y=\"230.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.00\" fill=\"#2F7A66\" font-weight=\"600\" >⑤ IVFFlat 的正确建索引时机<\/text><text x=\"494.0\" y=\"292.1\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.80\" fill=\"#46585F\" font-weight=\"400\" >-- 先装载有代表性的数据，再建索引<\/text><text x=\"494.0\" y=\"311.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.80\" fill=\"#46585F\" font-weight=\"400\" >CREATE INDEX ... USING ivfflat<\/text><text x=\"494.0\" y=\"329.9\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.80\" fill=\"#46585F\" font-weight=\"400\" >  (embedding vector_l2_ops)<\/text><text x=\"494.0\" y=\"348.8\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.80\" fill=\"#46585F\" font-weight=\"400\" >WITH (lists = 10);  -- 仅演示<\/text><rect x=\"940.0\" y=\"210.0\" width=\"440.0\" height=\"170.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"940.0\" y=\"210.0\" width=\"440.0\" height=\"32.0\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1.0\" /><text x=\"954.0\" y=\"230.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.00\" fill=\"#2F7A66\" font-weight=\"600\" >⑥ 用精确搜索校验 ANN 召回<\/text><text x=\"954.0\" y=\"292.1\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.80\" fill=\"#46585F\" font-weight=\"400\" >BEGIN;<\/text><text x=\"954.0\" y=\"311.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.80\" fill=\"#46585F\" font-weight=\"400\" >SET LOCAL enable_indexscan = off;<\/text><text x=\"954.0\" y=\"329.9\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.80\" fill=\"#46585F\" font-weight=\"400\" >SELECT id ... ORDER BY &lt;=&gt; ... LIMIT 10;<\/text><text x=\"954.0\" y=\"348.8\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.80\" fill=\"#46585F\" font-weight=\"400\" >COMMIT;  -- 对比 recall@K<\/text><rect x=\"20.0\" y=\"396.0\" width=\"1360.0\" height=\"26.0\" rx=\"3\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1.0\" /><text x=\"32.0\" y=\"414.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.00\" fill=\"#46585F\" font-weight=\"400\" >原文未在本机执行这些 SQL：当时没有启动带 pgvector 的 PostgreSQL 实例；语法按 README 与 sql/vector.sql 编写，lists = 10 仅用于演示。<\/text><\/svg>", "ctrl": null, "anim": false}, {"eyebrow": "九 · 常见坑", "title": "十个坑，都长在主线的某一环上", "lede": "按建模、SQL 形态、索引召回、运维四组归位，逐个对应到前面讲过的机制。", "caption": "图 16　常见坑按因果链归位；底部数字关系出自 README Filtering 章节的例子。", "bridge": "坑的背面就是边界：哪些场景该用，哪些该果断放弃。", "notes": "把十个常见坑按主线归位，你会发现它们不是零散的。建模这一环：把「能存 16000 维」误当成「能建 16000 维索引」；多模型 embedding 混一列却不记版本，距离只在同一向量空间里才有意义；把 halfvec 和二值量化当无损优化。SQL 这一环：缺 ORDER BY 距离 LIMIT、把距离包进相似度表达式、内积方向弄反、cosine 距离和相似度混淆。索引与召回这一环：IVFFlat 空表建索引、过滤后置导致返回不足、只看 latency 不看 recall。运维这一环：忽略 dead tuples 和 HNSW vacuum 的成本。注意底部那个数量关系：默认 ef_search = 40，过滤只命中 10%，平均就只剩约 4 个候选——这不是玄学，是 README 自己举的例子。坑都长在链条的某一环上。", "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20.0\" y=\"20.0\" width=\"330.0\" height=\"46.0\" rx=\"3\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"185.0\" y=\"45.8\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.50\" fill=\"#FFFFFF\" font-weight=\"600\" >建模<\/text><rect x=\"20.0\" y=\"66.0\" width=\"330.0\" height=\"100.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"34.0\" y=\"110.1\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.50\" fill=\"#1B2B33\" font-weight=\"400\" >① 把「能存 16000 维」误当成<\/text><text x=\"34.0\" y=\"127.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.50\" fill=\"#1B2B33\" font-weight=\"400\" >「能建 16000 维 ANN 索引」<\/text><rect x=\"20.0\" y=\"166.0\" width=\"330.0\" height=\"100.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"34.0\" y=\"210.1\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.50\" fill=\"#1B2B33\" font-weight=\"400\" >② 多模型 embedding 混一列，<\/text><text x=\"34.0\" y=\"227.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.50\" fill=\"#1B2B33\" font-weight=\"400\" >却不记录模型版本<\/text><rect x=\"20.0\" y=\"266.0\" width=\"330.0\" height=\"100.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"34.0\" y=\"310.1\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.50\" fill=\"#1B2B33\" font-weight=\"400\" >③ 把 halfvec / 二值量化<\/text><text x=\"34.0\" y=\"327.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.50\" fill=\"#1B2B33\" font-weight=\"400\" >当成无损优化<\/text><rect x=\"365.0\" y=\"20.0\" width=\"330.0\" height=\"46.0\" rx=\"3\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"530.0\" y=\"45.8\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.50\" fill=\"#FFFFFF\" font-weight=\"600\" >SQL 形态<\/text><rect x=\"365.0\" y=\"66.0\" width=\"330.0\" height=\"100.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"379.0\" y=\"110.1\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.50\" fill=\"#1B2B33\" font-weight=\"400\" >① 缺 ORDER BY 距离 LIMIT，<\/text><text x=\"379.0\" y=\"127.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.50\" fill=\"#1B2B33\" font-weight=\"400\" >或把距离包进相似度表达式<\/text><rect x=\"365.0\" y=\"166.0\" width=\"330.0\" height=\"100.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"379.0\" y=\"210.1\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.50\" fill=\"#1B2B33\" font-weight=\"400\" >② 内积方向弄反：<\/text><text x=\"379.0\" y=\"227.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.50\" fill=\"#1B2B33\" font-weight=\"400\" >&lt;#&gt; 是负内积，需 × -1<\/text><rect x=\"365.0\" y=\"266.0\" width=\"330.0\" height=\"100.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"379.0\" y=\"310.1\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.50\" fill=\"#1B2B33\" font-weight=\"400\" >③ cosine 距离与<\/text><text x=\"379.0\" y=\"327.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.50\" fill=\"#1B2B33\" font-weight=\"400\" >cosine 相似度混淆<\/text><rect x=\"710.0\" y=\"20.0\" width=\"330.0\" height=\"46.0\" rx=\"3\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"875.0\" y=\"45.8\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.50\" fill=\"#FFFFFF\" font-weight=\"600\" >索引与召回<\/text><rect x=\"710.0\" y=\"66.0\" width=\"330.0\" height=\"100.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"724.0\" y=\"110.1\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.50\" fill=\"#1B2B33\" font-weight=\"400\" >① IVFFlat 空表建索引，<\/text><text x=\"724.0\" y=\"127.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.50\" fill=\"#1B2B33\" font-weight=\"400\" >中心学自少量样本<\/text><rect x=\"710.0\" y=\"166.0\" width=\"330.0\" height=\"100.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"724.0\" y=\"210.1\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.50\" fill=\"#1B2B33\" font-weight=\"400\" >② 过滤后置导致返回不足，<\/text><text x=\"724.0\" y=\"227.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.50\" fill=\"#1B2B33\" font-weight=\"400\" >默认候选不够用<\/text><rect x=\"710.0\" y=\"266.0\" width=\"330.0\" height=\"100.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"724.0\" y=\"310.1\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.50\" fill=\"#1B2B33\" font-weight=\"400\" >③ 只看 latency，<\/text><text x=\"724.0\" y=\"327.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.50\" fill=\"#1B2B33\" font-weight=\"400\" >不做精确基准 recall@K<\/text><rect x=\"1055.0\" y=\"20.0\" width=\"330.0\" height=\"46.0\" rx=\"3\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"1220.0\" y=\"45.8\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.50\" fill=\"#FFFFFF\" font-weight=\"600\" >运维<\/text><rect x=\"1055.0\" y=\"66.0\" width=\"330.0\" height=\"100.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"1069.0\" y=\"110.1\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.50\" fill=\"#1B2B33\" font-weight=\"400\" >① 忽略 dead tuples<\/text><text x=\"1069.0\" y=\"127.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.50\" fill=\"#1B2B33\" font-weight=\"400\" >与 HNSW vacuum 成本<\/text><rect x=\"1055.0\" y=\"166.0\" width=\"330.0\" height=\"100.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"1069.0\" y=\"210.1\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.50\" fill=\"#1B2B33\" font-weight=\"400\" >② 维护顺序错：应先 REINDEX<\/text><text x=\"1069.0\" y=\"227.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.50\" fill=\"#1B2B33\" font-weight=\"400\" >INDEX CONCURRENTLY 再 VACUUM<\/text><rect x=\"1055.0\" y=\"266.0\" width=\"330.0\" height=\"100.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"1069.0\" y=\"310.1\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.50\" fill=\"#1B2B33\" font-weight=\"400\" >③ 数据增长后不重估<\/text><text x=\"1069.0\" y=\"327.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.50\" fill=\"#1B2B33\" font-weight=\"400\" >lists / probes 与索引大小<\/text><rect x=\"20.0\" y=\"380.0\" width=\"1365.0\" height=\"38.0\" rx=\"3\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1.0\" /><text x=\"34.0\" y=\"404.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.50\" fill=\"#1B2B33\" font-weight=\"600\" >README 的例子：默认 ef_search = 40，过滤条件只命中 10%，平均只剩约 4 个候选 —— 需增大候选、iterative scan 或调整建模。<\/text><\/svg>", "ctrl": null, "anim": false}, {"eyebrow": "八 · 适合与不适合", "title": "pgvector 的边界是工程一致性", "lede": "适合强 SQL 事务与中小大规模检索；不适合极致规模、专用编排与「近似却要完全一致」。", "caption": "图 17　左右两栏为原文第八节场景的归组；中间虚线表示能力边界，不是性能分界线。", "bridge": "边界清楚了，把原则分派到架构师、DBA 和开发者手上。", "notes": "最后把边界说清楚。适合的一侧：RAG 知识库、企业内部文档检索、商品和内容相似推荐、用户画像相似人群——这些场景要 TopK，同时强依赖关系过滤和事务一致性；中小到较大规模的在线检索，能接受用 recall@K 调参的 ANN 语义；还有那些必须把向量、租户权限、软删除、审计字段放在同一个 SQL 模型里的系统。不适合的一侧：要求 ANN 和精确扫描完全一致又不肯付顺序扫描成本；数据很少就提前建 IVFFlat 还指望以后自动高召回；高维超过索引上限又不愿降维或量化；过滤极复杂却只用默认 ef_search = 40 或 probes = 1；以及需要独立分布式向量平台、跨模态编排、专用 GPU 压缩索引体系。一句话：pgvector 的边界是工程一致性，不是极致检索规模。", "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20.0\" y=\"20.0\" width=\"650.0\" height=\"46.0\" rx=\"3\" fill=\"#2F7A66\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"345.0\" y=\"45.8\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.50\" fill=\"#FFFFFF\" font-weight=\"600\" >适合<\/text><rect x=\"20.0\" y=\"66.0\" width=\"650.0\" height=\"68.0\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"34.0\" y=\"94.1\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.50\" fill=\"#1B2B33\" font-weight=\"400\" >RAG 知识库 · 企业文档检索 · 商品 / 内容推荐 · 相似人群<\/text><text x=\"34.0\" y=\"111.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.50\" fill=\"#1B2B33\" font-weight=\"400\" >需要 TopK，同时强依赖关系过滤与事务一致性<\/text><rect x=\"20.0\" y=\"134.0\" width=\"650.0\" height=\"68.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"34.0\" y=\"162.1\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.50\" fill=\"#1B2B33\" font-weight=\"400\" >中小到较大规模在线检索<\/text><text x=\"34.0\" y=\"179.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.50\" fill=\"#1B2B33\" font-weight=\"400\" >能接受通过 recall@K 调参的 ANN 语义<\/text><rect x=\"20.0\" y=\"202.0\" width=\"650.0\" height=\"68.0\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"34.0\" y=\"230.1\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.50\" fill=\"#1B2B33\" font-weight=\"400\" >向量 + 业务字段 + 租户权限 + 软删除 + 审计<\/text><text x=\"34.0\" y=\"247.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.50\" fill=\"#1B2B33\" font-weight=\"400\" >需要放在同一个 SQL 模型中<\/text><rect x=\"700.0\" y=\"20.0\" width=\"680.0\" height=\"46.0\" rx=\"3\" fill=\"#BE653B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"1040.0\" y=\"45.8\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.50\" fill=\"#FFFFFF\" font-weight=\"600\" >不适合<\/text><rect x=\"700.0\" y=\"66.0\" width=\"680.0\" height=\"62.0\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"714.0\" y=\"99.8\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.50\" fill=\"#1B2B33\" font-weight=\"400\" >要求 ANN 结果与精确扫描完全一致，又不肯承担顺序扫描成本<\/text><rect x=\"700.0\" y=\"128.0\" width=\"680.0\" height=\"62.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"714.0\" y=\"161.8\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.50\" fill=\"#1B2B33\" font-weight=\"400\" >数据很少就提前建 IVFFlat，指望未来自动得到高召回<\/text><rect x=\"700.0\" y=\"190.0\" width=\"680.0\" height=\"62.0\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"714.0\" y=\"223.8\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.50\" fill=\"#1B2B33\" font-weight=\"400\" >高维超过索引上限，又不愿降维 / halfvec / 量化 / subvector<\/text><rect x=\"700.0\" y=\"252.0\" width=\"680.0\" height=\"62.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"714.0\" y=\"277.2\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.08\" fill=\"#1B2B33\" font-weight=\"400\" >过滤极复杂却只用默认 ef_search = 40 或 probes = 1；<\/text><text x=\"714.0\" y=\"294.2\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.08\" fill=\"#1B2B33\" font-weight=\"400\" >或需要独立分布式平台、跨模态编排与专用 GPU 压缩索引<\/text><line x1=\"685.0\" y1=\"20.0\" x2=\"685.0\" y2=\"370.0\" stroke=\"#D9D5CB\" stroke-width=\"1.4\" stroke-dasharray=\"5 4\" /><rect x=\"20.0\" y=\"384.0\" width=\"1360.0\" height=\"34.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"34.0\" y=\"406.0\" class=\"sv serif\" text-anchor=\"start\" font-size=\"14.00\" fill=\"#245A6B\" font-weight=\"600\" >pgvector 的边界是工程一致性，不是极致检索规模 —— 当向量检索成为独立核心基础设施，专用系统的收益会变大。<\/text><\/svg>", "ctrl": null, "anim": false}, {"eyebrow": "七 · 最佳实践", "title": "把原则落到三个岗位的动作上", "lede": "架构师定 SLA 与两阶段召回，DBA 管构建与维护，开发者守查询模板与模型版本。", "caption": "图 18　原文第七节按角色重排；每一条动作都能对应到前面链条上的某一环。", "bridge": "动作有了，最后留五个问题，让你回到自己的系统里验证。", "notes": "把原则落到岗位动作。架构师：先判断要不要专用向量系统；把召回设计成 ANN 取大候选集、再用原始向量或业务模型 re-rank 的两阶段；SLA 里同时写 latency、QPS、recall@K、更新延迟、重建窗口和索引大小。DBA：建索引前确认维度、opclass、查询距离三者一致，vector_cosine_ops 就配 cosine、vector_l2_ops 就配 L2，别指望一个索引通吃；批量导入后再建；HNSW 盯 maintenance_work_mem 和 NOTICE，IVFFlat 盯 pg_stat_progress_create_index 的 k-means、assigning、loading 三个阶段；生产用 CREATE INDEX CONCURRENTLY，维护走 REINDEX 再 VACUUM；遇到「索引不走」先查 SQL 形态。业务开发者：固定维度、混模型就用 model_id 加表达式或 partial index；对过滤选择性有意识；把查询模板统一封装，禁止随手改成 1 - (...) DESC；每次 embedding 模型升级都记录版本。这三组动作，其实就是把前面那条主线的每一环指定一个负责人。", "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20.0\" y=\"20.0\" width=\"430.0\" height=\"46.0\" rx=\"3\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"235.0\" y=\"45.8\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.50\" fill=\"#FFFFFF\" font-weight=\"600\" >面向架构师<\/text><rect x=\"20.0\" y=\"66.0\" width=\"430.0\" height=\"86.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"34.0\" y=\"110.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"9.23\" fill=\"#1B2B33\" font-weight=\"400\" >① 先判断是否需要专用向量系统：强依赖 PG 事务 / 权限 / SQL / 备份，优先评估 pgvector<\/text><rect x=\"20.0\" y=\"152.0\" width=\"430.0\" height=\"86.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"34.0\" y=\"197.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.45\" fill=\"#1B2B33\" font-weight=\"400\" >② 两阶段召回：ANN 取较大候选集，再用原始向量或业务模型 re-rank<\/text><rect x=\"20.0\" y=\"238.0\" width=\"430.0\" height=\"86.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"34.0\" y=\"283.1\" class=\"sv s\" text-anchor=\"start\" font-size=\"10.04\" fill=\"#1B2B33\" font-weight=\"400\" >③ SLA 同时写 latency · QPS · recall@K · 更新延迟 · 重建窗口 · 索引大小<\/text><rect x=\"20.0\" y=\"324.0\" width=\"430.0\" height=\"86.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"34.0\" y=\"369.8\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.50\" fill=\"#1B2B33\" font-weight=\"400\" >④ 超大规模、复杂多路召回、专用硬件，才评估独立检索系统<\/text><rect x=\"485.0\" y=\"20.0\
