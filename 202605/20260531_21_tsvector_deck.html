.0\" fill=\"#BE653B\" font-weight=\"600\" >GiST　签名索引（lossy）</text><text x=\"720.0\" y=\"86.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >每个词 hash 到 1 bit，OR 成固定长度文档签名</text><rect x=\"720.0\" y=\"106.0\" width=\"38.0\" height=\"44.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"764.0\" y=\"106.0\" width=\"38.0\" height=\"44.0\" rx=\"2\" fill=\"#BE653B\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"808.0\" y=\"106.0\" width=\"38.0\" height=\"44.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"852.0\" y=\"106.0\" width=\"38.0\" height=\"44.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"896.0\" y=\"106.0\" width=\"38.0\" height=\"44.0\" rx=\"2\" fill=\"#BE653B\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"940.0\" y=\"106.0\" width=\"38.0\" height=\"44.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"984.0\" y=\"106.0\" width=\"38.0\" height=\"44.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"1028.0\" y=\"106.0\" width=\"38.0\" height=\"44.0\" rx=\"2\" fill=\"#BE653B\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"1072.0\" y=\"106.0\" width=\"38.0\" height=\"44.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"1116.0\" y=\"106.0\" width=\"38.0\" height=\"44.0\" rx=\"2\" fill=\"#BE653B\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"1160.0\" y=\"106.0\" width=\"38.0\" height=\"44.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"1204.0\" y=\"106.0\" width=\"38.0\" height=\"44.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"1248.0\" y=\"106.0\" width=\"38.0\" height=\"44.0\" rx=\"2\" fill=\"#BE653B\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"1292.0\" y=\"106.0\" width=\"38.0\" height=\"44.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"720.0\" y=\"178.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >不同词 hash 到同一 bit　→　false match 是设计内代价</text><rect x=\"720.0\" y=\"194.0\" width=\"616.0\" height=\"44.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#FFFFFF\" stroke-width=\"1.0\" /><text x=\"738.0\" y=\"220.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#BE653B\" font-weight=\"600\" >siglen</text><text x=\"856.0\" y=\"220.4\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >默认 124 字节，最大 2024 字节；越长越精确、索引越大</text><rect x=\"720.0\" y=\"246.0\" width=\"616.0\" height=\"44.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#FFFFFF\" stroke-width=\"1.0\" /><text x=\"738.0\" y=\"272.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#BE653B\" font-weight=\"600\" >recheck</text><text x=\"856.0\" y=\"272.4\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >gtsvector_consistent() 明确把 recheck 设为 true</text><text x=\"720.0\" y=\"322.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >优势：支持 INCLUDE 覆盖列、签名长度可调；短板：误判导致随机回表</text><rect x=\"40.0\" y=\"360.0\" width=\"1320.0\" height=\"50.0\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1.0\" /><text x=\"58.0\" y=\"389.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#AE8A3E\" font-weight=\"600\" >取舍</text><text x=\"176.0\" y=\"389.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >GIN：常规全文检索默认选它　·　GiST：需要覆盖列或可接受误判回表时再选；唯一词越多、签名越短，误判越明显</text></svg>","ctrl":""},{"eyebrow":"横向 · 四条路","title":"把四条路放在同一张表里看","lede":"关键不是「PostgreSQL 全文检索替代一切」，而是检索能力与工程复杂度在哪里平衡。","caption":"图 15　七个维度横向对比：目标、写入、读取、排序、事务语义、适合与不适合。","bridge":"方案选完还有一个隐藏前提：优化器得先估出 @@ 会命中多少行，才谈得上选对路径。","notes":"这张表我不逐格念，只讲怎么看。前四行是能力：主要目标、写入代价、读取代价、排序能力。GIN 和 GiST 都能用 ts_rank 系列，LIKE 得自己写排序，外部引擎的 BM25 和学习排序更丰富。第五行是我认为最容易被低估的一行——事务和 MVCC。前三条路都是原生，写进业务库的事务一提交，搜索立刻可见，权限过滤、审计、备份恢复全在同一套语义里；外部搜索引擎通常要处理双写一致性，这一行的差异往往比查询快几毫秒重要得多。最后两行是适合与不适合，别当成分数表，当成边界线看：站内搜索、知识库、工单、商品标题、和租户权限强绑定的查询，tsvector 的工程价值很高；可如果搜索本身就是产品核心，需要复杂同义词运营、拼写纠错、向量加关键词多路召回、跨库全局聚合、独立扩缩容，那外部搜索系统更容易扩展。所以真正的判断不是谁更强，而是「搜索结果必须不必须和业务数据共用同一套数据库语义」。要，就把表示层放进库里；不要，就别硬扛。方案选完还有个隐藏前提：优化器得先估出 @@ 会命中多少行，才谈得上选对路径。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40.0\" y=\"28.0\" width=\"190.0\" height=\"44.0\" rx=\"2\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"54.0\" y=\"54.7\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#FFFFFF\" font-weight=\"600\" >维度</text><rect x=\"230.0\" y=\"28.0\" width=\"290.0\" height=\"44.0\" rx=\"2\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"244.0\" y=\"54.7\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#FFFFFF\" font-weight=\"600\" >tsvector + GIN</text><rect x=\"520.0\" y=\"28.0\" width=\"290.0\" height=\"44.0\" rx=\"2\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"534.0\" y=\"54.7\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#FFFFFF\" font-weight=\"600\" >tsvector + GiST</text><rect x=\"810.0\" y=\"28.0\" width=\"250.0\" height=\"44.0\" rx=\"2\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"824.0\" y=\"54.7\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#FFFFFF\" font-weight=\"600\" >LIKE / 正则</text><rect x=\"1060.0\" y=\"28.0\" width=\"300.0\" height=\"44.0\" rx=\"2\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"1074.0\" y=\"54.7\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#FFFFFF\" font-weight=\"600\" >外部搜索引擎</text><rect x=\"40.0\" y=\"72.0\" width=\"190.0\" height=\"45.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"54.0\" y=\"99.0\" class= .0\" y=\"252.0\" width=\"250.0\" height=\"45.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"824.0\" y=\"279.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >原生</text><rect x=\"1060.0\" y=\"252.0\" width=\"300.0\" height=\"45.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"1074.0\" y=\"279.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >通常要处理双写一致性</text><rect x=\"40.0\" y=\"297.0\" width=\"190.0\" height=\"45.0\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"54.0\" y=\"324.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#1B2B33\" font-weight=\"600\" >适合</text><rect x=\"230.0\" y=\"297.0\" width=\"290.0\" height=\"45.0\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"244.0\" y=\"324.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >站内搜索、知识库、工单</text><rect x=\"520.0\" y=\"297.0\" width=\"290.0\" height=\"45.0\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"534.0\" y=\"324.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >需 GiST 特性或可忍误判</text><rect x=\"810.0\" y=\"297.0\" width=\"250.0\" height=\"45.0\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"824.0\" y=\"324.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >小表、后台低频</text><rect x=\"1060.0\" y=\"297.0\" width=\"300.0\" height=\"45.0\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"1074.0\" y=\"324.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >大规模、复杂相关性</text><rect x=\"40.0\" y=\"342.0\" width=\"190.0\" height=\"45.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /> 用最小频率的一半估，且不超过 0.005。源码里那个常量就叫 DEFAULT_TS_MATCH_SEL，值是 0.005，注释说它特意取得偏小，为的是鼓励优化器在常见数据密度下走索引扫描。反过来看，只要查询被参数化、常量藏起来了，或者表达式写得太复杂、变量对不上，tsmatchsel 就直接退回这个默认值，估算质量立刻下降。所以生产上三件事：建完索引执行 ANALYZE；高变化表依赖 autovacuum 和 autoanalyze 及时刷新；别靠猜，用 EXPLAIN (ANALYZE, BUFFERS) 看真实路径。知道优化器怎么估代价，我们才有资格谈效果好不好。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40.0\" y=\"30.0\" width=\"310.0\" height=\"78.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"195.0\" y=\"62.1\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" >ANALYZE</text><text x=\"195.0\" y=\"84.6\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >采样 tsvector 列</text><line x1=\"350.0\" y1=\"69.0\" x2=\"370.4\" y2=\"69.0\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><polygon points=\"376,69 369,65.15 369,72.85\" fill=\"#7BA6AF\"/><rect x=\"376.0\" y=\"30.0\" width=\"310.0\" height=\"78.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"531.0\" y=\"62.1\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" >ts_typanalyze</text><text x=\"531.0\" y=\"84.6\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >Lossy Counting 近似高频词</text><line x1=\"686.0\" y1=\"69.0\" x2=\"706.4\" y2=\"69.0\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><polygon points=\"712,69 705,65.15 705,72.85\" fill=\"#7BA6AF\"/><rect x=\"712.0\" y=\"30.0\" width=\"310.0\" height=\"78.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"867.0\" y=\"62.1\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" >pg_statistic</text><text x=\"867.0\" y=\"84.6\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >MCELEM：最常见 lexeme + 频率</text><line 0\" fill=\"#245A6B\" font-weight=\"600\" >建索引后</text><text x=\"276.0\" y=\"261.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >执行 ANALYZE，让 MCELEM 有内容可用</text><rect x=\"40.0\" y=\"288.0\" width=\"1320.0\" height=\"50.0\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#F1EFE9\" stroke-width=\"1.0\" /><text x=\"58.0\" y=\"317.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"600\" >高变化表</text><text x=\"276.0\" y=\"317.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >依赖 autovacuum / autoanalyze 及时更新统计</text><rect x=\"40.0\" y=\"344.0\" width=\"1320.0\" height=\"50.0\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#F1EFE9\" stroke-width=\"1.0\" /><text x=\"58.0\" y=\"373.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"600\" >参数化查询</text><text x=\"276.0\" y=\"373.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >常量被藏进参数或表达式过复杂时，估算会退化</text><text x=\"40.0\" y=\"414.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#BE653B\" font-weight=\"600\" >EXPLAIN (ANALYZE, BUFFERS) 比「我建了 GIN」更可信</text></svg>","ctrl":""},{"eyebrow":"评估 · 四个角度","title":"效果好不好，要分四件事来问","lede":"召回语义、查询延迟、写入维护、排序质量——四个角度各有各的证据，混在一起问只会得到「感觉还行」。","caption":"图 17　四个评估角度，每个都列了可复查的观察点，而不是笼统的「快」或「准」。","bridge":"四个角度最后都指向同一件事：得有一条能落地、能验证的 SQL。我们从建表开始走一遍。","notes":"评估这套东西，最怕一句「感觉挺快的」。我们拆成四问。第一问召回和匹配语义：tsvector 的召回取决于 parser 和 dictionary 配置。英文词干化能把 rats 收成 rat，可中文如果没有合适分词，默认配置很难给你业务想要的词项——所以评估前先看 ts_debug() 和 to_tsvector() 的实际输出，而不是先看索引。第二问查询延迟：GIN 多词匹配通常比顺序扫文本快很多，但高频词、缺正向必需词、pending list 过大、rank 和 headline 太重、GiST 误判回表，都会把延迟抬起来，要按前面那三段分开量。第三问写入和维护：存储生成列让写入时就得算 tsvector，GIN 要维护倒排，高写入表得盯 autovacuum、pending list、索引膨胀和前台 cleanup 抖动。第四问排序质量：ts_rank 不是业务相关性的终点，字段权重、文档长度归一化、时间衰减、点击反馈、权限过滤之后的 TopN，都会改最终结果。这四个角度各自要留证据——召回样本、执行计划、线上延迟分布、TopN 的人工评估。少一个，上线之后就只能靠用户投诉来发现问题。四个角度最后都指向同一件事：得有一条能落地、能验证的 SQL。我们从建表开始走一遍。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40.0\" y=\"20.0\" width=\"650.0\" height=\"180.0\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1.0\" /><rect x=\"40.0\" y=\"20.0\" width=\"650.0\" height=\"38.0\" rx=\"4\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1.0\" /><text x=\"58.0\" y=\"46.0\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#FFFFFF\" font-weight=\"600\" >① 召回与匹配语义</text><text x=\"58.0\" y=\"76.5\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >先看 ts_debug() 与 to_tsvector() 输出</text><text x=\"58.0\" y=\"106.5\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >rats → rat 靠词干化；中文缺分词则召回不可用</text><text x=\"58.0\" y=\"136.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >评估前先确认配置，而不是先调索引</text><rect x=\"710.0\" y=\"20.0\" width=\"650.0\" height=\"180.0\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><rect x=\"710.0\" y=\"20.0\" width=\"650.0\" height=\"38.0\" rx=\"4\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"728.0\" y=\"46.0\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#FFFFFF\" font-weight=\"600\" >② 查询延迟</text><text x=\"728.0\" y=\"76.5\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >高频词、纯否定、pending list 过大</text><text x=\"728.0\" y=\"106.5\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >rank / headline 过重、GiST 误判回表</text><text x=\"728.0\" y=\"136.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >把耗时拆成三段分别量</text><rect x=\"40.0\" y=\"210.0\" width=\"650.0\" height=\"180.0\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1.0\" /><rect x=\"40.0\" y=\"210.0\" width=\"650.0\" height=\"38.0\" rx=\"4\" fill=\"#AE8A3E\" stroke=\"#AE8A3E\" stroke-width=\"1.0\" /><text x=\"58.0\" y=\"236.0\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#FFFFFF\" font-weight=\"600\" >③ 写入与维护</text><text x=\"58.0\" y=\"266.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >生成列在写入时计算 tsvector</text><text x=\"58.0\" y=\"296.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >GIN 维护倒排索引，存在写入放大</text><text x=\"58.0\" y=\"326.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >盯 autovacuum、膨胀、前台 cleanup 抖动</text><rect x=\"710.0\" y=\"210.0\" width=\"650.0\" height=\"180.0\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><rect x=\"710.0\" y=\"210.0\" width=\"650.0\" height=\"38.0\" rx=\"4\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1.0\" /><text x=\"728.0\" y=\"236.0\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#FFFFFF\" font-weight=\"600\" >④ 排序质量</text><text x=\"728.0\" y=\"266.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >字段权重、文档长度归一化</text><text x=\"728.0\" y=\"296.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >时间衰减、点击反馈、权限过滤后 TopN</text><text x=\"728.0\" y=\"326.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >@@ 不是「搜索质量完成」</text><text x=\"40.0\" y=\"406.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >四个角度都要有可复查的证据：样本召回、执行计划、线上延迟、TopN 人工评估</text></svg>","ctrl":""},{"eyebrow":"实操 · 建表","title":"先建对表示层，再建索引","lede":"存储生成列把配置、coalesce 和字段权重一次性固定下来；官方文档已用 generated column 替代触发器方案。","caption":"图 18　左侧是最小可验证建表脚本，右侧四条是每行 SQL 背后的建模理由。","bridge":"表示层建好了，一条查询里其实有三件事各归各管；拆开看，才不会把排序的锅甩给索引。","notes":"看这段脚本，别只盯着 CREATE INDEX。第一行要紧的是 search_doc 这个存储生成列：它把 title 用 setweight 打成 A、body 打成 D，再用 || 拼成一个 tsvector，然后 STORED。官方文档 12.2.2 已经明确用 stored generated column 替代了早年的触发器写法，写入时自动算好，还省掉了查询里重复调 to_tsvector 去验证索引匹配的开销——这一点对 GiST 尤其明显。第二个要紧的是配置写成 pg_catalog.english，而不是依赖当前会话的默认值。前面说过，表达式索引的内容不能被会话设置影响，否则同一份数据在不同会话里可能生成不同词项，连 dump 和 restore 都不可靠。第三个是 coalesce，官方文档在讲多字段拼接时专门加了备注：任何一个字段是 NULL，整个拼接结果就是 NULL，那一行就悄悄从索引里消失了。第四个是权重，标题 A、摘要 B、正文 D 必须在生成阶段定，后期只调 rank 的 SQL 补不回表示层的错。建完 GIN 索引别忘了 ANALYZE，让 MCELEM 有内容可用。这里也要坦白一句：本文没有在本机启动实例跑这些 SQL，所以不给出任何伪造的执行结果，语法依据是官方文档和源码接口。表示层建好了，一条查询里有三件事各归各管。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40.0\" y=\"30.0\" width=\"760.0\" height=\"370.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"40.0\" y=\"30.0\" width=\"760.0\" height=\"30.0\" rx=\"3\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"56.0\" y=\"50.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#FFFFFF\" font-weight=\"600\" >6.1  建表与索引（最小可验证脚本）</text><text x=\"56.0\" y=\"76.4\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.6\" fill=\"#1B2B33\" font-weight=\"400\" >CREATE TABLE articles (</text><text x=\"56.0\" y=\"96.4\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.6\" fill=\"#1B2B33\" font-weight=\"400\" >  id           bigserial PRIMARY KEY,</text><text x=\"56.0\" y=\"116.4\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.6\" fill=\"#1B2B33\" font-weight=\"400\" >  tenant_id    int NOT NULL,</text><text x=\"56.0\" y=\"136.4\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.6\" fill=\"#1B2B33\" font-weight=\"400\" >  title        text,</text><text x=\"56.0\" y=\"156.4\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.6\" fill=\"#1B2B33\" font-weight=\"400\" >  body         text,</text><text x=\"56.0\" y=\"176.4\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.6\" fill=\"#1B2B33\" font-weight=\"400\" >  published_at timestamptz DEFAULT now(),</text><text x=\"56.0\" y=\"196.4\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.6\" fill=\"#BE653B\" font-weight=\"400\" >  search_doc   tsvector GENERATED ALWAYS AS (</text><text x=\"56.0\" y=\"216.4\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.6\" fill=\"#BE653B\" font-weight=\"400\" >    setweight(to_tsvector(&#x27;pg_catalog.english&#x27;,</text><text x=\"56.0\" y=\"236.4\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.6\" fill=\"#BE653B\" font-weight=\"400\" >              coalesce(title, &#x27;&#x27;)), &#x27;A&#x27;) ||</text><text x=\"56.0\" y=\"256.4\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.6\" fill=\"#BE653B\" font-weight=\"400\" >    setweight(to_tsvector(&#x27;pg_catalog.english&#x27;,</text><text x=\"56.0\" y=\"276.4\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.6\" fill=\"#BE653B\" font-weight=\"400\" >              coalesce(body,  &#x27;&#x27;)), &#x27;D&#x27;)</text><text x=\"56.0\" y=\"296.4\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.6\" fill=\"#BE653B\" font-weight=\"400\" >  ) STORED</text><text x=\"56.0\" y=\"316.4\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.6\" fill=\"#1B2B33\" font-weight=\"400\" >);</text><text x=\"56.0\" y=\"336.4\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.6\" fill=\"#1B2B33\" font-weight=\"400\" >CREATE INDEX articles_search_doc_gin</text><text x=\"56.0\" y=\"356.4\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.6\" fill=\"#1B2B33\" font-weight=\"400\" >  ON articles USING GIN (search_doc);</text><text x=\"56.0\" y=\"376.4\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.6\" fill=\"#1B2B33\" font-weight=\"400\" >ANALYZE articles;</text><rect x=\"830.0\" y=\"30.0\" width=\"530.0\" height=\"80.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"830.0\" y=\"30.0\" width=\"530.0\" height=\"30.0\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"846.0\" y=\"51.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"600\" >STORED 生成列</text><text x=\"846.0\" y=\"72.5\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >官方文档已用 stored generated column 替代触发器；写</text><text x=\"846.0\" y=\"92.5\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >入时自动维护表示层</text><rect x=\"830.0\" y=\"120.0\" width=\"530.0\" height=\"80.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"830.0\" y=\"120.0\" width=\"530.0\" height=\"30.0\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"846.0\" y=\"141.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"600\" >显式配置</text><text x=\"846.0\" y=\"162.5\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >写成 pg_catalog.english，不受 search_path 与会话默</text><text x=\"846.0\" y=\"182.5\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >认配置影响</text><rect x=\"830.0\" y=\"210.0\" width=\"530.0\" height=\"80.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"830.0\" y=\"210.0\" width=\"530.0\" height=\"30.0\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"846.0\" y=\"231.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"600\" >coalesce()</text><text x=\"846.0\" y=\"252.5\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >任一字段为 NULL 都会让整个拼接表达式变成 NULL，索引</text><text x=\"846.0\" y=\"272.5\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >随之失效</text><rect x=\"830.0\" y=\"300.0\" width=\"530.0\" height=\"80.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"830.0\" y=\"300.0\" width=\"530.0\" height=\"30.0\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"846.0\" y=\"321.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"600\" >setweight A / D</text><text x=\"846.0\" y=\"342.5\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >字段权重在生成阶段设计；后期只调 SQL rank 补不回来表</text><text x=\"846.0\" y=\"362.5\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >示层的错</text><text x=\"830.0\" y=\"396.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >表达式索引与查询表达式必须逐字一致，否则用不上索引</text></svg>","ctrl":""},{"eyebrow":"实操 · 查询","title":"一条 SQL 里，三件事各归各管","lede":"tenant_id 是业务过滤，@@ 是全文匹配，ORDER BY rank 是显式排序；GIN 只负责第一段，不产出次序。","caption":"图 19　左侧是查询、排序、摘要的完整 SQL，右侧把 WHERE 与 ORDER BY 的职责逐条拆开。","bridge":"SQL 写对了不等于跑对了；下一步要用执行计划证明优化器真的按我们想的路径走。","notes":"把这条查询拆成三截。第一截 WHERE a.tenant_id = 1，这是业务和权限过滤，就是个普通 SQL 条件，跟全文检索一点关系没有——但它恰恰是 tsvector 方案最大的价值所在：搜索和业务规则在同一条语句、同一个事务、同一套权限里。第二截 AND a.search_doc @@ q.query，这是全文匹配，GIN 在这儿负责把候选行缩小，仅此而已。第三截 ORDER BY rank DESC, a.published_at DESC，才是相关性排序，而且带了一个稳定的 tie-breaker，避免同分结果翻页时乱跳。这三截千万别互相背锅：排序慢不是索引没建好，权限过滤漏了也不是 tsvector 的问题。再看几个细节。查询用 websearch_to_tsquery 构造，因为输入来自搜索框；ts_rank_cd 的第三个参数 32 是 rank 除以 rank 加一，只把分数缩到 0 到 1，不改变顺序；ts_headline 要回原文重新解析，官方说可能慢，所以分页列表里要控制摘要长度和 LIMIT 的条数。顺带说，WITH q 把 tsquery 算一次，避免在每一行重复构造。SQL 写对了不等于跑对了，下一步得用执行计划证明优化器真按我们想的路径走。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40.0\" y=\"30.0\" width=\"760.0\" height=\"350.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"40.0\" y=\"30.0\" width=\"760.0\" height=\"30.0\" rx=\"3\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"56.0\" y=\"50.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#FFFFFF\" font-weight=\"600\" >6.2  查询、排序与摘要</text><text x=\"56.0\" y=\"76.4\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.6\" fill=\"#1B2B33\" font-weight=\"400\" >WITH q AS (</text><text x=\"56.0\" y=\"96.4\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.6\" fill=\"#1B2B33\" font-weight=\"400\" >  SELECT websearch_to_tsquery(</text><text x=\"56.0\" y=\"116.4\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.6\" fill=\"#1B2B33\" font-weight=\"400\" >    &#x27;pg_catalog.english&#x27;,</text><text x=\"56.0\" y=\"136.4\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.6\" fill=\"#1B2B33\" font-weight=\"400\" >    &#x27;postgres full text&#x27;) AS query</text><text x=\"56.0\" y=\"156.4\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.6\" fill=\"#1B2B33\" font-weight=\"400\" >)</text><text x=\"56.0\" y=\"176.4\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.6\" fill=\"#1B2B33\" font-weight=\"400\" >SELECT a.id, a.title,</text><text x=\"56.0\" y=\"196.4\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.6\" fill=\"#1B2B33\" font-weight=\"400\" >  ts_rank_cd(a.search_doc, q.query, 32) AS rank,</text><text x=\"56.0\" y=\"216.4\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.6\" fill=\"#BE653B\" font-weight=\"400\" >  ts_headline(&#x27;pg_catalog.english&#x27;,</text><text x=\"56.0\" y=\"236.4\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.6\" fill=\"#1B2B33\" font-weight=\"400\" >    coalesce(a.body, &#x27;&#x27;), q.query) AS snippet</text><text x=\"56.0\" y=\"256.4\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.6\" fill=\"#1B2B33\" font-weight=\"400\" >FROM articles a, q</text><text x=\"56.0\" y=\"276.4\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.6\" fill=\"#1B2B33\" font-weight=\"400\" >WHERE a.tenant_id = 1</text><text x=\"56.0\" y=\"296.4\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.6\" fill=\"#BE653B\" font-weight=\"400\" >  AND a.search_doc @@ q.query</text><text x=\"56.0\" y=\"316.4\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.6\" fill=\"#BE653B\" font-weight=\"400\" >ORDER BY rank DESC, a.published_at DESC</text><text x=\"56.0\" y=\"336.4\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.6\" fill=\"#BE653B\" font-weight=\"400\" >LIMIT 10;</text><rect x=\"830.0\" y=\"30.0\" width=\"530.0\" height=\"100.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"830.0\" y=\"30.0\" width=\"530.0\" height=\"32.0\" rx=\"4\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"846.0\" y=\"52.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#FFFFFF\" font-weight=\"600\" >WHERE a.tenant_id = 1</text><text x=\"846.0\" y=\"76.5\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >业务 / 权限过滤：普通 SQL 条件，与全文检索无关</text><rect x=\"830.0\" y=\"142.0\" width=\"530.0\" height=\"100.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"830.0\" y=\"142.0\" width=\"530.0\" height=\"32.0\" rx=\"4\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"846.0\" y=\"164.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#FFFFFF\" font-weight=\"600\" >AND a.search_doc @@ q.query</text><text x=\"846.0\" y=\"188.5\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >全文匹配：GIN 负责减少候选行，不负责最终排序</text><rect x=\"830.0\" y=\"254.0\" width=\"530.0\" height=\"100.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"830.0\" y=\"254.0\" width=\"530.0\" height=\"32.0\" rx=\"4\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"846.0\" y=\"276.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#FFFFFF\" font-weight=\"600\" >ORDER BY rank DESC, published_at DESC</text><text x=\"846.0\" y=\"300.5\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >显式相关性排序 + 稳定 tie-breaker；索引不产出次</text><text x=\"846.0\" y=\"321.5\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >序</text><text x=\"830.0\" y=\"380.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >websearch_to_tsquery 适合搜索框；ts_headline 需原文且耗 CPU，分页要控条数</text><text x=\"830.0\" y=\"404.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >ts_rank_cd 的 32 是 rank/(rank+1) 归一化，只缩放分数、不改变排序</text></svg>","ctrl":""},{"eyebrow":"实操 · 验证","title":"别信「我建了 GIN」，去看执行计划","lede":"EXPLAIN (ANALYZE, BUFFERS) 要看路径、recheck、回表量和排序范围；pending list 则交给 autovacuum，只在特殊窗口手动处理。","caption":"图 20　左侧是执行计划的四个观察点，右侧是 pending list 的查看与维护命令。","bridge":"验证不是终点，它得回到建模本身——把整件事做成一个能反复校准的闭环。","notes":"执行计划看四件事就够了。第一，有没有出现 Bitmap Index Scan 加 Bitmap Heap Scan，或者别的符合预期的索引路径；没走索引先回头查表达式是否逐字一致——表达式索引写了显式配置，查询却写成 to_tsvector(body)，那是用不上的。第二，Rows Removed by Index Recheck 是不是异常地多，它对应我们前面讲的权重、短语和 GiST 误判。第三，buffer 命中和 heap blocks 是不是说明回表过多，这决定要不要调字段拆分、覆盖列或者候选收敛策略。第四，排序到底是在候选集合上完成，还是被迫在全表上算了 rank——这一条常常才是「搜索慢」的真凶。右侧三条命令是 pending list 的维护：查 pg_class 的 reloptions 看索引参数，gin_clean_pending_list() 手动清理并返回移除页数，ALTER INDEX 给单个索引调 gin_pending_list_limit。但要强调，这不是日常操作，正常情况下让 autovacuum 和 autoanalyze 维持索引与统计；只有批量写入、延迟抖动或者明确的维护窗口，才需要显式处理。再重复一次本文的诚实边界：这些 SQL 没有在本机实例上执行过，所以这里不编造任何执行结果。验证不是终点，它得回到建模本身。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><text x=\"40.0\" y=\"26.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" >EXPLAIN (ANALYZE, BUFFERS) 看四件事</text><rect x=\"40.0\" y=\"40.0\" width=\"650.0\" height=\"78.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"40.0\" y=\"40.0\" width=\"650.0\" height=\"30.0\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"56.0\" y=\"61.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"600\" >① 索引路径</text><text x=\"56.0\" y=\"82.5\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >是否出现 Bitmap Index Scan / Bitmap Heap Scan，或符合预期的路</text><text x=\"56.0\" y=\"102.5\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >径</text><rect x=\"40.0\" y=\"128.0\" width=\"650.0\" height=\"78.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"40.0\" y=\"128.0\" width=\"650.0\" height=\"30.0\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"56.0\" y=\"149.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"600\" >② Recheck</text><text x=\"56.0\" y=\"170.5\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >Rows Removed by Index Recheck 是否异常</text><rect x=\"40.0\" y=\"216.0\" width=\"650.0\" height=\"78.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"40.0\" y=\"216.0\" width=\"650.0\" height=\"30.0\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"56.0\" y=\"237.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"600\" >③ 回表量</text><text x=\"56.0\" y=\"258.5\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >buffer 命中与 heap blocks 是否说明回表过多</text><rect x=\"40.0\" y=\"304.0\" width=\"650.0\" height=\"78.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"40.0\" y=\"304.0\" width=\"650.0\" height=\"30.0\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"56.0\" y=\"325.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"600\" >④ 排序范围</text><text x=\"56.0\" y=\"346.5\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >rank 是否在候选集合上算，而不是全表计算</text><rect x=\"720.0\" y=\"40.0\" width=\"640.0\" height=\"270.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"720.0\" y=\"40.0\" width=\"640.0\" height=\"30.0\" rx=\"3\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"736.0\" y=\"60.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#FFFFFF\" font-weight=\"600\" >6.4  pending list 维护</text><text x=\"736.0\" y=\"86.3\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.2\" fill=\"#1B2B33\" font-weight=\"400\" >-- 查看 GIN 索引参数</text><text x=\"736.0\" y=\"105.3\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.2\" fill=\"#1B2B33\" font-weight=\"400\" >SELECT relname, reloptions</text><text x=\"736.0\" y=\"124.3\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.2\" fill=\"#1B2B33\" font-weight=\"400\" >FROM pg_class</text><text x=\"736.0\" y=\"143.3\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.2\" fill=\"#1B2B33\" font-weight=\"400\" >WHERE relname = &#x27;articles_search_doc_gin&#x27;;</text><text x=\"736.0\" y=\"162.3\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.2\" fill=\"#1B2B33\" font-weight=\"400\" ></text><text x=\"736.0\" y=\"181.3\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.2\" fill=\"#1B2B33\" font-weight=\"400\" >-- 手动清理 pending list（返回移除页数）</text><text x=\"736.0\" y=\"200.3\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.2\" fill=\"#1B2B33\" font-weight=\"400\" >SELECT gin_clean_pending_list(</text><text x=\"736.0\" y=\"219.3\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.2\" fill=\"#1B2B33\" font-weight=\"400\" >  &#x27;articles_search_doc_gin&#x27;::regclass);</text><text x=\"736.0\" y=\"238.3\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.2\" fill=\"#1B2B33\" font-weight=\"400\" ></text><text x=\"736.0\" y=\"257.3\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.2\" fill=\"#1B2B33\" font-weight=\"400\" >-- 调整单个索引的阈值</text><text x=\"736.0\" y=\"276.3\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.2\" fill=\"#1B2B33\" font-weight=\"400\" >ALTER INDEX articles_search_doc_gin</text><text x=\"736.0\" y=\"295.3\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.2\" fill=\"#1B2B33\" font-weight=\"400\" >SET (gin_pending_list_limit = &#x27;16MB&#x27;);</text><rect x=\"720.0\" y=\"322.0\" width=\"640.0\" height=\"70.0\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1.0\" /><text x=\"738.0\" y=\"361.7\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#AE8A3E\" font-weight=\"600\" >注意</text><text x=\"846.0\" y=\"361.4\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >正常交给 autovacuum / autoanalyze；只在批量写入、延迟抖动或维护窗口显式处理</text><text x=\"40.0\" y=\"410.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >本文未在本机启动实例执行这些 SQL，故不给出伪造执行结果；语法依据 PG 官方文档与源码接口</text></svg>","ctrl":""},{"eyebrow":"方法 · 闭环","title":"全文检索不是一次建模，是一轮一轮校准","lede":"先定义文档单元和语言配置，再选生成列或表达式索引，建索引和统计，然后用执行计划、召回样本与线上指标反复回归。","caption":"图 21　六步直角回环。每一轮从「真实查询跑成什么样」回到「表示层当初建对没有」。","bridge":"闭环里的每一步都有人负责；架构师、DBA、业务开发者，责任边界其实很清楚。","notes":"很多人把全文检索当成一次性的建索引动作，其实它更像一个环。第一步定义文档单元：一行就是一个文档，还是标题、正文、评论、附件分开建模？这一步直接决定权限过滤怎么落、排序怎么算、索引多大。第二步决定表示放哪儿，存储生成列还是表达式索引，配置显不显式、NULL 处不处理、权重怎么打。第三步选 GIN 还是 GiST、pending list 策略怎么定。第四步 ANALYZE，让 MCELEM 和选择率估算有据可依。第五步 EXPLAIN 加 BUFFERS，看真实路径、recheck 和回表。第六步用召回样本、排序结果和摘要效果做回归，再拿线上指标校准，然后——这是最容易被省略的一段——把结论送回第一步，重新审视表示层。为什么非要绕回来？因为绝大多数搜索质量问题，根子都不在 SQL，而在「当初把什么当成一个文档、用了哪套语言配置、给标题打了什么权重」。索引能调的只是速度，表示层决定的才是上限。判断这套闭环值不值，标准也很朴素：搜索结果必须和业务权限、事务更新、审计、备份恢复共用同一套数据库语义。闭环里的每一步都有人负责。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><line x1=\"440.0\" y1=\"80.0\" x2=\"483.6\" y2=\"80.0\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><polygon points=\"490,80 482,75.6 482,84.4\" fill=  >配置显式、coalesce、权重设计</text><rect x=\"940.0\" y=\"40.0\" width=\"400.0\" height=\"80.0\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"940.0\" y=\"40.0\" width=\"400.0\" height=\"34.0\" rx=\"4\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"956.0\" y=\"63.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"600\" >③ GIN / GiST 与参数</text><text x=\"956.0\" y=\"101.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >选索引类型、pending list 策略</text><rect x=\"940.0\" y=\"250.0\" width=\"400.0\" height=\"80.0\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"940.0\" y=\"250.0\" width=\"400.0\" height=\"34.0\" rx=\"4\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1.0\" /><text x=\"956.0\" y=\"273.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"600\" >④ ANALYZE 与统计</text><text x=\"956.0\" y=\"311.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >MCELEM 让优化器能估选择率</text><rect x=\"490.0\" y=\"250.0\" width=\"400.0\" height=\"80.0\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"490.0\" y=\"250.0\" width=\"400.0\" height=\"34.0\" rx=\"4\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1.0\" /><text x=\"506.0\" y=\"273.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"600\" >⑤ EXPLAIN / BUFFERS 验证</text><text x=\"506.0\" y=\"311.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >看路径、recheck、回表、排序范围</text><rect x=\"40.0\" y=\"250.0\" width=\"400.0\" height=\"80.0\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"40.0\" y=\"250.0\" width=\"400.0\" height=\"34.0\" rx=\"4\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1.0\" /><text x=\"56.0\" y=\"273.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"600\" >⑥ 召回 / 排序 / 摘要回归</text><text x=\"56.0\" y=\"311.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >用样本与线上指标反复校准</text><rect x=\"60.0\" y=\"148.0\" width=\"1040.0\" height=\"74.0\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"80.0\" y=\"180.0\" class=\"sv serif\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#245A6B\" font-weight=\"600\" >闭环不是「建完索引就结束」</text><text x=\"80.0\" y=\"208.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >每一轮都要用真实查询、召回样本与线上指标，回到表示层重新校准</text><rect x=\"40.0\" y=\"350.0\" width=\"1320.0\" height=\"50.0\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1.0\" /><text x=\"58.0\" y=\"380.1\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#AE8A3E\" font-weight=\"600\" >判断标准</text><text x=\"236.0\" y=\"379.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >搜索结果必须和业务权限、事务更新、审计、备份恢复共用同一套数据库语义</text></svg>","ctrl":""},{"eyebrow":"落地 · 三个角色","title":"同一套机制，三种责任","lede":"架构师定文档单元与配置建模，DBA 管索引与维护窗口，业务开发者守住输入、NULL 与排序定义。","caption":"图 22　三个角色各自的四条 checklist，落在同一条生成链路的不同位置上。","bridge":"责任清楚了，最后还得知道什么时候干脆别用——边界和高频坑，比最佳实践更能省事故。","notes":"把前面二十页压成三份责任。架构师要定的是别人改不动的东西：文档单元怎么切，多语言是把 regconfig 做成建模字段还是混用会话默认，字段权重是标题 A、摘要 B、正文 D，以及跨业务域的全局搜索要不要交给外部系统。这些都在表示层，一旦错了，后面调 SQL 很难补。DBA 管的是机制的代价：常规优先 GIN，除非有明确 GiST 需求；批量导入先装载再建索引，构建期把 maintenance_work_mem 给足；高写入表盯 fastupdate、gin_pending_list_limit、autovacuum、索引膨胀和前台 cleanup 抖动；建完索引执行 ANALYZE，用 EXPLAIN (ANALYZE, BUFFERS) 验证真实路径。业务开发者守的是输入和输出两头：用户输入用 websearch_to_tsquery 或 plainto_tsquery，别拼 to_tsquery 语法；所有拼接字段写 coalesce，防一个 NULL 污染整条表达式；记住 @@ 只做过滤，排序要显式定义 rank、时间、业务权重和稳定 tie-breaker；ts_headline 需要原文而且耗 CPU，控制摘要长度和返回条数。三份清单看着零碎，其实都在回答同一个问题：谁来决定表示层，谁来承担机制的代价，谁来定义用户看到的结果。责任清楚了，最后还得知道什么时候干脆别用。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40.0\" y=\"24.0\" width=\"420.0\" height=\"380.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"40.0\" y=\"24.0\" width=\"420.0\" height=\"46.0\" rx=\"4\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"60.0\" y=\"54.0\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#FFFFFF\" font-weight=\"600\" >架构师</text><rect x=\"56.0\" y=\"84.0\" width=\"388.0\" height=\"68.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#F1EFE9\" stroke-width=\"1.0\" /><text x=\"68.0\" y=\"98.4\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.6\" fill=\"#46585F\" font-weight=\"400\" >先定义文档单元：一行一文档，还是标题 / 正文</text><text x=\"68.0\" y=\"118.4\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.6\" fill=\"#46585F\" font-weight=\"400\" >/ 评论分模</text><rect x=\"56.0\" y=\"160.0\" width=\"388.0\" height=\"68.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#F1EFE9\" stroke-width=\"1.0\" /><text x=\"68.0\" y=\"174.4\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.6\" fill=\"#46585F\" font-weight=\"400\" >多语言把 regconfig 建成建模字段，不混用会</text><text x=\"68.0\" y=\"194.4\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.6\" fill=\"#46585F\" font-weight=\"400\" >话默认</text><rect x=\"56.0\" y=\"236.0\" width=\"388.0\" height=\"68.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#F1EFE9\" stroke-width=\"1.0\" /><text x=\"68.0\" y=\"250.4\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.6\" fill=\"#46585F\" font-weight=\"400\" >字段权重在生成阶段设计：标题 A、摘要 B、正</text><text x=\"68.0\" y=\"270.4\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.6\" fill=\"#46585F\" font-weight=\"400\" >文 D</text><rect x=\"56.0\" y=\"312.0\" width=\"388.0\" height=\"68.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#F1EFE9\" stroke-width=\"1.0\" /><text x=\"68.0\" y=\"326.4\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.6\" fill=\"#46585F\" font-weight=\"400\" >跨业务域全局搜索要评估外部搜索系统</text><rect x=\"490.0\" y=\"24.0\" width=\"420.0\" height=\"380.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"490.0\" y=\"24.0\" width=\"420.0\" height=\"46.0\" rx=\"4\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1.0\" /><text x=\"510.0\" y=\"54.0\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#FFFFFF\" font-weight=\"600\" >DBA</text><rect x=\"506.0\" y=\"84.0\" width=\"388.0\" height=\"68.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#F1EFE9\" stroke-width=\"1.0\" /><text x=\"518.0\" y=\"98.4\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.6\" fill=\"#46585F\" font-weight=\"400\" >常规优先 GIN，除非有明确 GiST 需求</text><rect x=\"506.0\" y=\"160.0\" width=\"388.0\" height=\"68.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#F1EFE9\" stroke-width=\"1.0\" /><text x=\"518.0\" y=\"174.4\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.6\" fill=\"#46585F\" font-weight=\"400\" >批量导入先装载再建索引，</text><text x=\"518.0\" y=\"194.4\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.6\" fill=\"#46585F\" font-weight=\"400\" >maintenance_work_mem 给足</text><rect x=\"506.0\" y=\"236.0\" width=\"388.0\" height=\"68.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#F1EFE9\" stroke-width=\"1.0\" /><text x=\"518.0\" y=\"250.4\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.6\" fill=\"#46585F\" font-weight=\"400\" >高写入表盯 fastupdate、pending list、</text><text x=\"518.0\" y=\"270.4\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.6\" fill=\"#46585F\" font-weight=\"400\" >autovacuum、膨胀</text><rect x=\"506.0\" y=\"312.0\" width=\"388.0\" height=\"68.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#F1EFE9\" stroke-width=\"1.0\" /><text x=\"518.0\" y=\"326.4\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.6\" fill=\"#46585F\" font-weight=\"400\" >建索引后 ANALYZE，用 EXPLAIN (ANALYZE,</text><text x=\"518.0\" y=\"346.4\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.6\" fill=\"#46585F\" font-weight=\"400\" >BUFFERS) 验证</text><rect x=\"940.0\" y=\"24.0\" width=\"420.0\" height=\"380.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"940.0\" y=\"24.0\" width=\"420.0\" height=\"46.0\" rx=\"4\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1.0\" /><text x=\"960.0\" y=\"54.0\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#FFFFFF\" font-weight=\"600\" >业务开发者</text><rect x=\"956.0\" y=\"84.0\" width=\"388.0\" height=\"68.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#F1EFE9\" stroke-width=\"1.0\" /><text x=\"968.0\" y=\"98.4\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.6\" fill=\"#46585F\" font-weight=\"400\" >用户输入用 websearch_to_tsquery /</text><text x=\"968.0\" y=\"118.4\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.6\" fill=\"#46585F\" font-weight=\"400\" >plainto_tsquery</text><rect x=\"956.0\" y=\"160.0\" width=\"388.0\" height=\"68.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#F1EFE9\" stroke-width=\"1.0\" /><text x=\"968.0\" y=\"174.4\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.6\" fill=\"#46585F\" font-weight=\"400\" >所有拼接字段用 coalesce()，防 NULL 污染</text><rect x=\"956.0\" y=\"236.0\" width=\"388.0\" height=\"68.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#F1EFE9\" stroke-width=\"1.0\" /><text x=\"968.0\" y=\"250.4\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.6\" fill=\"#46585F\" font-weight=\"400\" >@@ 只做过滤，排序显式定义 rank、时间、业务</text><text x=\"968.0\" y=\"270.4\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.6\" fill=\"#46585F\" font-weight=\"400\" >权重</text><rect x=\"956.0\" y=\"312.0\" width=\"388.0\" height=\"68.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#F1EFE9\" stroke-width=\"1.0\" /><text x=\"968.0\" y=\"326.4\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.6\" fill=\"#46585F\" font-weight=\"400\" >ts_headline 需原文且耗 CPU，控制摘要长度与</text><text x=\"968.0\" y=\"346.4\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.6\" fill=\"#46585F\" font-weight=\"400\" >条数</text></svg>","ctrl":""},{"eyebrow":"边界 · 适合与坑","title":"知道什么时候不该用，才算真会用","lede":"适合强事务、强权限、关系过滤的库内搜索；不适合开箱即用的中文高质量召回，也不适合搜索本身就是产品核心的场景。","caption":"图 23　上半是适合与不适合的分界线，下半是五个最高频的工程坑。","bridge":"边界讲完，我们把整条因果链收回来，留几个问题给下一轮动手。","notes":"先看适合的那一半：工单、知识库、文章、商品、配置项这类关系数据内的站内搜索；搜索结果必须和租户、权限、状态、时间范围强绑定；数据量中等或可分区，查询以关键词匹配加简单相关性排序为主；希望少养一套外部搜索系统的双写和一致性成本。再看不适合的那一半，四条都很硬：中文等语言没有合适分词配置，却指望开箱即用拿到高质量召回；搜索是核心产品能力，需要同义词运营、拼写纠错、向量加关键词多路召回和学习排序；全局超大规模文档集合，要独立扩缩容、跨库聚合和专门搜索集群；高写入高并发，却没有能力维护 autovacuum、pending list 和索引膨胀。下半页五个坑，几乎每个都能对上前面某一页：表达式索引和查询表达式配置不一致；忘了 coalesce；把 to_tsquery 暴露给普通搜索框；以为 GIN 存了权重；中文直接套 english 配置。另外还有三个常见但没画进来的：只看是否命中索引、不看 rank 和回表；长文档不拆字段和权重；批量写入后不维护统计信息。你会发现这些坑有个共同点——都不是 SQL 写错，是表示层或边界假设错了。边界讲完，把整条因果链收回来。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40.0\" y=\"24.0\" width=\"640.0\" height=\"176.0\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1.0\" /><text x=\"60.0\" y=\"52.0\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#2F7A66\" font-weight=\"600\" >适合</text><text x=\"60.0\" y=\"72.5\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >工单、知识库、文章、商品标题等库内站内搜索</text><text x=\"60.0\" y=\"102.5\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >搜索与租户 / 权限 / 状态 / 时间范围强绑定</text><text x=\"60.0\" y=\"132.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >数据量中等或可分区，以关键词 + 简单相关性为主</text><text x=\"60.0\" y=\"162.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >希望减少外部搜索系统的双写与一致性成本</text><rect x=\"720.0\" y=\"24.0\" width=\"640.0\" height=\"176.0\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"740.0\" y=\"52.0\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#BE653B\" font-weight=\"600\" >不适合</text><text x=\"740.0\" y=\"72.5\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >中文缺合适分词，却期望开箱即用的高质量召回</text><text x=\"740.0\" y=\"102.5\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >搜索是核心产品，需要同义词运营 / 纠错 / 多路召回</text><text x=\"740.0\" y=\"132.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >全局超大规模文档，需要独立扩缩容与跨库聚合</text><text x=\"740.0\" y=\"162.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >高写入高并发，却没有能力维护 pending list 与膨胀</text><text x=\"40.0\" y=\"220.0\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" >五个高频坑</text><rect x=\"20.0\" y=\"232.0\" width=\"256.0\" height=\"160.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"20.0\" y=\"232.0\" width=\"256.0\" height=\"38.0\" rx=\"4\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"34.0\" y=\"257.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"600\" >配置不一致</text><text x=\"34.0\" y=\"286.3\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.2\" fill=\"#46585F\" font-weight=\"400\" >表达式索引写了 &#x27;english&#x27;，</text><text x=\"34.0\" y=\"308.3\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.2\" fill=\"#46585F\" font-weight=\"400\" >查询却用</text><text x=\"34.0\" y=\"330.3\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.2\" fill=\"#46585F\" font-weight=\"400\" >to_tsvector(body)</text><rect x=\"296.0\" y=\"232.0\" width=\"256.0\" height=\"160.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"296.0\" y=\"232.0\" width=\"256.0\" height=\"38.0\" rx=\"4\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"310.0\" y=\"257.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"600\" >忘了 coalesce</text><text x=\"310.0\" y=\"286.3\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.2\" fill=\"#46585F\" font-weight=\"400\" >title || &#x27; &#x27; || body 中任</text><text x=\"310.0\" y=\"308.3\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.2\" fill=\"#46585F\" font-weight=\"400\" >一字段为 NULL，整式就是</text><text x=\"310.0\" y=\"330.3\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.2\" fill=\"#46585F\" font-weight=\"400\" >NULL</text><rect x=\"572.0\" y=\"232.0\" width=\"256.0\" height=\"160.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"572.0\" y=\"232.0\" width=\"256.0\" height=\"38.0\" rx=\"4\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"586.0\" y=\"257.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"600\" >暴露 to_tsquery</text><text x=\"586.0\" y=\"286.3\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.2\" fill=\"#46585F\" font-weight=\"400\" >用户输入带特殊符号就报错或改</text><text x=\"586.0\" y=\"308.3\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.2\" fill=\"#46585F\" font-weight=\"400\" >变语义</text><rect x=\"848.0\" y=\"232.0\" width=\"256.0\" height=\"160.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"848.0\" y=\"232.0\" width=\"256.0\" height=\"38.0\" rx=\"4\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"862.0\" y=\"257.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"600\" >以为 GIN 存权重</text><text x=\"862.0\" y=\"286.3\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.2\" fill=\"#46585F\" font-weight=\"400\" >GIN 只存 lexeme，权重与短</text><text x=\"862.0\" y=\"308.3\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.2\" fill=\"#46585F\" font-weight=\"400\" >语都要 recheck</text><rect x=\"1124.0\" y=\"232.0\" width=\"256.0\" height=\"160.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"1124.0\" y=\"232.0\" width=\"256.0\" height=\"38.0\" rx=\"4\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"1138.0\" y=\"257.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"600\" >中文套 english</text><text x=\"1138.0\" y=\"286.3\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.2\" fill=\"#46585F\" font-weight=\"400\" >配置错，索引再快也只是快速返</text><text x=\"1138.0\" y=\"308.3\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.2\" fill=\"#46585F\" font-weight=\"400\" >回错误表示上的结果</text><text x=\"40.0\" y=\"412.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >另有：只看命中索引不看 rank 与回表、长文档不拆字段权重、批量写入后不维护统计信息</text></svg>","ctrl":""},{"eyebrow":"收尾 · 回扣","title":"把代价放回表示层","lede":"tsvector 的价值不在替代搜索产品，而在让检索与业务数据共用同一套 SQL、事务、MVCC 与权限语义。","caption":"图 24　左侧五层回扣全篇因果链，右侧留五个扩展问题，底部是这一场的收束判断。","bridge":"这场就到这里。带着右边那五个问题回到自己的表结构里，比记住任何一个函数名都有用。","notes":"最后我们把链条收回去。表示层，parser、dictionary 和配置决定召回边界；匹配层，@@ 只给布尔，表达式树决定候选；索引层，GIN 和 GiST 只负责候选与 recheck，不负责排序；统计层，MCELEM 决定优化器怎么估代价；排序层，rank、权重和位置决定结果好不好用。五层里，真正决定上限的是最底下那层——索引能调的只是速度，语言配置、文档单元、字段权重决定的才是「能不能查对」。这也是全篇最想留下的一句话：tsvector 不是要替代搜索产品，它的价值在于把检索放回业务数据所在的那套语义里，SQL、事务、MVCC、权限、备份恢复全都不用另起炉灶；而代价是语言配置、索引维护、排序质量和召回边界，得应用自己一条条验证。右边留了五个问题：一表里混着英中日文怎么建模、租户隔离要不要组合索引、strip 之后排序会怎样、什么时候两套系统并用谁做权威源、以及搜索慢时怎么用执行计划区分候选多、回表多、rank 重。这些问题没有标准答案，但每一个都能顺着今天这条链推下去。带着它们回到自己的表结构里，比记住任何一个函数名都有用。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><text x=\"40.0\" y=\"28.0\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"600\" >一条链回扣：代价都在「表示层」决定</text><rect x=\"40.0\" y=\"44.0\" width=\"620.0\" height=\"56.0\" rx=\"4\" fill=\"#A4C4C6\" stroke=\"#A4C4C6\" stroke-width=\"1.0\" /><text x=\"58.0\" y=\"77.1\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"600\" >表示层</text><text x=\"176.0\" y=\"76.4\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >parser / dictionary / config 决定召回边界</text><rect x=\" const N = D.length;
let cur = 0, autoTimer = null, autoOn = false;
let notesOpen = false, notesMode = '';   /* here | all | toc | help */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

function fit(){
  const vp = $('#viewport');
  const W = vp.clientWidth, H = vp.clientHeight;
  const s = Math.min(W/1600, H/900);
  const st = $('#stage');
  st.style.transform = 'scale(' + s + ')';
  st.style.left = ((W - 1600*s)/2) + 'px';
  st.style.top  = ((H -  900*s)/2) + 'px';
}
function layout(){
  const pw = notesOpen ? $('#notesPane').offsetWidth : 0;
  $('#viewport').style.right = pw + 'px';
  fit();
  requestAnimationFrame(fit);   /* 布局稳定后再校一次，保证舞台确实等比缩到左侧 */
}
window.addEventListener('resize', layout);

function render(){
  $('#slides').innerHTML = D.map((d,i) =>
    '<section class="slide" id="s'+i+'">'
    + '<div class="eyebrow"><span class="num">'+String(i+1).padStart(2,'0')+' / '+String(N).padStart(2,'0')+'</span>'+d.eyebrow+'</div>'
    + '<h1 class="title">'+d.title+'</h1>'
    + '<div class="lede">'+d.lede+'</div>'
    + '<div class="rule"></div>'
    + '<div class="figwrap">'+d.svg+'</div>'
    + (d.ctrl ? '<div class="ctrls">'+d.ctrl+'</div>' : '<div class="caption">'+d.caption+'</div>')
    + '<div class="bridge"><span class="bk">承接 · NEXT</span>'+d.bridge+'</div>'
    + '<div class="footer"><div class="fbar"><i id="fbar'+i+'"></i></div>'
    + '<span class="fl">数据库筑基课 · 应用实践之 tsvector</span>'
    + '<span class="fr">'+String(i+1).padStart(2,'0')+' / '+String(N).padStart(2,'0')+'</span></div>'
    + '</section>').join('');
}

function go(i, silent){
  i = Math.max(0, Math.min(N-1, i));
  $$('.slide').forEach((el,k)=>el.classList.toggle('on', k===i));
  cur = i;
  try{ localStorage.setItem('tsv-slide', String(i)); }catch(e){}
  $('.pg').textContent = String(i+1).padStart(2,'0') + ' / ' + String(N).padStart(2,'0');
  $('#track i').style.width = ((i+1)/N*100)+'%';
  for(let k=0;k<N;k++){ const b=$('#fbar'+k); if(b) b.style.width = (k<=i?100:0)+'%'; }
  syncNotes();
  if(!silent) toast(D[i].eyebrow + ' · ' + D[i].title);
}
function next(){ if(cur<N-1) go(cur+1); else stopAuto(); }
function prev(){ if(cur>0) go(cur-1); }

function toast(s){
  const t=$('#toast'); t.textContent=s; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1600);
}

function stopAuto(){
  autoOn=false; clearInterval(autoTimer); autoTimer=null;
  $('#btnAuto').textContent='▶ 自动播放'; $('#btnAuto').classList.remove('act');
}
function toggleAuto(){
  if(autoOn){ stopAuto(); toast('已暂停自动播放'); return; }
  autoOn=true; $('#btnAuto').textContent='❚❚ 暂停播放'; $('#btnAuto').classList.add('act');
  autoTimer=setInterval(()=>{ if(cur<N-1) go(cur+1,true); else stopAuto(); }, 12000);
  toast('自动播放：每 12 秒一页');
}

/* ---------- 右侧页内开窗：本页讲稿 / 全文讲稿 / 目录 / 帮助 ---------- */
function noteHTML(d,i,all){
  return '<div class="noteBlock'+(all?' cur':'')+'" id="nb'+i+'">'
    + '<span class="nbn">'+String(i+1).padStart(2,'0')+' · '+d.eyebrow+'</span>'
    + '<h3>'+d.title+'</h3><p>'+d.notes+'</p>'
    + '<div class="nbridge">承接下一页　'+d.bridge+'</div>'
    + '<div class="ncap">图注　'+d.caption+'</div></div>';
}
function tocHTML(){
  return '<div class="tocGrid">' + D.map((d,i)=>
    '<a onclick="jump('+i+')" id="toc'+i+'" class="'+(i===cur?'cur':'')+'">'
    +'<span class="gn">'+String(i+1).padStart(2,'0')+'</span><span class="gt">'+d.title+'</span></a>').join('')
    + '</div>';
}
function helpHTML(){
  return '<div class="helpList">'
    + '<div class="hsec">翻页</div>'
    + '<div><kbd>→ / 空格 / PageDown</kbd>下一页</div><div><kbd>← / PageUp</kbd>上一页</div>'
    + '<div><kbd>1 – 9</kbd>直接跳到第 1–9 页</div><div><kbd>Home / End</kbd>首页 / 末页</div>'
    + '<div class="hsec">页内开窗（右侧）</div>'
    + '<div><kbd>N</kbd>本页讲稿：按一下开，再按一下关</div>'
    + '<div><kbd>T</kbd>全文讲稿：自动定位到当前页，翻页联动滚动</div>'
    + '<div><kbd>G</kbd>目录：点击任意页跳转</div>'
    + '<div><kbd>?</kbd>本帮助</div>'
    + '<div class="hsec">演说控制</div>'
    + '<div><kbd>P</kbd>自动播放 / 暂停（每 12 秒一页）</div>'
    + '<div><kbd>F</kbd>全屏 / 退出全屏（底部按键始终显示）</div>'
    + '<div><kbd>Esc</kbd>关闭右侧开窗 / 退出全屏</div>'
    + '<div class="hsec">动画页</div>'
    + '<div>图下方控件条提供<b>输入</b>、播放 / 暂停、单步、重置</div>'
    + '</div>';
}
function paintNotes(){
  const head=$('#notesHead'), body=$('#notesBody');
  if(notesMode==='here'){
    head.innerHTML='<h2>本页讲稿</h2><div class="sub">'+String(cur+1).padStart(2,'0')+' / '+String(N).padStart(2,'0')+'　·　按 N 关闭　·　按 T 通读全文</div>';
    body.innerHTML=noteHTML(D[cur],cur,true);
    body.scrollTop=0;
  }else if(notesMode==='all'){
    head.innerHTML='<h2>全文讲稿</h2><div class="sub">共 '+N+' 页　·　自动定位当前页　·　翻页联动滚动　·　按 T 关闭</div>';
    body.innerHTML=D.map((d,i)=>noteHTML(d,i,false)).join('');
  }else if(notesMode==='toc'){
    head.innerHTML='<h2>目录</h2><div class="sub">共 '+N+' 页　·　点击跳转　·　按 G 关闭</div>';
    body.innerHTML=tocHTML();
  }else{
    head.innerHTML='<h2>快捷键</h2><div class="sub">按 ? 关闭　·　全屏后底部同样可见</div>';
    body.innerHTML=helpHTML();
  }
  highlightNotes(false);
}
function highlightNotes(scroll){
  if(notesMode==='all'){
    $$('#notesBody .noteBlock').forEach((el,k)=>el.classList.toggle('cur', k===cur));
  }
  $$('#notesBody .tocGrid a').forEach((el,k)=>el.classList.toggle('cur', k===cur));
  if(scroll && notesMode==='all'){
    const el=$('#nb'+cur), body=$('#notesBody');
    if(el) body.scrollTo({top:Math.max(0,el.offsetTop-10),behavior:'smooth'});
  }
}
function syncNotes(){
  if(!notesOpen) return;
  if(notesMode==='here'){ paintNotes(); return; }
  highlightNotes(true);
}
function openNotes(mode,instant){
  const wasOpen=notesOpen;
  notesOpen=true; notesMode=mode;
  document.body.classList.add('notes-open');
  $$('.chrome button').forEach(b=>b.classList.remove('act'));
  $('#btnAuto').classList.toggle('act',autoOn);
  if(mode==='here') $('#btnNotes').classList.add('act');
  if(mode==='all')  $('#btnAll').classList.add('act');
  if(mode==='toc')  $('#btnToc').classList.add('act');
  if(mode==='help') $('#btnHelp').classList.add('act');
  layout();
  paintNotes();
  if(mode==='all'){
    /* 自动定位到当前页：临时关掉平滑滚动，瞬间到位，再恢复供翻页联动使用 */
    const snap=()=>{
      const body=$('#notesBody'), el=$('#nb'+cur);
      if(!el) return;
      const prev=body.style.scrollBehavior;
      body.style.scrollBehavior='auto';
      body.scrollTop=Math.max(0,el.offsetTop-10);
      body.style.scrollBehavior=prev;
    };
    snap();
    requestAnimationFrame(snap);
  }
  if(!wasOpen) toast('讲稿已在右侧开窗，画面等比缩到左侧');
}
function closeNotes(){
  if(!notesOpen) return;
  notesOpen=false; notesMode='';
  document.body.classList.remove('notes-open');
  $$('.chrome button').forEach(b=>b.classList.remove('act'));
  $('#btnAuto').classList.toggle('act',autoOn);
  layout();
}
/* 按一下显示，再按一下关闭，循环 */
function toggleNotes(mode){
  if(notesOpen && notesMode===mode){ closeNotes(); return; }
  openNotes(mode,false);
}
function jump(i){ go(i); if(notesOpen && notesMode==='toc') paintNotes(); }

/* ---------- 全屏：底部控制条与按键始终保留 ---------- */
function fs(){
  const el=document.documentElement;
  const entering=!document.body.classList.contains('immersive');
  if(entering){
    document.body.classList.add('immersive');
    $('#btnFs').textContent='退出全屏 F';
    layout();
    toast('全屏：底部按键仍可使用（F / Esc 退出）');
    try{ const pr=el.requestFullscreen?el.requestFullscreen():null; if(pr&&pr.catch) pr.catch(()=>{}); }catch(e){}
  }else{
    document.body.classList.remove('immersive');
    $('#btnFs').textContent='全屏 F';
    layout();
    toast('已退出全屏');
    try{ if(document.fullscreenElement&&document.exitFullscreen) document.exitFullscreen(); }catch(e){}
  }
}
document.addEventListener('fullscreenchange',()=>{
  if(!document.fullscreenElement&&document.body.classList.contains('immersive')){
    document.body.classList.remove('immersive');
    const b=$('#btnFs'); if(b) b.textContent='全屏 F';
  }
  layout();
});

document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  const k=e.key;
  const typing=(tag==='input'||tag==='select'||tag==='textarea');
  const navKey=(k.indexOf('Arrow')===0||k===' '||k==='Home'||k==='End'||k==='PageUp'||k==='PageDown');
  if(k==='Escape'){
    if(notesOpen){ closeNotes(); return; }
    if(document.body.classList.contains('immersive')){ fs(); return; }
    return;
  }
  if(typing && navKey) return;
  if(typing && (k==='n'||k==='N'||k==='t'||k==='T'||k==='g'||k==='G'||k==='f'||k==='F'||k==='p'||k==='P')) return;
  if(k==='ArrowRight'||k===' '||k==='PageDown'){ e.preventDefault(); next(); }
  else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); prev(); }
  else if(k==='f'||k==='F'||e.code==='KeyF'){ e.preventDefault(); fs(); }
  else if(k==='g'||k==='G'){ e.preventDefault(); toggleNotes('toc'); }
  else if(k==='n'||k==='N'){ e.preventDefault(); toggleNotes('here'); }
  else if(k==='t'||k==='T'){ e.preventDefault(); toggleNotes('all'); }
  else if(k==='p'||k==='P'){ e.preventDefault(); toggleAuto(); }
  else if(k==='?'||k==='h'||k==='H'){ e.preventDefault(); toggleNotes('help'); }
  else if(k==='Home'){ e.preventDefault(); go(0); }
  else if(k==='End'){ e.preventDefault(); go(N-1); }
  else if(/^[1-9]$/.test(k)){ go(parseInt(k,10)-1); }
});

   note:"The 是停用词被剔除；Fat / Rats 小写化并词干化；位置仍沿用原文 token 序号"}
];
let aStep=0, aTimer=null, aPlaying=false;
const A_MAX=4;
const A_MSG=["原始文本：parser 先按 token 类型和顺序切开",
             "过滤：english 配置的停用词与无词典 token 被丢弃",
             "归一化：dictionary 把词形收敛为 lexeme，位置不变",
             "排序去重：同 lexeme 合并位置数组，按字典序排列",
             "得到 tsvector：lexeme + 位置（可选权重），原文不保留"];
function aPaint(){
  const si=+$('#aSent').value, d=A_SENT[si];
  $$('#animA .atok').forEach(g=>{
    const idx=+g.getAttribute('data-i');
    g.setAttribute('opacity', idx<d.toks.length?'1':'0');
    const tk=g.querySelector('.atoken'); if(tk) tk.textContent=d.toks[idx]||'';
  });
  $$('#animA .astage').forEach(g=>{
    const n=+g.getAttribute('data-s');
    const box=g.querySelector('.sbox'); if(!box) return;
    box.setAttribute('fill', n<=aStep?'#E5EFF0':'#FFFFFF');
    box.setAttribute('stroke', n<=aStep?'#245A6B':'#D9D5CB');
  });
  $$('#animA .akeep').forEach(g=>{
    const idx=+g.getAttribute('data-i'), k=idx<d.toks.length ? d.keep[idx] : 0;
    g.setAttribute('opacity', aStep>=1?'1':'0');
    g.setAttribute('fill', k?'#2F7A66':'#BE653B');
    g.textContent = k?'保留':'剔除';
  });
  $$('#animA .alex').forEach(g=>{
    const idx=+g.getAttribute('data-i');
    g.textContent = d.lex[idx] || '—';
    g.setAttribute('opacity', aStep>=2?'1':'0');
  });
  $$('#animA .apos').forEach(g=>{
    const idx=+g.getAttribute('data-i');
    g.textContent = d.pos[idx] ? String(d.pos[idx]) : '·';
  });
  const raw=$('#animARaw'); if(raw) raw.textContent=d.raw;
  const res=$('#animARes'); if(res) res.textContent = aStep>=A_MAX ? d.out : '（等待生成）';
  const note=$('#animANote'); if(note) note.textContent = d.note;
  const out=$('#animAOut');
  if(out) out.innerHTML='<b>第 '+aStep+' / '+A_MAX+' 步　</b>'+A_MSG[aStep]
      +(aStep>=A_MAX?'　→　'+d.out:'');
  const s=$('#aStep'); if(s) s.value=aStep;
}
function aPlay(){
  if(aPlaying){ aPause(); return; }
  aPlaying=true; $('#aPlay').textContent='❚❚ 暂停'; $('#aPlay').classList.add('play');
  if(aStep>=A_MAX) aStep=0;
  aTimer=setInterval(()=>{ aStep++; aPaint(); if(aStep>=A_MAX) aPause(); },1000);
}
function aPause(){
  aPlaying=false; clearInterval(aTimer); aTimer=null;
  const b=$('#aPlay'); if(b){ b.textContent='▶ 播放'; b.classList.remove('play'); }
}
function aTick(){ if(aStep<A_MAX){ aStep++; aPaint(); } }
function aReset(){ aPause(); aStep=0; aPaint(); }

/* ---------- 动画 B：查询执行三段耗时（定性示意，不含统计数字） ---------- */
const B_Q=[
  {k:'and', n:'多词 AND 查询', seg:[1,1,1], why:'常规路径：GIN 收敛候选，recheck 与 rank 都在候选集上完成'},
  {k:'neg', n:'纯否定 !foo', seg:[0,1,1], why:'没有正向必需词，倒排候选几乎无法收敛，候选段退化为大范围扫描'},
  {k:'phrase', n:'短语 / 带权重', seg:[1,2,1], why:'GIN 不存权重、短语需位置 → 返回 MAYBE，回表 recheck 段变重'},
  {k:'empty', n:'空 tsquery', seg:[0,0,0], why:'空查询不匹配任何行，选择率估算直接为 0，三段都不必执行'},
  {k:'headline', n:'大结果集 + 摘要', seg:[1,1,2], why:'ts_headline 要回原文重解析，rank / headline 段可能成为主耗时'}
];
let bStep=0, bTimer=null, bPlaying=false;
const B_MAX=3;
function bPaint(){
  const qi=+$('#bQuery').value, q=B_Q[qi];
  $$('#animB .bseg').forEach(g=>{
    const n=+g.getAttribute('data-s'), w=+g.getAttribute('data-w');
    const box=g.querySelector('.sbox'); if(!box) return;
    const act=n<=bStep;
    const heavy = q.seg[n-1]===2;
    box.setAttribute('fill', act?(heavy?'#F7E9DE':'#E5EFF0'):'#FFFFFF');
    box.setAttribute('stroke', act?(heavy?'#BE653B':'#245A6B'):'#D9D5CB');
    box.setAttribute('stroke-width', act&&heavy?'2.2':'1.1');
    const tag=g.querySelector('.btag');
    if(tag){ tag.setAttribute('opacity',act?'1':'0');
      tag.setAttribute('fill',heavy?'#BE653B':'#2F7A66');
      tag.textContent = q.seg[n-1]===0?'退化':(q.seg[n-1]===2?'变重':'正常'); }
  });
  const out=$('#animBOut');
  if(out){
    const names=['待开始','① 候选召回','② 回表 recheck','③ rank / headline'];
    out.innerHTML='<b>'+q.n+' · '+names[bStep]+'　</b>'+(bStep>=B_MAX?q.why:'逐段点亮，观察哪一段承担代价');
  }
  const s=$('#bStep'); if(s) s.value=bStep;
}
function bPlay(){
  if(bPlaying){ bPause(); return; }
  bPlaying=true; $('#bPlay').textContent='❚❚ 暂停'; $('#bPlay').classList.add('play');
  if(bStep>=B_MAX) bStep=0;
  bTimer=setInterval(()=>{ bStep++; bPaint(); if(bStep>=B_MAX) bPause(); },950);
}
function bPause(){
  bPlaying=false; clearInterval(bTimer); bTimer=null;
  const b=$('#bPlay'); if(b){ b.textContent='▶ 播放'; b.classList.remove('play'); }
}
function bTick(){ if(bStep<B_MAX){ bStep++; bPaint(); } }
function bReset(){ bPause(); bStep=0; bPaint(); }

/* ---------- 动画 C：GIN fastupdate pending list（示意，非统计数字） ---------- */
let cStep=0, cTimer=null, cPlaying=false;
const C_MAX=12, C_LIMIT=8;
function cPaint(){
  const fast=+$('#cFast').value;
  const cycle=C_LIMIT+1, m=cStep%cycle;
  const filled=fast===1?m:0;
  const cleaned=fast===1 && cStep>0 && m===0;
  $$('#animC .cslot').forEach((g,i)=>{
    const on=i<filled;
    const r=g.querySelector('.sbox'); if(!r) return;
    r.setAttribute('fill', on?'#F7E9DE':'#FFFFFF');
    r.setAttribute('stroke', on?'#BE653B':'#D9D5CB');
  });
  const main=$('#animCMain');
  if(main) main.setAttribute('fill',(fast===0||cleaned)?'#E4F0EA':'#FFFFFF');
  const out=$('#animCOut');
  if(out){
    let msg;
    if(fast===0) msg='fastupdate=off：每次写入直接维护主倒排结构，写入慢但响应时间稳定';
    else if(cleaned) msg='pending list 达到阈值 → 触发清理，这一次写入明显变慢（前台 cleanup 抖动）';
    else msg='写入先进入未排序 pending list；查询也要同时扫描它，堆积越久检索越慢';
    out.innerHTML='<b>写入批次 '+cStep+' / '+C_MAX+'（示意）　</b>'+msg;
  }
  const s=$('#cStep'); if(s) s.value=cStep;
  const flag=$('#animCFlag'); if(flag) flag.setAttribute('opacity',cleaned?'1':'0');
}
function cPlay(){
  if(cPlaying){ cPause(); return; }
  cPlaying=true; $('#cPlay').textContent='❚❚ 暂停'; $('#cPlay').classList.add('play');
  if(cStep>=C_MAX) cStep=0;
  cTimer=setInterval(()=>{ cStep++; cPaint(); if(cStep>=C_MAX) cPause(); },700);
}
function cPause(){
  cPlaying=false; clearInterval(cTimer); cTimer=null;
  const b=$('#cPlay'); if(b){ b.textContent='▶ 播放'; b.classList.remove('play'); }
}
function cTick(){ if(cStep<C_MAX){ cStep++; cPaint(); } }
function cReset(){ cPause(); cStep=0; cPaint(); }

function init(){
  render(); layout();
  let saved=0; try{ saved=parseInt(localStorage.getItem('tsv-slide')||'0',10)||0; }catch(e){}
  go(saved,true);
  $('#btnPrev').onclick=prev; $('#btnNext').onclick=next;
  $('#btnToc').onclick=()=>toggleNotes('toc');
  $('#btnNotes').onclick=()=>toggleNotes('here');
  $('#btnAll').onclick=()=>toggleNotes('all');
  $('#btnAuto').onclick=toggleAuto;
  $('#btnFs').onclick=fs;
  $('#btnHelp').onclick=()=>toggleNotes('help');
  aPaint(); bPaint(); cPaint();
  ['aSent','aStep','bQuery','bStep','cFast','cStep'].forEach(id=>{
    const el=$('#'+id); if(!el) return;
    el.addEventListener('input',()=>{
      if(id==='aSent'){ aStep=0; aPaint(); }
      if(id==='aStep'){ aStep=+el.value; aPaint(); }
      if(id==='bQuery'){ bStep=0; bPaint(); }
      if(id==='bStep'){ bStep=+el.value; bPaint(); }
      if(id==='cFast'){ cStep=0; cPaint(); }
      if(id==='cStep'){ cStep=+el.value; cPaint(); }
    });
    el.addEventListener('change',()=>el.dispatchEvent(new Event('input')));
  });
  const bind=(id,fn)=>{ const el=$(id); if(el) el.onclick=fn; };
  bind('#aPlay',aPlay); bind('#aTick',aTick); bind('#aReset',aReset);
  bind('#bPlay',bPlay); bind('#bTick',bTick); bind('#bReset',bReset);
  bind('#cPlay',cPlay); bind('#cTick',cTick); bind('#cReset',cReset);
}
document.addEventListener('DOMContentLoaded', init);

</script>
</body>
