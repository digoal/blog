<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数据库筑基课 · 应用实践之 tsvector｜把文本搜索拆成一条因果链</title>
<!-- 单文件交付：所有原理图均为现场绘制的内联 SVG；零外部图片 / 字体 / 脚本依赖。 -->
<!-- 视觉母题：地层剖面 / 工程蓝图。内容按「困境 → 表示层 → 匹配与排序 → 索引与优化器 → 实操与闭环」推演。 -->
<style>

:root{
  --bg:#F7F6F2; --paper2:#F1EFE9; --ink:#1B2B33; --ink2:#46585F; --muted:#89938F;
  --line:#D9D5CB; --primary:#245A6B; --prim-l:#E5EFF0;
  --accent:#BE653B; --acc-l:#F7E9DE; --green:#2F7A66; --gold:#AE8A3E;
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#E9E7E1}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
#viewport{position:absolute;inset:0 0 58px 0;overflow:hidden}
#stage{position:absolute;width:1600px;height:900px;background:var(--bg);
  transform-origin:top left;box-shadow:0 18px 60px rgba(27,43,51,.13)}
.slide{position:absolute;inset:0;display:none}
.slide.on{display:block;animation:fadein .38s cubic-bezier(.2,.7,.2,1)}
@keyframes fadein{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.eyebrow{position:absolute;left:64px;top:44px;font-size:13px;letter-spacing:3.4px;
  color:var(--primary);font-weight:600}
.eyebrow .num{font-family:var(--mono);letter-spacing:1px;color:var(--accent);margin-right:14px}
h1.title{position:absolute;left:64px;top:70px;margin:0;font-family:var(--serif);
  font-size:44px;line-height:1.25;font-weight:700;letter-spacing:1.2px;color:var(--ink);width:1472px}
.lede{position:absolute;left:64px;top:139px;width:1440px;font-size:19px;color:var(--ink2);
  line-height:1.5;letter-spacing:.3px}
.rule{position:absolute;left:64px;top:181px;width:1472px;height:1px;background:var(--line)}
.figwrap{position:absolute;left:100px;top:198px;width:1400px;height:430px}
svg.figure{display:block;overflow:visible}
svg.figure text{font-family:var(--sans)}
svg.figure text.serif{font-family:var(--serif)}
svg.figure text.mono{font-family:var(--mono)}
svg.figure text.s{font-family:var(--sans)}
.caption{position:absolute;left:100px;top:638px;width:1400px;font-size:13px;
  color:var(--muted);letter-spacing:.4px;line-height:1.6}
.bridge{position:absolute;left:64px;top:706px;width:1472px;font-size:20px;
  color:var(--accent);line-height:1.55;letter-spacing:.4px;padding-left:18px;
  border-left:3px solid var(--accent);font-family:var(--serif)}
.bridge .bk{font-family:var(--sans);font-size:13px;color:var(--muted);
  letter-spacing:2px;display:block;margin-bottom:2px}
.footer{position:absolute;left:64px;top:846px;width:1472px;height:1px;background:var(--line)}
.footer .fl{position:absolute;left:0;top:14px;font-size:12.5px;color:var(--muted);letter-spacing:2px}
.footer .fr{position:absolute;right:0;top:12px;font-family:var(--mono);font-size:14px;color:var(--ink2)}
.footer .fbar{position:absolute;left:0;right:0;top:-1px;height:2px;background:transparent}
.footer .fbar i{display:block;height:2px;background:var(--primary);width:0;transition:width .4s ease}

/* 动画页控件：位于图下方独立条带，绝不覆盖图 */
.ctrls{position:absolute;left:100px;top:634px;width:1400px;height:46px;display:flex;
  align-items:center;gap:10px}
.ctrls label{font-size:13.5px;color:var(--ink2);white-space:nowrap}
.ctrls select,.ctrls input[type=range]{font-family:var(--sans);font-size:13.5px;color:var(--ink);
  background:#fff;border:1px solid var(--line);border-radius:4px;padding:5px 8px;outline:none}
.ctrls input[type=range]{width:150px;padding:0;accent-color:var(--primary);border:none;background:transparent}
.ctrls .btn{min-height:30px;padding:5px 13px;border:1px solid var(--primary);border-radius:4px;
  background:#fff;color:var(--primary);font-size:13.5px;cursor:pointer;font-family:var(--sans);white-space:nowrap}
.ctrls .btn.play{background:var(--primary);color:#fff}
.ctrls .btn:hover{filter:brightness(.94)}
.ctrls .out{font-size:13.5px;color:var(--ink2);margin-left:auto;min-width:0;flex:1;
  max-width:620px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrls .out b{color:var(--accent);font-weight:600}

/* 底部外壳：始终可见，全屏后按键仍在页面底部 */
.chrome{position:fixed;left:0;right:0;bottom:0;height:58px;background:#FCFBF8;
  border-top:1px solid var(--line);display:flex;align-items:center;gap:6px;
  padding:0 16px;z-index:40;font-size:13px;color:var(--ink2)}
body.immersive .chrome{background:rgba(252,251,248,.97)}
.chrome .sep{width:1px;height:22px;background:var(--line);margin:0 4px;flex:none}
.chrome button{font-family:var(--sans);font-size:13px;color:var(--ink2);background:transparent;
  border:1px solid transparent;border-radius:5px;padding:7px 10px;cursor:pointer;white-space:nowrap;flex:none}
.chrome button:hover{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome button.act{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome .pg{font-family:var(--mono);font-size:14px;color:var(--ink);min-width:70px;text-align:center;flex:none}
.chrome .track{flex:1;min-width:40px;height:3px;background:var(--line);border-radius:3px;margin:0 10px;position:relative}
.chrome .track i{position:absolute;left:0;top:0;height:3px;background:var(--primary);border-radius:3px;transition:width .35s}
.chrome .keys{display:flex;gap:5px;align-items:center;flex:none;margin-left:2px}
.chrome .keys kbd{font-family:var(--mono);font-size:11.5px;background:#fff;border:1px solid var(--line);
  border-bottom-width:2px;border-radius:4px;padding:3px 6px;color:var(--primary);line-height:1}
.chrome .keys .kl{font-size:11.5px;color:var(--muted);margin-right:3px}

/* 右侧讲稿：页内开窗，不是弹窗，不遮挡舞台 */
#notesPane{position:fixed;right:0;top:0;bottom:58px;width:min(38vw,560px);
  background:#FCFBF8;border-left:1px solid var(--line);z-index:30;display:flex;flex-direction:column;
  transform:translateX(101%);transition:transform .34s cubic-bezier(.2,.7,.2,1);
  box-shadow:-10px 0 34px rgba(27,43,51,.10)}
body.notes-open #notesPane{transform:none}
#notesHead{padding:20px 26px 14px;border-bottom:1px solid var(--line);flex:none}
#notesHead h2{margin:0;font-family:var(--serif);font-size:24px;color:var(--ink);letter-spacing:.5px}
#notesHead .sub{font-size:12.5px;color:var(--muted);letter-spacing:1.4px;margin-top:6px}
#notesBody{position:relative;overflow-y:auto;overflow-x:hidden;flex:1;scroll-behavior:smooth;padding:8px 0 40px}
.noteBlock{padding:18px 26px 20px;border-bottom:1px solid var(--line);border-left:3px solid transparent}
.noteBlock.cur{border-left-color:var(--accent);background:var(--acc-l)}
.noteBlock .nbn{font-family:var(--mono);font-size:11.5px;color:var(--accent);letter-spacing:1.2px}
.noteBlock h3{margin:7px 0 10px;font-family:var(--serif);font-size:19px;color:var(--primary);line-height:1.4}
.noteBlock p{margin:0;font-size:15px;line-height:1.95;color:var(--ink2);letter-spacing:.25px}
.noteBlock .nbridge{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);
  font-family:var(--serif);font-size:14.5px;color:var(--accent);line-height:1.7}
.noteBlock .ncap{margin-top:10px;font-size:12.5px;color:var(--muted);line-height:1.7}
.tocGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;padding:18px 26px}
.tocGrid a{display:block;padding:11px 12px;border:1px solid var(--line);border-radius:4px;
  background:#fff;text-decoration:none;color:var(--ink);cursor:pointer;line-height:1.45}
.tocGrid a:hover{border-color:var(--primary);background:var(--prim-l)}
.tocGrid a.cur{border-color:var(--accent);background:var(--acc-l)}
.tocGrid a .gn{font-family:var(--mono);font-size:11px;color:var(--accent);display:block;margin-bottom:3px}
.tocGrid a .gt{font-size:13.5px}
.helpList{padding:14px 26px 30px;font-size:14.5px;line-height:2.3;color:var(--ink2)}
.helpList kbd{font-family:var(--mono);font-size:12px;background:#fff;border:1px solid var(--line);
  border-bottom-width:2px;border-radius:4px;padding:2px 7px;color:var(--primary);margin-right:10px}
.helpList .hsec{font-family:var(--serif);font-size:17px;color:var(--primary);
  border-bottom:1px solid var(--line);padding-bottom:6px;margin:16px 0 8px}
.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:var(--ink);
  color:#fff;font-size:13px;padding:9px 16px;border-radius:5px;opacity:0;transition:.3s;z-index:80;pointer-events:none}
.toast.on{opacity:1}
@media print{.chrome,#notesPane,.toast{display:none!important}#viewport{position:static;right:0!important}
  #stage{position:static;transform:none!important;box-shadow:none}
  .slide{display:block!important;page-break-after:always;position:relative;height:900px}}

</style>
</head>
<body>
<div id="viewport"><div id="stage"><div id="slides"></div></div></div>
<aside id="notesPane"><div id="notesHead"></div><div id="notesBody"></div></aside>
<div class="chrome">
  <button id="btnPrev">← 上一页</button>
  <button id="btnNext">下一页 →</button>
  <span class="pg" id="pg">01 / 01</span>
  <div class="track" id="track"><i></i></div>
  <div class="sep"></div>
  <button id="btnToc">目录 G</button>
  <button id="btnNotes">本页讲稿 N</button>
  <button id="btnAll">全文讲稿 T</button>
  <button id="btnAuto">▶ 自动播放</button>
  <button id="btnFs">全屏 F</button>
  <button id="btnHelp">? 帮助</button>
  <div class="sep"></div>
  <div class="keys" title="快捷键：全屏后同样显示在页面底部"><span class="kl">按键</span><kbd>←</kbd><kbd>→</kbd><kbd>G</kbd><kbd>N</kbd><kbd>T</kbd><kbd>P</kbd><kbd>F</kbd><kbd>?</kbd></div>
</div>
<div class="toast" id="toast"></div>
<script>

const D = [{"eyebrow":"开场 · 问题不是查不到","title":"搜索不是字符串包含","lede":"小数据量时，LIKE &#x27;%keyword%&#x27; 直接、够用；一旦文档有结构、语言、权重、权限和事务要求，问题就换了形状。","caption":"图 01　左侧是起点；右侧七条是同时压上来的约束，最后两条正是数据库内建优势、也是外部方案最难对齐的地方。","bridge":"所以先别急着选方案，我们把三条老路各自的代价落在哪儿看清楚。","notes":"咱们从一个特别常见的起点讲起。应用刚上线那会儿，搜索框后面就是一句 LIKE，表里几千行，扫一遍文本，毫秒级就回来了，谁也不会觉得这有什么问题。真正的变化不是数据量涨了，是文档本身变复杂了：一篇东西现在有标题、有正文、有标签，标题里命中一次和正文里命中三次，哪个该排前面？用户搜 satisfy，库里写的是 satisfies，要不要捞出来？再往上叠，还有分页、权限、租户隔离，还有一条最容易被忽略的——我刚改完这篇文档，下一秒自己搜得到吗，别人搜得到吗？你看，这七个约束不是排队来的，是一起压上来的。所以问题早就不是「能不能查到」，而是「查到的结果能不能用、能不能解释、能不能和业务里其它规则对上」。PostgreSQL 官方文档 12.1 把 LIKE、ILIKE、正则的短板列得很直白：没有语言学支持、不给排序、没有索引支持，于是每次查询都得处理全部文档。这三句话，其实已经把后面所有设计的动机写完了。接下来我们不急着看 tsvector，先把大家最常走的三条老路摊开，看看代价究竟落在哪儿。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40.0\" y=\"16.0\" width=\"250.0\" height=\"372.0\" rx=\"4\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.0\" /><text x=\"62.0\" y=\"58.0\" class=\"sv serif\" text-anchor=\"start\" font-size=\"20.0\" fill=\"#FFFFFF\" font-weight=\"600\" >起点 · 小数据量</text><text x=\"62.0\" y=\"96.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#CFE0DC\" font-weight=\"400\" >LIKE &#x27;%keyword%&#x27;</text><line x1=\"62.0\" y1=\"116.0\" x2=\"268.0\" y2=\"116.0\" stroke=\"#74A5AD\" stroke-width=\"1\"/><text x=\"62.0\" y=\"150.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#A4C4C6\" font-weight=\"400\" >一个字段、一种语言</text><text x=\"62.0\" y=\"178.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#A4C4C6\" font-weight=\"400\" >扫一遍文本就能答</text><text x=\"62.0\" y=\"224.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#CFE0DC\" font-weight=\"400\" >一旦文档变成</text><text x=\"62.0\" y=\"258.0\" class=\"sv serif\" text-anchor=\"start\" font-size=\"22.0\" fill=\"#FFFFFF\" font-weight=\"600\" >有结构、有权重</text><text x=\"62.0\" y=\"290.0\" class=\"sv serif\" text-anchor=\"start\" font-size=\"22.0\" fill=\"#FFFFFF\" font-weight=\"600\" >有权限、要排序</text><text x=\"62.0\" y=\"336.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#CFE0DC\" font-weight=\"400\" >问题从「能不能查到」</text><text x=\"62.0\" y=\"360.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#CFE0DC\" font-weight=\"400\" >变成「查到后好不好用」</text><rect x=\"320.0\" y=\"16.0\" width=\"1040.0\" height=\"47.0\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#F1EFE9\" stroke-width=\"1.0\" /><text x=\"338.0\" y=\"44.8\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"600\" >01  文档结构</text><text x=\"580.0\" y=\"44.2\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >标题 / 正文 / 标签 / 附件分别建模，字段之间权重不同</text><rect x=\"320.0\" y=\"69.0\" width=\"1040.0\" height=\"47.0\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#F1EFE9\" stroke-width=\"1.0\" /><text x=\"338.0\" y=\"97.8\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"600\" >02  语言差异</text><text x=\"580.0\" y=\"97.2\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >词形变化、停用词、中文分词，配置一变结果就变</text><rect x=\"320.0\" y=\"122.0\" width=\"1040.0\" height=\"47.0\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#F1EFE9\" stroke-width=\"1.0\" /><text x=\"338.0\" y=\"150.8\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"600\" >03  相关性排序</text><text x=\"580.0\" y=\"150.2\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >要 TopN，不要把全部命中行平铺出来</text><rect x=\"320.0\" y=\"175.0\" width=\"1040.0\" height=\"47.0\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#F1EFE9\" stroke-width=\"1.0\" /><text x=\"338.0\" y=\"203.8\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"600\" >04  分页与稳定次序</text><text x=\"580.0\" y=\"203.2\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >同分结果要有确定的 tie-breaker</text><rect x=\"320.0\" y=\"228.0\" width=\"1040.0\" height=\"47.0\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#F1EFE9\" stroke-width=\"1.0\" /><text x=\"338.0\" y=\"256.8\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"600\" >05  权限与租户过滤</text><text x=\"580.0\" y=\"256.2\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >搜索结果必须落在当前用户可见的数据里</text><rect x=\"320.0\" y=\"281.0\" width=\"1040.0\" height=\"47.0\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"338.0\" y=\"309.8\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"600\" >06  事务一致性</text><text x=\"580.0\" y=\"309.2\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >写完立刻可查，不能等外部索引追赶</text><rect x=\"320.0\" y=\"334.0\" width=\"1040.0\" height=\"47.0\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"338.0\" y=\"362.8\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"600\" >07  代价可估算</text><text x=\"580.0\" y=\"362.2\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >优化器要能估出 @@ 会命中多少行</text><text x=\"320.0\" y=\"410.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >七个约束同时压上来　→　搜索变成一条链路：表示在哪生成、怎么更新、怎么索引、怎么估代价、怎么验证结果</text></svg>","ctrl":""},{"eyebrow":"困境 · 三条老路","title":"三条老路，代价落在三处","lede":"官方文档 12.1 说得很直白：LIKE / ILIKE / 正则缺语言学支持、不给排序、没有索引支持，所以每查一次都要处理所有文档。","caption":"图 02　三条路径各自的好处与主要代价；最下面那条，是它们共同缺的东西。","bridge":"既然缺口都指向同一个位置——文档表示层，那 PostgreSQL 把这个表示放进类型系统，会发生什么？","notes":"第一条路最简单，就在 SQL 里写 LIKE 或者正则。好处是零成本、不需要额外组件；代价是大表要扫大量文本，而且它完全不懂语言，satisfies 和 satisfy 在它眼里就是两个不同的字符串。文档里特意举这个例子，说你当然可以用 OR 把所有词形拼出来，可那既繁琐又容易漏，有些词能有上千种变形。第二条路是应用自己分词，把结果塞进普通数组或者 JSON。可控性是高了，但查询语义、索引能力、统计信息、相关性排序、还有数据变更时的维护，全得你自己拼一遍，等于在数据库外面又写了一个半成品搜索引擎。第三条路是上外部搜索引擎。功能确实最强，BM25、同义词、纠错、多路召回都有；可代价从「写一条 SQL」变成了「管一条链路」：双写、一致性、权限同步、回表、备份恢复，任何一环没对齐，搜索结果就跟业务库对不上。你把三条路摆在一起看，会发现短板各不相同，缺口却指向同一个位置——文档预处理之后的那个表示，没有一个放在数据库的类型系统里。既然如此，PostgreSQL 干脆把它做成一种内置类型，会发生什么？这就是 tsvector 的切入点。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40.0\" y=\"16.0\" width=\"250.0\" height=\"104.0\" rx=\"4\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"165.0\" y=\"60.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#FFFFFF\" font-weight=\"600\" >LIKE / ILIKE / 正则</text><text x=\"165.0\" y=\"84.2\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#CFE0DC\" font-weight=\"400\" >实现最快</text><rect x=\"318.0\" y=\"40.0\" width=\"210.0\" height=\"56.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"423.0\" y=\"72.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"600\" >SQL 条件</text><line x1=\"528.0\" y1=\"68.0\" x2=\"549.4\" y2=\"68.0\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><polygon points=\"555,68 548,64.15 548,71.85\" fill=\"#7BA6AF\"/><rect x=\"555.0\" y=\"40.0\" width=\"210.0\" height=\"56.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"660.0\" y=\"72.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"600\" >顺序扫描文本</text><line x1=\"765.0\" y1=\"68.0\" x2=\"786.4\" y2=\"68.0\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><polygon points=\"792,68 785,64.15 785,71.85\" fill=\"#7BA6AF\"/><rect x=\"792.0\" y=\"40.0\" width=\"210.0\" height=\"56.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"897.0\" y=\"72.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"600\" >无语言归一化</text><rect x=\"1030.0\" y=\"24.0\" width=\"330.0\" height=\"88.0\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"1046.0\" ill=\"#1B2B33\" font-weight=\"600\" >独立搜索集群</text><rect x=\"1030.0\" y=\"268.0\" width=\"330.0\" height=\"88.0\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"1046.0\" y=\"290.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#BE653B\" font-weight=\"600\" >主要代价</text><text x=\"1046.0\" y=\"302.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#46585F\" font-weight=\"400\" >一致性、权限同步、回表</text><text x=\"1046.0\" y=\"322.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.2\" fill=\"#46585F\" font-weight=\"400\" >备份恢复链路变长</text><rect x=\"40.0\" y=\"384.0\" width=\"1320.0\" height=\"42.0\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"58.0\" y=\"410.1\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#BE653B\" font-weight=\"600\" >共同缺口</text><text x=\"236.0\" y=\"409.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >文档预处理结果不在数据库类型系统里，统计信息、索引、事务语义都接不上</text></svg>","ctrl":""},{"eyebrow":"核心判断 · 定位","title":"tsvector 是文档表示层，不是搜索产品","lede":"全文检索链路有七层，tsvector 只占第三层：把预处理结果变成数据库可索引、可统计、可与 SQL 组合的一种类型。","caption":"图 03　七阶地层剖面，越往下越底层。深靛是结构与机制，陶橙是代价与承接。","bridge":"定位清楚了，接下来拿一段真文本把这层表示跑一遍——别停在名词上。","notes":"先给一个判断，后面每一页都在为它做注脚：tsvector 把文本搜索转成了三件不同的事——归一化词项集合上的布尔匹配，位置和权重参与的排序，以及索引给出候选之后回表确认。这三件事不是一个修辞，是真的分属不同函数、不同阶段。图上这七层，从下往上数：parser 把原文切成带类型的 token，dictionary 把 token 收敛成 lexeme 并丢掉停用词，tsvector 存排序去重后的词项和可选的位置权重，tsquery 表达查询，GIN 和 GiST 负责缩小候选，@@ 做布尔判断，最后才是业务看得见的 rank 和摘要。tsvector 只占第三层，所以它不是完整的搜索产品，它是「文档表示层」。这个词很要紧：语言规则来自 text search configuration，不是类型自己理解语言；相关性排序要另外显式调函数；拼写纠错、同义词运营、学习排序，都不在它的职责里。但正因为表示层进了类型系统，好处也跟着来了——它能进表达式索引或者存储生成列，能被 ANALYZE 收集词项统计，能和 tenant_id、状态、时间范围写在同一条 WHERE 里，事务、MVCC、权限、备份恢复全都不用另起一套。代价同样清楚：语言配置、索引维护、排序质量、召回边界，得应用自己验证。定位摆正之后，我们拿一段真文本把这层表示跑一遍。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40.0\" y=\"12.0\" " class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#FFFFFF\" font-weight=\"600\" >tsvector　→　去重排序的 lexeme + 位置 + 权重　★ 本文主角</text><rect x=\"40.0\" y=\"262.0\" width=\"1320.0\" height=\"45.0\" rx=\"4\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.0\" /><text x=\"58.0\" y=\"289.8\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#FFFFFF\" font-weight=\"600\" >L2  归一化</text><text x=\"332.0\" y=\"289.1\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#FFFFFF\" font-weight=\"600\" >dictionary　→　token 收敛成 lexeme，停用词在此丢弃</text><rect x=\"40.0\" y=\"312.0\" width=\"1320.0\" height=\"45.0\" rx=\"4\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.0\" /><text x=\"58.0\" y=\"339.8\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#FFFFFF\" font-weight=\"600\" >L1  切分</text><text x=\"332.0\" y=\"339.1\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#FFFFFF\" font-weight=\"600\" >parser　→　原文切成带类型的 token</text><rect x=\"40.0\" y=\"368.0\" width=\"1320.0\" height=\"48.0\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"58.0\" y=\"397.2\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"600\" >核心判断</text><text x=\"236.0\" y=\"396.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >tsvector ＝ 归一化词项集合上的布尔匹配 ＋ 位置/权重排序 ＋ 索引候选回表确认</text></svg>","ctrl":""},{"eyebrow":"实证 · 一句话的旅程","title":"一句话，怎么变成一个 tsvector","lede":"PostgreSQL 18 文档 12.3.1 给了一个能逐字验证的例子；把它拆成四步，比背定义管用得多。","caption":"图 04　依据官方文档 12.3.1 与 8.11.1 的示例。位置是原文 token 序号，停用词被丢弃但位置不重排；动画可换句子、逐步播放。","bridge":"例子跑通了，但里面有六个词特别容易混；先把它们分开，后面讲索引才不会串。","notes":"我们用官方文档 12.3.1 那句原话：a fat cat sat on a mat 横杠 it ate a fat rats。执行 to_tsvector，传 english 配置，结果是 ate 在 9、cat 在 3、fat 在 2 和 11、mat 在 7、rat 在 12、sat 在 4。这个结果里有好几个容易踩空的地方，我们一步步看。第一步，parser 先按 token 切开，还给每个 token 编号；注意标点横杠属于没有字典的符号类型，它被忽略，也不占位置，所以后面 it 是 8、ate 是 9。第二步，english 配置把 a、on、it 这些停用词丢掉——但丢掉之后位置不重排，rat 仍然是 12，不是第 10 个保留词。第三步，dictionary 做小写化和词干化，Rats 变成 rat，Fat 还是 fat。第四步，同一个 lexeme 合并位置数组，再按字典序排序，于是 fat 有了 2 和 11 两个位置。你可以用下面的输入切换第二句 The Fat Rats，官方 8.11.1 给的结果是 fat 在 2、rat 在 3——The 被过滤了，位置却照样留着。这里我想强调一句工程上的话：素材里如果原句少写了几个词，位置编号就对不上；这种例子必须逐字核对，因为整篇文章讲的就是「表示层错了，后面全错」。还有一个约束也在这张图里：配置是显式传进去的，换配置就换结果。例子跑通了，里面有六个词特别容易混，先把它们分开。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><g id=\"animA\"><rect x=\"27.0\" y=\"10.0\" width=\"1346.0\" height=\"40.0\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"41.0\" y=\"35.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" >原文</text><text x=\"92.0\" y=\"35.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"400\" id=\"animARaw\"></text><g class=\"atok\" data-i=\"0\"><rect x=\"27.0\" y=\"62.0\" width=\"98.0\" height=\"62.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"76.0\" y=\"89.0\" class=\"sv mono atoken\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" ></text><text x=\"76.0\" y=\"115.0\" class=\"sv mono apos\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" data-i=\"0\"></text><text x=\"76.0\" y=\"145.0\" class=\"sv akeep\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#2F7A66\" font-weight=\"600\" data-i=\"0\" opacity=\"0\">保留</text><rect x=\"27.0\" y=\"158.0\" width=\"98.0\" height=\"44.0\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"76.0\" y=\"186.0\" class=\"sv mono alex\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"600\" data-i=\"0\" opacity=\"0.3\">—</text></g><g class=\"atok\" data-i=\"1\"><rect x=\"131.0\" y=\"62.0\" width=\"98.0\" height=\"62.0\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"180.0\" y=\"89.0\" class ass=\"sbox\"/><text x=\"1216.0\" y=\"251.0\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" >④ 排序 · 去重 · 位置</text></g><rect x=\"27.0\" y=\"282.0\" width=\"1346.0\" height=\"56.0\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"43.0\" y=\"317.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"600\" >tsvector</text><text x=\"158.0\" y=\"317.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#1B2B33\" font-weight=\"400\" id=\"animARes\">（等待生成）</text><text x=\"27.0\" y=\"362.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" id=\"animANote\"></text><rect x=\"27.0\" y=\"378.0\" width=\"1346.0\" height=\"42.0\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1.0\" /><text x=\"45.0\" y=\"403.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#AE8A3E\" font-weight=\"600\" >位置语义</text><text x=\"213.0\" y=\"403.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >位置是原文 token 序号：停用词被丢弃但位置不重排，标点 - 不占位置，所以 rat 在 12</text></g></svg>","ctrl":"<label>输入 · 句子</label><select id=\"aSent\"><option value=\"0\">官方示例 · a fat cat sat on a mat - it ate a fat rats</option><option value=\"1\">对照 · The Fat Rats</option></select><label>步骤</label><input type=\"range\" id=\"aStep\" min=\"0\" max=\"4\" value=\"0\"><button class=\"btn play\" id=\"aPlay\">▶ 播放</button><button class=\"btn\" id=\"aTick\">单步</button><button class=\"btn\" id=\"aReset\">重置</button><span class=\"out\" id=\"animAOut\"></span>"},{"eyebrow":"辨析 · 六个词","title":"别把 token、lexeme、@@、rank 混成一个东西","lede":"tsvector 本身不做语言理解；tsquery 是查询表达式；@@ 只给布尔；相关性要另算。这四组边界，决定后面每一步怎么推。","caption":"图 05　三组对照。左右两栏不是同义词，也不是同一个阶段；下方一行是判词。","bridge":"词分清了，就能问一个更工程的问题：同一段原文，为什么换一个配置结果就完全不同？","notes":"第一组，token 和 lexeme。token 是 parser 从原文切出来的片段，rats 就是 rats；lexeme 是 dictionary 归一化之后的检索词，rats 变成 rat。官方文档说得很干脆：tsvector 类型本身不做任何词形归一化，它假定你给它的词已经归一化过了。所以你直接把字符串强制转成 tsvector，和走一遍 to_tsvector，得到的根本不是一回事。第二组，tsvector 和 tsquery。前者是文档，存去重排序后的 lexeme，外加可选位置和权重；后者是查询，是一棵由与、或、非、相邻操作符组成的表达式树，还能带权重限制和前缀匹配。一个存文档，一个存问题，两边都得先归一化才对得上。第三组最容易被跳过去，@@ 和 rank。@@ 只回答「匹不匹配」，返回布尔值；ts_rank 和 ts_rank_cd 才回答「有多相关」，返回数值。很多线上搜索质量的问题，根子就在这儿——以为写了 @@ 就等于排序做完了，其实排序那一步压根没发生。这四组边界看着像名词解释，可后面聊索引 recheck、聊权重、聊优化器估算，每一步都要回头用它们。词分清了，就能问一个更工程的问题：同一段原文，为什么换个配置结果就完全不同？","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40.0\" y=\"20.0\" width=\"580.0\" height=\"84.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"330.0\" y=\"54.6\" class=\"sv s\" text-anchor=\"middle\" font-size=\"22.0\" fill=\"#245A6B\" font-weight=\"600\" >token</text><text x=\"330.0\" y=\"78.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >parser 从原文切出的片段</text><line x1=\"620.0\" y1=\"62.0\" x2=\"650.0\" y2=\"62.0\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><rect x=\"650.0\" y=\"42.0\" width=\"100.0\" height=\"40.0\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"700.0\" y=\"66.2\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"600\" >不是同一件事</text><line x1=\"750.0\" y1=\"62.0\" x2=\"780.0\" y2=\"62.0\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><rect x=\"780.0\" y=\"20.0\" width=\"580.0\" height=\"84.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"1070.0\" y=\"54.6\" class=\"sv s\" text-anchor=\"middle\" font-size=\"20.0\" fill=\"#245A6B\" font-weight=\"600\" >lexeme</text><text x=\"1070.0\" y=\"78.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >dictionary 归一化后的检索词</text><text x=\"40.0\" y=\"128.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#89938F\" font-weight=\"400\" >rats 是 token，rat 才是 lexeme；tsvector 里存的是 lexeme</text><rect x=\"40.0\" y=\"148.0\" width=\"580.0\" height=\"84.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"330.0\" y=\"182.6\" class=\"sv s\" text-anchor=\"middle\" font-size=\"22.0\" fill=\"#245A6B\" font-weight=\"600\" >tsvector</text><text x=\"330.0\" y=\"206.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >文档：去重排序的 lexeme + 位置/权重</text><line x1=\"620.0\" y1=\"190.0\" x2=\"650.0\" y2=\"190.0\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><rect x=\"650.0\" y=\"170.0\" width=\"100.0\" height=\"40.0\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"700.0\" y=\"193.5\" class=\"sv s\" text-anchor=\"middle\" font-size=\"10.0\" fill=\"#BE653B\" font-weight=\"600\" >一存文档一存问题</text><line x1=\"750.0\" y1=\"190.0\" x2=\"780.0\" y2=\"190.0\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><rect x=\"780.0\" y=\"148.0\" width=\"580.0\" height=\"84.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"1070.0\" y=\"182.6\" class=\"sv s\" text-anchor=\"middle\" font-size=\"20.0\" fill=\"#245A6B\" font-weight=\"600\" >tsquery</text><text x=\"1070.0\" y=\"206.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >查询：&amp; | ! &lt;-&gt; :* 构成的表达式树</text><text x=\"40.0\" y=\"256.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#89938F\" font-weight=\"400\" >两者都假定词项已归一化，类型本身不做语言理解</text><rect x=\"40.0\" y=\"276.0\" width=\"580.0\" height=\"84.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"330.0\" y=\"310.6\" class=\"sv s\" text-anchor=\"middle\" font-size=\"22.0\" fill=\"#245A6B\" font-weight=\"600\" >@@</text><text x=\"330.0\" y=\"334.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >只回答「是否匹配」，布尔值</text><line x1=\"620.0\" y1=\"318.0\" x2=\"650.0\" y2=\"318.0\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><rect x=\"650.0\" y=\"298.0\" width=\"100.0\" height=\"40.0\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"700.0\" y=\"322.2\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"600\" >匹配不是排序</text><line x1=\"750.0\" y1=\"318.0\" x2=\"780.0\" y2=\"318.0\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><rect x=\"780.0\" y=\"276.0\" width=\"580.0\" height=\"84.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"1070.0\" y=\"310.6\" class=\"sv s\" text-anchor=\"middle\" font-size=\"20.0\" fill=\"#245A6B\" font-weight=\"600\" >ts_rank / ts_rank_cd</text><text x=\"1070.0\" y=\"334.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >回答「有多相关」，数值</text><text x=\"40.0\" y=\"384.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#89938F\" font-weight=\"400\" >相关性排序必须显式调用，不会因为用了 @@ 就自动发生</text></svg>","ctrl":""},{"eyebrow":"原理 · 生成链路","title":"配置决定结果，不是原文决定结果","lede":"to_tsvector(config, document) 在 to_tsany.c 里走 parsetext()，再由 make_tsvector() 排序、合并、保存位置、构造 varlena 值。","caption":"图 06　上排是生成流水线，中排是 make_tsvector() 的四步，下排是同一原文在两种配置下的分叉。","bridge":"表示层的产出既然是一段紧凑字节，那它在内存里到底怎么摆？看懂布局，才知道位置和权重为什么有上限。","notes":"顺着源码往下走一层。to_tsvector 在 src/backend/tsearch/to_tsany.c 里先调 parsetext()，按配置里的 parser 切 token、按 token 类型去查字典链；第一个认出这个 token 的 dictionary 吐出一个或多个 lexeme，没字典认的、或者被判成停用词的，就直接丢掉。然后 make_tsvector() 做四件事：按 lexeme 和位置排序，合并重复词项，为每个词项保存位置数组，最后构造成 TSVectorData 这个 varlena 值。这就解释了一个常被忽略的事实——同一段原文，配置不同，索引里存的内容就不同。english 会做词干化和停用词过滤；中文、日文、混合语言，如果没有合适的 parser 和 dictionary，默认配置通常给不出业务想要的词项，整句可能被当成一个词，也可能切得七零八落。所以多语言系统千万不要依赖会话级的 default_text_search_config：官方文档 12.2.2 说得很明确，表达式索引必须用显式写了配置名的两参数 to_tsvector，因为索引内容不能随会话设置漂移，否则连 dump 和 restore 都没法保证一致。更进一步，文档还给了 to_tsvector(config_name, body) 这种写法，把配置名做成表里的一列，每一行记下自己用的是哪套配置——这其实就回答了「一表里混着英中日文该怎么建模」。配置要显式、NULL 要处理、字段权重要在生成阶段设计好，这三句话是这一页最该带走的。表示层的产出既然是一段紧凑字节，那它在内存里到底怎么摆？","svg":"<svg ass=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"600\" >make_tsvector()</text><text x=\"970.0\" y=\"78.6\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >排序 / 合并 / 位置</text><line x1=\"1090.0\" y1=\"63.0\" x2=\"1114.4\" y2=\"63.0\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><polygon points=\"1120,63 1113,59.15 1113,66.85\" fill=\"#7BA6AF\"/><rect x=\"1120.0\" y=\"24.0\" width=\"240.0\" height=\"78.0\" rx=\"4\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.1\" /><text x=\"1240.0\" y=\"56.1\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#FFFFFF\" font-weight=\"600\" >tsvector</text><text x=\"1240.0\" y=\"78.6\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#CFE0DC\" font-weight=\"400\" >TSVectorData varlena</text><rect x=\"40.0\" y=\"118.0\" width=\"320.0\" height=\"38.0\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"200.0\" y=\"141.6\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" >① 按 lexeme 与位置排序</text><rect x=\"380.0\" y=\"118.0\" width=\"320.0\" height=\"38.0\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"540.0\" y=\"141.6\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" >② 合并重复 lexeme</text><rect x=\"720.0\" y=\"118.0\" width=\"320.0\" height=\"38.0\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"880.0\" y=\"141.6\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" >③ 保存位置数组</text><rect x=\"1060.0\" y=\"118.0\" width=\"320.0\" height=\"38.0\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"1220.0\" y=\"141.6\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" >④ 构造 varlena 值</text><rect x=\"40.0\" y=\"176.0\" width=\"1320.0\" height=\"48.0\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1.0\" /><text x=\"58.0\" y=\"205.1\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#2F7A66\" font-weight=\"600\" >配置 A　english</text><text x=\"276.0\" y=\"204.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >词干化 + 停用词过滤　→　&#x27;ate&#x27;:9 &#x27;cat&#x27;:3 &#x27;fat&#x27;:2,11 &#x27;mat&#x27;:7 &#x27;rat&#x27;:12 &#x27;sat&#x27;:4</text><rect x=\"40.0\" y=\"230.0\" width=\"1320.0\" height=\"48.0\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"58.0\" y=\"259.1\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#BE653B\" font-weight=\"600\" >配置 B　缺中文分词</text><text x=\"276.0\" y=\"258.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >没有合适 parser / dictionary　→　整句被当成一个词项或切错，召回不可用</text><rect x=\"40.0\" y=\"288.0\" width=\"1320.0\" height=\"48.0\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1.0\" /><text x=\"58.0\" y=\"317.1\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#AE8A3E\" font-weight=\"600\" >建模结论</text><text x=\"236.0\" y=\"316.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >多语言把 regconfig 建成字段；表达式索引可写 to_tsvector(config_name, body)</text><text x=\"40.0\" y=\"366.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >源码路径　src/backend/tsearch/to_tsany.c　·　to_tsvector() → parsetext() → make_tsvector()</text><text x=\"40.0\" y=\"396.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >索引里存的是配置作用后的结果，不是原文；会话级 default_text_search_config 不该决定索引内容</text></svg>","ctrl":""},{"eyebrow":"原理 · 物理表示","title":"tsvector 不是原文副本，是一段紧凑字节","lede":"TSVectorData 由 varlena 头、size、WordEntry[]、lexeme 字符串区和可选位置区组成；位宽决定了几个绕不开的硬限制。","caption":"图 07　五段物理剖面出自 src/include/tsearch/ts_type.h；下方三框是位宽与上限，陶橙带是 strip() 的代价。","bridge":"布局看懂了，就该问：数据库拿这段字节和一棵查询表达式树，到底怎么判出「匹配」两个字？","notes":"把 tsvector 剖开看，它不是原文的副本，是一段排好序的紧凑字节。ts_type.h 里写得清清楚楚：先是标准 varlena 头，接着 int32 size 记词项个数，然后是按 tsCompareString() 排好序的 WordEntry 数组，每个词项一个条目；再往后是 lexeme 字符串存储区，字符串不以空字符结尾；如果带位置，还会补一个 npos 和 WordEntryPos 数组。位宽直接带来几个硬限制，值得记一下：WordEntry 里 haspos 占 1 bit、len 占 11 bit、pos 占 20 bit，所以单个 lexeme 最长 2047 字节，也就是约 2KB，词位区偏移最大约 1MB。WordEntryPos 是 16 bit，其中 2 bit 存权重、14 bit 存位置，所以位置值只能到 16383，官方文档说超过会被静默设成 16383，重复位置会被丢弃；源码里 MAXNUMPOS 定成 256，一个词项最多存 256 个位置。这些不是冷知识，长文档里的高频词真的会被截断位置信息。还有个很实用的函数叫 strip，它能把位置和权重全去掉、省空间，但官方文档同时警告：ts_rank_cd 依赖位置信息，会直接忽略 stripped 的词项，如果整个向量都被 strip 过，排序结果就是 0。省空间和排序质量，在这儿是一笔明确的交易。布局看懂了，就该问：数据库拿这段字节和一棵查询表达式树，怎么判出「匹配」两个字？","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"25.0\" y=\"40.0\" width=\"150.0\" height=\"90.0\" rx=\"3\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.0\" /><text x=\"100.0\" y=\"78.0\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#FFFFFF\" font-weight=\"700\" >vl_len_</text><text x=\"100.0\" y=\"106.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#EBF1EE\" font-weight=\"500\" >varlena 头</text><rect x=\"175.0\" y=\"40.0\" width=\"150.0\" height=\"90.0\" rx=\"3\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.0\" /><text x=\"250.0\" y=\"78.0\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#FFFFFF\" font-weight=\"700\" >int32 size</text><text x=\"250.0\" y=\"106.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#EBF1EE\" font-weight=\"500\" >lexeme 个数</text><rect x=\"325.0\" y=\"40.0\" width=\"360.0\" height=\"90.0\" rx=\"3\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1.0\" /><text x=\"505.0\" y=\"78.0\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#FFFFFF\" font-weight=\"700\" >WordEntry[]</text><text x=\"505.0\" y=\"106.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#EBF1EE\" font-weight=\"500\" >按 lexeme 字典序排序</text><rect x=\"685.0\" y=\"40.0\" width=\"420.0\" height=\"90.0\" rx=\"3\" fill=\"#74A5AD\" stroke=\"#74A5AD\" stroke-width=\"1.0\" /><text x=\"895.0\" y=\"78.0\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"700\" >lexeme 存储区</text><text x=\"895.0\" y=\"106.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >字符串不以 \\0 结尾</text><rect x=\"1105.0\" y=\"40.0\" width=\"270.0\" height=\"90.0\" rx=\"3\" fill=\"#A4C4C6\" stroke=\"#A4C4C6\" stroke-width=\"1.0\" /><text x=\"1240.0\" y=\"78.0\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"700\" >npos + WordEntryPos[]</text><text x=\"1240.0\" y=\"106.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >可选：位置与权重</text><rect x=\"25.0\" y=\"190.0\" width=\"426.0\" height=\"118.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"25.0\" y=\"190.0\" width=\"426.0\" height=\"34.0\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"41.0\" y=\"213.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"600\" >WordEntry　32 bit</text><text x=\"41.0\" y=\"248.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >haspos 1 bit · len 11 bit · pos 20 bit</text><text x=\"41.0\" y=\"273.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >MAXSTRLEN 2047 B（≈2 KB）· MAXSTRPOS ≈ 1 MB</text><rect x=\"472.0\" y=\"190.0\" width=\"426.0\" height=\"118.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"472.0\" y=\"190.0\" width=\"426.0\" height=\"34.0\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"488.0\" y=\"213.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"600\" >WordEntryPos　16 bit</text><text x=\"488.0\" y=\"248.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >weight 2 bit ＋ pos 14 bit</text><text x=\"488.0\" y=\"273.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >位置 1–16383，超出截到 16383；重复位置丢弃</text><rect x=\"919.0\" y=\"190.0\" width=\"426.0\" height=\"118.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"919.0\" y=\"190.0\" width=\"426.0\" height=\"34.0\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"935.0\" y=\"213.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"600\" >MAXNUMPOS = 256</text><text x=\"935.0\" y=\"248.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >每个 lexeme 最多保存 256 个位置</text><text x=\"935.0\" y=\"273.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >长文档高频词的位置信息会被截断</text><rect x=\"25.0\" y=\"322.0\" width=\"1350.0\" height=\"46.0\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"43.0\" y=\"350.1\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#BE653B\" font-weight=\"600\" >strip()</text><text x=\"211.0\" y=\"349.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >移除位置与权重可省空间，但 ts_rank_cd 会忽略 stripped lexeme；全部 stripped 时排序结果为 0</text><text x=\"25.0\" y=\"396.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >tsvector 不是原文副本，而是紧凑的检索表示；位置与权重是排序质量的地基（src/include/tsearch/ts_type.h）</text></svg>","ctrl":""},{"eyebrow":"原理 · 匹配语义","title":"@@ 只做布尔判断","lede":"系统目录把 @@ 绑到 ts_match_vq / ts_match_qv，选择率函数是 tsmatchsel；真正的求值发生在 TS_execute() 的表达式树递归里。","caption":"图 08　左侧是 tsquery 表达式树与直角连线，右侧是三个能直接落到实践上的结论。","bridge":"既然匹配只是过滤，那用户输入该交给哪个函数变成 tsquery？四个构造函数的边界完全不一样。","notes":"来看 @@ 内部。系统目录里它绑到 ts_match_vq 和 ts_match_qv，选择率估算交给 tsmatchsel。源码 tsvector_op.c 里，ts_match_vq() 把 tsvector 的 WordEntry 数组和 lexeme 字符串交给 TS_execute()，然后按 tsquery 的表达式树递归求值。这听起来只是实现细节，但它给出三个能直接用在生产上的结论。第一，空 tsquery 不匹配任何行——源码 ts_selfuncs.c 里 tsquerysel() 遇到 size 为 0 直接返回选择率 0，所以搜索框清空时别指望它返回全部文档。第二，像 !foo 这种没有正向必需词的查询，倒排索引很难给出窄候选，因为「不含某个词」几乎覆盖全表，索引优势基本用不上；官方也提到 GIN 对纯否定查询要走全索引扫描。第三，短语查询和带权重限制的查询依赖位置或权重标签，索引往往只能返回 MAYBE，必须回表 recheck。这三条合起来说明一件事：索引返回候选，和「精确匹配」是两回事，recheck 不是异常，是设计里的正常步骤。想清楚这点，线上看到 Rows Removed by Index Recheck 就不会慌。既然匹配只是过滤，那用户输入该交给哪个函数变成 tsquery？四个构造函数的边界完全不一样。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><text x=\"40.0\" y=\"26.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"600\" >tsquery 表达式树　&#x27;fat&#x27; | &#x27;rat&#x27; &amp; !&#x27;cat&#x27;</text><rect x=\"320.0\" y=\"46.0\" width=\"120.0\" height=\"46.0\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"380.0\" y=\"75.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"600\" >&amp;</text><rect x=\"170.0\" y=\"146.0\" width=\"120.0\" height=\"46.0\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"230.0\" y=\"174.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"600\" >|</text><rect x=\"470.0\" y=\"146.0\" width=\"170.0\" height=\"46.0\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"555.0\" y=\"174.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"600\" >!&#x27;cat&#x27;</text><rect x=\"80.0\" y=\"246.0\" width=\"120.0\" height=\"46.0\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"140.0\" y=\"274.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"600\" >&#x27;fat&#x27;</text><rect x=\"260.0\" y=\"246.0\" width=\"120.0\" height=\"46.0\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"320.0\" y=\"274.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"600\" >&#x27;rat&#x27;</text><path d=\"M 380.0 92.0 L 380.0 118.0 L 230.0 118.0 L 230.0 146.0\" fill=\"none\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><path d=\"M 380.0 92.0 L 380.0 118.0 L 555.0 118.0 L 555.0 146.0\" fill=\"none\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><path d=\"M 230.0 192.0 L 230.0 218.0 L 140.0 218.0 L 140.0 246.0\" fill=\"none\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><path d=\"M 230.0 192.0 L 230.0 218.0 L 320.0 218.0 L 320.0 246.0\" fill=\"none\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><text x=\"40.0\" y=\"326.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#89938F\" font-weight=\"400\" >TS_execute() 按表达式树递归求值；WordEntry[] 提供有序 lexeme 查找</text><text x=\"40.0\" y=\"352.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >ts_match_vq() → TS_execute()　·　选择率函数 tsmatchsel()</text><line x1=\"720.0\" y1=\"20.0\" x2=\"720.0\" y2=\"400.0\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><rect x=\"750.0\" y=\"36.0\" width=\"610.0\" height=\"92.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"750.0\" y=\"36.0\" width=\"610.0\" height=\"32.0\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"766.0\" y=\"58.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"600\" >结论 1　空查询</text><text x=\"766.0\" y=\"82.7\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >空 tsquery 不匹配任何行，选择率直接为 0</text><rect x=\"750.0\" y=\"142.0\" width=\"610.0\" height=\"92.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"750.0\" y=\"142.0\" width=\"610.0\" height=\"32.0\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"766.0\" y=\"164.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"600\" >结论 2　纯否定</text><text x=\"766.0\" y=\"188.7\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >!foo 没有正向必需词，倒排候选难以收敛，索引优势有限</text><rect x=\"750.0\" y=\"248.0\" width=\"610.0\" height=\"92.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"750.0\" y=\"248.0\" width=\"610.0\" height=\"32.0\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"766.0\" y=\"270.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"600\" >结论 3　短语 / 权重</text><text x=\"766.0\" y=\"294.7\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >依赖位置信息与权重标签，通常需要回表 recheck</text><rect x=\"750.0\" y=\"356.0\" width=\"610.0\" height=\"48.0\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1.0\" /><text x=\"768.0\" y=\"384.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#AE8A3E\" font-weight=\"600\" >注意</text><text x=\"866.0\" y=\"384.4\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >索引返回候选 ≠ 精确匹配；recheck 不是异常，是设计内步骤</text></svg>","ctrl":""},{"eyebrow":"实践 · 查询构造","title":"用户输入该交给哪个函数","lede":"to_tsquery 认语法，plainto_tsquery 认关键词，phraseto_tsquery 认短语，websearch_to_tsquery 认搜索框；选错不是风格问题，是正确性问题。","caption":"图 09　四种构造函数的输入、输出与边界；底部是搜索框场景的首选。","bridge":"查询怎么来搞清楚了，还有个更大的误会要拆：很多人以为命中的行天然就是按相关度排好的。","notes":"四个函数看着像同义词，其实输入假设完全不同。to_tsquery 最灵活，认与、或、非、相邻、权重和前缀，但前提是输入本来就按 tsquery 语法组织好；把它直接接到普通搜索框，用户输入一个括号或者一个怪符号，轻则报错，重则悄悄改变了查询语义。plainto_tsquery 把输入当普通关键词，不认操作符，一般用 &amp; 连起来，安全但表达不了短语和否定。phraseto_tsquery 专门表达短语，用相邻操作符把词串起来。websearch_to_tsquery 最贴近真实搜索框：支持引号短语、支持减号排除、支持 or，而且官方文档 12.3.2 特别说明，它和 plain、phrase 一样，不识别 tsquery 操作符、权重标签和前缀匹配标签，所以普通用户乱敲一通也不容易让它崩。文档里那个例子很能说明问题：喂给它一堆括号、反斜杠、引号和相邻符号，它最后安安静静输出了两个词项。结论就很朴素了：搜索框用 websearch_to_tsquery 或 plainto_tsquery，别把 to_tsquery 的语法暴露给终端用户；真需要复杂表达式，那应该是后端按业务规则自己构造，而不是让用户替你写。查询怎么来搞清楚了，还有个更大的误会要拆：很多人以为命中的行天然就是按相关度排好的。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40.0\" y=\"30.0\" width=\"280.0\" height=\"46.0\" rx=\"2\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"54.0\" y=\"57.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"600\" >函数</text><rect x=\"320.0\" y=\"30.0\" width=\"300.0\" height=\"46.0\" rx=\"2\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"334.0\" y=\"57.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"600\" >适合输入</text><rect x=\"620.0\" y=\"30.0\" width=\"400.0\" height=\"46.0\" rx=\"2\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"634.0\" y=\"57.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"600\" >输出形态</text><rect x=\"1020.0\" y=\"30.0\" width=\"340.0\" height=\"46.0\" rx=\"2\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"1034.0\" y=\"57.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"600\" >使用边界</text><rect x=\"40.0\" y=\"76.0\" width=\"280.0\" height=\"62.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"54.0\" y=\"111.8\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.8\" fill=\"#1B2B33\" font-weight=\"600\" >to_tsquery</text><rect x=\"320.0\" y=\"76.0\" width=\"300.0\" height=\"62.0\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"334.0\" y=\"111.8\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.8\" fill=\"#46585F\" font-weight=\"400\" >已按 tsquery 语法组织的输入</text><rect x=\"620.0\" y=\"76.0\" width=\"400.0\" height=\"62.0\" r ont-size=\"14.0\" fill=\"#BE653B\" font-weight=\"600\" >首选</text><text x=\"186.0\" y=\"367.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >搜索框文本优先 websearch_to_tsquery 或 plainto_tsquery；别把 to_tsquery 语法暴露给普通用户</text><text x=\"40.0\" y=\"408.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >官方 12.3.2：websearch_to_tsquery 与 plain / phrase 一样，不识别 tsquery 操作符、权重标签或前缀匹配标签</text></svg>","ctrl":""},{"eyebrow":"原理 · 排序语义","title":"匹配不等于相关","lede":"@@ 只答是否匹配；ts_rank 看频率与权重，ts_rank_cd 看覆盖密度与位置，ts_headline 回原文做摘要——四段职责，一个都不能省。","caption":"图 10　上排是四段职责，中间是默认权重数组的语义与量级，下方是完整向量与 strip 之后的对照。","bridge":"四段职责一旦分开，一次搜索的耗时也就分成了三段；线上优化必须知道慢在哪一段。","notes":"官方文档 12.3.3 开头有句很诚实的话：相关性的概念是模糊的、跟应用强相关，内置排序函数只是例子，你可以自己写、也可以把时间和其它信息混进来。所以别把 ts_rank 当终点。具体看四段职责：@@ 只做过滤；ts_rank 主要按匹配词项的频率、权重和归一化选项算分；ts_rank_cd 用覆盖密度排序，会把匹配词彼此靠得多近算进去，因此它必须要有位置信息，stripped 的词项会被忽略，全 strip 完结果就是 0；ts_headline 更特别，它用的是原始文档而不是 tsvector 摘要，官方明确提醒可能很慢，分页列表里要控制摘要长度和返回条数。再看权重数组，默认值是 0.1、0.2、0.4、1.0，顺序对应 D、C、B、A，D 是默认权重、输出时干脆不显示。也就是说标题打 A、正文打 D，标题里的一个词在排序里天然重十倍——这件事必须在生成阶段用 setweight 设计好，等表示层错了，后面调 SQL 很难补回来。还有个小坑顺带说掉：ts_rank_cd 第三个参数 32，是 rank 除以 rank 加一这个归一化选项，只把分数缩放进 0 到 1，不改变任何排序次序，别把它当成相关性改进。四段职责一旦分开，一次搜索的耗时也就分成了三段。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"21.0\" y=\"24.0\" width=\"320.0\" height=\"88.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"21.0\" y=\"24.0\" width=\"320.0\" height=\"34.0\" rx=\"4\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"37.0\" y=\"47.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#FFFFFF\" font-weight=\"600\" >@@</text><text x=\"37.0\" y=\"78.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >只答是否匹配</text><text x=\"37.0\" y=\"100.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >布尔过滤，不给次序</text><rect x=\"367.0\" y=\"24.0\" width=\"320.0\" height=\"88.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"367.0\" y=\"24.0\" width=\"320.0\" height=\"34.0\" rx=\"4\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"383.0\" y=\"47.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#FFFFFF\" font-weight=\"600\" >ts_rank</text><text x=\"383.0\" y=\"78.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >频率 + 权重</text><text x=\"383.0\" y=\"100.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >可选长度归一化选项</text><rect x=\"713.0\" y=\"24.0\" width=\"320.0\" height=\"88.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"713.0\" y=\"24.0\" width=\"320.0\" height=\"34.0\" rx=\"4\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"729.0\" y=\"47.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#FFFFFF\" font-weight=\"600\" >ts_rank_cd</text><text x=\"729.0\" y=\"78.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >覆盖密度排序</text><text x=\"729.0\" y=\"100.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >依赖位置信息</text><rect x=\"1059.0\" y=\"24.0\" width=\"320.0\" height=\"88.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"1059.0\" y=\"24.0\" width=\"320.0\" height=\"34.0\" rx=\"4\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"1075.0\" y=\"47.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#FFFFFF\" font-weight=\"600\" >ts_headline</text><text x=\"1075.0\" y=\"78.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >回原文生成摘要</text><text x=\"1075.0\" y=\"100.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >可能消耗 CPU</text><text x=\"40.0\" y=\"146.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"600\" >默认权重数组　{0.1, 0.2, 0.4, 1.0}　按 {D, C, B, A} 顺序</text><rect x=\"40.0\" y=\"158.0\" width=\"310.0\" height=\"56.0\" rx=\"4\" fill=\"#EBF1EE\" stroke=\"#EBF1EE\" stroke-width=\"1.0\" /><text x=\"56.0\" y=\"193.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#1B2B33\" font-weight=\"600\" >D　0.1</text><text x=\"334.0\" y=\"193.0\" class=\"sv s\" text-anchor=\"end\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >正文</text><rect x=\"370.0\" y=\"158.0\" width=\"310.0\" height=\"56.0\" rx=\"4\" fill=\"#A4C4C6\" stroke=\"#A4C4C6\" stroke-width=\"1.0\" /><text x=\"386.0\" y=\"193.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#1B2B33\" font-weight=\"600\" >C　0.2</text><text x=\"664.0\" y=\"193.0\" class=\"sv s\" text-anchor=\"end\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >次要</text><rect x=\"700.0\" y=\"158.0\" width=\"310.0\" height=\"56.0\" rx=\"4\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1.0\" /><text x=\"716.0\" y=\"193.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#FFFFFF\" font-weight=\"600\" >B　0.4</text><text x=\"994.0\" y=\"193.0\" class=\"sv s\" text-anchor=\"end\" font-size=\"13.0\" fill=\"#CFE0DC\" font-weight=\"400\" >摘要</text><rect x=\"1030.0\" y=\"158.0\" width=\"310.0\" height=\"56.0\" rx=\"4\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.0\" /><text x=\"1046.0\" y=\"193.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#FFFFFF\" font-weight=\"600\" >A　1.0</text><text x=\"1324.0\" y=\"193.0\" class=\"sv s\" text-anchor=\"end\" font-size=\"13.0\" fill=\"#CFE0DC\" font-weight=\"400\" >标题</text><text x=\"40.0\" y=\"234.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >D 是默认权重，输出时不显示；setweight() 要在生成阶段打标签，后期只调 SQL 补不回来</text><rect x=\"40.0\" y=\"248.0\" width=\"1320.0\" height=\"44.0\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1.0\" /><text x=\"58.0\" y=\"274.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#2F7A66\" font-weight=\"600\" >完整 tsvector</text><text x=\"296.0\" y=\"274.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >保留位置与权重　→　ts_rank_cd 可用，短语与邻近排序有意义</text><rect x=\"40.0\" y=\"298.0\" width=\"1320.0\" height=\"44.0\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"58.0\" y=\"324.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"600\" >strip(tsvector)</text><text x=\"296.0\" y=\"324.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >省空间，但 stripped lexeme 被 ts_rank_cd 忽略；全部 stripped 时排序结果为 0</text><rect x=\"40.0\" y=\"350.0\" width=\"1320.0\" height=\"46.0\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1.0\" /><text x=\"58.0\" y=\"377.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#AE8A3E\" font-weight=\"600\" >normalization 32</text><text x=\"316.0\" y=\"377.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >rank / (rank + 1)：只把分数缩放进 0..1，不改变排序次序，不是相关性改进</text><text x=\"40.0\" y=\"416.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >ts_headline 使用原始文档而非 tsvector 摘要，分页列表要控制摘要长度与返回条数</text></svg>","ctrl":""},{"eyebrow":"原理 · 执行路径","title":"一次搜索，其实有三段耗时","lede":"索引只减少候选行；精确匹配、排序和摘要仍要看 tsvector 或原文。把三段分开量，才知道该调哪里。","caption":"图 11　三段执行路径；输入框可切换查询形态，播放后逐段点亮「正常 / 变重 / 退化」，均为定性示意，不含实测数字。","bridge":"三段里第一段由索引决定。那 PostgreSQL 给全文检索准备的两种索引，结构差在哪儿？","notes":"把一条搜索 SQL 摊成三段，很多「明明建了 GIN 怎么还慢」的问题立刻就有答案了。第一段是候选召回：GIN 或 GiST 给出候选 TID，索引的本事全在缩小范围。第二段是回表 recheck：要过 MVCC 可见性，要做精确的 @@，遇到权重限制、短语、GiST 误判，还得回到堆表里确认。第三段是 rank 和 headline：排序在候选集上算，摘要要回原文重新解析，可能吃掉不少 CPU。所以慢的原因完全不同——可能是候选太多，可能是回表太多，可能是 rank 太重，也可能是 headline 太重，甚至可能是统计信息太旧导致优化器选错了路径。下面这个演示可以切换查询形态，播放之后逐段看哪里变重：多词 AND 是常规路径；纯否定查询第一段就退化；短语或带权重会把压力推到 recheck；大结果集加摘要则把压力推到第三段。这里所有标记都是定性示意，不代表任何实测统计数值，目的是建立一个分段归因的习惯。执行计划里对应的观察点也很具体：Rows Removed by Index Recheck 是不是异常，heap blocks 和 buffer 命中是不是说明回表过多，排序到底是在候选集上做还是全表做。三段里第一段由索引决定，那两种索引结构差在哪儿？","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><g id=\"animB\"><g class=\"bseg\" data-s=\"1\" data-w=\"1\"><rect x=\"50.0\" y=\"40.0\" width=\"410.0\" height=\"150.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" class=\"sbox\"/><rect x=\"50.0\" y=\"40.0\" width=\"410.0\" height=\"38.0\" rx=\"4\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"68.0\" y=\"66.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#FFFFFF\" font-weight=\"600\" >① 候选召回</text><text x=\"68.0\" y=\"106.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >GIN / GiST 给出候选 TID</text><text x=\"68.0\" y=\"134.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >索引只负责缩小范围</text><text x=\"406.0\" y=\"172.0\" class=\"sv btag\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#2F7A66\" font-weight=\"600\" opacity=\"0\">正常</text></g><line x1=\"460.0\" y1=\"115.0\" x2=\"488.6\" y2=\"115.0\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><polygon points=\"495,115 487,110.6 487,119.4\" fill=\"#7BA6AF\"/><g class=\"bseg\" data-s=\"2\" data-w=\"2\"><rect x=\"495.0\" y=\"40.0\" width=\"410.0\" height=\"150.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" class=\"sbox\"/><rect x=\"495.0\" y=\"40.0\" width=\"410.0\" height=\"38.0\" rx=\"4\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"513.0\" y=\"66.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#FFFFFF\" font-weight=\"600\" >② 回表 recheck</text><text x=\"513.0\" y=\"106.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >MVCC 可见性 + 精确 @@</text><text x=\"513.0\" y=\"134.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >权重 / 短语在此确认</text><text x=\"851.0\" y=\"172.0\" class=\"sv btag\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#2F7A66\" font-weight=\"600\" opacity=\"0\">正常</text></g><line x1=\"905.0\" y1=\"115.0\" x2=\"933.6\" y2=\"115.0\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><polygon points=\"940,115 932,110.6 932,119.4\" fill=\"#7BA6AF\"/><g class=\"bseg\" data-s=\"3\" data-w=\"3\"><rect x=\"940.0\" y=\"40.0\" width=\"410.0\" height=\"150.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" class=\"sbox\"/><rect x=\"940.0\" y=\"40.0\" width=\"410.0\" height=\"38.0\" rx=\"4\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"958.0\" y=\"66.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#FFFFFF\" font-weight=\"600\" >③ rank / headline</text><text x=\"958.0\" y=\"106.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >tsvector 排序 + 原文摘要</text><text x=\"958.0\" y=\"134.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >CPU 与回原文开销</text><text x=\"1296.0\" y=\"172.0\" class=\"sv btag\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#2F7A66\" font-weight=\"600\" opacity=\"0\">正常</text></g><rect x=\"50.0\" y=\"210.0\" width=\"1300.0\" height=\"44.0\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1.0\" /><text x=\"68.0\" y=\"236.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#AE8A3E\" font-weight=\"600\" >线上优化</text><text x=\"246.0\" y=\"236.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >把一次查询拆成三段量耗时：候选召回 · 回表 recheck · rank / headline</text><rect x=\"50.0\" y=\"268.0\" width=\"420.0\" height=\"44.0\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"260.0\" y=\"294.6\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" >Rows Removed by Index Recheck</text><rect x=\"490.0\" y=\"268.0\" width=\"420.0\" height=\"44.0\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"700.0\" y=\"294.6\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" >heap blocks / buffer 命中</text><rect x=\"930.0\" y=\"268.0\" width=\"420.0\" height=\"44.0\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"1140.0\" y=\"294.6\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" >排序是否只在候选集上</text><rect x=\"50.0\" y=\"330.0\" width=\"1300.0\" height=\"48.0\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"68.0\" y=\"358.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"600\" >结论</text><text x=\"196.0\" y=\"358.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >索引只能减少候选行；精确匹配、排序和摘要仍要看 tsvector 或原文</text><text x=\"50.0\" y=\"406.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >图中「变重 / 退化」为定性示意，不代表任何实测统计数值</text></g></svg>","ctrl":"<label>输入 · 查询形态</label><select id=\"bQuery\"><option value=\"0\">多词 AND</option><option value=\"1\">纯否定 !foo</option><option value=\"2\">短语 / 带权重</option><option value=\"3\">空 tsquery</option><option value=\"4\">大结果集 + 摘要</option></select><label>段</label><input type=\"range\" id=\"bStep\" min=\"0\" max=\"3\" value=\"0\"><button class=\"btn play\" id=\"bPlay\">▶ 播放</button><button class=\"btn\" id=\"bTick\">单步</button><button class=\"btn\" id=\"bReset\">重置</button><span class=\"out\" id=\"animBOut\"></span>"},{"eyebrow":"索引 · GIN","title":"GIN 把 lexeme 变成倒排表","lede":"官方 12.9 明确：GIN 是全文检索的首选索引类型，每个词项一个索引项，后面挂压缩的 posting list。","caption":"图 12　左侧是倒排结构示意，右侧是 tsginidx.c 里三个关键支持函数以及 recheck 的由来。","bridge":"倒排表读起来快，可它写起来天然贵；GIN 用一个很巧的缓冲结构把写入代价挪走了，代价也跟着挪走了。","notes":"官方文档 12.9 第一句就给了结论：GIN 是首选的全文检索索引类型。它的结构很直观——每个 lexeme 一个 key，后面挂一条压缩的 posting list，里面是出现过这个词的行的 TID。同一个词只存一次，同一行会出现在多条 posting list 里，所以多词查询可以先找到第一个词的匹配，再用索引把缺了其它词的行剔掉，效率很高。源码 tsginidx.c 里对应三个支持函数：gin_extract_tsvector() 从 tsvector 里把每个 lexeme 抽成 GIN key；gin_extract_tsquery() 从 tsquery 里抽查询 operand，遇到前缀匹配就设 partial match；gin_tsquery_consistent() 和三值版本用三值逻辑判断候选，遇到权重或者需要位置信息的情况会返回 MAYBE，要求回表 recheck。这里有一条必须记住的官方说明：GIN 只存词项，不存权重标签。所以一个带权重限制的查询，索引没法单独判准，回表是必然的，不是 bug。很多人看到执行计划里有 Recheck 就紧张，其实那是这套结构的设计内步骤。倒排表读起来快，可它写起来天然贵：一行文档可能带出几十上百个词项，也就意味着几十上百次索引插入。GIN 用一个很巧的缓冲结构把这笔代价挪走了，代价也跟着一起挪走了。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40.0\" y=\"30.0\" width=\"700.0\" height=\"340.0\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"60.0\" y=\"60.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" >GIN：每个 lexeme 一个 key，后面挂压缩 posting list</text><rect x=\"60.0\" y=\"84.0\" width=\"210.0\" height=\"50.0\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.1\" /><text x=\"165.0\" y=\"113.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"600\" >lexeme=search</text><line x1=\"270.0\" y1=\"109.0\" x2=\"304.4\" y2=\"109.0\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><polygon points=\"310,109 303,105.15 303,112.85\" fill=\"#7BA6AF\"/><rect x=\"310.0\" y=\"84.0\" width=\"400.0\" height=\"50.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"510.0\" y=\"102.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"600\" >posting list</text><text x=\"510.0\" y=\"124.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >TID 12 · 37 · 88 · 140</text><rect x=\"60.0\" y=\"150.0\" width=\"210.0\" height=\"50.0\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.1\" /><text x=\"165.0\" y=\"179.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"600\" >lexeme=cat</text><line x1=\"270.0\" y1=\"175.0\" x2=\"304.4\" y2=\"175.0\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><polygon points=\"310,175 303,171.15 303,178.85\" fill=\"#7BA6AF\"/><rect x=\"310.0\" y=\"150.0\" width=\"400.0\" height=\"50.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"510.0\" y=\"168.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"600\" >posting list</text><text x=\"510.0\" y=\"190.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >TID 12 · 65</text><rect x=\"60.0\" y=\"216.0\" width=\"210.0\" height=\"50.0\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.1\" /><text x=\"165.0\" y=\"245.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"600\" >lexeme=fat</text><line x1=\"270.0\" y1=\"241.0\" x2=\"304.4\" y2=\"241.0\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><polygon points=\"310,241 303,237.15 303,244.85\" fill=\"#7BA6AF\"/><rect x=\"310.0\" y=\"216.0\" width=\"400.0\" height=\"50.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"510.0\" y=\"234.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"600\" >posting list</text><text x=\"510.0\" y=\"256.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >TID 12 · 37 · 203</text><rect x=\"60.0\" y=\"282.0\" width=\"210.0\" height=\"50.0\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.1\" /><text x=\"165.0\" y=\"311.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"600\" >lexeme=rat</text><line x1=\"270.0\" y1=\"307.0\" x2=\"304.4\" y2=\"307.0\" stroke=\"#7BA6AF\" stroke-width=\"1.6\"/><polygon points=\"310,307 303,303.15 303,310.85\" fill=\"#7BA6AF\"/><rect x=\"310.0\" y=\"282.0\" width=\"400.0\" height=\"50.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"510.0\" y=\"300.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"600\" >posting list</text><text x=\"510.0\" y=\"322.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >TID 88 · 203</text><text x=\"60.0\" y=\"350.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >同一行会出现在多个 posting list 里；每个 key 只存一次，所以索引紧凑</text><text x=\"770.0\" y=\"44.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" >GIN 支持函数与 recheck</text><rect x=\"770.0\" y=\"64.0\" width=\"590.0\" height=\"84.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"786.0\" y=\"92.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"600\" >gin_extract_tsvector()</text><text x=\"786.0\" y=\"108.5\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >从 tsvector 抽每个 lexeme 作为 GIN key</text><rect x=\"770.0\" y=\"160.0\" width=\"590.0\" height=\"84.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"786.0\" y=\"188.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"600\" >gin_extract_tsquery()</text><text x=\"786.0\" y=\"204.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >从 tsquery 抽 operand；前缀匹配设 partial match</text><rect x=\"770.0\" y=\"256.0\" width=\"590.0\" height=\"84.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"786.0\" y=\"284.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"600\" >gin_tsquery_consistent()</text><text x=\"786.0\" y=\"300.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >三值逻辑判断候选；权重 / 短语 → MAYBE → recheck</text><rect x=\"40.0\" y=\"380.0\" width=\"1320.0\" height=\"44.0\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"58.0\" y=\"406.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"600\" >官方 12.9</text><text x=\"226.0\" y=\"406.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >GIN 是全文检索首选类型；只存 lexeme、不存权重标签，涉及权重的查询必须回表 recheck</text></svg>","ctrl":""},{"eyebrow":"索引 · 写入代价","title":"GIN 的快，是拿 pending list 换的","lede":"fastupdate 把新词项先塞进临时的未排序列表，等 VACUUM、autoanalyze、手动清理或超过阈值时再批量并回主结构。","caption":"图 13　依据 gin.html 65.4.4.1 与 65.4.5。播放可观察 pending list 堆积与前台 cleanup；格子数为定性示意。","bridge":"GIN 是精确候选加写入代价，GiST 走的是完全相反的思路：干脆承认自己会误判。","notes":"官方文档 65.4.4.1 把这件事讲得非常透。倒排索引天生写起来慢，因为插入一行可能要给每个词项都插一次索引。GIN 的办法是推迟：新词项先进入一个临时的、未排序的 pending list，等到表被 VACUUM 或 autoanalyze、或者调用 gin_clean_pending_list()、又或者列表超过 gin_pending_list_limit 时，再用和初次建索引一样的批量插入技巧并回主结构。这样写入吞吐大幅提升，而且清理工作常常能由后台进程干，不占前台查询。但文档紧接着列了两个代价，一个都不能略过。第一，搜索时除了查主索引，还得把 pending list 一起扫一遍，列表越大，检索越慢。第二，绝大多数更新都很快，可偏偏触发「列表太大」的那一次更新，要当场做一轮 cleanup，明显比其它更新慢——这就是线上偶尔冒出来的延迟毛刺。官方给的对策也很实在：想让响应时间稳定，可以把 fastupdate 关掉；想避免前台清理，就把阈值调大或者让 autovacuum 更积极，但阈值越大，万一真在前台清理，那一次就更久。批量导入时还有个经典做法：先装载数据，再建 GIN 索引，构建期把 maintenance_work_mem 给足。下面这个演示用格子表示 pending list 的堆积，切到 off 可以看到每次写入都直接维护主结构。请记住格子数只是定性示意，不是真实页数。GIN 是精确候选加写入代价，GiST 走的是完全相反的思路。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><g id=\"animC\"><rect x=\"25.0\" y=\"12.0\" width=\"1350.0\" height=\"38.0\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-wi or=\"middle\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" >gin_clean_pending_list()</text><rect x=\"935.0\" y=\"184.0\" width=\"440.0\" height=\"38.0\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"1155.0\" y=\"207.6\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" >超过 gin_pending_list_limit</text><rect x=\"25.0\" y=\"232.0\" width=\"1350.0\" height=\"58.0\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"43.0\" y=\"266.1\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#BE653B\" font-weight=\"600\" >风险 1　查询</text><text x=\"261.0\" y=\"265.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >搜索必须同时扫描 pending list；堆积越大，检索越慢</text><rect x=\"25.0\" y=\"298.0\" width=\"1350.0\" height=\"58.0\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"43.0\" y=\"332.1\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#BE653B\" font-weight=\"600\" >风险 2　写入</text><text x=\"261.0\" y=\"331.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >触发前台 cleanup 的那次更新会比其它更新慢很多，响应时间出现抖动</text><text x=\"25.0\" y=\"382.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >对策　关 fastupdate 换稳定延迟；批量导入先装载再建 GIN；maintenance_work_mem 给足；让 autovacuum 在后台清理</text><text x=\"25.0\" y=\"408.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >图中格子数为定性示意，不代表真实 pending list 页数或统计数值</text></g></svg>","ctrl":"<label>输入 · fastupdate</label><select id=\"cFast\"><option value=\"1\">on（默认，推迟维护）</option><option value=\"0\">off（每次写入直接维护）</option></select><label>批次</label><input type=\"range\" id=\"cStep\" min=\"0\" max=\"12\" value=\"0\"><button class=\"btn play\" id=\"cPlay\">▶ 播放</button><button class=\"btn\" id=\"cTick\">单步</button><button class=\"btn\" id=\"cReset\">重置</button><span class=\"out\" id=\"animCOut\"></span>"},{"eyebrow":"索引 · GiST","title":"GiST 用签名换空间，误判是设计内代价","lede":"每个词 hash 成 bitset 里的一位，OR 成定长文档签名；不同词撞到同一位就产生 false match，所以索引是 lossy 的。","caption":"图 14　左侧 GIN 的倒排结构，右侧 GiST 的 bitset 签名；底部是取舍判断。","bridge":"两种索引和两条外部路线都摆过之后，我们把四条路放进同一张表，看看平衡点到底在哪儿。","notes":"GiST 的 tsvector_ops 不是倒排表，是签名索引。官方文档 12.9 说：每个文档在索引里被表示成一段固定长度的签名，siglen 默认 124 字节，最大 2024 字节；每个词 hash 到 bitset 的一位，所有位 OR 起来就是这个文档的签名。非叶节点再把子节点的签名做 union，于是查询时它只能证明两件事——「不可能匹配」或者「可能匹配」。两个不同的词撞到同一位，就出现 false match，所以 GiST 是 lossy index，PostgreSQL 会自动回表把误判剔掉，源码 tsgistidx.c 里 gtsvector_consistent() 明明白白把 recheck 设成了 true。这个模型的取舍很清楚：签名越长越精确，扫的索引页和堆页越少，但索引也越大；文档里唯一词越多、签名越短，误判越明显，而误判带来的是随机回表，随机 IO 恰恰最贵。官方甚至建议用字典把唯一词数量压下来。那 GiST 还有什么理由存在？有：它支持 INCLUDE 覆盖列，签名长度可调，某些写入和空间场景有价值，而且 GIN 构建对 maintenance_work_mem 敏感、GiST 不敏感。但对绝大多数常规全文检索，官方那句「GIN 是首选类型」就是默认答案，除非你有明确的 GiST 需求，或者能接受误判回表。两种索引和两条外部路线都摆过之后，把四条路放进同一张表，平衡点才看得清。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40.0\" y=\"30.0\" width=\"620.0\" height=\"320.0\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"60.0\" y=\"60.0\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19.0\" fill=\"#245A6B\" font-weight=\"600\" >GIN　倒排索引</text><text x=\"60.0\" y=\"86.0\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >lexeme → posting list，给出精确候选</text><rect x=\"60.0\" y=\"104.0\" width=\"190.0\" height=\"52.0\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"155.0\" y=\"134.7\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"600\" >lexeme=search</text><line x1=\"250.0\" y1=\"130.0\" x2=\"277.2\" y2=\"130.0\" stroke=\"#7BA6AF\" stroke-width=\"1.5\"/><polygon points=\"282,130 276,126.7 276,133.3\" fill=\"#7BA6AF\"/><rect x=\"282.0\" y=\"104.0\" width=\"350.0\" height=\"52.0\" rx=\"4\"
