><rect x=\"816\" y=\"94\" width=\"250\" height=\"52\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"941.0\" y=\"125.0\" font-size=\"12.5\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\">最强，看引擎</text><rect x=\"1074\" y=\"94\" width=\"250\" height=\"52\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1199.0\" y=\"125.0\" font-size=\"12.5\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\">弱</text><rect x=\"40\" y=\"150\" width=\"260\" height=\"52\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"56\" y=\"181.0\" font-size=\"13.5\" fill=\"#1B2B33\" text-anchor=\"start\" font-weight=\"600\">语义能力</text><rect x=\"300\" y=\"150\" width=\"250\" height=\"52\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"425.0\" y=\"181.0\" font-size=\"12.5\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\">pgvector</text><rect x=\"558\" y=\"150\" width=\"250\" height=\"52\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"683.0\" y=\"181.0\" font-size=\"12.5\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\">pgvector</text><rect x=\"816\" y=\"150\" width=\"250\" height=\"52\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"941.0\" y=\"181.0\" font-size=\"12.5\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\">专用向量库</text><rect x=\"1074\" y=\"150\" width=\"250\" height=\"52\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1199.0\" y=\"181.0\" font-size=\"12.5\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\">强</text><rect x=\"40\" y=\"206\" width=\"260\" height=\"52\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"56\" y=\"237.0\" font-size=\"13.5\" fill=\"#1B2B33\" text-anchor=\"start\" font-weight=\"600\">事务一致性</text><rect x=\"300\" y=\"206\" width=\"250\" height=\"52\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"425.0\" y=\"237.0\" font-size=\"12.5\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\">强</text><rect x=\"558\" y=\"206\" width=\"250\" height=\"52\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"683.0\" y=\"237.0\" font-size=\"12.5\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\">强，索引维护更复杂</text><rect x=\"816\" y=\"206\" width=\"250\" height=\"52\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"941.0\" y=\"237.0\" font-size=\"12.5\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\">弱到中，靠同步</text><rect x=\"1074\" y=\"206\" width=\"250\" height=\"52\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1199.0\" y=\"237.0\" font-size=\"12.5\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\">强（库内）</text><rect x=\"40\" y=\"262\" width=\"260\" height=\"52\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"56\" y=\"293.0\" font-size=\"13.5\" fill=\"#1B2B33\" text-anchor=\"start\" font-weight=\"600\">写入代价</text><rect x=\"300\" y=\"262\" width=\"250\" height=\"52\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"425.0\" y=\"293.0\" font-size=\"12.5\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\">中</text><rect x=\"558\" y=\"262\" width=\"250\" height=\"52\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"683.0\" y=\"293.0\" font-size=\"12.5\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\">中到高</text><rect x=\"816\" y=\"262\" width=\"250\" height=\"52\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"941.0\" y=\"293.0\" font-size=\"12.5\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\">高，双写同步</text><rect x=\"1074\" y=\"262\" width=\"250\" height=\"52\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1199.0\" y=\"293.0\" font-size=\"12.5\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\">中</text><rect x=\"40\" y=\"318\" width=\"260\" height=\"52\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"56\" y=\"349.0\" font-size=\"13.5\" fill=\"#1B2B33\" text-anchor=\"start\" font-weight=\"600\">适合场景</text><rect x=\"300\" y=\"318\" width=\"250\" height=\"52\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"425.0\" y=\"349.0\" font-size=\"12.5\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\">轻中量强一致</text><rect x=\"558\" y=\"318\" width=\"250\" height=\"52\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"683.0\" y=\"349.0\" font-size=\"12.5\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\">中等规模留 PG</text><rect x=\"816\" y=\"318\" width=\"250\" height=\"52\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"941.0\" y=\"349.0\" font-size=\"12.5\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\">超大规模平台</text><rect x=\"1074\" y=\"318\" width=\"250\" height=\"52\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1199.0\" y=\"349.0\" font-size=\"12.5\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\">FAQ / 推荐</text><text x=\"40\" y=\"412\" font-size=\"14.5\" fill=\"#245A6B\" text-anchor=\"start\" font-weight=\"600\">关键不是谁替代谁，而是复杂度放在数据库节点，还是放在一条长长的同步链路。</text></svg>", "ctrl": null}, {"eyebrow": "验证 · 效果怎么看", "title": "「点一下有结果」不算效果，四类指标才算", "lede": "召回质量、延迟与 IO、写入与维护、业务可解释性。数据库告诉你慢在哪，标注集和日志才告诉你好不好。", "caption": "图 14　四类指标：召回、延迟、写入、可解释；右上用 EXPLAIN 看执行，四角合起来才是「效果」。", "bridge": "保留调试字段，运营、客服、研发才能一起判断「为什么这个结果排在前面」。", "notes": "上线之后怎么知道它好不好？「点一下有结果」根本不算效果，至少看四类指标。召回质量：recall@K 看 TopK 覆盖了多少相关结果，NDCG@K 看相关的是不是排得更靠前，还有一个特别实用的坏例归因——到底是分词没切对、字段权重错了、embedding 模型差、候选集太小，还是融合参数不对。延迟和 IO：拿 EXPLAIN ANALYZE BUFFERS 去看两个分支有没有被限制在合理 TopN，有没有大范围回表、排序 spill、过滤后候选不足。写入和维护：文档写入的 P95/P99、索引大小增长、VACUUM 和 merge 的耗时。业务可解释性：结果里要留下来自哪个分支、各自的名次、RRF 分、命中字段和模型版本。数据库只能告诉你慢在哪，标注集和这些日志才告诉你好不好。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"40\" y=\"36\" width=\"640\" height=\"180\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"40\" y=\"36\" width=\"640\" height=\"44\" rx=\"0\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"0\"/><text x=\"60\" y=\"66\" font-size=\"17\" fill=\"#FFFFFF\" text-anchor=\"start\" font-weight=\"600\" class=\"serif\">召回质量</text><text x=\"62\" y=\"114\" font-size=\"14\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">recall@K：TopK 覆盖多少相关结果</text><text x=\"62\" y=\"144\" font-size=\"14\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">NDCG@K：相关的是否排得更靠前</text><text x=\"62\" y=\"174\" font-size=\"14\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">坏例归因：分词 / 权重 / 模型 / 候选 / 融合</text><rect x=\"720\" y=\"36\" width=\"640\" height=\"180\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"720\" y=\"36\" width=\"640\" height=\"44\" rx=\"0\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"0\"/><text x=\"740\" y=\"66\" font-size=\"17\" fill=\"#FFFFFF\" text-anchor=\"start\" font-weight=\"600\" class=\"serif\">延迟与 IO</text><text x=\"742\" y=\"114\" font-size=\"14\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">EXPLAIN (ANALYZE, BUFFERS)</text><text x=\"742\" y=\"144\" font-size=\"14\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">两分支是否限制在合理 TopN</text><text x=\"742\" y=\"174\" font-size=\"14\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">看回表、排序 spill、过滤后剩余</text><rect x=\"40\" y=\"238\" width=\"640\" height=\"180\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"40\" y=\"238\" width=\"640\" height=\"44\" rx=\"0\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"0\"/><text x=\"60\" y=\"268\" font-size=\"17\" fill=\"#FFFFFF\" text-anchor=\"start\" font-weight=\"600\" class=\"serif\">写入与维护</text><text x=\"62\" y=\"316\" font-size=\"14\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">文档写入 P95 / P99</text><text x=\"62\" y=\"346\" font-size=\"14\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">索引大小增长</text><text x=\"62\" y=\"376\" font-size=\"14\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">VACUUM · REINDEX · segment merge</text><rect x=\"720\" y=\"238\" width=\"640\" height=\"180\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"720\" y=\"238\" width=\"640\" height=\"44\" rx=\"0\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"0\"/><text x=\"740\" y=\"268\" font-size=\"17\" fill=\"#FFFFFF\" text-anchor=\"start\" font-weight=\"600\" class=\"serif\">业务可解释性</text><text x=\"742\" y=\"316\" font-size=\"14\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">来自哪个分支 · BM25 rank</text><text x=\"742\" y=\"346\" font-size=\"14\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">vector rank · RRF 分 · 命中字段</text><text x=\"742\" y=\"376\" font-size=\"14\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">snippet / highlight · 模型版本</text><text x=\"40\" y=\"432\" font-size=\"13.5\" fill=\"#89938F\" text-anchor=\"start\" font-weight=\"400\">数据库只能告诉你慢在哪；标注集与这些日志，才告诉你好不好。</text></svg>", "ctrl": null}, {"eyebrow": "实践 · 上线不是终点", "title": "建完索引只是第二步，后面是个闭环", "lede": "建索引 → 离线评测 → 在线观测 → 维护索引 → 持续演进，再回到评测。坏例喂回参数，质量才可控。", "caption": "图 15　运维闭环：五步围成一圈，坏例沿左侧回到评测；所有连线均为直角，不穿过文字。", "bridge": "搜索不是一个写完就扔的功能，它是一个需要持续喂养的系统。", "notes": "最后把它串成一个闭环。建完索引只是第二步——注意是第二步，不是终点。往后是离线评测：拿标注集调候选集大小、k 值和字段权重；再往上是在线观测：慢查询样本和搜索质量样本一起留，把数据库的慢点和应用的坏例打通；然后是维护：VACUUM、REINDEX、segment merge、重嵌入时的版本切换都要有预算；再往后是演进：坏例攒够了，才引入同义词、业务权重、cross-encoder 或学习排序。然后回到评测，重新来一轮。你看这条路是闭合的：每一次参数调整都必须能被评测验证，每一个坏例都要能追溯到某一层。搜索不是一个写完就扔的功能，它是一个需要持续喂养的系统。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"40\" y=\"40\" width=\"400\" height=\"110\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"40\" y=\"40\" width=\"400\" height=\"6\" rx=\"0\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"0\"/><text x=\"60\" y=\"80\" font-size=\"18\" fill=\"#47808D\" text-anchor=\"start\" font-weight=\"700\" class=\"serif\">建索引</text><text x=\"60\" y=\"108\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">BM25 + HNSW / IVFFlat</text><text x=\"60\" y=\"132\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">ANALYZE · 留写入预算</text><rect x=\"500\" y=\"40\" width=\"400\" height=\"110\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"500\" y=\"40\" width=\"400\" height=\"6\" rx=\"0\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"0\"/><text x=\"520\" y=\"80\" font-size=\"18\" fill=\"#2E6373\" text-anchor=\"start\" font-weight=\"700\" class=\"serif\">离线评测</text><text x=\"520\" y=\"108\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">标注集调候选集 / k / 权重</text><text x=\"520\" y=\"132\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">recall@K · NDCG@K</text><rect x=\"960\" y=\"40\" width=\"400\" height=\"110\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"960\" y=\"40\" width=\"400\" height=\"6\" rx=\"0\" fill=\"#74A5AD\" stroke=\"#74A5AD\" stroke-width=\"0\"/><text x=\"980\" y=\"80\" font-size=\"18\" fill=\"#74A5AD\" text-anchor=\"start\" font-weight=\"700\" class=\"serif\">在线观测</text><text x=\"980\" y=\"108\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">慢查询 + 搜索质量样本</text><text x=\"980\" y=\"132\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">EXPLAIN · 分支候选数</text><rect x=\"960\" y=\"270\" width=\"400\" height=\"110\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"960\" y=\"270\" width=\"400\" height=\"6\" rx=\"0\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"0\"/><text x=\"980\" y=\"310\" font-size=\"18\" fill=\"#BE653B\" text-anchor=\"start\" font-weight=\"700\" class=\"serif\">持续演进</text><text x=\"980\" y=\"338\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">坏例够了再上同义词 / 重排</text><text x=\"980\" y=\"362\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">学习排序</text><rect x=\"500\" y=\"270\" width=\"400\" height=\"110\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"500\" y=\"270\" width=\"400\" height=\"6\" rx=\"0\" fill=\"#AE8A3E\" stroke=\"#AE8A3E\" stroke-width=\"0\"/><text x=\"520\" y=\"310\" font-size=\"18\" fill=\"#AE8A3E\" text-anchor=\"start\" font-weight=\"700\" class=\"serif\">维护索引</text><text x=\"520\" y=\"338\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">VACUUM · REINDEX · merge</text><text x=\"520\" y=\"362\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">重嵌入版本切换</text><line x1=\"440\" y1=\"95\" x2=\"490\" y2=\"95\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"491,88 498,95 491,102\" fill=\"#245A6B\"/><line x1=\"900\" y1=\"95\" x2=\"950\" y2=\"95\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"951,88 958,95 951,102\" fill=\"#245A6B\"/><polyline points=\"1160,150 1160,210 1160,268\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"1153,263 1160,270 1167,263\" fill=\"#245A6B\"/><line x1=\"910\" y1=\"325\" x2=\"958\" y2=\"325\" stroke=\"#BE653B\" stroke-width=\"1.8\"/><polygon points=\"909,318 902,325 909,332\" fill=\"#BE653B\"/><line x1=\"450\" y1=\"325\" x2=\"498\" y2=\"325\" stroke=\"#BE653B\" stroke-width=\"1.8\"/><polygon points=\"449,318 442,325 449,332\" fill=\"#BE653B\"/><polyline points=\"300,380 300,220 300,152\" fill=\"none\" stroke=\"#BE653B\" stroke-width=\"1.8\"/><polygon points=\"293,157 300,150 307,157\" fill=\"#BE653B\"/><text x=\"700\" y=\"220\" font-size=\"17\" fill=\"#245A6B\" text-anchor=\"middle\" font-weight=\"600\" class=\"serif\">闭环：坏例喂回参数，每次调整都要被评测验证</text></svg>", "ctrl": null}, {"eyebrow": "实践 · 分层与角色", "title": "五层演进，三视角各守一段", "lede": "召回→融合→重排→展示→评测，第一版只做 TopN+RRF；坏例攒够了再上权重和重排。架构师、DBA、开发者各守一段。", "caption": "图 16　五级台阶：前两级先跑起来，后三级随坏例积累逐级加；底部一行是三个角色各自守的那一段。", "bridge": "先把召回、融合、重排、展示、评测这五层的边界画对，再谈参数。", "notes": "如果把前面的建议压成一张路线图，就是这五级台阶。第一级，召回：BM25 TopN 加向量 TopN。第二级，融合：先用 RRF，别急着调分数。第三级，重排：坏例足够了再上 cross-encoder 或学习排序。第四级，展示：把命中词、片段、来源分支这些解释字段返给前端。第五级，评测：标注集和日志闭环。第一版只做前两级就能跑起来，后面三级是随着坏例积累逐级加的。与此对应，三个角色各守一段：架构师把召回、融合、重排、展示、评测这五层的边界和 embedding 的版本字段设计好；DBA 拿真实数据跑 EXPLAIN，为写入和维护留预算；业务开发者把原始 query、改写 query、query embedding 和过滤条件分开传，接口里带上调试字段，分页要克制。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"40\" y=\"20\" font-size=\"15\" fill=\"#1B2B33\" text-anchor=\"start\" font-weight=\"600\" class=\"serif\">五层演进：第一版只做前两级，后面随坏例逐级加</text><rect x=\"60\" y=\"290\" width=\"240\" height=\"80\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"60\" y=\"290\" width=\"240\" height=\"6\" rx=\"0\" fill=\"#74A5AD\" stroke=\"#74A5AD\" stroke-width=\"0\"/><text x=\"76\" y=\"324\" font-size=\"17\" fill=\"#74A5AD\" text-anchor=\"start\" font-weight=\"700\" class=\"serif\">① 召回</text><text x=\"76\" y=\"350\" font-size=\"12.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">BM25 TopN + 向量 TopN</text><rect x=\"320\" y=\"230\" width=\"240\" height=\"80\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"320\" y=\"230\" width=\"240\" height=\"6\" rx=\"0\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"0\"/><text x=\"336\" y=\"264\" font-size=\"17\" fill=\"#47808D\" text-anchor=\"start\" font-weight=\"700\" class=\"serif\">② 融合</text><text x=\"336\" y=\"290\" font-size=\"12.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">先用 RRF，别急着调分数</text><rect x=\"580\" y=\"170\" width=\"240\" height=\"80\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"580\" y=\"170\" width=\"240\" height=\"6\" rx=\"0\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"0\"/><text x=\"596\" y=\"204\" font-size=\"17\" fill=\"#2E6373\" text-anchor=\"start\" font-weight=\"700\" class=\"serif\">③ 重排</text><text x=\"596\" y=\"230\" font-size=\"12.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">坏例够了再上 cross-encoder</text><rect x=\"840\" y=\"110\" width=\"240\" height=\"80\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"840\" y=\"110\" width=\"240\" height=\"6\" rx=\"0\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"0\"/><text x=\"856\" y=\"144\" font-size=\"17\" fill=\"#2F7A66\" text-anchor=\"start\" font-weight=\"700\" class=\"serif\">④ 展示</text><text x=\"856\" y=\"170\" font-size=\"12.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">命中词 / 片段 / 来源字段</text><rect x=\"1100\" y=\"50\" width=\"240\" height=\"80\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"1100\" y=\"50\" width=\"240\" height=\"6\" rx=\"0\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"0\"/><text x=\"1116\" y=\"84\" font-size=\"17\" fill=\"#245A6B\" text-anchor=\"start\" font-weight=\"700\" class=\"serif\">⑤ 评测</text><text x=\"1116\" y=\"110\" font-size=\"12.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">标注集 + 日志闭环</text><polyline points=\"300,330 318,330 318,270 320,270\" fill=\"none\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><polyline points=\"560,270 578,270 578,210 580,210\" fill=\"none\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><polyline points=\"820,210 838,210 838,150 840,150\" fill=\"none\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><polyline points=\"1080,150 1098,150 1098,90 1100,90\" fill=\"none\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><rect x=\"40\" y=\"388\" width=\"1320\" height=\"38\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"56\" y=\"412\" font-size=\"12.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">三视角：架构师守五层边界与 embedding 版本 · DBA 跑 EXPLAIN 并留维护预算 · 开发者拆开 query / embedding / 过滤并带调试字段。</text></svg>", "ctrl": null}, {"eyebrow": "复盘 · 常见坑", "title": "七个坑，都在「以为不必要」的地方", "lede": "分数相加、候选集太小、过滤后不足、只看查询、模型无版本、无坏例闭环、无一致性边界——每一个都有明确对策。", "caption": "图 17　七个坑与对策：上排四个偏「分数与写入」，下排三个偏「流程与一致性」。", "bridge": "把坑提前摆出来，上线前就能逐条对照，而不是等线上坏例来教你。", "notes": "把常见坑集中说一下，它们几乎都出现在「以为不必要」的地方。分数相加——量纲不同，先 RRF。候选集太小——两个分支各取 Top10 看着快，但相关文档可能在某支排第 30，用 recall@K 找合理大小。过滤后不足——先全表取 TopK 再过滤，最后剩不下几条，加大 ef_search、用迭代扫描或分区。只看查询不看写入——文本和 embedding 同时更新会触发两个索引维护，批量导入和重嵌入都要压测。模型升级没有版本——向量空间一变，新旧向量混在一个索引里，结果就不可解释了。没有坏例闭环——参数调整只能靠感觉。没有一致性边界——embedding 异步生成时，刚写的文档 BM25 能搜到、向量搜不到，这个延迟要么在产品语义里说清，要么用状态字段控制可搜索范围。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"40\" y=\"40\" width=\"310\" height=\"150\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"40\" y=\"40\" width=\"310\" height=\"6\" rx=\"0\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"0\"/><text x=\"58\" y=\"86\" font-size=\"12.5\" fill=\"#BE653B\" text-anchor=\"start\" font-weight=\"600\" class=\"mono\">坑 1</text><text x=\"58\" y=\"122\" font-size=\"19\" fill=\"#1B2B33\" text-anchor=\"start\" font-weight=\"700\" class=\"serif\">分数相加</text><text x=\"58\" y=\"164\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">量纲不同 → 先 RRF</text><rect x=\"370\" y=\"40\" width=\"310\" height=\"150\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"370\" y=\"40\" width=\"310\" height=\"6\" rx=\"0\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"0\"/><text x=\"388\" y=\"86\" font-size=\"12.5\" fill=\"#BE653B\" text-anchor=\"start\" font-weight=\"600\" class=\"mono\">坑 2</text><text x=\"388\" y=\"122\" font-size=\"19\" fill=\"#1B2B33\" text-anchor=\"start\" font-weight=\"700\" class=\"serif\">候选集太小</text><text x=\"388\" const N = D.length;
let cur = 0, autoTimer = null, autoOn = false;
let noteMode = 'off'; // off | here | all
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const pad = n => String(n).padStart(2,'0');

function fit(){
  const vp=$('#viewport');
  const W=vp.clientWidth, H=vp.clientHeight;
  const s=Math.min(W/1600, H/900);
  const st=$('#stage');
  st.style.transform='scale('+s+')';
  st.style.left=((W-1600*s)/2)+'px';
  st.style.top =((H- 900*s)/2)+'px';
}
window.addEventListener('resize', fit);

function render(){
  $('#slides').innerHTML = D.map((d,i)=>
    '<section class="slide" id="s'+i+'">'
    + '<div class="eyebrow"><span class="num">'+pad(i+1)+' / '+pad(N)+'</span>'+d.eyebrow+'</div>'
    + '<h1 class="title">'+d.title+'</h1>'
    + '<div class="lede">'+d.lede+'</div>'
    + '<div class="rule"></div>'
    + '<div class="figwrap">'+d.svg+'</div>'
    + (d.ctrl ? '<div class="ctrls">'+d.ctrl+'</div>' : '<div class="caption">'+d.caption+'</div>')
    + '<div class="bridge"><span class="bk">承接 · NEXT</span>'+d.bridge+'</div>'
    + '<div class="footer"><div class="fbar"><i id="fbar'+i+'"></i></div>'
    + '<span class="fl">数据库筑基课 · 应用实践之混合搜索</span>'
    + '<span class="fr">'+pad(i+1)+' / '+pad(N)+'</span></div>'
    + '</section>').join('');
}

function noteHTML(i){
  const d=D[i];
  return '<section class="note" id="note-'+i+'" data-i="'+i+'">'
    + '<div class="nn">'+pad(i+1)+' / '+pad(N)+' · '+d.eyebrow+'</div>'
    + '<h3>'+d.title+'</h3><p>'+d.notes+'</p>'
    + '<div class="nbridge"><span>承接 · NEXT</span>'+d.bridge+'</div></section>';
}
function renderNotes(){
  const kind=$('#npKind'), title=$('#npTitle'), body=$('#npBody');
  if(noteMode==='here'){
    kind.textContent='本页讲稿 · N'; title.textContent=D[cur].title;
    body.innerHTML=noteHTML(cur);
  }else if(noteMode==='all'){
    kind.textContent='全文讲稿 · T'; title.textContent='完整演说文稿';
    body.innerHTML=D.map((_,i)=>noteHTML(i)).join('');
    setTimeout(()=>scrollNoteCurrent(false),40);
  }
  markCurrentNote();
}
function markCurrentNote(){
  $$('#npBody .note').forEach(n=>n.classList.toggle('current', +n.dataset.i===cur));
}
function scrollNoteCurrent(smooth){
  const el=document.getElementById('note-'+cur), body=$('#npBody');
  if(!el||!body) return;
  const top=el.offsetTop - 10;
  body.scrollTo({top:Math.max(0,top), behavior:smooth?'smooth':'auto'});
  markCurrentNote();
}
function openNotes(mode){
  noteMode=mode;
  document.body.classList.add('notes-on');
  renderNotes();
  fit();
  $('#btnNotes').classList.toggle('act', mode==='here');
  $('#btnAll').classList.toggle('act', mode==='all');
}
function closeNotes(){
  noteMode='off';
  document.body.classList.remove('notes-on');
  $('#btnNotes').classList.remove('act');
  $('#btnAll').classList.remove('act');
  fit();
}
function toggleNotes(mode){
  if(document.body.classList.contains('notes-on') && noteMode===mode) closeNotes();
  else openNotes(mode);
}

function go(i, silent){
  i=Math.max(0,Math.min(N-1,i));
  $$('.slide').forEach((el,k)=>el.classList.toggle('on',k===i));
  cur=i;
  try{localStorage.setItem('hs-slide',String(i));}catch(e){}
  $('.pg').textContent=pad(i+1)+' / '+pad(N);
  $('#track i').style.width=((i+1)/N*100)+'%';
  for(let k=0;k<N;k++){const b=$('#fbar'+k);if(b)b.style.width=(k<=i?100:0)+'%';}
  if(noteMode==='here'){ renderNotes(); }
  else if(noteMode==='all'){ scrollNoteCurrent(true); }
  if(!silent) toast(D[i].eyebrow+' · '+D[i].title);
}
function next(){ if(cur<N-1) go(cur+1); else stopAuto(); }
function prev(){ if(cur>0) go(cur-1); }

function toast(s){
  const t=$('#toast');t.textContent=s;t.classList.add('on');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),1700);
}
function stopAuto(){
  autoOn=false;clearInterval(autoTimer);autoTimer=null;
  $('#btnAuto').textContent='▶ 自动播放';$('#btnAuto').classList.remove('act');
}
function toggleAuto(){
  if(autoOn){stopAuto();toast('已暂停自动播放');return;}
  autoOn=true;$('#btnAuto').textContent='❚❚ 暂停';$('#btnAuto').classList.add('act');
  autoTimer=setInterval(()=>{if(cur<N-1)go(cur+1,true);else stopAuto();},12000);
  toast('自动播放：每 12 秒一页');
}

/* 目录 / 帮助：模态（讲稿不走模态） */
function closePanel(){ $('#veil').classList.remove('on'); }
function showPanel(inner){
  $('#panel').innerHTML='<button class="close" onclick="closePanel()">关闭 ✕</button>'+inner;
  $('#veil').classList.add('on');
}
function toc(){
  showPanel('<h2>目录</h2><div class="psub">点击任意一页跳转 · 共 '+N+' 页</div><div class="grid">'
    +D.map((d,i)=>'<a onclick="jump('+i+')"><span class="gn">'+pad(i+1)+'</span><span class="gt">'+d.title+'</span></a>').join('')+'</div>');
}
function jump(i){ closePanel(); go(i); }
function help(){
  showPanel('<h2>快捷键</h2><div class="psub">演说时的操作备忘 · 全屏后底部按键仍可见</div><div class="keys">'
   +'<div><kbd>→ / 空格</kbd>下一页</div><div><kbd>←</kbd>上一页</div>'
   +'<div><kbd>F</kbd>全屏 / 退出</div><div><kbd>G</kbd>目录</div>'
   +'<div><kbd>N</kbd>本页讲稿（右侧开窗，再按关闭）</div><div><kbd>T</kbd>全文讲稿（自动定位当前页）</div>'
   +'<div><kbd>P</kbd>自动播放 / 暂停</div><div><kbd>1–9</kbd>直接跳页</div>'
   +'<div><kbd>Home / End</kbd>首页 / 末页</div><div><kbd>Esc</kbd>关闭面板 / 退出全屏</div>'
   +'<div><kbd>?</kbd>本帮助</div><div><kbd>讲稿开启时翻页</kbd>右侧讲稿联动滚动</div></div>');
}
function fs(){
  const el=document.documentElement;
  const entering=!document.body.classList.contains('immersive');
  if(entering){
    document.body.classList.add('immersive');
    $('#btnFs').textContent='退出全屏 F';
    fit();
    toast('全屏模式：底部按键保持显示（F 或 Esc 退出）');
    try{const pr=el.requestFullscreen?el.requestFullscreen():null;if(pr&&pr.catch)pr.catch(()=>{});}catch(e){}
  }else{
    document.body.classList.remove('immersive');
    $('#btnFs').textContent='全屏 F';
    fit();
    toast('已退出全屏');
    try{if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen();}catch(e){}
  }
}
document.addEventListener('fullscreenchange',()=>{
  if(!document.fullscreenElement && document.body.classList.contains('immersive')){
    document.body.classList.remove('immersive');
    const b=$('#btnFs');if(b)b.textContent='全屏 F';
  }
  fit();
});

document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  const k=e.key;
  const typing=(tag==='input'||tag==='select'||tag==='textarea');
  const navKey=(k.indexOf('Arrow')===0||k===' '||k==='Home'||k==='End'||k==='PageUp'||k==='PageDown');
  if(k==='Escape'){
    if($('#veil').classList.contains('on')){closePanel();return;}
    if(document.body.classList.contains('notes-on')){closeNotes();return;}
    if(document.body.classList.contains('immersive'))fs();
    return;
  }
  if($('#veil').classList.contains('on'))return;
  if(typing&&navKey)return;
  if(k==='ArrowRight'||k===' '||k==='PageDown'){e.preventDefault();next();}
  else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();prev();}
  else if(k==='f'||k==='F'||e.code==='KeyF'){e.preventDefault();fs();}
  else if(k==='g'||k==='G'){e.preventDefault();toc();}
  else if(k==='n'||k==='N'){e.preventDefault();toggleNotes('here');}
  else if(k==='t'||k==='T'){e.preventDefault();toggleNotes('all');}
  else if(k==='p'||k==='P'){e.preventDefault();toggleAuto();}
  else if(k==='?'||k==='h'||k==='H'){e.preventDefault();help();}
  else if(k==='Home'){e.preventDefault();go(0);}
  else if(k==='End'){e.preventDefault();go(N-1);}
  else if(/^[1-9]$/.test(k)){go(parseInt(k,10)-1);}
});

/* ---------- RRF 互动 ---------- */
const RR=[{id:'A',rl:1,rs:3},{id:'B',rl:2,rs:1},{id:'C',rl:null,rs:2}];
let rrStep=0, rrPlaying=false, rrTimer=null;
function rrfData(){
  const k=Math.max(1,parseInt($('#rrfK').value,10)||60);
  return RR.map(d=>{
    const sl=d.rl?1/(k+d.rl):0, ss=d.rs?1/(k+d.rs):0;
    return {...d, sl, ss, total:sl+ss};
  });
}
function rrfPaint(){
  const data=rrfData();
  const max=Math.max(...data.map(d=>d.total))||1;
  data.forEach(d=>{
    const bar=document.getElementById('rrfBar'+d.id);
    const sc=document.getElementById('rrfScore'+d.id);
    const rk=document.getElementById('rrfRank'+d.id);
    if(!bar||!sc||!rk)return;
    let shown;
    if(rrStep===0) shown=0;
    else if(rrStep===1) shown=d.sl;
    else shown=d.total;
    bar.setAttribute('width',(shown/max*880).toFixed(1));
    bar.setAttribute('fill', rrStep===1? '#7BA6AF' : '#245A6B');
    if(rrStep===0){ sc.textContent='—'; rk.textContent='—'; }
    else if(rrStep===1){ sc.textContent=d.sl.toFixed(4); rk.textContent='词法 '+d.sl.toFixed(4); }
    else { sc.textContent=d.total.toFixed(4); rk.textContent=(d.rl||'—')+' / '+(d.rs||'—'); }
  });
  const out=$('#rrfOut'); if(!out)return;
  if(rrStep===0){ out.innerHTML='按「播放」或「单步」：先看词法贡献，再叠加语义贡献并求和。'; }
  else if(rrStep===1){ out.innerHTML='① 词法贡献：1/(k+r<sub>lex</sub>)，未召回记 0。<b>灰条</b>为词法分。'; }
  else if(rrStep===2){ out.innerHTML='② 叠加语义：1/(k+r<sub>sem</sub>)，两者求和得到 RRF 分。'; }
  else {
    const order=[...data].sort((a,b)=>b.total-a.total).map(d=>d.id);
    out.innerHTML='③ 最终 TopK：<b>'+order.join(' &gt; ')+'</b>　（改 k 再播放，观察排序是否变化）';
  }
}
function rrSetStep(n){ rrStep=Math.max(0,Math.min(3,n)); rrfPaint(); }
function rrPlay(){
  if(rrPlaying){ rrPause(); return; }
  rrPlaying=true; $('#rrfPlay').textContent='❚❚ 暂停'; $('#rrfPlay').classList.add('play');
  if(rrStep>=3) rrStep=0;
  rrTimer=setInterval(()=>{ rrStep++; rrfPaint(); if(rrStep>=3) rrPause(); },850);
}
function rrPause(){
  rrPlaying=false; clearInterval(rrTimer); rrTimer=null;
  const b=$('#rrfPlay'); if(b){b.textContent='▶ 播放';b.classList.remove('play');}
}
function rrTick(){ rrSetStep(rrStep>=3?0:rrStep+1); }
function rrReset(){ rrPause(); rrStep=0; rrfPaint(); }

function init(){
  render(); fit();
  requestAnimationFrame(()=>document.body.classList.add('ready'));
  let saved=0;try{saved=parseInt(localStorage.getItem('hs-slide')||'0',10)||0;}catch(e){}
  go(saved,true);
  $('#btnPrev').onclick=prev; $('#btnNext').onclick=next;
  $('#btnToc').onclick=toc;
  $('#btnNotes').onclick=()=>toggleNotes('here');
  $('#btnAll').onclick=()=>toggleNotes('all');
  $('#btnAuto').onclick=toggleAuto; $('#btnFs').onclick=fs; $('#btnHelp').onclick=help;
  $('#npClose').onclick=closeNotes;
  $('#veil').onclick=e=>{if(e.target.id==='veil')closePanel();};
  rrfPaint();
  const k=$('#rrfK'); if(k) k.addEventListener('input',()=>{rrPause();rrStep=2;rrfPaint();});
  const bind=(id,fn)=>{const el=$(id);if(el)el.onclick=fn;};
  bind('#rrfPlay',rrPlay); bind('#rrfTick',rrTick); bind('#rrfReset',rrReset);
}
document.addEventListener('DOMContentLoaded', init);
</script>
