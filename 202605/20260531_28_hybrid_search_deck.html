<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>混合搜索 · 数据库筑基课应用实践｜关键词 × 向量 × 融合</title>
<!-- 单文件交付：所有图均为现场绘制的内联 SVG，无外链图片 / 字体 / 脚本依赖。 -->
<!-- 设计母题：地层剖面 / 工程蓝图；内容按「问题→定位→原理→执行→验证→实践→收尾」推演。 -->
<style>
:root{
  --bg:#F7F6F2;--ink:#1B2B33;--ink2:#46585F;--muted:#89938F;--line:#D9D5CB;
  --primary:#245A6B;--prim-l:#E5EFF0;--prim-m:#7BA6AF;
  --accent:#BE653B;--acc-l:#F7E9DE;--green:#2F7A66;--gold:#AE8A3E;
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --noteW:min(660px,46%);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#E9E7E1}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
#viewport{position:absolute;inset:0 0 58px 0;overflow:hidden}
body.notes-on #viewport{right:var(--noteW)}
#stage{position:absolute;width:1600px;height:900px;background:var(--bg);
  transform-origin:top left;box-shadow:0 18px 60px rgba(27,43,51,.13)}
body.ready #stage{transition:transform .34s cubic-bezier(.2,.7,.2,1),left .34s cubic-bezier(.2,.7,.2,1),top .34s cubic-bezier(.2,.7,.2,1)}
.slide{position:absolute;inset:0;display:none}
.slide.on{display:block;animation:fadein .42s cubic-bezier(.2,.7,.2,1)}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{position:absolute;left:64px;top:44px;font-size:13px;letter-spacing:3.4px;color:var(--primary);font-weight:600}
.eyebrow .num{font-family:var(--mono);letter-spacing:1px;color:var(--accent);margin-right:14px}
h1.title{position:absolute;left:64px;top:70px;margin:0;font-family:var(--serif);font-size:44px;line-height:1.25;font-weight:700;letter-spacing:1.2px;color:var(--ink)}
.lede{position:absolute;left:64px;top:139px;width:1440px;font-size:19px;color:var(--ink2);line-height:1.5;letter-spacing:.3px}
.rule{position:absolute;left:64px;top:181px;width:1472px;height:1px;background:var(--line)}
.figwrap{position:absolute;left:100px;top:198px;width:1400px;height:430px}
svg.figure{display:block;overflow:visible}
svg.figure text{font-family:var(--sans)}
svg.figure text.serif{font-family:var(--serif)}
svg.figure text.mono{font-family:var(--mono)}
.caption{position:absolute;left:100px;top:638px;width:1400px;font-size:13px;color:var(--muted);letter-spacing:.4px}
.bridge{position:absolute;left:64px;top:706px;width:1472px;font-size:20px;color:var(--accent);line-height:1.55;letter-spacing:.4px;padding-left:18px;border-left:3px solid var(--accent);font-family:var(--serif)}
.bridge .bk{font-family:var(--sans);font-size:13px;color:var(--muted);letter-spacing:2px;display:block;margin-bottom:2px}
.footer{position:absolute;left:64px;top:846px;width:1472px;height:1px;background:var(--line)}
.footer .fl{position:absolute;left:0;top:14px;font-size:12.5px;color:var(--muted);letter-spacing:2px}
.footer .fr{position:absolute;right:0;top:12px;font-family:var(--mono);font-size:14px;color:var(--ink2)}
.footer .fbar{position:absolute;left:0;right:0;top:-1px;height:2px;background:transparent}
.footer .fbar i{display:block;height:2px;background:var(--primary);width:0;transition:width .4s ease}
.ctrls{position:absolute;left:100px;top:630px;width:1400px;height:56px;display:flex;align-items:center;gap:12px}
.ctrls label{font-size:13.5px;color:var(--ink2);white-space:nowrap}
.ctrls input[type=number]{font-family:var(--mono);font-size:14px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:4px;padding:5px 8px;width:70px;outline:none}
.ctrls .btn{min-height:30px;padding:5px 14px;border:1px solid var(--primary);border-radius:4px;background:#fff;color:var(--primary);font-size:13.5px;cursor:pointer;font-family:var(--sans)}
.ctrls .btn.play{background:var(--primary);color:#fff}
.ctrls .btn:hover{filter:brightness(.94)}
.ctrls .out{font-size:13.5px;color:var(--ink2);margin-left:auto;min-width:0;flex:1;max-width:620px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrls .out b{color:var(--accent);font-weight:600}
/* 底部控制条：全屏时保持显示 */
.chrome{position:fixed;left:0;right:0;bottom:0;height:58px;background:#FCFBF8;border-top:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 16px;z-index:40;font-size:13px;color:var(--ink2)}
.chrome .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.chrome button{font-family:var(--sans);font-size:13px;color:var(--ink2);background:transparent;border:1px solid transparent;border-radius:5px;padding:7px 10px;cursor:pointer;white-space:nowrap}
.chrome button:hover{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome button.act{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome .pg{font-family:var(--mono);font-size:14px;color:var(--ink);min-width:76px;text-align:center}
.chrome .track{flex:1;min-width:40px;height:3px;background:var(--line);border-radius:3px;margin:0 8px;position:relative}
.chrome .track i{position:absolute;left:0;top:0;height:3px;background:var(--primary);border-radius:3px;transition:width .35s}
/* 讲稿：页内右侧开窗，无遮罩 backdrop */
#notesPanel{position:fixed;top:0;right:0;bottom:58px;width:var(--noteW);background:#FCFBF8;border-left:1px solid var(--line);
  box-shadow:-12px 0 36px rgba(27,43,51,.10);transform:translateX(103%);transition:transform .32s cubic-bezier(.2,.7,.2,1);
  z-index:30;display:flex;flex-direction:column}
body.notes-on #notesPanel{transform:translateX(0)}
.np-head{flex:0 0 auto;padding:18px 24px 14px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}
.np-head .np-k{font-family:var(--mono);font-size:11.5px;letter-spacing:2px;color:var(--accent)}
.np-head h2{margin:4px 0 0;font-family:var(--serif);font-size:21px;color:var(--ink);line-height:1.35}
.np-close{margin-left:auto;flex:0 0 auto;background:#fff;border:1px solid var(--line);border-radius:5px;padding:6px 10px;font-size:12.5px;cursor:pointer;color:var(--ink2)}
.np-close:hover{border-color:var(--primary);color:var(--primary)}
.np-body{position:relative;flex:1 1 auto;overflow-y:auto;padding:6px 24px 30px;scroll-behavior:smooth}
.note{padding:18px 0 22px;border-bottom:1px solid var(--line);opacity:.55;transition:opacity .25s}
.note.current{opacity:1}
.note .nn{font-family:var(--mono);font-size:11.5px;color:var(--accent);letter-spacing:1px}
.note h3{margin:6px 0 10px;font-family:var(--serif);font-size:18px;color:var(--primary);line-height:1.45}
.note p{margin:0;font-size:15px;line-height:1.95;color:var(--ink2);letter-spacing:.2px}
.note .nbridge{margin-top:10px;padding-left:12px;border-left:3px solid var(--accent);font-family:var(--serif);font-size:14px;color:var(--accent);line-height:1.6}
.note .nbridge span{font-family:var(--sans);font-size:11px;color:var(--muted);letter-spacing:2px;display:block;margin-bottom:2px}
.np-foot{flex:0 0 auto;padding:10px 24px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);letter-spacing:.5px}
/* 模态：目录 / 帮助（讲稿不走模态） */
.veil{position:fixed;inset:0;background:rgba(27,43,51,.44);z-index:60;display:none;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
.veil.on{display:flex}
.panel{width:min(1040px,92vw);max-height:82vh;overflow:auto;background:var(--bg);border-radius:8px;box-shadow:0 24px 80px rgba(0,0,0,.28);padding:34px 40px 40px}
.panel h2{margin:0 0 8px;font-family:var(--serif);font-size:30px;color:var(--ink)}
.panel .psub{font-size:14px;color:var(--muted);margin-bottom:24px;letter-spacing:1px}
.panel .close{position:sticky;top:0;float:right;background:#fff;border:1px solid var(--line);border-radius:5px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--ink2)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.grid a{display:block;padding:14px;border:1px solid var(--line);border-radius:6px;background:#fff;text-decoration:none;color:var(--ink);cursor:pointer;transition:.2s}
.grid a:hover{border-color:var(--primary);background:var(--prim-l);transform:translateY(-2px)}
.grid a .gn{font-family:var(--mono);font-size:12px;color:var(--accent)}
.grid a .gt{font-family:var(--serif);font-size:16px;line-height:1.4;display:block;margin-top:5px}
.keys{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 30px;font-size:15px;line-height:1.8}
.keys kbd{font-family:var(--mono);background:#fff;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:2px 7px;color:var(--primary);margin-right:8px}
.toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;padding:9px 16px;border-radius:5px;opacity:0;transition:.3s;z-index:80;pointer-events:none}
.toast.on{opacity:1}
@media print{.chrome,#notesPanel,.veil,.toast{display:none!important}body.notes-on #viewport{right:0}#viewport{position:static}#stage{position:static;transform:none!important;box-shadow:none}.slide{display:block!important;page-break-after:always;position:relative;height:900px}}
</style>
</head>
<body>
<div id="viewport"><div id="stage"><div id="slides"></div></div></div>

<aside id="notesPanel" aria-hidden="false">
  <div class="np-head">
    <div><span class="np-k" id="npKind">本页讲稿 · N</span><h2 id="npTitle"></h2></div>
    <button class="np-close" id="npClose">关闭 ✕</button>
  </div>
  <div class="np-body" id="npBody"></div>
  <div class="np-foot">N / T 关闭 · 翻页时右侧讲稿自动联动滚动 · Esc 返回画面</div>
</aside>

<div class="chrome">
  <button id="btnPrev">← 上一页</button>
  <button id="btnNext">下一页 →</button>
  <span class="pg">01 / 18</span>
  <div class="track" id="track"><i></i></div>
  <div class="sep"></div>
  <button id="btnToc">目录 G</button>
  <button id="btnNotes">本页讲稿 N</button>
  <button id="btnAll">全文讲稿 T</button>
  <button id="btnAuto">▶ 自动播放</button>
  <button id="btnFs">全屏 F</button>
  <button id="btnHelp" >? 快捷键</button>
</div>
<div class="veil" id="veil"><div class="panel" id="panel"></div></div>
<div class="toast" id="toast"></div>
<script>
const D = [{"eyebrow": "开场 · 搜索为什么需要混合", "title": "别问谁更强，先问两块盲区怎么补", "lede": "只做关键词搜索，必须刚好输入文档里的词；只做向量搜索，数字、专名、权限过滤又不够可解释。混合搜索要解决的，是让两类信号在同一套 SQL 里彼此补洞。", "caption": "图 01　两种「单边搜索」各有盲区；把两条召回路并成一条稳定通道，就是今天的主角。", "bridge": "先把两个极端摆到桌面上，你才会明白「融合」不是锦上添花，而是被逼出来的选择。", "notes": "大家好，今天这一讲我们不聊某个参数怎么调，先聊一个更靠前的问题：搜索为什么非要「混合」。你把平时写的搜索分成两类看——一类是关键词搜索，用户输入什么词，就去文档里找什么词；另一类是向量搜索，把问题和文档都变成一组数字，谁离得近谁排在前面。这两类都很好用，但各自有一块洞。关键词这块洞是：用户说的话和文档里写的话经常对不上；向量这块洞是：型号、错误码、权限过滤这些需要「一个字都不能差」的东西，它偏偏只保证「意思差不多」。所以混合搜索的起点不是「哪个算法更强」，而是承认两块盲区都存在，然后想办法让它们在同一条 SQL 里互相补。今天我们就顺着这条线，从问题一路推到上线之后怎么验证。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"40\" y=\"30\" width=\"390\" height=\"116\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#7BA6AF\" stroke-width=\"1\"/><rect x=\"40\" y=\"30\" width=\"390\" height=\"4\" rx=\"0\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"0\"/><text x=\"235.0\" y=\"71.75999999999999\" font-size=\"17\" fill=\"#1B2B33\" text-anchor=\"middle\" font-weight=\"600\">纯关键词搜索</text><text x=\"235.0\" y=\"91.25999999999999\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\">词面不一致就会漏召回</text><rect x=\"970\" y=\"30\" width=\"390\" height=\"116\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#BE653B\" stroke-width=\"1\"/><rect x=\"970\" y=\"30\" width=\"390\" height=\"4\" rx=\"0\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"0\"/><text x=\"1165.0\" y=\"71.75999999999999\" font-size=\"17\" fill=\"#1B2B33\" text-anchor=\"middle\" font-weight=\"600\">纯向量搜索</text><text x=\"1165.0\" y=\"91.25999999999999\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\">精确实体与过滤难解释</text><rect x=\"40\" y=\"170\" width=\"390\" height=\"96\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\"/><text x=\"235.0\" y=\"204.56\" font-size=\"15\" fill=\"#BE653B\" text-anchor=\"middle\" font-weight=\"600\">问「怎么退款」</text><text x=\"235.0\" y=\"223.31\" font-size=\"12.5\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\">文档写的是「退货政策」→ 关键词漏召</text><rect x=\"40\" y=\"286\" width=\"390\" height=\"96\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#7BA6AF\" stroke-width=\"1\"/><text x=\"235.0\" y=\"320.56\" font-size=\"15\" fill=\"#245A6B\" text-anchor=\"middle\" font-weight=\"600\">查 PG::UndefinedTable</text><text x=\"235.0\" y=\"339.31\" font-size=\"12.5\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\">错误码 / 权限过滤 → 关键词一命中一个准</text><rect x=\"970\" y=\"170\" width=\"390\" height=\"96\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#2F7A66\" stroke-width=\"1\"/><text x=\"1165.0\" y=\"204.56\" font-size=\"15\" fill=\"#2F7A66\" text-anchor=\"middle\" font-weight=\"600\">问「怎么退款」</text><text x=\"1165.0\" y=\"223.31\" font-size=\"12.5\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\">向量压成「想把钱拿回来」→ 能召回</text><rect x=\"970\" y=\"286\" width=\"390\" height=\"96\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\"/><text x=\"1165.0\" y=\"320.56\" font-size=\"15\" fill=\"#BE653B\" text-anchor=\"middle\" font-weight=\"600\">查 PG::UndefinedTable</text><text x=\"1165.0\" y=\"339.31\" font-size=\"12.5\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\">向量把「表不存在」拉近 → 不够精确</text><rect x=\"466\" y=\"150\" width=\"468\" height=\"222\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#7BA6AF\" stroke-width=\"1.4\"/><text x=\"700\" y=\"200\" font-size=\"28\" fill=\"#245A6B\" text-anchor=\"middle\" font-weight=\"700\" class=\"serif\">混合搜索</text><line x1=\"540\" y1=\"222\" x2=\"860\" y2=\"222\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"700\" y=\"262\" font-size=\"16\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\">把「字面命中」与「语义相近」</text><text x=\"700\" y=\"294\" font-size=\"16\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\">请进同一条 SQL 通道</text><text x=\"700\" y=\"336\" font-size=\"14\" fill=\"#245A6B\" text-anchor=\"middle\" font-weight=\"600\">关键词精确 + 向量泛化 + 融合稳定</text><line x1=\"432\" y1=\"250\" x2=\"458\" y2=\"250\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><polygon points=\"459,243 466,250 459,257\" fill=\"#7BA6AF\"/><line x1=\"942\" y1=\"250\" x2=\"968\" y2=\"250\" stroke=\"#BE653B\" stroke-width=\"1.8\"/><polygon points=\"941,243 934,250 941,257\" fill=\"#BE653B\"/><line x1=\"700\" y1=\"372\" x2=\"700\" y2=\"396\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"693,397 700,404 707,397\" fill=\"#245A6B\"/><text x=\"700\" y=\"420\" font-size=\"14.5\" fill=\"#245A6B\" text-anchor=\"middle\" font-weight=\"400\">同一事务 · 同一张表 · 同一套过滤与排序</text></svg>", "ctrl": null}, {"eyebrow": "问题 · 失败模式决定胜负", "title": "「怎么退款」搜不到，但错误码一个都不能错", "lede": "词面不一致会漏召回，精确实体又不能被向量压成「差不多」。这不是模型好坏问题，而是两类信号天生分工不同。", "caption": "图 02　两个具体查询，胜负完全对调：互补的真正含义，是各自补掉对方的失败模式。", "bridge": "把这两个例子记在脑子里，后面所有参数——字段权重、模型版本、候选集大小——你都会知道它是在替哪一类失败兜底。", "notes": "先看两个特别具体的例子，你会有体感。第一个例子，用户在搜索框里敲「怎么退款」，而你的知识库里那篇文章标题叫「退货政策」。纯关键词搜索一看，文档里既没有「怎么」也没有「退款」这个词形，直接漏掉；向量搜索把两句话都压成「想把钱拿回来」这个意思，反而能召回。第二个例子反过来，用户搜的是「PG::UndefinedTable」这么一个错误码。向量模型会把它和「表不存在」「关系不存在」这些说法压得很近，但问题是，用户要的就是这个精确字符串对应的那条文档，「意思像」不能替代「字面命中」；这时候关键词搜索一命中一个准。你会发现，两个例子里谁赢谁输完全取决于失败模式，不取决于谁更先进。这就是互补的真正含义。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"40\" y=\"30\" font-size=\"16\" fill=\"#1B2B33\" text-anchor=\"start\" font-weight=\"600\" class=\"serif\">同一个搜索框，两类查询把胜负换了位</text><rect x=\"40\" y=\"52\" width=\"640\" height=\"150\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"40\" y=\"52\" width=\"640\" height=\"40\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#F1EFE9\" stroke-width=\"0\"/><text x=\"64\" y=\"79\" font-size=\"16\" fill=\"#1B2B33\" text-anchor=\"start\" font-weight=\"700\" class=\"serif\">查询 A：「怎么退款」</text><text x=\"64\" y=\"132\" font-size=\"15\" fill=\"#BE653B\" text-anchor=\"start\" font-weight=\"400\">关键词：文档写的是「退货政策」→ 漏召</text><text x=\"64\" y=\"172\" font-size=\"15\" fill=\"#2F7A66\" text-anchor=\"start\" font-weight=\"400\">向量：都压成「想把钱拿回来」→ 命中</text><rect x=\"720\" y=\"52\" width=\"640\" height=\"150\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"720\" y=\"52\" width=\"640\" height=\"40\" rx=\"0\" fill=\"#F1EFE9\" stroke=\"#F1EFE9\" stroke-width=\"0\"/><text x=\"744\" y=\"79\" font-size=\"16\" fill=\"#1B2B33\" text-anchor=\"start\" font-weight=\"700\" class=\"serif\">查询 B：「PG::UndefinedTable」</text><text x=\"744\" y=\"132\" font-size=\"15\" fill=\"#BE653B\" text-anchor=\"start\" font-weight=\"400\">向量：把「表不存在」也拉得很近 → 不精确</text><text x=\"744\" y=\"172\" font-size=\"15\" fill=\"#2F7A66\" text-anchor=\"start\" font-weight=\"400\">关键词：精确字符串 → 一命中一个准</text><rect x=\"40\" y=\"232\" width=\"1320\" height=\"168\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#7BA6AF\" stroke-width=\"1\"/><text x=\"70\" y=\"268\" font-size=\"20\" fill=\"#245A6B\" text-anchor=\"start\" font-weight=\"600\" class=\"serif\">结论：谁赢谁输取决于「失败模式」，不取决于谁更先进。</text><text x=\"70\" y=\"306\" font-size=\"16\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">· 词面不一致 → 纯 BM25 漏召回</text><text x=\"70\" y=\"338\" font-size=\"16\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">· 精确实体不能丢 → 纯向量把「意思像」排在「字面命中」前面</text><text x=\"70\" y=\"372\" font-size=\"16\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">· 业务过滤必须一致 → 搜索要能和网络、权限、状态写进同一条 SQL</text></svg>", "ctrl": null}, {"eyebrow": "定位 · 先把边界说清", "title": "混合搜索不是一个索引，是一条查询架构", "lede": "关键词负责精确和可解释，向量负责语义和泛化，融合层负责把它们变成一个稳定可调可验证的 TopK。文档里必须先把版本边界说清楚。", "caption": "图 03　三层信号分工；下方金色带是必须守住的边界——融合发生在 SQL 层，不是某个索引的原生能力。", "bridge": "记住这条边界，你去看文档、看发布会就不会被「一个索引搞定一切」带偏，排障时也知道该去哪一层找原因。", "notes": "那么落到工程上，混合搜索到底是什么？先给一个特别容易踩坑的边界：它不是某一种神奇的索引，也不是「ParadeDB 一个索引已经原生把向量和 BM25 揉在一起了」。当前主线里，pg_search 的定位是 PostgreSQL 内的 BM25 全文检索扩展，pgvector 负责语义最近邻，真正的融合发生在 SQL 层——你可以用 RRF，可以用加权归一化，也可以再叠一个 cross-encoder 重排。所以准确的说法是：关键词负责精确和可解释，向量负责语义和泛化，融合层负责把两个候选集变成一个稳定、可调、可验证的 TopK。记住这条边界，你去看文档、看发布会就不会被「一个索引搞定一切」这种话带偏，排障时也知道该去哪一层找原因。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"40\" y=\"40\" width=\"420\" height=\"150\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#7BA6AF\" stroke-width=\"1\"/><rect x=\"40\" y=\"40\" width=\"420\" height=\"4\" rx=\"0\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"0\"/><text x=\"250.0\" y=\"94.0\" font-size=\"17\" fill=\"#245A6B\" text-anchor=\"middle\" font-weight=\"600\">关键词 · 精确与可解释</text><text x=\"250.0\" y=\"113.5\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\">型号、错误码、字段过滤、短语</text><rect x=\"490\" y=\"40\" width=\"420\" height=\"150\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#BE653B\" stroke-width=\"1\"/><rect x=\"490\" y=\"40\" width=\"420\" height=\"4\" rx=\"0\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"0\"/><text x=\"700.0\" y=\"94.0\" font-size=\"17\" fill=\"#BE653B\" text-anchor=\"middle\" font-weight=\"600\">向量 · 语义与泛化</text><text x=\"700.0\" y=\"113.5\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\">同义表达、改写、自然语言问题</text><rect x=\"940\" y=\"40\" width=\"420\" height=\"150\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#2F7A66\" stroke-width=\"1\"/><rect x=\"940\" y=\"40\" width=\"420\" height=\"4\" rx=\"0\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"0\"/><text x=\"1150.0\" y=\"94.0\" font-size=\"17\" fill=\"#2F7A66\" text-anchor=\"middle\" font-weight=\"600\">融合 · 稳定可调可验证</text><text x=\"1150.0\" y=\"113.5\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\">把两个候选集变成一个 TopK</text><polyline points=\"460,115 475,115 475,180 700,180\" fill=\"none\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><polyline points=\"940,115 925,115 925,180 700,180\" fill=\"none\" stroke=\"#BE653B\" stroke-width=\"1.8\"/><line x1=\"700\" y1=\"190\" x2=\"700\" y2=\"214\" stroke=\"#2F7A66\" stroke-width=\"1.8\"/><polygon points=\"693,215 700,222 707,215\" fill=\"#2F7A66\"/><rect x=\"40\" y=\"232\" width=\"1320\" height=\"120\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1\"/><text x=\"70\" y=\"266\" font-size=\"20\" fill=\"#AE8A3E\" text-anchor=\"start\" font-weight=\"600\" class=\"serif\">版本边界必须先说清：这不是「一个索引原生融合」。</text><text x=\"70\" y=\"302\" font-size=\"15.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">pg_search = PostgreSQL 内的 BM25 全文检索扩展；pgvector = 语义最近邻；</text><text x=\"70\" y=\"332\" font-size=\"15.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">真正的融合在 SQL 层：RRF / 加权归一化 / cross-encoder 重排。</text><rect x=\"40\" y=\"372\" width=\"1320\" height=\"42\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"70\" y=\"399\" font-size=\"16\" fill=\"#245A6B\" text-anchor=\"start\" font-weight=\"600\">工程命题：把两类信号放进同一事务、同一张业务表、同一套 SQL 过滤与排序。</text></svg>", "ctrl": null}, {"eyebrow": "是什么 · 四层剖面（主图）", "title": "数据、词法、语义、融合：一张地层图讲清", "lede": "业务表保事务与过滤一致；词法召回靠 pg_search；语义召回靠 pgvector；融合排序把不同量纲变成 TopK。", "caption": "图 04　四层地层剖面：靛青越深越底层，右侧标注每层主要代价——「聪明」是有账单的。", "bridge": "这四层越往上越聪明，也越往上越依赖下面三层给干净的输入；任何一层脏了，上面再花哨也救不回来。", "notes": "把刚才那句话摊开，就是这张四层剖面图。最底下是业务表——主键、租户、权限、状态、原文、embedding 都在这一层，它的职责是保住事务和回表过滤的一致。往上第二层是词法召回，pg_search 用 BM25 和 Tantivy 提供字段化检索和可解释的相关性，代价是 tokenizer、字段权重和索引维护。第三层是语义召回，pgvector 用 HNSW 或 IVFFlat 换低延迟，代价是召回率、参数和模型版本。最上面是融合排序，RRF 或重排把不同量纲的结果变成最终 TopK，代价是查询变复杂、必须离线评测。你看这四层越往上越「聪明」，也越往上越依赖下面三层给干净的输入；任何一层脏了，上面再花哨也救不回来。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"40\" y=\"24\" font-size=\"15.5\" fill=\"#1B2B33\" text-anchor=\"start\" font-weight=\"600\" class=\"serif\">四层剖面：越往上越「聪明」，越依赖下面给的干净输入</text><rect x=\"40\" y=\"44\" width=\"1320\" height=\"80\" rx=\"0\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"0\"/><text x=\"64\" y=\"78\" font-size=\"22\" fill=\"#FFFFFF\" text-anchor=\"start\" font-weight=\"700\" class=\"serif\">融合排序</text><text x=\"64\" y=\"106\" font-size=\"14.5\" fill=\"#EBF1EE\" text-anchor=\"start\" font-weight=\"400\">RRF / 加权 / 重排</text><line x1=\"880\" y1=\"58\" x2=\"880\" y2=\"110\" stroke=\"#FFFFFF\" stroke-width=\"0.8\" opacity=\"0.45\"/><text x=\"906\" y=\"77\" font-size=\"12\" fill=\"#EBF1EE\" text-anchor=\"start\" font-weight=\"400\" opacity=\"0.85\">代价</text><text x=\"906\" y=\"104\" font-size=\"13\" fill=\"#FFFFFF\" text-anchor=\"start\" font-weight=\"400\">查询复杂、需离线评测</text><rect x=\"40\" y=\"128\" width=\"1320\" height=\"80\" rx=\"0\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"0\"/><text x=\"64\" y=\"162\" font-size=\"22\" fill=\"#FFFFFF\" text-anchor=\"start\" font-weight=\"700\" class=\"serif\">语义召回</text><text x=\"64\" y=\"190\" font-size=\"14.5\" fill=\"#EBF1EE\" text-anchor=\"start\" font-weight=\"400\">pgvector · HNSW / IVFFlat</text><line x1=\"880\" y1=\"142\" x2=\"880\" y2=\"194\" stroke=\"#FFFFFF\" stroke-width=\"0.8\" opacity=\"0.45\"/><text x=\"906\" y=\"161\" font-size=\"12\" fill=\"#EBF1EE\" text-anchor=\"start\" font-weight=\"400\" opacity=\"0.85\">代价</text><text x=\"906\" y=\"188\" font-size=\"13\" fill=\"#FFFFFF\" text-anchor=\"start\" font-weight=\"400\">ANN 召回率、参数、模型版本</text><rect x=\"40\" y=\"212\" width=\"1320\" height=\"80\" rx=\"0\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"0\"/><text x=\"64\" y=\"246\" font-size=\"22\" fill=\"#FFFFFF\" text-anchor=\"start\" font-weight=\"700\" class=\"serif\">词法召回</text><text x=\"64\" y=\"274\" font-size=\"14.5\" fill=\"#EBF1EE\" text-anchor=\"start\" font-weight=\"400\">ParadeDB pg_search · BM25 / Tantivy</text><line x1=\"880\" y1=\"226\" x2=\"880\" y2=\"278\" stroke=\"#FFFFFF\" stroke-width=\"0.8\" opacity=\"0.45\"/><text x=\"906\" y=\"245\" font-size=\"12\" fill=\"#EBF1EE\" text-anchor=\"start\" font-weight=\"400\" opacity=\"0.85\">代价</text><text x=\"906\" y=\"272\" font-size=\"13\" fill=\"#FFFFFF\" text-anchor=\"start\" font-weight=\"400\">tokenizer、字段权重、索引维护</text><rect x=\"40\" y=\"296\" width=\"1320\" height=\"80\" rx=\"0\" fill=\"#74A5AD\" stroke=\"#74A5AD\" stroke-width=\"0\"/><text x=\"64\" y=\"330\" font-size=\"22\" fill=\"#FFFFFF\" text-anchor=\"start\" font-weight=\"700\" class=\"serif\">业务表</text><text x=\"64\" y=\"358\" font-size=\"14.5\" fill=\"#EBF1EE\" text-anchor=\"start\" font-weight=\"400\">主键 · 租户 · 权限 · 状态 · 文本 · embedding</text><line x1=\"880\" y1=\"310\" x2=\"880\" y2=\"362\" stroke=\"#FFFFFF\" stroke-width=\"0.8\" opacity=\"0.45\"/><text x=\"906\" y=\"329\" font-size=\"12\" fill=\"#EBF1EE\" text-anchor=\"start\" font-weight=\"400\" opacity=\"0.85\">代价</text><text x=\"906\" y=\"356\" font-size=\"13\" fill=\"#FFFFFF\" text-anchor=\"start\" font-weight=\"400\">表结构与写入链路更复杂</text><text x=\"40\" y=\"392\" font-size=\"14\" fill=\"#245A6B\" text-anchor=\"start\" font-weight=\"400\">靛青越深＝越底层：上层的质量，永远受限于下层输入的干净程度。</text></svg>", "ctrl": null}, {"eyebrow": "对齐 · 术语先说清", "title": "五个词对齐，后面才不会各说各话", "lede": "BM25、embedding、ANN、RRF、候选集——每个词背后都对应一个具体失败模式和调参位置。", "caption": "图 05　五个术语卡：上半是定义，下半是它对应的失败模式与调参位置。", "bridge": "记住这五个词各自对应哪一个失败模式，等会儿看 SQL 模板你会发现每一段都在伺候它们。", "notes": "在往下讲之前，把五个词对齐，不然后面会各说各话。BM25，是经典的词法相关性算法，看的是词频、逆文档频率和字段长度归一化，它回答的是「文档里有没有这些词、这些词有多重要」。embedding，是模型把文本转成的向量，语义接近的文本在向量空间里距离更近。ANN，近似最近邻，HNSW 和 IVFFlat 都是拿一点召回率换延迟。RRF，倒数排名融合，它不碰原始分数，只把每个分支的排名换成 1/(k+排名) 再相加。候选集，是每个分支先返回的 TopN，它不是最终结果；太小会漏召回，太大又会把排序和回表成本顶上去。记住这五个词各自对应哪一个失败模式，等会儿看 SQL 模板你会发现每一段都在伺候它们。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"40\" y=\"52\" width=\"256\" height=\"236\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"40\" y=\"52\" width=\"256\" height=\"44\" rx=\"0\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"0\"/><text x=\"168.0\" y=\"82\" font-size=\"18\" fill=\"#FFFFFF\" text-anchor=\"middle\" font-weight=\"700\" class=\"serif\">BM25</text><text x=\"56\" y=\"126\" font-size=\"13.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">词频 × 逆文档频率 × 字段长度归一化</text><line x1=\"56\" y1=\"150\" x2=\"280\" y2=\"150\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"56\" y=\"180\" font-size=\"11.5\" fill=\"#89938F\" text-anchor=\"start\" font-weight=\"400\">对应</text><text x=\"56\" y=\"206\" font-size=\"13.5\" fill=\"#1B2B33\" text-anchor=\"start\" font-weight=\"600\">回答：有没有这些词、词有多重要</text><text x=\"56\" y=\"260\" font-size=\"11\" fill=\"#89938F\" text-anchor=\"start\" font-weight=\"400\">失败模式 / 调参位置</text><rect x=\"308\" y=\"52\" width=\"256\" height=\"236\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"308\" y=\"52\" width=\"256\" height=\"44\" rx=\"0\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"0\"/><text x=\"436.0\" y=\"82\" font-size=\"18\" fill=\"#FFFFFF\" text-anchor=\"middle\" font-weight=\"700\" class=\"serif\">embedding</text><text x=\"324\" y=\"126\" font-size=\"13.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">文本→向量，语义近则距离近</text><line x1=\"324\" y1=\"150\" x2=\"548\" y2=\"150\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"324\" y=\"180\" font-size=\"11.5\" fill=\"#89938F\" text-anchor=\"start\" font-weight=\"400\">对应</text><text x=\"324\" y=\"206\" font-size=\"13.5\" fill=\"#1B2B33\" text-anchor=\"start\" font-weight=\"600\">决定：语义泛化的上限</text><text x=\"324\" y=\"260\" font-size=\"11\" fill=\"#89938F\" text-anchor=\"start\" font-weight=\"400\">失败模式 / 调参位置</text><rect x=\"576\" y=\"52\" width=\"256\" height=\"236\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"576\" y=\"52\" width=\"256\" height=\"44\" rx=\"0\" fill=\"#74A5AD\" stroke=\"#74A5AD\" stroke-width=\"0\"/><text x=\"704.0\" y=\"82\" font-size=\"18\" fill=\"#FFFFFF\" text-anchor=\"middle\" font-weight=\"700\" class=\"serif\">ANN</text><text x=\"592\" y=\"126\" font-size=\"13.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">HNSW / IVFFlat 拿召回换延迟</text><line x1=\"592\" y1=\"150\" x2=\"816\" y2=\"150\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"592\" y=\"180\" font-size=\"11.5\" fill=\"#89938F\" text-anchor=\"start\" font-weight=\"400\">对应</text><text x=\"592\" y=\"206\" font-size=\"13.5\" fill=\"#1B2B33\" text-anchor=\"start\" font-weight=\"600\">关注：ef_search / probes</text><text x=\"592\" y=\"260\" font-size=\"11\" fill=\"#89938F\" text-anchor=\"start\" font-weight=\"400\">失败模式 / 调参位置</text><rect x=\"844\" y=\"52\" width=\"256\" height=\"236\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"844\" y=\"52\" width=\"256\" height=\"44\" rx=\"0\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"0\"/><text x=\"972.0\" y=\"82\" font-size=\"18\" fill=\"#FFFFFF\" text-anchor=\"middle\" font-weight=\"700\" class=\"serif\">RRF</text><text x=\"860\" y=\"126\" font-size=\"13.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">每个名次换成 1/(k+rank) 再求和</text><line x1=\"860\" y1=\"150\" x2=\"1084\" y2=\"150\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"860\" y=\"180\" font-size=\"11.5\" fill=\"#89938F\" text-anchor=\"start\" font-weight=\"400\">对应</text><text x=\"860\" y=\"206\" font-size=\"13.5\" fill=\"#1B2B33\" text-anchor=\"start\" font-weight=\"600\">起点：别碰原始分数尺度</text><text x=\"860\" y=\"260\" font-size=\"11\" fill=\"#89938F\" text-anchor=\"start\" font-weight=\"400\">失败模式 / 调参位置</text><rect x=\"1112\" y=\"52\" width=\"256\" height=\"236\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"1112\" y=\"52\" width=\"256\" height=\"44\" rx=\"0\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"0\"/><text x=\"1240.0\" y=\"82\" font-size=\"18\" fill=\"#FFFFFF\" text-anchor=\"middle\" font-weight=\"700\" class=\"serif\">候选集</text><text x=\"1128\" y=\"126\" font-size=\"13.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">每支先取的 TopN，不是最终结果</text><line x1=\"1128\" y1=\"150\" x2=\"1352\" y2=\"150\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1128\" y=\"180\" font-size=\"11.5\" fill=\"#89938F\" text-anchor=\"start\" font-weight=\"400\">对应</text><text x=\"1128\" y=\"206\" font-size=\"13.5\" fill=\"#1B2B33\" text-anchor=\"start\" font-weight=\"600\">旋钮：成本 ↔ 召回率</text><text x=\"1128\" y=\"260\" font-size=\"11\" fill=\"#89938F\" text-anchor=\"start\" font-weight=\"400\">失败模式 / 调参位置</text><text x=\"40\" y=\"332\" font-size=\"14.5\" fill=\"#245A6B\" text-anchor=\"start\" font-weight=\"400\">五个词各自对应一个失败模式；看 SQL 模板时，你会发现每一段都在伺候它们。</text></svg>", "ctrl": null}, {"eyebrow": "核心原理 · 词法这一层", "title": "写入走 Index AM，读取走 Custom Scan", "lede": "pg_search 大致分四层；职责边界比函数名更重要——写、读、可见性三条路分清，排障才知道往哪看。", "caption": "图 06　上半：pg_search 四层（深→浅）；下半：写入 / 读取 / 可见性三条路径各管一段。", "bridge": "排障时先问一句「这是写的问题还是读的问题」，路就走对了。", "notes": "现在把词法这一层再剖开一层看 pg_search。它做的事情，一句话概括：让 PostgreSQL 的规划器看得见搜索索引，让 Tantivy 看得懂 PostgreSQL 的事务边界。它大致分四层——PostgreSQL 核心层提供 buffer manager 和索引访问方法接口；扩展层用 hook 注册 bm25_handler，遇到搜索谓词就造 custom path；存储管理层管 metapage、buffer、segment；最里面是 Tantivy，真正执行倒排检索和 BM25 打分。这里最该记住的不是函数名，而是三条路的职责边界：写入走 Index AM，建索引、插入、删除、VACUUM 归它；读取走 Custom Scan，识别 @@@ 这样的搜索谓词并估算成本；事务可见性交给 MVCC 目录，Tantivy 的 segment 必须按 xmin、xmax 和当前快照过滤。排障时先问「这是写的问题还是读的问题」，路就走对了。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"40\" y=\"22\" font-size=\"15.5\" fill=\"#1B2B33\" text-anchor=\"start\" font-weight=\"600\" class=\"serif\">pg_search：让规划器看得见索引，让 Tantivy 看懂事务</text><rect x=\"40\" y=\"40\" width=\"1310\" height=\"62\" rx=\"0\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"0\"/><text x=\"62\" y=\"78\" font-size=\"18\" fill=\"#FFFFFF\" text-anchor=\"start\" font-weight=\"700\" class=\"serif\">搜索引擎层</text><text x=\"330\" y=\"78\" font-size=\"14\" fill=\"#EBF1EE\" text-anchor=\"start\" font-weight=\"400\">Tantivy：倒排检索 · BM25 打分 · 列式 fast field</text><rect x=\"40\" y=\"106\" width=\"1310\" height=\"62\" rx=\"0\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"0\"/><text x=\"62\" y=\"144\" font-size=\"18\" fill=\"#FFFFFF\" text-anchor=\"start\" font-weight=\"700\" class=\"serif\">存储管理层</text><text x=\"330\" y=\"144\" font-size=\"14\" fill=\"#EBF1EE\" text-anchor=\"start\" font-weight=\"400\">metapage · buffer · linked list · segment</text><rect x=\"40\" y=\"172\" width=\"1310\" height=\"62\" rx=\"0\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"0\"/><text x=\"62\" y=\"210\" font-size=\"18\" fill=\"#FFFFFF\" text-anchor=\"start\" font-weight=\"700\" class=\"serif\">扩展层</text><text x=\"330\" y=\"210\" font-size=\"14\" fill=\"#EBF1EE\" text-anchor=\"start\" font-weight=\"400\">初始化 hook · bm25_handler · set_rel_pathlist_hook</text><rect x=\"40\" y=\"238\" width=\"1310\" height=\"62\" rx=\"0\" fill=\"#74A5AD\" stroke=\"#74A5AD\" stroke-width=\"0\"/><text x=\"62\" y=\"276\" font-size=\"18\" fill=\"#FFFFFF\" text-anchor=\"start\" font-weight=\"700\" class=\"serif\">PostgreSQL 核心层</text><text x=\"330\" y=\"276\" font-size=\"14\" fill=\"#EBF1EE\" text-anchor=\"start\" font-weight=\"400\">buffer manager · 索引访问方法 API · custom scan</text><rect x=\"40\" y=\"310\" width=\"420\" height=\"96\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#7BA6AF\" stroke-width=\"1\"/><text x=\"60\" y=\"338\" font-size=\"15\" fill=\"#245A6B\" text-anchor=\"start\" font-weight=\"600\">写入路径 · Index AM</text><text x=\"60\" y=\"364\" font-size=\"12.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">ambuild / aminsert / ambulkdelete / amvacuumcleanup</text><text x=\"60\" y=\"388\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">建索引 · 插入 · 删除 · VACUUM · 空间回收</text><rect x=\"490\" y=\"310\" width=\"420\" height=\"96\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#BE653B\" stroke-width=\"1\"/><text x=\"510\" y=\"338\" font-size=\"15\" fill=\"#BE653B\" text-anchor=\"start\" font-weight=\"600\">读取路径 · Custom Scan</text><text x=\"510\" y=\"364\" font-size=\"12.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">set_rel_pathlist_hook → PdbScan::create_custom_path()</text><text x=\"510\" y=\"388\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">识别 @@@ 谓词 · 估算成本 · 下推 TopN / 投影</text><rect x=\"940\" y=\"310\" width=\"410\" height=\"96\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#AE8A3E\" stroke-width=\"1\"/><text x=\"960\" y=\"338\" font-size=\"15\" fill=\"#AE8A3E\" text-anchor=\"start\" font-weight=\"600\">可见性 · MVCC 目录</text><text x=\"960\" y=\"364\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">segment 按 xmin / xmax / snapshot 过滤</text><text x=\"960\" y=\"388\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">不是脱离 PostgreSQL 快照任意可见</text></svg>", "ctrl": null}, {"eyebrow": "核心原理 · 语义这一层", "title": "pgvector：把最近邻塞进 ORDER BY", "lede": "<=> 是 cosine distance，越小越近；要进索引必须放 ORDER BY 配 LIMIT。ANN 的旋钮各有分工，但过滤会把候选削薄。", "caption": "图 07　SQL 形态 + 两种 ANN 索引的参数；金色带是「过滤后候选不足」的示意与对策。", "bridge": "过滤越狠，你越要加大 ef_search、用迭代扫描或分区去补——这是数值直觉，不是背参数。", "notes": "语义这一层看 pgvector。它最典型的用法就这么一行 SQL：ORDER BY embedding <=> 某个向量，再 LIMIT 20。这里有两个必须记住的点。第一，<=> 是 cosine distance，越小越近；而且想让索引生效，必须把距离操作符放在 ORDER BY 里并配合 LIMIT，你要是改写成 1 减距离再 DESC，优化器未必认得这是 ANN 入口。第二，HNSW 和 IVFFlat 各有各的旋钮——HNSW 用多层图换低延迟，看 m、ef_construction、hnsw.ef_search；IVFFlat 先聚类分桶，看 lists 和 ivfflat.probes。真正的坑在过滤：ANN 通常是先返回候选再过滤。pgvector README 给过一个示意——如果过滤只匹配百分之十的行，默认 ef_search 等于 40 时平均可能只剩大约四行满足条件。这不是精确承诺，是个提醒：过滤越狠，你越要加大 ef_search、用迭代扫描或分区去补。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"40\" y=\"36\" width=\"640\" height=\"188\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#7BA6AF\" stroke-width=\"1\"/><text x=\"62\" y=\"62\" font-size=\"15\" fill=\"#245A6B\" text-anchor=\"start\" font-weight=\"600\">典型 SQL 形态</text><text x=\"62\" y=\"98\" font-size=\"15\" fill=\"#1B2B33\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\">SELECT id, title</text><text x=\"62\" y=\"124\" font-size=\"15\" fill=\"#1B2B33\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\">FROM docs</text><text x=\"62\" y=\"150\" font-size=\"14\" fill=\"#1B2B33\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\">ORDER BY embedding &lt;=&gt; '[0.1,0.2,0.3]'::vector</text><text x=\"62\" y=\"176\" font-size=\"15\" fill=\"#1B2B33\" text-anchor=\"start\" font-weight=\"400\" class=\"mono\">LIMIT 20;</text><text x=\"62\" y=\"206\" font-size=\"12.5\" fill=\"#245A6B\" text-anchor=\"start\" font-weight=\"400\">&lt;=&gt; 是 cosine distance，越小越近；放 ORDER BY + LIMIT 才能用索引</text><rect x=\"710\" y=\"36\" width=\"310\" height=\"188\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#7BA6AF\" stroke-width=\"1\"/><text x=\"865.0\" y=\"103.67999999999999\" font-size=\"17\" fill=\"#245A6B\" text-anchor=\"middle\" font-weight=\"600\">HNSW · 多层图</text><text x=\"865.0\" y=\"123.17999999999999\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\">换低延迟与高召回</text><text x=\"865.0\" y=\"141.38\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\">m, ef_construction</text><text x=\"865.0\" y=\"159.57999999999998\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\">hnsw.ef_search</text><rect x=\"1050\" y=\"36\" width=\"310\" height=\"188\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#7BA6AF\" stroke-width=\"1\"/><text x=\"1205.0\" y=\"103.67999999999999\" font-size=\"17\" fill=\"#245A6B\" text-anchor=\"middle\" font-weight=\"600\">IVFFlat · 先聚类分桶</text><text x=\"1205.0\" y=\"123.17999999999999\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\">查询扫最近若干 list</text><text x=\"1205.0\" y=\"141.38\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\">lists, ivfflat.probes</text><rect x=\"40\" y=\"250\" width=\"1320\" height=\"160\" rx=\"0\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1\"/><text x=\"64\" y=\"284\" font-size=\"19\" fill=\"#AE8A3E\" text-anchor=\"start\" font-weight=\"600\" class=\"serif\">坑在过滤：ANN 通常先返回候选，再应用过滤条件。</text><text x=\"64\" y=\"320\" font-size=\"14.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">pgvector README 的示意：过滤只匹配 10% 行、默认 ef_search=40 时，平均可能只剩约 4 行满足。</text><text x=\"64\" y=\"352\" font-size=\"14.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">对策：加大 ef_search、0.8.0+ 迭代索引扫描、部分索引 / 分区、扩大候选集。</text><text x=\"64\" y=\"388\" font-size=\"12\" fill=\"#89938F\" text-anchor=\"start\" font-weight=\"400\">（10% / 40 / 4 行为原文示意，用于说明「过滤会削薄候选」，非性能承诺）</text></svg>", "ctrl": null}, {"eyebrow": "核心原理 · 融合的动机", "title": "一个大一个小，一个越大越好一个越小越好", "lede": "BM25 越大越相关，向量距离越小越近；受语料、模型、维度影响，跨 query 还不可比。直接相加，等于让尺度大的那个吞掉另一个。", "caption": "图 08　两条方向相反的刻度；相加公式被划掉，绿色带给出更稳的起点——RRF。", "bridge": "除非你有标注集、归一化策略和持续评测，否则别急着调分数——先用 RRF 把名次换成可比的分。", "notes": "接下来回答一个特别常见的问题：为什么不直接把 BM25 分数和向量分数相加？看这两个刻度你就明白了。BM25 分数是越大越相关，数值受词频、文档长度、字段和语料分布影响；向量距离是越小越近，受模型、归一化、距离函数和维度影响。它们不是同一量纲，同一个 query 下各自能排序，不代表跨 query 还能比。你写一句 ORDER BY bm25_score + cosine_similarity DESC，看着简洁，实际上很可能让数值尺度大的那个分支把另一个整个吞掉。除非你有离线标注集、有归一化策略、还在持续评测，否则更稳的起点是 RRF——它的思路很朴素：别信原始分数的尺度，只信每个分支内部的排名。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"40\" y=\"24\" font-size=\"16\" fill=\"#1B2B33\" text-anchor=\"start\" font-weight=\"600\" class=\"serif\">两个刻度，方向相反、量纲不同</text><text x=\"60\" y=\"78\" font-size=\"15\" fill=\"#245A6B\" text-anchor=\"start\" font-weight=\"600\">BM25 分数</text><line x1=\"70\" y1=\"110\" x2=\"640\" y2=\"110\" stroke=\"#245A6B\" stroke-width=\"2\"/><line x1=\"70\" y1=\"104\" x2=\"70\" y2=\"116\" stroke=\"#245A6B\" stroke-width=\"1\"/><line x1=\"165\" y1=\"104\" x2=\"165\" y2=\"116\" stroke=\"#245A6B\" stroke-width=\"1\"/><line x1=\"260\" y1=\"104\" x2=\"260\" y2=\"116\" stroke=\"#245A6B\" stroke-width=\"1\"/><line x1=\"355\" y1=\"104\" x2=\"355\" y2=\"116\" stroke=\"#245A6B\" stroke-width=\"1\"/><line x1=\"450\" y1=\"104\" x2=\"450\" y2=\"116\" stroke=\"#245A6B\" stroke-width=\"1\"/><line x1=\"545\" y1=\"104\" x2=\"545\" y2=\"116\" stroke=\"#245A6B\" stroke-width=\"1\"/><line x1=\"640\" y1=\"104\" x2=\"640\" y2=\"116\" stroke=\"#245A6B\" stroke-width=\"1\"/><text x=\"70\" y=\"140\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">小：不相关</text><text x=\"560\" y=\"140\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">大：越相关</text><text x=\"70\" y=\"170\" font-size=\"13\" fill=\"#89938F\" text-anchor=\"start\" font-weight=\"400\">受词频 / 文档长度 / 字段 / 语料分布影响</text><text x=\"760\" y=\"78\" font-size=\"15\" fill=\"#BE653B\" text-anchor=\"start\" font-weight=\"600\">向量距离</text><line x1=\"770\" y1=\"110\" x2=\"1340\" y2=\"110\" stroke=\"#BE653B\" stroke-width=\"2\"/><line x1=\"770\" y1=\"104\" x2=\"770\" y2=\"116\" stroke=\"#BE653B\" stroke-width=\"1\"/><line x1=\"865\" y1=\"104\" x2=\"865\" y2=\"116\" stroke=\"#BE653B\" stroke-width=\"1\"/><line x1=\"960\" y1=\"104\" x2=\"960\" y2=\"116\" stroke=\"#BE653B\" stroke-width=\"1\"/><line x1=\"1055\" y1=\"104\" x2=\"1055\" y2=\"116\" stroke=\"#BE653B\" stroke-width=\"1\"/><line x1=\"1150\" y1=\"104\" x2=\"1150\" y2=\"116\" stroke=\"#BE653B\" stroke-width=\"1\"/><line x1=\"1245\" y1=\"104\" x2=\"1245\" y2=\"116\" stroke=\"#BE653B\" stroke-width=\"1\"/><line x1=\"1340\" y1=\"104\" x2=\"1340\" y2=\"116\" stroke=\"#BE653B\" stroke-width=\"1\"/><text x=\"770\" y=\"140\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">小：越相近</text><text x=\"1260\" y=\"140\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">大：不相似</text><text x=\"770\" y=\"170\" font-size=\"13\" fill=\"#89938F\" text-anchor=\"start\" font-weight=\"400\">受模型 / 归一化 / 距离函数 / 维度影响</text><rect x=\"420\" y=\"212\" width=\"560\" height=\"72\" rx=\"0\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\"/><text x=\"700\" y=\"246\" font-size=\"15.5\" fill=\"#BE653B\" text-anchor=\"middle\" font-weight=\"600\" class=\"mono\">ORDER BY bm25_score + cosine_similarity DESC</text><line x1=\"452\" y1=\"254\" x2=\"948\" y2=\"222\" stroke=\"#BE653B\" stroke-width=\"2\"/><text x=\"700\" y=\"296\" font-size=\"16\" fill=\"#BE653B\" text-anchor=\"middle\" font-weight=\"600\">✕  直接相加：尺度大的分支会吞掉另一个</text><rect x=\"190\" y=\"330\" width=\"1020\" height=\"80\" rx=\"0\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\"/><text x=\"700\" y=\"366\" font-size=\"17\" fill=\"#2F7A66\" text-anchor=\"middle\" font-weight=\"600\" class=\"serif\">更稳的起点：RRF —— 不信原始分数的尺度，只信每个分支内部的排名</text><text x=\"700\" y=\"396\" font-size=\"15\" fill=\"#2F7A66\" text-anchor=\"middle\" font-weight=\"400\" class=\"mono\">rrf_score(doc) = Σ  1 / (k + rank_i(doc))</text></svg>", "ctrl": null}, {"eyebrow": "核心原理 · RRF（互动）", "title": "RRF：不相信分数，只相信排名", "lede": "把每个分支的 rank 换成 1/(k+rank) 再求和。k=60 是常见起点：k 越大头部优势越平滑，k 越小头部差距越大。", "caption": "互动演示：改 k 或按播放，观察 A / B / C 两分支名次如何变成贡献分、求和并排出最终 TopK。", "bridge": "它只用了名次，没用分数间距；等你攒够坏例，再叠学习排序或 cross-encoder 也不迟。", "notes": "RRF 的公式只有一行：一个文档的分数，等于每个分支里 1 除以 k 加它的名次，然后求和。k 常见取 60。k 越大，头部名次的优势被抹得越平；k 越小，第一名和第二名的差距越明显。我们用下面这个演示亲手算一遍——三个文档在两个分支里各有一个名次，你改 k，或者按播放，看名次怎么变成贡献，最后又怎么求和排出最终顺序。你会发现它完全绕开了「两个分数怎么归一化」这个难题，这也是它能当第一版基线的原因。当然它只用了名次，没用分数之间的间距；等你攒够坏例，再叠学习排序或 cross-encoder 也不迟。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"40\" y=\"20\" width=\"330\" height=\"214\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#7BA6AF\" stroke-width=\"1\"/><rect x=\"40\" y=\"20\" width=\"330\" height=\"38\" rx=\"0\" fill=\"#7BA6AF\" stroke=\"#7BA6AF\" stroke-width=\"0\"/><text x=\"205\" y=\"46\" font-size=\"13.5\" fill=\"#FFFFFF\" text-anchor=\"middle\" font-weight=\"600\">词法分支 TopN (pg_search)</text><text x=\"64\" y=\"88\" font-size=\"12.5\" fill=\"#89938F\" text-anchor=\"start\" font-weight=\"400\">文档</text><text x=\"250\" y=\"88\" font-size=\"12.5\" fill=\"#89938F\" text-anchor=\"middle\" font-weight=\"400\">名次</text><text x=\"64\" y=\"120\" font-size=\"14.5\" fill=\"#1B2B33\" text-anchor=\"start\" font-weight=\"400\">A · 退货政策</text><text x=\"250\" y=\"120\" font-size=\"14.5\" fill=\"#245A6B\" text-anchor=\"middle\" font-weight=\"400\">1</text><text x=\"64\" y=\"152\" font-size=\"14.5\" fill=\"#1B2B33\" text-anchor=\"start\" font-weight=\"400\">B · PG 错误码</text><text x=\"250\" y=\"152\" font-size=\"14.5\" fill=\"#245A6B\" text-anchor=\"middle\" font-weight=\"400\">2</text><text x=\"64\" y=\"184\" font-size=\"14.5\" fill=\"#1B2B33\" text-anchor=\"start\" font-weight=\"400\">C · 内部库存</text><text x=\"250\" y=\"184\" font-size=\"14.5\" fill=\"#89938F\" text-anchor=\"middle\" font-weight=\"400\">—</text><text x=\"64\" y=\"214\" font-size=\"11.5\" fill=\"#89938F\" text-anchor=\"start\" font-weight=\"400\">（未进入 TopN 记 0）</text><rect x=\"1030\" y=\"20\" width=\"330\" height=\"214\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#BE653B\" stroke-width=\"1\"/><rect x=\"1030\" y=\"20\" width=\"330\" height=\"38\" rx=\"0\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"0\"/><text x=\"1195\" y=\"46\" font-size=\"13.5\" fill=\"#FFFFFF\" text-anchor=\"middle\" font-weight=\"600\">向量分支 TopN (pgvector)</text><text x=\"1054\" y=\"88\" font-size=\"12.5\" fill=\"#89938F\" text-anchor=\"start\" font-weight=\"400\">文档</text><text x=\"1240\" y=\"88\" font-size=\"12.5\" fill=\"#89938F\" text-anchor=\"middle\" font-weight=\"400\">名次</text><text x=\"1054\" y=\"120\" font-size=\"14.5\" fill=\"#1B2B33\" text-anchor=\"start\" font-weight=\"400\">B · PG 错误码</text><text x=\"1240\" y=\"120\" font-size=\"14.5\" fill=\"#BE653B\" text-anchor=\"middle\" font-weight=\"400\">1</text><text x=\"1054\" y=\"152\" font-size=\"14.5\" fill=\"#1B2B33\" text-anchor=\"start\" font-weight=\"400\">C · 内部库存</text><text x=\"1240\" y=\"152\" font-size=\"14.5\" fill=\"#BE653B\" text-anchor=\"middle\" font-weight=\"400\">2</text><text x=\"1054\" y=\"184\" font-size=\"14.5\" fill=\"#1B2B33\" text-anchor=\"start\" font-weight=\"400\">A · 退货政策</text><text x=\"1240\" y=\"184\" font-size=\"14.5\" fill=\"#BE653B\" text-anchor=\"middle\" font-weight=\"400\">3</text><text x=\"1054\" y=\"214\" font-size=\"11.5\" fill=\"#89938F\" text-anchor=\"start\" font-weight=\"400\">（未进入 TopN 记 0）</text><rect x=\"410\" y=\"20\" width=\"580\" height=\"214\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#7BA6AF\" stroke-width=\"1\"/><text x=\"700\" y=\"56\" font-size=\"19\" fill=\"#245A6B\" text-anchor=\"middle\" font-weight=\"700\" class=\"serif\">RRF：只排名次，不碰分数</text><text x=\"700\" y=\"96\" font-size=\"15\" fill=\"#1B2B33\" text-anchor=\"middle\" font-weight=\"400\" class=\"mono\">rrf = 1/(k + r_lex) + 1/(k + r_sem)</text><text x=\"700\" y=\"130\" font-size=\"14\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\">k = 60（常见起点）</text><text x=\"700\" y=\"162\" font-size=\"13.5\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\">k 越大：头部优势越平滑</text><text x=\"700\" y=\"190\" font-size=\"13.5\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\">k 越小：rank 1 与 rank 2 差距越大</text><line x1=\"372\" y1=\"120\" x2=\"398\" y2=\"120\" stroke=\"#7BA6AF\" stroke-width=\"1.8\"/><polygon points=\"399,113 406,120 399,127\" fill=\"#7BA6AF\"/><line x1=\"1000\" y1=\"120\" x2=\"1030\" y2=\"120\" stroke=\"#BE653B\" stroke-width=\"1.8\"/><polygon points=\"999,113 992,120 999,127\" fill=\"#BE653B\"/><rect x=\"40\" y=\"250\" width=\"1320\" height=\"170\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"60\" y=\"278\" font-size=\"13.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"600\">分数与最终顺序（随 k 与步骤实时变化）</text><rect x=\"58\" y=\"284\" width=\"26\" height=\"22\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"71\" y=\"300\" font-size=\"13.5\" fill=\"#1B2B33\" text-anchor=\"middle\" font-weight=\"600\">A</text><rect x=\"96\" y=\"287\" width=\"900\" height=\"16\" rx=\"0\" fill=\"#EEF2F1\" stroke=\"#EEF2F1\" stroke-width=\"0\"/><rect id=\"rrfBarA\" x=\"96\" y=\"287\" width=\"0\" height=\"16\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"0\"/><text id=\"rrfScoreA\" x=\"1010\" y=\"300\" font-size=\"13.5\" fill=\"#245A6B\" text-anchor=\"start\" class=\"mono\">—</text><rect x=\"1080\" y=\"285\" width=\"250\" height=\"20\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1100\" y=\"300\" font-size=\"11.5\" fill=\"#89938F\" text-anchor=\"start\" font-weight=\"400\">排名 lex / sem</text><text id=\"rrfRankA\" x=\"1240\" y=\"300\" font-size=\"12\" fill=\"#46585F\" text-anchor=\"start\">—</text><rect x=\"58\" y=\"330\" width=\"26\" height=\"22\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"71\" y=\"346\" font-size=\"13.5\" fill=\"#1B2B33\" text-anchor=\"middle\" font-weight=\"600\">B</text><rect x=\"96\" y=\"333\" width=\"900\" height=\"16\" rx=\"0\" fill=\"#EEF2F1\" stroke=\"#EEF2F1\" stroke-width=\"0\"/><rect id=\"rrfBarB\" x=\"96\" y=\"333\" width=\"0\" height=\"16\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"0\"/><text id=\"rrfScoreB\" x=\"1010\" y=\"346\" font-size=\"13.5\" fill=\"#245A6B\" text-anchor=\"start\" class=\"mono\">—</text><rect x=\"1080\" y=\"331\" width=\"250\" height=\"20\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1100\" y=\"346\" font-size=\"11.5\" fill=\"#89938F\" text-anchor=\"start\" font-weight=\"400\">排名 lex / sem</text><text id=\"rrfRankB\" x=\"1240\" y=\"346\" font-size=\"12\" fill=\"#46585F\" text-anchor=\"start\">—</text><rect x=\"58\" y=\"376\" width=\"26\" height=\"22\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"71\" y=\"392\" font-size=\"13.5\" fill=\"#1B2B33\" text-anchor=\"middle\" font-weight=\"600\">C</text><rect x=\"96\" y=\"379\" width=\"900\" height=\"16\" rx=\"0\" fill=\"#EEF2F1\" stroke=\"#EEF2F1\" stroke-width=\"0\"/><rect id=\"rrfBarC\" x=\"96\" y=\"379\" width=\"0\" height=\"16\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"0\"/><text id=\"rrfScoreC\" x=\"1010\" y=\"392\" font-size=\"13.5\" fill=\"#245A6B\" text-anchor=\"start\" class=\"mono\">—</text><rect x=\"1080\" y=\"377\" width=\"250\" height=\"20\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1100\" y=\"392\" font-size=\"11.5\" fill=\"#89938F\" text-anchor=\"start\" font-weight=\"400\">排名 lex / sem</text><text id=\"rrfRankC\" x=\"1240\" y=\"392\" font-size=\"12\" fill=\"#46585F\" text-anchor=\"start\">—</text></svg>", "ctrl": "<label>k=<input id=\"rrfK\" type=\"number\" min=\"5\" max=\"120\" value=\"60\" step=\"1\"></label><button class=\"btn play\" id=\"rrfPlay\">▶ 播放</button><button class=\"btn\" id=\"rrfTick\">单步</button><button class=\"btn\" id=\"rrfReset\">重置</button><span class=\"out\" id=\"rrfOut\">按「播放」看名次怎样一步步变成 RRF 分数与最终顺序。</span>"}, {"eyebrow": "执行 · 收窄再融合", "title": "两个 TopN 先收窄，再融合，最后回表", "lede": "BM25 TopN → 向量 TopN → 主键合并 → 算 RRF → 回表补字段与最终过滤排序。每一步都为了别让融合层变成全表排序。", "caption": "图 10　五步执行链；下方列出「过滤放哪里」的三条判断，强约束要早进分支。", "bridge": "候选集大小不是随便填的数字——它是成本和召回率之间的那根旋钮。", "notes": "有了分数，整条 SQL 的执行形态就清楚了，一共五步。第一步，词法分支按关键词取 TopN；第二步，向量分支按距离取 TopN；第三步，用主键把两个候选集合并；第四步，算 RRF 或者业务融合分；第五步，回表补字段，做最终过滤和排序。为什么强调前两步一定要先收窄？因为一旦你让融合层去面对全表，排序和回表成本会立刻失控。每一步都在同一个方向使劲：先把候选池压到几十条量级，再谈精细排序。这也解释了为什么候选集大小不是一个随便填的数字——它是成本和召回率之间的那根旋钮。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"40\" y=\"22\" font-size=\"15.5\" fill=\"#1B2B33\" text-anchor=\"start\" font-weight=\"600\" class=\"serif\">五步：每一步都在把候选池压到几十条量级</text><rect x=\"40\" y=\"60\" width=\"244\" height=\"190\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"40\" y=\"60\" width=\"244\" height=\"6\" rx=\"0\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"0\"/><text x=\"58\" y=\"104\" font-size=\"30\" fill=\"#47808D\" text-anchor=\"start\" font-weight=\"700\" class=\"mono\">01</text><text x=\"58\" y=\"146\" font-size=\"18\" fill=\"#1B2B33\" text-anchor=\"start\" font-weight=\"700\" class=\"serif\">词法分支</text><text x=\"58\" y=\"180\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">按关键词取 TopN</text><text x=\"58\" y=\"222\" font-size=\"11.5\" fill=\"#89938F\" text-anchor=\"start\" font-weight=\"400\">TopN→合并→排序</text><line x1=\"286\" y1=\"155\" x2=\"300\" y2=\"155\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"301,148 308,155 301,162\" fill=\"#245A6B\"/><rect x=\"308\" y=\"60\" width=\"244\" height=\"190\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"308\" y=\"60\" width=\"244\" height=\"6\" rx=\"0\" fill=\"#74A5AD\" stroke=\"#74A5AD\" stroke-width=\"0\"/><text x=\"326\" y=\"104\" font-size=\"30\" fill=\"#74A5AD\" text-anchor=\"start\" font-weight=\"700\" class=\"mono\">02</text><text x=\"326\" y=\"146\" font-size=\"18\" fill=\"#1B2B33\" text-anchor=\"start\" font-weight=\"700\" class=\"serif\">向量分支</text><text x=\"326\" y=\"180\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">按距离取 TopN</text><text x=\"326\" y=\"222\" font-size=\"11.5\" fill=\"#89938F\" text-anchor=\"start\" font-weight=\"400\">TopN→合并→排序</text><line x1=\"554\" y1=\"155\" x2=\"568\" y2=\"155\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"569,148 576,155 569,162\" fill=\"#245A6B\"/><rect x=\"576\" y=\"60\" width=\"244\" height=\"190\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"576\" y=\"60\" width=\"244\" height=\"6\" rx=\"0\" fill=\"#A4C4C6\" stroke=\"#A4C4C6\" stroke-width=\"0\"/><text x=\"594\" y=\"104\" font-size=\"30\" fill=\"#A4C4C6\" text-anchor=\"start\" font-weight=\"700\" class=\"mono\">03</text><text x=\"594\" y=\"146\" font-size=\"18\" fill=\"#1B2B33\" text-anchor=\"start\" font-weight=\"700\" class=\"serif\">主键合并</text><text x=\"594\" y=\"180\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">COALESCE / FULL JOIN</text><text x=\"594\" y=\"222\" font-size=\"11.5\" fill=\"#89938F\" text-anchor=\"start\" font-weight=\"400\">TopN→合并→排序</text><line x1=\"822\" y1=\"155\" x2=\"836\" y2=\"155\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"837,148 844,155 837,162\" fill=\"#245A6B\"/><rect x=\"844\" y=\"60\" width=\"244\" height=\"190\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"844\" y=\"60\" width=\"244\" height=\"6\" rx=\"0\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"0\"/><text x=\"862\" y=\"104\" font-size=\"30\" fill=\"#2F7A66\" text-anchor=\"start\" font-weight=\"700\" class=\"mono\">04</text><text x=\"862\" y=\"146\" font-size=\"18\" fill=\"#1B2B33\" text-anchor=\"start\" font-weight=\"700\" class=\"serif\">计算融合分</text><text x=\"862\" y=\"180\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">RRF 或业务分</text><text x=\"862\" y=\"222\" font-size=\"11.5\" fill=\"#89938F\" text-anchor=\"start\" font-weight=\"400\">TopN→合并→排序</text><line x1=\"1090\" y1=\"155\" x2=\"1104\" y2=\"155\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"1105,148 1112,155 1105,162\" fill=\"#245A6B\"/><rect x=\"1112\" y=\"60\" width=\"244\" height=\"190\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"1112\" y=\"60\" width=\"244\" height=\"6\" rx=\"0\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"0\"/><text x=\"1130\" y=\"104\" font-size=\"30\" fill=\"#245A6B\" text-anchor=\"start\" font-weight=\"700\" class=\"mono\">05</text><text x=\"1130\" y=\"146\" font-size=\"18\" fill=\"#1B2B33\" text-anchor=\"start\" font-weight=\"700\" class=\"serif\">回表排序</text><text x=\"1130\" y=\"180\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">补字段 · 最终过滤</text><text x=\"1130\" y=\"222\" font-size=\"11.5\" fill=\"#89938F\" text-anchor=\"start\" font-weight=\"400\">TopN→合并→排序</text><rect x=\"40\" y=\"274\" width=\"1320\" height=\"140\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#7BA6AF\" stroke-width=\"1\"/><text x=\"64\" y=\"310\" font-size=\"18\" fill=\"#245A6B\" text-anchor=\"start\" font-weight=\"600\" class=\"serif\">过滤放哪里，决定了这条链是否既安全又便宜：</text><text x=\"64\" y=\"346\" font-size=\"15\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">· 强约束（租户 / 权限 / 软删除 / 状态）→ 尽早进入两个分支</text><text x=\"64\" y=\"378\" font-size=\"15\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">· 会改变分布的过滤（价格 / 时间 / 品类）→ 用真实数据测放哪边</text><text x=\"64\" y=\"406\" font-size=\"15\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">· 深分页 → 游标 / 搜索会话缓存 / 扩大候选后稳定排序，别各自深 offset</text></svg>", "ctrl": null}, {"eyebrow": "执行 · 过滤位置决策", "title": "强约束早进分支，改变分布的要实测", "lede": "租户、权限、软删除、状态这些强约束尽早进两个分支；价格、时间、品类放分支内还是融合后，用真实数据测；深分页别各自 offset。", "caption": "图 11　三类过滤的放置决策树：强约束、分布型过滤、分页各走一条路，最后汇向同一个目标。", "bridge": "这三类分开处理，结果既安全又可控。", "notes": "那过滤到底放哪儿？这是实操里最容易翻车的地方，分三类看。第一类，租户、权限、软删除、状态这种强约束，原则上尽早塞进两个分支——你绝不能先召回一堆无权结果再丢掉，那既是浪费也是风险。第二类，价格、时间、品类这种会显著改变候选分布的过滤，没有标准答案，必须用真实数据测：放分支内可能影响索引路径，放融合后又可能候选不足。第三类，分页，千万别对两个分支各自深 offset 再融合，那会把两个索引的读取成本同时放大；正确的做法是游标、搜索会话缓存，或者扩大候选之后做一次稳定排序。这三类分开处理，结果既安全又可控。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"560\" y=\"30\" width=\"280\" height=\"74\" rx=\"0\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\"/><text x=\"700.0\" y=\"72.95\" font-size=\"17\" fill=\"#FFFFFF\" text-anchor=\"middle\" font-weight=\"600\">待过滤条件</text><rect x=\"40\" y=\"150\" width=\"400\" height=\"150\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#7BA6AF\" stroke-width=\"1\"/><text x=\"240.0\" y=\"204.0\" font-size=\"17\" fill=\"#245A6B\" text-anchor=\"middle\" font-weight=\"600\">强约束</text><text x=\"240.0\" y=\"223.5\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\">租户 · 权限 · 软删除 · 状态</text><text x=\"240.0\" y=\"241.7\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\">→ 尽早进入两个分支</text><text x=\"240.0\" y=\"259.9\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\">避免无权结果进候选池</text><polyline points=\"700,104 700,126 240.0,126 240.0,150\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><rect x=\"500\" y=\"150\" width=\"400\" height=\"150\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#AE8A3E\" stroke-width=\"1\"/><text x=\"700.0\" y=\"204.0\" font-size=\"17\" fill=\"#AE8A3E\" text-anchor=\"middle\" font-weight=\"600\">改变分布的过滤</text><text x=\"700.0\" y=\"223.5\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\">价格 · 时间 · 品类</text><text x=\"700.0\" y=\"241.7\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\">→ 用真实数据实测</text><text x=\"700.0\" y=\"259.9\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\">分支内 or 融合后</text><polyline points=\"700,104 700,126 700.0,126 700.0,150\" fill=\"none\" stroke=\"#AE8A3E\" stroke-width=\"1.8\"/><rect x=\"960\" y=\"150\" width=\"400\" height=\"150\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#BE653B\" stroke-width=\"1\"/><text x=\"1160.0\" y=\"204.0\" font-size=\"17\" fill=\"#BE653B\" text-anchor=\"middle\" font-weight=\"600\">分页</text><text x=\"1160.0\" y=\"223.5\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\">不要各自深 offset</text><text x=\"1160.0\" y=\"241.7\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\">→ 游标 / 会话缓存</text><text x=\"1160.0\" y=\"259.9\" font-size=\"13\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\">扩大候选后稳定排序</text><polyline points=\"700,104 700,126 1160.0,126 1160.0,150\" fill=\"none\" stroke=\"#BE653B\" stroke-width=\"1.8\"/><rect x=\"40\" y=\"326\" width=\"1320\" height=\"88\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#7BA6AF\" stroke-width=\"1\"/><text x=\"64\" y=\"360\" font-size=\"17\" fill=\"#245A6B\" text-anchor=\"start\" font-weight=\"600\" class=\"serif\">共同目标：结果既安全（不该看的进不来）又便宜（不让融合层扫全表）。</text><text x=\"64\" y=\"394\" font-size=\"14\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">强约束漏控是风险；分布型过滤放错是性能；深分页是把两个索引成本一起放大。</text></svg>", "ctrl": null}, {"eyebrow": "写入 · 容易被忽略的成本", "title": "一次内容更新，至少惊动两个索引", "lede": "文本改了动倒排，embedding 改了动 HNSW/IVFFlat，权限状态改了可能影响分区，删除还要处理死元组与 segment 可见性。", "caption": "图 12　一次更新扇出到四条维护路径；下方结论：读多写少才划算，高频写入要配套一整套补偿机制。", "bridge": "如果内容高频更新、embedding 异步生成、权限天天变，就得把版本字段、后台补偿、重嵌入队列这一整套都设计进去。", "notes": "很多人只盯着查询，忘了写入这一侧。一次文档更新，至少惊动两个索引：文本字段改了，BM25 的倒排结构和字段统计要跟着动；embedding 改了，HNSW 图或 IVFFlat 桶要跟着动；权限或状态改了，如果你的索引、分区或部分索引依赖这些字段，检索路径也会被波及；删除更麻烦，两个索引都要处理死元组、segment 可见性、VACUUM 或 merge。所以混合搜索天生适合读多写少或中等写入的在线检索。要是你的内容高频更新、embedding 异步生成、权限天天变，就得把版本字段、后台补偿、重嵌入队列、重建窗口和质量回归测试这一整套都设计进去，否则迟早在写入侧出问题。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"560\" y=\"38\" width=\"280\" height=\"76\" rx=\"0\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\"/><text x=\"700.0\" y=\"81.95\" font-size=\"17\" fill=\"#FFFFFF\" text-anchor=\"middle\" font-weight=\"600\">一次文档更新</text><rect x=\"40\" y=\"180\" width=\"300\" height=\"110\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#47808D\" stroke-width=\"1\"/><text x=\"190.0\" y=\"219.6\" font-size=\"16\" fill=\"#47808D\" text-anchor=\"middle\" font-weight=\"600\">文本字段变更</text><text x=\"190.0\" y=\"237.6\" font-size=\"12\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\">BM25 倒排结构与字段统计</text><polyline points=\"700,114 700,148 190,148 190,180\" fill=\"none\" stroke=\"#47808D\" stroke-width=\"1.8\"/><rect x=\"380\" y=\"180\" width=\"300\" height=\"110\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#74A5AD\" stroke-width=\"1\"/><text x=\"530.0\" y=\"219.6\" font-size=\"16\" fill=\"#74A5AD\" text-anchor=\"middle\" font-weight=\"600\">embedding 变更</text><text x=\"530.0\" y=\"237.6\" font-size=\"12\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\">HNSW 图 / IVFFlat 桶</text><polyline points=\"700,114 700,148 530,148 530,180\" fill=\"none\" stroke=\"#74A5AD\" stroke-width=\"1.8\"/><rect x=\"720\" y=\"180\" width=\"300\" height=\"110\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#AE8A3E\" stroke-width=\"1\"/><text x=\"870.0\" y=\"219.6\" font-size=\"16\" fill=\"#AE8A3E\" text-anchor=\"middle\" font-weight=\"600\">权限 / 状态变更</text><text x=\"870.0\" y=\"237.6\" font-size=\"12\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\">可能影响分区 / 部分索引</text><polyline points=\"700,114 700,148 870,148 870,180\" fill=\"none\" stroke=\"#AE8A3E\" stroke-width=\"1.8\"/><rect x=\"1060\" y=\"180\" width=\"300\" height=\"110\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#BE653B\" stroke-width=\"1\"/><text x=\"1210.0\" y=\"219.6\" font-size=\"16\" fill=\"#BE653B\" text-anchor=\"middle\" font-weight=\"600\">删除</text><text x=\"1210.0\" y=\"237.6\" font-size=\"12\" fill=\"#46585F\" text-anchor=\"middle\" font-weight=\"400\">死元组 · segment 可见性 · VACUUM / merge</text><polyline points=\"700,114 700,148 1210,148 1210,180\" fill=\"none\" stroke=\"#BE653B\" stroke-width=\"1.8\"/><rect x=\"40\" y=\"320\" width=\"1320\" height=\"100\" rx=\"0\" fill=\"#E5EFF0\" stroke=\"#7BA6AF\" stroke-width=\"1\"/><text x=\"64\" y=\"354\" font-size=\"18\" fill=\"#245A6B\" text-anchor=\"start\" font-weight=\"600\" class=\"serif\">结论：适合读多写少或中等写入的在线检索。</text><text x=\"64\" y=\"390\" font-size=\"14.5\" fill=\"#46585F\" text-anchor=\"start\" font-weight=\"400\">高频更新 / embedding 异步 / 权限常变 → 版本字段、后台补偿、重嵌入队列、重建窗口、质量回归测试。</text></svg>", "ctrl": null}, {"eyebrow": "横向 · 四种方案对比", "title": "没有谁替代谁，只是复杂度放在哪里", "lede": "原生全文+pgvector、ParadeDB+pgvector、外部搜索引擎+向量库、只用向量——区别只在复杂度落在数据库还是同步链路。", "caption": "图 13　四种方案的五维对比矩阵；选型的核心问题：复杂度放在数据库节点，还是同步链路。", "bridge": "中小规模、强一致，先留在 PostgreSQL 往往更划算。", "notes": "横向看一眼四种方案，你会发现核心问题不是谁替代谁，而是复杂度放在哪里。原生全文加 pgvector，依赖最少，适合轻中量、强一致的搜索。ParadeDB 加 pgvector，词法能力更强，仍然留在 PostgreSQL 里做 SQL 组合，代价是扩展索引维护更重。外部搜索引擎加向量库，能力最强，但同步链路、幂等、删除、权限漂移、备份恢复全都要自己扛。只用向量搜索，上手最快，适合 FAQ 和相似推荐，但碰到专名、数字、错误码就露怯。所以选型的真正问题是：你的团队愿意把复杂度放在数据库节点上，还是放在一条长长的同步链路上？中小规模、强一致，先留在 PostgreSQL 往往更划算。", "svg": "<svg class=\"figure\" viewBox=\"0 0 1400 430\" width=\"1400\" height=\"430\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"40\" y=\"52\" width=\"260\" height=\"42\" rx=\"0\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"0\"/><text x=\"170\" y=\"80\" font-size=\"14\" fill=\"#FFFFFF\" text-anchor=\"middle\" font-weight=\"600\">维度</text><rect x=\"300\" y=\"52\" width=\"250\" he
