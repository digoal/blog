<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数据库筑基课 · 再谈混合搜索｜演说稿</title>
<!-- 单文件交付：所有原理图均为现场绘制的内联 SVG，无外部图片、字体、脚本依赖。 -->
<style>
:root{
  --bg:#F7F6F2; --paper2:#F1EFE9; --ink:#1B2B33; --ink2:#46585F; --muted:#89938F; --line:#D9D5CB;
  --primary:#245A6B; --prim-l:#E5EFF0; --accent:#BE653B; --acc-l:#F7E9DE;
  --green:#2F7A66; --green-l:#E4F0EA; --gold:#AE8A3E;
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --npw:clamp(520px,42vw,760px);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#E9E7E1}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
#viewport{position:absolute;inset:0 0 58px 0;overflow:hidden;background:#E9E7E1;transition:background .3s}
#stage{position:absolute;width:1600px;height:900px;background:var(--bg);transform-origin:top left;
  box-shadow:0 18px 60px rgba(27,43,51,.13);
  transition:transform .38s cubic-bezier(.2,.7,.2,1),left .38s cubic-bezier(.2,.7,.2,1),top .38s cubic-bezier(.2,.7,.2,1)}
.slide{position:absolute;inset:0;display:none}
.slide.on{display:block;animation:fadein .42s cubic-bezier(.2,.7,.2,1)}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{position:absolute;left:64px;top:44px;font-size:13px;letter-spacing:3.4px;
  color:var(--primary);font-weight:600}
.eyebrow .num{font-family:var(--mono);letter-spacing:1px;color:var(--accent);margin-right:14px}
h1.title{position:absolute;left:64px;top:70px;margin:0;font-family:var(--serif);
  font-size:44px;line-height:1.25;font-weight:700;letter-spacing:1px;color:var(--ink)}
.lede{position:absolute;left:64px;top:139px;width:1440px;font-size:19px;color:var(--ink2);
  line-height:1.5;letter-spacing:.3px}
.rule{position:absolute;left:64px;top:181px;width:1472px;height:1px;background:var(--line)}
.figwrap{position:absolute;left:100px;top:198px;width:1400px;height:430px}
svg.figure{display:block;overflow:visible}
svg.figure text{font-family:var(--sans)}
svg.figure text.serif{font-family:var(--serif)}
svg.figure text.mono{font-family:var(--mono)}
.caption{position:absolute;left:100px;top:638px;width:1400px;font-size:13px;
  color:var(--muted);letter-spacing:.4px}
.bridge{position:absolute;left:64px;top:706px;width:1472px;font-size:20px;
  color:var(--accent);line-height:1.55;letter-spacing:.4px;padding-left:18px;
  border-left:3px solid var(--accent);font-family:var(--serif)}
.bridge .bk{font-family:var(--sans);font-size:13px;color:var(--muted);
  letter-spacing:2px;display:block;margin-bottom:2px}
.footer{position:absolute;left:64px;top:846px;width:1472px;height:1px;background:var(--line)}
.footer .fl{position:absolute;left:0;top:14px;font-size:12.5px;color:var(--muted);letter-spacing:2px}
.footer .fr{position:absolute;right:0;top:12px;font-family:var(--mono);font-size:14px;color:var(--ink2)}
.footer .fbar{position:absolute;left:0;right:0;top:-1px;height:2px;background:transparent}
.footer .fbar i{display:block;height:2px;background:var(--primary);width:0;transition:width .4s ease}

/* 动画控件：独立条带，绝不压图 */
.ctrls{position:absolute;left:100px;top:638px;width:1400px;height:46px;display:flex;
  align-items:center;gap:11px}
.ctrls label{font-size:13.5px;color:var(--ink2);white-space:nowrap}
.ctrls select,.ctrls input[type=range]{font-family:var(--sans);font-size:13.5px;color:var(--ink);
  background:#fff;border:1px solid var(--line);border-radius:4px;padding:5px 8px;outline:none}
.ctrls input[type=range]{width:150px;padding:0;accent-color:var(--primary);border:none;background:transparent}
.ctrls .btn{min-height:30px;padding:5px 13px;border:1px solid var(--primary);border-radius:4px;
  background:#fff;color:var(--primary);font-size:13.5px;cursor:pointer;font-family:var(--sans)}
.ctrls .btn.play{background:var(--primary);color:#fff}
.ctrls .btn:hover{filter:brightness(.94)}
.ctrls .out{font-size:13.5px;color:var(--ink2);margin-left:auto;min-width:0;flex:1;
  max-width:600px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrls .out b{color:var(--accent);font-weight:600}

/* 底部控制条：全屏后依然显示，快捷键常驻 */
.chrome{position:fixed;left:0;right:0;bottom:0;height:58px;background:#FCFBF8;
  border-top:1px solid var(--line);display:flex;align-items:center;gap:7px;
  padding:0 18px;z-index:40;font-size:13px;color:var(--ink2)}
.chrome .sep{width:1px;height:22px;background:var(--line);margin:0 5px}
.chrome button{font-family:var(--sans);font-size:13px;color:var(--ink2);background:transparent;
  border:1px solid transparent;border-radius:5px;padding:7px 10px;cursor:pointer;white-space:nowrap}
.chrome button:hover{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome button.act{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome .pg{font-family:var(--mono);font-size:14px;color:var(--ink);min-width:76px;text-align:center}
.chrome .track{flex:1;height:3px;background:var(--line);border-radius:3px;margin:0 10px;position:relative}
.chrome .track i{position:absolute;left:0;top:0;height:3px;background:var(--primary);border-radius:3px;transition:width .35s}
.chrome .hint{font-size:12px;color:var(--muted);white-space:nowrap}
body.immersive #viewport{background:var(--bg)}
body.immersive #stage{box-shadow:none}

/* 页内讲稿窗：不弹窗，右侧开窗；原页面矢量缩放到左侧 */
#notesPanel{position:absolute;top:0;right:0;bottom:0;width:0;background:#FCFBF7;
  border-left:1px solid var(--line);z-index:30;overflow:hidden;
  box-shadow:-14px 0 40px rgba(27,43,51,.10);transition:width .38s cubic-bezier(.2,.7,.2,1)}
body.notes-on #notesPanel{width:var(--npw)}
#notesInner{position:absolute;inset:0;width:var(--npw);display:flex;flex-direction:column}
.nhead{flex:0 0 auto;padding:24px 30px 16px;border-bottom:1px solid var(--line);background:var(--bg)}
.nhead .nkicker{font-family:var(--mono);font-size:12px;letter-spacing:2px;color:var(--accent)}
.nhead h2{font-family:var(--serif);font-size:26px;line-height:1.35;margin:8px 0 12px;color:var(--ink)}
.ntabs{display:flex;gap:8px;flex-wrap:wrap}
.ntabs button{font-family:var(--sans);font-size:12.5px;padding:6px 11px;border-radius:4px;
  border:1px solid var(--line);background:#fff;color:var(--ink2);cursor:pointer}
.ntabs button.act{background:var(--primary);border-color:var(--primary);color:#fff}
#noteBody{position:relative;flex:1;overflow:auto;padding:22px 30px 70px;scroll-behavior:smooth}
.nsec{border-bottom:1px solid var(--line);padding:0 0 26px;margin:0 0 26px;scroll-margin-top:8px}
.nsec:last-child{border-bottom:none}
.nsec .sn{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:1.5px}
.nsec h3{font-family:var(--serif);font-size:19px;line-height:1.45;color:var(--primary);margin:6px 0 12px}
.nsec p{margin:0;font-size:15.5px;line-height:2.0;color:var(--ink2);letter-spacing:.2px}
.nsec .nb{margin-top:12px;font-family:var(--serif);font-size:15px;color:var(--accent);
  border-left:3px solid var(--accent);padding-left:12px;line-height:1.7}
.nsec.cur{background:#F3F7F6;margin:-12px -14px 20px;padding:12px 14px 22px;border-left:3px solid var(--green)}
.tocgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tocgrid a{display:block;padding:12px;border:1px solid var(--line);border-radius:5px;background:#fff;
  cursor:pointer;transition:.18s}
.tocgrid a:hover{border-color:var(--primary);background:var(--prim-l)}
.tocgrid a.tcur{border-color:var(--accent);background:var(--acc-l)}
.tocgrid .gn{font-family:var(--mono);font-size:11.5px;color:var(--accent)}
.tocgrid .gt{display:block;font-family:var(--serif);font-size:14.5px;line-height:1.45;margin-top:4px;color:var(--ink)}
.keys{display:grid;grid-template-columns:1fr;gap:10px;font-size:14.5px;line-height:1.7}
.keys kbd{font-family:var(--mono);background:#fff;border:1px solid var(--line);
  border-bottom-width:2px;border-radius:4px;padding:2px 7px;color:var(--primary);margin-right:10px}
.toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);background:var(--ink);
  color:#fff;font-size:13px;padding:9px 16px;border-radius:5px;opacity:0;transition:.3s;z-index:80;pointer-events:none}
.toast.on{opacity:1}
@media print{.chrome,#notesPanel,.toast{display:none!important}#viewport{position:static}
  #stage{position:static;transform:none!important;box-shadow:none}
  .slide{display:block!important;page-break-after:always;position:relative;height:900px}}
</style>
</head>
<body>
<div id="viewport">
  <div id="stage"><div id="slides"></div></div>
  <aside id="notesPanel"><div id="notesInner"></div></aside>
</div>
<div class="chrome">
  <button id="btnPrev">← 上一页</button>
  <button id="btnNext">下一页 →</button>
  <span class="pg">01 / 20</span>
  <div class="track" id="track"><i></i></div>
  <div class="sep"></div>
  <button id="btnToc">目录 G</button>
  <button id="btnNotes">本页讲稿 N</button>
  <button id="btnAll">全文讲稿 T</button>
  <button id="btnAuto">▶ 自动播放</button>
  <button id="btnFs">全屏 F</button>
  <button id="btnHelp" class="hint">? 快捷键</button>
</div>
<div class="toast" id="toast"></div>
<script>
const D = [{"eyebrow":"开场 · THE CLAIM","title":"再谈混合搜索：把搜索体系留在 PostgreSQL 内","lede":"关键价值不是「又多了三个扩展」，而是把搜索必须面对的三类问题拆开，放回同一条可验证的链路。","caption":"图 1：三件套分工——文本表示、词法相关性、向量相似度；SQL 层负责合并与业务约束。","bridge":"先看它到底想解决什么——「表达不稳」与「结果要稳」之间的张力。","notes":"上一篇讲的是通用混合搜索：BM25 管词法召回，向量管语义召回，SQL 层用 RRF 或重排把两个候选集合并。那更像一张方法论总图。今天换一个角度：如果把搜索体系尽量留在 PostgreSQL 内，用 TensorChord 的三个开源项目组合，架构会长什么样？这三个项目分别是 pg_tokenizer.rs、VectorChord-bm25 和 VectorChord。先说清楚 conclusion：它们的关键价值不是「又多了三个扩展」，而是把搜索系统必须面对的三类问题拆开了——文本怎么切、关键词怎么排序、语义怎么低成本召回。我们沿着这条分工链往下走，每一步都能看到对应的组件和代价。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"360\" y=\"32\" width=\"220\" height=\"86\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"470.0\" y=\"67.85\" class=\"sv s\" text-anchor=\"middle\" font-size=\"19.0\" fill=\"#245A6B\" font-weight=\"600\" >用户查询</text><text x=\"470.0\" y=\"92.55\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >词 + 意图 + 业务过滤</text><line x1=\"470\" y1=\"118\" x2=\"470\" y2=\"160\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><line x1=\"470\" y1=\"160\" x2=\"250\" y2=\"160\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><line x1=\"250\" y1=\"160\" x2=\"250\" y2=\"196\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><line x1=\"250\" y1=\"160\" x2=\"250\" y2=\"189.6\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"250,196 245.6,188 254.4,188\" fill=\"#245A6B\"/><line x1=\"470\" y1=\"118\" x2=\"470\" y2=\"160\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><line x1=\"470\" y1=\"160\" x2=\"700\" y2=\"160\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><line x1=\"700\" y1=\"160\" x2=\"700\" y2=\"196\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><line x1=\"700\" y1=\"160\" x2=\"700\" y2=\"189.6\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"700,196 695.6,188 704.4,188\" fill=\"#245A6B\"/><line x1=\"470\" y1=\"118\" x2=\"470\" y2=\"160\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><line x1=\"470\" y1=\"160\" x2=\"1150\" y2=\"160\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><line x1=\"1150\" y1=\"160\" x2=\"1150\" y2=\"196\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><line x1=\"1150\" y1=\"160\" x2=\"1150\" y2=\"189.6\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"1150,196 1145.6,188 1154.4,188\" fill=\"#245A6B\"/><rect x=\"90\" y=\"196\" width=\"320\" height=\"96\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"250.0\" y=\"236.85\" class=\"sv s\" text-anchor=\"middle\" font-size=\"19.0\" fill=\"#1B2B33\" font-weight=\"600\" >pg_tokenizer.rs</text><text x=\"250.0\" y=\"261.55\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >文本表示：把词切稳、映射 token id</text><rect x=\"540\" y=\"196\" width=\"320\" height=\"96\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#BE653B\" stroke-width=\"1.1\" /><text x=\"700.0\" y=\"236.85\" class=\"sv s\" text-anchor=\"middle\" font-size=\"19.0\" fill=\"#1B2B33\" font-weight=\"600\" >VectorChord-bm25</text><text x=\"700.0\" y=\"261.55\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >词法召回：BM25 + Block-WEAK-AND</text><rect x=\"990\" y=\"196\" width=\"320\" height=\"96\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"1150.0\" y=\"236.85\" class=\"sv s\" text-anchor=\"middle\" font-size=\"19.0\" fill=\"#1B2B33\" font-weight=\"600\" >VectorChord</text><text x=\"1150.0\" y=\"261.55\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >语义召回：vchordrq / vchordg</text><line x1=\"250\" y1=\"292\" x2=\"250\" y2=\"325.6\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"250,332 245.6,324 254.4,324\" fill=\"#245A6B\"/><line x1=\"700\" y1=\"292\" x2=\"700\" y2=\"325.6\" stroke=\"#BE653B\" stroke-width=\"1.8\"/><polygon points=\"700,332 695.6,324 704.4,324\" fill=\"#BE653B\"/><line x1=\"1150\" y1=\"292\" x2=\"1150\" y2=\"325.6\" stroke=\"#2F7A66\" stroke-width=\"1.8\"/><polygon points=\"1150,332 1145.6,324 1154.4,324\" fill=\"#2F7A66\"/><rect x=\"90\" y=\"332\" width=\"1220\" height=\"72\" rx=\"4\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.0\" /><text x=\"108\" y=\"374.3\" class=\"sv s\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#FFFFFF\" font-weight=\"600\" >PostgreSQL · SQL 融合层</text><text x=\"416\" y=\"372.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#FFFFFF\" font-weight=\"400\" >RRF / 加权 / 重排 · 租户与权限过滤 · 事务可见性 · 回表字段</text><text x=\"90\" y=\"420\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >三个扩展解决三类问题；最终结果仍在 SQL 层合并，因此仍按数据库方式处理。</text></svg>","ctrl":null},{"eyebrow":"困境 · TWO BLIND SPOTS","title":"两条召回路，各有各的盲区","lede":"关键词怕词面不一致，向量怕精确实体被稀释——这是两种完全不同的失败模式。","caption":"图 2：左列为词法盲区，右列为语义盲区；二者无法通过「调参」互相替代。","bridge":"于是问题被重述：如何让两条路在同一条可验证链路里协作。","notes":"混合搜索解决的是「用户表达不稳定，但业务结果必须稳定」。先只看关键词：它最怕词面不一致。用户说「登录不了」，文档写「认证失败」；用户说「退钱」，文档写「退款政策」。BM25 能解释为什么命中，但它不能天然理解同义表达。再只看向量：它最怕精确实体被稀释。错误码、SKU、型号、函数名、数据库参数、版本号、专有名词，往往要求字面命中优先。向量距离能找到「意思像」的内容，但不保证 PG::UndefinedTable、vchordrq.epsilon、BM25 这些词面对象排在最前。请注意一个要点：这两个盲区不是「谁更准」的问题，而是失败模式完全不同。所以答案不是把某个分支调到极致，而是让它们互补。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"60\" y=\"44\" width=\"580\" height=\"190\" rx=\"5\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.1\" /><text x=\"350.0\" y=\"131.3\" class=\"sv s\" text-anchor=\"middle\" font-size=\"20.0\" fill=\"#BE653B\" font-weight=\"600\" >只用关键词搜索：怕词面不一致</text><text x=\"350.0\" y=\"157.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\" >用户「登录不了」 / 文档「认证失败」\n用户「退钱」 / 文档「退款政策」</text><rect x=\"760\" y=\"44\" width=\"580\" height=\"190\" rx=\"5\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.1\" /><text x=\"1050.0\" y=\"131.61938872970393\" class=\"sv s\" text-anchor=\"middle\" font-size=\"20.0\" fill=\"#BE653B\" font-weight=\"600\" >只用向量搜索：怕实体被稀释</text><text x=\"1050.0\" y=\"157.1160458452722\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.4\" fill=\"#1B2B33\" font-weight=\"400\" >错误码、SKU、型号、函数名、参数名\nPG::UndefinedTable / vchordrq.epsilon / BM25</text><rect x=\"60\" y=\"268\" width=\"1280\" height=\"72\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"78\" y=\"309.95\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"600\" >BM25 能解释「为什么命中」</text><text x=\"386\" y=\"308.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >但天然不理解同义表达；词面不同就召回不到。</text><rect x=\"60\" y=\"348\" width=\"1280\" height=\"64\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1.0\" /><text x=\"78\" y=\"385.95\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#2F7A66\" font-weight=\"600\" >向量距离能找到「意思像」</text><text x=\"386\" y=\"384.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >但不保证精确词面对象排在最前——专名需要字面优先。</text><text x=\"60\" y=\"424\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >注意：盲区不是「谁更准」，而是两类失败模式完全不同，因此必须互补。</text></svg>","ctrl":null},{"eyebrow":"问题 · THE REAL QUESTION","title":"结果不是文档，是带约束的业务行","lede":"把两者放进 PostgreSQL 还有一个现实动机：搜索结果不是孤立文档，而是一次带过滤的业务查询。","caption":"图 3：六个业务约束同时作用于搜索结果；代价是同一份文档要维护多套表示。","bridge":"代价同样明确：写入、更新、VACUUM、REINDEX、模型升级都更复杂。","notes":"把两者放在 PostgreSQL 内，还有一个现实动机：搜索结果不是孤立文档，而是业务行。一次搜索通常还要叠加租户和权限、上下架和删除和审核状态、时间范围地区品类价格、版本字段和模型版本词表版本，以及回表后的业务排序和展示字段。所以混合搜索的真正问题，不是「BM25 和向量谁赢」，而是如何让词法召回、语义召回、业务过滤、事务一致性、可观测性和质量评测处在同一条可验证链路里。这里必须把代价也说清楚：同一份文档可能要维护文本、token、BM25 表示、embedding、两个索引和一套融合逻辑。写入、更新、删除、VACUUM、REINDEX、模型升级，都会比单一索引更复杂。把它当成「一个普通二级索引」是后面所有坑的源头。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"330\" y=\"30\" width=\"740\" height=\"72\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"700.0\" y=\"58.3\" class=\"sv s\" text-anchor=\"middle\" font-size=\"21.0\" fill=\"#245A6B\" font-weight=\"600\" >一次搜索 = 一条业务行 + 一堆业务约束</text><text x=\"700.0\" y=\"84.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >搜索结果不是孤立文档</text><rect x=\"60\" y=\"138\" width=\"400\" height=\"80\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"260.0\" y=\"170.85\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"600\" >租户和权限</text><text x=\"260.0\" y=\"195.55\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >tenant_id / ACL</text><line x1=\"260\" y1=\"72\" x2=\"260\" y2=\"132.4\" stroke=\"#245A6B\" stroke-width=\"1.4\"/><polygon points=\"260,138 256.15,131 263.85,131\" fill=\"#245A6B\"/><rect x=\"490\" y=\"138\" width=\"400\" height=\"80\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"690.0\" y=\"170.85\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"600\" >上下架与审核</text><text x=\"690.0\" y=\"195.55\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >status / deleted</text><line x1=\"690\" y1=\"72\" x2=\"690\" y2=\"132.4\" stroke=\"#245A6B\" stroke-width=\"1.4\"/><polygon points=\"690,138 686.15,131 693.85,131\" fill=\"#245A6B\"/><rect x=\"920\" y=\"138\" width=\"400\" height=\"80\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"1120.0\" y=\"170.85\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"600\" >时间与品类</text><text x=\"1120.0\" y=\"195.55\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >time / region / price</text><line x1=\"1120\" y1=\"72\" x2=\"1120\" y2=\"132.4\" stroke=\"#245A6B\" stroke-width=\"1.4\"/><polygon points=\"1120,138 1116.15,131 1123.85,131\" fill=\"#245A6B\"/><rect x=\"60\" y=\"234\" width=\"400\" height=\"80\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"260.0\" y=\"266.85\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"600\" >版本字段</text><text x=\"260.0\" y=\"291.55\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >model / vocab version</text><line x1=\"260\" y1=\"234\" x2=\"265.6\" y2=\"234\" stroke=\"#2F7A66\" stroke-width=\"1.4\"/><polygon points=\"260,234 267,230.15 267,237.85\" fill=\"#2F7A66\"/><rect x=\"490\" y=\"234\" width=\"400\" height=\"80\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"690.0\" y=\"266.85\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"600\" >回表展示字段</text><text x=\"690.0\" y=\"291.55\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >排序、标题、摘要</text><line x1=\"690\" y1=\"234\" x2=\"695.6\" y2=\"234\" stroke=\"#2F7A66\" stroke-width=\"1.4\"/><polygon points=\"690,234 697,230.15 697,237.85\" fill=\"#2F7A66\"/><rect x=\"920\" y=\"234\" width=\"400\" height=\"80\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"1120.0\" y=\"266.85\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"600\" >事务可见性</text><text x=\"1120.0\" y=\"291.55\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >同一快照内可见</text><line x1=\"1120\" y1=\"234\" x2=\"1125.6\" y2=\"234\" stroke=\"#2F7A66\" stroke-width=\"1.4\"/><polygon points=\"1120,234 1127,230.15 1127,237.85\" fill=\"#2F7A66\"/><rect x=\"60\" y=\"346\" width=\"1280\" height=\"64\" rx=\"4\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1.0\" /><text x=\"78\" y=\"383.95\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#FFFFFF\" font-weight=\"600\" >真正的问题</text><text x=\"386\" y=\"382.725\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#FFFFFF\" font-weight=\"400\" >让词法召回、语义召回、业务过滤、事务一致性、可观测性、质量评测处在同一条可验证链路里。</text><text x=\"60\" y=\"424\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >把搜索放进 PostgreSQL 的现实动机：结果要参与权限、状态、版本和事务。</text></svg>","ctrl":null},{"eyebrow":"总图 · THE ARCHITECTURE","title":"三件套如何咬合成一条链","lede":"文本表示、词法相关性、语义相似度被拆成三个组件；SQL 层接住两条召回分支。","caption":"图 4：pg_tokenizer 供表示，bm25 与 VectorChord 各出一路 TopN，SQL 层合并。","bridge":"接下来按层拆开：先看整条链的职责与代价分布。","notes":"在本文语境下，混合搜索不是一个单独索引，而是一种 PostgreSQL 内的查询架构。看这张总图：业务表 docs 同时供两条分支使用。pg_tokenizer.rs 把原始文本变成稳定的 token id 数组，它是文本表示层；VectorChord-bm25 把 tsvector 或 token 表示做成 BM25 排名索引，实现 Block-WEAK-AND TopK 检索，它是词法召回层；VectorChord 提供 vchordrq 和 vchordg 两类向量索引，支持近似召回、低比特量化、过滤、重排和多种 I/O 策略，它是语义召回层。两条分支各出一路候选，进入 SQL 融合层做 RRF、加权或模型重排，同时把权限、状态、时间过滤和事务可见性都留在数据库里。图里每一个箭头都对应一个真实的接口点，而不是概念上的「大概如此」。我们下面逐层拆开。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40\" y=\"150\" width=\"220\" height=\"120\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"150.0\" y=\"203.60023041474653\" class=\"sv s\" text-anchor=\"middle\" font-size=\"18.0\" fill=\"#245A6B\" font-weight=\"600\" >业务表 docs</text><text x=\"150.0\" y=\"225.70852534562212\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.6\" fill=\"#46585F\" font-weight=\"400\" >id / tenant / ACL\ntext / vector</text><line x1=\"260\" y1=\"210\" x2=\"293.6\" y2=\"210\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"300,210 292,205.6 292,214.4\" fill=\"#245A6B\"/><line x1=\"300\" y1=\"92\" x2=\"300\" y2=\"338\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><line x1=\"300\" y1=\"92\" x2=\"333.6\" y2=\"92\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"340,92 332,87.6 332,96.4\" fill=\"#245A6B\"/><line x1=\"300\" y1=\"214\" x2=\"333.6\" y2=\"214\" stroke=\"#BE653B\" stroke-width=\"1.8\"/><polygon points=\"340,214 332,209.6 332,218.4\" fill=\"#BE653B\"/><line x1=\"300\" y1=\"338\" x2=\"333.6\" y2=\"338\" stroke=\"#2F7A66\" stroke-width=\"1.8\"/><polygon points=\"340,338 332,333.6 332,342.4\" fill=\"#2F7A66\"/><rect x=\"340\" y=\"50\" width=\"300\" height=\"84\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"490.0\" y=\"84.85\" class=\"sv s\" text-anchor=\"middle\" font-size=\"18.0\" fill=\"#1B2B33\" font-weight=\"600\" >pg_tokenizer.rs</text><text x=\"490.0\" y=\"109.55\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >tokenize(text, name) → token id</text><line x1=\"490\" y1=\"134\" x2=\"490\" y2=\"161.6\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"490,168 485.6,160 494.4,160\" fill=\"#245A6B\"/><rect x=\"340\" y=\"168\" width=\"300\" height=\"92\" rx=\"5\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.1\" /><text x=\"490.0\" y=\"206.85\" class=\"sv s\" text-anchor=\"middle\" font-size=\"18.0\" fill=\"#BE653B\" font-weight=\"600\" >VectorChord-bm25</text><text x=\"490.0\" y=\"231.55\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" >BM25 + Block-WEAK-AND TopK</text><rect x=\"340\" y=\"292\" width=\"300\" height=\"92\" rx=\"5\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"490.0\" y=\"330.85\" class=\"sv s\" text-anchor=\"middle\" font-size=\"18.0\" fill=\"#2F7A66\" font-weight=\"600\" >VectorChord</text><text x=\"490.0\" y=\"355.55\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" >vchordrq / vchordg + rerank</text><line x1=\"640\" y1=\"214\" x2=\"693.6\" y2=\"214\" stroke=\"#BE653B\" stroke-width=\"1.8\"/><polygon points=\"700,214 692,209.6 692,218.4\" fill=\"#BE653B\"/><line x1=\"640\" y1=\"338\" x2=\"693.6\" y2=\"338\" stroke=\"#2F7A66\" stroke-width=\"1.8\"/><polygon points=\"700,338 692,333.6 692,342.4\" fill=\"#2F7A66\"/><line x1=\"700\" y1=\"214\" x2=\"700\" y2=\"338\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><line x1=\"700\" y1=\"266\" x2=\"733.6\" y2=\"266\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"740,266 732,261.6 732,270.4\" fill=\"#245A6B\"/><rect x=\"740\" y=\"208\" width=\"280\" height=\"116\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"880.0\" y=\"259.125\" class=\"sv s\" text-anchor=\"middle\" font-size=\"18.0\" fill=\"#1B2B33\" font-weight=\"600\" >SQL 融合层</text><text x=\"880.0\" y=\"282.875\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >RRF / 加权 / 重排\n过滤 · 回表 · 事务</text><line x1=\"1020\" y1=\"266\" x2=\"1073.6\" y2=\"266\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"1080,266 1072,261.6 1072,270.4\" fill=\"#245A6B\"/><rect x=\"1080\" y=\"208\" width=\"280\" height=\"116\" rx=\"5\" fill=\"#2E6373\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"1220.0\" y=\"258.85\" class=\"sv s\" text-anchor=\"middle\" font-size=\"18.0\" fill=\"#FFFFFF\" font-weight=\"600\" >最终 TopK</text><text x=\"1220.0\" y=\"283.55\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#FFFFFF\" font-weight=\"400\" >可解释 · 可回表 · 可观测</text><text x=\"60\" y=\"420\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >词法分支输出 bm25 rank，语义分支输出 vector rank；融合只相信排名，不混用原始分数。</text></svg>","ctrl":null},{"eyebrow":"分层 · FIVE LAYERS","title":"五层职责，五层代价","lede":"这不是「多装三个扩展」，而是把跨系统复杂度换成数据库内的扩展复杂度。","caption":"图 5：自上而下五层；每一层都写清了主要职责和必须付出的代价。","bridge":"第一层最容易出问题，也最容易被跳过——先把「词」做稳定。","notes":"把这张表当作整篇的骨架。文本表示层由 pg_tokenizer.rs 负责，代价是分词配置、词表版本和连接内对象缓存。词法召回层由 VectorChord-bm25 负责，代价是索引维护、候选上限和过滤位置。语义召回层由 VectorChord 负责，代价是 ANN 召回率、I/O、回表重排和参数调优。SQL 融合层合并两个 TopN，代价是 SQL 复杂度、排序内存和候选不足。运维评测层用 EXPLAIN、日志和离线标注验证质量，它需要持续的数据和流程。注意每一层都有代价，没有一层是「免费」的。TensorChord 三件套不是让搜索零成本，而是把跨系统复杂度换成数据库内的扩展复杂度：你少了同步链路和外部一致性问题，多了 PostgreSQL 节点上的 CPU、I/O、索引维护和参数治理。理解了这一点，才不会在写入变慢时感到意外。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"60\" y=\"20\" width=\"1280\" height=\"64\" rx=\"4\" fill=\"#EBF1EE\" stroke=\"#EBF1EE\" stroke-width=\"1.0\" /><text x=\"78\" y=\"57.95\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"600\" >运维评测层</text><text x=\"386\" y=\"56.725\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >EXPLAIN / 日志 / 离线标注：验证质量、延迟、体积、坏例归因</text><rect x=\"60\" y=\"100\" width=\"1280\" height=\"64\" rx=\"4\" fill=\"#CFE0DC\" stroke=\"#CFE0DC\" stroke-width=\"1.0\" /><text x=\"78\" y=\"137.95\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"600\" >SQL 融合层</text><text x=\"386\" y=\"136.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >合并两个 TopN：RRF、加权、重排｜代价：SQL 复杂度、排序内存、候选不足</text><rect x=\"60\" y=\"180\" width=\"1280\" height=\"64\" rx=\"4\" fill=\"#A4C4C6\" stroke=\"#A4C4C6\" stroke-width=\"1.0\" /><text x=\"78\" y=\"217.95\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"600\" >语义召回层</text><text x=\"386\" y=\"216.2\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >VectorChord：vchordrq / vchordg 做向量 TopK｜代价：召回率、I/O、回表重排、参数</text><rect x=\"60\" y=\"260\" width=\"1280\" height=\"64\" rx=\"4\" fill=\"#74A5AD\" stroke=\"#74A5AD\" stroke-width=\"1.0\" /><text x=\"78\" y=\"297.95\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"600\" >词法召回层</text><text x=\"386\" y=\"296.2\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >VectorChord-bm25：BM25 + 上界剪枝｜代价：索引维护、候选上限、过滤位置</text><rect x=\"60\" y=\"340\" width=\"1280\" height=\"64\" rx=\"4\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1.0\" /><text x=\"78\" y=\"377.95\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#FFFFFF\" font-weight=\"600\" >文本表示层</text><text x=\"386\" y=\"376.025\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#FFFFFF\" font-weight=\"400\" >pg_tokenizer.rs：清洗、分词、停用词、词表映射｜代价：分词配置、词表版本、对象缓存</text><text x=\"60\" y=\"428\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >颜色越深＝越底层；靛青是结构 / 机制，陶橙是矛盾 / 代价，青绿是正确动作。</text></svg>","ctrl":null},{"eyebrow":"表示层 · TOKENIZE","title":"先把「词」这件事做稳定","lede":"很多搜索系统的问题不是 BM25 算错了，而是输入表示一开始就不稳定。","caption":"图 6：字符过滤 → 预分词 → 词过滤 → 模型映射；配置在 catalog，缓存在连接内。","bridge":"表示稳了，再谈三条实践线和那个事务边界。","notes":"很多搜索系统的问题不是 BM25 算错了，而是输入表示一开始就不稳定。中文是否分词？英文是否大小写归一？PostgreSQL、postgres、pg 要不要同义？错误码里的符号是否保留？这些问题如果交给应用层散落处理，后面很难调。pg_tokenizer.rs 的设计是把文本处理做成数据库内对象：TextAnalyzer 负责字符过滤、预分词和 token 过滤；TokenizerModel 把 token 字符串映射到 token id；Tokenizer 把两者组合，对外提供 tokenize(text, tokenizer_name)。源码路径很直接：先 text_analyzer.apply 得到 token 字符串，再 model.apply_batch 得到 token id。配置存在 tokenizer_catalog，并在连接内用对象池缓存。这提高了效率，但也带来一个边界：事务回滚后缓存可能仍然存在，项目文档 docs/07-limitation.md 已经明确提示。表示稳了，BM25 分支才可能命中正确的 token。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"30\" y=\"70\" width=\"180\" height=\"90\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"120.0\" y=\"108.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.5\" fill=\"#245A6B\" font-weight=\"600\" >原始文本</text><text x=\"120.0\" y=\"131.2\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >title / body</text><line x1=\"210\" y1=\"115\" x2=\"240.4\" y2=\"115\" stroke=\"#D9D5CB\" stroke-width=\"1.6\"/><polygon points=\"246,115 239,111.15 239,118.85\" fill=\"#D9D5CB\"/><rect x=\"246\" y=\"70\" width=\"200\" height=\"90\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"346.0\" y=\"108.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.5\" fill=\"#1B2B33\" font-weight=\"600\" >字符过滤</text><text x=\"346.0\" y=\"131.2\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >lowercase</text><line x1=\"446\" y1=\"115\" x2=\"476.4\" y2=\"115\" stroke=\"#D9D5CB\" stroke-width=\"1.6\"/><polygon points=\"482,115 475,111.15 475,118.85\" fill=\"#D9D5CB\"/><rect x=\"482\" y=\"70\" width=\"200\" height=\"90\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"582.0\" y=\"108.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.5\" fill=\"#1B2B33\" font-weight=\"600\" >预分词</text><text x=\"582.0\" y=\"131.2\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >jieba / unicode</text><line x1=\"682\" y1=\"115\" x2=\"712.4\" y2=\"115\" stroke=\"#D9D5CB\" stroke-width=\"1.6\"/><polygon points=\"718,115 711,111.15 711,118.85\" fill=\"#D9D5CB\"/><rect x=\"718\" y=\"70\" width=\"200\" height=\"90\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"818.0\" y=\"108.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.5\" fill=\"#1B2B33\" font-weight=\"600\" >词过滤</text><text x=\"818.0\" y=\"131.2\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >stop / stem / syn</text><line x1=\"918\" y1=\"115\" x2=\"948.4\" y2=\"115\" stroke=\"#D9D5CB\" stroke-width=\"1.6\"/><polygon points=\"954,115 947,111.15 947,118.85\" fill=\"#D9D5CB\"/><rect x=\"954\" y=\"70\" width=\"200\" height=\"90\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"1054.0\" y=\"108.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.5\" fill=\"#1B2B33\" font-weight=\"600\" >模型映射</text><text x=\"1054.0\" y=\"131.2\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >词表映射</text><line x1=\"1154\" y1=\"115\" x2=\"1184.4\" y2=\"115\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><polygon points=\"1190,115 1183,111.15 1183,118.85\" fill=\"#245A6B\"/><rect x=\"1190\" y=\"70\" width=\"180\" height=\"90\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"1280.0\" y=\"108.4\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.5\" fill=\"#245A6B\" font-weight=\"600\" >Vec&lt;u32&gt;</text><text x=\"1280.0\" y=\"131.2\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >token id 数组</text><line x1=\"1054\" y1=\"160\" x2=\"1054\" y2=\"237.6\" stroke=\"#AE8A3E\" stroke-width=\"1.8\"/><polygon points=\"1054,244 1049.6,236 1058.4,236\" fill=\"#AE8A3E\"/><rect x=\"250\" y=\"244\" width=\"900\" height=\"96\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.0\" /><text x=\"268\" y=\"296.9244186046512\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.1\" fill=\"#AE8A3E\" font-weight=\"600\" >tokenizer_catalog + 连接内对象池</text><text x=\"528.0\" y=\"296.55\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" >配置持久化在 catalog，首次使用后缓存在连接内；提高运行效率，但事务回滚后缓存可能仍在。</text><line x1=\"650\" y1=\"244\" x2=\"650\" y2=\"166.4\" stroke=\"#AE8A3E\" stroke-width=\"1.8\"/><polygon points=\"650,160 645.6,168 654.4,168\" fill=\"#AE8A3E\"/><text x=\"30\" y=\"420\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >路径：text_analyzer.apply(text) → model.apply_batch(tokens) → Vec&lt;u32&gt;。</text></svg>","ctrl":null},{"eyebrow":"表示层 · PRACTICE","title":"三条实践线，一个事务边界","lede":"英文、中文、多语言各有起点；但共同点是：配置必须有版本，缓存必须知道边界。","caption":"图 7：三条实践线汇入「配置即代码」；连接内对象池带来效率，也带来回滚边界。","bridge":"词的表示定下来，才能谈「按相关性排序」——BM25 登场。","notes":"对业务开发者来说，这里有三条实践线。英文或空格语言，可以从 unicode_segmentation、小写化、停用词、词干化开始。中文内容，应使用 jieba 或自定义词表，重点处理产品名、行业词、缩写、型号；这些恰恰是通用分词器最容易切错的地方。多语言或模型词表场景，可以用内置模型、HuggingFace tokenizer 或 custom model，但要把模型版本纳入发布流程。三条线有一个共同结论：配置要当成代码来管理。分词配置一变，BM25 结果就变，所以自定义词表、同义词、停用词和模型都要有版本和回滚。还有一条容易被忽略的边界：tokenizer 配置缓存在连接内，事务回滚后缓存可能仍在。这意味着「回滚了配置变更」不等于「所有连接都回到旧行为」，上线前要在目标版本上验证这一点。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"50\" y=\"40\" width=\"410\" height=\"160\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"255.0\" y=\"112.85\" class=\"sv s\" text-anchor=\"middle\" font-size=\"19.0\" fill=\"#245A6B\" font-weight=\"600\" >英文 / 空格语言</text><text x=\"255.0\" y=\"137.55\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" >从 unicode_segmentation、小写化、停用词、词干化开始</text><line x1=\"255\" y1=\"200\" x2=\"255\" y2=\"240.4\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><polygon points=\"255,246 251.15,239 258.85,239\" fill=\"#245A6B\"/><rect x=\"490\" y=\"40\" width=\"410\" height=\"160\" rx=\"5\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"695.0\" y=\"112.85\" class=\"sv s\" text-anchor=\"middle\" font-size=\"19.0\" fill=\"#2F7A66\" font-weight=\"600\" >中文内容</text><text x=\"695.0\" y=\"137.55\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" >用 jieba 或自定义词表，重点处理产品名、行业词、缩写、型号</text><line x1=\"695\" y1=\"200\" x2=\"695\" y2=\"240.4\" stroke=\"#2F7A66\" stroke-width=\"1.6\"/><polygon points=\"695,246 691.15,239 698.85,239\" fill=\"#2F7A66\"/><rect x=\"930\" y=\"40\" width=\"410\" height=\"160\" rx=\"5\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.1\" /><text x=\"1135.0\" y=\"113.76878612716763\" class=\"sv s\" text-anchor=\"middle\" font-size=\"19.0\" fill=\"#AE8A3E\" font-weight=\"600\" >多语言 / 模型词表</text><text x=\"1135.0\" y=\"135.29479768786126\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.3\" fill=\"#1B2B33\" font-weight=\"400\" >内置模型、HuggingFace tokenizer 或 custom model；模型版本纳入发布</text><line x1=\"1135\" y1=\"200\" x2=\"1135\" y2=\"240.4\" stroke=\"#AE8A3E\" stroke-width=\"1.6\"/><polygon points=\"1135,246 1131.15,239 1138.85,239\" fill=\"#AE8A3E\"/><rect x=\"50\" y=\"246\" width=\"1290\" height=\"80\" rx=\"4\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.0\" /><text x=\"68\" y=\"291.95\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#FFFFFF\" font-weight=\"600\" >把这些配置当成「代码」</text><text x=\"376\" y=\"290.725\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#FFFFFF\" font-weight=\"400\" >分词配置、同义词、停用词、模型都要有版本和回滚路径——分词一变，BM25 结果就变。</text><rect x=\"50\" y=\"340\" width=\"1290\" height=\"62\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"68\" y=\"376.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"600\" >连接内缓存边界</text><text x=\"376\" y=\"375.55\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >对象池提高效率，但事务回滚后缓存可能仍在；需要显式清理或重连验证。</text><text x=\"50\" y=\"426\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >专名与错误码优先保证字面召回；自然语言问题重点评测 embedding 分支。</text></svg>","ctrl":null},{"eyebrow":"词法层 · TOPK, NOT MATCH","title":"不是「包含关键词」，而是 TopK 排名","lede":"大规模搜索最关心的是 TopK：只要足够确定某些文档不可能超过当前第 K 名，就应该跳过。","caption":"图 8：原生 FTS 的匹配 + 排序，对比 bm25 索引访问方法自带排名与剪枝。","bridge":"那把「上界 + 阈值」的剪枝路径拆开看——这里配了可播放的演示。","notes":"PostgreSQL 原生全文检索可以用 tsvector、tsquery、GIN、GiST 做匹配，也能用 ts_rank 排序。但大规模搜索最关心的是 TopK：不需要把所有匹配文档都算完，只要足够确定某些文档不可能超过当前第 K 名，就应该跳过。VectorChord-bm25 实现了一个自定义 PostgreSQL index access method：CREATE ACCESS METHOD bm25 TYPE INDEX HANDLER bm25_amhandler，并定义了 <&> 作为排序操作符。这里要插一句重要的提醒：当前 local 源码的 finalize.sql 以 tsvector 为操作对象，但安装包历史 SQL 和 README 还展示过 bm25vector / bm25query(index_oid, query_vector) 的 API。这个差异说明项目 API 正在演进。写生产 SQL 时必须以安装版本的 \\dx+ vchord_bm25、pg_proc、pg_opclass 和官方文档为准，不要混抄不同版本的示例。文章不会虚构具体输出，这一点也请你在自己的演示里保持。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"60\" y=\"44\" width=\"520\" height=\"180\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"320.0\" y=\"126.3\" class=\"sv s\" text-anchor=\"middle\" font-size=\"20.0\" fill=\"#1B2B33\" font-weight=\"600\" >PostgreSQL 原生 FTS</text><text x=\"320.0\" y=\"152.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >tsvector / tsquery + GIN / GiST\n再叠加 ts_rank / ts_rank_cd 排序</text><line x1=\"580\" y1=\"134\" x2=\"812.0\" y2=\"134\" stroke=\"#BE653B\" stroke-width=\"2.2\"/><polygon points=\"820,134 810,128.5 810,139.5\" fill=\"#BE653B\"/><text x=\"700\" y=\"118\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#BE653B\" font-weight=\"600\" >从「是否命中」到「谁排最前」</text><rect x=\"820\" y=\"44\" width=\"520\" height=\"180\" rx=\"5\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.1\" /><text x=\"1080.0\" y=\"126.3\" class=\"sv s\" text-anchor=\"middle\" font-size=\"20.0\" fill=\"#BE653B\" font-weight=\"600\" >VectorChord-bm25</text><text x=\"1080.0\" y=\"152.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\" >自定义索引 AM：USING bm25\n排序操作符 &lt;&amp;&gt; + Block-WEAK-AND TopK</text><rect x=\"60\" y=\"266\" width=\"1280\" height=\"76\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"78\" y=\"309.95\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"600\" >核心不是换一个 BM25 公式</text><text x=\"386\" y=\"308.725\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >而是用「上界 + 当前第 K 名阈值」减少无效文档计分——足够确定进不了 TopK 就整块跳过。</text><rect x=\"60\" y=\"356\" width=\"1280\" height=\"60\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.0\" /><text x=\"78\" y=\"391.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#AE8A3E\" font-weight=\"600\" >SQL 形态在演进</text><text x=\"386\" y=\"390.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >当前源码 finalize.sql 以 tsvector 为对象；README 与安装 SQL 还出现过 bm25vector 形态。</text><text x=\"60\" y=\"424\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >生产前必须用 \\dx+ vchord_bm25、pg_proc、pg_opclass 和官方文档确认实际 API。</text></svg>","ctrl":null},{"eyebrow":"词法层 · PRUNING","title":"Block-WEAK-AND：用上界剪掉无效块","lede":"TopK 越稳定、阈值越高，低价值的 posting block 越容易被整块跳过。","caption":"图 9（动画）：拖动阈值并播放，观察每个 posting block 被「跳过」还是「计分」。","bridge":"看清剪枝之后，再回到 BM25 分数本身：idf、tf 与 k1、b。","notes":"VectorChord-bm25 的搜索主路径有五步：从索引 metapage 读取 k1、b、jump tuple 等元信息；对 query 中每个 token 读取 token tuple，拿到文档频率、WAND 上界和 posting 指针；维护当前 TopK 堆和阈值；如果 token 或 block 的上界之和无法超过阈值，就跳过；只有可能进入 TopK 的候选才读取 document tuple、计算 BM25、执行过滤并入堆。现在看这张可播放的示意图：拖动阈值滑块，再按播放，你会看到低上界的 posting block 被直接跳过，只有高上界的块才进入计分。这就是关键——Block-WEAK-AND 的核心不是换一个 BM25 公式，而是用「上界 + 当前第 K 名阈值」减少无效文档计分。请注意图中数值是原理示意，不是实测统计；真实收益取决于语料分布和查询形态，要用 EXPLAIN 和基准测试去量。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" id=\"animWand\"><rect x=\"40\" y=\"24\" width=\"240\" height=\"66\" rx=\"5\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.1\" /><text x=\"160.0\" y=\"50.125\" class=\"sv s\" text-anchor=\"middle\" font-size=\"18.0\" fill=\"#BE653B\" font-weight=\"600\" >bm25query</text><text x=\"160.0\" y=\"73.875\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >token A / B / C</text><text x=\"300\" y=\"72\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#46585F\" font-weight=\"600\" >token A</text><g><rect class=\"wblock sbox\" data-step=\"1\" data-ub=\"4.6\" x=\"390\" y=\"36\" width=\"190\" height=\"58\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><text x=\"485\" y=\"61\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"600\" >posting block 1</text><text x=\"485\" y=\"81\" tep=\"11\" data-ub=\"4.3\" x=\"806\" y=\"196\" width=\"190\" height=\"58\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><text x=\"901\" y=\"221\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"600\" >posting block 11</text><text x=\"901\" y=\"241\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >上界 4.3</text><text x=\"901\" y=\"272\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"600\" class=\"wstatus\"></text></g><g><rect class=\"wblock sbox\" data-step=\"12\" data-ub=\"1.1\" x=\"1014\" y=\"196\" width=\"190\" height=\"58\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><text x=\"1109\" y=\"221\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"600\" >posting block 12</text><text x=\"1109\" y=\"241\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >上界 1.1</text><text x=\"1109\" y=\"272\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"600\" class=\"wstatus\"></text></g><rect x=\"1230\" y=\"110\" width=\"150\" height=\"122\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" id=\"wdBolt\" opacity=\"0\"/><text x=\"1305.0\" y=\"166.94866071428572\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" >TopK 堆</text><text x=\"1305.0\" y=\"180.94419642857142\" class=\"sv s\" text-anchor=\"middle\" font-size=\"7.4\" fill=\"#46585F\" font-weight=\"400\" >第 K 名分数\n→ 动态阈值\n→ 继续剪枝</text><line x1=\"1180\" y1=\"160\" x2=\"1219.6\" y2=\"160\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"1226,160 1218,155.6 1218,164.4\" fill=\"#245A6B\"/><text x=\"40\" y=\"420\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >演示为原理示意，数值非实测：上界之和 ≤ 阈值 → 整块跳过；否则才读文档计分。</text></svg>","ctrl":"<label>TopK 阈值 <input id=\"wdTh\" type=\"range\" min=\"0.5\" max=\"5\" step=\"0.1\" value=\"2.5\"><span id=\"wdThLbl\" style=\"font-family:var(--mono);color:var(--accent)\">阈值 2.5</span></label><button class=\"btn\" id=\"wdPlay\">▶ 播放</button><button class=\"btn\" id=\"wdTick\">单步</button><button class=\"btn\" id=\"wdReset\">重置</button><span class=\"out\" id=\"wdOut\"></span>"},{"eyebrow":"词法层 · INTUITION","title":"看懂 idf、tf，才敢动 k1 和 b","lede":"罕见词比常见词更有区分度；词频越多越相关，但被 k1 控制饱和；长文档被 b 归一化。","caption":"图 10：三个参数的直觉，以及当前源码的 tsvector 查询形态与负分约定。","bridge":"词法分支补上了字面相关，语义空洞交给向量分支——但 ANN 有它自己的边界。","notes":"源码 bm25.rs 里的两个函数能直接帮我们建立直觉。idf 是 ln((N+1)/(df+0.5))：罕见词比常见词更有区分度。tf 是 tf×(k1+1) 除以 (tf + k1×(1-b+b×doclen/avgdl))：同一个词出现次数越多越相关，但会被 k1 控制饱和；长文档会被 b 和平均长度归一化，避免长文天然占便宜。典型查询形态是 ORDER BY to_tsvector(...) <&> to_bm25query(...)，配合 SET bm25.limit 和 LIMIT。还有一个容易踩的细节：README 提到 BM25 分数按负数返回，目的是让更相关的文档用默认升序 ORDER BY 排在前面。当前源码的 Score 包装和 SQL 操作符行为，应以实际版本验证；文章不虚构具体输出。把这些参数记在心里，下一步我们看向量分支怎么补上「意思相近但词面不同」的空洞。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"50\" y=\"36\" width=\"410\" height=\"180\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"255.0\" y=\"119.05412371134021\" class=\"sv s\" text-anchor=\"middle\" font-size=\"18.0\" fill=\"#245A6B\" font-weight=\"600\" >idf：罕见词更有区分度</text><text x=\"255.0\" y=\"143.04896907216494\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.6\" fill=\"#46585F\" font-weight=\"400\" >ln((N + 1) / (df + 0.5))\n文档数固定时，df 越小 → idf 越大</text><rect x=\"495\" y=\"36\" width=\"410\" height=\"180\" rx=\"5\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"700.0\" y=\"120.32033719704953\" class=\"sv s\" text-anchor=\"middle\" font-size=\"18.0\" fill=\"#2F7A66\" font-weight=\"600\" >tf：词频带来相关，但会饱和</text><text x=\"700.0\" y=\"139.940990516333\" class=\"sv s\" text-anchor=\"middle\" font-size=\"10.3\" fill=\"#46585F\" font-weight=\"400\" >tf × (k1 + 1) / (tf + k1 × 归一化项)\nk1 控制 saturation，不会无限加分</text><rect x=\"940\" y=\"36\" width=\"410\" height=\"180\" rx=\"5\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.1\" /><text x=\"1145.0\" y=\"119.125\" class=\"sv s\" text-anchor=\"middle\" font-size=\"18.0\" fill=\"#BE653B\" font-weight=\"600\" >b 与 fieldnorm：长文不占便宜</text><text x=\"1145.0\" y=\"142.875\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >文档长度 / avgdl 进入归一化\nb 控制长度惩罚的强度</text><rect x=\"50\" y=\"254\" width=\"1300\" height=\"74\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"68\" y=\"296.4569892473118\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.6\" fill=\"#245A6B\" font-weight=\"600\" >典型查询形态（当前源码 tsvector 版）</text><text x=\"376\" y=\"295.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >ORDER BY to_tsvector(...) &lt;&amp;&gt; to_bm25query(..., index) · SET bm25.limit = 100 · LIMIT 50</text><rect x=\"50\" y=\"342\" width=\"1300\" height=\"64\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.0\" /><text x=\"68\" y=\"379.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#AE8A3E\" font-weight=\"600\" >负分约定</text><text x=\"376\" y=\"378.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >README 提到 BM25 分数按负数返回，使更相关的文档可用默认升序 ORDER BY 排在前面。</text><text x=\"50\" y=\"428\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >以实际版本验证 Score 包装与操作符行为；文章不虚构具体输出。</text></svg>","ctrl":null},{"eyebrow":"语义层 · VECTOR RECALL","title":"先低成本找候选，再决定在哪里重排","lede":"vchordrq 走 RaBitQ 量化，vchordg 走图搜索；两者都只是「候选生成器」。","caption":"图 11：两类索引的共同职责，以及 ANN 参数这条硬边界。","bridge":"还有第二个边界：过滤放在哪里，会直接改变你能拿到多少候选。","notes":"VectorChord 提供两类主要索引。vchordrq 以 RaBitQ 量化为核心，强调大规模、低存储成本、近似召回和自主重排，支持 rabitq4、rabitq8 低比特类型、层次 K-means 构建、probes、预取、预热、过滤和重排。vchordg 走图搜索路线，适合更低延迟、更高精度的需求。在混合搜索里，向量分支的职责是补 BM25 的语义空洞：同义表达、自然语言问题、改写后的用户意图、关键词没有命中但含义接近的文档。但它有两个工程边界。第一，ANN 返回的是候选，不是绝对真理。vchordrq.probes、vchordrq.epsilon、vchordrq.max_scan_tuples、I/O 策略和索引构建参数都会影响召回率和延迟。所以「向量召回很强」这句话必须附带一句「在给定参数和预算下」。第二，过滤位置会影响结果数量，这就是下一页的主题。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40\" y=\"30\" width=\"1320\" height=\"64\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"700.0\" y=\"55.125\" class=\"sv s\" text-anchor=\"middle\" font-size=\"19.0\" fill=\"#245A6B\" font-weight=\"600\" >查询向量 → ANN 候选 → 精确重排 → TopN</text><text x=\"700.0\" y=\"78.875\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >向量分支的职责：同义表达、自然语言问题、改写意图、词面未命中但含义接近的文档</text><rect x=\"60\" y=\"126\" width=\"600\" height=\"170\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"360.0\" y=\"205.14594001463058\" class=\"sv s\" text-anchor=\"middle\" font-size=\"18.0\" fill=\"#1B2B33\" font-weight=\"600\" >vchordrq：RaBitQ 量化索引</text><text x=\"360.0\" y=\"225.36905632772493\" class=\"sv s\" text-anchor=\"middle\" font-size=\"10.6\" fill=\"#46585F\" font-weight=\"400\" >大规模、低存储成本\nrabitq4 / rabitq8 低比特类型\n层次 K-means + probes + epsilon\n自主重排与多种 I/O 策略</text><rect x=\"740\" y=\"126\" width=\"600\" height=\"170\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"1040.0\" y=\"204.53071948261925\" class=\"sv s\" text-anchor=\"middle\" font-size=\"18.0\" fill=\"#1B2B33\" font-weight=\"600\" >vchordg：图索引路线</text><text x=\"1040.0\" y=\"226.87914308811642\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.8\" fill=\"#46585F\" font-weight=\"400\" >graph-based index\n适合更低延迟、更高精度\n与 vchordrq 共享过滤 / 重排语义\n按场景选择而非默认选择</text><rect x=\"60\" y=\"326\" width=\"1280\" height=\"76\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.0\" /><text x=\"78\" y=\"369.27546777546775\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.1\" fill=\"#BE653B\" font-weight=\"600\" >边界一：ANN 返回的是候选，不是绝对真理</text><text x=\"386\" y=\"368.55\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" >probes / epsilon / max_scan_tuples / I-O 策略 / 构建参数都会同时影响召回率和延迟。</text><text x=\"60\" y=\"424\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >基础用法：CREATE INDEX ... USING vchordrq (embedding vector_l2_ops); ORDER BY embedding &lt;-&gt; ...</text></svg>","ctrl":null},{"eyebrow":"语义层 · FILTER & RERANK","title":"过滤位置，决定你还有多少候选","lede":"prefilter 能减少无效重排，但选择性很强时，TopK 可能不够——这是过滤位置问题。","caption":"图 12：查询→索引召回→可选 prefilter→精确重排→向量 TopN；硬过滤尽早进分支。","bridge":"两条分支都产出 TopN 后，最后一步是融合——这里最容易犯的错是相加原始分数。","notes":"第二个工程边界是过滤位置。源码 scanners/default.rs 可以看到 options.prefilter 分支：开启时，候选流会调用 fetcher 回表检查过滤条件，过滤掉不满足 WHERE 的行后再进入重排路径，从而减少无效重排或无效计分。但过滤选择性很强时，也要防止候选数量不足。重排模式在 rerank.rs 里很清楚：rerank_index 从索引内存储的向量表示读取并计算距离，少回表、读路径更短，但索引保存更多信息；rerank_heap 通过 heap fetch 从表中取原始向量再算距离，索引更轻、能用原始向量，但 TopK 候选要回表，过滤和 I/O 更敏感。对 DBA 来说，这是空间、读放大和精度的三方取舍。实践上记住一句：租户和权限这种硬条件尽早进入分支，弱业务排序放到融合之后；如果过滤后候选不足，优先检查候选 TopN、prefilter、租户选择性和部分索引。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"50\" y=\"48\" width=\"290\" height=\"116\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"195.0\" y=\"99.125\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.5\" fill=\"#245A6B\" font-weight=\"600\" >查询向量</text><text x=\"195.0\" y=\"122.875\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >vector / halfvec</text><line x1=\"340\" y1=\"106\" x2=\"373.6\" y2=\"106\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"380,106 372,101.6 372,110.4\" fill=\"#245A6B\"/><rect x=\"380\" y=\"48\" width=\"290\" height=\"116\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"525.0\" y=\"99.125\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.5\" fill=\"#1B2B33\" font-weight=\"600\" >vchordrq 搜索</text><text x=\"525.0\" y=\"122.875\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >RaBitQ / probes / epsilon</text><line x1=\"670\" y1=\"106\" x2=\"703.6\" y2=\"106\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"710,106 702,101.6 702,110.4\" fill=\"#245A6B\"/><rect x=\"710\" y=\"48\" width=\"290\" height=\"116\" rx=\"5\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.1\" /><text x=\"855.0\" y=\"99.125\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.5\" fill=\"#AE8A3E\" font-weight=\"600\" >可选 prefilter</text><text x=\"855.0\" y=\"122.875\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >回表检查 WHERE，减少无效重排</text><line x1=\"1000\" y1=\"106\" x2=\"1033.6\" y2=\"106\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"1040,106 1032,101.6 1032,110.4\" fill=\"#245A6B\"/><rect x=\"1040\" y=\"48\" width=\"290\" height=\"116\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"1185.0\" y=\"99.125\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.5\" fill=\"#1B2B33\" font-weight=\"600\" >精确重排</text><text x=\"1185.0\" y=\"122.875\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >rerank_in_index / in_heap</text><line x1=\"1185\" y1=\"164\" x2=\"1185\" y2=\"215.6\" stroke=\"#2F7A66\" stroke-width=\"1.8\"/><polygon points=\"1185,222 1180.6,214 1189.4,214\" fill=\"#2F7A66\"/><rect x=\"1040\" y=\"222\" width=\"290\" height=\"96\" rx=\"5\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"1185.0\" y=\"263.125\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#2F7A66\" font-weight=\"600\" >向量 TopN</text><text x=\"1185.0\" y=\"286.875\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >保留 rank 与 distance\n进入 SQL 融合</text><rect x=\"50\" y=\"222\" width=\"600\" height=\"96\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.0\" /><text x=\"68\" y=\"275.95\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#AE8A3E\" font-weight=\"600\" >prefilter 的两面</text><text x=\"244.00000000000003\" y=\"274.55\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" >减少无效重排；但过滤选择性很强时，也必须防止候选不足。</text><rect x=\"50\" y=\"348\" width=\"1280\" height=\"62\" rx=\"4\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.0\" /><text x=\"68\" y=\"384.95\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#FFFFFF\" font-weight=\"600\" >过滤位置怎么放</text><text x=\"376\" y=\"383.55\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#FFFFFF\" font-weight=\"400\" >租户与权限这类硬条件尽早进分支；弱业务排序放到融合之后。</text><text x=\"50\" y=\"428\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >若过滤后候选不足：先查候选 TopN、prefilter、租户选择性与部分索引，别急着改 RRF 权重。</text></svg>","ctrl":null},{"eyebrow":"融合层 · RRF","title":"别急着相加原始分数：用 RRF","lede":"BM25 分数与向量距离不是同一量纲，直接相加通常不可控；更稳的起点是只相信排名。","caption":"图 13（动画）：调节 k 与两分支名次，播放观察 rrf_score 如何由两个排名项相加得到。","bridge":"有标注集之后，才谈归一化加权、learning-to-rank 与 cross-encoder 重排。","notes":"这一页是整篇最容易出错的地方。BM25 分数和向量距离不是同一量纲：BM25 受 token、文档频率、字段长度和语料分布影响；向量距离受模型、维度、归一化和距离函数影响；BM25 通常越大越相关，向量距离通常越小越近，而 VectorChord-bm25 还为了 ORDER BY 方便使用负分约定。所以第一版不建议写 ORDER BY bm25_score + vector_score DESC。更稳的起点是 RRF：rrf_score(doc) = sum(1.0/(k + rank_i(doc)))，k 常用 60。k 越小，头部排名差异越大；k 越大，两个分支的贡献更平滑。看这个动画：调节 k 和两个分支的名次，按播放，你会看到每个分支各贡献一个 1/(k+rank) 项，相加得到最终分。它不依赖任何原始分数尺度，因此天然可解释。如果业务已经有标注集和持续评测，再进一步做分数归一化后加权、learning-to-rank、或用 cross-encoder 二次重排——但这些都应该建立在可回放的坏例和可量化指标上，而不是凭感觉调一个权重。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" id=\"animRrf\"><rect x=\"50\" y=\"42\" width=\"390\" height=\"120\" rx=\"5\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.1\" /><text x=\"245\" y=\"78\" class=\"sv s\" text-anchor=\"middle\" font-size=\"18.0\" fill=\"#BE653B\" font-weight=\"600\" >词法分支 TopN</text><text x=\"245\" y=\"110\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\" >该文档排名</text><text x=\"245\" y=\"138\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"600\" id=\"rrRankA\">r₁ = 5</text><rect x=\"50\" y=\"230\" width=\"390\" height=\"120\" rx=\"5\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"245\" y=\"266\" class=\"sv s\" text-anchor=\"middle\" font-size=\"18.0\" fill=\"#2F7A66\" font-weight=\"600\" >向量分支 TopN</text><text x=\"245\" y=\"298\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"400\" >该文档排名</text><text x=\"245\" y=\"326\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#2F7A66\" font-weight=\"600\" id=\"rrRankB\">r₂ = 8</text><line x1=\"440\" y1=\"102\" x2=\"470\" y2=\"102\" stroke=\"#BE653B\" stroke-width=\"1.8\"/><line x1=\"470\" y1=\"102\" x2=\"470\" y2=\"150\" stroke=\"#BE653B\" stroke-width=\"1.8\"/><line x1=\"470\" y1=\"150\" x2=\"500\" y2=\"150\" stroke=\"#BE653B\" stroke-width=\"1.8\"/><line x1=\"470\" y1=\"150\" x2=\"493.6\" y2=\"150\" stroke=\"#BE653B\" stroke-width=\"1.8\"/><polygon points=\"500,150 492,145.6 492,154.4\" fill=\"#BE653B\"/><line x1=\"440\" y1=\"290\" x2=\"470\" y2=\"290\" stroke=\"#2F7A66\" stroke-width=\"1.8\"/><line x1=\"470\" y1=\"290\" x2=\"470\" y2=\"240\" stroke=\"#2F7A66\" stroke-width=\"1.8\"/><line x1=\"470\" y1=\"240\" x2=\"500\" y2=\"240\" stroke=\"#2F7A66\" stroke-width=\"1.8\"/><line x1=\"470\" y1=\"240\" x2=\"493.6\" y2=\"240\" stroke=\"#2F7A66\" stroke-width=\"1.8\"/><polygon points=\"500,240 492,235.6 492,244.4\" fill=\"#2F7A66\"/><rect x=\"500\" y=\"90\" width=\"450\" height=\"210\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#245A6B\" stroke-width=\"1.2\" /><text x=\"725\" y=\"124\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"600\" >RRF：只相信分支内部排名</text><text x=\"725\" y=\"158\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"400\" >rrf_score = Σ 1/(k + rankᵢ)</text><text x=\"725\" y=\"196\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" id=\"rrT1\">— 待播放 —</text><text x=\"725\" y=\"226\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" id=\"rrT2\">— 待播放 —</text><text x=\"725\" y=\"274\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"600\" id=\"rrSum\">—</text><line x1=\"950\" y1=\"196\" x2=\"993.6\" y2=\"196\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"1000,196 992,191.6 992,200.4\" fill=\"#245A6B\"/><rect x=\"1000\" y=\"110\" width=\"350\" height=\"172\" rx=\"5\" fill=\"#2E6373\" stroke=\"#245A6B\" stroke-width=\"1.2\" /><text x=\"1175\" y=\"146\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#FFFFFF\" font-weight=\"600\" >rrf_score</text><text x=\"1175\" y=\"206\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"44.0\" fill=\"#FFFFFF\" font-weight=\"600\" id=\"rrScore\">…</text><text x=\"1175\" y=\"252\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#EBF1EE\" font-weight=\"400\" >k 控制平滑程度</text><text x=\"50\" y=\"420\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >绝对值不重要：重要的是同一套 k 下，分支排名如何转化为可比较的贡献。</text></svg>","ctrl":"<label>k <select id=\"rrK\"><option>10</option><option selected>60</option><option>100</option></select></label><span id=\"rrKLbl\" style=\"font-family:var(--mono);color:var(--accent)\">k = 60</span><label>BM25 名次 <input id=\"rrBm\" type=\"range\" min=\"1\" max=\"30\" value=\"5\"></label><span id=\"rrBmLbl\" style=\"font-family:var(--mono);color:var(--accent)\">BM25 名次 5</span><label>向量名次 <input id=\"rrVec\" type=\"range\" min=\"1\" max=\"30\" value=\"8\"></label><span id=\"rrVecLbl\" style=\"font-family:var(--mono);color:var(--accent)\">向量名次 8</span><button class=\"btn\" id=\"rrPlay\">▶ 播放</button><button class=\"btn\" id=\"rrTick\">单步</button><button class=\"btn\" id=\"rrReset\">重置</button><span class=\"out\" id=\"rrOut\"></span>"},{"eyebrow":"融合层 · EXPLAINABLE SQL","title":"把分支来源留在结果里","lede":"模板的价值不是 SQL 漂亮，而是保留可解释字段：bm25_rank、vector_rank、rrf_score。","caption":"图 14：两个 CTE 各出 TopN，FULL OUTER JOIN 后做 RRF，再回表补齐业务字段。","bridge":"融合做完了，还要回头看写入路径——混合搜索的成本常被低估在这里。","notes":"最小模板的融合部分是这样的：bm25_candidates 和 vector_candidates 两个 CTE 各自在 WHERE 里限定 tenant_id 和 status，各自 ORDER BY 自己的排序操作符并 LIMIT 50；然后 unioned 用 FULL OUTER JOIN USING(id)，把两路候选并起来；最后 SELECT 里用 COALESCE(1.0/(60+b.bm25_rank),0) + COALESCE(1.0/(60+v.vector_rank),0) 得到 rrf_score，JOIN docs 回填 title 和 body，ORDER BY rrf_score DESC, d.id LIMIT 10。这个模板的重点不是 SQL 写法多漂亮，而是保留可解释字段。上线排障时，研发和业务同学能看到结果来自哪个分支，而不是只看到一个不可解释的最终分数。需要再次提醒：VectorChord-bm25 的 README、安装 SQL 和当前源码生成 SQL 存在 API 形态差异，生产前必须用实际数据库确认函数、类型、opclass 和 GUC 名称。别照抄示例。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"50\" y=\"44\" width=\"370\" height=\"110\" rx=\"5\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.1\" /><text x=\"235.0\" y=\"92.125\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#BE653B\" font-weight=\"600\" >bm25_candidates</text><text x=\"235.0\" y=\"115.875\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >WHERE tenant/status\nORDER BY &lt;&amp;&gt; · LIMIT 50</text><rect x=\"50\" y=\"224\" width=\"370\" height=\"110\" rx=\"5\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"235.0\" y=\"272.125\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#2F7A66\" font-weight=\"600\" >vector_candidates</text><text x=\"235.0\" y=\"295.875\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >WHERE tenant/status\nORDER BY &lt;-&gt; · LIMIT 50</text><line x1=\"420\" y1=\"99\" x2=\"460\" y2=\"99\" stroke=\"#BE653B\" stroke-width=\"1.8\"/><line x1=\"460\" y1=\"99\" x2=\"460\" y2=\"158\" stroke=\"#BE653B\" stroke-width=\"1.8\"/><line x1=\"460\" y1=\"158\" x2=\"510\" y2=\"158\" stroke=\"#BE653B\" stroke-width=\"1.8\"/><line x1=\"460\" y1=\"158\" x2=\"503.6\" y2=\"158\" stroke=\"#BE653B\" stroke-width=\"1.8\"/><polygon points=\"510,158 502,153.6 502,162.4\" fill=\"#BE653B\"/><line x1=\"420\" y1=\"279\" x2=\"460\" y2=\"279\" stroke=\"#2F7A66\" stroke-width=\"1.8\"/><line x1=\"460\" y1=\"279\" x2=\"460\" y2=\"218\" stroke=\"#2F7A66\" stroke-width=\"1.8\"/><line x1=\"460\" y1=\"218\" x2=\"510\" y2=\"218\" stroke=\"#2F7A66\" stroke-width=\"1.8\"/><line x1=\"460\" y1=\"218\" x2=\"503.6\" y2=\"218\" stroke=\"#2F7A66\" stroke-width=\"1.8\"/><polygon points=\"510,218 502,213.6 502,222.4\" fill=\"#2F7A66\"/><rect x=\"510\" y=\"138\" width=\"320\" height=\"100\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"670.0\" y=\"181.55201863354037\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"600\" >unioned</text><text x=\"670.0\" y=\"203.82686335403727\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.7\" fill=\"#46585F\" font-weight=\"400\" >FULL OUTER JOIN USING(id)\nCOALESCE(b.id, v.id)</text><line x1=\"830\" y1=\"188\" x2=\"883.6\" y2=\"188\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"890,188 882,183.6 882,192.4\" fill=\"#245A6B\"/><rect x=\"890\" y=\"112\" width=\"460\" height=\"152\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"1120.0\" y=\"183.67437722419928\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"600\" >SELECT + ORDER BY</text><text x=\"1120.0\" y=\"198.61743772241994\" class=\"sv s\" text-anchor=\"middle\" font-size=\"7.9\" fill=\"#46585F\" font-weight=\"400\" >bm25_rank / vector_rank / rrf_score\nJOIN docs 回填 title、body\nORDER BY rrf_score DESC, d.id LIMIT 10</text><rect x=\"50\" y=\"356\" width=\"1300\" height=\"60\" rx=\"4\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.0\" /><text x=\"68\" y=\"391.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#FFFFFF\" font-weight=\"600\" >可解释字段是上线排障的抓手</text><text x=\"376\" y=\"390.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#FFFFFF\" font-weight=\"400\" >研发和业务能看到结果来自哪个分支，而不是只看到一个不可解释的最终分数。</text><text x=\"50\" y=\"424\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >模板重点不是 SQL 写法多漂亮，而是保留 bm25_rank、vector_rank、rrf_score。</text></svg>","ctrl":null},{"eyebrow":"写入路径 · WRITE COST","title":"一次更新，至少影响三类状态","lede":"文本、token、BM25 表示、embedding、两个索引和融合逻辑，都要一起维护。","caption":"图 15：一条 UPDATE 扇出到五个维护面；版本字段是异步更新的安全带。","bridge":"成本付出去之后，怎么判断值不值？用质量、执行、维护三层效果来验。","notes":"混合搜索的写入成本常被低估。一条文档更新可能触发五件事：文本字段变化要重新分词，更新 token id 数组或 tsvector；词法索引变化要维护 BM25 倒排结构、文档频率和字段长度统计；embedding 变化要重新生成向量，更新 vchordrq 或 vchordg 索引；权限或状态变化会影响分支内 prefilter 是否能拿到足够候选；删除或更新膨胀让两个索引都要面对 dead tuple、VACUUM、REINDEX 或维护任务。因此在强一致业务里，建议把「内容版本」和「embedding 版本」显式建模。不要让应用以为文本已经更新，embedding 却仍是旧模型旧内容，而搜索结果没有任何可解释字段。模型升级时尤其要考虑双写两个 embedding 列、双索引灰度。把写入路径画出来，团队才会对「为什么搜索系统不能随便改一列」达成共识。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"520\" y=\"20\" width=\"360\" height=\"62\" rx=\"5\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.1\" /><text x=\"700.0\" y=\"44.125\" class=\"sv s\" text-anchor=\"middle\" font-size=\"18.0\" fill=\"#BE653B\" font-weight=\"600\" >一条文档 UPDATE</text><text x=\"700.0\" y=\"67.875\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >内容 / 权限 / 状态任一变化</text><line x1=\"700\" y1=\"82\" x2=\"700\" y2=\"
