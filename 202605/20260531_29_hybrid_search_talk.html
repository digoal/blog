e=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"115.0\" y=\"385.3\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"600\" >适合场景</text><rect x=\"190\" y=\"358\" width=\"278\" height=\"42\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"329.0\" y=\"385.3\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >库内强混合搜索</text><rect x=\"468\" y=\"358\" width=\"300\" height=\"42\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"618.0\" y=\"385.3\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >轻中量 · 内置优先</text><rect x=\"768\" y=\"358\" width=\"320\" height=\"42\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"928.0\" y=\"385.3\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >超大规模搜索产品</text><rect x=\"1088\" y=\"358\" width=\"290\" height=\"42\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"1233.0\" y=\"385.3\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >FAQ / 推荐</text><text x=\"40\" y=\"420\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >核心是复杂度位置不同：少了同步链路和外部一致性，多了库内 CPU、I/O、索引维护和参数治理。</text></svg>","ctrl":null},{"eyebrow":"验证 · THREE LAYERS","title":"效果要分三层看","lede":"质量、执行、维护——只盯一个指标，搜索一定会在下一批 query 上退化。","caption":"图 17：质量看 Recall/NDCG 与坏例归因，执行看 EXPLAIN，维护看体积与延迟尾部。","bridge":"三层要连成闭环，参数才不是靠猜。","notes":"效果要分三层看。第一层是质量：Recall@K 看两个分支合并后是否覆盖人工标注的相关文档，NDCG@K 看好结果是否排在前面，分支贡献看最终 TopK 有多少来自 BM25、多少来自向量、多少两者都命中，坏例归因要能定位是分词错、词表缺、BM25 候选太少、向量模型差、probes 太低、过滤后候选不足，还是融合参数错。第二层是执行：用 EXPLAIN (ANALYZE, BUFFERS) 看 BM25 分支是否用了 bm25 index scan、向量分支是否按 ORDER BY distance LIMIT n 进入向量索引、两个分支的候选 TopN 是否合理、有没有大范围回表和排序 spill，以及改 bm25.limit、vchordrq.probes、vchordrq.prefilter 后计划和耗时是否符合预期。第三层是维护：索引大小增长、写入 P95/P99、VACUUM 与 REINDEX 窗口、以及 tokenizer 配置、词表和 embedding 模型是否有版本字段。三层缺一不可：只看质量会忽略成本，只看延迟会悄悄牺牲召回。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"50\" y=\"30\" width=\"410\" height=\"344\" rx=\"5\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"255\" y=\"68\" class=\"sv s\" text-anchor=\"middle\" font-size=\"18.0\" fill=\"#2F7A66\" font-weight=\"600\" >第一层：质量效果</text><line x1=\"74\" y1=\"86\" x2=\"436\" y2=\"86\" stroke=\"#2F7A66\" stroke-width=\"1.0\"/><text x=\"74\" y=\"120\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" >· Recall@K：是否覆盖标注相关文档</text><text x=\"74\" y=\"174\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" >· NDCG@K：好结果是否排前</text><text x=\"74\" y=\"228\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" >· 分支贡献：BM25 / 向量 / 双命中</text><text x=\"74\" y=\"282\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" >· 坏例归因：分词 / 候选 / 模型 / 过滤</text><rect x=\"490\" y=\"30\" width=\"410\" height=\"344\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"695\" y=\"68\" class=\"sv s\" text-anchor=\"middle\" font-size=\"18.0\" fill=\"#245A6B\" font-weight=\"600\" >第二层：执行效果</text><line x1=\"514\" y1=\"86\" x2=\"876\" y2=\"86\" stroke=\"#245A6B\" stroke-width=\"1.0\"/><text x=\"514\" y=\"120\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" >· EXPLAIN (ANALYZE, BUFFERS)</text><text x=\"514\" y=\"174\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" >· BM25 分支是否走 bm25 index scan</text><text x=\"514\" y=\"228\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" >· 向量分支是否走索引 TopK</text><text x=\"514\" y=\"282\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" >· 有无大范围回表 / 排序 spill</text><rect x=\"930\" y=\"30\" width=\"410\" height=\"344\" rx=\"5\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.1\" /><text x=\"1135\" y=\"68\" class=\"sv s\" text-anchor=\"middle\" font-size=\"18.0\" fill=\"#AE8A3E\" font-weight=\"600\" >第三层：维护效果</text><line x1=\"954\" y1=\"86\" x2=\"1316\" y2=\"86\" stroke=\"#AE8A3E\" stroke-width=\"1.0\"/><text x=\"954\" y=\"120\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" >· 索引大小增长是否可控</text><text x=\"954\" y=\"174\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" >· 写入 P95 / P99 是否被拖慢</text><text x=\"954\" y=\"228\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" >· VACUUM / REINDEX / 升级窗口</text><text x=\"954\" y=\"282\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" >· tokenizer / 词表 / 模型是否有版本</text><text x=\"50\" y=\"420\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >三层缺一不可：只看质量会忽略成本，只看延迟会悄悄牺牲召回。</text></svg>","ctrl":null},{"eyebrow":"闭环 · FEEDBACK LOOP","title":"没有评测闭环，调参就是猜","lede":"混合搜索不是一次 SQL 改造，而是一条从离线标注到线上观测再回到坏例回放的闭环。","caption":"图 18：六个环节首尾相接；中心一句话点破——没有回放，调参就是猜。","bridge":"闭环建好，最后是把责任分到架构师、DBA 和业务开发者。","notes":"这张图是整篇的收束。混合搜索不是一次 SQL 改造，而是一个闭环。从离线评测集出发，设定参数与策略——tokenizer、probes、bm25.limit、RRF k；然后做线上观测——EXPLAIN BUFFERS、写入 P95、索引体积；再进入坏例回放——漏召回、误排序、过滤丢失；然后看质量指标——Recall@K、NDCG@K、分支贡献；再确认发布边界——重建窗口、回滚方案、版本字段；最后回到离线评测集。没有离线评测和坏例回放，bm25.limit、probes、RRF k、tokenizer 配置都只能靠猜；而靠猜调搜索，通常会在下一批 query 上退化。这也是为什么前面反复强调「保留可解释字段」：没有字段，就没有归因；没有归因，闭环就转不起来。评测集、回放流程和版本字段，是这套架构真正的基础设施。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"560\" y=\"18\" width=\"280\" height=\"70\" rx=\"5\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"700.0\" y=\"46.675\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.5\" fill=\"#2F7A66\" font-weight=\"600\" >离线评测集</text><text x=\"700.0\" y=\"68.525\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >query / relevant docs</text><rect x=\"1000\" y=\"120\" width=\"300\" height=\"80\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"1150.0\" y=\"153.675\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.5\" fill=\"#1B2B33\" font-weight=\"600\" >参数与策略</text><text x=\"1150.0\" y=\"175.525\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >tokenizer / probes / limit / k</text><rect x=\"1000\" y=\"290\" width=\"300\" height=\"80\" rx=\"5\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.1\" /><text x=\"1150.0\" y=\"323.675\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.5\" fill=\"#BE653B\" font-weight=\"600\" >线上观测</text><text x=\"1150.0\" y=\"345.525\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >EXPLAIN BUFFERS / P99 / 体积</text><rect x=\"560\" y=\"350\" width=\"280\" height=\"70\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"700.0\" y=\"378.675\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.5\" fill=\"#1B2B33\" font-weight=\"600\" >坏例回放</text><text x=\"700.0\" y=\"400.525\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >漏召回 / 误排序 / 过滤丢失</text><rect x=\"100\" y=\"290\" width=\"300\" height=\"80\" rx=\"5\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"250.0\" y=\"323.675\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.5\" fill=\"#2F7A66\" font-weight=\"600\" >质量指标</text><text x=\"250.0\" y=\"345.525\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >Recall@K / NDCG@K / 分支贡献</text><rect x=\"100\" y=\"120\" width=\"300\" height=\"80\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"250.0\" y=\"153.675\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.5\" fill=\"#1B2B33\" font-weight=\"600\" >发布边界</text><text x=\"250.0\" y=\"175.525\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >重建窗口 / 回滚 / 版本字段</text><line x1=\"840\" y1=\"53\" x2=\"920\" y2=\"53\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><line x1=\"920\" y1=\"53\" x2=\"920\" y2=\"160\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><line x1=\"920\" y1=\"160\" x2=\"1000\" y2=\"160\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><line x1=\"920\" y1=\"160\" x2=\"993.6\" y2=\"160\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><polygon points=\"1000,160 992,155.6 992,164.4\" fill=\"#245A6B\"/><line x1=\"1150\" y1=\"200\" x2=\"1150\" y2=\"283.6\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><polygon points=\"1150,290 1145.6,282 1154.4,282\" fill=\"#245A6B\"/><line x1=\"1000\" y1=\"330\" x2=\"920\" y2=\"330\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><line x1=\"920\" y1=\"330\" x2=\"920\" y2=\"385\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><line x1=\"920\" y1=\"385\" x2=\"840\" y2=\"385\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><line x1=\"920\" y1=\"385\" x2=\"846.4\" y2=\"385\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><polygon points=\"840,385 848,380.6 848,389.4\" fill=\"#245A6B\"/><line x1=\"560\" y1=\"385\" x2=\"480\" y2=\"385\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><line x1=\"480\" y1=\"385\" x2=\"480\" y2=\"330\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><line x1=\"480\" y1=\"330\" x2=\"400\" y2=\"330\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><line x1=\"480\" y1=\"330\" x2=\"406.4\" y2=\"330\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><polygon points=\"400,330 408,325.6 408,334.4\" fill=\"#245A6B\"/><line x1=\"250\" y1=\"290\" x2=\"250\" y2=\"206.4\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><polygon points=\"250,200 245.6,208 254.4,208\" fill=\"#245A6B\"/><line x1=\"400\" y1=\"160\" x2=\"480\" y2=\"160\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><line x1=\"480\" y1=\"160\" x2=\"480\" y2=\"53\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><line x1=\"480\" y1=\"53\" x2=\"560\" y2=\"53\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><line x1=\"480\" y1=\"53\" x2=\"553.6\" y2=\"53\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><polygon points=\"560,53 552,48.6 552,57.4\" fill=\"#245A6B\"/><text x=\"700\" y=\"222\" class=\"sv s\" text-anchor=\"middle\" font-size=\"19.0\" fill=\"#BE653B\" font-weight=\"600\" >没有回放，调参就是猜</text><text x=\"700\" y=\"252\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >靠猜调搜索，通常会在下一批 query 上退化</text><text x=\"60\" y=\"428\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >bm25.limit、probes、RRF k、tokenizer 配置都必须在可回放的坏例集上验证。</text></svg>","ctrl":null},{"eyebrow":"落地 · PLAYBOOK","title":"把责任分到三类角色","lede":"架构师定边界，DBA 验计划，业务开发者留调试字段——每条动作都要能落到人。","caption":"图 19：三类角色的行动清单，以及适合 / 不适合的边界。","bridge":"最后，用七个常见坑和五个开放问题收尾。","notes":"落地时要把责任分清楚。面向架构师：把混合搜索当成「数据库内搜索子系统」，不要当成一个普通二级索引；为文本、token、embedding、模型版本、词表版本建立清晰字段；先确定一致性边界，文本更新后是否同步更新 embedding，异步期间旧向量是否可接受；根据租户、时间、品类选择分区、部分索引或候选集策略，避免全局 ANN 召回后大面积过滤；为扩展升级、索引重建、模型替换预留灰度和回滚路径。面向 DBA：用 EXPLAIN (ANALYZE, BUFFERS) 验证两个分支分别使用预期索引；对 bm25.limit、vchordrq.probes、epsilon、prefilter 做基准测试；观察索引大小、写入延迟、VACUUM、REINDEX、缓存命中、排序内存和回表次数；如果过滤后候选不足，优先检查候选 TopN、prefilter、租户选择性和部分索引。面向业务开发者：查询接口返回 BM25 rank、vector rank、融合分、命中字段、模型版本；第一版优先用 RRF；把坏例保存成回归集。边界也要说清：适合知识库、文档站、客服问答；不适合极高写入、没有 DBA 能力、或需要分布式搜索产品的场景。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40\" y=\"22\" width=\"410\" height=\"214\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"245\" y=\"58\" class=\"sv s\" text-anchor=\"middle\" font-size=\"19.0\" fill=\"#245A6B\" font-weight=\"600\" >架构师</text><line x1=\"62\" y1=\"74\" x2=\"428\" y2=\"74\" stroke=\"#245A6B\" stroke-width=\"1.0\"/><text x=\"62\" y=\"104\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >· 当数据库内搜索子系统，不当二级索引</text><text x=\"62\" y=\"131\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >· 建文本 / token / embedding / 版本字段</text><text x=\"62\" y=\"158\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >· 先定一致性边界：同步还是异步</text><text x=\"62\" y=\"185\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >· 按租户时间品类做分区 / 部分索引</text><text x=\"62\" y=\"212\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >· 预留灰度与回滚路径</text><rect x=\"480\" y=\"22\" width=\"410\" height=\"214\" rx=\"5\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"685\" y=\"58\" class=\"sv s\" text-anchor=\"middle\" font-size=\"19.0\" fill=\"#2F7A66\" font-weight=\"600\" >DBA</text><line x1=\"502\" y1=\"74\" x2=\"868\" y2=\"74\" stroke=\"#2F7A66\" stroke-width=\"1.0\"/><text x=\"502\" y=\"104\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >· EXPLAIN (ANALYZE, BUFFERS) 验索引</text><text x=\"502\" y=\"131\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >· 对四个 GUC 做基准，别用默认值上线</text><text x=\"502\" y=\"158\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >· 盯索引体积 / 写入延迟 / VACUUM</text><text x=\"502\" y=\"185\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >· 候选不足先查 TopN 与 prefilter</text><text x=\"502\" y=\"212\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >· 记录扩展版本与 SQL API 形态</text><rect x=\"920\" y=\"22\" width=\"410\" height=\"214\" rx=\"5\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.1\" /><text x=\"1125\" y=\"58\" class=\"sv s\" text-anchor=\"middle\" font-size=\"19.0\" fill=\"#AE8A3E\" font-weight=\"600\" >业务开发者</text><line x1=\"942\" y1=\"74\" x2=\"1308\" y2=\"74\" stroke=\"#AE8A3E\" stroke-width=\"1.0\"/><text x=\"942\" y=\"104\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >· 查询返回调试字段：rank / 分数 / 版本</text><text x=\"942\" y=\"131\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >· 不要相加原始分数，第一版用 RRF</text><text x=\"942\" y=\"158\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >· 把坏例存成回归集</text><text x=\"942\" y=\"185\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >· 专名 / 错误码优先 BM25 字面召回</text><text x=\"942\" y=\"212\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >· 自然语言问题重点评 embedding</text><rect x=\"40\" y=\"254\" width=\"1290\" height=\"66\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1.0\" /><text x=\"58\" y=\"292.95\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#2F7A66\" font-weight=\"600\" >适合</text><text x=\"366\" y=\"291.55\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >知识库 / 文档站 / 客服问答 / 工单；专名多但表达自然；数据已在 PostgreSQL 且强一致重要。</text><rect x=\"40\" y=\"334\" width=\"1290\" height=\"66\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.0\" /><text x=\"58\" y=\"372.95\" class=\"sv s\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#BE653B\" font-weight=\"600\" >不适合</text><text x=\"366\" y=\"371.55\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#1B2B33\" font-weight=\"400\" >极高写入且同步重算；没有 DBA 能力却想把搜索压进主库；需要分布式搜索与查询 DSL 的超大规模产品。</text><text x=\"40\" y=\"424\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >把责任分到三类角色，每条动作都能落到人和工单——这才是「落地」。</text></svg>","ctrl":null},{"eyebrow":"收尾 · PITFALLS & QUESTIONS","title":"七个坑，五个问题，一句话","lede":"把坑变成检查清单，把问题带回自己的项目——混合搜索才真正落地。","caption":"图 20：七个常见坑与对应正确动作；五个开放问题留作后续讨论。","bridge":"把搜索当成一个数据库内子系统，这是整篇唯一想让你带走的话。","notes":"最后用七个常见坑收尾。第一，把混合搜索理解成「两个分数相加」——BM25 分数和向量距离不是同一量纲，先用 RRF，等有标注集后再做归一化或学习排序。第二，候选集太小——BM25 Top20 和向量 Top20 融合后再过滤，很容易只剩几条，候选 TopN 要按过滤选择性放大并用真实 query 测。第三，过滤位置不清楚——租户和权限这种硬条件应尽早进入分支，弱业务排序放到融合后。第四，tokenizer 没版本——分词配置一变，BM25 结果就变，自定义词表、同义词、停用词、模型都要有版本和回滚。第五，embedding 更新异步但不可见——用户看到新文本，向量还是旧文本生成的，会出现「关键词对、语义不对」，需要状态字段或后台补偿。第六，照抄不同版本 API——生产前必须用实际数据库确认函数、类型、opclass 和 GUC 名称。第七，只看平均延迟——P99 常常来自回表、排序、过滤后补候选、模型首次加载和缓存冷启动，要看 BUFFERS、索引大小和连接内对象缓存。留下五个开放问题给你带回项目：错误码与自然语言混合时两路 TopN 是否相同？租户选择性骤变时三个参数如何联动？同义词在索引时还是查询时扩展？模型升级要不要双写双索引灰度？两路都没命中时坏例先查哪一环？如果只带走一句话，那就是——搜索是数据库内的一个子系统，不是一个可以随手加的索引。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40\" y=\"24\" width=\"320\" height=\"90\" rx=\"5\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.1\" /><text x=\"56\" y=\"56\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#BE653B\" font-weight=\"600\" >① 相加原始分数</text><text x=\"56\" y=\"86\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >→ 先用 RRF，有标注再归一化</text><rect x=\"380\" y=\"24\" width=\"320\" height=\"90\" rx=\"5\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.1\" /><text x=\"396\" y=\"56\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#BE653B\" font-weight=\"600\" >② 候选集太小</text><text x=\"396\" y=\"86\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >→ 按过滤选择性放大 TopN</text><rect x=\"720\" y=\"24\" width=\"320\" height=\"90\" rx=\"5\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.1\" /><text x=\"736\" y=\"56\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#BE653B\" font-weight=\"600\" >③ 过滤位置不清</text><text x=\"736\" y=\"86\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >→ 硬条件早进分支</text><rect x=\"1060\" y=\"24\" width=\"320\" height=\"90\" rx=\"5\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.1\" /><text x=\"1076\" y=\"56\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#BE653B\" font-weight=\"600\" >④ tokenizer 没版本</text><text x=\"1076\" y=\"86\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >→ 词表 / 同义词纳入发布</text><rect x=\"40\" y=\"128\" width=\"320\" height=\"90\" rx=\"5\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.1\" /><text x=\"56\" y=\"160\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#AE8A3E\" font-weight=\"600\" >⑤ embedding 异步不可见</text><text x=\"56\" y=\"190\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >→ 状态字段或后台补偿</text><rect x=\"380\" y=\"128\" width=\"320\" height=\"90\" rx=\"5\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.1\" /><text x=\"396\" y=\"160\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#AE8A3E\" font-weight=\"600\" >⑥ 照抄不同版本 API</text><text x=\"396\" y=\"190\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >→ 用实际库确认对象</text><rect x=\"720\" y=\"128\" width=\"320\" height=\"90\" rx=\"5\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.1\" /><text x=\"736\" y=\"160\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#AE8A3E\" font-weight=\"600\" >⑦ 只看平均延迟</text><text x=\"736\" y=\"190\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >→ 看 P99 与 BUFFERS</text><rect x=\"40\" y=\"246\" width=\"1300\" height=\"80\" rx=\"4\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.0\" /><text x=\"58\" y=\"291.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#FFFFFF\" font-weight=\"600\" >五个开放问题</text><text x=\"366\" y=\"290.375\" const N = D.length;
let cur = 0, autoTimer = null, autoOn = false, panelMode = null;

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

function fit(){
  const vp = $('#viewport');
  const W = vp.clientWidth, H = vp.clientHeight;
  const open = document.body.classList.contains('notes-on');
  const npw = open ? Math.min(Math.max(520, W*0.42), 760) : 0;
  const avail = W - npw;
  const s = Math.min(avail/1600, H/900);
  const st = $('#stage');
  st.style.transform = 'scale(' + s + ')';
  st.style.left = ((avail - 1600*s)/2) + 'px';
  st.style.top  = ((H - 900*s)/2) + 'px';
}
window.addEventListener('resize', fit);

function render(){
  $('#slides').innerHTML = D.map((d,i) =>
    '<section class="slide" id="s'+i+'">'
    + '<div class="eyebrow"><span class="num">'+String(i+1).padStart(2,'0')+' / '+String(N).padStart(2,'0')+'</span>'+d.eyebrow+'</div>'
    + '<h1 class="title">'+d.title+'</h1>'
    + '<div class="lede">'+d.lede+'</div>'
    + '<div class="rule"></div>'
    + '<div class="figwrap">'+d.svg+'</div>'
    + (d.ctrl ? '<div class="ctrls">'+d.ctrl+'</div>' : '<div class="caption">'+d.caption+'</div>')
    + '<div class="bridge"><span class="bk">承接 · NEXT</span>'+d.bridge+'</div>'
    + '<div class="footer"><div class="fbar"><i id="fbar'+i+'"></i></div>'
    + '<span class="fl">数据库筑基课 · 应用实践之 再谈混合搜索</span>'
    + '<span class="fr">'+String(i+1).padStart(2,'0')+' / '+String(N).padStart(2,'0')+'</span></div>'
    + '</section>').join('');
}

function go(i, silent){
  i = Math.max(0, Math.min(N-1, i));
  $$('.slide').forEach((el,k)=>el.classList.toggle('on', k===i));
  cur = i;
  try{ localStorage.setItem('hsearch-slide', String(i)); }catch(e){}
  $('.pg').textContent = String(i+1).padStart(2,'0') + ' / ' + String(N).padStart(2,'0');
  $('#track i').style.width = ((i+1)/N*100)+'%';
  for(let k=0;k<N;k++){ const b=$('#fbar'+k); if(b) b.style.width = (k<=i?100:0)+'%'; }
  if(panelMode) renderPanel();
  if(!silent) toast(D[i].eyebrow + ' · ' + D[i].title);
}
function next(){ if(cur<N-1) go(cur+1); else stopAuto(); }
function prev(){ if(cur>0) go(cur-1); }

function toast(s){
  const t=$('#toast'); t.textContent=s; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1700);
}

function stopAuto(){
  autoOn=false; clearInterval(autoTimer); autoTimer=null;
  $('#btnAuto').textContent='▶ 自动播放'; $('#btnAuto').classList.remove('act');
}
function toggleAuto(){
  if(autoOn){ stopAuto(); toast('已暂停自动播放'); return; }
  autoOn=true; $('#btnAuto').textContent='❚❚ 暂停'; $('#btnAuto').classList.add('act');
  autoTimer=setInterval(()=>{ if(cur<N-1) go(cur+1,true); else stopAuto(); }, 12000);
  toast('自动播放：每 12 秒一页');
}

/* ---------- 页内讲稿窗：同一按键开/关循环 ---------- */
function noteSection(d,i,curMode){
  return '<div class="nsec'+(curMode&&i===cur?' cur':'')+'" id="note-'+i+'">'
    + '<div class="sn">'+String(i+1).padStart(2,'0')+' · '+d.eyebrow+'</div>'
    + '<h3>'+d.title+'</h3><p>'+d.notes+'</p>'
    + '<div class="nb">'+d.bridge+'</div></div>';
}
function head(mode){
  const titles={here:'本页讲稿',all:'全文讲稿',toc:'目录',help:'快捷键'};
  const kick = mode==='here'
    ? String(cur+1).padStart(2,'0')+' / '+String(N).padStart(2,'0')+' · CURRENT NOTES'
    : (mode==='all'?'FULL SCRIPT':mode==='toc'?'CONTENTS':'SHORTCUTS');
  return '<div class="nhead"><div class="nkicker">'+kick+'</div>'
    + '<h2>'+titles[mode]+'</h2><div class="ntabs">'
    + '<button data-mode="here" class="'+(mode==='here'?'act':'')+'">本页 N</button>'
    + '<button data-mode="all" class="'+(mode==='all'?'act':'')+'">全文 T</button>'
    + '<button data-mode="toc" class="'+(mode==='toc'?'act':'')+'">目录 G</button>'
    + '<button data-mode="help" class="'+(mode==='help'?'act':'')+'">快捷键 ?</button>'
    + '</div></div>';
}
function renderPanel(scrollToCur){
  if(!panelMode) return;
  const mode = panelMode;
  let inner = '';
  if(mode==='here'){
    inner += noteSection(D[cur],cur,true);
  }else if(mode==='all'){
    inner += D.map((d,i)=>noteSection(d,i,false)).join('');
  }else if(mode==='toc'){
    inner += '<div class="tocgrid">'+D.map((d,i)=>
      '<a data-jump="'+i+'" class="'+(i===cur?'tcur':'')+'"><span class="gn">'+String(i+1).padStart(2,'0')+'</span>'
      +'<span class="gt">'+d.title+'</span></a>').join('')+'</div>';
  }else{
    inner += '<div class="keys">'
      +'<div><kbd>← / → / 空格</kbd>上一页 / 下一页</div>'
      +'<div><kbd>F</kbd>全屏 / 退出（底部快捷键常驻）</div>'
      +'<div><kbd>G</kbd>目录：开 / 关</div>'
      +'<div><kbd>N</kbd>本页讲稿：开 / 关</div>'
      +'<div><kbd>T</kbd>全文讲稿：开 / 关，自动定位当前页</div>'
      +'<div><kbd>P</kbd>自动播放 / 暂停</div>'
      +'<div><kbd>1–9</kbd>直接跳到第 N 页</div>'
      +'<div><kbd>Home / End</kbd>首页 / 末页</div>'
      +'<div><kbd>Esc</kbd>关闭讲稿窗 / 退出全屏</div>'
      +'<div><kbd>?</kbd>快捷键：开 / 关</div>'
      +'<div style="margin-top:10px;color:var(--muted);font-size:13px">讲稿采用页内开窗：翻页时右侧讲稿自动跟随；同一按键再按即关闭。</div>'
      +'</div>';
  }
  $('#notesInner').innerHTML = head(mode) + '<div id="noteBody">' + inner + '</div>';
  $('#notesInner').querySelectorAll('[data-mode]').forEach(b=>{
    b.onclick = ()=>{ const m=b.dataset.mode; if(panelMode===m){ closePanel(); } else { panelMode=m; renderPanel(true); } };
  });
  $('#notesInner').querySelectorAll('[data-jump]').forEach(a=>{
    a.onclick = ()=>go(parseInt(a.dataset.jump,10));
  });
  if(mode==='all' || mode==='here'){
    const el=$('#note-'+cur);
    const body2=$('#noteBody');
    if(el && body2){
      body2.scrollTop = Math.max(0, el.offsetTop - 8);
      if(mode==='all') el.classList.add('cur');
    }
  }
}
function openPanel(mode){
  panelMode=mode;
  document.body.classList.add('notes-on');
  renderPanel(true);
  $('#btnNotes').classList.toggle('act',mode==='here');
  $('#btnAll').classList.toggle('act',mode==='all');
  $('#btnToc').classList.toggle('act',mode==='toc');
  fit();
}
function closePanel(){
  panelMode=null;
  document.body.classList.remove('notes-on');
  ['#btnNotes','#btnAll','#btnToc'].forEach(s=>$(s).classList.remove('act'));
  fit();
}
function togglePanel(mode){
  if(panelMode===mode) closePanel(); else openPanel(mode);
}

/* 全屏：优先原生全屏；无论哪种，底部快捷键条都保留 */
function fs(){
  const entering=!document.body.classList.contains('immersive');
  document.body.classList.toggle('immersive',entering);
  $('#btnFs').textContent=entering?'退出全屏 F':'全屏 F';
  $('#btnFs').classList.toggle('act',entering);
  fit();
  toast(entering?'全屏模式：底部快捷键常驻（F 或 Esc 退出）':'已退出全屏');
  try{
    if(entering){
      const pr=document.documentElement.requestFullscreen ? document.documentElement.requestFullscreen() : null;
      if(pr&&pr.catch) pr.catch(()=>{});
    }else if(document.fullscreenElement&&document.exitFullscreen){
      document.exitFullscreen();
    }
  }catch(e){}
}
document.addEventListener('fullscreenchange',()=>{
  if(!document.fullscreenElement && document.body.classList.contains('immersive')){
    document.body.classList.remove('immersive');
    $('#btnFs').textContent='全屏 F'; $('#btnFs').classList.remove('act');
  }
  fit();
});

document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  const k=e.key;
  const typing=(tag==='input'||tag==='select'||tag==='textarea');
  const navKey=(k.indexOf('Arrow')===0||k===' '||k==='Home'||k==='End'||k==='PageUp'||k==='PageDown');
  if(k==='Escape'){
    if(panelMode){ closePanel(); return; }
    if(document.body.classList.contains('immersive')) fs();
    return;
  }
  if(typing && navKey) return;
  if(k==='ArrowRight'||k===' '||k==='PageDown'){ e.preventDefault(); next(); }
  else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); prev(); }
  else if(k==='f'||k==='F'||e.code==='KeyF'){ e.preventDefault(); fs(); }
  else if(k==='g'||k==='G'){ e.preventDefault(); togglePanel('toc'); }
  else if(k==='n'||k==='N'){ e.preventDefault(); togglePanel('here'); }
  else if(k==='t'||k==='T'){ e.preventDefault(); togglePanel('all'); }
  else if(k==='p'||k==='P'){ e.preventDefault(); toggleAuto(); }
  else if(k==='?'||k==='h'||k==='H'){ e.preventDefault(); togglePanel('help'); }
  else if(k==='Home'){ e.preventDefault(); go(0); }
  else if(k==='End'){ e.preventDefault(); go(N-1); }
  else if(/^[1-9]$/.test(k)){ go(parseInt(k,10)-1); }
});

/* ---------- 动画 A：Block-WEAK-AND 剪枝 ---------- */
let wdStep=0, wdTimer=null, wdPlaying=false;
const WD_TOTAL=12;
function wdScan(){
  const th=+$('#wdTh').value;
  let skipped=0, scored=0, t=th;
  const res=[];
  $$('#animWand .wblock').forEach(b=>{
    const ub=+b.getAttribute('data-ub'), i=+b.getAttribute('data-step');
    if(i<=wdStep){
      if(ub<=t){ skipped++; res.push('skip'); }
      else { scored++; t+=0.18; res.push('score'); }
    } else res.push('wait');
  });
  return {skipped,scored,t,res};
}
function wdPaint(){
  const s=wdScan();
  $$('#animWand .wblock').forEach((b,i)=>{
    const st=s.res[i];
    b.setAttribute('fill', st==='skip'?'#F1EFE9':st==='score'?'#F7E9DE':'#FFFFFF');
    b.setAttribute('stroke', st==='skip'?'#89938F':st==='score'?'#BE653B':'#D9D5CB');
    b.setAttribute('stroke-width', st==='wait'?'1.1':'2.0');
    const lab=b.parentNode.querySelector('.wstatus');
    if(lab) lab.textContent = st==='skip'?'跳过':st==='score'?'计分':'';
  });
  const bolt=$('#wdBolt'); if(bolt) bolt.setAttribute('opacity', s.scored>0?'1':'0');
  const out=$('#wdOut');
  if(out){
    out.innerHTML='<b>已扫描 '+wdStep+' / '+WD_TOTAL+' 块</b> · 跳过 '+s.skipped+' · 计分 '+s.scored
      +' · 当前阈值 '+s.t.toFixed(2)+'（示意值）';
    out.title=out.textContent;
  }
  const lbl=$('#wdThLbl'); if(lbl) lbl.textContent='阈值 '+(+$('#wdTh').value).toFixed(1);
}
function wdStop(){
  wdPlaying=false; clearInterval(wdTimer); wdTimer=null;
  const b=$('#wdPlay'); if(b){ b.textContent='▶ 播放'; b.classList.remove('play'); }
}
function wdPlay(){
  if(wdPlaying){ wdStop(); return; }
  wdPlaying=true; $('#wdPlay').textContent='❚❚ 暂停'; $('#wdPlay').classList.add('play');
  if(wdStep>=WD_TOTAL) wdStep=0;
  wdTimer=setInterval(()=>{ wdStep++; wdPaint(); if(wdStep>=WD_TOTAL) wdStop(); },620);
}
function wdTick(){ if(wdStep<WD_TOTAL){ wdStep++; wdPaint(); } }
function wdReset(){ wdStop(); wdStep=0; wdPaint(); }

/* ---------- 动画 B：RRF 融合 ---------- */
let rrStep=0, rrTimer=null, rrPlaying=false;
function rrPaint(){
  const k=+$('#rrK').value, r1=+$('#rrBm').value, r2=+$('#rrVec').value;
  const a=1/(k+r1), b=1/(k+r2), sum=(rrStep>=1?a:0)+(rrStep>=2?b:0);
  const set=(id,v)=>{ const el=$('#'+id); if(el) el.textContent=v; };
  set('rrRankA','r₁ = '+r1); set('rrRankB','r₂ = '+r2);
  set('rrT1', rrStep>=1?('词项 1/(k+r₁) = 1/('+k+'+'+r1+') = '+a.toFixed(4)):'— 待播放 —');
  set('rrT2', rrStep>=2?('词项 1/(k+r₂) = 1/('+k+'+'+r2+') = '+b.toFixed(4)):'— 待播放 —');
  set('rrSum', rrStep>=3?('rrf_score = '+a.toFixed(4)+' + '+b.toFixed(4)+' = '+sum.toFixed(4)):'—');
  set('rrScore', rrStep>=3?sum.toFixed(4):'…');
  const out=$('#rrOut');
  if(out){
    out.innerHTML = rrStep<3
      ? '<b>只看排名，不看分数尺度</b>：k 越小头部差异越大，k 越大两分支越平滑。'
      : '<b>可解释</b>：该文档来自两条分支的排名贡献，而非两个不可比的原始分数相加。';
    out.title=out.textContent;
  }
  const kLbl=$('#rrKLbl'); if(kLbl) kLbl.textContent='k = '+k;
  const r1Lbl=$('#rrBmLbl'); if(r1Lbl) r1Lbl.textContent='BM25 名次 '+r1;
  const r2Lbl=$('#rrVecLbl'); if(r2Lbl) r2Lbl.textContent='向量名次 '+r2;
}
function rrStop(){
  rrPlaying=false; clearInterval(rrTimer); rrTimer=null;
  const b=$('#rrPlay'); if(b){ b.textContent='▶ 播放'; b.classList.remove('play'); }
}
function rrPlay(){
  if(rrPlaying){ rrStop(); return; }
  rrPlaying=true; $('#rrPlay').textContent='❚❚ 暂停'; $('#rrPlay').classList.add('play');
  if(rrStep>=3) rrStep=0;
  rrTimer=setInterval(()=>{ rrStep++; rrPaint(); if(rrStep>=3) rrStop(); },900);
}
function rrTick(){ if(rrStep<3){ rrStep++; rrPaint(); } }
function rrReset(){ rrStop(); rrStep=0; rrPaint(); }

function init(){
  render(); fit();
  let saved=0; try{ saved=parseInt(localStorage.getItem('hsearch-slide')||'0',10)||0; }catch(e){}
  go(saved,true);
  $('#btnPrev').onclick=prev; $('#btnNext').onclick=next;
  $('#btnToc').onclick=()=>togglePanel('toc');
  $('#btnNotes').onclick=()=>togglePanel('here');
  $('#btnAll').onclick=()=>togglePanel('all');
  $('#btnAuto').onclick=toggleAuto; $('#btnFs').onclick=fs;
  $('#btnHelp').onclick=()=>togglePanel('help');
  wdPaint(); rrPaint();
  ['wdTh'].forEach(id=>{ const el=$('#'+id); if(el) el.addEventListener('input',wdPaint); });
  ['rrK','rrBm','rrVec'].forEach(id=>{
    const el=$('#'+id); if(el){ el.addEventListener('input',()=>{ rrStep=3; rrPaint(); }); }
  });
  const bind=(id,fn)=>{ const el=$(id); if(el) el.onclick=fn; };
  bind('#wdPlay',wdPlay); bind('#wdTick',wdTick); bind('#wdReset',wdReset);
  bind('#rrPlay',rrPlay); bind('#rrTick',rrTick); bind('#rrReset',rrReset);
}
document.addEventListener('DOMContentLoaded', init);
</script>
