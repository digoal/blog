y 列可能产生 min / max</text><text x=\"776\" y=\"319.25333333333333\" class=\"sv s\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >组合键可带 bloom 过滤</text><text x=\"776\" y=\"344.8366666666667\" class=\"sv s\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >查询先看元数据，尽量少解压批次</text><text x=\"10\" y=\"422\" class=\"sv s\" font-size=\"12\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"start\" >命题：压缩不是把文件 gzip 一下，而是先分组排序，再按列选算法编码。</text></svg>","caption":"图 08　行存 chunk 经分组与排序变成压缩批次；查询先读稀疏元数据，尽量少解压。","bridge":"压缩让历史变便宜了，但它有两个现实边界；不看清这两个边界，很容易踩坑。","notes":"时序数据有一个天然优势：相邻行经常相似。同一设备的时间戳基本等间隔，温度缓慢变化，状态枚举反复出现。TimescaleDB 的压缩算法就是冲着这个假设设计的，源码 README 里写得很明确。但压缩不是把文件 gzip 一下就完事，它有两个关键配置。第一个是 segmentby，按哪些列分段，常见选择是设备、租户、传感器这些实体键，它既保留过滤能力，也让同一段里的值更连续。第二个是 orderby，批内按什么排序，常见是时间倒序或者时间加其他过滤列，它影响 DeltaDelta、min/max 元数据和范围扫描。然后每列挑算法：时间整数适合 DeltaDelta，浮点可用 Gorilla，低基数字段适合 Dictionary，压不动就退回 Array。查询时先看 min/max、first/last、bloom 这些稀疏元数据，尽量少解压批次。这里有个现实限制在 create.c 里：segmentby 每列会产生一个隐式键，orderby 每列可能产生 min/max 两个键，总数不能超过 PostgreSQL 的 INDEX_MAX_KEYS。所以这两个参数不是越多越好。"},{"eyebrow":"原理三 · 两个边界","title":"压缩配置与压缩时机，各有一条红线","lede":"隐式键有上限；compress_after 要晚于乱序窗口，否则补写会撞上冷 chunk。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ap\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#245A6B\"/></marker><marker id=\"aa\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#BE653B\"/></marker><marker id=\"ag\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#2F7A66\"/></marker><marker id=\"am\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#89938F\"/></marker><marker id=\"ad\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#1E4B5A\"/></marker></defs><rect x=\"40\" y=\"32\" width=\"600\" height=\"300\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\" /><text x=\"58\" y=\"67.1\" class=\"sv s\" font-size=\"18\" fill=\"#245A6B\" font-weight=\"600\" text-anchor=\"start\" >边界一：隐式索引键数量</text><text x=\"58\" y=\"83.71\" class=\"sv s\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >segmentby → 每列 1 个键</text><text x=\"58\" y=\"106.71\" class=\"sv s\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >orderby　 → 每列可能 min/max 两个键</text><text x=\"58\" y=\"129.71\" class=\"sv s\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >组合键总数不能超过 INDEX_MAX_KEYS</text><text x=\"58\" y=\"152.71\" class=\"sv s\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >所以 segmentby / orderby 不是越多越好</text><text x=\"58\" y=\"175.71\" class=\"sv s\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >唯一值做 segmentby：段太小、收益差</text><rect x=\"680\" y=\"32\" width=\"680\" height=\"300\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\" /><text x=\"698\" y=\"67.1\" class=\"sv s\" font-size=\"18\" fill=\"#BE653B\" font-weight=\"600\" text-anchor=\"start\" >边界二：压缩时机</text><text x=\"698\" y=\"83.71\" class=\"sv s\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >compress_after 要晚于乱序 / 补写窗口</text><text x=\"698\" y=\"106.71\" class=\"sv s\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >迟到数据撞上冷 chunk → 解压或重压缩</text><text x=\"698\" y=\"129.71\" class=\"sv s\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >压缩后 DML 会变成部分 chunk 处理</text><text x=\"698\" y=\"152.71\" class=\"sv s\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >保留策略按 chunk 删除，窗口对齐边界</text><text x=\"698\" y=\"175.71\" class=\"sv s\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >可能比窗口略老，但不会删窗口内数据</text><rect x=\"40\" y=\"356\" width=\"1320\" height=\"48\" rx=\"4\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"0\" /><text x=\"700.0\" y=\"385.6\" class=\"sv s\" font-size=\"16\" fill=\"#FFFFFF\" font-weight=\"600\" text-anchor=\"middle\" >两个边界都来自同一个事实：chunk 是物理单位，压缩与删除都以 chunk 为粒度发生</text><text x=\"10\" y=\"422\" class=\"sv s\" font-size=\"12\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"start\" >命题：压缩配置要避开回补窗口，也要算清隐式键的数量。</text></svg>","caption":"图 09　左边是配置层面的键数上限，右边是时机层面的回补窗口；都源于 chunk 是物理单位。","bridge":"存储讲完了，但报表还在反复扫明细。怎么把重复聚合变成增量维护？","notes":"上一页说压缩，这里补两条红线，都是生产上真会踩的。第一条是配置层面：segmentby 每列一个隐式键，orderby 每列可能产生 min/max 两个键，加起来不能超过 INDEX_MAX_KEYS。更现实的是，如果你把唯一值或者高基数列拿去做 segmentby，每个段就特别小，压缩收益很差，元数据成本反而上去了。所以 segmentby 要选真正高频过滤、且基数适中的实体键。第二条是时机层面：compress_after 必须晚于业务的乱序和补写窗口。为什么？因为压缩是以 chunk 为单位的，一旦某块被压成列存，迟到的修正写入就要触发解压、部分 chunk 处理，甚至受写入限制，好好的冷数据又变成写热点。还有一个容易忽略的点：保留策略按 chunk 边界删除，窗口会对齐 chunk，所以保留下来的数据可能比窗口略老一点，但绝不会删掉窗口内的数据——这是按 chunk 删除的边界效应，上线前一定要做恢复演练。"},{"eyebrow":"原理四 · 连续聚合","title":"增量刷新，而不是整表重算","lede":"invalidation log 记录被改的时间范围，只刷新窗口内受影响的桶。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ap\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#245A6B\"/></marker><marker id=\"aa\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#BE653B\"/></marker><marker id=\"ag\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#2F7A66\"/></marker><marker id=\"am\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#89938F\"/></marker><marker id=\"ad\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#1E4B5A\"/></marker></defs><rect x=\"40\" y=\"24\" width=\"340\" height=\"110\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\" /><text x=\"54\" y=\"54.15\" class=\"sv s\" font-size=\"17\" fill=\"#BE653B\" font-weight=\"600\" text-anchor=\"start\" >原始 Hypertable</text><text x=\"54\" y=\"69.67\" class=\"sv s\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >INSERT / UPDATE / DELETE</text><text x=\"54\" y=\"92.67\" class=\"sv s\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >修改的时间范围被记录</text><line x1=\"384\" y1=\"78\" x2=\"466\" y2=\"78\" stroke=\"#BE653B\" stroke-width=\"1.6\" fill=\"none\" marker-end=\"url(#aa)\"/><rect x=\"470\" y=\"24\" width=\"380\" height=\"110\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.2\" /><text x=\"484\" y=\"53.2\" class=\"sv s\" font-size=\"16\" fill=\"#AE8A3E\" font-weight=\"600\" text-anchor=\"start\" >Hypertable Invalidation Log</text><text x=\"484\" y=\"68.06\" class=\"sv s\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >每事务尽量合并为范围</text><text x=\"484\" y=\"91.06\" class=\"sv s\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >threshold 之后的热区暂不写入</text><line x1=\"854\" y1=\"78\" x2=\"936\" y2=\"78\" stroke=\"#AE8A3E\" stroke-width=\"1.6\" fill=\"none\" marker-end=\"url(#am)\"/><rect x=\"940\" y=\"24\" width=\"420\" height=\"110\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.2\" /><text x=\"954\" y=\"53.2\" class=\"sv s\" font-size=\"16\" fill=\"#AE8A3E\" font-weight=\"600\" text-anchor=\"start\" >Cagg Invalidation Log</text><text x=\"954\" y=\"68.06\" class=\"sv s\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >刷新时从 hypertable log 切分</text><text x=\"954\" y=\"91.06\" class=\"sv s\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >只标记窗口内的无效区域</text><path d=\"M1150 134 L1150 164 L660 164 L660 196\" fill=\"none\" stroke=\"#AE8A3E\" stroke-width=\"1.5\" marker-end=\"url(#am)\"/><rect x=\"40\" y=\"198\" width=\"340\" height=\"118\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"54\" y=\"227.2\" class=\"sv s\" font-size=\"16\" fill=\"#1B2B33\" font-weight=\"600\" text-anchor=\"start\" >刷新策略 / 手工刷新</text><text x=\"54\" y=\"242.06\" class=\"sv s\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >refresh_continuous_aggregate</text><text x=\"54\" y=\"265.06\" class=\"sv s\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >add_continuous_aggregate_policy</text><line x1=\"384\" y1=\"256\" x2=\"466\" y2=\"256\" stroke=\"#2F7A66\" stroke-width=\"1.6\" fill=\"none\" marker-end=\"url(#ag)\"/><rect x=\"470\" y=\"198\" width=\"380\" height=\"118\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\" /><text x=\"484\" y=\"227.2\" class=\"sv s\" font-size=\"16\" fill=\"#2F7A66\" font-weight=\"600\" text-anchor=\"start\" >内部物化 Hypertable</text><text x=\"484\" y=\"242.06\" class=\"sv s\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >按 time_bucket 存 partial state</text><text x=\"484\" y=\"265.06\" class=\"sv s\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >avg 可能存 sum / count 中间态</text><line x1=\"854\" y1=\"256\" x2=\"936\" y2=\"256\" stroke=\"#245A6B\" stroke-width=\"1.6\" fill=\"none\" marker-end=\"url(#ap)\"/><rect x=\"940\" y=\"198\" width=\"420\" height=\"118\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\" /><text x=\"954\" y=\"227.2\" class=\"sv s\" font-size=\"16\" fill=\"#245A6B\" font-weight=\"600\" text-anchor=\"start\" >用户查询视图</text><text x=\"954\" y=\"242.06\" class=\"sv s\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >查询时 finalize partial state</text><text x=\"954\" y=\"265.06\" class=\"sv s\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >可叠加实时部分，需验证版本行为</text><rect x=\"40\" y=\"344\" width=\"1320\" height=\"62\" rx=\"4\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"0\" /><text x=\"700.0\" y=\"380.95\" class=\"sv s\" font-size=\"17\" fill=\"#FFFFFF\" font-weight=\"600\" text-anchor=\"middle\" >正确性来自 invalidation log + 刷新窗口，而不是定时重建整张结果表</text><text x=\"10\" y=\"422\" class=\"sv s\" font-size=\"12\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"start\" >命题：连续聚合只刷新被标记的时间桶，不是整表重算。</text></svg>","caption":"图 10　从原始 hypertable 到两级 invalidation log，再到物化表与用户视图的完整流转。","bridge":"增量刷新已经成立，但「刷新窗口怎么选」还藏着一个和写入抢资源的矛盾。","notes":"普通 materialized view 的痛点大家都体会过：数据越多，刷新越贵，因为每次都重算。连续聚合换了个思路：按 time_bucket 把聚合切开，内部用一张 materialization hypertable 保存 partial aggregate state。比如 avg，它不一定存最终均值，而是存 sum 和 count 这类中间态，查询时再 finalize。那它怎么知道哪些桶该重算？靠 invalidation。对原始 hypertable 的 INSERT、UPDATE、DELETE、TRUNCATE、drop_chunks 都会形成需要重刷的时间范围，流转路径是 insert_trigger 到 hypertable_inval_log，再到 cagg_inval_log，最后才是 refreshing。刷新时把 hypertable 的 log 切分到具体连续聚合的 log，只处理窗口内的无效区域。还有个细节叫 invalidation threshold：threshold 之后的热区不急着写 invalidation，由刷新窗口和实时查询覆盖，这样能降低热桶的写放大。所以你看，正确性来自 log 和窗口，不是定时重建整张结果表——这是这一页最想让你记住的一句话。"},{"eyebrow":"原理四 · 刷新窗口","title":"连续聚合是最终正确，不是秒级最新","lede":"end_offset 把热区留在刷新窗口之外，避免刷新和写入互相干扰。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ap\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#245A6B\"/></marker><marker id=\"aa\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#BE653B\"/></marker><marker id=\"ag\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#2F7A66\"/></marker><marker id=\"am\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#89938F\"/></marker><marker id=\"ad\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#1E4B5A\"/></marker></defs><rect x=\"40\" y=\"22\" width=\"1320\" height=\"54\" rx=\"4\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"0\" /><text x=\"700.0\" y=\"55.65\" class=\"sv s\" font-size=\"19\" fill=\"#FFFFFF\" font-weight=\"600\" text-anchor=\"middle\" >连续聚合是「最终正确」，不是秒级最新</text><line x1=\"700\" y1=\"76\" x2=\"700\" y2=\"100\" stroke=\"#245A6B\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#ap)\"/><rect x=\"40\" y=\"102\" width=\"420\" height=\"150\" rx=\"4\" fill=\"#CFE0DC\" stroke=\"#7BA6AF\" stroke-width=\"1.2\" /><text x=\"55\" y=\"133.15\" class=\"sv s\" font-size=\"17\" fill=\"#1E4B5A\" font-weight=\"600\" text-anchor=\"start\" >更早：已稳定区</text><text x=\"55\" y=\"148.67000000000002\" class=\"sv s\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >invalidation 已消费</text><text x=\"55\" y=\"171.67000000000002\" class=\"sv s\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >结果由物化表提供</text><text x=\"55\" y=\"194.67000000000002\" class=\"sv s\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >适合固定粒度报表</text><rect x=\"480\" y=\"102\" width=\"480\" height=\"150\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\" /><text x=\"495\" y=\"132.675\" class=\"sv s\" font-size=\"16.5\" fill=\"#2F7A66\" font-weight=\"600\" text-anchor=\"start\" >刷新窗口 start_offset → end_offset</text><text x=\"495\" y=\"147.65\" class=\"sv s\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >只刷 invalidation 覆盖的桶</text><text x=\"495\" y=\"170.65\" class=\"sv s\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >避开最热、最易迟到的时间段</text><text x=\"495\" y=\"193.65\" class=\"sv s\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >end_offset 通常留 1 小时左右</text><text x=\"495\" y=\"216.65\" class=\"sv s\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >是否合理取决于业务乱序窗口</text><rect x=\"980\" y=\"102\" width=\"380\" height=\"150\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\" /><text x=\"995\" y=\"133.15\" class=\"sv s\" font-size=\"17\" fill=\"#BE653B\" font-weight=\"600\" text-anchor=\"start\" >热区：end_offset 之内</text><text x=\"995\" y=\"148.67000000000002\" class=\"sv s\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >不急着写 invalidation</text><text x=\"995\" y=\"171.67000000000002\" class=\"sv s\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >由实时查询 / 原表覆盖</text><text x=\"995\" y=\"194.67000000000002\" class=\"sv s\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >避免刷新与写入抢资源</text><line x1=\"250\" y1=\"252\" x2=\"250\" y2=\"286\" stroke=\"#7BA6AF\" stroke-width=\"1.4\" fill=\"none\" marker-end=\"url(#am)\"/><line x1=\"720\" y1=\"252\" x2=\"720\" y2=\"286\" stroke=\"#2F7A66\" stroke-width=\"1.4\" fill=\"none\" marker-end=\"url(#ag)\"/><line x1=\"1170\" y1=\"252\" x2=\"1170\" y2=\"286\" stroke=\"#BE653B\" stroke-width=\"1.4\" fill=\"none\" marker-end=\"url(#aa)\"/><rect x=\"40\" y=\"288\" width=\"1320\" height=\"92\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"0\" /><text x=\"700.0\" y=\"339.775\" class=\"sv s\" font-size=\"16.5\" fill=\"#1B2B33\" font-weight=\"600\" text-anchor=\"middle\" >需要秒级最新值：查原表的热数据 + 查连续聚合的历史区；或使用实时聚合能力，但必须验证当前版本行为。</text><text x=\"10\" y=\"422\" class=\"sv s\" font-size=\"12\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"start\" >命题：刷新窗口要避开热区，否则 invalidation 写放大、重刷成本上升。</text></svg>","caption":"图 11　时间轴三段：稳定区、刷新窗口、热区；end_offset 正是热区的保护带。","bridge":"五件事——分区、路由、裁剪、压缩、聚合——都讲完了，谁来把它们按时间自动跑起来？","notes":"连续聚合最容易引起误解的地方，是有人把它当成强一致实时视图。它不是。看这条时间轴：更早的稳定区，invalidation 已经消费完，结果由物化表提供；中间是刷新窗口，由 start_offset 和 end_offset 定义，只刷 invalidation 覆盖的桶；最右边是热区，在 end_offset 之内，不急着写 invalidation，由实时查询或者直接查原表覆盖。为什么要留这条保护带？因为刷新和写入会抢资源，如果刷新窗口一路盖到最热、最容易迟到的时间段，invalidation 会放大，重刷成本也上去。例子里 end_offset 是一小时，但它合不合理完全取决于业务的乱序窗口——你的数据迟到多久，这个边界就该往哪边挪。如果业务真的要秒级最新值，正确做法是最近的热数据直接查原表，历史区查连续聚合，或者使用实时聚合能力，但一定要验证当前版本的行为，别想当然。"},{"eyebrow":"原理五 · 后台策略","title":"把生命周期变成数据库内的任务","lede":"热区行存、温区聚合、冷区压缩、过期区按 chunk 删除，各自交给一条策略。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ap\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#245A6B\"/></marker><marker id=\"aa\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#BE653B\"/></marker><marker id=\"ag\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#2F7A66\"/></marker><marker id=\"am\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#89938F\"/></marker><marker id=\"ad\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#1E4B5A\"/></marker></defs><rect x=\"40\" y=\"20\" width=\"1320\" height=\"50\" rx=\"4\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"0\" /><text x=\"700.0\" y=\"51.3\" class=\"sv s\" font-size=\"18\" fill=\"#FFFFFF\" font-weight=\"600\" text-anchor=\"middle\" >先保证热写与近实时查询，再把历史自动转成便宜的形态</text><line x1=\"60\" y1=\"246\" x2=\"1340\" y2=\"246\" stroke=\"#89938F\" stroke-width=\"2.0\" fill=\"none\" marker-end=\"url(#am)\"/><text x=\"60\" y=\"276\" class=\"sv s\" font-size=\"13\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"start\" >过去</text><text x=\"1300\" y=\"276\" class=\"sv s\" font-size=\"13\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"start\" >现在</text><rect x=\"60\" y=\"106\" width=\"300\" height=\"108\" rx=\"4\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"0\" /><text x=\"210.0\" y=\"150\" class=\"sv serif\" font-size=\"19\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"middle\" >过期区</text><text x=\"210.0\" y=\"184\" class=\"sv s\" font-size=\"13.5\" fill=\"#FFFFFF\" font-weight=\"400\" text-anchor=\"middle\" >按 chunk 删除</text><rect x=\"380\" y=\"106\" width=\"320\" height=\"108\" rx=\"4\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"0\" /><text x=\"540.0\" y=\"150\" class=\"sv serif\" font-size=\"19\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"middle\" >冷区</text><text x=\"540.0\" y=\"184\" class=\"sv s\" font-size=\"13.5\" fill=\"#FFFFFF\" font-weight=\"400\" text-anchor=\"middle\" >压缩 / 列存为主</text><rect x=\"720\" y=\"106\" width=\"320\" height=\"108\" rx=\"4\" fill=\"#74A5AD\" stroke=\"#74A5AD\" stroke-width=\"0\" /><text x=\"880.0\" y=\"150\" class=\"sv serif\" font-size=\"19\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"middle\" >温区</text><text x=\"880.0\" y=\"184\" class=\"sv s\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" text-anchor=\"middle\" >连续聚合覆盖</text><rect x=\"1060\" y=\"106\" width=\"280\" height=\"108\" rx=\"4\" fill=\"#EBF1EE\" stroke=\"#EBF1EE\" stroke-width=\"0\" /><text x=\"1200.0\" y=\"150\" class=\"sv serif\" font-size=\"19\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"middle\" >热区</text><text x=\"1200.0\" y=\"184\" class=\"sv s\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"400\" text-anchor=\"middle\" >行存写入 + 实时查询</text><line x1=\"210\" y1=\"286\" x2=\"210\" y2=\"318\" stroke=\"#89938F\" stroke-width=\"1.4\" fill=\"none\" marker-end=\"url(#am)\"/><line x1=\"540\" y1=\"286\" x2=\"540\" y2=\"318\" stroke=\"#89938F\" stroke-width=\"1.4\" fill=\"none\" marker-end=\"url(#am)\"/><line x1=\"880\" y1=\"286\" x2=\"880\" y2=\"318\" stroke=\"#89938F\" stroke-width=\"1.4\" fill=\"none\" marker-end=\"url(#am)\"/><line x1=\"1200\" y1=\"286\" x2=\"1200\" y2=\"318\" stroke=\"#89938F\" stroke-width=\"1.4\" fill=\"none\" marker-end=\"url(#am)\"/><rect x=\"60\" y=\"320\" width=\"300\" height=\"84\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"72\" y=\"346.25\" class=\"sv s\" font-size=\"15\" fill=\"#245A6B\" font-weight=\"600\" text-anchor=\"start\" >add_retention_policy</text><text x=\"72\" y=\"360.45\" class=\"sv s\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >drop_after 晚于审计需求</text><rect x=\"380\" y=\"320\" width=\"320\" height=\"84\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"392\" y=\"345.775\" class=\"sv s\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"600\" text-anchor=\"start\" >add_compression_policy</text><text x=\"392\" y=\"359.86\" class=\"sv s\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >compress_after 晚于乱序窗口</text><rect x=\"720\" y=\"320\" width=\"320\" height=\"84\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"732\" y=\"344.825\" class=\"sv s\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"600\" text-anchor=\"start\" >add_continuous_aggregate_policy</text><text x=\"732\" y=\"358.68\" class=\"sv s\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >start_offset / end_offset</text><rect x=\"1060\" y=\"320\" width=\"280\" height=\"84\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"1072\" y=\"346.25\" class=\"sv s\" font-size=\"15\" fill=\"#245A6B\" font-weight=\"600\" text-anchor=\"start\" >暂不压缩 / 延迟刷新</text><text x=\"1072\" y=\"360.45\" class=\"sv s\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >保留行存与索引能力</text><text x=\"10\" y=\"422\" class=\"sv s\" font-size=\"12\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"start\" >命题：每个窗口都要和业务的迟到数据、审计保留、查询 SLA 对齐。</text></svg>","caption":"图 12　沿时间轴布置四个窗口，每条策略负责一个区；窗口要与业务边界对齐。","bridge":"机制齐了，可以横着比一比：和原生分区、独立时序库、离线方案比，它到底站在哪？","notes":"前面讲的分区、路由、裁剪、压缩、连续聚合，如果都要人手工跑，就又回到外部脚本那条老路了。TimescaleDB 的第五件事，是把这些动作变成数据库内部的任务，由 background worker 调度。sql/policy_api.sql 暴露了几条核心策略：add_retention_policy 按 drop_after 删除过期 chunk；add_compression_policy 或新版的 add_columnstore_policy，把达到时间条件的 chunk 转成压缩列存；add_continuous_aggregate_policy 按 start_offset、end_offset、schedule_interval 刷新连续聚合；还有 add_reorder_policy 按索引重排 chunk 改善局部性。这些不是 crontab 的简单替代——它们在数据库内部读取 hypertable、chunk、continuous aggregate 的 catalog 和 job config，自己算窗口再执行。比如压缩策略会先用 show_chunks 找出满足条件的 chunk，再调用 compress_chunk。一个健康的时序库就应该照这张图设计：热区保行存和索引，温区用连续聚合减少重复扫描，冷区转列存，过期区按 chunk 边界删。每个窗口都要和迟到数据、审计保留、查询 SLA 对齐。"},{"eyebrow":"横向 · 定位比较","title":"选它，不是因为它最快","lede":"真正的理由是：时序能力落在 PostgreSQL 生态内，业务表、权限、备份都能共用。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ap\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#245A6B\"/></marker><marker id=\"aa\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#BE653B\"/></marker><marker id=\"ag\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#2F7A66\"/></marker><marker id=\"am\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#89938F\"/></marker><marker id=\"ad\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#1E4B5A\"/></marker></defs><text x=\"700\" y=\"30\" class=\"sv s\" font-size=\"14\" fill=\"#46585F\" font-weight=\"600\" text-anchor=\"middle\" >时序自动化程度　↑</text><text x=\"58\" y=\"210\" class=\"sv s\" font-size=\"13\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"middle\" >关系能力弱</text><text x=\"1342\" y=\"210\" class=\"sv s\" font-size=\"13\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"middle\" >关系能力强</text><rect x=\"120\" y=\"44\" width=\"570\" height=\"150\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"137\" y=\"79.05\" class=\"sv s\" font-size=\"19\" fill=\"#1B2B33\" font-weight=\"600\" text-anchor=\"start\" >独立时序数据库</text><text x=\"137\" y=\"95.46000000000001\" class=\"sv s\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >指标 / 监控 / 海量遥测见长</text><text x=\"137\" y=\"118.46000000000001\" class=\"sv s\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >关系、JOIN、事务通常较弱</text><text x=\"137\" y=\"141.46\" class=\"sv s\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >需要引入独立系统</text><rect x=\"710\" y=\"44\" width=\"570\" height=\"150\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\" /><text x=\"727\" y=\"79.05\" class=\"sv s\" font-size=\"19\" fill=\"#2F7A66\" font-weight=\"600\" text-anchor=\"start\" >TimescaleDB Hypertable</text><text x=\"727\" y=\"95.46000000000001\" class=\"sv s\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >时序自动化 + 完整 PostgreSQL SQL</text><text x=\"727\" y=\"118.46000000000001\" class=\"sv s\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >业务表 / 维表 / 权限 / 备份共用</text><text x=\"727\" y=\"141.46\" class=\"sv s\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >仍有 extension 与策略运维边界</text><rect x=\"120\" y=\"224\" width=\"570\" height=\"150\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"137\" y=\"259.05\" class=\"sv s\" font-size=\"19\" fill=\"#1B2B33\" font-weight=\"600\" text-anchor=\"start\" >对象存储 + 离线引擎</text><text x=\"137\" y=\"275.46000000000004\" class=\"sv s\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >冷数据成本最低，适合归档</text><text x=\"137\" y=\"298.46000000000004\" class=\"sv s\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >交互式查询依赖外部引擎</text><text x=\"137\" y=\"321.46000000000004\" class=\"sv s\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >数据链路与一致性复杂</text><rect x=\"710\" y=\"224\" width=\"570\" height=\"150\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\" /><text x=\"727\" y=\"259.05\" class=\"sv s\" font-size=\"19\" fill=\"#245A6B\" font-weight=\"600\" text-anchor=\"start\" >PostgreSQL 原生分区</text><text x=\"727\" y=\"275.46000000000004\" class=\"sv s\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >关系能力强，规则简单可控</text><text x=\"727\" y=\"298.46000000000004\" class=\"sv s\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >压缩 / 连续聚合 / 生命周期自建</text><text x=\"727\" y=\"321.46000000000004\" class=\"sv s\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >需要团队自行设计与维护</text><rect x=\"120\" y=\"382\" width=\"1160\" height=\"26\" rx=\"4\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"0\" /><text x=\"700.0\" y=\"399.725\" class=\"sv s\" font-size=\"13.5\" fill=\"#FFFFFF\" font-weight=\"600\" text-anchor=\"middle\" >选型理由不是「比所有时序库都快」，而是时序能力落在 PostgreSQL 生态内</text><text x=\"10\" y=\"422\" class=\"sv s\" font-size=\"12\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"start\" >命题：边界在于自动化落在哪，不在于单点性能宣传。</text></svg>","caption":"图 13　四种方案在「时序自动化 × 关系能力」上的位置；TimescaleDB 的取舍很清楚。","bridge":"定位清楚了，最后落到最实际的问题：收益到底是什么，代价又是什么？","notes":"经常有人问我：TimescaleDB 和其他时序库比谁更快？这个问题其实问偏了。看这张定位图：独立时序数据库在指标、监控、海量遥测上很强，但关系、JOIN、事务通常弱，还要引入一套独立系统；对象存储加离线引擎冷数据成本最低，但交互式查询得靠外部引擎，数据链路和一致性复杂；PostgreSQL 原生分区关系能力强、规则简单，但压缩、连续聚合、生命周期都得自建。TimescaleDB 站的位置是：时序自动化加完整 PostgreSQL SQL，业务表、维表、权限、备份都能共用。所以选择它的核心理由不是「比所有时序库都快」，而是它把时序能力放进了 PostgreSQL 生态。反过来，如果你只需要 Prometheus 风格的指标查询，或者所有历史数据只进对象存储做离线分析，那它不一定是最小系统。选型的关键，是看你的访问模式能不能落到时间轴上，以及你愿不愿意承担 extension 升级和 TSL 功能差异带来的运维约束。"},{"eyebrow":"收益 · 与代价对照","title":"四项收益，四项对应的代价","lede":"少扫、稳定、便宜、少重算都真实；代价分别落在 interval、路由、解压和状态维护上。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ap\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#245A6B\"/></marker><marker id=\"aa\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#BE653B\"/></marker><marker id=\"ag\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#2F7A66\"/></marker><marker id=\"am\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#89938F\"/></marker><marker id=\"ad\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#1E4B5A\"/></marker></defs><rect x=\"40\" y=\"22\" width=\"420\" height=\"42\" rx=\"4\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"0\" /><text x=\"250.0\" y=\"48.6\" class=\"sv s\" font-size=\"16\" fill=\"#FFFFFF\" font-weight=\"600\" text-anchor=\"middle\" >收益方向</text><rect x=\"470\" y=\"22\" width=\"420\" height=\"42\" rx=\"4\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"0\" /><text x=\"680.0\" y=\"48.6\" class=\"sv s\" font-size=\"16\" fill=\"#FFFFFF\" font-weight=\"600\" text-anchor=\"middle\" >为什么有效</text><rect x=\"900\" y=\"22\" width=\"460\" height=\"42\" rx=\"4\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"0\" /><text x=\"1130.0\" y=\"48.6\" class=\"sv s\" font-size=\"16\" fill=\"#FFFFFF\" font-weight=\"600\" text-anchor=\"middle\" >必须接受的代价</text><rect x=\"40\" y=\"72\" width=\"420\" height=\"64\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"0\" /><text x=\"250.0\" y=\"110.65\" class=\"sv s\" font-size=\"19\" fill=\"#2F7A66\" font-weight=\"600\" text-anchor=\"middle\" >查询少扫</text><rect x=\"470\" y=\"72\" width=\"420\" height=\"64\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"484\" y=\"101.2\" class=\"sv s\" font-size=\"16\" fill=\"#1B2B33\" font-weight=\"600\" text-anchor=\"start\" >时间条件映射到 chunk 约束</text><rect x=\"900\" y=\"72\" width=\"460\" height=\"64\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\" /><text x=\"914\" y=\"100.25\" class=\"sv s\" font-size=\"15\" fill=\"#BE653B\" font-weight=\"600\" text-anchor=\"start\" >依赖 interval、SQL 写法与统计信息</text><rect x=\"40\" y=\"148\" width=\"420\" height=\"64\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"0\" /><text x=\"250.0\" y=\"186.65\" class=\"sv s\" font-size=\"19\" fill=\"#2F7A66\" font-weight=\"600\" text-anchor=\"middle\" >写入稳定</text><rect x=\"470\" y=\"148\" width=\"420\" height=\"64\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"484\" y=\"177.2\" class=\"sv s\" font-size=\"16\" fill=\"#1B2B33\" font-weight=\"600\" text-anchor=\"start\" >只接触当前热 chunk</text><rect x=\"900\" y=\"148\" width=\"460\" height=\"64\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\" /><text x=\"914\" y=\"176.25\" class=\"sv s\" font-size=\"15\" fill=\"#BE653B\" font-weight=\"600\" text-anchor=\"start\" >chunk 创建、catalog 元数据与路由成本</text><rect x=\"40\" y=\"224\" width=\"420\" height=\"64\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"0\" /><text x=\"250.0\" y=\"262.65\" class=\"sv s\" font-size=\"19\" fill=\"#2F7A66\" font-weight=\"600\" text-anchor=\"middle\" >历史便宜</text><rect x=\"470\" y=\"224\" width=\"420\" height=\"64\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"484\" y=\"253.2\" class=\"sv s\" font-size=\"16\" fill=\"#1B2B33\" font-weight=\"600\" text-anchor=\"start\" >行存转为压缩列存</text><rect x=\"900\" y=\"224\" width=\"460\" height=\"64\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\" /><text x=\"914\" y=\"252.25\" class=\"sv s\" font-size=\"15\" fill=\"#BE653B\" font-weight=\"600\" text-anchor=\"start\" >压缩后 DML 与回补可能触发解压</text><rect x=\"40\" y=\"300\" width=\"420\" height=\"64\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"0\" /><text x=\"250.0\" y=\"338.65\" class=\"sv s\" font-size=\"19\" fill=\"#2F7A66\" font-weight=\"600\" text-anchor=\"middle\" >聚合少重算</text><rect x=\"470\" y=\"300\" width=\"420\" height=\"64\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"484\" y=\"329.2\" class=\"sv s\" font-size=\"16\" fill=\"#1B2B33\" font-weight=\"600\" text-anchor=\"start\" >只刷新 invalidation 桶</text><rect x=\"900\" y=\"300\" width=\"460\" height=\"64\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\" /><text x=\"914\" y=\"328.25\" class=\"sv s\" font-size=\"15\" fill=\"#BE653B\" font-weight=\"600\" text-anchor=\"start\" >invalidation log、窗口、partial state 复杂度</text><text x=\"10\" y=\"422\" class=\"sv s\" font-size=\"12\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"start\" >命题：四项收益都真实，但复杂度只是从业务代码搬到了数据库内部。</text></svg>","caption":"图 14　每一行左侧是收益、中间是机制、右侧是必须接受的代价，一一对应。","bridge":"收益和代价都说清了，那怎么确认自己真的拿到了收益？答案是量测，不是相信。","notes":"这一页我们把收益摊开，但每一项都连着它的代价，这样才诚实。第一，查询少扫：时间条件映射到 chunk 约束后，计划期和执行期都能排除无关 chunk，但效果取决于 interval、SQL 写法和统计信息——写法不对，收益直接归零。第二，写入稳定：单个 chunk 和索引比全局巨表小，插入只接触当前热 chunk，但代价是 chunk 创建、catalog 元数据与分区路由。第三，历史便宜：压缩列存减少空间和分析 IO，但压缩后 DML、回补、更新可能触发解压或部分 chunk 处理。第四，聚合少重算：连续聚合只刷新 invalidation 覆盖的桶，但代价是 invalidation log、刷新窗口、partial state 和策略调度的复杂度。你看，四项收益都真实，但没有哪一项是白来的。复杂度没有消失，只是从业务代码搬到了数据库内部——这句话今天已经说了三遍，因为它就是理解 TimescaleDB 的关键。"},{"eyebrow":"实证 · 自己量测","title":"不凭宣传数字设计容量","lede":"用 EXPLAIN 验证裁剪，用 size 函数验证压缩；90%+ 只是示例，不是承诺。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ap\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#245A6B\"/></marker><marker id=\"aa\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#BE653B\"/></marker><marker id=\"ag\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#2F7A66\"/></marker><marker id=\"am\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#89938F\"/></marker><marker id=\"ad\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#1E4B5A\"/></marker></defs><rect x=\"40\" y=\"24\" width=\"420\" height=\"48\" rx=\"4\" fill=\"#EBF1EE\" stroke=\"#EBF1EE\" stroke-width=\"0\" /><text x=\"250.0\" y=\"52.9\" class=\"sv mono\" font-size=\"14\" fill=\"#245A6B\" font-weight=\"500\" text-anchor=\"middle\" >hypertable_size(&#x27;metrics&#x27;)</text><rect x=\"482\" y=\"24\" width=\"420\" height=\"48\" rx=\"4\" fill=\"#EBF1EE\" stroke=\"#EBF1EE\" stroke-width=\"0\" /><text x=\"692.0\" y=\"52.9\" class=\"sv mono\" font-size=\"14\" fill=\"#245A6B\" font-weight=\"500\" text-anchor=\"middle\" >chunks_detailed_size(&#x27;metrics&#x27;)</text><rect x=\"924\" y=\"24\" width=\"420\" height=\"48\" rx=\"4\" fill=\"#EBF1EE\" stroke=\"#EBF1EE\" stroke-width=\"0\" /><text x=\"1134.0\" y=\"52.9\" class=\"sv mono\" font-size=\"14\" fill=\"#245A6B\" font-weight=\"500\" text-anchor=\"middle\" >timescaledb_information.chunks</text><rect x=\"40\" y=\"100\" width=\"630\" height=\"256\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\" /><text x=\"57\" y=\"134.1\" class=\"sv s\" font-size=\"18\" fill=\"#2F7A66\" font-weight=\"600\" text-anchor=\"start\" >验证查询裁剪</text><text x=\"57\" y=\"150.28\" class=\"sv s\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >EXPLAIN (ANALYZE, BUFFERS) 看计划</text><text x=\"57\" y=\"173.28\" class=\"sv s\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >是否出现 Custom Scan (ChunkAppend)</text><text x=\"57\" y=\"196.28\" class=\"sv s\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >扫描了几个 chunk，BUFFERS 读多少</text><text x=\"57\" y=\"219.28\" class=\"sv s\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >是否有 Chunks excluded</text><text x=\"57\" y=\"242.28\" class=\"sv s\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >是否有 Startup / Runtime Exclusion</text><text x=\"57\" y=\"265.28000000000003\" class=\"sv s\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >若全 chunk 扫描 → 检查 SQL 写法</text><rect x=\"720\" y=\"100\" width=\"640\" height=\"256\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\" /><text x=\"737\" y=\"134.1\" class=\"sv s\" font-size=\"18\" fill=\"#BE653B\" font-weight=\"600\" text-anchor=\"start\" >验证压缩效果</text><text x=\"737\" y=\"150.28\" class=\"sv s\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >比较压缩前后 chunk size</text><text x=\"737\" y=\"173.28\" class=\"sv s\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >看计划是否走 columnar scan</text><text x=\"737\" y=\"196.28\" class=\"sv s\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >观察查询是否大量解压</text><text x=\"737\" y=\"219.28\" class=\"sv s\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >90%+ 只是 README 示例，不是承诺</text><text x=\"737\" y=\"242.28\" class=\"sv s\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >依赖分布 / segmentby / orderby / 乱序度</text><text x=\"737\" y=\"265.28000000000003\" class=\"sv s\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >生产前用自己的数据抽样验证</text><rect x=\"40\" y=\"374\" width=\"1320\" height=\"32\" rx=\"4\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"0\" /><text x=\"700.0\" y=\"395.25\" class=\"sv s\" font-size=\"15\" fill=\"#FFFFFF\" font-weight=\"600\" text-anchor=\"middle\" >不凭宣传数字设计容量：先抽样，再量测，最后定窗口参数</text><text x=\"10\" y=\"422\" class=\"sv s\" font-size=\"12\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"start\" >命题：正确性用 EXPLAIN 和 size 函数验证，不用想象。</text></svg>","caption":"图 15　上排是三个量测入口，下面分别给出验证裁剪与验证压缩要看的信号。","bridge":"量测方法有了。最后按角色收口：架构师、DBA、开发者各自要守住哪件事？","notes":"这一页我想把「实证」两个字落到实处。TimescaleDB 的 README 里提到典型时序压缩可以达到 90% 以上，但这依赖数据分布、segmentby 和 orderby 的选择、列类型、乱序程度和查询模式，绝对不能拿它当容量设计的输入。生产前应该用自己的数据抽样验证：先跑 hypertable_size 看整体，再跑 chunks_detailed_size 看每个 chunk，必要时查 timescaledb_information.chunks 看窗口和范围。验证查询裁剪，优先看 EXPLAIN (ANALYZE, BUFFERS) 里有没有 Custom Scan (ChunkAppend)、到底扫了几个 chunk、有没有 Chunks excluded 和 Runtime Exclusion；如果全 chunk 扫描，先回头查 SQL 写法。验证压缩效果，就比较压缩前后的 chunk size，再看计划是不是走了 columnar scan、查询有没有大量解压。一句话：正确性用 EXPLAIN 和 size 函数验证，不用想象，更不用宣传数字。"},{"eyebrow":"落地 · 三类角色","title":"分工不同，守的是同一条时间轴","lede":"架构师画窗口，DBA 盯状态，开发者写可裁剪的查询。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ap\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#245A6B\"/></marker><marke width=\"400\" height=\"46\" rx=\"4\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"0\" /><text x=\"680\" y=\"55\" class=\"sv serif\" font-size=\"20\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"middle\" >DBA</text><rect x=\"480\" y=\"70\" width=\"400\" height=\"296\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\" /><text x=\"498\" y=\"97.5\" class=\"sv s\" font-size=\"10\" fill=\"#1B2B33\" font-weight=\"600\" text-anchor=\"start\" ></text><text x=\"498\" y=\"111.84\" class=\"sv s\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >监控 chunk 数量、大小、压缩状态</text><text x=\"498\" y=\"157.84\" class=\"sv s\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >盯后台 job 成功率与 refresh lag</text><text x=\"498\" y=\"203.84\" class=\"sv s\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >定期 EXPLAIN 检查裁剪是否还生效</text><text x=\"498\" y=\"249.84\" class=\"sv s\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >compress_after 晚于回补 / 乱序窗口</text><text x=\"498\" y=\"295.84000000000003\" class=\"sv s\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >retention 上线前做恢复演练</text><rect x=\"920\" y=\"24\" width=\"400\" height=\"46\" rx=\"4\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"0\" /><text x=\"1120\" y=\"55\" class=\"sv serif\" font-size=\"20\" fill=\"#FFFFFF\" font-weight=\"700\" text-anchor=\"middle\" >业务开发者</text><rect x=\"920\" y=\"70\" width=\"400\" height=\"296\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\" /><text x=\"938\" y=\"97.5\" class=\"sv s\" font-size=\"10\" fill=\"#1B2B33\" font-weight=\"600\" text-anchor=\"start\" ></text><text x=\"938\" y=\"111.84\" class=\"sv s\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >核心查询显式带时间范围</text><text x=\"938\" y=\"157.84\" class=\"sv s\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >最新状态另 整收束起来。","notes":"最后说边界。适合的场景很清晰：IoT、车辆、能源、工业设备、金融 tick、用户行为、日志事件这类持续追加的数据；查询经常带时间范围，并且要和关系表 JOIN；历史读多写少，可以按 chunk 压缩和保留；固定粒度报表多，比如分钟、小时、天级；团队已经有 PostgreSQL 运维能力，希望少引一套新系统。不适合的场景也很清晰：几乎所有查询都不带时间条件，那再好的裁剪也救不了全历史扫描；历史数据频繁更新，压缩后反复解压重压；指标基数极端爆炸，而且查询语言、事务、JOIN 都不重要；保留策略无法按时间边界定义，必须按复杂业务状态逐行删除；团队无法接受 extension 升级、许可边界和 TSL 功能差异。下面那四个坑——interval 两端、查询没时间条件、时间写法不可裁剪、segmentby 选唯一值——是最常见的。记住，选型的边界不在性能宣传里，而在你的访问模式能不能落到时间轴上。"},{"eyebrow":"收束 · 一条因果链","title":"复杂度没有消失，只是被收敛到一条时间轴上","lede":"建立边界、利用边界、消费边界、降低成本、减少重算、托管生命周期。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ap\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#245A6B\"/></marker><marker id=\"aa\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#BE653B\"/></marker><marker id=\"ag\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#2F7A66\"/></marker><marker id=\"am\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#89938F\"/></marker><marker id=\"ad\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#1E4B5A\"/></marker></defs><rect x=\"40\" y=\"34\" width=\"400\" height=\"108\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.3\" /><text x=\"60\" y=\"74\" class=\"sv serif\" font-size=\"22\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" >建立边界</text><text x=\"60\" y=\"110\" class=\"sv s\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >Hypertable 把时间写进 catalog</text><rect x=\"500\" y=\"34\" width=\"400\" height=\"108\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.3\" /><text x=\"520\" y=\"74\" class=\"sv serif\" font-size=\"22\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" >利用边界</text><text x=\"520\" y=\"110\" class=\"sv s\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >写入路由到 chunk</text><rect x=\"960\" y=\"34\" width=\"400\" height=\"108\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.3\" /><text x=\"980\" y=\"74\" class=\"sv serif\" font-size=\"22\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"start\" >消费边界</text><text x=\"980\" y=\"110\" class=\"sv s\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >计划期 / 执行期裁剪</text><line x1=\"444\" y1=\"88\" x2=\"494\" y2=\"88\" stroke=\"#245A6B\" stroke-width=\"1.8\" fill=\"none\" marker-end=\"url(#ap)\"/><line x1=\"904\" y1=\"88\" x2=\"954\" y2=\"88\" stroke=\"#245A6B\" stroke-width=\"1.8\" fill=\"none\" marker-end=\"url(#ap)\"/><path d=\"M1360 142 L1360 174 L240 174 L240 214\" fill=\"none\" stroke=\"#BE653B\" stroke-width=\"1.7\" marker-end=\"url(#aa)\"/><rect x=\"40\" y=\"216\" width=\"400\" height=\"108\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.3\" /><text x=\"60\" y=\"256\" class=\"sv serif\" font-size=\"22\" fill=\"#2F7A66\" font-weight=\"700\" text-anchor=\"start\" >降低成本</text><text x=\"60\" y=\"292\" class=\"sv s\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >历史 chunk 转压缩列存</text><rect x=\"500\" y=\"216\" width=\"400\" height=\"108\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.3\" /><text x=\"520\" y=\"256\" class=\"sv serif\" font-size=\"22\" fill=\"#2F7A66\" font-weight=\"700\" text-anchor=\"start\" >减少重算</text><text x=\"520\" y=\"292\" class=\"sv s\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >连续聚合增量刷新</text><rect x=\"960\" y=\"216\" width=\"400\" height=\"108\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-widt const N = D.length;
let cur = 0, autoTimer = null, autoOn = false, notesMode = null;
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

function fit(){
  const vp = $('#viewport');
  const W = vp.clientWidth, H = vp.clientHeight;
  const s = Math.min(W/1600, H/900);
  const st = $('#stage');
  st.style.transform = 'scale(' + s + ')';
  st.style.left = ((W - 1600*s)/2) + 'px';
  st.style.top  = ((H -  900*s)/2) + 'px';
}
window.addEventListener('resize', fit);

function render(){
  $('#slides').innerHTML = D.map((d,i) =>
    '<section class="slide" id="s'+i+'">'
    + '<div class="eyebrow"><span class="num">'+String(i+1).padStart(2,'0')+' / '+String(N).padStart(2,'0')+'</span>'+d.eyebrow+'</div>'
    + '<h1 class="title">'+d.title+'</h1>'
    + '<div class="lede">'+d.lede+'</div>'
    + '<div class="rule"></div>'
    + '<div class="figwrap">'+d.svg+'</div>'
    + (d.ctrl ? '<div class="ctrls">'+d.ctrl+'</div>' : '<div class="caption">'+d.caption+'</div>')
    + '<div class="bridge"><span class="bk">承接 · NEXT</span>'+d.bridge+'</div>'
    + '<div class="footer"><div class="fbar"><i id="fbar'+i+'"></i></div>'
    + '<span class="fl">数据库筑基课 · 应用实践之 时序</span>'
    + '<span class="fr">'+String(i+1).padStart(2,'0')+' / '+String(N).padStart(2,'0')+'</span></div>'
    + '</section>').join('');
}

function scrollNoteToCur(){
  if(notesMode !== 'all') return;
  const body = $('#npBody'), el = document.getElementById('nsec-'+cur);
  if(!body || !el) return;
  const prev = body.style.scrollBehavior;
  body.style.scrollBehavior = 'auto';
  body.scrollTop = Math.max(0, el.offsetTop - body.offsetTop - 10);
  body.style.scrollBehavior = prev;
  $$('.nsec').forEach(x=>x.classList.remove('cur'));
  el.classList.add('cur');
}
function renderNotes(){
  if(!notesMode) return;
  const body = $('#npBody');
  if(notesMode === 'here'){
    const d = D[cur];
    $('#npTitle').textContent = '本页讲稿';
    $('#npSub').textContent = String(cur+1).padStart(2,'0')+' / '+String(N)+' · 页内开窗';
    body.innerHTML = '<div class="nsec cur" id="nsec-'+cur+'"><span class="sn">'
      + String(cur+1).padStart(2,'0')+' · '+d.eyebrow+'</span><h3>'+d.title+'</h3><p>'+d.notes+'</p>'
      + '<div class="nb">承接 · '+d.bridge+'</div></div>';
    body.scrollTop = 0;
  }else{
    $('#npTitle').textContent = '全文讲稿';
    $('#npSub').textContent = '共 '+N+' 页 · 已定位到当前页';
    body.innerHTML = D.map((d,i)=>'<div class="nsec" id="nsec-'+i+'"><span class="sn">'
      + String(i+1).padStart(2,'0')+' · '+d.eyebrow+'</span><h3>'+d.title+'</h3><p>'+d.notes+'</p>'
      + '<div class="nb">承接 · '+d.bridge+'</div></div>').join('');
    requestAnimationFrame(scrollNoteToCur);
  }
}
function toggleNotes(mode){
  const want = mode || (notesMode ? null : 'here');
  if(want === notesMode && want !== null){ notesMode = null; }
  else { notesMode = want; }
  document.body.classList.toggle('notes-on', !!notesMode);
  $('#btnNotes').classList.toggle('act', notesMode === 'here');
  $('#btnAll').classList.toggle('act', notesMode === 'all');
  renderNotes();
  fit();
  if(notesMode) toast(notesMode === 'all' ? '全文讲稿：已定位到当前页' : '本页讲稿：再按 N 关闭');
}

function go(i, silent){
  i = Math.max(0, Math.min(N-1, i));
  $$('.slide').forEach((el,k)=>el.classList.toggle('on', k===i));
  cur = i;
  try{ localStorage.setItem('tsdb-talk-slide', String(i)); }catch(e){}
  $('#pg').textContent = String(i+1).padStart(2,'0') + ' / ' + String(N).padStart(2,'0');
  $('#track i').style.width = ((i+1)/N*100)+'%';
  for(let k=0;k<N;k++){ const b=$('#fbar'+k); if(b) b.style.width = (k<=i?100:0)+'%'; }
  if(notesMode) renderNotes();
  if(!silent) toast(D[i].eyebrow + ' · ' + D[i].title);
}
function next(){ if(cur<N-1) go(cur+1); else stopAuto(); }
function prev(){ if(cur>0) go(cur-1); }
function toast(s){
  const t=$('#toast'); t.textContent=s; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1700);
}
function stopAuto(){
  autoOn=false; clearInterval(autoTimer); autoTimer=null;
  $('#btnAuto').textContent='▶ 自动播放'; $('#btnAuto').classList.remove('act');
}
function toggleAuto(){
  if(autoOn){ stopAuto(); toast('已暂停自动播放'); return; }
  autoOn=true; $('#btnAuto').textContent='❚❚ 暂停'; $('#btnAuto').classList.add('act');
  autoTimer=setInterval(()=>{ if(cur<N-1) go(cur+1,true); else stopAuto(); }, 12000);
  toast('自动播放：每 12 秒一页');
}
function closePanel(){ $('#veil').classList.remove('on'); }
function showPanel(inner){
  $('#panel').innerHTML = '<button class="close" onclick="closePanel()">关闭 ✕</button>' + inner;
  $('#veil').classList.add('on');
}
function toc(){
  showPanel('<h2>目录</h2><div class="psub">点击任意一页跳转 · 共 '+N+' 页</div><div class="grid">'
    + D.map((d,i)=>'<a onclick="jump('+i+')"><span class="gn">'+String(i+1).padStart(2,'0')+'</span>'
      +'<span class="gt">'+d.title+'</span></a>').join('') + '</div>');
}
function jump(i){ closePanel(); go(i); }
function help(){
  showPanel('<h2>快捷键</h2><div class="psub">演说时的操作备忘 · 全屏后底部按键仍然可见</div><div class="keys">'
    + '<div><kbd>→ / 空格</kbd>下一页</div><div><kbd>←</kbd>上一页</div>'
    + '<div><kbd>G</kbd>目录</div><div><kbd>N</kbd>本页讲稿（页内开窗，再按关闭）</div>'
    + '<div><kbd>T</kbd>全文讲稿（自动定位当前页）</div><div><kbd>P</kbd>自动播放 / 暂停</div>'
    + '<div><kbd>F</kbd>全屏 / 退出全屏</div><div><kbd>1–9</kbd>直接跳页</div>'
    + '<div><kbd>Home / End</kbd>首页 / 末页</div><div><kbd>Esc</kbd>关闭目录或帮助</div>'
    + '<div><kbd>?</kbd>本帮助</div><div><kbd>翻页</kbd>讲稿联动滚动</div></div>');
}
function fs(){
  const el=document.documentElement;
  const entering=!document.body.classList.contains('immersive');
  if(entering){
    document.body.classList.add('immersive');
    $('#btnFs').textContent='退出全屏 F';
    fit();
    toast('全屏模式：底部按键保持可见（F 或 Esc 退出）');
    try{ const pr = el.requestFullscreen ? el.requestFullscreen() : null;
      if(pr && pr.catch) pr.catch(()=>{}); }catch(e){}
  }else{
    document.body.classList.remove('immersive');
    $('#btnFs').textContent='全屏 F';
    fit(); toast('已退出全屏');
    try{ if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen(); }catch(e){}
  }
}
document.addEventListener('fullscreenchange', ()=>{
  if(!document.fullscreenElement && document.body.classList.contains('immersive')){
    document.body.classList.remove('immersive');
    const b=$('#btnFs'); if(b) b.textContent='全屏 F';
  }
  fit();
});
document.addEventListener('keydown', e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  const k=e.key;
  const typing = tag==='select'||tag==='input'||tag==='textarea';
  const navKey = k.indexOf('Arrow')===0 || k===' ' || k==='Home' || k==='End' || k==='PageUp' || k==='PageDown';
  if(k==='Escape'){
    closePanel();
    if(notesMode) toggleNotes(null);
    if(document.body.classList.contains('immersive')) fs();
    return;
  }
  if(typing && navKey) return;
  if(k==='ArrowRight'||k===' '||k==='PageDown'){ e.preventDefault(); next(); }
  else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); prev(); }
  else if(k==='Home'){ e.preventDefault(); go(0); }
  else if(k==='End'){ e.preventDefault(); go(N-1); }
  else if(k==='g'||k==='G'){ e.preventDefault(); toc(); }
  else if(k==='n'||k==='N'){ e.preventDefault(); toggleNotes('here'); }
  else if(k==='t'||k==='T'){ e.preventDefault(); toggleNotes('all'); }
  else if(k==='p'||k==='P'){ e.preventDefault(); toggleAuto(); }
  else if(k==='f'||k==='F'||e.code==='KeyF'){ e.preventDefault(); fs(); }
  else if(k==='?'||k==='/'||k==='h'||k==='H'){ e.preventDefault(); help(); }
  else if(/^[1-9]$/.test(k)){ e.preventDefault(); go(Math.min(N-1, parseInt(k,10)-1)); }
});

/* ---------- 动画：写入路由 ---------- */
const RT_TXT = {
 rt0:'一行 INSERT 带着 ts 与 device_id 进入 hypertable。',
 rt1:'计算维度 point：时间落到 range slice，空间维度落到 hash slice。',
 rt2:'subspace 缓存：同批写入复用 ChunkInsertState，减少重复打开 relation。',
 rt3:'查 catalog + subspace 状态，判断 chunk 是否已存在。',
 rt4:'命中：找到目标 chunk，加 RowExclusiveLock，转换 tuple 到 chunk 描述符。',
 rt5:'未命中：走创建路径，元数据写入 + 并发创建序列化，成本明显更高。',
 rt6:'写入物理 chunk 表，仍然走 PostgreSQL heap / MVCC / WAL。'
};
function rtSeq(){ return ($('#rtMode') && $('#rtMode').value==='miss')
  ? ['rt0','rt1','rt2','rt3','rt5','rt6'] : ['rt0','rt1','rt2','rt3','rt4','rt6']; }
let rtStep=0, rtTimer=null;
function rtPaint(){
  const seq = rtSeq(), id = seq[Math.min(rtStep, seq.length-1)];
  $$('#s3 .animnode').forEach(el=>{
    el.setAttribute('stroke-width','1.2');
    if(el.id!=='rt6') el.setAttribute('stroke', el.dataset.oc || el.getAttribute('stroke'));
  });
  const el=document.getElementById(id);
  if(el){ if(!el.dataset.oc) el.dataset.oc=el.getAttribute('stroke');
    el.setAttribute('stroke','#BE653B'); el.setAttribute('stroke-width','2.8'); }
  $('#rtOut').innerHTML = (rtStep>=seq.length-1?'完成 · ':'第 '+(rtStep+1)+' 步 · ')+RT_TXT[id];
}
function rtReset(){ clearInterval(rtTimer); rtTimer=null; rtStep=0; rtPaint(); }
function rtTick(){
  const seq=rtSeq();
  if(rtStep<seq.length-1){ rtStep++; rtPaint(); }
  else{ clearInterval(rtTimer); rtTimer=null; const b=$('#rtPlay'); if(b) b.textContent='▶ 播放'; }
}
function rtPlay(){
  if(rtTimer){ clearInterval(rtTimer); rtTimer=null; $('#rtPlay').textContent='▶ 播放'; return; }
  if(rtStep>=rtSeq().length-1) rtStep=0;
  $('#rtPlay').textContent='❚❚ 暂停'; rtPaint();
  rtTimer=setInterval(rtTick, 900);
}

/* ---------- 动画：查询裁剪 ---------- */
const PK = ['更早','昨天','近1天A','近1天B','当前热块','未来块'];
const PK_GOOD = [0,0,1,1,1,0];   // 1 = 扫描
const PK_BAD  = [1,1,1,1,1,1];
let pkStep=-1, pkTimer=null;
function pkClear(){
  for(let i=0;i<6;i++){
    const r=document.getElementById('pk'+i), t=document.getElementById('pt'+i);
    if(r){ r.setAttribute('fill','#F1EFE9'); r.setAttribute('stroke','#D9D5CB'); r.setAttribute('stroke-width','1.2'); }
    if(t){ t.textContent='待判定'; t.setAttribute('fill','#89938F'); }
  }
}
function pkPaint(){
  pkClear();
  const mode = $('#pkMode') ? $('#pkMode').value : 'good';
  const arr = mode==='good' ? PK_GOOD : PK_BAD;
  for(let i=0;i<=pkStep;i++){
    const r=document.getElementById('pk'+i), t=document.getElementById('pt'+i);
    if(r && t){
      if(arr[i]){ r.setAttribute('fill','#E4F0EA'); r.setAttribute('stroke','#2F7A66'); r.setAttribute('stroke-width','2'); t.textContent='扫描'; t.setAttribute('fill','#2F7A66'); }
      else { r.setAttribute('fill','#F1EFE9'); r.setAttribute('stroke','#89938F'); r.setAttribute('stroke-width','2'); t.textContent='排除'; t.setAttribute('fill','#89938F'); }
    }
  }
  const pv=$('#pv');
  if(pkStep<0){ $('#pkOut').innerHTML='选择写法后播放，逐个 chunk 看它是否被排除。'; if(pv) pv.textContent='判定输出：EXPLAIN (ANALYZE, BUFFERS) 里是否出现 Chunks excluded / Runtime Exclusion'; return; }
  if(pkStep<5){ $('#pkOut').innerHTML='已判定 '+(pkStep+1)+'/6 个 chunk · '+PK[pkStep]+' → '+(arr[pkStep]?'扫描':'排除'); return; }
  if(mode==='good'){
    $('#pkOut').innerHTML='<b>命中裁剪路径</b>：6 个 chunk 排除 3 个，只扫相关时间范围。';
    if(pv) pv.textContent='EXPLAIN 可见：Custom Scan (ChunkAppend)、Chunks excluded: 3、Startup / Runtime Exclusion';
  }else{
    $('#pkOut').innerHTML='<b>裁剪失效</b>：6 个 chunk 全部扫描，时间条件退化成普通过滤。';
    if(pv) pv.textContent='EXPLAIN 里看不到 Chunks excluded —— 优化器没看见时间边界，写法需要改';
  }
}
function pkReset(){ clearInterval(pkTimer); pkTimer=null; pkStep=-1; pkPaint(); }
function pkTick(){ if(pkStep<5){ pkStep++; pkPaint(); }else{ clearInterval(pkTimer); pkTimer=null; $('#pkPlay').textContent='▶ 播放'; } }
function pkPlay(){
  if(pkTimer){ clearInterval(pkTimer); pkTimer=null; $('#pkPlay').textContent='▶ 播放'; return; }
  if(pkStep>=5) pkStep=-1;
  $('#pkPlay').textContent='❚❚ 暂停'; pkPaint();
  pkTimer=setInterval(pkTick, 620);
}

function init(){
  render();
  $('#btnPrev').onclick=prev; $('#btnNext').onclick=next;
  $('#btnToc').onclick=toc; $('#btnNotes').onclick=()=>toggleNotes('here');
  $('#btnAll').onclick=()=>toggleNotes('all'); $('#btnAuto').onclick=toggleAuto;
  $('#btnFs').onclick=fs; $('#btnHelp').onclick=help;
  $('#rtPlay').onclick=rtPlay; $('#rtStep').onclick=()=>{clearInterval(rtTimer);rtTimer=null;$('#rtPlay').textContent='▶ 播放';rtTick();};
  $('#rtReset').onclick=rtReset; $('#rtMode').onchange=rtReset;
  $('#pkPlay').onclick=pkPlay; $('#pkStep').onclick=()=>{clearInterval(pkTimer);pkTimer=null;$('#pkPlay').textContent='▶ 播放';pkTick();};
  $('#pkReset').onclick=pkReset; $('#pkMode').onchange=pkReset;
  let start=0; try{ start=parseInt(localStorage.getItem('tsdb-talk-slide')||'0',10)||0; }catch(e){}
  fit(); go(start, true); rtPaint(); pkPaint();
}
init();
</script>
