<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数据库筑基课 · 应用实践之 时序｜TimescaleDB</title>
<!-- 单文件交付：所有原理图均为现场绘制的内联 SVG，无外链位图、字体、脚本依赖。 -->
<style>
:root{
  --bg:#F7F6F2; --ink:#1B2B33; --ink2:#46585F; --muted:#89938F; --line:#D9D5CB;
  --primary:#245A6B; --prim-l:#E5EFF0; --accent:#BE653B; --acc-l:#F7E9DE;
  --green:#2F7A66; --green-l:#E4F0EA; --gold:#AE8A3E; --gold-l:#F5EDDC;
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#E9E7E1}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
#viewport{position:absolute;left:0;right:0;top:0;bottom:58px;overflow:hidden}
#stage{position:absolute;width:1600px;height:900px;background:var(--bg);
  transform-origin:top left;box-shadow:0 18px 60px rgba(27,43,51,.13)}
.slide{position:absolute;inset:0;display:none}
.slide.on{display:block;animation:fadein .42s cubic-bezier(.2,.7,.2,1)}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{position:absolute;left:64px;top:44px;font-size:13px;letter-spacing:3.4px;
  color:var(--primary);font-weight:600}
.eyebrow .num{font-family:var(--mono);letter-spacing:1px;color:var(--accent);margin-right:14px}
h1.title{position:absolute;left:64px;top:70px;margin:0;font-family:var(--serif);
  font-size:44px;line-height:1.25;font-weight:700;letter-spacing:1.2px;color:var(--ink)}
.lede{position:absolute;left:64px;top:139px;width:1440px;font-size:19px;color:var(--ink2);
  line-height:1.5;letter-spacing:.3px}
.rule{position:absolute;left:64px;top:181px;width:1472px;height:1px;background:var(--line)}
.figwrap{position:absolute;left:100px;top:198px;width:1400px;height:430px}
svg.figure{display:block;overflow:visible}
svg.figure text{font-family:var(--sans)}
svg.figure text.serif{font-family:var(--serif)}
svg.figure text.mono{font-family:var(--mono)}
.caption{position:absolute;left:100px;top:638px;width:1400px;font-size:13px;
  color:var(--muted);letter-spacing:.4px}
.bridge{position:absolute;left:64px;top:706px;width:1472px;font-size:20px;
  color:var(--accent);line-height:1.55;letter-spacing:.4px;padding-left:18px;
  border-left:3px solid var(--accent);font-family:var(--serif)}
.bridge .bk{font-family:var(--sans);font-size:13px;color:var(--muted);
  letter-spacing:2px;display:block;margin-bottom:2px}
.footer{position:absolute;left:64px;top:846px;width:1472px;height:1px;background:var(--line)}
.footer .fl{position:absolute;left:0;top:14px;font-size:12.5px;color:var(--muted);letter-spacing:2px}
.footer .fr{position:absolute;right:0;top:12px;font-family:var(--mono);font-size:14px;color:var(--ink2)}
.footer .fbar{position:absolute;left:0;right:0;top:-1px;height:2px;background:transparent}
.footer .fbar i{display:block;height:2px;background:var(--primary);width:0;transition:width .4s ease}
.ctrls{position:absolute;left:100px;top:636px;width:1400px;height:48px;display:flex;
  align-items:center;gap:12px}
.ctrls label{font-size:13.5px;color:var(--ink2);white-space:nowrap}
.ctrls select{font-family:var(--sans);font-size:13.5px;color:var(--ink);background:#fff;
  border:1px solid var(--line);border-radius:4px;padding:5px 8px;outline:none;max-width:330px}
.ctrls .btn{min-height:30px;padding:5px 14px;border:1px solid var(--primary);border-radius:4px;
  background:#fff;color:var(--primary);font-size:13.5px;cursor:pointer;font-family:var(--sans)}
.ctrls .btn.play{background:var(--primary);color:#fff}
.ctrls .btn:hover{filter:brightness(.94)}
.ctrls .out{font-size:13px;color:var(--ink2);margin-left:auto;min-width:0;flex:1;
  max-width:560px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrls .out b{color:var(--accent);font-weight:600}
/* 底部控制条：全屏后依然显示 */
.chrome{position:fixed;left:0;right:0;bottom:0;height:58px;background:#FCFBF8;
  border-top:1px solid var(--line);display:flex;align-items:center;gap:6px;
  padding:0 14px;z-index:40;font-size:13px;color:var(--ink2)}
.chrome .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.chrome button{font-family:var(--sans);font-size:13px;color:var(--ink2);background:transparent;
  border:1px solid transparent;border-radius:5px;padding:7px 10px;cursor:pointer;white-space:nowrap}
.chrome button:hover{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome button.act{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome button.k{font-family:var(--mono);font-size:12px;color:var(--muted)}
.chrome .pg{font-family:var(--mono);font-size:14px;color:var(--ink);min-width:76px;text-align:center}
.chrome .track{flex:1;height:3px;background:var(--line);border-radius:3px;margin:0 8px;position:relative;min-width:40px}
.chrome .track i{position:absolute;left:0;top:0;height:3px;background:var(--primary);border-radius:3px;transition:width .35s}
.chrome .hint{font-size:11.5px;color:var(--muted);white-space:nowrap}
/* 页内讲稿开窗：原页矢量缩放到左，讲稿在右 */
#notesPane{position:fixed;top:0;right:0;bottom:58px;width:min(540px,40%);
  background:#FCFBF8;border-left:1px solid var(--line);z-index:35;display:none;
  flex-direction:column;box-shadow:-10px 0 30px rgba(27,43,51,.06)}
body.notes-on #notesPane{display:flex}
body.notes-on #viewport{right:min(540px,40%)}
.npHead{flex:0 0 auto;padding:16px 22px 12px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px}
.npHead .npT{font-family:var(--serif);font-size:19px;color:var(--primary);font-weight:700}
.npHead .npS{font-size:12px;color:var(--muted);letter-spacing:1px;flex:1}
.npHead button{font-family:var(--sans);font-size:12.5px;color:var(--ink2);background:#fff;
  border:1px solid var(--line);border-radius:4px;padding:5px 10px;cursor:pointer}
.npBody{flex:1;overflow-y:auto;padding:8px 22px 40px;scroll-behavior:smooth}
.nsec{border-top:1px solid var(--line);padding:18px 0 22px;scroll-margin-top:12px}
.nsec:first-child{border-top:none}
.nsec .sn{font-family:var(--mono);font-size:11.5px;color:var(--accent);letter-spacing:1px}
.nsec h3{margin:7px 0 10px;font-family:var(--serif);font-size:19px;color:var(--ink);line-height:1.4}
.nsec p{margin:0;font-size:14.5px;line-height:2.0;color:var(--ink2);letter-spacing:.2px;text-align:justify}
.nsec .nb{margin-top:12px;padding-left:12px;border-left:2px solid var(--accent);
  font-family:var(--serif);font-size:13.5px;color:var(--accent);line-height:1.7}
.nsec.cur h3{color:var(--accent)}
/* 模态：目录 / 帮助 */
.veil{position:fixed;inset:0 0 58px 0;background:rgba(27,43,51,.42);z-index:60;display:none;
  align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.veil.on{display:flex}
.panel{width:min(1040px,92vw);max-height:82vh;overflow:auto;background:var(--bg);
  border-radius:8px;box-shadow:0 24px 80px rgba(0,0,0,.26);padding:30px 38px 36px}
.panel h2{margin:0 0 8px;font-family:var(--serif);font-size:28px;color:var(--ink)}
.panel .psub{font-size:13.5px;color:var(--muted);margin-bottom:22px;letter-spacing:1px}
.panel .close{float:right;background:#fff;border:1px solid var(--line);
  border-radius:5px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--ink2)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;clear:both}
.grid a{display:block;padding:12px;border:1px solid var(--line);border-radius:6px;
  background:#fff;text-decoration:none;color:var(--ink);cursor:pointer;transition:.2s}
.grid a:hover{border-color:var(--primary);background:var(--prim-l)}
.grid a .gn{font-family:var(--mono);font-size:11.5px;color:var(--accent)}
.grid a .gt{font-family:var(--serif);font-size:14.5px;line-height:1.4;display:block;margin-top:5px}
.keys{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 30px;font-size:14.5px;line-height:1.8}
.keys kbd{font-family:var(--mono);background:#fff;border:1px solid var(--line);
  border-bottom-width:2px;border-radius:4px;padding:2px 7px;color:var(--primary);margin-right:8px}
.toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);background:var(--ink);
  color:#fff;font-size:13px;padding:9px 16px;border-radius:5px;opacity:0;transition:.3s;z-index:80;pointer-events:none}
.toast.on{opacity:1}
svg .animnode{transition:stroke .18s,stroke-width .18s}
@media print{.chrome,.veil,.toast,#notesPane{display:none!important}#viewport{position:static;right:0!important}
  #stage{position:static;transform:none!important;box-shadow:none}
  .slide{display:block!important;page-break-after:always;position:relative;height:900px}}
</style>
</head>
<body>
<div id="viewport"><div id="stage"><div id="slides"></div></div></div>
<aside id="notesPane"><div class="npHead"><span class="npT" id="npTitle">本页讲稿</span>
  <span class="npS" id="npSub">页内开窗 · 再按一次关闭</span>
  <button onclick="toggleNotes(null)">关闭 ✕</button></div>
  <div class="npBody" id="npBody"></div></aside>
<div class="chrome">
  <button id="btnPrev">← 上一页</button>
  <button id="btnNext">下一页 →</button>
  <span class="pg" id="pg">01 / 18</span>
  <div class="track" id="track"><i></i></div>
  <div class="sep"></div>
  <button id="btnToc">目录 G</button>
  <button id="btnNotes">本页讲稿 N</button>
  <button id="btnAll">全文讲稿 T</button>
  <button id="btnAuto">▶ 自动播放</button>
  <button id="btnFs">全屏 F</button>
  <button id="btnHelp" class="k">? 快捷键</button>
  <span class="hint">←→ 翻页</span>
</div>
<div class="veil" id="veil"><div class="panel" id="panel"></div></div>
<div class="toast" id="toast"></div>
<script>
const D = [{"eyebrow":"开场 · 什么时候变成时序系统","title":"不是有时间字段，是生命周期绑上了时间","lede":"IoT、交易、日志、行为流看起来是四门生意，骨子里只做了一件事：按时间不断追加。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ap\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#245A6B\"/></marker><marker id=\"aa\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#BE653B\"/></marker><marker id=\"ag\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#2F7A66\"/></marker><marker id=\"am\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#89938F\"/></marker><marker id=\"ad\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#1E4B5A\"/></marker></defs><rect x=\"40\" y=\"22\" width=\"300\" height=\"76\" rx=\"4\" fill=\"#EBF1EE\" stroke=\"#A4C4C6\" stroke-width=\"1.2\" /><text x=\"54\" y=\"53.099999999999994\" class=\"sv s\" font-size=\"18\" fill=\"#1B2B33\" font-weight=\"600\" text-anchor=\"start\" >IoT 设备</text><text x=\"54\" y=\"69.28\" class=\"sv s\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >每秒上报温度</text><line x1=\"190\" y1=\"98\" x2=\"190\" y2=\"130\" stroke=\"#7BA6AF\" stroke-width=\"1.4\" fill=\"none\" marker-end=\"url(#ap)\"/><rect x=\"380\" y=\"22\" width=\"300\" height=\"76\" rx=\"4\" fill=\"#EBF1EE\" stroke=\"#A4C4C6\" stroke-width=\"1.2\" /><text x=\"394\" y=\"53.099999999999994\" class=\"sv s\" font-size=\"18\" fill=\"#1B2B33\" font-weight=\"600\" text-anchor=\"start\" >交易系统</text><text x=\"394\" y=\"69.28\" class=\"sv s\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >持续写 tick</text><line x1=\"530\" y1=\"98\" x2=\"530\" y2=\"130\" stroke=\"#7BA6AF\" stroke-width=\"1.4\" fill=\"none\" marker-end=\"url(#ap)\"/><rect x=\"720\" y=\"22\" width=\"300\" height=\"76\" rx=\"4\" fill=\"#EBF1EE\" stroke=\"#A4C4C6\" stroke-width=\"1.2\" /><text x=\"734\" y=\"53.099999999999994\" class=\"sv s\" font-size=\"18\" fill=\"#1B2B33\" font-weight=\"600\" text-anchor=\"start\" >应用日志</text><text x=\"734\" y=\"69.28\" class=\"sv s\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >服务不断产生</text><line x1=\"870\" y1=\"98\" x2=\"870\" y2=\"130\" stroke=\"#7BA6AF\" stroke-width=\"1.4\" fill=\"none\" marker-end=\"url(#ap)\"/><rect x=\"1060\" y=\"22\" width=\"300\" height=\"76\" rx=\"4\" fill=\"#EBF1EE\" stroke=\"#A4C4C6\" stroke-width=\"1.2\" /><text x=\"1074\" y=\"53.099999999999994\" class=\"sv s\" font-size=\"18\" fill=\"#1B2B33\" font-weight=\"600\" text-anchor=\"start\" >用户行为</text><text x=\"1074\" y=\"69.28\" class=\"sv s\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >行为流涌入</text><line x1=\"1210\" y1=\"98\" x2=\"1210\" y2=\"130\" stroke=\"#7BA6AF\" stroke-width=\"1.4\" fill=\"none\" marker-end=\"url(#ap)\"/><rect x=\"40\" y=\"132\" width=\"1320\" height=\"56\" rx=\"4\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"0\" /><text x=\"700.0\" y=\"167.0\" class=\"sv s\" font-size=\"20\" fill=\"#FFFFFF\" font-weight=\"600\" text-anchor=\"middle\" >共同点：数据的生命周期与访问模式高度相关</text><line x1=\"190\" y1=\"188\" x2=\"190\" y2=\"220\" stroke=\"#7BA6AF\" stroke-width=\"1.4\" fill=\"none\" marker-end=\"url(#ap)\"/><rect x=\"40\" y=\"222\" width=\"300\" height=\"152\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"56\" y=\"255.1\" class=\"sv s\" font-size=\"18\" fill=\"#1B2B33\" font-weight=\"600\" text-anchor=\"start\" >持续追加</text><text x=\"56\" y=\"272.14\" class=\"sv s\" font-size=\"15\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >写入吞吐比单点更新更重要</text><line x1=\"530\" y1=\"188\" x2=\"530\" y2=\"220\" stroke=\"#7BA6AF\" stroke-width=\"1.4\" fill=\"none\" marker-end=\"url(#ap)\"/><rect x=\"380\" y=\"222\" width=\"300\" height=\"152\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"396\" y=\"255.1\" class=\"sv s\" font-size=\"18\" fill=\"#1B2B33\" font-weight=\"600\" text-anchor=\"start\" >时间窗口查询</text><text x=\"396\" y=\"272.14\" class=\"sv s\" font-size=\"15\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >最近 5 分钟 / 昨天 / 过去 30 天</text><line x1=\"870\" y1=\"188\" x2=\"870\" y2=\"220\" stroke=\"#7BA6AF\" stroke-width=\"1.4\" fill=\"none\" marker-end=\"url(#ap)\"/><rect x=\"720\" y=\"222\" width=\"300\" height=\"152\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"736\" y=\"255.1\" class=\"sv s\" font-size=\"18\" fill=\"#1B2B33\" font-weight=\"600\" text-anchor=\"start\" >新热老冷</text><text x=\"736\" y=\"272.14\" class=\"sv s\" font-size=\"15\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >新数据实时查，老数据便宜存</text><line x1=\"1210\" y1=\"188\" x2=\"1210\" y2=\"220\" stroke=\"#7BA6AF\" stroke-width=\"1.4\" fill=\"none\" marker-end=\"url(#ap)\"/><rect x=\"1060\" y=\"222\" width=\"300\" height=\"152\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"1076\" y=\"255.1\" class=\"sv s\" font-size=\"18\" fill=\"#1B2B33\" font-weight=\"600\" text-anchor=\"start\" >历史可变</text><text x=\"1076\" y=\"272.14\" class=\"sv s\" font-size=\"15\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >迟到、补写、修正、删除、保留</text><text x=\"10\" y=\"422\" class=\"sv s\" font-size=\"12\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"start\" >命题：时序不是「有一个时间字段」，而是这四条特征同时成立。</text></svg>","caption":"图 01　四条持续追加的数据流，汇成四条特征；四条同时成立，才是时序系统。","bridge":"既然生命周期和访问模式绑在一起，那就该问：继续用原来那张普通单表，会先在哪里崩？","notes":"开场先别急着讲 TimescaleDB 有哪些功能，我想先问一个问题：你的系统是从哪一天开始变成时序系统的？很多人以为，表里有一个时间字段就叫时序。不是的。你看这四条流——IoT 设备每秒上报温度，交易系统不断写 tick，应用服务不停打日志，用户行为一条条涌进来——表面上是四个业务，骨子里只干了一件事：按时间不断往里追加。追加这件事一发生，你关心的就不只是存不存得下，而是四个更麻烦的问题：写入是不是一直稳，查询是不是总带一个时间窗口，新数据是不是要马上能查、老数据是不是可以便宜点放，还有——历史会不会被迟到的数据、补写、修正、删除改来改去。所以时序系统的定义不是「有一个时间字段」，而是「数据的生命周期与访问模式高度相关」。这句话是今天整场的地基，后面所有机制都是围着它转的。"},{"eyebrow":"困境 · 普通单表的四堵墙","title":"四堵墙，其实指向同一件事","lede":"表在膨胀、查询在扫巨表、历史没有边界、报表反复扫明细——缺的都是时间的物理边界。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ap\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#245A6B\"/></marker><marker id=\"aa\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#BE653B\"/></marker><marker id=\"ag\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#2F7A66\"/></marker><marker id=\"am\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#89938F\"/></marker><marker id=\"ad\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#1E4B5A\"/></marker></defs><rect x=\"40\" y=\"22\" width=\"520\" height=\"46\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"0\" /><text x=\"300.0\" y=\"51.3\" class=\"sv s\" font-size=\"18\" fill=\"#BE653B\" font-weight=\"600\" text-anchor=\"middle\" >普通单表：四个瓶颈</text><rect x=\"840\" y=\"22\" width=\"520\" height=\"46\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"0\" /><text x=\"1100.0\" y=\"51.3\" class=\"sv s\" font-size=\"18\" fill=\"#2F7A66\" font-weight=\"600\" text-anchor=\"middle\" >TimescaleDB：四个转化</text><rect x=\"40\" y=\"82\" width=\"520\" height=\"62\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\" /><text x=\"53\" y=\"111.15\" class=\"sv s\" font-size=\"17\" fill=\"#BE653B\" font-weight=\"600\" text-anchor=\"start\" >写入持续增长</text><text x=\"53\" y=\"122.628\" class=\"sv s\" font-size=\"8.8\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >一张 heap + 多个索引越来越大</text><line x1=\"566\" y1=\"113\" x2=\"834\" y2=\"113\" stroke=\"#BE653B\" stroke-width=\"1.8\" fill=\"none\" marker-end=\"url(#aa)\"/><rect x=\"840\" y=\"82\" width=\"520\" height=\"62\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\" /><text x=\"853\" y=\"110.2\" class=\"sv s\" font-size=\"16\" fill=\"#2F7A66\" font-weight=\"600\" text-anchor=\"start\" >按维度落入多个 chunk</text><rect x=\"40\" y=\"156\" width=\"520\" height=\"62\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\" /><text x=\"53\" y=\"185.15\" class=\"sv s\" font-size=\"17\" fill=\"#BE653B\" font-weight=\"600\" text-anchor=\"start\" >时间窗口查询</text><text x=\"53\" y=\"196.62800000000001\" class=\"sv s\" font-size=\"8.8\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >优化器面对整张巨表</text><line x1=\"566\" y1=\"187\" x2=\"834\" y2=\"187\" stroke=\"#BE653B\" stroke-width=\"1.8\" fill=\"none\" marker-end=\"url(#aa)\"/><rect x=\"840\" y=\"156\" width=\"520\" height=\"62\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\" /><text x=\"853\" y=\"184.2\" class=\"sv s\" font-size=\"16\" fill=\"#2F7A66\" font-weight=\"600\" text-anchor=\"start\" >按 chunk 约束裁剪，只扫相关范围</text><rect x=\"40\" y=\"230\" width=\"520\" height=\"62\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\" /><text x=\"53\" y=\"259.15\" class=\"sv s\" font-size=\"17\" fill=\"#BE653B\" font-weight=\"600\" text-anchor=\"start\" >历史存储成本</text><text x=\"53\" y=\"270.628\" class=\"sv s\" font-size=\"8.8\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >老数据仍占行存与明细索引</text><line x1=\"566\" y1=\"261\" x2=\"834\" y2=\"261\" stroke=\"#BE653B\" stroke-width=\"1.8\" fill=\"none\" marker-end=\"url(#aa)\"/><rect x=\"840\" y=\"230\" width=\"520\" height=\"62\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\" /><text x=\"853\" y=\"258.2\" class=\"sv s\" font-size=\"16\" fill=\"#2F7A66\" font-weight=\"600\" text-anchor=\"start\" >历史 chunk 转成压缩列存</text><rect x=\"40\" y=\"304\" width=\"520\" height=\"62\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\" /><text x=\"53\" y=\"333.15\" class=\"sv s\" font-size=\"17\" fill=\"#BE653B\" font-weight=\"600\" text-anchor=\"start\" >报表重复聚合</text><text x=\"53\" y=\"344.628\" class=\"sv s\" font-size=\"8.8\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >每次查询重新扫明细</text><line x1=\"566\" y1=\"335\" x2=\"834\" y2=\"335\" stroke=\"#BE653B\" stroke-width=\"1.8\" fill=\"none\" marker-end=\"url(#aa)\"/><rect x=\"840\" y=\"304\" width=\"520\" height=\"62\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\" /><text x=\"853\" y=\"332.2\" class=\"sv s\" font-size=\"16\" fill=\"#2F7A66\" font-weight=\"600\" text-anchor=\"start\" >存 partial state，增量刷新</text><text x=\"10\" y=\"422\" class=\"sv s\" font-size=\"12\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"start\" >代价：复杂度只是从业务代码搬进数据库内部，参数选错一样出事。</text></svg>","caption":"图 02　左边是单表做法的表现，右边是 TimescaleDB 的转化；四行一一对应。","bridge":"这就把问题收敛成一句话：怎么把时间从「一列」变成「一条物理边界」？先看它站在什么位置。","notes":"我们把普通单表放到刚才那套模式下看，会依次撞上四堵墙。第一堵是写入：一张 heap 加一堆索引，越写越大，维护成本跟着涨，写入看着还在跑，其实越来越沉。第二堵是查询：你查最近五分钟，优化器面对的却是整张巨表，索引和统计信息的压力全压在它身上。第三堵是存储：老数据和新数据躺在同一种行存格式里，想压缩、想归档、想按时间删，都没有一个天然的边界可以下手。第四堵是报表：同一段历史被反复扫明细，今天算一遍，明天再算一遍。你看，这四堵墙看着是四个问题，其实指向同一件事——时间本来应该是一条物理边界，单表把它藏起来了。TimescaleDB 做的事就是把这条边界重新露出来。当然，复杂度不会凭空消失，它只是从业务代码搬进了数据库内部，参数选错一样会出事，这一点后面会反复提醒。"},{"eyebrow":"定位 · 它是什么","title":"在 PostgreSQL 里，把时间变成物理边界","lede":"不是换掉 PostgreSQL，而是在扩展层接管时序场景里最重复的那些工作。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ap\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#245A6B\"/></marker><marker id=\"aa\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#BE653B\"/></marker><marker id=\"ag\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#2F7A66\"/></marker><marker id=\"am\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#89938F\"/></marker><marker id=\"ad\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#1E4B5A\"/></marker></defs><rect x=\"40\" y=\"18\" width=\"1320\" height=\"50\" rx=\"4\" fill=\"#EBF1EE\" stroke=\"#EBF1EE\" stroke-width=\"0\" /><text x=\"700.0\" y=\"48.95\" class=\"sv s\" font-size=\"17\" fill=\"#1E4B5A\" font-weight=\"600\" text-anchor=\"middle\" >业务写入：设备 / 交易 / 日志 / 事件　（time + entity + value）</text><line x1=\"700\" y1=\"68\" x2=\"700\" y2=\"94\" stroke=\"#245A6B\" stroke-width=\"1.6\" fill=\"none\" marker-end=\"url(#ap)\"/><rect x=\"250\" y=\"96\" width=\"900\" height=\"62\" rx=\"4\" fill=\"#CFE0DC\" stroke=\"#CFE0DC\" stroke-width=\"0\" /><text x=\"700.0\" y=\"133.3\" class=\"sv s\" font-size=\"18\" fill=\"#1E4B5A\" font-weight=\"600\" text-anchor=\"middle\" >Hypertable　逻辑上一张表，时间维度必选、空间维度可选</text><line x1=\"360\" y1=\"158\" x2=\"360\" y2=\"186\" stroke=\"#245A6B\" stroke-width=\"1.6\" fill=\"none\" marker-end=\"url(#ap)\"/><line x1=\"1040\" y1=\"158\" x2=\"1040\" y2=\"186\" stroke=\"#245A6B\" stroke-width=\"1.6\" fill=\"none\" marker-end=\"url(#ap)\"/><rect x=\"80\" y=\"188\" width=\"560\" height=\"86\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\" /><text x=\"94\" y=\"218.15\" class=\"sv s\" font-size=\"17\" fill=\"#245A6B\" font-weight=\"600\" text-anchor=\"start\" >热 Chunk · 行存 + PostgreSQL MVCC</text><text x=\"94\" y=\"234.1\" class=\"sv s\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >按时间切片；写入找 chunk，查询按约束裁剪</text><rect x=\"760\" y=\"188\" width=\"560\" height=\"86\" rx=\"4\" fill=\"#EBF1EE\" stroke=\"#7BA6AF\" stroke-width=\"1.2\" /><text x=\"774\" y=\"218.15\" class=\"sv s\" font-size=\"17\" fill=\"#1E4B5A\" font-weight=\"600\" text-anchor=\"start\" >冷 Chunk · 压缩列存</text><text x=\"774\" y=\"234.1\" class=\"sv s\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >segmentby 保留分组键，orderby 决定批内顺序</text><line x1=\"644\" y1=\"231\" x2=\"754\" y2=\"231\" stroke=\"#245A6B\" stroke-width=\"1.6\" fill=\"none\" marker-end=\"url(#ap)\"/><line x1=\"360\" y1=\"274\" x2=\"360\" y2=\"296\" stroke=\"#245A6B\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#ap)\"/><line x1=\"1040\" y1=\"274\" x2=\"1040\" y2=\"296\" stroke=\"#245A6B\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#ap)\"/><rect x=\"80\" y=\"298\" width=\"560\" height=\"82\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\" /><text x=\"94\" y=\"328.15\" class=\"sv s\" font-size=\"17\" fill=\"#2F7A66\" font-weight=\"600\" text-anchor=\"start\" >Continuous Aggregate · partial state</text><text x=\"94\" y=\"344.1\" class=\"sv s\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >time_bucket 分桶，增量刷新，避免整表重算</text><rect x=\"760\" y=\"298\" width=\"560\" height=\"82\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.2\" /><text x=\"774\" y=\"328.15\" class=\"sv s\" font-size=\"17\" fill=\"#AE8A3E\" font-weight=\"600\" text-anchor=\"start\" >后台策略 · Policy Job</text><text x=\"774\" y=\"343.67\" class=\"sv s\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >压缩 / 保留删除 / 连续聚合刷新，由 bg worker 调度</text><line x1=\"754\" y1=\"339\" x2=\"646\" y2=\"339\" stroke=\"#AE8A3E\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#am)\"/><line x1=\"360\" y1=\"380\" x2=\"360\" y2=\"388\" stroke=\"#245A6B\" stroke-width=\"1.4\" fill=\"none\" marker-end=\"url(#ap)\"/><line x1=\"1040\" y1=\"380\" x2=\"1040\" y2=\"388\" stroke=\"#245A6B\" stroke-width=\"1.4\" fill=\"none\" marker-end=\"url(#ap)\"/><rect x=\"80\" y=\"390\" width=\"1240\" height=\"20\" rx=\"4\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"0\" /><text x=\"700.0\" y=\"404.2\" class=\"sv s\" font-size=\"12\" fill=\"#FFFFFF\" font-weight=\"600\" text-anchor=\"middle\" >PostgreSQL 基座　SQL · 事务 · WAL · 索引 · 优化器 · 权限 · 备份恢复</text><text x=\"10\" y=\"422\" class=\"sv s\" font-size=\"12\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"start\" >命题：没有换掉 PostgreSQL，只是在扩展层接管时序里最重复的工作。</text></svg>","caption":"图 03　六层剖面：写入 → Hypertable → 热/冷 Chunk → 连续聚合/后台策略 → PG 基座。","bridge":"整张图里最该先看清的是写入路径：每一行到底怎么找到自己的 chunk？","notes":"先把定位说准：TimescaleDB 是一个 PostgreSQL extension，它没有把 PostgreSQL 换掉。你看这张剖面图，最底下那层是 PostgreSQL 基座——SQL、事务、WAL、索引、优化器、权限、备份恢复，这些基础边界一点没变。上面长出来的东西才是它带来的：用户面对的是一张逻辑表，叫 Hypertable；物理上按时间切成 chunk；热 chunk 保留行存和 MVCC，写入和实时查询都在这里；历史 chunk 可以转成压缩列存；常用报表交给 continuous aggregate 增量维护；压缩、保留、刷新这些动作交给后台策略，也就是 background worker 去调度。为什么要这么分层？因为时序场景里最重复、最容易写错的，恰好就是时间分区、chunk 路由、chunk 裁剪、列存压缩和生命周期这几件事。把它们收进数据库内部，业务代码就不用一遍遍重写。但你要记住，抽象只是转移了复杂度，没有消灭它。"},{"eyebrow":"原理一 · 写入路由","title":"逻辑一张表，物理多张表","lede":"INSERT 一行先落到维度空间的 point，再查缓存找 chunk，未命中才创建。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ap\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#245A6B\"/></marker><marker id=\"aa\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#BE653B\"/></marker><marker id=\"ag\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8, s\" font-size=\"11.7875\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >同批写入复用 ChunkInsertState</text><text x=\"624\" y=\"98.57225\" class=\"sv s\" font-size=\"11.7875\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >减少重复打开 relation</text><line x1=\"864\" y1=\"81\" x2=\"908\" y2=\"81\" stroke=\"#245A6B\" stroke-width=\"1.7\" fill=\"none\" marker-end=\"url(#ap)\"/><rect x=\"912\" y=\"40\" width=\"240\" height=\"82\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.2\" id=\"rt3\" class=\"animnode\"/><text x=\"926\" y=\"70.15\" class=\"sv s\" font-size=\"17\" fill=\"#AE8A3E\" font-weight=\"600\" text-anchor=\"start\" >chunk 已存在？</text><text x=\"926\" y=\"85.67\" class=\"sv s\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >查 catalog + subspace 状态</text><path d=\"M980 122 L980 158 L720 158 L720 198\" fill=\"none\" stroke=\"#2F7A66\" stroke-width=\"1.6\" marker-end=\"url(#ag)\"/><text x=\"812\" y=\"152\" class=\"sv s\" font-size=\"12.5\" fill=\"#2F7A66\" font-weight=\"600\" text-anchor=\"middle\" >是</text><rect x=\"560\" y=\"200\" width=\"340\" height=\"90\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\" id=\"rt4\" class=\"animnode\"/><text x=\"575\" y=\"231.15\" class=\"sv s\" font-size=\"17\" fill=\"#2F7A66\" font-weight=\"600\" text-anchor=\"start\" >找到目标 chunk</text><text x=\"575\" y=\"246.67000000000002\" class=\"sv s\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >RowExclusiveLock</text><text x=\"575\" y=\"264.045\" class=\"sv s\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >转换 tuple 到 chunk 描述符</text><path d=\"M1090 122 L1090 198\" fill=\"none\" stroke=\"#BE653B\" stroke-width=\"1.6\" marker-end=\"url(#aa)\"/><text x=\"1110\" y=\"152\" class=\"sv s\" font-size=\"12.5\" fill=\"#BE653B\" font-weight=\"600\" text-anchor=\"middle\" >否</text><rect x=\"1000\" y=\"200\" width=\"360\" height=\"90\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\" id=\"rt5\" class=\"animnode\"/><text x=\"1015\" y=\"231.15\" class=\"sv s\" font-size=\"17\" fill=\"#BE653B\" font-weight=\"600\" text-anchor=\"start\" >必要时创建 chunk</text><text x=\"1015\" y=\"246.24\" class=\"sv s\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >元数据 + 并发创建序列化</text><text x=\"1015\" y=\"263.615\" class=\"sv s\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >源码：chunk_tuple_routing.c</text><line x1=\"730\" y1=\"290\" x2=\"730\" y2=\"320\" stroke=\"#2F7A66\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#ag)\"/><line x1=\"1180\" y1=\"290\" x2=\"1180\" y2=\"320\" stroke=\"#BE653B\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#aa)\"/><rect x=\"560\" y=\"322\" width=\"800\" height=\"64\" rx=\"4\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"0\" id=\"rt6\" class=\"animnode\"/><text x=\"960\" y=\"360\" class=\"sv s\" font-size=\"16\" fill=\"#FFFFFF\" font-weight=\"600\" text-anchor=\"middle\" >写入物理 chunk 表　仍走 PostgreSQL heap / MVCC / WAL</text><text x=\"10\" y=\"422\" class=\"sv s\" font-size=\"12\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"start\" >命题：关键不是分区语法，而是每一行如何被快速路由到目标 chunk。</text></svg>","ctrl":"<label>写入场景</label><select id=\"rtMode\"><option value=\"hit\">常见：命中 subspace 缓存</option><option value=\"miss\">较少：需要新建 chunk</option></select><button class=\"btn play\" id=\"rtPlay\">▶ 播放</button><button class=\"btn\" id=\"rtStep\">单步</button><button class=\"btn\" id=\"rtReset\">重置</button><span class=\"out\" id=\"rtOut\">选择场景后点击播放，观察一行数据走过的路径。</span>","bridge":"写入把数据放进了正确的 chunk；那查询时，怎么保证不去碰无关的 chunk？","notes":"这一页讲写入路径，它是整套机制的入口。很多人的第一反应是：不就是分区表语法吗？不是的。关键问题是一行数据怎么被快速路由到正确的 chunk。看这条路径：INSERT 的一行带着时间戳和实体键进来，先计算它在维度空间里的 point——时间维度落到一个 range slice，如果配置了空间维度，再落到一个 hash slice。然后查 subspace 缓存，同一个批次的写入可以复用同一份 ChunkInsertState，减少反复打开 relation 的开销。接着判断 chunk 是否已存在：命中就直接找到目标 chunk，加 RowExclusiveLock，把 tuple 转换到 chunk 描述符；没命中才走创建路径，而创建是要做并发序列化的，成本明显更高。源码在 src/chunk_tuple_routing.c，注释里写得很清楚：常见单行插入必须足够快，所以初始化要尽量少做。工程含义就是——chunk interval 设得不合适，会直接影响打开关系的数量、索引数量和后续的查询裁剪粒度。你可以用下面的控件切换「命中缓存」和「需要新建」两种场景，看路径差别。"},{"eyebrow":"原理一 · 参数两难","title":"chunk interval：太小和太大都会出事","lede":"它由单 chunk 大小、单窗口覆盖 chunk 数、后台策略频率三者共同约束。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ap\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#245A6B\"/></marker><marker id=\"aa\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#BE653B\"/></marker><marker id=\"ag\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#2F7A66\"/></marker><marker id=\"am\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#89938F\"/></marker><marker id=\"ad\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#1E4B5A\"/></marker></defs><rect x=\"40\" y=\"22\" width=\"400\" height=\"66\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"53\" y=\"51.15\" class=\"sv s\" font-size=\"17\" fill=\"#1B2B33\" font-weight=\"600\" text-anchor=\"start\" >单 chunk 大小</text><text x=\"53\" y=\"65.46170000000001\" class=\"sv s\" font-size=\"12.094999999999999\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >太大 → 写入与重压缩成本高</text><rect x=\"500\" y=\"22\" width=\"400\" height=\"66\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"513\" y=\"51.15\" class=\"sv s\" font-size=\"17\" fill=\"#1B2B33\" font-weight=\"600\" text-anchor=\"start\" >单窗口覆盖 chunk 数</text><text x=\"513\" y=\"65.46170000000001\" class=\"sv s\" font-size=\"12.094999999999999\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >太多 → 计划与扫描开销上升</text><rect x=\"960\" y=\"22\" width=\"400\" height=\"66\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"973\" y=\"51.15\" class=\"sv s\" font-size=\"17\" fill=\"#1B2B33\" font-weight=\"600\" text-anchor=\"start\" >后台策略频率</text><text x=\"973\" y=\"65.46170000000001\" class=\"sv s\" font-size=\"12.094999999999999\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >过密 → 元数据与 job 变重</text><line x1=\"240\" y1=\"88\" x2=\"240\" y2=\"126\" stroke=\"#AE8A3E\" stroke-width=\"1.4\" fill=\"none\" marker-end=\"url(#am)\"/><line x1=\"700\" y1=\"88\" x2=\"700\" y2=\"126\" stroke=\"#2F7A66\" stroke-width=\"1.6\" fill=\"none\" marker-end=\"url(#ag)\"/><line x1=\"1160\" y1=\"88\" x2=\"1160\" y2=\"126\" stroke=\"#AE8A3E\" stroke-width=\"1.4\" fill=\"none\" marker-end=\"url(#am)\"/><rect x=\"40\" y=\"128\" width=\"400\" height=\"52\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"0\" /><text x=\"240.0\" y=\"160.3\" class=\"sv s\" font-size=\"18\" fill=\"#BE653B\" font-weight=\"600\" text-anchor=\"middle\" >interval 太小</text><rect x=\"440\" y=\"128\" width=\"520\" height=\"52\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"0\" /><text x=\"700.0\" y=\"160.65\" class=\"sv s\" font-size=\"19\" fill=\"#2F7A66\" font-weight=\"600\" text-anchor=\"middle\" >共同约束下的「合适」</text><rect x=\"960\" y=\"128\" width=\"400\" height=\"52\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"0\" /><text x=\"1160.0\" y=\"160.3\" class=\"sv s\" font-size=\"18\" fill=\"#BE653B\" font-weight=\"600\" text-anchor=\"middle\" >interval 太大</text><line x1=\"240\" y1=\"180\" x2=\"240\" y2=\"214\" stroke=\"#BE653B\" stroke-width=\"1.4\" fill=\"none\" marker-end=\"url(#aa)\"/><line x1=\"700\" y1=\"180\" x2=\"700\" y2=\"214\" stroke=\"#2F7A66\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#ag)\"/><line x1=\"1160\" y1=\"180\" x2=\"1160\" y2=\"214\" stroke=\"#BE653B\" stroke-width=\"1.4\" fill=\"none\" marker-end=\"url(#aa)\"/><rect x=\"40\" y=\"216\" width=\"400\" height=\"150\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#BE653B\" stroke-width=\"1.2\" /><text x=\"55\" y=\"247.15\" class=\"sv s\" font-size=\"17\" fill=\"#1B2B33\" font-weight=\"600\" text-anchor=\"start\" >短期看着裁剪更细</text><text x=\"55\" y=\"263.1\" class=\"sv s\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >chunk 数量暴涨</text><text x=\"55\" y=\"286.1\" class=\"sv s\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >catalog 与计划时间变重</text><text x=\"55\" y=\"309.1\" class=\"sv s\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >索引与后台任务数量上升</text><rect x=\"440\" y=\"216\" width=\"520\" height=\"150\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\" /><text x=\"455\" y=\"247.15\" class=\"sv s\" font-size=\"17\" fill=\"#2F7A66\" font-weight=\"600\" text-anchor=\"start\" >三者共同决定 interval</text><text x=\"455\" y=\"263.1\" class=\"sv s\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >先估单 chunk 目标大小</text><text x=\"455\" y=\"286.1\" class=\"sv s\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >再看典型时间窗口跨几个 chunk</text><text x=\"455\" y=\"309.1\" class=\"sv s\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >最后对齐压缩 / 刷新 / 保留节奏</text><rect x=\"960\" y=\"216\" width=\"400\" height=\"150\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#BE653B\" stroke-width=\"1.2\" /><text x=\"975\" y=\"247.15\" class=\"sv s\" font-size=\"17\" fill=\"#1B2B33\" font-weight=\"600\" text-anchor=\"start\" >热冷混放</text><text x=\"975\" y=\"263.1\" class=\"sv s\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >压缩与删除都不方便</text><text x=\"975\" y=\"286.1\" class=\"sv s\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >时间窗口查询多扫 chunk</text><text x=\"975\" y=\"309.1\" class=\"sv s\" font-size=\"14\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >裁剪粒度变粗</text><text x=\"10\" y=\"422\" class=\"sv s\" font-size=\"12\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"start\" >命题：chunk interval 不要只按自然日、自然月拍脑袋。</text></svg>","caption":"图 05　同一个参数的两端各有代价；合适值来自三个约束的交集，不是自然日历。","bridge":"interval 定了，chunk 的边界就定了；下一步看查询怎样利用这些边界少做工作。","notes":"刚才说 interval 会影响后面所有事情，这里专门把它拎出来讲，因为它是一个典型的两难。interval 太小，短期看裁剪更细、查询更精准，但长期看 chunk 数量暴涨，catalog 变大，计划时间变长，索引和后台任务数量一起上升。interval 太大呢，热数据和冷数据混在同一个 chunk 里，压缩和删除都不好下手，时间窗口查询也会多扫一些。那合适值怎么定？不要按自然日、自然月拍脑袋，而要看三个约束的交集：第一，单个 chunk 的目标大小，太大写入和重压缩都贵；第二，典型时间窗口会跨几个 chunk，太多计划与扫描开销就上去了；第三，压缩、刷新、保留这些后台策略的频率，过密会让元数据和 job 变重。把这三个数放在一起看，才能选出一个稳的 interval。这也是为什么我说「架构师要先画数据生命周期，再建表」——窗口没画清楚，参数就没有依据。"},{"eyebrow":"原理二 · 查询裁剪","title":"把时间条件变成少扫 chunk","lede":"计划期提前排除，执行期由 ChunkAppend 继续排除，证据写在 EXPLAIN 里。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ap\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#245A6B\"/></marker><marker id=\"aa\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#BE653B\"/></marker><marker id=\"ag\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#2F7A66\"/></marker><marker id=\"am\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#89938F\"/></marker><marker id=\"ad\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#1E4B5A\"/></marker></defs><rect x=\"40\" y=\"26\" width=\" y=\"171.71\" class=\"sv s\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >→ 计划期 / 执行期排除无关 chunk</text><text x=\"58\" y=\"194.71\" class=\"sv s\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >→ EXPLAIN 出现 Chunks excluded</text><rect x=\"720\" y=\"28\" width=\"640\" height=\"330\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\" /><text x=\"738\" y=\"63.099999999999994\" class=\"sv s\" font-size=\"18\" fill=\"#BE653B\" font-weight=\"600\" text-anchor=\"start\" >不可裁剪：时间被包进表达式</text><text x=\"738\" y=\"79.71\" class=\"sv s\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >WHERE date_trunc(&#x27;day&#x27;, ts) = current_date</text><text x=\"738\" y=\"102.71\" class=\"sv s\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >或只在应用层过滤后再取回</text><text x=\"738\" y=\"125.71\" class=\"sv s\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >→ 优化器看不见单调时间边界</text><text x=\"738\" y=\"148.71\" class=\"sv s\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >→ 每个 chunk 都要被展开与检查</text><text x=\"738\" y=\"171.71\" class=\"sv s\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >→ 时间条件退化成普通过滤</text><text x=\"738\" y=\"194.71\" class=\"sv s\" font-size=\"14.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >→ 扫描成本随历史总量增长</text><rect x=\"40\" y=\"374\" width=\"1320\" height=\"32\" rx=\"4\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"0\" /><text x=\"700.0\" y=\"395.425\" class=\"sv s\" font-size=\"15.5\" fill=\"#FFFFFF\" font-weight=\"600\" text-anchor=\"middle\" >判断依据不是「语句看起来对」，而是 EXPLAIN 里有没有 Chunks excluded / Startup Exclusion</text><text x=\"10\" y=\"422\" class=\"sv s\" font-size=\"12\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"start\" >命题：裁剪不是免费的，SQL 写法决定它是否发生。</text></svg>","caption":"图 07　同一张表的两种 WHERE：左边命中裁剪路径，右边让优化器失去时间边界。","bridge":"查询这一侧讲完了。接下来换到存储这一侧：历史数据如何变得便宜？","notes":"这一页把上一页的结论钉死。左边这种写法，时间列直接和常量比较，再叠一个实体键条件，优化器能看见单调的时间边界，计划期和执行期都能排除无关 chunk，EXPLAIN 里会出现 Chunks excluded。右边这种写法，date_trunc 套在 ts 上再和 current_date 比较，或者干脆在应用层过滤完才取回，优化器就看不见那条边界了，每个 chunk 都得展开、都得检查，时间条件退化成普通过滤，扫描成本随历史总量一起涨。这里我要强调一句：判断依据不是「语句看起来对」，而是 EXPLAIN 里到底有没有 Chunks excluded 和 Startup Exclusion。我看到过太多案例，SQL 读起来很自然，但就是因为没有把边界写成列与常量比较，把一个本该只扫几个 chunk 的查询变成了全历史扫描。所以开发者 best practice 的第一条就是：所有核心查询显式带时间范围，且不要把时间列包进不可裁剪的表达式。"},{"eyebrow":"原理三 · 压缩列存","title":"让相邻值更相似，让查询先跳过批次","lede":"segmentby 决定分组键，orderby 决定批内顺序，各列再挑合适的编码算法。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ap\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#245A6B\"/></marker><marker id=\"aa\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#BE653B\"/></marker><marker id=\"ag\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#2F7A66\"/></marker><marker id=\"am\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#89938F\"/></marker><marker id=\"ad\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#1E4B5A\"/></marker></defs><rect x=\"40\" y=\"30\" width=\"300\" height=\"350\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.2\" /><text x=\"56\" y=\"63.099999999999994\" class=\"sv s\" font-size=\"18\" fill=\"#1B2B33\" font-weight=\"600\" text-anchor=\"start\" >行存 Chunk</text><text x=\"56\" y=\"78.85\" class=\"sv s\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"start\" >dev=A  t=
