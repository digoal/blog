<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数据库筑基课 · 计算前置之 rule｜PostgreSQL 查询改写演说稿</title>
<!-- 单文件交付：所有原理图均为现场绘制的内联 SVG；无外部图片、字体、脚本依赖。 -->
<!-- 设计母题：地层 / 剖面。内容按「位置→定义→存储→入口→视图→DML→顺序→递归→边界→选择→验证→规范」推演。 -->
<style>
:root{
  --bg:#F7F6F2; --paper2:#F1EFE9; --ink:#1B2B33; --ink2:#46585F;
  --muted:#89938F; --line:#D9D5CB; --primary:#245A6B; --prim-l:#E5EFF0;
  --accent:#BE653B; --acc-l:#F7E9DE; --green:#2F7A66; --green-l:#E4F0EA;
  --gold:#AE8A3E;
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#E9E7E1}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
#viewport{position:absolute;inset:0 0 58px 0;overflow:hidden}
body.pane-on #viewport{right:38%}
#stage{position:absolute;width:1600px;height:900px;background:var(--bg);
  transform-origin:top left;box-shadow:0 18px 60px rgba(27,43,51,.13);
  transition:left .3s ease,top .3s ease,transform .3s ease}
.slide{position:absolute;inset:0;display:none}
.slide.on{display:block;animation:fadein .42s cubic-bezier(.2,.7,.2,1)}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{position:absolute;left:64px;top:44px;font-size:13px;letter-spacing:3.4px;
  color:var(--primary);font-weight:600}
.eyebrow .num{font-family:var(--mono);letter-spacing:1px;color:var(--accent);margin-right:14px}
h1.title{position:absolute;left:64px;top:70px;margin:0;font-family:var(--serif);
  font-size:44px;line-height:1.25;font-weight:700;letter-spacing:1.2px;color:var(--ink)}
.lede{position:absolute;left:64px;top:139px;width:1440px;font-size:19px;color:var(--ink2);
  line-height:1.5;letter-spacing:.3px}
.rule{position:absolute;left:64px;top:181px;width:1472px;height:1px;background:var(--line)}
.figwrap{position:absolute;left:100px;top:198px;width:1400px;height:430px}
svg.figure{display:block;overflow:visible}
svg.figure text{font-family:var(--sans)}
svg.figure text.serif{font-family:var(--serif)}
svg.figure text.mono{font-family:var(--mono)}
.caption{position:absolute;left:100px;top:638px;width:1400px;font-size:13px;
  color:var(--muted);letter-spacing:.4px}
.bridge{position:absolute;left:64px;top:706px;width:1472px;font-size:20px;
  color:var(--accent);line-height:1.55;letter-spacing:.4px;padding-left:18px;
  border-left:3px solid var(--accent);font-family:var(--serif)}
.bridge .bk{font-family:var(--sans);font-size:13px;color:var(--muted);
  letter-spacing:2px;display:block;margin-bottom:2px}
.footer{position:absolute;left:64px;top:846px;width:1472px;height:1px;background:var(--line)}
.footer .fl{position:absolute;left:0;top:14px;font-size:12.5px;color:var(--muted);letter-spacing:2px}
.footer .fr{position:absolute;right:0;top:12px;font-family:var(--mono);font-size:14px;color:var(--ink2)}
.footer .fbar{position:absolute;left:0;right:0;top:-1px;height:2px;background:transparent}
.footer .fbar i{display:block;height:2px;background:var(--primary);width:0;transition:width .4s ease}

/* 动画页控件：独立于图区下方条带，绝不覆盖图 */
.ctrls{position:absolute;left:100px;top:638px;width:1400px;height:46px;display:flex;
  align-items:center;gap:12px}
.ctrls label{font-size:13.5px;color:var(--ink2);white-space:nowrap}
.ctrls select{font-family:var(--sans);font-size:13.5px;color:var(--ink);background:#fff;
  border:1px solid var(--line);border-radius:4px;padding:5px 8px;outline:none}
.ctrls .btn{min-height:30px;padding:5px 14px;border:1px solid var(--primary);border-radius:4px;
  background:#fff;color:var(--primary);font-size:13.5px;cursor:pointer;font-family:var(--sans)}
.ctrls .btn.play{background:var(--primary);color:#fff}
.ctrls .btn:hover{filter:brightness(.94)}
.ctrls .out{font-size:13.5px;color:var(--ink2);margin-left:auto;min-width:0;flex:1;
  max-width:600px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrls .out b{color:var(--accent);font-weight:600}

/* 底部按键条：全屏后依然可见 */
.chrome{position:fixed;left:0;right:0;bottom:0;height:58px;background:#FCFBF8;
  border-top:1px solid var(--line);display:flex;align-items:center;gap:6px;
  padding:0 16px;z-index:50;font-size:13px;color:var(--ink2)}
body.immersive .chrome{background:rgba(252,251,248,.96)}
.chrome .sep{width:1px;height:22px;background:var(--line);margin:0 6px}
.chrome button{font-family:var(--sans);font-size:13px;color:var(--ink2);background:transparent;
  border:1px solid transparent;border-radius:5px;padding:7px 10px;cursor:pointer;white-space:nowrap}
.chrome button:hover{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome button.act{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome .pg{font-family:var(--mono);font-size:14px;color:var(--ink);min-width:76px;text-align:center}
.chrome .track{flex:1;min-width:60px;height:3px;background:var(--line);border-radius:3px;margin:0 10px;position:relative}
.chrome .track i{position:absolute;left:0;top:0;height:3px;background:var(--primary);border-radius:3px;transition:width .35s}
.chrome .hint{font-size:11.5px;color:var(--muted);white-space:nowrap}

/* 右侧页内开窗讲稿：不是弹窗，原页面矢量缩放到左侧 */
#notesPane{position:fixed;top:0;right:0;bottom:58px;width:38%;background:var(--paper2);
  border-left:1px solid var(--line);z-index:35;transform:translateX(100%);
  transition:transform .3s ease;overflow-y:auto;padding:26px 32px 60px;
  box-shadow:-12px 0 40px rgba(27,43,51,.08)}
body.pane-on #notesPane{transform:none}
.phead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:14px;
  margin-bottom:20px;border-bottom:1px solid var(--line)}
.ptitle{font-family:var(--serif);font-size:20px;font-weight:700;color:var(--ink);margin-right:auto}
.ptabs{display:flex;gap:5px}
.phead button{font-family:var(--sans);font-size:12.5px;padding:6px 9px;border-radius:4px;
  border:1px solid var(--line);background:#fff;color:var(--ink2);cursor:pointer;white-space:nowrap}
.phead button.on{background:var(--primary);border-color:var(--primary);color:#fff}
.phead button:hover{border-color:var(--primary)}
.plead{font-size:13px;color:var(--muted);line-height:1.8;margin-bottom:20px}
.nsec{border-top:1px solid var(--line);padding:18px 0 20px;scroll-margin-top:16px}
.nsec.cur{background:#fff;margin:0 -14px;padding:18px 14px 20px;border-left:3px solid var(--accent)}
.nsec .sn{font-family:var(--mono);font-size:11.5px;color:var(--accent);letter-spacing:1px}
.nsec h3{margin:7px 0 12px;font-family:var(--serif);font-size:19px;color:var(--primary);line-height:1.4}
.nsec p{margin:0;font-size:15px;line-height:1.95;color:var(--ink2);letter-spacing:.2px}
.nsec .nb{margin-top:12px;font-family:var(--serif);font-size:14px;color:var(--accent);line-height:1.7}
.toclist{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.toclist a{display:block;padding:10px 11px;border:1px solid var(--line);border-radius:5px;
  background:#fff;color:var(--ink);cursor:pointer;font-size:12.5px;line-height:1.5}
.toclist a.cur{border-color:var(--accent);background:var(--acc-l)}
.toclist a .gn{font-family:var(--mono);color:var(--accent);margin-right:7px}
.keylines{font-size:14px;line-height:2.1;color:var(--ink2)}
.keylines kbd{font-family:var(--mono);background:#fff;border:1px solid var(--line);
  border-bottom-width:2px;border-radius:4px;padding:2px 7px;color:var(--primary);margin-right:8px}
.toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);background:var(--ink);
  color:#fff;font-size:13px;padding:9px 16px;border-radius:5px;opacity:0;transition:.3s;
  z-index:80;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
@media print{.chrome,#notesPane,.toast{display:none!important}
  body.pane-on #viewport{right:0}
  #viewport{position:static}#stage{position:static;transform:none!important;box-shadow:none}
  .slide{display:block!important;page-break-after:always;position:relative;height:900px}}
</style>
</head>
<body>
<div id="viewport"><div id="stage"><div id="slides"></div></div></div>
<aside id="notesPane" aria-label="页内讲稿开窗"></aside>
<div class="chrome">
  <button id="btnPrev">上一页 ←</button>
  <button id="btnNext">下一页 →</button>
  <span class="pg">01 / 17</span>
  <div class="track" id="track"><i></i></div>
  <div class="sep"></div>
  <button id="btnToc">目录 G</button>
  <button id="btnNotes">本页讲稿 N</button>
  <button id="btnAll">全文讲稿 T</button>
  <button id="btnAuto">自动播放 P</button>
  <button id="btnFs">全屏 F</button>
  <button id="btnHelp">快捷键 ?</button>
  <div class="sep"></div>
  <div class="hint">← → 翻页 · Esc 关闭开窗 / 退出全屏</div>
</div>
<div class="toast" id="toast"></div>
<script>
const D = [{"eyebrow":"开场 · 执行之前","title":"一条 SQL，在执行前就已经变了","lede":"rule 不是执行器里多做的那一步；它卡在 parser 与 planner 之间，把一条查询树改写成另一组查询树。","caption":"图 01　执行链路上被陶橙标出的闸门，就是 rule system；它的输入和输出都是查询树。","bridge":"我们从一个很朴素的问题开始：你写下的 SQL，和数据库真正拿去优化的那条 SQL，是同一条吗？很多时候不是。","notes":"大家好，今天讲数据库筑基课里一个看起来很偏、其实特别能说明问题的题目：PostgreSQL 的 rule。先不谈语法，我想请你记住一句话——很多数据库能力不是在执行器里多做一步，而是在执行之前，把问题改写成另一个问题。视图就是最典型的例子：你写的是 SELECT * FROM v，数据库真正优化的，可能是把视图定义展开之后的一整棵查询树。这个动作发生在 planner 之前，所以优化器看到的不是黑盒，而是完整的关系代数。今天我们就顺着这条线，把 rule 放在哪儿、它怎么改写、它能带来什么、又在哪些地方让人踩坑，一层一层讲清楚。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><text x=\"40\" y=\"26\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#89938F\" font-weight=\"400\" >执行链路 · 从左到右，rule 卡在闸门位置</text><rect x=\"40\" y=\"46\" width=\"200\" height=\"84\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"140.0\" y=\"81.75\" class=\"sv s\" text-anchor=\"middle\" font-size=\"18.0\" fill=\"#1B2B33\" font-weight=\"600\" >SQL 文本</text><text x=\"140.0\" y=\"104.25\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >SELECT * FROM v</text><line x1=\"244\" y1=\"88\" x2=\"251.6\" y2=\"88\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"258,88 250,83.6 250,92.4\" fill=\"#245A6B\"/><rect x=\"264\" y=\"46\" width=\"200\" height=\"84\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"364.0\" y=\"81.75\" class=\"sv s\" text-anchor=\"middle\" font-size=\"18.0\" fill=\"#1B2B33\" font-weight=\"600\" >Parser</text><text x=\"364.0\" y=\"104.25\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >解析为 Query tree</text><line x1=\"468\" y1=\"88\" x2=\"475.6\" y2=\"88\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"482,88 474,83.6 474,92.4\" fill=\"#245A6B\"/><rect x=\"488\" y=\"46\" width=\"200\" height=\"84\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"588.0\" y=\"81.75\" class=\"sv s\" text-anchor=\"middle\" font-size=\"18.0\" fill=\"#1B2B33\" font-weight=\"600\" >Query tree</text><text x=\"588.0\" y=\"104.25\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >结构化查询树</text><line x1=\"692\" y1=\"88\" x2=\"699.6\" y2=\"88\" stroke=\"#BE653B\" stroke-width=\"1.8\"/><polygon points=\"706,88 698,83.6 698,92.4\" fill=\"#BE653B\"/><rect x=\"712\" y=\"46\" width=\"200\" height=\"84\" rx=\"5\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.1\" /><text x=\"812.0\" y=\"81.75\" class=\"sv s\" text-anchor=\"middle\" font-size=\"18.0\" fill=\"#BE653B\" font-weight=\"700\" >Rule System</text><text x=\"812.0\" y=\"104.25\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#BE653B\" font-weight=\"400\" >改写发生在这里</text><line x1=\"916\" y1=\"88\" x2=\"923.6\" y2=\"88\" stroke=\"#BE653B\" stroke-width=\"1.8\"/><polygon points=\"930,88 922,83.6 922,92.4\" fill=\"#BE653B\"/><rect x=\"936\" y=\"46\" width=\"200\" height=\"84\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"1036.0\" y=\"81.75\" class=\"sv s\" text-anchor=\"middle\" font-size=\"18.0\" fill=\"#1B2B33\" font-weight=\"600\" >Planner</text><text x=\"1036.0\" y=\"104.25\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >看到改写后的树</text><line x1=\"1140\" y1=\"88\" x2=\"1147.6\" y2=\"88\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"1154,88 1146,83.6 1146,92.4\" fill=\"#245A6B\"/><rect x=\"1160\" y=\"46\" width=\"200\" height=\"84\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"1260.0\" y=\"81.75\" class=\"sv s\" text-anchor=\"middle\" font-size=\"18.0\" fill=\"#1B2B33\" font-weight=\"600\" >Executor</text><text x=\"1260.0\" y=\"104.25\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >按计划执行</text><line x1=\"812\" y1=\"130\" x2=\"812\" y2=\"158\" stroke=\"#BE653B\" stroke-width=\"2\"/><text x=\"812\" y=\"186\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"600\" >parser 之后 · planner 之前</text><rect x=\"40\" y=\"216\" width=\"600\" height=\"92\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.1\" /><text x=\"340.0\" y=\"255.5\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"600\" >输入</text><text x=\"340.0\" y=\"278.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >一条由 parser 产生的 Query tree</text><line x1=\"650\" y1=\"262\" x2=\"737.6\" y2=\"262\" stroke=\"#BE653B\" stroke-width=\"2.2\"/><polygon points=\"744,262 736,257.6 736,266.4\" fill=\"#BE653B\"/><rect x=\"760\" y=\"216\" width=\"600\" height=\"92\" rx=\"5\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.1\" /><text x=\"1060.0\" y=\"255.5\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#BE653B\" font-weight=\"600\" >输出</text><text x=\"1060.0\" y=\"278.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >0 条、1 条或多条 Query tree</text><rect x=\"40\" y=\"336\" width=\"1320\" height=\"72\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1.0\" /><text x=\"58\" y=\"378.3\" class=\"sv s\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#2F7A66\" font-weight=\"600\" >计算前置</text><text x=\"346\" y=\"376.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >把语义变换移到优化器之前：视图能参与全局优化，DML 也可能被复制、替换或抑制。</text></svg>","ctrl":null,"blabel":"承接 · NEXT"},{"eyebrow":"第一问 · 为什么先看位置","title":"这道闸门，决定了 rule 的能力与风险","lede":"输入和输出都是 parser 能产生的 Query tree；planner 只面对改写后的结果，不会看见改写过程。","caption":"图 02　地层式剖面：parser、rewriter、planner、executor 四层各司其职，rule 只占中间那一层。","bridge":"先把位置钉死，后面所有结论都能从这一步推出来。","notes":"为什么我坚持先讲位置，而不是先讲 CREATE RULE 怎么写？因为位置决定了这个机制能做什么、不能做什么。你看这张剖面：最上面是 SQL 文本，parser 把它变成查询树；接着 rule system 拿着 pg_rewrite 里的规则，对这棵树做改写；再往下 planner 才接手，生成执行计划；最后 executor 执行。注意两个细节。第一，rule 的输入和输出都是 parser 本身能产生的查询树，它没有引入一种私有格式，所以改写结果能无缝交回优化器。第二，planner 完全不知道刚才发生过改写，它只看见结果。这就解释了 rule 最大的好处：视图展开后仍是一棵完整查询树，优化器可以继续做全局优化。同时也解释了最大的风险：一条 DML 在闸门里可能被拆成几条，SQL 表面上看不出来。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"30\" y=\"18\" width=\"1340\" height=\"88\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#F1EFE9\" stroke-width=\"1\" /><rect x=\"40\" y=\"24\" width=\"250\" height=\"76\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"165.0\" y=\"67.425\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.5\" fill=\"#1B2B33\" font-weight=\"600\" >SQL 文本</text><rect x=\"330\" y=\"24\" width=\"280\" height=\"76\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"470.0\" y=\"67.95\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"700\" >Parser</text><rect x=\"650\" y=\"24\" width=\"710\" height=\"76\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"1005.0\" y=\"67.075\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"600\" >文本 → 结构化 Query tree</text><line x1=\"470\" y1=\"102\" x2=\"470\" y2=\"113.6\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"470,120 465.6,112 474.4,112\" fill=\"#245A6B\"/><rect x=\"30\" y=\"118\" width=\"1340\" height=\"88\" rx=\"4\" fill=\"#F7F6F2\" stroke=\"#F7F6F2\" stroke-width=\"1\" /><rect x=\"40\" y=\"124\" width=\"250\" height=\"76\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"165.0\" y=\"167.425\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.5\" fill=\"#1B2B33\" font-weight=\"600\" >Query tree</text><rect x=\"330\" y=\"124\" width=\"280\" height=\"76\" rx=\"5\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.1\" /><text x=\"470.0\" y=\"167.95\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#BE653B\" font-weight=\"700\" >Rule System</text><rect x=\"650\" y=\"124\" width=\"710\" height=\"76\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"1005.0\" y=\"167.075\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"600\" >按 pg_rewrite 改写：0、1 或多条树</text><line x1=\"470\" y1=\"202\" x2=\"470\" y2=\"213.6\" stroke=\"#BE653B\" stroke-width=\"1.8\"/><polygon points=\"470,220 465.6,212 474.4,212\" fill=\"#BE653B\"/><rect x=\"30\" y=\"218\" width=\"1340\" height=\"88\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#F1EFE9\" stroke-width=\"1\" /><rect x=\"40\" y=\"224\" width=\"250\" height=\"76\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"165.0\" y=\"267.425\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.5\" fill=\"#1B2B33\" font-weight=\"600\" >改写后 Query tree</text><rect x=\"330\" y=\"224\" width=\"280\" height=\"76\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"470.0\" y=\"267.95\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"700\" >Planner</text><rect x=\"650\" y=\"224\" width=\"710\" height=\"76\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"1005.0\" y=\"267.075\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"600\" >看到完整关系代数 → 生成执行计划</text><line x1=\"470\" y1=\"302\" x2=\"470\" y2=\"313.6\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"470,320 465.6,312 474.4,312\" fill=\"#245A6B\"/><rect x=\"30\" y=\"318\" width=\"1340\" height=\"88\" rx=\"4\" fill=\"#F7F6F2\" stroke=\"#F7F6F2\" stroke-width=\"1\" /><rect x=\"40\" y=\"324\" width=\"250\" height=\"76\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"165.0\" y=\"367.425\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.5\" fill=\"#1B2B33\" font-weight=\"600\" >执行计划</text><rect x=\"330\" y=\"324\" width=\"280\" height=\"76\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"470.0\" y=\"367.95\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"700\" >Executor</text><rect x=\"650\" y=\"324\" width=\"710\" height=\"76\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"1005.0\" y=\"367.075\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"600\" >按计划执行，rule 不再参与</text><text x=\"40\" y=\"420\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#89938F\" font-weight=\"400\" >位置决定能力，也决定风险：planner 只面对改写后的查询，DML 却可能在改写时被复制或抑制。</text></svg>","ctrl":null,"blabel":"承接 · NEXT"},{"eyebrow":"第二问 · 它到底是什么","title":"rule 是一张改写规则，不是一段回调","lede":"规则存在 pg_rewrite，规则动作也是 Query tree。它既不是触发器，也不是存储过程，更不是逐行回调。","caption":"图 03　一条 Query tree 经 rewriter 后，可能变成 0 条、1 条或多条；ON SELECT 是专供视图的特例。","bridge":"把它和触发器分清，是后面所有讨论的前提。","notes":"一句话定义：rule 是 PostgreSQL 在 parser 之后、planner 之前执行的查询树改写规则；规则本身存储在 pg_rewrite 目录里，规则动作也以查询树的形式保存。注意『改写规则』这四个字。触发器是执行期回调，数据库一行一行跑到那一行才调用它；rule 不是，它在执行之前就把一条语句变成零条、一条或者多条语句，然后交给 planner。所以你用 CREATE RULE 写下的东西，本质上是在告诉 rewriter：遇到符合条件的查询树，请按这个动作树去替换或追加。语法里那个 event 可以是 SELECT、INSERT、UPDATE、DELETE，但 ON SELECT 非常特殊，它基本只服务于视图，必须是名为 _RETURN 的无条件 INSTEAD SELECT，源码里还专门有个常量 ViewSelectRuleName 写着 _RETURN。记住这个特例，下一页我们就能看懂视图到底是怎么实现的。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40\" y=\"20\" width=\"1320\" height=\"72\" rx=\"5\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"58\" y=\"48\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"400\" >CREATE [OR REPLACE] RULE name AS ON event TO table [WHERE cond] DO [ALSO|INSTEAD] { NOTHING | command | ( command ; ... ) }</text><text x=\"58\" y=\"76\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >event ∈ { SELECT, INSERT, UPDATE, DELETE } · 规则与动作都以 Query tree / pg_node_tree 形式保存</text><rect x=\"40\" y=\"166\" width=\"270\" height=\"88\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"175.0\" y=\"203.75\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"600\" >原始 Query tree</text><text x=\"175.0\" y=\"226.25\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >parser 的输出</text><line x1=\"310\" y1=\"210\" x2=\"683.6\" y2=\"210\" stroke=\"#245A6B\" stroke-width=\"2\"/><polygon points=\"690,210 682,205.6 682,214.4\" fill=\"#245A6B\"/><rect x=\"500\" y=\"178\" width=\"190\" height=\"64\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"595.0\" y=\"215.95\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#1B2B33\" font-weight=\"600\" >rewriter</text><line x1=\"690\" y1=\"210\" x2=\"730\" y2=\"210\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><line x1=\"730\" y1=\"144\" x2=\"730\" y2=\"312\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><line x1=\"730\" y1=\"144\" x2=\"771.6\" y2=\"144\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><polygon points=\"778,144 770,139.6 770,148.4\" fill=\"#245A6B\"/><rect x=\"784\" y=\"112\" width=\"576\" height=\"64\" rx=\"5\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.1\" /><text x=\"1072.0\" y=\"137.75\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#BE653B\" font-weight=\"600\" >0 条 Query tree</text><text x=\"1072.0\" y=\"160.25\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >原查询被抑制</text><line x1=\"730\" y1=\"228\" x2=\"771.6\" y2=\"228\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><polygon points=\"778,228 770,223.6 770,232.4\" fill=\"#245A6B\"/><rect x=\"784\" y=\"196\" width=\"576\" height=\"64\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"1072.0\" y=\"221.75\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" >1 条 Query tree</text><text x=\"1072.0\" y=\"244.25\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >用规则动作替换</text><line x1=\"730\" y1=\"312\" x2=\"771.6\" y2=\"312\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><polygon points=\"778,312 770,307.6 770,316.4\" fill=\"#245A6B\"/><rect x=\"784\" y=\"280\" width=\"576\" height=\"64\" rx=\"5\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"1072.0\" y=\"305.75\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#2F7A66\" font-weight=\"600\" >多条 Query tree</text><text x=\"1072.0\" y=\"328.25\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >动作 + 原查询</text><rect x=\"40\" y=\"368\" width=\"1320\" height=\"52\" rx=\"4\" fill=\"#F5EDDC\" stroke=\"#F5EDDC\" stroke-width=\"1.0\" /><text x=\"58\" y=\"399.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#AE8A3E\" font-weight=\"600\" >ON SELECT 特例</text><text x=\"346\" y=\"398.55\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >只用于视图：必须名为 _RETURN、无条件 INSTEAD SELECT，且每个视图仅一条。</text></svg>","ctrl":null,"blabel":"承接 · NEXT"},{"eyebrow":"第三问 · 规则存到哪里","title":"从 CREATE RULE 到 relcache：规则是怎么被记住的","lede":"pg_rewrite 是规则的持久住所；relcache 的 rd_rules 是执行期快速读取的入口。","caption":"图 04　创建路径写入 catalog 并置位 relhasrules，打开 relation 时再按规则名顺序载入内存。","bridge":"规则不是临时算出来的，它有自己的存储、索引和失效机制。","notes":"既然 rule 是查目录、改查询树的机制，它就一定有自己的持久化和缓存路径。你执行 CREATE RULE，走的是 DefineQueryRewrite() 做合法性检查，再由 InsertRule() 写进 pg_rewrite；同时把 pg_class.relhasrules 设为 true，并让 relcache 失效。之后每次打开这张表，RelationBuildRuleLock() 会按 RewriteRelRulenameIndexId 把规则扫进内存，形成 rd_rules 里的 RuleLock。这里有个特别容易被忽略的顺序问题：源码注释说明通常是按规则名顺序载入的，所以同一张表、同一个事件上的多条规则，会按字母顺序应用。规则名不是随便起的注释，它参与决定行为顺序。再看右边这几个字段：ev_type 记事件，ev_qual 存条件，ev_action 存动作查询树。条件和动作都不是字符串，而是节点树。这就是为什么 user DML rule 难读、难测——你读的其实是一棵被序列化的树。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40\" y=\"24\" width=\"300\" height=\"52\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"190.0\" y=\"55.425\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.5\" fill=\"#1B2B33\" font-weight=\"700\" >CREATE RULE / CREATE VIEW</text><line x1=\"190\" y1=\"78\" x2=\"190\" y2=\"85.6\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><polygon points=\"190,92 185.6,84 194.4,84\" fill=\"#245A6B\"/><rect x=\"40\" y=\"96\" width=\"300\" height=\"52\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"190.0\" y=\"127.425\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.5\" fill=\"#245A6B\" font-weight=\"700\" >DefineQueryRewrite()</text><line x1=\"190\" y1=\"150\" x2=\"190\" y2=\"157.6\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><polygon points=\"190,164 185.6,156 194.4,156\" fill=\"#245A6B\"/><rect x=\"40\" y=\"168\" width=\"300\" height=\"52\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"190.0\" y=\"199.425\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.5\" fill=\"#245A6B\" font-weight=\"700\" >InsertRule()</text><line x1=\"190\" y1=\"222\" x2=\"190\" y2=\"229.6\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><polygon points=\"190,236 185.6,228 194.4,228\" fill=\"#245A6B\"/><rect x=\"40\" y=\"240\" width=\"300\" height=\"52\" rx=\"5\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.1\" /><text x=\"190.0\" y=\"271.425\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.5\" fill=\"#BE653B\" font-weight=\"700\" >写入 pg_rewrite</text><line x1=\"190\" y1=\"294\" x2=\"190\" y2=\"301.6\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><polygon points=\"190,308 185.6,300 194.4,300\" fill=\"#245A6B\"/><rect x=\"40\" y=\"312\" width=\"300\" height=\"52\" rx=\"5\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"190.0\" y=\"343.425\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.5\" fill=\"#2F7A66\" font-weight=\"700\" >RelationBuildRuleLock()</text><text x=\"360\" y=\"274\" class=\"sv s\" text-anchor=\"start\" font-size=\"9.9\" fill=\"#89938F\" font-weight=\"400\" >同时置 pg_class.relhasrules = true，并触发 relcache 失效</text><text x=\"40\" y=\"400\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#245A6B\" font-weight=\"600\" >打开 relation 时 → relcache.rd_rules / RuleLock</text><rect x=\"680\" y=\"24\" width=\"680\" height=\"40\" rx=\"4\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1\" /><text x=\"700\" y=\"51\" class=\"sv serif\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#FFFFFF\" font-weight=\"600\" >pg_rewrite 关键字段</text><rect x=\"680\" y=\"68\" width=\"680\" height=\"40\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"700\" y=\"94\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" >rulename</text><text x=\"900\" y=\"94\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >同一 relation 内的规则名</text><rect x=\"680\" y=\"110\" width=\"680\" height=\"40\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"700\" y=\"136\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" >ev_class</text><text x=\"900\" y=\"136\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >规则所属 relation 的 OID</text><rect x=\"680\" y=\"152\" width=\"680\" height=\"40\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"700\" y=\"178\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" >ev_type</text><text x=\"900\" y=\"178\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >事件：SELECT/INSERT/UPDATE/DELETE</text><rect x=\"680\" y=\"194\" width=\"680\" height=\"40\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"700\" y=\"220\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" >ev_enabled</text><text x=\"900\" y=\"220\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >是否启用 · origin/replica/always</text><rect x=\"680\" y=\"236\" width=\"680\" height=\"40\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"700\" y=\"262\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" >is_instead</text><text x=\"900\" y=\"262\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >是否为 INSTEAD rule</text><rect x=\"680\" y=\"278\" width=\"680\" height=\"40\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"700\" y=\"304\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" >ev_qual</text><text x=\"900\" y=\"304\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >规则条件，pg_node_tree</text><rect x=\"680\" y=\"320\" width=\"680\" height=\"40\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"0.8\" /><text x=\"700\" y=\"346\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" >ev_action</text><text x=\"900\" y=\"346\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >规则动作查询树，pg_node_tree</text><text x=\"680\" y=\"400\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" >按 RewriteRelRulenameIndexId 扫描 → 按规则名顺序载入 → 同表同事件按名称顺序应用</text></svg>","ctrl":null,"blabel":"承接 · NEXT"},{"eyebrow":"第四问 · 改写的主入口","title":"QueryRewrite()：一次改写，走三步","lede":"先处理非 SELECT rule，再展开视图，最后决定哪条 Query 可以拿到命令结果标签。","caption":"","bridge":"这一步最关键：DML rule 和视图 rule 根本不是同一种行为。","notes":"入口函数叫 QueryRewrite()，源码在 rewriteHandler.c。它的顺序非常值得记：第一步，对顶层原始查询应用非 SELECT rule，结果可能是零条、一条或者多条查询；第二步，对每一条结果应用 ON SELECT rule，也就是把视图展开；第三步，决定哪条查询可以设置命令结果标签，也就是客户端看到的 INSERT 0 1、UPDATE n 之类。为什么要分两步？因为这两种规则的行为完全不一样。视图的 ON SELECT 是在 range table 里原地展开引用；DML 规则则是生成新的查询树，可以保留、可以替换、也可以直接抑制原始查询。这个差别不是实现细节，它会一路影响到事务、锁、权限、RETURNING 和命令标签。下面的动画里，你可以切换三种输入，单步看每一步发生了什么——建议先选『SELECT 查询普通视图』，再换成『UPDATE 命中无条件 ALSO』对比。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40\" y=\"24\" width=\"420\" height=\"236\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" id=\"rwBox1\"/><rect x=\"40\" y=\"24\" width=\"420\" height=\"40\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"56\" y=\"50\" class=\"sv serif\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#245A6B\" font-weight=\"700\" >① 原始查询与 DML rule</text><text x=\"56\" y=\"82\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >非 SELECT 规则先看</text><line x1=\"56\" y1=\"96\" x2=\"444\" y2=\"96\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><line x1=\"466\" y1=\"142\" x2=\"475.6\" y2=\"142\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"482,142 474,137.6 474,146.4\" fill=\"#245A6B\"/><rect x=\"490\" y=\"24\" width=\"420\" height=\"236\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" id=\"rwBox2\"/><rect x=\"490\" y=\"24\" width=\"420\" height=\"40\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1\" /><text x=\"506\" y=\"50\" class=\"sv serif\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#BE653B\" font-weight=\"700\" >② ON SELECT 规则</text><text x=\"506\" y=\"82\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >展开视图类 RIR rule</text><line x1=\"506\" y1=\"96\" x2=\"894\" y2=\"96\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><line x1=\"916\" y1=\"142\" x2=\"925.6\" y2=\"142\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"932,142 924,137.6 924,146.4\" fill=\"#245A6B\"/><rect x=\"940\" y=\"24\" width=\"420\" height=\"236\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" id=\"rwBox3\"/><rect x=\"940\" y=\"24\" width=\"420\" height=\"40\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"956\" y=\"50\" class=\"sv serif\" text-anchor=\"start\" font-size=\"15.5\" fill=\"#245A6B\" font-weight=\"700\" >③ 命令标签裁定</text><text x=\"956\" y=\"82\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >决定客户端看到什么</text><line x1=\"956\" y1=\"96\" x2=\"1344\" y2=\"96\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text id=\"rwS1\" x=\"56\" y=\"132\" class=\"sv\" font-size=\"12.6\" fill=\"#46585F\">等待播放…</text><text id=\"rwS2\" x=\"506\" y=\"132\" class=\"sv\" font-size=\"12.6\" fill=\"#46585F\">等待播放…</text><text id=\"rwS3\" x=\"956\" y=\"132\" class=\"sv\" font-size=\"12.6\" fill=\"#46585F\">等待播放…</text><text id=\"rwS4\" x=\"956\" y=\"170\" class=\"sv\" font-size=\"12.6\" fill=\"#46585F\">等待播放…</text><rect x=\"40\" y=\"286\" width=\"1320\" height=\"124\" rx=\"5\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"60\" y=\"314\" class=\"sv serif\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"700\" >改写结果 · Query list</text><text id=\"rwResLab\" x=\"1360\" y=\"314\" text-anchor=\"end\" class=\"sv\" font-size=\"13\" fill=\"#89938F\">等待改写结果…</text><g id=\"rwChip1\" opacity=\"0.12\"><rect x=\"60\" y=\"332\" width=\"400\" height=\"58\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"260\" y=\"368\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"600\" >Query tree 1</text></g><g id=\"rwChip2\" opacity=\"0.12\"><rect x=\"490\" y=\"332\" width=\"400\" height=\"58\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"690\" y=\"368\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"600\" >Query tree 2</text></g><g id=\"rwChip3\" opacity=\"0.12\"><rect x=\"920\" y=\"332\" width=\"400\" height=\"58\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"1120\" y=\"368\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"600\" >Query tree 3</text></g></svg>","ctrl":"<label>输入语句</label><select id=\"rwMode\"><option value=\"view\">SELECT 查询普通视图</option><option value=\"also\">UPDATE 命中无条件 ALSO</option><option value=\"instead\">UPDATE 命中无条件 INSTEAD</option></select><button class=\"btn\" id=\"rwPlay\">播放</button><button class=\"btn\" id=\"rwTick\">单步</button><button class=\"btn\" id=\"rwReset\">重置</button><span class=\"out\" id=\"rwOut\"></span>","blabel":"承接 · NEXT"},{"eyebrow":"第五问 · 视图是怎么来的","title":"视图：_RETURN 把 view 引用换成子查询","lede":"业务用稳定名字封装查询；rewriter 把这个名字替换成保存下来的 SELECT 定义。","caption":"图 05　左边是用户 SQL，中间是 _RETURN 规则，右边是改写后的逻辑形态；优化动作不在这一层。","bridge":"正因为这一步只是替换，planner 才有机会接手后面的全部优化。","notes":"PostgreSQL 官方文档说得很直接：视图基本上是一个没有实际存储的空表，加上一个 ON SELECT DO INSTEAD 规则，通常名为 _RETURN。CREATE VIEW 的实现也印证了这一点：DefineViewRules() 调用 DefineQueryRewrite() 创建这条规则，把视图定义存成查询树。看这个例子，active_users 是一个只返回启用用户的视图，用户再叠一个 city 条件。rewriter 做的事情，是把 active_users 这个 range table entry 换成保存的 SELECT 子查询；注意我说的是『逻辑上接近』右边这段 SQL，内部其实是树到树的操作，不是文本替换。重点是：rule 到这里就停了。子查询要不要拉平、city 条件能不能下推到 users 上、join 顺序怎么选、走哪条索引，全部由 planner 决定。所以普通视图不是运行时黑盒，这是它最重要的工程价值。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><text x=\"40\" y=\"24\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#89938F\" font-weight=\"600\" >用户写下的 SQL</text><rect x=\"40\" y=\"36\" width=\"400\" height=\"240\" rx=\"5\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"55\" y=\"60.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#1B2B33\" font-weight=\"400\" >CREATE VIEW active_users AS</text><text x=\"55\" y=\"79.84\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#1B2B33\" font-weight=\"400\" >SELECT id, name, city</text><text x=\"55\" y=\"99.68\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#1B2B33\" font-weight=\"400\" >FROM users</text><text x=\"55\" y=\"119.52000000000001\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#1B2B33\" font-weight=\"400\" >WHERE enabled;</text><text x=\"55\" y=\"139.36\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#1B2B33\" font-weight=\"400\" ></text><text x=\"55\" y=\"159.20000000000002\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#1B2B33\" font-weight=\"400\" >SELECT * FROM active_users</text><text x=\"55\" y=\"179.04000000000002\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#1B2B33\" font-weight=\"400\" >WHERE city = &#x27;杭州&#x27;;</text><line x1=\"448\" y1=\"158\" x2=\"479.6\" y2=\"158\" stroke=\"#BE653B\" stroke-width=\"2\"/><polygon points=\"486,158 478,153.6 478,162.4\" fill=\"#BE653B\"/><rect x=\"492\" y=\"112\" width=\"216\" height=\"92\" rx=\"5\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.1\" /><text x=\"600.0\" y=\"152.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"17.0\" fill=\"#BE653B\" font-weight=\"600\" >_RETURN rule</text><text x=\"600.0\" y=\"173.6\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >保存的 SELECT 定义</text><line x1=\"712\" y1=\"158\" x2=\"743.6\" y2=\"158\" stroke=\"#BE653B\" stroke-width=\"2\"/><polygon points=\"750,158 742,153.6 742,162.4\" fill=\"#BE653B\"/><text x=\"752\" y=\"24\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#89938F\" font-weight=\"600\" >逻辑上接近</text><rect x=\"752\" y=\"36\" width=\"608\" height=\"240\" rx=\"5\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"767\" y=\"60.0\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >SELECT active_users.*</text><text x=\"767\" y=\"79.375\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >FROM (</text><text x=\"767\" y=\"98.75\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >  SELECT id, name, city</text><text x=\"767\" y=\"118.125\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >  FROM users</text><text x=\"767\" y=\"137.5\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >  WHERE enabled</text><text x=\"767\" y=\"156.875\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >) AS active_users</text><text x=\"767\" y=\"176.25\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"400\" >WHERE active_users.city = &#x27;杭州&#x27;;</text><rect x=\"40\" y=\"300\" width=\"1320\" height=\"52\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"58\" y=\"331.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" >rule 只负责替换</text><text x=\"346\" y=\"330.55\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >它不做最终优化；下面的动作全部由 planner 完成。</text><rect x=\"40\" y=\"368\" width=\"315\" height=\"46\" rx=\"5\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"197.5\" y=\"396.075\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#2F7A66\" font-weight=\"600\" >子查询拉平</text><rect x=\"375\" y=\"368\" width=\"315\" height=\"46\" rx=\"5\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"532.5\" y=\"396.075\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#2F7A66\" font-weight=\"600\" >谓词下推</text><rect x=\"710\" y=\"368\" width=\"315\" height=\"46\" rx=\"5\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"867.5\" y=\"396.075\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#2F7A66\" font-weight=\"600\" >join 重排</text><rect x=\"1045\" y=\"368\" width=\"315\" height=\"46\" rx=\"5\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"1202.5\" y=\"396.075\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#2F7A66\" font-weight=\"600\" >索引路径选择</text></svg>","ctrl":null,"blabel":"承接 · NEXT"},{"eyebrow":"第六问 · 收益从哪来","title":"为什么普通视图不是黑盒","lede":"展开后仍是一棵完整关系代数树，planner 能继续做谓词下推、join 重排和索引选择。","caption":"图 06　两个视图被展开为底层表与条件，优化器面对的是一棵可以整体重写的树。","bridge":"同一套机制用到 DML 上，画风就完全变了。","notes":"把 _RETURN 这一步和后面连起来，收益就很清楚了。你写 view_a JOIN view_b，rewriter 把两个视图引用都展开，planner 拿到的是包含底层表、join 条件和过滤条件的整体查询树。它可以拉平嵌套子查询、把谓词推到最靠近表的位置、重排 join 顺序、再挑合适的索引路径。这比『执行视图函数再过滤』好得多，因为后者对优化器是个黑盒，只能先算出全部结果再筛。官方文档里的视图例子也展示了多层嵌套视图会形成多层子查询，但 planner 通常能继续拉平。所以面向数据库架构师的一条原则是：设计视图时放心利用它的可优化性，但复杂嵌套视图仍要用 EXPLAIN 验证，别凭感觉断定一定能拉平。接下来我们把这个机制换到 DML 上，你会发现同样的『改写』两个字，语义风险完全不同。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40\" y=\"60\" width=\"300\" height=\"190\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"190.0\" y=\"161.3\" class=\"sv s\" text-anchor=\"middle\" font-size=\"18.0\" fill=\"#1B2B33\" font-weight=\"600\" >用户 SQL</text><text x=\"190\" y=\"126\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >view_a JOIN view_b</text><text x=\"190\" y=\"156\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >ON ...</text><text x=\"190\" y=\"186\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"400\" >WHERE ...</text><line x1=\"344\" y1=\"155\" x2=\"371.6\" y2=\"155\" stroke=\"#245A6B\" stroke-width=\"2\"/><polygon points=\"378,155 370,150.6 370,159.4\" fill=\"#245A6B\"/><rect x=\"384\" y=\"30\" width=\"568\" height=\"280\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"668\" y=\"60\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" >改写后的完整查询树</text><rect x=\"420\" y=\"82\" width=\"220\" height=\"44\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.1\" /><text x=\"530.0\" y=\"109.075\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"600\" >底层表 a</text><rect x=\"700\" y=\"82\" width=\"220\" height=\"44\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.1\" /><text x=\"810.0\" y=\"109.075\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#245A6B\" font-weight=\"600\" >底层表 b</text><line x1=\"530\" y1=\"126\" x2=\"530\" y2=\"142\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><line x1=\"810\" y1=\"126\" x2=\"810\" y2=\"142\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><line x1=\"530\" y1=\"142\" x2=\"810\" y2=\"142\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><line x1=\"668\" y1=\"142\" x2=\"668\" y2=\"157.6\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><polygon points=\"668,164 663.6,156 672.4,156\" fill=\"#245A6B\"/><rect x=\"548\" y=\"168\" width=\"240\" height=\"48\" rx=\"5\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"668.0\" y=\"197.6\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#FFFFFF\" font-weight=\"700\" >JOIN</text><line x1=\"668\" y1=\"216\" x2=\"668\" y2=\"231.6\" stroke=\"#2F7A66\" stroke-width=\"1.6\"/><polygon points=\"668,238 663.6,230 672.4,230\" fill=\"#2F7A66\"/><rect x=\"548\" y=\"242\" width=\"240\" height=\"46\" rx=\"5\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"668.0\" y=\"270.075\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#2F7A66\" font-weight=\"600\" >过滤条件</text><line x1=\"956\" y1=\"155\" x2=\"981.6 {"eyebrow":"第七问 · DML 发生了什么","title":"DML rule：一条语句，变成一组语句","lede":"它不是逐行回调，而是把原查询复制、替换或抑制，生成 0 条到多条 Query tree。","caption":"图 07　四种 ALSO / INSTEAD 与条件组合，各自产出不同的 Query list。","bridge":"条件 INSTEAD 会多出一条取反的剩余路径，这一点最容易被想当然。","notes":"讲视图时我们说『原地展开』；到 DML，规则不再原地修改查询树，而是新建零个或多个查询树，并且可能丢掉原始查询。这张图把四种组合摊开：无条件 ALSO 是动作加原查询两条；无条件 INSTEAD 只剩动作，原查询不执行；有条件 ALSO 把 rule 条件追加到动作上，原查询照常执行；有条件 INSTEAD 最有意思，动作追加条件，原查询则追加 NOT(条件)，形成一条剩余路径。所以它不是简单的 if-else，而是把一条语句切成互补的两条。还有一点必须说清：OLD 和 NEW 不是触发器函数里的行变量，它们是规则动作查询树里的特殊 range table entry，改写时会被替换成原查询可见的表达式。理解了这一点，你才能解释为什么 UPDATE ... FROM、CTE、volatile 函数在 DML rule 里会表现出非直觉的语义。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40\" y=\"18\" width=\"300\" height=\"78\" rx=\"5\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.1\" /><text x=\"190.0\" y=\"62.6\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#BE653B\" font-weight=\"700\" >无条件 ALSO</text><line x1=\"348\" y1=\"57\" x2=\"417.6\" y2=\"57\" stroke=\"#BE653B\" stroke-width=\"1.8\"/><polygon points=\"424,57 416,52.6 416,61.4\" fill=\"#BE653B\"/><rect x=\"430\" y=\"18\" width=\"930\" height=\"78\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"450\" y=\"32\" width=\"250\" height=\"50\" rx=\"5\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"575.0\" y=\"61.725\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"600\" >规则动作</text><rect x=\"718\" y=\"32\" width=\"250\" height=\"50\" rx=\"5\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"843.0\" y=\"61.725\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"600\" >原查询</text><text x=\"930\" y=\"88\" class=\"sv s\" text-anchor=\"end\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" >2 条 · 动作 + 原查询</text><rect x=\"40\" y=\"108\" width=\"300\" height=\"78\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"190.0\" y=\"152.6\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" >无条件 INSTEAD</text><line x1=\"348\" y1=\"147\" x2=\"417.6\" y2=\"147\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><polygon points=\"424,147 416,142.6 416,151.4\" fill=\"#245A6B\"/><rect x=\"430\" y=\"108\" width=\"930\" height=\"78\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"450\" y=\"122\" width=\"300\" height=\"50\" rx=\"5\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"600.0\" y=\"151.725\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"600\" >仅规则动作</text><text x=\"930\" y=\"178\" class=\"sv s\" text-anchor=\"end\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" >1 条 · 原查询被抑制</text><rect x=\"40\" y=\"198\" width=\"300\" height=\"78\" rx=\"5\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"190.0\" y=\"242.6\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#2F7A66\" font-weight=\"700\" >有条件 ALSO</text><line x1=\"348\" y1=\"237\" x2=\"417.6\" y2=\"237\" stroke=\"#2F7A66\" stroke-width=\"1.8\"/><polygon points=\"424,237 416,232.6 416,241.4\" fill=\"#2F7A66\"/><rect x=\"430\" y=\"198\" width=\"930\" height=\"78\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"450\" y=\"212\" width=\"280\" height=\"50\" rx=\"5\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"590.0\" y=\"241.725\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"600\" >动作 + rule 条件</text><rect x=\"748\" y=\"212\" width=\"220\" height=\"50\" rx=\"5\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"858.0\" y=\"241.725\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"600\" >原查询</text><text x=\"930\" y=\"268\" class=\"sv s\" text-anchor=\"end\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" >2 条 · 条件只加在动作上</text><rect x=\"40\" y=\"288\" width=\"300\" height=\"78\" rx=\"5\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.1\" /><text x=\"190.0\" y=\"332.6\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#AE8A3E\" font-weight=\"700\" >有条件 INSTEAD</text><line x1=\"348\" y1=\"327\" x2=\"417.6\" y2=\"327\" stroke=\"#AE8A3E\" stroke-width=\"1.8\"/><polygon points=\"424,327 416,322.6 416,331.4\" fill=\"#AE8A3E\"/><rect x=\"430\" y=\"288\" width=\"930\" height=\"78\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"450\" y=\"302\" width=\"270\" height=\"50\" rx=\"5\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"585.0\" y=\"331.725\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"600\" >动作 + rule 条件</text><rect x=\"738\" y=\"302\" width=\"300\" height=\"50\" rx=\"5\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"888.0\" y=\"331.725\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"600\" >原查询 + NOT(条件)</text><text x=\"930\" y=\"358\" class=\"sv s\" text-anchor=\"end\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\" >2 条 · 原查询走剩余路径</text><rect x=\"40\" y=\"382\" width=\"1320\" height=\"42\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"58\" y=\"408.075\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.5\" fill=\"#BE653B\" font-weight=\"600\" >OLD / NEW</text><text x=\"346\" y=\"407.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >在规则动作树里是特殊 range table entry，改写时替换为表达式 —— 不是触发器里的行变量。</text></svg>","ctrl":null,"blabel":"承接 · NEXT"},{"eyebrow":"第八问 · 顺序的陷阱","title":"ALSO 与 INSTEAD：还有一个顺序陷阱","lede":"原始查询排在动作前还是后，不是由 SQL 表面语法决定，而是由 rewriter 生成的 Query list 决定。","caption":"","bridge":"这条差异能解释很多『日志里看不到新行』的诡异现象。","notes":"ALSO 是默认行为，意思是追加规则动作，原始查询也执行；INSTEAD 是用动作替代原始查询。真正容易被忽视的是顺序。对 INSERT，原始查询通常先执行，规则动作后执行，这样动作能看见刚插入的行；对 UPDATE 和 DELETE，规则动作通常先执行，原始查询后执行，避免目标行先被改掉或删掉之后，动作找不到它。你可以用下面的控件切换原命令和规则模式，单步看 Query list 是怎么排出来的。为什么我要花一页讲顺序？因为很多『明明写了规则却没记录到数据』的问题，根因就在这里：你按触发器心智模型以为动作在原行之后跑，实际 rewriter 把它放到了前面。官方文档也提醒，很多 INSERT/UPDATE/DELETE rule 能做的事更适合用触发器做，因为触发器语义更简单。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40\" y=\"18\" width=\"1320\" height=\"50\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1.0\" /><text x=\"58\" y=\"48.6\" class=\"sv s\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"600\" >Query list 的顺序</text><text x=\"346\" y=\"47.55\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >原始查询是否被抑制、排在动作前还是后，都写在改写后的列表里。</text><g id=\"dmCard0\" transform=\"translate(100,0)\" opacity=\"1\"><rect id=\"dmCard0R\" x=\"0\" y=\"96\" width=\"360\" height=\"152\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><rect x=\"0\" y=\"96\" width=\"360\" height=\"4\" rx=\"2\" fill=\"#7BA6AF\"/><text id=\"dmCard0T\" x=\"180\" y=\"140\" text-anchor=\"middle\" class=\"sv\" font-size=\"16\" font-weight=\"700\" fill=\"#245A6B\">等待播放</text><text id=\"dmCard0S\" x=\"180\" y=\"178\" text-anchor=\"middle\" class=\"sv\" font-size=\"13\" fill=\"#46585F\">—</text><line x1=\"24\" y1=\"196\" x2=\"336\" y2=\"196\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text id=\"dmCard0N\" x=\"180\" y=\"226\" text-anchor=\"middle\" class=\"sv\" font-size=\"12.5\" fill=\"#89938F\">—</text></g><g id=\"dmCard1\" transform=\"translate(520,0)\" opacity=\"1\"><rect id=\"dmCard1R\" x=\"0\" y=\"96\" width=\"360\" height=\"152\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><rect x=\"0\" y=\"96\" width=\"360\" height=\"4\" rx=\"2\" fill=\"#7BA6AF\"/><text id=\"dmCard1T\" x=\"180\" y=\"140\" text-anchor=\"middle\" class=\"sv\" font-size=\"16\" font-weight=\"700\" fill=\"#245A6B\">等待播放</text><text id=\"dmCard1S\" x=\"180\" y=\"178\" text-anchor=\"middle\" class=\"sv\" font-size=\"13\" fill=\"#46585F\">—</text><line x1=\"24\" y1=\"196\" x2=\"336\" y2=\"196\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text id=\"dmCard1N\" x=\"180\" y=\"226\" text-anchor=\"middle\" class=\"sv\" font-size=\"12.5\" fill=\"#89938F\">—</text></g><g id=\"dmCard2\" transform=\"translate(940,0)\" opacity=\"1\"><rect id=\"dmCard2R\" x=\"0\" y=\"96\" width=\"360\" height=\"152\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\"/><rect x=\"0\" y=\"96\" width=\"360\" height=\"4\" rx=\"2\" fill=\"#7BA6AF\"/><text id=\"dmCard2T\" x=\"180\" y=\"140\" text-anchor=\"middle\" class=\"sv\" font-size=\"16\" font-weight=\"700\" fill=\"#245A6B\">等待播放</text><text id=\"dmCard2S\" x=\"180\" y=\"178\" text-anchor=\"middle\" class=\"sv\" font-size=\"13\" fill=\"#46585F\">—</text><line x1=\"24\" y1=\"196\" x2=\"336\" y2=\"196\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text id=\"dmCard2N\" x=\"180\" y=\"226\" text-anchor=\"middle\" class=\"sv\" font-size=\"12.5\" fill=\"#89938F\">—</text></g><rect x=\"40\" y=\"286\" width=\"1320\" height=\"124\" rx=\"5\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"60\" y=\"314\" class=\"sv serif\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#245A6B\" font-weight=\"700\" >为什么是这个顺序</text><text id=\"dmOrder\" x=\"60\" y=\"354\" class=\"sv\" font-size=\"13.5\" fill=\"#46585F\">播放到「排列执行顺序」一步，查看顺序背后的原因。</text><text id=\"dmOut\" x=\"60\" y=\"388\" class=\"sv\" font-size=\"13\" fill=\"#BE653B\">待播放</text></svg>","ctrl":"<label>原命令</label><select id=\"dmCmd\"><option value=\"insert\">INSERT</option><option value=\"update\">UPDATE / DELETE</option></select><label>规则模式</label><select id=\"dmMode\"><option value=\"also\">无条件 ALSO</option><option value=\"instead\">无条件 INSTEAD</option><option value=\"condalso\">有条件 ALSO</option><option value=\"condinstead\">有条件 INSTEAD</option></select><button class=\"btn\" id=\"dmPlay\">播放</button><button class=\"btn\" id=\"dmTick\">单步</button><button class=\"btn\" id=\"dmReset\">重置</button><span class=\"out\" id=\"dmOut2\"></span>","blabel":"承接 · NEXT"},{"eyebrow":"第九问 · 会不会套娃","title":"当规则动作再次命中自己","lede":"rule 动作生成的 Query 会重新进入重写流程；一旦重复命中同一 relation 与事件，就报无限递归。","caption":"图 08　自引用规则形成闭环；源码用 rewrite_event 记录 relation 与 event，重复即报错。","bridge":"所以『复制一行这么简单』的想法，恰恰是最危险的起点。","notes":"rule 动作生成的查询还会再进重写流程，这就带来了递归的可能。看这条规则：往 t 插入一行时，DO ALSO 再往 t 插入 NEW.*。你以为只是复制一行，实际是规则动作又命中了同一条规则，一层一层套下去。源码的做法是用 rewrite_event 记录已经处理过的 relation 和 event，检测到重复就抛 infinite recursion detected。这个机制保护了你，但报警本身说明设计思路有问题：如果你真需要写回同一张表，通常应该用触发器，并且明确地把递归控制写进业务逻辑，而不是指望规则自己停住。到这里我们已经能解释很多诡异现象了：SQL 表面只写了一条，实际执行了好几条；日志里少了新行；改一张表却影响了另一张。接下来我们把规则不能做的事列清楚，因为这些边界不是 bug，而是这套改寫语义的必然结果。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40\" y=\"40\" width=\"300\" height=\"70\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"190.0\" y=\"69.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#1B2B33\" font-weight=\"600\" >INSERT INTO t ...</text><text x=\"190.0\" y=\"90.6\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >原始查询</text><line x1=\"344\" y1=\"75\" x2=\"459.6\" y2=\"75\" stroke=\"#245A6B\" stroke-width=\"2\"/><polygon points=\"466,75 458,70.6 458,79.4\" fill=\"#245A6B\"/><rect x=\"470\" y=\"40\" width=\"340\" height=\"70\" rx=\"5\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.1\" /><text x=\"640.0\" y=\"69.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16.0\" fill=\"#BE653B\" font-weight=\"600\" >rule r: ON INSERT TO t</text><text x=\"640.0\" y=\"90.6\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >DO ALSO</text><line x1=\"814\" y1=\"75\" x2=\"929.6\" y2=\"75\" stroke=\"#BE653B\" stroke-width=\"2\"/><polygon points=\"936,75 928,70.6 928,79.4\" fill=\"#BE653B\"/><rect x=\"940\" y=\"40\" width=\"420\" height=\"70\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"1150.0\" y=\"69.0\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#1B2B33\" font-weight=\"600\" >INSERT INTO t VALUES (NEW.*)</text><text x=\"1150.0\" y=\"90.6\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\" >规则动作</text><polyline points=\"1150,110 1150,300 640,300\" fill=\"none\" stroke=\"#BE653B\" stroke-width=\"2\"/><line x1=\"640\" y1=\"300\" x2=\"640\" y2=\"120.4\" stroke=\"#BE653B\" stroke-width=\"2.2\"/><polygon points=\"640,114 635.6,122 644.4,122\" fill=\"#BE653B\"/><text x=\"900\" y=\"288\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#BE653B\" font-weight=\"600\" >动作生成的 Query 再次进入重写流程</text><rect x=\"430\" y=\"330\" width=\"540\" height=\"46\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><text x=\"700\" y=\"359\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"600\" >rewrite_event 检测到重复 → infinite recursion detected</text><text x=\"40\" y=\"412\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#2F7A66\" font-weight=\"600\" >要写同表，优先考虑触发器，并明确递归控制。</text></svg>","ctrl":null,"blabel":"承接 · NEXT"},{"eyebrow":"第十问 · 哪些事做不到","title":"边界不是细节，是使用前提","lede":"RETURNING、ON CONFLICT、MERGE、复制角色、volatile——每一条限制都来自重写语义本身。","caption":"图 09　六类硬边界：多数不是实现偷懒，而是『一条语句拆成多条查询』的必然后果。","bridge":"知道边界，比记住语法更能避免线上事故。","notes":"这一页我们收一收边界。RETURNING 在非 SELECT rule 里只允许在受限场景，条件规则、不带 INSTEAD 的规则、多个 action 里多个 RETURNING 都会被 DefineQueryRewrite() 拒绝。带 ON CONFLICT 的 INSERT 不能用在有 INSERT 或 UPDATE rule 的普通表上，自动可更新视图是例外。目标表上有非 SELECT rule 时不支持 MERGE。非 SELECT rule 还会受 ENABLE / DISABLE / REPLICA / ALWAYS 和 session_replication_role 的影响，但 ON SELECT rule 为了保证视图总能应用，不吃这套禁用语义。再加上 volatile 函数因为查询树复制导致执行次数非直觉，以及调试时必须去看目录和改写日志。你会发现这些边界不是孤立的条款，它们有一个共同根源：一次语句会变成多条查询。理解了这一点，很多限制自己就能推出来。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40\" y=\"24\" width=\"420\" height=\"156\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"40\" y=\"24\" width=\"4\" height=\"156\" rx=\"2\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"58\" y=\"52\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#BE653B\" font-weight=\"700\" >RETURNING 受限</text><text x=\"58\" y=\"78\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >条件 rule、不带 INSTEAD 的 rule、</text><text x=\"58\" y=\"99\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >多 action 中多个 RETURNING 都会被拒。</text><text x=\"58\" y=\"164\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#2F7A66\" font-weight=\"400\" >仅无条件 INSTEAD 等场景可用</text><rect x=\"480\" y=\"24\" width=\"420\" height=\"156\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"480\" y=\"24\" width=\"4\" height=\"156\" rx=\"2\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"498\" y=\"52\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#BE653B\" font-weight=\"700\" >ON CONFLICT 冲突</text><text x=\"498\" y=\"78\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >带 ON CONFLICT 的 INSERT 不能用于</text><text x=\"498\" y=\"99\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >有 INSERT/UPDATE rule 的普通表。</text><text x=\"498\" y=\"164\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#2F7A66\" font-weight=\"400\" >自动可更新视图是例外</text><rect x=\"920\" y=\"24\" width=\"420\" height=\"156\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"920\" y=\"24\" width=\"4\" height=\"156\" rx=\"2\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"938\" y=\"52\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#BE653B\" font-weight=\"700\" >MERGE 不支持</text><text x=\"938\" y=\"78\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >目标 relation 上存在非 SELECT rule 时，</text><text x=\"938\" y=\"99\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >当前不支持 MERGE。</text><text x=\"938\" y=\"164\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#2F7A66\" font-weight=\"400\" >先把规则清理干净再评估</text><rect x=\"40\" y=\"194\" width=\"420\" height=\"156\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"40\" y=\"194\" width=\"4\" height=\"156\" rx=\"2\" fill=\"#AE8A3E\" stroke=\"#AE8A3E\" stroke-width=\"1\" /><text x=\"58\" y=\"222\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#AE8A3E\" font-weight=\"700\" >复制角色影响</text><text x=\"58\" y=\"248\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >非 SELECT rule 可被 ENABLE / DISABLE /</text><text x=\"58\" y=\"269\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >REPLICA / ALWAYS 控制。</text><text x=\"58\" y=\"334\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#2F7A66\" font-weight=\"400\" >ON SELECT rule 不受禁用语义影响</text><rect x=\"480\" y=\"194\" width=\"420\" height=\"156\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"480\" y=\"194\" width=\"4\" height=\"156\" rx=\"2\" fill=\"#AE8A3E\" stroke=\"#AE8A3E\" stroke-width=\"1\" /><text x=\"498\" y=\"222\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#AE8A3E\" font-weight=\"700\" >WITH / volatile</text><text x=\"498\" y=\"248\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >查询树复制会让 volatile 函数</text><text x=\"498\" y=\"269\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >执行次数超出直觉。</text><text x=\"498\" y=\"334\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#2F7A66\" font-weight=\"400\" >多重赋值等场景也有限制</text><rect x=\"920\" y=\"194\" width=\"420\" height=\"156\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"920\" y=\"194\" width=\"4\" height=\"156\" rx=\"2\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"938\" y=\"222\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"700\" >调试成本</text><text x=\"938\" y=\"248\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >需看 pg_rules、pg_rewrite、</text><text x=\"938\" y=\"269\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >debug_print_rewritten 或源码行为。</text><text x=\"938\" y=\"334\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#2F7A66\" font-weight=\"400\" >线上不要随手打开调试日志</text><rect x=\"40\" y=\"374\" width=\"1320\" height=\"48\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"58\" y=\"403.25\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"600\" >共同根源</text><text x=\"346\" y=\"402.55\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >一次语句 → 多条查询：事务、锁、权限、命令标签都得按改写后的 Query list 理解。</text></svg>","ctrl":null,"blabel":"承接 · NEXT"},{"eyebrow":"第十一问 · 该选哪一个工具","title":"五个工具，站在不同的位置","lede":"rule 的强项是改写后继续全局优化；trigger 的强项是执行期语义清楚。","caption":"图 10　按『发生阶段 × 粒度』给五种机制定位；行级处理几乎不该想到 rule。","bridge":"选择的标准不是哪个更底层，而是哪个语义更清楚。","notes":"把 rule、trigger 和普通视图摆在一起看，分工其实很清楚。rule 发生在 parser 之后、planner 之前，粒度是语句级的查询树；普通视图依赖 _RETURN 展开，粒度是查询引用级；自动可更新视图在 rewriter 里尝试把简单视图 DML 映射到底表；trigger 发生在执行期，可以是行级也可以是语句级；INSTEAD OF trigger 专门处理视图上的行级 DML。优势这边，rule 独一无二的点是：改写之后 planner 仍能看到完整查询，继续做全局优化。trigger 的优势是语义直观，能校验、能抛错、能逐行处理。所以不要因为 rule 更底层就默认它更适合业务开发——业务里更需要的是语义清楚，而不是更靠近内核。下面这张决策图把这层选择变成一条可以照着走的路。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40\" y=\"24\" width=\"860\" height=\"336\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><line x1=\"470\" y1=\"40\" x2=\"470\" y2=\"344\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><line x1=\"56\" y1=\"184\" x2=\"884\" y2=\"184\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"60\" y=\"48\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >语句 / 引用级</text><text x=\"490\" y=\"48\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >执行期 · 回调</text><text x=\"60\" y=\"334\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" >执行前 · Query tree 改写</text><text x=\"500\" y=\"334\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" >行级</text><rect x=\"70\" y=\"76\" width=\"180\" height=\"42\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"160.0\" y=\"101.725\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"600\" >rule</text><rect x=\"270\" y=\"76\" width=\"180\" height=\"42\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"360.0\" y=\"101.725\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"600\" >普通视图</text><rect x=\"70\" y=\"128\" width=\"180\" height=\"42\" rx=\"5\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"160.0\" y=\"153.725\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"600\" >自动可更新视图</text><rect x=\"500\" y=\"76\" width=\"180\" height=\"42\" rx=\"5\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.1\" /><text x=\"590.0\" y=\"101.725\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#AE8A3E\" font-weight=\"600\" >语句级 trigger</text><rect x=\"500\" y=\"224\" width=\"180\" height=\"42\" rx=\"5\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"590.0\" y=\"249.725\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#2F7A66\" font-weight=\"600\" >行级 trigger</text><rect x=\"690\" y=\"224\" width=\"190\" height=\"42\" rx=\"5\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"785.0\" y=\"249.725\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#2F7A66\" font-weight=\"600\" >INSTEAD OF trigger</text><text x=\"70\" y=\"252\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >这里几乎没有 rule 的位置：</text><text x=\"70\" y=\"278\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\" >行级处理请交给触发器。</text><rect x=\"940\" y=\"24\" width=\"420\" height=\"160\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"940\" y=\"24\" width=\"4\" height=\"160\" rx=\"2\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"958\" y=\"52\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"700\" >rule 的强项</text><text x=\"958\" y=\"78\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >改写后让 planner 继续全局优化。</text><text x=\"958\" y=\"99\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >视图展开是最典型、最成功的用法。</text><text x=\"958\" y=\"168\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#2F7A66\" font-weight=\"400\" >用户 DML rule 要慎用</text><rect x=\"940\" y=\"200\" width=\"420\" height=\"160\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"940\" y=\"200\" width=\"4\" height=\"160\" rx=\"2\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"958\" y=\"228\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#2F7A66\" font-weight=\"700\" >trigger 的强项</text><text x=\"958\" y=\"254\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >执行期语义清楚，可校验、可抛错。</text><text x=\"958\" y=\"275\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >逐行处理、审计、复杂更新更直观。</text><text x=\"958\" y=\"344\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#2F7A66\" font-weight=\"400\" >业务逻辑更常用</text><text x=\"40\" y=\"396\" class=\"sv serif\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"600\" >不要因为 rule 更底层，就默认它更适合业务开发。</text></svg>","ctrl":null,"blabel":"承接 · NEXT"},{"eyebrow":"第十二问 · 落到行动","title":"我到底该用哪一个？","lede":"先问你要的是封装、缓存、校验，还是改写——工具选择自然就出来了。","caption":"图 11　决策路径：普通视图、物化视图、约束/触发器、可更新视图，最后才轮到 DML rule。","bridge":"把 rule 放在最后，不是因为它弱，而是因为它的语义最难解释。","notes":"给一个可以直接照着用的决策路径。第一，要封装复杂查询，用普通视图，放心让 planner 继续优化。第二，要缓存结果，用物化视图或手工汇总表，别指望普通视图缓存——它不存数据。第三，要数据校验、审计、抛错、行级处理，用约束或触发器，语义清楚得多。第四，要让复杂视图可写，优先顺序是自动可更新视图，不满足再考虑 INSTEAD OF trigger，最后才是用户自定义 DML rule。你注意这个顺序：rule 被放在最后，不是因为它弱，而是因为它的语义最难解释、边界最多。如果确实必须用 DML rule，请把 SQL 限制在非常小、可解释、可测试的范围内，并且给出 EXPLAIN 和回归测试。这不是保守，是工程上的理性。接下来讲怎么验证它真的按你想的方式改写了。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"520\" y=\"18\" width=\"360\" height=\"48\" rx=\"5\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1.1\" /><text x=\"700.0\" y=\"48.3\" class=\"sv s\" text-anchor=\"middle\" font-size=\"18.0\" fill=\"#FFFFFF\" font-weight=\"700\" >你要做什么？</text><line x1=\"700\" y1=\"66\" x2=\"700\" y2=\"92\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><line x1=\"170\" y1=\"92\" x2=\"1250\" y2=\"92\" stroke=\"#245A6B\" stroke-width=\"1.8\"/><line x1=\"170\" y1=\"92\" x2=\"170\" y2=\"119.6\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><polygon points=\"170,126 165.6,118 174.4,118\" fill=\"#245A6B\"/><rect x=\"30\" y=\"130\" width=\"280\" height=\"54\" rx=\
