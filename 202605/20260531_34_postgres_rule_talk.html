\"890,214 885.6,206 894.4,206\" fill=\"#245A6B\"/><rect x=\"750\" y=\"218\" width=\"280\" height=\"62\" rx=\"5\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1.1\" /><text x=\"890.0\" y=\"254.25\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#AE8A3E\" font-weight=\"700\" >约束 / trigger</text><line x1=\"1250\" y1=\"92\" x2=\"1250\" y2=\"119.6\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><polygon points=\"1250,126 1245.6,118 1254.4,118\" fill=\"#245A6B\"/><rect x=\"1110\" y=\"130\" width=\"280\" height=\"54\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"1250.0\" y=\"162.075\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14.5\" fill=\"#1B2B33\" font-weight=\"600\" >让复杂视图可写</text><line x1=\"1250\" y1=\"184\" x2=\"1250\" y2=\"207.6\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><polygon points=\"1250,214 1245.6,206 1254.4,206\" fill=\"#245A6B\"/><rect x=\"1110\" y=\"218\" width=\"280\" height=\"62\" rx=\"5\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.1\" /><text x=\"1250.0\" y=\"254.25\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"700\" >自动可更新视图</text><line x1=\"1250\" y1=\"280\" x2=\"1250\" y2=\"297.6\" stroke=\"#BE653B\" stroke-width=\"1.6\"/><polygon points=\"1250,304 1245.6,296 1254.4,296\" fill=\"#BE653B\"/><rect x=\"1110\" y=\"308\" width=\"280\" height=\"60\" rx=\"5\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.1\" /><text x=\"1250.0\" y=\"332.25\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.0\" fill=\"#BE653B\" font-weight=\"600\" >不满足 → INSTEAD OF trigger</text><text x=\"1250.0\" y=\"352.95\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >最后才是 DML rule</text><rect x=\"40\" y=\"384\" width=\"1320\" height=\"40\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"58\" y=\"408.9\" class=\"sv s\" text-anchor=\"start\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"600\" >使用 DML rule 的前提</text><text x=\"346\" y=\"408.375\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >限制在小、可解释、可测试的范围内，并配 EXPLAIN 与回归测试。</text></svg>","ctrl":null,"blabel":"承接 · NEXT"},{"eyebrow":"第十三问 · 怎么验证","title":"看不见改写，就查不出改写","lede":"pg_rules、pg_rewrite、debug_print_rewritten 是三个观测点；最后一个不要在线上随手打开。","caption":"图 12　三个观测层次：看定义、看目录字段、看改写后的查询树日志。","bridge":"验证比相信更重要——尤其是当你准备在生产环境用 DML rule 的时候。","notes":"rule 最大的麻烦是：SQL 表面看不出实际执行了什么。所以观测手段必须提前准备好。第一层 pg_rules，看规则名和简化定义，适合快速确认『视图背后是不是有 rule』。第二层 pg_rewrite，看 ev_type、ev_qual、ev_action，能确认事件类型、条件和动作查询树，读懂它需要一点源码背景。第三层 debug_print_rewritten，把改写后的查询树打到日志里，最适合在开发实验环境验证 rewrite 的真实行为。重点是最后一句提醒：线上不要轻易打开。它输出的是内部树结构，日志量很大，也可能带敏感信息。DBA 排查『SQL 明明没写这个表，却改了这个表』时，先查前两层，通常就够定位。只有需要确认改写顺序、剩余路径这类细节时，才在可控环境打开第三层。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40\" y=\"24\" width=\"420\" height=\"254\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"40\" y=\"24\" width=\"420\" height=\"44\" rx=\"4\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"58\" y=\"52\" class=\"sv mono\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#FFFFFF\" font-weight=\"700\" >pg_rules</text><text x=\"58\" y=\"96\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >看什么：规则名与定义 SQL</text><line x1=\"58\" y1=\"112\" x2=\"442\" y2=\"112\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"58\" y=\"154\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >何时用：怀疑视图背后有 rule</text><line x1=\"58\" y1=\"170\" x2=\"442\" y2=\"170\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"58\" y=\"212\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >注意：只是简化视图</text><rect x=\"480\" y=\"24\" width=\"420\" height=\"254\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"480\" y=\"24\" width=\"420\" height=\"44\" rx=\"4\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"498\" y=\"52\" class=\"sv mono\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#FFFFFF\" font-weight=\"700\" >pg_rewrite</text><text x=\"498\" y=\"96\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >看什么：ev_type / ev_qual / ev_action</text><line x1=\"498\" y1=\"112\" x2=\"882\" y2=\"112\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"498\" y=\"154\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >何时用：检查规则条件与动作</text><line x1=\"498\" y1=\"170\" x2=\"882\" y2=\"170\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"498\" y=\"212\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >注意：内部节点树，需读源码</text><rect x=\"920\" y=\"24\" width=\"420\" height=\"254\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"920\" y=\"24\" width=\"420\" height=\"44\" rx=\"4\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"938\" y=\"52\" class=\"sv mono\" text-anchor=\"start\" font-size=\"16.0\" fill=\"#FFFFFF\" font-weight=\"700\" >debug_print_rewritten</text><text x=\"938\" y=\"96\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >看什么：改写后的查询树日志</text><line x1=\"938\" y1=\"112\" x2=\"1322\" y2=\"112\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"938\" y=\"154\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >何时用：开发环境验证改写</text><line x1=\"938\" y1=\"170\" x2=\"1322\" y2=\"170\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"938\" y=\"212\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >注意：线上不要随手打开</text><rect x=\"40\" y=\"306\" width=\"1320\" height=\"104\" rx=\"5\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"60\" y=\"336\" class=\"sv mono\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"400\" >SET client_min_messages = log;  SET debug_print_rewritten = on;</text><text x=\"60\" y=\"372\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#46585F\" font-weight=\"400\" >排查『SQL 明明没写这个表，却改了这个表』：先查 pg_rules 与 pg_rewrite。</text><text x=\"60\" y=\"398\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#BE653B\" font-weight=\"400\" >debug_print_rewritten 输出内部树结构，日志量与敏感信息风险都要评估；线上勿随意开启。</text></svg>","ctrl":null,"blabel":"承接 · NEXT"},{"eyebrow":"第十四问 · 最容易踩的坑","title":"七颗地雷，都埋在重写语义里","lede":"规则名会影响顺序，条件 INSTEAD 不是 if-else，列类型依赖还会挡住 ALTER TABLE。","caption":"图 13　七个高频误区，按『误解机制—误判顺序—忽略边界』三类分布。","bridge":"这些坑不是记不住就好，关键是知道它们为什么会发生。","notes":"把前面所有机制收拢，常见坑就很好归类。第一类是误解机制：把 rule 当 trigger 用，忘了它改的是查询树不是行；以及依赖 volatile 函数，却没意识到查询树复制会让函数执行次数超出直觉。第二类是误判顺序：同一张表同一事件的多条规则按名称顺序应用，规则名不是纯注释；条件 INSTEAD 会给原查询追加取反的剩余路径，多个条件叠加后理解成本急剧上升；视图作为 DML 目标时，优先级是用户 rule、INSTEAD OF trigger、最后才尝试自动可更新，已有规则会覆盖默认行为。第三类是忽略边界：RETURNING 不是随便可用，ON CONFLICT 和有 rule 的普通表冲突，视图与 rule 嵌入了列类型和列号，会阻止某些 ALTER TABLE。你会发现这七条有个共同源头：你看到的是 SQL，执行的却是 Query list。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40\" y=\"22\" width=\"315\" height=\"158\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"40\" y=\"22\" width=\"4\" height=\"158\" rx=\"2\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"58\" y=\"50\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#BE653B\" font-weight=\"700\" >1 把 rule 当成 trigger</text><text x=\"58\" y=\"76\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >先问自己：要改语句，还是要处理每一行？</text><text x=\"58\" y=\"164\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#2F7A66\" font-weight=\"400\" >大多数业务场景是后者</text><rect x=\"375\" y=\"22\" width=\"315\" height=\"158\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"375\" y=\"22\" width=\"4\" height=\"158\" rx=\"2\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"393\" y=\"50\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#BE653B\" font-weight=\"700\" >2 规则名影响顺序</text><text x=\"393\" y=\"76\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >同表同事件多规则按名称顺序应用。</text><text x=\"393\" y=\"164\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#2F7A66\" font-weight=\"400\" >规则名不是纯注释</text><rect x=\"710\" y=\"22\" width=\"315\" height=\"158\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"710\" y=\"22\" width=\"4\" height=\"158\" rx=\"2\" fill=\"#AE8A3E\" stroke=\"#AE8A3E\" stroke-width=\"1\" /><text x=\"728\" y=\"50\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#AE8A3E\" font-weight=\"700\" >3 条件 INSTEAD</text><text x=\"728\" y=\"76\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >原查询会追加 NOT(条件) 的剩余路径。</text><text x=\"728\" y=\"164\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#2F7A66\" font-weight=\"400\" >不是简单 if-else</text><rect x=\"1045\" y=\"22\" width=\"315\" height=\"158\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"1045\" y=\"22\" width=\"4\" height=\"158\" rx=\"2\" fill=\"#AE8A3E\" stroke=\"#AE8A3E\" stroke-width=\"1\" /><text x=\"1063\" y=\"50\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#AE8A3E\" font-weight=\"700\" >4 RETURNING 受限</text><text x=\"1063\" y=\"76\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >条件、非 INSTEAD、多 action 都可能被拒。</text><text x=\"1063\" y=\"164\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#2F7A66\" font-weight=\"400\" >需按改写后树理解</text><rect x=\"207\" y=\"192\" width=\"315\" height=\"158\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"207\" y=\"192\" width=\"4\" height=\"158\" rx=\"2\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"225\" y=\"220\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"700\" >5 ON CONFLICT 冲突</text><text x=\"225\" y=\"246\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.8\" fill=\"#46585F\" font-weight=\"400\" >有 INSERT/UPDATE rule 的普通表不支持。</text><text x=\"225\" y=\"334\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#2F7A66\" font-weight=\"400\" >自动可更新视图例外</text><rect x=\"542\" y=\"192\" width=\"315\" height=\"158\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"542\" y=\"192\" width=\"4\" height=\"158\" rx=\"2\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"560\" y=\"220\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"700\" >6 视图更新优先级</text><text x=\"560\" y=\"246\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.2\" fill=\"#46585F\" font-weight=\"400\" >用户 rule → INSTEAD OF trigger → 自动可更新。</text><text x=\"560\" y=\"334\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#2F7A66\" font-weight=\"400\" >已有规则会覆盖默认路径</text><rect x=\"877\" y=\"192\" width=\"315\" height=\"158\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"877\" y=\"192\" width=\"4\" height=\"158\" rx=\"2\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"895\" y=\"220\" class=\"sv serif\" text-anchor=\"start\" font-size=\"17.0\" fill=\"#2F7A66\" font-weight=\"700\" >7 列类型依赖</text><text x=\"895\" y=\"246\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.7\" fill=\"#46585F\" font-weight=\"400\" >视图与 rule 嵌入列类型，可能挡住 ALTER TABLE。</text><text x=\"895\" y=\"334\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.0\" fill=\"#2F7A66\" font-weight=\"400\" >schema 演进需注意</text><rect x=\"40\" y=\"374\" width=\"1320\" height=\"48\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1.0\" /><text x=\"58\" y=\"403.25\" class=\"sv s\" text-anchor=\"start\" font-size=\"15.0\" fill=\"#BE653B\" font-weight=\"600\" >共同源头</text><text x=\"346\" y=\"402.55\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" >你看到的是 SQL，执行的是 Query list —— 七颗地雷都埋在这条缝里。</text></svg>","ctrl":null,"blabel":"承接 · NEXT"},{"eyebrow":"第十五问 · 落到规范","title":"三种角色，三张清单","lede":"架构师看基础设施，DBA 看可观测与复制，业务开发者看替代方案。","caption":"图 14　同一套 rule 机制，三种角色各自该做的事。","bridge":"最后把它收成一句可以带走的话。","notes":"落地的时候，不同角色关心的事情不一样，但结论是一致的。架构师要把 rule 主要看成视图和物化视图背后的基础设施，而不是业务逻辑扩展框架；设计视图时可以放心利用它的可优化性，但复杂嵌套仍要用 EXPLAIN 验证；需要可写视图时按自动更新、INSTEAD OF trigger、用户 DML rule 的顺序选；批量级联不要只凭『语句级所以更快』下结论。DBA 的重点是可观测性和复制环境：排查异常改表先查目录，关注 _RETURN 与列定义，核对 ENABLE / DISABLE RULE 和 session_replication_role 的组合，线上不随手开调试日志。业务开发者的重点是替代方案：封装用视图，缓存用物化视图，校验审计用约束或触发器。如果必须用 DML rule，就把它关进一个小、可解释、可测试的笼子里。","svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40\" y=\"24\" width=\"420\" height=\"344\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"40\" y=\"24\" width=\"420\" height=\"48\" rx=\"4\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"58\" y=\"55\" class=\"sv serif\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#FFFFFF\" font-weight=\"700\" >面向架构师</text><rect x=\"56\" y=\"92\" width=\"388\" height=\"54\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><circle cx=\"82\" cy=\"119\" r=\"12\" fill=\"#245A6B\"/><text x=\"82\" y=\"124\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#FFFFFF\" font-weight=\"700\" >1</text><text x=\"104\" y=\"125\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >把 rule 视为视图与物化视图的基础设施</text><rect x=\"56\" y=\"158\" width=\"388\" height=\"54\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><circle cx=\"82\" cy=\"185\" r=\"12\" fill=\"#245A6B\"/><text x=\"82\" y=\"190\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#FFFFFF\" font-weight=\"700\" >2</text><text x=\"104\" y=\"191\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >复杂嵌套视图用 EXPLAIN 验拉平与下推</text><rect x=\"56\" y=\"224\" width=\"388\" height=\"54\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><circle cx=\"82\" cy=\"251\" r=\"12\" fill=\"#245A6B\"/><text x=\"82\" y=\"256\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#FFFFFF\" font-weight=\"700\" >3</text><text x=\"104\" y=\"257\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >可写视图：自动更新 → INSTEAD OF → rule</text><rect x=\"56\" y=\"290\" width=\"388\" height=\"54\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#E5EFF0\" stroke-width=\"1\" /><circle cx=\"82\" cy=\"317\" r=\"12\" fill=\"#245A6B\"/><text x=\"82\" y=\"322\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#FFFFFF\" font-weight=\"700\" >4</text><text x=\"104\" y=\"323\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >批量级联看实际计划，不凭语句级直觉</text><rect x=\"480\" y=\"24\" width=\"420\" height=\"344\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><rect x=\"480\" y=\"24\" width=\"420\" height=\"48\" rx=\"4\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"498\" y=\"55\" class=\"sv serif\" text-anchor=\"start\" font-size=\"18.0\" fill=\"#FFFFFF\" font-weight=\"700\" >面向 DBA</text><rect x=\"496\" y=\"92\" width=\"388\" height=\"54\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1\" /><circle cx=\"522\" cy=\"119\" r=\"12\" fill=\"#BE653B\"/><text x=\"522\" y=\"124\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"12.0\" fill=\"#FFFFFF\" font-weight=\"700\ const N = D.length;
let cur = 0, autoOn = false, autoTimer = null;
let paneOn = false, paneMode = 'note';
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

function fit(){
  const vp = $('#viewport');
  const W = vp.clientWidth, H = vp.clientHeight;
  const s = Math.min(W/1600, H/900);
  const st = $('#stage');
  st.style.transform = 'scale(' + s + ')';
  st.style.left = ((W - 1600*s)/2) + 'px';
  st.style.top  = ((H -  900*s)/2) + 'px';
}
window.addEventListener('resize', fit);

function render(){
  $('#slides').innerHTML = D.map((d,i) =>
    '<section class="slide" id="s'+i+'">'
    + '<div class="eyebrow"><span class="num">'+String(i+1).padStart(2,'0')+' / '+String(N).padStart(2,'0')+'</span>'+d.eyebrow+'</div>'
    + '<h1 class="title">'+d.title+'</h1>'
    + '<div class="lede">'+d.lede+'</div>'
    + '<div class="rule"></div>'
    + '<div class="figwrap">'+d.svg+'</div>'
    + (d.ctrl ? '<div class="ctrls">'+d.ctrl+'</div>' : '<div class="caption">'+d.caption+'</div>')
    + '<div class="bridge"><span class="bk">'+d.blabel+'</span>'+d.bridge+'</div>'
    + '<div class="footer"><div class="fbar"><i id="fbar'+i+'"></i></div>'
    + '<span class="fl">数据库筑基课 · 计算前置之 rule</span>'
    + '<span class="fr">'+String(i+1).padStart(2,'0')+' / '+String(N).padStart(2,'0')+'</span></div>'
    + '</section>').join('');
}

function go(i, silent){
  i = Math.max(0, Math.min(N-1, i));
  $$('.slide').forEach((el,k)=>el.classList.toggle('on', k===i));
  cur = i;
  try{ localStorage.setItem('rule-talk-slide', String(i)); }catch(e){}
  $('.pg').textContent = String(i+1).padStart(2,'0') + ' / ' + String(N).padStart(2,'0');
  $('#track i').style.width = ((i+1)/N*100)+'%';
  for(let k=0;k<N;k++){ const b=$('#fbar'+k); if(b) b.style.width = (k<=i?100:0)+'%'; }
  syncPane();
  if(!silent) toast(D[i].eyebrow + ' · ' + D[i].title);
}
function next(){ if(cur<N-1) go(cur+1); else stopAuto(); }
function prev(){ if(cur>0) go(cur-1); }

function toast(s){
  const t=$('#toast'); t.textContent=s; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1600);
}
function stopAuto(){
  autoOn=false; clearInterval(autoTimer); autoTimer=null;
  const b=$('#btnAuto'); if(b){ b.textContent='自动播放 P'; b.classList.remove('act'); }
}
function toggleAuto(){
  if(autoOn){ stopAuto(); toast('已暂停自动播放'); return; }
  autoOn=true; const b=$('#btnAuto'); b.textContent='暂停 P'; b.classList.add('act');
  autoTimer=setInterval(()=>{ if(cur<N-1) go(cur+1,true); else stopAuto(); }, 13000);
  toast('自动播放：每 13 秒一页');
}

/* ---------- 页内开窗：讲稿 / 目录 / 帮助 ---------- */
function paneHead(){
  const tabs = [['note','本页讲稿 N'],['all','全文讲稿 T'],['toc','目录 G'],['help','快捷键 ?']];
  return '<div class="phead"><div class="ptitle">讲稿 · 页内开窗</div><div class="ptabs">'
    + tabs.map(t=>'<button data-mode="'+t[0]+'" class="'+(paneMode===t[0]?'on':'')+'" '
      + 'onclick="setPane(\''+t[0]+'\')">'+t[1]+'</button>').join('')
    + '</div><button onclick="closePane()">关闭</button></div>';
}
function noteSec(i, full){
  const d=D[i];
  return '<div class="nsec'+(i===cur?' cur':'')+'" data-note="'+i+'">'
    + '<span class="sn">'+String(i+1).padStart(2,'0')+' · '+d.eyebrow+'</span>'
    + '<h3>'+d.title+'</h3><p>'+d.notes+'</p>'
    + (full ? '<p class="nb">「'+d.bridge+'」</p>' : '') + '</div>';
}
function paneContent(){
  const p=$('#notesPane');
  if(paneMode==='note'){
    p.innerHTML = paneHead()
      + '<div class="plead">按一下显示，再按一下关闭。翻页时本窗自动跟随当前页；讲稿不遮挡画面，原页面矢量缩放到左侧。</div>'
      + noteSec(cur,false);
  }else if(paneMode==='all'){
    p.innerHTML = paneHead()
      + '<div class="plead">全文讲稿按顺序连成一条因果链，已自动定位到当前第 '+(cur+1)+' 页；翻页时本窗自动滚动跟随。</div>'
      + D.map((d,i)=>noteSec(i,true)).join('');
    requestAnimationFrame(()=>scrollPaneToCur(false));
  }else if(paneMode==='toc'){
    p.innerHTML = paneHead()
      + '<div class="plead">点击任意条目跳转。全屏时底部按键条仍会显示。</div>'
      + '<div class="toclist">'+D.map((d,i)=>'<a data-toc="'+i+'" class="'+(i===cur?'cur':'')
        + '" onclick="jump('+i+')"><span class="gn">'+String(i+1).padStart(2,'0')+'</span>'
        + d.title+'</a>').join('')+'</div>';
    requestAnimationFrame(()=>scrollPaneToCur(false));
  }else{
    p.innerHTML = paneHead()
      + '<div class="plead">全屏后，这一排按键仍固定在页面底部。</div>'
      + '<div class="keylines">'
      + '<div><kbd>← / → / 空格</kbd>上一页 / 下一页</div>'
      + '<div><kbd>G</kbd>目录（页内开窗）</div>'
      + '<div><kbd>N</kbd>本页讲稿，再按关闭</div>'
      + '<div><kbd>T</kbd>全文讲稿，自动定位当前页</div>'
      + '<div><kbd>P</kbd>自动播放 / 暂停</div>'
      + '<div><kbd>F</kbd>全屏 / 退出，底部按键常驻</div>'
      + '<div><kbd>1–9</kbd>直接跳到第 1–9 页</div>'
      + '<div><kbd>Home / End</kbd>首页 / 末页</div>'
      + '<div><kbd>Esc</kbd>关闭开窗；再按退出全屏</div>'
      + '</div>';
  }
}
function scrollPaneToCur(smooth){
  const p=$('#notesPane');
  const el=p.querySelector('[data-note="'+cur+'"], [data-toc="'+cur+'"]');
  if(!el) return;
  const top = el.getBoundingClientRect().top - p.getBoundingClientRect().top + p.scrollTop - 16;
  p.scrollTo({top:top, behavior:smooth?'smooth':'auto'});
}
function syncPane(){
  if(!paneOn) return;
  if(paneMode==='note') paneContent();
  else if(paneMode==='all') scrollPaneToCur(true);
  else if(paneMode==='toc'){
    $$('#notesPane [data-toc]').forEach(a=>a.classList.toggle('cur', +a.getAttribute('data-toc')===cur));
    scrollPaneToCur(true);
  }
}
function closePane(){
  paneOn=false; document.body.classList.remove('pane-on');
  $('#btnNotes').classList.remove('act'); $('#btnAll').classList.remove('act');
  fit();
}
function setPane(mode){
  if(paneOn && paneMode===mode){ closePane(); return; }
  paneOn=true; paneMode=mode; document.body.classList.add('pane-on');
  $('#btnNotes').classList.toggle('act', mode==='note');
  $('#btnAll').classList.toggle('act', mode==='all');
  paneContent(); fit();
}
function jump(i){ go(i); }

/* ---------- 全屏：底部按键条保留 ---------- */
function fs(){
  const el=document.documentElement;
  const entering=!document.body.classList.contains('immersive');
  if(entering){
    document.body.classList.add('immersive');
    $('#btnFs').textContent='退出全屏 F'; $('#btnFs').classList.add('act');
    fit(); toast('全屏：底部按键条仍然可见（F 退出）');
    try{ const pr = el.requestFullscreen ? el.requestFullscreen() : null;
         if(pr && pr.catch) pr.catch(()=>{}); }catch(e){}
  }else{
    document.body.classList.remove('immersive');
    $('#btnFs').textContent='全屏 F'; $('#btnFs').classList.remove('act');
    fit(); toast('已退出全屏');
    try{ if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen(); }catch(e){}
  }
}
document.addEventListener('fullscreenchange', ()=>{
  if(!document.fullscreenElement && document.body.classList.contains('immersive')){
    document.body.classList.remove('immersive');
    const b=$('#btnFs'); if(b){ b.textContent='全屏 F'; b.classList.remove('act'); }
  }
  fit();
});
document.addEventListener('keydown', e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  const k=e.key;
  const typing=(tag==='input'||tag==='select'||tag==='textarea');
  const navKey=(k.indexOf('Arrow')===0||k===' '||k==='Home'||k==='End'||k==='PageUp'||k==='PageDown');
  if(k==='Escape'){
    if(paneOn){ closePane(); return; }
    if(document.body.classList.contains('immersive')) fs();
    return;
  }
  if(typing && navKey) return;
  if(k==='ArrowRight'||k===' '||k==='PageDown'){ e.preventDefault(); next(); }
  else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); prev(); }
  else if(k==='f'||k==='F'||e.code==='KeyF'){ e.preventDefault(); fs(); }
  else if(k==='g'||k==='G'){ e.preventDefault(); setPane('toc'); }
  else if(k==='n'||k==='N'){ e.preventDefault(); setPane('note'); }
  else if(k==='t'||k==='T'){ e.preventDefault(); setPane('all'); }
  else if(k==='p'||k==='P'){ e.preventDefault(); toggleAuto(); }
  else if(k==='?'||k==='h'||k==='H'){ e.preventDefault(); setPane('help'); }
  else if(k==='Home'){ e.preventDefault(); go(0); }
  else if(k==='End'){ e.preventDefault(); go(N-1); }
  else if(/^[1-9]$/.test(k)){ go(parseInt(k,10)-1); }
});

  const out=$('#rwOut'); if(out){
    const detail = rwStep>=4 ? cfg.verdict : (rwStep>0 ? cfg['s'+rwStep] : '选择输入语句，然后播放或单步。');
    out.innerHTML='<b>'+RW_LABEL[rwStep]+'</b> · '+detail; out.title=out.textContent;
  }
}
function rwPause(){ rwPlaying=false; clearInterval(rwTimer); rwTimer=null;
  const b=$('#rwPlay'); if(b){ b.textContent='播放'; b.classList.remove('play'); } }
function rwPlay(){
  if(rwPlaying){ rwPause(); return; }
  rwPlaying=true; const b=$('#rwPlay'); b.textContent='暂停'; b.classList.add('play');
  if(rwStep>=RW_STEPS) rwStep=0;
  rwTimer=setInterval(()=>{ rwStep++; rwPaint(); if(rwStep>=RW_STEPS) rwPause(); }, 1250);
}
function rwTick(){ if(rwStep<RW_STEPS) rwStep++; rwPaint(); }
function rwReset(){ rwPause(); rwStep=0; rwPaint(); }

/* ---------- 动画 B：ALSO / INSTEAD 的 Query list 与顺序 ---------- */
let dmStep=0, dmTimer=null, dmPlaying=false;
const DM_STEPS=5;
const DM_LABEL=['待播放','① 读取 rule 条件','② 生成规则动作','③ 处理原查询','④ 排列执行顺序','⑤ 结果'];
function dmCfg(){
  const isIns=$('#dmCmd').value==='insert';
  const mode=$('#dmMode').value;
  const cond=(mode==='condalso'||mode==='condinstead');
  const instead=(mode==='instead'||mode==='condinstead');
  const op=isIns?'INSERT':'UPDATE / DELETE';
  const act=(cond?'条件规则动作':'规则动作');
  const actSub=(cond?'动作追加 rule 条件':'无条件追加动作');
  let cards=[];
  if(instead){
    cards.push(['① '+act, actSub, '原查询被抑制']);
    if(cond) cards.push(['② 原查询剩余路径','原查询追加 NOT(条件)','条件不成立时执行']);
  }else if(isIns){
    cards.push(['① 原查询', op+' ...','先执行，动作可见新行']);
    cards.push(['② '+act, actSub,'随后执行']);
  }else{
    cards.push(['① '+act, actSub,'先执行，避免目标行消失']);
    cards.push(['② 原查询', op+' ...','随后执行']);
  }
  const order = isIns
    ? 'INSERT：原查询先执行，规则动作随后，便于动作看到插入后的行。'
    : 'UPDATE / DELETE：规则动作先执行，原查询随后，避免目标行先被改掉后动作找不到它。';
  return {cards, order, verdict: cards.length+' 条 Query tree · '+cards.map(c=>c[0]).join(' → ')};
}
function dmPaint(){
  const cfg=dmCfg(), n=cfg.cards.length;
  const xs = n===1 ? [520] : (n===2 ? [240,800] : [100,520,940]);
  for(let i=0;i<3;i++){
    const g=$('#dmCard'+i);
    if(!g) continue;
    if(i<n){
      g.setAttribute('display','inline');
      g.setAttribute('transform','translate('+xs[i]+',0)');
      g.setAttribute('opacity', '1');
      const c=cfg.cards[i];
      $('#dmCard'+i+'T').textContent=c[0];
      $('#dmCard'+i+'S').textContent=c[1];
      $('#dmCard'+i+'N').textContent=c[2];
      const rect=$('#dmCard'+i+'R');
      const act=(dmStep>=2 && (dmStep===2 ? i===0 : (dmStep===3 ? i===Math.min(1,n-1) : false)));
      rect.setAttribute('stroke', act ? '#BE653B' : '#D9D5CB');
      rect.setAttribute('stroke-width', act ? '2.2' : '1.1');
    }else{
      g.setAttribute('display','none');
      g.setAttribute('opacity','0');
    }
  }
  const ord=$('#dmOrder'); if(ord) ord.textContent = dmStep>=4 ? cfg.order : '播放到「排列执行顺序」一步，查看为什么顺序不能凭 SQL 表面语法判断。';
  const out=$('#dmOut'); if(out){
    const detail = dmStep>=4 ? cfg.verdict : (dmStep>0 ? DM_LABEL[dmStep] : '选择原命令与规则模式，然后播放。');
    out.innerHTML='<b>'+DM_LABEL[dmStep]+'</b> · '+detail; out.title=out.textContent;
  }
  const out2=$('#dmOut2'); if(out2){ out2.textContent=cfg.verdict; out2.title=cfg.verdict; }
}
function dmPause(){ dmPlaying=false; clearInterval(dmTimer); dmTimer=null;
  const b=$('#dmPlay'); if(b){ b.textContent='播放'; b.classList.remove('play'); } }
function dmPlay(){
  if(dmPlaying){ dmPause(); return; }
  dmPlaying=true; const b=$('#dmPlay'); b.textContent='暂停'; b.classList.add('play');
  if(dmStep>=DM_STEPS) dmStep=0;
  dmTimer=setInterval(()=>{ dmStep++; dmPaint(); if(dmStep>=DM_STEPS) dmPause(); }, 1250);
}
function dmTick(){ if(dmStep<DM_STEPS) dmStep++; dmPaint(); }
function dmReset(){ dmPause(); dmStep=0; dmPaint(); }

function init(){
  render(); fit();
  let saved=0; try{ saved=parseInt(localStorage.getItem('rule-talk-slide')||'0',10)||0; }catch(e){}
  go(saved,true);
  $('#btnPrev').onclick=prev; $('#btnNext').onclick=next;
  $('#btnNotes').onclick=()=>setPane('note'); $('#btnAll').onclick=()=>setPane('all');
  $('#btnAuto').onclick=toggleAuto; $('#btnFs').onclick=fs;
  $('#btnToc').onclick=()=>setPane('toc'); $('#btnHelp').onclick=()=>setPane('help');
  ['rwMode','dmCmd','dmMode'].forEach(id=>{
    const el=$('#'+id); if(!el) return;
    el.addEventListener('change',()=>{ rwPaint(); dmPaint(); });
  });
  const bind=(id,fn)=>{ const el=$(id); if(el) el.onclick=fn; };
  bind('#rwPlay',rwPlay); bind('#rwTick',rwTick); bind('#rwReset',rwReset);
  bind('#dmPlay',dmPlay); bind('#dmTick',dmTick); bind('#dmReset',dmReset);
  rwPaint(); dmPaint();
}
document.addEventListener('DOMContentLoaded', init);
</script>
