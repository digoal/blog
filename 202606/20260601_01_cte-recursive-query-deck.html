<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数据库筑基课 · CTE 与递归查询｜给 SQL 分段，给优化器划线</title>
<!-- 单文件交付：所有原理图均为现场绘制的内联 SVG，无外链图片、字体、脚本。 -->
<!-- 设计母题：地层 / 剖面。内容按「问题→结构→原理→代价→实证→反模式→落地」推演，不按原文章节顺序排列。 -->
<style>
:root{
  --bg:#F7F6F2; --paper2:#F1EFE9; --ink:#1B2B33; --ink2:#46585F; --muted:#89938F; --line:#D9D5CB;
  --primary:#245A6B; --prim-l:#E5EFF0; --prim-m:#7BA6AF; --accent:#BE653B; --acc-l:#F7E9DE;
  --green:#2F7A66; --green-l:#E4F0EA; --gold:#AE8A3E; --gold-l:#F5EDDC;
  --rail:clamp(380px, 33vw, 452px);
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#E9E7E1}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
#viewport{position:absolute;left:0;top:0;right:0;bottom:58px;overflow:hidden;
  transition:right .36s cubic-bezier(.2,.7,.2,1)}
body.notes-open #viewport{right:var(--rail)}
#stage{position:absolute;width:1600px;height:900px;background:var(--bg);
  transform-origin:top left;box-shadow:0 18px 60px rgba(27,43,51,.13)}
.slide{position:absolute;inset:0;display:none}
.slide.on{display:block;animation:fadein .42s cubic-bezier(.2,.7,.2,1)}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.eyebrow{position:absolute;left:64px;top:42px;font-size:13px;letter-spacing:3.4px;
  color:var(--primary);font-weight:600}
.eyebrow .num{font-family:var(--mono);letter-spacing:1px;color:var(--accent);margin-right:14px}
h1.title{position:absolute;left:64px;top:68px;margin:0;font-family:var(--serif);
  font-size:44px;line-height:1.24;font-weight:700;letter-spacing:1.2px;color:var(--ink)}
.lede{position:absolute;left:64px;top:136px;width:1450px;font-size:19px;color:var(--ink2);
  line-height:1.52;letter-spacing:.3px}
.rule{position:absolute;left:64px;top:181px;width:1472px;height:1px;background:var(--line)}
.figwrap{position:absolute;left:100px;top:196px;width:1400px;height:432px}
svg.figure{display:block;overflow:visible}
svg.figure text{font-family:var(--sans)}
svg.figure text.serif{font-family:var(--serif)}
svg.figure text.mono{font-family:var(--mono)}
.caption{position:absolute;left:100px;top:640px;width:1400px;font-size:13px;
  color:var(--muted);letter-spacing:.4px}
.bridge{position:absolute;left:64px;top:700px;width:1440px;font-size:20px;
  color:var(--accent);line-height:1.5;letter-spacing:.4px;padding-left:18px;
  border-left:3px solid var(--accent);font-family:var(--serif)}
.bridge .bk{font-family:var(--sans);font-size:12.5px;color:var(--muted);
  letter-spacing:2px;display:block;margin-bottom:1px}
.footer{position:absolute;left:64px;top:838px;width:1472px;height:1px;background:var(--line)}
.footer .fl{position:absolute;left:0;top:14px;font-size:12.5px;color:var(--muted);letter-spacing:2px}
.footer .fr{position:absolute;right:0;top:12px;font-family:var(--mono);font-size:14px;color:var(--ink2)}

/* 动画控件：图下方独立条带，不覆盖图 */
.ctrls{position:absolute;left:100px;top:638px;width:1400px;height:40px;display:flex;
  align-items:center;gap:10px}
.ctrls .cl{font-size:12.5px;color:var(--ink2);white-space:nowrap;letter-spacing:.5px}
.ctrls .btn{min-height:28px;padding:4px 13px;border:1px solid var(--primary);border-radius:4px;
  background:#fff;color:var(--primary);font-size:12.5px;cursor:pointer;font-family:var(--sans)}
.ctrls .btn.play{background:var(--primary);color:#fff}
.ctrls .btn:hover{filter:brightness(.94)}
.ctrls input[type=range]{width:150px;accent-color:var(--primary);margin:0}
.ctrls .out{font-size:12.5px;color:var(--ink2);margin-left:auto;max-width:640px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.ctrls .out b{color:var(--accent);font-weight:600}

/* 底部外壳：始终可见，全屏时也在 */
.chrome{position:fixed;left:0;right:0;bottom:0;height:58px;background:#FCFBF8;
  border-top:1px solid var(--line);display:flex;align-items:center;gap:7px;
  padding:0 16px;z-index:60;font-size:13px;color:var(--ink2)}
.chrome .sep{width:1px;height:22px;background:var(--line);margin:0 5px}
.chrome button{font-family:var(--sans);font-size:13px;color:var(--ink2);background:transparent;
  border:1px solid transparent;border-radius:5px;padding:7px 10px;cursor:pointer;white-space:nowrap}
.chrome button:hover{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome button.act{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome button.k{font-family:var(--mono);font-size:12px;color:var(--muted)}
.chrome .pg{font-family:var(--mono);font-size:14px;color:var(--ink);min-width:74px;text-align:center}
.chrome .track{flex:1;height:3px;background:var(--line);border-radius:3px;margin:0 10px;position:relative}
.chrome .track i{position:absolute;left:0;top:0;height:3px;background:var(--primary);
  border-radius:3px;transition:width .35s}
body.immersive #stage{box-shadow:none}

/* 右侧讲稿栏：页内开窗，画面矢量缩放让位 */
#rail{position:fixed;right:0;top:0;bottom:58px;width:var(--rail);background:#FBFAF6;
  border-left:1px solid var(--line);z-index:50;display:flex;flex-direction:column;
  transform:translateX(101%);transition:transform .36s cubic-bezier(.2,.7,.2,1);
  box-shadow:-16px 0 44px rgba(27,43,51,.07)}
body.notes-open #rail{transform:translateX(0)}
.rail-head{padding:20px 24px 12px;border-bottom:1px solid var(--line);background:#FCFBF8;flex:none}
.rail-head .rk{font-family:var(--mono);font-size:11px;letter-spacing:1.8px;color:var(--accent)}
.rail-head h3{margin:7px 0 3px;font-family:var(--serif);font-size:19px;line-height:1.4;color:var(--ink)}
.rail-head .rm{font-size:11.5px;color:var(--muted);letter-spacing:1.2px}
.rail-tools{display:flex;gap:6px;margin-top:10px}
.rail-tools button{font-family:var(--sans);font-size:12px;color:var(--ink2);background:#fff;
  border:1px solid var(--line);border-radius:4px;padding:4px 9px;cursor:pointer}
.rail-tools button.on{background:var(--primary);border-color:var(--primary);color:#fff}
.rail-tools .x{margin-left:auto}
.rail-body{flex:1;overflow-y:auto;padding:0 0 28px;scrollbar-width:thin}
.rail-body::-webkit-scrollbar{width:8px}
.rail-body::-webkit-scrollbar-thumb{background:#DCD8CE;border-radius:4px}
.note{padding:16px 24px 18px;border-bottom:1px dotted var(--line);position:relative;transition:background .2s}
.note.act{background:#F3F1EA;box-shadow:inset 3px 0 0 var(--accent)}
.note .nh{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:1.2px;margin-bottom:5px}
.note h4{margin:0 0 7px;font-family:var(--serif);font-size:16px;color:var(--primary);line-height:1.42}
.note p{margin:0 0 9px;font-size:14px;line-height:2.02;color:var(--ink2);letter-spacing:.2px;text-align:justify}
.note p:last-child{margin-bottom:0}
.note .nb{margin-top:9px;padding-left:11px;border-left:2px solid var(--acc-l);
  font-family:var(--serif);font-size:13.5px;color:#A9552F;line-height:1.75}
body.rail-one .note h4{font-size:17px}
body.rail-one .note p{font-size:15px;line-height:2.05}

/* 模态：仅目录与帮助使用 */
.veil{position:fixed;inset:0;background:rgba(27,43,51,.42);z-index:70;display:none;
  align-items:center;justify-content:center;backdrop-filter:blur(3px)}
.veil.on{display:flex}
.panel{width:min(1040px,90vw);max-height:80vh;overflow:auto;background:var(--bg);
  border-radius:8px;box-shadow:0 24px 80px rgba(0,0,0,.26);padding:32px 38px 36px}
.panel h2{margin:0 0 6px;font-family:var(--serif);font-size:28px;color:var(--ink)}
.panel .psub{font-size:13.5px;color:var(--muted);margin-bottom:22px;letter-spacing:1px}
.panel .close{position:sticky;top:0;float:right;background:#fff;border:1px solid var(--line);
  border-radius:5px;padding:5px 11px;font-size:12.5px;cursor:pointer;color:var(--ink2)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.grid a{display:block;padding:13px 13px;border:1px solid var(--line);border-radius:6px;
  background:#fff;text-decoration:none;color:var(--ink);cursor:pointer;transition:.18s}
.grid a:hover{border-color:var(--primary);background:var(--prim-l);transform:translateY(-2px)}
.grid a .gn{font-family:var(--mono);font-size:11.5px;color:var(--accent)}
.grid a .gt{font-family:var(--serif);font-size:15px;line-height:1.42;display:block;margin-top:4px}
.keys{display:grid;grid-template-columns:repeat(2,1fr);gap:9px 28px;font-size:14.5px;line-height:1.9}
.keys kbd{font-family:var(--mono);background:#fff;border:1px solid var(--line);
  border-bottom-width:2px;border-radius:4px;padding:2px 7px;color:var(--primary);margin-right:8px}
.toast{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);background:var(--ink);
  color:#fff;font-size:13px;padding:8px 15px;border-radius:5px;opacity:0;transition:.3s;
  z-index:90;pointer-events:none}
.toast.on{opacity:1}
@media print{.chrome,.veil,.toast,#rail{display:none!important}#viewport{position:static;right:0!important}
  #stage{position:static;transform:none!important;box-shadow:none}
  .slide{display:block!important;page-break-after:always;position:relative;height:900px}}
</style>
</head>
<body>
<div id="viewport"><div id="stage"><div id="slides"></div></div></div>

<aside id="rail">
  <div class="rail-head" id="railHead"></div>
  <div class="rail-body" id="railBody"></div>
</aside>

<div class="chrome">
  <button id="btnPrev">← 上一页</button>
  <button id="btnNext">下一页 →</button>
  <span class="pg">01 / 17</span>
  <div class="track" id="track"><i></i></div>
  <div class="sep"></div>
  <button id="btnToc">目录 G</button>
  <button id="btnNotes">本页讲稿 N</button>
  <button id="btnAll">全文讲稿 T</button>
  <button id="btnAuto">▶ 自动播放 P</button>
  <button id="btnFs">全屏 F</button>
  <button id="btnHelp" class="k">? 快捷键</button>
</div>

<div class="veil" id="veil"><div class="panel" id="panel"></div></div>
<div class="toast" id="toast"></div>
<script>
const D = [{"eyebrow":"数据库筑基课 · 优化 & 扫描 & 计算 · 最佳实践","title":"CTE 与递归查询：先给 SQL 分段，再给优化器划线","lede":"它既是让长 SQL 变得可验证的「命名」，也是可能挡住谓词下推的「围栏」。判断标准只有一条——你要的是一次计算，还是优化器的自由。","caption":"图 01 · 同一段 WITH，在优化器眼里有两种身份：可以折叠的子查询，或一道独立的执行边界。","bridge":"先从一个具体的痛开始：一段五层嵌套的报表 SQL，你根本无法在中途插一句 SELECT 看看结果。","notes":["今天这一节聊 CTE 和递归查询。先说清楚它不是什么：它不是性能优化关键字，也不是语法糖。它是一个关于「执行边界」的声明——你在 SQL 里画一条线，然后决定这条线是虚线还是实线。","这条线有两个方向。往人的方向看，WITH 给中间结果起了名字，一段复杂报表就能拆成几个可以单独跑、单独对数的步骤；往机器的方向看，这条线可能变成一道围栏，外层的过滤条件进不去，优化器也就没法帮你把代价压下来。","所以这一节的目标不是背语法，而是建立判断框架：什么时候该用 CTE，什么时候该强制物化，什么时候该内联，递归的执行边界在哪里，以及怎么用 EXPLAIN 把判断坐实。后面十七页按一条因果链走：先看它解决什么，再看它怎么执行，然后看代价从哪来，最后落到具体怎么写。"],"svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40\" y=\"36\" width=\"330\" height=\"150\" rx=\"2\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1\" /><text x=\"205.0\" y=\"96\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"26\" fill=\"#FFFFFF\" font-weight=\"700\" >种子</text><text x=\"205.0\" y=\"130\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"13\" fill=\"#FFFFFF\" font-weight=\"400\" >WITH seed AS (…)</text><line x1=\"58\" y1=\"210\" x2=\"58\" y2=\"224\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"58\" y=\"246\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11\" fill=\"#BE653B\" font-weight=\"600\" >01</text><text x=\"86\" y=\"246\" class=\"sv s\" text-anchor=\"start\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" >起点</text><text x=\"86\" y=\"270\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#2F7A66\" font-weight=\"500\" >通常可内联</text><rect x=\"370\" y=\"36\" width=\"330\" height=\"150\" rx=\"2\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1\" /><text x=\"535.0\" y=\"96\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"26\" fill=\"#FFFFFF\" font-weight=\"700\" >聚合</text><text x=\"535.0\" y=\"130\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"13\" fill=\"#FFFFFF\" font-weight=\"400\" >WITH agg AS (…)</text><line x1=\"388\" y1=\"210\" x2=\"388\" y2=\"224\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"388\" y=\"246\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11\" fill=\"#BE653B\" font-weight=\"600\" >02</text><text x=\"416\" y=\"246\" class=\"sv s\" text-anchor=\"start\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" >中间结果</text><text x=\"416\" y=\"270\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#BE653B\" font-weight=\"500\" >聚合 + 多次引用 → 物化</text><rect x=\"700\" y=\"36\" width=\"330\" height=\"150\" rx=\"2\" fill=\"#74A5AD\" stroke=\"#74A5AD\" stroke-width=\"1\" /><text x=\"865.0\" y=\"96\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"26\" fill=\"#1B2B33\" font-weight=\"700\" >关联</text><text x=\"865.0\" y=\"130\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"13\" fill=\"#1B2B33\" font-weight=\"400\" >WITH joined AS (…)</text><line x1=\"718\" y1=\"210\" x2=\"718\" y2=\"224\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"718\" y=\"246\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11\" fill=\"#BE653B\" font-weight=\"600\" >03</text><text x=\"746\" y=\"246\" class=\"sv s\" text-anchor=\"start\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" >中间结果</text><text x=\"746\" y=\"270\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"500\" >视引用次数</text><rect x=\"1030\" y=\"36\" width=\"330\" height=\"150\" rx=\"2\" fill=\"#A4C4C6\" stroke=\"#A4C4C6\" stroke-width=\"1\" /><text x=\"1195.0\" y=\"96\" class=\"sv serif\" text-anchor=\"middle\" font-size=\"26\" fill=\"#1B2B33\" font-weight=\"700\" >输出</text><text x=\"1195.0\" y=\"130\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"13\" fill=\"#1B2B33\" font-weight=\"400\" >SELECT … ORDER BY</text><line x1=\"1048\" y1=\"210\" x2=\"1048\" y2=\"224\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"1048\" y=\"246\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11\" fill=\"#BE653B\" font-weight=\"600\" >04</text><text x=\"1076\" y=\"246\" class=\"sv s\" text-anchor=\"start\" font-size=\"13\" fill=\"#46585F\" font-weight=\"400\" >最终结果</text><text x=\"1076\" y=\"270\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"500\" >总在最后执行</text><rect x=\"40\" y=\"296\" width=\"1320\" height=\"98\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"66\" y=\"336\" class=\"sv serif\" text-anchor=\"start\" font-size=\"18\" fill=\"#245A6B\" font-weight=\"700\" >命名</text><text x=\"66\" y=\"364\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >把一段 SQL 变成可单独验证的关系</text><text x=\"506\" y=\"336\" class=\"sv serif\" text-anchor=\"start\" font-size=\"18\" fill=\"#245A6B\" font-weight=\"700\" >物化</text><text x=\"506\" y=\"364\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >把「算几次」变成可控的执行边界</text><line x1=\"480\" y1=\"312\" x2=\"480\" y2=\"378\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"946\" y=\"336\" class=\"sv serif\" text-anchor=\"start\" font-size=\"18\" fill=\"#245A6B\" font-weight=\"700\" >下推</text><text x=\"946\" y=\"364\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\" >把「能不能进得去」交还给优化器</text><line x1=\"920\" y1=\"312\" x2=\"920\" y2=\"378\" stroke=\"#D9D5CB\" stroke-width=\"1\"/></svg>","ctrl":null},{"eyebrow":"第一章 · 问题","title":"嵌套是把逻辑叠起来，WITH 是把它摊开","lede":"报表 SQL 通常要先圈时间、再聚合、再过滤、再关联、最后排序。嵌套写法里中间结果没有名字，也无法单独验证；WITH 让每一段成为可以点名的关系。","caption":"图 02 · 命名的直接收益是「可验证」：每一段都能脱离外层单独执行、单独对数。","bridge":"但命名不是免费的——你把一段 SQL 单独起名字的那一刻，也就给了优化器一个「这里可以停」的暗示。","notes":["先从最常见的痛点说起。一段报表通常要先圈时间范围、再聚合、再过滤、再关联、最后排序。如果全写成嵌套子查询，你得到的是一个套娃：最里面那层没有名字，你也没法在中途插一句 SELECT，看看它到底返回了什么。","WITH 做的第一件事就是命名。把每一段变成一个具名关系，于是调试时可以把任意一段单独拎出来跑——把 SELECT * FROM active_customers 执行一遍，行数对不对、口径对不对，立刻就能验证。这是可维护性的来源，和性能无关。","但命名这个动作本身有语义后果。你给一段 SQL 起名字的那一刻，也告诉了优化器「这里是一个独立的关系」；它接下来要判断的是：这个关系，到底要不要真的算出来、存下来。这一步判断，才是后面所有性能差异的源头。"],"svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><text x=\"20\" y=\"26\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#89938F\" font-weight=\"600\" >叠起来：只有最外层有名字</text><text x=\"760\" y=\"26\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"600\" >摊开：每一段都能单独跑</text><line x1=\"706\" y1=\"40\" x2=\"706\" y2=\"400\" stroke=\"#D9D5CB\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/><rect x=\"20\" y=\"36\" width=\"420\" height=\"352\" rx=\"3\" fill=\"#FCFBF8\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"34\" y=\"60\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"600\" >① 排序</text><text x=\"90.06\" y=\"60\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11\" fill=\"#89938F\" font-weight=\"400\" >ORDER BY</text><rect x=\"48\" y=\"78\" width=\"364\" height=\"268\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"62\" y=\"102\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"600\" >② 关联</text><text x=\"118.06\" y=\"102\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11\" fill=\"#89938F\" font-weight=\"400\" >JOIN</text><rect x=\"76\" y=\"120\" width=\"308\" height=\"184\" rx=\"3\" fill=\"#FCFBF8\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"90\" y=\"144\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"600\" >③ 过滤</text><text x=\"146.06\" y=\"144\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11\" fill=\"#89938F\" font-weight=\"400\" >WHERE</text><rect x=\"104\" y=\"162\" width=\"252\" height=\"100\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"118\" y=\"186\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#BE653B\" font-weight=\"600\" >④ 聚合</text><text x=\"174.06\" y=\"186\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11\" fill=\"#89938F\" font-weight=\"400\" >GROUP BY</text><text x=\"230\" y=\"218\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#BE653B\" font-weight=\"500\" >中间结果不可命名</text><text x=\"230\" y=\"240\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#BE653B\" font-weight=\"500\" >也无法在中途验证</text><rect x=\"760\" y=\"40\" width=\"600\" height=\"66\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"778\" y=\"67\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14\" fill=\"#1B2B33\" font-weight=\"600\" >recent_orders</text><text x=\"778\" y=\"88\" class=\"sv s\" text-anchor=\"start\" font-size=\"12\" fill=\"#46585F\" font-weight=\"400\" >时间窗口过滤</text><circle cx=\"1338\" cy=\"73\" r=\"7\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\" /><text x=\"1338\" y=\"77\" class=\"sv s\" text-anchor=\"middle\" font-size=\"9\" fill=\"#2F7A66\" font-weight=\"700\" >✓</text><line x1=\"1060\" y1=\"106\" x2=\"1060\" y2=\"122.4\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><polygon points=\"1060,128 1056.15,121 1063.85,121\" fill=\"#245A6B\"/><rect x=\"760\" y=\"128\" width=\"600\" height=\"66\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"778\" y=\"155\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14\" fill=\"#1B2B33\" font-weight=\"600\" >customer_agg</text><text x=\"778\" y=\"176\" class=\"sv s\" text-anchor=\"start\" font-size=\"12\" fill=\"#46585F\" font-weight=\"400\" >按客户聚合</text><circle cx=\"1338\" cy=\"161\" r=\"7\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\" /><text x=\"1338\" y=\"165\" class=\"sv s\" text-anchor=\"middle\" font-size=\"9\" fill=\"#2F7A66\" font-weight=\"700\" >✓</text><line x1=\"1060\" y1=\"194\" x2=\"1060\" y2=\"210.4\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><polygon points=\"1060,216 1056.15,209 1063.85,209\" fill=\"#245A6B\"/><rect x=\"760\" y=\"216\" width=\"600\" height=\"66\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"778\" y=\"243\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14\" fill=\"#1B2B33\" font-weight=\"600\" >active_customers</text><text x=\"778\" y=\"264\" class=\"sv s\" text-anchor=\"start\" font-size=\"12\" fill=\"#46585F\" font-weight=\"400\" >筛出活跃客户</text><circle cx=\"1338\" cy=\"249\" r=\"7\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\" /><text x=\"1338\" y=\"253\" class=\"sv s\" text-anchor=\"middle\" font-size=\"9\" fill=\"#2F7A66\" font-weight=\"700\" >✓</text><line x1=\"1060\" y1=\"282\" x2=\"1060\" y2=\"298.4\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><polygon points=\"1060,304 1056.15,297 1063.85,297\" fill=\"#245A6B\"/><rect x=\"760\" y=\"304\" width=\"600\" height=\"66\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"778\" y=\"331\" class=\"sv mono\" text-anchor=\"start\" font-size=\"14\" fill=\"#1B2B33\" font-weight=\"600\" >final</text><text x=\"778\" y=\"352\" class=\"sv s\" text-anchor=\"start\" font-size=\"12\" fill=\"#46585F\" font-weight=\"400\" >关联并排序</text><circle cx=\"1338\" cy=\"337\" r=\"7\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\" /><text x=\"1338\" y=\"341\" class=\"sv s\" text-anchor=\"middle\" font-size=\"9\" fill=\"#2F7A66\" font-weight=\"700\" >✓</text><text x=\"1160\" y=\"408\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12\" fill=\"#89938F\" font-weight=\"400\" >每一段都可以 SELECT * FROM 段名 单独验证</text></svg>","ctrl":null},{"eyebrow":"第二章 · 问题","title":"有一类问题，普通 SQL 根本写不出来","lede":"部门树、BOM、依赖链、权限继承——共同点是：这一轮的结果，就是下一轮的输入。关系代数里没有「自引用」这个位置。","caption":"图 03 · 递归 CTE 解决的不是「层级好看」，而是「当前结果产生下一轮输入」这个语义缺口。","bridge":"要补上这个缺口，SQL 标准给了唯一的位置：UNION 左边是种子，右边是引用自己的那一段。","notes":["第二类问题更硬：有些查询，普通 SQL 根本写不出来。部门树、物料清单、任务依赖、权限继承，它们的共同结构是——这一轮的结果，就是下一轮的输入。关系代数里没有「自引用」这个位置，你没法用一个 SELECT 表达「一直往下找，直到找不动」。","这就是递归 CTE 存在的理由。它不是把层级写得好看，而是补上这个语义缺口：种子给出起点，递归项描述「怎么从上一批扩到下一批」，两段用 UNION 接起来。至于怎么收敛，得靠你自己给终止条件。","所以判断标准很清楚：如果问题是「一批数据变换一次」，普通 CTE 就够了；只有当问题本身是「沿着边一层层走」，才轮得到 WITH RECURSIVE。走错这一步，后面所有调优都是白费。"],"svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"60\" y=\"52\" width=\"170\" height=\"44\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#89938F\" stroke-width=\"1.1\" stroke-dasharray=\"4 3\"/><text x=\"145.0\" y=\"78.55\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13\" fill=\"#89938F\" font-weight=\"500\" >0 ROOT</text><polyline points=\"230,74 456.4,74\" fill=\"none\" stroke=\"#AE8A3E\" stroke-width=\"1.5\" stroke-linejoin=\"miter\"/><polygon points=\"462,74 455,70.15 455,77.85\" fill=\"#AE8A3E\"/><text x=\"346\" y=\"64\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#AE8A3E\" font-weight=\"500\" >本例种子是 A，不是根</text><rect x=\"470\" y=\"52\" width=\"150\" height=\"44\" rx=\"4\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1.1\" /><text x=\"545.0\" y=\"79.25\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15\" fill=\"#FFFFFF\" font-weight=\"600\" >A · 1</text><rect x=\"470\" y=\"150\" width=\"150\" height=\"44\" rx=\"4\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1.1\" /><text x=\"545.0\" y=\"177.25\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15\" fill=\"#FFFFFF\" font-weight=\"600\" >B · 2</text><rect x=\"300\" y=\"258\" width=\"150\" height=\"44\" rx=\"4\" fill=\"#74A5AD\" stroke=\"#74A5AD\" stroke-width=\"1.1\" /><text x=\"375.0\" y=\"285.25\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15\" fill=\"#1B2B33\" font-weight=\"600\" >C · 3</text><rect x=\"640\" y=\"258\" width=\"150\" height=\"44\" rx=\"4\" fill=\"#74A5AD\" stroke=\"#74A5AD\" stroke-width=\"1.1\" /><text x=\"715.0\" y=\"285.25\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15\" fill=\"#1B2B33\" font-weight=\"600\" >D · 4</text><rect x=\"640\" y=\"352\" width=\"150\" height=\"44\" rx=\"4\" fill=\"#A4C4C6\" stroke=\"#A4C4C6\" stroke-width=\"1.1\" /><text x=\"715.0\" y=\"379.25\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15\" fill=\"#1B2B33\" font-weight=\"600\" >F · 6</text><line x1=\"545\" y1=\"96\" x2=\"545\" y2=\"143.6\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><polygon points=\"545,150 540.6,142 549.4,142\" fill=\"#245A6B\"/><polyline points=\"545,194 545,226\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"/><polyline points=\"375,226 715,226\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.6\" stroke-linejoin=\"miter\"/><line x1=\"375\" y1=\"226\" x2=\"375\" y2=\"251.6\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><polygon points=\"375,258 370.6,250 379.4,250\" fill=\"#245A6B\"/><line x1=\"715\" y1=\"226\" x2=\"715\" y2=\"251.6\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><polygon points=\"715,258 710.6,250 719.4,250\" fill=\"#245A6B\"/><line x1=\"715\" y1=\"302\" x2=\"715\" y2=\"345.6\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><polygon points=\"715,352 710.6,344 719.4,344\" fill=\"#245A6B\"/><line x1=\"634\" y1=\"82\" x2=\"648\" y2=\"82\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"654\" y=\"86\" class=\"sv mono\" text-anchor=\"start\" font-size=\"10.5\" fill=\"#89938F\" font-weight=\"500\" >第 1 轮</text><line x1=\"634\" y1=\"180\" x2=\"648\" y2=\"180\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"654\" y=\"184\" class=\"sv mono\" text-anchor=\"start\" font-size=\"10.5\" fill=\"#89938F\" font-weight=\"500\" >第 2 轮</text><line x1=\"802\" y1=\"288\" x2=\"816\" y2=\"288\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"822\" y=\"292\" class=\"sv mono\" text-anchor=\"start\" font-size=\"10.5\" fill=\"#89938F\" font-weight=\"500\" >第 3 轮</text><line x1=\"802\" y1=\"382\" x2=\"816\" y2=\"382\" stroke=\"#D9D5CB\" stroke-width=\"1.2\"/><text x=\"822\" y=\"386\" class=\"sv mono\" text-anchor=\"start\" font-size=\"10.5\" fill=\"#89938F\" font-weight=\"500\" >第 4 轮</text><text x=\"980\" y=\"44\" class=\"sv s\" text-anchor=\"start\" font-size=\"13\" fill=\"#BE653B\" font-weight=\"600\" >普通 SQL 缺的那一格</text><rect x=\"980\" y=\"62\" width=\"180\" height=\"52\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"1070.0\" y=\"92.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14\" fill=\"#1B2B33\" font-weight=\"600\" >上一轮结果</text><rect x=\"980\" y=\"158\" width=\"180\" height=\"52\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.1\" /><text x=\"1070.0\" y=\"188.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14\" fill=\"#BE653B\" font-weight=\"600\" >递归项展开</text><rect x=\"980\" y=\"254\" width=\"180\" height=\"52\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"1070.0\" y=\"284.9\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14\" fill=\"#1B2B33\" font-weight=\"600\" >下一轮输入</text><line x1=\"1070\" y1=\"114\" x2=\"1070\" y2=\"151.6\" stroke=\"#BE653B\" stroke-width=\"1.6\"/><polygon points=\"1070,158 1065.6,150 1074.4,150\" fill=\"#BE653B\"/><line x1=\"1070\" y1=\"210\" x2=\"1070\" y2=\"247.6\" stroke=\"#BE653B\" stroke-width=\"1.6\"/><polygon points=\"1070,254 1065.6,246 1074.4,246\" fill=\"#BE653B\"/><polyline points=\"1160,280 1258,280 1258,88 1166.4,88\" fill=\"none\" stroke=\"#BE653B\" stroke-width=\"1.5\" stroke-linejoin=\"miter\"/><polygon points=\"1160,88 1168,83.6 1168,92.4\" fill=\"#BE653B\"/><text x=\"1274\" y=\"186\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#BE653B\" font-weight=\"500\" >自引用</text><text x=\"1274\" y=\"202\" class=\"sv s\" text-anchor=\"start\" font-size=\"11\" fill=\"#89938F\" font-weight=\"400\" >结果即输入</text><text x=\"980\" y=\"344\" class=\"sv s\" text-anchor=\"start\" font-size=\"12\" fill=\"#89938F\" font-weight=\"400\" >没有这个位置，就只能用存储过程或应用层循环。</text><text x=\"980\" y=\"366\" class=\"sv s\" text-anchor=\"start\" font-size=\"12\" fill=\"#245A6B\" font-weight=\"500\" >递归 CTE 把它放回了 SQL 里。</text><text x=\"60\" y=\"420\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"400\" >种子决定起点：本例只展开 A 的子树，E(5)、G(7) 不会出现在结果里。</text></svg>","ctrl":null},{"eyebrow":"第二章 · 是什么","title":"递归 CTE 只有两个项，其余都是辅助","lede":"非递归项给种子，递归项描述「怎么从上一轮扩到下一轮」。working / intermediate 是执行器的内部表，SEARCH / CYCLE 只是输出上多挂几列。","caption":"图 04 · 记住这张解剖图：语句里只有两段是逻辑，其余都是执行器或输出层的辅助。","bridge":"这五个词里最容易被误解的是「物化」。很多人以为 WITH 天然等于临时表——那就从优化器的第一次判断说起。","notes":["把递归 CTE 拆开，其实只有两个项。UNION 左边是非递归项，它只跑一次，产出第一轮的种子；UNION 右边是递归项，它引用自己，描述怎么用上一轮的结果去找下一批。","剩下四个词都不是语句的一部分。working 表和 intermediate 表是执行器内部的两块 tuplestore：working 是这一轮的输入，intermediate 是这一轮的产出，一轮结束两张表交换。UNION 与 UNION ALL 的差别是去不去重；SEARCH 和 CYCLE 只是在输出上多挂几列。","把这几项分个类就清楚了：只有「非递归项」和「递归项」是语句里的东西，working 与 intermediate 是执行器运行时才有的表，SEARCH 与 CYCLE 是输出上多挂的列。分清这一层，才不会把 SEARCH 当优化开关，也不会把 working 表当成临时表。"],"svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20\" y=\"26\" width=\"700\" height=\"335\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"38\" y=\"42\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"400\" >-- PostgreSQL 13+，示例取自文中部门树</text><text x=\"38\" y=\"86\" class=\"sv mono\" font-size=\"13.5\" fill=\"#245A6B\" xml:space=\"preserve\">WITH RECURSIVE sub(level, id, path) AS (</text><text x=\"38\" y=\"111\" class=\"sv mono\" font-size=\"13.5\" fill=\"#46585F\" xml:space=\"preserve\">    SELECT 1, id, ARRAY[id]</text><text x=\"38\" y=\"136\" class=\"sv mono\" font-size=\"13.5\" fill=\"#46585F\" xml:space=\"preserve\">      FROM department</text><text x=\"38\" y=\"161\" class=\"sv mono\" font-size=\"13.5\" fill=\"#46585F\" xml:space=\"preserve\">     WHERE name = &#x27;A&#x27;</text><text x=\"38\" y=\"186\" class=\"sv mono\" font-size=\"13.5\" fill=\"#BE653B\" xml:space=\"preserve\">  UNION ALL</text><text x=\"38\" y=\"211\" class=\"sv mono\" font-size=\"13.5\" fill=\"#46585F\" xml:space=\"preserve\">    SELECT sd.level + 1, d.id, sd.path || d.id</text><text x=\"38\" y=\"236\" class=\"sv mono\" font-size=\"13.5\" fill=\"#46585F\" xml:space=\"preserve\">      FROM department d</text><text x=\"38\" y=\"261\" class=\"sv mono\" font-size=\"13.5\" fill=\"#46585F\" xml:space=\"preserve\">      JOIN sub sd ON d.parent_department = sd.id</text><text x=\"38\" y=\"286\" class=\"sv mono\" font-size=\"13.5\" fill=\"#46585F\" xml:space=\"preserve\">     WHERE NOT d.id = ANY(sd.path)</text><text x=\"38\" y=\"311\" class=\"sv mono\" font-size=\"13.5\" fill=\"#46585F\" xml:space=\"preserve\">)</text><text x=\"38\" y=\"336\" class=\"sv mono\" font-size=\"13.5\" fill=\"#245A6B\" xml:space=\"preserve\">SELECT * FROM sub ORDER BY path;</text><line x1=\"722\" y1=\"7\" x2=\"754\" y2=\"7\" stroke=\"#7BA6AF\" stroke-width=\"1.2\"/><circle cx=\"758\" cy=\"7\" r=\"2.4\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"0\" /><text x=\"768\" y=\"11\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"600\" >WITH RECURSIVE</text><text x=\"768\" y=\"31\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >声明允许自引用；列名可显式给出，避免类型漂移</text><line x1=\"722\" y1=\"65\" x2=\"754\" y2=\"65\" stroke=\"#7BA6AF\" stroke-width=\"1.2\"/><circle cx=\"758\" cy=\"65\" r=\"2.4\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"0\" /><text x=\"768\" y=\"69\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"600\" >非递归项（种子）</text><text x=\"768\" y=\"89\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >决定从哪里开始，只跑一次</text><line x1=\"722\" y1=\"117\" x2=\"754\" y2=\"117\" stroke=\"#7BA6AF\" stroke-width=\"1.2\"/><circle cx=\"758\" cy=\"117\" r=\"2.4\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"0\" /><text x=\"768\" y=\"121\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"600\" >递归项</text><text x=\"768\" y=\"141\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >用上一轮 working 表扩出下一批行</text><line x1=\"722\" y1=\"169\" x2=\"754\" y2=\"169\" stroke=\"#7BA6AF\" stroke-width=\"1.2\"/><circle cx=\"758\" cy=\"169\" r=\"2.4\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"0\" /><text x=\"768\" y=\"173\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"600\" >自引用 sub</text><text x=\"768\" y=\"193\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >执行时是 WorkTableScan，不读 department</text><line x1=\"722\" y1=\"247\" x2=\"754\" y2=\"247\" stroke=\"#7BA6AF\" stroke-width=\"1.2\"/><circle cx=\"758\" cy=\"247\" r=\"2.4\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"0\" /><text x=\"768\" y=\"251\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"600\" >OUTER ORDER BY</text><text x=\"768\" y=\"271\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >SEARCH 只给排序键，顺序要自己排</text><text x=\"20\" y=\"392\" class=\"sv s\" text-anchor=\"start\" font-size=\"12\" fill=\"#89938F\" font-weight=\"400\" >执行器还有两张表：working / intermediate —— 语句里看不见，运行时才有。</text><text x=\"20\" y=\"412\" class=\"sv s\" text-anchor=\"start\" font-size=\"12\" fill=\"#89938F\" font-weight=\"400\" >UNION ALL 不去重；UNION 对完整行做哈希去重，列越宽内存压力越大。</text></svg>","ctrl":null},{"eyebrow":"第三章 · 原理","title":"普通 CTE 的第一道判断：折叠进去，还是单独算","lede":"SS_process_ctes() 逐个过一遍 WITH 列表。递归、含 DML、含 volatile 函数、显式 MATERIALIZED——命中任何一条就单独规划；否则引用次数决定默认。","caption":"图 05 · 默认规则很机械：恰好引用一次就内联，引用多次就物化。关键词的作用只是把这条默认线掰弯。","bridge":"一旦判定为物化，问题就从「算几次」变成「结果放哪儿」——这要看执行器。","notes":["判断发生在 SS_process_ctes() 里，就是 subselect.c 那个函数。它按顺序过一遍 WITH 列表：先看这个 CTE 有没有被引用，没被引用就直接丢掉，连计划都不生成。","接着看它能不能被折叠。递归的不行，含 INSERT / UPDATE / DELETE / MERGE 的不行，含 volatile 函数的不行——这三条是语义约束，不是成本问题。再往下才是默认规则：恰好引用一次就内联，引用多次就物化。","关键词的作用就是把这条默认线掰弯。MATERIALIZED 对应 CTEMaterializeAlways，无条件物化；NOT MATERIALIZED 对应 CTEMaterializeNever，在满足安全条件时即使多次引用也内联。注意它是「请求」不是「保证」——刚才那三条语义约束仍然优先。","所以判断顺序永远是：语义约束在前，引用次数在后，关键词最后覆盖默认值。顺序搞反，就会写出「加了 NOT MATERIALIZED 却还是物化」的困惑。"],"svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"30\" y=\"20\" width=\"470\" height=\"46\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#245A6B\" stroke-width=\"1.3\" /><text x=\"46\" y=\"49\" class=\"sv s\" text-anchor=\"start\" font-size=\"14\" fill=\"#1B2B33\" font-weight=\"600\" >① 这个 CTE 被引用了吗？</text><line x1=\"265\" y1=\"66\" x2=\"265\" y2=\"102.4\" stroke=\"#89938F\" stroke-width=\"1.3\"/><polygon points=\"265,108 261.15,101 268.85,101\" fill=\"#89938F\"/><text x=\"273\" y=\"92\" class=\"sv s\" text-anchor=\"start\" font-size=\"10.5\" fill=\"#89938F\" font-weight=\"500\" >是</text><rect x=\"30\" y=\"102\" width=\"470\" height=\"46\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#245A6B\" stroke-width=\"1.3\" /><text x=\"46\" y=\"131\" class=\"sv s\" text-anchor=\"start\" font-size=\"14\" fill=\"#1B2B33\" font-weight=\"600\" >② 递归 / 含 DML / 含 volatile？</text><line x1=\"265\" y1=\"148\" x2=\"265\" y2=\"184.4\" stroke=\"#89938F\" stroke-width=\"1.3\"/><polygon points=\"265,190 261.15,183 268.85,183\" fill=\"#89938F\"/><text x=\"273\" y=\"174\" class=\"sv s\" text-anchor=\"start\" font-size=\"10.5\" fill=\"#89938F\" font-weight=\"500\" >否</text><rect x=\"30\" y=\"184\" width=\"470\" height=\"46\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#245A6B\" stroke-width=\"1.3\" /><text x=\"46\" y=\"213\" class=\"sv s\" text-anchor=\"start\" font-size=\"14\" fill=\"#1B2B33\" font-weight=\"600\" >③ 显式写了 MATERIALIZED？</text><line x1=\"265\" y1=\"230\" x2=\"265\" y2=\"266.4\" stroke=\"#89938F\" stroke-width=\"1.3\"/><polygon points=\"265,272 261.15,265 268.85,265\" fill=\"#89938F\"/><text x=\"273\" y=\"256\" class=\"sv s\" text-anchor=\"start\" font-size=\"10.5\" fill=\"#89938F\" font-weight=\"500\" >否</text><rect x=\"30\" y=\"266\" width=\"470\" height=\"46\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#245A6B\" stroke-width=\"1.3\" /><text x=\"46\" y=\"295\" class=\"sv s\" text-anchor=\"start\" font-size=\"14\" fill=\"#1B2B33\" font-weight=\"600\" >④ 显式写了 NOT MATERIALIZED？</text><line x1=\"265\" y1=\"312\" x2=\"265\" y2=\"348.4\" stroke=\"#89938F\" stroke-width=\"1.3\"/><polygon points=\"265,354 261.15,347 268.85,347\" fill=\"#89938F\"/><text x=\"273\" y=\"338\" class=\"sv s\" text-anchor=\"start\" font-size=\"10.5\" fill=\"#89938F\" font-weight=\"500\" >否</text><rect x=\"30\" y=\"348\" width=\"470\" height=\"46\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#245A6B\" stroke-width=\"1.3\" /><text x=\"46\" y=\"377\" class=\"sv s\" text-anchor=\"start\" font-size=\"14\" fill=\"#1B2B33\" font-weight=\"600\" >⑤ 恰好只被引用一次？</text><rect x=\"800\" y=\"24\" width=\"300\" height=\"38\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#89938F\" stroke-width=\"1.2\" /><text x=\"950\" y=\"48\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"600\" >忽略，不进入计划</text><line x1=\"500\" y1=\"43\" x2=\"794.4\" y2=\"43\" stroke=\"#89938F\" stroke-width=\"1.4\"/><polygon points=\"800,43 793,39.15 793,46.85\" fill=\"#89938F\"/><text x=\"512\" y=\"36\" class=\"sv s\" text-anchor=\"start\" font-size=\"10.5\" fill=\"#89938F\" font-weight=\"500\" >否</text><text x=\"1116\" y=\"47\" class=\"sv mono\" text-anchor=\"start\" font-size=\"10.5\" fill=\"#89938F\" font-weight=\"400\" >cterefcount = 0</text><rect x=\"800\" y=\"106\" width=\"300\" height=\"38\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#89938F\" stroke-width=\"1.2\" /><text x=\"950\" y=\"130\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"600\" >物化（语义要求，不可内联）</text><line x1=\"500\" y1=\"125\" x2=\"794.4\" y2=\"125\" stroke=\"#89938F\" stroke-width=\"1.4\"/><polygon points=\"800,125 793,121.15 793,128.85\" fill=\"#89938F\"/><text x=\"512\" y=\"118\" class=\"sv s\" text-anchor=\"start\" font-size=\"10.5\" fill=\"#89938F\" font-weight=\"500\" >是</text><text x=\"1116\" y=\"129\" class=\"sv mono\" text-anchor=\"start\" font-size=\"10.5\" fill=\"#89938F\" font-weight=\"400\" >递归 / DML / volatile</text><rect x=\"800\" y=\"188\" width=\"300\" height=\"38\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.2\" /><text x=\"950\" y=\"212\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#BE653B\" font-weight=\"600\" >物化 · CTEMaterializeAlways</text><line x1=\"500\" y1=\"207\" x2=\"794.4\" y2=\"207\" stroke=\"#BE653B\" stroke-width=\"1.4\"/><polygon points=\"800,207 793,203.15 793,210.85\" fill=\"#BE653B\"/><text x=\"512\" y=\"200\" class=\"sv s\" text-anchor=\"start\" font-size=\"10.5\" fill=\"#89938F\" font-weight=\"500\" >是</text><text x=\"1116\" y=\"211\" class=\"sv mono\" text-anchor=\"start\" font-size=\"10.5\" fill=\"#89938F\" font-weight=\"400\" >关键词优先于默认</text><rect x=\"800\" y=\"270\" width=\"300\" height=\"38\" rx=\"3\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.2\" /><text x=\"950\" y=\"294\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#2F7A66\" font-weight=\"600\" >内联 · CTEMaterializeNever</text><line x1=\"500\" y1=\"289\" x2=\"794.4\" y2=\"289\" stroke=\"#2F7A66\" stroke-width=\"1.4\"/><polygon points=\"800,289 793,285.15 793,292.85\" fill=\"#2F7A66\"/><text x=\"512\" y=\"282\" class=\"sv s\" text-anchor=\"start\" font-size=\"10.5\" fill=\"#89938F\" font-weight=\"500\" >是</text><text x=\"1116\" y=\"293\" class=\"sv mono\" text-anchor=\"start\" font-size=\"10.5\" fill=\"#89938F\" font-weight=\"400\" >仍须满足安全条件</text><rect x=\"800\" y=\"339\" width=\"300\" height=\"64\" rx=\"3\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.2\" /><text x=\"950\" y=\"366\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13\" fill=\"#245A6B\" font-weight=\"600\" >一次 → 内联</text><text x=\"950\" y=\"390\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13\" fill=\"#245A6B\" font-weight=\"600\" >多次 → 物化</text><line x1=\"500\" y1=\"371\" x2=\"794.4\" y2=\"371\" stroke=\"#245A6B\" stroke-width=\"1.4\"/><polygon points=\"800,371 793,367.15 793,374.85\" fill=\"#245A6B\"/><text x=\"1116\" y=\"375\" class=\"sv mono\" text-anchor=\"start\" font-size=\"10.5\" fill=\"#89938F\" font-weight=\"400\" >默认规则，PG 12 起</text><line x1=\"30\" y1=\"410\" x2=\"1360\" y2=\"410\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"30\" y=\"426\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"400\" >关键词只覆盖默认值；递归、DML、volatile 这三条语义约束优先级更高。</text><text x=\"1360\" y=\"426\" class=\"sv mono\" text-anchor=\"end\" font-size=\"11\" fill=\"#89938F\" font-weight=\"400\" >源码：optimizer/plan/subselect.c</text></svg>","ctrl":null},{"eyebrow":"第三章 · 原理","title":"一个 CTE 被引用两次，只算一次，但结果放哪儿","lede":"物化 CTE 在 init plan 里跑完，写进 CteScanState 共享的 tuplestore。第一个初始化的 CteScan 当 leader 负责填充，其他读者各有读指针。","caption":"图 06 · cteParam 不是业务参数，是执行器内部的节点通信：读指针各自独立，底层只有一份数据。","bridge":"普通 CTE 的分歧在「算几次」，递归 CTE 的分歧在「算几轮」。后者的模型更好记：写着递归，跑起来是迭代。","notes":["物化的 CTE 会被单独规划成一个 init SubPlan，在语句开始时跑一次，结果写进一块共享的 tuplestore。多个 CteScan 节点读同一份数据，但每个节点有自己的读指针。","谁是 leader？第一个初始化的那个 CteScan。它负责触发子计划、把行填进 tuplestore；其余的 CteScan 只是读者。这个协调不靠全局变量，靠 cteParam：ParamExecData 里存着 tuplestore 的句柄，节点之间就这么传。","代价也就藏在这里。外层 WHERE 是在 CteScan 之上过滤的，进不到 tuplestore 里面；所以一个千万行的 CTE 被外层筛到一百行，你也得先把千万行物化完。EXPLAIN 里那句 Rows Removed by Filter，就是这道围栏的收据。"],"svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20\" y=\"22\" width=\"250\" height=\"66\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"145.0\" y=\"59.375\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#245A6B\" font-weight=\"600\" >WITH w AS MATERIALIZED</text><line x1=\"145\" y1=\"88\" x2=\"145\" y2=\"139.6\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><polygon points=\"145,146 140.6,138 149.4,138\" fill=\"#245A6B\"/><rect x=\"20\" y=\"146\" width=\"250\" height=\"82\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"145.0\" y=\"181.875\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15\" fill=\"#1B2B33\" font ：从 A 起，四轮收敛。单步按钮走一遍，比读五遍文档清楚。","bridge":"注意递归项里那个自引用——它读的不是 department 表，而是这张每轮被换掉的 working 表。","notes":["递归 CTE 的模型更好记：写着是递归，跑起来是迭代。非递归项先跑，结果既进结果流，也进 working 表。","然后进入循环：只要 working 表非空，就把它当成自引用输入跑一遍递归项；本轮产生的新行进结果流，同时进 intermediate 表。一轮结束，清空旧 working，把 intermediate 换上来。","拿文中的部门树跑一遍：种子是 name = 'A'，也就是 1。第一轮用 1 找到 2；第二轮用 2 找到 3 和 4；第三轮 3 没有子节点、4 有 6；第四轮 6 没有子节点，intermediate 空了，迭代结束。四轮，五个节点。","注意这里没有「深度优先」这回事。执行器就是一轮一轮换表，所以输出的自然顺序偏向广度优先——但那是实现细节，文档明确说了不要依赖。要顺序，就自己 ORDER BY。"],"svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><text x=\"115\" y=\"88\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11\" fill=\"#89938F\" font-weight=\"400\" >本轮输入</text><text x=\"535\" y=\"88\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11\" fill=\"#89938F\" font-weight=\"400\" >下一轮候选</text><rect x=\"30\" y=\"100\" width=\"170\" height=\"92\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#245A6B\" stroke-width=\"1.4\" /><text x=\"115\" y=\"128\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14\" fill=\"#245A6B\" font-weight=\"600\" >working 表</text><text x=\"115\" y=\"168\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"18\" fill=\"#1B2B33\" font-weight=\"600\" id=\"rw\">{1}</text><rect x=\"250\" y=\"100\" width=\"150\" height=\"92\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.4\" /><text x=\"325\" y=\"128\" class=\"sv s\" text-anchor=\"middle\" font-size=\"14\" fill=\"#BE653B\" font-weight=\"600\" >递归项</text><text x=\"325\" y=\"152\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11\" fill=\"#A9552F\" font-weight=\"400\" >join 真实表</text><text x=\"325\" y=\"172\" class=\"sv s\" text-anchor=\"middle\" font-size=\"11\" fill=\"#A9552F\" font-weight=\"400\" >按 working 驱动</text><rect x=\"450\" y=\"100\" width=\"170\" height=\"92\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#245A6B\" stroke-width=\"1.4\" /><text x=\"535\" y=\"128\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13\" fill=\"#245A6B\" t-anchor=\"start\" font-size=\"12\" fill=\"#46585F\" font-weight=\"400\" >{1,2,3,4,6}</text><text x=\"1210\" y=\"235\" class=\"sv s\" text-anchor=\"start\" font-size=\"10.5\" fill=\"#89938F\" font-weight=\"400\" >3 无子，4 有 6</text><rect id=\"rrow4\" x=\"720\" y=\"256\" width=\"670\" height=\"52\" fill=\"#FCFBF8\" stroke=\"#D9D5CB\" stroke-width=\"0.9\"/><rect id=\"rbar4\" x=\"720\" y=\"256\" width=\"3\" height=\"52\" fill=\"#BE653B\" opacity=\"0\"/><text x=\"732\" y=\"287\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#245A6B\" font-weight=\"600\" >第 4 轮</text><text x=\"808\" y=\"287\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12\" fill=\"#46585F\" font-weight=\"400\" >{6}</text><text x=\"920\" y=\"287\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12\" fill=\"#BE653B\" font-weight=\"600\" >∅</text><text x=\"1032\" y=\"287\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12\" fill=\"#46585F\" font-weight=\"400\" >（停止）</text><text x=\"1210\" y=\"287\" class=\"sv s\" text-anchor=\"start\" font-size=\"10.5\" fill=\"#89938F\" font-weight=\"400\" >6 无子，工作表清空</text><text x=\"720\" y=\"348\" class=\"sv s\" text-anchor=\"start\" font-size=\"11\" fill=\"#89938F\" font-weight=\"400\" >示意数据：文中 department 示例（A1→B2→C3/D4→F6），四轮收敛。</text><text x=\"720\" y=\"370\" class=\"sv s\" text-anchor=\"start\" font-size=\"11\" fill=\"#46585F\" font-weight=\"400\" >每轮只处理上一轮新产出的行，这是它和「递归函数」最大的不同。</text></svg>","ctrl":"<span class=\"cl\">逐轮看一次迭代</span><button class=\"btn play\" id=\"recPlay\">▶ 播放</button><button class=\"btn\" id=\"recTick\">单步 ▸</button><button class=\"btn\" id=\"recReset\">重置 ↺</button><span class=\"out\" id=\"recOut\">种子先入 working 表与结果流</span>"},{"eyebrow":"第三章 · 原理","title":"自引用扫的不是真表，是上一轮的工作表","lede":"计划节点叫 WorkTableScan，它通过 wtParam 从 RecursiveUnionState 拿到当前 working tuplestore。真正的表扫描，是递归项里 join 的另一侧。","caption":"图 08 · 左边是语句，右边是节点。看懂这张对照，EXPLAIN 里的 Recursive Union / WorkTable Scan 就不再陌生。","bridge":"有了这条通路，接下来两件事就好理解了：SEARCH 只是加一列排序键，CYCLE 只是加一列环标记——都不动迭代模型。","notes":["递归项里那句 JOIN sub sd ON d.parent_department = sd.id，读起来像是在 join 一张叫 sub 的表。但数据库里没有这张表。","执行时它是 WorkTableScan，读的是 RecursiveUnionState 里当前那块 working tuplestore，通过 wtParam 拿到句柄。所以它不产生 IO，不扫堆表，也不走索引——它只是把上一轮的行拿出来。","真正需要索引的是另一侧：department 表上按 parent_department 找子节点。这一侧如果没有索引，每一轮都会退化成全表扫描，轮数越多放大越可怕。这就是为什么示例里那句 CREATE INDEX ON department(parent_department)，比 WITH RECURSIVE 本身更关键。"],"svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"430\" y=\"16\" width=\"280\" height=\"62\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"570.0\" y=\"42.375\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15\" fill=\"#245A6B\" font-weight=\"600\" >Recursive Union</text><text x=\"570.0\" y=\"61.275000000000006\" class=\"sv s\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#46585F\" font-weight=\"400\" >outer 种子 / inner 递归项</text><polyline points=\"520,78 520,104 370,104 370,123.6\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.5\" stroke-linejoin=\"miter\"/><polygon points=\"370,130 365.6,122 374.4,122\" fill=\"#245A6B\"/><polyline points=\"620,78 620,104 760,104 760,123.6\" fill=\"none\" stroke=\"#BE653B\" stroke-width=\"1.5\" stroke-linejoin=\"miter\"/><polygon points=\"760,130 755.6,122 764.4,122\" fill=\"#BE653B\"/><rect x=\"250\" y=\"130\" width=\"240\" height=\"62\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.1\" /><text x=\"370.0\" y=\"156.375\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"600\" >Seq Scan department</text><text x=\"370.0\" y=\"175.275\" class=\"sv s\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#89938F\" font-weight=\"400\" >非递归项</text><rect x=\"620\" y=\"130\" width=\"280\" height=\"62\" rx=\"4\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.1\" /><text x=\"760.0\" y=\"156.375\" class=\"sv s\" text-anchor=\"middle\" font-size=\"15\" fill=\"#BE653B\" font-weight=\"600\" >Hash Join</text><text x=\"760.0\" y=\"175.275\" class=\"sv s\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#A9552F\" font-weight=\"400\" >递归项</text><polyline points=\"700,192 700,216 625,216 625,233.6\" fill=\"none\" stroke=\"#BE653B\" stroke-width=\"1.5\" stroke-linejoin=\"miter\"/><polygon points=\"625,240 620.6,232 629.4,232\" fill=\"#BE653B\"/><polyline points=\"820,192 820,216 985,216 985,233.6\" fill=\"none\" stroke=\"#BE653B\" stroke-width=\"1.5\" stroke-linejoin=\"miter\"/><polygon points=\"985,240 980.6,232 989.4,232\" fill=\"#BE653B\"/><rect x=\"500\" y=\"240\" width=\"250\" height=\"62\" rx=\"4\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1.1\" /><text x=\"625.0\" y=\"266.375\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13\" fill=\"#2F7A66\" font-weight=\"600\" >Index Scan department</text><text x=\"625.0\" y=\"285.275\" class=\"sv s\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#46585F\" font-weight=\"400\" >parent_department 索引</text><rect x=\"860\" y=\"240\" width=\"250\" height=\"62\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"985.0\" y=\"266.375\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"600\" >WorkTable Scan</text><text x=\"985.0\" y=\"285.275\" class=\"sv s\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#245A6B\" font-weight=\"400\" >读 working tuplestore</text><polyline points=\"985,302 985,341.6\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.4\" stroke-linejoin=\"miter\"/><polygon points=\"985,348 980.6,340 989.4,340\" fill=\"#245A6B\"/><text x=\"997\" y=\"330\" class=\"sv mono\" text-anchor=\"start\" font-size=\"10.5\" fill=\"#245A6B\" font-weight=\"500\" >wtParam</text><rect x=\"860\" y=\"348\" width=\"250\" height=\"54\" rx=\"4\" fill=\"#F1EFE9\" stroke=\"#89938F\" stroke-width=\"1.1\" stroke-dasharray=\"4 3\"/><text x=\"985.0\" y=\"370.375\" class=\"sv s\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"600\" >working tuplestore</text><text x=\"985.0\" y=\"389.275\" class=\"sv s\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#89938F\" font-weight=\"400\" >本轮输入，不落堆表</text><text x=\"20\" y=\"336\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#245A6B\" font-weight=\"600\" >WorkTable Scan 不读堆表、不读文件：</text><text x=\"20\" y=\"358\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >它读的是 RecursiveUnionState 里那块</text><text x=\"20\" y=\"378\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >每轮被换掉的 working tuplestore。</text><text x=\"20\" y=\"404\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"400\" >所以它没有 IO 代价，也没有索引可用。</text><line x1=\"1150\" y1=\"200\" x2=\"1150\" y2=\"330\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1170\" y=\"212\" class=\"sv s\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#BE653B\" font-weight=\"600\" >真正的扫描只有一处</text><text x=\"1170\" y=\"234\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >递归项 join 的那一侧：</text><text x=\"1170\" y=\"254\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >department(parent_department)</text><text x=\"1170\" y=\"284\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"400\" >没有它，每轮退化成全表扫描，</text><text x=\"1170\" y=\"304\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"400\" >层数越深放大越明显。</text></svg>","ctrl":null},{"eyebrow":"第三章 · 原理","title":"SEARCH 管排序，CYCLE 管去环，都不管怎么走","lede":"SEARCH 生成可排序的序列列喂给外层 ORDER BY；CYCLE 生成环标记与路径列，让「这条路径走过了」成为结果的一部分。两者都不改变执行器的访问顺序。","caption":"图 09 · 按节点判环（CYCLE f）时命中环的行照样输出、不再展开；按边判环（CYCLE f, t）则命中重复边才打标。","bridge":"说到这儿，三个机制都清楚了。可真正决定快慢的不是机制，是代价——CTE 的代价可以来自五个地方。","notes":["SEARCH 和 CYCLE 是 SQL 标准里的子句，PostgreSQL 也支持。很多人以为它们能控制遍历顺序，其实不是。","SEARCH DEPTH FIRST BY id SET ordercol 做的事情，是给每一行附加一个可排序的序列列——深度优先时是数组，广度优先时是记录。它只影响你外层怎么 ORDER BY，不改变执行器怎么访问。","CYCLE 更进一步：它生成 is_cycle 标记和 path 路径列，让「这条路径已经走过」变成结果的一部分。命中环的行照样输出，但不再往下展开。这对带 depth、带 path 的图遍历特别有用，因为那些列每轮都在变，光靠 UNION 的整行去重根本挡不住环。","这里有个容易忽略的细节：CYCLE 后面跟哪几列，决定了你按什么判环。写 CYCLE id 是按节点判，回到走过的点就停；写 CYCLE f, t 是按边判，只有同一条边在一条路径里重复才停。做权限继承通常按节点，做链路可达性通常按边——这一列写错，去环的语义就不对了。","两句话记住：SEARCH 管展示顺序，CYCLE 管终止判据；两个都不管执行。"],"svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"30\" y=\"26\" width=\"720\" height=\"34\" rx=\"0\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"42\" y=\"48\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#FFFFFF\" font-weight=\"600\" >节点</text><text x=\"122\" y=\"48\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#FFFFFF\" font-weight=\"600\" >ordercol · DEPTH FIRST</text><text x=\"372\" y=\"48\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#FFFFFF\" font-weight=\"600\" >is_cycle</text><text x=\"472\" y=\"48\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#FFFFFF\" font-weight=\"600\" >说明</text><rect x=\"30\" y=\"60\" width=\"720\" height=\"44\" rx=\"0\" fill=\"#FCFBF8\" stroke=\"#D9D5CB\" stroke-width=\"0.9\" /><text x=\"42\" y=\"88\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"600\" >1</text><text x=\"122\" y=\"88\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#245A6B\" font-weight=\"500\" >{1}</text><text x=\"372\" y=\"88\" class=\"sv mono\" text-anchor=\"start\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"600\" >f</text><text x=\"472\" y=\"88\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >种子，从 1 出发</text><rect x=\"30\" y=\"104\" width=\"720\" height=\"44\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"0.9\" /><text x=\"42\" y=\"132\" cla 发条件</text><text x=\"842\" y=\"12\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11\" fill=\"#89938F\" font-weight=\"600\" >在 EXPLAIN 里看什么</text><line x1=\"20\" y1=\"20\" x2=\"1380\" y2=\"20\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"20\" y=\"30\" width=\"1360\" height=\"64\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"20\" y=\"30\" width=\"4\" height=\"64\" rx=\"2\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"40\" y=\"68\" class=\"sv s\" text-anchor=\"start\" font-size=\"14\" fill=\"#245A6B\" font-weight=\"600\" >物化的 tuplestore</text><text x=\"372\" y=\"68\" class=\"sv s\" text-anchor=\"start\" font-size=\"12\" fill=\"#46585F\" font-weight=\"400\" >多次引用默认物化；外层强过滤</text><text x=\"842\" y=\"68\" class=\"sv s\" text-anchor=\"start\" font-size=\"12\" fill=\"#46585F\" font-weight=\"400\" >CTE Scan 上 Rows Removed by Filter；temp written 上升</text><text x=\"1362\" y=\"68\" class=\"sv mono\" text-anchor=\"end\" font-size=\"9.5\" fill=\"#89938F\" font-weight=\"600\" >01</text><rect x=\"20\" y=\"106\" width=\"1360\" height=\"64\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"20\" y=\"106\" width=\"4\" height=\"64\" rx=\"2\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"40\" y=\"144\" class=\"sv s\" text-anchor=\"start\" font-size=\"14\" fill=\"#BE653B\" font-weight=\"600\" >谓词下推被挡住</text><text x=\"372\" y=\"144\" class=\"sv s\" text-anchor=\"start\" font-size=\"12\" fill=\"#46585F\" font-weight=\"400\" >外层条件进不到 CTE 内部</text><text x=\"842\" y=\"144\" class=\"sv s\" text-anchor=\"start\" font-size=\"12\" fill=\"#46585F\" font-weight=\"400\" >底层表停在 Seq Scan，Index Cond 消失</text><text x=\"1362\" y=\"144\" class=\"sv mono\" text-anchor=\"end\" font-size=\"9.5\" fill=\"#89938F\" font-weight=\"600\" >02</text><rect x=\"20\" y=\"182\" width=\"1360\" height=\"64\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"20\" y=\"182\" width=\"4\" height=\"64\" rx=\"2\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"40\" y=\"220\" class=\"sv s\" text-anchor=\"start\" font-size=\"14\" fill=\"#BE653B\" font-weight=\"600\" >重复计算</text><text x=\"372\" y=\"220\" class=\"sv s\" text-anchor=\"start\" font-size=\"12\" fill=\"#46585F\" font-weight=\"400\" >NOT MATERIALIZED 后多次引用昂贵表达式</text><text x=\"842\" y=\"220\" class=\"sv s\" text-anchor=\"start\" font-size=\"12\" fill=\"#46585F\" font-weight=\"400\" >同一子计划出现多次；loops 放大</text><text x=\"1362\" y=\"220\" class=\"sv mono\" text-anchor=\"end\" font-size=\"9.5\" fill=\"#89938F\" font-weight=\"600\" >03</text><rect x=\"20\" y=\"258\" width=\"1360\" height=\"64\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"20\" y=\"258\" width=\"4\" height=\"64\" rx=\"2\" fill=\"#AE8A3E\" stroke=\"#AE8A3E\" stroke-width=\"1\" /><text x=\"40\" y=\"296\" class=\"sv s\" text-anchor=\"start\" font-size=\"14\" fill=\"#AE8A3E\" font-weight=\"600\" >递归项每轮扫描</text><text x=\"372\" y=\"296\" class=\"sv s\" text-anchor=\"start\" font-size=\"12\" fill=\"#46585F\" font-weight=\"400\" >join 侧无索引、扇出大、层数深</text><text x=\"842\" y=\"296\" class=\"sv s\" text-anchor=\"start\" font-size=\"12\" fill=\"#46585F\" font-weight=\"400\" >WorkTable Scan 的 loops 与每轮 actual rows</text><text x=\"1362\" y=\"296\" class=\"sv mono\" text-anchor=\"end\" font-size=\"9.5\" fill=\"#89938F\" font-weight=\"600\" >04</text><rect x=\"20\" y=\"334\" width=\"1360\" height=\"64\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"20\" y=\"334\" width=\"4\" height=\"64\" rx=\"2\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"40\" y=\"372\" class=\"sv s\" text-anchor=\"start\" font-size=\"14\" fill=\"#2F7A66\" font-weight=\"600\" >去重与路径膨胀</text><text x=\"372\" y=\"372\" class=\"sv s\" text-anchor=\"start\" font-size=\"12\" fill=\"#46585F\" font-weight=\"400\" >UNION 宽行去重；path 数组逐轮变长</text><text x=\"842\" y=\"372\" class=\"sv s\" text-anchor=\"start\" font-size=\"12\" fill=\"#46585F\" font-weight=\"400\" >哈希内存压力、行宽增长、排序落盘</text><text x=\"1362\" y=\"372\" class=\"sv mono\" text-anchor=\"end\" font-size=\"9.5\" fill=\"#89938F\" font-weight=\"600\" >05</text><text x=\"20\" y=\"424\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"400\" >五条里只有第 1、3 条是「次数」问题，第 2、4 条是「能不能进得去」问题，第 5 条是「行有多宽」问题。</text></svg>","ctrl":null},{"eyebrow":"第四章 · 对比","title":"五种写法的取舍，落在同一张表上","lede":"默认 CTE、MATERIALIZED、NOT MATERIALIZED、子查询、临时表——差别不在语法，而在「谁来决定执行次数」和「中间结果存在哪」。","caption":"图 11 · 一句话：收益来自命名与可控的执行次数，代价来自可能挡住优化器。","bridge":"递归 CTE 与普通 CTE 的差别更简单，只有两条：是否自引用，终止条件由谁保证。","notes":["这张表的读法不是逐格比较，而是两条轴：横轴是「中间结果存在哪」，纵轴是「执行次数谁说了算」。默认 CTE 站在中间——它让优化器决定，只在需要时才拦一道。","MATERIALIZED 把决定权拿到自己手里：一定算一次、一定存下来。适合内部昂贵、被多次引用，或者你就是要挡住一个坏计划。NOT MATERIALIZED 把决定权完全交出去：可以联合优化、可以下推，但你要接受重复计算。","子查询和临时表是两端的参照物：子查询没有名字，所以可读性差但优化空间大；临时表跨语句复用，但每次写入都要落盘、还要自己维护统计信息。","所以别问「CTE 快不快」，要问「这次我要的是次数可控，还是优化空间」。这两个诉求，对应的是不同的写法。"],"svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20\" y=\"16\" width=\"1360\" height=\"42\" rx=\"0\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"30\" y=\"41.025\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#FFFFFF\" font-weight=\"600\" >维度</text><text x=\"180\" y=\"41.025\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#FFFFFF\" font-weight=\"600\" >默认 CTE</text><text x=\"420\" y=\"41.025\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#FFFFFF\" font-weight=\"600\" >MATERIALIZED</text><text x=\"660\" y=\"41.025\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#FFFFFF\" font-weight=\"600\" >NOT MATERIALIZED</text><text x=\"910\" y=\"41.025\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#FFFFFF\" font-weight=\"600\" >子查询 / 派生表</text><text x=\"1145\" y=\"41.025\" class=\"sv s\" text-anchor=\"start\" n 条件","lede":"每一轮都要用上一轮的 id 找下一批行。有索引是按行数点查，没有索引是每轮重扫全表；层级越深，差距不是线性，是逐轮放大。","caption":"图 12 · 对数刻度。有索引的曲线随轮次缓慢抬头，无索引是一条水平高墙——墙的位置就是表的行数。","bridge":"但「有没有索引」只是症状之一。要把判断坐实，还得回到 EXPLAIN 上读几个数字。","notes":["递归查询变慢，第一嫌疑不是参数，是递归项的 join 条件。因为每一轮都要拿上一轮的行去找下一批行，这个动作重复的次数等于层数。","有索引时，每轮的代价大致正比于「这轮要扩展多少行」，也就是扇出的幂次，增长是指数的但基数小；没有索引时，每轮的代价直接等于表的行数，跟这轮需要多少行完全无关——哪怕你只要 3 个子节点，也要把一百万行读一遍。","所以深度每加一层，差距就乘一次。这也是为什么示例里那句 CREATE INDEX ON department(parent_department)，比 WITH RECURSIVE 的写法重要得多。","但要提醒一句：这张图是对数刻度、是示意模型。真实的放大倍数取决于缓存命中、页数、扇出分布，只有 EXPLAIN (ANALYZE, BUFFERS) 能告诉你。"],"svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><text x=\"30\" y=\"26\" class=\"sv s\" text-anchor=\"start\" font-size=\"12\" fill=\"#89938F\" font-weight=\"600\" >每轮递归项要检查的行数（对数刻度）</text><line x1=\"88\" y1=\"350.0\" x2=\"900\" y2=\"350.0\" stroke=\"#D9D5CB\" stroke-width=\"0.7\"/><text x=\"80\" y=\"354.0\" class=\"sv mono\" text-anchor=\"end\" font-size=\"9.5\" fill=\"#89938F\" font-weight=\"400\" >1</text><line x1=\"88\" y1=\"307.14285714285717\" x2=\"900\" y2=\"307.14285714285717\" stroke=\"#D9D5CB\" stroke-width=\"0.7\" stroke-dasharray=\"2 3\"/><text x=\"80\" y=\"311.14285714285717\" class=\"sv mono\" text-anchor=\"end\" font-size=\"9.5\" fill=\"#89938F\" font-weight=\"400\" >10^1</text><line x1=\"88\" y1=\"264.2857142857143\" x2=\"900\" y2=\"264.2857142857143\" stroke=\"#D9D5CB\" stroke-width=\"0.7\" stroke-dasharray=\"2 3\"/><text x=\"80\" y=\"268.2857142857143\" class=\"sv mono\" text-anchor=\"end\" font-size=\"9.5\" fill=\"#89938F\" font-weight=\"400\" >10^2</text><line x1=\"88\" y1=\"221.42857142857144\" x2=\"900\" y2=\"221.42857142857144\" stroke=\"#D9D5CB\" stroke-width=\"0.7\" stroke-dasharray=\"2 3\"/><text x=\"80\" y=\"225.42857142857144\" class=\"sv mono\" text-anchor=\"end\" font-size=\"9.5\" fill=\"#89938F\" font-weight=\"400\" >10^3</text><line x1=\"88\" y1=\"178.57142857142858\" x2=\"900\" y2=\"178.57142857142858\" stroke=\
