ize=\"9.5\" fill=\"#BE653B\" opacity=\"0.95\">1,000,000</text><rect x=\"650\" y=\"20\" width=\"12\" height=\"12\" rx=\"2\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"0\" /><text x=\"668\" y=\"30\" class=\"sv s\" text-anchor=\"start\" font-size=\"10.5\" fill=\"#46585F\" font-weight=\"400\" >有索引：按上一轮的行数点查</text><rect x=\"650\" y=\"42\" width=\"12\" height=\"12\" rx=\"2\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"0\" /><text x=\"668\" y=\"52\" class=\"sv s\" text-anchor=\"start\" font-size=\"10.5\" fill=\"#46585F\" font-weight=\"400\" >无索引：每轮全表重扫</text><line x1=\"940\" y1=\"20\" x2=\"940\" y2=\"400\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"966\" y=\"40\" class=\"sv s\" text-anchor=\"start\" font-size=\"12\" fill=\"#245A6B\" font-weight=\"600\" >累计读取行数</text><rect x=\"966\" y=\"62\" width=\"400\" height=\"74\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"984\" y=\"88\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"500\" >有索引</text><text id=\"cumI\" x=\"1348\" y=\"114\" class=\"sv mono\" text-anchor=\"end\" font-size=\"26\" fill=\"#2F7A66\" font-weight=\"700\">—</text><rect x=\"966\" y=\"152\" width=\"400\" height=\"74\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"984\" y=\"178\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"500\" >无索引</text><text id=\"cumS\" x=\"1348\" y=\"204\" class=\"sv mono\" text-anchor=\"end\" font-size=\"26\" fill=\"#BE653B\" font-weight=\"700\">—</text><rect x=\"966\" y=\"242\" width=\"400\" height=\"74\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\" /><text x=\"984\" y=\"268\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"500\" >相差</text><text id=\"ratio\" x=\"1348\" y=\"294\" class=\"sv mono\" text-anchor=\"end\" font-size=\"26\" fill=\"#245A6B\" font-weight=\"700\">—</text><text x=\"966\" y=\"340\" class=\"sv s\" text-anchor=\"start\" font-size=\"10.5\" fill=\"#89938F\" font-weight=\"400\" >示意模型：表 1,000,000 行、扇出 6，</text><text x=\"966\" y=\"358\" class=\"sv s\" text-anchor=\"start\" font-size=\"10.5\" fill=\"#89938F\" font-weight=\"400\" >只说明放大形状，不代表任何实测。</text><text x=\"966\" y=\"386\" class=\"sv s\" text-anchor=\"start\" font-size=\"10.5\" fill=\"#245A6B\" font-weight=\"500\" >真实数字请用 EXPLAIN (ANALYZE, BUFFERS)。</text></svg>","ctrl":"<span class=\"cl\">递归深度</span><input type=\"range\" id=\"scanRange\" min=\"1\" max=\"5\" step=\"1\" value=\"3\"><span class=\"cl\" id=\"scanDepthOut\">3 层</span><button class=\"btn play\" id=\"scanPlay\">▶ 播放</button><button class=\"btn\" id=\"scanTick\">单步 ▸</button><button class=\"btn\" id=\"scanReset\">重置 ↺</button><span class=\"out\" id=\"scanOut\"></span>"},{"eyebrow":"第五章 · 实证","title":"判断对不对，看计划里这几行","lede":"有没有 CTE Scan、条件有没有进到底层扫描、有没有 temp read/written、actual rows 与估算差多少。递归还要多看 loops 与 WorkTable Scan。","caption":"图 13 · 计划是唯一的裁判：同一段 SQL，在内联与物化下会给出完全不同的两棵树。","bridge":"会读计划之后，那些常年被复述的经验，就可以重新检查一遍了。","notes":["判断要落到计划上，四个观察点就够了。第一，有没有 CTE Scan：有，说明物化真的发生了，围栏建起来了；没有，说明它被折叠进了父查询。","第二，条件有没有进到底层表扫描：如果 Index Cond 出现在 department 上，说明下推成功；如果只有 CteScan 上面挂一个 Filter，说明被围栏挡住了。第三，Buffers 里有没有 temp read 或 temp written：有，就是 tuplestore 落盘了。","第四个是递归专属的：看 Hash Join 或 WorkTable Scan 的 loops。loops 就是轮数，actual rows 乘以 loops 才是这一层真正处理的行数。很多人只看单行数字，以为只有 5 行，其实是 4 轮各处理了一遍。","这四眼看下来，一个 CTE 到底是帮手还是累赘，基本就有结论了。"],"svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20\" y=\"22\" width=\"700\" height=\"336\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"38\" y=\"38\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"400\" >-- 计划片段示意（按文中 department 示例推演）</text><text x=\"38\" y=\"81\" class=\"sv mono\" font-size=\"12.5\" fill=\"#89938F\" xml:space=\"preserve\">EXPLAIN (ANALYZE, BUFFERS)</text><text x=\"38\" y=\"104\" class=\"sv mono\" font-size=\"12.5\" fill=\"#89938F\" xml:space=\"preserve\">WITH RECURSIVE sub AS ( ... )</text><text x=\"38\" y=\"127\" class=\"sv mono\" font-size=\"12.5\" fill=\"#89938F\" xml:space=\"preserve\">SELECT * FROM sub;</text><text x=\"38\" y=\"150\" class=\"sv mono\" font-size=\"12.5\" fill=\"#89938F\" xml:space=\"preserve\"></text><text x=\"38\" y=\"173\" class=\"sv mono\" font-size=\"12.5\" fill=\"#245A6B\" xml:space=\"preserve\">Recursive Union  (actual rows=5 loops=1)</text><text x=\"38\" y=\"196\" class=\"sv mono\" font-size=\"12.5\" fill=\"#46585F\" xml:space=\"preserve\">  -&gt;  Seq Scan on department</text><text x=\"38\" y=\"219\" class=\"sv mono\" font-size=\"12.5\" fill=\"#BE653B\" xml:space=\"preserve\">  -&gt;  Hash Join  (actual rows=1 loops=4)</text><text x=\"38\" y=\"242\" class=\"sv mono\" font-size=\"12.5\" fill=\"#46585F\" xml:space=\"preserve\">        Hash Cond: (d.parent_department = sd.id)</text><text x=\"38\" y=\"265\" class=\"sv mono\" font-size=\"12.5\" fill=\"#BE653B\" xml:space=\"preserve\">        -&gt;  Seq Scan on department d  (rows=8 loops=4)</text><text x=\"38\" y=\"288\" class=\"sv mono\" font-size=\"12.5\" fill=\"#245A6B\" xml:space=\"preserve\">        -&gt;  WorkTable Scan on sub  (rows=1 loops=4)</text><text x=\"38\" y=\"311\" class=\"sv mono\" font-size=\"12.5\" fill=\"#46585F\" xml:space=\"preserve\">              Filter: NOT (d.id = ANY(path))</text><text x=\"38\" y=\"334\" class=\"sv mono\" font-size=\"12.5\" fill=\"#89938F\" xml:space=\"preserve\">Execution Time: 0.xxx ms</text><line x1=\"722\" y1=\"169\" x2=\"754\" y2=\"169\" stroke=\"#7BA6AF\" stroke-width=\"1.0\"/><circle cx=\"758\" cy=\"169\" r=\"2.4\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"0\" /><text x=\"768\" y=\"173\" class=\"sv s\" text-anchor=\"start\" font-size=\"13\" fill=\"#245A6B\" font-weight=\"600\" >Recursive Union</text><text x=\"768\" y=\"193\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >outer 是种子，inner 是递归项；迭代器本体</text><line x1=\"722\" y1=\"215\" x2=\"754\" y2=\"215\" stroke=\"#7BA6AF\" stroke-width=\"1.0\"/><circle cx=\"758\" cy=\"215\" r=\"2.4\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"0\" /><text x=\"768\" y=\"219\" class=\"sv s\" text-anchor=\"start\" font-size=\"13\" fill=\"#245A6B\" font-weight=\"600\" >loops=4</text><text x=\"768\" y=\"239\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >递归项真正跑了几轮，这个数字才是深度</text><line x1=\"722\" y1=\"284\" x2=\"754\" y2=\"284\" stroke=\"#7BA6AF\" stroke-width=\"1.0\"/><circle cx=\"758\" cy=\"284\" r=\"2.4\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"0\" /><text x=\"768\" y=\"288\" class=\"sv s\" text-anchor=\"start\" font-size=\"13\" fill=\"#245A6B\" font-weight=\"600\" >WorkTable Scan</text><text x=\"768\" y=\"308\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >读 working 表：rows 1 × loops 4 = 5 行，没有 IO</text><rect x=\"20\" y=\"370\" width=\"700\" height=\"46\" rx=\"3\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1.0\" /><text x=\"38\" y=\"390\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#A9552F\" font-weight=\"600\" >递归项那一侧出现 Seq Scan on department d</text><text x=\"38\" y=\"408\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#A9552F\" font-weight=\"400\" >→ 说明每轮都在全表找子节点，先补索引再看参数。</text><line x1=\"760\" y1=\"330\" x2=\"760\" y2=\"400\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"776\" y=\"346\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#245A6B\" font-weight=\"600\" >再看一眼物化的痕迹</text><text x=\"776\" y=\"366\" class=\"sv s\" text-anchor=\"start\" font-size=\"11\" fill=\"#46585F\" font-weight=\"400\" >出现 CTE Scan → 围栏真的建起来了</text><text x=\"776\" y=\"386\" class=\"sv s\" text-anchor=\"start\" font-size=\"11\" fill=\"#46585F\" font-weight=\"400\" >Buffers 里有 temp read / written → 落盘</text></svg>","ctrl":null},{"eyebrow":"第六章 · 反模式","title":"坑看着很多，其实只有四类","lede":"把 CTE 当性能关键字、把 NOT MATERIALIZED 当免费加速、以为 UNION 一定防环、以为输出有天然顺序——四类错，各有各的判据。","caption":"图 14 · 每个坑都可以用一句「你想保证什么」拆开：算一次、能下推、能终止、还是顺序稳定。","bridge":"把这四类错翻过来，就是三类角色各自的行动清单。","notes":["常见坑看着有十个，其实只有四类。第一类是语义误判：以为 WITH 天然更快，以为 NOT MATERIALIZED 是免费加速。实际上前者取决于计划形态，后者在多次引用时会把昂贵表达式算很多遍；而 NOT MATERIALIZED 遇到 volatile 函数或非纯 SELECT，会被直接忽略。","第二类是计划误判：大结果 CTE 被外层强过滤，或者忽略了 PG 12 前后的默认差异。第三类是递归误判：没有终止条件、join 侧缺索引、path 数组无限变宽。第四类是工程想当然：依赖输出顺序、多个 DML CTE 改同一行、指望外层 LIMIT 兜住无限递归。","关于 LIMIT 这一条要说清楚：文档提到它可以在测试时用来防止无限循环，但排序或 join 可能迫使上层把结果全部拉完，所以它不能当生产方案。递归的收敛，必须由深度上限、叶子条件或 CYCLE 之一来保证。"],"svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40\" y=\"24\" width=\"650\" height=\"178\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"40\" y=\"24\" width=\"3\" height=\"178\" rx=\"0\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"1\" /><text x=\"62\" y=\"52\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11\" fill=\"#BE653B\" font-weight=\"700\" >语义坑</text><text x=\"62\" y=\"78\" class=\"sv serif\" text-anchor=\"start\" font-size=\"18\" fill=\"#1B2B33\" font-weight=\"700\" >把 CTE 当性能关键字</text><circle cx=\"68\" cy=\"106\" r=\"2.2\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"0\" /><text x=\"82\" y=\"110\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >以为 WITH 一定比子查询快</text><circle cx=\"68\" cy=\"130\" r=\"2.2\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"0\" /><text x=\"82\" y=\"134\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >以为 NOT MATERIALIZED 是免费加速</text><circle cx=\"68\" cy=\"154\" r=\"2.2\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"0\" /><text x=\"82\" y=\"158\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >以为 UNION 一定能防住环</text><circle cx=\"68\" cy=\"178\" r=\"2.2\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"0\" /><text x=\"82\" y=\"182\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >以为 SEARCH 能控制访问顺序</text><rect x=\"710\" y=\"24\" width=\"650\" height=\"178\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"710\" y=\"24\" width=\"3\" height=\"178\" rx=\"0\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"732\" y=\"52\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11\" fill=\"#245A6B\" font-weight=\"700\" >计划坑</text><text x=\"732\" y=\"78\" class=\"sv serif\" text-anchor=\"start\" font-size=\"18\" fill=\"#1B2B33\" font-weight=\"700\" >围栏与重复计算</text><circle cx=\"738\" cy=\"106\" r=\"2.2\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"0\" /><text x=\"752\" y=\"110\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >大结果 CTE 被外层强过滤</text><circle cx=\"738\" cy=\"130\" r=\"2.2\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"0\" /><text x=\"752\" y=\"134\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >昂贵函数被多个引用点重复算</text><circle cx=\"738\" cy=\"154\" r=\"2.2\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"0\" /><text x=\"752\" y=\"158\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >多次引用大 CTE 导致全量物化</text><circle cx=\"738\" cy=\"178\" r=\"2.2\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"0\" /><text x=\"752\" y=\"182\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >忽略 PG 12 前后的默认差异</text><rect x=\"40\" y=\"210\" width=\"650\" height=\"178\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"40\" y=\"210\" width=\"3\" height=\"178\" rx=\"0\" fill=\"#AE8A3E\" stroke=\"#AE8A3E\" stroke-width=\"1\" /><text x=\"62\" y=\"238\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11\" fill=\"#AE8A3E\" font-weight=\"700\" >递归坑</text><text x=\"62\" y=\"264\" class=\"sv serif\" text-anchor=\"start\" font-size=\"18\" fill=\"#1B2B33\" font-weight=\"700\" >不收敛与逐轮放大</text><circle cx=\"68\" cy=\"292\" r=\"2.2\" fill=\"#AE8A3E\" stroke=\"#AE8A3E\" stroke-width=\"0\" /><text x=\"82\" y=\"296\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >没有终止条件、没有深度上限</text><circle cx=\"68\" cy=\"316\" r=\"2.2\" fill=\"#AE8A3E\" stroke=\"#AE8A3E\" stroke-width=\"0\" /><text x=\"82\" y=\"320\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >递归项 join 侧缺索引</text><circle cx=\"68\" cy=\"340\" r=\"2.2\" fill=\"#AE8A3E\" stroke=\"#AE8A3E\" stroke-width=\"0\" /><text x=\"82\" y=\"344\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >path 数组让行逐轮变宽</text><circle cx=\"68\" cy=\"364\" r=\"2.2\" fill=\"#AE8A3E\" stroke=\"#AE8A3E\" stroke-width=\"0\" /><text x=\"82\" y=\"368\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >把 UNION 当去环的万能药</text><rect x=\"710\" y=\"210\" width=\"650\" height=\"178\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"710\" y=\"210\" width=\"3\" height=\"178\" rx=\"0\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"732\" y=\"238\" class=\"sv mono\" text-anchor=\"start\" font-size=\"11\" fill=\"#2F7A66\" font-weight=\"700\" >工程坑</text><text x=\"732\" y=\"264\" class=\"sv serif\" text-anchor=\"start\" font-size=\"18\" fill=\"#1B2B33\" font-weight=\"700\" >顺序与语义的想当然</text><circle cx=\"738\" cy=\"292\" r=\"2.2\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"0\" /><text x=\"752\" y=\"296\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >依赖递归输出的天然顺序</text><circle cx=\"738\" cy=\"316\" r=\"2.2\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"0\" /><text x=\"752\" y=\"320\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >多个 DML CTE 改同一行</text><circle cx=\"738\" cy=\"340\" r=\"2.2\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"0\" /><text x=\"752\" y=\"344\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >指望外层 LIMIT 兜住无限递归</text><circle cx=\"738\" cy=\"364\" r=\"2.2\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"0\" /><text x=\"752\" y=\"368\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >误以为递归 DML 可以自引用</text><text x=\"40\" y=\"418\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"400\" >每个坑都能用同一句话拆开：你真正想保证的，是算一次、能下推、能终止，还是顺序稳定？</text></svg>","ctrl":null},{"eyebrow":"第七章 · 落地","title":"架构师定模型，DBA 定边界，开发者定写法","lede":"同一件事分三层：结构上要不要换模型、运维上要不要设超时、写法上要不要显式物化。混在一起谈，问题就没有答案。","caption":"图 15 · 分工的意义：模型错了，写法救不回来；写法错了，模型再好也跑不动。","bridge":"最后，把整场推理压成一张选择图：从目标出发，不从语法出发。","notes":["落地要分工，不然讨论会失焦。架构师负责模型：树的访问方向是 parent 到 child 还是反过来，两个方向要不要各建一套索引，超大规模深遍历要不要换闭包表、路径枚举或者 ltree。这些决定的是上限。","DBA 负责边界：用 EXPLAIN 看每轮的 loops 和行数，盯临时文件读写，给可能失控的语句挂 statement_timeout。注意顺序——先补索引，再谈参数；参数救不了全表扫描。","开发者负责写法：CTE 名字写业务阶段，不要写 t1、t2；先写默认行为，计划不好再显式加关键词；递归一定写终止条件，需要顺序就自己 ORDER BY。这三层各管一段，出了问题也容易定位。"],"svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"20\" y=\"20\" width=\"1360\" height=\"112\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"20\" y=\"20\" width=\"4\" height=\"112\" rx=\"0\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"46\" y=\"64\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19\" fill=\"#245A6B\" font-weight=\"700\" >架构师</text><text x=\"46\" y=\"88\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"400\" >定模型</text><text x=\"224\" y=\"52\" class=\"sv s\" text-anchor=\"start\" font-size=\"12\" fill=\"#245A6B\" font-weight=\"700\" >·</text><text x=\"240\" y=\"52\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >层级与图模型写清访问方向，正反各建索引</text><text x=\"224\" y=\"74\" class=\"sv s\" text-anchor=\"start\" font-size=\"12\" fill=\"#245A6B\" font-weight=\"700\" >·</text><text x=\"240\" y=\"74\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >高频深遍历评估闭包表 / 路径枚举 / ltree</text><text x=\"224\" y=\"96\" class=\"sv s\" text-anchor=\"start\" font-size=\"12\" fill=\"#245A6B\" font-weight=\"700\" >·</text><text x=\"240\" y=\"96\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >把最大深度、最大行数写成业务约束</text><text x=\"224\" y=\"118\" class=\"sv s\" text-anchor=\"start\" font-size=\"12\" fill=\"#245A6B\" font-weight=\"700\" >·</text><text x=\"240\" y=\"118\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >跨版本迁移先确认 PG 12 前后的默认差异</text><rect x=\"900\" y=\"48\" width=\"460\" height=\"56\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"900\" y=\"48\" width=\"3\" height=\"56\" rx=\"0\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"930\" y=\"82\" class=\"sv mono\" text-anchor=\"start\" font-size=\"9.5\" fill=\"#89938F\" font-weight=\"400\" >判据</text><text x=\"1150\" y=\"82\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"600\" >模型决定上限</text><rect x=\"20\" y=\"148\" width=\"1360\" height=\"112\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"20\" y=\"148\" width=\"4\" height=\"112\" rx=\"0\" fill=\"#AE8A3E\" stroke=\"#AE8A3E\" stroke-width=\"1\" /><text x=\"46\" y=\"192\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19\" fill=\"#AE8A3E\" font-weight=\"700\" >DBA</text><text x=\"46\" y=\"216\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"400\" >定边界</text><text x=\"224\" y=\"180\" class=\"sv s\" text-anchor=\"start\" font-size=\"12\" fill=\"#AE8A3E\" font-weight=\"700\" >·</text><text x=\"240\" y=\"180\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >EXPLAIN (ANALYZE, BUFFERS) 看每轮 loops 与行数</text><text x=\"224\" y=\"202\" class=\"sv s\" text-anchor=\"start\" font-size=\"12\" fill=\"#AE8A3E\" font-weight=\"700\" >·</text><text x=\"240\" y=\"202\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >盯 temp 读写：物化、排序、哈希去重都会落盘</text><text x=\"224\" y=\"224\" class=\"sv s\" text-anchor=\"start\" font-size=\"12\" fill=\"#AE8A3E\" font-weight=\"700\" >·</text><text x=\"240\" y=\"224\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >statement_timeout 兜底，先补索引再谈参数</text><text x=\"224\" y=\"246\" class=\"sv s\" text-anchor=\"start\" font-size=\"12\" fill=\"#AE8A3E\" font-weight=\"700\" >·</text><text x=\"240\" y=\"246\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >对 UNION 递归确认去重列的宽度与基数</text><rect x=\"900\" y=\"176\" width=\"460\" height=\"56\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"900\" y=\"176\" width=\"3\" height=\"56\" rx=\"0\" fill=\"#AE8A3E\" stroke=\"#AE8A3E\" stroke-width=\"1\" /><text x=\"930\" y=\"210\" class=\"sv mono\" text-anchor=\"start\" font-size=\"9.5\" fill=\"#89938F\" font-weight=\"400\" >判据</text><text x=\"1150\" y=\"210\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#AE8A3E\" font-weight=\"600\" >边界决定下限</text><rect x=\"20\" y=\"276\" width=\"1360\" height=\"112\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"20\" y=\"276\" width=\"4\" height=\"112\" rx=\"0\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"46\" y=\"320\" class=\"sv serif\" text-anchor=\"start\" font-size=\"19\" fill=\"#2F7A66\" font-weight=\"700\" >开发者</text><text x=\"46\" y=\"344\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"400\" >定写法</text><text x=\"224\" y=\"308\" class=\"sv s\" text-anchor=\"start\" font-size=\"12\" fill=\"#2F7A66\" font-weight=\"700\" >·</text><text x=\"240\" y=\"308\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >CTE 名写业务阶段：candidate_users 而不是 t1</text><text x=\"224\" y=\"330\" class=\"sv s\" text-anchor=\"start\" font-size=\"12\" fill=\"#2F7A66\" font-weight=\"700\" >·</text><text x=\"240\" y=\"330\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >先写默认；计划不好再显式 MATERIALIZED</text><text x=\"224\" y=\"352\" class=\"sv s\" text-anchor=\"start\" font-size=\"12\" fill=\"#2F7A66\" font-weight=\"700\" >·</text><text x=\"240\" y=\"352\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >递归必写终止条件；要顺序就外层 ORDER BY</text><text x=\"224\" y=\"374\" class=\"sv s\" text-anchor=\"start\" font-size=\"12\" fill=\"#2F7A66\" font-weight=\"700\" >·</text><text x=\"240\" y=\"374\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" >SEARCH 只管展示顺序，稳定顺序仍靠 ORDER BY</text><rect x=\"900\" y=\"304\" width=\"460\" height=\"56\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"900\" y=\"304\" width=\"3\" height=\"56\" rx=\"0\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"930\" y=\"338\" class=\"sv mono\" text-anchor=\"start\" font-size=\"9.5\" fill=\"#89938F\" font-weight=\"400\" >判据</text><text x=\"1150\" y=\"338\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#2F7A66\" font-weight=\"600\" >写法决定能不能落地</text><text x=\"20\" y=\"424\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"400\" >混在一起谈，就会变成「CTE 到底快不快」这种没有答案的问题；拆开谈，每一层都有可验证的动作。</text></svg>","ctrl":null},{"eyebrow":"第八章 · 收束","title":"从目标出发，而不是从语法出发","lede":"只想拆 SQL → 普通 CTE 或子查询；要下推 → NOT MATERIALIZED；要只算一次或挡住坏计划 → MATERIALIZED；要逐层扩展 → WITH RECURSIVE。","caption":"图 16 · 这张图的读法是反向的：先说你要什么，再说你写什么。","bridge":"于是回到最初那句话：CTE 不是语法糖，是一份关于「执行边界」的声明。","notes":["把前面所有推理压成一张图，只有四个出口。第一个出口：你只是想把 SQL 拆开、让人看得懂，那就用默认 CTE 或普通子查询，PG 12 以后它不会惩罚你。","第二个出口：你明确要谓词下推、要联合优化，那就写 NOT MATERIALIZED，同时接受昂贵表达式可能被算多遍。第三个出口：你要保证只算一次，或者你就是要挡住一个反复出现的坏计划，那就写 MATERIALIZED，接受围栏。","第四个出口：问题是逐层扩展，那就进 WITH RECURSIVE，但进门之前先准备好三样东西——终止条件、递归项 join 侧上的索引、以及一个写进业务规则的深度上限。","这张图的读法是反向的：不是看语法选写法，而是先说清楚你要什么，再决定写什么。"],"svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"560\" y=\"16\" width=\"280\" height=\"58\" rx=\"4\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.1\" /><text x=\"700.0\" y=\"50.6\" class=\"sv s\" text-anchor=\"middle\" font-size=\"16\" fill=\"#245A6B\" font-weight=\"600\" >你的目标是什么？</text><polyline points=\"700,74 700,116\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"1.4\" stroke-linejoin=\"miter\"/><line x1=\"170\" y1=\"116\" x2=\"1250\" y2=\"116\" stroke=\"#245A6B\" stroke-width=\"1.4\"/><line x1=\"170\" y1=\"116\" x2=\"170\" y2=\"144.4\" stroke=\"#245A6B\" stroke-width=\"1.4\"/><polygon points=\"170,150 166.15,143 173.85,143\" fill=\"#245A6B\"/><rect x=\"20\" y=\"150\" width=\"300\" height=\"146\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"20\" y=\"150\" width=\"300\" height=\"3\" rx=\"0\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"1\" /><text x=\"170\" y=\"186\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"600\" >只想拆 SQL</text><text x=\"170\" y=\"214\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"15\" fill=\"#245A6B\" font-weight=\"700\" >普通 CTE 或子查询</text><rect x=\"110\" y=\"228\" width=\"120\" height=\"24\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"170.0\" y=\"243.675\" class=\"sv s\" text-anchor=\"middle\" font-size=\"10.5\ 90\" y=\"214\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"15\" fill=\"#BE653B\" font-weight=\"700\" >MATERIALIZED</text><rect x=\"830\" y=\"228\" width=\"120\" height=\"24\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#BE653B\" stroke-width=\"1.0\" /><text x=\"890.0\" y=\"243.675\" class=\"sv s\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#BE653B\" font-weight=\"500\" >接受围栏</text><line x1=\"764\" y1=\"268\" x2=\"1016\" y2=\"268\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"890\" y=\"286\" class=\"sv s\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#89938F\" font-weight=\"400\" >风险：外层过滤进不去</text><line x1=\"1250\" y1=\"116\" x2=\"1250\" y2=\"144.4\" stroke=\"#2F7A66\" stroke-width=\"1.4\"/><polygon points=\"1250,150 1246.15,143 1253.85,143\" fill=\"#2F7A66\"/><rect x=\"1100\" y=\"150\" width=\"300\" height=\"146\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><rect x=\"1100\" y=\"150\" width=\"300\" height=\"3\" rx=\"0\" fill=\"#2F7A66\" stroke=\"#2F7A66\" stroke-width=\"1\" /><text x=\"1250\" y=\"186\" class=\"sv s\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"600\" >要逐层扩展</text><text x=\"1250\" y=\"214\" class=\"sv mono\" text-anchor=\"middle\" font-size=\"15\" fill=\"#2F7A66\" font-weight=\"700\" >WITH RECURSIVE</text><rect x=\"1190\" y=\"228\" width=\"120\" height=\"24\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#2F7A66\" stroke-width=\"1.0\" /><text x=\"1250.0\" y=\"243.675\" class=\"sv s\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#2F7A66\" font-weight=\"500\" >先建索引</text><line x1=\"1124\" y1=\"268\" x2=\"1376\" y2=\"268\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1250\" y=\"286\" class=\"sv s\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#89938F\" font-weight=\"400\" >风险：不收敛 / 每轮全表</text><rect x=\"20\" y=\"330\" width=\"1360\" height=\"62\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"40\" y=\"354\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#2F7A66\" font-weight=\"700\" >递归那一支还要多问三句</text><text x=\"40\" y=\"376\" class=\"sv s\" text-anchor=\"start\" font-size=\"12\" fill=\"#46585F\" font-weight=\"400\" >终止条件写了吗？　join 侧有索引吗？　深度上限是业务规则还是技术兜底？</text><text x=\"20\" y=\"420\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"400\" >读法是反向的：先说你要什么，再说你写什么。写完之后，仍然要用 EXPLAIN 验证一次。</text></svg>","ctrl":null},{"eyebrow":"尾声","title":"每一个 WITH，都在回答「算几次、在哪算、何时停」","lede":"命名给你可验证的段，围栏给你可控的次数。写之前先问三句，写完再用 EXPLAIN 验一次。","caption":"图 17 · 三问过一遍，绝大多数「CTE 到底快不快」的争论都会自己消失。","bridge":"下一节走进真实计划：从 Recursive Union 一直读到 WorkTable Scan。","notes":["收个尾。CTE 不神秘，它只是把两个决定显式化了：算几次，在哪算。普通 CTE 让你决定这两件事由谁说了算，递归 CTE 再加上第三个决定：什么时候停。","所以写之前问三句就够了。这句中间结果会被引用几次？一次就让它内联，多次就想清楚要不要真的物化。外层过滤能不能进得去？要进去就 NOT MATERIALIZED，要挡住就 MATERIALIZED。递归靠什么收敛？深度上限、叶子条件、CYCLE，至少选一个，而且最好写进业务约束里。","写完再跑一次 EXPLAIN。计划不会说谎：它告诉你围栏建没建、下推成没成、递归跑了几轮。这三个问题对上答案，这一节就真正拿到了。","下一节我们把这条判断链放到真实的执行计划上，逐行对一遍——从 Recursive Union 一直读到 WorkTable Scan。"],"svg":"<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\" ><rect x=\"40\" y=\"26\" width=\"470\" height=\"88\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"64\" y=\"58\" class=\"sv mono\" text-anchor=\"start\" font-size=\"10\" fill=\"#BE653B\" font-weight=\"600\" >01</text><text x=\"92\" y=\"62\" class=\"sv serif\" text-anchor=\"start\" font-size=\"15\" fill=\"#1B2B33\" font-weight=\"600\" >这句中间结果，会被引用几次？</text><text x=\"92\" y=\"88\" class=\"sv mono\" text-anchor=\"start\" font-size=\"10.5\" fill=\"#89938F\" font-weight=\"400\" >关于 次数</text><line x1=\"510\" y1=\"70\" x2=\"553.6\" y2=\"70\" stroke=\"#245A6B\" stroke-width=\"1.5\"/><polygon points=\"560,70 552,65.6 552,74.4\" fill=\"#245A6B\"/><rect x=\"560\" y=\"26\" width=\"800\" height=\"88\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"584\" y=\"64\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"500\" >一次 → 让它内联；多次 → 想清楚要不要物化</text><text x=\"584\" y=\"90\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"400\" >默认行为在 PG 12 之后不再惩罚单次引用</text><rect x=\"40\" y=\"144\" width=\"470\" height=\"88\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"64\" y=\"176\" class=\"sv mono\" text-anchor=\"start\" font-size=\"10\" fill=\"#BE653B\" font-weight=\"600\" >02</text><text x=\"92\" y=\"180\" class=\"sv serif\" text-anchor=\"start\" font-size=\"15\" fill=\"#1B2B33\" font-weight=\"600\" >外层过滤，能不能进得去？</text><text x=\"92\" y=\"206\" class=\"sv mono\" text-anchor=\"start\" font-size=\"10.5\" fill=\"#89938F\" font-weight=\"400\" >关于 下推</text><line x1=\"510\" y1=\"188\" x2=\"553.6\" y2=\"188\" stroke=\"#245A6B\" stroke-width=\"1.5\"/><polygon points=\"560,188 552,183.6 552,192.4\" fill=\"#245A6B\"/><rect x=\"560\" y=\"144\" width=\"800\" height=\"88\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"584\" y=\"182\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"500\" >要进去 → NOT MATERIALIZED；要挡住 → MATERIALIZED</text><text x=\"584\" y=\"208\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"400\" >关键词是请求不是保证：语义约束优先</text><rect x=\"40\" y=\"262\" width=\"470\" height=\"88\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"64\" y=\"294\" class=\"sv mono\" text-anchor=\"start\" font-size=\"10\" fill=\"#BE653B\" font-weight=\"600\" >03</text><text x=\"92\" y=\"298\" class=\"sv serif\" text-anchor=\"start\" font-size=\"15\" fill=\"#1B2B33\" font-weight=\"600\" >递归靠什么收敛？</text><text x=\"92\" y=\"324\" class=\"sv mono\" text-anchor=\"start\" font-size=\"10.5\" fill=\"#89938F\" font-weight=\"400\" >关于 收敛</text><line x1=\"510\" y1=\"306\" x2=\"553.6\" y2=\"306\" stroke=\"#245A6B\" stroke-width=\"1.5\"/><polygon points=\"560,306 552,301.6 552,310.4\" fill=\"#245A6B\"/><rect x=\"560\" y=\"262\" width=\"800\" height=\"88\" rx=\"3\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1.0\" /><text x=\"584\" y=\"300\" class=\"sv s\" text-anchor=\"start\" font-size=\"13.5\" fill=\"#245A6B\" font-weight=\"500\" >深度上限 / 叶子条件 / CYCLE，至少选一个</text><text x=\"584\" y=\"326\" class=\"sv s\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"400\" >别指望外层 LIMIT 兜住无限递归</text><rect x=\"40\" y=\"372\" width=\"1340\" height=\"44\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1.0\" /><text x=\"60\" y=\"400\" class=\"sv serif\" text-anchor=\"start\" font-size=\"13\" fill=\"#245A6B\" font-weight=\"600\" >每一个 WITH，都在回答同一件事：算几次、在哪算、什么时候停。</text><text x=\"1360\" y=\"400\" class=\"sv s\" text-anchor=\"end\" font-size=\"10.5\" fill=\"#89938F\" font-weight=\"400\" >→ 下一节：把这条链放到真实计划上</text></svg>","ctrl":null}];
const N = D.length;
let cur = 0, autoTimer = null, autoOn = false, railMode = null, fitRaf = 0;

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

/* 等比缩放 + letterbox */
function fit(){
  const vp = $('#viewport');
  const W = vp.clientWidth, H = vp.clientHeight;
  const s = Math.min(W/1600, H/900);
  const st = $('#stage');
  st.style.transform = 'scale(' + s + ')';
  st.style.left = ((W - 1600*s)/2) + 'px';
  st.style.top  = ((H -  900*s)/2) + 'px';
}
function fitAnim(){
  const t0 = performance.now();
  cancelAnimationFrame(fitRaf);
  (function step(){
    fit();
    if(performance.now() - t0 < 420) fitRaf = requestAnimationFrame(step);
  })();
}
window.addEventListener('resize', fit);

function render(){
  $('#slides').innerHTML = D.map((d,i) =>
    '<section class="slide" id="s'+i+'">'
    + '<div class="eyebrow"><span class="num">'+String(i+1).padStart(2,'0')+' / '+String(N).padStart(2,'0')+'</span>'+d.eyebrow+'</div>'
    + '<h1 class="title">'+d.title+'</h1>'
    + '<div class="lede">'+d.lede+'</div>'
    + '<div class="rule"></div>'
    + '<div class="figwrap">'+d.svg+'</div>'
    + (d.ctrl ? '<div class="ctrls">'+d.ctrl+'</div>' : '<div class="caption">'+d.caption+'</div>')
    + '<div class="bridge"><span class="bk">承接 · NEXT</span>'+d.bridge+'</div>'
    + '<div class="footer"><span class="fl">数据库筑基课 · 最佳实践 · CTE 与递归查询</span>'
    + '<span class="fr">'+String(i+1).padStart(2,'0')+' / '+String(N).padStart(2,'0')+'</span></div>'
    + '</section>').join('');
}

function go(i, silent){
  i = Math.max(0, Math.min(N-1, i));
  $$('.slide').forEach((el,k)=>el.classList.toggle('on', k===i));
  cur = i;
  try{ localStorage.setItem('cte-slide', String(i)); }catch(e){}
  $('.pg').textContent = String(i+1).padStart(2,'0') + ' / ' + String(N).padStart(2,'0');
  $('#track i').style.width = ((i+1)/N*100)+'%';
  if(!silent) toast('P' + String(i+1).padStart(2,'0') + ' · ' + D[i].eyebrow);
  if(railMode === 'one') paintRailOne();
  else if(railMode === 'all') railScroll(true);
}
function next(){ if(cur<N-1) go(cur+1); else stopAuto(); }
function prev(){ if(cur>0) go(cur-1); }

function toast(s){
  const t=$('#toast'); t.textContent=s; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1600);
}

/* 自动播放 */
function stopAuto(){
  autoOn=false; clearInterval(autoTimer); autoTimer=null;
  const b=$('#btnAuto'); b.textContent='▶ 自动播放'; b.classList.remove('act');
}
function toggleAuto(){
  if(autoOn){ stopAuto(); toast('已暂停自动播放'); return; }
  autoOn=true;
  const b=$('#btnAuto'); b.textContent='❚❚ 暂停自动播放'; b.classList.add('act');
  autoTimer=setInterval(()=>{ if(cur<N-1) go(cur+1); else stopAuto(); }, 13000);
  toast('自动播放：13 秒一页，翻到时右侧讲稿自动跟随');
}

/* ---------- 右侧讲稿栏（页内开窗，非弹窗） ---------- */
function railHTML(){
  if(railMode === 'one'){
    const d = D[cur];
    return '<div class="note act"><div class="nh">P'+String(cur+1).padStart(2,'0')
      +' · '+d.eyebrow+'</div>'
      + d.notes.map(p=>'<p>'+p+'</p>').join('')
      + '<div class="nb">'+d.bridge+'</div></div>';
  }
  return D.map((d,i)=>'<div class="note" id="note-'+i+'"><div class="nh">P'
      +String(i+1).padStart(2,'0')+' · '+d.eyebrow+'</div><h4>'+d.title+'</h4>'
      + d.notes.map(p=>'<p>'+p+'</p>').join('')+'</div>').join('');
}
function railHead(){
  const one = (railMode === 'one');
  $('#railHead').innerHTML =
    '<div class="rk">'+(one ? 'SCRIPT · 本页讲稿' : 'SCRIPT · 全文讲稿')+'</div>'
    + '<h3>'+(one ? D[cur].title : '全文讲述稿 · 共 '+N+' 页')+'</h3>'
    + '<div class="rm">'+(one ? 'P'+String(cur+1).padStart(2,'0')+' / '+String(N).padStart(2,'0')
        : '按当前页高亮　·　翻页自动跟随')+'</div>'
    + '<div class="rail-tools">'
    + '<button id="rOne" class="'+(one?'on':'')+'">本页 N</button>'
    + '<button id="rAll" class="'+(!one?'on':'')+'">全文 T</button>'
    + '<button id="rClose" class="x">关闭 ✕</button></div>';
  $('#rOne').onclick = ()=>openRail('one');
  $('#rAll').onclick = ()=>openRail('all');
  $('#rClose').onclick = ()=>closeRail();
}
function paintRailOne(){
  $('#railBody').innerHTML = railHTML();
  $('#railHead').innerHTML = '';
  railHead();
  $('#railBody').scrollTop = 0;
}
function railScroll(smooth){
  const body = $('#railBody');
  const el = document.getElementById('note-'+cur);
  if(!el) return;
  $$('#railBody .note').forEach(n=>n.classList.remove('act'));
  el.classList.add('act');
  const br = body.getBoundingClientRect(), er = el.getBoundingClientRect();
  const top = body.scrollTop + (er.top - br.top) - 6;
  if(smooth) body.scrollTo({top: top, behavior:'smooth'});
  else body.scrollTop = top;
}
function openRail(mode){
  const wasOpen = !!railMode;
  railMode = mode;
  document.body.classList.add('notes-open', 'rail-one');
  document.body.classList.toggle('rail-one', mode === 'one');
  $('#railHead').innerHTML = ''; railHead();
  $('#railBody').innerHTML = railHTML();
  if(mode === 'one'){ $('#railBody').scrollTop = 0; }
  else { railScroll(false); }
  syncRailBtns();
  if(!wasOpen) fitAnim();          /* 画面矢量缩放到左侧 */
}
function closeRail(){
  railMode = null;
  document.body.classList.remove('notes-open','rail-one');
  syncRailBtns(); fitAnim();
}
function toggleRail(mode){
  if(!railMode) openRail(mode);
  else if(railMode === mode) closeRail();
  else openRail(mode);
}
function syncRailBtns(){
  $('#btnNotes').classList.toggle('act', railMode === 'one');
  $('#btnAll').classList.toggle('act', railMode === 'all');
}

/* ---------- 目录 / 帮助（模态） ---------- */
function closePanel(){ $('#veil').classList.remove('on'); }
function showPanel(inner){
  $('#panel').innerHTML = '<button class="close" onclick="closePanel()">关闭 ✕</button>' + inner;
  $('#veil').classList.add('on');
}
function toc(){
  showPanel('<h2>目录</h2><div class="psub">点击任意一页跳转 · 共 '+N+' 页</div><div class="grid">'
    + D.map((d,i)=>'<a onclick="jump('+i+')"><span class="gn">'+String(i+1).padStart(2,'0')+'</span>'
      +'<span class="gt">'+d.title+'</span></a>').join('') + '</div>');
}
function jump(i){ closePanel(); go(i); }
function help(){
  showPanel('<h2>快捷键</h2><div class="psub">演说时的操作备忘 · 全屏时底部按钮依然可点</div><div class="keys">'
    + '<div><kbd>G</kbd>目录</div><div><kbd>N</kbd>本页讲稿（再按关闭）</div>'
    + '<div><kbd>T</kbd>全文讲稿（再按关闭）</div><div><kbd>P</kbd>自动播放 / 暂停</div>'
    + '<div><kbd>F</kbd>全屏 / 退出</div><div><kbd>→ 空格</kbd>下一页</div>'
    + '<div><kbd>←</kbd>上一页</div><div><kbd>1–9</kbd>直接跳页</div>'
    + '<div><kbd>Home / End</kbd>首页 / 末页</div><div><kbd>Esc</kbd>关闭讲稿或目录</div>'
    + '<div><kbd>?</kbd>本帮助</div><div><kbd>点击底部按钮</kbd>同上</div></div>');
}

/* ---------- 全屏：保留底部按键 ---------- */
function fs(){
  const el = document.documentElement;
  const entering = !document.body.classList.contains('immersive');
  if(entering){
    document.body.classList.add('immersive');
    $('#btnFs').textContent = '退出全屏 F';
    fitAnim();
    toast('全屏：底部按键仍然可用（F 或 Esc 退出）');
    try{
      const pr = el.requestFullscreen ? el.requestFullscreen() : null;
      if(pr && pr.catch) pr.catch(()=>{});
    }catch(e){}
  }else{
    document.body.classList.remove('immersive');
    $('#btnFs').textContent = '全屏 F';
    fitAnim();
    toast('已退出全屏');
    try{ if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen(); }catch(e){}
  }
}
document.addEventListener('fullscreenchange', ()=>{
  const b=$('#btnFs'); if(!b) return;
  if(!document.fullscreenElement && document.body.classList.contains('immersive')){
    document.body.classList.remove('immersive'); b.textContent='全屏 F';
  }
  fitAnim();
});

document.addEventListener('keydown', e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  const k=e.key;
  const typing=(tag==='input'||tag==='select'||tag==='textarea');
  const navKey=(k.indexOf('Arrow')===0||k===' '||k==='Home'||k==='End'||k==='PageUp'||k==='PageDown');
  if(k==='Escape'){
    if(railMode) closeRail();
    else if($('#veil').classList.contains('on')) closePanel();
    else if(document.body.classList.contains('immersive')) fs();
    return;
  }
  if($('#veil').classList.contains('on')) return;
  if(typing && navKey) return;
  if(k==='ArrowRight'||k===' '||k==='PageDown'){ e.preventDefault(); next(); }
  else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); prev(); }
  else if(k==='f'||k==='F'){ e.preventDefault(); fs(); }
  else if(k==='g'||k==='G'){ e.preventDefault(); toc(); }
  else if(k==='n'||k==='N'){ e.preventDefault(); toggleRail('one'); }
  else if(k==='t'||k==='T'){ e.preventDefault(); toggleRail('all'); }
  else if(k==='p'||k==='P'){ e.preventDefault(); toggleAuto(); }
  else if(k==='?'||k==='h'||k==='H'){ e.preventDefault(); help(); }
  else if(k==='Home'){ e.preventDefault(); go(0); }
  else if(k==='End'){ e.preventDefault(); go(N-1); }
  else if(/^[1-9]$/.test(k)){ go(parseInt(k,10)-1); }
});

/* ===== 动画 A：递归 CTE 的迭代求值 ===== */
const ROUNDS = [
  {tag:'种子', w:'{1}',   out:'{1}',   acc:'{1}',         note:'非递归项：name = A', d:'非递归项只跑一次：1 进 working，也进结果流'},
  {tag:'第 1 轮', w:'{1}', out:'{2}',  acc:'{1,2}',       note:'用 1 找子部门', d:'用 working {1} 找到子部门 2'},
  {tag:'第 2 轮', w:'{2}', out:'{3,4}',acc:'{1,2,3,4}',   note:'用 2 找子部门', d:'用 {2} 找到 {3,4}，一行变两行'},
  {tag:'第 3 轮', w:'{3,4}', out:'{6}',acc:'{1,2,3,4,6}', note:'3 无子，4 有 6', d:'3 无子节点，4 产出 6'},
  {tag:'第 4 轮', w:'{6}', out:'∅',   acc:'（停止）',     note:'6 无子，工作表清空', d:'产出为空，迭代结束'}
];
let recStep = 0, recTimer = null, recPlaying = false;
function recPaint(){
  const st = ROUNDS[recStep];
  const setT = (id, v)=>{ const el=document.getElementById(id); if(el) el.textContent=v; };
  setT('rw', st.w); setT('ri', st.out); setT('ra', st.acc); setT('rn', st.note);
  setT('rlbl', recStep === 0 ? '非递归项' : '第 '+recStep+' 轮');
  const out = document.getElementById('recOut');
  if(out) out.innerHTML = '<b>' + st.tag + '</b>　' + st.d;
  for(let i=0;i<ROUNDS.length;i++){
    const g = document.getElementById('rrow'+i);
    if(!g) continue;
    const on = (i === recStep);
    g.setAttribute('fill', on ? '#E5EFF0' : (i%2 ? '#FFFFFF' : '#FCFBF8'));
    const bar = document.getElementById('rbar'+i);
    if(bar) bar.setAttribute('opacity', on ? '1' : '0');
  }
  const gate = document.getElementById('rgate');
  if(gate) gate.setAttribute('fill', recStep === ROUNDS.length-1 ? '#F7E9DE' : '#FFFFFF');
  const gt = document.getElementById('rgatet');
  if(gt) gt.setAttribute('fill', recStep === ROUNDS.length-1 ? '#BE653B' : '#89938F');
  const stop = document.getElementById('rstop');
  if(stop) stop.setAttribute('opacity', recStep === ROUNDS.length-1 ? '1' : '0.25');
}
function recPlay(){
  if(recPlaying){ recPause(); return; }
  recPlaying = true;
  $('#recPlay').textContent='❚❚ 暂停'; $('#recPlay').classList.add('play');
  if(recStep >= ROUNDS.length-1) recStep = 0;
  recTimer = setInterval(()=>{
    recStep++; recPaint();
    if(recStep >= ROUNDS.length-1) recPause();
  }, 1300);
}
function recPause(){
  recPlaying = false; clearInterval(recTimer); recTimer = null;
  const b=$('#recPlay'); if(b){ b.textContent='▶ 播放'; b.classList.remove('play'); }
}
function recTick(){ if(recStep < ROUNDS.length-1){ recStep++; recPaint(); } }
function recReset(){ recPause(); recStep = 0; recPaint(); }

/* ===== 动画 B：递归项每轮扫描量（示意模型） ===== */
const FAN = 6, ROWS_N = 1000000, MAXD = 5;
let scanDepth = 3, scanTimer = null, scanPlaying = false;
function scanRound(k){ return Math.min(ROWS_N, Math.pow(FAN, k)); }   /* 第 k 轮需检查的候选行 */
function scanPaint(){
  let cumI = 0, cumS = 0;
  for(let k=1;k<=MAXD;k++){
    const ri = scanRound(k), rs = ROWS_N;
    if(k <= scanDepth){ cumI += ri; cumS += rs; }
    const on = (k <= scanDepth);
    const bi = document.getElementById('bi'+k), bs = document.getElementById('bs'+k);
    if(bi){
      bi.setAttribute('opacity', on ? '1' : '0.14');
      bi.setAttribute('height', (Math.log10(ri)/7*300).toFixed(1));
      bi.setAttribute('y', (350 - Math.log10(ri)/7*300).toFixed(1));
    }
    if(bs){
      bs.setAttribute('opacity', on ? '1' : '0.14');
      bs.setAttribute('height', (Math.log10(rs)/7*300).toFixed(1));
      bs.setAttribute('y', (350 - Math.log10(rs)/7*300).toFixed(1));
    }
    const gl = document.getElementById('gl'+k);
    if(gl) gl.setAttribute('opacity', on ? '1' : '0.35');
    const vi = document.getElementById('vi'+k), vs = document.getElementById('vs'+k);
    if(vi) vi.setAttribute('opacity', on ? '0.95' : '0.13');
    if(vs) vs.setAttribute('opacity', on ? '0.95' : '0.13');
  }
  const fmt = n => n.toLocaleString('en-US');
  const o1 = document.getElementById('cumI'), o2 = document.getElementById('cumS'), o3 = document.getElementById('ratio');
  if(o1) o1.textContent = fmt(cumI);
  if(o2) o2.textContent = fmt(cumS);
  if(o3) o3.textContent = (cumS/Math.max(cumI,1)).toFixed(0) + '×';
  const d = document.getElementById('scanDepthOut');
  if(d) d.textContent = scanDepth + ' 层';
  const out = document.getElementById('scanOut');
  if(out) out.innerHTML = '示意：表 ' + fmt(ROWS_N) + ' 行、扇出 ' + FAN + '，走到第 <b>' + scanDepth
    + '</b> 层时，有索引累计读 <b>' + fmt(cumI) + '</b> 行，无索引累计读 <b>' + fmt(cumS)
    + '</b> 行';
}
function scanPlay(){
  if(scanPlaying){ scanPause(); return; }
  scanPlaying = true;
  $('#scanPlay').textContent='❚❚ 暂停'; $('#scanPlay').classList.add('play');
  if(scanDepth >= MAXD) scanDepth = 1;
  scanTimer = setInterval(()=>{
    scanDepth++; scanPaint();
    if(scanDepth >= MAXD) scanPause();
  }, 1100);
}
function scanPause(){
  scanPlaying = false; clearInterval(scanTimer); scanTimer = null;
  const b=$('#scanPlay'); if(b){ b.textContent='▶ 播放'; b.classList.remove('play'); }
}
function scanTick(){ if(scanDepth < MAXD){ scanDepth++; scanPaint(); } }
function scanReset(){ scanPause(); scanDepth = 1; scanPaint(); }

/* ---------- 启动 ---------- */
function init(){
  render(); fit();
  let saved = 0;
  try{ saved = parseInt(localStorage.getItem('cte-slide')||'0',10)||0; }catch(e){}
  go(saved, true);
  $('#btnPrev').onclick = prev;  $('#btnNext').onclick = next;
  $('#btnToc').onclick = toc;    $('#btnNotes').onclick = ()=>toggleRail('one');
  $('#btnAll').onclick = ()=>toggleRail('all'); $('#btnAuto').onclick = toggleAuto;
  $('#btnFs').onclick = fs;      $('#btnHelp').onclick = help;
  $('#veil').onclick = e=>{ if(e.target.id==='veil') closePanel(); };
  recPaint(); scanPaint();
  const on = (id, fn, ev)=>{ const el=$(id); if(el) el.addEventListener(ev||'click', fn); };
  on('#recPlay', recPlay); on('#recTick', recTick); on('#recReset', recReset);
  on('#scanPlay', scanPlay); on('#scanTick', scanTick); on('#scanReset', scanReset);
  const sr = $('#scanRange');
  if(sr) sr.addEventListener('input', ()=>{ scanDepth = +sr.value; scanPaint(); });
}
document.addEventListener('DOMContentLoaded', init);
</script>
