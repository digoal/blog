<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数据库筑基课 · SKIP LOCKED｜给队列表一个不完整的读</title>
<!-- 单文件交付：所有原理图均为现场绘制的内联 SVG，无外链图片、字体、脚本。 -->
<!-- 设计母题：地层 / 剖面。内容按「问题→语法→实现→实证→代价→反模式→落地」推演，不按原文章节排列。 -->
<style>

:root{
  --bg:#F7F6F2; --paper2:#F1EFE9; --ink:#1B2B33; --ink2:#46585F; --muted:#89938F; --line:#D9D5CB;
  --primary:#245A6B; --prim-l:#E5EFF0; --prim-m:#7BA6AF; --accent:#BE653B; --acc-l:#F7E9DE;
  --green:#2F7A66; --green-l:#E4F0EA; --gold:#AE8A3E; --gold-l:#F5EDDC;
  --rail:clamp(380px, 33vw, 452px);
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#E9E7E1}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
#viewport{position:absolute;left:0;top:0;right:0;bottom:58px;overflow:hidden;
  transition:right .36s cubic-bezier(.2,.7,.2,1)}
body.notes-open #viewport{right:var(--rail)}
#stage{position:absolute;width:1600px;height:900px;background:var(--bg);
  transform-origin:top left;box-shadow:0 18px 60px rgba(27,43,51,.13)}
.slide{position:absolute;inset:0;display:none}
.slide.on{display:block;animation:fadein .42s cubic-bezier(.2,.7,.2,1)}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.eyebrow{position:absolute;left:64px;top:42px;font-size:13px;letter-spacing:3.4px;
  color:var(--primary);font-weight:600}
.eyebrow .num{font-family:var(--mono);letter-spacing:1px;color:var(--accent);margin-right:14px}
h1.title{position:absolute;left:64px;top:68px;margin:0;font-family:var(--serif);
  font-size:44px;line-height:1.24;font-weight:700;letter-spacing:1.2px;color:var(--ink)}
.lede{position:absolute;left:64px;top:136px;width:1450px;font-size:19px;color:var(--ink2);
  line-height:1.52;letter-spacing:.3px}
.rule{position:absolute;left:64px;top:181px;width:1472px;height:1px;background:var(--line)}
.figwrap{position:absolute;left:100px;top:196px;width:1400px;height:432px}
svg.figure{display:block;overflow:visible}
svg.figure text{font-family:var(--sans)}
svg.figure text.serif{font-family:var(--serif)}
svg.figure text.mono{font-family:var(--mono)}
.caption{position:absolute;left:100px;top:640px;width:1400px;font-size:13px;
  color:var(--muted);letter-spacing:.4px}
.bridge{position:absolute;left:64px;top:700px;width:1440px;font-size:20px;
  color:var(--accent);line-height:1.5;letter-spacing:.4px;padding-left:18px;
  border-left:3px solid var(--accent);font-family:var(--serif)}
.bridge .bk{font-family:var(--sans);font-size:12.5px;color:var(--muted);
  letter-spacing:2px;display:block;margin-bottom:1px}
.footer{position:absolute;left:64px;top:838px;width:1472px;height:1px;background:var(--line)}
.footer .fl{position:absolute;left:0;top:14px;font-size:12.5px;color:var(--muted);letter-spacing:2px}
.footer .fr{position:absolute;right:0;top:12px;font-family:var(--mono);font-size:14px;color:var(--ink2)}

/* 动画控件：图下方独立条带，不覆盖图 */
.ctrls{position:absolute;left:100px;top:636px;width:1400px;height:42px;display:flex;
  align-items:center;gap:10px}
.ctrls .cl{font-size:12.5px;color:var(--ink2);white-space:nowrap;letter-spacing:.5px}
.ctrls .btn{min-height:28px;padding:4px 13px;border:1px solid var(--primary);border-radius:4px;
  background:#fff;color:var(--primary);font-size:12.5px;cursor:pointer;font-family:var(--sans)}
.ctrls .btn.play{background:var(--primary);color:#fff}
.ctrls .btn:hover{filter:brightness(.94)}
.ctrls input[type=range]{width:160px;accent-color:var(--primary);margin:0}
.ctrls .out{font-size:12.5px;color:var(--ink2);margin-left:auto;max-width:560px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.ctrls .out b{color:var(--accent);font-weight:600}

/* 底部外壳：始终可见，全屏时也在 */
.chrome{position:fixed;left:0;right:0;bottom:0;height:58px;background:#FCFBF8;
  border-top:1px solid var(--line);display:flex;align-items:center;gap:7px;
  padding:0 16px;z-index:60;font-size:13px;color:var(--ink2)}
.chrome .sep{width:1px;height:22px;background:var(--line);margin:0 5px}
.chrome button{font-family:var(--sans);font-size:13px;color:var(--ink2);background:transparent;
  border:1px solid transparent;border-radius:5px;padding:7px 10px;cursor:pointer;white-space:nowrap}
.chrome button:hover{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome button.act{background:var(--prim-l);color:var(--primary);border-color:var(--line)}
.chrome button.k{font-family:var(--mono);font-size:12px;color:var(--muted)}
.chrome .pg{font-family:var(--mono);font-size:14px;color:var(--ink);min-width:74px;text-align:center}
.chrome .track{flex:1;height:3px;background:var(--line);border-radius:3px;margin:0 10px;position:relative}
.chrome .track i{position:absolute;left:0;top:0;height:3px;background:var(--primary);
  border-radius:3px;transition:width .35s}
body.immersive #stage{box-shadow:none}

/* 右侧讲稿栏：页内开窗，画面矢量缩放让位 */
#rail{position:fixed;right:0;top:0;bottom:58px;width:var(--rail);background:#FBFAF6;
  border-left:1px solid var(--line);z-index:50;display:flex;flex-direction:column;
  transform:translateX(101%);transition:transform .36s cubic-bezier(.2,.7,.2,1);
  box-shadow:-16px 0 44px rgba(27,43,51,.07)}
body.notes-open #rail{transform:translateX(0)}
.rail-head{padding:20px 24px 12px;border-bottom:1px solid var(--line);background:#FCFBF8;flex:none}
.rail-head .rk{font-family:var(--mono);font-size:11px;letter-spacing:1.8px;color:var(--accent)}
.rail-head h3{margin:7px 0 3px;font-family:var(--serif);font-size:19px;line-height:1.4;color:var(--ink)}
.rail-head .rm{font-size:11.5px;color:var(--muted);letter-spacing:1.2px}
.rail-tools{display:flex;gap:6px;margin-top:10px}
.rail-tools button{font-family:var(--sans);font-size:12px;color:var(--ink2);background:#fff;
  border:1px solid var(--line);border-radius:4px;padding:4px 9px;cursor:pointer}
.rail-tools button.on{background:var(--primary);border-color:var(--primary);color:#fff}
.rail-tools .x{margin-left:auto}
.rail-body{flex:1;overflow-y:auto;padding:0 0 28px;scrollbar-width:thin}
.rail-body::-webkit-scrollbar{width:8px}
.rail-body::-webkit-scrollbar-thumb{background:#DCD8CE;border-radius:4px}
.note{padding:16px 24px 18px;border-bottom:1px dotted var(--line);position:relative;transition:background .2s}
.note.act{background:#F3F1EA;box-shadow:inset 3px 0 0 var(--accent)}
.note .nh{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:1.2px;margin-bottom:5px}
.note h4{margin:0 0 7px;font-family:var(--serif);font-size:16px;color:var(--primary);line-height:1.42}
.note p{margin:0 0 9px;font-size:14px;line-height:2.02;color:var(--ink2);letter-spacing:.2px;text-align:justify}
.note p:last-child{margin-bottom:0}
.note .nb{margin-top:9px;padding-left:11px;border-left:2px solid var(--acc-l);
  font-family:var(--serif);font-size:13.5px;color:#A9552F;line-height:1.75}
body.rail-one .note h4{font-size:17px}
body.rail-one .note p{font-size:15px;line-height:2.05}

/* 模态：仅目录与帮助使用 */
.veil{position:fixed;inset:0;background:rgba(27,43,51,.42);z-index:70;display:none;
  align-items:center;justify-content:center;backdrop-filter:blur(3px)}
.veil.on{display:flex}
.panel{width:min(1040px,90vw);max-height:80vh;overflow:auto;background:var(--bg);
  border-radius:8px;box-shadow:0 24px 80px rgba(0,0,0,.26);padding:32px 38px 36px}
.panel h2{margin:0 0 6px;font-family:var(--serif);font-size:28px;color:var(--ink)}
.panel .psub{font-size:13.5px;color:var(--muted);margin-bottom:22px;letter-spacing:1px}
.panel .close{position:sticky;top:0;float:right;background:#fff;border:1px solid var(--line);
  border-radius:5px;padding:5px 11px;font-size:12.5px;cursor:pointer;color:var(--ink2)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.grid a{display:block;padding:13px 13px;border:1px solid var(--line);border-radius:6px;
  background:#fff;text-decoration:none;color:var(--ink);cursor:pointer;transition:.18s}
.grid a:hover{border-color:var(--primary);background:var(--prim-l);transform:translateY(-2px)}
.grid a .gn{font-family:var(--mono);font-size:11.5px;color:var(--accent)}
.grid a .gt{font-family:var(--serif);font-size:15px;line-height:1.42;display:block;margin-top:4px}
.keys{display:grid;grid-template-columns:repeat(2,1fr);gap:9px 28px;font-size:14.5px;line-height:1.9}
.keys kbd{font-family:var(--mono);background:#fff;border:1px solid var(--line);
  border-bottom-width:2px;border-radius:4px;padding:2px 7px;color:var(--primary);margin-right:8px}
.toast{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);background:var(--ink);
  color:#fff;font-size:13px;padding:8px 15px;border-radius:5px;opacity:0;transition:.3s;
  z-index:90;pointer-events:none}
.toast.on{opacity:1}
@media print{.chrome,.veil,.toast,#rail{display:none!important}#viewport{position:static;right:0!important}
  #stage{position:static;transform:none!important;box-shadow:none}
  .slide{display:block!important;page-break-after:always;position:relative;height:900px}}
@media (prefers-reduced-motion: reduce){
  .slide.on{animation:none}
  #viewport,#rail,.chrome .track i{transition:none}
}

</style>
</head>
<body>

<div id="viewport"><div id="stage"><div id="slides"></div></div></div>

<aside id="rail">
  <div class="rail-head" id="railHead"></div>
  <div class="rail-body" id="railBody"></div>
</aside>

<div class="chrome">
  <button id="btnPrev">← 上一页</button>

</div>

<div class="veil" id="veil"><div class="panel" id="panel"></div></div>
<div class="toast" id="toast"></div>
<script>

=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#D9D5CB\"/></marker><marker id=\"ah1d\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#2E6373\"/></marker></defs><rect x=\"100.0\" y=\"24.0\" width=\"440.0\" height=\"36.0\" rx=\"2\" fill=\"#1E4B5A\" stroke=\"#1E4B5A\" stroke-width=\"1\"/><text x=\"116.0\" y=\"47.0\" font-size=\"11.5\" fill=\"#FFFFFF\" font-weight=\"500\" class=\"mono\">job_queue · WHERE status = 'ready'</text><rect x=\"100.0\" y=\"62.0\" width=\"440.0\" height=\"48.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"118.0\" y=\"91.0\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"500\" class=\"mono\">id=1</text><text x=\"198.0\" y=\"91.0\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"400\">priority 8</text><rect x=\"398.0\" y=\"74.0\" width=\"124.0\" height=\"24.0\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#F7E9DE\" stroke-width=\"1\"/><text x=\"460.0\" y=\"90.0\" font-size=\"10.5\" fill=\"#BE653B\" font-weight=\"600\" text-anchor=\"middle\">A 已加锁 · 未提交</text><rect x=\"100.0\" y=\"110.0\" width=\"440.0\" height=\"48.0\" rx=\"2\" fill=\"#FCFBF8\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"118.0\" y=\"139.0\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"500\" class=\"mono\">id=2</text><text x=\"198.0\" y=\"139.0\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"400\">priority 7</text><rect x=\"398.0\" y=\"122.0\" width=\"124.0\" height=\"24.0\" rx=\"2\" fill=\"#E4F0EA\" stroke=\"#E4F0EA\" stroke-width=\"1\"/><text x=\"460.0\" y=\"138.0\" font-size=\"10.5\" fill=\"#2F7A66\" font-weight=\"500\" text-anchor=\"middle\">可领取</text><rect x=\"100.0\" y=\"158.0\" width=\"440.0\" height=\"48.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"118.0\" y=\"187.0\" font-size=\"12.5\" fill=\"#1B2B33\" font-weight=\"500\" class=\"mono\">id=3< <text x=\"460.0\" y=\"330.0\" font-size=\"10.5\" fill=\"#2F7A66\" font-weight=\"500\" text-anchor=\"middle\">可领取</text><text x=\"640.0\" y=\"40.0\" font-size=\"12.5\" fill=\"#245A6B\" font-weight=\"600\" letter-spacing=\"1.2\">行锁等待队列：三个 worker 卡在同一行</text><rect x=\"640.0\" y=\"57.0\" width=\"200.0\" height=\"58.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"740.0\" y=\"78.0\" font-size=\"14.9\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"middle\" class=\"serif\">Worker B</text><text x=\"740.0\" y=\"98.4\" font-size=\"12.7\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"middle\">等 1 号行的锁</text><rect x=\"880.0\" y=\"57.0\" width=\"200.0\" height=\"58.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"980.0\" y=\"78.0\" font-size=\"14.9\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"middle\" class=\"serif\">Worker C</text><text x=\"980.0\" y=\"98.4\" font-size=\"12.7\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"middle\">等 1 号行的锁</text><rect x=\"1120.0\" y=\"57.0\" width=\"200.0\" height=\"58.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1220.0\" y=\"78.0\" font-size=\"14.9\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"middle\" class=\"serif\">Worker D</text><text x=\"1220.0\" y=\"98.4\" font-size=\"12.7\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"middle\">等 1 号行的锁</text><line x1=\"540.0\" y1=\"86.0\" x2=\"636.0\" y2=\"86.0\" stroke=\"#BE653B\" stroke-width=\"1.4\" marker-end=\"url(#ah1a)\"/><line x1=\"840.0\" y1=\"86.0\" x2=\"876.0\" y2=\"86.0\" stroke=\"#89938F\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/><line x1=\"1080.0\" y1=\"86.0\" x2=\"1116.0\" y2=\"86.0\" stroke=\"#89938F\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/><rect x=\"640.0\" y=\"152.0\" width=\"690.0\" height=\"186.0\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#F1EFE9\" stroke-width=\"1\"/><text x=\"664.0\" y=\"190.0\" font-size=\"11.0\" fill=\"#BE653B\" font-weight=\"600\" class=\"mono\">01</text><text x=\"700.0\" y=\"190.0\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"500\">等待时长 = 队头那一行的事务时长</text><text x=\"664.0\" y=\"236.0\" font-size=\"11.0\" fill=\"#BE653B\" font-weight=\"600\" class=\"mono\">02</text><text x=\"700.0\" y=\"236.0\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"500\">队列越长、热点越靠前，阻塞越久</text><text x=\"664.0\" y=\"282.0\" font-size=\"11.0\" fill=\"#BE653B\" font-weight=\"600\" class=\"mono\">03</text><text x=\"700.0\" y=\"282.0\" font-size=\"14.0\" fill=\"#46585F\" font-weight=\"500\">加 worker 只是加更多等待者，不是加吞吐</text><line x1=\"100.0\" y1=\"366.0\" x2=\"1330.0\" y2=\"366.0\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"100.0\" y=\"396.0\" font-size=\"14.5\" fill=\"#BE653B\" font-weight=\"500\">2–6 号全程可领取，却没人取：这不是锁太贵，是所有人都停在同一个热点候选行上。</text></svg>", "ctrl": ""}, {"eyebrow": "它是什么：语法与语义", "title": "锁强度之外还有等待策略：一个子句，两个维度", "lede": "FOR UPDATE 决定「我想拿什么锁」，NOWAIT / SKIP LOCKED 决定「拿不到时怎么办」。这两件事，在口语里经常被混成一件。", "caption": "图 02 · 锁定子句只有三个槽位：锁强度、OF 范围、等待策略；SKIP LOCKED 只占最后一个。", "bridge": "位置定清楚了，接下来的问题是：四种锁强度，各自付什么代价？", "notes": ["先把它在语法里的位置定清楚。FOR UPDATE 是一个锁定子句，它有三个槽位：锁强度、OF 指定的表范围，以及最后的等待策略。SKIP LOCKED 只占最后一个。", "所以第一个容易混的地方是：SKIP LOCKED 不是锁强度，它不改变你拿什么锁。写 FOR UPDATE SKIP LOCKED，拿的还是最强的更新型行锁；写 FOR SHARE SKIP LOCKED，拿的还是共享锁。变的只是「拿不到的时候怎么办」。", "四种强度是有梯度的。FOR UPDATE 最强；NO KEY UPDATE 常用于改非键列，比它弱一点；SHARE 是共享读、排斥更新；KEY SHARE 最弱，主要给外键引用做保护。任务领取场景九成用的是前两种。", "内部表示上，SKIP LOCKED 对应 LockWaitPolicy 枚举里的 LockWaitSkip。这个枚举只有三个值：阻塞、跳过、报错。注意它的顺序是有语义的——同一个关系被多个锁定子句影响时，更「强硬」的策略会赢：NOWAIT 压过 SKIP LOCKED，SKIP LOCKED 压过默认等待，判定由 applyLockingClause() 完成。"], "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah2p\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#245A6B\"/></marker><marker id=\"ah2a\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#BE653B\"/></marker><marker id=\"ah2g\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#2F7A66\"/></marker><marker id=\"ah2m\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#89938F\"/></marker><marker id=\"ah2k\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#46585F\"/></marker><marker id=\"ah2w\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#FFFFFF\"/></marker><marker id=\"ah2l\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#D9D5CB\"/></marker><marker id=\"ah2d\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#2E6373\"/></marker></defs><rect x=\"100.0\" y=\"24.0\" width=\"560.0\" height=\"214.0\" rx=\"2\" fill=\"#FCFBF8\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"101.0\" y=\"188.8\" width=\"558.0\" height=\"25.2\" fill=\"#F7E9DE\" opacity=\"0.6\"/><rect x=\"101.0\" y=\"188.8\" width=\"3\" height=\"25.2\" fill=\"#BE653B\"/><text x=\"116.0\" y=\"45.0\" font-size=\"13.0\" fill=\"#89938F\" font-weight=\"400\" class=\"mono\" xml:space=\"preserve\">-- 锁定子句 = 锁强度 + 作用范围 + 等待策略</text><text x=\"116.0\" y=\"71.0\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\" xml:space=\"preserve\">SELECT id, payload</text><text x=\"116.0\" y=\"97.0\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\" xml:space=\"preserve\">FROM job_queue</text><text x=\"116.0\" y=\"123.0\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\" xml:space=\"preserve\">WHERE status = 'ready'</text><text x=\"116.0\" y=\"149.0\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\" xml:space=\"preserve\">ORDER BY priority DESC, id</text><text x=\"116.0\" y=\"175.0\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\" xml:space=\"preserve\">LIMIT 100</text><text x=\"116.0\" y=\"201.0\" font-size=\"13.0\" fill=\"#245A6B\" font-weight=\"600\" class=\"mono\" xml:space=\"preserve\">FOR UPDATE SKIP LOCKED;</text><rect x=\"100.0\" y=\"250.0\" width=\"560.0\" height=\"146.0\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"380.0\" y=\"297.4\" font-size=\"14.9\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"middle\" class=\"serif\">槽位只有三个</text><text x=\"380.0\" y=\"317.1\" font-size=\"11.9\" fill=\"#245A6B\" font-weight=\"400\" text-anchor=\"middle\" class=\"mono\">锁强度 · OF 表范围 · 等待策略</text><text x=\"380.0\" y=\"335.6\" font-size=\"12.7\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"middle\">SKIP LOCKED 只占最后一个：它不改变锁强度，</text><text x=\"380.0\" y=\"353.7\" font-size=\"11.6\" fill=\"#BE653B\" font-weight=\"500\" text-anchor=\"middle\">只改变「拿不到的时候怎么办」</text><rect x=\"700.0\" y=\"24.0\" width=\"660.0\" height=\"72.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"700.0\" y=\"24.0\" width=\"216.0\" height=\"72.0\" rx=\"2\" fill=\"#2E6373\" stroke=\"#2E6373\" stroke-width=\"1\"/><text x=\"808.0\" y=\"66.0\" font-size=\"12.0\" fill=\"#FFFFFF\" font-weight=\"600\" text-anchor=\"middle\" class=\"mono\">FOR UPDATE</text><text x=\"940.0\" y=\"58.0\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"600\">最强更新锁</text><text x=\"940.0\" y=\"82.0\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\">领取并修改任务</text><rect x=\"700.0\" y=\"106.0\" width=\"660.0\" height=\"72.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"700.0\" y=\"106.0\" width=\"216.0\" height=\"72.0\" rx=\"2\" fill=\"#47808D\" stroke=\"#47808D\" stroke-width=\"1\"/><text x=\"808.0\" y=\"148.0\" font-size=\"12.0\" fill=\"#FFFFFF\" font-weight=\"600\" text-anchor=\"middle\" class=\"mono\">FOR NO KEY UPDATE</text><text x=\"940.0\" y=\"140.0\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"600\">较弱排他锁</text><text x=\"940.0\" y=\"164.0\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\">不改键列的流转</text><rect x=\"700.0\" y=\"188.0\" width=\"660.0\" height=\"72.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"700.0\" y=\"188.0\" width=\"216.0\" height=\"72.0\" rx=\"2\" fill=\"#74A5AD\" stroke=\"#74A5AD\" stroke-width=\"1\"/><text x=\"808.0\" y=\"230.0\" font-size=\"12.0\" fill=\"#FFFFFF\" font-weight=\"600\" text-anchor=\"middle\" class=\"mono\">FOR SHARE</text><text x=\"940.0\" y=\"222.0\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"600\">共享锁</text><text x=\"940.0\" y=\"246.0\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\">共享读、排斥更新</text><rect x=\"700.0\" y=\"270.0\" width=\"660.0\" height=\"72.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"700.0\" y=\"270.0\" width=\"216.0\" height=\"72.0\" rx=\"2\" fill=\"#A4C4C6\" stroke=\"#A4C4C6\" stroke-width=\"1\"/><text x=\"808.0\" y=\"312.0\" font-size=\"12.0\" fill=\"#FFFFFF\" font-weight=\"600\" text-anchor=\"middle\" class=\"mono\">FOR KEY SHARE</text><text x=\"940.0\" y=\"304.0\" font-size=\"14.0\" fill=\"#1B2B33\" font-weight=\"600\">键共享锁</text><text x=\"940.0\" y=\"328.0\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\">外键引用保护</text><text x=\"700.0\" y=\"392.0\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\">四种强度都能与 SKIP LOCKED 组合；队列表九成用前两种。</text></svg>", "ctrl": ""}, {"eyebrow": "三种等待策略", "title": "等、报错、跳过：这不是三种锁，是三种态度", "lede": "锁强度回答「我要什么」，等待策略回答「拿不到时我接受什么」。队列选跳过，管理操作选报错，强一致路径只敢老实排队。", "caption": "图 03 · 同一个 FOR UPDATE，换等待策略，行为从「排到队尾」变成「立刻报错」或「悄悄越过」。", "bridge": "三态分清了，下一个问题更硬：这个「跳过」，到底发生在哪一层？", "notes": ["把三态并排看，很多东西一下就清楚了。默认等待：拿不到锁就进等待队列，等对方提交或回滚，然后继续。它给你最完整的视图，代价是你的延迟由别人的事务长度决定。", "NOWAIT：拿不到就立刻报错，SQLSTATE 55P03，lock_not_available。它把「等」变成了「抛」，你的应用必须真的会处理这个错，否则一次热点冲突就是一个 500。", "SKIP LOCKED：拿不到就跳过这一行，继续下一条。它把「等」变成了「漏」——官方文档写得很直白，跳过被锁的行会给出不一致的视图。注意，这个不一致不是 bug，是设计。", "所以选型其实是在选你愿意付哪种代价：完整性、可用性，还是吞吐。队列愿意用完整性换吞吐；管理操作愿意用可用性换确定性；账本类业务三种都换不起，只能老实排队。"], "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah3p\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#245A6B\"/></marker><marker id=\"ah3a\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#BE653B\"/></marker><marker id=\"ah3g\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#2F7A66\"/></marker><marker id=\"ah3m\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#89938F\"/></marker><marker id=\"ah3k\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#46585F\"/></marker><marker id=\"ah3w\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#FFFFFF\"/></marker><marker id=\"ah3l\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#D9D5CB\"/></marker><marker id=\"ah3d\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#2E6373\"/></marker></defs><rect x=\"100.0\" y=\"26.0\" width=\"400.0\" height=\"64.0\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\"/><text x=\"120.0\" y=\"52.0\" font-size=\"17.0\" fill=\"#245A6B\" font-weight=\"700\">默认等待</text><text x=\"120.0\" y=\"76.0\" font-size=\"11.0\" fill=\"#245A6B\" font-weight=\"500\">LockWaitBlock</text><rect x=\"100.0\" y=\"98.0\" width=\"400.0\" height=\"190.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"120.0\" y=\"133.0\" width=\"5.0\" height=\"5.0\" rx=\"0\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"0\"/><text x=\"134.0\" y=\"140.0\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\">拿不到就进等待队列</text><rect x=\"120.0\" y=\"189.0\" width=\"5.0\" height=\"5.0\" rx=\"0\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"0\"/><text x=\"134.0\" y=\"196.0\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\">返回最接近完整候选集</text><rect x=\"120.0\" y=\"245.0\" width=\"5.0\" height=\"5.0\" rx=\"0\" fill=\"#245A6B\" stroke=\"#245A6B\" stroke-width=\"0\"/><text x=\"134.0\" y=\"252.0\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\">延迟由别人的事务决定</text><rect x=\"100.0\" y=\"296.0\" width=\"400.0\" height=\"56.0\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\"/><text x=\"300.0\" y=\"331.0\" font-size=\"16.0\" fill=\"#245A6B\" font-weight=\"700\" text-anchor=\"middle\" class=\"serif\">→ 完整性优先</text><rect x=\"524.0\" y=\"26.0\" width=\"400.0\" height=\"64.0\" rx=\"2\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1\"/><text x=\"544.0\" y=\"52.0\" font-size=\"17.0\" fill=\"#AE8A3E\" font-weight=\"700\">立即报错</text><text x=\"544.0\" y=\"76.0\" font-size=\"11.0\" fill=\"#AE8A3E\" font-weight=\"500\">LockWaitError</text><rect x=\"524.0\" y=\"98.0\" width=\"400.0\" height=\"190.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"544.0\" y=\"133.0\" width=\"5.0\" height=\"5.0\" rx=\"0\" fill=\"#AE8A3E\" stroke=\"#AE8A3E\" stroke-width=\"0\"/><text x=\"558.0\" y=\"140.0\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\">拿不到立刻抛 55P03</text><rect x=\"544.0\" y=\"189.0\" width=\"5.0\" height=\"5.0\" rx=\"0\" fill=\"#AE8A3E\" stroke=\"#AE8A3E\" stroke-width=\"0\"/><text x=\"558.0\" y=\"196.0\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\">应用必须真的处理这个错</text><rect x=\"544.0\" y=\"245.0\" width=\"5.0\" height=\"5.0\" rx=\"0\" fill=\"#AE8A3E\" stroke=\"#AE8A3E\" stroke-width=\"0\"/><text x=\"558.0\" y=\"252.0\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\">适合探测与管理操作</text><rect x=\"524.0\" y=\"296.0\" width=\"400.0\" height=\"56.0\" rx=\"2\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1\"/><text x=\"724.0\" y=\"331.0\" font-size=\"16.0\" fill=\"#AE8A3E\" font-weight=\"700\" text-anchor=\"middle\" class=\"serif\">→ 确定性优先</text><rect x=\"948.0\" y=\"26.0\" width=\"400.0\" height=\"64.0\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\"/><text x=\"968.0\" y=\"52.0\" font-size=\"17.0\" fill=\"#BE653B\" font-weight=\"700\">跳过该行</text><text x=\"968.0\" y=\"76.0\" font-size=\"11.0\" fill=\"#BE653B\" font-weight=\"500\">LockWaitSkip</text><rect x=\"948.0\" y=\"98.0\" width=\"400.0\" height=\"190.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"968.0\" y=\"133.0\" width=\"5.0\" height=\"5.0\" rx=\"0\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"0\"/><text x=\"982.0\" y=\"140.0\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\">拿不到就跳过这一行</text><rect x=\"968.0\" y=\"189.0\" width=\"5.0\" height=\"5.0\" rx=\"0\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"0\"/><text x=\"982.0\" y=\"196.0\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\">结果集有意不完整</text><rect x=\"968.0\" y=\"245.0\" width=\"5.0\" height=\"5.0\" rx=\"0\" fill=\"#BE653B\" stroke=\"#BE653B\" stroke-width=\"0\"/><text x=\"982.0\" y=\"252.0\" font-size=\"13.0\" fill=\"#46585F\" font-weight=\"400\">适合多消费者队列</text><rect x=\"948.0\" y=\"296.0\" width=\"400.0\" height=\"56.0\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\"/><text x=\"1148.0\" y=\"331.0\" font-size=\"16.0\" fill=\"#BE653B\" font-weight=\"700\" text-anchor=\"middle\" class=\"serif\">→ 吞吐优先</text><line x1=\"100.0\" y1=\"372.0\" x2=\"1330.0\" y2=\"372.0\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"100.0\" y=\"402.0\" font-size=\"14.5\" fill=\"#BE653B\" font-weight=\"500\">三列并列看：这不是三种锁强度，而是三种「拿不到时我接受什么」。</text></svg>", "ctrl": ""}, {"eyebrow": "它跑在哪里：六层路径", "title": "从 SQL 到堆文件：六层都在传一个枚举", "lede": "SKIP LOCKED 不在优化器里实现，也不可能在那里实现——行有没有被锁，只有执行到那一行、真的去拿锁的时候才知道。", "caption": "图 04 · 解析期把等待策略挂到查询树的 rowmark 上，执行期变成 ExecRowMark 的 waitPolicy，最后交给堆层。", "bridge": "每一层都只是传一个枚举下去，所以真正做决定的地方，在最底下。", "notes": ["现在往下走一层：这行 SQL 是怎么一路变成「条件式尝试」的。第一站是解析，analyze.c 里的 transformLockingClause() 会把锁定子句转成查询树上的锁定信息，具体动作由 applyLockingClause() 完成——它把锁强度和等待策略挂到对应的 range table entry 上。", "这里有个常被忽略的边界：没有写 OF 表名时，锁定子句会影响句子里可锁定的普通表，以及能下推到子查询的表；但它不会自动钻进 WITH 里面。要让 CTE 内部锁行，得在 CTE 自己的 SELECT 里写。这条后面还会作为坑再出现一次。", "第二站是执行初始化。execMain.c 依据计划里的 PlanRowMark 造出运行期的 ExecRowMark，四个字段值得记住：markType 是行锁类型，strength 是 SQL 层强度，waitPolicy 就是 SKIP LOCKED 落的那个位置，curCtid 是当前锁住的 tuple id，供 WHERE CURRENT OF 和 EPQ 用。", "然后才轮到 LockRows 节点和 table_tuple_lock。我想强调一件事：SKIP LOCKED 不可能是优化器把被锁行提前过滤掉——行有没有被锁，只有执行到那一行、真的去拿锁的时候才知道。所以真正的分支发生在执行器里，不在计划里。这也是为什么 EXPLAIN 里看不到「跳过了几行」，你只能看到 LockRows 上游扫了多少、返回了多少。"], "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah4p\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#245A6B\"/></marker><marker id=\"ah4a\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#BE653B\"/></marker><marker id=\"ah4g\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#2F7A66\"/></marker><marker id=\"ah4m\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#89938F\"/></marker><marker id=\"ah4k\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#46585F\"/></marker><marker id=\"ah4w\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#FFFFFF\"/></marker><marker id=\"ah4l\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#D9D5CB\"/></marker><marker id=\"ah4d\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#2E6373\"/></marker></defs><text x=\"166.0\" y=\"50.0\" font-size=\"11.0\" fill=\"#BE653B\" font-weight=\"600\" text-anchor=\"end\" class=\"mono\">①</text><text x=\"236.0\" y=\"50.0\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"500\" text-anchor=\"end\">语法</text><rect x=\"380.0\" y=\"24.0\" width=\"640.0\" height=\"44.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"700.0\" y=\"47.2\" font-size=\"11.9\" fill=\"#245A6B\" font-weight=\"400\" text-anchor=\"middle\" class=\"mono\">FOR UPDATE SKIP LOCKED</text><line x1=\"700.0\" y1=\"68.0\" x2=\"700.0\" y2=\"82.0\" stroke=\"#245A6B\" stroke-width=\"1.3\" marker-end=\"url(#ah4p)\"/><text x=\"166.0\" y=\"108.0\" font-size=\"11.0\" fill=\"#BE653B\" font-weight=\"600\" text-anchor=\"end\" class=\"mono\">②</text><text x=\"236.0\" y=\"108.0\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"500\" text-anchor=\"end\">解析</text><rect x=\"256.0\" y=\"82.0\" width=\"888.0\" height=\"44.0\" rx=\"2\" fill=\"#FCFBF8\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"700.0\" y=\"105.2\" font-size=\"11.9\" fill=\"#245A6B\" font-weight=\"400\" text-anchor=\"middle\" class=\"mono\">transformLockingClause() → applyLockingClause()</text><line x1=\"700.0\" y1=\"126.0\" x2=\"700.0\" y2=\"140.0\" stroke=\"#245A6B\" stroke-width=\"1.3\" marker-end=\"url(#ah4p)\"/><text x=\"166.0\" y=\"166.0\" font-size=\"11.0\" fill=\"#BE653B\" font-weight=\"600\" text-anchor=\"end\" class=\"mono\">③</text><text x=\"236.0\" y=\"166.0\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"500\" text-anchor=\"end\">查询树</text><rect x=\"256.0\" y=\"140.0\" width=\"888.0\" height=\"44.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"700.0\" y=\"163.2\" font-size=\"11.9\" fill=\"#245A6B\" font-weight=\"400\" text-anchor=\"middle\" class=\"mono\">Query→rowMarks：strength = LCS_FORUPDATE，waitPolicy = LockWaitSkip</text><line x1=\"700.0\" y1=\"184.0\" x2=\"700.0\" y2=\"198.0\" stroke=\"#245A6B\" stroke-width=\"1.3\" marker-end=\"url(#ah4p)\"/><text x=\"166.0\" y=\"224.0\" font-size=\"11.0\" fill=\"#BE653B\" font-weight=\"600\" text-anchor=\"end\" class=\"mono\">④</text><text x=\"236.0\" y=\"224.0\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"500\" text-anchor=\"end\">执行初始化</text><rect x=\"256.0\" y=\"198.0\" width=\"888.0\" height=\"44.0\" rx=\"2\" fill=\"#FCFBF8\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"700.0\" y=\"221.2\" font-size=\"11.9\" fill=\"#245A6B\" font-weight=\"400\" text-anchor=\"middle\" class=\"mono\">ExecRowMark{ markType · strength · waitPolicy · curCtid }</text><line x1=\"700.0\" y1=\"242.0\" x2=\"700.0\" y2=\"256.0\" stroke=\"#245A6B\" stroke-width=\"1.3\" marker-end=\"url(#ah4p)\"/><text x=\"166.0\" y=\"282.0\" font-size=\"11.0\" fill=\"#BE653B\" font-weight=\"600\" text-anchor=\"end\" class=\"mono\">⑤</text><text x=\"236.0\" y=\"282.0\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"500\" text-anchor=\"end\">执行节点</text><rect x=\"256.0\" y=\"256.0\" width=\"888.0\" height=\"44.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"700.0\" y=\"279.2\" font-size=\"11.9\" fill=\"#245A6B\" font-weight=\"400\" text-anchor=\"middle\" class=\"mono\">ExecLockRows()：每一行都试着加一次锁</text><line x1=\"700.0\" y1=\"300.0\" x2=\"700.0\" y2=\"314.0\" stroke=\"#245A6B\" stroke-width=\"1.3\" marker-end=\"url(#ah4p)\"/><text x=\"166.0\" y=\"340.0\" font-size=\"11.0\" fill=\"#BE653B\" font-weight=\"600\" text-anchor=\"end\" class=\"mono\">⑥</text><text x=\"236.0\" y=\"340.0\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"500\" text-anchor=\"end\">堆层</text><rect x=\"256.0\" y=\"314.0\" width=\"888.0\" height=\"44.0\" rx=\"2\" fill=\"#FCFBF8\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"700.0\" y=\"337.2\" font-size=\"11.9\" fill=\"#245A6B\" font-weight=\"400\" text-anchor=\"middle\" class=\"mono\">table_tuple_lock() → heap_lock_tuple()</text><line x1=\"1146.0\" y1=\"336.0\" x2=\"1158.0\" y2=\"336.0\" stroke=\"#BE653B\" stroke-width=\"1.2\"/><text x=\"1162.0\" y=\"340.0\" font-size=\"10.5\" fill=\"#BE653B\" font-weight=\"600\">冲突在这里才被发现</text><line x1=\"700.0\" y1=\"358.0\" x2=\"700.0\" y2=\"366.0\" stroke=\"#245A6B\" stroke-width=\"1.3\"/><line x1=\"390.0\" y1=\"366.0\" x2=\"1008.0\" y2=\"366.0\" stroke=\"#245A6B\" stroke-width=\"1.3\"/><line x1=\"390.5\" y1=\"366.0\" x2=\"390.5\" y2=\"372.0\" stroke=\"#245A6B\" stroke-width=\"1.3\" marker-end=\"url(#ah4p)\"/><rect x=\"256.0\" y=\"372.0\" width=\"269.0\" height=\"40.0\" rx=\"2\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\"/><text x=\"390.5\" y=\"397.0\" font-size=\"12.5\" fill=\"#2F7A66\" font-weight=\"600\" text-anchor=\"middle\">拿到锁 → 返回该行</text><line x1=\"699.5\" y1=\"366.0\" x2=\"699.5\" y2=\"372.0\" stroke=\"#245A6B\" stroke-width=\"1.3\" marker-end=\"url(#ah4p)\"/><rect x=\"565.0\" y=\"372.0\" width=\"269.0\" height=\"40.0\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\"/><text x=\"699.5\" y=\"397.0\" font-size=\"12.5\" fill=\"#BE653B\" font-weight=\"600\" text-anchor=\"middle\">TM_WouldBlock → 跳过</text><line x1=\"1008.5\" y1=\"366.0\" x2=\"1008.5\" y2=\"372.0\" stroke=\"#245A6B\" stroke-width=\"1.3\" marker-end=\"url(#ah4p)\"/><rect x=\"874.0\" y=\"372.0\" width=\"269.0\" height=\"40.0\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#89938F\" stroke-width=\"1\"/><text x=\"1008.5\" y=\"397.0\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"600\" text-anchor=\"middle\">LockWaitError → 报错</text></svg>", "ctrl": ""}, {"eyebrow": "执行器主循环", "title": "LockRows 是一个过滤器：拿不到锁的行，到不了上层", "lede": "子计划一条条吐出候选行，LockRows 逐行试着加锁；失败的走 lnext，成功的才计数。LIMIT 计的是后者。", "caption": "图 05 · ExecLockRows() 的主循环。注意「否」分支不是退出，是回到子计划取下一条。", "bridge": "这条循环决定了三件常被误解的事：LIMIT 数谁、跳过算谁、耗尽意味着什么。", "notes": ["ExecLockRows() 的主循环值得逐行读。第一步，从子计划取下一条候选 tuple；第二步，通过 resjunk 列拿到源表的 ctid；第三步，把 markType 翻成 LockTupleMode，比如 ROW_MARK_EXCLUSIVE 对应 LockTupleExclusive；第四步，table_tuple_lock 带着 erm->waitPolicy 去试。", "关键在第五步：如果返回 TM_WouldBlock，说明在 SKIP LOCKED 模式下这一行锁不住，执行器 goto lnext，回去取下一条候选行。注意它不是退出、不是报错、也不是返回空——是继续循环。", "如果锁到了，才走第六条路：必要时做 EvalPlanQual 重新检查，然后把这行交回上层。到这里你会发现，LockRows 本质上是一个过滤器：拿不到锁的行，根本不会到达上层，也就不会消耗 LIMIT。", "这带出两个特别容易搞错的结论。第一，LIMIT 是对「成功返回的行」生效，不是把前 100 行截断再去锁；执行器会一直找，直到凑够或者子计划耗尽。第二，跳过发生在锁冲突处，和 WHERE 的语义过滤是两回事——符合条件但此刻锁不住的行，就是不在结果里。"], "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah5p\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#245A6B\"/></marker><marker id=\"ah5a\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#BE653B\"/></marker><marker id=\"ah5g\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#2F7A66\"/></marker><marker id=\"ah5m\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#89938F\"/></marker><marker id=\ \" stroke=\"#245A6B\" stroke-width=\"1.4\" marker-end=\"url(#ah5p)\"/><line x1=\"480.0\" y1=\"198.0\" x2=\"480.0\" y2=\"216.0\" stroke=\"#245A6B\" stroke-width=\"1.4\" marker-end=\"url(#ah5p)\"/><rect x=\"180.0\" y=\"296.0\" width=\"420.0\" height=\"46.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"390.0\" y=\"320.2\" font-size=\"11.8\" fill=\"#1B2B33\" font-weight=\"500\" text-anchor=\"middle\">⑤ EvalPlanQual：重取最新版本、重检条件</text><rect x=\"180.0\" y=\"364.0\" width=\"420.0\" height=\"46.0\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\"/><text x=\"390.0\" y=\"388.1\" font-size=\"10.8\" fill=\"#BE653B\" font-weight=\"500\" text-anchor=\"middle\">⑥ 返回该行 —— 只有这里才计入 LIMIT</text><line x1=\"360.0\" y1=\"266.0\" x2=\"360.0\" y2=\"296.0\" stroke=\"#2F7A66\" stroke-width=\"1.4\" marker-end=\"url(#ah5g)\"/><line x1=\"390.0\" y1=\"342.0\" x2=\"390.0\" y2=\"364.0\" stroke=\"#2F7A66\" stroke-width=\"1.4\" marker-end=\"url(#ah5g)\"/><text x=\"372.0\" y=\"288.0\" font-size=\"10.5\" fill=\"#2F7A66\" font-weight=\"600\">否 · 已加锁</text><rect x=\"860.0\" y=\"216.0\" width=\"380.0\" height=\"50.0\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\"/><text x=\"1050.0\" y=\"242.1\" font-size=\"11.2\" fill=\"#BE653B\" font-weight=\"500\" text-anchor=\"middle\">goto lnext：不返回、不计数</text><line x1=\"710.0\" y1=\"241.0\" x2=\"856.0\" y2=\"241.0\" stroke=\"#BE653B\" stroke-width=\"1.4\" marker-end=\"url(#ah5a)\"/><text x=\"750.0\" y=\"232.0\" font-size=\"11.0\" fill=\"#BE653B\" font-weight=\"700\">是</text><line x1=\"1240.0\" y1=\"241.0\" x2=\"1272.0\" y2=\"241.0\" stroke=\"#BE653B\" stroke-width=\"1.4\"/><line x1=\"1272.0\" y1=\"241.0\" x2=\"1272.0\" y2=\"46.0\" stroke=\"#BE653B\" stroke-width=\"1.4\"/><line x1=\"1272.0\" y1=\"46.0\" x2=\"714.0\" y2=\"46.0\" stroke=\"#BE653B\" stroke-width=\"1.4\" marker-end=\"url(#ah5a)\"/><text x=\"830.0\" y=\"290.0\" font-size=\"11.0\" fill=\"#89938F\" font-weight=\"400\">回到子计划，取下一条候选行</text><rect x=\"760.0\" y=\"314.0\" width=\"600.0\" height=\"100.0\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#F1EFE9\" stroke-width=\"1\"/><text x=\"784.0\" y=\"342.0\" font-size=\"13.0\" fill=\"#BE653B\" font-weight=\"700\">·</text><text x=\"802.0\" y=\"342.0\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"500\">LIMIT 数的是第 ⑥ 步，不是第 ③ 步</text><text x=\"784.0\" y=\"370.0\" font-size=\"13.0\" fill=\"#BE653B\" font-weight=\"700\">·</text><text x=\"802.0\" y=\"370.0\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"500\">跳过的行不进结果集，也不消耗 LIMIT</text><text x=\"784.0\" y=\"398.0\" font-size=\"13.0\" fill=\"#BE653B\" font-weight=\"700\">·</text><text x=\"802.0\" y=\"398.0\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"500\">子计划耗尽 ≠ 库里没有任务</text></svg>", "ctrl": ""}, {"eyebrow": "走位实证", "title": "一次 LIMIT 3 的真实走位：扫 5 行，跳过 2 行，返回 3 行", "lede": "六条 ready 任务，其中两条正被别的事务锁着。LIMIT 3 不是「看前 3 行」，而是「要到 3 条能锁住的行」。", "ctrl": "<span class=\"cl\">一次 LIMIT 3 的完整走位</span><button class=\"btn play\" id=\"qPlay\">▶ 播放</button><button class=\"btn\" id=\"qStep\">单步 ▸</button><button class=\"btn\" id=\"qReset\">重置</button><input type=\"range\" id=\"qRange\" min=\"0\" max=\"6\" step=\"1\" value=\"0\"><div class=\"out\" id=\"qOut\"></div>", "bridge": "于是「这批没返回」和「库里没有任务」是两件完全不同的事——这是后面所有坑的总根。", "notes": ["把刚才那句话变成一个具体走位。表里六条 ready 任务，其中 1 号和 3 号正被别的事务锁着。我们要 LIMIT 3。", "执行器试 1 号：被锁，TM_WouldBlock，跳过，不计数。试 2 号：空闲，锁到，返回第一条。试 3 号：被锁，跳过。试 4 号、5 号：锁到，返回第二、第三条——LIMIT 满足，停。", "结果是：扫描了 5 行，跳过 2 行，返回 3 行，6 号根本没被看过。这就是「LIMIT 100」的真实含义：不是看 100 行，而是要到 100 条能锁住的行。", "于是「本次返回 0 行」有两种完全不同的成因：库里真的没有 ready 任务，或者有、但此刻全被别人锁着。用 SKIP LOCKED 的时候，你没有资格把这两件事混为一谈——监控告警如果建立在前者上，你会错过真正的积压。"], "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah6p\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#245A6B\"/></marker><marker id=\"ah6a\" viewBox=\"0 0 10 10\" r t x=\"1003.0\" y=\"64.0\" width=\"173.0\" height=\"104.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1019.0\" y=\"88.0\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"500\" letter-spacing=\"1.5\">跳过</text><text id=\"qSkip\" x=\"1019\" y=\"146\" font-size=\"34\" fill=\"#1B2B33\" font-weight=\"600\" class=\"mono\">0</text><rect x=\"1186.0\" y=\"64.0\" width=\"173.0\" height=\"104.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1202.0\" y=\"88.0\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"500\" letter-spacing=\"1.5\">返回</text><text id=\"qGot\" x=\"1202\" y=\"146\" font-size=\"34\" fill=\"#1B2B33\" font-weight=\"600\" class=\"mono\">0</text><rect x=\"820.0\" y=\"186.0\" width=\"540.0\" height=\"86.0\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#F1EFE9\" stroke-width=\"1\"/><text id=\"qMsg\" x=\"840\" y=\"236\" font-size=\"13\" fill=\"#46585F\" font-weight=\"500\"></text><g id=\"qBadge\" opacity=\"0.25\"><rect x=\"820\" y=\"288\" width=\"540\" height=\"40\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\"/><text x=\"842\" y=\"314\" font-size=\"13\" fill=\"#BE653B\" font-weight=\"700\">LIMIT 3 已满足 → 停止扫描，6 号从未被看过</text></g><text x=\"820.0\" y=\"402.0\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\">「返回 0 行」有两种成因：没有任务，或者有但全被锁着。</text></svg>", "caption": ""}, {"eyebrow": "堆层实现", "title": "条件等待：把「等」换成「试一次，不行就回」", "lede": "堆层没有「等一会儿」这个选项。它用 Conditional* 系列：立刻尝试，成功就拿到，失败直接返回 TM_WouldBlock，绝不睡眠。", "caption": "图 06 · 三条条件路径对应三种冲突源：tuple 级 tuplelock、普通事务、MultiXact。任何一条失败都收敛成同一个返回值。", "bridge": "锁只回答「能不能改」，可见性另有规则——下一步必须把这两件事切开。", "notes": ["再往下一层是堆层。table_tuple_lock 最终走到 heapam.c 的 heap_lock_tuple()。当这一行正被其他事务或者 MultiXact 影响时，它会看 wait_policy 决定怎么办。", "阻塞型就用 XactLockTableWait / MultiXactIdWait，真的睡下去；报错型直接抛；SKIP 型用的是 Conditional* 系列：ConditionalLockTupleTuplock 处理 tuple 级 tuplelock，ConditionalXactLockTableWait 处理普通事务，ConditionalMultiXactIdWait 处理 MultiXact。三种冲突源，三条路径。", "「Conditional」这个词是关键：它只做一次尝试，成功就拿到，失败立刻返回 false，绝不睡眠。然后 heap_lock_tuple 把结果设成 TM_WouldBlock，往上抛给 LockRows。", "所以 SKIP LOCKED 的性能特征是：它不产生等待，但它会产生扫描。你把「排队的时间」换成了「多扫几行的时间」。在候选集大的时候这笔交易很划算；在候选集小、热点集中的时候，你只是把等待换成了空转。"], "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah7p\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#245A6B\"/></marker><marker id=\"ah7a\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#BE653B\"/></marker><marker id=\"ah7g\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#2F7A66\"/></marker><marker id=\"ah7m\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#89938F\"/></marker><marker id=\"ah7k\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#46585F\"/></marker><marker id=\"ah7w\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#FFFFFF\"/></marker><marker id=\"ah7l\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#D9D5CB\"/></marker><marker id=\"ah7d\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#2E6373\"/></marker></defs><rect x=\"500.0\" y=\"22.0\" width=\"400.0\" height=\"54.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"700.0\" y=\"41.0\" font-size=\"11.4\" fill=\"#245A6B\" font-weight=\"400\" text-anchor=\"middle\" class=\"mono\">heap_lock_tuple()</text><text x=\"700.0\" y=\"58.8\" font-size=\"12.2\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"middle\">heapam.c · 这条 tuple 现在能不能锁</text><rect x=\"500.0\" y=\"96.0\" width=\"400.0\" height=\"44.0\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"700.0\" y=\"119.2\" font-size=\"11.6\" fill=\"#BE653B\" font-weight=\"500\" text-anchor=\"middle\">按 erm-&gt;waitPolicy 分三路</text><line x1=\"700.0\" y1=\"76.0\" x2=\"700.0\" y2=\"96.0\" stroke=\"#245A6B\" stroke-width=\"1.4\" marker-end=\"url(#ah7p)\"/><line x1=\"700.0\" y1=\"140.0\" x2=\"700.0\" y2=\"166.0\" stroke=\"#245A6B\" stroke-width=\"1.3\"/><line x1=\"290.0\" y1=\"166.0\" x2=\"1110.0\" y2=\"166.0\" stroke=\"#245A6B\" stroke-width=\"1.3\"/><line x1=\"290.0\" y1=\"166.0\" x2=\"290.0\" y2=\"178.0\" stroke=\"#245A6B\" stroke-width=\"1.3\" marker-end=\"url(#ah7p)\"/><line x1=\"700.0\" y1=\"166.0\" x2=\"700.0\" y2=\"178.0\" stroke=\"#245A6B\" stroke-width=\"1.3\" marker-end=\"url(#ah7p)\"/><line x1=\"1110.0\" y1=\"166.0\" x2=\"1110.0\" y2=\"178.0\" stroke=\"#245A6B\" stroke-width=\"1.3\" marker-end=\"url(#ah7p)\"/><rect x=\"100.0\" y=\"178.0\" width=\"380.0\" height=\"54.0\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\"/><text x=\"118.0\" y=\"202.0\" font-size=\"12.0\" fill=\"#245A6B\" font-weight=\"600\" class=\"mono\">LockWaitBlock</text><text x=\"118.0\" y=\"221.0\" font-size=\"11.5\" fill=\"#245A6B\" font-weight=\"500\">「阻塞」</text><rect x=\"100.0\" y=\"240.0\" width=\"380.0\" height=\"120.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"290.0\" y=\"284.7\" font-size=\"10.6\" fill=\"#245A6B\" font-weight=\"400\" text-anchor=\"middle\" class=\"mono\">XactLockTableWait()</text><text x=\"290.0\" y=\"300.5\" font-size=\"10.6\" fill=\"#245A6B\" font-weight=\"400\" text-anchor=\"middle\" class=\"mono\">MultiXactIdWait()</text><text x=\"290.0\" y=\"317.0\" font-size=\"11.3\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"middle\">真的睡到对方事务结束</text><rect x=\"510.0\" y=\"178.0\" width=\"380.0\" height=\"54.0\" rx=\"2\" fill=\"#F5EDDC\" stroke=\"#AE8A3E\" stroke-width=\"1\"/><text x=\"528.0\" y=\"202.0\" font-size=\"12.0\" fill=\"#AE8A3E\" font-weight=\"600\" class=\"mono\">LockWaitError</text><text x=\"528.0\" y=\"221.0\" font-size=\"11.5\" fill=\"#AE8A3E\" font-weight=\"500\">「报错」</text><rect x=\"510.0\" y=\"240.0\" width=\"380.0\" height=\"120.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"700.0\" y=\"284.7\" font-size=\"11.3\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"middle\">立即返回</text><text x=\"700.0\" y=\"301.1\" font-size=\"10.6\" fill=\"#245A6B\" font-weight=\"400\" text-anchor=\"middle\" class=\"mono\">ereport(ERROR, 55P03)</text><text x=\"700.0\" y=\"317.5\" font-size=\"11.3\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"middle\">应用层必须兜住这个错</text><rect x=\"920.0\" y=\"178.0\" width=\"380.0\" height=\"54.0\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\"/><text x=\"938.0\" y=\"202.0\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"600\" class=\"mono\">LockWaitSkip</text><text x=\"938.0\" y=\"221.0\" font-size=\"11.5\" fill=\"#BE653B\" font-weight=\"500\">「跳过」</text><rect x=\"920.0\" y=\"240.0\" width=\"380.0\" height=\"120.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1110.0\" y=\"277.5\" font-size=\"10.6\" fill=\"#245A6B\" font-weight=\"400\" text-anchor=\"middle\" class=\"mono\">ConditionalLockTupleTuplock()</text><text x=\"1110.0\" y=\"293.3\" font-size=\"10.6\" fill=\"#245A6B\" font-weight=\"400\" text-anchor=\"middle\" class=\"mono\">ConditionalXactLockTableWait()</text><text x=\"1110.0\" y=\"309.2\" font-size=\"10.6\" fill=\"#245A6B\" font-weight=\"400\" text-anchor=\"middle\" class=\"mono\">ConditionalMultiXactIdWait()</text><text x=\"1110.0\" y=\"324.8\" font-size=\"10.3\" fill=\"#BE653B\" font-weight=\"500\" text-anchor=\"middle\">失败 → TM_WouldBlock</text><line x1=\"100.0\" y1=\"372.0\" x2=\"1300.0\" y2=\"372.0\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"100.0\" y=\"402.0\" font-size=\"14.0\" fill=\"#BE653B\" font-weight=\"500\">阻塞型会睡；条件型只试一次 —— 三种冲突源、三条 Conditional 路径，同一种失败返回值。</text></svg>", "ctrl": ""}, {"eyebrow": "MVCC 与 EPQ", "title": "跳过的是锁冲突，不是可见性：MVCC 一个字节都没让", "lede": "候选集仍然由快照决定，索引仍然照常走。SKIP LOCKED 只在「候选行要不要加锁」这一步起作用，它不会让你看到不该看的行。", "caption": "图 07 · skip-locked-4 场景：S1 握快照被挂住，S2 更新同一行；S1 恢复后在等待路径上越过第一行。", "bridge": "语义边界清楚了，才敢谈取舍：四种抢法摆到一张表上。", "notes": ["这里必须切开一个误解：SKIP LOCKED 不绕过 MVCC。查询仍然先按快照、谓词、索引或扫描路径找出候选行；只有候选行需要被行锁保护时，才进入「等、报错、跳过」的分支。可见性判断在这之前就做完了。", "图上是 PostgreSQL 隔离测试 skip-locked-4.spec 覆盖的场景。会话 1 先取快照、看到 id=1，然后因为 advisory lock 停在那里；会话 2 更新了同一行并提交。会话 1 恢复后继续 FOR UPDATE SKIP LOCKED：它面对的是一个已经被更新过的 tuple，走 EPQ 重取最新版本、重检条件，然后在等待路径上跳过第一行，看到第二行。", "注意这里真正发生了什么：它没有「看不见」新版本，也没有「看见」不该看的东西；它是按规则发现这一行现在锁不住，于是跳过。可见性规则一个字节都没让。", "所以不能把 SKIP LOCKED 理解成「稳定地拿下一批最小 id」。它在并发下的准确语义是：在当前执行路径里，拿到一批此刻可以立即锁住的候选行。集合的成员取决于谁在什么时候锁了谁，不取决于你的 ORDER BY。"], "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah8p\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#245A6B\"/></marker><marker id=\"ah8a\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#BE653B\"/></marker><marker id=\"ah8g\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#2F7A66\"/></marker><marker id=\"ah8m\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#89938F\"/></marker><marker id=\"ah8k\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0, x=\"2\" fill=\"#FFFFFF\" stroke=\"#46585F\" stroke-width=\"1\"/><text x=\"740.0\" y=\"157.1\" font-size=\"11.0\" fill=\"#245A6B\" font-weight=\"400\" text-anchor=\"middle\" class=\"mono\">UPDATE id=1</text><line x1=\"600.0\" y1=\"156.0\" x2=\"364.0\" y2=\"156.0\" stroke=\"#89938F\" stroke-width=\"1.2\" stroke-dasharray=\"4 4\" marker-end=\"url(#ah8m)\"/><text x=\"482.0\" y=\"174.0\" font-size=\"10.5\" fill=\"#89938F\" font-weight=\"500\" text-anchor=\"middle\">新版本：对 S1 的快照不可见</text><rect x=\"640.0\" y=\"200.0\" width=\"200.0\" height=\"36.0\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"740.0\" y=\"219.1\" font-size=\"10.6\" fill=\"#245A6B\" font-weight=\"400\" text-anchor=\"middle\" class=\"mono\">COMMIT</text><rect x=\"150.0\" y=\"252.0\" width=\"420.0\" height=\"82.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#BE653B\" stroke-width=\"1\"/><text x=\"360.0\" y=\"285.4\" font-size=\"11.8\" fill=\"#1B2B33\" font-weight=\"500\" text-anchor=\"middle\">FOR UPDATE SKIP LOCKED 扫到 id=1</text><text x=\"360.0\" y=\"303.0\" font-size=\"11.8\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"middle\">EPQ 重检最新版本 → 已在等待路径</text><line x1=\"360.0\" y1=\"334.0\" x2=\"360.0\" y2=\"348.0\" stroke=\"#BE653B\" stroke-width=\"1.4\" marker-end=\"url(#ah8a)\"/><rect x=\"150.0\" y=\"348.0\" width=\"420.0\" height=\"40.0\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\"/><text x=\"360.0\" y=\"369.1\" font-size=\"11.2\" fill=\"#BE653B\" font-weight=\"500\" text-anchor=\"middle\">跳过 → 取 id=2 → 返回</text><text x=\"960.0\" y=\"106.0\" font-size=\"11.0\" fill=\"#BE653B\" font-weight=\"600\" class=\"mono\">01</text><text x=\"996.0\" y=\"106.0\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"600\">快照先定可见集</text><text x=\"996.0\" y=\"130.0\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\">SKIP LOCKED 不参与可见性判断</text><text x=\"960.0\" y=\"202.0\" font-size=\"11.0\" fill=\"#BE653B\" font-weight=\"600\" class=\"mono\">02</text><text x=\"996.0\" y=\"202.0\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"600\">EPQ 重检最新版本</text><text x=\"996.0\" y=\"226.0\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\">条件重新验证，再决定锁不锁</text><text x=\"960.0\" y=\"298.0\" font-size=\"11.0\" fill=\"#BE653B\" font-weight=\"600\" class=\"mono\">03</text><text x=\"996.0\" y=\"298.0\" font-size=\"13.5\" fill=\"#1B2B33\" font-weight=\"600\">跳过只发生在「加锁」</text><text x=\"996.0\" y=\"322.0\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"400\">不是过滤，也不是不可见</text></svg>", "ctrl": ""}, {"eyebrow": "横向对比", "title": "四种写法，四种不同的失败方式", "lede": "默认等待牺牲延迟，NOWAIT 牺牲可用性，SKIP LOCKED 牺牲完整性，乐观更新牺牲确定性。选哪个，取决于你能接受哪种失败。", "caption": "图 08 · 同一行数据，四种抢法：等待、报错、跳过、更新 0 行后重试。", "bridge": "但「接受遗漏」这四个字，在队列里便宜，在账本里昂贵——下面把代价摊开。", "notes": ["把四种抢法摆在一张表上。默认 FOR UPDATE：冲突就等，视图最接近完整候选集，但队头阻塞时吞吐很差。适合强一致的业务修改，比如扣库存、改订单状态机；不适合高并发任务领取。", "NOWAIT：冲突就报错，你连业务结果都拿不到。它的价值在于快速探测——比如管理操作想确认这行有没有人在改。它不适合普通 worker 消费，因为 worker 要的是任务，不是错误。", "SKIP LOCKED：冲突就跳过，视图有意不完整，多消费者队列里吞吐最好，但可能饿死热点行。它不适合金融撮合、审计这类必须按顺序处理的路径。", "第四种是应用层乐观更新：UPDATE ... WHERE version = ?，影响 0 行就重试。它没有锁等待，但高并发下重试很多，而且多表复杂领取时很难写对。四种方案没有绝对优劣，只有一个问题要回答：这个业务，能不能接受「这次先不处理某些行」。"], "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah9p\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#245A6B\"/></marker><marker id=\"ah9a\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#BE653B\"/></marker><marker id=\"ah9g\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#2F7A66\"/></marker><marker id=\"ah9m\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#89938F\"/></marker CFBF8\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1096.0\" y=\"388.0\" font-size=\"12.5\" fill=\"#46585F\" font-weight=\"400\">多表复杂领取</text></svg>", "ctrl": ""}, {"eyebrow": "代价之一：扫描放大", "title": "跳过不是免费的：成本从「等」变成「扫」", "lede": "锁得越多，要凑够 LIMIT 就得扫得越远。这个代价随热点比例非线性上升——但它是可测的，不需要猜。", "ctrl": "<span class=\"cl\">拖动看代价</span><input type=\"range\" id=\"scRange\" min=\"0\" max=\"7\" step=\"1\" value=\"0\"><button class=\"btn play\" id=\"scPlay\">▶ 播放</button><button class=\"btn\" id=\"scStep\">单步 ▸</button><button class=\"btn\" id=\"scReset\">重置</button><div class=\"out\" id=\"scOut\"></div>", "bridge": "扫描是可测的成本，饥饿是不可测的成本——它需要一条回路。", "notes": ["第一个代价是扫描。要凑够 LIMIT 10，如果候选行里有一半被锁着，你平均要扫 20 行；锁八成，就要扫 50 行；锁九成，100 行候选才凑得出 10 行。这个曲线不是线性的，它在接近饱和时陡得吓人。", "注意图上标了「示意模型」——假设锁在候选集里均匀分布。真实系统里热点往往是聚集的，可能更糟，也可能因为部分索引把范围切小反而更好。所以这不是一个可以引用的数字，而是一个可以自己测的形状。", "可测的方法只有一个：EXPLAIN (ANALYZE, BUFFERS)。看 LockRows 上游扫了多少行、最终返回多少行，这两个数字的比值就是你的「跳过税」。它在 1 附近，说明队列健康；它到 5、到 10，说明候选集在被浪费，该动索引、动分区，或者动批量大小了。", "顺带说一句索引。领取路径最好有一个部分索引：WHERE status='ready'，然后 ORDER BY priority DESC, run_at, id。部分索引把非 ready 的行直接排除在扫描范围外，你交的跳过税只发生在真正竞争的 ready 集合里，而不是整张历史表。"], "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah10p\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#245A6B\"/></marker><marker id=\"ah10a\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#BE653B\"/></marker><marker id=\"ah10g\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#2F7A66\"/></marker><marker id=\"ah10m\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#89938F\"/></marker><marker
