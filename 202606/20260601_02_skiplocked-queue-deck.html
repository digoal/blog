y2=\"350.0\" stroke=\"#46585F\" stroke-width=\"1.2\"/><line x1=\"200.0\" y1=\"350.0\" x2=\"840.0\" y2=\"350.0\" stroke=\"#46585F\" stroke-width=\"1.2\"/><text x=\"200.0\" y=\"52.0\" font-size=\"11.0\" fill=\"#46585F\" font-weight=\"500\">↑ 需扫描的行数</text><text x=\"200.0\" y=\"398.0\" font-size=\"11.0\" fill=\"#46585F\" font-weight=\"500\">被锁比例（%）→</text><polyline points=\"200.0,322.0 288.6,313.6 377.1,302.4 465.7,294.0 554.3,280.0 642.9,254.8 731.4,210.0 820.0,70.0\" fill=\"none\" stroke=\"#245A6B\" stroke-width=\"2\"/><circle cx=\"200.0\" cy=\"322.0\" r=\"3.4\" fill=\"#FFFFFF\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><text x=\"200.0\" y=\"372.0\" font-size=\"10.5\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"middle\" class=\"mono\">0</text><circle cx=\"288.6\" cy=\"313.6\" r=\"3.4\" fill=\"#FFFFFF\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><text x=\"288.6\" y=\"372.0\" font-size=\"10.5\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"middle\" class=\"mono\">20%</text><circle cx=\"377.1\" cy=\"302.4\" r=\"3.4\" fill=\"#FFFFFF\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><text x=\"377.1\" y=\"372.0\" font-size=\"10.5\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"middle\" class=\"mono\">40%</text><circle cx=\"465.7\" cy=\"294.0\" r=\"3.4\" fill=\"#FFFFFF\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><text x=\"465.7\" y=\"372.0\" font-size=\"10.5\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"middle\" class=\"mono\">50%</text><circle cx=\"554.3\" cy=\"280.0\" r=\"3.4\" fill=\"#FFFFFF\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><text x=\"554.3\" y=\"372.0\" font-size=\"10.5\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"middle\" class=\"mono\">60%</text><circle cx=\"642.9\" cy=\"254.8\" r=\"3.4\" fill=\"#FFFFFF\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><text x=\"642.9\" y=\"372.0\" font-size=\"10.5\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"middle\" class=\"mono\">70%</text><circle cx=\"731.4\" cy=\"210.0\" r=\"3.4\" fill=\"#FFFFFF\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><text x=\"731.4\" y=\"372.0\" font-size=\"10.5\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"middle\" class=\"mono\">80%</text><circle cx=\"820.0\" cy=\"70.0\" r=\"3.4\" fill=\"#FFFFFF\" stroke=\"#245A6B\" stroke-width=\"1.6\"/><text x=\"820.0\" y=\"372.0\" font-size=\"10.5\" fill=\"#89938F\" font-weight=\"400\" text-anchor=\"middle\" class=\"mono\">90%</text><line id=\"scCursor\" x1=\"200\" y1=\"70\" x2=\"200\" y2=\"350\" stroke=\"#BE653B\" stroke-width=\"1.4\" stroke-dasharray=\"4 4\" opacity=\"0.85\"/><circle id=\"scDot\" cx=\"200\" cy=\"322\" r=\"7\" fill=\"#BE653B\" stroke=\"#FFFFFF\" stroke-width=\"2\"/><text id=\"scTag\" x=\"212\" y=\"304\" font-size=\"12\" fill=\"#BE653B\" font-weight=\"700\" text-anchor=\"start\" class=\"mono\">10</text><rect x=\"920.0\" y=\"62.0\" width=\"440.0\" height=\"80.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"940.0\" y=\"90.0\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"500\" letter-spacing=\"1.4\">被锁比例</text><text id=\"scP\" x=\"940\" y=\"126\" font-size=\"30\" fill=\"#1B2B33\" font-weight=\"600\" class=\"mono\">—</text><rect x=\"920.0\" y=\"158.0\" width=\"440.0\" height=\"80.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"940.0\" y=\"186.0\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"500\" letter-spacing=\"1.4\">需扫描</text><text id=\"scN\" x=\"940\" y=\"222\" font-size=\"30\" fill=\"#1B2B33\" font-weight=\"600\" class=\"mono\">—</text><rect x=\"920.0\" y=\"254.0\" width=\"440.0\" height=\"80.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"940.0\" y=\"282.0\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"500\" letter-spacing=\"1.4\">跳过税</text><text id=\"scRatio\" x=\"940\" y=\"318\" font-size=\"30\" fill=\"#1B2B33\" font-weight=\"600\" class=\"mono\">—</text><text id=\"scMsg\" x=\"920\" y=\"378\" font-size=\"12.5\" fill=\"#BE653B\" font-weight=\"600\">轻负载：跳过税接近 1×，队列健康</text><text x=\"920.0\" y=\"402.0\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"400\">示意模型：100 条候选、LIMIT 10、锁均匀分布；非实测数字。</text></svg>", "caption": ""}, {"eyebrow": "代价之二：饥饿与回收", "title": "被跳过的行不会自己回来：需要一条兜底回路", "lede": "SKIP LOCKED 让别的 worker 绕开问题任务，但它不会让问题任务恢复。状态机和超时回收不是配套优化，是这个方案的一部分。", "caption": "图 09 · 五个状态、两条出口，以及一条从 running 回到 ready 的回收回路。没有那条回路，running 就是黑洞。", "bridge": "有了回路，才谈写法：怎么把「选中」和「改状态」压成一条语句。", "notes": ["第二个代价更隐蔽：被跳过的行不会自己回来。一个 worker 拿到任务、改了 running、然后进程被 kill，或者机器重启，这一行就永远停在 running。SKIP LOCKED 让别的 worker 可以绕开它，但也让它彻底从 ready 的世界里消失。", "所以超时回收不是优化项，是这个方案的一部分：把 running 超过 N 分钟、retry 次数没超上限的行改回 ready，retry_count 加一，run_at 往后推一点。图上那条从 running 回到 ready 的虚线，就是这套方案的免疫系统。", "状态机也要写清楚。ready → running → done / failed 是最小集。只有 running 状态才有 locked_at 可以用来判断超时；如果你图省事只写一个 status 字段来回改，超时回收就无从下手。", "还有最后一层保险：扫尾。因为 SKIP LOCKED 会主动跳过冲突行，「这一批跑完了」不等于「所有匹配行都处理完了」。对必须最终处理完的场景，要有一个不带 SKIP LOCKED、不带 LIMIT 的兜底流程，或者一个定时对账。官方 UPDATE 文档也提醒过这一点。"], "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah11p\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#245A6B\"/></marker><marker id=\"ah11a\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#BE653B\"/></marker><marker id=\"ah11g\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#2F7A66\"/></marker><marker id=\"ah11m\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#89938F\"/></marker><marker id=\"ah11k\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#46585F\"/></marker><marker id=\"ah11w\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#FFFFFF\"/></marker><marker id=\"ah11l\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#D9D5CB\"/></marker><marker id=\"ah11d\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#2E6373\"/></marker></defs><rect x=\"120.0\" y=\"170.0\" width=\"300.0\" height=\"76.0\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\"/><text x=\"270.0\" y=\"200.6\" font-size=\"14.9\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"middle\" class=\"serif\">ready</text><text x=\"270.0\" y=\"220.3\" font-size=\"11.9\" fill=\"#245A6B\" font-weight=\"400\" text-anchor=\"middle\" class=\"mono\">status='ready' AND run_at&lt;=now()</text><rect x=\"560.0\" y=\"170.0\" width=\"260.0\" height=\"76.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#46585F\" stroke-width=\"1\"/><text x=\"690.0\" y=\"200.0\" font-size=\"14.9\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"middle\" class=\"serif\">running</text><text x=\"690.0\" y=\"220.4\" font-size=\"12.7\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"middle\">locked_by / locked_at 已写入</text><rect x=\"960.0\" y=\"90.0\" width=\"260.0\" height=\"76.0\" rx=\"2\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\"/><text x=\"1090.0\" y=\"120.0\" font-size=\"14.9\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"middle\" class=\"serif\">done</text><text x=\"1090.0\" y=\"140.4\" font-size=\"12.7\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"middle\">清空 locked_*</text><rect x=\"960.0\" y=\"258.0\" width=\"260.0\" height=\"76.0\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\"/><text x=\"1090.0\" y=\"288.0\" font-size=\"14.9\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"middle\" class=\"serif\">failed</text><text x=\"1090.0\" y=\"308.4\" font-size=\"12.7\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"middle\">记录错误 / 人工介入</text><line x1=\"420.0\" y1=\"208.0\" x2=\"556.0\" y2=\"208.0\" stroke=\"#245A6B\" stroke-width=\"1.4\" marker-end=\"url(#ah11p)\"/><text x=\"488.0\" y=\"200.0\" font-size=\"10.5\" fill=\"#245A6B\" font-weight=\"600\" text-anchor=\"middle\">领取并加锁</text><line x1=\"820.0\" y1=\"196.0\" x2=\"890.0\" y2=\"196.0\" stroke=\"#2F7A66\" stroke-width=\"1.4\"/><line x1=\"890.0\" y1=\"196.0\" x2=\"890.0\" y2=\"128.0\" stroke=\"#2F7A66\" stroke-width=\"1.4\"/><line x1=\"890.0\" y1=\"128.0\" x2=\"956.0\" y2=\"128.0\" stroke=\"#2F7A66\" stroke-width=\"1.4\" marker-end=\"url(#ah11g)\"/><line x1=\"820.0\" y1=\"224.0\" x2=\"920.0\" y2=\"224.0\" stroke=\"#BE653B\" stroke-width=\"1.4\"/><line x1=\"920.0\" y1=\"224.0\" x2=\"920.0\" y2=\"296.0\" stroke=\"#BE653B\" stroke-width=\"1.4\"/><line x1=\"920.0\" y1=\"296.0\" x2=\"956.0\" y2=\"296.0\" stroke=\"#BE653B\" stroke-width=\"1.4\" marker-end=\"url(#ah11a)\"/><text x=\"846.0\" y=\"188.0\" font-size=\"10.5\" fill=\"#2F7A66\" font-weight=\"600\">完成</text><text x=\"846.0\" y=\"246.0\" font-size=\"10.5\" fill=\"#BE653B\" font-weight=\"600\">失败</text><line x1=\"690.0\" y1=\"246.0\" x2=\"690.0\" y2=\"376.0\" stroke=\"#BE653B\" stroke-width=\"1.4\" stroke-dasharray=\"6 4\"/><line x1=\"690.0\" y1=\"376.0\" x2=\"270.0\" y2=\"376.0\" stroke=\"#BE653B\" stroke-width=\"1.4\" stroke-dasharray=\"6 4\"/><line x1=\"270.0\" y1=\"376.0\" x2=\"270.0\" y2=\"250.0\" stroke=\"#BE653B\" stroke-width=\"1.4\" stroke-dasharray=\"6 4\" marker-end=\"url(#ah11a)\"/><text x=\"480.0\" y=\"396.0\" font-size=\"12.0\" fill=\"#BE653B\" font-weight=\"600\" text-anchor=\"middle\">超时回收：5 分钟未提交 → ready，retry_count + 1</text><text x=\"960.0\" y=\"372.0\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"400\">只有 running 才有 locked_at</text><text x=\"960.0\" y=\"392.0\" font-size=\"11.5\" fill=\"#89938F\" font-weight=\"400\">可供判定超时</text></svg>", "ctrl": ""}, {"eyebrow": "正确写法", "title": "一条语句完成领取：CTE 里加锁，外层只改已锁到的行", "lede": "分两条语句，要么多一个事务边界，要么在中间丢掉锁。把选取和状态流转压进一条语句，是为了让「锁住」和「标记 running」成为同一个原子动作。", "caption": "图 10 · 语句结构：CTE 负责挑并锁，UPDATE 负责改并返回；LIMIT 在 CTE 内，决定一批的大小。", "bridge": "领取只是上半场；下半场的完成、超时、幂等，决定它能不能长期跑。", "notes": ["写法上，最重要的一条是：把「选中可锁行」和「改成 running」压进一条语句。CTE 里做 SELECT ... FOR UPDATE SKIP LOCKED，外层 UPDATE 只更新 CTE 已经锁住的那批 id。", "为什么不能分两条？因为你在两条语句之间要么多一个事务边界（锁已经放了），要么在同一个事务里持锁去做别的事（锁被拉长）。一条语句的好处是：锁和状态标记在同一个原子动作里完成，RETURNING 还能一次把 payload 带回来，省一次往返。", "三个细节别写错。第一，LIMIT 写在 CTE 内部，它决定这一批的大小，不是外层。第二，ORDER BY 一定要有稳定的 tie-breaker，priority 相同的时候用 run_at、id 兜住，否则多个 worker 的扫描顺序会抖。第三，完成任务时要带上 locked_by = $worker，防止 worker 误完成别人的任务。", "批量大小是个权衡：太小，往返次数多、连接开销大；太大，一个事务持有几百个行锁，别人要跳过的行就更多，反而推高跳过税。经验上从几十开始试，用执行计划和 pg_stat_activity 的锁等待来调。"], "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah12p\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#245A6B\"/></marker><marker id=\"ah12a\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#BE653B\"/></marker><marker id=\"ah12g\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#2F7A66\"/></marker><marker id=\"ah12m\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#89938F\"/></marker><marker id=\"ah12k\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#46585F\"/></marker><marker id=\"ah12w\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#FFFFFF\"/></marker><marker id=\"ah12l\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#D9D5CB\"/></marker><marker id=\"ah12d\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#2E6373\"/></marker></defs><rect x=\"80.0\" y=\"24.0\" width=\"760.0\" height=\"342.0\" rx=\"2\" fill=\"#FCFBF8\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><rect x=\"81.0\" y=\"163.1\" width=\"758.0\" height=\"18.1\" fill=\"#F7E9DE\" opacity=\"0.6\"/><rect x=\"81.0\" y=\"163.1\" width=\"3\" height=\"18.1\" fill=\"#BE653B\"/><text x=\"96.0\" y=\"43.5\" font-size=\"11.5\" fill=\"#245A6B\" font-weight=\"600\" class=\"mono\" xml:space=\"preserve\">WITH picked AS (</text><text x=\"96.0\" y=\"62.1\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\" xml:space=\"preserve\">  SELECT id</text><text x=\"96.0\" y=\"80.8\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\" xml:space=\"preserve\">  FROM job_queue</text><text x=\"96.0\" y=\"99.4\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\" xml:space=\"preserve\">  WHERE status = 'ready'</text><text x=\"96.0\" y=\"118.0\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\" xml:space=\"preserve\">    AND run_at &lt;= now()</text><text x=\"96.0\" y=\"136.7\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\" xml:space=\"preserve\">  ORDER BY priority DESC, run_at, id</text><text x=\"96.0\" y=\"155.3\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\" xml:space=\"preserve\">  LIMIT 100</text><text x=\"96.0\" y=\"173.9\" font-size=\"11.5\" fill=\"#245A6B\" font-weight=\"600\" class=\"mono\" xml:space=\"preserve\">  FOR UPDATE SKIP LOCKED</text><text x=\"96.0\" y=\"192.5\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\" xml:space=\"preserve\">)</text><text x=\"96.0\" y=\"211.2\" font-size=\"11.5\" fill=\"#245A6B\" font-weight=\"600\" class=\"mono\" xml:space=\"preserve\">UPDATE job_queue AS j</text><text x=\"96.0\" y=\"229.8\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\" xml:space=\"preserve\">SET status = 'running',</text><text x=\"96.0\" y=\"248.4\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\" xml:space=\"preserve\">    locked_by = $1,</text><text x=\"96.0\" y=\"267.1\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\" xml:space=\"preserve\">    locked_at = clock_timestamp()</text><text x=\"96.0\" y=\"285.7\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\" xml:space=\"preserve\">FROM picked</text><text x=\"96.0\" y=\"304.3\" font-size=\"11.5\" fill=\"#46585F\" font-weight=\"400\" class=\"mono\" xml:space=\"preserve\">WHERE j.id = picked.id</text><text x=\"96.0\" y=\"322.9\" font-size=\"11.5\" fill=\"#245A6B\" font-weight=\"600\" class=\"mono\" xml:space=\"preserve\">RETURNING j.id, j.payload;</text><rect x=\"880.0\" y=\"24.0\" width=\"480.0\" height=\"108.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1120.0\" y=\"60.5\" font-size=\"14.9\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"middle\" class=\"serif\">① 锁写在 CTE 里</text><text x=\"1120.0\" y=\"80.9\" font-size=\"12.7\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"middle\">FOR UPDATE 在内层子查询</text><text x=\"1120.0\" y=\"99.9\" font-size=\"12.7\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"middle\">外层 UPDATE 不再重复加锁</text><rect x=\"880.0\" y=\"146.0\" width=\"480.0\" height=\"108.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1120.0\" y=\"182.4\" font-size=\"14.9\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"middle\" class=\"serif\">② LIMIT 写在 CTE 里</text><text x=\"1120.0\" y=\"202.9\" font-size=\"12.7\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"middle\">批量大小由内层决定</text><text x=\"1120.0\" y=\"221.9\" font-size=\"12.7\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"middle\">不是在外层截断</text><rect x=\"880.0\" y=\"268.0\" width=\"480.0\" height=\"108.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"1120.0\" y=\"304.4\" font-size=\"14.9\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"middle\" class=\"serif\">③ RETURNING 一次带回</text><text x=\"1120.0\" y=\"324.9\" font-size=\"12.7\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"middle\">省掉二次查询</text><text x=\"1120.0\" y=\"343.9\" font-size=\"12.7\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"middle\">payload 同一往返拿到</text><text x=\"80.0\" y=\"400.0\" font-size=\"12.5\" fill=\"#89938F\" font-weight=\"400\">分两条语句：要么多一个事务边界（锁已放），要么在中间持锁做别的事（锁被拉长）。</text></svg>", "ctrl": ""}, {"eyebrow": "决策路径", "title": "该不该用：问三个问题，任一答「否」就别用", "lede": "能不能接受乱序与延迟？重复执行一次结果会不会变？卡住的任务有没有人兜底回收？三道门都是必要条件。", "caption": "图 11 · 三道门都是必要条件：允许乱序、允许重复、允许延迟；任何一道过不去，问题不在锁，在模型。", "bridge": "三道门过了，剩下的就是三个角色各自要守的线。", "notes": ["落到决策上，我把它压成三道门。第一问：这批任务晚几分钟、换个顺序处理，业务能不能接受？如果答案是否——比如撮合、余额、审批顺序——那就别用，老老实实排队或者串行化。", "第二问：同一个任务被执行两次，结果会不会变？worker 崩溃、超时回收、重复领取，这三件事在 SKIP LOCKED 的世界里都是常态。没有幂等键，跳过就变成了重复扣款。", "第三问：卡住的任务有没有人兜底？没有超时回收、没有扫尾、没有对账，那 running 就是数据黑洞，你只是把「阻塞」换成了「失踪」。", "三道门都是必要条件。过了不代表可以直接上，还得有索引、有批量大小的控制、有监控；但任何一道过不去，问题就不在锁上，在模型上——你需要的不是 SKIP LOCKED，是先把这个队列的业务语义想清楚。"], "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah13p\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#245A6B\"/></marker><marker id=\"ah13a\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#BE653B\"/></marker><marker id=\"ah13g\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#2F7A66\"/></marker><marker id=\"ah13m\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#89938F\"/></marker><marker id=\"ah13k\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#46585F\"/></marker><marker id=\"ah13w\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#FFFFFF\"/></marker><marker id=\"ah13l\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#D9D5CB\"/></marker><marker id=\"ah13d\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#2E6373\"/></marker></defs><rect x=\"100.0\" y=\"24.0\" width=\"370.0\" height=\"64.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#245A6B\" stroke-width=\"1\"/><text x=\"285.0\" y=\"48.0\" font-size=\"14.9\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"middle\" class=\"serif\">① 允许乱序与延迟吗</text><text x=\"285.0\" y=\"68.4\" font-size=\"12.7\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"middle\">任务晚几秒、换个顺序，业务不受影响</text><rect x=\"100.0\" y=\"120.0\" width=\"370.0\" height=\"64.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#245A6B\" stroke-width=\"1\"/><text x=\"285.0\" y=\"144.0\" font-size=\"14.9\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"middle\" class=\"serif\">② 重复执行结果会变吗</text><text x=\"285.0\" y=\"164.4\" font-size=\"12.7\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"middle\">worker 崩溃 / 超时回收 / 重复领取是常态</text><rect x=\"100.0\" y=\"216.0\" width=\"370.0\" height=\"64.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#245A6B\" stroke-width=\"1\"/><text x=\"285.0\" y=\"240.0\" font-size=\"14.9\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"middle\" class=\"serif\">③ 卡住的任务有人兜底吗</text><text x=\"285.0\" y=\"260.4\" font-size=\"12.7\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"middle\">超时回收、扫尾、对账是否已经到位</text><rect x=\"720.0\" y=\"24.0\" width=\"460.0\" height=\"64.0\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\"/><text x=\"950.0\" y=\"48.0\" font-size=\"14.9\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"middle\" class=\"serif\">不能接受乱序 → 停</text><text x=\"950.0\" y=\"68.4\" font-size=\"12.7\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"middle\">改用默认等待，或按业务键串行化</text><line x1=\"470.0\" y1=\"56.0\" x2=\"716.0\" y2=\"56.0\" stroke=\"#BE653B\" stroke-width=\"1.4\" marker-end=\"url(#ah13a)\"/><text x=\"590.0\" y=\"48.0\" font-size=\"11.0\" fill=\"#BE653B\" font-weight=\"700\" text-anchor=\"middle\">否</text><rect x=\"720.0\" y=\"120.0\" width=\"460.0\" height=\"64.0\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\"/><text x=\"950.0\" y=\"144.0\" font-size=\"14.9\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"middle\" class=\"serif\">重复会改变结果 → 停</text><text x=\"950.0\" y=\"164.4\" font-size=\"12.7\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"middle\">先补幂等键，再谈跳过</text><line x1=\"470.0\" y1=\"152.0\" x2=\"716.0\" y2=\"152.0\" stroke=\"#BE653B\" stroke-width=\"1.4\" marker-end=\"url(#ah13a)\"/><text x=\"590.0\" y=\"144.0\" font-size=\"11.0\" fill=\"#BE653B\" font-weight=\"700\" text-anchor=\"middle\">否</text><rect x=\"720.0\" y=\"216.0\" width=\"460.0\" height=\"64.0\" rx=\"2\" fill=\"#F7E9DE\" stroke=\"#BE653B\" stroke-width=\"1\"/><text x=\"950.0\" y=\"240.0\" font-size=\"14.9\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"middle\" class=\"serif\">没人兜底 → 停</text><text x=\"950.0\" y=\"260.4\" font-size=\"12.7\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"middle\">先补超时回收，否则 running 是黑洞</text><line x1=\"470.0\" y1=\"248.0\" x2=\"716.0\" y2=\"248.0\" stroke=\"#BE653B\" stroke-width=\"1.4\" marker-end=\"url(#ah13a)\"/><text x=\"590.0\" y=\"240.0\" font-size=\"11.0\" fill=\"#BE653B\" font-weight=\"700\" text-anchor=\"middle\">否</text><line x1=\"285.0\" y1=\"88.0\" x2=\"285.0\" y2=\"120.0\" stroke=\"#2F7A66\" stroke-width=\"1.4\" marker-end=\"url(#ah13g)\"/><line x1=\"285.0\" y1=\"184.0\" x2=\"285.0\" y2=\"216.0\" stroke=\"#2F7A66\" stroke-width=\"1.4\" marker-end=\"url(#ah13g)\"/><line x1=\"285.0\" y1=\"280.0\" x2=\"285.0\" y2=\"312.0\" stroke=\"#2F7A66\" stroke-width=\"1.4\" marker-end=\"url(#ah13g)\"/><text x=\"296.0\" y=\"108.0\" font-size=\"12.0\" fill=\"#2F7A66\" font-weight=\"700\">是</text><text x=\"296.0\" y=\"204.0\" font-size=\"12.0\" fill=\"#2F7A66\" font-weight=\"700\">是</text><rect x=\"100.0\" y=\"312.0\" width=\"370.0\" height=\"64.0\" rx=\"2\" fill=\"#E4F0EA\" stroke=\"#2F7A66\" stroke-width=\"1\"/><text x=\"285.0\" y=\"335.7\" font-size=\"15.4\" fill=\"#1B2B33\" font-weight=\"700\" text-anchor=\"middle\" class=\"serif\">用 FOR UPDATE SKIP LOCKED</text><text x=\"285.0\" y=\"356.9\" font-size=\"13.2\" fill=\"#46585F\" font-weight=\"400\" text-anchor=\"middle\">+ 状态机 + 超时回收 + 幂等</text><text x=\"296.0\" y=\"300.0\" font-size=\"12.0\" fill=\"#2F7A66\" font-weight=\"700\">是</text><text x=\"500.0\" y=\"410.0\" font-size=\"12.0\" fill=\"#89938F\" font-weight=\"400\">三道门是必要条件，不是充分条件：索引、批量大小、监控仍然要单独设计。</text></svg>", "ctrl": ""}, {"eyebrow": "落地清单", "title": "三个角色，三组不同的红线", "lede": "架构师管模型和边界，DBA 管观测和膨胀，开发者管事务长度和幂等。同一套机制，三种失败模式。", "caption": "图 12 · 同一张队列表，三种视角：谁允许跳过、谁负责发现异常、谁保证重复执行不出事。", "bridge": "线划完了，把八个反复出现的坑一次列清。", "notes": ["给三个角色分别划红线。架构师管边界：SKIP LOCKED 只放在队列、批处理、补偿、后台任务这些允许乱序或延迟的模型里；任务表必须有明确状态机；领取路径必须有匹配 WHERE 和 ORDER BY 的部分索引；强顺序业务保持警惕。", "DBA 管观测：盯 pg_stat_activity 里的 lock wait、长事务、idle in transaction，长事务会让大量任务被持续跳过；盯队列表膨胀，高频 ready/running/done 更新会产生大量 MVCC 版本；用 EXPLAIN (ANALYZE, BUFFERS) 看 LockRows 上游扫描量和返回量的比值；历史任务归档或分区。", "开发者管事务长度：worker 领取后尽快提交，绝不在持有行锁期间做 HTTP 调用、跑大模型、上传对象存储。正确顺序是：先改成 running 并提交，再做外部调用，最后用幂等条件完成任务。", "还有一条心态上的红线：不要用 SKIP LOCKED 判断「没有任务」。它只能说明「本次没有找到可立即锁住且满足条件的任务」，这两句话差得很远。监控告警如果建立在前者上，你会错过真正的积压。"], "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah14p\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#245A6B\"/></marker><marker id=\"ah14a\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#BE653B\"/></marker><marker id=\"ah14g\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#2F7A66\"/></marker><marker id=\"ah14m\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#89938F\"/></marker><marker id=\"ah14k\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#46585F\"/></marker><marker id=\"ah14w\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#FFFFFF\"/></marker><marker id=\"ah14l\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#D9D5CB\"/></marker><marker id=\"ah14d\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#2E6373\"/></marker></defs><rect x=\"100.0\" y=\"26.0\" width=\"400.0\" height=\"80.0\" rx=\"2\" fill=\"#E5EFF0\" stroke=\"#245A6B\" stroke-width=\"1\"/><text x=\"122.0\" y=\"60.0\" font-size=\"20.0\" fill=\"#245A6B\" font-weight=\"700\" class=\"serif\">架构师</text><text x=\"122.0\" y=\"88.0\" font-size=\"12.0\" fill=\"#245A6B\" font-weight=\"500\">定模型与边界</text><rect x=\"100.0\" y=\"116.0\" width=\"400.0\" height=\"64.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"118.0\" y=\"153.0\" font-size=\"10.5\" fill=\"#BE653B\" font-weight=\"600\" class=\"mono\">01</text><text x=\"152.0\" y=\"153.0\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"500\">只放在队列、批处理、补偿、后台任务</text><rect x=\"100.0\" y=\"188.0\" width=\"400.0\" height=\"64.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"118.0\" y=\"225.0\" font-size=\"10.5\" fill=\"#BE653B\" font-weight=\"600\" class=\"mono\">02</text><text x=\"152.0\" y=\"225.0\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"500\">任务表必须有明确状态机</text><rect x=\"100.0\" y=\"260.0\" width=\"400.0\" height=\"64.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"118.0\" y=\"297.0\" font-size=\"10.5\" fill=\"#BE653B\" font-weight=\"600\" class=\"mono\">03</text><text x=\"152.0\" y=\"297.0\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"500\">领取路径建部分索引，列序匹配查询</text><rect x=\"100.0\" y=\"332.0\" width=\"400.0\" height=\"64.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"118.0\" y=\"369.0\" font-size=\"10.5\" fill=\"#BE653B\" font-weight=\"600\" class=\"mono\">04</text><text x=\"152.0\" y=\"369.0\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"500\">依赖严格顺序的业务不跳过</text><rect x=\"520.0\" y=\"26.0\" width=\"400.0\" height=\"80.0\" rx=\"2\" fill=\"#F1EFE9\" stroke=\"#46585F\" stroke-width=\"1\"/><text x=\"542.0\" y=\"60.0\" font-size=\"20.0\" fill=\"#46585F\" font-weight=\"700\" class=\"serif\">DBA</text><text x=\"542.0\" y=\"88.0\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"500\">看观测与膨胀</text><rect x=\"520.0\" y=\"116.0\" width=\"400.0\" height=\"64.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"538.0\" y=\"153.0\" font-size=\"10.5\" fill=\"#BE653B\" font-weight=\"600\" class=\"mono\">01</text><text x=\"572.0\" y=\"153.0\" font-size=\"12.0\" fill= "600\" class=\"mono\">02</text><text x=\"992.0\" y=\"225.0\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"500\">先改 running 提交，再执行外部调用</text><rect x=\"940.0\" y=\"260.0\" width=\"400.0\" height=\"64.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"958.0\" y=\"297.0\" font-size=\"10.5\" fill=\"#BE653B\" font-weight=\"600\" class=\"mono\">03</text><text x=\"992.0\" y=\"297.0\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"500\">任务必须幂等</text><rect x=\"940.0\" y=\"332.0\" width=\"400.0\" height=\"64.0\" rx=\"2\" fill=\"#FFFFFF\" stroke=\"#D9D5CB\" stroke-width=\"1\"/><text x=\"958.0\" y=\"369.0\" font-size=\"10.5\" fill=\"#BE653B\" font-weight=\"600\" class=\"mono\">04</text><text x=\"992.0\" y=\"369.0\" font-size=\"12.0\" fill=\"#46585F\" font-weight=\"500\">记录 locked_by / retry_count / 错误</text></svg>", "ctrl": ""}, {"eyebrow": "常见坑", "title": "八个坑，一半来自把「跳过」当成「没有」", "lede": "这八条几乎都在同一个误解上分叉：SKIP LOCKED 只是「这次没锁到」，不是「这行不该处理」，也不是「这行不存在」。", "caption": "图 13 · 左列是语义误解，右列是工程缺失。前者读文档就能避免，后者要靠设计习惯。", "bridge": "最后把它收成一句话，再留五个问题给你带走。", "notes": ["八个坑，一半来自同一个误解：把「跳过」当成「没有」。剩下的来自工程缺失：没有排序、没有扫尾、没有幂等、没有回收。", "语义类的四条：以为 SKIP LOCKED 不拿表锁——错，它只作用于行级锁，ROW SHARE 表锁照拿；在 CTE 外层写锁，以为 CTE 内部也会锁——错，锁定子句不会自动下沉进 WITH；只 SELECT 不 UPDATE 状态，事务外处理任务就失去了行锁保护；还有和 FETCH ... WITH TIES 混用，这个 PostgreSQL 直接报错，因为 WITH TIES 要按排序边界返回所有并列行，而 SKIP LOCKED 会有意跳过候选行，语义冲突。", "工程类的四条：持锁做慢操作；没有稳定排序导致扫描顺序抖动；没有最终扫尾，以为批处理跑完就处理完了；忽略 MultiXact 和共享锁场景——共享锁不是「没有冲突」，FOR SHARE SKIP LOCKED 在升级锁或遇到 MultiXact 时一样会跳过。", "这八条不需要背。你只要记住一句话：SKIP LOCKED 只说「这次没锁到」，它不说「这行不该处理」，更不说「这行不存在」。所有坑都是从这三句话的混淆里长出来的。"], "svg": "<svg class=\"figure\" width=\"1400\" height=\"430\" viewBox=\"0 0 1400 430\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah15p\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0.6 L10,5 L0,9.4 z\" fill=\"#245A6B\"/></marker><marker id=\"ah15a\" viewBox=\"0 0 10 10\" refX=\"9.5\" refY=\"5\" markerWidth=\"7\ const N = D.length;

const $ = s => document.querySelector(s);

/* 等比缩放 + letterbox */
function fit(){
  const vp = $('#viewport');
  const W = vp.clientWidth, H = vp.clientHeight;
  const s = Math.min(W/1600, H/900);
  const st = $('#stage');
  st.style.transform = 'scale(' + s + ')';
  st.style.left = ((W - 1600*s)/2) + 'px';
  st.style.top  = ((H -  900*s)/2) + 'px';
}
function fitAnim(){
  const t0 = performance.now();
  cancelAnimationFrame(fitRaf);
  (function step(){
    fit();
    if(performance.now() - t0 < 420) fitRaf = requestAnimationFrame(step);
  })();
}
window.addEventListener('resize', fit);

function render(){
  $('#slides').innerHTML = D.map((d,i) =>
    '<section class="slide" id="s'+i+'">'
    + '<div class="eyebrow"><span class="num">'+String(i+1).padStart(2,'0')+' / '+String(N).padStart(2,'0')+'</span>'+d.eyebrow+'</div>'
    + '<h1 class="title">'+d.title+'</h1>'
    + '<div class="lede">'+d.lede+'</div>'
    + '<div class="rule"></div>'
    + '<div class="figwrap">'+d.svg+'</div>'
    + (d.ctrl ? '<div class="ctrls">'+d.ctrl+'</div>' : '<div class="caption">'+d.caption+'</div>')
    + '<div class="bridge"><span class="bk">承接 · NEXT</span>'+d.bridge+'</div>'
    + '<div class="footer"><span class="fl">数据库筑基课 · 并发控制 & 应用最佳实践 · SKIP LOCKED</span>'
    + '<span class="fr">'+String(i+1).padStart(2,'0')+' / '+String(N).padStart(2,'0')+'</span></div>'
    + '</section>').join('');
}

function go(i, silent){
  i = Math.max(0, Math.min(N-1, i));
  $$('.slide').forEach((el,k)=>el.classList.toggle('on', k===i));
  cur = i;
  try{ localStorage.setItem('skiplocked-deck', String(i)); }catch(e){}
  $('.pg').textContent = String(i+1).padStart(2,'0') + ' / ' + String(N).padStart(2,'0');
  $('#track i').style.width = ((i+1)/N*100)+'%';
  if(!silent) toast('P' + String(i+1).padStart(2,'0') + ' · ' + D[i].eyebrow);
  if(railMode === 'one') paintRailOne();
  else if(railMode === 'all') railScroll(true);
  if(i === QIDX && typeof qPaint === 'function') qPaint();
  if(i === SIDX && typeof scPaint === 'function') scPaint();
}
function next(){ if(cur<N-1) go(cur+1); else stopAuto(); }
function prev(){ if(cur>0) go(cur-1); }

function toast(s){
  const t=$('#toast'); t.textContent=s; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1600);
}

/* 自动播放 */
function stopAuto(){
  autoOn=false; clearInterval(autoTimer); autoTimer=null;
  const b=$('#btnAuto'); b.textContent='▶ 自动播放'; b.classList.remove('act');
}
function toggleAuto(){
  if(autoOn){ stopAuto(); toast('已暂停自动播放'); return; }
  autoOn=true;
  const b=$('#btnAuto'); b.textContent='❚❚ 暂停自动播放'; b.classList.add('act');
  autoTimer=setInterval(()=>{ if(cur<N-1) go(cur+1); else stopAuto(); }, 14000);
  toast('自动播放：14 秒一页，翻页时右侧讲稿自动跟随');
}

/* ---------- 右侧讲稿栏（页内开窗，非弹窗） ---------- */
function railHTML(){
  if(railMode === 'one'){
    const d = D[cur];
    return '<div class="note act"><div class="nh">P'+String(cur+1).padStart(2,'0')
      +' · '+d.eyebrow+'</div><h4>'+d.title+'</h4>'
      + d.notes.map(p=>'<p>'+p+'</p>').join('')
      + '<div class="nb">'+d.bridge+'</div></div>';
  }
  return D.map((d,i)=>'<div class="note" id="note-'+i+'"><div class="nh">P'
      +String(i+1).padStart(2,'0')+' · '+d.eyebrow+'</div><h4>'+d.title+'</h4>'
      + d.notes.map(p=>'<p>'+p+'</p>').join('')+'</div>').join('');
}
function railHead(){
  const one = (railMode === 'one');
  $('#railHead').innerHTML =
    '<div class="rk">'+(one ? 'SCRIPT · 本页讲稿' : 'SCRIPT · 全文讲稿')+'</div>'
    + '<h3>'+(one ? D[cur].title : '全文讲述稿 · 共 '+N+' 页')+'</h3>'
    + '<div class="rm">'+(one ? 'P'+String(cur+1).padStart(2,'0')+' / '+String(N).padStart(2,'0')
        : '按当前页高亮　·　翻页自动跟随')+'</div>'
    + '<div class="rail-tools">'
    + '<button id="rOne" class="'+(one?'on':'')+'">本页 N</button>'
    + '<button id="rAll" class="'+(!one?'on':'')+'">全文 T</button>'
    + '<button id="rClose" class="x">关闭 ✕</button></div>';
  $('#rOne').onclick = ()=>openRail('one');
  $('#rAll').onclick = ()=>openRail('all');
  $('#rClose').onclick = ()=>closeRail();
}
function paintRailOne(){
  $('#railBody').innerHTML = railHTML();
  $('#railHead').innerHTML = '';
  railHead();
  $('#railBody').scrollTop = 0;
}
function railScroll(smooth){
  const body = $('#railBody');
  const el = document.getElementById('note-'+cur);
  if(!el) return;
  $$('#railBody .note').forEach(n=>n.classList.remove('act'));
  el.classList.add('act');
  const br = body.getBoundingClientRect(), er = el.getBoundingClientRect();
  const top = body.scrollTop + (er.top - br.top) - 6;
  if(smooth) body.scrollTo({top: top, behavior:'smooth'});
  else body.scrollTop = top;
}
function openRail(mode){
  const wasOpen = !!railMode;
  railMode = mode;
  document.body.classList.add('notes-open');
  document.body.classList.toggle('rail-one', mode === 'one');
  $('#railHead').innerHTML = ''; railHead();
  $('#railBody').innerHTML = railHTML();
  if(mode === 'one'){ $('#railBody').scrollTop = 0; }
  else { railScroll(false); }
  syncRailBtns();
  if(!wasOpen) fitAnim();          /* 画面矢量缩放到左侧 */
}
function closeRail(){
  railMode = null;
  document.body.classList.remove('notes-open','rail-one');
  syncRailBtns(); fitAnim();
}
function toggleRail(mode){
  if(!railMode) openRail(mode);
  else if(railMode === mode) closeRail();
  else openRail(mode);
}
function syncRailBtns(){
  $('#btnNotes').classList.toggle('act', railMode === 'one');
  $('#btnAll').classList.toggle('act', railMode === 'all');
}

/* ---------- 目录 / 帮助（模态） ---------- */
function closePanel(){ $('#veil').classList.remove('on'); }
function showPanel(inner){
  $('#panel').innerHTML = '<button class="close" onclick="closePanel()">关闭 ✕</button>' + inner;
  $('#veil').classList.add('on');
}
function toc(){
  showPanel('<h2>目录</h2><div class="psub">点击任意一页跳转 · 共 '+N+' 页</div><div class="grid">'
    + D.map((d,i)=>'<a onclick="jump('+i+')"><span class="gn">'+String(i+1).padStart(2,'0')+'</span>'
      +'<span class="gt">'+d.title+'</span></a>').join('') + '</div>');
}
function jump(i){ closePanel(); go(i); }
function help(){
  showPanel('<h2>快捷键</h2><div class="psub">演说时的操作备忘 · 全屏后底部按键依然可点</div><div class="keys">'
    + '<div><kbd>G</kbd>目录</div><div><kbd>N</kbd>本页讲稿（再按关闭）</div>'
    + '<div><kbd>T</kbd>全文讲稿（再按关闭）</div><div><kbd>P</kbd>自动播放 / 暂停</div>'
    + '<div><kbd>F</kbd>全屏 / 退出</div><div><kbd>→ 空格</kbd>下一页</div>'
    + '<div><kbd>←</kbd>上一页</div><div><kbd>1–9</kbd>直接跳页</div>'
    + '<div><kbd>Home / End</kbd>首页 / 末页</div><div><kbd>Esc</kbd>关闭讲稿或目录</div>'
    + '<div><kbd>?</kbd>本帮助</div><div><kbd>点击底部按钮</kbd>同上</div></div>');
}

/* ---------- 全屏：保留底部按键 ---------- */
function fs(){
  const el = document.documentElement;
  const entering = !document.body.classList.contains('immersive');
  if(entering){
    document.body.classList.add('immersive');
    $('#btnFs').textContent = '退出全屏 F';
    fitAnim();
    toast('全屏：底部按键仍然可用（F 或 Esc 退出）');
    try{
      const pr = el.requestFullscreen ? el.requestFullscreen() : null;
      if(pr && pr.catch) pr.catch(()=>{});
    }catch(e){}
  }else{
    document.body.classList.remove('immersive');
    $('#btnFs').textContent = '全屏 F';
    fitAnim();
    toast('已退出全屏');
    try{ if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen(); }catch(e){}
  }
}
document.addEventListener('fullscreenchange', ()=>{
  const b=$('#btnFs'); if(!b) return;
  if(!document.fullscreenElement && document.body.classList.contains('immersive')){
    document.body.classList.remove('immersive'); b.textContent='全屏 F';
  }
  fitAnim();
});

document.addEventListener('keydown', e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  const k=e.key;
  const typing=(tag==='input'||tag==='select'||tag==='textarea');
  const navKey=(k.indexOf('Arrow')===0||k===' '||k==='Home'||k==='End'||k==='PageUp'||k==='PageDown');
  if(k==='Escape'){
    if(railMode) closeRail();
    else if($('#veil').classList.contains('on')) closePanel();
    else if(document.body.classList.contains('immersive')) fs();
    return;
  }
  if($('#veil').classList.contains('on')) return;
  if(typing && navKey) return;
  if(k==='ArrowRight'||k===' '||k==='PageDown'){ e.preventDefault(); next(); }
  else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); prev(); }
  else if(k==='f'||k==='F'){ e.preventDefault(); fs(); }
  else if(k==='g'||k==='G'){ e.preventDefault(); toc(); }
  else if(k==='n'||k==='N'){ e.preventDefault(); toggleRail('one'); }
  else if(k==='t'||k==='T'){ e.preventDefault(); toggleRail('all'); }
  else if(k==='p'||k==='P'){ e.preventDefault(); toggleAuto(); }
  else if(k==='?'||k==='h'||k==='H'){ e.preventDefault(); help(); }
  else if(k==='Home'){ e.preventDefault(); go(0); }
  else if(k==='End'){ e.preventDefault(); go(N-1); }
  else if(/^[1-9]$/.test(k)){ go(parseInt(k,10)-1); }
});

/* ===== 动画 A：一次 LIMIT 3 的执行走位 ===== */
const QROWS=[{id:1,locked:true},{id:2,locked:false},{id:3,locked:true},
             {id:4,locked:false},{id:5,locked:false},{id:6,locked:false}];
const QSTEPS=[
 {row:-1,tried:0,skip:0,got:0,done:false,res:['','','','','',''],
  msg:'待开始：子计划还没有吐出任何候选行'},
 {row:0,tried:1,skip:1,got:0,done:false,res:['跳过','','','','',''],
  msg:'1 号被 A 事务锁住 → TM_WouldBlock → goto lnext，不计数'},
 {row:1,tried:1,skip:0,got:1,done:false,res:['跳过','返回 #1','','','',''],
  msg:'2 号空闲 → 加锁成功 → 返回第 1 行'},
 {row:2,tried:2,skip:2,got:1,done:false,res:['跳过','返回 #1','跳过','','',''],
  msg:'3 号被别的事务锁住 → 再次跳过，已尝试 3 行'},
 {row:3,tried:3,skip:2,got:2,done:false,res:['跳过','返回 #1','跳过','返回 #2','',''],
  msg:'4 号空闲 → 返回第 2 行'},
 {row:4,tried:5,skip:2,got:3,done:true,res:['跳过','返回 #1','跳过','返回 #2','返回 #3',''],
  msg:'5 号空闲 → 返回第 3 行，LIMIT 3 满足，停止扫描'},
 {row:-1,tried:5,skip:2,got:3,done:true,res:['跳过','返回 #1','跳过','返回 #2','返回 #3',''],
  msg:'收工：扫 5 行、跳过 2 行、返回 3 行，6 号从未被看过'}
];
const QIDX = 5;
let qStep = 0, qTimer = null, qPlaying = false;
function qPaint(){
  const st = QSTEPS[qStep];
  for(let i=0;i<QROWS.length;i++){
    const r = document.getElementById('qr'+i), p = document.getElementById('qp'+i);
    const x = document.getElementById('qx'+i);
    if(r){
      const on = (st.row===i);
      r.setAttribute('fill', on ? '#E5EFF0' : (i%2 ? '#FFFFFF' : '#FCFBF8'));
      r.setAttribute('stroke', on ? '#245A6B' : '#D9D5CB');
    }
    if(p) p.setAttribute('opacity', st.row===i ? '1' : '0');
    if(x){
      x.textContent = st.res[i];
      x.setAttribute('fill', st.res[i]==='跳过' ? '#BE653B' : (st.res[i] ? '#2F7A66' : '#C6C2B8'));
    }
  }
  const st_=(id,v)=>{ const e=document.getElementById(id); if(e) e.textContent=v; };
  st_('qTry', st.tried); st_('qSkip', st.skip); st_('qGot', st.got);
  const m = document.getElementById('qMsg'); if(m) m.textContent = st.msg;
  const b = document.getElementById('qBadge');
  if(b) b.setAttribute('opacity', st.done ? '1' : '0.25');
  const o = document.getElementById('qOut');
  if(o) o.innerHTML = '第 <b>'+qStep+'</b>/'+ (QSTEPS.length-1) +' 步　·　扫 <b>'+st.tried+'</b> 行 → 得 <b>'+st.got+'</b> 行';
  const rg = document.getElementById('qRange');
  if(rg && +rg.value !== qStep) rg.value = qStep;
}
function qPlay(){
  if(qPlaying){ qPause(); return; }
  qPlaying = true;
  const b=$('#qPlay'); if(b){ b.textContent='❚❚ 暂停'; b.classList.add('play'); }
  if(qStep >= QSTEPS.length-1) qStep = 0;
  qPaint();
  qTimer = setInterval(()=>{
    qStep++; qPaint();
    if(qStep >= QSTEPS.length-1) qPause();
  }, 1250);
}
function qPause(){
  qPlaying = false; clearInterval(qTimer); qTimer = null;
  const b=$('#qPlay'); if(b){ b.textContent='▶ 播放'; b.classList.remove('play'); }
}
function qTick(){ if(qStep < QSTEPS.length-1){ qStep++; qPaint(); } }
function qReset(){ qPause(); qStep = 0; qPaint(); }

/* ===== 动画 B：被锁比例 -> 需要扫描的候选行数（示意模型） ===== */
const SP=[0,0.2,0.4,0.5,0.6,0.7,0.8,0.9];
const WANT=10, POOL=100;
const SIDX = 9;
let sIdx = 0, sTimer = null, sPlaying = false;
function sNeed(p){ return Math.min(POOL, Math.ceil(WANT/(1-p))); }
function scPaint(){
  const p = SP[sIdx], n = sNeed(p);
  const x = 200 + sIdx*88.57;
  const cy = 350 - (n/POOL)*280;
  const cur = document.getElementById('scCursor');
  if(cur){ cur.setAttribute('x1', x.toFixed(1)); cur.setAttribute('x2', x.toFixed(1)); }
  const dot = document.getElementById('scDot');
  if(dot){ dot.setAttribute('cx', x.toFixed(1)); dot.setAttribute('cy', cy.toFixed(1)); }
  const tag = document.getElementById('scTag');
  if(tag){ tag.setAttribute('x', (x+9).toFixed(1)); tag.setAttribute('y', (cy-11).toFixed(1));
           tag.textContent = n; }
  const st_=(id,v)=>{ const e=document.getElementById(id); if(e) e.textContent=v; };
  st_('scP', Math.round(p*100)+'%'); st_('scN', n);
  st_('scRatio', '×' + (n/WANT).toFixed(1));
  const m = document.getElementById('scMsg');
  if(m) m.textContent = p < 0.45 ? '轻负载：跳过税接近 1×，队列健康'
    : (p < 0.75 ? '竞争显现：每返回 1 行要扫 2–4 行'
    : '接近饱和：候选集被浪费，该动索引、分区或批量了');
  const o = document.getElementById('scOut');
  if(o) o.innerHTML = '被锁 <b>'+Math.round(p*100)+'%</b>　·　凑够 '+WANT+' 行需扫 <b>'+n+'</b> 行　·　跳过税 <b>×'+(n/WANT).toFixed(1)+'</b>';
  const rg = document.getElementById('scRange');
  if(rg && +rg.value !== sIdx) rg.value = sIdx;
}
function scPlay(){
  if(sPlaying){ scPause(); return; }
  sPlaying = true;
  const b=$('#scPlay'); if(b){ b.textContent='❚❚ 暂停'; b.classList.add('play'); }
  if(sIdx >= SP.length-1) sIdx = 0;
  scPaint();
  sTimer = setInterval(()=>{
    sIdx++; scPaint();
    if(sIdx >= SP.length-1) scPause();
  }, 1000);
}
function scPause(){
  sPlaying = false; clearInterval(sTimer); sTimer = null;
  const b=$('#scPlay'); if(b){ b.textContent='▶ 播放'; b.classList.remove('play'); }
}
function scTick(){ if(sIdx < SP.length-1){ sIdx++; scPaint(); } }
function scReset(){ scPause(); sIdx = 0; scPaint(); }

/* ---------- 启动 ---------- */
function init(){
  render(); fit();
  let saved = 0;
  try{ saved = parseInt(localStorage.getItem('skiplocked-deck')||'0',10)||0; }catch(e){}
  const m = location.search.match(/[?&]p=(\d+)/);
  if(m) saved = Math.max(0, parseInt(m[1],10)-1);
  go(saved, true);
  $('#btnPrev').onclick = prev;  $('#btnNext').onclick = next;
  $('#btnToc').onclick = toc;    $('#btnNotes').onclick = ()=>toggleRail('one');
  $('#btnAll').onclick = ()=>toggleRail('all'); $('#btnAuto').onclick = toggleAuto;
  $('#btnFs').onclick = fs;      $('#btnHelp').onclick = help;
  $('#veil').onclick = e=>{ if(e.target.id==='veil') closePanel(); };
  const sm = location.search.match(/[?&]s=(\d+)/);
  if(sm){ qStep = Math.min(QSTEPS.length-1, +sm[1]); sIdx = Math.min(SP.length-1, +sm[1]); }
  qPaint(); scPaint();
  const nm = location.search.match(/[?&]n=(\d)/);
  if(nm) openRail(+nm[1] === 2 ? 'all' : 'one');
  const on = (id, fn, ev)=>{ const el=$(id); if(el) el.addEventListener(ev||'click', fn); };
  on('#qPlay', qPlay); on('#qStep', qTick); on('#qReset', qReset);
  on('#scPlay', scPlay); on('#scStep', scTick); on('#scReset', scReset);
  const qr = $('#qRange');
  if(qr) qr.addEventListener('input', ()=>{ qPause(); qStep = +qr.value; qPaint(); });
  const sr = $('#scRange');
  if(sr) sr.addEventListener('input', ()=>{ scPause(); sIdx = +sr.value; scPaint(); });
}
document.addEventListener('DOMContentLoaded', init);

</script>
