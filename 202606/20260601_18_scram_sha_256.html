<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据库筑基课 —— 安全之 SCRAM-SHA-256</title>
<style>
  :root {
    --bg-paper: #F7F6F2;
    --bg-secondary: #F1EFE9;
    --bg-letterbox: #E6E3DA;
    --ink-main: #1B2B33;
    --ink-secondary: #46585F;
    --ink-muted: #89938F;
    --stroke: #D9D5CB;
    --primary: #245A6B;
    --primary-light: #E5EFF0;
    --accent: #BE653B;
    --accent-light: #F7E9DE;
    --benefit: #2F7A66;
    --benefit-light: #E5F1EC;
    --gold: #AE8A3E;
    --gold-light: #F5EFE0;

    --strata-1: #1E4B5A;
    --strata-2: #2E6373;
    --strata-3: #47808D;
    --strata-4: #74A5AD;
    --strata-5: #A4C4C6;
    --strata-6: #CFE0DC;
    --strata-7: #EBF1EE;

    --font-serif: "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", "STSong", "SimSun", Georgia, serif;
    --font-sans: "PingFang SC", "Noto Sans CJK SC", "Source Han Sans SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --font-mono: "SF Mono", "JetBrains Mono", "Menlo", "Consolas", "Courier New", monospace;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg-letterbox);
    color: var(--ink-main);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  #app-root {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg-letterbox);
    overflow: hidden;
  }

  #app-root:fullscreen,
  #app-root:-webkit-full-screen {
    width: 100vw;
    height: 100vh;
    background: var(--bg-letterbox);
  }

  /* Main split workspace: left 16:9 stage viewport + right in-page notes drawer */
  #workspace {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: row;
    position: relative;
    overflow: hidden;
  }

  #stage-viewport {
    flex: 1;
    min-width: 0;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    background: var(--bg-letterbox);
    padding: 12px;
  }

  #stage-frame {
    position: relative;
    flex-shrink: 0;
    border: 1px solid var(--stroke);
    background: var(--bg-paper);
    overflow: hidden;
  }

  /* Fixed 1600x900 Stage - strictly scaled via transform, never reflows */
  #stage {
    position: absolute;
    top: 0;
    left: 0;
    width: 1600px;
    height: 900px;
    transform-origin: top left;
    background: var(--bg-paper);
    color: var(--ink-main);
    padding: 40px 64px 30px 64px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Subtle blueprint registration ticks in stage corners */
  #stage::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--strata-1) 0%, var(--strata-1) 24%, var(--strata-3) 24%, var(--strata-3) 56%, var(--strata-5) 56%, var(--strata-5) 82%, var(--accent) 82%, var(--accent) 100%);
  }

  .slide-header {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
  }

  .slide-eyebrow-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }

  .slide-eyebrow {
    font-family: var(--font-mono);
    font-size: 13px;
    letter-spacing: 3.4px;
    text-transform: uppercase;
    color: var(--primary);
    font-weight: 600;
  }

  .slide-tag {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 1.2px;
    color: var(--ink-muted);
    border: 1px solid var(--stroke);
    background: var(--bg-secondary);
    padding: 2px 10px;
  }

  .slide-title {
    font-family: var(--font-serif);
    font-size: 44px;
    font-weight: 700;
    line-height: 1.22;
    color: var(--ink-main);
    letter-spacing: -0.4px;
    margin-bottom: 10px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .slide-lead {
    font-family: var(--font-sans);
    font-size: 19px;
    line-height: 1.45;
    color: var(--ink-secondary);
    margin-bottom: 16px;
    max-width: 1472px;
  }

  .slide-divider {
    width: 100%;
    height: 1px;
    background: var(--stroke);
    flex-shrink: 0;
    margin-bottom: 16px;
  }

  /* Optional interactive toolbar inside stage for animated slides */
  .anim-toolbar {
    height: 40px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
    padding: 0 14px;
    background: var(--bg-secondary);
    border: 1px solid var(--stroke);
    width: 1400px;
    margin-left: auto;
    margin-right: auto;
  }

  .anim-toolbar.hidden {
    display: none;
  }

  .anim-group {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .anim-label {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--ink-secondary);
    font-weight: 600;
  }

  .anim-input {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--ink-main);
    background: var(--bg-paper);
    border: 1px solid var(--stroke);
    padding: 4px 10px;
    width: 168px;
    height: 28px;
    outline: none;
    user-select: text;
  }

  .anim-input:focus {
    border-color: var(--primary);
  }

  .anim-select {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--ink-main);
    background: var(--bg-paper);
    border: 1px solid var(--stroke);
    padding: 2px 8px;
    height: 28px;
    outline: none;
  }

  .anim-btn {
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-main);
    background: var(--bg-paper);
    border: 1px solid var(--stroke);
    padding: 4px 12px;
    height: 28px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background 0.12s, border-color 0.12s, color 0.12s;
  }

  .anim-btn:hover {
    border-color: var(--primary);
    color: var(--primary);
  }

  .anim-btn.primary {
    background: var(--primary);
    border-color: var(--primary);
    color: #F7F6F2;
  }

  .anim-btn.primary:hover {
    background: var(--strata-1);
    color: #F7F6F2;
  }

  .anim-btn.active {
    background: var(--primary-light);
    border-color: var(--primary);
    color: var(--primary);
  }

  .anim-btn.accent-active {
    background: var(--accent-light);
    border-color: var(--accent);
    color: var(--accent);
  }

  .anim-status {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--primary);
    font-weight: 600;
    white-space: nowrap;
  }

  /* Diagram container strictly 1400x430 */
  .diagram-zone {
    width: 1400px;
    height: 430px;
    margin: 0 auto;
    flex-shrink: 0;
    position: relative;
    background: var(--bg-paper);
  }

  .diagram-zone svg {
    display: block;
    width: 1400px;
    height: 430px;
    overflow: hidden;
  }

  /* Bottom Transition + Footer */
  .slide-bottom {
    margin-top: auto;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .next-bridge {
    border-left: 3px solid var(--accent);
    padding: 6px 0 6px 16px;
    background: linear-gradient(90deg, rgba(247, 233, 222, 0.45) 0%, rgba(247, 246, 242, 0) 65%);
    display: flex;
    align-items: baseline;
    gap: 12px;
  }

  .next-label {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: var(--accent);
    flex-shrink: 0;
  }

  .next-text {
    font-family: var(--font-serif);
    font-size: 20px;
    line-height: 1.35;
    color: var(--ink-main);
    font-weight: 600;
  }

  .slide-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid var(--stroke);
    padding-top: 10px;
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--ink-muted);
  }

  .footer-meta {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .footer-page {
    color: var(--ink-main);
    font-weight: 700;
    letter-spacing: 1px;
  }

  /* Right In-Page Notes Panel (Non-modal, side-by-side split) */
  #notes-drawer {
    width: 0;
    flex-shrink: 0;
    height: 100%;
    background: var(--bg-paper);
    border-left: 0 solid var(--stroke);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    opacity: 0;
    pointer-events: none;
    transition: width 0.16s ease, opacity 0.16s ease;
  }

  #notes-drawer.open {
    width: clamp(340px, 31vw, 460px);
    border-left-width: 1px;
    opacity: 1;
    pointer-events: auto;
  }

  .notes-header {
    height: 48px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--stroke);
  }

  .notes-tabs {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .notes-tab {
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-secondary);
    background: transparent;
    border: 1px solid transparent;
    padding: 5px 10px;
    cursor: pointer;
  }

  .notes-tab:hover {
    color: var(--primary);
  }

  .notes-tab.active {
    color: var(--primary);
    background: var(--bg-paper);
    border-color: var(--stroke);
    border-bottom-color: var(--primary);
    border-bottom-width: 2px;
  }

  .notes-close {
    font-family: var(--font-mono);
    font-size: 14px;
    color: var(--ink-secondary);
    background: transparent;
    border: 1px solid var(--stroke);
    width: 28px;
    height: 28px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .notes-close:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  #notes-body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 18px 20px 36px 20px;
    user-select: text;
    scroll-behavior: smooth;
  }

  .note-single-header {
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--stroke);
  }

  .note-page-badge {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--primary);
    letter-spacing: 1.5px;
    margin-bottom: 4px;
    font-weight: 700;
  }

  .note-page-title {
    font-family: var(--font-serif);
    font-size: 18px;
    font-weight: 700;
    color: var(--ink-main);
    line-height: 1.35;
  }

  .note-paragraph {
    font-size: 14.5px;
    line-height: 1.8;
    color: var(--ink-main);
    margin-bottom: 12px;
    text-align: justify;
  }

  .note-logic-cue {
    margin-top: 14px;
    padding: 10px 12px;
    background: var(--bg-secondary);
    border-left: 3px solid var(--accent);
    font-size: 13.5px;
    line-height: 1.65;
    color: var(--ink-secondary);
  }

  .note-logic-cue strong {
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 1px;
    display: block;
    margin-bottom: 3px;
  }

  .transcript-item {
    padding: 14px 14px 12px 14px;
    margin-bottom: 14px;
    border: 1px solid var(--stroke);
    border-left: 3px solid var(--stroke);
    background: var(--bg-paper);
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }

  .transcript-item:hover {
    border-color: var(--primary);
  }

  .transcript-item.active {
    border-color: var(--stroke);
    border-left: 4px solid var(--accent);
    background: #FBF8F4;
  }

  .transcript-item-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--stroke);
  }

  .transcript-item-num {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 700;
    color: var(--primary);
    flex-shrink: 0;
  }

  .transcript-item.active .transcript-item-num {
    color: var(--accent);
  }

  .transcript-item-title {
    font-family: var(--font-serif);
    font-size: 15px;
    font-weight: 700;
    color: var(--ink-main);
    flex: 1;
  }

  /* Bottom Control Dock (Always visible including in fullscreen) */
  #control-bar {
    height: 46px;
    flex-shrink: 0;
    background: var(--bg-secondary);
    border-top: 1px solid var(--stroke);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    gap: 12px;
    z-index: 60;
  }

  .ctrl-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .ctrl-btn {
    height: 30px;
    padding: 0 10px;
    background: var(--bg-paper);
    border: 1px solid var(--stroke);
    color: var(--ink-main);
    font-family: var(--font-sans);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    transition: background 0.12s, border-color 0.12s, color 0.12s;
  }

  .ctrl-btn:hover {
    border-color: var(--primary);
    color: var(--primary);
  }

  .ctrl-btn.active {
    background: var(--primary);
    border-color: var(--primary);
    color: #F7F6F2;
  }

  .ctrl-btn.active .kbd {
    background: rgba(247, 246, 242, 0.2);
    color: #F7F6F2;
    border-color: rgba(247, 246, 242, 0.45);
  }

  .ctrl-btn.playing {
    background: var(--benefit);
    border-color: var(--benefit);
    color: #F7F6F2;
  }

  .ctrl-btn.playing .kbd {
    background: rgba(247, 246, 242, 0.2);
    color: #F7F6F2;
    border-color: rgba(247, 246, 242, 0.45);
  }

  .kbd {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 700;
    padding: 1px 5px;
    background: var(--bg-secondary);
    border: 1px solid var(--stroke);
    color: var(--ink-secondary);
    line-height: 1.3;
  }

  .ctrl-counter {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-main);
    min-width: 64px;
    text-align: center;
  }

  .ctrl-progress-wrap {
    width: 140px;
    height: 4px;
    background: var(--stroke);
    position: relative;
    overflow: hidden;
  }

  .ctrl-progress-fill {
    height: 100%;
    background: var(--primary);
    width: 0%;
    transition: width 0.2s ease;
  }

  /* Directory (TOC) Overlay - triggered by G */
  #toc-overlay {
    position: fixed;
    inset: 0 0 46px 0;
    background: rgba(27, 43, 51, 0.45);
    z-index: 80;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  #toc-overlay.open {
    display: flex;
  }

  .toc-panel {
    width: min(1080px, 92vw);
    max-height: 82vh;
    background: var(--bg-paper);
    border: 1px solid var(--stroke);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .toc-head {
    padding: 14px 20px;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--stroke);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .toc-title {
    font-family: var(--font-serif);
    font-size: 20px;
    font-weight: 700;
    color: var(--ink-main);
  }

  .toc-sub {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-muted);
    margin-left: 12px;
  }

  .toc-grid {
    padding: 18px 20px;
    overflow-y: auto;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }

  .toc-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 10px 14px;
    border: 1px solid var(--stroke);
    background: var(--bg-paper);
    cursor: pointer;
    text-align: left;
    transition: border-color 0.12s, background 0.12s;
  }

  .toc-item:hover {
    border-color: var(--primary);
    background: var(--primary-light);
  }

  .toc-item.active {
    border-color: var(--accent);
    border-left: 4px solid var(--accent);
    background: var(--accent-light);
  }

  .toc-num {
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 700;
    color: var(--primary);
    padding-top: 2px;
    flex-shrink: 0;
  }

  .toc-item.active .toc-num {
    color: var(--accent);
  }

  .toc-meta {
    min-width: 0;
    flex: 1;
  }

  .toc-eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-muted);
    letter-spacing: 1px;
    margin-bottom: 3px;
  }

  .toc-item-title {
    font-family: var(--font-serif);
    font-size: 15px;
    font-weight: 700;
    color: var(--ink-main);
    line-height: 1.35;
  }

  .toc-badge {
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--benefit);
    border: 1px solid var(--benefit);
    padding: 1px 5px;
    margin-left: 6px;
    vertical-align: middle;
  }

  /* Toast hint for fullscreen fallback / autoplay state */
  #status-toast {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--ink-main);
    color: var(--bg-paper);
    font-family: var(--font-mono);
    font-size: 12.5px;
    padding: 7px 14px;
    border: 1px solid var(--primary);
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }

  #status-toast.show {
    opacity: 1;
  }

  /* SVG animation helpers */
  .svg-pulse {
    animation: svgStrokePulse 1.4s ease-in-out infinite;
  }

  @keyframes svgStrokePulse {
    0%, 100% { stroke-opacity: 1; }
    50% { stroke-opacity: 0.4; }
  }
</style>
</head>
<body>
<div id="app-root">
  <div id="workspace">
    <div id="stage-viewport">
      <div id="stage-frame">
        <main id="stage" aria-live="polite">
          <header class="slide-header">
            <div class="slide-eyebrow-row">
              <div class="slide-eyebrow" id="slide-eyebrow"></div>
              <div class="slide-tag" id="slide-tag"></div>
            </div>
            <h1 class="slide-title" id="slide-title"></h1>
            <p class="slide-lead" id="slide-lead"></p>
          </header>
          <div class="slide-divider"></div>
          <div class="anim-toolbar hidden" id="anim-toolbar"></div>
          <section class="diagram-zone" id="diagram-zone" aria-label="工程示意图区"></section>
          <footer class="slide-bottom">
            <div class="next-bridge">
              <span class="next-label" id="next-label">承接 · NEXT</span>
              <span class="next-text" id="next-text"></span>
            </div>
            <div class="slide-footer">
              <div class="footer-meta">
                <span>DATABASE FOUNDATION · POSTGRESQL SECURITY</span>
                <span>RFC 5802 / RFC 7677 / RFC 5803</span>
              </div>
              <div class="footer-page" id="footer-page">01 / 14</div>
            </div>
          </footer>
        </main>
      </div>
    </div>

    <aside id="notes-drawer" aria-label="演讲稿面板">
      <div class="notes-header">
        <div class="notes-tabs">
          <button type="button" class="notes-tab" id="tab-note-single" data-mode="single">本页讲稿 (N)</button>
          <button type="button" class="notes-tab" id="tab-note-all" data-mode="all">全文讲稿 (T)</button>
        </div>
        <button type="button" class="notes-close" id="btn-close-notes" title="关闭讲稿">×</button>
      </div>
      <div id="notes-body"></div>
    </aside>
  </div>

  <div id="toc-overlay" role="dialog" aria-modal="true" aria-label="幻灯片目录">
    <div class="toc-panel">
      <div class="toc-head">
        <div>
          <span class="toc-title">演说目录 · 地层剖面索引</span>
          <span class="toc-sub">按 G 或 ESC 关闭 · 点击条目跳转</span>
        </div>
        <button type="button" class="notes-close" id="btn-close-toc" title="关闭目录">×</button>
      </div>
      <div class="toc-grid" id="toc-grid"></div>
    </div>
  </div>

    const ipad = new Uint8Array(64), opad = new Uint8Array(64);
    for (let i = 0; i < 64; i++) {

      ipad[i] = kb ^ 0x36;
      opad[i] = kb ^ 0x5c;

    const inner = new Uint8Array(64 + msgBytes.length);
    inner.set(ipad, 0); inner.set(msgBytes, 64);
    const innerHash = sha256(inner);
    const outer = new Uint8Array(64 + 32);
    outer.set(opad, 0); outer.set(innerHash, 64);
    return sha256(outer);
  }

  function xorBytes(a, b) {
    const out = new Uint8Array(a.length);
    for (let i = 0; i < a.length; i++) out[i] = a[i] ^ b[i];
    return out;
  }

  /* =========================================================
     7. Deck Controller: Navigation, Scaling, Notes (N/T),
        TOC (G), Autoplay (P), Fullscreen (F)
     ========================================================= */
  let currentIndex = 0;
  let notesMode = "closed"; // "closed" | "single" | "all"
  let tocOpen = false;
  let autoplayTimer = null;
  let toastTimer = null;

  const appRoot = document.getElementById("app-root");
  const stageViewport = document.getElementById("stage-viewport");
  const stageFrame = document.getElementById("stage-frame");
  const stage = document.getElementById("stage");
  const notesDrawer = document.getElementById("notes-drawer");
  const notesBody = document.getElementById("notes-body");
  const tocOverlay = document.getElementById("toc-overlay");
  const tocGrid = document.getElementById("toc-grid");
  const statusToast = document.getElementById("status-toast");

  function pad2(n) {
    return n < 10 ? "0" + n : String(n);
  }

  function showToast(msg) {
    statusToast.textContent = msg;
    statusToast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => statusToast.classList.remove("show"), 1800);
  }

  function updateStageScale() {
    const pad = 24;
    const availW = Math.max(160, stageViewport.clientWidth - pad);
    const availH = Math.max(90, stageViewport.clientHeight - pad);
    const scale = Math.min(availW / 1600, availH / 900);
    stageFrame.style.width = Math.floor(1600 * scale) + "px";
    stageFrame.style.height = Math.floor(900 * scale) + "px";
    stage.style.transform = `scale(${scale})`;
  }

  function updateDiagramOnly() {
    document.getElementById("diagram-zone").innerHTML = RENDERERS[currentIndex]();
  }

  function renderNotesPanel(instantScroll) {
    const tabSingle = document.getElementById("tab-note-single");
    const tabAll = document.getElementById("tab-note-all");
    const btnN = document.getElementById("btn-notes-single");
    const btnT = document.getElementById("btn-notes-all");

    if (notesMode === "closed") {
      notesDrawer.classList.remove("open");
      tabSingle.classList.remove("active");
      tabAll.classList.remove("active");
      btnN.classList.remove("active");
      btnT.classList.remove("active");
      setTimeout(updateStageScale, 170);
      updateStageScale();
      return;
    }

    notesDrawer.classList.add("open");
    tabSingle.classList.toggle("active", notesMode === "single");
    tabAll.classList.toggle("active", notesMode === "all");
    btnN.classList.toggle("active", notesMode === "single");
    btnT.classList.toggle("active", notesMode === "all");

    if (notesMode === "single") {
      const sl = SLIDES[currentIndex];
      notesBody.innerHTML = `
        <div class="note-single-header">
          <div class="note-page-badge">PAGE ${pad2(sl.id)} / ${pad2(SLIDES.length)} · ${esc(sl.tag)}</div>
          <div class="note-page-title">${esc(sl.title)}</div>
        </div>
        ${sl.notes.map(p => `<p class="note-paragraph">${esc(p)}</p>`).join("")}
        <div class="note-logic-cue">
          <strong>${esc(sl.nextLabel)}</strong>
          ${esc(sl.next)}
        </div>
      `;
      notesBody.scrollTop = 0;
    } else if (notesMode === "all") {
      if (!notesBody.querySelector(".transcript-item")) {
        notesBody.innerHTML = SLIDES.map((sl, idx) => `
          <article class="transcript-item" data-slide-index="${idx}" id="transcript-slide-${idx}">
            <div class="transcript-item-head">
              <span class="transcript-item-num">${pad2(sl.id)} / ${pad2(SLIDES.length)}</span>
              <span class="transcript-item-title">${esc(sl.title)}</span>
            </div>
            ${sl.notes.map(p => `<p class="note-paragraph">${esc(p)}</p>`).join("")}
          </article>
        `).join("");
        notesBody.querySelectorAll(".transcript-item").forEach(el => {
          el.addEventListener("click", () => {
            const idx = parseInt(el.getAttribute("data-slide-index"), 10);
            if (!isNaN(idx) && idx !== currentIndex) goToSlide(idx);
          });
        });
      }
      notesBody.querySelectorAll(".transcript-item").forEach((el, idx) => {
        el.classList.toggle("active", idx === currentIndex);
      });
      scrollTranscriptToCurrent(instantScroll);
    }

    updateStageScale();
    setTimeout(updateStageScale, 175);
  }

  function scrollTranscriptToCurrent(instant) {
    if (notesMode !== "all") return;
    const target = document.getElementById(`transcript-slide-${currentIndex}`);
    if (!target) return;
    const topPos = Math.max(0, target.offsetTop - notesBody.offsetTop - 14);
    if (instant) {
      notesBody.style.scrollBehavior = "auto";
      notesBody.scrollTop = topPos;
      notesBody.style.scrollBehavior = "smooth";
    } else {
      notesBody.scrollTo({ top: topPos, behavior: "smooth" });
    }
  }

  function toggleNotesMode(targetMode) {
    if (notesMode === targetMode) {
      notesMode = "closed";
    } else {
      notesMode = targetMode;
      // If switching from single to all, clear single DOM so full transcript builds cleanly
      if (targetMode === "all") notesBody.innerHTML = "";
    }
    renderNotesPanel(true);
  }

  function renderToc() {
    tocGrid.innerHTML = SLIDES.map((sl, idx) => `
      <button type="button" class="toc-item ${idx === currentIndex ? "active" : ""}" data-toc-idx="${idx}">
        <span class="toc-num">${pad2(sl.id)}</span>
        <span class="toc-meta">
          <div class="toc-eyebrow">${esc(sl.tag)}${sl.interactive ? '<span class="toc-badge">交互动画</span>' : ""}</div>
          <div class="toc-item-title">${esc(sl.title)}</div>
        </span>
      </button>
    `).join("");
    tocGrid.querySelectorAll(".toc-item").forEach(btn => {
      btn.addEventListener("click", () => {
        const idx = parseInt(btn.getAttribute("data-toc-idx"), 10);
        setTocOpen(false);
        goToSlide(idx);
      });
    });
  }

  function setTocOpen(open) {
    tocOpen = open;
    tocOverlay.classList.toggle("open", tocOpen);
    document.getElementById("btn-toc").classList.toggle("active", tocOpen);
    if (tocOpen) renderToc();
  }

  function stopAutoplay() {
    if (autoplayTimer) {
      clearInterval(autoplayTimer);
      autoplayTimer = null;
    }
    const btn = document.getElementById("btn-autoplay");
    const lbl = document.getElementById("autoplay-label");
    btn.classList.remove("playing");
    lbl.textContent = "自动播放";
  }

  function toggleAutoplay() {
    if (autoplayTimer) {
      stopAutoplay();
      showToast("已暂停自动播放");
      return;
    }
    const btn = document.getElementById("btn-autoplay");
    const lbl = document.getElementById("autoplay-label");
    btn.classList.add("playing");
    lbl.textContent = "停止播放";
    showToast("已开启自动播放（每 8 秒翻页）");
    autoplayTimer = setInterval(() => {
      if (currentIndex < SLIDES.length - 1) {
        goToSlide(currentIndex + 1, true);
      } else {
        goToSlide(0, true);
      }
    }, 8000);
  }

  function toggleFullscreen() {
    const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
    if (!fsEl) {
      const req = appRoot.requestFullscreen || appRoot.webkitRequestFullscreen || document.documentElement.requestFullscreen;
      if (req) {
        Promise.resolve(req.call(appRoot)).catch(() => {
          showToast("当前预览环境限制原生全屏，已保持满屏适配");
        });
      }
    } else {
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (exit) Promise.resolve(exit.call(document)).catch(() => {});
    }
  }

  function updateFullscreenButton() {
    const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
    const btn = document.getElementById("btn-fullscreen");
    const lbl = document.getElementById("fullscreen-label");
    btn.classList.toggle("active", !!fsEl);
    lbl.textContent = fsEl ? "退出全屏" : "全屏";
    updateStageScale();
  }

  function goToSlide(idx, fromAutoplay) {
    if (!fromAutoplay && autoplayTimer) stopAutoplay();
    stopSlideAnim();
    currentIndex = Math.max(0, Math.min(SLIDES.length - 1, idx));
    const sl = SLIDES[currentIndex];

    document.getElementById("slide-eyebrow").textContent = sl.eyebrow;
    document.getElementById("slide-tag").textContent = sl.tag;
    document.getElementById("slide-title").textContent = sl.title;
    document.getElementById("slide-lead").textContent = sl.lead;
    document.getElementById("next-label").textContent = sl.nextLabel;
    document.getElementById("next-text").textContent = sl.next;

    const pageStr = `${pad2(sl.id)} / ${pad2(SLIDES.length)}`;
    document.getElementById("footer-page").textContent = pageStr;
    document.getElementById("ctrl-counter").textContent = pageStr;
    document.getElementById("ctrl-progress-fill").style.width = `${((currentIndex + 1) / SLIDES.length) * 100}%`;

    renderAnimToolbar(currentIndex);
    updateDiagramOnly();

    if (notesMode !== "closed") {
      renderNotesPanel(false);
    }
    if (tocOpen) renderToc();
  }

  // Wire buttons
  document.getElementById("btn-prev").addEventListener("click", () => goToSlide(currentIndex - 1));
  document.getElementById("btn-next").addEventListener("click", () => goToSlide(currentIndex + 1));
  document.getElementById("btn-toc").addEventListener("click", () => setTocOpen(!tocOpen));
  document.getElementById("btn-close-toc").addEventListener("click", () => setTocOpen(false));
  tocOverlay.addEventListener("click", (e) => { if (e.target === tocOverlay) setTocOpen(false); });
  document.getElementById("btn-notes-single").addEventListener("click", () => toggleNotesMode("single"));
  document.getElementById("btn-notes-all").addEventListener("click", () => toggleNotesMode("all"));
  document.getElementById("tab-note-single").addEventListener("click", () => { notesMode = "single"; renderNotesPanel(true); });
  document.getElementById("tab-note-all").addEventListener("click", () => { notesMode = "all"; notesBody.innerHTML = ""; renderNotesPanel(true); });
  document.getElementById("btn-close-notes").addEventListener("click", () => { notesMode = "closed"; renderNotesPanel(true); });
  document.getElementById("btn-autoplay").addEventListener("click", toggleAutoplay);
  document.getElementById("btn-fullscreen").addEventListener("click", toggleFullscreen);

  document.addEventListener("fullscreenchange", updateFullscreenButton);
  document.addEventListener("webkitfullscreenchange", updateFullscreenButton);

  // Keyboard shortcuts
  document.addEventListener("keydown", (e) => {
    const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : "";
    if (tag === "input" || tag === "textarea" || tag === "select") {
      if (e.key === "Escape") e.target.blur();
      return;
    }
    if (e.metaKey || e.ctrlKey || e.altKey) return;

    const key = e.key.toLowerCase();
    if (key === "arrowright" || key === "pagedown" || key === " ") {
      e.preventDefault();
      if (!tocOpen) goToSlide(currentIndex + 1);
    } else if (key === "arrowleft" || key === "pageup") {
      e.preventDefault();
      if (!tocOpen) goToSlide(currentIndex - 1);
    } else if (key === "home") {
      e.preventDefault();
      goToSlide(0);
    } else if (key === "end") {
      e.preventDefault();
      goToSlide(SLIDES.length - 1);
    } else if (key === "g") {
      e.preventDefault();
      setTocOpen(!tocOpen);
    } else if (key === "n") {
      e.preventDefault();
      toggleNotesMode("single");
    } else if (key === "t") {
      e.preventDefault();
      toggleNotesMode("all");
    } else if (key === "p") {
      e.preventDefault();
      toggleAutoplay();
    } else if (key === "f") {
      e.preventDefault();
      toggleFullscreen();
    } else if (key === "escape") {
      if (tocOpen) {
        e.preventDefault();
        setTocOpen(false);
      }
    }
  });

  // ResizeObserver for crisp continuous vector scaling of 1600x900 stage
  if (typeof ResizeObserver !== "undefined") {
    const ro = new ResizeObserver(() => updateStageScale());
    ro.observe(stageViewport);
  }
  window.addEventListener("resize", updateStageScale);

  // Initialize presentation
  goToSlide(0);
  updateStageScale();
})();
</script>
</body>
</html>
