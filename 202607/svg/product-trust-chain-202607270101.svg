<svg viewBox="0 0 900 720" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6472"/>
    </marker>
  </defs>

  <rect width="900" height="720" fill="#ffffff"/>

  <!-- Node 1 -->
  <rect x="150" y="20" width="600" height="76" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="450" y="52" text-anchor="middle" font-size="21" fill="#1e1b4b" font-weight="600">AI 把"做出一个能跑的产品"的门槛拉到接近零</text>
  <text x="450" y="79" text-anchor="middle" font-size="15" fill="#4338ca">技术实现成本 → 0</text>

  <line x1="450" y1="96" x2="450" y2="130" stroke="#5b6472" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 2 -->
  <rect x="120" y="132" width="660" height="76" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="450" y="164" text-anchor="middle" font-size="21" fill="#7c2d12" font-weight="600">但"判断需求 / 验证质量 / 长期维护"的成本几乎没有下降</text>
  <text x="450" y="191" text-anchor="middle" font-size="15" fill="#9a3412">2026 年数据：代码返工率 41%，63% 开发者调试 AI 代码更费时</text>

  <line x1="450" y1="208" x2="450" y2="242" stroke="#5b6472" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 3 -->
  <rect x="150" y="244" width="600" height="76" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="450" y="276" text-anchor="middle" font-size="21" fill="#7f1d1d" font-weight="600">用户站在外面，分不清谁做得认真、谁只是能跑</text>
  <text x="450" y="303" text-anchor="middle" font-size="15" fill="#b91c1c">信息不对称扩大 → 柠檬市场效应</text>

  <line x1="450" y1="320" x2="450" y2="354" stroke="#5b6472" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 4 -->
  <rect x="150" y="356" width="600" height="76" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="450" y="388" text-anchor="middle" font-size="21" fill="#14532d" font-weight="600">履约记录 / 品牌信用成为筛选机制</text>
  <text x="450" y="415" text-anchor="middle" font-size="15" fill="#15803d">用"过去有没有说到做到"替用户完成质检</text>

  <line x1="450" y1="432" x2="450" y2="466" stroke="#5b6472" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 5 -->
  <rect x="150" y="468" width="600" height="76" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="450" y="500" text-anchor="middle" font-size="21" fill="#1e3a8a" font-weight="600">竞争壁垒从"谁会写代码"转移到"谁值得被信任"</text>
  <text x="450" y="527" text-anchor="middle" font-size="15" fill="#1d4ed8">信用本身变成一种需要提前积累的资产</text>

  <!-- Two branch boxes below, showing where this trust asset compounds -->
  <line x1="320" y1="544" x2="320" y2="578" stroke="#5b6472" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="580" y1="544" x2="580" y2="578" stroke="#5b6472" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="90" y="580" width="440" height="120" rx="14" fill="#fdf4ff" stroke="#a855f7" stroke-width="2"/>
  <text x="310" y="612" text-anchor="middle" font-size="18" fill="#581c87" font-weight="600">越靠近底层 / 依赖越多</text>
  <text x="310" y="638" text-anchor="middle" font-size="14" fill="#6b21a8">迁移成本随依赖数量指数上升</text>
  <text x="310" y="660" text-anchor="middle" font-size="14" fill="#6b21a8">Linux 34年 · TCP 44年 · COBOL 60余年</text>
  <text x="310" y="682" text-anchor="middle" font-size="13" fill="#9333ea">（但外部推力足够强时同样会被整体迁移）</text>

  <rect x="530" y="580" width="360" height="120" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="710" y="612" text-anchor="middle" font-size="18" fill="#78350f" font-weight="600">分发形态 = 收钱的距离</text>
  <text x="710" y="638" text-anchor="middle" font-size="14" fill="#92400e">API 计量：用了就计费</text>
  <text x="710" y="660" text-anchor="middle" font-size="14" fill="#92400e">纯开源无商业设计：用了也不计费</text>
  <text x="710" y="682" text-anchor="middle" font-size="13" fill="#b45309">（开源要活，得嫁接一层商业设计）</text>
</svg>
