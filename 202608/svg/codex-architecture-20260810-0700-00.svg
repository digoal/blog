<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
  <defs>
    <linearGradient id="localGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#2e5d8e"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a8a64"/>
      <stop offset="100%" stop-color="#0d4f3c"/>
    </linearGradient>
    <linearGradient id="bridgeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a5e2e"/>
      <stop offset="100%" stop-color="#a8842e"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="760" fill="#0f1721"/>

  <text x="600" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#e8e8e8">Codex 双模架构：本地 CLI + 云端沙箱</text>
  <text x="600" y="60" text-anchor="middle" font-size="13" fill="#8a9ba8">不是纯云端 SaaS，也不是纯本地 —— 是双模耦合</text>

  <!-- 用户机器 -->
  <rect x="60" y="100" width="540" height="600" rx="14" fill="#1a2530" stroke="#2e5d8e" stroke-width="2"/>
  <text x="80" y="128" font-size="15" font-weight="700" fill="#7fb8e8">用户本地机器</text>
  <text x="80" y="148" font-size="11" fill="#8a9ba8">Mac / Windows / Linux</text>

  <!-- 本地侧组件 -->
  <g filter="url(#shadow3)">
    <rect x="100" y="170" width="220" height="70" rx="8" fill="url(#localGrad)"/>
    <text x="210" y="196" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Codex CLI (TUI)</text>
    <text x="210" y="216" text-anchor="middle" font-size="10" fill="#c8d8e8">Rust 实现 · 渲染 UI</text>
    <text x="210" y="232" text-anchor="middle" font-size="10" fill="#c8d8e8">读取 ~/.codex/config.toml</text>

    <rect x="340" y="170" width="220" height="70" rx="8" fill="url(#localGrad)"/>
    <text x="450" y="196" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Codex App</text>
    <text x="450" y="216" text-anchor="middle" font-size="10" fill="#c8d8e8">Electron 桌面客户端</text>
    <text x="450" y="232" text-anchor="middle" font-size="10" fill="#c8d8e8">多 Agent 线程 UI</text>

    <rect x="100" y="260" width="220" height="70" rx="8" fill="url(#localGrad)"/>
    <text x="210" y="286" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">本地文件 / Git</text>
    <text x="210" y="306" text-anchor="middle" font-size="10" fill="#c8d8e8">代码读写 · Worktrees</text>
    <text x="210" y="322" text-anchor="middle" font-size="10" fill="#c8d8e8">本地分支/提交</text>

    <rect x="340" y="260" width="220" height="70" rx="8" fill="url(#localGrad)"/>
    <text x="450" y="286" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">AGENTS.md / Skills</text>
    <text x="450" y="306" text-anchor="middle" font-size="10" fill="#c8d8e8">项目专属说明</text>
    <text x="450" y="322" text-anchor="middle" font-size="10" fill="#c8d8e8">可复用技能包</text>

    <rect x="100" y="350" width="460" height="70" rx="8" fill="url(#bridgeGrad)"/>
    <text x="330" y="376" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">CC Switch / Moon Bridge / ccx（可选）</text>
    <text x="330" y="396" text-anchor="middle" font-size="10" fill="#f0d8a0">协议转换网关 · 127.0.0.1:15721</text>
    <text x="330" y="412" text-anchor="middle" font-size="10" fill="#f0d8a0">把 /responses 改写为 /chat/completions</text>
  </g>

  <!-- 本地侧的请求流向 -->
  <g stroke="#5a7088" stroke-width="1.5" fill="none" opacity="0.6">
    <path d="M 210 240 L 210 260"/>
    <path d="M 450 240 L 450 260"/>
    <path d="M 210 330 L 210 350"/>
    <path d="M 450 330 L 450 350"/>
  </g>

  <!-- 本地侧底部 -->
  <text x="80" y="450" font-size="12" font-weight="600" fill="#8a9ba8">本地侧职责</text>
  <text x="80" y="475" font-size="11" fill="#a8b8c8">· UI 渲染、命令审批、diff 查看</text>
  <text x="80" y="495" font-size="11" fill="#a8b8c8">· 文件读写、Git Worktrees 管理</text>
  <text x="80" y="515" font-size="11" fill="#a8b8c8">· AGENTS.md / Skills 加载</text>
  <text x="80" y="535" font-size="11" fill="#a8b8c8">· 协议转换（接国产模型时启用）</text>
  <text x="80" y="555" font-size="11" fill="#a8b8c8">· 离线可继续编辑/审批</text>

  <!-- 通信线 -->
  <g stroke="#7fb8e8" stroke-width="2" fill="none">
    <path d="M 330 385 C 450 450, 700 450, 800 385" stroke-dasharray="6,4"/>
  </g>
  <text x="640" y="445" text-anchor="middle" font-size="11" fill="#7fb8e8" font-weight="600">HTTPS / JSON-RPC</text>

  <!-- OpenAI 云端 -->
  <rect x="660" y="100" width="480" height="600" rx="14" fill="#0d2820" stroke="#2dbb8a" stroke-width="2"/>
  <text x="680" y="128" font-size="15" font-weight="700" fill="#7fe8b8">OpenAI 云端</text>
  <text x="680" y="148" font-size="11" fill="#8ac8a8">GPT-5.3-Codex · Codex App Server · 沙箱</text>

  <g filter="url(#shadow3)">
    <rect x="700" y="170" width="200" height="70" rx="8" fill="url(#cloudGrad)"/>
    <text x="800" y="196" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Codex App Server</text>
    <text x="800" y="216" text-anchor="middle" font-size="10" fill="#b8e8d0">agent 内核</text>
    <text x="800" y="232" text-anchor="middle" font-size="10" fill="#b8e8d0">JSON-RPC · stdio/JSONL</text>

    <rect x="920" y="170" width="200" height="70" rx="8" fill="url(#cloudGrad)"/>
    <text x="1020" y="196" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">模型推理</text>
    <text x="1020" y="216" text-anchor="middle" font-size="10" fill="#b8e8d0">GPT-5.3-Codex</text>
    <text x="1020" y="232" text-anchor="middle" font-size="10" fill="#b8e8d0">GPT-5.5 / Spark</text>

    <rect x="700" y="260" width="420" height="70" rx="8" fill="url(#cloudGrad)"/>
    <text x="910" y="286" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Hosted Shell Containers（云沙箱）</text>
    <text x="910" y="306" text-anchor="middle" font-size="10" fill="#b8e8d0">隔离环境执行不可信代码</text>
    <text x="910" y="322" text-anchor="middle" font-size="10" fill="#b8e8d0">Ona 收购强化（2026-06）</text>

    <rect x="700" y="350" width="200" height="70" rx="8" fill="url(#cloudGrad)"/>
    <text x="800" y="376" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Server-side Compaction</text>
    <text x="800" y="396" text-anchor="middle" font-size="10" fill="#b8e8d0">记忆压缩</text>
    <text x="800" y="412" text-anchor="middle" font-size="10" fill="#b8e8d0">解决代理记忆衰减</text>

    <rect x="920" y="350" width="200" height="70" rx="8" fill="url(#cloudGrad)"/>
    <text x="1020" y="376" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">会话状态</text>
    <text x="1020" y="396" text-anchor="middle" font-size="10" fill="#b8e8d0">previous_response_id</text>
    <text x="1020" y="412" text-anchor="middle" font-size="10" fill="#b8e8d0">长链路任务续接</text>
  </g>

  <text x="680" y="450" font-size="12" font-weight="600" fill="#8ac8a8">云端职责</text>
  <text x="680" y="475" font-size="11" fill="#a8c8b8">· 模型推理（千亿参数本地跑不动）</text>
  <text x="680" y="495" font-size="11" fill="#a8c8b8">· 沙箱执行（统一安全策略）</text>
  <text x="680" y="515" font-size="11" fill="#a8c8b8">· 长任务调度（Ona 提供）</text>
  <text x="680" y="535" font-size="11" fill="#a8c8b8">· 记忆压缩与上下文续接</text>
  <text x="680" y="555" font-size="11" fill="#a8c8b8">· Responses API 协议标准</text>

  <!-- 底部说明 -->
  <text x="600" y="730" text-anchor="middle" font-size="11" fill="#8a9ba8" font-style="italic">双模架构在"个人开发者 + 中等规模项目"场景下工作良好；企业私有化部署能力 OpenAI 仍在持续投入</text>
</svg>
