<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
  <defs>
    <linearGradient id="coreGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d4f3c"/>
      <stop offset="100%" stop-color="#1a8a64"/>
    </linearGradient>
    <linearGradient id="clientGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#2e5d8e"/>
    </linearGradient>
    <linearGradient id="closedGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a2e2e"/>
      <stop offset="100%" stop-color="#a84444"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="760" fill="#0f1721"/>

  <text x="600" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#e8e8e8">Codex 产品矩阵（2026-08 公开资料）</text>
  <text x="600" y="64" text-anchor="middle" font-size="13" fill="#8a9ba8">客户端形态持续扩张，唯一关停的是 Atlas 浏览器（能力下沉到 ChatGPT + Codex）</text>

  <!-- 应用服务器核心 -->
  <rect x="450" y="340" width="300" height="120" rx="10" fill="url(#coreGrad)" filter="url(#shadow)"/>
  <text x="600" y="378" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Codex 应用服务器</text>
  <text x="600" y="402" text-anchor="middle" font-size="12" fill="#b8e8d0">Codex App Server · 2026-02-26 发布</text>
  <text x="600" y="422" text-anchor="middle" font-size="11" fill="#b8e8d0">JSON-RPC + stdio/JSONL 双向协议</text>
  <text x="600" y="442" text-anchor="middle" font-size="11" fill="#b8e8d0">统一所有客户端与 agent 内核</text>

  <!-- 客户端形态层 -->
  <g filter="url(#shadow)">
    <!-- CLI -->
    <rect x="40" y="120" width="180" height="90" rx="8" fill="url(#clientGrad)"/>
    <text x="130" y="148" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Codex CLI</text>
    <text x="130" y="168" text-anchor="middle" font-size="10" fill="#c8d8e8">2025-04 开源</text>
    <text x="130" y="184" text-anchor="middle" font-size="10" fill="#c8d8e8">Rust 实现 · Apache-2.0</text>
    <text x="130" y="200" text-anchor="middle" font-size="10" fill="#c8d8e8">CLI 0.134.0a2</text>

    <!-- App -->
    <rect x="240" y="120" width="180" height="90" rx="8" fill="url(#clientGrad)"/>
    <text x="330" y="148" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Codex App</text>
    <text x="330" y="168" text-anchor="middle" font-size="10" fill="#c8d8e8">2026-02 macOS</text>
    <text x="330" y="184" text-anchor="middle" font-size="10" fill="#c8d8e8">2026-03 Windows</text>
    <text x="330" y="200" text-anchor="middle" font-size="10" fill="#c8d8e8">多 Agent · Worktrees</text>

    <!-- IDE -->
    <rect x="440" y="120" width="180" height="90" rx="8" fill="url(#clientGrad)"/>
    <text x="530" y="148" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Codex IDE</text>
    <text x="530" y="168" text-anchor="middle" font-size="10" fill="#c8d8e8">VS Code · JetBrains</text>
    <text x="530" y="184" text-anchor="middle" font-size="10" fill="#c8d8e8">Xcode (Alex Codes)</text>
    <text x="530" y="200" text-anchor="middle" font-size="10" fill="#c8d8e8">共享 config.toml</text>

    <!-- Web/Cloud -->
    <rect x="640" y="120" width="180" height="90" rx="8" fill="url(#clientGrad)"/>
    <text x="730" y="148" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Codex Web</text>
    <text x="730" y="168" text-anchor="middle" font-size="10" fill="#c8d8e8">ChatGPT 后台</text>
    <text x="730" y="184" text-anchor="middle" font-size="10" fill="#c8d8e8">企业团队形态</text>
    <text x="730" y="200" text-anchor="middle" font-size="10" fill="#c8d8e8">JSON-RPC 接入</text>

    <!-- Chrome -->
    <rect x="840" y="120" width="180" height="90" rx="8" fill="url(#clientGrad)"/>
    <text x="930" y="148" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Codex for Chrome</text>
    <text x="930" y="168" text-anchor="middle" font-size="10" fill="#c8d8e8">2026-05-07</text>
    <text x="930" y="184" text-anchor="middle" font-size="10" fill="#c8d8e8">边看文档边改代码</text>
    <text x="930" y="200" text-anchor="middle" font-size="10" fill="#c8d8e8">浏览器扩展形态</text>

    <!-- Mobile -->
    <rect x="1040" y="120" width="130" height="90" rx="8" fill="url(#clientGrad)"/>
    <text x="1105" y="148" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Mobile</text>
    <text x="1105" y="168" text-anchor="middle" font-size="10" fill="#c8d8e8">2026-05-14</text>
    <text x="1105" y="184" text-anchor="middle" font-size="10" fill="#c8d8e8">iOS / Android</text>
    <text x="1105" y="200" text-anchor="middle" font-size="10" fill="#c8d8e8">远程控制 Mac</text>
  </g>

  <!-- 第二行：基础设施层 -->
  <g filter="url(#shadow)">
    <!-- Security -->
    <rect x="40" y="540" width="240" height="90" rx="8" fill="url(#closedGrad)"/>
    <text x="160" y="568" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Codex Security CLI</text>
    <text x="160" y="588" text-anchor="middle" font-size="10" fill="#f0d0d0">2026-07-28 开源</text>
    <text x="160" y="604" text-anchor="middle" font-size="10" fill="#f0d0d0">Apache-2.0</text>
    <text x="160" y="620" text-anchor="middle" font-size="10" fill="#f0d0d0">@openai/codex-security</text>

    <!-- 模型 -->
    <rect x="320" y="540" width="220" height="90" rx="8" fill="url(#closedGrad)"/>
    <text x="430" y="568" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">GPT-5.x-Codex</text>
    <text x="430" y="588" text-anchor="middle" font-size="10" fill="#f0d0d0">GPT-5.2-Codex (2025-12)</text>
    <text x="430" y="604" text-anchor="middle" font-size="10" fill="#f0d0d0">GPT-5.3-Codex-Spark</text>
    <text x="430" y="620" text-anchor="middle" font-size="10" fill="#f0d0d0">GPT-5.5 (复杂任务)</text>

    <!-- 云沙箱 -->
    <rect x="580" y="540" width="220" height="90" rx="8" fill="url(#closedGrad)"/>
    <text x="690" y="568" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">云沙箱 + Ona</text>
    <text x="690" y="588" text-anchor="middle" font-size="10" fill="#f0d0d0">2026-06-12 收购 Ona</text>
    <text x="690" y="604" text-anchor="middle" font-size="10" fill="#f0d0d0">Hosted Shell Containers</text>
    <text x="690" y="620" text-anchor="middle" font-size="10" fill="#f0d0d0">Server-side Compaction</text>

    <!-- Responses API -->
    <rect x="840" y="540" width="280" height="90" rx="8" fill="url(#closedGrad)"/>
    <text x="980" y="568" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Responses API（私有）</text>
    <text x="980" y="588" text-anchor="middle" font-size="10" fill="#f0d0d0">2025-03-11 发布</text>
    <text x="980" y="604" text-anchor="middle" font-size="10" fill="#f0d0d0">2026-02-25 WebSocket</text>
    <text x="980" y="620" text-anchor="middle" font-size="10" fill="#f0d0d0">OpenAI 事实标准</text>
  </g>

  <!-- 连线：客户端 → 应用服务器 -->
  <g stroke="#5a7088" stroke-width="1.2" fill="none" opacity="0.7">
    <path d="M 130 210 L 130 280 L 530 280 L 530 340"/>
    <path d="M 330 210 L 330 280 L 560 280 L 560 340"/>
    <path d="M 530 210 L 530 280 L 590 280 L 590 340"/>
    <path d="M 730 210 L 730 280 L 620 280 L 620 340"/>
    <path d="M 930 210 L 930 280 L 650 280 L 650 340"/>
    <path d="M 1105 210 L 1105 280 L 680 280 L 680 340"/>
  </g>

  <!-- 连线：应用服务器 → 基础设施 -->
  <g stroke="#a85a5a" stroke-width="1.2" fill="none" opacity="0.7" stroke-dasharray="4,3">
    <path d="M 470 460 L 470 510 L 160 510 L 160 540"/>
    <path d="M 520 460 L 520 510 L 430 510 L 430 540"/>
    <path d="M 600 460 L 600 510 L 690 510 L 690 540"/>
    <path d="M 680 460 L 680 510 L 980 510 L 980 540"/>
  </g>

  <!-- 图例 -->
  <g transform="translate(40, 700)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="url(#clientGrad)"/>
    <text x="22" y="12" font-size="12" fill="#c8d8e8">客户端形态（开源或本地）</text>

    <rect x="240" y="0" width="14" height="14" rx="3" fill="url(#coreGrad)"/>
    <text x="262" y="12" font-size="12" fill="#b8e8d0">服务端内核</text>

    <rect x="380" y="0" width="14" height="14" rx="3" fill="url(#closedGrad)"/>
    <text x="402" y="12" font-size="12" fill="#f0d0d0">私有后端/协议/模型</text>
  </g>

  <!-- 关键注解 -->
  <text x="40" y="260" font-size="11" fill="#8a9ba8" font-style="italic">↓ 所有客户端共享同一份 ~/.codex/config.toml</text>
  <text x="40" y="500" font-size="11" fill="#8a9ba8" font-style="italic">↓ Responses API 是事实锁定层</text>
</svg>
