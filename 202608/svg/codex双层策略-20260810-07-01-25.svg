<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 720" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="open" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="closed" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="neutral" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1080" height="720" fill="#fafafa"/>

  <!-- title -->
  <text x="540" y="42" font-size="24" font-weight="700" text-anchor="middle" fill="#0f172a">Codex 战略示意图:开源客户端 + 后端协议锁定</text>
  <text x="540" y="68" font-size="13" text-anchor="middle" fill="#475569">OpenAI 不是"封闭云端",而是用 Responses API 协议吞掉所有模型厂商的"客户端入口"</text>

  <!-- layer 1: client (open) -->
  <rect x="80" y="100" width="920" height="150" rx="14" fill="url(#open)" opacity="0.12" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="100" y="128" font-size="15" font-weight="700" fill="#1d4ed8">第一层 · 客户端(开源 · 拉新 · 生态绑定)</text>
  <text x="100" y="148" font-size="11" fill="#1e3a8a">GPL / Apache-2.0 开源 · Rust 编写 · 跨平台 · 沙箱本地执行</text>

  <!-- 4 client cards -->
  <g filter="url(#shadow)">
    <rect x="100" y="160" width="200" height="76" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1"/>
    <text x="200" y="182" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a">Codex CLI</text>
    <text x="200" y="202" font-size="10" text-anchor="middle" fill="#64748b">2025-04 开源 · 88k stars</text>
    <text x="200" y="220" font-size="10" text-anchor="middle" fill="#64748b">终端原生 · Git worktree</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="310" y="160" width="200" height="76" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1"/>
    <text x="410" y="182" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a">Codex App</text>
    <text x="410" y="202" font-size="10" text-anchor="middle" fill="#64748b">2026-02 macOS · 03 Windows</text>
    <text x="410" y="220" font-size="10" text-anchor="middle" fill="#64748b">多 Agent 并行 · Skills</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="520" y="160" width="200" height="76" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1"/>
    <text x="620" y="182" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a">Codex Security CLI</text>
    <text x="620" y="202" font-size="10" text-anchor="middle" fill="#64748b">2026-07 开源 · Apache-2.0</text>
    <text x="620" y="220" font-size="10" text-anchor="middle" fill="#64748b">漏洞扫描 · CI/CD 集成</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="730" y="160" width="200" height="76" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1"/>
    <text x="830" y="182" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a">Codex SDK</text>
    <text x="830" y="202" font-size="10" text-anchor="middle" fill="#64748b">GitHub Action · CI/CD</text>
    <text x="830" y="220" font-size="10" text-anchor="middle" fill="#64748b">TypeScript · Python</text>
  </g>

  <!-- protocol arrow -->
  <line x1="540" y1="252" x2="540" y2="298" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <polygon points="535,296 545,296 540,306" fill="#94a3b8"/>
  <text x="555" y="280" font-size="11" fill="#475569">全部统一调用 →</text>
  <text x="555" y="294" font-size="11" font-weight="600" fill="#0f172a">Responses API(2026-02 起强制)</text>

  <!-- layer 2: backend (locked) -->
  <rect x="80" y="310" width="920" height="150" rx="14" fill="url(#closed)" opacity="0.12" stroke="#ef4444" stroke-width="1.5"/>
  <text x="100" y="338" font-size="15" font-weight="700" fill="#b91c1c">第二层 · 后端协议(锁定 · 计费 · 数据)</text>
  <text x="100" y="358" font-size="11" fill="#7f1d1d">GPT-5.6 Luna / GPT-5.3-Codex / GPT-5.4 等 OpenAI 自家模型 · 第三方模型必须适配 Responses API</text>

  <g filter="url(#shadow)">
    <rect x="100" y="370" width="200" height="76" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="1"/>
    <text x="200" y="392" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a">OpenAI 自家模型</text>
    <text x="200" y="412" font-size="10" text-anchor="middle" fill="#64748b">GPT-5.6 Luna · 默认</text>
    <text x="200" y="430" font-size="10" text-anchor="middle" fill="#64748b">o3 / o4-mini · Codex 系列</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="310" y="370" width="200" height="76" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="1"/>
    <text x="410" y="392" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a">第三方模型(适配)</text>
    <text x="410" y="412" font-size="10" text-anchor="middle" fill="#64748b">Claude / Gemini / DeepSeek</text>
    <text x="410" y="430" font-size="10" text-anchor="middle" fill="#64748b">必须转 Responses API</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="520" y="370" width="200" height="76" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="1"/>
    <text x="620" y="392" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a">云端沙盒执行</text>
    <text x="620" y="412" font-size="10" text-anchor="middle" fill="#64748b">Git 仓库克隆 · 隔离环境</text>
    <text x="620" y="430" font-size="10" text-anchor="middle" fill="#64748b">并行多任务 · CI/CD 触发</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="730" y="370" width="200" height="76" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="1"/>
    <text x="830" y="392" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a">计费 / 额度池</text>
    <text x="830" y="412" font-size="10" text-anchor="middle" fill="#64748b">Token 实时计费</text>
    <text x="830" y="430" font-size="10" text-anchor="middle" fill="#64748b">Plus / Pro / Enterprise 分层</text>
  </g>

  <!-- bottom: strategy logic -->
  <rect x="80" y="490" width="920" height="180" rx="14" fill="url(#neutral)" opacity="0.08" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="100" y="518" font-size="15" font-weight="700" fill="#6d28d9">战略逻辑(类比 90 年代浏览器之争)</text>

  <text x="100" y="548" font-size="12" fill="#1e293b">
    <tspan font-weight="600">客户端开源</tspan>
    <tspan fill="#475569">= 用 Rust + 沙箱 + Skills 拉拢所有终端党开发者,把 Claude Code / Cursor 用户请进来;</tspan>
  </text>
  <text x="100" y="572" font-size="12" fill="#1e293b">
    <tspan font-weight="600">后端锁定</tspan>
    <tspan fill="#475569">= 2026-02 停止旧版 Chat Completions,所有第三方模型必须适配 Responses API,等价于"操作系统层"</tspan>
  </text>
  <text x="100" y="592" font-size="12" fill="#1e293b">
    <tspan font-weight="600">协议为王</tspan>
    <tspan fill="#475569">→ 用户可在 Codex 里切到 DeepSeek / Claude,但 Codex 这条管道、Skills / MCP / 云端沙盒 / 计费仍在 OpenAI 手里。</tspan>
  </text>

  <text x="100" y="630" font-size="12" fill="#0f172a" font-weight="600">结论:DeepSeek 不是被"架空"了 Codex,而是反过来被 Codex 收编。</text>
  <text x="100" y="652" font-size="11" fill="#64748b">类比:Chrome / Edge / Firefox 都免费开源,但 Web 标准由 W3C / Google 推动;OpenAI 走的是同一套路。</text>

  <text x="540" y="704" font-size="10" text-anchor="middle" fill="#94a3b8">数据来源:IT之家 2025-04-17、腾讯新闻 2026-01-24 / 2026-02-03 / 2026-07-29、钛媒体 2026-06-18</text>
</svg>