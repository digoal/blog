<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="-apple-system, 'Helvetica Neue', sans-serif">
  <!-- Background -->
  <rect width="900" height="520" fill="#fafaf7"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">23/5制度的隐性成本收益矩阵</text>
  <text x="450" y="55" text-anchor="middle" font-size="12" fill="#666">谁付出代价，谁获益？</text>

  <!-- Axis labels -->
  <text x="120" y="90" text-anchor="middle" font-size="11" font-weight="700" fill="#333">付出代价方</text>
  <text x="780" y="90" text-anchor="middle" font-size="11" font-weight="700" fill="#333">获益方</text>

  <!-- Divider -->
  <line x1="450" y1="80" x2="450" y2="490" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- LEFT COLUMN: 付出代价方 -->
  <g transform="translate(30, 110)">

    <!-- 散户投资者 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="180" height="75" fill="#fff" stroke="#e74c3c" stroke-width="2" rx="6"/>
      <rect x="0" y="0" width="6" height="75" fill="#e74c3c" rx="3"/>
      <text x="20" y="22" font-size="12" font-weight="700" fill="#c0392b">散户投资者</text>
      <text x="20" y="40" font-size="9.5" fill="#555">在最差时段承担</text>
      <text x="20" y="53" font-size="9.5" fill="#555">最大风险：流动性差、</text>
      <text x="20" y="66" font-size="9.5" fill="#555">价差宽、波动剧烈</text>
    </g>

    <!-- 零售券商 -->
    <g transform="translate(0, 90)">
      <rect x="0" y="0" width="180" height="75" fill="#fff" stroke="#e74c3c" stroke-width="2" rx="6"/>
      <rect x="0" y="0" width="6" height="75" fill="#e74c3c" rx="3"/>
      <text x="20" y="22" font-size="12" font-weight="700" fill="#c0392b">零售券商</text>
      <text x="20" y="40" font-size="9.5" fill="#555">合规与系统升级成本</text>
      <text x="20" y="53" font-size="9.5" fill="#555">无法转嫁 → 利润率</text>
      <text x="20" y="66" font-size="9.5" fill="#555">压缩或服务降级</text>
    </g>

    <!-- 中小机构 -->
    <g transform="translate(0, 180)">
      <rect x="0" y="0" width="180" height="75" fill="#fff" stroke="#e74c3c" stroke-width="2" rx="6"/>
      <rect x="0" y="0" width="6" height="75" fill="#e74c3c" rx="3"/>
      <text x="20" y="22" font-size="12" font-weight="700" fill="#c0392b">中小机构</text>
      <text x="20" y="40" font-size="9.5" fill="#555">风控/运营成本上升，</text>
      <text x="20" y="53" font-size="9.5" fill="#555">被迫三选一：</text>
      <text x="20" y="66" font-size="9.5" fill="#555">加班/收缩/退出</text>
    </g>

    <!-- 清算基础设施 -->
    <g transform="translate(0, 270)">
      <rect x="0" y="0" width="180" height="75" fill="#fff" stroke="#e74c3c" stroke-width="2" rx="6"/>
      <rect x="0" y="0" width="6" height="75" fill="#e74c3c" rx="3"/>
      <text x="20" y="22" font-size="12" font-weight="700" fill="#c0392b">DTCC / NSCC</text>
      <text x="20" y="40" font-size="9.5" fill="#555">撮合+7h，清算仍T+1；</text>
      <text x="20" y="53" font-size="9.5" fill="#555">日间窗口被压缩，</text>
      <text x="20" y="66" font-size="9.5" fill="#555">夜盘风险敞口重定义</text>
    </g>

    <!-- 被动 ETF 持有人 -->
    <g transform="translate(220, 0)">
      <rect x="0" y="0" width="180" height="75" fill="#fff" stroke="#e67e22" stroke-width="2" rx="6"/>
      <rect x="0" y="0" width="6" height="75" fill="#e67e22" rx="3"/>
      <text x="20" y="22" font-size="12" font-weight="700" fill="#d35400">被动ETF持有人</text>
      <text x="20" y="40" font-size="9.5" fill="#555">夜盘篮子复制成本</text>
      <text x="20" y="53" font-size="9.5" fill="#555">上升 → 跟踪误差</text>
      <text x="20" y="66" font-size="9.5" fill="#555">扩大20–30%（二阶效应）</text>
    </g>
  </g>

  <!-- RIGHT COLUMN: 获益方 -->
  <g transform="translate(530, 110)">

    <!-- 纳斯达克 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="180" height="75" fill="#fff" stroke="#27ae60" stroke-width="2" rx="6"/>
      <rect x="170" y="0" width="10" height="75" fill="#27ae60"/>
      <text x="20" y="22" font-size="12" font-weight="700" fill="#1e8449">纳斯达克</text>
      <text x="20" y="40" font-size="9.5" fill="#555">撮合费 + 数据费</text>
      <text x="20" y="53" font-size="9.5" fill="#555">+ 上市费显著上升；</text>
      <text x="20" y="66" font-size="9.5" fill="#555">重夺被CME抢走的定价权</text>
    </g>

    <!-- 头部做市商 -->
    <g transform="translate(0, 90)">
      <rect x="0" y="0" width="180" height="75" fill="#fff" stroke="#27ae60" stroke-width="2" rx="6"/>
      <rect x="170" y="0" width="10" height="75" fill="#27ae60"/>
      <text x="20" y="22" font-size="12" font-weight="700" fill="#1e8449">头部做市商</text>
      <text x="20" y="40" font-size="9.5" fill="#555">Citadel / Jane Street /</text>
      <text x="20" y="53" font-size="9.5" fill="#555">Virtu：夜盘继续做市，</text>
      <text x="20" y="66" font-size="9.5" fill="#555">赚取更高点差</text>
    </g>

    <!-- Prime Broker -->
    <g transform="translate(0, 180)">
      <rect x="0" y="0" width="180" height="75" fill="#fff" stroke="#27ae60" stroke-width="2" rx="6"/>
      <rect x="170" y="0" width="10" height="75" fill="#27ae60"/>
      <text x="20" y="22" font-size="12" font-weight="700" fill="#1e8449">大型Prime Broker</text>
      <text x="20" y="40" font-size="9.5" fill="#555">向中小机构收取</text>
      <text x="20" y="53" font-size="9.5" fill="#555">"夜盘服务费"或</text>
      <text x="20" y="66" font-size="9.5" fill="#555">"全天候托管费"</text>
    </g>

    <!-- 加密平台 -->
    <g transform="translate(0, 270)">
      <rect x="0" y="0" width="180" height="75" fill="#fff" stroke="#27ae60" stroke-width="2" rx="6"/>
      <rect x="170" y="0" width="10" height="75" fill="#27ae60"/>
      <text x="20" y="22" font-size="12" font-weight="700" fill="#1e8449">加密 / 24×7平台</text>
      <text x="20" y="40" font-size="9.5" fill="#555">Coinbase / Kraken 等</text>
      <text x="20" y="53" font-size="9.5" fill="#555">直接竞争"不间断</text>
      <text x="20" y="66" font-size="9.5" fill="#555">交易"市场份额</text>
    </g>

    <!-- ETF 授权参与人 -->
    <g transform="translate(220, 0)">
      <rect x="0" y="0" width="180" height="75" fill="#fff" stroke="#3498db" stroke-width="2" rx="6"/>
      <rect x="170" y="0" width="10" height="75" fill="#3498db"/>
      <text x="20" y="22" font-size="12" font-weight="700" fill="#2874a6">ETF 授权参与人</text>
      <text x="20" y="40" font-size="9.5" fill="#555">State Street / BNY /</text>
      <text x="20" y="53" font-size="9.5" fill="#555">BlackRock AP：被迫参与</text>
      <text x="20" y="66" font-size="9.5" fill="#555">夜盘但保持NAV稳定</text>
    </g>
  </g>

  <!-- Bottom insight -->
  <g transform="translate(150, 460)">
    <rect x="0" y="0" width="600" height="50" fill="#fff3cd" stroke="#f39c12" stroke-width="1" rx="4"/>
    <text x="300" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#7d6608">第一性结论</text>
    <text x="300" y="40" text-anchor="middle" font-size="10" fill="#7d6608">财富从"被动"流向"主动"，从"零售与中小机构"流向"基础设施与做市商"</text>
  </g>
</svg>