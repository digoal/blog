<?xml version="1.0" encoding="UTF-8"?>
<!--
  Figure 1 | Base component lifecycle (复刻)
  原文: Shi Yifan, Zhang Wei, Cui Tianyi. "A Programming Paradigm for
         Spatiotemporal Composability", 2026, Section 4.1, p.28.
  形状: 两个状态节点(𝖨𝗇𝖺𝖼𝗍𝗂𝗏𝖾 / 𝖠𝖼𝗍𝗂𝗏𝖾),两条带标签的有向边
        L-Reload (Inactive -> Active), L-Unload (Active -> Inactive)。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 240" width="520" height="240"
     font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrowhead-figure1" markerWidth="10" markerHeight="8" refX="9" refY="4"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 z" fill="#2a4d6e"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="520" height="240" fill="#fafbfc"/>

  <!-- 标题 -->
  <text x="260" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a2e">
    Figure 1 | Base Component Lifecycle
  </text>
  <text x="260" y="46" text-anchor="middle" font-size="10" fill="#666" font-style="italic">
    The simplest two-state model; Section 4.2 supplies its rules.
  </text>

  <!-- 左节点: 𝖨𝗇𝖺𝖼𝗍𝗂𝗏𝖾 -->
  <g>
    <rect x="60" y="100" width="140" height="56" rx="10" ry="10"
          fill="#ffffff" stroke="#2a4d6e" stroke-width="2"/>
    <text x="130" y="134" text-anchor="middle" font-size="14" font-weight="bold" fill="#2a4d6e">
      𝖨𝗇𝖺𝖼𝗍𝗂𝗏𝖾
    </text>
    <text x="130" y="178" text-anchor="middle" font-size="10" fill="#666">
      (no committed view, no effects)
    </text>
  </g>

  <!-- 右节点: 𝖠𝖼𝗍𝗂𝗏𝖾 -->
  <g>
    <rect x="320" y="100" width="140" height="56" rx="10" ry="10"
          fill="#ffffff" stroke="#2a4d6e" stroke-width="2"/>
    <text x="390" y="134" text-anchor="middle" font-size="14" font-weight="bold" fill="#2a4d6e">
      𝖠𝖼𝗍𝗂𝗏𝖾
    </text>
    <text x="390" y="178" text-anchor="middle" font-size="10" fill="#666">
      (committed view, accumulator g)
    </text>
  </g>

  <!-- 边: L-Reload (In -> Ac) -->
  <line x1="200" y1="120" x2="318" y2="120"
        stroke="#2a4d6e" stroke-width="2" marker-end="url(#arrowhead-figure1)"/>
  <rect x="220" y="98" width="80" height="22" rx="4" ry="4" fill="#e8f1f9" stroke="#2a4d6e" stroke-width="0.5"/>
  <text x="260" y="113" text-anchor="middle" font-size="11" font-weight="600" fill="#2a4d6e">
    L-Reload
  </text>

  <!-- 边: L-Unload (Ac -> In) -->
  <line x1="320" y1="140" x2="202" y2="140"
        stroke="#2a4d6e" stroke-width="2" marker-end="url(#arrowhead-figure1)"/>
  <rect x="220" y="148" width="80" height="22" rx="4" ry="4" fill="#e8f1f9" stroke="#2a4d6e" stroke-width="0.5"/>
  <text x="260" y="163" text-anchor="middle" font-size="11" font-weight="600" fill="#2a4d6e">
    L-Unload
  </text>

  <!-- 解释 -->
  <text x="260" y="218" text-anchor="middle" font-size="10" fill="#444">
    reload: applies effect function e, sets committed view ω
  </text>
  <text x="260" y="232" text-anchor="middle" font-size="10" fill="#444">
    unload: applies accumulator g (LIFO inverse stack), discards ω
  </text>
</svg>