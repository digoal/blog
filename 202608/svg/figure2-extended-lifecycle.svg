<?xml version="1.0" encoding="UTF-8"?>
<!--
  Figure 2 | Lifecycle with transitions in progress (复刻)
  原文: Shi Yifan, Zhang Wei, Cui Tianyi. "A Programming Paradigm for
         Spatiotemporal Composability", 2026, Section 4.3, p.33.
  形状: 4 状态节点(𝖨𝗇𝖺𝖼𝗍𝗂𝗏𝖾 / 𝖱𝖾𝗅𝗈𝖺𝖽𝗂𝗇𝗀 / 𝖠𝖼𝗍𝗂𝗏𝖾 / 𝖴𝗇𝗅𝗈𝖺𝖽𝗂𝗇𝗖)
        𝖱𝖾𝗅𝗈𝖺𝖽𝗂𝗇𝗌 和 𝖴𝗇𝗅𝗈𝖺𝖽𝗂𝗇𝗐 是 transient(过渡)状态,用虚线边框表示
        7 条边:L-Begin / L-Iter / L-Finish / L-Divert / L-Raise / L-Leave / L-Unload
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" width="560" height="320"
     font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrowhead-figure2" markerWidth="9" markerHeight="7" refX="8" refY="3.5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#2a4d6e"/>
    </marker>
  </defs>

  <rect width="560" height="320" fill="#fafbfc"/>

  <!-- 标题 -->
  <text x="280" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a2e">
    Figure 2 | Lifecycle with Transitions in Progress
  </text>
  <text x="280" y="44" text-anchor="middle" font-size="10" fill="#666" font-style="italic">
    The two transition states (𝖱𝖾𝗅𝗈𝖺𝖽𝗂𝗇𝗀, 𝖴𝗇𝗅𝗈𝖺𝖽𝗂𝗇𝗐) are outlined (transient).
  </text>

  <!-- 状态节点 -->
  <!-- 𝖨𝗇𝖺𝖼𝗍𝗂𝗏𝖾 (左下) -->
  <g>
    <rect x="50" y="200" width="110" height="46" rx="8" ry="8"
          fill="#ffffff" stroke="#2a4d6e" stroke-width="2"/>
    <text x="105" y="227" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a4d6e">
      𝖨𝗇𝖺𝖼𝗍𝗂𝗏𝖾
    </text>
  </g>

  <!-- 𝖱𝖾𝗅𝗈𝖺𝖽𝗂𝗇𝗌 (中上,transient) -->
  <g>
    <rect x="225" y="80" width="110" height="46" rx="8" ry="8"
          fill="#fff8e8" stroke="#b8860b" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="280" y="107" text-anchor="middle" font-size="12" font-weight="bold" fill="#b8860b">
      𝖱𝖾𝗅𝗈𝖺𝖽𝗂𝗇𝗀
    </text>
  </g>

  <!-- 𝖠𝖼𝗍𝗂𝗏𝖾 (右下) -->
  <g>
    <rect x="400" y="200" width="110" height="46" rx="8" ry="8"
          fill="#ffffff" stroke="#2a4d6e" stroke-width="2"/>
    <text x="455" y="227" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a4d6e">
      𝖠𝖼𝗍𝗂𝗏𝖾
    </text>
  </g>

  <!-- 𝖴𝗇𝗅𝗈𝖺𝖽𝗂𝗇𝗐 (中下,transient) -->
  <g>
    <rect x="225" y="240" width="110" height="46" rx="8" ry="8"
          fill="#fff8e8" stroke="#b8860b" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="280" y="267" text-anchor="middle" font-size="12" font-weight="bold" fill="#b8860b">
      𝖴𝗇𝗅𝗈𝖺𝖽𝗂𝗇𝗐
    </text>
  </g>

  <!-- 边: Inactive -> Reloading: L-Begin -->
  <line x1="160" y1="220" x2="223" y2="105" stroke="#2a4d6e" stroke-width="1.5"
        marker-end="url(#arrowhead-figure2)"/>
  <text x="170" y="160" font-size="10" font-weight="600" fill="#2a4d6e">L-Begin</text>

  <!-- 边: Reloading -> Active: L-Finish -->
  <line x1="335" y1="105" x2="398" y2="220" stroke="#2a4d6e" stroke-width="1.5"
        marker-end="url(#arrowhead-figure2)"/>
  <text x="370" y="160" font-size="10" font-weight="600" fill="#2a4d6e">L-Finish</text>

  <!-- 边: Reloading self-loop: L-Iter -->
  <path d="M 280 78 C 280 50, 280 50, 280 78" fill="none" stroke="#2a4d6e" stroke-width="1.5"
        marker-end="url(#arrowhead-figure2)"/>
  <text x="298" y="58" font-size="10" font-weight="600" fill="#2a4d6e">L-Iter</text>

  <!-- 边: Reloading -> Unloading: L-Divert -->
  <line x1="280" y1="128" x2="280" y2="238" stroke="#2a4d6e" stroke-width="1.5"
        marker-end="url(#arrowhead-figure2)"/>
  <text x="288" y="186" font-size="10" font-weight="600" fill="#2a4d6e">L-Divert</text>

  <!-- 边: Reloading -> Inactive: L-Raise (失败) -->
  <path d="M 230 100 C 150 180, 150 180, 158 200" fill="none" stroke="#c0392b" stroke-width="1.5"
        marker-end="url(#arrowhead-figure2)" stroke-dasharray="5,3"/>
  <text x="170" y="148" font-size="10" font-weight="600" fill="#c0392b">L-Raise</text>

  <!-- 边: Active -> Unloading: L-Leave -->
  <line x1="398" y1="225" x2="337" y2="248" stroke="#2a4d6e" stroke-width="1.5"
        marker-end="url(#arrowhead-figure2)"/>
  <text x="378" y="248" font-size="10" font-weight="600" fill="#2a4d6e">L-Leave</text>

  <!-- 边: Unloading -> Inactive: L-Unload -->
  <line x1="223" y1="252" x2="162" y2="232" stroke="#2a4d6e" stroke-width="1.5"
        marker-end="url(#arrowhead-figure2)"/>
  <text x="178" y="262" font-size="10" font-weight="600" fill="#2a4d6e">L-Unload</text>

  <!-- 备注 -->
  <text x="50" y="305" font-size="9" fill="#666" font-style="italic">
    Transient states (dashed) exist only during async transitions; they are not stable.
  </text>
  <text x="50" y="316" font-size="9" fill="#666" font-style="italic">
    L-Raise (red, dashed) is the failure path: rolls back partial effects and discards the fiber.
  </text>
</svg>