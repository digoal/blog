<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" font-family="ui-monospace, Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="ok" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="block" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ef4444"/><stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1100" height="420" fill="url(#bg)"/>

  <text x="40" y="34" fill="#f8fafc" font-size="22" font-weight="bold">
    兼容模式切换的三道关卡 (check_compatible_mode)
  </text>
  <text x="40" y="56" fill="#94a3b8" font-size="12">
    src/backend/utils/misc/ivy_guc.c:412-491 — 防止误切 + 保证依赖完整
  </text>

  <!-- 用户输入 SET ivorysql.compatible_mode=oracle -->
  <rect x="350" y="80" width="400" height="50" rx="6" fill="#475569" stroke="#94a3b8"/>
  <text x="550" y="102" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="bold">
    SET ivorysql.compatible_mode = 'oracle'
  </text>
  <text x="550" y="120" text-anchor="middle" fill="#cbd5e1" font-size="10">
    (来自会话 / SET 命令)
  </text>

  <!-- 关卡 1 -->
  <line x1="550" y1="130" x2="550" y2="160" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="280" y="170" width="540" height="60" rx="8" fill="url(#block)"/>
  <text x="550" y="193" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">
    关卡 1:database_mode 状态保护
  </text>
  <text x="550" y="213" text-anchor="middle" fill="#fecaca" font-size="11">
    PG 模式 → 拒绝切换 (CANT_CHANGE_RUNTIME_PARAM)
  </text>

  <line x1="550" y1="230" x2="550" y2="260" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 关卡 2 -->
  <rect x="280" y="270" width="540" height="55" rx="8" fill="url(#ok)" opacity="0.85"/>
  <text x="550" y="293" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">
    关卡 2:liboracle_parser.so 已加载
  </text>
  <text x="550" y="312" text-anchor="middle" fill="#d1fae5" font-size="11">
    ora_raw_parser != NULL → 检查通过 (否则 SYSTEM_ERROR)
  </text>

  <line x1="550" y1="325" x2="550" y2="345" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 关卡 3 -->
  <rect x="280" y="350" width="540" height="55" rx="8" fill="url(#ok)" opacity="0.85"/>
  <text x="550" y="373" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">
    关卡 3:IVORYSQL_ORA 插件已加载
  </text>
  <text x="550" y="392" text-anchor="middle" fill="#d1fae5" font-size="11">
    ISLOADIVORYSQL_ORA == true → assign_compatible_mode 切换 sql_raw_parser
  </text>

  <!-- 左侧标签 -->
  <text x="50" y="200" fill="#94a3b8" font-size="11">防御 1</text>
  <text x="50" y="298" fill="#94a3b8" font-size="11">防御 2</text>
  <text x="50" y="378" fill="#94a3b8" font-size="11">防御 3</text>

  <!-- 右侧附注 -->
  <text x="1050" y="200" text-anchor="end" fill="#fbbf24" font-size="11" font-style="italic">initdb 一次性锁定</text>
  <text x="1050" y="298" text-anchor="end" fill="#fbbf24" font-size="11" font-style="italic">shared_preload_libraries</text>
  <text x="1050" y="378" text-anchor="end" fill="#fbbf24" font-size="11" font-style="italic">contrib/ivorysql_ora</text>
</svg>