<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="card-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="card-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#172554" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="card-amber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#451a03" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="card-purple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#581c87" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b0764" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Spectrum Glow -->
    <linearGradient id="spectrum-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="33%" stop-color="#3b82f6"/>
      <stop offset="66%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="900" height="540" fill="url(#bg-grad)" rx="12"/>

  <!-- Title Header -->
  <text x="450" y="42" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" text-anchor="middle" letter-spacing="0.5">
    AI 大模型开源许可光谱与商业履约博弈模型
  </text>
  <text x="450" y="66" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">
    从开源定义(OSI)到商业附加条款(Commercial Restrictions)的演进与博弈
  </text>

  <!-- Spectrum Bar -->
  <rect x="50" y="90" width="800" height="8" fill="url(#spectrum-grad)" rx="4"/>

  <!-- Spectrum Labels -->
  <text x="50" y="112" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="600">纯粹开源 (Permissive)</text>
  <text x="310" y="112" fill="#3b82f6" font-family="sans-serif" font-size="11" font-weight="600">开放权重+规模限制</text>
  <text x="570" y="112" fill="#f59e0b" font-family="sans-serif" font-size="11" font-weight="600">营收/分成条款 (Revenue Share)</text>
  <text x="850" y="112" fill="#a855f7" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="end">商业双重许可 (Dual-License)</text>

  <!-- 4 Main Strategy Cards -->

  <!-- Card 1: Standard Open Source -->
  <g transform="translate(45, 130)" filter="url(#drop-shadow)">
    <rect width="190" height="260" fill="url(#card-green)" stroke="#10b981" stroke-width="1.5" rx="8"/>
    <text x="15" y="30" fill="#34d399" font-family="sans-serif" font-size="15" font-weight="700">1. 经典 OSI 开源</text>
    <text x="15" y="50" fill="#a7f3d0" font-family="sans-serif" font-size="11" font-weight="600">代表：Apache 2.0 / MIT</text>

    <line x1="15" y1="62" x2="175" y2="62" stroke="#047857" stroke-width="1"/>

    <text x="15" y="82" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">核心机制：</text>
    <text x="15" y="102" fill="#cbd5e1" font-family="sans-serif" font-size="11">• 商业使用无门槛限制</text>
    <text x="15" y="122" fill="#cbd5e1" font-family="sans-serif" font-size="11">• 允许修改、封装与再分发</text>
    <text x="15" y="142" fill="#cbd5e1" font-family="sans-serif" font-size="11">• 无营收/用户规模附加钩子</text>

    <text x="15" y="172" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">典型案例：</text>
    <text x="15" y="192" fill="#94a3b8" font-family="sans-serif" font-size="11">• DeepSeek (MIT/代码权重)</text>
    <text x="15" y="210" fill="#94a3b8" font-family="sans-serif" font-size="11">• Apache 2.0 (部分Qwen)</text>

    <rect x="15" y="225" width="160" height="22" fill="#065f46" rx="4"/>
    <text x="95" y="240" fill="#a7f3d0" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">符合 OSAID 1.0 精神</text>
  </g>

  <!-- Card 2: Scale-restricted Open Weights -->
  <g transform="translate(255, 130)" filter="url(#drop-shadow)">
    <rect width="190" height="260" fill="url(#card-blue)" stroke="#3b82f6" stroke-width="1.5" rx="8"/>
    <text x="15" y="30" fill="#60a5fa" font-family="sans-serif" font-size="15" font-weight="700">2. 用户规模限流</text>
    <text x="15" y="50" fill="#bfdbfe" font-family="sans-serif" font-size="11" font-weight="600">代表：Meta Llama License</text>

    <line x1="15" y1="62" x2="175" y2="62" stroke="#1d4ed8" stroke-width="1"/>

    <text x="15" y="82" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">核心机制：</text>
    <text x="15" y="102" fill="#cbd5e1" font-family="sans-serif" font-size="11">• MAU 触发门槛 (如7亿)</text>
    <text x="15" y="122" fill="#cbd5e1" font-family="sans-serif" font-size="11">• 阻止大企巨头无偿擦边</text>
    <text x="15" y="142" fill="#cbd5e1" font-family="sans-serif" font-size="11">• 限制用其输出训练竞争模型</text>

    <text x="15" y="172" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">典型案例：</text>
    <text x="15" y="192" fill="#94a3b8" font-family="sans-serif" font-size="11">• Llama 3.1/3.2 (700M MAU)</text>
    <text x="15" y="210" fill="#94a3b8" font-family="sans-serif" font-size="11">• Qwen2.5 早期 (100M MAU)</text>

    <rect x="15" y="225" width="160" height="22" fill="#1e40af" rx="4"/>
    <text x="95" y="240" fill="#bfdbfe" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">非 OSI 认证 (Open-Weight)</text>
  </g>

  <!-- Card 3: Revenue Share / Commercial Royalty -->
  <g transform="translate(465, 130)" filter="url(#drop-shadow)">
    <rect width="190" height="260" fill="url(#card-amber)" stroke="#f59e0b" stroke-width="1.5" rx="8"/>
    <text x="15" y="30" fill="#fbbf24" font-family="sans-serif" font-size="15" font-weight="700">3. 营收分成附加规矩</text>
    <text x="15" y="50" fill="#fde68a" font-family="sans-serif" font-size="11" font-weight="600">代表：Qwen/Moonshot 新规则</text>

    <line x1="15" y1="62" x2="175" y2="62" stroke="#b45309" stroke-width="1"/>

    <text x="15" y="82" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">核心机制：</text>
    <text x="15" y="102" fill="#cbd5e1" font-family="sans-serif" font-size="11">• 营收超2000万美元/年</text>
    <text x="15" y="122" fill="#cbd5e1" font-family="sans-serif" font-size="11">• 对API套壳大户抽取分成</text>
    <text x="15" y="142" fill="#cbd5e1" font-family="sans-serif" font-size="11">• 保护中小开发者自由免费</text>

    <text x="15" y="172" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">典型案例：</text>
    <text x="15" y="192" fill="#94a3b8" font-family="sans-serif" font-size="11">• 阿里巴巴千问商用新策略</text>
    <text x="15" y="210" fill="#94a3b8" font-family="sans-serif" font-size="11">• Kimi/Moonshot AI 商业谈判</text>

    <rect x="15" y="225" width="160" height="22" fill="#92400e" rx="4"/>
    <text x="95" y="240" fill="#fde68a" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">商业回馈与生态闭环</text>
  </g>

  <!-- Card 4: Enterprise Dual Licensing / Proprietary Source Available -->
  <g transform="translate(675, 130)" filter="url(#drop-shadow)">
    <rect width="190" height="260" fill="url(#card-purple)" stroke="#a855f7" stroke-width="1.5" rx="8"/>
    <text x="15" y="30" fill="#c084fc" font-family="sans-serif" font-size="15" font-weight="700">4. 双重许可与SSPL</text>
    <text x="15" y="50" fill="#e9d5ff" font-family="sans-serif" font-size="11" font-weight="600">代表：MongoDB / Redis模式</text>

    <line x1="15" y1="62" x2="175" y2="62" stroke="#7e22ce" stroke-width="1"/>

    <text x="15" y="82" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">核心机制：</text>
    <text x="15" y="102" fill="#cbd5e1" font-family="sans-serif" font-size="11">• 云厂商托管必须完全开源</text>
    <text x="15" y="122" fill="#cbd5e1" font-family="sans-serif" font-size="11">• 强制付费购买商业授权</text>
    <text x="15" y="142" fill="#cbd5e1" font-family="sans-serif" font-size="11">• 彻底防范云巨头搭便车</text>

    <text x="15" y="172" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">典型案例：</text>
    <text x="15" y="192" fill="#94a3b8" font-family="sans-serif" font-size="11">• MongoDB SSPL / Elastic</text>
    <text x="15" y="210" fill="#94a3b8" font-family="sans-serif" font-size="11">• Redis Source Available</text>

    <rect x="15" y="225" width="160" height="22" fill="#6b21a8" rx="4"/>
    <text x="95" y="240" fill="#e9d5ff" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">商业闭源/专有许可化</text>
  </g>

  <!-- Bottom Interactive / Execution Mechanics Box -->
  <g transform="translate(45, 415)" filter="url(#drop-shadow)">
    <rect width="820" height="95" fill="#1e293b" stroke="#475569" stroke-width="1" rx="8"/>
    <text x="20" y="28" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="700">法律履约与可观测验证三角（Legal Enforcement &amp; Observability Triangle）</text>
    
    <text x="20" y="52" fill="#cbd5e1" font-family="sans-serif" font-size="11">
      <tspan font-weight="700" fill="#f43f5e">① 审计与归因机制：</tspan> API响应水印指纹 (Model Watermarking) + 客户端请求形态探针 + 财报/云账单审计
    </text>
    <text x="20" y="70" fill="#cbd5e1" font-family="sans-serif" font-size="11">
      <tspan font-weight="700" fill="#eab308">② 开源伪装风险 (Openwashing)：</tspan> 含有商业/营收钩子的协议在法律与社区中不被认定为 OSI 标准开源，属于“开放权重(Open Weights)”
    </text>
    <text x="20" y="88" fill="#cbd5e1" font-family="sans-serif" font-size="11">
      <tspan font-weight="700" fill="#22c55e">③ 生态博弈平衡点：</tspan> 门槛设置过低将引发分叉(Fork)与弃用(Migration)；门槛合理(如2000万美元/1.4亿RMB)方能实现“养鱼”与“收割”平衡
    </text>
  </g>
</svg>
