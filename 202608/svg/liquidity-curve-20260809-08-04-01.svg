<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="-apple-system, 'Helvetica Neue', sans-serif">
  <!-- Background -->
  <rect width="900" height="500" fill="#fafaf7"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">23小时名义时长 vs 6.5小时有效定价面积</text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#666">纳斯达克23/5制度的流动性分布（理论模型）</text>

  <!-- Axes -->
  <line x1="80" y1="100" x2="880" y2="100" stroke="#ccc" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="80" y1="380" x2="880" y2="380" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="100" x2="80" y2="380" stroke="#333" stroke-width="2"/>

  <!-- Y axis label -->
  <text x="30" y="240" text-anchor="middle" font-size="11" fill="#666" transform="rotate(-90, 30, 240)">报价深度 / 流动性</text>

  <!-- X axis time labels (ET) -->
  <g font-size="10" fill="#666" text-anchor="middle">
    <text x="100" y="400">04:00</text>
    <text x="180" y="400">06:00</text>
    <text x="260" y="400">09:30</text>
    <text x="360" y="400">11:00</text>
    <text x="460" y="400">14:00</text>
    <text x="540" y="400">16:00</text>
    <text x="640" y="400">18:00</text>
    <text x="720" y="400">20:00</text>
    <text x="770" y="400">21:00</text>
    <text x="830" y="400">00:00</text>
    <text x="870" y="400">04:00</text>
  </g>

  <!-- X axis title -->
  <text x="450" y="430" text-anchor="middle" font-size="11" fill="#666">美东时间 (ET)</text>

  <!-- 09:30 Opening Cross spike -->
  <line x1="260" y1="380" x2="260" y2="120" stroke="#c0392b" stroke-width="3"/>
  <circle cx="260" cy="120" r="6" fill="#c0392b"/>
  <text x="260" y="108" text-anchor="middle" font-size="11" font-weight="700" fill="#c0392b">9:30 开盘</text>
  <text x="260" y="95" text-anchor="middle" font-size="9" fill="#c0392b">硬定价点</text>

  <!-- 16:00 Closing Cross spike -->
  <line x1="540" y1="380" x2="540" y2="115" stroke="#c0392b" stroke-width="3"/>
  <circle cx="540" cy="115" r="6" fill="#c0392b"/>
  <text x="540" y="103" text-anchor="middle" font-size="11" font-weight="700" fill="#c0392b">16:00 收盘</text>
  <text x="540" y="90" text-anchor="middle" font-size="9" fill="#c0392b">硬定价点</text>

  <!-- Pre-market 04:00 - 09:30 (semi-volunteer) -->
  <path d="M 100,360 Q 180,320 260,120" stroke="#f39c12" stroke-width="2.5" fill="none"/>
  <rect x="100" y="360" width="160" height="0" fill="none"/>
  <text x="180" y="340" text-anchor="middle" font-size="10" fill="#d68910">盘前 (半志愿)</text>

  <!-- RTH 09:30 - 16:00 (forced market making) - plateau -->
  <path d="M 260,120 L 280,150 L 540,150 L 540,115" stroke="#27ae60" stroke-width="3.5" fill="none"/>
  <rect x="265" y="155" width="270" height="14" fill="#27ae60" opacity="0.15"/>
  <text x="400" y="175" text-anchor="middle" font-size="11" font-weight="700" fill="#1e8449">RTH 真正定价 (强制做市)</text>
  <text x="400" y="190" text-anchor="middle" font-size="10" font-weight="700" fill="#1e8449">6.5 小时</text>

  <!-- Post-market 16:00 - 20:00 (semi-volunteer) -->
  <path d="M 540,115 Q 640,320 720,360" stroke="#f39c12" stroke-width="2.5" fill="none"/>
  <text x="640" y="340" text-anchor="middle" font-size="10" fill="#d68910">盘后 (半志愿)</text>

  <!-- Maintenance window 20:00 - 21:00 -->
  <rect x="720" y="360" width="50" height="20" fill="#8e44ad" opacity="0.2" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="745" y="375" text-anchor="middle" font-size="10" font-weight="700" fill="#6c3483">维护</text>

  <!-- Night 21:00 - 04:00 (full volunteer) -->
  <path d="M 770,380 L 800,375 L 830,373 L 870,372" stroke="#7f8c8d" stroke-width="1.5" fill="none"/>
  <rect x="770" y="370" width="100" height="10" fill="#95a5a6" opacity="0.15"/>
  <text x="820" y="365" text-anchor="middle" font-size="10" fill="#566573">夜间 (全志愿, 限价单)</text>

  <!-- Legend -->
  <g transform="translate(80, 440)">
    <rect x="0" y="0" width="12" height="12" fill="#c0392b"/>
    <text x="18" y="10" font-size="10" fill="#333">硬定价点 (集合竞价)</text>

    <rect x="180" y="0" width="12" height="12" fill="#27ae60" opacity="0.5"/>
    <text x="198" y="10" font-size="10" fill="#333">真正价格发现 (6.5h)</text>

    <rect x="360" y="0" width="12" height="12" fill="#f39c12" opacity="0.5"/>
    <text x="378" y="10" font-size="10" fill="#333">半志愿流动性 (13.5h)</text>

    <rect x="540" y="0" width="12" height="12" fill="#8e44ad" opacity="0.4"/>
    <text x="558" y="10" font-size="10" fill="#333">清算切口 (1h)</text>

    <rect x="700" y="0" width="12" height="12" fill="#95a5a6" opacity="0.4"/>
    <text x="718" y="10" font-size="10" fill="#333">半真空 (7h)</text>
  </g>

  <!-- Key insight callout -->
  <g transform="translate(80, 460)">
    <rect x="0" y="0" width="740" height="32" fill="#fff3cd" stroke="#f39c12" stroke-width="1" rx="3"/>
    <text x="10" y="14" font-size="10" font-weight="700" fill="#7d6608">核心发现：</text>
    <text x="10" y="27" font-size="10" fill="#7d6608">曲线下"有效面积"（真正价格发现）从16h拉到23h，但仅增长不到5%——名义时长×1.44，有效面积几乎不变</text>
  </g>
</svg>