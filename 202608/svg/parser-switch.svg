<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="ui-monospace, Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="pgBox" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="oraBox" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316"/><stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1100" height="560" fill="url(#bg)"/>

  <!-- 标题 -->
  <text x="40" y="36" fill="#f8fafc" font-size="22" font-weight="bold">
    双 Parser 调度机制 (src/backend/parser/parser.c:33-54)
  </text>
  <text x="40" y="58" fill="#94a3b8" font-size="13">
    sql_raw_parser 函数指针根据 GUC 切换 ORA_PARSER / PG_PARSER,所有解析路径汇入原生 RawStmt
  </text>

  <!-- 输入 SQL 文本 -->
  <rect x="40" y="90" width="120" height="50" rx="6" fill="#475569" stroke="#94a3b8"/>
  <text x="100" y="115" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="bold">SQL 文本</text>
  <text x="100" y="131" text-anchor="middle" fill="#cbd5e1" font-size="11">"SELECT ... FROM ..."</text>

  <!-- 箭头到 raw_parser -->
  <line x1="160" y1="115" x2="220" y2="115" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrBlue)"/>

  <!-- raw_parser() 中心枢纽 -->
  <rect x="220" y="80" width="160" height="70" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="300" y="105" text-anchor="middle" fill="#fbbf24" font-size="14" font-weight="bold">raw_parser()</text>
  <text x="300" y="125" text-anchor="middle" fill="#f1f5f9" font-size="11">parser.c:41</text>
  <text x="300" y="142" text-anchor="middle" fill="#cbd5e1" font-size="10">return (*sql_raw_parser)(str);</text>

  <!-- 双分支 -->
  <line x1="380" y1="100" x2="450" y2="100" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrBlue)"/>
  <line x1="380" y1="130" x2="450" y2="180" stroke="#f97316" stroke-width="2" marker-end="url(#arrBlue)"/>

  <!-- sql_raw_parser 函数指针(虚线框)== -->
  <rect x="450" y="75" width="200" height="50" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-dasharray="4,3"/>
  <text x="550" y="95" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="bold">sql_raw_parser</text>
  <text x="550" y="115" text-anchor="middle" fill="#cbd5e1" font-size="10">raw_parser_hook_type (parser.c:33)</text>

  <!-- PG 分支 -->
  <rect x="450" y="160" width="240" height="120" rx="8" fill="url(#pgBox)" opacity="0.9"/>
  <text x="570" y="184" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">standard_raw_parser</text>
  <text x="570" y="204" text-anchor="middle" fill="#dbeafe" font-size="11">原生 PG 解析器</text>
  <text x="570" y="225" text-anchor="middle" fill="#bfdbfe" font-size="10">src/backend/parser/gram.y</text>
  <text x="570" y="244" text-anchor="middle" fill="#bfdbfe" font-size="10">bison 默认实现</text>
  <text x="570" y="264" text-anchor="middle" fill="#fef3c7" font-size="11" font-weight="bold">→ RawStmt (PG 节点)</text>

  <!-- Oracle 分支 -->
  <rect x="450" y="305" width="240" height="120" rx="8" fill="url(#oraBox)" opacity="0.9"/>
  <text x="570" y="329" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">oracle_raw_parser</text>
  <text x="570" y="349" text-anchor="middle" fill="#fed7aa" font-size="11">Oracle 兼容解析器</text>
  <text x="570" y="370" text-anchor="middle" fill="#fed7aa" font-size="10">src/backend/oracle_parser/</text>
  <text x="570" y="389" text-anchor="middle" fill="#fed7aa" font-size="10">liboracle_parser.c (dyn-load)</text>
  <text x="570" y="409" text-anchor="middle" fill="#fef3c7" font-size="11" font-weight="bold">→ RawStmt (PG 节点)</text>

  <!-- 钩子替换函数 -->
  <line x1="550" y1="125" x2="550" y2="160" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrBlue)" stroke-dasharray="3,2"/>
  <text x="475" y="150" fill="#fbbf24" font-size="10" font-style="italic">assign_hook</text>

  <line x1="550" y1="425" x2="550" y2="460" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="570" y="450" text-anchor="middle" fill="#cbd5e1" font-size="11">汇入 RawStmt (PG 标准节点类型)</text>

  <!-- 后续 PG 流程 -->
  <rect x="450" y="470" width="600" height="50" rx="6" fill="#334155" stroke="#94a3b8"/>
  <text x="750" y="492" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="bold">
    analyze.c → rewriteHandler → planner → executor  (全 PG 原生路径)
  </text>
  <text x="750" y="510" text-anchor="middle" fill="#cbd5e1" font-size="10">
    无论哪种模式,优化器和执行器都是 PG 内核
  </text>

  <!-- 箭头到 PG 流程 -->
  <line x1="750" y1="430" x2="750" y2="470" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrBlue)"/>

  <!-- 底部注释 -->
  <text x="40" y="545" fill="#64748b" font-size="11" font-style="italic">
    代码来源: src/backend/parser/parser.c:33-54 + src/backend/utils/misc/ivy_guc.c:464-491
  </text>
</svg>