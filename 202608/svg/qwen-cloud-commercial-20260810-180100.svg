<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Upstream Card Gradient (Alibaba Cloud) -->
    <linearGradient id="aliGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Downstream Card Gradient (Competitor Clouds) -->
    <linearGradient id="compGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Developer/SME Card Gradient -->
    <linearGradient id="freeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#15803d" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Commercial Threshold Box -->
    <linearGradient id="threshGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Filters & Glow -->
    <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- Arrow Marker -->
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f97316"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4ade80"/>
    </marker>
    <marker id="arrowYellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#facc15"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="25" width="940" height="60" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="50" y="60" fill="#f8fafc" font-size="20" font-weight="700">Qwen开源商业化演进与云计算“反管道化”博弈格局</text>
  <text x="680" y="60" fill="#94a3b8" font-size="13">阿里千问 vs 聚合云平台博弈架构图</text>

  <!-- Main Container Layout -->

  <!-- Left: Upstream Model Owner (Alibaba Cloud) -->
  <rect x="30" y="105" width="290" height="480" rx="14" fill="url(#aliGrad)" stroke="#ea580c" stroke-width="2" stroke-dasharray="none"/>
  <rect x="45" y="120" width="130" height="28" rx="6" fill="#ea580c"/>
  <text x="110" y="139" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">开源上游 (阿里)</text>
  
  <text x="50" y="178" fill="#fdba74" font-size="16" font-weight="bold">通义千问 (Qwen) 生态核心</text>
  
  <!-- Content box 1: Pre-training investment -->
  <rect x="45" y="195" width="260" height="95" rx="8" fill="#0f172a" fill-opacity="0.7" stroke="#9a3412" stroke-width="1"/>
  <text x="58" y="218" fill="#fb923c" font-size="13" font-weight="bold">⚡ 巨额算力投入 (R&amp;D Sink)</text>
  <text x="58" y="240" fill="#cbd5e1" font-size="11">• 预训练集群与千卡/万卡算力沉没</text>
  <text x="58" y="258" fill="#cbd5e1" font-size="11">• 开放权重/开源协议 (Apache 2.0)</text>
  <text x="58" y="276" fill="#cbd5e1" font-size="11">• 开源获客：GitHub 2W+ Star &amp; 厂商依赖</text>

  <!-- Content box 2: Native Monetization -->
  <rect x="45" y="305" width="260" height="120" rx="8" fill="#0f172a" fill-opacity="0.7" stroke="#9a3412" stroke-width="1"/>
  <text x="58" y="328" fill="#fb923c" font-size="13" font-weight="bold">💰 原生闭环商业化 (百炼平台)</text>
  <text x="58" y="350" fill="#cbd5e1" font-size="11">• 阿里云自研芯片与CUBE 5.0极致性价比</text>
  <text x="58" y="368" fill="#cbd5e1" font-size="11">• API Token直接计费 + 企业私有部署</text>
  <text x="58" y="386" fill="#cbd5e1" font-size="11">• 目标：AI收入占比突破30% (算力绑定)</text>
  <text x="58" y="404" fill="#94a3b8" font-size="10" font-style="italic">痛点：避免沦为纯粹的“免费开源打工人”</text>

  <!-- New License Rules -->
  <rect x="45" y="440" width="260" height="130" rx="8" fill="url(#threshGrad)" stroke="#facc15" stroke-width="1.5"/>
  <text x="58" y="463" fill="#facc15" font-size="13" font-weight="bold">🛡️ 商业许可新规 (分成阀门)</text>
  <text x="58" y="485" fill="#e2e8f0" font-size="11">• 门槛：12个月营收 &gt; 2000万美元</text>
  <text x="58" y="503" fill="#e2e8f0" font-size="11">• 触发条件：封装API对外二次销售</text>
  <text x="58" y="521" fill="#e2e8f0" font-size="11">• 诉求：品牌使用费 / 算力返佣 / 分成</text>
  <text x="58" y="545" fill="#fde047" font-size="11" font-weight="bold">➔ 破解下游云平台“管道化”风险</text>

  <!-- Middle: Disintermediation Risk & Threshold Layer -->
  <!-- Upper Right: Downstream Resellers (AWS / Volcengine / Resellers) -->
  <rect x="370" y="105" width="290" height="235" rx="14" fill="url(#compGrad)" stroke="#0284c7" stroke-width="2"/>
  <rect x="385" y="120" width="140" height="28" rx="6" fill="#0284c7"/>
  <text x="455" y="139" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">下游云平台 / API转售商</text>

  <text x="390" y="178" fill="#38bdf8" font-size="15" font-weight="bold">AWS / 火山引擎 / 腾讯云 / 聚合API</text>

  <rect x="385" y="195" width="260" height="130" rx="8" fill="#0f172a" fill-opacity="0.7" stroke="#0369a1" stroke-width="1"/>
  <text x="398" y="218" fill="#7dd3fc" font-size="13" font-weight="bold">⚠️ 管道化风险 (Pipelining Risk)</text>
  <text x="398" y="240" fill="#cbd5e1" font-size="11">• 直接托管Qwen开源权重，卖Token计费</text>
  <text x="398" y="258" fill="#cbd5e1" font-size="11">• 零模型研发成本，赚取全额云计算毛利</text>
  <text x="398" y="276" fill="#cbd5e1" font-size="11">• 截留终端客户关系与应用层数据</text>
  <text x="398" y="298" fill="#f87171" font-size="11" font-weight="bold">❌ 阿里面临“研发在左，利润在右”困境</text>

  <!-- Lower Right: SME & Internal Enterprise Users (Free Zone) -->
  <rect x="370" y="360" width="290" height="225" rx="14" fill="url(#freeGrad)" stroke="#16a34a" stroke-width="2"/>
  <rect x="385" y="375" width="130" height="28" rx="6" fill="#16a34a"/>
  <text x="450" y="394" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">普通开发者 / 中小企业</text>

  <text x="390" y="433" fill="#4ade80" font-size="15" font-weight="bold">内部使用与未达标商业体</text>

  <rect x="385" y="450" width="260" height="120" rx="8" fill="#0f172a" fill-opacity="0.7" stroke="#15803d" stroke-width="1"/>
  <text x="398" y="473" fill="#86efac" font-size="13" font-weight="bold">✅ 100% 免费与开源规则不变</text>
  <text x="398" y="495" fill="#cbd5e1" font-size="11">• 个人开发者部署 / 实验室 / 科研</text>
  <text x="398" y="513" fill="#cbd5e1" font-size="11">• 企业内部私有化部署 (非对外售卖API)</text>
  <text x="398" y="531" fill="#cbd5e1" font-size="11">• 年营收 &lt; 2000万美元的小型AI应用</text>
  <text x="398" y="553" fill="#4ade80" font-size="11" font-weight="bold">➔ 繁荣开源底座生态，扩大开发者基数</text>

  <!-- Right: Competitive Dynamics & Equilibrium -->
  <rect x="690" y="105" width="280" height="480" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="710" y="140" fill="#f8fafc" font-size="16" font-weight="bold">云计算与大模型博弈演进</text>

  <!-- Phase 1 -->
  <rect x="705" y="165" width="250" height="85" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="718" y="188" fill="#93c5fd" font-size="12" font-weight="bold">阶段 1：跑马圈地 (开源获客)</text>
  <text x="718" y="208" fill="#94a3b8" font-size="11">以免费开源击败闭源竞争者，</text>
  <text x="718" y="225" fill="#94a3b8" font-size="11">建立全球基础设施事实标准。</text>

  <!-- Phase 2 -->
  <rect x="705" y="265" width="250" height="95" rx="8" fill="#0f172a" stroke="#eab308"/>
  <text x="718" y="288" fill="#fde047" font-size="12" font-weight="bold">阶段 2：管道防守 (商业关卡)</text>
  <text x="718" y="308" fill="#cbd5e1" font-size="11">对托管转售商设置 $20M 营收门槛，</text>
  <text x="718" y="325" fill="#cbd5e1" font-size="11">强迫巨头坐下来谈判分成或算力绑定。</text>

  <!-- Phase 3 -->
  <rect x="705" y="375" width="250" height="195" rx="8" fill="#0f172a" stroke="#10b981"/>
  <text x="718" y="398" fill="#6ee7b7" font-size="12" font-weight="bold">阶段 3：终局平衡 (云智协同)</text>
  <text x="718" y="420" fill="#cbd5e1" font-size="11">• **阿里云原生算力**：凭全栈优化</text>
  <text x="718" y="438" fill="#cbd5e1" font-size="11">  (自研芯片+百炼) 维持最低Token成本</text>
  <text x="718" y="460" fill="#cbd5e1" font-size="11">• **第三方云平台**：要么缴纳分成，</text>
  <text x="718" y="478" fill="#cbd5e1" font-size="11">  要么转采购阿里云混合算力/异构云</text>
  <text x="718" y="500" fill="#cbd5e1" font-size="11">• **生态闭环**：开源研发成本由</text>
  <text x="718" y="518" fill="#cbd5e1" font-size="11">  大流量Reseller回馈，持续自我造血</text>

  <!-- Flow Arrows & Connectors -->
  <!-- Arrow: Alibaba -> Downstream Cloud (Token Reselling) -->
  <path d="M 320 220 L 370 220" stroke="#0284c7" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrowBlue)"/>
  <text x="330" y="210" fill="#38bdf8" font-size="10">开源托管</text>

  <!-- Arrow: Alibaba -> SME Zone (Free Open Source) -->
  <path d="M 320 480 L 370 480" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="330" y="470" fill="#4ade80" font-size="10">免费生态</text>

  <!-- Arrow: Downstream Cloud -> Alibaba Threshold (Revenue Share back) -->
  <path d="M 450 340 L 450 360 L 305 360 L 305 440" fill="none" stroke="#facc15" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrowYellow)"/>
  <text x="360" y="355" fill="#facc15" font-size="10" font-weight="bold">&gt; $20M 触头发成 / 算力回流</text>

</svg>
