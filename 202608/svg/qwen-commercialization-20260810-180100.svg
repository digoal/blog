<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    
    <linearGradient id="qwenGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="freeTierGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="paidTierGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    
    <marker id="arrowHead" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowHeadAmber" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowHeadGreen" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="620" fill="url(#bgGlow)"/>

  <!-- Title Block -->
  <text x="500" y="45" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="bold" letter-spacing="1">开源大模型商业化策略：三层分级授权与生态闭环拓扑</text>
  <text x="500" y="72" text-anchor="middle" fill="#94a3b8" font-size="13">阿里通义千问（Qwen）收入门槛分成模式与搭便车效应治理经济学模型</text>

  <!-- Central Upstream Node (Qwen Model Engine) -->
  <g transform="translate(330, 110)" filter="url(#shadow)">
    <rect width="340" height="110" rx="12" fill="url(#qwenGradient)"/>
    <text x="170" y="38" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">上游开源基座：阿里通义千问 (Qwen Core)</text>
    <text x="170" y="62" text-anchor="middle" fill="#e0e7ff" font-size="12">高固定资本支出 (Capex) + 高持续研发与预训练成本</text>
    <rect x="25" y="75" width="290" height="24" rx="6" fill="rgba(255,255,255,0.2)"/>
    <text x="170" y="91" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">开源策略：开放权重 (Open-Weights) + 差异化许可协议</text>
  </g>

  <!-- Division Threshold Rule -->
  <g transform="translate(100, 260)">
    <line x1="0" y1="0" x2="800" y2="0" stroke="#475569" stroke-width="2" stroke-dasharray="6,6"/>
    <rect x="330" y="-16" width="340" height="32" rx="16" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
    <text x="500" y="5" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="bold">商业化临界线：连续12个月营收 ≥ $2,000万 (约1.4亿人民币)</text>
  </g>

  <!-- Left Branch: Free Tier (Developers & Small/Medium Enterprise) -->
  <g transform="translate(60, 320)" filter="url(#shadow)">
    <rect width="410" height="230" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <path d="M 0 0 L 410 0 L 410 40 L 0 40 Z" fill="url(#freeTierGrad)"/>
    <text x="205" y="26" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">普惠生态层：小微企业 / 开发者 / 内部自用</text>
    
    <text x="25" y="70" fill="#e2e8f0" font-size="13" font-weight="600">门槛标准：<tspan fill="#10b981">营收 &lt; $2,000万 或 非直接转售API</tspan></text>
    <text x="25" y="96" fill="#94a3b8" font-size="12">• 许可模式：100% 免费开放部署与微调</text>
    <text x="25" y="118" fill="#94a3b8" font-size="12">• 经济学效应：极低边际许可成本，繁荣开发者生态</text>
    <text x="25" y="140" fill="#94a3b8" font-size="12">• 价值贡献：网络效应、GitHub Star、反馈数据与使用惯性</text>
    
    <rect x="20" y="165" width="370" height="45" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <text x="205" y="185" text-anchor="middle" fill="#a7f3d0" font-size="12" font-weight="bold">结果：零摩擦扩散，最大化网络效应</text>
    <text x="205" y="202" text-anchor="middle" fill="#6ee7b7" font-size="11">保护中小开发者，维持开源基座流行度第一地位</text>
  </g>

  <!-- Right Branch: Paid Commercial Tier (Hyper-scalers & API Wrappers) -->
  <g transform="translate(530, 320)" filter="url(#shadow)">
    <rect width="410" height="230" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <path d="M 0 0 L 410 0 L 410 40 L 0 40 Z" fill="url(#paidTierGrad)"/>
    <text x="205" y="26" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">商业抽租层：大规模 API 套壳商 / MaaS 云厂商</text>
    
    <text x="25" y="70" fill="#e2e8f0" font-size="13" font-weight="600">门槛标准：<tspan fill="#f59e0b">营收 ≥ $2,000万 且 包装为API转售</tspan></text>
    <text x="25" y="96" fill="#94a3b8" font-size="12">• 许可模式：定制商业协议 + 比例分成 (最高约30%)</text>
    <text x="25" y="118" fill="#94a3b8" font-size="12">• 经济学效应：纠正“搭便车效应”(Free-rider Problem)</text>
    <text x="25" y="140" fill="#94a3b8" font-size="12">• 价值贡献：向上游反哺商业租金，维持开源研发可持续性</text>
    
    <rect x="20" y="165" width="370" height="45" rx="8" fill="#78350f" stroke="#d97706" stroke-width="1"/>
    <text x="205" y="185" text-anchor="middle" fill="#fde68a" font-size="12" font-weight="bold">结果：内部化外部性，共享商业租金</text>
    <text x="205" y="202" text-anchor="middle" fill="#fcd34d" font-size="11">抑制非对称套利，建立“能力-资本”正向循环</text>
  </g>

  <!-- Flow Arrows -->
  <!-- Top to Left -->
  <path d="M 410 220 L 410 260 L 265 260 L 265 318" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowHeadGreen)"/>
  <!-- Top to Right -->
  <path d="M 590 220 L 590 260 L 735 260 L 735 318" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrowHeadAmber)"/>

  <!-- Feedback Loop Arrow from Paid Tier back to Upstream -->
  <path d="M 940 435 C 980 435 980 165 678 165" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowHeadAmber)"/>
  <rect x="800" y="270" width="170" height="40" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
  <text x="885" y="287" text-anchor="middle" fill="#fde68a" font-size="11" font-weight="bold">收益反哺闭环</text>
  <text x="885" y="302" text-anchor="middle" fill="#94a3b8" font-size="10">商业分成注入下一代研发</text>

  <!-- Footer Info -->
  <text x="500" y="590" text-anchor="middle" fill="#64748b" font-size="11">图解：开源大模型从“无条件慈善”向“帕累托改进型商业许可”演进的产业经济学逻辑 | Designed for Industrial Economics Report</text>
</svg>
