<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
  <defs>
    <linearGradient id="oaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a8a64"/>
      <stop offset="100%" stop-color="#2dbb8a"/>
    </linearGradient>
    <linearGradient id="dsGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2e5d8e"/>
      <stop offset="100%" stop-color="#4a85c8"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="720" fill="#0f1721"/>

  <text x="600" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#e8e8e8">Responses API vs Chat Completions API</text>
  <text x="600" y="60" text-anchor="middle" font-size="13" fill="#8a9ba8">Codex CLI 强绑定 Responses API；DeepSeek / Kimi 默认走 Chat Completions</text>

  <!-- Codex CLI 客户端 -->
  <rect x="80" y="290" width="220" height="140" rx="10" fill="#1e3a5f" filter="url(#shadow2)"/>
  <text x="190" y="320" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Codex CLI / App</text>
  <text x="190" y="345" text-anchor="middle" font-size="12" fill="#c8d8e8">OpenAI 开源客户端</text>
  <text x="190" y="368" text-anchor="middle" font-size="11" fill="#c8d8e8">代码：Apache-2.0</text>
  <text x="190" y="392" text-anchor="middle" font-size="11" fill="#c8d8e8" font-weight="600">wire_api = "responses"</text>
  <text x="190" y="414" text-anchor="middle" font-size="11" fill="#ff9966">必须接 Responses 协议</text>

  <!-- 上游模型 -->
  <rect x="900" y="120" width="220" height="140" rx="10" fill="url(#oaGrad)" filter="url(#shadow2)"/>
  <text x="1010" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">OpenAI 模型</text>
  <text x="1010" y="175" text-anchor="middle" font-size="12" fill="#d0f0e0">GPT-5.3-Codex</text>
  <text x="1010" y="198" text-anchor="middle" font-size="12" fill="#d0f0e0">GPT-5.5</text>
  <text x="1010" y="222" text-anchor="middle" font-size="11" fill="#d0f0e0" font-weight="600">POST /responses</text>
  <text x="1010" y="244" text-anchor="middle" font-size="11" fill="#d0f0e0">原生支持</text>

  <rect x="900" y="290" width="220" height="140" rx="10" fill="url(#dsGrad)" filter="url(#shadow2)"/>
  <text x="1010" y="320" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">DeepSeek / Kimi</text>
  <text x="1010" y="345" text-anchor="middle" font-size="12" fill="#d0e8f8">deepseek-v4-flash</text>
  <text x="1010" y="368" text-anchor="middle" font-size="12" fill="#d0e8f8">deepseek-v4-pro</text>
  <text x="1010" y="392" text-anchor="middle" font-size="11" fill="#d0e8f8" font-weight="600">POST /chat/completions</text>
  <text x="1010" y="414" text-anchor="middle" font-size="11" fill="#ffcc88">原生 Chat Completions</text>

  <!-- 直接接入 OK -->
  <g stroke="#2dbb8a" stroke-width="2.5" fill="none">
    <path d="M 300 320 L 900 200"/>
  </g>
    <text x="600" y="245" text-anchor="middle" font-size="13" fill="#2dbb8a" font-weight="600">直接接入 OK（原生 Responses 兼容）</text>

  <!-- 直接接入失败 -->
  <g stroke="#ff5555" stroke-width="2.5" fill="none" stroke-dasharray="8,5">
    <path d="M 300 360 L 900 350"/>
  </g>
  <text x="600" y="350" text-anchor="middle" font-size="13" fill="#ff5555" font-weight="600">直连 404 / 超时无响应</text>

  <!-- CC Switch 网关 -->
  <rect x="500" y="430" width="200" height="100" rx="10" fill="#7a5e2e" filter="url(#shadow2)"/>
  <text x="600" y="458" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">CC Switch / Moon Bridge</text>
  <text x="600" y="480" text-anchor="middle" font-size="11" fill="#f0d8a0">协议转换网关</text>
  <text x="600" y="500" text-anchor="middle" font-size="11" fill="#f0d8a0">127.0.0.1:15721</text>
  <text x="600" y="520" text-anchor="middle" font-size="11" fill="#f0d8a0" font-weight="600">/responses ⇄ /chat/completions</text>

  <!-- 网关到 DeepSeek -->
  <g stroke="#ffa500" stroke-width="2.5" fill="none">
    <path d="M 700 480 L 900 380"/>
  </g>
  <text x="780" y="445" font-size="12" fill="#ffa500" font-weight="600">经网关可达</text>

  <!-- Codex 到网关 -->
  <g stroke="#ffa500" stroke-width="2.5" fill="none" stroke-dasharray="4,3">
    <path d="M 250 430 L 500 470"/>
  </g>

  <!-- 协议差异对比表 -->
  <g transform="translate(40, 580)">
    <rect x="0" y="0" width="1120" height="120" rx="8" fill="#1a2530" stroke="#3a4a5e"/>
    <text x="20" y="25" font-size="14" font-weight="700" fill="#e8e8e8">关键差异</text>

    <text x="20" y="52" font-size="12" fill="#c8d8e8" font-weight="600">端点路径</text>
    <text x="140" y="52" font-size="12" fill="#a8b8c8">POST /responses</text>
    <text x="620" y="52" font-size="12" fill="#a8b8c8">POST /chat/completions</text>

    <text x="20" y="72" font-size="12" fill="#c8d8e8" font-weight="600">角色类型</text>
    <text x="140" y="72" font-size="12" fill="#a8b8c8">支持 developer（高于 system）</text>
    <text x="620" y="72" font-size="12" fill="#a8b8c8">仅 system/user/assistant/tool</text>

    <text x="20" y="92" font-size="12" fill="#c8d8e8" font-weight="600">独有参数</text>
    <text x="140" y="92" font-size="12" fill="#a8b8c8">reasoning / store / include</text>
    <text x="620" y="92" font-size="12" fill="#a8b8c8">不支持，会被忽略或报错</text>

    <text x="20" y="112" font-size="12" fill="#c8d8e8" font-weight="600">SSE 事件流</text>
    <text x="140" y="112" font-size="12" fill="#a8b8c8">Responses 事件流</text>
    <text x="620" y="112" font-size="12" fill="#a8b8c8">Chat Completions 事件流</text>
  </g>
</svg>
