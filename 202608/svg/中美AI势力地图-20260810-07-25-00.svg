<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="openai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f6feb"/>
      <stop offset="1" stop-color="#0d3b8a"/>
    </linearGradient>
    <linearGradient id="ds" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#0a6b50"/>
    </linearGradient>
    <linearGradient id="other" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f87171"/>
    </marker>
  </defs>

  <rect width="1280" height="820" fill="url(#bg)"/>

  <!-- Title -->
  <text x="40" y="48" fill="#f8fafc" font-size="26" font-weight="700">中美 AI 竞争势力地图 · 2026 年 8 月</text>
  <text x="40" y="74" fill="#94a3b8" font-size="14">数据：OpenRouter 周榜、Artificial Analysis、OpenAI/DeepSeek 公开公告 · 整理：digoal</text>

  <!-- Left column: OpenAI camp -->
  <g transform="translate(40,110)">
    <rect width="360" height="650" rx="14" fill="#0f1e36" stroke="#1f3a64" stroke-width="1.5"/>
    <text x="20" y="36" fill="#7dd3fc" font-size="14" font-weight="700">美方阵营 · 闭源全栈</text>
    <text x="20" y="58" fill="#cbd5e1" font-size="12">核心打法：模型 + 应用 + 算力三位一体</text>

    <!-- OpenAI core -->
    <rect x="20" y="78" width="320" height="120" rx="10" fill="url(#openai)"/>
    <text x="36" y="106" fill="#fff" font-size="20" font-weight="700">OpenAI</text>
    <text x="36" y="130" fill="#cfe6ff" font-size="12">模型：GPT-5.6 (Luna/Terra/Sol) · o3 · GPT-5-Codex</text>
    <text x="36" y="148" fill="#cfe6ff" font-size="12">应用：ChatGPT · Codex CLI/IDE/Web · Sora</text>
    <text x="36" y="166" fill="#cfe6ff" font-size="12">收入：2025 总收入约 130 亿$，ChatGPT 约 100 亿$</text>
    <text x="36" y="184" fill="#cfe6ff" font-size="12">算力：Stargate 5000 亿$ / 8GW · 三年 4500 亿$</text>

    <!-- Anthropic -->
    <rect x="20" y="218" width="320" height="74" rx="10" fill="#1a2c4a"/>
    <text x="36" y="242" fill="#fff" font-size="16" font-weight="700">Anthropic (Claude)</text>
    <text x="36" y="262" fill="#cbd5e1" font-size="12">Claude Code · Claude Opus/Sonnet</text>
    <text x="36" y="278" fill="#cbd5e1" font-size="12">定位：企业 Agent 与编程的高端赛道</text>

    <!-- Google + Meta -->
    <rect x="20" y="312" width="320" height="74" rx="10" fill="#1a2c4a"/>
    <text x="36" y="336" fill="#fff" font-size="16" font-weight="700">Google · Meta</text>
    <text x="36" y="356" fill="#cbd5e1" font-size="12">Gemini 3.5 Flash-Lite · Llama (Qwen 已反超)</text>
    <text x="36" y="372" fill="#cbd5e1" font-size="12">Meta：Hyperion 数据中心合资结构</text>

    <!-- Compute substrate -->
    <rect x="20" y="406" width="320" height="74" rx="10" fill="#0e1f3a" stroke="#1f6feb" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="36" y="430" fill="#7dd3fc" font-size="14" font-weight="700">算力底座</text>
    <text x="36" y="450" fill="#94a3b8" font-size="11">英伟达 H100/H200/B200 · TPU v7 · 自研芯片</text>
    <text x="36" y="466" fill="#94a3b8" font-size="11">OpenAI 2025-01 启动 Stargate（5000 亿$）</text>

    <!-- Closed stack rule -->
    <rect x="20" y="500" width="320" height="130" rx="10" fill="#11253f" stroke="#1f6feb" stroke-width="1"/>
    <text x="36" y="524" fill="#7dd3fc" font-size="13" font-weight="700">闭源体系的三道护城河</text>
    <text x="36" y="548" fill="#cbd5e1" font-size="11">① 模型权重不开放（GPT-5-Codex 不给 API）</text>
    <text x="36" y="568" fill="#cbd5e1" font-size="11">② 客户端绑定 ChatGPT/Codex 订阅与 IDE 插件</text>
    <text x="36" y="588" fill="#cbd5e1" font-size="11">③ 算力自营（Stargate）+ 企业销售闭环</text>
    <text x="36" y="608" fill="#94a3b8" font-size="11">"Codex 被放弃"是错觉；Codex = 开发者入口</text>
  </g>

  <!-- Center column: battle ground -->
  <g transform="translate(440,110)">
    <rect width="400" height="650" rx="14" fill="#0f1a30" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="36" fill="#fbbf24" font-size="14" font-weight="700">交锋地带 · 2025-2026 关键事实</text>

    <!-- Big number 1 -->
    <rect x="20" y="60" width="360" height="86" rx="10" fill="#1c2a44"/>
    <text x="36" y="84" fill="#fff" font-size="13" font-weight="700">DeepSeek-V4-Flash 调用量</text>
    <text x="36" y="118" fill="#10b981" font-size="26" font-weight="700">7.22 万亿 Token / 周</text>
    <text x="36" y="138" fill="#94a3b8" font-size="11">OpenRouter 2026-08-04，单日峰值 8 万亿 Token</text>

    <!-- Big number 2 -->
    <rect x="20" y="160" width="360" height="86" rx="10" fill="#1c2a44"/>
    <text x="36" y="184" fill="#fff" font-size="13" font-weight="700">DeepSeek vs GPT-5.6 Luna（OpenRouter）</text>
    <text x="36" y="218" fill="#10b981" font-size="26" font-weight="700">11.31T : 3.54T ≈ 3 倍</text>
    <text x="36" y="238" fill="#94a3b8" font-size="11">数据：2026-08-03 至 2026-08-07，仅 OpenRouter 渠道</text>

    <!-- Big number 3 -->
    <rect x="20" y="260" width="360" height="86" rx="10" fill="#1c2a44"/>
    <text x="36" y="284" fill="#fff" font-size="13" font-weight="700">DeepSeek-V4-Flash 定价</text>
    <text x="36" y="318" fill="#10b981" font-size="26" font-weight="700">$0.14 / $0.28 per 1M Token</text>
    <text x="36" y="338" fill="#94a3b8" font-size="11">Artificial Analysis 2026-08-03，约为 Claude Opus 1/52</text>

    <!-- Big number 4 -->
    <rect x="20" y="360" width="360" height="86" rx="10" fill="#1c2a44"/>
    <text x="36" y="384" fill="#fff" font-size="13" font-weight="700">OpenAI 反击 · GPT-5.6 Luna</text>
    <text x="36" y="418" fill="#f87171" font-size="26" font-weight="700">降价 80%</text>
    <text x="36" y="438" fill="#94a3b8" font-size="11">2026-07-31，OpenAI 官方公告；Terra 同步降 20%</text>

    <!-- Cost asymmetry -->
    <rect x="20" y="460" width="360" height="170" rx="10" fill="#11253f" stroke="#fbbf24" stroke-width="1"/>
    <text x="36" y="484" fill="#fbbf24" font-size="13" font-weight="700">"被架空"的真实边界</text>
    <text x="36" y="506" fill="#86efac" font-size="11">✓ 被冲击：API 价格 · 长尾开发者 · 低端市场</text>
    <text x="36" y="524" fill="#86efac" font-size="11">✓ 被冲击：开源模型话语权 · 推理成本曲线</text>
    <text x="36" y="544" fill="#86efac" font-size="11">✗ 未冲击：付费订阅 · 企业级 · 品牌信任 · AGI 研发</text>
    <text x="36" y="562" fill="#86efac" font-size="11">✗ 未冲击：客户端与 IDE 生态绑定 · 多模态</text>
    <text x="36" y="582" fill="#94a3b8" font-size="11">ChatGPT 2025 收入 ≈ 100 亿$，付费用户稳步增长</text>
    <text x="36" y="600" fill="#94a3b8" font-size="11">Codex 非开发者用量 2025-08 以来增长 137 倍</text>
    <text x="36" y="618" fill="#94a3b8" font-size="11">OpenAI 预计 2025-2029 累计烧 1150 亿$</text>
  </g>

  <!-- Right column: China camp -->
  <g transform="translate(880,110)">
    <rect width="360" height="650" rx="14" fill="#0f1f1a" stroke="#10b981" stroke-width="1.5"/>
    <text x="20" y="36" fill="#86efac" font-size="14" font-weight="700">中方阵营 · 开源低价</text>
    <text x="20" y="58" fill="#cbd5e1" font-size="12">核心打法：开源模型 + 极致成本 + 长尾开发者</text>

    <!-- DeepSeek core -->
    <rect x="20" y="78" width="320" height="120" rx="10" fill="url(#ds)"/>
    <text x="36" y="106" fill="#fff" font-size="20" font-weight="700">DeepSeek</text>
    <text x="36" y="130" fill="#d1fae5" font-size="12">模型：V4-Pro (1.6T) · V4-Flash · R1 · Coder</text>
    <text x="36" y="148" fill="#d1fae5" font-size="12">训练：V3 Base 600 万$ · R1 增量 29.4 万$</text>
    <text x="36" y="166" fill="#d1fae5" font-size="12">协议：MIT License · 完全开源 · API 兼容 OpenAI</text>
    <text x="36" y="184" fill="#d1fae5" font-size="12">R1 发布：2025-01-20，Nature 2025-09 封面</text>

    <!-- Alibaba Qwen -->
    <rect x="20" y="218" width="320" height="74" rx="10" fill="#133528"/>
    <text x="36" y="242" fill="#fff" font-size="16" font-weight="700">阿里 Qwen · 已超 Llama</text>
    <text x="36" y="262" fill="#cbd5e1" font-size="12">Qwen3 · Qwen2.5-Max · 全球第一开源模型</text>
    <text x="36" y="278" fill="#cbd5e1" font-size="12">Amazon Bedrock 已上架</text>

    <!-- Other Chinese models -->
    <rect x="20" y="312" width="320" height="74" rx="10" fill="#133528"/>
    <text x="36" y="336" fill="#fff" font-size="16" font-weight="700">小米 MiMo · 腾讯 Hy3 · Kimi · GLM</text>
    <text x="36" y="356" fill="#cbd5e1" font-size="12">OpenRouter 调用前五全部为中国模型</text>
    <text x="36" y="372" fill="#cbd5e1" font-size="12">已连续 14 周保持</text>

    <!-- Compute substrate -->
    <rect x="20" y="406" width="320" height="74" rx="10" fill="#0e2722" stroke="#10b981" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="36" y="430" fill="#86efac" font-size="14" font-weight="700">算力约束</text>
    <text x="36" y="450" fill="#94a3b8" font-size="11">H800/H100 出口管制（2022 起）</text>
    <text x="36" y="466" fill="#94a3b8" font-size="11">DeepSeek 用 512 张 H800 训 R1，80 小时</text>

    <!-- Open playbook -->
    <rect x="20" y="500" width="320" height="130" rx="10" fill="#0e2722" stroke="#10b981" stroke-width="1"/>
    <text x="36" y="524" fill="#86efac" font-size="13" font-weight="700">开源低价的三重杠杆</text>
    <text x="36" y="548" fill="#cbd5e1" font-size="11">① MIT 协议 + 权重完全开放</text>
    <text x="36" y="568" fill="#cbd5e1" font-size="11">② MoE 架构压低推理 FLOPs</text>
    <text x="36" y="588" fill="#cbd5e1" font-size="11">③ 缓存命中折扣（DeepSeek 命中折扣 98%）</text>
    <text x="36" y="608" fill="#94a3b8" font-size="11">2026-08 DeepSeek 公告：即将整体上调 API 定价</text>
  </g>

  <!-- Arrows: cross-border flows -->
  <g>
    <!-- US -> CN: API cutoff -->
    <line x1="400" y1="180" x2="440" y2="180" stroke="#f87171" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrRed)"/>
    <text x="408" y="170" fill="#fca5a5" font-size="10">OpenAI 2024-07-09 终止对华 API</text>

    <!-- CN -> US: DeepSeek hits OpenRouter -->
    <line x1="880" y1="240" x2="840" y2="240" stroke="#10b981" stroke-width="2" marker-end="url(#arr)"/>
    <text x="772" y="230" fill="#86efac" font-size="10" text-anchor="end">DeepSeek → OpenRouter 周榜第一</text>

    <!-- US reaction: price cut -->
    <line x1="640" y1="420" x2="640" y2="470" stroke="#fbbf24" stroke-width="2" marker-end="url(#arr)"/>
    <text x="650" y="448" fill="#fde68a" font-size="10">OpenAI 2026-07-31 Luna 降价 80%</text>

    <!-- Compute flow -->
    <line x1="180" y1="480" x2="180" y2="430" stroke="#7dd3fc" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="1060" y1="430" x2="1060" y2="480" stroke="#86efac" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="640" y="430" fill="#cbd5e1" font-size="11" text-anchor="middle">出口管制 · H800/H100 限售 · 算力即话语权</text>
  </g>

  <!-- Footer -->
  <text x="40" y="800" fill="#64748b" font-size="11">注：OpenRouter 数据仅反映通过该平台分发的调用，不含厂商直接调用 · 立场：对"被架空"叙事做证伪与边界标注</text>
</svg>