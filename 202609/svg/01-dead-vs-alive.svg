<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 948 420" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
<defs>
<marker id="a1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#9ca3af"/></marker>
<marker id="a2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#0d9488"/></marker>
</defs>
<rect width="920" height="400" fill="#fafbfc" rx="8" stroke="#e5e7eb"/>
<text x="460" y="28" text-anchor="middle" fill="#111827" font-size="17" font-weight="bold">Agent 的两种存在形态</text>
<line x1="460" y1="40" x2="460" y2="388" stroke="#d1d5db" stroke-dasharray="5,4"/>

<!-- 左: 死水模式 -->
<text x="230" y="60" text-anchor="middle" fill="#6b7280" font-size="14" font-weight="bold">死水模式</text>
<text x="230" y="76" text-anchor="middle" fill="#9ca3af" font-size="10">一问一答，用完即走</text>

<rect x="200" y="95" width="60" height="26" fill="#f3f4f6" stroke="#d1d5db" rx="13"/>
<text x="230" y="113" text-anchor="middle" fill="#6b7280" font-size="11">用户</text>
<line x1="230" y1="123" x2="230" y2="160" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a1)"/>
<text x="248" y="146" fill="#9ca3af" font-size="9">提问</text>

<rect x="190" y="165" width="80" height="38" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5" rx="6"/>
<text x="230" y="188" text-anchor="middle" fill="#6b7280" font-size="12" font-weight="bold">Agent</text>

<line x1="230" y1="206" x2="230" y2="243" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a1)"/>
<text x="248" y="229" fill="#9ca3af" font-size="9">回答</text>
<rect x="200" y="248" width="60" height="26" fill="#f3f4f6" stroke="#d1d5db" rx="13"/>
<text x="230" y="266" text-anchor="middle" fill="#6b7280" font-size="11">用户</text>

<text x="230" y="310" text-anchor="middle" fill="#6b7280" font-size="10">等人来问才动</text>
<text x="230" y="332" text-anchor="middle" fill="#ef4444" font-size="11" font-weight="bold">产能上限 = 个人驱动频次</text>
<text x="230" y="354" text-anchor="middle" fill="#9ca3af" font-size="10">知识老化 · 无法自主学习</text>
<text x="230" y="372" text-anchor="middle" fill="#9ca3af" font-size="10">大量算力闲置浪费</text>

<!-- 右: 活水模式 -->
<text x="690" y="60" text-anchor="middle" fill="#0d9488" font-size="14" font-weight="bold">活水模式</text>
<text x="690" y="76" text-anchor="middle" fill="#5eead4" font-size="10">信息流驱动，持续运转</text>

<!-- 输入源 -->
<rect x="505" y="98" width="60" height="22" fill="#ecfdf5" stroke="#10b981" rx="4"/>
<text x="535" y="113" text-anchor="middle" fill="#059669" font-size="9">RSS</text>
<rect x="505" y="130" width="60" height="22" fill="#eff6ff" stroke="#3b82f6" rx="4"/>
<text x="535" y="145" text-anchor="middle" fill="#2563eb" font-size="9">API</text>
<rect x="505" y="162" width="60" height="22" fill="#f5f3ff" stroke="#8b5cf6" rx="4"/>
<text x="535" y="177" text-anchor="middle" fill="#7c3aed" font-size="9">Webhook</text>
<rect x="505" y="194" width="60" height="22" fill="#fffbeb" stroke="#f59e0b" rx="4"/>
<text x="535" y="209" text-anchor="middle" fill="#d97706" font-size="9">事件流</text>
<rect x="505" y="226" width="60" height="22" fill="#fef2f2" stroke="#ef4444" rx="4"/>
<text x="535" y="241" text-anchor="middle" fill="#dc2626" font-size="9">社交媒体</text>

<!-- Agent 节点 -->
<circle cx="690" cy="182" r="36" fill="#f0fdfa" stroke="#0d9488" stroke-width="2.5"/>
<text x="690" y="179" text-anchor="middle" fill="#0d9488" font-size="12" font-weight="bold">Agent</text>
<text x="690" y="193" text-anchor="middle" fill="#14b8a6" font-size="9">流处理节点</text>

<!-- 输出目标 -->
<rect x="808" y="98" width="72" height="22" fill="#ecfdf5" stroke="#10b981" rx="4"/>
<text x="844" y="113" text-anchor="middle" fill="#059669" font-size="9">文章</text>
<rect x="808" y="130" width="72" height="22" fill="#eff6ff" stroke="#3b82f6" rx="4"/>
<text x="844" y="145" text-anchor="middle" fill="#2563eb" font-size="9">分析报告</text>
<rect x="808" y="162" width="72" height="22" fill="#f5f3ff" stroke="#8b5cf6" rx="4"/>
<text x="844" y="177" text-anchor="middle" fill="#7c3aed" font-size="9">预警</text>
<rect x="808" y="194" width="72" height="22" fill="#fffbeb" stroke="#f59e0b" rx="4"/>
<text x="844" y="209" text-anchor="middle" fill="#d97706" font-size="9">决策建议</text>
<rect x="808" y="226" width="72" height="22" fill="#fef2f2" stroke="#ef4444" rx="4"/>
<text x="844" y="241" text-anchor="middle" fill="#dc2626" font-size="9">知识沉淀</text>

<!-- 箭头: 输入 → Agent -->
<line x1="567" y1="109" x2="656" y2="168" stroke="#10b981" stroke-width="1.2" opacity="0.55" marker-end="url(#a2)"/>
<line x1="567" y1="141" x2="656" y2="174" stroke="#3b82f6" stroke-width="1.2" opacity="0.55" marker-end="url(#a2)"/>
<line x1="567" y1="173" x2="656" y2="180" stroke="#8b5cf6" stroke-width="1.2" opacity="0.55" marker-end="url(#a2)"/>
<line x1="567" y1="205" x2="656" y2="188" stroke="#f59e0b" stroke-width="1.2" opacity="0.55" marker-end="url(#a2)"/>
<line x1="567" y1="237" x2="656" y2="198" stroke="#ef4444" stroke-width="1.2" opacity="0.55" marker-end="url(#a2)"/>

<!-- 箭头: Agent → 输出 -->
<line x1="724" y1="168" x2="806" y2="109" stroke="#10b981" stroke-width="1.2" opacity="0.55" marker-end="url(#a2)"/>
<line x1="724" y1="174" x2="806" y2="141" stroke="#3b82f6" stroke-width="1.2" opacity="0.55" marker-end="url(#a2)"/>
<line x1="724" y1="180" x2="806" y2="173" stroke="#8b5cf6" stroke-width="1.2" opacity="0.55" marker-end="url(#a2)"/>
<line x1="724" y1="188" x2="806" y2="205" stroke="#f59e0b" stroke-width="1.2" opacity="0.55" marker-end="url(#a2)"/>
<line x1="724" y1="198" x2="806" y2="237" stroke="#ef4444" stroke-width="1.2" opacity="0.55" marker-end="url(#a2)"/>

<!-- 活水 footer -->
<text x="690" y="310" text-anchor="middle" fill="#0d9488" font-size="10">信息来了自动处理</text>
<text x="690" y="332" text-anchor="middle" fill="#0d9488" font-size="11" font-weight="bold">产能 = 信息流速 × 处理深度</text>
<text x="690" y="354" text-anchor="middle" fill="#5eead4" font-size="10">知识常新 · 自主学习 · 持续产出</text>
<text x="690" y="372" text-anchor="middle" fill="#5eead4" font-size="10">算力被充分利用</text>
</svg>
