<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1729"/>
      <stop offset="100%" stop-color="#1a2542"/>
    </linearGradient>
    <linearGradient id="pmGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="childGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="box" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="540" fill="url(#bg)"/>
  <rect x="20" y="20" width="860" height="500" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <text x="40" y="48" font-size="20" font-weight="700" fill="#f8fafc">PG 进程树: 1 个 Postmaster + 9 类子进程</text>
  <text x="40" y="70" font-size="12" fill="#94a3b8">Postmaster 是总指挥, 它是父进程; 所有 "PG 子进程" 都是它的 fork</text>

  <g transform="translate(350, 100)">
    <rect x="0" y="0" width="200" height="60" rx="10" fill="url(#pmGrad)" stroke="#1e40af" stroke-width="2"/>
    <text x="100" y="28" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">Postmaster</text>
    <text x="100" y="46" font-size="11" fill="#cbd5e1" text-anchor="middle">PID 967 (常驻 10+ 天)</text>
  </g>

  <g transform="translate(40, 200)">
    <rect x="0" y="0" width="160" height="50" rx="8" fill="url(#box)" stroke="url(#childGrad)" stroke-width="1.5"/>
    <text x="80" y="22" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">bgwriter</text>
    <text x="80" y="38" font-size="10" fill="#94a3b8" text-anchor="middle">写脏页</text>
  </g>
  <g transform="translate(220, 200)">
    <rect x="0" y="0" width="160" height="50" rx="8" fill="url(#box)" stroke="url(#childGrad)" stroke-width="1.5"/>
    <text x="80" y="22" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">checkpointer</text>
    <text x="80" y="38" font-size="10" fill="#94a3b8" text-anchor="middle">刷 checkpoint</text>
  </g>
  <g transform="translate(400, 200)">
    <rect x="0" y="0" width="160" height="50" rx="8" fill="url(#box)" stroke="url(#childGrad)" stroke-width="1.5"/>
    <text x="80" y="22" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">walwriter</text>
    <text x="80" y="38" font-size="10" fill="#94a3b8" text-anchor="middle">刷 WAL</text>
  </g>
  <g transform="translate(580, 200)">
    <rect x="0" y="0" width="160" height="50" rx="8" fill="url(#box)" stroke="url(#childGrad)" stroke-width="1.5"/>
    <text x="80" y="22" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">autovacuum</text>
    <text x="80" y="38" font-size="10" fill="#94a3b8" text-anchor="middle">回收垃圾</text>
  </g>
  <g transform="translate(760, 200)">
    <rect x="0" y="0" width="100" height="50" rx="8" fill="url(#box)" stroke="url(#childGrad)" stroke-width="1.5"/>
    <text x="50" y="22" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">pg_cron</text>
    <text x="50" y="38" font-size="10" fill="#94a3b8" text-anchor="middle">定时</text>
  </g>

  <g transform="translate(40, 270)">
    <rect x="0" y="0" width="160" height="50" rx="8" fill="url(#box)" stroke="url(#childGrad)" stroke-width="1.5"/>
    <text x="80" y="22" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">startup</text>
    <text x="80" y="38" font-size="10" fill="#94a3b8" text-anchor="middle">恢复 (一次性)</text>
  </g>
  <g transform="translate(220, 270)">
    <rect x="0" y="0" width="160" height="50" rx="8" fill="url(#box)" stroke="url(#childGrad)" stroke-width="1.5"/>
    <text x="80" y="22" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">syslogger</text>
    <text x="80" y="38" font-size="10" fill="#94a3b8" text-anchor="middle">写日志</text>
  </g>
  <g transform="translate(400, 270)">
    <rect x="0" y="0" width="160" height="50" rx="8" fill="url(#box)" stroke="url(#childGrad)" stroke-width="1.5"/>
    <text x="80" y="22" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">io worker</text>
    <text x="80" y="38" font-size="10" fill="#94a3b8" text-anchor="middle">异步 IO</text>
  </g>
  <g transform="translate(580, 270)">
    <rect x="0" y="0" width="160" height="50" rx="8" fill="url(#box)" stroke="url(#childGrad)" stroke-width="1.5"/>
    <text x="80" y="22" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">walsender</text>
    <text x="80" y="38" font-size="10" fill="#94a3b8" text-anchor="middle">流复制</text>
  </g>
  <g transform="translate(760, 270)">
    <rect x="0" y="0" width="100" height="50" rx="8" fill="url(#box)" stroke="url(#childGrad)" stroke-width="1.5"/>
    <text x="50" y="22" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">backends</text>
    <text x="50" y="38" font-size="10" fill="#94a3b8" text-anchor="middle">客户端连接</text>
  </g>

  <g transform="translate(40, 360)">
    <rect x="0" y="0" width="820" height="130" rx="10" fill="url(#box)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="20" y="24" font-size="13" font-weight="700" fill="#fbbf24">一句话: Postmaster 永不退出, 子进程死了它会拉新的</text>
    <text x="20" y="48" font-size="11" fill="#cbd5e1">→ Postmaster 进程 PID 在整个集群生命周期内不变</text>
    <text x="20" y="66" font-size="11" fill="#cbd5e1">→ 子进程死了 → Postmaster 通过 SIGCHLD 知道 → 重新 fork 一个</text>
    <text x="20" y="84" font-size="11" fill="#cbd5e1">→ 子进程是 SIGKILL (kill -9) 死的 → Postmaster 进入 FatalError 状态</text>
    <text x="20" y="102" font-size="11" fill="#cbd5e1">→ FatalError 路径下, Postmaster 重启整个集群 (重置共享内存 + 重启 startup)</text>
    <text x="20" y="120" font-size="9" fill="#64748b">PostmasterMain → ServerLoop → PostmasterStateMachine → line 3251 重启逻辑</text>
  </g>

  <line x1="450" y1="160" x2="120" y2="200" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="450" y1="160" x2="300" y2="200" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="450" y1="160" x2="480" y2="200" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="450" y1="160" x2="660" y2="200" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="450" y1="160" x2="810" y2="200" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="450" y1="160" x2="120" y2="270" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="450" y1="160" x2="300" y2="270" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="450" y1="160" x2="480" y2="270" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="450" y1="160" x2="660" y2="270" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="450" y1="160" x2="810" y2="270" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>
</svg>