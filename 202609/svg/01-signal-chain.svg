<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1729"/>
      <stop offset="100%" stop-color="#1a2542"/>
    </linearGradient>
    <linearGradient id="box" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="pm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="580" fill="url(#bg)"/>
  <rect x="20" y="20" width="860" height="540" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <text x="40" y="48" font-size="20" font-weight="700" fill="#f8fafc">PG 杀 backend 的完整信号链</text>
  <text x="40" y="70" font-size="12" fill="#94a3b8">从 kill(pid, sig) 到 backend 真正退, 5 个关键节点</text>

  <g transform="translate(40, 105)">
    <rect x="0" y="0" width="820" height="60" rx="8" fill="url(#box)" stroke="url(#pm)" stroke-width="2"/>
    <text x="20" y="22" font-size="13" font-weight="700" fill="#60a5fa">① 发信号者调 pg_signal_backend(pid, sig)</text>
    <text x="20" y="42" font-size="10" fill="#cbd5e1">signalfuncs.c:52 — 权限检查 → BackendPidGetProc 查 shmem → kill(-pid, sig) 发到进程组</text>
    <text x="20" y="56" font-size="9" fill="#64748b">pg_cancel_backend → SIGINT (StatementCancelHandler), pg_terminate_backend → SIGTERM (die)</text>
  </g>

  <g transform="translate(40, 175)">
    <rect x="0" y="0" width="820" height="60" rx="8" fill="url(#box)" stroke="url(#green)" stroke-width="2"/>
    <text x="20" y="22" font-size="13" font-weight="700" fill="#34d399">② 信号 handler 设标志位 + SetLatch, 不立即退</text>
    <text x="20" y="42" font-size="10" fill="#cbd5e1">postgres.c:3113 die() / StatementCancelHandler() → InterruptPending=true, ProcDiePending/QueryCancelPending=true</text>
    <text x="20" y="56" font-size="9" fill="#64748b">关键: 信号 handler 只 set flag, 不做实际清理. SetLatch 唤醒 WaitLatch</text>
  </g>

  <g transform="translate(40, 245)">
    <rect x="0" y="0" width="820" height="60" rx="8" fill="url(#box)" stroke="url(#yellow)" stroke-width="2"/>
    <text x="20" y="22" font-size="13" font-weight="700" fill="#fbbf24">③ 检查点: InterruptHoldoffCount / CritSectionCount / QueryCancelHoldoffCount</text>
    <text x="20" y="42" font-size="10" fill="#cbd5e1">globals.c:43-45 — holdoff 关着 → ProcessInterrupts() 才真的退. holdoff 开 → 推迟, 不退</text>
    <text x="20" y="56" font-size="9" fill="#64748b">这是 PG "杀不掉" 的真正原因 — 不是没收到信号, 是 holdoff 关着</text>
  </g>

  <g transform="translate(40, 315)">
    <rect x="0" y="0" width="820" height="60" rx="8" fill="url(#box)" stroke="url(#green)" stroke-width="2"/>
    <text x="20" y="22" font-size="13" font-weight="700" fill="#34d399">④ ProcessInterrupts → ereport(FATAL)</text>
    <text x="20" y="42" font-size="10" fill="#cbd5e1">postgres.c:3452 — LockErrorCleanup + ereport(FATAL, ...) → PG catch block 触发</text>
    <text x="20" y="56" font-size="9" fill="#64748b">proc_exit_prepare → 释放 shmem → _exit(0)</text>
  </g>

  <g transform="translate(40, 385)">
    <rect x="0" y="0" width="820" height="60" rx="8" fill="url(#box)" stroke="url(#pm)" stroke-width="2"/>
    <text x="20" y="22" font-size="13" font-weight="700" fill="#60a5fa">⑤ Postmaster 收到 SIGCHLD → waitpid → 重新 fork backend</text>
    <text x="20" y="42" font-size="10" fill="#cbd5e1">postmaster.c:2272 — waitpid 返回 → 释放 proc slot → 等客户端重连 → 接受新连接</text>
    <text x="20" y="56" font-size="9" fill="#64748b">客户端 psql 看到 "connection to server was lost" 报错</text>
  </g>

  <g transform="translate(40, 455)">
    <rect x="0" y="0" width="820" height="115" rx="10" fill="url(#box)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="20" y="24" font-size="13" font-weight="700" fill="#fbbf24">★ 关键洞察: PG 的 cancel/terminate 是 "协作式" 不是 "强杀"</text>
    <text x="20" y="46" font-size="11" fill="#cbd5e1">→ kill(-pid, SIGTERM) 只是发信号, 不保证立即退出</text>
    <text x="20" y="62" font-size="11" fill="#cbd5e1">→ 信号 handler 只能 set flag, 不能直接调 proc_exit (会破坏 PG 内部状态)</text>
    <text x="20" y="78" font-size="11" fill="#cbd5e1">→ 真正的退出点在 ProcessInterrupts, 它检查 holdoff/crit section 决定能否退</text>
    <text x="20" y="94" font-size="11" fill="#cbd5e1">→ holdoff 关着 → 等 WaitLatch 醒来 → CHECK_FOR_INTERRUPTS → 真正退</text>
    <text x="20" y="108" font-size="9" fill="#64748b">→ 想 100% 杀掉 backend, 只能 kill -9 (内核直接销毁, 跳过所有 PG 逻辑)</text>
  </g>
</svg>