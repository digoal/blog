<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 580" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
<defs>
<marker id="arrow" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#0d9488"/></marker>
<marker id="arrowB" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#3b82f6"/></marker>
<marker id="arrowP" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#8b5cf6"/></marker>
<marker id="arrowO" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#f59e0b"/></marker>
<linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#f0fdfa"/></linearGradient>
</defs>
<rect width="960" height="560" fill="url(#bgGrad)" rx="10" stroke="#e5e7eb"/>
