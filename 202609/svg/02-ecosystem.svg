<!-- ========== 反馈回路 ========== -->
<path d="M 910 432 Q 940 300 940 170 Q 940 80 870 80 L 870 116" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.5" marker-end="url(#arrow)"/>
<text x="948" y="260" fill="#ef4444" font-size="9" transform="rotate(90,948,260)">反馈回路：输出→采集</text>

<!-- 底部标注 -->
<text x="480" y="495" text-anchor="middle" fill="#111827" font-size="12" font-weight="bold">核心公式：Agent 价值 = Σ(信息流 × 处理深度 × 沉淀率 × 分发广度)</text>
<text x="480" y="516" text-anchor="middle" fill="#6b7280" font-size="10">每一层都可以独立扩展 · Agent 数量可水平伸缩 · 沉淀让系统越用越聪明</text>
<text x="480" y="536" text-anchor="middle" fill="#9ca3af" font-size="9">信息不流动，Agent 就是一潭死水；信息一旦流动，Agent 就是自来水厂</text>
</svg>
