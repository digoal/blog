<text x="770" y="229" text-anchor="middle" fill="#14b8a6" font-size="8">投资决策</text>

<!-- Agent 之间的协同 -->
<line x1="225" y1="220" x2="360" y2="220" stroke="#0d9488" stroke-width="1" stroke-dasharray="4,3" opacity="0.5" marker-end="url(#arrow)"/>
<line x1="420" y1="220" x2="550" y2="220" stroke="#0d9488" stroke-width="1" stroke-dasharray="4,3" opacity="0.5" marker-end="url(#arrow)"/>
<line x1="610" y1="220" x2="740" y2="220" stroke="#0d9488" stroke-width="1" stroke-dasharray="4,3" opacity="0.5" marker-end="url(#arrow)"/>
<text x="480" y="248" text-anchor="middle" fill="#5eead4" font-size="9">← Agent 间协同传递上下文 →</text>

<!-- ========== 连接线: 处理→沉淀 ========== -->
<line x1="195" y1="250" x2="260" y2="308" stroke="#0d9488" stroke-width="1.2" opacity="0.4" marker-end="url(#arrow)"/>
<line x1="390" y1="250" x2="390" y2="308" stroke="#0d9488" stroke-width="1.2" opacity="0.4" marker-end="url(#arrow)"/>
<line x1="580" y1="250" x2="530" y2="308" stroke="#0d9488" stroke-width="1.2" opacity="0.4" marker-end="url(#arrow)"/>
<line x1="770" y1="250" x2="680" y2="308" stroke="#0d9488" stroke-width="1.2" opacity="0.4" marker-end="url(#arrow)"/>

