<text x="195" y="229" text-anchor="middle" fill="#14b8a6" font-size="8">开源追踪</text>

<!-- Agent 2 -->
<circle cx="390" cy="220" r="28" fill="#fff" stroke="#0d9488" stroke-width="2"/>
