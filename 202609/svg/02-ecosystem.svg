<!-- ========== 连接线: 沉淀→输出 ========== -->
<line x1="235" y1="352" x2="185" y2="408" stroke="#3b82f6" stroke-width="1.2" opacity="0.4" marker-end="url(#arrowB)"/>
<line x1="385" y1="352" x2="385" y2="408" stroke="#3b82f6" stroke-width="1.2" opacity="0.4" marker-end="url(#arrowB)"/>
<line x1="535" y1="352" x2="580" y2="408" stroke="#3b82f6" stroke-width="1.2" opacity="0.4" marker-end="url(#arrowB)"/>
<line x1="685" y1="352" x2="770" y2="408" stroke="#3b82f6" stroke-width="1.2" opacity="0.4" marker-end="url(#arrowB)"/>

