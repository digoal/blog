<rect x="660" y="412" width="100" height="40" fill="#fff" stroke="#8b5cf6" rx="6"/>
<text x="710" y="430" text-anchor="middle" fill="#7c3aed" font-size="10" font-weight="bold">预警通知</text>
<text x="710" y="443" text-anchor="middle" fill="#c4b5fd" font-size="8">风险防控</text>

<rect x="800" y="412" width="100" height="40" fill="#fff" stroke="#8b5cf6" rx="6"/>
