<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1729"/>
      <stop offset="100%" stop-color="#1a2542"/>
    </linearGradient>
    <linearGradient id="box" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="580" fill="url(#bg)"/>
  <rect x="20" y="20" width="860" height="540" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <text x="40" y="48" font-size="20" font-weight="700" fill="#f8fafc">3 个全局计数: PG "杀不掉" 的真正原因</text>
  <text x="40" y="70" font-size="12" fill="#94a3b8">globals.c:43-45 — 这 3 个 volatile uint32 决定信号能不能被处理</text>

  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="820" height="115" rx="10" fill="url(#box)" stroke="url(#green)" stroke-width="2"/>
    <text x="20" y="24" font-size="14" font-weight="700" fill="#34d399">InterruptHoldoffCount (uint32)</text>
    <text x="20" y="46" font-size="11" fill="#cbd5e1">· 范围: ProcDiePending (pg_terminate_backend 用的 die() 路径)</text>
    <text x="20" y="64" font-size="11" fill="#cbd5e1">· HOLD_INTERRUPTS() ++, RESUME_INTERRUPTS() --</text>
    <text x="20" y="80" font-size="11" fill="#cbd5e1">· 设了以后, ProcessInterrupts 直接 return, 不处理 ProcDiePending</text>
    <text x="20" y="96" font-size="9" fill="#64748b">典型场景: LWLockAcquire / 复杂 critical section / autovacuum 的某些循环</text>
  </g>

  <g transform="translate(40, 225)">
    <rect x="0" y="0" width="820" height="115" rx="10" fill="url(#box)" stroke="url(#yellow)" stroke-width="2"/>
    <text x="20" y="24" font-size="14" font-weight="700" fill="#fbbf24">CritSectionCount (uint32)</text>
    <text x="20" y="46" font-size="11" fill="#cbd5e1">· 范围: 全局 critical section (palloc 失败会 PANIC, 不能接受 interrupt)</text>
    <text x="20" y="64" font-size="11" fill="#cbd5e1">· PG_TRY / PG_CATCH 自动设 / BEGIN / END CriticalSection</text>
    <text x="20" y="80" font-size="11" fill="#cbd5e1">· 设了以后, ProcessInterrupts 直接 return, 不处理任何 interrupt</text>
    <text x="20" y="96" font-size="9" fill="#64748b">典型场景: memory allocation error / 写 WAL / 持有 spinlock 的代码段</text>
  </g>

  <g transform="translate(40, 350)">
    <rect x="0" y="0" width="820" height="115" rx="10" fill="url(#box)" stroke="url(#yellow)" stroke-width="2"/>
    <text x="20" y="24" font-size="14" font-weight="700" fill="#fbbf24">QueryCancelHoldoffCount (uint32)</text>
    <text x="20" y="46" font-size="11" fill="#cbd5e1">· 范围: 仅 QueryCancelPending (pg_cancel_backend 用的 StatementCancelHandler 路径)</text>
    <text x="20" y="64" font-size="11" fill="#cbd5e1">· 设了以后, cancel 不会被 process, 但保留 InterruptPending=true, 等 holdoff 释放再处理</text>
    <text x="20" y="80" font-size="11" fill="#cbd5e1">· 与 ProcDie 不同: cancel 是 cooperative, die 是强制</text>
    <text x="20" y="96" font-size="9" fill="#64748b">典型场景: DoingCommandRead=true 期间 (postgres.c:3622 "如果正在读 client 命令, 忽略 cancel")</text>
  </g>

  <g transform="translate(40, 475)">
    <rect x="0" y="0" width="820" height="65" rx="10" fill="url(#box)" stroke="url(#red)" stroke-width="2"/>
    <text x="20" y="24" font-size="13" font-weight="700" fill="#f87171">★ 关键代码: ProcessInterrupts 第一行</text>
    <text x="20" y="44" font-size="11" fill="#cbd5e1">postgres.c:3455 → if (InterruptHoldoffCount != 0 || CritSectionCount != 0) return;</text>
    <text x="20" y="58" font-size="9" fill="#64748b">两个条件任一为真 → 立刻 return, 不处理任何 cancel/die → backend "杀不掉"</text>
  </g>
</svg>