<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1729"/>
      <stop offset="100%" stop-color="#1a2542"/>
    </linearGradient>
    <linearGradient id="box" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ok" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="warn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="err" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="560" fill="url(#bg)"/>
  <rect x="20" y="20" width="860" height="520" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <text x="40" y="48" font-size="20" font-weight="700" fill="#f8fafc">三种信号: SIGTERM / SIGINT vs SIGQUIT vs SIGKILL</text>
  <text x="40" y="70" font-size="12" fill="#94a3b8">Postmaster 收到不同信号, 反应天差地别</text>

  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="260" height="180" rx="10" fill="url(#box)" stroke="url(#ok)" stroke-width="2"/>
    <text x="20" y="28" font-size="14" font-weight="700" fill="#34d399">SIGTERM / SIGINT</text>
    <text x="20" y="48" font-size="11" fill="#cbd5e1">来自: pg_ctl stop / Ctrl+C</text>
    <text x="20" y="68" font-size="11" fill="#cbd5e1">子进程收到 → 优雅退出</text>
    <text x="20" y="88" font-size="11" fill="#cbd5e1">· 事务 commit/rollback</text>
    <text x="20" y="104" font-size="11" fill="#cbd5e1">· 释放锁</text>
    <text x="20" y="120" font-size="11" fill="#cbd5e1">· 关闭客户端 socket</text>
    <text x="20" y="144" font-size="11" fill="#34d399" font-weight="700">→ "正常" 死亡</text>
    <text x="20" y="160" font-size="9" fill="#64748b">退出码: 0 (smart) / 1 (fast)</text>
  </g>

  <g transform="translate(320, 100)">
    <rect x="0" y="0" width="260" height="180" rx="10" fill="url(#box)" stroke="url(#warn)" stroke-width="2"/>
    <text x="20" y="28" font-size="14" font-weight="700" fill="#fbbf24">SIGQUIT</text>
    <text x="20" y="48" font-size="11" fill="#cbd5e1">来自: pg_ctl stop -m fast /</text>
    <text x="20" y="64" font-size="11" fill="#cbd5e1">      Postmaster 发给子进程 (crash 路径)</text>
    <text x="20" y="86" font-size="11" fill="#cbd5e1">子进程收到 → quickdie()</text>
    <text x="20" y="102" font-size="11" fill="#cbd5e1">· 不做清理, 直接 _exit(2)</text>
    <text x="20" y="118" font-size="11" fill="#cbd5e1">· 客户端连接直接断</text>
    <text x="20" y="142" font-size="11" fill="#fbbf24" font-weight="700">→ "异常但可控" 死亡</text>
    <text x="20" y="158" font-size="9" fill="#64748b">退出码: 2, Postmaster 视为 crash</text>
  </g>

  <g transform="translate(600, 100)">
    <rect x="0" y="0" width="260" height="180" rx="10" fill="url(#box)" stroke="url(#err)" stroke-width="2"/>
    <text x="20" y="28" font-size="14" font-weight="700" fill="#f87171">SIGKILL (kill -9)</text>
    <text x="20" y="48" font-size="11" fill="#cbd5e1">来自: 管理员 / OOM / 内核</text>
    <text x="20" y="68" font-size="11" fill="#cbd5e1">子进程收到 →</text>
    <text x="20" y="88" font-size="11" fill="#cbd5e1">· 没有任何信号 handler</text>
    <text x="20" y="104" font-size="11" fill="#cbd5e1">· 内核直接销毁进程</text>
    <text x="20" y="120" font-size="11" fill="#cbd5e1">· 共享内存里没清理</text>
    <text x="20" y="142" font-size="11" fill="#f87171" font-weight="700">→ Postmaster 必须全集群重启</text>
    <text x="20" y="158" font-size="9" fill="#64748b">退出码: 由 waitpid 返回, 标 SIGKILL</text>
  </g>

  <g transform="translate(40, 310)">
    <rect x="0" y="0" width="820" height="80" rx="10" fill="url(#box)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="20" y="24" font-size="13" font-weight="700" fill="#fbbf24">关键代码: postmaster.c:2297 HandleChildCrash 判定逻辑</text>
    <text x="20" y="46" font-size="11" fill="#cbd5e1">if (StartupStatus == STARTUP_CRASHED &amp;&amp; FatalError &amp;&amp; Shutdown != ImmediateShutdown)</text>
    <text x="20" y="64" font-size="11" fill="#cbd5e1">    → HandleFatalError(PMQUIT_FOR_CRASH, true);   // 发 SIGQUIT 给所有子进程 + 设 FatalError = true</text>
  </g>

  <g transform="translate(40, 410)">
    <rect x="0" y="0" width="820" height="100" rx="10" fill="url(#box)" stroke="url(#err)" stroke-width="1.5"/>
    <text x="20" y="24" font-size="13" font-weight="700" fill="#f87171">核心问题: 共享内存 (shmem) 谁来清?</text>
    <text x="20" y="46" font-size="11" fill="#cbd5e1">· SIGTERM: 子进程自己清, 释放锁 / proc 槽位 / buffer pin</text>
    <text x="20" y="62" font-size="11" fill="#cbd5e1">· SIGQUIT: 走 quickdie → on_shmem_exit 清理链</text>
    <text x="20" y="78" font-size="11" fill="#f87171">· SIGKILL: 完全不清理 → 共享内存里残留锁 + proc 槽 + WAL 写入状态</text>
    <text x="20" y="94" font-size="9" fill="#64748b">→ Postmaster 必须 shmem_exit(1) + 重新初始化共享内存 (postmaster.c:3263)</text>
  </g>
</svg>