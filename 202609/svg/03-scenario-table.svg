<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1729"/>
      <stop offset="100%" stop-color="#1a2542"/>
    </linearGradient>
    <linearGradient id="box" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="580" fill="url(#bg)"/>
  <rect x="20" y="20" width="860" height="540" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <text x="40" y="48" font-size="20" font-weight="700" fill="#f8fafc">10 种场景: 能不能用 cancel/terminate 杀掉?</text>
  <text x="40" y="70" font-size="12" fill="#94a3b8">实测 + 源码分析. 红=杀不掉, 绿=秒杀, 黄=看情况</text>

  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="820" height="42" rx="6" fill="url(#box)" stroke="url(#green)" stroke-width="1.5"/>
    <text x="20" y="18" font-size="11" font-weight="700" fill="#34d399">idle backend (在等 client 命令)</text>
    <text x="280" y="18" font-size="11" fill="#cbd5e1">→ 0.05s 杀 (实测)</text>
    <text x="20" y="34" font-size="9" fill="#64748b">postgres.c:3622 显式忽略 cancel, 但 die 仍生效 → ereport(FATAL) → exit</text>
  </g>

  <g transform="translate(40, 148)">
    <rect x="0" y="0" width="820" height="42" rx="6" fill="url(#box)" stroke="url(#green)" stroke-width="1.5"/>
    <text x="20" y="18" font-size="11" font-weight="700" fill="#34d399">active backend (跑 pg_sleep / 计算中)</text>
    <text x="280" y="18" font-size="11" fill="#cbd5e1">→ 0.15s 杀 (实测)</text>
    <text x="20" y="34" font-size="9" fill="#64748b">每个查询的"安全检查点"调 CHECK_FOR_INTERRUPTS → 立即退</text>
  </g>

  <g transform="translate(40, 196)">
    <rect x="0" y="0" width="820" height="42" rx="6" fill="url(#box)" stroke="url(#green)" stroke-width="1.5"/>
    <text x="20" y="18" font-size="11" font-weight="700" fill="#34d399">backend 等锁 (ProcSleep + WaitLatch)</text>
    <text x="280" y="18" font-size="11" fill="#cbd5e1">→ 0.15s 杀 (实测)</text>
    <text x="20" y="34" font-size="9" fill="#64748b">proc.c:1474 ProcSleep 的 do-while 循环里 CHECK_FOR_INTERRUPTS → ereport(FATAL)</text>
  </g>

  <g transform="translate(40, 244)">
    <rect x="0" y="0" width="820" height="42" rx="6" fill="url(#box)" stroke="url(#yellow)" stroke-width="1.5"/>
    <text x="20" y="18" font-size="11" font-weight="700" fill="#fbbf24">backend 等 client 命令 (DoingCommandRead=true)</text>
    <text x="280" y="18" font-size="11" fill="#cbd5e1">→ cancel 推迟, die 仍生效</text>
    <text x="20" y="34" font-size="9" fill="#64748b">postgres.c:3622 "If we are reading a command from the client, just ignore the cancel request"</text>
  </g>

  <g transform="translate(40, 292)">
    <rect x="0" y="0" width="820" height="42" rx="6" fill="url(#box)" stroke="url(#yellow)" stroke-width="1.5"/>
    <text x="20" y="18" font-size="11" font-weight="700" fill="#fbbf24">backend 持有 LWLock (LWLockAcquire 路径)</text>
    <text x="280" y="18" font-size="11" fill="#cbd5e1">→ interrupt holdoff, 不响应</text>
    <text x="20" y="34" font-size="9" fill="#64748b">lwlock.c:1149 LWLockAcquire 自动设 InterruptHoldoffCount=1, lwlock.c:1833 LWLockRelease 才 RESUME_INTERRUPTS</text>
  </g>

  <g transform="translate(40, 340)">
    <rect x="0" y="0" width="820" height="42" rx="6" fill="url(#box)" stroke="url(#yellow)" stroke-width="1.5"/>
    <text x="20" y="18" font-size="11" font-weight="700" fill="#fbbf24">backend 跑 long ALTER TABLE / CREATE INDEX / VACUUM</text>
    <text x="280" y="18" font-size="11" fill="#cbd5e1">→ 几秒到几分钟级响应</text>
    <text x="20" y="34" font-size="9" fill="#64748b">这些操作本身持有大量 LWLock / 在 cache 里 → 释放前不响应. 但检查点会跑</text>
  </g>

  <g transform="translate(40, 388)">
    <rect x="0" y="0" width="820" height="42" rx="6" fill="url(#box)" stroke="url(#red)" stroke-width="1.5"/>
    <text x="20" y="18" font-size="11" font-weight="700" fill="#f87171">backend 在 critical section (palloc / WAL write)</text>
    <text x="280" y="18" font-size="11" fill="#cbd5e1">→ 完全不响应</text>
    <text x="20" y="34" font-size="9" fill="#64748b">elog.c CriticalSectionBegin 设 CritSectionCount > 0, 退出会 PANIC</text>
  </g>

  <g transform="translate(40, 436)">
    <rect x="0" y="0" width="820" height="42" rx="6" fill="url(#box)" stroke="url(#red)" stroke-width="1.5"/>
    <text x="20" y="18" font-size="11" font-weight="700" fill="#f87171">backend 在 autovacuum 内部 holdoff 段</text>
    <text x="280" y="18" font-size="11" fill="#cbd5e1">→ 等几秒到几十秒</text>
    <text x="20" y="34" font-size="9" fill="#64748b">autovacuum.c 大量 HOLD_INTERRUPTS/RESUME_INTERRUPTS 配对, 循环周期长</text>
  </g>

  <g transform="translate(40, 484)">
    <rect x="0" y="0" width="820" height="42" rx="6" fill="url(#box)" stroke="url(#red)" stroke-width="1.5"/>
    <text x="20" y="18" font-size="11" font-weight="700" fill="#f87171">backend 在 syscache 失效 / invalidation 处理中</text>
    <text x="280" y="18" font-size="11" fill="#cbd5e1">→ 在 ProcessInvalidationMessages 中不响应</text>
    <text x="20" y="34" font-size="9" fill="#64748b">sinval.c 处理来自其他 backend 的 DDL 通知, 走 holdoff 路径</text>
  </g>

  <g transform="translate(40, 532)">
    <rect x="0" y="0" width="820" height="38" rx="6" fill="url(#box)" stroke="url(#red)" stroke-width="2"/>
    <text x="20" y="18" font-size="11" font-weight="700" fill="#f87171">★ 万能方案: kill -9 (内核直接销毁, 跳过所有 PG 逻辑)</text>
    <text x="280" y="18" font-size="11" fill="#cbd5e1">→ 100% 能杀. 代价: shmem 残留</text>
    <text x="20" y="32" font-size="9" fill="#64748b">→ backend 不做 shmem_exit, Postmaster 收到 SIGKILL 后整库软重启 (见上一篇文章)</text>
  </g>
</svg>