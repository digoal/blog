<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1729"/>
      <stop offset="100%" stop-color="#1a2542"/>
    </linearGradient>
    <linearGradient id="box" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="540" fill="url(#bg)"/>
  <rect x="20" y="20" width="860" height="500" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <text x="40" y="48" font-size="20" font-weight="700" fill="#f8fafc">Postmaster 状态机: 11 个状态 + 4 个 shutdown 等级</text>
  <text x="40" y="70" font-size="12" fill="#94a3b8">PM_INIT → STARTUP → RECOVERY → RUN → ... → NO_CHILDREN → 退出或重启</text>

  <g transform="translate(20, 110)">
    <rect x="0" y="0" width="110" height="46" rx="8" fill="url(#box)" stroke="url(#green)" stroke-width="1.5"/>
    <text x="55" y="22" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">PM_INIT</text>
    <text x="55" y="36" font-size="9" fill="#94a3b8" text-anchor="middle">启动</text>
  </g>
  <g transform="translate(140, 110)">
    <rect x="0" y="0" width="110" height="46" rx="8" fill="url(#box)" stroke="url(#green)" stroke-width="1.5"/>
    <text x="55" y="22" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">PM_STARTUP</text>
    <text x="55" y="36" font-size="9" fill="#94a3b8" text-anchor="middle">恢复中</text>
  </g>
  <g transform="translate(260, 110)">
    <rect x="0" y="0" width="110" height="46" rx="8" fill="url(#box)" stroke="url(#green)" stroke-width="1.5"/>
    <text x="55" y="22" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">PM_RECOVERY</text>
    <text x="55" y="36" font-size="9" fill="#94a3b8" text-anchor="middle">WAL redo</text>
  </g>
  <g transform="translate(380, 110)">
    <rect x="0" y="0" width="110" height="46" rx="8" fill="url(#box)" stroke="url(#green)" stroke-width="2"/>
    <text x="55" y="22" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">PM_RUN</text>
    <text x="55" y="36" font-size="9" fill="#94a3b8" text-anchor="middle">正常</text>
  </g>
  <g transform="translate(500, 110)">
    <rect x="0" y="0" width="120" height="46" rx="8" fill="url(#box)" stroke="url(#green)" stroke-width="1.5"/>
    <text x="60" y="22" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">PM_STOP_BACKENDS</text>
    <text x="60" y="36" font-size="9" fill="#94a3b8" text-anchor="middle">关连接</text>
  </g>
  <g transform="translate(630, 110)">
    <rect x="0" y="0" width="120" height="46" rx="8" fill="url(#box)" stroke="url(#green)" stroke-width="1.5"/>
    <text x="60" y="22" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">PM_WAIT_BACKENDS</text>
    <text x="60" y="36" font-size="9" fill="#94a3b8" text-anchor="middle">等退</text>
  </g>
  <g transform="translate(760, 110)">
    <rect x="0" y="0" width="100" height="46" rx="8" fill="url(#box)" stroke="url(#green)" stroke-width="1.5"/>
    <text x="50" y="22" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">PM_WAIT_XLOG</text>
  </g>

  <g transform="translate(20, 170)">
    <rect x="0" y="0" width="140" height="46" rx="8" fill="url(#box)" stroke="url(#red)" stroke-width="2"/>
    <text x="70" y="22" font-size="11" font-weight="700" fill="#f87171" text-anchor="middle">PM_NO_CHILDREN</text>
    <text x="70" y="36" font-size="9" fill="#94a3b8" text-anchor="middle">所有子进程都没了</text>
  </g>

  <g transform="translate(180, 170)">
    <rect x="0" y="0" width="160" height="46" rx="8" fill="url(#box)" stroke="url(#green)" stroke-width="1.5"/>
    <text x="80" y="22" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">PM_HOT_STANDBY</text>
    <text x="80" y="36" font-size="9" fill="#94a3b8" text-anchor="middle">热备</text>
  </g>
  <g transform="translate(360, 170)">
    <rect x="0" y="0" width="160" height="46" rx="8" fill="url(#box)" stroke="url(#green)" stroke-width="1.5"/>
    <text x="80" y="22" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">PM_WAIT_DEAD_END</text>
  </g>
  <g transform="translate(540, 170)">
    <rect x="0" y="0" width="160" height="46" rx="8" fill="url(#box)" stroke="url(#green)" stroke-width="1.5"/>
    <text x="80" y="22" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">PM_WAIT_CHECKPOINTER</text>
  </g>

  <g transform="translate(40, 250)">
    <rect x="0" y="0" width="820" height="80" rx="10" fill="url(#box)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="20" y="24" font-size="13" font-weight="700" fill="#fbbf24">Shutdown 等级 (4 个, 数字越大越暴力)</text>
    <text x="20" y="46" font-size="11" fill="#cbd5e1">NoShutdown (0) → SmartShutdown (1) SIGTERM 给 client → FastShutdown (2) SIGTERM 给所有</text>
    <text x="20" y="64" font-size="11" fill="#cbd5e1">→ ImmediateShutdown (3) SIGQUIT 给所有 (绕过任何清理)</text>
  </g>

  <g transform="translate(40, 350)">
    <rect x="0" y="0" width="820" height="80" rx="10" fill="url(#box)" stroke="url(#red)" stroke-width="2"/>
    <text x="20" y="24" font-size="13" font-weight="700" fill="#f87171">"kill -9 PG 子进程" 走的路径</text>
    <text x="20" y="46" font-size="11" fill="#cbd5e1">Postmaster 通过 SIGCHLD 收到 waitpid → 退出码非 0 → HandleChildCrash()</text>
    <text x="20" y="64" font-size="11" fill="#f87171">→ HandleFatalError(PMQUIT_FOR_CRASH, true) → FatalError=true → TerminateChildren(SIGQUIT) 所有</text>
  </g>

  <g transform="translate(40, 450)">
    <rect x="0" y="0" width="820" height="60" rx="10" fill="url(#box)" stroke="url(#green)" stroke-width="2"/>
    <text x="20" y="24" font-size="13" font-weight="700" fill="#34d399">关键判定: PostmasterStateMachine line 3251</text>
    <text x="20" y="46" font-size="11" fill="#cbd5e1">if (FatalError &amp;&amp; pmState == PM_NO_CHILDREN) → "all server processes terminated; reinitializing"</text>
  </g>

  <line x1="130" y1="133" x2="195" y2="133" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="250" y1="133" x2="315" y2="133" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="370" y1="133" x2="435" y2="133" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="490" y1="133" x2="555" y2="133" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="620" y1="133" x2="685" y2="133" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="750" y1="133" x2="810" y2="133" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>
</svg>