<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1729"/>
      <stop offset="100%" stop-color="#1a2542"/>
    </linearGradient>
    <linearGradient id="box" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="540" fill="url(#bg)"/>
  <rect x="20" y="20" width="860" height="500" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <text x="40" y="48" font-size="20" font-weight="700" fill="#f8fafc">实测: 杀一个等锁 backend</text>
  <text x="40" y="70" font-size="12" fill="#94a3b8">本机 chuanxu_poc 实例, 2026-09-21 22:56</text>

  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="820" height="60" rx="8" fill="url(#box)" stroke="url(#green)" stroke-width="1.5"/>
    <text x="20" y="22" font-size="12" font-weight="700" fill="#34d399">场景</text>
    <text x="20" y="42" font-size="11" fill="#cbd5e1">A backend: BEGIN; UPDATE tt; SELECT pg_sleep(60); COMMIT; (持锁 60s)</text>
    <text x="20" y="54" font-size="11" fill="#cbd5e1">B backend: UPDATE tt (等 A 的事务提交, wait_event=Lock transactionid)</text>
  </g>

  <g transform="translate(40, 170)">
    <rect x="0" y="0" width="820" height="50" rx="8" fill="url(#box)" stroke="url(#pm)" stroke-width="2"/>
    <text x="20" y="22" font-size="12" font-weight="700" fill="#60a5fa">杀前 pg_stat_activity</text>
    <text x="20" y="42" font-size="10" fill="#cbd5e1">pid=2179745 state=active wait_event_type=Lock wait_event=transactionid query="UPDATE tt SET id = id + 1 WHERE id &lt;= 50"</text>
  </g>

  <g transform="translate(40, 230)">
    <rect x="0" y="0" width="820" height="50" rx="8" fill="url(#box)" stroke="url(#green)" stroke-width="2"/>
    <text x="20" y="22" font-size="12" font-weight="700" fill="#34d399">执行 pg_terminate_backend(2179745, 5000)</text>
    <text x="20" y="42" font-size="10" fill="#cbd5e1">22:56:57.989 → 22:56:58.144 = 0.155 秒. 返回 true.</text>
  </g>

  <g transform="translate(40, 290)">
    <rect x="0" y="0" width="820" height="50" rx="8" fill="url(#box)" stroke="url(#red)" stroke-width="2"/>
    <text x="20" y="22" font-size="12" font-weight="700" fill="#f87171">B 后端 psql 立即看到 FATAL</text>
    <text x="20" y="42" font-size="10" fill="#cbd5e1">FATAL: terminating connection due to administrator command. CONTEXT: while updating tuple (0,1) in relation "tt"</text>
  </g>

  <g transform="translate(40, 350)">
    <rect x="0" y="0" width="820" height="50" rx="8" fill="url(#box)" stroke="url(#green)" stroke-width="2"/>
    <text x="20" y="22" font-size="12" font-weight="700" fill="#34d399">B 后端 psql 进程已退出</text>
    <text x="20" y="42" font-size="10" fill="#cbd5e1">ps -p 2179745 返回空. PG 释放 proc slot + 锁资源.</text>
  </g>

  <g transform="translate(40, 410)">
    <rect x="0" y="0" width="820" height="100" rx="10" fill="url(#box)" stroke="#fbbf24" stroke-width="2"/>
    <text x="20" y="24" font-size="13" font-weight="700" fill="#fbbf24">结论</text>
    <text x="20" y="46" font-size="11" fill="#cbd5e1">→ 等锁 backend 的 pg_terminate_backend: 0.15s 即响应</text>
    <text x="20" y="62" font-size="11" fill="#cbd5e1">→ 原因: ProcSleep 的 do-while 循环里有 CHECK_FOR_INTERRUPTS, 每次醒来就检查</text>
    <text x="20" y="78" font-size="11" fill="#cbd5e1">→ 这与 "DBA 群说杀不掉" 的经验不符 — 杀不掉另有原因</text>
    <text x="20" y="92" font-size="9" fill="#64748b">实测只能验证 ProcSleep 路径. LWLock/crit section 路径需要看源码</text>
  </g>
</svg>