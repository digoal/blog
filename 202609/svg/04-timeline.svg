<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1729"/>
      <stop offset="100%" stop-color="#1a2542"/>
    </linearGradient>
    <linearGradient id="box" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <linearGradient id="pm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="580" fill="url(#bg)"/>
  <rect x="20" y="20" width="860" height="540" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <text x="40" y="48" font-size="20" font-weight="700" fill="#f8fafc">两条路径对比: pg_terminate_backend vs kill -9</text>
  <text x="40" y="70" font-size="12" fill="#94a3b8">本机实测 (chuanxu_poc), 2026-09-21 23:09-23:10</text>

  <g transform="translate(40, 95)">
    <rect x="0" y="0" width="390" height="62" rx="8" fill="url(#box)" stroke="url(#green)" stroke-width="2"/>
    <text x="20" y="22" font-size="13" font-weight="700" fill="#34d399">路径 A: pg_terminate_backend (干净)</text>
    <text x="20" y="42" font-size="10" fill="#cbd5e1">SIGTERM → backend 调 die() → SetLatch</text>
    <text x="20" y="56" font-size="10" fill="#cbd5e1">→ ProcessInterrupts → ereport(FATAL)</text>
  </g>

  <g transform="translate(470, 95)">
    <rect x="0" y="0" width="390" height="62" rx="8" fill="url(#box)" stroke="url(#red)" stroke-width="2"/>
    <text x="20" y="22" font-size="13" font-weight="700" fill="#f87171">路径 B: kill -9 backend (暴力)</text>
    <text x="20" y="42" font-size="10" fill="#cbd5e1">内核直接销毁, 不通知 backend</text>
    <text x="20" y="56" font-size="10" fill="#f87171">→ waitpid 返回非 0 非 1 → crashed=true</text>
  </g>

  <g transform="translate(40, 167)">
    <rect x="0" y="0" width="390" height="50" rx="8" fill="url(#box)" stroke="url(#green)" stroke-width="1.5"/>
    <text x="20" y="22" font-size="11" font-weight="700" fill="#34d399">A 测: backend 2184351 长查询</text>
    <text x="20" y="42" font-size="10" fill="#cbd5e1">23:09:31.749 → 23:09:31.904 = 0.155s</text>
  </g>

  <g transform="translate(470, 167)">
    <rect x="0" y="0" width="390" height="50" rx="8" fill="url(#box)" stroke="url(#red)" stroke-width="1.5"/>
    <text x="20" y="22" font-size="11" font-weight="700" fill="#f87171">B 测: backend 2184818 长查询</text>
    <text x="20" y="42" font-size="10" fill="#f87171">23:10:43.896 → 23:10:43.897 = 0.001s (内核)</text>
  </g>

  <g transform="translate(40, 227)">
    <rect x="0" y="0" width="390" height="78" rx="8" fill="url(#box)" stroke="url(#green)" stroke-width="1.5"/>
    <text x="20" y="20" font-size="11" font-weight="700" fill="#34d399">A 结果: 只这个 backend 退</text>
    <text x="20" y="36" font-size="10" fill="#cbd5e1">log: [2184351] FATAL: terminating connection due to administrator command</text>
    <text x="20" y="50" font-size="10" fill="#cbd5e1">log: [2184351] STATEMENT: SELECT pg_sleep(180);</text>
    <text x="20" y="64" font-size="9" fill="#34d399">→ 其他 backend 还在, Postmaster uptime 继续累加</text>
  </g>

  <g transform="translate(470, 227)">
    <rect x="0" y="0" width="390" height="78" rx="8" fill="url(#box)" stroke="url(#red)" stroke-width="1.5"/>
    <text x="20" y="20" font-size="11" font-weight="700" fill="#f87171">B 结果: 整库软重启, 所有 backend 全死</text>
    <text x="20" y="36" font-size="10" fill="#f87171">log: client backend (PID 2184818) was terminated by signal 9</text>
    <text x="20" y="50" font-size="10" fill="#f87171">log: terminating any other active server processes</text>
    <text x="20" y="64" font-size="10" fill="#f87171">log: all server processes terminated; reinitializing</text>
  </g>

  <g transform="translate(40, 315)">
    <rect x="0" y="0" width="390" height="60" rx="8" fill="url(#box)" stroke="url(#green)" stroke-width="1.5"/>
    <text x="20" y="22" font-size="11" font-weight="700" fill="#34d399">A: postmaster.c:2634 判定</text>
    <text x="20" y="42" font-size="10" fill="#cbd5e1">if (!EXIT_STATUS_0 &amp;&amp; !EXIT_STATUS_1) crashed=true</text>
    <text x="20" y="56" font-size="9" fill="#34d399">→ 0 (干净退) → crashed=false → 不重启</text>
  </g>

  <g transform="translate(470, 315)">
    <rect x="0" y="0" width="390" height="60" rx="8" fill="url(#box)" stroke="url(#red)" stroke-width="1.5"/>
    <text x="20" y="22" font-size="11" font-weight="700" fill="#f87171">B: postmaster.c:2634 判定</text>
    <text x="20" y="42" font-size="10" fill="#f87171">if (!EXIT_STATUS_0 &amp;&amp; !EXIT_STATUS_1) crashed=true</text>
    <text x="20" y="56" font-size="9" fill="#f87171">→ 137 (SIGKILL=9) → crashed=true → 重启</text>
  </g>

  <g transform="translate(40, 385)">
    <rect x="0" y="0" width="390" height="60" rx="8" fill="url(#box)" stroke="url(#pm)" stroke-width="1.5"/>
    <text x="20" y="22" font-size="11" font-weight="700" fill="#60a5fa">A: HandleChildCrash 不触发</text>
    <text x="20" y="42" font-size="10" fill="#cbd5e1">→ ReleasePostmasterChildSlot 成功</text>
    <text x="20" y="56" font-size="9" fill="#94a3b8">→ 其他 backend 正常, 端口继续可用</text>
  </g>

  <g transform="translate(470, 385)">
    <rect x="0" y="0" width="390" height="60" rx="8" fill="url(#box)" stroke="url(#pm)" stroke-width="1.5"/>
    <text x="20" y="22" font-size="11" font-weight="700" fill="#60a5fa">B: HandleChildCrash 触发</text>
    <text x="20" y="42" font-size="10" fill="#f87171">→ TerminateChildren(SIGQUIT) 发给所有</text>
    <text x="20" y="56" font-size="9" fill="#94a3b8">→ 5 秒后升级 SIGKILL → 重启</text>
  </g>

  <g transform="translate(40, 455)">
    <rect x="0" y="0" width="820" height="115" rx="10" fill="url(#box)" stroke="#fbbf24" stroke-width="2"/>
    <text x="20" y="24" font-size="13" font-weight="700" fill="#fbbf24">★ 关键修正 (针对上一版)</text>
    <text x="20" y="46" font-size="11" fill="#cbd5e1">→ 上一版我说 "kill -9 普通 backend 不重启" 是错的</text>
    <text x="20" y="62" font-size="11" fill="#cbd5e1">→ 实测证明: kill -9 任何非 Postmaster 子进程都触发整库软重启</text>
    <text x="20" y="78" font-size="11" fill="#cbd5e1">→ 因为 waitpid 返回的非 0 非 1 退出码 → crashed=true → HandleChildCrash</text>
    <text x="20" y="94" font-size="11" fill="#cbd5e1">→ 唯一例外: kill -9 Postmaster 自身 (Postmaster 死了谁来判 crashed?)</text>
    <text x="20" y="108" font-size="9" fill="#64748b">→ startup process 例外: Postmaster 拒绝重启, 直接 ExitPostmaster(1)</text>
  </g>
</svg>