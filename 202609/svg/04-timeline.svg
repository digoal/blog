<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1729"/>
      <stop offset="100%" stop-color="#1a2542"/>
    </linearGradient>
    <linearGradient id="box" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="pm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="580" fill="url(#bg)"/>
  <rect x="20" y="20" width="860" height="540" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <text x="40" y="48" font-size="20" font-weight="700" fill="#f8fafc">完整流程: kill -9 bgwriter 之后, 10 秒内发生了什么</text>
  <text x="40" y="70" font-size="12" fill="#94a3b8">本机实测 (chuanxu_poc), 时间精确到毫秒</text>

  <g transform="translate(40, 105)">
    <rect x="0" y="0" width="820" height="50" rx="8" fill="url(#box)" stroke="#94a3b8" stroke-width="1"/>
    <text x="20" y="22" font-size="12" font-weight="700" fill="#94a3b8">T+0.000s</text>
    <text x="120" y="22" font-size="11" font-weight="700" fill="#cbd5e1">你执行 kill -9 2137165 (bgwriter PID)</text>
    <text x="20" y="42" font-size="10" fill="#64748b">内核立刻销毁 bgwriter, 不通知任何信号 handler</text>
  </g>

  <g transform="translate(40, 165)">
    <rect x="0" y="0" width="820" height="62" rx="8" fill="url(#box)" stroke="url(#red)" stroke-width="1.5"/>
    <text x="20" y="22" font-size="12" font-weight="700" fill="#f87171">T+0.020s</text>
    <text x="120" y="22" font-size="11" font-weight="700" fill="#f87171">Postmaster 收到 SIGCHLD</text>
    <text x="20" y="42" font-size="10" fill="#cbd5e1">Postmaster SIGCHLD handler 跑 → waitpid() 收到 bgwriter 退出码</text>
    <text x="20" y="56" font-size="10" fill="#64748b">退出码: WIFSIGNALED + WTERMSIG=SIGKILL → Postmaster 知道是异常死亡</text>
  </g>

  <g transform="translate(40, 237)">
    <rect x="0" y="0" width="820" height="62" rx="8" fill="url(#box)" stroke="url(#red)" stroke-width="1.5"/>
    <text x="20" y="22" font-size="12" font-weight="700" fill="#f87171">T+0.022s</text>
    <text x="120" y="22" font-size="11" font-weight="700" fill="#f87171">HandleChildCrash() 触发</text>
    <text x="20" y="42" font-size="10" fill="#cbd5e1">FatalError = false ? → 是 → 继续</text>
    <text x="20" y="56" font-size="10" fill="#64748b">→ HandleFatalError(PMQUIT_FOR_CRASH, true) → TerminateChildren(SIGQUIT)</text>
  </g>

  <g transform="translate(40, 309)">
    <rect x="0" y="0" width="820" height="68" rx="8" fill="url(#box)" stroke="url(#yellow)" stroke-width="1.5"/>
    <text x="20" y="22" font-size="12" font-weight="700" fill="#fbbf24">T+0.025s</text>
    <text x="120" y="22" font-size="11" font-weight="700" fill="#fbbf24">所有其他子进程收到 SIGQUIT</text>
    <text x="20" y="42" font-size="10" fill="#cbd5e1">→ quickdie() → _exit(2), 立即退出</text>
    <text x="20" y="56" font-size="10" fill="#64748b">Postmaster 持 5 秒 timeout (SIGKILL_CHILDREN_AFTER_SECS=5), 5 秒后升级 SIGKILL</text>
    <text x="20" y="64" font-size="10" fill="#64748b">本例 0.5 秒内所有子进程退出</text>
  </g>

  <g transform="translate(40, 387)">
    <rect x="0" y="0" width="820" height="56" rx="8" fill="url(#box)" stroke="url(#pm)" stroke-width="1.5"/>
    <text x="20" y="22" font-size="12" font-weight="700" fill="#60a5fa">T+0.520s</text>
    <text x="120" y="22" font-size="11" font-weight="700" fill="#60a5fa">Postmaster 看到 pmState == PM_NO_CHILDREN</text>
    <text x="20" y="42" font-size="10" fill="#cbd5e1">→ PostmasterStateMachine line 3251 命中</text>
    <text x="20" y="52" font-size="10" fill="#64748b">if (FatalError &amp;&amp;&amp; pmState == PM_NO_CHILDREN) → reinitializing</text>
  </g>

  <g transform="translate(40, 453)">
    <rect x="0" y="0" width="820" height="60" rx="8" fill="url(#box)" stroke="url(#pm)" stroke-width="1.5"/>
    <text x="20" y="22" font-size="12" font-weight="700" fill="#60a5fa">T+0.540s</text>
    <text x="120" y="22" font-size="11" font-weight="700" fill="#60a5fa">共享内存重置</text>
    <text x="20" y="42" font-size="10" fill="#cbd5e1">shmem_exit(1) → ResetShmemAllocator → CreateSharedMemoryAndSemaphores</text>
    <text x="20" y="56" font-size="10" fill="#64748b">Postmaster PID 不变 (2137160), 所有子进程全换 → UpdatePMState(PM_STARTUP)</text>
  </g>

  <g transform="translate(40, 523)">
    <rect x="0" y="0" width="820" height="36" rx="8" fill="url(#box)" stroke="#34d399" stroke-width="2"/>
    <text x="20" y="22" font-size="11" font-weight="700" fill="#34d399">T+1.000s · startup redo 完成 → "ready to accept connections"</text>
    <text x="510" y="22" font-size="11" fill="#cbd5e1">所有子进程全 fork 完</text>
  </g>
</svg>