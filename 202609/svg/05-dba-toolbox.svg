<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1729"/>
      <stop offset="100%" stop-color="#1a2542"/>
    </linearGradient>
    <linearGradient id="box" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="540" fill="url(#bg)"/>
  <rect x="20" y="20" width="860" height="500" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <text x="40" y="48" font-size="20" font-weight="700" fill="#f8fafc">DBA 实战清单: 杀 backend 的 5 把刀</text>
  <text x="40" y="70" font-size="12" fill="#94a3b8">从轻到重, 从慢到快, 从安全到暴力</text>

  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="820" height="65" rx="10" fill="url(#box)" stroke="url(#green)" stroke-width="1.5"/>
    <text x="20" y="22" font-size="13" font-weight="700" fill="#34d399">1. pg_cancel_backend(pid)</text>
    <text x="20" y="42" font-size="11" fill="#cbd5e1">→ 发 SIGINT. 取消当前查询, backend 不退, 继续等下一个查询</text>
    <text x="20" y="56" font-size="9" fill="#64748b">最温和. 适用: 长查询想中断但保留连接 (如 pg_dump)</text>
  </g>

  <g transform="translate(40, 175)">
    <rect x="0" y="0" width="820" height="65" rx="10" fill="url(#box)" stroke="url(#green)" stroke-width="1.5"/>
    <text x="20" y="22" font-size="13" font-weight="700" fill="#34d399">2. pg_terminate_backend(pid, timeout_ms)</text>
    <text x="20" y="42" font-size="11" fill="#cbd5e1">→ 发 SIGTERM. 关连接, 退 backend. timeout 内等死</text>
    <text x="20" y="56" font-size="9" fill="#64748b">最常用. 实测 0.15s 杀 active / 等锁 backend. 不会触发整库软重启</text>
  </g>

  <g transform="translate(40, 250)">
    <rect x="0" y="0" width="820" height="65" rx="10" fill="url(#box)" stroke="url(#yellow)" stroke-width="1.5"/>
    <text x="20" y="22" font-size="13" font-weight="700" fill="#fbbf24">3. kill -SIGTERM backend_pid (Linux shell)</text>
    <text x="20" y="42" font-size="11" fill="#cbd5e1">→ 同 pg_terminate_backend 路径 (发 SIGTERM), 但权限检查在 shell</text>
    <text x="20" y="56" font-size="9" fill="#64748b">PG 信任 caller 来自哪个权限域. 仍走 die() → ProcessInterrupts → ereport(FATAL)</text>
  </g>

  <g transform="translate(40, 325)">
    <rect x="0" y="0" width="820" height="65" rx="10" fill="url(#box)" stroke="url(#yellow)" stroke-width="1.5"/>
    <text x="20" y="22" font-size="13" font-weight="700" fill="#fbbf24">4. kill -SIGINT backend_pid (中断但不退)</text>
    <text x="20" y="42" font-size="11" fill="#cbd5e1">→ 同 pg_cancel_backend 路径. QueryCancelPending=true</text>
    <text x="20" y="56" font-size="9" fill="#64748b">注意: 如果 backend 正在 DoingCommandRead=true 期间, cancel 会被推迟</text>
  </g>

  <g transform="translate(40, 400)">
    <rect x="0" y="0" width="820" height="100" rx="10" fill="url(#box)" stroke="url(#red)" stroke-width="2"/>
    <text x="20" y="24" font-size="13" font-weight="700" fill="#f87171">5. kill -9 backend_pid (最后手段)</text>
    <text x="20" y="46" font-size="11" fill="#cbd5e1">→ 内核直接销毁进程. 100% 能杀</text>
    <text x="20" y="62" font-size="11" fill="#cbd5e1">→ 代价: backend 不做 shmem_exit, Postmaster 检测到 SIGKILL → FatalError → 整库软重启</text>
    <text x="20" y="78" font-size="11" fill="#cbd5e1">→ 适用: 上面 4 把刀都不响应 + 业务能接受几秒停机 + 你知道后台进程会自己起来</text>
    <text x="20" y="92" font-size="9" fill="#64748b">★ 误杀 Postmaster 会让整库彻底死 — 千万 ps -ef | grep postmaster 看清楚再 kill</text>
  </g>
</svg>