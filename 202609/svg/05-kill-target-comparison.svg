<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1729"/>
      <stop offset="100%" stop-color="#1a2542"/>
    </linearGradient>
    <linearGradient id="box" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="540" fill="url(#bg)"/>
  <rect x="20" y="20" width="860" height="500" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <text x="40" y="48" font-size="20" font-weight="700" fill="#f8fafc">修订: kill -9 各种子进程: 后果对照表</text>
  <text x="40" y="70" font-size="12" fill="#94a3b8">实测验证: kill -9 任何子进程 (包括普通 backend) 都触发整库软重启</text>

  <g transform="translate(40, 105)">
    <rect x="0" y="0" width="820" height="46" rx="8" fill="url(#box)" stroke="url(#green)" stroke-width="2"/>
    <text x="20" y="18" font-size="11" font-weight="700" fill="#34d399">pg_terminate_backend (SIGTERM)</text>
    <text x="240" y="18" font-size="11" fill="#cbd5e1">→ 单个 backend 退, 不触发整库重启</text>
    <text x="20" y="36" font-size="10" fill="#64748b">backend 调 proc_exit → exit code 0 → postmaster.c:2634 判定 crashed=false → 不进 HandleChildCrash</text>
  </g>

  <g transform="translate(40, 161)">
    <rect x="0" y="0" width="820" height="46" rx="8" fill="url(#box)" stroke="url(#green)" stroke-width="2"/>
    <text x="20" y="18" font-size="11" font-weight="700" fill="#34d399">pg_cancel_backend (SIGINT)</text>
    <text x="240" y="18" font-size="11" fill="#cbd5e1">→ 只取消当前查询, backend 继续</text>
    <text x="20" y="36" font-size="10" fill="#64748b">走 StatementCancelHandler → QueryCancelPending=true → 取消当前 query → backend 等下一个</text>
  </g>

  <g transform="translate(40, 217)">
    <rect x="0" y="0" width="820" height="60" rx="8" fill="url(#box)" stroke="url(#red)" stroke-width="2"/>
    <text x="20" y="18" font-size="11" font-weight="700" fill="#f87171">kill -9 bgwriter / checkpointer / walwriter</text>
    <text x="280" y="18" font-size="11" fill="#f87171">→ 整库软重启</text>
    <text x="20" y="36" font-size="10" fill="#cbd5e1">信号 9 → waitpid 返回非 0 非 1 → postmaster.c:2634 crashed=true → HandleChildCrash</text>
    <text x="20" y="54" font-size="9" fill="#64748b">log: "all server processes terminated; reinitializing" + 整库 redo</text>
  </g>

  <g transform="translate(40, 287)">
    <rect x="0" y="0" width="820" height="60" rx="8" fill="url(#box)" stroke="url(#red)" stroke-width="2"/>
    <text x="20" y="18" font-size="11" font-weight="700" fill="#f87171">kill -9 一个普通 backend (客户端连接)</text>
    <text x="280" y="18" font-size="11" fill="#f87171">→ 整库软重启 (⚠ 顺带杀所有 backend)</text>
    <text x="20" y="36" font-size="10" fill="#cbd5e1">同样信号 9 → postmaster.c:2634 crashed=true → HandleChildCrash</text>
    <text x="20" y="54" font-size="9" fill="#f87171">实测: 同时跑 3 个长查询, kill -9 一个 → log 显示 "terminating any other active server processes" → 3 个全死</text>
  </g>

  <g transform="translate(40, 357)">
    <rect x="0" y="0" width="820" height="46" rx="8" fill="url(#box)" stroke="url(#red)" stroke-width="2"/>
    <text x="20" y="18" font-size="11" font-weight="700" fill="#f87171">kill -9 startup process</text>
    <text x="240" y="18" font-size="11" fill="#f87171">→ Postmaster 拒绝重启, 直接退出</text>
    <text x="20" y="36" font-size="10" fill="#64748b">postmaster.c:3233 STARTUP_CRASHED → "shutting down due to startup process failure" → ExitPostmaster(1)</text>
  </g>

  <g transform="translate(40, 413)">
    <rect x="0" y="0" width="820" height="60" rx="8" fill="url(#box)" stroke="url(#red)" stroke-width="2"/>
    <text x="20" y="18" font-size="11" font-weight="700" fill="#f87171">kill -9 Postmaster 自身</text>
    <text x="240" y="18" font-size="11" fill="#f87171">→ 整库彻底死, PG 无任何反应</text>
    <text x="20" y="36" font-size="10" fill="#cbd5e1">Postmaster 死 → 端口不可用 → 谁也救不了 → 只能 systemd / pg_ctl / K8s 拉起 (这才是 "整库重启" 的本义)</text>
    <text x="20" y="54" font-size="9" fill="#64748b">⚠ 千万 ps -ef | grep postmaster 看清楚再 kill</text>
  </g>

  <g transform="translate(40, 483)">
    <rect x="0" y="0" width="820" height="40" rx="8" fill="url(#box)" stroke="#fbbf24" stroke-width="2"/>
    <text x="20" y="18" font-size="11" font-weight="700" fill="#fbbf24">核心源码: postmaster.c:2634</text>
    <text x="20" y="32" font-size="10" fill="#cbd5e1">if (!EXIT_STATUS_0(exitstatus) &amp;&amp; !EXIT_STATUS_1(exitstatus)) crashed = true;  // SIGKILL 退出码非 0 非 1 → 触发整库重启</text>
  </g>
</svg>