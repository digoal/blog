<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1729"/>
      <stop offset="100%" stop-color="#1a2542"/>
    </linearGradient>
    <linearGradient id="box" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="540" fill="url(#bg)"/>
  <rect x="20" y="20" width="860" height="500" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <text x="40" y="48" font-size="20" font-weight="700" fill="#f8fafc">kill -9 各种子进程: 后果对照表</text>
  <text x="40" y="70" font-size="12" fill="#94a3b8">同样是 kill -9, 杀哪个子进程, 影响天差地别</text>

  <g transform="translate(40, 105)">
    <rect x="0" y="0" width="820" height="46" rx="8" fill="url(#box)" stroke="url(#red)" stroke-width="1.5"/>
    <text x="20" y="18" font-size="11" font-weight="700" fill="#f87171">kill -9 bgwriter (PID 2137165)</text>
    <text x="240" y="18" font-size="11" fill="#cbd5e1">→ 整库 "软重启" (Postmaster 不退, 但所有子进程换新)</text>
    <text x="20" y="36" font-size="10" fill="#64748b">耗时 0.5-1s, 脏页没刷, 触发 redo. 客户端: 所有连接断, 事务回滚</text>
  </g>

  <g transform="translate(40, 161)">
    <rect x="0" y="0" width="820" height="46" rx="8" fill="url(#box)" stroke="url(#red)" stroke-width="1.5"/>
    <text x="20" y="18" font-size="11" font-weight="700" fill="#f87171">kill -9 checkpointer (PID 2137164)</text>
    <text x="260" y="18" font-size="11" fill="#cbd5e1">→ 整库 "软重启"</text>
    <text x="20" y="36" font-size="10" fill="#64748b">Checkpointer 死 → Postmaster 视为 crash → 全集群重启. 最坏情况丢最后一次 checkpoint 之后的脏页</text>
  </g>

  <g transform="translate(40, 217)">
    <rect x="0" y="0" width="820" height="46" rx="8" fill="url(#box)" stroke="url(#yellow)" stroke-width="1.5"/>
    <text x="20" y="18" font-size="11" font-weight="700" fill="#fbbf24">kill -9 walwriter (PID 2137167)</text>
    <text x="260" y="18" font-size="11" fill="#cbd5e1">→ 整库 "软重启"</text>
    <text x="20" y="36" font-size="10" fill="#64748b">后果最危险: WAL 没刷盘 → 重启时必须从更早的 WAL redo → 启动时间长 + 数据丢失风险</text>
  </g>

  <g transform="translate(40, 273)">
    <rect x="0" y="0" width="820" height="46" rx="8" fill="url(#box)" stroke="url(#red)" stroke-width="1.5"/>
    <text x="20" y="18" font-size="11" font-weight="700" fill="#f87171">kill -9 startup (恢复阶段专用)</text>
    <text x="240" y="18" font-size="11" fill="#cbd5e1">→ Postmaster 进 "shutting down due to startup process failure"</text>
    <text x="20" y="36" font-size="10" fill="#64748b">Postmaster 拒绝重启 (源码 line 3224-3238). 整个 PG 退出, 必须手工 pg_ctl start</text>
  </g>

  <g transform="translate(40, 329)">
    <rect x="0" y="0" width="820" height="46" rx="8" fill="url(#box)" stroke="url(#green)" stroke-width="1.5"/>
    <text x="20" y="18" font-size="11" font-weight="700" fill="#34d399">kill -9 一个普通 backend (客户端连接)</text>
    <text x="260" y="18" font-size="11" fill="#cbd5e1">→ 只有这个连接死, 其他连接不受影响</text>
    <text x="20" y="36" font-size="10" fill="#64748b">Postmaster 走 HandleChildCrash → 杀所有? 不是! 普通 backend 死时, 其他 backend 不被牵连 (本路径代码特殊)</text>
  </g>

  <g transform="translate(40, 385)">
    <rect x="0" y="0" width="820" height="46" rx="8" fill="url(#box)" stroke="url(#red)" stroke-width="2"/>
    <text x="20" y="18" font-size="11" font-weight="700" fill="#f87171">kill -9 Postmaster 自身 (PID 2137160)</text>
    <text x="260" y="18" font-size="11" fill="#cbd5e1">→ 整库彻底死, Postmaster 不在, 谁也救不了你</text>
    <text x="20" y="36" font-size="10" fill="#64748b">PG 自己无任何反应. 只能靠 systemd / pg_ctl / 容器编排 / K8s pod restart 拉起 (这才是 "整库重启" 的本义)</text>
  </g>

  <g transform="translate(40, 441)">
    <rect x="0" y="0" width="820" height="60" rx="10" fill="url(#box)" stroke="#fbbf24" stroke-width="2"/>
    <text x="20" y="24" font-size="13" font-weight="700" fill="#fbbf24">对比结论: "数据库重启" 一词的两种含义</text>
    <text x="20" y="46" font-size="11" fill="#cbd5e1">① 软重启: Postmaster 还在, 所有子进程全换 (T+0.5-1s, 共享内存重置)</text>
    <text x="20" y="60" font-size="11" fill="#cbd5e1">② 真重启: Postmaster 死了, 由 systemd / pg_ctl / K8s 拉起 (T+5-30s, postmaster.conf 重读, 时区/locale 重设)</text>
  </g>
</svg>