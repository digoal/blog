<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1729"/>
      <stop offset="100%" stop-color="#1a2542"/>
    </linearGradient>
    <linearGradient id="box" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <linearGradient id="pm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="540" fill="url(#bg)"/>
  <rect x="20" y="20" width="860" height="500" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <text x="40" y="48" font-size="20" font-weight="700" fill="#f8fafc">客户端日志实证: 普通 backend 是怎么被 "连坐" 杀掉的</text>
  <text x="40" y="70" font-size="12" fill="#94a3b8">同一时刻 3 个长查询, kill -9 其中一个, 看其他 2 个客户端日志</text>

  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="820" height="100" rx="10" fill="url(#box)" stroke="url(#green)" stroke-width="1.5"/>
    <text x="20" y="22" font-size="13" font-weight="700" fill="#34d399">实验 A: pg_terminate_backend(2184351, 5000) → 这个 backend 的客户端</text>
    <text x="20" y="42" font-size="11" font-family="'Courier New', monospace" fill="#cbd5e1">FATAL:  terminating connection due to administrator command</text>
    <text x="20" y="60" font-size="11" font-family="'Courier New', monospace" fill="#cbd5e1">server closed the connection unexpectedly</text>
    <text x="20" y="78" font-size="11" font-family="'Courier New', monospace" fill="#34d399">→ 这是 "干净退": 只有管理员命令, 没有 "crash" 字眼</text>
    <text x="20" y="92" font-size="9" fill="#64748b">其它 2 个客户端: 完全不受影响, 继续跑 SELECT pg_sleep(180)</text>
  </g>

  <g transform="translate(40, 210)">
    <rect x="0" y="0" width="820" height="160" rx="10" fill="url(#box)" stroke="url(#red)" stroke-width="2"/>
    <text x="20" y="22" font-size="13" font-weight="700" fill="#f87171">实验 B: kill -9 2184818 → 同时刻另外 2 个客户端 psql 日志</text>
    <text x="20" y="42" font-size="11" font-family="'Courier New', monospace" fill="#fbbf24">WARNING:  terminating connection because of crash of another server process</text>
    <text x="20" y="60" font-size="11" font-family="'Courier New', monospace" fill="#fbbf24">DETAIL:  The postmaster has commanded this server process to roll back</text>
    <text x="20" y="74" font-size="11" font-family="'Courier New', monospace" fill="#fbbf24">         the current transaction and exit, because another server process</text>
    <text x="20" y="88" font-size="11" font-family="'Courier New', monospace" fill="#fbbf24">         exited abnormally and possibly corrupted shared memory.</text>
    <text x="20" y="102" font-size="11" font-family="'Courier New', monospace" fill="#fbbf24">HINT:  In a moment you should be able to reconnect to the database</text>
    <text x="20" y="114" font-size="11" font-family="'Courier New', monospace" fill="#fbbf24">       and repeat your command.</text>
    <text x="20" y="132" font-size="11" font-family="'Courier New', monospace" fill="#cbd5e1">server closed the connection unexpectedly</text>
    <text x="20" y="148" font-size="11" font-family="'Courier New', monospace" fill="#f87171">→ 这是 "连坐退": "crash of another server process" + "possibly corrupted shared memory"</text>
  </g>

  <g transform="translate(40, 380)">
    <rect x="0" y="0" width="820" height="120" rx="10" fill="url(#box)" stroke="url(#pm)" stroke-width="2"/>
    <text x="20" y="24" font-size="13" font-weight="700" fill="#60a5fa">★ 关键区分 (从客户端日志就能看出来)</text>
    <text x="20" y="46" font-size="11" fill="#cbd5e1">"administrator command" → 管理员主动杀的 (pg_terminate_backend / pg_ctl stop)</text>
    <text x="20" y="62" font-size="11" fill="#cbd5e1">"crash of another server process" → 别的进程崩了, Postmaster 让你跟着滚</text>
    <text x="20" y="78" font-size="11" fill="#cbd5e1">"possibly corrupted shared memory" → 共享内存可能已损坏, 必须退出</text>
    <text x="20" y="94" font-size="9" fill="#94a3b8">→ 这两条 WARNING 是 PG 给所有 PG 客户端的 "集群级事件" 信号, 客户端代码可以用来触发重连</text>
    <text x="20" y="108" font-size="9" fill="#64748b">→ 客户端如果只看 ERROR 没看 WARNING/HINT, 可能错过整库重启事件, 一直显示 "connection lost"</text>
  </g>
</svg>