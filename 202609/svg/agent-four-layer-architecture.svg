<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C1A"/>
      <stop offset="50%" stop-color="#0D1326"/>
      <stop offset="100%" stop-color="#090E1D"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="purpleLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="620" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Title Header -->
  <text x="480" y="48" fill="#F8FAFC" font-size="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" text-anchor="middle" letter-spacing="1">企业级 Agent 严肃落地：四层立体交付底盘</text>
  <text x="480" y="76" fill="#94A3B8" font-size="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">拒绝玩具 Demo · 用数据库工程纪律驯服不确定性</text>

  <!-- Layer 4: Action -->
  <g transform="translate(60, 105)">
    <rect width="840" height="100" rx="12" fill="url(#cardGrad1)" stroke="#38BDF8" stroke-width="1.5"/>
    <rect x="0" y="0" width="8" height="100" rx="4" fill="#38BDF8"/>
    <text x="30" y="38" fill="#38BDF8" font-size="18" font-weight="700" font-family="-apple-system, sans-serif">Layer 4: Action 执行层（确定性与自愈）</text>
    <text x="30" y="68" fill="#E2E8F0" font-size="14" font-family="-apple-system, sans-serif">核心抓手：确定性地板（80%已知场景锁死） · 自动反向回滚 SKILL · 高危写操作「人留回路」放行</text>
    <rect x="700" y="24" width="120" height="28" rx="14" fill="#0369A1" fill-opacity="0.3" stroke="#38BDF8" stroke-width="1"/>
    <text x="760" y="43" fill="#BAE6FD" font-size="12" font-weight="600" text-anchor="middle" font-family="-apple-system, sans-serif">10秒秒级自愈</text>
  </g>

  <!-- Flow Arrow 1 -->
  <path d="M 500 205 L 500 225" stroke="#06B6D4" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="496,225 504,225 500,232" fill="#06B6D4"/>

  <!-- Layer 3: Decision -->
  <g transform="translate(60, 230)">
    <rect width="840" height="100" rx="12" fill="url(#cardGrad1)" stroke="#818CF8" stroke-width="1.5"/>
    <rect x="0" y="0" width="8" height="100" rx="4" fill="#818CF8"/>
    <text x="30" y="38" fill="#818CF8" font-size="18" font-weight="700" font-family="-apple-system, sans-serif">Layer 3: Decision 决策层（结构化状态机）</text>
    <text x="30" y="68" fill="#E2E8F0" font-size="14" font-family="-apple-system, sans-serif">核心抓手：任务契约落盘（WAL机制） · Stateless Worker（无状态工人） · 原生 SKIP LOCKED 调度</text>
    <rect x="700" y="24" width="120" height="28" rx="14" fill="#4338CA" fill-opacity="0.3" stroke="#818CF8" stroke-width="1"/>
    <text x="760" y="43" fill="#C7D2FE" font-size="12" font-weight="600" text-anchor="middle" font-family="-apple-system, sans-serif">契约接续容错</text>
  </g>

  <!-- Flow Arrow 2 -->
  <path d="M 500 330 L 500 350" stroke="#818CF8" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="496,350 504,350 500,357" fill="#818CF8"/>

  <!-- Layer 2: Context & Memory -->
  <g transform="translate(60, 355)">
    <rect width="840" height="100" rx="12" fill="url(#cardGrad1)" stroke="#A855F7" stroke-width="1.5"/>
    <rect x="0" y="0" width="8" height="100" rx="4" fill="#A855F7"/>
    <text x="30" y="38" fill="#C084FC" font-size="18" font-weight="700" font-family="-apple-system, sans-serif">Layer 2: Context 认知层（四层立体记忆）</text>
    <text x="30" y="68" fill="#E2E8F0" font-size="14" font-family="-apple-system, sans-serif">核心抓手：L1短程上下文 · L2实体事实卡片 · L3模式记忆（SKILL化沉淀） · L4能力元自评 · 用进废退</text>
    <rect x="700" y="24" width="120" height="28" rx="14" fill="#7E22CE" fill-opacity="0.3" stroke="#A855F7" stroke-width="1"/>
    <text x="760" y="43" fill="#E9D5FF" font-size="12" font-weight="600" text-anchor="middle" font-family="-apple-system, sans-serif">边用边养进化</text>
  </g>

  <!-- Flow Arrow 3 -->
  <path d="M 500 455 L 500 475" stroke="#A855F7" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="496,475 504,475 500,482" fill="#A855F7"/>

  <!-- Layer 1: Data Infra -->
  <g transform="translate(60, 480)">
    <rect width="840" height="105" rx="12" fill="url(#cardGrad1)" stroke="#10B981" stroke-width="1.5"/>
    <rect x="0" y="0" width="8" height="105" rx="4" fill="#10B981"/>
    <text x="30" y="38" fill="#34D399" font-size="18" font-weight="700" font-family="-apple-system, sans-serif">Layer 1: Data Infra 数据底盘（存 Agent 协作全过程）</text>
    <text x="30" y="68" fill="#E2E8F0" font-size="14" font-family="-apple-system, sans-serif">原生一体化同库闭环：PostgreSQL + pgvector（向量）+ Apache AGE（图）+ 全文检索 + RLS行级隔离 + 事件溯源</text>
    <rect x="700" y="24" width="120" height="28" rx="14" fill="#065F46" fill-opacity="0.3" stroke="#34D399" stroke-width="1"/>
    <text x="760" y="43" fill="#A7F3D0" font-size="12" font-weight="600" text-anchor="middle" font-family="-apple-system, sans-serif">原生事务一致</text>
  </g>
</svg>
