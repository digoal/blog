<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="800" height="460" fill="#fafafa"/>
  <text x="400" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">append 路径:7 种写法 × 崩/SIGKILL 实测</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#475569">本机 11k session / 12.8k message 真实语料 · 双进程并发 + SIGKILL -9</text>

  <!-- 4 columns -->
  <g transform="translate(60,100)">
    <rect x="0" y="0" width="160" height="280" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="80" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">raw O_APPEND</text>
    <text x="80" y="48" text-anchor="middle" font-size="11" fill="#065f46">os.write + O_APPEND</text>
    <text x="80" y="78" text-anchor="middle" font-size="32" font-weight="700" fill="#10b981">0.0%</text>
    <text x="80" y="100" text-anchor="middle" font-size="11" fill="#334155">坏行率</text>
    <text x="80" y="120" text-anchor="middle" font-size="11" fill="#334155">10633 / 10633</text>
    <text x="80" y="160" text-anchor="middle" font-size="10" fill="#475569">坏行只可能在尾,</text>
    <text x="80" y="178" text-anchor="middle" font-size="10" fill="#475569">丢最后一行即可恢复</text>
    <text x="80" y="220" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">✅ POSIX 写原语正确</text>
    <text x="80" y="244" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">✅ 崩溃只丢尾部</text>
  </g>

  <g transform="translate(240,100)">
    <rect x="0" y="0" width="160" height="280" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="80" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">Python 文本 a</text>
    <text x="80" y="48" text-anchor="middle" font-size="11" fill="#92400e">open("a") + flush</text>
    <text x="80" y="78" text-anchor="middle" font-size="32" font-weight="700" fill="#d97706">0.025%</text>
    <text x="80" y="100" text-anchor="middle" font-size="11" fill="#334155">坏行率</text>
    <text x="80" y="120" text-anchor="middle" font-size="11" fill="#334155">2 / 8034</text>
    <text x="80" y="160" text-anchor="middle" font-size="10" fill="#475569">坏行同样只在尾,</text>
    <text x="80" y="178" text-anchor="middle" font-size="10" fill="#475569">10/10 轮都丢最后</text>
    <text x="80" y="220" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">⚠️ 不要 1 条 = 8 次 write</text>
  </g>

  <g transform="translate(420,100)">
    <rect x="0" y="0" width="160" height="280" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="80" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">SQLite WAL NORMAL</text>
    <text x="80" y="48" text-anchor="middle" font-size="11" fill="#1e3a8a">BEGIN IMMEDIATE+COMMIT</text>
    <text x="80" y="78" text-anchor="middle" font-size="32" font-weight="700" fill="#2563eb">0</text>
    <text x="80" y="100" text-anchor="middle" font-size="11" fill="#334155">坏行数</text>
    <text x="80" y="120" text-anchor="middle" font-size="11" fill="#334155">1358 行全在事务里</text>
    <text x="80" y="160" text-anchor="middle" font-size="10" fill="#475569">事务粒度,1 条 = 1 tx,</text>
    <text x="80" y="178" text-anchor="middle" font-size="10" fill="#475569">崩溃回滚到 last commit</text>
    <text x="80" y="220" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">✅ 强一致</text>
    <text x="80" y="244" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">⚠️ 30 µs/条 vs 5 µs</text>
  </g>

  <g transform="translate(600,100)">
    <rect x="0" y="0" width="160" height="280" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="80" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">去掉 O_APPEND</text>
    <text x="80" y="48" text-anchor="middle" font-size="11" fill="#7f1d1d">lseek 0 SEEK_END + write</text>
    <text x="80" y="78" text-anchor="middle" font-size="32" font-weight="700" fill="#dc2626">4.71%</text>
    <text x="80" y="100" text-anchor="middle" font-size="11" fill="#334155">坏行率</text>
    <text x="80" y="120" text-anchor="middle" font-size="11" fill="#334155">265 / 5624</text>
    <text x="80" y="160" text-anchor="middle" font-size="10" fill="#475569">10/10 轮坏行</text>
    <text x="80" y="178" text-anchor="middle" font-size="10" fill="#475569">全部出现在文件中间</text>
    <text x="80" y="220" text-anchor="middle" font-size="11" font-weight="700" fill="#7f1d1d">❌ 这种写法等于自杀</text>
  </g>

  <text x="400" y="420" text-anchor="middle" font-size="12" fill="#475569">结论:JSONL 的安全来自"一条 record = 一次 write(2) + O_APPEND"两件事缺一不可。SQLite 的安全来自事务粒度。</text>
  <text x="400" y="442" text-anchor="middle" font-size="12" fill="#475569">两者都不存在"神秘魔法",正确的写路径才有正确的结果。</text>
</svg>
