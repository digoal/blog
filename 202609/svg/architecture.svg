<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1200" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="metaBg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="tidBg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#0c4a6e"/>
      <stop offset="1" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="attBg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#7c2d12"/>
      <stop offset="1" stop-color="#431407"/>
    </linearGradient>
    <linearGradient id="undoBg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#365314"/>
      <stop offset="1" stop-color="#1a2e05"/>
    </linearGradient>
    <linearGradient id="toastBg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#581c87"/>
      <stop offset="1" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="walBg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#7f1d1d"/>
      <stop offset="1" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="encodeBg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#ffedd5"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/>
    </marker>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0ea5e9"/>
    </marker>
  </defs>

  <rect width="1280" height="1200" fill="#fafafa"/>

  <rect x="0" y="0" width="1280" height="74" fill="#0f172a"/>
  <text x="40" y="34" fill="#f8fafc" font-size="22" font-weight="700">ZedStore 单表五类页布局 + TID 驱动的列存读路径</text>
  <text x="40" y="58" fill="#94a3b8" font-size="13">PostgreSQL 13devel · src/backend/access/zedstore/ · LZ4 + Simple-8b + UNDO-style MVCC</text>

  <g filter="url(#softShadow)">
    <rect x="430" y="90" width="420" height="50" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
    <text x="640" y="112" text-anchor="middle" fill="#0f172a" font-size="15" font-weight="600">SQL: SELECT temp FROM sensor WHERE id=42</text>
    <text x="640" y="132" text-anchor="middle" fill="#475569" font-size="11">executor 解析 → 列投影集合 = {attno=3 temp}</text>
  </g>

  <line x1="640" y1="140" x2="640" y2="160" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)"/>

  <g filter="url(#softShadow)">
    <rect x="330" y="160" width="620" height="74" rx="10" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <text x="640" y="186" text-anchor="middle" fill="#78350f" font-size="16" font-weight="700">Executor 投影下推</text>
    <text x="640" y="208" text-anchor="middle" fill="#78350f" font-size="12">beginscan_with_column_projection → 仅 TID 树 + attno=3(temp) 列树被走</text>
    <text x="640" y="224" text-anchor="middle" fill="#92400e" font-size="11">attno=1(c1 id) 和 attno=2(c2 ts) 完全不读</text>
  </g>

  <rect x="40" y="254" width="1200" height="640" rx="14" fill="#f8fafc" stroke="#0f172a" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="60" y="278" fill="#0f172a" font-size="15" font-weight="700">单个 ZedStore 关系文件 (PG RelationFile) · 共享 pages</text>
  <text x="60" y="296" fill="#475569" font-size="11">block 0 = meta, blocks 1..n = TID树/属性树/UNDO/toast 混居,文件内自由扩展</text>

  <!-- Meta -->
  <g filter="url(#softShadow)">
    <rect x="80" y="314" width="240" height="118" rx="10" fill="url(#metaBg)" stroke="#0f172a" stroke-width="1.5"/>
    <text x="200" y="340" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="700">Block 0 · Metapage</text>
    <text x="100" y="364" fill="#cbd5e1" font-size="11">▸ per-att root blk 数组</text>
    <text x="100" y="382" fill="#cbd5e1" font-size="11">▸ UNDO head/tail/counter</text>
    <text x="100" y="400" fill="#cbd5e1" font-size="11">▸ per-att FPM head 链头</text>
    <text x="100" y="418" fill="#cbd5e1" font-size="11">▸ 总 FPM head (UNDO 用)</text>
  </g>

  <!-- FPM -->
  <g filter="url(#softShadow)">
    <rect x="80" y="446" width="240" height="100" rx="10" fill="#374151" stroke="#0f172a" stroke-width="1.5"/>
    <text x="200" y="472" text-anchor="middle" fill="#f1f5f9" font-size="14" font-weight="700">Free Page Map (FPM)</text>
    <text x="200" y="494" text-anchor="middle" fill="#cbd5e1" font-size="10">1 总 FPM (UNDO 用)</text>
    <text x="200" y="510" text-anchor="middle" fill="#cbd5e1" font-size="10">+ per-att FPM (一列一链头)</text>
    <text x="200" y="528" text-anchor="middle" fill="#cbd5e1" font-size="10">扩表一次拿 N 页 (extension factor)</text>
  </g>

  <!-- TID tree -->
  <g filter="url(#softShadow)">
    <rect x="360" y="314" width="280" height="232" rx="10" fill="url(#tidBg)" stroke="#0f172a" stroke-width="1.5"/>
    <text x="500" y="340" text-anchor="middle" fill="#f0f9ff" font-size="15" font-weight="700">TID 树 (attno=0)</text>
    <text x="500" y="358" text-anchor="middle" fill="#bae6fd" font-size="11">B-tree, 内部页与属性树结构相同</text>

    <rect x="430" y="370" width="140" height="32" rx="6" fill="#0ea5e9"/>
    <text x="500" y="391" text-anchor="middle" fill="#0c4a6e" font-size="11" font-weight="700">root leaf</text>

    <rect x="370" y="416" width="115" height="58" rx="6" fill="#0369a1"/>
    <text x="427" y="434" text-anchor="middle" fill="#e0f2fe" font-size="11" font-weight="600">ZSTidArrayItem</text>
    <text x="427" y="450" text-anchor="middle" fill="#bae6fd" font-size="10">TIDs + UNDO ptrs</text>
    <text x="427" y="464" text-anchor="middle" fill="#bae6fd" font-size="10">Simple-8b 编码</text>

    <rect x="515" y="416" width="115" height="58" rx="6" fill="#0369a1"/>
    <text x="572" y="434" text-anchor="middle" fill="#e0f2fe" font-size="11" font-weight="600">ZSTidArrayItem</text>
    <text x="572" y="450" text-anchor="middle" fill="#bae6fd" font-size="10">slot0=all vis</text>
    <text x="572" y="464" text-anchor="middle" fill="#bae6fd" font-size="10">slot1=dead</text>

    <text x="500" y="500" text-anchor="middle" fill="#e0f2fe" font-size="11" font-weight="600">MVCC 入口</text>
    <text x="500" y="518" text-anchor="middle" fill="#bae6fd" font-size="10">只有元组可见才去各属性树抓值</text>
    <text x="500" y="534" text-anchor="middle" fill="#bae6fd" font-size="10">批量查 4 slot 而非逐行 fetch UNDO</text>
  </g>

  <!-- encode detail -->
  <g filter="url(#softShadow)">
    <rect x="360" y="560" width="280" height="174" rx="10" fill="url(#encodeBg)" stroke="#9a3412" stroke-width="1.5"/>
    <text x="500" y="586" text-anchor="middle" fill="#7c2d12" font-size="14" font-weight="700">ZSTidArrayItem 编码格式</text>

    <rect x="380" y="600" width="240" height="18" rx="3" fill="#fed7aa"/>
    <text x="500" y="613" text-anchor="middle" fill="#7c2d12" font-size="10">固定头: t_size / num_tids / codewords / undo_slots</text>

    <rect x="380" y="624" width="240" height="18" rx="3" fill="#fdba74"/>
    <text x="500" y="637" text-anchor="middle" fill="#7c2d12" font-size="10">Simple-8b codewords (TID 差值)</text>

    <rect x="380" y="648" width="240" height="18" rx="3" fill="#fb923c"/>
    <text x="500" y="661" text-anchor="middle" fill="#fff7ed" font-size="10">UNDO slot 数组 (≤4 个)</text>

    <rect x="380" y="672" width="240" height="18" rx="3" fill="#f97316"/>
    <text x="500" y="685" text-anchor="middle" fill="#fff7ed" font-size="10">slotno 字流 (2 位/元组)</text>

    <text x="500" y="708" text-anchor="middle" fill="#9a3412" font-size="10">slot0=全可见, slot1=死</text>
    <text x="500" y="724" text-anchor="middle" fill="#9a3412" font-size="10">余 2 slot 留给真活跃 UNDO 指针</text>
  </g>

  <!-- attribute trees -->
  <g filter="url(#softShadow)">
    <rect x="680" y="314" width="280" height="420" rx="10" fill="url(#attBg)" stroke="#0f172a" stroke-width="1.5"/>
    <text x="820" y="340" text-anchor="middle" fill="#ffedd5" font-size="15" font-weight="700">属性树 (attno=1..N)</text>
    <text x="820" y="358" text-anchor="middle" fill="#fed7aa" font-size="11">B-tree, 一列一树, 内页同 TID 树</text>

    <rect x="690" y="370" width="120" height="40" rx="6" fill="#9a3412"/>
    <text x="750" y="394" text-anchor="middle" fill="#ffedd5" font-size="11">attno=1 c1 (id)</text>

    <rect x="830" y="370" width="120" height="40" rx="6" fill="#9a3412"/>
    <text x="890" y="394" text-anchor="middle" fill="#ffedd5" font-size="11">attno=2 c2 (ts)</text>

    <rect x="690" y="424" width="260" height="46" rx="6" fill="#c2410c"/>
    <text x="820" y="452" text-anchor="middle" fill="#ffedd5" font-size="12" font-weight="600">attno=3 c3 (temp) root leaf</text>

    <rect x="700" y="486" width="110" height="68" rx="6" fill="#ea580c"/>
    <text x="755" y="506" text-anchor="middle" fill="#fff7ed" font-size="11" font-weight="600">lower attstream</text>
    <text x="755" y="522" text-anchor="middle" fill="#fed7aa" font-size="10">未压缩追加</text>
    <text x="755" y="538" text-anchor="middle" fill="#fed7aa" font-size="10">新数据落这里</text>

    <rect x="830" y="486" width="110" height="68" rx="6" fill="#ea580c"/>
    <text x="885" y="506" text-anchor="middle" fill="#fff7ed" font-size="11" font-weight="600">upper attstream</text>
    <text x="885" y="522" text-anchor="middle" fill="#fed7aa" font-size="10">LZ4 压缩</text>
    <text x="885" y="538" text-anchor="middle" fill="#fed7aa" font-size="10">chunk ≤ 8KB</text>

    <text x="820" y="582" text-anchor="middle" fill="#fed7aa" font-size="10">chunks: 1~60 行/块</text>
    <text x="820" y="598" text-anchor="middle" fill="#fed7aa" font-size="10">每页 lower+upper 双流</text>
    <text x="820" y="614" text-anchor="middle" fill="#fed7aa" font-size="10">满了 → 全页重压 → 上层</text>
    <text x="820" y="630" text-anchor="middle" fill="#fed7aa" font-size="10">解压只在 backend private mem</text>
    <text x="820" y="660" text-anchor="middle" fill="#fed7aa" font-size="11" font-weight="600">buffer cache 缓存的就是</text>
    <text x="820" y="678" text-anchor="middle" fill="#fed7aa" font-size="11" font-weight="600">压缩块</text>
    <text x="820" y="696" text-anchor="middle" fill="#fde68a" font-size="10">→ 跟 WAL FPI 一致</text>

    <text x="820" y="720" text-anchor="middle" fill="#fde68a" font-size="11" font-weight="600">→ 给出可见 TID 后</text>
  </g>

  <!-- UNDO -->
  <g filter="url(#softShadow)">
    <rect x="1000" y="314" width="220" height="180" rx="10" fill="url(#undoBg)" stroke="#0f172a" stroke-width="1.5"/>
    <text x="1110" y="340" text-anchor="middle" fill="#ecfccb" font-size="15" font-weight="700">UNDO log</text>
    <text x="1110" y="358" text-anchor="middle" fill="#d9f99d" font-size="11">append-only byte stream</text>

    <rect x="1015" y="370" width="90" height="26" rx="4" fill="#65a30d"/>
    <text x="1060" y="387" text-anchor="middle" fill="#1a2e05" font-size="10">head</text>

    <rect x="1120" y="370" width="90" height="26" rx="4" fill="#84cc16"/>
    <text x="1165" y="387" text-anchor="middle" fill="#1a2e05" font-size="10">tail</text>

    <text x="1110" y="420" text-anchor="middle" fill="#d9f99d" font-size="10">head..tail 单链表</text>
    <text x="1110" y="436" text-anchor="middle" fill="#d9f99d" font-size="10">record: {xid, type, prev_ptr}</text>
    <text x="1110" y="452" text-anchor="middle" fill="#d9f99d" font-size="10">type ∈ INSERT/DELETE/UPDATE</text>
    <text x="1110" y="468" text-anchor="middle" fill="#d9f99d" font-size="10">                /TUPLE_LOCK</text>
    <text x="1110" y="484" text-anchor="middle" fill="#fde68a" font-size="10" font-weight="600">XXX: 期待上游 UNDO 替代</text>
  </g>

  <!-- TOAST -->
  <g filter="url(#softShadow)">
    <rect x="1000" y="514" width="220" height="160" rx="10" fill="url(#toastBg)" stroke="#0f172a" stroke-width="1.5"/>
    <text x="1110" y="540" text-anchor="middle" fill="#f5d0fe" font-size="15" font-weight="700">TOAST pages</text>
    <text x="1110" y="558" text-anchor="middle" fill="#e9d5ff" font-size="11">同文件内, 不独立 toast 表</text>

    <rect x="1020" y="570" width="48" height="48" rx="6" fill="#a21caf"/>
    <text x="1044" y="592" text-anchor="middle" fill="#fafafa" font-size="10" font-weight="600">page 1</text>
    <text x="1044" y="608" text-anchor="middle" fill="#f5d0fe" font-size="10">slice 0</text>

    <rect x="1076" y="570" width="48" height="48" rx="6" fill="#a21caf"/>
    <text x="1100" y="592" text-anchor="middle" fill="#fafafa" font-size="10" font-weight="600">page 2</text>
    <text x="1100" y="608" text-anchor="middle" fill="#f5d0fe" font-size="10">slice 1</text>

    <rect x="1132" y="570" width="48" height="48" rx="6" fill="#a21caf"/>
    <text x="1156" y="592" text-anchor="middle" fill="#fafafa" font-size="10" font-weight="600">page 3</text>
    <text x="1156" y="608" text-anchor="middle" fill="#f5d0fe" font-size="10">slice 2</text>

    <text x="1110" y="648" text-anchor="middle" fill="#e9d5ff" font-size="10">prev/next 链 + zs_tid + zs_attno</text>
    <text x="1110" y="664" text-anchor="middle" fill="#fde68a" font-size="10">先压, ≤ MaxZedStoreDatumSize 仍 inline</text>
  </g>

  <!-- WAL 全宽 横放 -->
  <g filter="url(#softShadow)">
    <rect x="80" y="750" width="1140" height="124" rx="10" fill="url(#walBg)" stroke="#0f172a" stroke-width="1.5"/>
    <text x="650" y="776" text-anchor="middle" fill="#fee2e2" font-size="15" font-weight="700">WAL · RM_ZEDSTORE_ID (9 个 op code · zedstore_redo)</text>

    <rect x="110" y="788" width="135" height="26" rx="4" fill="#b91c1c"/>
    <text x="178" y="806" text-anchor="middle" fill="#fef2f2" font-size="10">INIT_METAPAGE</text>

    <rect x="255" y="788" width="135" height="26" rx="4" fill="#b91c1c"/>
    <text x="323" y="806" text-anchor="middle" fill="#fef2f2" font-size="10">BTREE_NEW_ROOT</text>

    <rect x="400" y="788" width="160" height="26" rx="4" fill="#b91c1c"/>
    <text x="480" y="806" text-anchor="middle" fill="#fef2f2" font-size="10">BTREE_REWRITE_PAGES</text>

    <rect x="570" y="788" width="155" height="26" rx="4" fill="#b91c1c"/>
    <text x="648" y="806" text-anchor="middle" fill="#fef2f2" font-size="10">TIDLEAF_ADD_ITEMS</text>

    <rect x="735" y="788" width="170" height="26" rx="4" fill="#b91c1c"/>
    <text x="820" y="806" text-anchor="middle" fill="#fef2f2" font-size="10">TIDLEAF_REPLACE_ITEM</text>

    <rect x="915" y="788" width="155" height="26" rx="4" fill="#b91c1c"/>
    <text x="993" y="806" text-anchor="middle" fill="#fef2f2" font-size="10">ATTSTREAM_CHANGE</text>

    <rect x="1080" y="788" width="135" height="26" rx="4" fill="#b91c1c"/>
    <text x="1147" y="806" text-anchor="middle" fill="#fef2f2" font-size="10">TOAST_NEWPAGE</text>

    <text x="650" y="838" text-anchor="middle" fill="#fecaca" font-size="11">策略: 压缩页/UNDO/toast 整页镜像 (REGBUF_FORCE_IMAGE)</text>
    <text x="650" y="856" text-anchor="middle" fill="#fecaca" font-size="11">redo 走 9 路 switch · mask 函数清掉 speculative_token</text>
    <text x="650" y="870" text-anchor="middle" fill="#fde68a" font-size="11" font-weight="600">buffer cache 缓存的就是压缩块 → 跨 WAL/共享缓冲一致</text>
  </g>

  <line x1="500" y1="234" x2="500" y2="314" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="320" y1="200" x2="200" y2="314" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- takeaway -->
  <rect x="40" y="916" width="1200" height="256" rx="12" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
  <text x="60" y="950" fill="#22d3ee" font-size="18" font-weight="700">读路径最短叙事 · 5 步完成列投影点查</text>

  <text x="60" y="982" fill="#e2e8f0" font-size="13">① executor 投影下推, 计算列投影集合 = {temp}</text>
  <text x="60" y="1004" fill="#e2e8f0" font-size="13">② TID 树顺序扫 → ZSTidArrayItem 批量判断 UNDO slot 0/1/2/3 的可见性 → 给出可见 TID 列表</text>
  <text x="60" y="1026" fill="#e2e8f0" font-size="13">③ 对每个可见 TID, 只走 attno=3 的属性树叶子, 解 lower/upper attstream 中对应 TID 的 datum</text>
  <text x="60" y="1048" fill="#e2e8f0" font-size="13">④ VirtualTupleTable 把 {temp} 灌回上层节点, executor 拿到的就是已完成列投影的行</text>
  <text x="60" y="1070" fill="#e2e8f0" font-size="13">⑤ buffer cache 缓存的就是压缩块 → 与 WAL FPI 一致, 压缩可跨 cache/WAL 复用</text>
  <text x="60" y="1100" fill="#fde68a" font-size="13" font-weight="700">结论: attno=1(c1) / attno=2(c2) 永远不被读 → I/O 实际节省 ≈ (1 - 1/N) × 全行读</text>
  <text x="60" y="1126" fill="#94a3b8" font-size="11">实测(见正文): 5 列 sensor 表只取 temp 时, 4 个 btree 中仅 1 个属性树被读; 5020 行 + 1000 行 delete + VACUUM = 144 kB</text>
  <text x="60" y="1148" fill="#94a3b8" font-size="11">实测: 即使含 50000 字符 text, pg_zs_toast_pages 返回 0 行 → 无独立 toast 表</text>
</svg>