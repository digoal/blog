<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="800" height="520" fill="#fafafa"/>
  <text x="400" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">"单文件隔离"真的能隔离坏字节吗?</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#475569">随机翻 1 字节 × 40 次 · 两种后端 · 全表逐行 select</text>

  <!-- JSONL panel -->
  <g transform="translate(50,100)">
    <text x="0" y="0" font-size="15" font-weight="700" fill="#1d4ed8">JSONL 41.4 MB · 110 session · 12 832 行</text>
    <rect x="0" y="14" width="320" height="320" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5" rx="8"/>
    <g transform="translate(16,40)">
      <text x="0" y="0" font-size="13" font-weight="700" fill="#1e3a8a">坏行检测 40/40</text>
      <text x="0" y="20" font-size="11" fill="#334155">json.loads 抛错 → 100% 检出</text>
      <text x="0" y="40" font-size="13" font-weight="700" fill="#1e3a8a">坏行全在尾部 10/10</text>
      <text x="0" y="60" font-size="11" fill="#334155">10/10 轮"丢最后一行"即可</text>
      <text x="0" y="80" font-size="11" fill="#334155">全文件恢复率 ≥ 98%</text>
      <text x="0" y="100" font-size="13" font-weight="700" fill="#1e3a8a">静默数据篡改 0%</text>
      <text x="0" y="120" font-size="11" fill="#334155">因为外层有 sha256 (demo)</text>
    </g>
    <text x="160" y="190" text-anchor="middle" font-size="11" fill="#475569" font-style="italic">坏字节</text>
    <g stroke="#ef4444" stroke-width="1" stroke-dasharray="4,2">
      <line x1="60" y1="195" x2="80" y2="195"/>
      <line x1="80" y1="195" x2="80" y2="220"/>
      <line x1="80" y1="220" x2="60" y2="220"/>
      <line x1="60" y1="220" x2="60" y2="195"/>
    </g>
    <text x="160" y="218" text-anchor="middle" font-size="11" fill="#dc2626">→ 1 行废</text>

    <text x="160" y="250" text-anchor="middle" font-size="11" fill="#475569" font-style="italic">坏字节</text>
    <g stroke="#ef4444" stroke-width="1" stroke-dasharray="4,2">
      <line x1="180" y1="255" x2="200" y2="255"/>
      <line x1="200" y1="255" x2="200" y2="280"/>
      <line x1="200" y1="280" x2="180" y2="280"/>
      <line x1="180" y1="280" x2="180" y2="255"/>
    </g>
    <text x="160" y="278" text-anchor="middle" font-size="11" fill="#dc2626">→ 1 行废</text>

    <text x="160" y="320" text-anchor="middle" font-size="11" fill="#0f172a" font-weight="700">"单文件隔离"是真的</text>
  </g>

  <!-- SQLite panel -->
  <g transform="translate(420,100)">
    <text x="0" y="0" font-size="15" font-weight="700" fill="#b91c1c">SQLite 41.6 MB · 12832 行 · 全表逐行读</text>
    <rect x="0" y="0" width="320" height="320" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5" rx="8" transform="translate(0,14)"/>
    <g transform="translate(16,40)">
      <text x="0" y="0" font-size="13" font-weight="700" fill="#7f1d1d">integrity_check 报 ok 1/40</text>
      <text x="0" y="20" font-size="11" fill="#7f1d1d">23/40 抛 DatabaseError, 16/40 落在空闲页</text>
      <text x="0" y="40" font-size="13" font-weight="700" fill="#7f1d1d">SQLite 官方不开数据页 checksum</text>
      <text x="0" y="60" font-size="11" fill="#7f1d1d">SQLITE_ENABLE_CHECKSUM_VFS 默认 0</text>
      <text x="0" y="80" font-size="13" font-weight="700" fill="#7f1d1d">count(*) 20/20 仍返回 12832</text>
      <text x="0" y="100" font-size="11" fill="#7f1d1d">因为 covering count 不解压 payload</text>
    </g>
    <text x="160" y="180" text-anchor="middle" font-size="11" fill="#475569" font-style="italic">"DB 还能开"</text>
    <text x="160" y="200" text-anchor="middle" font-size="11" fill="#475569" font-style="italic">≠"数据没坏"</text>

    <text x="160" y="240" text-anchor="middle" font-size="11" fill="#0f172a" font-weight="700">catches 60% · silent 0%</text>
    <text x="160" y="260" text-anchor="middle" font-size="11" fill="#0f172a" font-weight="700">但 23/40 是 DatabaseError</text>
    <text x="160" y="280" text-anchor="middle" font-size="11" fill="#0f172a" font-weight="700">→ 全库 12832 行崩</text>
  </g>

  <text x="400" y="470" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">0% vs 0% 静默, 但 1/41.6 MB vs 1/41.6 MB 1 行 vs 全库</text>
  <text x="400" y="492" text-anchor="middle" font-size="12" fill="#475569">JSONL 的 "坏 1 行" 是真的 "坏 1 行", 不会传染。SQLite 的 "DB 还能开" 不等于 "数据还活着"。</text>
</svg>
