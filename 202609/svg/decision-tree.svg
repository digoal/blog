<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="800" height="480" fill="#fafafa"/>
  <text x="400" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">2026 年 session 后端选型:决策树</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#475569">不是谁赢谁输, 是按"会话量 / 查询需求 / 团队规模"分</text>

  <g stroke="#cbd5e1" stroke-width="1.5" fill="none">
    <line x1="400" y1="100" x2="200" y2="180"/>
    <line x1="400" y1="100" x2="400" y2="180"/>
    <line x1="400" y1="100" x2="600" y2="180"/>
    <line x1="200" y1="200" x2="120" y2="280"/>
    <line x1="200" y1="200" x2="280" y2="280"/>
    <line x1="400" y1="200" x2="400" y2="280"/>
    <line x1="600" y1="200" x2="520" y2="280"/>
    <line x1="600" y1="200" x2="680" y2="280"/>
  </g>

  <g transform="translate(330,80)">
    <rect x="0" y="0" width="140" height="40" rx="20" fill="#1e3a8a"/>
    <text x="70" y="25" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">你有多少 session</text>
  </g>

  <g transform="translate(130,160)">
    <rect x="0" y="0" width="140" height="40" rx="8" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="70" y="25" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">&lt; 1000</text>
  </g>
  <g transform="translate(330,160)">
    <rect x="0" y="0" width="140" height="40" rx="8" fill="#fef3c7" stroke="#d97706"/>
    <text x="70" y="25" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">1k ~ 10k</text>
  </g>
  <g transform="translate(530,160)">
    <rect x="0" y="0" width="140" height="40" rx="8" fill="#fee2e2" stroke="#b91c1c"/>
    <text x="70" y="25" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">&gt; 10k</text>
  </g>

  <g transform="translate(50,260)">
    <rect x="0" y="0" width="140" height="60" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
    <text x="70" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">JSONL 纯</text>
    <text x="70" y="42" text-anchor="middle" font-size="10" fill="#334155">单机, 不需要 DB</text>
    <text x="70" y="55" text-anchor="middle" font-size="9" fill="#475569">Claude Code 形态</text>
  </g>
  <g transform="translate(210,260)">
    <rect x="0" y="0" width="140" height="60" rx="8" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="70" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6">混合 (推荐)</text>
    <text x="70" y="42" text-anchor="middle" font-size="10" fill="#334155">JSONL 真源 + SQLite 索引</text>
    <text x="70" y="55" text-anchor="middle" font-size="9" fill="#475569">Codex / OpenCode 形态</text>
  </g>
  <g transform="translate(370,260)">
    <rect x="0" y="0" width="140" height="60" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
    <text x="70" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">JSONL + 索引</text>
    <text x="70" y="42" text-anchor="middle" font-size="10" fill="#334155">全文检索 / 聚合</text>
    <text x="70" y="55" text-anchor="middle" font-size="9" fill="#475569">Codex 形态</text>
  </g>
  <g transform="translate(530,260)">
    <rect x="0" y="0" width="140" height="60" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
    <text x="70" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">混合 + 归档</text>
    <text x="70" y="42" text-anchor="middle" font-size="10" fill="#334155">索引 + zstd 周期归档</text>
    <text x="70" y="55" text-anchor="middle" font-size="9" fill="#475569">按时间 / 项目切分</text>
  </g>
  <g transform="translate(670,260)">
    <rect x="0" y="0" width="110" height="60" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="55" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">混合</text>
    <text x="55" y="42" text-anchor="middle" font-size="10" fill="#334155">高并发 + 检索</text>
    <text x="55" y="55" text-anchor="middle" font-size="9" fill="#475569">双栈标准</text>
  </g>

  <text x="400" y="370" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">反例:把 raw stdout / stderr 当消息塞进 SQLite</text>
  <text x="400" y="392" text-anchor="middle" font-size="11" fill="#475569">Vibe Kanban 2026-02 公开反思: 98% DB 体积是 logs, "database is locked" 高频, 迁出后 GB → 20 MiB</text>
  <text x="400" y="412" text-anchor="middle" font-size="11" fill="#475569">lesson: SQLite 适合结构化元数据, 不适合 append-only KV 日志</text>

  <text x="400" y="448" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">2026 年的答案:不站队。Codex + OpenCode 走"双栈",是工程上最稳的形态。</text>
</svg>
