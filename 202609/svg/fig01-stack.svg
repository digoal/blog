<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="gApp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="gCore" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="gCordis" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="gOs" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#64748b"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="900" height="540" fill="url(#bg)"/>
  <text x="450" y="40" fill="#e2e8f0" text-anchor="middle" font-size="22" font-weight="700">dsh 的栈位图：每层都是插件</text>
  <text x="450" y="62" fill="#94a3b8" text-anchor="middle" font-size="13">products ⇢ base / bundle / core / llm / fs / ... ⇢ cordis ⇢ node 22+</text>

  <!-- 顶部：apps -->
  <g filter="url(#shadow)">
    <rect x="40"  y="100" width="180" height="60" rx="10" fill="url(#gApp)"/>
    <rect x="240" y="100" width="180" height="60" rx="10" fill="url(#gApp)"/>
    <rect x="440" y="100" width="180" height="60" rx="10" fill="url(#gApp)"/>
    <rect x="640" y="100" width="180" height="60" rx="10" fill="url(#gApp)"/>
    <text x="130" y="128" fill="white" text-anchor="middle" font-size="14" font-weight="700">web</text>
    <text x="130" y="148" fill="#bfdbfe" text-anchor="middle" font-size="11">浏览器 + 3080 端口</text>
    <text x="330" y="128" fill="white" text-anchor="middle" font-size="14" font-weight="700">headless</text>
    <text x="330" y="148" fill="#bfdbfe" text-anchor="middle" font-size="11">一次性 CLI</text>
    <text x="530" y="128" fill="white" text-anchor="middle" font-size="14" font-weight="700">sdk</text>
    <text x="530" y="148" fill="#bfdbfe" text-anchor="middle" font-size="11">JSON-RPC + Python</text>
    <text x="730" y="128" fill="white" text-anchor="middle" font-size="14" font-weight="700">acp</text>
    <text x="730" y="148" fill="#bfdbfe" text-anchor="middle" font-size="11">自动化代理</text>
  </g>

  <!-- 中部：bundles -->
  <g filter="url(#shadow)">
    <rect x="120" y="200" width="660" height="50" rx="8" fill="url(#gCore)" opacity="0.92"/>
    <text x="450" y="222" fill="white" text-anchor="middle" font-size="14" font-weight="700">dsh-base  ·  84 行 cordis patch  ·  模型 / 工具 / 持久化 / 沙箱 / 凭据</text>
    <text x="450" y="240" fill="#a7f3d0" text-anchor="middle" font-size="11">被 web/headless/sdk/acp profile 共享   sdk-minimal 是例外(独立配置树)</text>
  </g>

  <!-- 中下：核心包 -->
  <g filter="url(#shadow)">
    <rect x="40"  y="290" width="130" height="50" rx="8" fill="#1f2937" stroke="#374151"/>
    <rect x="190" y="290" width="130" height="50" rx="8" fill="#1f2937" stroke="#374151"/>
    <rect x="340" y="290" width="130" height="50" rx="8" fill="#1f2937" stroke="#374151"/>
    <rect x="490" y="290" width="130" height="50" rx="8" fill="#1f2937" stroke="#374151"/>
    <rect x="640" y="290" width="130" height="50" rx="8" fill="#1f2937" stroke="#374151"/>
    <text x="105" y="312" fill="#e2e8f0" text-anchor="middle" font-size="12" font-weight="600">session</text>
    <text x="105" y="328" fill="#94a3b8" text-anchor="middle" font-size="10">事件溯源日志</text>
    <text x="255" y="312" fill="#e2e8f0" text-anchor="middle" font-size="12" font-weight="600">agent-loop</text>
    <text x="255" y="328" fill="#94a3b8" text-anchor="middle" font-size="10">turn/step driver</text>
    <text x="405" y="312" fill="#e2e8f0" text-anchor="middle" font-size="12" font-weight="600">tools</text>
    <text x="405" y="328" fill="#94a3b8" text-anchor="middle" font-size="10">scope 工具注册表</text>
    <text x="555" y="312" fill="#e2e8f0" text-anchor="middle" font-size="12" font-weight="600">llm</text>
    <text x="555" y="328" fill="#94a3b8" text-anchor="middle" font-size="10">adapter seam</text>
    <text x="705" y="312" fill="#e2e8f0" text-anchor="middle" font-size="12" font-weight="600">fs / shell / jobs</text>
    <text x="705" y="328" fill="#94a3b8" text-anchor="middle" font-size="10">capability seams</text>
  </g>

  <!-- Cordis 底层 -->
  <g filter="url(#shadow)">
    <rect x="180" y="380" width="540" height="50" rx="8" fill="url(#gCordis)"/>
    <text x="450" y="402" fill="white" text-anchor="middle" font-size="14" font-weight="700">Cordis 4.0.2-rc  ·  ctx / Service / 5 种事件分发 / effect 自动回收</text>
    <text x="450" y="420" fill="#fde68a" text-anchor="middle" font-size="11">vendor/cordis  ·  论文 arxiv 2608.25512  ·  一切插件的运行时</text>
  </g>

  <!-- 底部：OS -->
  <g filter="url(#shadow)">
    <rect x="180" y="470" width="540" height="44" rx="8" fill="url(#gOs)"/>
    <text x="450" y="490" fill="white" text-anchor="middle" font-size="13" font-weight="600">Node 22+  ·  Electron(可选)  ·  原生绑定: node-pty / fs-ext / koffi</text>
    <text x="450" y="506" fill="#cbd5e1" text-anchor="middle" font-size="11">Windows ConPTY  ·  Linux Landlock  ·  macOS spawn-helper</text>
  </g>

  <!-- 垂直连线 -->
  <g stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <line x1="130" y1="160" x2="130" y2="195"/>
    <line x1="330" y1="160" x2="330" y2="195"/>
    <line x1="530" y1="160" x2="530" y2="195"/>
    <line x1="730" y1="160" x2="730" y2="195"/>
    <line x1="450" y1="250" x2="450" y2="285"/>
    <line x1="450" y1="340" x2="450" y2="375"/>
    <line x1="450" y1="430" x2="450" y2="465"/>
  </g>

  <!-- 右侧注释 -->
  <text x="40" y="175" fill="#cbd5e1" font-size="11">5 个 profile 共享同一棵插件树</text>
  <text x="40" y="265" fill="#cbd5e1" font-size="11">每行是一行 yaml</text>
  <text x="40" y="355" fill="#cbd5e1" font-size="11">55 个 packages, 0 行特权内核</text>
  <text x="40" y="445" fill="#cbd5e1" font-size="11">ctx.plugin(Loader) → ctx.loader.create(include) → yaml → import → 挂</text>
</svg>
