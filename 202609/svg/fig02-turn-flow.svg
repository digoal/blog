<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="900" height="580" fill="url(#bg2)"/>

  <text x="450" y="40" fill="#e2e8f0" text-anchor="middle" font-size="22" font-weight="700">一个 turn 的内部时序</text>
  <text x="450" y="62" fill="#94a3b8" text-anchor="middle" font-size="13">同一棵事件树里,持久事实落到 session,实时控制流经 agent/* 与 tools/*</text>

  <!-- 列 -->
  <g font-size="12" fill="#cbd5e1" text-anchor="middle">
    <text x="80" y="110">user</text>
    <text x="220" y="110">ReactLoopAgent</text>
    <text x="370" y="110">Hooks</text>
    <text x="490" y="110">Prompt / LLM</text>
    <text x="620" y="110">Tools</text>
    <text x="770" y="110">Session</text>
  </g>

  <!-- 列底色 -->
  <g>
    <line x1="80"  y1="125" x2="80"  y2="510" stroke="#475569" stroke-dasharray="3 3"/>
    <line x1="220" y1="125" x2="220" y2="510" stroke="#475569" stroke-dasharray="3 3"/>
    <line x1="370" y1="125" x2="370" y2="510" stroke="#475569" stroke-dasharray="3 3"/>
    <line x1="490" y1="125" x2="490" y2="510" stroke="#475569" stroke-dasharray="3 3"/>
    <line x1="620" y1="125" x2="620" y2="510" stroke="#475569" stroke-dasharray="3 3"/>
    <line x1="770" y1="125" x2="770" y2="510" stroke="#475569" stroke-dasharray="3 3"/>
  </g>

  <!-- 步骤 -->
  <g font-size="11" fill="#e2e8f0">
    <line x1="80" y1="150" x2="220" y2="150" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr2)"/>
    <text x="120" y="145" fill="#bfdbfe">followup(msg)</text>

    <line x1="220" y1="180" x2="770" y2="180" stroke="#10b981" stroke-width="2" marker-end="url(#arr2)"/>
    <text x="480" y="175" fill="#a7f3d0">turn/start</text>

    <line x1="220" y1="210" x2="370" y2="210" stroke="#f59e0b" stroke-width="2" marker-end="url(#arr2)"/>
    <line x1="370" y1="230" x2="220" y2="230" stroke="#f59e0b" stroke-width="2" marker-end="url(#arr2)"/>
    <text x="275" y="205" fill="#fde68a">agent/pre-step (waterfall)</text>
    <text x="265" y="242" fill="#fde68a">reject | enter(messages)</text>

    <line x1="220" y1="265" x2="770" y2="265" stroke="#10b981" stroke-width="2" marker-end="url(#arr2)"/>
    <text x="460" y="260" fill="#a7f3d0">step/start + user/message</text>

    <line x1="220" y1="295" x2="490" y2="295" stroke="#a78bfa" stroke-width="2" marker-end="url(#arr2)"/>
    <text x="320" y="290" fill="#ddd6fe">system-prompt/assemble</text>

    <line x1="220" y1="325" x2="490" y2="325" stroke="#a78bfa" stroke-width="2" marker-end="url(#arr2)"/>
    <text x="320" y="320" fill="#ddd6fe">agent/request → llm/stream</text>
    <line x1="490" y1="345" x2="220" y2="345" stroke="#a78bfa" stroke-width="2" marker-end="url(#arr2)"/>
    <text x="330" y="340" fill="#ddd6fe">StreamChunk*</text>

    <line x1="220" y1="375" x2="770" y2="375" stroke="#10b981" stroke-width="2" marker-end="url(#arr2)"/>
    <text x="470" y="370" fill="#a7f3d0">assistant/message (含紧凑 stream)</text>

    <line x1="220" y1="405" x2="620" y2="405" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr2)"/>
    <text x="370" y="400" fill="#bfdbfe">tools/pre → execute → post</text>
    <line x1="620" y1="425" x2="770" y2="425" stroke="#10b981" stroke-width="2" marker-end="url(#arr2)"/>
    <text x="690" y="420" fill="#a7f3d0">tool/result</text>

    <line x1="220" y1="455" x2="770" y2="455" stroke="#10b981" stroke-width="2" marker-end="url(#arr2)"/>
    <text x="470" y="450" fill="#a7f3d0">step/end</text>

    <line x1="220" y1="475" x2="370" y2="475" stroke="#f59e0b" stroke-width="2" marker-end="url(#arr2)"/>
    <text x="260" y="470" fill="#fde68a">agent/turn-stopping (serial)</text>

    <line x1="220" y1="500" x2="770" y2="500" stroke="#10b981" stroke-width="2" marker-end="url(#arr2)"/>
    <text x="470" y="495" fill="#a7f3d0">turn/end + agent/status idle</text>
  </g>

  <!-- 图例: 放底部 -->
  <g font-size="11" fill="#cbd5e1">
    <rect x="100" y="535" width="14" height="4" fill="#10b981"/>
    <text x="120" y="542">持久事件 (session)</text>
    <rect x="270" y="535" width="14" height="4" fill="#f59e0b"/>
    <text x="290" y="542">agent/* 决策事件</text>
    <rect x="450" y="535" width="14" height="4" fill="#a78bfa"/>
    <text x="470" y="542">llm/stream</text>
    <rect x="580" y="535" width="14" height="4" fill="#3b82f6"/>
    <text x="600" y="542">tools / 消息入口</text>
  </g>
</svg>
