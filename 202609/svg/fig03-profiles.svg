<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="900" height="580" fill="url(#bg3)"/>

  <text x="450" y="40" fill="#e2e8f0" text-anchor="middle" font-size="22" font-weight="700">5 个 profile · 同一棵插件树</text>
  <text x="450" y="62" fill="#94a3b8" text-anchor="middle" font-size="13">patch 按 id 定位条目并替换整个 config,后写者胜出</text>

  <!-- 左侧空白 profile -->
  <g filter="url(#shadow3)">
    <rect x="40" y="100" width="100" height="440" rx="10" fill="#1f2937" stroke="#374151"/>
    <text x="90" y="125" fill="#cbd5e1" text-anchor="middle" font-size="12" font-weight="700">profile</text>
    <text x="90" y="142" fill="#94a3b8" text-anchor="middle" font-size="10">empty list</text>
  </g>

  <!-- dsh-base -->
  <g filter="url(#shadow3)">
    <rect x="160" y="100" width="220" height="100" rx="10" fill="#065f46" stroke="#10b981"/>
    <text x="270" y="125" fill="#a7f3d0" text-anchor="middle" font-size="13" font-weight="700">dsh-base</text>
    <text x="270" y="145" fill="#d1fae5" text-anchor="middle" font-size="10">模型/工具/持久化/沙箱/凭据/遥测</text>
    <text x="270" y="160" fill="#d1fae5" text-anchor="middle" font-size="10">84 行 cordis.patch.yml</text>
    <text x="270" y="180" fill="#6ee7b7" text-anchor="middle" font-size="10">被下面 4 个 profile 共享</text>
  </g>

  <!-- dsh-web-app -->
  <g filter="url(#shadow3)">
    <rect x="400" y="100" width="220" height="80" rx="10" fill="#1e3a8a" stroke="#3b82f6"/>
    <text x="510" y="125" fill="#bfdbfe" text-anchor="middle" font-size="13" font-weight="700">dsh-web-app</text>
    <text x="510" y="145" fill="#dbeafe" text-anchor="middle" font-size="10">+ 浏览器 UI (端口 3080)</text>
    <text x="510" y="160" fill="#dbeafe" text-anchor="middle" font-size="10">完整会话侧栏 / 子代理浏览器</text>
  </g>

  <!-- dsh-headless -->
  <g filter="url(#shadow3)">
    <rect x="400" y="200" width="220" height="60" rx="10" fill="#374151" stroke="#64748b"/>
    <text x="510" y="222" fill="#cbd5e1" text-anchor="middle" font-size="13" font-weight="700">dsh-headless</text>
    <text x="510" y="240" fill="#e2e8f0" text-anchor="middle" font-size="10">一次性 CLI,不开 server</text>
  </g>

  <!-- dsh-sdk-app -->
  <g filter="url(#shadow3)">
    <rect x="400" y="280" width="220" height="60" rx="10" fill="#5b21b6" stroke="#a78bfa"/>
    <text x="510" y="302" fill="#ddd6fe" text-anchor="middle" font-size="13" font-weight="700">dsh-sdk-app</text>
    <text x="510" y="320" fill="#ede9fe" text-anchor="middle" font-size="10">JSON-RPC over stdio</text>
  </g>

  <!-- dsh-acp-app -->
  <g filter="url(#shadow3)">
    <rect x="400" y="360" width="220" height="60" rx="10" fill="#9f1239" stroke="#fb7185"/>
    <text x="510" y="382" fill="#fecdd3" text-anchor="middle" font-size="13" font-weight="700">dsh-acp-app</text>
    <text x="510" y="400" fill="#ffe4e6" text-anchor="middle" font-size="10">只服务自动化的 ACP server</text>
  </g>

  <!-- 右侧例外 -->
  <g filter="url(#shadow3)">
    <rect x="640" y="100" width="220" height="120" rx="10" fill="#7c2d12" stroke="#fb923c"/>
    <text x="750" y="125" fill="#fed7aa" text-anchor="middle" font-size="13" font-weight="700">dsh-sdk-minimal (例外)</text>
    <text x="750" y="145" fill="#ffedd5" text-anchor="middle" font-size="10">不挂 dsh-base</text>
    <text x="750" y="160" fill="#ffedd5" text-anchor="middle" font-size="10">一份完整显式 SDK 配置树</text>
    <text x="750" y="185" fill="#fdba74" text-anchor="middle" font-size="10">极简示例 / Python 起步选这个</text>
  </g>

  <!-- patch overlay -->
  <g filter="url(#shadow3)">
    <rect x="160" y="220" width="220" height="60" rx="10" fill="#1f2937" stroke="#94a3b8"/>
    <text x="270" y="242" fill="#e2e8f0" text-anchor="middle" font-size="13" font-weight="700">profile 的 cordis.patch.yml</text>
    <text x="270" y="260" fill="#cbd5e1" text-anchor="middle" font-size="10">按 id 替换 base 里的某一行</text>
  </g>

  <g filter="url(#shadow3)">
    <rect x="160" y="300" width="220" height="60" rx="10" fill="#1f2937" stroke="#94a3b8"/>
    <text x="270" y="322" fill="#e2e8f0" text-anchor="middle" font-size="13" font-weight="700">Harness home 的 patch</text>
    <text x="270" y="340" fill="#cbd5e1" text-anchor="middle" font-size="10">用户自己的默认 (--patch 可覆盖)</text>
  </g>

  <g filter="url(#shadow3)">
    <rect x="160" y="380" width="220" height="60" rx="10" fill="#1f2937" stroke="#94a3b8"/>
    <text x="270" y="402" fill="#e2e8f0" text-anchor="middle" font-size="13" font-weight="700">--patch overlay (CLI)</text>
    <text x="270" y="420" fill="#cbd5e1" text-anchor="middle" font-size="10">本次启动覆盖项</text>
  </g>

  <!-- 右侧底部 -->
  <g filter="url(#shadow3)">
    <rect x="640" y="240" width="220" height="80" rx="10" fill="#0f172a" stroke="#64748b"/>
    <text x="750" y="262" fill="#e2e8f0" text-anchor="middle" font-size="12" font-weight="700">启应用入口</text>
    <text x="750" y="282" fill="#cbd5e1" text-anchor="middle" font-size="10">dsh web</text>
    <text x="750" y="298" fill="#cbd5e1" text-anchor="middle" font-size="10">dsh --profile headless/sdk/acp</text>
  </g>

  <g filter="url(#shadow3)">
    <rect x="640" y="340" width="220" height="60" rx="10" fill="#0f172a" stroke="#64748b"/>
    <text x="750" y="362" fill="#e2e8f0" text-anchor="middle" font-size="12" font-weight="700">看自己的配置树</text>
    <text x="750" y="380" fill="#cbd5e1" text-anchor="middle" font-size="10">dsh --profile web --dump-config</text>
  </g>

  <!-- 箭头 -->
  <g stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arr2)">
    <line x1="140" y1="120" x2="158" y2="120"/>
    <line x1="380" y1="120" x2="398" y2="120"/>
    <line x1="380" y1="220" x2="398" y2="220"/>
    <line x1="380" y1="300" x2="398" y2="300"/>
    <line x1="380" y1="380" x2="398" y2="380"/>
    <line x1="620" y1="160" x2="638" y2="160"/>
  </g>

  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- 顺序标注 -->
  <text x="450" y="525" fill="#cbd5e1" text-anchor="middle" font-size="13">叠加顺序: base → profile bundle → profile patch → home patch → --patch overlay</text>
  <text x="450" y="548" fill="#94a3b8" text-anchor="middle" font-size="11">后写者覆盖前写者;web profile 支持实时重载,headless/sdk/sdk-minimal/acp 仅启动时一次性应用</text>
</svg>
