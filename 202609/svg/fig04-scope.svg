<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <marker id="arr4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="900" height="540" fill="url(#bg4)"/>

  <text x="450" y="40" fill="#e2e8f0" text-anchor="middle" font-size="22" font-weight="700">scope-key：按 agent 隔离的最小原语</text>
  <text x="450" y="62" fill="#94a3b8" text-anchor="middle" font-size="13">type ScopeKey = object — 身份即一切,从不检视对象</text>

  <!-- Agent A -->
  <g filter="url(#shadow4)">
    <rect x="40" y="100" width="380" height="190" rx="12" fill="#1f2937" stroke="#3b82f6"/>
    <text x="60" y="125" fill="#bfdbfe" font-size="14" font-weight="700">Agent A  ·  agent.ctx (scope-key = A)</text>
    <text x="60" y="148" fill="#cbd5e1" font-size="11">私有注册项(由 registerPluginOnScope 注入):</text>
    <rect x="60" y="160" width="160" height="22" rx="4" fill="#1e3a8a"/>
    <text x="140" y="175" fill="white" text-anchor="middle" font-size="11">tool:foo (replace global foo)</text>
    <rect x="60" y="190" width="180" height="22" rx="4" fill="#1e3a8a"/>
    <text x="150" y="205" fill="white" text-anchor="middle" font-size="11">prompt 段 persona-A (override)</text>
    <rect x="60" y="220" width="220" height="22" rx="4" fill="#1e3a8a"/>
    <text x="170" y="235" fill="white" text-anchor="middle" font-size="11">listener: agent/* (thisArg=A)</text>
    <text x="60" y="262" fill="#94a3b8" font-size="10">shadowing: 命名冲突时最具体者胜出</text>
  </g>

  <!-- Agent B -->
  <g filter="url(#shadow4)">
    <rect x="480" y="100" width="380" height="190" rx="12" fill="#1f2937" stroke="#10b981"/>
    <text x="500" y="125" fill="#a7f3d0" font-size="14" font-weight="700">Agent B  ·  agent.ctx (scope-key = B)</text>
    <text x="500" y="148" fill="#cbd5e1" font-size="11">私有注册项:</text>
    <rect x="500" y="160" width="160" height="22" rx="4" fill="#065f46"/>
    <text x="580" y="175" fill="white" text-anchor="middle" font-size="11">tool:foo (replace global foo)</text>
    <rect x="500" y="190" width="180" height="22" rx="4" fill="#065f46"/>
    <text x="590" y="205" fill="white" text-anchor="middle" font-size="11">prompt 段 persona-B (override)</text>
    <text x="500" y="262" fill="#94a3b8" font-size="10">互不可见,dispose 时一并撤销</text>
  </g>

  <!-- Global -->
  <g filter="url(#shadow4)">
    <rect x="40" y="320" width="820" height="120" rx="12" fill="#0f172a" stroke="#64748b"/>
    <text x="60" y="345" fill="#cbd5e1" font-size="14" font-weight="700">Global layer  ·  ctx (no scope-key)</text>
    <text x="60" y="368" fill="#94a3b8" font-size="11">所有 agent 默认可见:</text>
    <rect x="60"  y="380" width="120" height="22" rx="4" fill="#1f2937" stroke="#475569"/>
    <text x="120" y="395" fill="#cbd5e1" text-anchor="middle" font-size="11">tool:bash</text>
    <rect x="200" y="380" width="120" height="22" rx="4" fill="#1f2937" stroke="#475569"/>
    <text x="260" y="395" fill="#cbd5e1" text-anchor="middle" font-size="11">tool:read</text>
    <rect x="340" y="380" width="120" height="22" rx="4" fill="#1f2937" stroke="#475569"/>
    <text x="400" y="395" fill="#cbd5e1" text-anchor="middle" font-size="11">tool:grep</text>
    <rect x="480" y="380" width="140" height="22" rx="4" fill="#1f2937" stroke="#475569"/>
    <text x="550" y="395" fill="#cbd5e1" text-anchor="middle" font-size="11">tool:web-fetch</text>
    <text x="60" y="425" fill="#94a3b8" font-size="10">scope carrier 携带 thisArg,B 没注册 listener 时,A 发出的 agent/* 只唤醒 A 自己的监听器</text>
  </g>

  <!-- 底部说明 -->
  <text x="450" y="475" fill="#e2e8f0" text-anchor="middle" font-size="13" font-weight="600">两个事实决定同一件事:scope 可见性 + effect 所有权(dispose 时一并撤销)</text>
  <text x="450" y="498" fill="#94a3b8" text-anchor="middle" font-size="11">scope 是扁平的两层:global + 恰好一个 scope-key。不存在继承链,父子关系走 lineage 数据,不混在 scope 里</text>
  <text x="450" y="518" fill="#94a3b8" text-anchor="middle" font-size="11">carrier 与主体解耦:event payload 携带真实主体;`thisArg` 只是路由,不暴露对象属性</text>
</svg>
