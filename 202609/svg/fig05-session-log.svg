<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow5" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <marker id="arr5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="900" height="540" fill="url(#bg5)"/>

  <text x="450" y="40" fill="#e2e8f0" text-anchor="middle" font-size="22" font-weight="700">JSONL vN · 不可变 generation 文件 + migration 链</text>
  <text x="450" y="62" fill="#94a3b8" text-anchor="middle" font-size="13">已提交路径绝不重命名、替换或删除 — 任何 fault 都可重放回前一个真源</text>

  <!-- 磁盘 layout -->
  <g filter="url(#shadow5)">
    <rect x="40" y="100" width="320" height="380" rx="12" fill="#1f2937" stroke="#475569"/>
    <text x="60" y="125" fill="#e2e8f0" font-size="14" font-weight="700">Session 目录</text>
    <text x="60" y="148" fill="#94a3b8" font-size="11">$DSH_HOME/sessions/&lt;id&gt;/</text>

    <rect x="60" y="170" width="280" height="40" rx="4" fill="#1e3a8a" stroke="#3b82f6"/>
    <text x="200" y="190" fill="white" text-anchor="middle" font-size="12" font-weight="600">session.v0.jsonl.zstd</text>
    <text x="200" y="204" fill="#bfdbfe" text-anchor="middle" font-size="9">旧格式 (示例)</text>

    <rect x="60" y="225" width="280" height="40" rx="4" fill="#065f46" stroke="#10b981"/>
    <text x="200" y="245" fill="white" text-anchor="middle" font-size="12" font-weight="600">session.v1.jsonl.zstd</text>
    <text x="200" y="259" fill="#a7f3d0" text-anchor="middle" font-size="9">当前 generation (只读)</text>

    <rect x="60" y="280" width="280" height="40" rx="4" fill="#7c2d12" stroke="#fb923c"/>
    <text x="200" y="300" fill="white" text-anchor="middle" font-size="12" font-weight="600">session.v2.jsonl.zstd</text>
    <text x="200" y="314" fill="#fed7aa" text-anchor="middle" font-size="9">未来 (写开启新 generation)</text>

    <text x="60" y="345" fill="#94a3b8" font-size="10">v0 → v1: 由一个 v0→v1 migration 包负责</text>
    <text x="60" y="360" fill="#94a3b8" font-size="10">v1 → v2: 一个独立 migration 包,绝不跨代</text>
    <text x="60" y="380" fill="#cbd5e1" font-size="10">stat / list: 选数值最高的规范 generation</text>
    <text x="60" y="395" fill="#cbd5e1" font-size="10">open (只读): decode + 静态邻接迁移链</text>
    <text x="60" y="410" fill="#cbd5e1" font-size="10">open (写): encode + 排他发布新 generation</text>
    <text x="60" y="430" fill="#cbd5e1" font-size="10">未封住的普通中断尾部:由 handle 修复</text>
    <text x="60" y="445" fill="#cbd5e1" font-size="10">下一 turn/start 已封住:插入缺失 turn/end</text>
    <text x="60" y="465" fill="#94a3b8" font-size="10">migration 只插一次,build 时静态邻接链确定</text>
  </g>

  <!-- 右侧：模型看到的 -->
  <g filter="url(#shadow5)">
    <rect x="400" y="100" width="460" height="200" rx="12" fill="#1f2937" stroke="#a78bfa"/>
    <text x="420" y="125" fill="#e2e8f0" font-size="14" font-weight="700">从日志投影出的"模型所见"</text>
    <text x="420" y="148" fill="#cbd5e1" font-size="11">每条 assistant/message 都嵌入精确紧凑带时间 stream</text>

    <rect x="420" y="165" width="200" height="26" rx="4" fill="#312e81"/>
    <text x="520" y="183" fill="white" text-anchor="middle" font-size="11">turn/start  ·  seq=N</text>
    <rect x="630" y="165" width="210" height="26" rx="4" fill="#1e3a8a"/>
    <text x="735" y="183" fill="white" text-anchor="middle" font-size="11">user/message (entered)</text>

    <rect x="420" y="195" width="200" height="26" rx="4" fill="#5b21b6"/>
    <text x="520" y="213" fill="white" text-anchor="middle" font-size="11">step/start</text>
    <rect x="630" y="195" width="210" height="26" rx="4" fill="#7c2d12"/>
    <text x="735" y="213" fill="white" text-anchor="middle" font-size="11">assistant/attempt (失败)</text>

    <rect x="420" y="225" width="200" height="26" rx="4" fill="#5b21b6"/>
    <text x="520" y="243" fill="white" text-anchor="middle" font-size="11">step/end</text>
    <rect x="630" y="225" width="210" height="26" rx="4" fill="#065f46"/>
    <text x="735" y="243" fill="white" text-anchor="middle" font-size="11">assistant/message (成功 + 嵌入 stream)</text>

    <rect x="420" y="255" width="200" height="26" rx="4" fill="#5b21b6"/>
    <text x="520" y="273" fill="white" text-anchor="middle" font-size="11">tool/call</text>
    <rect x="630" y="255" width="210" height="26" rx="4" fill="#065f46"/>
    <text x="735" y="273" fill="white" text-anchor="middle" font-size="11">tool/result</text>

    <rect x="420" y="285" width="200" height="26" rx="4" fill="#312e81"/>
    <text x="520" y="303" fill="white" text-anchor="middle" font-size="11">turn/end  ·  seq=M</text>
    <rect x="630" y="285" width="210" height="26" rx="4" fill="#312e81"/>
    <text x="735" y="303" fill="white" text-anchor="middle" font-size="11">...</text>
  </g>

  <!-- 不变量 -->
  <g filter="url(#shadow5)">
    <rect x="400" y="330" width="460" height="150" rx="12" fill="#0f172a" stroke="#94a3b8"/>
    <text x="420" y="355" fill="#e2e8f0" font-size="14" font-weight="700">运行时不变式</text>
    <text x="420" y="378" fill="#cbd5e1" font-size="11">模型可见即已记录:抵达模型请求的一切必须能从日志重建</text>
    <text x="420" y="395" fill="#cbd5e1" font-size="11">新增模型可见输入 → 扩展 SessionEventMap,从不绕过日志</text>
    <text x="420" y="412" fill="#cbd5e1" font-size="11">fork / 恢复 / transcript / 遥测 都从这些 settlement 派生</text>
    <text x="420" y="429" fill="#cbd5e1" font-size="11">实时 UI 增量来自 agent/assistant-stream,不污染日志</text>
    <text x="420" y="446" fill="#94a3b8" font-size="10">Settlement 前硬中断 → 不留持久 attempt stream(刻意)</text>
    <text x="420" y="462" fill="#94a3b8" font-size="10">· 这就是为什么 session 目录从不"压缩重写" — 故障可回退</text>
  </g>

  <text x="450" y="510" fill="#94a3b8" text-anchor="middle" font-size="11">generation 数字 = 真源版本;迁移 = 编译期邻接链,每跳一步,跨代不允许</text>
</svg>
