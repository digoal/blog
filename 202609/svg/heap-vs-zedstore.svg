<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="heapBg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#374151"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="zsBg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#0c4a6e"/>
      <stop offset="1" stop-color="#082f49"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/>
    </marker>
  </defs>

  <rect width="1280" height="760" fill="#fafafa"/>

  <rect x="0" y="0" width="1280" height="74" fill="#0f172a"/>
  <text x="40" y="34" fill="#f8fafc" font-size="22" font-weight="700">Heap vs ZedStore · 一行 5 列 vs 一列 N 行</text>
  <text x="40" y="58" fill="#94a3b8" font-size="13">同一 sensor 表的物理布局对比 · IO 差异肉眼可见</text>

  <!-- Heap -->
  <g filter="url(#softShadow)">
    <rect x="40" y="100" width="600" height="540" rx="12" fill="url(#heapBg)" stroke="#0f172a" stroke-width="2"/>
    <text x="340" y="130" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">PG 原生 Heap</text>
    <text x="340" y="150" text-anchor="middle" fill="#cbd5e1" font-size="12">1 个 heap 文件 + 1 个 toast 文件 + 索引</text>

    <rect x="60" y="170" width="560" height="60" rx="6" fill="#4b5563" stroke="#0f172a"/>
    <text x="80" y="192" fill="#f8fafc" font-size="13" font-weight="600">Heap page (8 KB)</text>
    <text x="80" y="210" fill="#cbd5e1" font-size="10">line pointer 数组 + tuple header + 列值</text>
    <text x="80" y="224" fill="#cbd5e1" font-size="10">SELECT temp → 读 1 页但解出 4 个不用的字段</text>

    <rect x="60" y="245" width="560" height="50" rx="6" fill="#4b5563" stroke="#0f172a"/>
    <text x="80" y="266" fill="#f8fafc" font-size="13" font-weight="600">c1_id | c2_ts | c3_temp | c4_hum | c5_dev | xmin/xmax/ctid</text>
    <text x="80" y="283" fill="#cbd5e1" font-size="10">每行都把这些字段都序列化, 读 temp 必须把其余全反序列化</text>

    <rect x="60" y="305" width="560" height="50" rx="6" fill="#4b5563" stroke="#0f172a"/>
    <text x="80" y="326" fill="#f8fafc" font-size="13" font-weight="600">c1_id | c2_ts | c3_temp | c4_hum | c5_dev | xmin/xmax/ctid</text>
    <text x="80" y="343" fill="#cbd5e1" font-size="10">同上</text>

    <rect x="60" y="365" width="560" height="50" rx="6" fill="#4b5563" stroke="#0f172a"/>
    <text x="80" y="386" fill="#f8fafc" font-size="13" font-weight="600">c1_id | c2_ts | c3_temp | c4_hum | c5_dev | xmin/xmax/ctid</text>
    <text x="80" y="403" fill="#cbd5e1" font-size="10">同上</text>

    <rect x="60" y="430" width="270" height="60" rx="6" fill="#991b1b" stroke="#0f172a"/>
    <text x="195" y="450" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="600">独立 TOAST 表</text>
    <text x="195" y="466" text-anchor="middle" fill="#fecaca" font-size="10">pg_toast.pg_toast_xxx</text>
    <text x="195" y="480" text-anchor="middle" fill="#fecaca" font-size="10">20 字节内引用 + heap + index</text>

    <rect x="340" y="430" width="280" height="60" rx="6" fill="#831843" stroke="#0f172a"/>
    <text x="480" y="450" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="600">独立索引 (b-tree)</text>
    <text x="480" y="466" text-anchor="middle" fill="#fbcfe8" font-size="10">每个索引一个文件</text>
    <text x="480" y="480" text-anchor="middle" fill="#fbcfe8" font-size="10">c1_id 上一个 BTree 文件</text>

    <rect x="60" y="510" width="560" height="100" rx="6" fill="#1f2937" stroke="#fde68a"/>
    <text x="80" y="532" fill="#fde68a" font-size="13" font-weight="700">读 temp 时的实际 IO</text>
    <text x="80" y="552" fill="#e2e8f0" font-size="11">▸ 必须读 heap 页 (整行被读, 解析整行)</text>
    <text x="80" y="570" fill="#e2e8f0" font-size="11">▸ 大字段还要读 toast 文件</text>
    <text x="80" y="588" fill="#e2e8f0" font-size="11">▸ 用索引时还要读索引文件 → 4 个文件来回跳</text>
    <text x="80" y="606" fill="#fca5a5" font-size="11" font-weight="600">▶ Heap 用了 100% 的 IO 带宽却只取 20% 的列数据</text>
  </g>

  <!-- ZedStore -->
  <g filter="url(#softShadow)">
    <rect x="660" y="100" width="580" height="540" rx="12" fill="url(#zsBg)" stroke="#0f172a" stroke-width="2"/>
    <text x="950" y="130" text-anchor="middle" fill="#f0f9ff" font-size="18" font-weight="700">ZedStore (列存)</text>
    <text x="950" y="150" text-anchor="middle" fill="#bae6fd" font-size="12">1 个文件里混居 meta/TID/属性树/UNDO/toast</text>

    <rect x="680" y="170" width="540" height="60" rx="6" fill="#0c4a6e" stroke="#0f172a"/>
    <text x="700" y="192" fill="#f0f9ff" font-size="13" font-weight="600">TID 树叶子 (attno=0)</text>
    <text x="700" y="210" fill="#bae6fd" font-size="10">ZSTidArrayItem · Simple-8b · UNDO slot</text>
    <text x="700" y="224" fill="#bae6fd" font-size="10">每条只存 TID + 4 slot, 顺序扫出可见 TID</text>

    <rect x="680" y="245" width="130" height="40" rx="6" fill="#9a3412"/>
    <text x="745" y="262" text-anchor="middle" fill="#ffedd5" font-size="10" font-weight="600">attno=1 c1_id</text>
    <text x="745" y="278" text-anchor="middle" fill="#fed7aa" font-size="9">本查询完全不读</text>

    <rect x="820" y="245" width="130" height="40" rx="6" fill="#9a3412"/>
    <text x="885" y="262" text-anchor="middle" fill="#ffedd5" font-size="10" font-weight="600">attno=2 c2_ts</text>
    <text x="885" y="278" text-anchor="middle" fill="#fed7aa" font-size="9">本查询完全不读</text>

    <rect x="960" y="245" width="260" height="40" rx="6" fill="#ea580c" stroke="#fde68a" stroke-width="2"/>
    <text x="1090" y="262" text-anchor="middle" fill="#fff7ed" font-size="11" font-weight="700">attno=3 c3_temp (目标)</text>
    <text x="1090" y="278" text-anchor="middle" fill="#fde68a" font-size="9">lower+upper LZ4 attstream</text>

    <rect x="680" y="295" width="540" height="40" rx="6" fill="#1a2e05" stroke="#0f172a"/>
    <text x="700" y="316" fill="#ecfccb" font-size="11" font-weight="600">UNDO log (head→tail, INSERT/DELETE/UPDATE 记录)</text>
    <text x="700" y="330" fill="#d9f99d" font-size="9">走 UNDO slot 的可见性, 不破坏属性树的内容</text>

    <rect x="680" y="345" width="540" height="40" rx="6" fill="#3b0764" stroke="#0f172a"/>
    <text x="700" y="366" fill="#f5d0fe" font-size="11" font-weight="600">TOAST page 链 (同文件)</text>
    <text x="700" y="380" fill="#e9d5ff" font-size="9">大字段也存本文件 → 无独立 pg_toast 表</text>

    <rect x="680" y="395" width="540" height="55" rx="6" fill="#082f49" stroke="#0f172a"/>
    <text x="700" y="416" fill="#f0f9ff" font-size="12" font-weight="600">buffer cache + WAL</text>
    <text x="700" y="432" fill="#bae6fd" font-size="10">buffer cache 缓存压缩块 · WAL FPI 也是压缩块</text>
    <text x="700" y="446" fill="#bae6fd" font-size="10">压缩可跨 cache/WAL/复制 一致复用</text>

    <rect x="680" y="465" width="540" height="40" rx="6" fill="#082f49" stroke="#0f172a"/>
    <text x="700" y="486" fill="#f0f9ff" font-size="12" font-weight="600">原生 PG b-tree 索引 (attno=1 c1_id 上)</text>
    <text x="700" y="500" fill="#bae6fd" font-size="10">索引存 TID, 命中后再去 TID/属性树抓值</text>

    <rect x="680" y="520" width="540" height="100" rx="6" fill="#082f49" stroke="#fde68a"/>
    <text x="700" y="542" fill="#fde68a" font-size="13" font-weight="700">读 temp 时的实际 IO</text>
    <text x="700" y="562" fill="#e0f2fe" font-size="11">▸ 顺序扫 TID 树 → 拿到可见 TID 集合</text>
    <text x="700" y="580" fill="#e0f2fe" font-size="11">▸ 按 TID 走 attno=3 的列树叶子 → LZ4 解压</text>
    <text x="700" y="598" fill="#e0f2fe" font-size="11">▸ 大字段查本文件 toast 链 → 无跨文件 IO</text>
    <text x="700" y="616" fill="#86efac" font-size="11" font-weight="600">▶ 5 列只读 1 列 → 实际 I/O ≈ Heap 的 1/N</text>
  </g>

  <!-- arrow connecting -->
  <line x1="640" y1="370" x2="660" y2="370" stroke="#0f172a" stroke-width="3" marker-end="url(#arr)"/>
  <text x="650" y="360" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="700">替换</text>

  <!-- bottom callout -->
  <rect x="40" y="660" width="1200" height="80" rx="12" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
  <text x="60" y="690" fill="#22d3ee" font-size="16" font-weight="700">经验法则</text>
  <text x="60" y="712" fill="#e2e8f0" font-size="13">▸ 宽表 (几十列) + 只 SELECT 几列的分析场景: 列存节省的 IO 是 (1 - 取列数/总列数) × 全行 IO</text>
  <text x="60" y="730" fill="#e2e8f0" font-size="13">▸ 高频单行 update / 索引点查场景: TID 树 + 多列树来回的代价 > Heap, 列存反而更慢 (zheap 才是为此设计)</text>
</svg>