<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="800" height="540" fill="#fafafa"/>
  <text x="400" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">第三条路:JSONL 当真源 + SQLite 当索引</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#475569">Codex CLI 已经在用, 我自己测了 13.6 ms 增量 / 1.6 s 冷建</text>

  <!-- 3 column flow -->
  <g transform="translate(40,100)">
    <rect x="0" y="0" width="200" height="160" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" rx="8"/>
    <text x="100" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">真源</text>
    <text x="100" y="46" text-anchor="middle" font-size="12" fill="#1e3a8a">JSONL 文件</text>
    <text x="100" y="76" text-anchor="middle" font-size="11" fill="#334155">每 session 一文件</text>
    <text x="100" y="96" text-anchor="middle" font-size="11" fill="#334155">append-only</text>
    <text x="100" y="116" text-anchor="middle" font-size="11" fill="#334155">人可读 / cat / rg</text>
    <text x="100" y="140" text-anchor="middle" font-size="11" font-weight="700" fill="#10b981">删库重建零损失</text>
  </g>

  <g transform="translate(300,100)">
    <text x="0" y="0" text-anchor="middle" font-size="32" font-weight="700" fill="#0f172a">+</text>
    <rect x="0" y="40" width="200" height="160" fill="#fef3c7" stroke="#d97706" stroke-width="2" rx="8"/>
    <text x="100" y="66" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">派生物</text>
    <text x="100" y="86" text-anchor="middle" font-size="12" fill="#92400e">SQLite 索引</text>
    <text x="100" y="116" text-anchor="middle" font-size="11" fill="#334155">存 (file, byte_offset)</text>
    <text x="100" y="136" text-anchor="middle" font-size="11" fill="#334155">FTS5 + 聚合列</text>
    <text x="100" y="156" text-anchor="middle" font-size="11" fill="#334155">水位表 (file, bytes)</text>
    <text x="100" y="180" text-anchor="middle" font-size="11" font-weight="700" fill="#d97706">丢了不心疼</text>
  </g>

  <g transform="translate(560,100)">
    <text x="0" y="0" text-anchor="middle" font-size="32" font-weight="700" fill="#0f172a">=</text>
    <rect x="0" y="40" width="200" height="160" fill="#d1fae5" stroke="#059669" stroke-width="2" rx="8"/>
    <text x="100" y="66" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">两全</text>
    <text x="100" y="86" text-anchor="middle" font-size="12" fill="#065f46">"Codex 形态"</text>
    <text x="100" y="116" text-anchor="middle" font-size="11" fill="#334155">FTS5 search 0.28 ms</text>
    <text x="100" y="136" text-anchor="middle" font-size="11" fill="#334155">seek 原行 0.03 ms</text>
    <text x="100" y="156" text-anchor="middle" font-size="11" fill="#334155">聚合 7.6 ms</text>
    <text x="100" y="180" text-anchor="middle" font-size="11" font-weight="700" fill="#059669">真源永远可救</text>
  </g>

  <!-- cost & benefit panel -->
  <g transform="translate(40,300)">
    <rect x="0" y="0" width="720" height="200" fill="#f8fafc" stroke="#475569" stroke-width="1.5" rx="8"/>
    <text x="20" y="28" font-size="14" font-weight="700" fill="#0f172a">实测量化</text>
    <g transform="translate(20,48)">
      <text x="0" y="0" font-size="12" font-weight="700" fill="#1d4ed8">代价</text>
      <text x="0" y="22" font-size="11" fill="#334155">• 冷建索引 1.65 s 扫 41.4 MB → 25 MB/s, 索引 42 MB(约等于源大小 102%)</text>
      <text x="0" y="42" font-size="11" fill="#334155">• 增量索引 13.6 ms, 只扫水位之后字节(实测 121× 加速)</text>
      <text x="0" y="62" font-size="11" fill="#334155">• 索引 42 MB ≈ 真源 41 MB, FTS5 再加 28% 体积</text>
      <text x="0" y="82" font-size="11" fill="#334155">• 双写窗口: 进程崩溃时索引可能落后真源 1~N 条 (与 append 频率相关)</text>
    </g>
    <g transform="translate(380,48)">
      <text x="0" y="0" font-size="12" font-weight="700" fill="#059669">收益</text>
      <text x="0" y="22" font-size="11" fill="#334155">• 跨 session FTS5 检索 0.28 ms (vs python 132 ms, vs rg 12 ms)</text>
      <text x="0" y="42" font-size="11" fill="#334155">• 命中后 seek 原行 0.03 ms, 拿到原始 JSONL 完整内容</text>
      <text x="0" y="62" font-size="11" fill="#334155">• 索引坏 = 删掉重建, 真源 0 字节变动, 1.6 s 恢复</text>
      <text x="0" y="82" font-size="11" fill="#334155">• 真源仍可 cat / grep / git diff / scp, 不被 DB 锁死</text>
    </g>
    <text x="20" y="170" font-size="12" font-weight="700" fill="#0f172a">这就是 Codex CLI (state_5.sqlite + rollout jsonl) 已经在用的形态。 也是 OpenCode 2026-02 反向迁回想要解决的问题。</text>
  </g>
</svg>
