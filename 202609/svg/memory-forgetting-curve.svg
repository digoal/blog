<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fecaca"/>
      <stop offset="100%" stop-color="#fca5a5"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="800" height="480" fill="#fafafa"/>

  <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">Memory Forgetting Curve + Outcome-aware Decay</text>
  <text x="400" y="52" text-anchor="middle" font-size="12" fill="#6b7280">Ebbinghaus + Memory Decay Lifecycle in PG</text>

  <g transform="translate(80,90)">
    <line x1="0" y1="320" x2="640" y2="320" stroke="#374151" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="0" y2="320" stroke="#374151" stroke-width="1.5"/>
    <polygon points="640,320 632,316 632,324" fill="#374151"/>
    <polygon points="0,0 -4,8 4,8" fill="#374151"/>

    <text x="320" y="345" text-anchor="middle" font-size="11" fill="#374151">time (days) →</text>
    <text x="-30" y="160" text-anchor="middle" font-size="11" fill="#374151" transform="rotate(-90,-30,160)">memory retention</text>

    <path d="M 0,20 Q 50,40 100,80 T 200,180 T 300,250 T 400,285 T 600,310" stroke="#94a3b8" stroke-width="2" fill="none" stroke-dasharray="4,3"/>
    <text x="610" y="318" font-size="11" fill="#64748b">无反馈 (Ebbinghaus 默认)</text>

    <path d="M 0,20 C 60,40 100,50 140,55 S 250,70 320,90 S 480,130 540,150 S 620,180 640,195" stroke="url(#g1)" stroke-width="3.5" fill="none"/>
    <text x="500" y="135" font-size="11" fill="#92400e" font-weight="600">outcome=helpful (强化)</text>
    <circle cx="200" cy="60" r="5" fill="#f59e0b"/>
    <circle cx="350" cy="95" r="5" fill="#f59e0b"/>

    <path d="M 0,20 C 40,90 80,140 130,200 S 240,280 320,295 S 500,310 600,315" stroke="url(#g2)" stroke-width="3" fill="none"/>
    <text x="430" y="265" font-size="11" fill="#9a3412" font-weight="600">outcome=neutral (标准衰减)</text>
    <circle cx="150" cy="195" r="5" fill="#ea580c"/>

    <path d="M 0,20 C 30,140 60,240 100,295 S 200,318 280,318" stroke="url(#g3)" stroke-width="3" fill="none"/>
    <text x="240" y="270" font-size="11" fill="#991b1b" font-weight="600">outcome=misleading (加速遗忘)</text>
    <circle cx="80" cy="265" r="5" fill="#dc2626"/>
    <circle cx="140" cy="298" r="5" fill="#dc2626"/>

    <line x1="0" y1="20" x2="640" y2="20" stroke="#dc2626" stroke-width="0.8" stroke-dasharray="2,2" opacity="0.5"/>
    <text x="640" y="14" font-size="10" fill="#dc2626">retention=1.0 (initial)</text>

    <line x1="0" y1="170" x2="640" y2="170" stroke="#6b7280" stroke-width="0.5" stroke-dasharray="2,4" opacity="0.4"/>
    <text x="645" y="173" font-size="9" fill="#6b7280">recalled threshold</text>

    <text x="80" y="335" font-size="9" fill="#6b7280">0</text>
    <text x="180" y="335" font-size="9" fill="#6b7280">7d</text>
    <text x="280" y="335" font-size="9" fill="#6b7280">30d</text>
    <text x="380" y="335" font-size="9" fill="#6b7280">90d</text>
    <text x="480" y="335" font-size="9" fill="#6b7280">180d</text>
    <text x="600" y="335" font-size="9" fill="#6b7280">365d</text>
  </g>

  <g transform="translate(80,440)" font-size="10" fill="#374151">
    <rect x="0" y="0" width="11" height="11" fill="url(#g1)"/>
    <text x="16" y="9">helpful 强化 (向上凸)</text>
    <rect x="170" y="0" width="11" height="11" fill="url(#g2)"/>
    <text x="186" y="9">neutral (Ebbinghaus)</text>
    <rect x="330" y="0" width="11" height="11" fill="url(#g3)"/>
    <text x="346" y="9">misleading (加速衰减)</text>
    <rect x="490" y="0" width="11" height="11" fill="#94a3b8"/>
    <text x="506" y="9">无反馈 (默认衰减)</text>
  </g>
</svg>
