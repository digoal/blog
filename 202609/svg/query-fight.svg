<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 660" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="800" height="660" fill="#fafafa"/>
  <text x="400" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">查询能力:JSONL 的查询真的输给 SQLite 吗?</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#475569">110 session / 41.4 MB 真实语料 · p50 取 5 次中位</text>

  <!-- 4 query panels -->
  <g transform="translate(40,90)">
    <text x="0" y="0" font-size="14" font-weight="700" fill="#0f172a">Q1 恢复指定 session 最后 20 条</text>
    <text x="0" y="20" font-size="11" fill="#475569">resume 热路径 · 你天天用的命令</text>
    <g transform="translate(0,40)">
      <rect x="0" y="0" width="120" height="80" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="60" y="20" text-anchor="middle" font-size="12" fill="#92400e">JSONL</text>
      <text x="60" y="44" text-anchor="middle" font-size="18" font-weight="700" fill="#92400e">0.55 ms</text>
      <text x="60" y="62" text-anchor="middle" font-size="9" fill="#475569">读整文件 64 KB</text>
      <text x="60" y="76" text-anchor="middle" font-size="9" fill="#475569">取 tail 20 行</text>
      <rect x="140" y="0" width="120" height="80" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="200" y="20" text-anchor="middle" font-size="12" fill="#1e3a8a">SQLite</text>
      <text x="200" y="44" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">0.06 ms</text>
      <text x="200" y="62" text-anchor="middle" font-size="9" fill="#475569">索引反向扫 20 行</text>
      <text x="200" y="76" text-anchor="middle" font-size="9" fill="#475569">无 IO 浪费</text>
      <text x="280" y="50" font-size="40" font-weight="700" fill="#10b981">→ SQLite 9×</text>
    </g>
    <text x="0" y="148" font-size="10" fill="#475569">但:人感知不到 0.49 ms 的差别。两者都是"瞬时"。</text>
  </g>

  <g transform="translate(40,280)">
    <text x="0" y="0" font-size="14" font-weight="700" fill="#0f172a">Q2 跨 session 关键词 "postgres"</text>
    <text x="0" y="20" font-size="11" fill="#475569">"上次我怎么修的" · 这是 session store 最有价值的查询</text>
    <g transform="translate(0,40)">
      <rect x="0" y="0" width="110" height="60" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="55" y="18" text-anchor="middle" font-size="11" fill="#92400e">JSONL + rg</text>
      <text x="55" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#92400e">12 ms</text>
      <text x="55" y="52" text-anchor="middle" font-size="9" fill="#475569">ripgrep, 79 命中</text>
      <rect x="120" y="0" width="110" height="60" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="175" y="18" text-anchor="middle" font-size="11" fill="#1e3a8a">SQLite FTS5</text>
      <text x="175" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">0.28 ms</text>
      <text x="175" y="52" text-anchor="middle" font-size="9" fill="#475569">599 命中 (含子串)</text>
      <rect x="240" y="0" width="110" height="60" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
      <text x="295" y="18" text-anchor="middle" font-size="11" fill="#7f1d1d">JSONL python</text>
      <text x="295" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#7f1d1d">132 ms</text>
      <text x="295" y="52" text-anchor="middle" font-size="9" fill="#7f1d1d">纯 Python 扫,慢 470×</text>
      <text x="360" y="38" font-size="32" font-weight="700" fill="#10b981">→ SQLite 43×</text>
    </g>
    <text x="0" y="130" font-size="10" fill="#475569">但:rg 12 ms + 0 依赖。"数据库赢了"≠"必须用数据库"。</text>
  </g>

  <g transform="translate(40,460)">
    <text x="0" y="0" font-size="14" font-weight="700" fill="#0f172a">Q3 + Q4 聚合 / 时间窗</text>
    <text x="0" y="20" font-size="11" fill="#475569">成本归因 / 审计复盘 · 实际日常不需要</text>
    <g transform="translate(0,40)">
      <rect x="0" y="0" width="150" height="50" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="75" y="14" text-anchor="middle" font-size="11" fill="#92400e">JSONL 扫全</text>
      <text x="75" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#92400e">285 ms</text>
      <text x="75" y="46" text-anchor="middle" font-size="9" fill="#475569">10 个 session 全打开</text>
      <rect x="170" y="0" width="150" height="50" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="245" y="14" text-anchor="middle" font-size="11" fill="#1e3a8a">SQLite 索引</text>
      <text x="245" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">0.11 - 10 ms</text>
      <text x="245" y="46" text-anchor="middle" font-size="9" fill="#475569">GROUP BY 直接走索引</text>
      <text x="340" y="32" font-size="24" font-weight="700" fill="#10b981">→ SQLite 28 ~ 2600×</text>
    </g>
    <text x="0" y="115" font-size="10" fill="#475569">这个差距"真"了。但问:你每次都做聚合吗?还是一周一次跑个 cron?</text>
  </g>
</svg>
