<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="800" height="480" fill="#fafafa"/>
  <text x="400" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">规模拐点:110 / 1.1k / 11k session 实测</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#475569">小池 (6 真实 session) 复制放大 · 单机 NVMe · 内核 6.12</text>

  <!-- bars: picker -->
  <g transform="translate(60,100)">
    <text x="0" y="0" font-size="13" font-weight="700" fill="#0f172a">session picker 启动 (readdir vs group by)</text>
    <g transform="translate(0,18)">
      <text x="0" y="20" font-size="11" fill="#334155">110</text>
      <text x="0" y="50" font-size="11" fill="#334155">1100</text>
      <text x="0" y="80" font-size="11" fill="#334155">11000</text>
      <rect x="50" y="10" width="200" height="14" fill="#fef3c7" stroke="#d97706"/>
      <text x="258" y="22" font-size="10" fill="#92400e">JSONL readdir 2.05 ms</text>
      <rect x="50" y="40" width="200" height="14" fill="#fef3c7" stroke="#d97706"/>
      <text x="258" y="52" font-size="10" fill="#92400e">JSONL readdir 19.9 ms</text>
      <rect x="50" y="70" width="200" height="14" fill="#fef3c7" stroke="#d97706"/>
      <text x="258" y="82" font-size="10" fill="#92400e">JSONL readdir 194 ms</text>

      <rect x="50" y="100" width="6" height="6" fill="#dbeafe" stroke="#1d4ed8"/>
      <text x="62" y="106" font-size="10" fill="#1e3a8a">SQLite 始终 0.18 → 16 ms</text>
    </g>
  </g>

  <!-- bars: search -->
  <g transform="translate(60,260)">
    <text x="0" y="0" font-size="13" font-weight="700" fill="#0f172a">跨 session 关键词检索</text>
    <g transform="translate(0,18)">
      <text x="0" y="20" font-size="11" fill="#334155">110</text>
      <text x="0" y="50" font-size="11" fill="#334155">1100</text>
      <text x="0" y="80" font-size="11" fill="#334155">11000</text>
      <rect x="50" y="10" width="200" height="14" fill="#fef3c7" stroke="#d97706"/>
      <text x="258" y="22" font-size="10" fill="#92400e">ripgrep 7.3 ms</text>
      <rect x="50" y="40" width="200" height="14" fill="#fef3c7" stroke="#d97706"/>
      <text x="258" y="52" font-size="10" fill="#92400e">ripgrep 10.8 ms</text>
      <rect x="50" y="70" width="200" height="14" fill="#fef3c7" stroke="#d97706"/>
      <text x="258" y="82" font-size="10" fill="#92400e">ripgrep 46.3 ms</text>

      <rect x="50" y="100" width="6" height="6" fill="#dbeafe" stroke="#1d4ed8"/>
      <text x="62" y="106" font-size="10" fill="#1e3a8a">FTS5 始终 0.01 - 0.03 ms</text>
    </g>
  </g>

  <g transform="translate(60,400)">
    <text x="0" y="0" font-size="13" font-weight="700" fill="#0f172a">磁盘浪费 (块对齐, ext4 4 KB)</text>
    <text x="0" y="22" font-size="11" fill="#334155">JSONL 110 个小文件: 真实占用 31% 大于表观大小, 主要因为每个文件不到整数页</text>
    <text x="0" y="42" font-size="11" fill="#334155">SQLite 1 个文件: 没有这个问题</text>
  </g>

  <text x="400" y="462" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">拐点: 1k session, readdir + 读首行已经明显慢 (20 ms)。FTS5 的领先是数量级的, 但 ripgrep 仍在可接受区</text>
</svg>
