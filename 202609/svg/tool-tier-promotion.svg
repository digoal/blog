<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="tier1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d1fae5"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <linearGradient id="tier2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="tier3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#ddd6fe"/>
    </linearGradient>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#374151"/>
    </marker>
    <marker id="arrup" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,6 L0,0 L8,3 z" fill="#059669"/>
    </marker>
    <marker id="arrdn" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,6 L0,0 L8,3 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="800" height="520" fill="#fafafa"/>

  <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">Self-organizing Tool Registry</text>
  <text x="400" y="52" text-anchor="middle" font-size="12" fill="#6b7280">Tool tier auto-promote / auto-demote by usage + success rate</text>

  <g transform="translate(50,90)">
    <text x="0" y="0" font-size="14" font-weight="700" fill="#065f46">Tier 1 (always-on) — ≤12 tools</text>
    <rect x="0" y="10" width="700" height="58" fill="url(#tier1)" stroke="#10b981" stroke-width="1.5" rx="8"/>
    <text x="20" y="38" font-size="11" fill="#064e3b" font-family="ui-monospace, monospace">file_read · file_write · bash · grep · search · ...</text>
    <text x="20" y="55" font-size="9" fill="#047857">高频高成功 — 自动升级到 Tier 1 (LLM system prompt 永远可见)</text>

    <text x="0" y="92" font-size="14" font-weight="700" fill="#1e40af">Tier 2 (domain) — ≤20 tools</text>
    <rect x="0" y="102" width="700" height="58" fill="url(#tier2)" stroke="#3b82f6" stroke-width="1.5" rx="8"/>
    <text x="20" y="130" font-size="11" fill="#1e3a8a" font-family="ui-monospace, monospace">pg_bench · pgvector_search · mem0_query · ollama_embed · ...</text>
    <text x="20" y="147" font-size="9" fill="#1d4ed8">按 task domain 加载 — agent 声明 "我现在做 X" 后自动注入</text>

    <text x="0" y="184" font-size="14" font-weight="700" fill="#5b21b6">Tier 3 (specialty) — 按需 query</text>
    <rect x="0" y="194" width="700" height="58" fill="url(#tier3)" stroke="#8b5cf6" stroke-width="1.5" rx="8"/>
    <text x="20" y="222" font-size="11" fill="#4c1d95" font-family="ui-monospace, monospace">age_graph_query · kafka_consume · arxiv_search · ...</text>
    <text x="20" y="239" font-size="9" fill="#6d28d9">不直接 in-prompt — 通过 capability description 让 agent query registry</text>
  </g>

  <g transform="translate(120,360)">
    <text x="0" y="0" font-size="13" font-weight="700" fill="#1f2937">Promotion Rule</text>
    <rect x="0" y="8" width="240" height="100" fill="#fff" stroke="#d1d5db" rx="6"/>
    <text x="14" y="32" font-size="10" fill="#374151" font-family="ui-monospace, monospace">usage_30d &gt; 50 AND</text>
    <text x="14" y="48" font-size="10" fill="#374151" font-family="ui-monospace, monospace">success_rate &gt; 0.85</text>
    <text x="14" y="64" font-size="10" fill="#374151" font-family="ui-monospace, monospace">AND last_used &lt; 7d</text>
    <text x="14" y="84" font-size="10" fill="#059669" font-weight="600">→ promote to Tier ↑</text>

    <text x="270" y="0" font-size="13" font-weight="700" fill="#1f2937">Demotion Rule</text>
    <rect x="270" y="8" width="240" height="100" fill="#fff" stroke="#d1d5db" rx="6"/>
    <text x="284" y="32" font-size="10" fill="#374151" font-family="ui-monospace, monospace">usage_30d &lt; 5 OR</text>
    <text x="284" y="48" font-size="10" fill="#374151" font-family="ui-monospace, monospace">success_rate &lt; 0.5</text>
    <text x="284" y="64" font-size="10" fill="#374151" font-family="ui-monospace, monospace">OR misleading_count &gt; 3</text>
    <text x="284" y="84" font-size="10" fill="#dc2626" font-weight="600">→ demote to Tier ↓</text>
  </g>

  <g transform="translate(120,478)" font-size="11" fill="#374151">
    <text x="0" y="0" font-weight="600">Feedback signals:</text>
    <text x="0" y="18" fill="#6b7280">· agent invocation count (auto-tracked)</text>
    <text x="0" y="33" fill="#6b7280">· outcome signal (helpful / neutral / misleading — agent self-report)</text>
    <text x="0" y="48" fill="#6b7280">· compute per-tool (usage_30d / success_rate / misleading_count)</text>
  </g>

  <line x1="640" y1="395" x2="730" y2="395" stroke="#059669" stroke-width="1.5" marker-end="url(#arrup)"/>
  <line x1="640" y1="445" x2="730" y2="445" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrdn)"/>
</svg>
