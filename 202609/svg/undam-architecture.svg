<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="monospace" font-size="14">
  <defs>
    <style>
      .title { font-size: 20; font-weight: bold; fill: #1a1a2e; }
      .subtitle { font-size: 14; fill: #555; }
      .label { font-size: 12; font-weight: bold; fill: #fff; }
      .text { font-size: 12; fill: #333; }
      .text-sm { font-size: 11; fill: #666; }
      .arrow { fill: #333; }
      .fork-main { fill: #4CAF50; }
      .fork-ext { fill: #FF9800; }
      .chunk-header { fill: #2196F3; }
      .chunk-tail { fill: #9C27B0; }
      .chunk-undo { fill: #F44336; }
      .alloc-chain { fill: #FFC107; }
      .l1-list { fill: #00BCD4; }
      .visibility { fill: #8BC34A; }
      .wal { fill: #607D8B; }
      .vacuum { fill: #795548; }
      .page-box { fill: #f5f5f5; stroke: #333; stroke-width: 1.5; }
      .chain-box { fill: #fffde7; stroke: #F57F17; stroke-width: 2; }
      .shadow { fill: rgba(0,0,0,0.1); }
    </style>
  </defs>

  <!-- 标题 -->
  <text x="500" y="30" text-anchor="middle" class="title">undam: In-Place Update + Undo Chain Architecture</text>
  <text x="500" y="52" text-anchor="middle" class="subtitle">Two-Fork Storage + Fixed-Size Chunks + L1 Allocation Chains</text>

  <!-- 左上: Main Fork (Tuple Headers) -->
  <rect x="50" y="80" width="400" height="380" rx="8" class="page-box"/>
  <rect x="50" y="80" width="400" height="35" rx="8" fill="#4CAF50"/>
  <rect x="50" y="95" width="400" height="20" fill="#4CAF50"/>
  <text x="250" y="102" text-anchor="middle" class="label">MAIN FORK (tuple headers only)</text>

  <!-- Block 5: 包含 tuple header chunks -->
  <rect x="70" y="130" width="170" height="120" rx="4" fill="#E3F2FD" stroke="#2196F3" stroke-width="1.5"/>
  <text x="155" y="152" text-anchor="middle" class="text" font-weight="bold">Block 5</text>
  <text x="155" y="170" text-anchor="middle" class="text-sm">Chunk 0: Tuple #1 Header</text>
  <text x="155" y="185" text-anchor="middle" class="text-sm">  ├─ undoChain → ext@10:5</text>
  <text x="155" y="200" text-anchor="middle" class="text-sm">  ├─ nextChunk → ext@12:3</text>
  <text x="155" y="215" text-anchor="middle" class="text-sm">  └─ size: 1024 bytes</text>
  <text x="155" y="235" text-anchor="middle" class="text-sm">Chunk 1: Tuple #2 Header</text>
  <text x="155" y="250" text-anchor="middle" class="text-sm">  └─ undoChain → INVALID</text>

  <!-- Block 7 -->
  <rect x="260" y="130" width="170" height="120" rx="4" fill="#E3F2FD" stroke="#2196F3" stroke-width="1.5"/>
  <text x="345" y="152" text-anchor="middle" class="text" font-weight="bold">Block 7</text>
  <text x="345" y="170" text-anchor="middle" class="text-sm">Chunk 0: Tuple #3 Header</text>
  <text x="345" y="185" text-anchor="middle" class="text-sm">  ├─ undoChain → ext@15:2</text>
  <text x="345" y="200" text-anchor="middle" class="text-sm">  └─ size: 512 bytes</text>

  <!-- 右侧: Extension Fork -->
  <rect x="520" y="80" width="430" height="380" rx="8" class="page-box"/>
  <rect x="520" y="80" width="430" height="35" rx="8" fill="#FF9800"/>
  <rect x="520" y="95" width="430" height="20" fill="#FF9800"/>
  <text x="735" y="102" text-anchor="middle" class="label">EXTENSION FORK (tail chunks + undo versions)</text>

  <!-- Undo Versions (红色) -->
  <rect x="540" y="130" width="190" height="130" rx="4" fill="#FFEBEE" stroke="#F44336" stroke-width="1.5"/>
  <text x="635" y="152" text-anchor="middle" class="text" font-weight="bold">Undo Versions (Red)</text>
  <text x="635" y="170" text-anchor="middle" class="text-sm">Block 10, Chunk 5</text>
  <text x="635" y="185" text-anchor="middle" class="text-sm">  └─ Undo v1 (old head)</text>
  <text x="635" y="200" text-anchor="middle" class="text-sm">      ├─ undoChain → ext@15:2</text>
  <text x="635" y="215" text-anchor="middle" class="text-sm">      └─ xmin: 1000 (committed)</text>
  <text x="635" y="235" text-anchor="middle" class="text-sm">Block 15, Chunk 2</text>
  <text x="635" y="250" text-anchor="middle" class="text-sm">  └─ Undo v2 (older head)</text>

  <!-- Tail Chunks (紫色) -->
  <rect x="750" y="130" width="180" height="130" rx="4" fill="#F3E5F5" stroke="#9C27B0" stroke-width="1.5"/>
  <text x="840" y="152" text-anchor="middle" class="text" font-weight="bold">Tail Chunks (Purple)</text>
  <text x="840" y="170" text-anchor="middle" class="text-sm">Block 12, Chunk 3</text>
  <text x="840" y="185" text-anchor="middle" class="text-sm">  └─ Tuple #1 tail data</text>
  <text x="840" y="200" text-anchor="middle" class="text-sm">      (bytes 256..1024)</text>

  <!-- Allocation Chains (黄色) -->
  <rect x="540" y="280" width="390" height="70" rx="4" fill="#FFFDE7" stroke="#F57F17" stroke-width="2"/>
  <text x="735" y="302" text-anchor="middle" class="text" font-weight="bold">L1 Allocation Chains (Yellow)</text>
  <text x="735" y="320" text-anchor="middle" class="text-sm">Chain 0: head → Block 3 → Block 7 → Block 11 (not-full pages)</text>
  <text x="735" y="338" text-anchor="middle" class="text-sm">Chain 1: head → Block 5 → Block 9 (not-full pages)</text>
  <text x="735" y="356" text-anchor="middle" class="text-sm">Chain N: random() % N_ALLOC_CHAINS (max 64 chains)</text>

  <!-- 底部: 关键机制 -->
  <rect x="50" y="480" width="900" height="100" rx="8" fill="#f9f9f9" stroke="#ccc" stroke-width="1"/>

  <!-- 机制 1: In-Place Update -->
  <rect x="70" y="500" width="200" height="60" rx="4" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1.5"/>
  <text x="170" y="520" text-anchor="middle" class="text" font-weight="bold">1. In-Place Update</text>
  <text x="170" y="538" text-anchor="middle" class="text-sm">Copy old head → ext fork</text>
  <text x="170" y="554" text-anchor="middle" class="text-sm">Overwrite old head in-place</text>

  <!-- 机制 2: Undo Chain -->
  <rect x="290" y="500" width="200" height="60" rx="4" fill="#FFEBEE" stroke="#F44336" stroke-width="1.5"/>
  <text x="390" y="520" text-anchor="middle" class="text" font-weight="bold">2. Undo Chain</text>
  <text x="390" y="538" text-anchor="middle" class="text-sm">Old versions in ext fork</text>
  <text x="390" y="554" text-anchor="middle" class="text-sm">Traversed by VACUUM + reads</text>

  <!-- 机制 3: Bitmap Vacuum -->
  <rect x="510" y="500" width="200" height="60" rx="4" fill="#E3F2FD" stroke="#2196F3" stroke-width="1.5"/>
  <text x="610" y="520" text-anchor="middle" class="text" font-weight="bold">3. Bitmap Vacuum</text>
  <text x="610" y="538" text-anchor="middle" class="text-sm">1B row = 4MB bitmap</text>
  <text x="610" y="554" text-anchor="middle" class="text-sm">O(1) undo chain truncation</text>

  <!-- 机制 4: Visibility -->
  <rect x="730" y="500" width="200" height="60" rx="4" fill="#F3E5F5" stroke="#9C27B0" stroke-width="1.5"/>
  <text x="830" y="520" text-anchor="middle" class="text" font-weight="bold">4. Visibility</text>
  <text x="830" y="538" text-anchor="middle" class="text-sm">Reuse PG HeapTupleSatisfies</text>
  <text x="830" y="554" text-anchor="middle" class="text-sm">Traverse undo chain if needed</text>

  <!-- 底部标注 -->
  <text x="500" y="590" text-anchor="middle" class="text-sm" fill="#666">
    undam.c:3541 lines | undam.h:141 lines | 2020-12-08 | Alexander Korotkov
  </text>
</svg>
