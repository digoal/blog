<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1280" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgTop" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/>
    </marker>
  </defs>

  <rect width="1400" height="1280" fill="#fafafa"/>

  <!-- title -->
  <rect x="0" y="0" width="1400" height="74" fill="#0f172a"/>
  <text x="40" y="34" fill="#f8fafc" font-size="22" font-weight="700">一页一行的 undo: OrioleDB 的 page-level undo record 5 种类型全景</text>
  <text x="40" y="58" fill="#94a3b8" font-size="13">Compact / Split / Merge / SplitDiff / MergeDiff · 完整 image vs 差异记录</text>

  <!-- ============================== LEFT: 完整 image 三种 ============================== -->
  <g filter="url(#softShadow)">
    <rect x="40" y="94" width="660" height="500" rx="12" fill="#fff" stroke="#0f172a" stroke-width="2"/>
    <text x="370" y="124" text-anchor="middle" fill="#0f172a" font-size="18" font-weight="700">完整 image 类 (full-page undo)</text>
    <text x="370" y="144" text-anchor="middle" fill="#475569" font-size="12">整页拷贝 + 少量元数据</text>

    <!-- 1. Compact -->
    <rect x="60" y="160" width="620" height="100" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <text x="80" y="184" fill="#1e3a8a" font-size="14" font-weight="700">1. UndoPageImageCompact</text>
    <text x="80" y="202" fill="#1e3a8a" font-size="11">UndoPageImageHeader (8 字节) · type = Compact</text>
    <text x="80" y="220" fill="#1e3a8a" font-size="11">+ 整 page 拷贝 (8 KB) · O_COMPACT_UNDO_IMAGE_SIZE = 8 + 8 KB</text>
    <text x="80" y="240" fill="#475569" font-size="11">▶ compaction 触发:页内死 tuple 字节累计到阈值 → 重整 page</text>
    <text x="80" y="254" fill="#475569" font-size="10">▶ undo 重建整 page (读 Compact image 直接 memcpy)</text>

    <!-- 2. Split -->
    <rect x="60" y="276" width="620" height="130" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
    <text x="80" y="300" fill="#14532d" font-size="14" font-weight="700">2. UndoPageImageSplit</text>
    <text x="80" y="318" fill="#14532d" font-size="11">UndoPageImageSplitHeader (16 字节) · type + splitKeyFlags + splitKeyLen</text>
    <text x="80" y="336" fill="#14532d" font-size="11">+ 整 pre-split page (8 KB)</text>
    <text x="80" y="354" fill="#14532d" font-size="11">+ split key (变长, ≤ O_BTREE_MAX_KEY_SIZE)</text>
    <text x="80" y="372" fill="#14532d" font-size="11">O_SPLIT_UNDO_IMAGE_SIZE = 8 + 8 KB + splitKeySize</text>
    <text x="80" y="392" fill="#475569" font-size="11">▶ split 触发:新插入导致 page overflow</text>
    <text x="80" y="406" fill="#475569" font-size="10">▶ undo 重建左右两半 (left half = 旧 page,right half = 空)</text>

    <!-- 3. Merge -->
    <rect x="60" y="422" width="620" height="140" rx="6" fill="#fef3c7" stroke="#a16207" stroke-width="1.5"/>
    <text x="80" y="446" fill="#78350f" font-size="14" font-weight="700">3. UndoPageImageMerge</text>
    <text x="80" y="464" fill="#78350f" font-size="11">UndoPageImageHeader (8 字节) · type = Merge</text>
    <text x="80" y="482" fill="#78350f" font-size="11">+ 整 left page (8 KB)</text>
    <text x="80" y="500" fill="#78350f" font-size="11">+ 整 right page (8 KB) · 共 16 KB</text>
    <text x="80" y="518" fill="#78350f" font-size="11">O_MERGE_UNDO_IMAGE_SIZE = 8 + 8 KB × 2</text>
    <text x="80" y="538" fill="#475569" font-size="11">▶ merge 触发:删除后 page 利用率低 → 兄弟合并</text>
    <text x="80" y="552" fill="#475569" font-size="10">▶ undo 重建左右两半 (left + right 都从 undo 拿)</text>
  </g>

  <!-- ============================== RIGHT: 差异记录二种 ============================== -->
  <g filter="url(#softShadow)">
    <rect x="720" y="94" width="660" height="500" rx="12" fill="#fff" stroke="#0f172a" stroke-width="2"/>
    <text x="1050" y="124" text-anchor="middle" fill="#0f172a" font-size="18" font-weight="700">差异记录类 (diff undo)</text>
    <text x="1050" y="144" text-anchor="middle" fill="#475569" font-size="12">只记 split/merge 的 boundary key + 旧 undo chain</text>

    <!-- 4. SplitDiff -->
    <rect x="740" y="160" width="620" height="200" rx="6" fill="#fce7f3" stroke="#9d174d" stroke-width="1.5"/>
    <text x="760" y="184" fill="#831843" font-size="14" font-weight="700">4. UndoPageImageSplitDiff</text>
    <text x="760" y="202" fill="#831843" font-size="11">UndoPageImageSplitDiffHeader (24 字节) ·</text>
    <text x="760" y="218" fill="#831843" font-size="11">type + splitKeyFlags + splitKeyLen +</text>
    <text x="760" y="234" fill="#831843" font-size="11">origCsn (64) + origUndoLoc (62) = 24 字节</text>

    <text x="760" y="260" fill="#831843" font-size="11">+ split key (变长)</text>
    <text x="760" y="278" fill="#831843" font-size="11">O_SPLIT_DIFF_UNDO_IMAGE_SIZE = 24 + splitKeySize</text>

    <text x="760" y="306" fill="#475569" font-size="11">▶ 触发条件: split 时**未丢弃任何 tuple** (数据全保留)</text>
    <text x="760" y="324" fill="#475569" font-size="11">▶ 关键差异: 不存整 page,只记 split key + pre-split 的 csn/undoLocation</text>

    <text x="760" y="350" fill="#475569" font-size="11">▶ undo 重建: 把 live page 截断(split key 处),用 origCsn/origUndoLoc</text>
    <text x="760" y="366" fill="#475569" font-size="11">  重新挂到 pre-split 的 undo chain,实现"逻辑回退"</text>

    <text x="760" y="392" fill="#831843" font-size="11" font-weight="700">▶ 节省 8 KB 的 page 拷贝 → 关键优化</text>
  </g>

  <!-- 5. MergeDiff -->
  <rect x="720" y="624" width="660" height="450" rx="12" fill="#fff" stroke="#0f172a" stroke-width="2"/>
  <text x="1050" y="654" text-anchor="middle" fill="#0f172a" font-size="18" font-weight="700">5. UndoPageImageMergeDiff</text>

  <rect x="740" y="670" width="620" height="190" rx="6" fill="#f3e8ff" stroke="#6b21a8" stroke-width="1.5"/>
  <text x="760" y="694" fill="#581c87" font-size="14" font-weight="700">UndoPageImageMergeDiffHeader (48 字节)</text>
  <text x="760" y="712" fill="#581c87" font-size="11">type + boundaryFlags + boundaryLen +</text>
  <text x="760" y="728" fill="#581c87" font-size="11">leftCsn (64) + rightCsn (64) +</text>
  <text x="760" y="744" fill="#581c87" font-size="11">leftUndoLoc (62) + rightUndoLoc (62) = 48 字节</text>

  <text x="760" y="770" fill="#581c87" font-size="11">+ boundary key (变长) · O_MERGE_DIFF_UNDO_IMAGE_SIZE = 48 + boundaryLen</text>

  <text x="760" y="798" fill="#475569" font-size="11">▶ 触发条件: merge 时**未丢弃任何 tuple** (数据全保留)</text>
  <text x="760" y="816" fill="#475569" font-size="11">▶ boundary key = pre-merge left page 的 hikey = right page 的 lokey</text>

  <rect x="740" y="830" width="620" height="100" rx="6" fill="#f3e8ff" stroke="#6b21a8" stroke-width="1.5"/>
  <text x="760" y="852" fill="#581c87" font-size="14" font-weight="700">Undo 重建: 把 live merged page 截断(boundary key 处),</text>
  <text x="760" y="868" fill="#581c87" font-size="11">用 leftCsn/leftUndoLoc 和 rightCsn/rightUndoLoc 重新挂到</text>
  <text x="760" y="884" fill="#581c87" font-size="11">pre-merge 各自的 undo chain,实现 "逻辑回退" 到合并前状态</text>

  <text x="760" y="908" fill="#581c87" font-size="11" font-weight="700">▶ 节省 16 KB 的 page 拷贝 → 关键优化</text>

  <!-- size comparison -->
  <rect x="720" y="1100" width="660" height="160" rx="12" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
  <text x="740" y="1130" fill="#22d3ee" font-size="14" font-weight="700">字节预算对比</text>

  <rect x="740" y="1140" width="620" height="22" fill="#fb923c"/>
  <text x="760" y="1156" fill="#7c2d12" font-size="11">Compact: 8 + 8 KB = 8.0 KB · Split: 8+8KB+key ≈ 8 KB · Merge: 8+16KB = 16 KB</text>

  <rect x="740" y="1162" width="620" height="22" fill="#fb923c"/>
  <text x="760" y="1178" fill="#7c2d12" font-size="11">SplitDiff: 24 + key (~32 字节典型) · MergeDiff: 48 + boundary (~64 字节典型)</text>

  <text x="760" y="1212" fill="#86efac" font-size="12" font-weight="700">▶ 差异记录比完整镜像**省 100-500 倍**字节</text>
  <text x="760" y="1232" fill="#86efac" font-size="11">▶ 触发条件: split/merge 不丢 tuple · 比例视场景而定(高分裂→少 diff,少分裂→多 diff)</text>
  <text x="760" y="1252" fill="#fed7aa" font-size="11">▶ orioledb 的 page-level undo 平衡了"原子性"和"空间"</text>

  <!-- bottom section -->
  <rect x="40" y="608" width="660" height="660" rx="12" fill="#fff" stroke="#0f172a" stroke-width="2"/>
  <text x="370" y="638" text-anchor="middle" fill="#0f172a" font-size="18" font-weight="700">page-level undo 在 B-tree 里的应用</text>

  <rect x="60" y="654" width="620" height="120" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
  <text x="80" y="678" fill="#1e3a8a" font-size="13" font-weight="700">page header 直接挂 undoLocation</text>
  <text x="80" y="696" fill="#1e3a8a" font-size="11">include/btree/page_contents.h:128-130</text>
  <text x="80" y="712" fill="#1e3a8a" font-size="10">UndoLocation undoLocation;   // 64-bit,指向 page-level undo record</text>
  <text x="80" y="728" fill="#1e3a8a" font-size="10">CommitSeqNo csn;             // 64-bit, page 内容的提交序号</text>

  <text x="80" y="752" fill="#475569" font-size="11">▶ 每次 page 变更 → 写 1 条 page-level undo</text>
  <text x="80" y="768" fill="#475569" font-size="11">▶ 不像 zedstore 那样每个 tuple 写 UNDO</text>

  <rect x="60" y="788" width="620" height="220" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="80" y="812" fill="#14532d" font-size="13" font-weight="700">5 种类型如何被选择 (make_undo_image 函数)</text>
  <text x="80" y="830" fill="#14532d" font-size="11">if (action == INSERT/SPLIT_LEFT/SPLIT_RIGHT) {</text>
  <text x="80" y="846" fill="#14532d" font-size="10">  if (split 触发 &amp;&amp; 不丢 tuple)</text>
  <text x="80" y="860" fill="#14532d" font-size="10">    → 写 UndoPageImageSplitDiff (小, ~32 字节)</text>
  <text x="80" y="874" fill="#14532d" font-size="10">  else</text>
  <text x="80" y="888" fill="#14532d" font-size="10">    → 写 UndoPageImageSplit (大, ~8 KB)</text>
  <text x="80" y="902" fill="#14532d" font-size="11">}</text>
  <text x="80" y="918" fill="#14532d" font-size="11">if (action == DELETE/MERGE) {</text>
  <text x="80" y="934" fill="#14532d" font-size="10">  if (merge 触发 &amp;&amp; 不丢 tuple)</text>
  <text x="80" y="948" fill="#14532d" font-size="10">    → 写 UndoPageImageMergeDiff (小, ~64 字节)</text>
  <text x="80" y="962" fill="#14532d" font-size="10">  else</text>
  <text x="80" y="976" fill="#14532d" font-size="10">    → 写 UndoPageImageMerge (大, ~16 KB)</text>

  <text x="80" y="1000" fill="#86efac" font-size="11" font-weight="700">▶ 决策点是"是否丢 tuple",这个影响 undo 重建逻辑</text>

  <rect x="60" y="1022" width="620" height="230" rx="6" fill="#fef3c7" stroke="#a16207" stroke-width="1.5"/>
  <text x="80" y="1046" fill="#78350f" font-size="13" font-weight="700">Undo 重建: get_page_from_undo()</text>
  <text x="80" y="1064" fill="#78350f" font-size="11">从 undoLocation 读到 undo record → 根据 type 决定怎么重建:</text>

  <text x="80" y="1088" fill="#78350f" font-size="10">▸ Compact/Merge: 直接 memcpy 旧 page 到目标 buffer</text>
  <text x="80" y="1102" fill="#78350f" font-size="10">▸ Split: 取左半旧 page + 重建空右半</text>
  <text x="80" y="1116" fill="#78350f" font-size="10">▸ MergeDiff: 用 live merged page + 截断 + 改 undo chain</text>
  <text x="80" y="1130" fill="#78350f" font-size="10">▸ SplitDiff: 用 live page + 截断 + 改 undo chain</text>

  <text x="80" y="1156" fill="#475569" font-size="11">▶ 差异记录重建走 "逻辑回退" — 不拷 page,只改 header 链</text>
  <text x="80" y="1170" fill="#475569" font-size="11">▶ 这是 orioledb 的核心工程创新 (对照 PG 的 heap 在原地改 xmax)</text>

  <text x="80" y="1202" fill="#831843" font-size="11" font-weight="700">▶ zedstore 没这个能力 — 它必须靠 ZSTidArrayItem + UNDO slot</text>
  <text x="80" y="1222" fill="#831843" font-size="10">  推理: orioledb 知道 "split/merge 不丢 tuple" 是常见 case,可以走 diff</text>
  <text x="80" y="1240" fill="#831843" font-size="10">  而 zedstore 的 UNDO 是 per-tuple,即使不丢 tuple 也必须走 slot + UNDO ptr</text>
</svg>