<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1480" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgTop" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/>
    </marker>
  </defs>

  <rect width="1400" height="1480" fill="#fafafa"/>

  <!-- title -->
  <rect x="0" y="0" width="1400" height="74" fill="#0f172a"/>
  <text x="40" y="34" fill="#f8fafc" font-size="22" font-weight="700">WAL 字节级:zedstore 9 个 op code vs OrioleDB 24 种行级 logical record</text>
  <text x="40" y="58" fill="#94a3b8" font-size="13">全页镜像 FPI vs LocalWal 批量缓冲 + 行级 logical records · + WAL 字节布局</text>

  <!-- ============================== LEFT: ZedStore ============================== -->
  <g filter="url(#softShadow)">
    <rect x="40" y="94" width="660" height="1340" rx="12" fill="#fff" stroke="#0f172a" stroke-width="2"/>
    <text x="370" y="124" text-anchor="middle" fill="#0f172a" font-size="18" font-weight="700">ZedStore · 9 个 op code · 全页镜像 FPI</text>
    <text x="370" y="144" text-anchor="middle" fill="#475569" font-size="12">src/backend/access/zedstore/zedstore_wal.c:21-64</text>

    <rect x="60" y="158" width="620" height="220" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <text x="80" y="180" fill="#1e3a8a" font-size="13" font-weight="700">zedstore_redo() 9 路 switch</text>
    <text x="80" y="198" fill="#1e3a8a" font-size="10">switch (info) { ... }</text>
    <text x="80" y="216" fill="#1e3a8a" font-size="10">case WAL_ZEDSTORE_INIT_METAPAGE       → zsmeta_initmetapage_redo</text>
    <text x="80" y="230" fill="#1e3a8a" font-size="10">case WAL_ZEDSTORE_UNDO_NEWPAGE        → zsundo_newpage_redo</text>
    <text x="80" y="244" fill="#1e3a8a" font-size="10">case WAL_ZEDSTORE_UNDO_DISCARD        → zsundo_discard_redo</text>
    <text x="80" y="258" fill="#1e3a8a" font-size="10">case WAL_ZEDSTORE_BTREE_NEW_ROOT      → zsmeta_new_btree_root_redo</text>
    <text x="80" y="272" fill="#1e3a8a" font-size="10">case WAL_ZEDSTORE_BTREE_REWRITE_PAGES → zsbt_rewrite_pages_redo</text>
    <text x="80" y="286" fill="#1e3a8a" font-size="10">case WAL_ZEDSTORE_TIDLEAF_ADD_ITEMS   → zsbt_tidleaf_items_redo(false)</text>
    <text x="80" y="300" fill="#1e3a8a" font-size="10">case WAL_ZEDSTORE_TIDLEAF_REPLACE_ITEM→ zsbt_tidleaf_items_redo(true)</text>
    <text x="80" y="314" fill="#1e3a8a" font-size="10">case WAL_ZEDSTORE_ATTSTREAM_CHANGE    → zsbt_attstream_change_redo</text>
    <text x="80" y="328" fill="#1e3a8a" font-size="10">case WAL_ZEDSTORE_TOAST_NEWPAGE       → zstoast_newpage_redo</text>
    <text x="80" y="342" fill="#1e3a8a" font-size="10">case WAL_ZEDSTORE_FPM_DELETE_PAGE     → zspage_delete_page_redo</text>
    <text x="80" y="356" fill="#1e3a8a" font-size="10">case WAL_ZEDSTORE_FPM_REUSE_PAGE      → zspage_reuse_page_redo</text>
    <text x="80" y="372" fill="#1e3a8a" font-size="11" font-weight="700">▶ 11 个分支(包括 FPM 2 个)实际是 9 路 + FPM 2 个</text>

    <rect x="60" y="396" width="620" height="120" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
    <text x="80" y="418" fill="#14532d" font-size="13" font-weight="700">WAL 字节布局 (全页镜像)</text>
    <rect x="60" y="430" width="620" height="22" fill="#86efac"/>
    <text x="80" y="446" fill="#14532d" font-size="10">XLogRecordHeaderData (PG 标准) · xl_rmid=RM_ZEDSTORE_ID</text>
    <rect x="60" y="452" width="620" height="22" fill="#22c55e"/>
    <text x="80" y="468" fill="#fff7ed" font-size="10">XLogRecordData · xl_info = WAL_ZEDSTORE_* (1 byte)</text>
    <rect x="60" y="474" width="620" height="22" fill="#15803d"/>
    <text x="80" y="490" fill="#fff7ed" font-size="10">XLogRegisterBuffer(REGBUF_FORCE_IMAGE) · 全页 8 KB</text>
    <text x="80" y="508" fill="#14532d" font-size="11" font-weight="700">▶ 每个 op code 都直接走 FPI,数据全在压缩块里</text>

    <rect x="60" y="528" width="620" height="160" rx="6" fill="#fef3c7" stroke="#a16207" stroke-width="1.5"/>
    <text x="80" y="550" fill="#78350f" font-size="13" font-weight="700">典型 op code 的 WAL 写入</text>
    <text x="80" y="568" fill="#78350f" font-size="11">zedstore_meta.c:240-255 zsmeta_wal_log_metapage:</text>
    <text x="80" y="586" fill="#78350f" font-size="10">wal_zedinsert_set_init_rec init_rec.natts = natts</text>
    <text x="80" y="602" fill="#78350f" font-size="10">XLogRegisterData(natts, SizeOfZSWalInitMetapage)</text>
    <text x="80" y="618" fill="#78350f" font-size="10">XLogRegisterBuffer(buf, REGBUF_FORCE_IMAGE | STANDARD)</text>
    <text x="80" y="634" fill="#78350f" font-size="10">XLogInsert(RM_ZEDSTORE_ID, WAL_ZEDSTORE_INIT_METAPAGE)</text>
    <text x="80" y="654" fill="#475569" font-size="11" font-weight="700">▶ wal_zedinit_set_init_rec 是"几个字段"做 hdr,然后整个 buf 走 IMAGE</text>

    <rect x="60" y="700" width="620" height="130" rx="6" fill="#fce7f3" stroke="#9d174d" stroke-width="1.5"/>
    <text x="80" y="722" fill="#831843" font-size="13" font-weight="700">zedstore_mask() 做的事</text>
    <text x="80" y="740" fill="#831843" font-size="11">zedstore_wal.c:66-107 · 对 UNDO page 做 mask:</text>
    <text x="80" y="758" fill="#831843" font-size="10">▸ mask_page_lsn_and_checksum(page) · 清 LSN/checksum</text>
    <text x="80" y="774" fill="#831843" font-size="10">▸ page_id == ZS_UNDO_PAGE_ID → 遍历 ZSUndoRec</text>
    <text x="80" y="790" fill="#831843" font-size="10">▸ if (undorec-&gt;type == ZSUNDO_TYPE_INSERT)</text>
    <text x="80" y="806" fill="#831843" font-size="10">    → ((ZSUndoRec_Insert *) undorec)-&gt;speculative_token = MASK_MARKER</text>
    <text x="80" y="822" fill="#831843" font-size="11">▶ 屏蔽 speculative_token 防止备机残留未决 token</text>

    <rect x="60" y="848" width="620" height="160" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <text x="80" y="870" fill="#1e3a8a" font-size="13" font-weight="700">关键设计取舍</text>
    <text x="80" y="888" fill="#1e3a8a" font-size="11">▸ "压缩块当 page 写入"</text>
    <text x="80" y="904" fill="#1e3a8a" font-size="10">  → LZ4 压缩块走 WAL FPI,主备压缩率一致</text>
    <text x="80" y="920" fill="#1e3a8a" font-size="11">▸ "redo 重建 = 走原路径"</text>
    <text x="80" y="936" fill="#1e3a8a" font-size="10">  → INIT_METAPAGE 走 zsmeta_initmetapage_redo(从 image 拷贝)</text>
    <text x="80" y="952" fill="#1e3a8a" font-size="10">  → UNDO_NEWPAGE 走 zsundo_newpage_redo(从 image 拷贝)</text>
    <text x="80" y="970" fill="#1e3a8a" font-size="11" font-weight="700">▶ 简单可靠,但 WAL 流量 = 每页修改一次的 8 KB 全量</text>

    <rect x="60" y="1024" width="620" height="160" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
    <text x="80" y="1046" fill="#14532d" font-size="13" font-weight="700">redo 路径统计</text>
    <text x="80" y="1064" fill="#14532d" font-size="11">src/backend/access/rmgrdesc/zedstoredesc.c:</text>
    <text x="80" y="1082" fill="#14532d" font-size="10">rm_desc 函数对每个 op code 描述 WAL 内容</text>
    <text x="80" y="1098" fill="#14532d" font-size="10">pg_waldump 能识别 zedstore WAL(11 个描述符)</text>
    <text x="80" y="1118" fill="#475569" font-size="11" font-weight="700">▶ 11 个描述符 × RM_ZEDSTORE_ID = zedstore 完整的 WAL 语义</text>
    <text x="80" y="1140" fill="#475569" font-size="11">▶ 这些描述符让运维 pg_waldump 能直接看到 zedstore 内部修改</text>
    <text x="80" y="1162" fill="#14532d" font-size="10">▶ zedstore 没这能力 — 它走 INSERT/UPDATE/DELETE 等通用描述符</text>

    <rect x="60" y="1196" width="620" height="240" rx="6" fill="#fef3c7" stroke="#a16207" stroke-width="1.5"/>
    <text x="80" y="1218" fill="#78350f" font-size="13" font-weight="700">zedstore WAL 字节预算 (单 op)</text>
    <rect x="60" y="1230" width="620" height="20" fill="#86efac"/>
    <text x="80" y="1244" fill="#14532d" font-size="10">▸ INIT_METAPAGE: 16 字节 (natts) + 8 KB page image = ~8 KB</text>
    <rect x="60" y="1250" width="620" height="20" fill="#86efac"/>
    <text x="80" y="1264" fill="#14532d" font-size="10">▸ BTREE_NEW_ROOT: 几个字段 + 8 KB page = ~8 KB</text>
    <rect x="60" y="1270" width="620" height="20" fill="#86efac"/>
    <text x="80" y="1284" fill="#14532d" font-size="10">▸ TIDLEAF_ADD_ITEMS: 几个字段 + 8 KB page = ~8 KB</text>
    <rect x="60" y="1290" width="620" height="20" fill="#86efac"/>
    <text x="80" y="1304" fill="#14532d" font-size="10">▸ ATTSTREAM_CHANGE: 几个字段 + 8 KB compressed page = ~8 KB</text>
    <rect x="60" y="1310" width="620" height="20" fill="#86efac"/>
    <text x="80" y="1324" fill="#14532d" font-size="10">▸ TOAST_NEWPAGE: 几个字段 + 8 KB toast page = ~8 KB</text>
    <rect x="60" y="1330" width="620" height="20" fill="#86efac"/>
    <text x="80" y="1344" fill="#14532d" font-size="10">▸ FPM_*: 几个字段 + 8 KB free page = ~8 KB</text>

    <text x="80" y="1380" fill="#831843" font-size="11" font-weight="700">▶ 平均每个 op 约 8 KB · INSERT 触发 TIDLEAF_ADD + ATTSTREAM_CHANGE = 16 KB</text>
    <text x="80" y="1400" fill="#831843" font-size="11">▶ 这是 orioledb 的 4-8 倍(orioledb 单次 INSERT 几十到几百字节)</text>
    <text x="80" y="1424" fill="#831843" font-size="10">▶ 因为 WAL 也走压缩块 — 1 行 100 KB 的 INSERT 在 WAL 上 ≈ 8 KB</text>
  </g>

  <!-- ============================== RIGHT: OrioleDB ============================== -->
  <g filter="url(#softShadow)">
    <rect x="720" y="94" width="660" height="1340" rx="12" fill="#fff" stroke="#0f172a" stroke-width="2"/>
    <text x="1050" y="124" text-anchor="middle" fill="#0f172a" font-size="18" font-weight="700">OrioleDB · 24 种 logical record · LocalWal 缓冲</text>
    <text x="1050" y="144" text-anchor="middle" fill="#475569" font-size="12">src/recovery/wal.c · include/recovery/wal_record.h · X-Macro 自动生成</text>

    <rect x="740" y="158" width="620" height="180" rx="6" fill="#fce7f3" stroke="#9d174d" stroke-width="1.5"/>
    <text x="760" y="180" fill="#831843" font-size="13" font-weight="700">24 种 WAL_REC_* (X-Macro 自动生成)</text>
    <text x="760" y="198" fill="#831843" font-size="10">ORIOLE_WAL_RECORDS(X) ... X(WAL_REC_XID, 1, "XID", wal_parse_rec_xid) ...</text>

    <text x="760" y="220" fill="#831843" font-size="10">▸ XID / COMMIT / ROLLBACK / RELATION (transaction 框架)</text>
    <text x="760" y="234" fill="#831843" font-size="10">▸ INSERT / UPDATE / DELETE / REINSERT (DML)</text>
    <text x="760" y="248" fill="#831843" font-size="10">▸ O_TABLES_META_LOCK/UNLOCK (DDL)</text>
    <text x="760" y="262" fill="#831843" font-size="10">▸ SAVEPOINT / RB_TO_SP / JOINT_COMMIT (嵌套事务)</text>
    <text x="760" y="276" fill="#831843" font-size="10">▸ TRUNCATE / BRIDGE_ERASE / RELREPLIDENT</text>
    <text x="760" y="290" fill="#831843" font-size="10">▸ REPLAY_FEEDBACK / SWITCH_LOGICAL_XID (逻辑解码)</text>
    <text x="760" y="304" fill="#831843" font-size="10">▸ DATABASE_COPY/CREATE_COPY/TEMPLATE_CHECKPOINT</text>
    <text x="760" y="318" fill="#831843" font-size="10">▸ CIC_WRITERS_DIRECT/DRAIN_BARRIER/INDEX_VALID (catchup 模式)</text>

    <text x="760" y="332" fill="#831843" font-size="11" font-weight="700">▶ 每种 rec 有独立的 parse 函数,X-Macro 一次展开</text>

    <rect x="740" y="354" width="620" height="220" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <text x="760" y="376" fill="#1e3a8a" font-size="13" font-weight="700">WALRecXid 字节布局 (示例)</text>
    <text x="760" y="394" fill="#1e3a8a" font-size="10">include/recovery/wal.h:85-92:</text>
    <text x="760" y="412" fill="#1e3a8a" font-size="10">typedef struct {</text>
    <text x="760" y="426" fill="#1e3a8a" font-size="10">    uint8  recType;                      // 1 byte</text>
    <text x="760" y="440" fill="#1e3a8a" font-size="10">    uint8  oxid[sizeof(OXid)];           // 8 bytes (64-bit OXid)</text>
    <text x="760" y="454" fill="#1e3a8a" font-size="10">    uint8  logicalXid[sizeof(TransactionId)];  // 4 bytes</text>
    <text x="760" y="468" fill="#1e3a8a" font-size="10">    uint8  heapXid[sizeof(TransactionId)];      // 4 bytes (since v17)</text>
    <text x="760" y="482" fill="#1e3a8a" font-size="10">} WALRecXid;</text>

    <text x="760" y="506" fill="#1e3a8a" font-size="11">▶ 17 字节 + WAL header</text>
    <text x="760" y="522" fill="#1e3a8a" font-size="11">▶ OXid + logicalXid + heapXid 三方映射</text>
    <text x="760" y="540" fill="#1e3a8a" font-size="10">→ OXid = orioledb 自己的事务 id (64-bit)</text>
    <text x="760" y="554" fill="#1e3a8a" font-size="10">→ logicalXid = 逻辑解码接口的 id (32-bit)</text>
    <text x="760" y="568" fill="#1e3a8a" font-size="10">→ heapXid = PG 堆上的对应 xid (32-bit)</text>

    <rect x="740" y="592" width="620" height="200" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
    <text x="760" y="614" fill="#14532d" font-size="13" font-weight="700">LocalWal 批量缓冲机制</text>
    <text x="760" y="632" fill="#14532d" font-size="11">src/recovery/wal.c:32-56:</text>
    <text x="760" y="650" fill="#14532d" font-size="10">typedef struct {</text>
    <text x="760" y="664" fill="#14532d" font-size="10">    int  buffer_offset;</text>
    <text x="760" y="678" fill="#14532d" font-size="10">    bool has_material_changes;</text>
    <text x="760" y="692" fill="#14532d" font-size="10">    bool contains_xid;            // 已经写过一次 XID</text>
    <text x="760" y="706" fill="#14532d" font-size="10">    bool contains_switch_xid;</text>
    <text x="760" y="720" fill="#14532d" font-size="10">    ORelOids  oids;</text>
    <text x="760" y="734" fill="#14532d" font-size="10">    OIndexType ix_type;</text>
    <text x="760" y="748" fill="#14532d" font-size="10">    char buffer[LOCAL_WAL_BUFFER_SIZE];</text>
    <text x="760" y="762" fill="#14532d" font-size="10">} LocalWal;</text>

    <text x="760" y="784" fill="#14532d" font-size="11" font-weight="700">▶ backend 私有内存,不进 shmem</text>
    <text x="760" y="804" fill="#14532d" font-size="10">▶ add_modify_wal_record_extended 把 record 攒到 buffer_offset</text>
    <text x="760" y="820" fill="#14532d" font-size="10">▶ 满一次性 XLogInsert 进 PG shared WAL</text>

    <rect x="740" y="808" width="620" height="220" rx="6" fill="#fef3c7" stroke="#a16207" stroke-width="1.5"/>
    <text x="760" y="830" fill="#78350f" font-size="13" font-weight="700">batch INSERT 流程 (add_modify_wal_record)</text>
    <text x="760" y="848" fill="#78350f" font-size="11">▸ 检查 oids/ix_type 变没变 → 若变加 WALRecRelation 头</text>
    <text x="760" y="864" fill="#78350f" font-size="10">  → 含 tablespace + xmin + csn + cid + version + baseVersion</text>
    <text x="760" y="880" fill="#78350f" font-size="11">▸ 检查 contains_xid → 若没写过就加 WALRecXid 头</text>
    <text x="760" y="894" fill="#78350f" font-size="10">  → 含 OXid + logicalXid + heapXid</text>
    <text x="760" y="908" fill="#78350f" font-size="11">▸ 加 WALRecModify1 或 WALRecModify2</text>
    <text x="760" y="924" fill="#78350f" font-size="10">  → Modify1 = recType + tupleFormatFlags + length + tuple data</text>
    <text x="760" y="938" fill="#78350f" font-size="10">  → Modify2 = recType + tupleFormatFlags1/2 + length1/2 + tuple1 + tuple2</text>
    <text x="760" y="954" fill="#78350f" font-size="11">▸ flush_local_wal → 一次性 XLogInsert 整个 buffer</text>

    <text x="760" y="978" fill="#475569" font-size="11" font-weight="700">▶ 多行复用 XID + RELATION 头,大幅压缩 WAL 流量</text>

    <rect x="740" y="1044" width="620" height="180" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
    <text x="760" y="1066" fill="#1e3a8a" font-size="13" font-weight="700">commit 流程 (wal_commit)</text>
    <text x="760" y="1084" fill="#1e3a8a" font-size="11">▸ if (!local_wal.has_material_changes) → 无效 return</text>
    <text x="760" y="1100" fill="#1e3a8a" font-size="10">  → 只读事务直接 return,不写 WAL</text>
    <text x="760" y="1114" fill="#1e3a8a" font-size="11">▸ WALRecFinish = recType + xmin (OXid) + csn (CommitSeqNo)</text>
    <text x="760" y="1130" fill="#1e3a8a" font-size="10">  → xmin = 当前全局最老 OXid</text>
    <text x="760" y="1144" fill="#1e3a8a" font-size="10">  → csn = nextCommitSeqNo (单调递增)</text>
    <text x="760" y="1160" fill="#1e3a8a" font-size="11">▸ if (synchronous_commit &gt;= REMOTE_APPLY) → 加 WAL_REC_REPLAY_FEEDBACK</text>
    <text x="760" y="1176" fill="#1e3a8a" font-size="11">▸ flush_local_wal(true, !isAutonomous) → XLogInsert 整个 buffer</text>
    <text x="760" y="1196" fill="#1e3a8a" font-size="11" font-weight="700">▶ COMMIT 包含 xmin (全局最老) + csn (commit 序号) = raft 友好</text>
    <text x="760" y="1214" fill="#1e3a8a" font-size="11">▶ 备机拿 csn 就能知道事务序,无需维护全局 XID</text>

    <rect x="740" y="1240" width="620" height="180" rx="6" fill="#fce7f3" stroke="#9d174d" stroke-width="1.5"/>
    <text x="760" y="1262" fill="#831843" font-size="13" font-weight="700">key 创新: SWITCH_LOGICAL_XID</text>
    <text x="760" y="1280" fill="#831843" font-size="11">src/recovery/wal.c:634-656 + wal_record.h:27-39 注释</text>
    <text x="760" y="1298" fill="#831843" font-size="10">▸ 场景: 事务同时改 PG 堆表 + orioledb 表</text>
    <text x="760" y="1314" fill="#831843" font-size="10">▸ heap 给 logicalXid (top),orioledb 给 logicalXid (sub)</text>
    <text x="760" y="1330" fill="#831843" font-size="10">▸ SWITCH_LOGICAL_XID record 显式声明二者关系</text>
    <text x="760" y="1346" fill="#831843" font-size="10">▸ 让 logical decoder 知道 "两个 xid 实际是一个事务"</text>

    <text x="760" y="1370" fill="#831843" font-size="11">▶ 这是 orioledb 独有,zedstore 完全没这能力</text>
    <text x="760" y="1390" fill="#831843" font-size="11">▶ 为什么需要: orioledb 是 PG extension,逻辑解码必须兼容 PG 堆</text>
    <text x="760" y="1410" fill="#831843" font-size="11" font-weight="700">▶ 这让 orioledb 在 raft 复制 + active-active 场景里能正常工作</text>
  </g>

