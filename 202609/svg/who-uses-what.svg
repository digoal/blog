<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="800" height="460" fill="#fafafa"/>
  <text x="400" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">主流 AI coding agent 的 session 后端:谁用什么</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#475569">事实表 · 来源链接见正文 / 全部 7 个工具 + 2 个反例</text>

  <!-- 5 JSONL boxes -->
  <g transform="translate(40,90)">
    <text x="0" y="0" font-size="14" font-weight="700" fill="#1d4ed8">append-only JSONL 文件</text>
    <rect x="0" y="14" width="220" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="110" y="42" text-anchor="middle" font-size="13" fill="#1e3a8a">Claude Code</text>
    <text x="110" y="60" text-anchor="middle" font-size="11" fill="#334155">~/.claude/projects/&lt;slug&gt;/&lt;uuid&gt;.jsonl</text>

    <rect x="0" y="84" width="220" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="110" y="112" text-anchor="middle" font-size="13" fill="#1e3a8a">OpenAI Codex CLI</text>
    <text x="110" y="130" text-anchor="middle" font-size="11" fill="#334155">rollout jsonl + state_5.sqlite 索引</text>

    <rect x="0" y="154" width="220" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="110" y="182" text-anchor="middle" font-size="13" fill="#1e3a8a">Gemini CLI</text>
    <text x="110" y="200" text-anchor="middle" font-size="11" fill="#334155">chat-&lt;iso&gt;-&lt;uuid&gt;.json + RewindRecord</text>

    <rect x="0" y="224" width="220" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="110" y="252" text-anchor="middle" font-size="13" fill="#1e3a8a">Aider</text>
    <text x="110" y="270" text-anchor="middle" font-size="11" fill="#334155">.aider.chat.history.md (markdown)</text>

    <rect x="0" y="294" width="220" height="56" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="110" y="322" text-anchor="middle" font-size="13" fill="#7f1d1d">Vibe Kanban (logs 部分)</text>
    <text x="110" y="340" text-anchor="middle" font-size="11" fill="#7f1d1d">从 SQLite 迁出 (2026-02)</text>
  </g>

  <!-- 3 SQLite boxes -->
  <g transform="translate(520,90)">
    <text x="0" y="0" font-size="14" font-weight="700" fill="#b91c1c">SQLite (含 FTS5 / Drizzle / 状态机)</text>
    <rect x="0" y="14" width="240" height="56" rx="6" fill="#fecaca" stroke="#b91c1c" stroke-width="1.5"/>
    <text x="120" y="42" text-anchor="middle" font-size="13" fill="#7f1d1d">Cursor</text>
    <text x="120" y="60" text-anchor="middle" font-size="11" fill="#7f1d1d">state.vscdb + cursorDiskKV</text>

    <rect x="0" y="84" width="240" height="56" rx="6" fill="#fecaca" stroke="#b91c1c" stroke-width="1.5"/>
    <text x="120" y="112" text-anchor="middle" font-size="13" fill="#7f1d1d">OpenCode (sst/opencode)</text>
    <text x="120" y="130" text-anchor="middle" font-size="11" fill="#7f1d1d">opencode.db · 2026-02 从 JSON 迁入</text>

    <rect x="0" y="154" width="240" height="56" rx="6" fill="#fecaca" stroke="#b91c1c" stroke-width="1.5"/>
    <text x="120" y="182" text-anchor="middle" font-size="13" fill="#7f1d1d">Hermes (本机)</text>
    <text x="120" y="200" text-anchor="middle" font-size="11" fill="#7f1d1d">state.db (110 session, 12.8k messages)</text>

    <rect x="0" y="224" width="240" height="56" rx="6" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6,3"/>
    <text x="120" y="252" text-anchor="middle" font-size="13" fill="#5b21b6">Codex state_5.sqlite (索引)</text>
    <text x="120" y="270" text-anchor="middle" font-size="11" fill="#5b21b6">真源是 rollout jsonl,索引可重建</text>
  </g>

  <!-- middle: hybrid arrow -->
  <g transform="translate(400,200)">
    <text x="0" y="0" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">↔ 双栈混合 ↔</text>
    <text x="0" y="22" text-anchor="middle" font-size="11" fill="#475569">Codex + Hermes 都在用:</text>
    <text x="0" y="42" text-anchor="middle" font-size="11" fill="#475569">JSONL 当真源</text>
    <text x="0" y="60" text-anchor="middle" font-size="11" fill="#475569">SQLite 当索引</text>
    <text x="0" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">我下文要论证的:</text>
    <text x="0" y="104" text-anchor="middle" font-size="11" fill="#0f766e">这其实是"最稳的形态"</text>
  </g>
</svg>
