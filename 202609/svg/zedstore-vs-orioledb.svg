<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1380" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="zsBg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#082f49"/>
      <stop offset="1" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="orBg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#3f1d0e"/>
      <stop offset="1" stop-color="#7c2d12"/>
    </linearGradient>
    <linearGradient id="poolBg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#365314"/>
      <stop offset="1" stop-color="#1a2e05"/>
    </linearGradient>
    <linearGradient id="oxidBg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#581c87"/>
      <stop offset="1" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="undoBg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#9a3412"/>
      <stop offset="1" stop-color="#7c2d12"/>
    </linearGradient>
    <linearGradient id="walBg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#7f1d1d"/>
      <stop offset="1" stop-color="#450a0a"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/>
    </marker>
  </defs>

  <rect width="1400" height="1380" fill="#fafafa"/>

  <!-- title -->
  <rect x="0" y="0" width="1400" height="74" fill="#0f172a"/>
  <text x="40" y="34" fill="#f8fafc" font-size="22" font-weight="700">ZedStore vs OrioleDB · 同一帮人,同一问题,五年后的答案</text>
  <text x="40" y="58" fill="#94a3b8" font-size="13">2020-11 冻结的 fork vs 2026-09 beta17 的 PG18 extension · 9 项架构差异</text>

  <!-- ZS side -->
  <g filter="url(#softShadow)">
    <rect x="40" y="94" width="660" height="620" rx="12" fill="url(#zsBg)" stroke="#0f172a" stroke-width="2"/>
    <text x="370" y="124" text-anchor="middle" fill="#f0f9ff" font-size="18" font-weight="700">ZedStore · PG13 fork</text>
    <text x="370" y="144" text-anchor="middle" fill="#bae6fd" font-size="12">src/backend/access/zedstore/ · 19,074 行 C · 1 commit</text>

    <rect x="60" y="160" width="620" height="74" rx="6" fill="#0c4a6e" stroke="#0f172a"/>
    <text x="80" y="182" fill="#f0f9ff" font-size="13" font-weight="600">Metapage (block 0) 装所有元数据</text>
    <text x="80" y="200" fill="#bae6fd" font-size="11">N 列根 BlockNumber + UNDO head/tail + per-att FPM 链头</text>
    <text x="80" y="218" fill="#fca5a5" font-size="11">瓶颈: metapage 是单点, 高并发写会被卡</text>

    <rect x="60" y="246" width="620" height="74" rx="6" fill="#0c4a6e" stroke="#0f172a"/>
    <text x="80" y="268" fill="#f0f9ff" font-size="13" font-weight="600">每列一棵树 · 走 PG 原生 BUFFER</text>
    <text x="80" y="286" fill="#bae6fd" font-size="11">B-tree leaf 压缩块进 shared_buffers</text>
    <text x="80" y="304" fill="#bae6fd" font-size="11">走 ReadBuffer + BUFFER_LOCK_SHARE/EXCLUSIVE</text>

    <rect x="60" y="332" width="620" height="74" rx="6" fill="#0c4a6e" stroke="#0f172a"/>
    <text x="80" y="354" fill="#f0f9ff" font-size="13" font-weight="600">TID 树 (attno=0) + UNDO slot 0/1/2/3</text>
    <text x="80" y="372" fill="#bae6fd" font-size="11">TID 是 48-bit 逻辑行号, 物理位置自由重排</text>
    <text x="80" y="390" fill="#bae6fd" font-size="11">ZSTidArrayItem 走 Simple-8b + 2 位 slotno</text>

    <rect x="60" y="418" width="620" height="68" rx="6" fill="#0c4a6e" stroke="#0f172a"/>
    <text x="80" y="440" fill="#f0f9ff" font-size="13" font-weight="600">PG 32-bit XID · ZSTidArrayItem 自带 xmin</text>
    <text x="80" y="458" fill="#bae6fd" font-size="11">还是依赖 heap xmin/xmax 体系, 走 PG CLOG</text>
    <text x="80" y="476" fill="#fca5a5" font-size="11">▶ 32-bit XID wraparound 风险没消除</text>

    <rect x="60" y="498" width="620" height="68" rx="6" fill="#0c4a6e" stroke="#0f172a"/>
    <text x="80" y="520" fill="#f0f9ff" font-size="13" font-weight="600">FPM 链表头在 metapage</text>
    <text x="80" y="538" fill="#bae6fd" font-size="11">per-att FPM 改善 IO readahead, 但 LIFO</text>
    <text x="80" y="556" fill="#fca5a5" font-size="11">▶ README 自承 "doesn't scale very well"</text>

    <rect x="60" y="578" width="620" height="68" rx="6" fill="#0c4a6e" stroke="#0f172a"/>
    <text x="80" y="600" fill="#f0f9ff" font-size="13" font-weight="600">UNDO log: append-only byte stream</text>
    <text x="80" y="618" fill="#bae6fd" font-size="11">head/tail 都是物理 blkno, 满了新页接上</text>
    <text x="80" y="636" fill="#fca5a5" font-size="11">▶ XXX: hopefully replaced with UPS later</text>

    <rect x="60" y="658" width="300" height="48" rx="6" fill="#0c4a6e" stroke="#0f172a"/>
    <text x="210" y="680" text-anchor="middle" fill="#f0f9ff" font-size="11" font-weight="700">WAL · FPI 全页镜像</text>
    <text x="210" y="696" text-anchor="middle" fill="#bae6fd" font-size="10">9 个 op code</text>

    <rect x="380" y="658" width="300" height="48" rx="6" fill="#0c4a6e" stroke="#0f172a"/>
    <text x="530" y="680" text-anchor="middle" fill="#f0f9ff" font-size="11" font-weight="700">TOAST · 同文件 chain</text>
    <text x="530" y="696" text-anchor="middle" fill="#bae6fd" font-size="10">无独立 pg_toast 表</text>
  </g>

  <!-- OrioleDB side -->
  <g filter="url(#softShadow)">
    <rect x="720" y="94" width="660" height="620" rx="12" fill="url(#orBg)" stroke="#0f172a" stroke-width="2"/>
    <text x="1050" y="124" text-anchor="middle" fill="#ffedd5" font-size="18" font-weight="700">OrioleDB · PG18 extension</text>
    <text x="1050" y="144" text-anchor="middle" fill="#fed7aa" font-size="12">contrib/orioledb · 42,984 行 C · beta17 · 2026-09</text>

    <rect x="740" y="160" width="620" height="74" rx="6" fill="#7c2d12" stroke="#0f172a"/>
    <text x="760" y="182" fill="#ffedd5" font-size="13" font-weight="600">每张表有独立 rootPageBlkno + metaPageBlkno</text>
    <text x="760" y="200" fill="#fed7aa" font-size="11">rootInfo {rootPageBlkno, metaPageBlkno}</text>
    <text x="760" y="218" fill="#86efac" font-size="11">无全局 metapage, 每表独立初始化 (btree.c:53-68)</text>

    <rect x="740" y="246" width="620" height="74" rx="6" fill="#7c2d12" stroke="#0f172a"/>
    <text x="760" y="268" fill="#ffedd5" font-size="13" font-weight="600">自管 OBuffer · 绕过 PG shared_buffers</text>
    <text x="760" y="286" fill="#fed7aa" font-size="11">OBuffer{blockNum, shadowBlockNum, tag, usageCount, dirty}</text>
    <text x="760" y="304" fill="#86efac" font-size="11">No buffer mapping + lock-less page reading</text>

    <rect x="740" y="332" width="620" height="74" rx="6" fill="#7c2d12" stroke="#0f172a"/>
    <text x="760" y="354" fill="#ffedd5" font-size="13" font-weight="600">所有 B-tree 走 CommitSeqNo (CSN) 排序</text>
    <text x="760" y="372" fill="#fed7aa" font-size="11">undo.c + btree/undo.c 形成 undo chain</text>
    <text x="760" y="390" fill="#86efac" font-size="11">按 CSN 走 visibility, 不依赖 32-bit XID</text>

    <rect x="740" y="418" width="620" height="68" rx="6" fill="#7c2d12" stroke="#0f172a"/>
    <text x="760" y="440" fill="#ffedd5" font-size="13" font-weight="600">64-bit OXid + 64-bit CommitSeqNo</text>
    <text x="760" y="458" fill="#fed7aa" font-size="11">oxid.c:42-56 定义 CSN/SPECIAL/LEVEL</text>
    <text x="760" y="476" fill="#86efac" font-size="11">▶ 终结 32-bit XID wraparound</text>

    <rect x="740" y="498" width="620" height="68" rx="6" fill="#7c2d12" stroke="#0f172a"/>
    <text x="760" y="520" fill="#ffedd5" font-size="13" font-weight="600">Logical Page Pool (shared memory)</text>
    <text x="760" y="538" fill="#fed7aa" font-size="11">page_pool.c + free_extents.c 统一管理</text>
    <text x="760" y="556" fill="#86efac" font-size="11">▶ 解决 "metapage 是瓶颈" 问题</text>

    <rect x="740" y="578" width="620" height="68" rx="6" fill="#7c2d12" stroke="#0f172a"/>
    <text x="760" y="600" fill="#ffedd5" font-size="13" font-weight="600">Undo Log: circular buffer + retain heap</text>
    <text x="760" y="618" fill="#fed7aa" font-size="11">undo.c:76-87 retainUndoLocHeaps[UndoLogsCount=3]</text>
    <text x="760" y="636" fill="#86efac" font-size="11">▶ 复用老空间, 无需回收物理页</text>

    <rect x="740" y="658" width="300" height="48" rx="6" fill="#7c2d12" stroke="#0f172a"/>
    <text x="890" y="680" text-anchor="middle" fill="#ffedd5" font-size="11" font-weight="700">WAL · 行级 logical records</text>
    <text x="890" y="696" text-anchor="middle" fill="#fed7aa" font-size="10">+ parallel apply + raft 友好</text>

    <rect x="1060" y="658" width="300" height="48" rx="6" fill="#7c2d12" stroke="#0f172a"/>
    <text x="1210" y="680" text-anchor="middle" fill="#ffedd5" font-size="11" font-weight="700">TOAST · 独立 BTree</text>
    <text x="1210" y="696" text-anchor="middle" fill="#fed7aa" font-size="10">每表一个 TOAST BTree</text>
  </g>

  <!-- 关键变更连线 -->
  <g stroke="#22d3ee" stroke-width="2.5" stroke-dasharray="6 4" fill="none">
    <line x1="680" y1="200" x2="740" y2="200" marker-end="url(#arr)"/>
    <line x1="680" y1="280" x2="740" y2="280" marker-end="url(#arr)"/>
    <line x1="680" y1="360" x2="740" y2="360" marker-end="url(#arr)"/>
    <line x1="680" y1="442" x2="740" y2="442" marker-end="url(#arr)"/>
    <line x1="680" y1="528" x2="740" y2="528" marker-end="url(#arr)"/>
    <line x1="680" y1="612" x2="740" y2="612" marker-end="url(#arr)"/>
    <line x1="680" y1="680" x2="740" y2="680" marker-end="url(#arr)"/>
  </g>

  <!-- 关键变更标题 -->
  <rect x="690" y="195" width="56" height="22" rx="3" fill="#22d3ee"/>
  <text x="718" y="210" text-anchor="middle" fill="#0f172a" font-size="10" font-weight="700">演化</text>

  <!-- OrioleDB 独有的 s3 + bgwriter -->
  <g filter="url(#softShadow)">
    <rect x="40" y="734" width="1340" height="160" rx="12" fill="url(#poolBg)" stroke="#0f172a" stroke-width="2"/>
    <text x="700" y="764" text-anchor="middle" fill="#ecfccb" font-size="18" font-weight="700">OrioleDB 独享 · zedstore 没有的子系统</text>

    <rect x="60" y="780" width="420" height="98" rx="6" fill="#1a2e05" stroke="#0f172a"/>
    <text x="80" y="802" fill="#ecfccb" font-size="13" font-weight="600">Logical Page Pool</text>
    <text x="80" y="822" fill="#d9f99d" font-size="11">page_pool.c · 804 行</text>
    <text x="80" y="838" fill="#d9f99d" font-size="11">shared + local 双 ops, 支持 reserve/release</text>
    <text x="80" y="856" fill="#d9f99d" font-size="11">统一 free page 管理, 取代 zedstore 的 FPM 链表</text>
    <text x="80" y="872" fill="#86efac" font-size="10">▶ page_pool.c:49-65 + 84-100 双 ops 注册</text>

    <rect x="500" y="780" width="420" height="98" rx="6" fill="#1a2e05" stroke="#0f172a"/>
    <text x="520" y="802" fill="#ecfccb" font-size="13" font-weight="600">Background Writer (BGWriter)</text>
    <text x="520" y="822" fill="#d9f99d" font-size="11">workers/bgwriter.c · 239 行</text>
    <text x="520" y="838" fill="#d9f99d" font-size="11">注册 PG BackgroundWorker 进程</text>
    <text x="520" y="856" fill="#d9f99d" font-size="11">做 page evict + dirty page write + undo retain</text>
    <text x="520" y="872" fill="#86efac" font-size="10">▶ bgwriter.c:46-62 RegisterBackgroundWorker</text>

    <rect x="940" y="780" width="420" height="98" rx="6" fill="#1a2e05" stroke="#0f172a"/>
    <text x="960" y="802" fill="#ecfccb" font-size="13" font-weight="600">S3 Checkpoint Worker</text>
    <text x="960" y="822" fill="#d9f99d" font-size="11">s3/{checkpoint,worker,queue,requests}.c</text>
    <text x="960" y="838" fill="#d9f99d" font-size="11">把 checkpoint 直接落到 S3</text>
    <text x="960" y="856" fill="#d9f99d" font-size="11">用 libcurl + libssl + libcrypto + libzstd</text>
    <text x="960" y="872" fill="#86efac" font-size="10">▶ Makefile SHLIB_LINK += -lzstd -lcurl -lssl</text>
  </g>

  <!-- 9 项架构差异表 -->
  <g filter="url(#softShadow)">
    <rect x="40" y="914" width="1340" height="320" rx="12" fill="#fff" stroke="#0f172a" stroke-width="2"/>
    <text x="700" y="944" text-anchor="middle" fill="#0f172a" font-size="18" font-weight="700">9 项架构差异 · 文件 + 行号证据</text>

    <rect x="60" y="958" width="1320" height="22" rx="3" fill="#0f172a"/>
    <text x="100" y="974" fill="#f0f9ff" font-size="11" font-weight="700">维度</text>
    <text x="380" y="974" fill="#f0f9ff" font-size="11" font-weight="700">ZedStore</text>
    <text x="800" y="974" fill="#f0f9ff" font-size="11" font-weight="700">OrioleDB</text>

    <rect x="60" y="984" width="1320" height="22" rx="2" fill="#f8fafc"/>
    <text x="100" y="1000" fill="#0f172a" font-size="11">1. 部署形态</text>
    <text x="380" y="1000" fill="#0f172a" font-size="11">PG fork · 17K 行 · 1 commit</text>
    <text x="800" y="1000" fill="#0f172a" font-size="11">PG extension · 43K 行 · beta17</text>

    <rect x="60" y="1010" width="1320" height="22" rx="2" fill="#f1f5f9"/>
    <text x="100" y="1026" fill="#0f172a" font-size="11">2. Buffer 管理</text>
    <text x="380" y="1026" fill="#0f172a" font-size="11">PG shared_buffers + ReadBuffer</text>
    <text x="800" y="1026" fill="#0f172a" font-size="11">自管 OBuffer · o_buffers.c · mmap</text>

    <rect x="60" y="1036" width="1320" height="22" rx="2" fill="#f8fafc"/>
    <text x="100" y="1052" fill="#0f172a" font-size="11">3. 全局元数据</text>
    <text x="380" y="1052" fill="#0f172a" font-size="11">每文件 metapage (block 0)</text>
    <text x="800" y="1052" fill="#0f172a" font-size="11">每表 rootInfo {root, meta}</text>

    <rect x="60" y="1062" width="1320" height="22" rx="2" fill="#f1f5f9"/>
    <text x="100" y="1078" fill="#0f172a" font-size="11">4. XID 模型</text>
    <text x="380" y="1078" fill="#0f172a" font-size="11">PG 32-bit XID (wraparound 风险)</text>
    <text x="800" y="1078" fill="#0f172a" font-size="11">64-bit OXid + 64-bit CSN</text>

    <rect x="60" y="1088" width="1320" height="22" rx="2" fill="#f8fafc"/>
    <text x="100" y="1104" fill="#0f172a" font-size="11">5. 空闲页管理</text>
    <text x="380" y="1104" fill="#0f172a" font-size="11">per-att FPM 链表 in metapage</text>
    <text x="800" y="1104" fill="#0f172a" font-size="11">Logical Page Pool (shmem)</text>

    <rect x="60" y="1114" width="1320" height="22" rx="2" fill="#f1f5f9"/>
    <text x="100" y="1130" fill="#0f172a" font-size="11">6. UNDO 回收</text>
    <text x="380" y="1130" fill="#0f172a" font-size="11">append-only · 老页等 VACUUM</text>
    <text x="800" y="1130" fill="#0f172a" font-size="11">circular buffer · retain heap 复用</text>

    <rect x="60" y="1140" width="1320" height="22" rx="2" fill="#f8fafc"/>
    <text x="100" y="1156" fill="#0f172a" font-size="11">7. TOAST</text>
    <text x="380" y="1156" fill="#0f172a" font-size="11">同文件 chain · 无独立表</text>
    <text x="800" y="1156" fill="#0f172a" font-size="11">独立 TOAST BTree · tuple/toast.c</text>

    <rect x="60" y="1166" width="1320" height="22" rx="2" fill="#f1f5f9"/>
    <text x="100" y="1182" fill="#0f172a" font-size="11">8. WAL 粒度</text>
    <text x="380" y="1182" fill="#0f172a" font-size="11">整页镜像 FPI · 9 op code</text>
    <text x="800" y="1182" fill="#0f172a" font-size="11">行级 logical records · raft 友好</text>

    <rect x="60" y="1192" width="1320" height="22" rx="2" fill="#f8fafc"/>
    <text x="100" y="1208" fill="#0f172a" font-size="11">9. 远程存储</text>
    <text x="380" y="1208" fill="#0f172a" font-size="11">不支持</text>
    <text x="800" y="1208" fill="#0f172a" font-size="11">S3 checkpoint · libcurl + zstd</text>
  </g>

  <!-- bottom takeaway -->
  <rect x="40" y="1254" width="1340" height="100" rx="12" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
  <text x="60" y="1284" fill="#22d3ee" font-size="16" font-weight="700">一句话总结</text>
  <text x="60" y="1308" fill="#e2e8f0" font-size="13">ZedStore 是"在 PG fork 里把列存做出 BOM 表"的实验,OrioleDB 是"在 PG extension 里把整套 BOM 重做并补上 BUG 表"的工程。</text>
  <text x="60" y="1330" fill="#e2e8f0" font-size="13">zedstore 留的 5 个 TODO(metapage 瓶颈 / UPS UNDO / page 锁 / XID wraparound / 远程存储),orioledb 用 5 个新模块(Logical Page Pool / Circular Undo Buffer / O_Buffers / OXid-CSN / S3 worker)全部填上了。</text>
</svg>