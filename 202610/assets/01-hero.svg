<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="DuckDB 2.0 发布封面">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#FDFDFB"/>
      <stop offset="1" stop-color="#F7F9FC"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FDE68A" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FDE68A" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="1200" height="680" fill="url(#bg)"/>
  <circle cx="1040" cy="120" r="260" fill="url(#glow)"/>

  <!-- 顶部标签 -->
  <rect x="72" y="96" width="234" height="32" rx="16" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.4"/>
  <text x="92" y="117" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700"
        letter-spacing="1.2" fill="#92400E">RELEASE · 2026-10-21</text>

  <!-- 主标题 -->
  <text x="70" y="214" font-family="Helvetica Neue, Arial, sans-serif" font-size="76" font-weight="800"
        letter-spacing="-2.5" fill="#0F172A">DuckDB 2.0</text>

  <text x="72" y="254" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif"
        font-size="19" fill="#64748B">代号 Cinnamon Teal · LTS 支持至 2027.10</text>

  <line x1="72" y1="284" x2="556" y2="284" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- 钩子 -->
  <text x="72" y="332" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif"
        font-size="29" font-weight="600" fill="#1E293B">这一次，它改的不只是性能，</text>
  <text x="72" y="374" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif"
        font-size="29" font-weight="600" fill="#1E293B">还有<tspan fill="#B45309">「输出给谁看」</tspan>。</text>

  <text x="72" y="416" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif"
        font-size="17" fill="#94A3B8">PEG 解析器重写 · 触发器首次落地 · VARIANT 全面集成 · 异步 I/O</text>

  <!-- 指标卡 -->
  <g filter="url(#soft)">
    <rect x="740" y="120" width="196" height="116" rx="16" fill="#FFFFFF" stroke="#E8EDF3"/>
    <rect x="956" y="120" width="196" height="116" rx="16" fill="#FFFFFF" stroke="#E8EDF3"/>
    <rect x="740" y="252" width="196" height="116" rx="16" fill="#FFFFFF" stroke="#E8EDF3"/>
    <rect x="956" y="252" width="196" height="116" rx="16" fill="#FFFFFF" stroke="#E8EDF3"/>
  </g>
  <g font-family="Helvetica Neue, Arial, sans-serif">
    <text x="762" y="174" font-size="29" font-weight="700" fill="#0F172A">20,000+</text>
    <text x="762" y="200" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="15.5" fill="#64748B">提交（自 1.5 起）</text>

    <text x="978" y="174" font-size="29" font-weight="700" fill="#0F172A">687,693</text>
    <text x="978" y="200" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="15.5" fill="#64748B">行 C++（src/）</text>

    <text x="762" y="306" font-size="29" font-weight="700" fill="#0F172A">5,933</text>
    <text x="762" y="332" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="15.5" fill="#64748B">个 .test 测试文件</text>

    <text x="978" y="306" font-size="29" font-weight="700" fill="#0F172A">v69</text>
    <text x="978" y="332" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="15.5" fill="#64748B">存储格式版本</text>
  </g>
  <g fill="#F59E0B">
    <rect x="762" y="146" width="26" height="3" rx="1.5"/>
    <rect x="978" y="146" width="26" height="3" rx="1.5"/>
    <rect x="762" y="278" width="26" height="3" rx="1.5"/>
    <rect x="978" y="278" width="26" height="3" rx="1.5"/>
  </g>

  <!-- 结论条 -->
  <rect x="72" y="470" width="690" height="78" rx="14" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.6"/>
  <text x="98" y="502" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="13.5"
        font-weight="700" letter-spacing="1" fill="#B45309">一句话结论</text>
  <text x="98" y="529" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="17"
        fill="#78350F">它不再只是「分析型 SQLite」，而是 AI 代理的默认数据层。</text>

  <text x="72" y="650" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="13"
        fill="#B6C2D2">数据来源：duckdb.org 官方公告 + DuckDB v2.0.0 源码（main / PR #27683 快照）</text>

  <!-- 鸭子 -->
  <ellipse cx="952" cy="624" rx="132" ry="11" fill="#E2E8F0" opacity="0.9"/>
  <ellipse cx="928" cy="608" rx="17" ry="5.5" fill="#F97316"/>
  <ellipse cx="986" cy="608" rx="17" ry="5.5" fill="#F97316"/>
  <path d="M 886 506 L 828 496 L 866 558 Z" fill="#F59E0B"/>
  <ellipse cx="950" cy="552" rx="88" ry="52" fill="#FACC15" stroke="#F59E0B" stroke-width="2"/>
  <circle cx="1032" cy="492" r="40" fill="#FACC15" stroke="#F59E0B" stroke-width="2"/>
  <path d="M 1066 484 L 1114 495 L 1066 507 Z" fill="#F97316" stroke="#EA580C" stroke-width="1.2"/>
  <circle cx="1042" cy="480" r="5" fill="#0F172A"/>
  <path d="M 916 532 Q 962 512 992 546 Q 958 580 918 566 Z" fill="#EAB308" opacity="0.95"/>
</svg>
