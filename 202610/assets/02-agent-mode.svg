<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600" viewBox="0 0 820 600" role="img" aria-label="DuckDB 默认输出与 Agent Mode 输出对比">
  <defs>
    <filter id="card" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="820" height="600" fill="#FFFFFF"/>

  <text x="30" y="46" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="26"
        font-weight="700" fill="#0F172A">同一个查询，两种读者</text>
  <text x="30" y="76" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="13"
        fill="#64748B">SELECT range FROM range(50) —— 同一个二进制，差别只在「谁来读」</text>

  <!-- 左面板：默认输出 -->
  <g filter="url(#card)">
    <rect x="30" y="100" width="370" height="462" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  </g>
  <path d="M 30 112 a 12 12 0 0 1 12 -12 h 346 a 12 12 0 0 1 12 12 v 28 h -370 z" fill="#F1F5F9"/>
  <text x="52" y="125" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="14"
        font-weight="600" fill="#334155">默认模式 · 给人看</text>
  <rect x="300" y="106" width="84" height="24" rx="12" fill="#E2E8F0"/>
  <text x="342" y="122" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif"
        font-size="11.5" fill="#475569">默认 40 行</text>

  <!-- 字符画表格 -->
  <rect x="100" y="170" width="230" height="300" rx="3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="215" y="200" text-anchor="middle" font-family="SF Mono, Menlo, monospace" font-size="15"
        fill="#1E293B">range</text>
  <text x="215" y="222" text-anchor="middle" font-family="SF Mono, Menlo, monospace" font-size="12"
        fill="#94A3B8">int64</text>
  <line x1="100" y1="238" x2="330" y2="238" stroke="#94A3B8" stroke-width="1.4"/>
  <g font-family="SF Mono, Menlo, monospace" font-size="14" fill="#334155" text-anchor="end">
    <text x="312" y="270">0</text>
    <text x="312" y="300">1</text>
    <text x="312" y="330">2</text>
    <text x="312" y="360">⋮</text>
    <text x="312" y="390">39</text>
  </g>
  <line x1="100" y1="408" x2="330" y2="408" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="215" y="434" text-anchor="middle" font-family="SF Mono, Menlo, monospace" font-size="12"
        fill="#94A3B8">40 rows · 40 shown</text>
  <text x="215" y="524" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif"
        font-size="13" fill="#94A3B8">边框、类型行、对齐 —— 为人眼优化</text>

  <!-- 右面板：Agent Mode -->
  <g filter="url(#card)">
    <rect x="420" y="100" width="370" height="462" rx="12" fill="#FFFFFF" stroke="#FCD34D"/>
  </g>
  <path d="M 420 112 a 12 12 0 0 1 12 -12 h 346 a 12 12 0 0 1 12 12 v 28 h -370 z" fill="#FEF3C7"/>
  <text x="442" y="125" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="14"
        font-weight="600" fill="#92400E">Agent Mode · 给模型看</text>
  <rect x="690" y="106" width="84" height="24" rx="12" fill="#FDE68A"/>
  <text x="732" y="122" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif"
        font-size="11.5" fill="#92400E">自动检测</text>

  <rect x="448" y="170" width="316" height="228" rx="8" fill="#FCFCFD" stroke="#EEF2F7"/>
  <g font-family="SF Mono, Menlo, monospace" font-size="14" fill="#1E293B">
    <text x="470" y="204">| r:BIGINT |</text>
    <text x="470" y="232" fill="#94A3B8">|---|</text>
    <text x="470" y="260">| 0 |</text>
    <text x="470" y="288">| 1 |</text>
    <text x="470" y="316" fill="#94A3B8">| ⋮ |</text>
    <text x="470" y="344">| 49 |</text>
  </g>
  <line x1="470" y1="362" x2="742" y2="362" stroke="#EEF2F7" stroke-width="1.2"/>
  <text x="470" y="386" font-family="SF Mono, Menlo, monospace" font-size="12.5" fill="#B45309">50 rows, hash 8f3c1a9d24b7e051</text>

  <rect x="448" y="414" width="316" height="66" rx="8" fill="#F0FDF4" stroke="#BBF7D0"/>
  <text x="466" y="440" font-family="SF Mono, Menlo, monospace" font-size="12" fill="#166534">estimate: ~2000000 rows read</text>
  <text x="466" y="464" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="12"
        fill="#166534">执行前先报成本</text>

  <text x="605" y="524" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif"
        font-size="13" fill="#94A3B8">类型内联、行数、结果哈希 —— 为模型消费</text>
</svg>
