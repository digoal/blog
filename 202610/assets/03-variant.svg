<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="VARIANT 类型的 shredded 存储示意">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
    <filter id="c2" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="1200" height="700" fill="#FFFFFF"/>

  <text x="56" y="58" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="31"
        font-weight="700" fill="#0F172A">VARIANT 不是「JSON 的别名」</text>
  <text x="56" y="92" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="14.5"
        fill="#64748B">写入时按数据分布把半结构化数据「切碎」成列，查询走列存，而不是逐行解析字符串</text>

  <!-- 左：原始数据 -->
  <text x="56" y="142" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="12.5"
        font-weight="700" letter-spacing="0.6" fill="#94A3B8">原始数据</text>

  <g filter="url(#c2)">
    <rect x="56" y="158" width="374" height="96" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <rect x="56" y="272" width="374" height="96" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <rect x="56" y="386" width="374" height="96" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
  </g>
  <g font-family="SF Mono, Menlo, monospace" font-size="12.5" fill="#334155">
    <text x="76" y="198">{"user": {"id": 42,</text>
    <text x="76" y="220">&#160;&#160;&#160;&#160;&#160;&#160;&#160;"tags": ["a","b"]}}</text>

    <text x="76" y="312">{"event": "click",</text>
    <text x="76" y="334">&#160;"x": 10, "y": 20}</text>

    <text x="76" y="426">{"user": {"id": 7},</text>
    <text x="76" y="448">&#160;"payload": {"k": [1,2]}}</text>
  </g>

  <!-- 中间箭头 -->
  <line x1="452" y1="320" x2="536" y2="320" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="494" y="300" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif"
        font-size="12" font-weight="600" fill="#475569">shredding</text>
  <text x="494" y="344" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif"
        font-size="11" fill="#94A3B8">采样统计</text>

  <!-- 右：shredded 表 -->
  <text x="560" y="142" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="12.5"
        font-weight="700" letter-spacing="0.6" fill="#94A3B8">实际存储（Shredded VARIANT）</text>

  <!-- 表头 -->
  <rect x="560" y="158" width="584" height="62" rx="8" fill="#F1F5F9"/>
  <line x1="560" y1="168" x2="560" y2="411" stroke="#E2E8F0" stroke-width="1.2"/>
  <line x1="690" y1="160" x2="690" y2="411" stroke="#E2E8F0" stroke-width="1.2"/>
  <line x1="850" y1="160" x2="850" y2="411" stroke="#E2E8F0" stroke-width="1.2"/>
  <line x1="1144" y1="160" x2="1144" y2="411" stroke="#E2E8F0" stroke-width="1.2"/>

  <g font-family="SF Mono, Menlo, monospace" font-size="12.5" fill="#0F172A">
    <text x="576" y="184">user.id</text>
    <text x="706" y="184">user.tags</text>
    <text x="866" y="184">event</text>
    <text x="986" y="184">__untyped</text>
  </g>
  <g font-family="SF Mono, Menlo, monospace" font-size="10.5" fill="#94A3B8">
    <text x="576" y="204">BIGINT</text>
    <text x="706" y="204">VARCHAR[]</text>
    <text x="866" y="204">VARCHAR</text>
    <text x="986" y="204">VARIANT（覆盖列）</text>
  </g>

  <!-- 行 1 -->
  <line x1="560" y1="220" x2="1144" y2="220" stroke="#EEF2F7" stroke-width="1.2"/>
  <text x="576" y="254" font-family="SF Mono, Menlo, monospace" font-size="13" fill="#0F172A">42</text>
  <text x="706" y="254" font-family="SF Mono, Menlo, monospace" font-size="13" fill="#0F172A">[a, b]</text>
  <text x="866" y="254" font-family="SF Mono, Menlo, monospace" font-size="13" fill="#CBD5E1">NULL</text>
  <text x="986" y="254" font-family="SF Mono, Menlo, monospace" font-size="13" fill="#CBD5E1">NULL</text>

  <!-- 行 2 -->
  <line x1="560" y1="287" x2="1144" y2="287" stroke="#EEF2F7" stroke-width="1.2"/>
  <text x="576" y="321" font-family="SF Mono, Menlo, monospace" font-size="13" fill="#CBD5E1">NULL</text>
  <text x="706" y="321" font-family="SF Mono, Menlo, monospace" font-size="13" fill="#CBD5E1">NULL</text>
  <text x="866" y="321" font-family="SF Mono, Menlo, monospace" font-size="13" fill="#0F172A">click</text>
  <rect x="972" y="296" width="170" height="30" rx="6" fill="#FEF3C7"/>
  <text x="986" y="316" font-family="SF Mono, Menlo, monospace" font-size="11.5" fill="#92400E">{"x":10,"y":20}</text>

  <!-- 行 3 -->
  <line x1="560" y1="354" x2="1144" y2="354" stroke="#EEF2F7" stroke-width="1.2"/>
  <text x="576" y="388" font-family="SF Mono, Menlo, monospace" font-size="13" fill="#0F172A">7</text>
  <text x="706" y="388" font-family="SF Mono, Menlo, monospace" font-size="13" fill="#CBD5E1">NULL</text>
  <text x="866" y="388" font-family="SF Mono, Menlo, monospace" font-size="13" fill="#CBD5E1">NULL</text>
  <rect x="972" y="363" width="170" height="30" rx="6" fill="#FEF3C7"/>
  <text x="986" y="383" font-family="SF Mono, Menlo, monospace" font-size="11.5" fill="#92400E">{"payload":{"k":…}}</text>
  <line x1="560" y1="411" x2="1144" y2="411" stroke="#E2E8F0" stroke-width="1.2"/>

  <!-- 覆盖列虚线框 -->
  <rect x="970" y="158" width="174" height="253" rx="8" fill="none" stroke="#F59E0B" stroke-width="1.6"
        stroke-dasharray="7 5"/>

  <text x="560" y="444" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="12.5"
        fill="#64748B">拼不进强类型列的行，不丢——落进覆盖列（untyped_value_index），查询时按需回放。</text>

  <!-- 底部说明 -->
  <rect x="56" y="486" width="1088" height="150" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="84" y="522" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="13"
        font-weight="700" letter-spacing="0.4" fill="#475569">为什么这样更快</text>

  <g font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif">
    <text x="84" y="562" font-size="13.5" font-weight="600" fill="#0F172A">① 先统计，再建列</text>
    <text x="84" y="586" font-size="11.8" fill="#94A3B8">VariantShreddingStats 采样每个字段的类型分布</text>

    <text x="452" y="562" font-size="13.5" font-weight="600" fill="#0F172A">② 少数派不报错</text>
    <text x="452" y="586" font-size="11.8" fill="#94A3B8">类型对不上的值退到覆盖列，schema 不崩</text>

    <text x="820" y="562" font-size="13.5" font-weight="600" fill="#0F172A">③ 一路列存到底</text>
    <text x="820" y="586" font-size="11.8" fill="#94A3B8">Parquet 也按 shredded 结构读写，不二次转换</text>
  </g>
  <text x="56" y="676" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="11"
        fill="#B6C2D2">VARIANT 于 1.5 引入，2.0 打通端到端：存储格式 / 执行引擎 / Parquet 读写 / variant_* 函数族</text>
  <g fill="#F59E0B">
    <rect x="84" y="604" width="180" height="3" rx="1.5"/>
    <rect x="452" y="604" width="180" height="3" rx="1.5"/>
    <rect x="820" y="604" width="180" height="3" rx="1.5"/>
  </g>
</svg>
