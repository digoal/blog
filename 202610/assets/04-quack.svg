<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="DuckDB Quack 协议架构示意">
  <defs>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
    <marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F59E0B"/>
    </marker>
    <filter id="c3" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="1200" height="700" fill="#FFFFFF"/>

  <text x="56" y="58" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="31"
        font-weight="700" fill="#0F172A">Quack：把 DuckDB 变成一台服务器</text>
  <text x="56" y="92" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="14.5"
        fill="#64748B">不是 PostgreSQL 协议兼容层，而是一个扩展 + 一条 CONNECT —— 客户端和服务端是同一个二进制</text>

  <!-- 客户端 -->
  <g filter="url(#c3)">
    <rect x="56" y="160" width="330" height="242" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
  </g>
  <path d="M 56 174 a 14 14 0 0 1 14 -14 h 302 a 14 14 0 0 1 14 14 v 36 h -330 z" fill="#F1F5F9"/>
  <text x="80" y="196" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="13.5"
        font-weight="600" fill="#334155">你的笔记本 / CI</text>
  <g font-family="SF Mono, Menlo, monospace" font-size="12" fill="#1E293B">
    <text x="80" y="242">ATTACH 'quack:localhost'</text>
    <text x="80" y="264" fill="#475569">&#160;&#160;AS qk (TOKEN 'my_token');</text>
    <text x="80" y="300" fill="#B45309">CONNECT qk;</text>
    <text x="80" y="336">SELECT * FROM events;</text>
  </g>
  <text x="80" y="376" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="11.5"
        fill="#94A3B8">CLI 快捷方式：duckdb -connect</text>

  <!-- 代理 -->
  <rect x="436" y="196" width="192" height="170" rx="12" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.6"
        stroke-dasharray="8 6"/>
  <text x="532" y="234" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif"
        font-size="13" font-weight="600" fill="#92400E">TLS 反向代理</text>
  <text x="532" y="258" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif"
        font-size="11.5" fill="#A16207">默认只监听 localhost</text>
  <text x="532" y="280" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif"
        font-size="11.5" fill="#A16207">对外必须套一层</text>
  <text x="532" y="312" text-anchor="middle" font-family="SF Mono, Menlo, monospace" font-size="10.5"
        fill="#B45309">allow_other_hostname</text>
  <text x="532" y="330" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif"
        font-size="10.5" fill="#B45309">仅测试可用</text>

  <!-- 服务端 -->
  <g filter="url(#c3)">
    <rect x="700" y="160" width="444" height="242" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
  </g>
  <path d="M 700 174 a 14 14 0 0 1 14 -14 h 416 a 14 14 0 0 1 14 14 v 36 h -444 z" fill="#0F172A"/>
  <text x="724" y="196" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="13.5"
        font-weight="600" fill="#FDE68A">duckdb -serve</text>
  <g font-family="SF Mono, Menlo, monospace" font-size="12.5">
    <text x="724" y="246" fill="#1E293B">CALL quack_serve(</text>
    <text x="740" y="270" fill="#475569">token = 'my_token');</text>
  </g>
  <text x="724" y="306" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="11.5"
        fill="#94A3B8">同一个进程里跑引擎 + 存储，没有额外中间件</text>

  <g>
    <rect x="724" y="330" width="120" height="44" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="784" y="357" text-anchor="middle" font-family="SF Mono, Menlo, monospace" font-size="11"
          fill="#475569">events.db</text>
    <rect x="856" y="330" width="120" height="44" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="916" y="357" text-anchor="middle" font-family="SF Mono, Menlo, monospace" font-size="11"
          fill="#475569">*.parquet</text>
    <rect x="988" y="330" width="132" height="44" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="1054" y="357" text-anchor="middle" font-family="SF Mono, Menlo, monospace" font-size="11"
          fill="#475569">s3://…</text>
  </g>

  <!-- 箭头 -->
  <line x1="388" y1="240" x2="428" y2="240" stroke="#64748B" stroke-width="1.8" marker-end="url(#ar2)"/>
  <line x1="632" y1="240" x2="692" y2="240" stroke="#64748B" stroke-width="1.8" marker-end="url(#ar2)"/>
  <text x="408" y="228" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="10.5"
        fill="#64748B">SQL</text>
  <text x="662" y="228" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="10.5"
        fill="#64748B">SQL</text>

  <line x1="692" y1="304" x2="636" y2="304" stroke="#F59E0B" stroke-width="1.8" marker-end="url(#ar3)"/>
  <line x1="428" y1="304" x2="388" y2="304" stroke="#F59E0B" stroke-width="1.8" marker-end="url(#ar3)"/>
  <text x="664" y="296" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="10.5"
        fill="#B45309">结果列块</text>

  <!-- 底部 -->
  <rect x="56" y="452" width="1088" height="196" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="84" y="490" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="13"
        font-weight="700" letter-spacing="0.4" fill="#475569">quack 扩展导出的一部分函数</text>

  <g font-family="SF Mono, Menlo, monospace" font-size="11.5" fill="#334155">
    <rect x="84" y="506" width="172" height="38" rx="9" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="170" y="530" text-anchor="middle">quack_serve</text>
    <rect x="268" y="506" width="172" height="38" rx="9" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="354" y="530" text-anchor="middle">quack_query</text>
    <rect x="452" y="506" width="172" height="38" rx="9" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="538" y="530" text-anchor="middle">quack_stop</text>

    <rect x="84" y="556" width="172" height="38" rx="9" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="170" y="580" text-anchor="middle">quack_generate_keys</text>
    <rect x="268" y="556" width="172" height="38" rx="9" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="354" y="580" text-anchor="middle">quack_check_token</text>
    <rect x="452" y="556" width="172" height="38" rx="9" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="538" y="580" text-anchor="middle">quack_active_connections</text>
  </g>

  <text x="84" y="622" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="11"
        fill="#94A3B8">Quack 协议 1.5.3 引入，2.0 版本做了性能与稳定性打磨。</text>
  <rect x="660" y="490" width="456" height="136" rx="12" fill="#FEF3C7" stroke="#FCD34D"/>
  <text x="684" y="518" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="12.5"
        font-weight="700" fill="#92400E">源码里的彩蛋：AWS 扩展已经注册了</text>
  <g font-family="SF Mono, Menlo, monospace" font-size="10.5" fill="#78350F">
    <text x="684" y="542">__aws__cloudformation__quack_on_ec2__create</text>
    <text x="684" y="562">__aws__cloudformation__quack_on_ec2__destroy</text>
    <text x="684" y="582">__aws__cloudformation__quack_on_ec2__list / __status</text>
  </g>
  <text x="684" y="610" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="11"
        fill="#A16207">换句话说：起一台跑 DuckDB 2.0 的 EC2，已经可以用 SQL 触发。</text>
</svg>
