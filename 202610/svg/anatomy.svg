<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Noto Sans CJK SC, Source Han Sans SC, WenQuanYi Zen Hei, DejaVu Sans, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
    <marker id="arwG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arwO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <marker id="arwB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>

  <text x="500" y="32" font-size="23" font-weight="bold" text-anchor="middle" fill="#111827">WorkBuddy 想当 App Store,凭什么:一张解剖图</text>
  <text x="500" y="55" font-size="13" text-anchor="middle" fill="#6b7280">箭头 = 灰:常规调用　橙:厂商反哺补贴　蓝:生态供给　绿:硬件与行业采集</text>

  <!-- 用户层 -->
  <rect x="330" y="72" width="340" height="62" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="500" y="98" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">用户注意力</text>
  <text x="500" y="120" font-size="12.5" text-anchor="middle" fill="#4b5563">有限、昂贵、且对长期使用的工具极高粘性</text>

  <!-- WorkBuddy 核心 -->
  <rect x="310" y="206" width="380" height="176" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2.6"/>
  <text x="500" y="240" font-size="21" font-weight="bold" text-anchor="middle" fill="#9a3412">WorkBuddy</text>
  <text x="500" y="263" font-size="13" text-anchor="middle" fill="#7c2d12">腾讯补上的「执行」层</text>
  <line x1="340" y1="278" x2="660" y2="278" stroke="#fdba74" stroke-width="1.2"/>
  <text x="500" y="301" font-size="13" text-anchor="middle" fill="#431407">2026-06 PC 端月访问 2,097 万次</text>
  <text x="500" y="323" font-size="13" text-anchor="middle" fill="#431407">超过第二名 + 第三名之和</text>
  <text x="500" y="345" font-size="13" text-anchor="middle" fill="#431407">DAU / MAU ≈ 65%–75%</text>
  <text x="500" y="367" font-size="13" text-anchor="middle" fill="#431407">企业 SaaS 78 → 198 元/人/月</text>

  <!-- 左侧 开发者 -->
  <rect x="14" y="206" width="246" height="176" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="137" y="236" font-size="16.5" font-weight="bold" text-anchor="middle" fill="#1e3a8a">开发者与 Skill</text>
  <text x="137" y="262" font-size="12.6" text-anchor="middle" fill="#1e40af">SkillHub 近 8 万个 Skill</text>
  <text x="137" y="284" font-size="12.6" text-anchor="middle" fill="#1e40af">月下载 1,700 万+ 次</text>
  <text x="137" y="306" font-size="12.6" text-anchor="middle" fill="#1e40af">累计下载 6,000 万+ 次</text>
  <text x="137" y="332" font-size="12.6" text-anchor="middle" fill="#1e40af">开放平台共创伙伴 100+ 家</text>
  <text x="137" y="354" font-size="12.6" text-anchor="middle" fill="#64748b">生态资产 10 万+ / 安装 3,000 万+</text>

  <!-- 右侧 硬件与行业 -->
  <rect x="740" y="206" width="236" height="176" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="858" y="236" font-size="16.5" font-weight="bold" text-anchor="middle" fill="#166534">硬件与行业应用</text>
  <text x="858" y="262" font-size="12.6" text-anchor="middle" fill="#15803d">智能硬件 30+ 品牌</text>
  <text x="858" y="284" font-size="12.6" text-anchor="middle" fill="#15803d">联名首发 9 款硬件</text>
  <text x="858" y="306" font-size="12.6" text-anchor="middle" fill="#15803d">Buddy 应用 30+ / 20+ 领域</text>
  <text x="858" y="332" font-size="12.6" text-anchor="middle" fill="#15803d">落地行业 50+ 个</text>
  <text x="858" y="354" font-size="12.6" text-anchor="middle" fill="#15803d">企业 3,000+ 家 / 席位 14 万+</text>

  <!-- 模型层 -->
  <rect x="14" y="470" width="676" height="96" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="352" y="498" font-size="16.5" font-weight="bold" text-anchor="middle" fill="#92400e">模型层:开源让能力趋同,只差价格与入口</text>
  <text x="352" y="522" font-size="12.8" text-anchor="middle" fill="#a16207">混元 Hy3/Hy4　DeepSeek　GLM　Kimi　MiniMax　自定义 API</text>
  <text x="352" y="546" font-size="12.4" text-anchor="middle" fill="#a16207">反哺样本:Hy3 限免至 10-31　Hy4 夜间限免　GLM 夜猫子　DeepSeek 非高峰 5 折</text>

  <!-- 算力能源 -->
  <rect x="740" y="470" width="236" height="96" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8"/>
  <text x="858" y="498" font-size="16.5" font-weight="bold" text-anchor="middle" fill="#334155">算力与能源</text>
  <text x="858" y="522" font-size="12.6" text-anchor="middle" fill="#475569">模型成本的真实底座</text>
  <text x="858" y="546" font-size="12.6" text-anchor="middle" fill="#475569">价格战打到最后剩下的东西</text>

  <!-- 支付层 -->
  <rect x="14" y="596" width="962" height="50" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="495" y="618" font-size="16" font-weight="bold" text-anchor="middle" fill="#5b21b6">SkillPay 支付闭环已通(2026-07-16,平台暂不抽成)　+　开发者分成结算仍在建设中</text>
  <text x="495" y="638" font-size="12.6" text-anchor="middle" fill="#6d28d9">分发已建　支付已建　分配规则未建 —— App Store 的三件套还差最后一件</text>

  <!-- 上下箭头 -->
  <line x1="450" y1="134" x2="450" y2="200" stroke="#4a5568" stroke-width="2.2" marker-end="url(#arw)"/>
  <line x1="550" y1="200" x2="550" y2="134" stroke="#4a5568" stroke-width="2.2" marker-end="url(#arw)"/>
  <text x="462" y="176" font-size="12" fill="#4a5568">派活</text>
  <text x="562" y="176" font-size="12" fill="#4a5568">交付产物</text>

  <!-- 左右箭头 + 标签放在箭杆上方空白处 -->
  <text x="285" y="248" font-size="12" text-anchor="middle" fill="#2563eb">上架</text>
  <line x1="264" y1="258" x2="304" y2="258" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arwB)"/>
  <text x="285" y="320" font-size="12" text-anchor="middle" fill="#2563eb">分成</text>
  <line x1="304" y1="330" x2="264" y2="330" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arwB)"/>

  <text x="715" y="248" font-size="12" text-anchor="middle" fill="#16a34a">采集</text>
  <line x1="696" y1="258" x2="736" y2="258" stroke="#16a34a" stroke-width="2.4" marker-end="url(#arwG)"/>
  <text x="715" y="320" font-size="12" text-anchor="middle" fill="#16a34a">执行</text>
  <line x1="736" y1="330" x2="696" y2="330" stroke="#16a34a" stroke-width="2.4" marker-end="url(#arwG)"/>

  <!-- 底部箭头 -->
  <line x1="430" y1="384" x2="430" y2="470" stroke="#4a5568" stroke-width="2.2" marker-end="url(#arw)"/>
  <text x="442" y="430" font-size="12" fill="#4a5568">调用</text>
  <line x1="370" y1="470" x2="370" y2="384" stroke="#d97706" stroke-width="2.6" marker-end="url(#arwO)"/>
  <text x="196" y="430" font-size="12.5" fill="#b45309">补贴与折扣</text>

  <line x1="600" y1="384" x2="600" y2="470" stroke="#4a5568" stroke-width="2.2" marker-end="url(#arw)"/>
  <text x="612" y="430" font-size="12" fill="#4a5568">成本下沉</text>
</svg>
