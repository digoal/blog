<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- 画布背景 -->
  <rect x="0" y="0" width="960" height="620" fill="#F8FAFC"/>

  <!-- 标题区 -->
  <text x="480" y="46" text-anchor="middle" font-size="20" font-weight="bold" fill="#0F172A">跳出二元对立：未来 3–7 年智能体数据库的“三分天下”终局</text>
  <text x="480" y="70" text-anchor="middle" font-size="12.5" fill="#475569">告别初代“静态模型 + 临时文本 RAG”，三条并行赛道按合规红线、基座换代节奏与模态特性自然分叉</text>

  <!-- 顶部起点框 -->
  <rect x="230" y="86" width="500" height="38" rx="8" fill="#FFFFFF" stroke="#334155" stroke-width="1.5"/>
  <text x="480" y="110" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0F172A">共同起点：业务数据持续流转，静态 LLM 认知停在出厂瞬间</text>

  <!-- 正交分流树连线 -->
  <polyline points="480,124 480,144" fill="none" stroke="#475569" stroke-width="1.6"/>
  <polyline points="176,144 784,144" fill="none" stroke="#475569" stroke-width="1.6"/>
  <polyline points="176,144 176,162" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow-dark)"/>
  <polyline points="480,144 480,162" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow-dark)"/>
  <polyline points="784,144 784,162" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow-dark)"/>

  <!-- ==================== 左翼：零权重修改派 ==================== -->
  <rect x="34" y="166" width="284" height="422" rx="12" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.6"/>
  <rect x="34" y="166" width="284" height="8" rx="4" fill="#0284C7"/>
  <text x="176" y="198" text-anchor="middle" font-size="15" font-weight="bold" fill="#0C4A6E">左翼 · 零权重修改派</text>
  <text x="176" y="218" text-anchor="middle" font-size="12" fill="#0369A1">KV-Cache-as-a-Database</text>

  <rect x="48" y="232" width="256" height="112" rx="8" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1.2"/>
  <text x="60" y="254" font-size="12.5" font-weight="bold" fill="#0369A1">核心架构（基座只读）</text>
  <text x="60" y="276" font-size="11.5" fill="#334155">• L0 双时态真相源 + 异步图谱</text>
  <text x="60" y="296" font-size="11.5" fill="#334155">• 非前缀可拼装 KV：CacheBlend</text>
  <text x="60" y="316" font-size="11.5" fill="#334155">• 离线 KV 卡带：Cartridges</text>
  <text x="60" y="336" font-size="11.5" fill="#334155">• 全局 KV 池 + 原生稀疏注意力</text>

  <rect x="48" y="354" width="256" height="114" rx="8" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1.2"/>
  <text x="60" y="376" font-size="12.5" font-weight="bold" fill="#0369A1">降维杀手锏</text>
  <text x="60" y="398" font-size="11.5" fill="#334155">• 0 灾难性遗忘、0 自举模型坍塌</text>
  <text x="60" y="418" font-size="11.5" fill="#334155">• 天然过 MVCC / RLS / GDPR</text>
  <text x="60" y="438" font-size="11.5" fill="#334155">• 免疫基座 3–6 月换代折旧诅咒</text>
  <text x="60" y="458" font-size="11.5" fill="#334155">• 缓存命中读价享 90%–95% 折扣</text>

  <rect x="48" y="478" width="256" height="96" rx="8" fill="#E0F2FE" stroke="#7DD3FC" stroke-width="1.2"/>
  <text x="60" y="500" font-size="12.5" font-weight="bold" fill="#0C4A6E">主战场（3–5 年企业主流）</text>
  <text x="60" y="522" font-size="11.5" fill="#1E293B">企业知识库 / 代码库 / SaaS 智能体</text>
  <text x="60" y="542" font-size="11.5" fill="#475569">短板：亿级碎片深多跳与毫秒直觉</text>
  <text x="60" y="560" font-size="11.5" fill="#475569">仍受限于块拼接交叉精度与带宽</text>

  <!-- ==================== 中路：分层多速率神经可塑派 ==================== -->
  <rect x="338" y="166" width="284" height="422" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
  <rect x="338" y="166" width="284" height="8" rx="4" fill="#4F46E5"/>
  <text x="480" y="198" text-anchor="middle" font-size="15" font-weight="bold" fill="#312E81">中路 · 多速率神经可塑派</text>
  <text x="480" y="218" text-anchor="middle" font-size="12" fill="#4338CA">L0 真相源 + L1/L2/L3 分层演化</text>

  <rect x="352" y="232" width="256" height="112" rx="8" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.2"/>
  <text x="364" y="254" font-size="12.5" font-weight="bold" fill="#4338CA">四层解耦架构</text>
  <text x="364" y="276" font-size="11.5" fill="#334155">• L0：双时态事务表 / WAL / CDC</text>
  <text x="364" y="296" font-size="11.5" fill="#334155">• L1：租户隔离快状态 (TTT/Titans)</text>
  <text x="364" y="316" font-size="11.5" fill="#334155">• L2：稀疏槽 SMFT / Doc-to-LoRA</text>
  <text x="364" y="336" font-size="11.5" fill="#334155">• L3：睡眠巩固 + Shadow 门禁</text>

  <rect x="352" y="354" width="256" height="114" rx="8" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.2"/>
  <text x="364" y="376" font-size="12.5" font-weight="bold" fill="#4338CA">必须跨越的三道门槛</text>
  <text x="364" y="398" font-size="11.5" fill="#334155">• 基座换代使内化参数折旧清零</text>
  <text x="364" y="418" font-size="11.5" fill="#334155">• L3 递归自编辑诱发模型坍塌</text>
  <text x="364" y="438" font-size="11.5" fill="#334155">• 缺少跨层 EXPLAIN 归因黑盒</text>
  <text x="364" y="458" font-size="11.5" fill="#334155">• 需补齐 LSN 快照与按 Key 擦除</text>

  <rect x="352" y="478" width="256" height="96" rx="8" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.2"/>
  <text x="364" y="500" font-size="12.5" font-weight="bold" fill="#312E81">主战场（高溢价垂直突破）</text>
  <text x="364" y="522" font-size="11.5" fill="#1E293B">实时风控 / 推荐 / 超大专有沉淀</text>
  <text x="364" y="542" font-size="11.5" fill="#475569">反超拐点：基座进入长周期稳定期</text>
  <text x="364" y="560" font-size="11.5" fill="#475569">或跨模型潜空间迁移标准落地</text>

  <!-- ==================== 右翼：去事务原生演化派 ==================== -->
  <rect x="642" y="166" width="284" height="422" rx="12" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <rect x="642" y="166" width="284" height="8" rx="4" fill="#EA580C"/>
  <text x="784" y="198" text-anchor="middle" font-size="15" font-weight="bold" fill="#7C2D12">右翼 · 去事务原生演化派</text>
  <text x="784" y="218" text-anchor="middle" font-size="12" fill="#C2410C">跳过 SQL 壳的连续流快权重</text>

  <rect x="656" y="232" width="256" height="112" rx="8" fill="#FFFFFF" stroke="#FED7AA" stroke-width="1.2"/>
  <text x="668" y="254" font-size="12.5" font-weight="bold" fill="#C2410C">核心形态（直通物理流）</text>
  <text x="668" y="276" font-size="11.5" fill="#334155">• 连续高维视动张量难无损入表</text>
  <text x="668" y="296" font-size="11.5" fill="#334155">• RoboTTT：VLA 扩至 8000 步</text>
  <text x="668" y="316" font-size="11.5" fill="#334155">• WAM-TTT：看无标注视频调记忆</text>
  <text x="668" y="336" font-size="11.5" fill="#334155">• 端侧在线快权重 + 夜间插电整理</text>

  <rect x="656" y="354" width="256" height="114" rx="8" fill="#FFFFFF" stroke="#FED7AA" stroke-width="1.2"/>
  <text x="668" y="376" font-size="12.5" font-weight="bold" fill="#C2410C">为何豁免事务死刑？</text>
  <text x="668" y="398" font-size="11.5" fill="#334155">• 单主体运行，无跨租户侧信道</text>
  <text x="668" y="418" font-size="11.5" fill="#334155">• 无千连接随机 ABORT 回滚负担</text>
  <text x="668" y="438" font-size="11.5" fill="#334155">• 允许像人脑一样有损近似与遗忘</text>
  <text x="668" y="458" font-size="11.5" fill="#334155">• 随整机 OTA 升级，无历史包袱</text>

  <rect x="656" y="478" width="256" height="96" rx="8" fill="#FFEDD5" stroke="#FDBA74" stroke-width="1.2"/>
  <text x="668" y="500" font-size="12.5" font-weight="bold" fill="#7C2D12">主战场（物理世界与个人端）</text>
  <text x="668" y="522" font-size="11.5" fill="#1E293B">具身机器人 / 智驾 / 个人端侧 OS</text>
  <text x="668" y="542" font-size="11.5" fill="#475569">边界：绝不可直接套用于金融账务</text>
  <text x="668" y="560" font-size="11.5" fill="#475569">及强审计合规的多租户核心系统</text>
</svg>
