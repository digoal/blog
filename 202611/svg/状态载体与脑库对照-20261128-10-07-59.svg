<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- 画布浅色背景 -->
  <rect x="0" y="0" width="960" height="600" fill="#F8FAFC"/>

  <!-- 顶部标题区 -->
  <text x="480" y="48" text-anchor="middle" font-size="20" font-weight="bold" fill="#0F172A">拆解“权重”执念：四层状态载体与人脑多时间尺度漏斗对照</text>
  <text x="480" y="72" text-anchor="middle" font-size="12.5" fill="#475569">自上而下：更新频率由毫秒滑向天级，精确可控性递减、压缩泛化度递增</text>

  <!-- 栏位表头 -->
  <rect x="36" y="90" width="520" height="28" rx="6" fill="#E2E8F0"/>
  <text x="296" y="109" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E293B">AI 模型四层状态载体（解构笼统的“权重”）</text>

  <rect x="616" y="90" width="308" height="28" rx="6" fill="#E2E8F0"/>
  <text x="770" y="109" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E293B">人脑 20W 多时间尺度可塑性漏斗</text>

  <!-- ==================== Row 1：激活态 / KV Cache <-> STP ==================== -->
  <rect x="36" y="128" width="520" height="90" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="36" y="128" width="6" height="90" rx="3" fill="#2563EB"/>
  <text x="54" y="153" font-size="14" font-weight="bold" fill="#1E3A8A">① 激活态 / 持久化 KV Cache（毫秒·会话与块级）</text>
  <text x="54" y="177" font-size="12" fill="#334155">读写：写 O(1) / 读 O(N)  ｜  干扰半径：零串扰（独立槽位）</text>
  <text x="54" y="199" font-size="12" fill="#334155">删除：精准硬驱逐  ｜  最适：活跃上下文、可拼装文档卡带</text>

  <polyline points="556,173 614,173" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4,3" marker-start="url(#arrow-slate)" marker-end="url(#arrow-slate)"/>

  <rect x="616" y="128" width="308" height="90" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  <text x="632" y="153" font-size="13.5" font-weight="bold" fill="#0F172A">毫秒–秒级：电活动与 STP 缓冲</text>
  <text x="632" y="177" font-size="12" fill="#334155">残余钙离子短暂调增益，不改结构</text>
  <text x="632" y="199" font-size="12" fill="#334155">若无新奇或奖赏，数秒内自然衰减</text>

  <!-- ==================== Row 2：流式快权重 <-> STDP 三因子 ==================== -->
  <rect x="36" y="232" width="520" height="90" rx="10" fill="#ECFEFF" stroke="#06B6D4" stroke-width="1.5"/>
  <rect x="36" y="232" width="6" height="90" rx="3" fill="#0891B2"/>
  <text x="54" y="257" font-size="14" font-weight="bold" fill="#164E63">② 流式在线快权重 / 隐状态（秒级·租户隔离）</text>
  <text x="54" y="281" font-size="12" fill="#334155">代表：TTT / Titans / Gated DeltaNet  ｜  读写 O(1)</text>
  <text x="54" y="303" font-size="12" fill="#334155">干扰：局部子空间叠加  ｜  最适：流式分布漂移与短期规律</text>

  <polyline points="556,277 614,277" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4,3" marker-start="url(#arrow-slate)" marker-end="url(#arrow-slate)"/>

  <rect x="616" y="232" width="308" height="90" rx="10" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.5"/>
  <text x="632" y="257" font-size="13.5" font-weight="bold" fill="#134E4A">秒–分钟级：资格迹 × 三因子门控</text>
  <text x="632" y="281" font-size="12" fill="#334155">局部 STDP 需多巴胺/去甲肾上腺素放行</text>
  <text x="632" y="303" font-size="12" fill="#334155">极度挑食，把绝大部分日常噪声挡在门外</text>

  <!-- ==================== Row 3：稀疏可寻址记忆 <-> 海马体 E-LTP ==================== -->
  <rect x="36" y="336" width="520" height="90" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <rect x="36" y="336" width="6" height="90" rx="3" fill="#B45309"/>
  <text x="54" y="361" font-size="14" font-weight="bold" fill="#78350F">③ 稀疏可寻址记忆 / 模块包（准实时·按 Key 隔离）</text>
  <text x="54" y="385" font-size="12" fill="#334155">代表：Memory Layers+SMFT / Doc-to-LoRA  ｜  读写 O(k)</text>
  <text x="54" y="407" font-size="12" fill="#334155">干扰：极窄（Top-k 或独立包）  ｜  支持按槽或按包拔插遗忘</text>

  <polyline points="556,381 614,381" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4,3" marker-start="url(#arrow-slate)" marker-end="url(#arrow-slate)"/>

  <rect x="616" y="336" width="308" height="90" rx="10" fill="#FEFCE8" stroke="#CA8A04" stroke-width="1.5"/>
  <text x="632" y="361" font-size="13.5" font-weight="bold" fill="#713F12">分钟–小时级：海马体稀疏编码</text>
  <text x="632" y="385" font-size="12" fill="#334155">齿状回仅 1%–5% 激活实现模式分离</text>
  <text x="632" y="407" font-size="12" fill="#334155">清醒 SWRs 给高价值片段打标，待夜里重放</text>

  <!-- ==================== Row 4：慢权重 <-> 睡眠固化 L-LTP + SHY ==================== -->
  <rect x="36" y="440" width="520" height="90" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <rect x="36" y="440" width="6" height="90" rx="3" fill="#B91C1C"/>
  <text x="54" y="465" font-size="14" font-weight="bold" fill="#7F1D1D">④ 慢权重 / 基础参数（小时–天级·全局稠密）</text>
  <text x="54" y="489" font-size="12" fill="#334155">写 O(P)  ｜  干扰半径：全局波及（强写触发遗忘与可塑性丧失）</text>
  <text x="54" y="511" font-size="12" fill="#334155">承载：通用推理与语言骨架  ｜  只宜经异步重放缓慢巩固</text>

  <polyline points="556,485 614,485" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4,3" marker-start="url(#arrow-slate)" marker-end="url(#arrow-slate)"/>

  <rect x="616" y="440" width="308" height="90" rx="10" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.5"/>
  <text x="632" y="465" font-size="13.5" font-weight="bold" fill="#881337">小时–天级：睡眠重放 + SHY 修剪</text>
  <text x="632" y="489" font-size="12" fill="#334155">NREM 5x–20x 重放刷皮层 + REM 超联想</text>
  <text x="632" y="511" font-size="12" fill="#334155">睡后缩减约 18% 突触面积，清噪保稳</text>

  <!-- 底部核心点睛栏 -->
  <rect x="36" y="544" width="888" height="32" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="480" y="564" text-anchor="middle" font-size="12" fill="#1E293B">核心症结：过去“实时调权”走不通，是硬逼第 ④ 层全局慢权重干 ①/③ 层的活；且脑巩固属有损抽象，不等同数据库无损归并。</text>
</svg>
